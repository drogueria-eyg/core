<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendientes de reposición · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<style>
  :root{ --green:#1E7D46; --greenbg:#E4F5E9; --org:#C4602A; --orgbg:#FBE3D4; --yel:#B7791F; --yelbg:#FBF3D9; --red:#8A1F1C; --redbg:#F7D2D0; }
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--teal-deep);font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:9px}
  h2.sec:before{content:"";width:5px;height:16px;background:var(--teal);border-radius:3px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:14px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow)}
  .kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:700;margin-bottom:5px}
  .kpi .n{font-size:24px;font-weight:800;line-height:1.1}
  .kpi.red .n{color:var(--red)}.kpi.yel .n{color:var(--yel)}.kpi.green .n{color:var(--green)}.kpi.teal .n{color:var(--teal-deep)}
  .toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}
  .chip{font-size:12.5px;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;color:var(--gris)}
  .chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
  .search input{border:0;background:none;outline:none;font-family:inherit;font-size:14px;width:100%;color:var(--ink)}
  .search svg{width:17px;height:17px;color:var(--gris2);flex-shrink:0}
  .mini-btn{font-family:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;color:var(--ink);cursor:pointer;font-weight:600}
  .mini-btn:hover{border-color:var(--teal)} .mini-btn.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
  .mini-btn.grn{background:var(--green);color:#fff;border-color:var(--green)} .mini-btn.gold{background:var(--yel);color:#fff;border-color:var(--yel)}
  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
  .pcard.empty{text-align:center;color:var(--gris);padding:40px}
  .ordcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
  .ordcard.abierta{border-left:4px solid var(--teal)}
  .oh{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
  .oh:hover{background:#F7FBFA}
  .oh .nm{flex:1;min-width:0}.oh .nm b{font-size:15px;display:block;overflow-wrap:anywhere;line-height:1.25}.oh .nm span{font-size:12px;color:var(--gris)}
  .oh .tot{text-align:right;flex:none}.oh .tot b{font-size:20px;font-weight:800;color:var(--teal-deep)}.oh .tot span{display:block;font-size:10.5px;color:var(--gris);text-transform:uppercase;letter-spacing:.5px}
  .oh .cv{font-size:19px;color:var(--gris2);font-weight:800;width:18px;text-align:center}
  .obody{border-top:1px solid var(--line);background:#FAFDFC;padding:12px 16px 14px}
  .lin{display:grid;grid-template-columns:1.4fr 1.6fr .7fr 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .lin:last-child{border-bottom:0}
  .lin .who b{font-size:13.5px}.lin .cli{color:var(--gris)}.lin .qt{font-weight:800;text-align:right;color:var(--teal-deep)}.lin .cu{font-size:11.5px;color:var(--gris2);text-align:right}
  .lhead{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:6px}
  .recibir{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:11px 13px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
  .recibir label{font-size:12px;font-weight:800;color:var(--teal-deep)}
  .recibir input{width:100px;font-size:16px;font-weight:700;padding:8px;border:1px solid var(--line);border-radius:8px;text-align:right}
  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .badge{font-size:10.5px;font-weight:800;border-radius:99px;padding:3px 9px;white-space:nowrap;display:inline-block}
  .b-abierta{background:#E6F3F1;color:var(--teal-deep)} .b-aceptada{background:var(--yelbg);color:var(--yel)}
  .b-en_compra{background:var(--orgbg);color:var(--org)} .b-repuesta{background:var(--greenbg);color:var(--green)}
  .b-entregada{background:#EEF2F1;color:var(--gris)} .b-cancelada{background:#EEF2F1;color:var(--gris)}
  .bita{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .bita .t{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:800;margin-bottom:6px}
  .bita .e{font-size:12px;color:var(--gris);padding:2px 0}.bita .e b{color:var(--ink)}
  .avisorep{background:var(--greenbg);border:1px solid #BFE0DC;border-left:4px solid var(--green);border-radius:10px;padding:10px 13px;font-size:13px;color:#155C33;margin-bottom:12px}.avisorep b{color:var(--green)}
  .avisoabr{background:#E6F3F1;border:1px solid #BFE0DC;border-left:4px solid var(--teal);border-radius:10px;padding:10px 13px;font-size:13px;color:#245C57;margin-bottom:12px}.avisoabr b{color:var(--teal-deep)}
  .cerrada{opacity:.75}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite;margin:60px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .count-line{font-size:13px;color:var(--gris);margin:2px 0 10px}.count-line b{color:var(--ink)}
  .ov{position:fixed;inset:0;background:rgba(6,65,62,.42);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}.ov.on{display:flex}
  .modbox{background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(6,65,62,.3);padding:22px;width:380px;max-width:96vw}
  .modbox h3{font-size:18px;font-weight:800;color:var(--teal-deep)}
  .modbox label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);margin:12px 0 4px}
  .modbox input{width:100%;font-family:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink)}
  .modbox .mb{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=51"></script>
<script>
const esc=s=>(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const nf=n=>Math.round(n||0).toLocaleString("es-AR");
function toast(m){ let t=document.getElementById("toast"); if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);} t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2600); }
function fdt(ts){ try{ return new Date(ts).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
const EST_LBL={abierta:"Abierta — se puede sumar",aceptada:"Aceptada",en_compra:"En compra",repuesta:"Repuesta",entregada:"Entregada",cancelada:"Cancelada"};
const ACC_LBL={crear:"abrió la orden",agregar:"sumó unidades",editar_recibir:"editó la cantidad a recibir",editar_producto:"cambió el producto que va a ingresar",aceptar:"aceptó la orden",en_compra:"pasó a en compra",repuesta:"marcó repuesta",entregada:"marcó entregada",cancelada:"canceló"};
const cerrada=o=>o.estado!=="abierta";

let PERFIL=null, GESTION=false, MIREF="", MIEMAIL="";
let ORD=[], BYID=new Map();
let F={estado:"abiertas", q:"", abiertos:new Set()};

EYG.requireAuth(["direccion","finanzas","inventario","comercial","lider","admin","maestro"], perfil=>{
  PERFIL=perfil;
  GESTION = EYG.esSuper(perfil._h) || ["direccion","finanzas","inventario","admin","lider"].includes(perfil.rol);
  MIREF = perfil.comercial_ref || perfil.nombre || ""; MIEMAIL=perfil.email||"";
  document.body.innerHTML=EYG.layout(perfil,"pendientes",
    `<h2 class="sec">📋 Pendientes de reposición <span style="margin-left:auto"><button class="mini-btn" onclick="cargar()">🔄 Actualizar</button></span></h2>
     <div id="cap"><div class="spin"></div></div><div class="ov" id="ov"></div>`,
    "Pendientes de reposición");
  cargar();
});

async function cargar(){
  const cap=document.getElementById("cap"); cap.innerHTML='<div class="spin"></div>';
  try{
    const [o,l,g]=await Promise.all([
      EYG.supa().from("reposicion_orden").select("*").order("ts",{ascending:false}).limit(2000),
      EYG.supa().from("reposicion_linea").select("*").order("ts",{ascending:true}).limit(8000),
      EYG.supa().from("reposicion_log").select("*").order("ts",{ascending:true}).limit(8000)
    ]);
    if(o.error) throw o.error;
    ORD=o.data||[]; BYID=new Map();
    ORD.forEach(x=>{ x.lineas=[]; x.logs=[]; x.total=0; BYID.set(x.id,x); });
    (l.data||[]).forEach(x=>{ const o=BYID.get(x.orden_id); if(o){ o.lineas.push(x); o.total+=(x.cantidad||0); } });
    (g.data||[]).forEach(x=>{ const o=BYID.get(x.orden_id); if(o) o.logs.push(x); });
    render();
  }catch(e){ cap.innerHTML='<div class="pcard empty">No se pudo cargar: '+esc(e.message||String(e))+'<br><br><button class="mini-btn pri" onclick="cargar()">Reintentar</button></div>'; }
}

function miLinea(o){ return o.lineas.some(l=>(l.comercial===MIREF)||(l.comercial_email&&l.comercial_email===MIEMAIL)); }
function render(){ document.getElementById("cap").innerHTML = GESTION ? viewGestion() : viewComercial(); const pq=document.getElementById("pq"); if(pq) pq.oninput=EYG.debounce(e=>{F.q=e.target.value; render();},250); }

/* ================= GESTIÓN (Dirección + Compras) ================= */
function viewGestion(){
  const c={abierta:0,aceptada:0,en_compra:0,repuesta:0};
  ORD.forEach(o=>{ if(c[o.estado]!=null)c[o.estado]++; });
  const kpis=`<div class="kpis">
    <div class="kpi teal"><div class="l">📥 Abiertas</div><div class="n">${c.abierta}</div></div>
    <div class="kpi yel"><div class="l">✔ Aceptadas</div><div class="n">${c.aceptada}</div></div>
    <div class="kpi red"><div class="l">🛒 En compra</div><div class="n">${c.en_compra}</div></div>
    <div class="kpi green"><div class="l">✅ Repuestas</div><div class="n">${c.repuesta}</div></div></div>`;
  const chips=[["abiertas","📥 Abiertas"],["aceptada","✔ Aceptadas"],["en_compra","🛒 En compra"],["repuesta","✅ Repuestas"],["entregada","Entregadas"],["cancelada","Canceladas"],["todas","Todas"]];
  const bar=`<div class="toolbar">${chips.map(([k,l])=>`<button class="chip ${F.estado===k?'on':''}" onclick="setF('${k}')">${l}</button>`).join("")}
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg><input id="pq" placeholder="Buscar producto…" value="${esc(F.q)}"></div></div>`;
  let arr = F.estado==="todas"?ORD.slice() : F.estado==="abiertas"?ORD.filter(o=>o.estado==="abierta") : ORD.filter(o=>o.estado===F.estado);
  const q=F.q.toLowerCase(); if(q) arr=arr.filter(o=>(o.producto_nombre||"").toLowerCase().includes(q)||(o.producto_codigo||"").toLowerCase().includes(q));
  arr.sort((a,b)=>b.total-a.total);
  const cards = arr.length ? arr.map(cardGestion).join("") : '<div class="pcard empty">No hay órdenes en este estado.</div>';
  return kpis+bar+`<div class="count-line"><b>${arr.length}</b> orden${arr.length===1?"":"es"}. Tocá para ver quién pidió y editar la cantidad a recibir.</div>`+cards;
}
function cardGestion(o){
  const ab=F.abiertos.has(o.id);
  return `<div class="ordcard ${o.estado==='abierta'?'abierta':''}">
    <div class="oh" onclick="tog(${o.id})">
      <div class="nm"><b>${esc(o.producto_nombre||"—")}</b><span>${esc(o.producto_codigo||"")} · ${o.lineas.length} comercial${o.lineas.length===1?"":"es"} · abrió ${esc(o.creada_por||"—")} el ${fdt(o.ts)}</span></div>
      <div class="tot"><b>${nf(o.cantidad_recibir!=null?o.cantidad_recibir:o.total)}</b><span>${o.cantidad_recibir!=null?"a recibir":"pedido"}</span></div>
      <span class="badge b-${o.estado}">${EST_LBL[o.estado]||o.estado}</span>
      <div class="cv">${ab?"▾":"▸"}</div>
    </div>
    ${ab?obodyGestion(o):""}
  </div>`;
}
function obodyGestion(o){
  const lineas=`<div class="lin lhead"><div>Comercial</div><div>Cliente</div><div style="text-align:right">Cant.</div><div style="text-align:right">Cuándo</div></div>`+
    o.lineas.map(l=>`<div class="lin"><div class="who"><b>${esc(l.comercial||"—")}</b></div><div class="cli">${esc(l.cliente_nombre||"—")}${l.nota?` · <i>${esc(l.nota)}</i>`:""}</div><div class="qt">${nf(l.cantidad)}</div><div class="cu">${fdt(l.ts)}</div></div>`).join("");
  const recibir = o.estado!=="cancelada" ? `<div class="recibir"><label>Cantidad a recibir</label>
      <input id="rec-${o.id}" type="number" min="0" value="${o.cantidad_recibir!=null?o.cantidad_recibir:o.total}">
      <button class="mini-btn pri" onclick="editarRecibir(${o.id})">Guardar</button>
      <span style="font-size:12px;color:var(--gris)">Pedido por los comerciales: <b>${nf(o.total)}</b></span></div>` : "";
  const acts=[];
  if(o.estado!=="cancelada"&&o.estado!=="entregada") acts.push(`<button class="mini-btn" onclick="editarProducto(${o.id})">✏️ Editar producto (otra marca)</button>`);
  if(o.estado==="abierta") acts.push(`<button class="mini-btn grn" onclick="aceptar(${o.id})">✔ Aceptar (cierra el agregado)</button>`);
  if(o.estado==="aceptada") acts.push(`<button class="mini-btn gold" onclick="setEstado(${o.id},'en_compra')">🛒 En compra</button>`);
  if(o.estado==="aceptada"||o.estado==="en_compra") acts.push(`<button class="mini-btn grn" onclick="setEstado(${o.id},'repuesta')">✅ Repuesta</button>`);
  if(o.estado==="repuesta") acts.push(`<button class="mini-btn" onclick="setEstado(${o.id},'entregada')">📦 Entregada</button>`);
  if(o.estado!=="cancelada"&&o.estado!=="entregada") acts.push(`<button class="mini-btn" onclick="setEstado(${o.id},'cancelada')">Cancelar</button>`);
  return `<div class="obody">
    ${lineas}
    ${recibir}
    <div class="acts">${acts.join("")}</div>
    ${bitacora(o)}
  </div>`;
}
function bitacora(o){
  if(!o.logs.length) return "";
  return `<div class="bita"><div class="t">🕘 Historial</div>${o.logs.slice().reverse().map(e=>`<div class="e"><b>${esc(e.por||"—")}</b> ${esc(ACC_LBL[e.accion]||e.accion)}${e.detalle?` (${esc(e.detalle)})`:""} · ${fdt(e.ts)}</div>`).join("")}</div>`;
}

/* ================= COMERCIAL (ve abiertas + lo suyo) ================= */
function viewComercial(){
  const abiertas=ORD.filter(o=>o.estado==="abierta");
  const mias=ORD.filter(o=>miLinea(o));
  const misRep=mias.filter(o=>o.estado==="repuesta");
  const aviso = misRep.length? `<div class="avisorep">✅ <b>${misRep.length} de tus pedidos ya está${misRep.length===1?"":"n"} repuesto${misRep.length===1?"":"s"}</b> — ya hay stock, cerrá la venta con el cliente.</div>`:"";
  const abr = abiertas.length? `<div class="avisoabr">🔔 <b>${abiertas.length} orden${abiertas.length===1?"":"es"} de reposición abierta${abiertas.length===1?"":"s"}</b> — si necesitás alguno de estos productos para un cliente, sumá tus unidades.</div>`:"";
  const secAbr = `<h2 class="sec">🔔 Órdenes abiertas — podés sumar</h2>` + (abiertas.length? abiertas.sort((a,b)=>new Date(b.ts)-new Date(a.ts)).map(cardComAbierta).join("") : '<div class="pcard empty">No hay órdenes abiertas ahora.</div>');
  const secMias = `<h2 class="sec">Mis pedidos</h2>` + (mias.length? mias.sort((a,b)=>new Date(b.ts)-new Date(a.ts)).map(cardComMio).join("") : '<div class="pcard empty">Todavía no pediste reponer nada. Se carga al vender, cuando un producto no tiene stock.</div>');
  return aviso+abr+secAbr+secMias;
}
function cardComAbierta(o){
  const mia=o.lineas.filter(l=>l.comercial===MIREF||l.comercial_email===MIEMAIL).reduce((a,l)=>a+(l.cantidad||0),0);
  return `<div class="ordcard abierta">
    <div class="oh" style="cursor:default">
      <div class="nm"><b>${esc(o.producto_nombre||"—")}</b><span>${esc(o.producto_codigo||"")} · la abrió ${esc(o.creada_por||"—")} el ${fdt(o.ts)} · pedido total ${nf(o.total)}${mia?` · vos ${nf(mia)}`:""}</span></div>
      <button class="mini-btn pri" onclick="abrirAgregar(${o.id})">＋ Sumar mis unidades</button>
    </div></div>`;
}
function cardComMio(o){
  const mias=o.lineas.filter(l=>l.comercial===MIREF||l.comercial_email===MIEMAIL);
  const total=mias.reduce((a,l)=>a+(l.cantidad||0),0);
  const puede = o.estado==="abierta";
  return `<div class="ordcard ${cerrada(o)?'cerrada':''} ${o.estado==='abierta'?'abierta':''}">
    <div class="oh" style="cursor:default">
      <div class="nm"><b>${esc(o.producto_nombre||"—")}</b><span>${mias.map(l=>`${esc(l.cliente_nombre||"—")}: ${nf(l.cantidad)}`).join(" · ")}</span></div>
      <div class="tot"><b>${nf(total)}</b><span>tus unid.</span></div>
      <span class="badge b-${o.estado}">${EST_LBL[o.estado]||o.estado}</span>
    </div>
    ${puede||o.estado==="repuesta"?`<div class="obody"><div class="acts">
      ${puede?`<button class="mini-btn pri" onclick="abrirAgregar(${o.id})">＋ Sumar más</button>`:""}
    </div></div>`:""}
  </div>`;
}

/* ================= acciones ================= */
function setF(k){ F.estado=k; render(); }
function tog(id){ if(F.abiertos.has(id))F.abiertos.delete(id); else F.abiertos.add(id); render(); }
function cerrarOv(){ const ov=document.getElementById("ov"); ov.classList.remove("on"); ov.innerHTML=""; }
async function _log(orden_id,accion,detalle){ try{ await EYG.supa().from("reposicion_log").insert([{orden_id,accion,por:(GESTION?(PERFIL.nombre||PERFIL.email):MIREF),por_email:MIEMAIL,detalle:detalle||null}]); }catch(e){} }
async function _touch(orden_id){ try{ await EYG.supa().from("reposicion_orden").update({ult_mod_por:(GESTION?(PERFIL.nombre||PERFIL.email):MIREF),ult_mod_ts:new Date().toISOString()}).eq("id",orden_id); }catch(e){} }

// comercial: sumar unidades a una orden abierta
function abrirAgregar(id){
  const o=BYID.get(id); if(!o) return;
  if(o.estado!=="abierta"){ toast("Esa orden ya fue aceptada, no se puede sumar"); return; }
  const ov=document.getElementById("ov");
  ov.innerHTML=`<div class="modbox"><h3>＋ Sumar unidades</h3>
    <p style="font-size:13px;color:var(--gris);margin:4px 0 6px">${esc(o.producto_nombre||"")}</p>
    <label>Cliente que lo necesita</label><input id="ag-cli" placeholder="Nombre del cliente">
    <label>Cantidad</label><input id="ag-cant" type="number" min="1" value="1">
    <label>Nota (opcional)</label><input id="ag-nota" placeholder="ej: urgente">
    <div class="mb"><button class="mini-btn" onclick="cerrarOv()">Cancelar</button><button class="mini-btn pri" onclick="guardarAgregar(${id})">Sumar</button></div></div>`;
  ov.classList.add("on"); setTimeout(()=>{const c=document.getElementById("ag-cli");if(c)c.focus();},30);
}
async function guardarAgregar(id){
  const o=BYID.get(id); if(!o||o.estado!=="abierta"){ cerrarOv(); toast("La orden ya está cerrada"); return; }
  const cli=(document.getElementById("ag-cli").value||"").trim();
  const cant=parseInt((document.getElementById("ag-cant").value||"0"),10);
  const nota=(document.getElementById("ag-nota").value||"").trim();
  if(!(cant>0)){ toast("Poné una cantidad"); return; }
  try{
    const {error}=await EYG.supa().from("reposicion_linea").insert([{orden_id:id,comercial:MIREF,comercial_email:MIEMAIL,cliente_nombre:cli||null,cantidad:cant,nota:nota||null}]);
    if(error) throw error;
    await _log(id,"agregar",`${nf(cant)} u${cli?` para ${cli}`:""}`); await _touch(id);
    cerrarOv(); toast("✓ Sumaste "+nf(cant)+" unidades"); await cargar();
  }catch(e){ alert("No se pudo sumar: "+(e.message||e)); }
}
// gestión (Germán/Diego): editar el PRODUCTO que va a ingresar (ej: se compró otra marca) y
// avisar a los comerciales que lo pidieron, así saben qué producto/marca llega para el cliente.
function editarProducto(id){
  const o=BYID.get(id); if(!o) return;
  const nCom=(o.lineas||[]).length;
  const ov=document.getElementById("ov");
  ov.innerHTML=`<div class="modbox"><h3>✏️ Editar producto a ingresar</h3>
    <p style="font-size:13px;color:var(--gris);margin:4px 0 6px">Si vas a comprar <b>otra marca o presentación</b>, cambialo acá. Se avisa a ${nCom===1?"el comercial":`los ${nCom} comerciales`} que lo pidi${nCom===1?"ó":"eron"} para que sepan qué va a ingresar.</p>
    <label>Producto que va a ingresar</label><input id="ep-nom" value="${esc(o.producto_nombre||"")}">
    <label>Código (opcional)</label><input id="ep-cod" value="${esc(o.producto_codigo||"")}">
    <label>Motivo del cambio (opcional)</label><input id="ep-mot" placeholder="ej: se compró otra marca">
    <div class="mb"><button class="mini-btn" onclick="cerrarOv()">Cancelar</button><button class="mini-btn pri" onclick="guardarEditarProducto(${id})">Guardar y avisar</button></div></div>`;
  ov.classList.add("on"); setTimeout(()=>{const c=document.getElementById("ep-nom");if(c){c.focus();c.select();}},30);
}
async function guardarEditarProducto(id){
  const o=BYID.get(id); if(!o) return;
  const nuevo=(document.getElementById("ep-nom").value||"").trim();
  const cod=(document.getElementById("ep-cod").value||"").trim();
  const mot=(document.getElementById("ep-mot").value||"").trim();
  if(!nuevo){ toast("Poné el nombre del producto"); return; }
  const viejo=o.producto_nombre||"";
  if(nuevo===viejo && cod===(o.producto_codigo||"")){ cerrarOv(); toast("No cambiaste nada"); return; }
  try{
    const {error}=await EYG.supa().from("reposicion_orden").update({producto_nombre:nuevo, producto_codigo:cod||null, ult_mod_por:(PERFIL.nombre||PERFIL.email), ult_mod_ts:new Date().toISOString()}).eq("id",id);
    if(error) throw error;
    await _log(id,"editar_producto", `de "${viejo}" a "${nuevo}"${mot?` · ${mot}`:""}`);
    // AVISO a los comerciales que pidieron este producto (por su campanita, dirigido por email)
    try{
      const emails=[...new Set((o.lineas||[]).map(l=>l.comercial_email).filter(Boolean))];
      if(emails.length && EYG.comsLeer && EYG.comsGuardar){
        const arr=await EYG.comsLeer();
        arr.push({ id:"repoedit-"+id+"-"+Date.now(), clase:"novedad", activo:true,
          alcance:"personas", personas:emails,
          titulo:"📦 Reposición: cambió el producto que va a ingresar",
          cuerpo:`Tu pedido de reposición de "${viejo}" se va a reponer con "${nuevo}"${mot?` (${mot})`:""}. Avisale al cliente qué producto/marca llega.`,
          autor:(PERFIL.nombre||PERFIL.email), ts:new Date().toISOString(),
          hasta:new Date(Date.now()+14*86400000).toISOString().slice(0,10),
          link:"inventario/pendientes.html", linkLabel:"Ver pendientes →", leidoPor:[] });
        await EYG.comsGuardar(arr);
      }
    }catch(e){}
    cerrarOv(); toast("✓ Producto actualizado — se avisó a los comerciales"); await cargar();
  }catch(e){ alert("No se pudo guardar: "+(e.message||e)); }
}
// gestión: editar cantidad a recibir
async function editarRecibir(id){
  const v=parseFloat((document.getElementById("rec-"+id).value||"").replace(",","."));
  if(isNaN(v)||v<0){ toast("Cantidad inválida"); return; }
  try{
    const {error}=await EYG.supa().from("reposicion_orden").update({cantidad_recibir:v,ult_mod_por:(PERFIL.nombre||PERFIL.email),ult_mod_ts:new Date().toISOString()}).eq("id",id);
    if(error) throw error;
    await _log(id,"editar_recibir",nf(v)+" u"); toast("✓ Cantidad a recibir: "+nf(v)); await cargar();
  }catch(e){ alert("No se pudo guardar: "+(e.message||e)); }
}
async function aceptar(id){
  if(!confirm("Aceptar la orden cierra el agregado: los comerciales ya no van a poder sumar más. ¿Confirmás?")) return;
  try{
    const {error}=await EYG.supa().from("reposicion_orden").update({estado:"aceptada",aceptada_por:(PERFIL.nombre||PERFIL.email),aceptada_ts:new Date().toISOString()}).eq("id",id);
    if(error) throw error;
    await _log(id,"aceptar"); toast("✓ Orden aceptada"); await cargar();
  }catch(e){ alert("No se pudo aceptar: "+(e.message||e)); }
}
async function setEstado(id,estado){
  if(estado==="cancelada" && !confirm("¿Cancelar esta orden de reposición?")) return;
  try{
    const {error}=await EYG.supa().from("reposicion_orden").update({estado}).eq("id",id);
    if(error) throw error;
    await _log(id,estado); toast("✓ "+(EST_LBL[estado]||estado)); await cargar();
  }catch(e){ alert("No se pudo actualizar: "+(e.message||e)); }
}
</script>
