<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendientes de reposición · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<style>
  :root{ --green:#1E7D46; --greenbg:#E4F5E9; --org:#C4602A; --orgbg:#FBE3D4; --yel:#B7791F; --yelbg:#FBF3D9; --red:#8A1F1C; --redbg:#F7D2D0; }
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--teal-deep);font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:9px}
  h2.sec:before{content:"";width:5px;height:16px;background:var(--teal);border-radius:3px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:14px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow)}
  .kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:700;margin-bottom:5px}
  .kpi .n{font-size:24px;font-weight:800;line-height:1.1}
  .kpi.red .n{color:var(--red)}.kpi.yel .n{color:var(--yel)}.kpi.green .n{color:var(--green)}
  .toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}
  .chip{font-size:12.5px;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;color:var(--gris)}
  .chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
  .search input{border:0;background:none;outline:none;font-family:inherit;font-size:14px;width:100%;color:var(--ink)}
  .search svg{width:17px;height:17px;color:var(--gris2);flex-shrink:0}
  .mini-btn{font-family:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;color:var(--ink);cursor:pointer;font-weight:600}
  .mini-btn:hover{border-color:var(--teal)} .mini-btn.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
  .mini-btn.grn{background:var(--green);color:#fff;border-color:var(--green)} .mini-btn.gold{background:var(--yel);color:#fff;border-color:var(--yel)}
  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
  .pcard.empty{text-align:center;color:var(--gris);padding:44px}
  .prodcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
  .ph{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
  .ph:hover{background:#F7FBFA}
  .ph .nm{flex:1;min-width:0}.ph .nm b{font-size:15px;display:block;overflow-wrap:anywhere;line-height:1.25}.ph .nm span{font-size:12px;color:var(--gris)}
  .ph .tot{text-align:right;flex:none}.ph .tot b{font-size:20px;font-weight:800;color:var(--red)}.ph .tot span{display:block;font-size:10.5px;color:var(--gris);text-transform:uppercase;letter-spacing:.5px}
  .ph .cv{font-size:19px;color:var(--gris2);font-weight:800;width:18px;text-align:center}
  .plist{border-top:1px solid var(--line);background:#FAFDFC;padding:6px 12px 12px}
  .prow{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-top:8px}
  .prow-h{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .prow .cli{flex:1;min-width:180px}.prow .cli b{font-size:14px}.prow .cli span{display:block;font-size:11.5px;color:var(--gris);margin-top:2px}
  .prow .qt{font-size:19px;font-weight:800;color:var(--teal-deep);white-space:nowrap}
  .prow .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;width:100%}
  .badge{font-size:10.5px;font-weight:800;border-radius:99px;padding:3px 9px;white-space:nowrap;display:inline-block}
  .b-pendiente{background:var(--redbg);color:var(--red)} .b-en_compra{background:var(--yelbg);color:var(--yel)}
  .b-repuesto{background:var(--greenbg);color:var(--green)} .b-entregado{background:#EEF2F1;color:var(--gris)} .b-cancelado{background:#EEF2F1;color:var(--gris)}
  .nota{font-size:12px;color:var(--gris);margin-top:6px;font-style:italic}
  .avisorep{background:var(--greenbg);border:1px solid #BFE0DC;border-left:4px solid var(--green);border-radius:10px;padding:10px 13px;font-size:13px;color:#155C33;margin-bottom:12px}
  .avisorep b{color:var(--green)}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite;margin:60px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .count-line{font-size:13px;color:var(--gris);margin:2px 0 10px}.count-line b{color:var(--ink)}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=36"></script>
<script>
const esc=s=>(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const nf=n=>Math.round(n||0).toLocaleString("es-AR");
function toast(m){ let t=document.getElementById("toast"); if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);} t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2600); }
function fmtTs(ts){ try{ return new Date(ts).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit"}); }catch(e){ return ""; } }
const EST_LBL={pendiente:"Pendiente",en_compra:"En compra",repuesto:"Repuesto — avisá al comercial",entregado:"Entregado",cancelado:"Cancelado"};

let PERFIL=null, GESTION=false, MIREF=null, ROWS=[];
let F={estado:"activos", q:"", abiertos:new Set()};

EYG.requireAuth(["direccion","finanzas","inventario","comercial","lider","admin","maestro"], perfil=>{
  PERFIL=perfil;
  GESTION = EYG.esSuper(perfil._h) || ["direccion","finanzas","inventario","admin","lider"].includes(perfil.rol);
  MIREF = perfil.comercial_ref || perfil.nombre || "";
  document.body.innerHTML=EYG.layout(perfil,"pendientes",
    `<h2 class="sec">📋 Pendientes de reposición <span style="margin-left:auto"><button class="mini-btn" onclick="cargar()">🔄 Actualizar</button></span></h2>
     <div id="cap"><div class="spin"></div></div>`,
    "Pendientes de reposición");
  cargar();
});

async function cargar(){
  const cap=document.getElementById("cap"); cap.innerHTML='<div class="spin"></div>';
  try{
    let qy=EYG.supa().from("pendientes_reposicion").select("*").order("ts",{ascending:false}).limit(3000);
    if(!GESTION) qy=qy.eq("comercial", MIREF);
    const {data,error}=await qy;
    if(error) throw error;
    ROWS=data||[];
    render();
  }catch(e){ cap.innerHTML='<div class="pcard empty">No se pudo cargar: '+esc(e.message||String(e))+'<br><br><button class="mini-btn pri" onclick="cargar()">Reintentar</button></div>'; }
}

function activos(){ return ROWS.filter(r=>r.estado!=="entregado"&&r.estado!=="cancelado"); }
function porEstado(e){ return ROWS.filter(r=>r.estado===e); }

function render(){
  const cap=document.getElementById("cap");
  const cnt={ pendiente:porEstado("pendiente").length, en_compra:porEstado("en_compra").length, repuesto:porEstado("repuesto").length };
  const kpis = GESTION ? `<div class="kpis">
      <div class="kpi red"><div class="l">🔴 Pendientes</div><div class="n">${cnt.pendiente}</div></div>
      <div class="kpi yel"><div class="l">🛒 En compra</div><div class="n">${cnt.en_compra}</div></div>
      <div class="kpi green"><div class="l">✅ Repuestos (avisar)</div><div class="n">${cnt.repuesto}</div></div>
    </div>` : "";
  // aviso para el comercial: sus repuestos listos para cerrar la venta
  const misRep = !GESTION ? porEstado("repuesto") : [];
  const aviso = misRep.length ? `<div class="avisorep">✅ <b>${misRep.length} producto${misRep.length===1?"":"s"} ya repuesto${misRep.length===1?"":"s"}</b> — ya hay stock, cerrá la venta con el cliente y marcá <b>Entregado</b> cuando lo despaches.</div>` : "";

  const chips=[["activos","Activos"],["pendiente","🔴 Pendientes"],["en_compra","🛒 En compra"],["repuesto","✅ Repuestos"],["entregado","Entregados"],["cancelado","Cancelados"]];
  const toolbar=`<div class="toolbar">
      ${chips.map(([k,l])=>`<button class="chip ${F.estado===k?'on':''}" onclick="setF('${k}')">${l}</button>`).join("")}
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg><input id="pq" placeholder="Buscar producto o cliente…" value="${esc(F.q)}"></div>
    </div>`;

  cap.innerHTML = kpis + aviso + toolbar + '<div id="pbody">'+ (GESTION?bodyGestion():bodyComercial()) +'</div>';
  const pq=document.getElementById("pq"); if(pq) pq.oninput=EYG.debounce(e=>{ F.q=e.target.value; document.getElementById("pbody").innerHTML=GESTION?bodyGestion():bodyComercial(); },250);
}
function setF(k){ F.estado=k; render(); }

function filtrar(){
  const q=F.q.toLowerCase();
  let arr = F.estado==="activos" ? activos() : porEstado(F.estado);
  if(q) arr=arr.filter(r=>(r.producto_nombre||"").toLowerCase().includes(q)||(r.producto_codigo||"").toLowerCase().includes(q)||(r.cliente_nombre||"").toLowerCase().includes(q));
  return arr;
}

// ---- Vista GESTIÓN: agrupada por producto ----
function bodyGestion(){
  const arr=filtrar();
  if(!arr.length) return '<div class="pcard empty">No hay pendientes en este estado.</div>';
  const byP=new Map();
  for(const r of arr){ const k=r.producto_id||("x"+r.producto_nombre); if(!byP.has(k)) byP.set(k,{nombre:r.producto_nombre,codigo:r.producto_codigo,rows:[],tot:0}); const o=byP.get(k); o.rows.push(r); o.tot+=(r.cantidad||0); }
  const grupos=[...byP.values()].sort((a,b)=>b.tot-a.tot);
  const cards=grupos.map((g,i)=>{
    const id="g"+i; const ab=F.abiertos.has(id);
    const filas=g.rows.sort((a,b)=>new Date(a.ts)-new Date(b.ts)).map(rowGestion).join("");
    return `<div class="prodcard">
      <div class="ph" onclick="tog('${id}')">
        <div class="nm"><b>${esc(g.nombre||"—")}</b><span>${esc(g.codigo||"")} · ${g.rows.length} cliente${g.rows.length===1?"":"s"}</span></div>
        <div class="tot"><b>${nf(g.tot)}</b><span>a reponer</span></div>
        <div class="cv">${ab?"▾":"▸"}</div>
      </div>
      ${ab?`<div class="plist">${filas}</div>`:""}
    </div>`;
  }).join("");
  return `<div class="count-line"><b>${arr.length}</b> pendiente${arr.length===1?"":"s"} en <b>${grupos.length}</b> producto${grupos.length===1?"":"s"}. Tocá un producto para ver los clientes.</div>${cards}`;
}
function rowGestion(r){
  const acts=[];
  if(r.estado==="pendiente") acts.push(`<button class="mini-btn gold" onclick="setEstado(${r.id},'en_compra')">🛒 En compra</button>`);
  if(r.estado==="pendiente"||r.estado==="en_compra") acts.push(`<button class="mini-btn grn" onclick="setEstado(${r.id},'repuesto')">✅ Repuesto</button>`);
  if(r.estado==="repuesto") acts.push(`<button class="mini-btn" onclick="setEstado(${r.id},'entregado')">📦 Entregado</button>`);
  if(r.estado!=="cancelado"&&r.estado!=="entregado") acts.push(`<button class="mini-btn" onclick="setEstado(${r.id},'cancelado')">Cancelar</button>`);
  if(r.estado==="entregado"||r.estado==="cancelado") acts.push(`<button class="mini-btn" onclick="setEstado(${r.id},'pendiente')">↩ Reabrir</button>`);
  return `<div class="prow">
    <div class="prow-h">
      <div class="cli"><b>${esc(r.cliente_nombre||"—")}</b><span>${esc(r.comercial||"")} · ${fmtTs(r.ts)}</span></div>
      <div class="qt">${nf(r.cantidad)} u</div>
      <span class="badge b-${r.estado}">${EST_LBL[r.estado]||r.estado}</span>
    </div>
    ${r.nota?`<div class="nota">“${esc(r.nota)}”</div>`:""}
    <div class="acts">${acts.join("")}</div>
  </div>`;
}

// ---- Vista COMERCIAL: sus pendientes, plano ----
function bodyComercial(){
  const arr=filtrar();
  if(!arr.length) return '<div class="pcard empty">No tenés pendientes en este estado.</div>';
  const filas=arr.map(r=>`<div class="prow">
      <div class="prow-h">
        <div class="cli"><b>${esc(r.producto_nombre||"—")}</b><span>${esc(r.producto_codigo||"")} · para ${esc(r.cliente_nombre||"—")} · ${fmtTs(r.ts)}</span></div>
        <div class="qt">${nf(r.cantidad)} u</div>
        <span class="badge b-${r.estado}">${EST_LBL[r.estado]||r.estado}</span>
      </div>
      ${r.nota?`<div class="nota">“${esc(r.nota)}”</div>`:""}
      <div class="acts">
        ${r.estado==="repuesto"?`<button class="mini-btn grn" onclick="setEstado(${r.id},'entregado')">📦 Ya lo entregué</button>`:""}
        ${(r.estado==="pendiente"||r.estado==="en_compra")?`<button class="mini-btn" onclick="setEstado(${r.id},'cancelado')">Cancelar</button>`:""}
      </div>
    </div>`).join("");
  return `<div class="count-line"><b>${arr.length}</b> pendiente${arr.length===1?"":"s"}.</div>${filas}`;
}

function tog(id){ if(F.abiertos.has(id))F.abiertos.delete(id); else F.abiertos.add(id); document.getElementById("pbody").innerHTML=bodyGestion(); }

async function setEstado(id,estado){
  const r=ROWS.find(x=>x.id===id); if(!r) return;
  if(estado==="cancelado" && !confirm(`¿Cancelar el pendiente de ${r.producto_nombre} para ${r.cliente_nombre}?`)) return;
  try{
    const {error}=await EYG.supa().from("pendientes_reposicion").update({estado, estado_ts:new Date().toISOString(), estado_por:(PERFIL&&PERFIL.email)||null}).eq("id",id);
    if(error) throw error;
    r.estado=estado; r.estado_ts=new Date().toISOString();
    toast("✓ "+(EST_LBL[estado]||estado));
    render();
  }catch(e){ alert("No se pudo actualizar: "+(e.message||e)); }
}
</script>
</body>
</html>
