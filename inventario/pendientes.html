<html lang="es">
<head>
<meta charset="UTF-8">

<style>
  :root{ --green:#1E7D46; --greenbg:#E4F5E9; --org:#C4602A; --orgbg:#FBE3D4; --yel:#B7791F; --yelbg:#FBF3D9; --red:#8A1F1C; --redbg:#F7D2D0; }
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--teal-deep);font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:9px}
  h2.sec:before{content:"";width:5px;height:16px;background:var(--teal);border-radius:3px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:14px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow)}
  .kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:700;margin-bottom:5px}
  .kpi .n{font-size:24px;font-weight:800;line-height:1.1}
  .kpi.red .n{color:var(--red)}.kpi.yel .n{color:var(--yel)}.kpi.green .n{color:var(--green)}.kpi.teal .n{color:var(--teal-deep)}
  .toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}
  .chip{font-size:12.5px;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;color:var(--gris)}

  .search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
  .search input{border:0;background:none;outline:none;font-family:inherit;font-size:14px;width:100%;color:var(--ink)}
  .search svg{width:17px;height:17px;color:var(--gris2);flex-shrink:0}
  .mini-btn{font-family:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;color:var(--ink);cursor:pointer;font-weight:600}
  .mini-btn:hover{border-color:var(--teal)} .mini-btn.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
  .mini-btn.grn{background:var(--green);color:#fff;border-color:var(--green)} .mini-btn.gold{background:var(--yel);color:#fff;border-color:var(--yel)}
  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
  .pcard.empty{text-align:center;color:var(--gris);padding:40px}
  .ordcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
  .ordcard.abierta{border-left:4px solid var(--teal)}
  .oh{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
  .oh:hover{background:#F7FBFA}
  .oh .nm{flex:1;min-width:0}.oh .nm b{font-size:15px;display:block;overflow-wrap:anywhere;line-height:1.25}.oh .nm span{font-size:12px;color:var(--gris)}
  .oh .tot{text-align:right;flex:none}.oh .tot b{font-size:20px;font-weight:800;color:var(--teal-deep)}.oh .tot span{display:block;font-size:10.5px;color:var(--gris);text-transform:uppercase;letter-spacing:.5px}
  .oh .cv{font-size:19px;color:var(--gris2);font-weight:800;width:18px;text-align:center}
  .obody{border-top:1px solid var(--line);background:#FAFDFC;padding:12px 16px 14px}
  .lin{display:grid;grid-template-columns:1.4fr 1.6fr .7fr 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .lin:last-child{border-bottom:0}
  .lin .who b{font-size:13.5px}.lin .cli{color:var(--gris)}.lin .qt{font-weight:800;text-align:right;color:var(--teal-deep)}.lin .cu{font-size:11.5px;color:var(--gris2);text-align:right}
  .lhead{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:6px}
  .recibir{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:11px 13px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
  .recibir label{font-size:12px;font-weight:800;color:var(--teal-deep)}
  .recibir input{width:100px;font-size:16px;font-weight:700;padding:8px;border:1px solid var(--line);border-radius:8px;text-align:right}
  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .badge{font-size:10.5px;font-weight:800;border-radius:99px;padding:3px 9px;white-space:nowrap;display:inline-block}
  .b-abierta{background:#E6F3F1;color:var(--teal-deep)} .b-aceptada{background:var(--yelbg);color:var(--yel)}
  .b-en_compra{background:var(--orgbg);color:var(--org)} .b-repuesta{background:var(--greenbg);color:var(--green)}
  .b-entregada{background:#EEF2F1;color:var(--gris)} .b-cancelada{background:#EEF2F1;color:var(--gris)}
  .bita{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .bita .t{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:800;margin-bottom:6px}
  .bita .e{font-size:12px;color:var(--gris);padding:2px 0}.bita .e b{color:var(--ink)}
  .oc{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;background:var(--orgbg);color:var(--org);border-radius:99px;padding:3px 10px;text-decoration:none;white-space:nowrap}
  .oc:hover{filter:brightness(.95)}
  .ocbox{margin-top:12px;padding:11px 13px;background:var(--orgbg);border:1px solid #E9C9AF;border-left:4px solid var(--org);border-radius:10px;font-size:13px;color:#6E3416}
  .ocbox b{color:var(--org)} .ocbox a{color:var(--org);font-weight:800}
  .ocbox.ok{background:var(--greenbg);border-color:#BFE0DC;border-left-color:var(--green);color:#155C33}.ocbox.ok b,.ocbox.ok a{color:var(--green)}
  .provrow{display:flex;align-items:center;gap:10px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;cursor:pointer}
  .provrow:hover{border-color:var(--teal)} .provrow.on{border-color:var(--teal);background:#F2F9F8;box-shadow:0 0 0 1px var(--teal) inset}
  .provrow .pn{flex:1;min-width:0}.provrow .pn b{font-size:13.5px;display:block;overflow-wrap:anywhere}
  .provrow .pn span{font-size:11.5px;color:var(--gris)}
  .tagmini{font-size:9.5px;font-weight:800;background:#E6F3F1;color:var(--teal-deep);border-radius:99px;padding:2px 7px;margin-left:5px;vertical-align:1px}
  .tagmini.cheap{background:var(--greenbg);color:var(--green)}
  .avisorep{background:var(--greenbg);border:1px solid #BFE0DC;border-left:4px solid var(--green);border-radius:10px;padding:10px 13px;font-size:13px;color:#155C33;margin-bottom:12px}.avisorep b{color:var(--green)}
  .avisoabr{background:#E6F3F1;border:1px solid #BFE0DC;border-left:4px solid var(--teal);border-radius:10px;padding:10px 13px;font-size:13px;color:#245C57;margin-bottom:12px}.avisoabr b{color:var(--teal-deep)}
  .cerrada{opacity:.75}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite;margin:60px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .count-line{font-size:13px;color:var(--gris);margin:2px 0 10px}.count-line b{color:var(--ink)}
  .ov{position:fixed;inset:0;background:rgba(6,65,62,.42);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}.ov.on{display:flex}
  .modbox{background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(6,65,62,.3);padding:22px;width:380px;max-width:96vw}
  .modbox h3{font-size:18px;font-weight:800;color:var(--teal-deep)}
  .modbox label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);margin:12px 0 4px}
  .modbox input{width:100%;font-family:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink)}
  .modbox .mb{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=52"></script>
<script>
const esc=s=>(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const nf=n=>Math.round(n||0).toLocaleString("es-AR");
function toast(m){ let t=document.getElementById("toast"); if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);} t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2600); }
function fdt(ts){ try{ return new Date(ts).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
const EST_LBL={abierta:"Abierta — se puede sumar",aceptada:"Aceptada",en_compra:"En compra",repuesta:"Repuesta",entregada:"Entregada",cancelada:"Cancelada"};
const ACC_LBL={crear:"abrió la orden",agregar:"sumó unidades",editar_recibir:"editó la cantidad a recibir",editar_producto:"cambió el producto que va a ingresar",aceptar:"aceptó la orden",en_compra:"pasó a en compra",oc_crear:"generó la orden de compra",oc_agregar:"agregó el producto a una orden de compra",oc_recibida:"— llegó la mercadería (Odoo)",repuesta:"marcó repuesta",entregada:"marcó entregada",cancelada:"canceló"};
const cerrada=o=>o.estado!=="abierta";

/* ---- Odoo: la compra real ----
   El módulo dejó de ser un tablero de carteles. "En compra" ya no se pone a mano:
   lo pone la creación de la ORDEN DE COMPRA en Odoo, y "Repuesta" lo pone Odoo
   cuando la mercadería entra. Cada orden guarda su po_id para poder seguirla. */
const rpc=EYG.rpc, money=EYG.money;
const ODOO="https://drogueriaeyg.odoo.com/web#";
const ocLink=poId=>`${ODOO}id=${poId}&model=purchase.order&view_type=form`;
const PROVEEDOR_T=2634;   // compra informal: fuera del flujo formal de compras
const PO_LBL={draft:"borrador",sent:"enviada al proveedor",purchase:"confirmada",done:"cerrada",cancel:"cancelada"};
let POINFO=new Map();     // orden_id -> {state, recibido, pedido, name}

let PERFIL=null, GESTION=false, MIREF="", MIEMAIL="";
let ORD=[], BYID=new Map();
let F={estado:"abiertas", q:"", abiertos:new Set()};

EYG.requireAuth(["direccion","finanzas","inventario","comercial","lider","admin","maestro"], perfil=>{
  PERFIL=perfil;
  GESTION = EYG.esSuper(perfil._h) || ["direccion","finanzas","inventario","admin","lider"].includes(perfil.rol);
  MIREF = perfil.comercial_ref || perfil.nombre || ""; MIEMAIL=perfil.email||"";
  document.body.innerHTML=EYG.layout(perfil,"pendientes",
    `<h2 class="sec">📋 Pendientes de reposición <span style="margin-left:auto"><button class="mini-btn" onclick="cargar()">🔄 Actualizar</button></span></h2>
     <div id="cap"><div class="spin"></div></div><div class="ov" id="ov"></div>`,
    "Pendientes de reposición");
  cargar();
});

async function cargar(){
  const cap=document.getElementById("cap"); cap.innerHTML='<div class="spin"></div>';
  try{
    const [o,l,g]=await Promise.all([
      EYG.supa().from("reposicion_orden").select("*").order("ts",{ascending:false}).limit(2000),
      EYG.supa().from("reposicion_linea").select("*").order("ts",{ascending:true}).limit(8000),
      EYG.supa().from("reposicion_log").select("*").order("ts",{ascending:true}).limit(8000)
    ]);
    if(o.error) throw o.error;
    ORD=o.data||[]; BYID=new Map();
    ORD.forEach(x=>{ x.lineas=[]; x.logs=[]; x.total=0; BYID.set(x.id,x); });
    (l.data||[]).forEach(x=>{ const o=BYID.get(x.orden_id); if(o){ o.lineas.push(x); o.total+=(x.cantidad||0); } });
    (g.data||[]).forEach(x=>{ const o=BYID.get(x.orden_id); if(o) o.logs.push(x); });
    render();
    sincroOC();   // en segundo plano: estado real de las OC en Odoo
  }catch(e){ cap.innerHTML='<div class="pcard empty">No se pudo cargar: '+esc(e.message||String(e))+'<br><br><button class="mini-btn pri" onclick="cargar()">Reintentar</button></div>'; }
}

/* Mira en Odoo cómo va cada orden de compra generada desde acá y, cuando la
   mercadería YA ENTRÓ (qty_received cubre lo pedido), pasa la orden a Repuesta
   sola y le avisa a los comerciales que la pidieron — que es justo cuando
   tienen que llamar al cliente. Nadie se tiene que acordar de marcar nada.
   El update lleva .eq("estado","en_compra") para que, si dos personas tienen la
   pantalla abierta a la vez, el aviso salga una sola vez (gana el primero). */
async function sincroOC(){
  const conOC=ORD.filter(o=>o.po_id && (o.estado==="en_compra"||o.estado==="aceptada"));
  if(!conOC.length) return;
  try{
    const poIds=[...new Set(conOC.map(o=>o.po_id))];
    const [pos,pols]=await Promise.all([
      rpc("purchase.order","read",[poIds,["name","state"]]),
      rpc("purchase.order.line","search_read",[[["order_id","in",poIds]]],{fields:["order_id","product_id","product_qty","qty_received"],limit:2000})
    ]);
    const ST={}; (pos||[]).forEach(p=>ST[p.id]={state:p.state,name:p.name});
    POINFO=new Map();
    const recibidas=[];
    for(const o of conOC){
      const st=ST[o.po_id]; if(!st) continue;
      const lin=(pols||[]).filter(l=>l.order_id&&l.order_id[0]===o.po_id&&l.product_id&&l.product_id[0]===o.producto_id);
      const pedido=lin.reduce((a,l)=>a+(l.product_qty||0),0);
      const recibido=lin.reduce((a,l)=>a+(l.qty_received||0),0);
      POINFO.set(o.id,{state:st.state,name:st.name,pedido,recibido});
      if(o.estado==="en_compra" && st.state!=="cancel" && pedido>0 && recibido>=pedido) recibidas.push({o,recibido});
    }
    for(const {o,recibido} of recibidas) await marcarRepuestaPorOdoo(o,recibido);
    if(recibidas.length) await cargar(); else render();
  }catch(e){ /* si Odoo no responde, la pantalla sigue andando con lo que hay */ }
}
async function marcarRepuestaPorOdoo(o,recibido){
  try{
    const {data,error}=await EYG.supa().from("reposicion_orden").update({estado:"repuesta"})
      .eq("id",o.id).eq("estado","en_compra").select("id");
    if(error||!data||!data.length) return;   // otro ya lo marcó: no duplicar el aviso
    await _log(o.id,"oc_recibida",`entraron ${nf(recibido)} u por ${o.po_name||("OC #"+o.po_id)}`);
    await avisarComerciales(o, "✅ Ya llegó lo que pediste reponer",
      `Entró la mercadería de "${o.producto_nombre}". Ya hay stock: cerrá la venta con tu cliente.`);
  }catch(e){}
}
/* Aviso por la campanita, dirigido SOLO a los comerciales que pidieron ese producto. */
async function avisarComerciales(o,titulo,cuerpo){
  try{
    const emails=[...new Set((o.lineas||[]).map(l=>l.comercial_email).filter(Boolean))];
    if(!emails.length || !EYG.comsLeer || !EYG.comsGuardar) return;
    const arr=await EYG.comsLeer();
    arr.push({ id:"repo-"+o.id+"-"+Date.now(), clase:"novedad", activo:true,
      alcance:"personas", personas:emails, titulo, cuerpo,
      autor:(PERFIL&&(PERFIL.nombre||PERFIL.email))||"Compras", ts:new Date().toISOString(),
      hasta:new Date(Date.now()+14*86400000).toISOString().slice(0,10),
      link:"inventario/pendientes.html", linkLabel:"Ver pendientes →", leidoPor:[] });
    await EYG.comsGuardar(arr);
  }catch(e){}
}

function miLinea(o){ return o.lineas.some(l=>(l.comercial===MIREF)||(l.comercial_email&&l.comercial_email===MIEMAIL)); }
function render(){ document.getElementById("cap").innerHTML = GESTION ? viewGestion() : viewComercial(); const pq=document.getElementById("pq"); if(pq) pq.oninput=EYG.debounce(e=>{F.q=e.target.value; render();},250); }

/* ================= GESTIÓN (Dirección + Compras) ================= */
function viewGestion(){
  const c={abierta:0,aceptada:0,en_compra:0,repuesta:0};
  ORD.forEach(o=>{ if(c[o.estado]!=null)c[o.estado]++; });
  const kpis=`<div class="kpis">
    <div class="kpi teal"><div class="l">📥 Abiertas</div><div class="n">${c.abierta}</div></div>
    <div class="kpi yel"><div class="l">✔ Aceptadas</div><div class="n">${c.aceptada}</div></div>
    <div class="kpi red"><div class="l">🛒 En compra</div><div class="n">${c.en_compra}</div></div>
    <div class="kpi green"><div class="l">✅ Repuestas</div><div class="n">${c.repuesta}</div></div></div>`;
  const chips=[["abiertas","📥 Abiertas"],["aceptada","✔ Aceptadas"],["en_compra","🛒 En compra"],["repuesta","✅ Repuestas"],["entregada","Entregadas"],["cancelada","Canceladas"],["todas","Todas"]];
  const bar=`<div class="toolbar">${chips.map(([k,l])=>`<button class="chip ${F.estado===k?'on':''}" onclick="setF('${k}')">${l}</button>`).join("")}
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg><input id="pq" placeholder="Buscar producto…" value="${esc(F.q)}"></div></div>`;
  let arr = F.estado==="todas"?ORD.slice() : F.estado==="abiertas"?ORD.filter(o=>o.estado==="abierta") : ORD.filter(o=>o.estado===F.estado);
  const q=F.q.toLowerCase(); if(q) arr=arr.filter(o=>(o.producto_nombre||"").toLowerCase().includes(q)||(o.producto_codigo||"").toLowerCase().includes(q));
  arr.sort((a,b)=>b.total-a.total);
  const cards = arr.length ? arr.map(cardGestion).join("") : '<div class="pcard empty">No hay órdenes en este estado.</div>';
  const guia = F.estado==="aceptada" ? "Aceptada = ya no se le suma más. El paso siguiente es <b>🛒 Pedir al proveedor</b>: genera la orden de compra en Odoo."
    : F.estado==="en_compra" ? "Estas ya tienen <b>orden de compra en Odoo</b>. Cuando entre la mercadería pasan solas a Repuesta y se avisa a los comerciales."
    : "Tocá para ver quién pidió, fijar la cantidad a recibir y generar la compra.";
  return kpis+bar+`<div class="count-line"><b>${arr.length}</b> orden${arr.length===1?"":"es"}. ${guia}</div>`+cards;
}
function cardGestion(o){
  const ab=F.abiertos.has(o.id);
  return `<div class="ordcard ${o.estado==='abierta'?'abierta':''}">
    <div class="oh" onclick="tog(${o.id})">
      <div class="nm"><b>${esc(o.producto_nombre||"—")}</b><span>${esc(o.producto_codigo||"")} · ${o.lineas.length} comercial${o.lineas.length===1?"":"es"} · abrió ${esc(o.creada_por||"—")} el ${fdt(o.ts)}</span></div>
      <div class="tot"><b>${nf(o.cantidad_recibir!=null?o.cantidad_recibir:o.total)}</b><span>${o.cantidad_recibir!=null?"a recibir":"pedido"}</span></div>
      ${o.po_id?`<a class="oc" href="${ocLink(o.po_id)}" target="_blank" onclick="event.stopPropagation()" title="Orden de compra en Odoo${o.proveedor_nombre?" · "+esc(o.proveedor_nombre):""}">🧾 ${esc(o.po_name||("#"+o.po_id))}</a>`:""}
      <span class="badge b-${o.estado}">${EST_LBL[o.estado]||o.estado}</span>
      <div class="cv">${ab?"▾":"▸"}</div>
    </div>
    ${ab?obodyGestion(o):""}
  </div>`;
}
function obodyGestion(o){
  const lineas=`<div class="lin lhead"><div>Comercial</div><div>Cliente</div><div style="text-align:right">Cant.</div><div style="text-align:right">Cuándo</div></div>`+
    o.lineas.map(l=>`<div class="lin"><div class="who"><b>${esc(l.comercial||"—")}</b></div><div class="cli">${esc(l.cliente_nombre||"—")}${l.nota?` · <i>${esc(l.nota)}</i>`:""}</div><div class="qt">${nf(l.cantidad)}</div><div class="cu">${fdt(l.ts)}</div></div>`).join("");
  const recibir = o.estado!=="cancelada" ? `<div class="recibir"><label>Cantidad a recibir</label>
      <input id="rec-${o.id}" type="number" min="0" value="${o.cantidad_recibir!=null?o.cantidad_recibir:o.total}">
      <button class="mini-btn pri" onclick="editarRecibir(${o.id})">Guardar</button>
      <span style="font-size:12px;color:var(--gris)">Pedido por los comerciales: <b>${nf(o.total)}</b></span></div>` : "";
  const acts=[];
  if(o.estado!=="cancelada"&&o.estado!=="entregada") acts.push(`<button class="mini-btn" onclick="editarProducto(${o.id})">✏️ Editar producto (otra marca)</button>`);
  if(o.estado==="abierta") acts.push(`<button class="mini-btn grn" onclick="aceptar(${o.id})">✔ Aceptar (cierra el agregado)</button>`);
  if(o.estado==="aceptada"&&!o.po_id) acts.push(`<button class="mini-btn gold" onclick="pedirProveedor(${o.id})">🛒 Pedir al proveedor</button>`);
  if(o.estado==="aceptada"||o.estado==="en_compra") acts.push(`<button class="mini-btn grn" onclick="setEstado(${o.id},'repuesta')">✅ Repuesta${o.po_id?" a mano":""}</button>`);
  if(o.estado==="repuesta") acts.push(`<button class="mini-btn" onclick="setEstado(${o.id},'entregada')">📦 Entregada</button>`);
  if(o.estado!=="cancelada"&&o.estado!=="entregada") acts.push(`<button class="mini-btn" onclick="setEstado(${o.id},'cancelada')">Cancelar</button>`);
  return `<div class="obody">
    ${lineas}
    ${recibir}
    ${ocEstado(o)}
    <div class="acts">${acts.join("")}</div>
    ${bitacora(o)}
  </div>`;
}
/* Estado REAL de la compra, leído de Odoo. Mientras no responda muestra lo guardado. */
function ocEstado(o){
  if(!o.po_id) return "";
  const i=POINFO.get(o.id);
  const link=`<a href="${ocLink(o.po_id)}" target="_blank">${esc(o.po_name||("OC #"+o.po_id))} ↗</a>`;
  const prov=o.proveedor_nombre?` a <b>${esc(o.proveedor_nombre)}</b>`:"";
  if(!i) return `<div class="ocbox">🧾 Orden de compra ${link}${prov} — leyendo el estado en Odoo…</div>`;
  const falta=Math.max(0,(i.pedido||0)-(i.recibido||0));
  if(i.recibido>0 && falta<=0) return `<div class="ocbox ok">✅ <b>Ya entró la mercadería</b> — ${nf(i.recibido)} u por ${link}${prov}.</div>`;
  if(i.recibido>0) return `<div class="ocbox">📦 Entró una parte: <b>${nf(i.recibido)} de ${nf(i.pedido)} u</b> por ${link}${prov}. Faltan ${nf(falta)}.</div>`;
  if(i.state==="cancel") return `<div class="ocbox">⚠️ La orden ${link} está <b>cancelada</b> en Odoo. Volvé a pedirla o cancelá esta reposición.</div>`;
  if(i.state==="draft") return `<div class="ocbox">📝 ${link}${prov} está en <b>borrador</b>: hay que confirmarla en Odoo para que el proveedor la reciba. Pedido: ${nf(i.pedido)} u.</div>`;
  return `<div class="ocbox">🚚 ${link}${prov} — <b>${esc(PO_LBL[i.state]||i.state)}</b>, ${nf(i.pedido)} u en camino. Cuando entren, esta orden pasa sola a Repuesta.</div>`;
}
function bitacora(o){
  if(!o.logs.length) return "";
  return `<div class="bita"><div class="t">🕘 Historial</div>${o.logs.slice().reverse().map(e=>`<div class="e"><b>${esc(e.por||"—")}</b> ${esc(ACC_LBL[e.accion]||e.accion)}${e.detalle?` (${esc(e.detalle)})`:""} · ${fdt(e.ts)}</div>`).join("")}</div>`;
}

/* ================= COMERCIAL (ve abiertas + lo suyo) ================= */

  const abiertas=ORD.filter(o=>o.estado==="abierta");
  const mias=ORD.filter(o=>miLinea(o));

  const abr = abiertas.length? `<div class="avisoabr">🔔 <b>${abiertas.length} orden${abiertas.length===1?"":"es"} de reposición abierta${abiertas.length===1?"":"s"}</b> — si necesitás alguno de estos productos para un cliente, sumá tus unidades.</div>`:"";
  const secAbr = `<h2 class="sec">🔔 Órdenes abiertas — podés sumar</h2>` + (abiertas.length? abiertas.sort((a,b)=>new Date(b.ts)-new Date(a.ts)).map(cardComAbierta).join("") : '<div class="pcard empty">No hay órdenes abiertas ahora.</div>');

/* ============ PEDIR AL PROVEEDOR: de la reposición a la compra real ============
   Acá se cierra el circuito que faltaba. Antes "En compra" era un cartel puesto a
   mano y no generaba nada. Ahora este botón:
     1) trae de Odoo los proveedores de ESE producto (con precio y mínimo),
     2) si ese proveedor ya tiene un borrador de OC abierto, ofrece SUMARLE el
        producto en vez de crear otro borrador suelto,
     3) crea/actualiza la purchase.order en Odoo,
     4) guarda po_id en la orden y la pasa a "En compra" sola.
   El estado "En compra" pasa a significar algo verificable: hay una OC. */
let PROV={ordenId:null, items:[], sel:null, borradores:{}, destino:"nueva", cant:0, busca:[]};
async function pedirProveedor(id){
  const o=BYID.get(id); if(!o) return;
  if(o.po_id){ toast("Esta orden ya tiene una OC generada"); return; }
  const ov=document.getElementById("ov");
  PROV={ordenId:id, items:[], sel:null, borradores:{}, destino:"nueva",
        cant:(o.cantidad_recibir!=null?o.cantidad_recibir:o.total)||1, busca:[]};
  ov.innerHTML=`<div class="modbox" style="width:520px"><h3>🛒 Pedir al proveedor</h3>
    <p style="font-size:13px;color:var(--gris);margin:4px 0 6px">${esc(o.producto_nombre||"")}</p>
    <div id="pv-body" style="margin-top:10px"><div class="spin" style="margin:30px auto"></div></div></div>`;
  ov.classList.add("on");
  try{
    const prod=await rpc("product.product","read",[[o.producto_id],["seller_ids","uom_po_id","standard_price","name"]]);
    const p=(prod||[])[0]||{};
    PROV.uomPo=p.uom_po_id?p.uom_po_id[0]:1; PROV.costo=p.standard_price||0; PROV.nombreOdoo=p.name||o.producto_nombre;
    const sids=p.seller_ids||[];
    const si=sids.length? await rpc("product.supplierinfo","read",[sids,["partner_id","price","min_qty","sequence","delay"]]) : [];
    const map={};
    for(const s of (si||[]).sort((a,b)=>(a.sequence||0)-(b.sequence||0))){
      if(!s.partner_id || s.partner_id[0]===PROVEEDOR_T) continue;     // la compra informal va por fuera
      const pid=s.partner_id[0];
      if(!map[pid] || (s.min_qty||1)<map[pid].minQty)
        map[pid]={id:pid,name:s.partner_id[1],price:s.price>0?s.price:0,minQty:s.min_qty||1,delay:s.delay||7};
    }
    PROV.items=Object.values(map);
    if(PROV.items.length) PROV.sel=PROV.items[0].id;
    await cargarBorradores(PROV.items.map(x=>x.id));
    pintarProv();
  }catch(e){ document.getElementById("pv-body").innerHTML=`<div style="font-size:13px;color:var(--red)">No pude leer los proveedores de Odoo: ${esc(e.message||e)}</div>`; }
}
/* Borradores de OC ya abiertos por proveedor: para no llenar Odoo de órdenes sueltas. */
async function cargarBorradores(ids){
  PROV.borradores={};
  if(!ids.length) return;
  try{
    const pos=await rpc("purchase.order","search_read",[[["state","in",["draft","sent"]],["partner_id","in",ids]]],
      {fields:["name","partner_id","state","amount_untaxed"],order:"id desc",limit:200});
    (pos||[]).forEach(p=>{ const k=p.partner_id[0]; if(!PROV.borradores[k]) PROV.borradores[k]=[]; PROV.borradores[k].push(p); });
  }catch(e){}
}
function pintarProv(){
  const o=BYID.get(PROV.ordenId); if(!o) return;
  const b=document.getElementById("pv-body"); if(!b) return;
  const lista=PROV.items.length?PROV.items:PROV.busca;
  const minP=lista.filter(x=>x.price>0).reduce((m,x)=>m==null?x.price:Math.min(m,x.price),null);
  const filas=lista.map((p,i)=>`<div class="provrow ${PROV.sel===p.id?'on':''}" onclick="selProv(${p.id})">
      <div class="pn"><b>${esc(p.name)}${PROV.items.length&&i===0?' <span class="tagmini">preferido</span>':''}${lista.length>1&&minP!=null&&p.price===minP&&p.price>0?' <span class="tagmini cheap">más barato</span>':''}</b>
        <span>${p.price>0?money(p.price)+" /u":"sin precio cargado"}${p.minQty>1?` · mínimo ${nf(p.minQty)} u`:""}${PROV.borradores[p.id]?` · ${PROV.borradores[p.id].length} borrador${PROV.borradores[p.id].length===1?"":"es"} abierto${PROV.borradores[p.id].length===1?"":"s"}`:""}</span></div>
    </div>`).join("");
  const sel=lista.find(x=>x.id===PROV.sel);
  const brs=sel?(PROV.borradores[sel.id]||[]):[];
  const destino = brs.length? `<label>Dónde va</label>
    <div class="provrow ${PROV.destino==="nueva"?'on':''}" onclick="selDest('nueva')"><div class="pn"><b>Crear una orden de compra nueva</b><span>queda en borrador en Odoo, sin confirmar</span></div></div>
    ${brs.map(p=>`<div class="provrow ${PROV.destino===("po:"+p.id)?'on':''}" onclick="selDest('po:${p.id}')"><div class="pn"><b>Sumarlo a ${esc(p.name)}</b><span>${esc(PO_LBL[p.state]||p.state)} · ${money(p.amount_untaxed||0)} — evitás otro borrador suelto</span></div></div>`).join("")}`:"";
  const aviso = sel&&sel.minQty>1&&PROV.cant<sel.minQty
    ? `<div style="font-size:12px;color:var(--yel);font-weight:700;margin-top:6px">⚠ ${esc(sel.name)} pide un mínimo de ${nf(sel.minQty)} u.</div>`:"";
  b.innerHTML = (lista.length? `<label>Proveedor</label>${filas}${destino}` :
      `<div style="font-size:13px;color:var(--gris);margin-bottom:8px">Este producto <b>no tiene proveedor cargado</b> en Odoo. Buscá a quién comprárselo:</div>
       <input id="pv-q" placeholder="Buscar proveedor…" oninput="buscarProv(this.value)">`)
    + `<label>Cantidad a pedir</label><input id="pv-cant" type="number" min="1" value="${PROV.cant}" oninput="PROV.cant=parseInt(this.value)||0;pintarProv()">
       <div style="font-size:12px;color:var(--gris);margin-top:5px">Los comerciales pidieron <b>${nf(o.total)} u</b>${o.cantidad_recibir!=null?` · fijaste recibir <b>${nf(o.cantidad_recibir)}</b>`:""}${sel&&sel.price>0?` · total estimado <b>${money(sel.price*PROV.cant)}</b>`:""}</div>
       ${aviso}
       <div class="mb"><button class="mini-btn" onclick="cerrarOv()">Cancelar</button>
         <button class="mini-btn pri" id="pv-ok" onclick="generarOC()" ${PROV.sel?"":"disabled style=opacity:.5"}>Generar orden de compra</button></div>`;
}
function selProv(id){ PROV.sel=id; PROV.destino="nueva"; pintarProv(); }
function selDest(d){ PROV.destino=d; pintarProv(); }
const buscarProv=EYG.debounce(async q=>{
  q=(q||"").trim(); if(q.length<3){ PROV.busca=[]; return; }
  try{
    const r=await rpc("res.partner","search_read",[[["supplier_rank",">",0],["name","ilike",q],["id","!=",PROVEEDOR_T]]],{fields:["name"],limit:12});
    PROV.busca=(r||[]).map(x=>({id:x.id,name:x.name,price:0,minQty:1,delay:7}));
    const inp=document.getElementById("pv-q"); const val=inp?inp.value:"";
    pintarProv(); const n=document.getElementById("pv-q"); if(n){ n.value=val; n.focus(); }
  }catch(e){}
},350);

async function generarOC(){
  const o=BYID.get(PROV.ordenId); if(!o) return;
  const lista=PROV.items.length?PROV.items:PROV.busca;
  const p=lista.find(x=>x.id===PROV.sel);
  if(!p){ toast("Elegí un proveedor"); return; }
  const cant=PROV.cant;
  if(!(cant>0)){ toast("Poné una cantidad"); return; }
  const suma=PROV.destino.startsWith("po:");
  const poExist=suma?parseInt(PROV.destino.slice(3),10):null;
  const brs=PROV.borradores[p.id]||[]; const nom=suma?(brs.find(x=>x.id===poExist)||{}).name:null;
  if(!confirm(suma
      ? `¿Sumar ${nf(cant)} u de este producto a la orden ${nom||("#"+poExist)} de ${p.name}?`
      : `¿Crear una orden de compra a ${p.name} por ${nf(cant)} u?\n\nQueda en BORRADOR en Odoo, sin confirmar: revisala y confirmala desde ahí.`)) return;
  const btn=document.getElementById("pv-ok"); if(btn){ btn.disabled=true; btn.textContent="Generando en Odoo…"; }
  try{
    const dp=new Date(); dp.setDate(dp.getDate()+(p.delay||7));
    const precio=p.price>0?p.price:(PROV.costo||0);
    const linea=[0,0,{product_id:o.producto_id, product_qty:cant, price_unit:Math.round(precio*100)/100,
      product_uom:PROV.uomPo, name:PROV.nombreOdoo||o.producto_nombre, date_planned:dp.toISOString().slice(0,10)+" 00:00:00"}];
    let poId, poName;
    if(suma){ await rpc("purchase.order","write",[[poExist],{order_line:[linea]}]); poId=poExist; poName=nom||("#"+poExist); }
    else{ poId=await rpc("purchase.order","create",[{partner_id:p.id, order_line:[linea]}]);
          const info=await rpc("purchase.order","read",[[poId],["name"]]); poName=(info&&info[0])?info[0].name:("#"+poId); }
    const {error}=await EYG.supa().from("reposicion_orden").update({
      estado:"en_compra", proveedor_id:p.id, proveedor_nombre:p.name, po_id:poId, po_name:poName,
      po_ts:new Date().toISOString(), cantidad_recibir:cant,
      ult_mod_por:(PERFIL.nombre||PERFIL.email), ult_mod_ts:new Date().toISOString()}).eq("id",PROV.ordenId);
    if(error) throw error;
    await _log(PROV.ordenId, suma?"oc_agregar":"oc_crear", `${nf(cant)} u a ${p.name} · ${poName}`);
    await avisarComerciales(o, "🛒 Ya se pidió al proveedor lo que reservaste",
      `"${o.producto_nombre}" se le pidió a ${p.name} (${nf(cant)} u, orden ${poName}). Te avisamos de nuevo cuando entre la mercadería.`);
    cerrarOv(); toast("✓ "+(suma?"Sumado a ":"Orden ")+poName); await cargar();
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent="Generar orden de compra"; }
    alert("No se pudo generar la orden en Odoo: "+(e.message||e));
  }
}

// gestión: editar cantidad a recibir
async function editarRecibir(id){
  const v=parseFloat((document.getElementById("rec-"+id).value||"").replace(",","."));
  if(isNaN(v)||v<0){ toast("Cantidad inválida"); return; }
  try{
    const {error}=await EYG.supa().from("reposicion_orden").update({cantidad_recibir:v,ult_mod_por:(PERFIL.nombre||PERFIL.email),ult_mod_ts:new Date().toISOString()}).eq("id",id);
    if(error) throw error;
    await _log(id,"editar_recibir",nf(v)+" u"); toast("✓ Cantidad a recibir: "+nf(v)); await cargar();
  }catch(e){ alert("No se pudo guardar: "+(e.message||e)); }
}
async function aceptar(id){
  if(!confirm("Aceptar la orden cierra el agregado: los comerciales ya no van a poder sumar más. ¿Confirmás?")) return;
  try{
    const {error}=await EYG.supa().from("reposicion_orden").update({estado:"aceptada",aceptada_por:(PERFIL.nombre||PERFIL.email),aceptada_ts:new Date().toISOString()}).eq("id",id);
    if(error) throw error;
    await _log(id,"aceptar"); toast("✓ Orden aceptada"); await cargar();
  }catch(e){ alert("No se pudo aceptar: "+(e.message||e)); }
}
async function setEstado(id,estado){
  if(estado==="cancelada" && !confirm("¿Cancelar esta orden de reposición?")) return;
  const o=BYID.get(id);
  try{
    const {error}=await EYG.supa().from("reposicion_orden").update({estado}).eq("id",id);
    if(error) throw error;
    await _log(id,estado);
    // Repuesta a mano (llegó por otra vía, o sin OC): el comercial también tiene que enterarse.
    if(estado==="repuesta" && o) await avisarComerciales(o, "✅ Ya llegó lo que pediste reponer",
      `Ya hay stock de "${o.producto_nombre}". Cerrá la venta con tu cliente.`);
    toast("✓ "+(EST_LBL[estado]||estado)); await cargar();
  }catch(e){ alert("No se pudo actualizar: "+(e.message||e)); }
}
</script>
