<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vademécum · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<style>
  .intro{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px;font-size:13.5px;color:var(--gris)}
  .intro b{color:var(--ink)}

  /* Aviso de carga en curso. Ámbar, no rojo: no es un error, es un estado. */
  .cargando-aviso{background:#fff8e6;border:1px solid #f0d68c;border-left:4px solid #e0a800;
    border-radius:10px;padding:11px 14px;margin-bottom:14px;font-size:13px;color:#6b4e00;cursor:help}
  .kpis{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow);min-width:118px}
  .kpi .n{font-size:22px;font-weight:900;color:var(--ink);line-height:1}
  .kpi .l{font-size:11.5px;color:var(--gris);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}

  /* ---- buscador ---- */
  .buscador{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .buscador input[type=search]{flex:1;min-width:240px;padding:12px 15px;border:1px solid var(--line);border-radius:11px;font-size:15px;font-family:inherit;background:var(--surface)}
  .buscador input[type=search]:focus{outline:2px solid var(--teal-med);outline-offset:-1px;border-color:var(--teal-med)}

  /* ---- resultados: una fila por ENTRADA (marca + forma + concentración) ---- */
  .grupo{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px;margin:20px 0 9px}
  .grupo:first-child{margin-top:0}
  .grupo h3{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--teal);font-weight:800;margin:0}
  .grupo .cuenta{font-size:11.5px;color:var(--gris2);font-weight:600}

  .lista{display:flex;flex-direction:column;gap:8px}
  .res{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 15px;cursor:pointer;transition:border-color .12s,box-shadow .12s;display:flex;gap:14px;align-items:flex-start}
  .res:hover{border-color:var(--teal-med);box-shadow:var(--shadow)}
  .res .princ{flex:1;min-width:0}
  .res .marca{font-weight:800;font-size:15px;line-height:1.3;color:var(--ink)}
  /* La variante va pegada a la marca, como en vademecum.es: sin ella las cinco
     entradas de RELIVERAN se ven todas iguales. */
  .res .variante{font-weight:600;color:var(--gris);white-space:normal}
  /* Renglón 2: el principio activo con su concentración. */
  .res .activos{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 6px;margin-top:4px;line-height:1.35}
  .res .droga{background:none;border:0;padding:0;font-family:inherit;font-size:13px;font-weight:700;
              color:var(--teal-deep);cursor:pointer;text-align:left}
  .res .droga:hover{text-decoration:underline}
  .res .dosis{font-size:12.5px;font-weight:600;color:var(--gris);font-variant-numeric:tabular-nums}
  .res .mas{font-size:12px;color:var(--gris2);margin:0 2px}
  .res .vacio-dato{font-size:12.5px;color:var(--gris2);font-style:italic}
  /* Lo que la fuente cortó: se avisa, no se disfraza de droga. */
  .res .incompleto{font-size:12px;font-weight:700;color:#9A6A00;background:#FFF3D6;border-radius:5px;padding:2px 7px}
  /* Renglón 3: el laboratorio titular. */
  .res .lab{font-size:12px;color:var(--gris);margin-top:4px;line-height:1.35}
  /* Sólo aparece cuando se busca por código de barras: cuál de los envases es. */
  .res .envase-cod{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;
    font-weight:700;color:var(--teal-deep);background:var(--agua);border-radius:7px;
    padding:4px 9px;width:fit-content;max-width:100%;line-height:1.3}
  .res .envase-cod svg{width:13px;height:13px;flex:none;opacity:.75}
  .res .envase-cod .mas{font-weight:600;color:var(--gris)}
  /* El envase que ANMAT no publica y sí la lista de precios. Ámbar: es un estado. */
  table.pres td.env .solofte{display:inline-block;margin-top:3px;font-size:10px;font-weight:800;
    letter-spacing:.04em;text-transform:uppercase;color:#8A6100;background:#FFF3D6;
    border-radius:5px;padding:2px 7px;cursor:help}
  .res .lado{flex:none;text-align:right;display:flex;flex-direction:column;gap:3px;align-items:flex-end;padding-top:1px}
  .res .cuantas{font-size:11px;color:var(--gris2);white-space:nowrap}

  .vacio{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--gris);font-size:14px}
  /* Falta clínica a propósito: ámbar, no rojo. No es una falla, es una decisión. */
  .retenido{background:#fff8e6;border:1px solid #f0d68c;border-left:4px solid #e0a800;
    border-radius:10px;padding:13px 15px;font-size:13px;line-height:1.5;color:#6b4e00}
  .retenido b{color:#4a3600}
  /* De qué monografía salió el texto clínico: auditable de un vistazo. */
  .mono-sello{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:14px;
    padding:9px 13px;background:var(--teal-suave,#E6F4F2);border-radius:9px;
    font-size:12.5px;color:var(--teal-deep);cursor:help}
  .mono-sello b{font-weight:800}
  .mono-sello .cod{font-family:ui-monospace,monospace;font-weight:700;font-size:11.5px}
  .mono-sello .pq{margin-left:auto;font-size:11px;color:var(--gris);text-decoration:underline dotted}

  /* ---- FICHA ---- */
  .ficha{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .volver{background:none;border:0;color:var(--teal);font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;padding:0;margin-bottom:12px}
  .volver:hover{color:var(--teal-deep)}

  /* El hero es oscuro en los DOS temas: sus colores no salen de las variables. */
  .f-hero{background:#0C2523;color:#F2F7F6;padding:22px 26px 20px}
  .f-hero .eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#9CBAB6;font-weight:800;margin-bottom:10px}
  .f-hero h2{font-size:25px;line-height:1.06;font-weight:800;letter-spacing:-.02em;margin:0}
  .f-hero .variante-hero{font-size:14.5px;font-weight:700;color:#7FD8D2;margin-top:7px}
  .f-hero .firma{margin-top:14px;padding-top:12px;border-top:1px solid #1D3B38;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
  .f-hero .lab{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .f-hero .lab svg{width:15px;height:15px;color:#9CBAB6;flex:none}
  .f-hero .cert{font-size:11.5px;color:#9CBAB6}
  .f-hero .cert b{color:#F2F7F6;font-family:ui-monospace,monospace}

  .f-cuerpo{padding:20px 26px 24px}
  .f-tit{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:800;margin:0 0 10px}
  .f-tit svg{width:14px;height:14px;flex:none}
  .f-bloque + .f-bloque{border-top:1px solid var(--line);padding-top:22px;margin-top:22px}

  table.tec{width:100%;border-collapse:collapse;table-layout:fixed}
  table.tec col.rot{width:168px}
  table.tec th{text-align:left;vertical-align:top;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--gris2);font-weight:800;padding:8px 14px 8px 0;line-height:1.9;border-top:1px solid var(--line)}
  table.tec td{vertical-align:top;font-size:14.5px;font-weight:700;line-height:1.4;padding:8px 0;border-top:1px solid var(--line);color:var(--ink)}
  table.tec tr:first-child th,table.tec tr:first-child td{border-top:0}
  table.tec td .sub{display:block;font-size:11.5px;font-weight:500;color:var(--gris);margin-top:2px}
  table.tec td.mono{font-family:ui-monospace,monospace}
  table.tec td.interno{font-weight:600;color:var(--gris)}

  .pres-scroll{overflow-x:auto;margin:0 -10px;padding:0 10px}
  table.pres{width:100%;border-collapse:collapse;font-size:12px}
  table.pres th{text-align:left;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--gris2);font-weight:800;padding:0 10px 7px 0;white-space:nowrap;border-bottom:1px solid var(--line)}
  table.pres td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;color:var(--gris)}
  table.pres th:first-child,table.pres td:first-child{padding-left:10px}
  table.pres tr:last-child td{border-bottom:0}
  table.pres td.env{white-space:normal;color:var(--ink);min-width:140px}
  table.pres td.env b{font-size:14px;font-weight:800}
  /* Cómo nombra el mismo envase la otra fuente, y el sello de doble respaldo. */
  table.pres td.env .comercial{display:block;font-size:11.5px;color:var(--gris);margin-top:2px;cursor:help}
  table.pres td.env .doble{display:inline-block;margin-top:3px;font-size:10px;font-weight:800;
    letter-spacing:.04em;color:var(--teal-deep);background:var(--teal-suave,#E6F4F2);
    border-radius:5px;padding:1px 6px;cursor:help}
  a.ir{color:var(--teal);font-weight:800;text-decoration:none}
  a.ir:hover{text-decoration:underline}

  /* Principios activos: nombre a la izquierda, concentración a la derecha y
     guía punteada entre medio, para leer de un vistazo una combinación. */
  ul.ifas{list-style:none;margin:0;padding:0;max-width:56ch}
  ul.ifas li{display:flex;align-items:baseline;gap:10px;padding:5px 0;font-size:14.5px;color:var(--ink)}
  ul.ifas li + li{border-top:1px solid var(--line)}
  ul.ifas li > span:first-child{font-weight:700}
  ul.ifas .guia{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px);min-width:10px}
  ul.ifas .cant{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:800;color:var(--teal-deep)}
  /* El equivalente en % del mismo número: se lee al lado, no reemplaza a la fuente. */
  ul.ifas .equiv{margin-left:9px;font-weight:700;color:var(--gris);cursor:help}
  .res .equiv{margin-left:5px;font-size:12px;font-weight:700;color:var(--gris2)}
  ul.ifas li.falta > span:first-child{color:#9A6A00;font-weight:700}
  ul.ifas li.falta .cant{color:var(--gris2)}
  tr.mia td{background:#E0EFEE}
  tr.mia td:first-child{box-shadow:inset 3px 0 0 var(--teal);border-radius:5px 0 0 5px}
  tr.mia td:last-child{border-radius:0 5px 5px 0}
  .mono-c{font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .hay{font-weight:800;color:var(--teal)}
  .nohay,.nulo{color:var(--gris2)}
  .pie-t{font-size:10.5px;color:var(--gris2);line-height:1.5;margin-top:10px}

  .f-bloque p.prosa{font-size:14.5px;line-height:1.6;color:var(--ink);max-width:66ch;margin:0}
  .f-bloque p.prosa + ul.prosa-lista{margin-top:8px}
  .f-bloque ul.prosa-lista{font-size:14.5px;line-height:1.6;color:var(--ink);max-width:66ch;
    margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .f-bloque ul.prosa-lista li{padding-left:16px;position:relative}
  .f-bloque ul.prosa-lista li::before{content:"";position:absolute;left:2px;top:.62em;
    width:5px;height:5px;border-radius:50%;background:var(--teal);opacity:.45}

  ol.refs{font-size:11.5px;line-height:1.55;margin:0;padding-left:18px;color:var(--gris)}
  ol.refs li{margin-bottom:9px}
  ol.refs .tt{font-weight:800;color:var(--ink)}
  ol.refs .mm{display:block;margin-top:1px}
  ol.refs .cc{display:block;margin-top:2px;color:var(--gris2);font-size:11px}
  .legal{font-size:11px;color:var(--gris2);line-height:1.5;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
  .cargando{text-align:center;color:var(--gris);padding:40px;font-size:14px}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=57"></script>
<script>
/* ================= EyG Core · Vademécum =================
   LA UNIDAD ES LA ENTRADA (marca + forma + concentración), NO LA PRESENTACIÓN.
   Se busca "Tafirol 1 g" y sale UNA fila; adentro están sus 4 presentaciones
   (blíster x8, x24, x50, x80) y cuál de ellas trabajamos. Eso es lo que define
   el certificado ANMAT: un registro = un producto = N presentaciones.

   Y LOS NOMBRES SON LOS DE LA FUENTE, NO LOS NUESTROS.
   "hioscina,n-butilbr." es como la llamamos en Odoo para ordenar alfabéticamente;
   en un vademécum esa droga se llama BUTILESCOPOLAMINA. Se muestra el nombre
   estandarizado (`nombre_estandar`, sacado del título de la monografía ATC) y el
   nombre comercial del registro. El nombre interno sólo aparece cuando no hay
   otro, y ahí se dice que es el nuestro: no lo disfrazamos de oficial.

   NO TOCA ODOO. Sólo lee `catalogo` para el stock del momento; todo lo demás
   vive en las tablas del vademécum, en Supabase.

   Los datos figuran como PROPUESTOS hasta que una persona los apruebe: el
   módulo los muestra igual, con su fuente y su fecha, porque esconder lo no
   revisado haría creer que el producto no tiene información.        */

const ICO = {
  lab:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V8l5-3v16M14 21V10l5 3v8"/><path d="M8 11h.01M8 15h.01"/></svg>',
  caja:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4v10l-9 4-9-4V7z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>',
  mec:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>',
  ind:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12l2 2 4-4"/></svg>',
  adm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8M10 3v4.5L5.5 17A3 3 0 0 0 8.2 21h7.6a3 3 0 0 0 2.7-4L14 7.5V3"/><path d="M7 15h10"/></svg>',
  fte:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5A2.5 2.5 0 0 1 4 20.5z"/></svg>',
  tec:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2M4 8v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M9 12h6"/></svg>',
  mol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="17" r="2.2"/><circle cx="19" cy="17" r="2.2"/><path d="M10.6 6.8 6.4 15.2M13.4 6.8l4.2 8.4M7.2 17h9.6"/></svg>'
};
const esc = s => EYG.esc(String(s==null?"":s));
const num = n => Number(n||0).toLocaleString("es-AR");

let KPIS = null, REGISTROS = [], TERMINO = "", PEDIDO = 0;

/* ---------- búsqueda: producto comercial, laboratorio o droga ----------
   PEDIDO numera las consultas: si la respuesta que llega es de una consulta
   vieja (el usuario ya siguió escribiendo), se descarta. Sin eso, una consulta
   lenta pisa el resultado de la siguiente y la lista "salta". */
async function buscar(q){
  const t = String(q||"").trim();
  if(t.length < 2){ REGISTROS = []; return; }
  const mio = ++PEDIDO;
  const { data, error } = await EYG.supa().rpc("vademecum_buscar", { q:t, limite:60 });
  if(mio !== PEDIDO) return;                     // llegó tarde: ya hay otra en curso
  if(error){ console.error(error); REGISTROS=[]; return; }
  REGISTROS = (data && data.registros) || [];
}

/* ---------- render de la lista ---------- */
/* LA LÍNEA DEL PRINCIPIO ACTIVO, con su concentración pegada.
   Va como texto y no como pastillas: cada resultado son TRES renglones fijos
   —nombre, activo, laboratorio— y así todas las tarjetas miden lo mismo y la
   lista se recorre de un vistazo. La concentración viaja acá y no en el título
   porque en las combinaciones hay una por droga, y porque la marca del registro
   suele traerla ya ("TAFIROL 1G" + "1 G" quedaba duplicado).
   El nombre de cada droga es clickeable: vuelve a buscar por ella. */
/* CÓMO SE PIDE UN MEDICAMENTO, NO CÓMO LO ARCHIVA ANMAT.
   El registro normaliza toda concentración a "por 100 ml": METOC figura como
   "500 MG / 100 ML". Nadie lo pide así — en el mostrador, en el portal y en las
   demás fuentes es "0,5%". Comprobado contra Precios de Medicamentos (Min. Salud),
   que para el mismo producto dice "0.5% gts. x 20 ml": es EL MISMO dato en otra
   notación, no una diferencia de contenido.
   Se muestra el equivalente al lado, sin borrar nunca lo que dice la fuente.
   Es aritmética sobre el propio número del registro, no una interpretación:
     mg/100 ml ÷ 1000 · g/100 ml tal cual · mcg/100 ml ÷ 1.000.000 · mg/ml ÷ 10 */
function porcentaje(cant){
  if(!cant) return null;
  const t = String(cant).toUpperCase().replace(/,/g,".");
  const m = t.match(/^\s*([\d.]+)\s*(MCG|MG|G)\s*\/\s*(100\s*(?:ML|G|GR)|ML)\s*$/);
  if(!m) return null;
  const n = parseFloat(m[1]); if(!isFinite(n)) return null;
  const uni = m[2], den = m[3].replace(/\s+/g,"");
  let pct;
  if(den === "ML")            pct = uni==="G" ? n*100 : uni==="MG" ? n/10 : n/10000;
  else                        pct = uni==="G" ? n     : uni==="MG" ? n/1000 : n/1000000;
  if(!isFinite(pct) || pct <= 0 || pct > 100) return null;
  return (Math.round(pct*10000)/10000).toString().replace(".",",") + "%";
}

/* La fuente trunca la fórmula a ~100 caracteres y cierra con "...". Ese pedazo
   NO se muestra como si fuera una droga: FALGOS quedaba con un quinto principio
   activo llamado "Hidroxido de ma...", que es media palabra, no un componente.
   Se avisa que falta y listo. */
function lineaActivos(comps){
  const c = (comps||[]).filter(Boolean);
  if(!c.length) return '<div class="activos vacio-dato">sin composición cargada</div>';
  const partes = c.map(x => x.incompleto
    ? '<span class="incompleto" title="La fuente cortó el texto acá. Falta completarlo desde el detalle del registro.">falta un componente</span>'
    : `<button class="droga" onclick="porDroga(event,'${esc(x.nombre).replace(/'/g,"&#39;")}')">${esc(x.nombre)}</button>`
      + (x.cantidad ? `<span class="dosis">${esc(x.cantidad)}</span>` : "")
      + (porcentaje(x.cantidad) ? `<span class="equiv">= ${porcentaje(x.cantidad)}</span>` : ""));
  return '<div class="activos">' + partes.join('<span class="mas">+</span>') + '</div>';
}

/* La forma farmacéutica va pegada a la marca — es lo que distingue una entrada
   de otra: las cinco de RELIVERAN sólo se diferencian por forma y dosis.
   La CONCENTRACIÓN no va acá: viaja con su droga, en la pastilla. */
/* Tres renglones, siempre los mismos y en este orden:
     1. nombre comercial + forma farmacéutica  (lo que distingue una entrada)
     2. principio activo + concentración
     3. laboratorio titular
   El nombre queda tal como lo registró ANMAT. En los genéricos eso incluye al
   laboratorio ("DICLOFENAC DENVER FARMA") y parece repetido con el renglón 3,
   pero ese ES el nombre del producto: recortarlo sería llamarlo de otra forma. */
function filaRegistro(r){
  return `<div class="res" onclick="verFicha('${esc(r.clave)}')">
    <div class="princ">
      <div class="marca">${esc(r.nombre)}${r.forma?` <span class="variante">${esc(r.forma)}</span>`:""}</div>
      ${lineaActivos(r.composicion)}

/* ---------- ficha ----------
   Sin numeritos de referencia colgando de cada dato: ensuciaban la lectura.
   Las fuentes van completas al final del bloque, que es donde se consultan. */
/* Para no repetir la presentación cuando las dos fuentes la escriben casi igual. */
function norm2(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"")
  .toLowerCase().replace(/[^a-z0-9]+/g,""); }

/* ACOMODAR EL TEXTO CLÍNICO PARA LEERLO — SIN CAMBIAR NI UNA PALABRA.
   ---------------------------------------------------------------------------
   La fuente entrega la monografía como un párrafo corrido, con las listas metidas
   adentro con guiones. Acá se acomoda para MOSTRARLO; lo guardado en la base no
   se toca, porque tiene que seguir siendo la transcripción fiel de la fuente.

   LO QUE SE ARREGLA: espacios de más; el espacio que quedó ANTES de una coma o un
   punto ("tratamiento ,de forma"); la lista que viene pegada al párrafo, cuando
   hay " - " seguido de MAYÚSCULA; y "Stevens- Johnson" -> "Stevens-Johnson".

   LO QUE NO SE TOCA, y esto importa más:
     · el punto pegado a una mayúscula: parecen 810 errores y no lo son, son las
       abreviaturas de la fuente — I.R. (insuficiencia renal), I.H. (hepática);
     · el guion pegado a la palabra: "cocos gram-", "Na+ K+ Cl-",
       "hipo- o aclorhidria", "bi- o trifasciculares" están BIEN escritos;
     · las 32 palabras que el original parte al cortar el renglón
       ("insufi- ciencia"): unirlas exigiría saber que son una sola palabra, y eso
       es criterio nuestro, no de la fuente.
   Verificado sobre los 4.123 textos: ninguno pierde una letra ni un número. */
function prosa(t){
  if(!t) return "";
  let s = String(t).replace(/\s+/g, " ").trim();
  s = s.replace(/([A-Za-zÁÉÍÓÚÜÑáéíóúüñ])-\s+(?=[A-ZÁÉÍÓÚÑ])/g, "$1-");
  s = s.replace(/\s+([,;:.])/g, "$1");
  s = s.replace(/([A-Za-zÁÉÍÓÚÜÑáéíóúüñ]),(?=[A-Za-zÁÉÍÓÚÜÑáéíóúüñ])/g, "$1, ");
  const partes = s.split(/\s-\s+(?=[A-ZÁÉÍÓÚÑ¿])/);
  if (partes.length < 2) return `<p class="prosa">${esc(s)}</p>`;
  const intro = partes[0].trim();
  return (intro ? `<p class="prosa">${esc(intro)}</p>` : "")
    + `<ul class="prosa-lista">`
    + partes.slice(1).map(x => `<li>${esc(x.trim())}</li>`).join("")
    + `</ul>`;
}

/* EL ENVASE DE LA LISTA DE PRECIOS, ESCRITO COMO EL RESTO.
   ANMAT escribe "BLISTER por 20 UNIDADES"; la lista de precios del Ministerio
   escribe lo mismo en telegrama: "400mg blíst.x50 x10comp.". Los envases que sólo
   publica ella quedaban desparejos al lado de los otros. Acá se acomodan PARA
   MOSTRARLOS y debajo queda el texto tal cual lo publica la fuente: no se pierde
   nada y se puede auditar de un vistazo. La concentración se saca del principio
   porque ya está arriba, en el producto — ANMAT tampoco la repite en este campo. */
const ABREV = {
  blist:"BLISTER", comp:"COMPRIMIDOS", caps:"CAPSULAS", tab:"TABLETAS",
  grag:"GRAGEAS", susp:"SUSPENSION", jbe:"JARABE", sol:"SOLUCION", gts:"GOTAS",
  amp:"AMPOLLAS", fco:"FRASCO", fcoamp:"FRASCO AMPOLLA", iny:"INYECTABLE",
  sob:"SOBRES", sup:"SUPOSITORIOS", ov:"OVULOS", ung:"UNGUENTO", crem:"CREMA",
  pom:"POMADA", par:"PARCHES", rec:"RECUBIERTOS", ran:"RANURADOS",
  efer:"EFERVESCENTES", mast:"MASTICABLES", disp:"DISPERSABLES",
  perfus:"PERFUSION", pol:"POLVO", loc:"LOCION", esp:"ESPUMA", jer:"JERINGA",
};
function pal(s){
  return String(s||"").replace(/\bc\//gi, "con ")
    .split(/[\s.]+/).filter(Boolean)
    .map(w=>{ const k = norm2(w); return ABREV[k] || ABREV[k.replace(/s$/,"")] || w.toUpperCase(); })
    .join(" ").trim();
}
function envaseProlijo(t){
  if(!t) return "";
  let s = String(t).trim().replace(/^\s*[\d.,]+\s*(mg|mcg|g|ui|%)\s*/i, "");
  let m = s.match(/^(.+?)\.?\s*x\s*(\d+)\s+x\s*(\d+)\s*(.+?)\.?$/i);
  if(m) return `${m[2]} ${pal(m[1])} por ${m[3]} ${pal(m[4])}`;
  m = s.match(/^(.+?)\.?\s*x\s*(\d+)\s*(ml|l|g|mg|mcg|ui)?\.?$/i);
  if(m) return m[3] ? `${pal(m[1])} por ${m[2]} ${m[3].toUpperCase()}`
                    : `${m[2]} ${pal(m[1])}`;
  return pal(s);
}

/* POR QUÉ A VECES NO HAY TEXTO CLÍNICO -----------------------------------------
   El dato clínico está guardado POR DROGA y cada producto lo hereda. Con una sola
   vía funciona; con varias, miente: mostrábamos "arritmias ventriculares" —que es
   la lidocaína endovenosa— en la ficha del gel anestésico dental y en las gotas
   oftálmicas. Lo mismo con fluticasona: la indicación de la crema, en el inhalador.
   Hasta que cada texto esté atado a SU vía, no se muestra. Que falte se ve y se
   explica; que diga lo de otra vía no se ve, y acá lo lee un profesional. */

      ATC <b>cambian según la vía</b>: los de la forma inyectable no son los de la crema
      ni los de las gotas. Lo que teníamos corresponde a la droga en general, no a esta
      forma farmacéutica, así que <b>se retiró para no inducir a error</b>. Vuelve en
      cuanto esté atado a la vía que corresponde. Mientras tanto, el prospecto autorizado.
    </div></div>`;
}

/* Ficha de la ENTRADA: marca + forma + concentración, como en vademecum.es.
   Adentro cambia SÓLO la presentación, así que la tabla no repite forma ni fórmula:
   la composición va una vez arriba, con cada droga y su concentración. */
function fichaRegistro(f){
  const R = f.registro||{}, D = f.droga||{}, her = f.de_la_droga||{}, pres = f.presentaciones||[];
  const S = f.segunda_fuente||{};   // lo que aportó el cruce por GTIN, ver bloque de fuentes

  /* Cada droga con su concentración, una por renglón y con guía punteada: es
     lo que hace legible una combinación de tres o cuatro principios activos. */
  const comp = R.composicion||[];
  const cortada = comp.some(x=>x && x.incompleto);
  const composicion = !comp.length ? "" :
    `<ul class="ifas">${comp.map(x=> x.incompleto
       ? `<li class="falta"><span>Falta un componente</span>
          <span class="guia"></span><span class="cant">—</span></li>`
       : `<li><span>${esc(x.nombre)}</span>
          <span class="guia"></span><span class="cant">${esc(x.cantidad||"—")}${
            porcentaje(x.cantidad)
              ? `<span class="equiv" title="Es el mismo número que declara el registro, escrito como se pide en el mostrador. El registro normaliza a &quot;por 100 ml&quot;.">= ${porcentaje(x.cantidad)}</span>`
              : ""}</span></li>`).join("")}</ul>`
    + (comp.some(x=>porcentaje(x.cantidad)) ? `<p class="pie-t">Las dos cifras son <b>el mismo dato</b>:
         el Vademécum Nacional (ANMAT) normaliza toda concentración a <b>por 100 ml</b>, y el porcentaje
         es esa misma cifra en la notación que se usa en el mostrador, en el prospecto y en Precios de
         Medicamentos del Ministerio de Salud. Se muestran las dos para que se pueda buscar por
         cualquiera de las dos y para no pisar lo que dice el registro.</p>` : "")
    + (cortada ? `<p class="pie-t">El Vademécum Nacional muestra esta fórmula recortada en su listado
         (la corta a 100 caracteres). Falta completarla desde el detalle del registro y cruzarla con las
         demás fuentes: lo que se ve arriba está verificado, lo que falta está señalado.</p>` : "");

  const filasPres = pres.length ? pres.map(p=>{
    const mia = p.nuestra;
    const stk = mia ? Number(mia.stock)||0 : 0;
    return `<tr class="${mia?"mia":""}">
      <td class="env"><b>${esc(
        /* Si el envase sólo lo publica la lista de precios, su texto viene en
           telegrama y se acomoda para que lea como los de ANMAT. El original
           queda abajo, sin recortar. */
        p.contraste === 'solo precios' ? envaseProlijo(p.presentacion) : (p.presentacion||"—"))}</b>${
        /* Cómo nombra el mismo envase la otra fuente oficial: "0.5% gts.x 20 ml".
           Es la notación con la que se pide, y no repite si es igual. */
        p.contraste === 'solo precios'
          ? `<span class="comercial" title="Tal cual lo publica Precios de Medicamentos (Min. Salud). Arriba está acomodado para leerlo; acá está el texto original.">${esc(p.presentacion)}</span>`
        : p.comercial && norm2(p.comercial) !== norm2(p.presentacion)
          ? `<span class="comercial" title="Así lo nombra Precios de Medicamentos (Min. Salud), cruzado por código de barras">${esc(p.comercial)}</span>` : ""}${
        p.contraste === 'coincide'
          ? `<span class="doble" title="Este envase existe en las dos fuentes oficiales, cruzado por su código de barras">✓ dos fuentes</span>`
        : p.contraste === 'solo precios'
          ? `<span class="solofte" title="ANMAT no publica este envase. Lo publica Precios de Medicamentos del Ministerio de Salud, con precio vigente. Que no figure en ese listado no lo hace ilegal.">sólo lista de precios</span>` : ""}</td>
      <td class="mono-c">${p.troquel?esc(p.troquel):'<span class="nulo">—</span>'}</td>
      <td class="mono-c">${p.gtin?esc(p.gtin):'<span class="nulo">—</span>'}</td>
      <td>${p.cobertura_pami?esc(p.cobertura_pami):'<span class="nulo">—</span>'}</td>
      <td>${!mia ? '<span class="nohay">No disponible</span>'
              : (mia.url
                  ? `<a class="ir" href="${esc(mia.url)}" target="_blank" rel="noopener" title="Verlo en el portal de EyG">${stk>0?"Disponible":"Sin stock"} <span aria-hidden="true">→</span></a>`
                  : `<span class="hay">${stk>0?"Disponible":"Sin stock"}</span>`)}</td>
    </tr>`;
  }).join("") : `<tr><td colspan="5" class="nulo" style="padding:14px 0">Sin presentaciones cargadas.</td></tr>`;

  return `
    <button class="volver" onclick="volver()">‹ Volver a la búsqueda</button>
    <div class="ficha">
      <div class="f-hero">
        <div class="eyebrow">Vademécum · Droguería EyG</div>
        <h2>${esc(R.nombre||"—")}</h2>
        ${(()=>{ /* La concentración va en el título, como en cualquier vademécum:
                    "METOC · Solucion" no distingue nada. Sólo cuando hay UNA sola
                    droga y su equivalente en % es calculable; con combinaciones se
                    deja el nombre solo, que la fórmula está abajo. */
           const c = comp.length===1 && !comp[0].incompleto ? porcentaje(comp[0].cantidad) : null;
           const partes = [R.forma?esc(R.forma):null, c].filter(Boolean);
           return partes.length ? `<div class="variante-hero">${partes.join(" · ")}</div>` : "";
        })()}
        <div class="firma">
          ${R.laboratorio?`<span class="lab">${ICO.lab} ${esc(R.laboratorio)}</span>`:""}
        </div>
      </div>
      <div class="f-cuerpo">
        ${composicion?`<div class="f-bloque">
          <div class="f-tit">${ICO.mol} Principios activos</div>
          ${composicion}
        </div>`:""}

        ${/* POR QUÉ ESTA FICHA TIENE MENOS DATOS QUE LAS DEMÁS.
              Hay 634 productos que se venden en el país y que el listado del
              Vademécum Nacional no publica. Entraron por la lista de precios del
              Ministerio, que no trae certificado ni fórmula autorizada. Sin este
              aviso, la ficha parece incompleta por error nuestro — y no lo es.
              Ámbar, como el resto de los avisos: es un estado, no una falla. */""}
        ${!R.certificado ? `<div class="f-bloque"><div class="retenido">
          <b>Este producto no figura en el listado del Vademécum Nacional (ANMAT).</b>
          Está publicado en <b>Precios de Medicamentos del Ministerio de Salud</b>, con
          precio vigente, y por eso está acá: se vende legalmente. Esa fuente no publica
          el número de certificado ni la fórmula autorizada, así que esos dos datos
          aparecen vacíos. No es un dato que nos falte cargar: es un dato que la fuente
          no da.
        </div></div>` : ""}
        <div class="f-bloque">
          <div class="f-tit">${ICO.tec} Ficha técnica</div>
          <table class="tec"><colgroup><col class="rot"><col></colgroup><tbody>
            ${filaDroga(D)}
            ${filaDato("Acción terapéutica", her.accion_terapeutica,
                her.accion_terapeutica && her.accion_terapeutica.soporte
                  ? `${her.accion_terapeutica.soporte} de ${her.accion_terapeutica.soporte_total} productos de la fuente la declaran` : "")}
            ${her.atc?`<tr><th>Código ATC</th><td class="mono">${esc(her.atc.valor)}${her.clase_atc?`<span class="sub">${esc(her.clase_atc.valor)}</span>`:""}</td></tr>`:""}
            ${R.certificado?`<tr><th>Certificado ANMAT</th><td class="mono">${esc(R.certificado)}</td></tr>`:""}
            ${/* Los tres campos que el listado del Vademécum Nacional NO publica y que
                  aporta Precios de Medicamentos, cruzado por código de barras. Van
                  rotulados con su fuente porque vienen de otro registro. */""}
            ${/* La vía la declara ANMAT en el detalle del registro; si no la tenemos,
                  se usa la del Ministerio. "No Clasificada" no se muestra: no dice nada. */""}
            ${S.via_anmat
              ? `<tr><th>Vía de administración</th><td>${esc(S.via_anmat)}<span class="sub">Vademécum Nacional (ANMAT)</span></td></tr>`
              : (S.via && !/no clasificada/i.test(S.via)
                 ? `<tr><th>Vía de administración</th><td>${esc(S.via)}<span class="sub">Precios de Medicamentos (Min. Salud)</span></td></tr>` : "")}
            ${S.tipo_venta?`<tr><th>Condición de venta</th><td>${esc(S.tipo_venta)}<span class="sub">Precios de Medicamentos (Min. Salud)</span></td></tr>`:""}
          </tbody></table>
        </div>

        <div class="f-bloque">
          <div class="f-tit">${ICO.caja} Presentaciones autorizadas</div>
          <div class="pres-scroll"><table class="pres">
            <thead><tr><th>Presentación</th><th>Troquel</th><th>GTIN</th><th>PAMI</th><th>En EyG</th></tr></thead>
            <tbody>${filasPres}</tbody>
          </table></div>
          ${pres.length>1?`<p class="pie-t">Las ${num(pres.length)} son la misma fórmula: cambian el contenido, el troquel y la cobertura.</p>`:""}
        </div>

        ${(her.indicaciones||her.mecanismo_accion||her.modo_administracion) ? selloMonografia(f.monografia) : ""}
        ${bloquesClinicos(her)}
        ${avisoClinicaRetenida(f.clinica_retenida)}
        ${bloqueFuentes()}
      </div>
    </div>`;
}

/* El campo lleva id y se engancha por oninput: EYG.buscador ya trae debounce
   y devuelve foco+cursor despues del innerHTML. Sin eso, a la segunda letra
   el input se pierde y no se puede seguir escribiendo. */
window.buscarVade = EYG.buscador(async v=>{ TERMINO=v; await buscar(v); pintarLista(); });

/* EL LECTOR DE CÓDIGO DE BARRAS
   ---------------------------------------------------------------------------
   Un lector USB no es un aparato raro: se comporta como un TECLADO. Cuando pasás
   un envase, "tipea" el código y manda Enter. Si el cursor estaba en el buscador,
   ya funcionaba solo. El problema es el mostrador: nadie va a hacer clic en el
   campo antes de cada escaneo, y si el foco está en cualquier otro lado el código
   se pierde en el aire.

   CÓMO SE DISTINGUE UN LECTOR DE UNA PERSONA: por la velocidad. Una persona no
   escribe doce dígitos con menos de 35 ms entre tecla y tecla; el lector sí. Si
   las teclas vienen lentas, es alguien tecleando y no se toca nada.

   LO QUE NO SE PISA:
     · si estás escribiendo en OTRO campo (un filtro, una nota), no se interviene;
     · si ya estás en el buscador, el lector escribe ahí solo y esto no hace falta;
     · sólo se acepta lo que parece un código: 6 dígitos o más, sin letras.
   Todo lo demás sigue igual: esto agrega un camino, no cambia ninguno. */
(function lectorDeCodigos(){
  let buf = "", ultima = 0;
  const RAPIDO = 35;     // ms entre teclas: mas que esto es una persona
  const MINIMO = 6;      // menos digitos que esto no es un codigo

  document.addEventListener("keydown", (ev) => {
    const campo = document.getElementById("q");   // null si hay una ficha abierta
    const foco  = document.activeElement;
    const enOtroCampo = foco && foco !== campo &&
      (/^(INPUT|TEXTAREA|SELECT)$/.test(foco.tagName || "") || foco.isContentEditable);
    if (enOtroCampo) return;                      // esta escribiendo en otro lado

    const ahora = Date.now();
    const seguido = ahora - ultima < RAPIDO;
    ultima = ahora;

    if (ev.key === "Enter") {
      const cod = buf; buf = "";
      if (cod.length < MINIMO) return;
      ev.preventDefault();
      /* Si estaba mirando una ficha, se vuelve a la lista: en el mostrador se
         escanea un envase atras de otro sin tocar la pantalla. */
      TERMINO = cod;
      if (!campo) volver();
      const c = document.getElementById("q");
      if (c) { c.value = cod; c.focus(); }
      buscarVade(cod);
      return;
    }
    if (!/^[0-9]$/.test(ev.key)) { buf = ""; return; }
    buf = seguido ? buf + ev.key : ev.key;
  });
})();

window.volver = ()=> pintarShell();

/* Los KPI salen de `vademecum_avance`, que aplica el MISMO filtro que el
   buscador. Contarlos acá con selects sueltos daría un vademécum inflado:
   la tabla de drogas tiene 2.304 filas, pero muchas son etiquetas de rubro.
   Además del contenido trae CUÁNTO SE BARRIÓ, que es lo que se avisa arriba:
   mientras el vademécum se está cargando, no encontrar algo NO significa que no
   exista, y quien consulta tiene que saberlo. */
async function cargarKpis(){
  const { data, error } = await EYG.supa().rpc("vademecum_avance");
  if(error){ console.error(error); return; }
  KPIS = data;
}

async function arrancar(){
  try{ await cargarKpis(); }catch(e){ console.error(e); }
  pintarBusqueda();
}
