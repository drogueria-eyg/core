<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oportunidades y Ofertas · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<style>
  .intro{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 18px;box-shadow:var(--shadow);margin-bottom:16px;font-size:13.5px;color:var(--gris);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .intro b{color:var(--ink)}
  .intro .grow{flex:1;min-width:200px}
  .btn{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:9px 15px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .btn:hover{background:var(--teal-deep)} .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--gris)} .btn.ghost:hover{border-color:var(--teal-med)}
  .btn.warn{background:#fff;border:1px solid #f0b8b5;color:#b0322f} .btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
  h2.sec{font-size:16px;font-weight:800;margin:22px 2px 12px;display:flex;align-items:center;gap:9px}
  h2.sec .n{background:var(--teal);color:#fff;font-size:12px;font-weight:800;border-radius:20px;padding:2px 9px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:15px 16px;position:relative}
  .card.opo{border-left:4px solid var(--gold)}
  .card.oferta{border-left:4px solid var(--teal)}
  .card.vencida{opacity:.6}
  .card .tag{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:3px 8px;border-radius:20px}
  .tag.g{background:#fbf0d6;color:#9a6a0b} .tag.t{background:var(--agua);color:var(--teal-deep)} .tag.v{background:#eee;color:#888}
  .card h3{font-size:14.5px;font-weight:800;line-height:1.3;padding-right:70px}
  .card .meta{font-size:11.5px;color:var(--gris2);margin-top:2px}
  .drop{display:flex;align-items:baseline;gap:8px;margin:10px 0}
  .drop .a{color:var(--gris2);text-decoration:line-through;font-size:13px}
  .drop .b{color:var(--m-ok,#1E7D46);font-weight:800;font-size:17px}
  .drop .pc{background:#e7f6ec;color:#1E7D46;font-weight:800;font-size:12px;border-radius:20px;padding:2px 8px}
  .kv{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--gris);margin:8px 0}
  .kv b{color:var(--ink)}
  .acts{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
  .empty{padding:30px;text-align:center;color:var(--gris);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(14,31,29,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .modal .mh h3{font-size:17px;font-weight:800}
  .modal .mb{padding:18px 20px;display:flex;flex-direction:column;gap:13px}
  .modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
  .fld label{display:block;font-size:12px;font-weight:700;color:var(--gris);margin-bottom:4px}
  .fld input,.fld textarea,.fld select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit}
  .fld .row2{display:flex;gap:10px} .fld .row2>div{flex:1}
  .hint{font-size:11px;color:var(--gris2);margin-top:3px}
  .prodpick{border:1px solid var(--line);border-radius:9px;padding:8px;max-height:170px;overflow:auto}
  .prodpick .r{display:flex;justify-content:space-between;align-items:center;padding:5px 6px;font-size:12.5px;border-radius:6px;cursor:pointer}
  .prodpick .r:hover{background:var(--bg)}
  .chosen{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chosen span{background:var(--agua);color:var(--teal-deep);font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px;display:inline-flex;gap:6px;align-items:center}
  .chosen span b{cursor:pointer}
  .x{cursor:pointer;color:var(--gris2)} .x:hover{color:var(--m-bad,#b0322f)}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 26px rgba(0,0,0,.25);z-index:9999;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js"></script>
<script>
/* ============ EyG Core · Inventario · Oportunidades y Ofertas ============ */
const LANG={context:{lang:"es_AR"}};
const LISTA=3;
const money=n=>"$"+Math.round(n||0).toLocaleString("es-AR");
const esc=s=>EYG.esc(s);
const hoy=()=>new Date().toISOString().slice(0,10);
function masDias(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function fmtF(s){ if(!s) return ""; const [y,m,d]=String(s).slice(0,10).split("-"); return d+"/"+m; }
let OPOS=[], OFERTAS=[], UMBRAL=0.10;

async function getParam(k,def){ const r=await EYG.rpc("ir.config_parameter","get_param",[k]); return (r===false||r==null)?def:r; }
async function setParam(k,v){ return EYG.rpc("ir.config_parameter","set_param",[k,String(v)]); }

async function cargar(){
  const cont=document.getElementById("cont"); cont.innerHTML='<div class="spin"></div>';
  try{
    UMBRAL=parseFloat(await getParam("eyg.oferta.umbral","0.10"))||0.10;
    const ofRaw=await getParam("eyg.ofertas","[]");
    try{ OFERTAS=JSON.parse(ofRaw||"[]"); }catch(e){ OFERTAS=[]; }
    // oportunidades detectadas
    const prods=await EYG.rpc("product.product","search_read",
      [[["x_oportunidad","=",true],["active","=",true]]],
      Object.assign({fields:["id","default_code","name","categ_id","qty_available","x_oportunidad_costo_ant","x_oportunidad_fecha","product_tmpl_id"], limit:500}, LANG));
    // precio de venta actual (escalera base = min_quantity 1) de cada uno
    const tmpls=prods.map(p=>p.product_tmpl_id&&p.product_tmpl_id[0]).filter(Boolean);
    const pit = tmpls.length? await EYG.rpc("product.pricelist.item","search_read",
      [[["pricelist_id","=",LISTA],["applied_on","=","1_product"],["product_tmpl_id","in",tmpls]]],
      {fields:["product_tmpl_id","min_quantity","fixed_price"], limit:20000}) : [];
    const baseT={};
    for(const it of pit){ const t=it.product_tmpl_id[0]; if(!baseT[t]||it.min_quantity<baseT[t].q) baseT[t]={q:it.min_quantity,p:it.fixed_price}; }
    OPOS=prods.map(p=>{
      const t=p.product_tmpl_id[0]; const base=baseT[t]?baseT[t].p:0;
      const costoAnt=p.x_oportunidad_costo_ant||0; const costoAhora=base>0?base/1.8:0;
      return { id:p.id, tmpl:t, sku:p.default_code||"", nombre:p.name||"",
        cat:(p.categ_id?p.categ_id[1]:"").replace("ALL / HOSPITALARIOS / ","").replace("ALL / ",""),
        stock:p.qty_available||0, precio:base, costoAnt, costoAhora, fecha:p.x_oportunidad_fecha };
    });
    render();
  }catch(e){ cont.innerHTML='<div class="empty">No pude leer los datos: '+esc(e.message)+'</div>'; }
}

function vigente(o){ return (!o.hasta || o.hasta>=hoy()); }

function render(){
  const cont=document.getElementById("cont");
  OFERTAS.forEach(o=>o._venc=!vigente(o));
  const activas=OFERTAS.filter(o=>!o._venc), vencidas=OFERTAS.filter(o=>o._venc);
  const opoCards = OPOS.length ? OPOS.map(cardOpo).join("") : '<div class="empty">No hay oportunidades nuevas. Cuando un costo baje '+Math.round(UMBRAL*100)+'% o más, aparece acá.</div>';
  const ofCards = (activas.length||vencidas.length) ? activas.concat(vencidas).map(cardOferta).join("") : '<div class="empty">Todavía no hay ofertas. Confirmá una oportunidad o agregá una manual.</div>';
  cont.innerHTML=`
    <div class="intro">
      <div class="grow"><b>Oportunidades y ofertas.</b> Cuando un costo baja, el sistema lo detecta como oportunidad. Confirmala (elegí precio, stock y vigencia) y va a la tarjeta <b>“Combos y ofertas de la semana”</b> de los comerciales. También podés agregar ofertas o combos a mano.</div>
      <button class="btn ghost" onclick="abrirConfig()">⚙️ Configuración</button>
      <button class="btn" onclick="abrirOferta(null)">+ Oferta / combo manual</button>
    </div>
    <h2 class="sec">💡 Oportunidades detectadas <span class="n">${OPOS.length}</span></h2>
    <div class="grid">${opoCards}</div>
    <h2 class="sec">🏷️ Ofertas y combos activos <span class="n">${activas.length}</span></h2>
    <div class="grid">${ofCards}</div>`;
}

function cardOpo(o){
  const pc=o.costoAnt>0?Math.round((1-o.costoAhora/o.costoAnt)*100):0;
  return `<div class="card opo"><span class="tag g">Oportunidad</span>
    <h3>${esc(o.nombre)}</h3>
    <div class="meta">${esc(o.sku)} · ${esc(o.cat)}</div>
    <div class="drop"><span>Costo</span> <span class="a">${money(o.costoAnt)}</span> → <span class="b">${money(o.costoAhora)}</span> <span class="pc">−${pc}%</span></div>
    <div class="kv"><span>Precio venta: <b>${money(o.precio)}</b></span><span>Stock: <b>${o.stock}</b></span></div>
    <div class="acts">
      <button class="btn sm" onclick="ofertarDesde(${o.id})">Crear oferta →</button>
      <button class="btn ghost sm" onclick="descartar(${o.id})">Descartar</button>
    </div></div>`;
}
function cardOferta(o){
  const items=(o.items||[]).map(i=>i.nombre).join(" + ");
  return `<div class="card oferta ${o._venc?'vencida':''}"><span class="tag ${o._venc?'v':'t'}">${o.tipo==='combo'?'Combo':'Oferta'}${o._venc?' · vencida':''}</span>
    <h3>${esc(o.titulo||items)}</h3>
    <div class="meta">${esc(items)}</div>
    <div class="drop">${o.precioAntes?`<span class="a">${money(o.precioAntes)}</span> →`:''} <span class="b">${money(o.precio)}</span></div>
    <div class="kv">
      <span>Stock ofertado: <b>${o.stock||'—'}</b></span>
      <span>Vigencia: <b>${o.hasta?('hasta '+fmtF(o.hasta)):'sin límite'}</b></span>
    </div>
    ${o.nota?`<div class="meta">📝 ${esc(o.nota)}</div>`:''}
    <div class="acts">
      <button class="btn ghost sm" onclick="abrirOferta('${o.id}')">Editar</button>
      <button class="btn warn sm" onclick="eliminarOferta('${o.id}')">Eliminar</button>
    </div></div>`;
}

/* ============ crear/editar oferta (modal) ============ */
let FORM=null;
function ofertarDesde(pid){
  const o=OPOS.find(x=>x.id===pid); if(!o) return;
  FORM={ id:null, tipo:"oferta", titulo:o.nombre, items:[{id:o.id,sku:o.sku,nombre:o.nombre}],
    precio:o.precio, precioAntes:o.precio, stock:o.stock, hasta:masDias(7), nota:"", _desdeOpo:pid };
  modalOferta();
}
function abrirOferta(oid){
  if(oid){ const o=OFERTAS.find(x=>x.id===oid); FORM=JSON.parse(JSON.stringify(o)); }
  else { FORM={ id:null, tipo:"oferta", titulo:"", items:[], precio:0, precioAntes:0, stock:0, hasta:masDias(7), nota:"" }; }
  modalOferta();
}
function modalOferta(){
  const f=FORM;
  const combo=f.tipo==="combo";
  const chosen=(f.items||[]).map(i=>`<span>${esc(i.nombre)} <b onclick="quitarItem(${i.id})">✕</b></span>`).join("");
  document.getElementById("modal").innerHTML=`<div class="scrim" onclick="if(event.target===this)cerrarModal()"><div class="modal">
    <div class="mh"><h3>${f.id?'Editar':'Nueva'} ${combo?'combo':'oferta'}</h3></div>
    <div class="mb">
      <div class="fld"><label>Tipo</label><select id="f-tipo" onchange="FORM.tipo=this.value;modalOferta()">
        <option value="oferta" ${!combo?'selected':''}>Oferta (1 producto)</option>
        <option value="combo" ${combo?'selected':''}>Combo (varios productos)</option></select></div>
      <div class="fld"><label>Título</label><input id="f-tit" value="${esc(f.titulo||'')}" placeholder="Ej: Súper oferta Ibuprofeno"></div>
      ${combo?`
      <div class="fld"><label>Productos del combo</label>
        <input id="f-buscar" placeholder="Buscar por nombre o SKU…" oninput="buscarProd(this.value)">
        <div class="prodpick" id="f-pick" style="display:none"></div>
        <div class="chosen">${chosen||'<span style="background:none;color:var(--gris2)">Ninguno todavía</span>'}</div>
      </div>`:`
      <div class="fld"><label>Producto</label>
        ${f.items.length?`<div class="chosen">${chosen}</div>`:`<input id="f-buscar" placeholder="Buscar por nombre o SKU…" oninput="buscarProd(this.value)"><div class="prodpick" id="f-pick" style="display:none"></div>`}
      </div>`}
      <div class="fld"><div class="row2">
        <div><label>Precio de oferta</label><input id="f-precio" type="number" step="0.01" value="${f.precio||''}"></div>
        <div><label>Precio de lista (antes)</label><input id="f-antes" type="number" step="0.01" value="${f.precioAntes||''}"></div>
      </div><div class="hint">El “antes” se muestra tachado para resaltar el ahorro.</div></div>
      <div class="fld"><div class="row2">
        <div><label>Stock a ofertar</label><input id="f-stock" type="number" value="${f.stock||''}" placeholder="parte del stock"></div>
        <div><label>Vigencia hasta</label><input id="f-hasta" type="date" value="${f.hasta||''}"></div>
      </div></div>
      <div class="fld"><label>Nota (opcional)</label><textarea id="f-nota" rows="2" placeholder="Condiciones, aclaraciones…">${esc(f.nota||'')}</textarea></div>
    </div>
    <div class="mf"><button class="btn ghost" onclick="cerrarModal()">Cancelar</button><button class="btn" onclick="guardarOferta()">Guardar oferta</button></div>
  </div></div>`;
}
window.cerrarModal=()=>{ document.getElementById("modal").innerHTML=""; };
window.quitarItem=id=>{ FORM.items=FORM.items.filter(i=>i.id!==id); modalOferta(); };
let tBus=null;
window.buscarProd=q=>{ clearTimeout(tBus); tBus=setTimeout(async()=>{
  const pick=document.getElementById("f-pick"); if(!pick) return;
  if(!q||q.length<2){ pick.style.display="none"; return; }
  const r=await EYG.rpc("product.product","search_read",[["|",["name","ilike",q],["default_code","ilike",q]],["id","default_code","name"]],Object.assign({limit:12},LANG));
  pick.style.display="block";
  pick.innerHTML=r.map(x=>`<div class="r" onclick="addItem(${x.id},'${esc((x.default_code||'')).replace(/'/g,'')}','${esc((x.name||'').slice(0,60)).replace(/'/g,'')}')"><span>${esc(x.name)}</span><span style="color:var(--gris2)">${esc(x.default_code||'')}</span></div>`).join("")||'<div class="r">Sin resultados</div>';
},250); };
window.addItem=(id,sku,nombre)=>{ if(!FORM.items.some(i=>i.id===id)){ if(FORM.tipo==='oferta') FORM.items=[]; FORM.items.push({id,sku,nombre}); } modalOferta(); };
async function guardarOferta(){
  const g=id=>document.getElementById(id);
  FORM.titulo=g("f-tit").value.trim();
  FORM.precio=parseFloat(g("f-precio").value)||0;
  FORM.precioAntes=parseFloat(g("f-antes").value)||0;
  FORM.stock=parseFloat(g("f-stock").value)||0;
  FORM.hasta=g("f-hasta").value||"";
  FORM.nota=g("f-nota").value.trim();
  if(!FORM.items.length){ toast("Elegí al menos un producto"); return; }
  if(!(FORM.precio>0)){ toast("Poné el precio de oferta"); return; }
  if(!FORM.titulo) FORM.titulo=FORM.items.map(i=>i.nombre).join(" + ");
  if(!FORM.id){ FORM.id="of"+Date.now(); FORM.creada=new Date().toISOString().slice(0,19).replace("T"," "); OFERTAS.push(FORM); }
  else { const i=OFERTAS.findIndex(o=>o.id===FORM.id); if(i>=0) OFERTAS[i]=FORM; }
  const desdeOpo=FORM._desdeOpo; delete FORM._venc;
  try{
    await setParam("eyg.ofertas", JSON.stringify(OFERTAS.map(o=>{const c={...o};delete c._venc;delete c._desdeOpo;return c;})));
    if(desdeOpo){ await EYG.rpc("product.product","write",[[desdeOpo],{x_oportunidad:false}],LANG); OPOS=OPOS.filter(x=>x.id!==desdeOpo); }
    cerrarModal(); toast("Oferta guardada ✓ — ya aparece en el panel de comerciales", true); render();
  }catch(e){ toast("Error: "+e.message); }
}
window.eliminarOferta=async id=>{
  if(!confirm("¿Eliminar esta oferta?")) return;
  OFERTAS=OFERTAS.filter(o=>o.id!==id);
  try{ await setParam("eyg.ofertas", JSON.stringify(OFERTAS)); toast("Eliminada ✓"); render(); }catch(e){ toast("Error: "+e.message); }
};
window.descartar=async pid=>{
  try{ await EYG.rpc("product.product","write",[[pid],{x_oportunidad:false}],LANG); OPOS=OPOS.filter(x=>x.id!==pid); toast("Descartada"); render(); }catch(e){ toast("Error: "+e.message); }
};
/* ============ config ============ */
function abrirConfig(){
  document.getElementById("modal").innerHTML=`<div class="scrim" onclick="if(event.target===this)cerrarModal()"><div class="modal">
    <div class="mh"><h3>⚙️ Configuración</h3></div>
    <div class="mb"><div class="fld"><label>Umbral de baja para detectar oportunidad (%)</label>
      <input id="c-umbral" type="number" min="1" max="90" value="${Math.round(UMBRAL*100)}">
      <div class="hint">Cuando el costo de un producto baja este % o más (vs. el anterior), se marca como oportunidad. El cron lo aplica en cada corrida.</div></div></div>
    <div class="mf"><button class="btn ghost" onclick="cerrarModal()">Cancelar</button><button class="btn" onclick="guardarConfig()">Guardar</button></div>
  </div></div>`;
}
async function guardarConfig(){
  const v=parseFloat(document.getElementById("c-umbral").value); if(!(v>0&&v<90)){ toast("Poné un % entre 1 y 89"); return; }
  UMBRAL=v/100;
  try{ await setParam("eyg.oferta.umbral", UMBRAL.toFixed(4)); cerrarModal(); toast("Configuración guardada ✓"); render(); }catch(e){ toast("Error: "+e.message); }
}
let tT=null;
function toast(m,win){ let t=document.getElementById("toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t);} t.textContent=m; t.className="toast show"; clearTimeout(tT); tT=setTimeout(()=>t.className="toast",3000); }

EYG.requireAuth(["inventario"], perfil=>{
  document.body.innerHTML = EYG.layout(perfil,"oportunidades",'<div id="cont"></div><div id="modal"></div>',"Oportunidades y Ofertas");
  cargar();
});
</script>
</body>
</html>
