<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oportunidades y Ofertas · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<style>
  .intro{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 18px;box-shadow:var(--shadow);margin-bottom:16px;font-size:13.5px;color:var(--gris);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .intro b{color:var(--ink)}
  .intro .grow{flex:1;min-width:200px}
  /* ===== buscador: mismo formato que el resto del Core (.toolbar + .search + lupa) ===== */
  .toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}
  .search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px;box-shadow:var(--shadow)}
  .search:focus-within{border-color:var(--teal)}
  .search svg{width:17px;height:17px;color:var(--gris2);flex-shrink:0}
  .search input{border:0;background:none;outline:none;font-family:inherit;font-size:14px;width:100%;color:var(--ink)}
  .search .clr{cursor:pointer;color:var(--gris2);font-size:15px;font-weight:800;line-height:1;padding:0 3px}
  .search .clr:hover{color:var(--ink)}
  .qhit{font-size:12.5px;font-weight:700;color:var(--teal-deep);background:var(--agua);border-radius:20px;padding:7px 13px;white-space:nowrap}
  .qhit.cero{color:#b0322f;background:#fbe4e3}
  .btn{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:9px 15px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .btn:hover{background:var(--teal-deep)} .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--gris)} .btn.ghost:hover{border-color:var(--teal-med)}
  .btn.warn{background:#fff;border:1px solid #f0b8b5;color:#b0322f} .btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
  h2.sec{font-size:16px;font-weight:800;margin:22px 2px 12px;display:flex;align-items:center;gap:9px}
  h2.sec .n{background:var(--teal);color:#fff;font-size:12px;font-weight:800;border-radius:20px;padding:2px 9px}
  /* ===== PANEL DE MÉTRICAS (mismo patrón que Facturación/Pendientes) ===== */
  .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-bottom:14px}
  @media(max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px;box-shadow:var(--shadow);text-align:left;font-family:inherit;cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative;min-width:0}
  .kpi:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(6,65,62,.09),0 12px 30px rgba(6,65,62,.10)}
  .kpi.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--agua)}
  .kpi .l{font-size:10px;color:var(--gris);font-weight:800;text-transform:uppercase;letter-spacing:.4px;line-height:1.3}
  .kpi .n{font-size:clamp(17px,1.6vw,23px);font-weight:800;line-height:1.15;margin-top:5px}
  .kpi .s{font-size:10.5px;color:var(--gris2);font-weight:600;margin-top:2px;line-height:1.4}
  .kpi.alerta{border-color:#F0C9C4;background:#FFF9F8} .kpi.alerta .n{color:var(--bad)}
  .kpi.bien .n{color:var(--ok)} .kpi.oro .n{color:var(--gold)} .kpi.apagado .n{color:var(--gris2)}
  /* ===== FILAS (una por ítem, se leen scroleando; columnas alineadas) ===== */
  .lista{display:flex;flex-direction:column;gap:7px}
  .fila{background:var(--surface);border:1px solid var(--line);border-radius:11px;position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:10px 14px 10px 17px;flex-wrap:wrap}
  .fila::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gris2)}
  .fila.opo::before{background:var(--gold)} .fila.stk::before{background:var(--coral)}
  .fila.of::before{background:var(--teal)} .fila.mala::before{background:var(--bad)}
  .fila.gris{opacity:.62} .fila.gris::before{background:#B9C5C3}
  .fila:hover{background:#FAFDFC}
  .fmain{flex:1;min-width:210px}
  .fnom{font-size:13.5px;font-weight:800;line-height:1.3}
  .fmeta{font-size:11.5px;color:var(--gris2);font-weight:600;margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .fnums{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .fnum{text-align:right;min-width:74px}
  .fnum .k{display:block;font-size:9.5px;color:var(--gris2);font-weight:800;text-transform:uppercase;letter-spacing:.3px}
  .fnum .v{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  .fnum .v.tach{text-decoration:line-through;color:var(--gris2);font-weight:600}
  .fnum .v.baja{color:var(--ok)}
  .fmrg{min-width:86px;text-align:right;border-radius:8px;padding:5px 9px;font-variant-numeric:tabular-nums}
  .fmrg .k{display:block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;opacity:.8}
  .fmrg .v{font-size:14px;font-weight:800;white-space:nowrap}
  .fmrg.ok{background:var(--okbg);color:var(--ok)} .fmrg.bajo{background:var(--warnbg);color:var(--warn)}
  .fmrg.neg{background:var(--badbg);color:var(--bad)} .fmrg.nd{background:#EEF2F2;color:var(--gris2)}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  /* en el celular la fila se apila: los números pasan a ser una tira de etiquetas a lo ancho
     y los botones ocupan el renglón entero, para no dejar una fila altísima por ítem */
  @media(max-width:700px){
    .fila{padding:10px 12px 10px 15px;gap:8px}
    .fmain{min-width:100%}
    .fnums{width:100%;gap:10px}
    .fnum{min-width:0;flex:1;text-align:left}
    .fnum .v{font-size:12.5px}
    .fmrg{min-width:0;text-align:left;padding:4px 8px}
    .acts{width:100%}
    .acts button{flex:1}
  }
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;border-radius:20px;padding:2.5px 8px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
  .c-ok{background:var(--okbg);color:var(--ok)} .c-warn{background:var(--warnbg);color:var(--warn)}
  .c-bad{background:var(--badbg);color:var(--bad)} .c-gris{background:#EEF2F2;color:var(--gris)}
  .c-teal{background:var(--agua);color:var(--teal-deep)} .c-oro{background:#FBF0DA;color:#8a5a00}
  /* aviso de lo que el módulo está ocultando a propósito (sin stock / ya no aplica) */
  .ocultas{font-size:12px;color:var(--gris);background:#F7FAFA;border:1px dashed var(--line);border-radius:9px;padding:8px 12px;margin-bottom:8px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .ocultas b{color:var(--ink)}
  .ocultas button{font-family:inherit;font-size:11.5px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--teal-deep);border-radius:7px;padding:4px 10px;cursor:pointer}
  .ocultas button:hover{border-color:var(--teal-med)}
  .empty{padding:30px;text-align:center;color:var(--gris);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(14,31,29,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .modal .mh h3{font-size:17px;font-weight:800}
  .modal .mb{padding:18px 20px;display:flex;flex-direction:column;gap:13px}
  .modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
  .fld label{display:block;font-size:12px;font-weight:700;color:var(--gris);margin-bottom:4px}
  .fld input,.fld textarea,.fld select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit}
  .fld .row2{display:flex;gap:10px} .fld .row2>div{flex:1}
  .hint{font-size:11px;color:var(--gris2);margin-top:3px}
  .prodpick{border:1px solid var(--line);border-radius:9px;padding:8px;max-height:170px;overflow:auto}
  .prodpick .r{display:flex;justify-content:space-between;align-items:center;padding:5px 6px;font-size:12.5px;border-radius:6px;cursor:pointer}
  .prodpick .r:hover{background:var(--bg)}
  .chosen{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chosen span{background:var(--agua);color:var(--teal-deep);font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px;display:inline-flex;gap:6px;align-items:center}
  .chosen span b{cursor:pointer}
  .x{cursor:pointer;color:var(--gris2)} .x:hover{color:var(--m-bad,#b0322f)}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 26px rgba(0,0,0,.25);z-index:9999;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
  /* ===== editor de descuentos por regla (portado de Motor de precios) ===== */
  .oflist{display:flex;flex-direction:column;gap:9px}
  .ofrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:11px 14px;flex-wrap:wrap}
  .ofmain{flex:1;min-width:200px}
  .oftgt{font-weight:800;color:var(--ink);font-size:13.5px}
  .ofdet{font-size:12px;color:var(--gris);margin-top:2px}
  .ofbadge{font-size:11px;font-weight:800;border-radius:20px;padding:2px 10px}
  .ofbadge.act{background:#DDF3E6;color:#0E6B39} .ofbadge.pau{background:#fdf0d5;color:#8a5a00} .ofbadge.ven{background:#f6eceb;color:#9a4b48}
  .ofbusq{border:1px solid var(--line);border-radius:0 0 10px 10px;border-top:none;max-height:220px;overflow:auto;background:#fff}
  .ofbitem{padding:8px 11px;font-size:13px;cursor:pointer;border-top:1px solid var(--line)}
  .ofbitem:hover{background:#f2faf8}
  .oftgtsel{font-weight:700;color:var(--teal-deep);display:flex;align-items:center;gap:10px;padding:8px 0}
  .rentbox{margin:2px 0 4px;padding:10px 13px;border-radius:10px;font-size:13px;background:#f3f8f7;border:1px solid var(--line);color:var(--ink);line-height:1.5}
  .rentbox.ok{background:#e7f6ec;border-color:#bfe6cc} .rentbox.low{background:#fdf4e3;border-color:#f0dcae} .rentbox.neg{background:#fbeceb;border-color:#f2c9c6}
  .rentbox b{font-weight:800} .rentbox .sub2{color:var(--gris2);font-size:11.5px;font-weight:600}
  .rgform{background:#f8fbfa;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 14px}
  .rgform .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 18px}
  @media(max-width:820px){.rgform .grid4{grid-template-columns:repeat(2,1fr)}}
  .rgform .fld2{display:flex;flex-direction:column;min-width:0}
  .rgform .fld2 label{font-size:10.5px;font-weight:800;color:var(--gris);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;line-height:1.2;min-height:24px;display:flex;align-items:flex-end}
  .rgform .inpu{position:relative;display:flex;align-items:center}
  .rgform input,.rgform select{width:100%;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:inherit;box-sizing:border-box;background:#fff}
  .rgform input:focus,.rgform select:focus{outline:none;border-color:var(--teal)}
  .rgform .inpu .suf{position:absolute;right:10px;color:var(--gris2);font-size:12.5px;font-weight:700;pointer-events:none}
  .rgform .inpu input{padding-right:26px}
  .rgform .hint2{font-size:10.5px;color:var(--gris2);margin-top:5px;font-weight:400;line-height:1.35;min-height:28px}
  .rgform .acts2{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .rgform .acts2 button{border:none;border-radius:9px;padding:9px 18px;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit}
  .rgform .acts2 .ok{background:var(--teal);color:#fff} .rgform .acts2 .ok:hover{background:var(--teal-deep)}
  .rgform .acts2 .cancel{background:#fff;border:1px solid var(--line);color:var(--gris)}
  .btn-mini{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--teal-deep);cursor:pointer;font-family:inherit}
  .btn-mini:hover{border-color:var(--teal-med)} .btn-mini.del{color:#b0322f}
  /* ===== secciones plegables + badges ===== */
  .secw{margin:18px 0 0}
  h2.sec{cursor:pointer;user-select:none;margin:0}
  h2.sec .caret{color:var(--gris2);font-size:12px;width:15px;display:inline-block;transition:none}
  h2.sec .secbtns{margin-left:auto;display:flex;gap:7px;align-items:center}
  .secbody{margin-top:12px}
  .subsec{font-size:12.5px;font-weight:800;color:var(--gris2);text-transform:uppercase;letter-spacing:.5px;margin:14px 2px 8px}
  .catb{display:inline-block;font-size:10px;font-weight:800;color:var(--teal-deep);background:var(--agua);border-radius:6px;padding:1px 7px;letter-spacing:.2px;vertical-align:middle;margin-right:5px}
  /* selector de tipo (segmentado) */
  .seg{display:flex;gap:6px;margin-bottom:14px}
  .seg button{flex:1;background:#eef5f4;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--gris);cursor:pointer}
  .seg button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  /* barra superior: crear oferta = acción principal; config = secundaria chica */
  .btn.cfg{background:#fff;border:1px solid var(--line);color:var(--gris);padding:8px 11px;font-size:16px;line-height:1;border-radius:10px}
  .btn.cfg:hover{border-color:var(--teal-med);background:#f7faf9}
  .btn.nueva{background:var(--gold);color:#fff;font-size:14.5px;font-weight:800;padding:12px 20px;border-radius:11px;box-shadow:0 5px 16px rgba(196,96,42,.28)}
  .btn.nueva:hover{background:var(--gold);filter:brightness(1.06)}
  /* banner éticos en el editor */
  .eticobox{background:#f2ecfb;border:1px solid #d9c9f2;color:#5b3ba0;border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-bottom:12px}
  .eticobox b{color:#4a2e86}
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=62"></script>
<script src="../assets/inventario-oportunidades.js"></script>
<script>
/* ============ EyG Core · Inventario · Oportunidades y Ofertas ============ */
const LANG={context:{lang:"es_AR"}};
const LISTA=3;
const money=n=>"$"+Math.round(n||0).toLocaleString("es-AR");
const esc=s=>EYG.esc(s);
const hoy=()=>new Date().toISOString().slice(0,10);
function masDias(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function fmtF(s){ if(!s) return ""; const [y,m,d]=String(s).slice(0,10).split("-"); return d+"/"+m; }
let OPOS=[], ARCH=[], OFERTAS=[], OPORT_STOCK=[], ESTADO={ignora:[],arch:[]}, stockLoading=true, UMBRAL=0.10, SYNC_OF=[];
let STOCK_T={};   // stock real por plantilla (para marcar "Agotada" en los descuentos por regla)
let COSTO_T={};   // costo del motor (x_costo_motor) por plantilla, para calcular el margen de cada oferta
let COSTO_V={};   // idem por variante (los combos guardan ids de variante)
let FOCO="";      // KPI seleccionado: "" | "perdida" | "ofertas" | "costo" | "stock" | "agotadas"
let VER_OCULTAS=false;   // mostrar las oportunidades que el módulo filtra (sin stock / ya no aplican)
let STOCK_MAX=5, STOCK_DESC={vence:0.25,sobre:0.15,muerto:0.20};   // config del módulo (Configuración)

async function getParam(k,def){ const r=await EYG.rpc("ir.config_parameter","get_param",[k]); return (r===false||r==null)?def:r; }
async function setParam(k,v){ return EYG.rpc("ir.config_parameter","set_param",[k,String(v)]); }

/* ---- secciones plegables (estado por dispositivo) ---- */
let COLAPSA={}; try{ COLAPSA=JSON.parse(localStorage.getItem("eyg_opo_colapsa")||"{}")||{}; }catch(e){ COLAPSA={}; }
window.toggleSec=k=>{ COLAPSA[k]=!COLAPSA[k]; try{ localStorage.setItem("eyg_opo_colapsa",JSON.stringify(COLAPSA)); }catch(e){} render(); };
function sec(k,titulo,count,body,extraBtns){
  /* con una búsqueda en curso las secciones se abren solas: si no, el resultado
     queda escondido detrás de una sección plegada y parece que no encontró nada */
  const open = Q.trim() ? true : !COLAPSA[k];
  return `<div class="secw"><h2 class="sec" onclick="toggleSec('${k}')"><span class="caret">${open?'▾':'▸'}</span> ${titulo} <span class="n">${count}</span>${extraBtns?`<span class="secbtns" onclick="event.stopPropagation()">${extraBtns}</span>`:''}</h2>${open?`<div class="secbody">${body}</div>`:''}</div>`;
}
/* ============ BUSCADOR (patrón del Core: .search + EYG.buscador) ============
   Un solo campo arriba que filtra LAS TRES secciones a la vez: oportunidades por
   costo, oportunidades por stock y las ofertas/descuentos ya creados (incluidos
   combos y descuentos por categoría). Filtra en memoria, sin ir a Odoo.
   Las palabras van en cualquier orden y sin acentos: "bengue pomo" entra igual. */
let Q="";
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function hay(){
  const q=Q.trim(); if(!q) return true;
  const txt=norm(Array.prototype.slice.call(arguments).filter(Boolean).join(" "));
  return norm(q).split(/\s+/).filter(Boolean).every(p=>txt.indexOf(p)>=0);
}
/* una oportunidad (por costo o por stock): nombre, código, categoría y el motivo */
const qOpo=o=>hay(o.nombre,o.sku,o.cat,o.motivoTxt);
/* una oferta/combo del panel: título, nota, categoría y cada producto que la compone */
const qOferta=o=>hay(o.titulo,o.nota,o._cat,(o.items||[]).map(i=>(i.nombre||"")+" "+(i.sku||"")).join(" "));
/* un descuento por regla del motor: el producto o la categoría a la que apunta */
const qRegla=o=>hay(o.targetName,o._sku,o._cat,o.tipo==='c'?'categoria subcategoria':'producto');
window.onBuscar=EYG.buscador(v=>{ Q=v; render(); });
window.limpiarBusq=()=>{ Q=""; render(); const i=document.getElementById("q"); if(i) i.focus(); };
/* contador del encabezado: "3 de 12" cuando algo está filtrando (el buscador o un KPI) */
const cnt=(n,total)=>((Q.trim()||FOCO)&&n!==total)?(n+" de "+total):String(total);
/* cartel de vacío: distingue "no hay nada" de "no encontré lo que buscás" */
const vacio=txt=>'<div class="empty">'+(Q.trim()?'Ningún resultado para <b>«'+esc(Q.trim())+'»</b> en esta sección.':txt)+'</div>';

/* ---- badge de categoría (no invasivo) ---- */
const catCorta=c=>String(c||"").replace(/^ALL \/ /,"").split(" / ").pop().replace(/^HOSPITALARIOS$/,"Hospitalarios")||"";
const catBadge=c=>c?`<span class="catb">${esc(catCorta(c))}</span>`:"";

/* ============ integración con el motor de precios ============
   Una oferta de Oportunidades (por costo o por stock), además de ir al panel del comercial,
   pisa temporalmente la escalera de "Configuración de precios": se inyecta como una oferta de
   PRECIO FIJO en el mismo pipeline que ya recalcula el cron (eyg.sync_ofertas). Al vencer, el
   propio motor la deja de aplicar y vuelve la escalera normal. No toca las ofertas creadas en
   Configuración de precios: cada override lleva id "opo_<producto>" y _origen:"oportunidades". */
const KEY_SYNC_OF="eyg.sync_ofertas", KEY_SYNC_OF_FLAT="eyg.sync_ofertas_flat";
// mismo formato plano que lee el cron (idéntico a ofFlat() de config-precios)
function ofSyncFlat(arr){ return arr.map(o=>[o.id,o.tipo,o.target,o.modo,o.valor,(o.reemplaza||o.modo==='precio')?1:0,o.hasta||'',o.pausada?1:0,o.stock||0].join("~")).join("\n"); }
async function leerSyncOf(){ try{ return JSON.parse(await getParam(KEY_SYNC_OF,"[]")||"[]")||[]; }catch(e){ return []; } }
async function escribirSyncOf(arr, varId){
  await setParam(KEY_SYNC_OF, JSON.stringify(arr));
  await setParam(KEY_SYNC_OF_FLAT, ofSyncFlat(arr));
  // recalcula sólo ese producto (instantáneo), como hace config-precios
  try{ await EYG.rpc("ir.actions.server","run",[[1213]],{context:{lang:"es_AR",eyg_solo_producto:varId}}); }catch(e){}
}
// crea/actualiza el override de precio fijo para el producto y lo aplica ya
async function pisarPrecioConOferta(varId, tmplId, nombre, precio, hasta, stock){
  const arr=await leerSyncOf();
  const oid="opo_"+varId;   // id estable por producto: re-ofertar el mismo producto pisa el anterior
  const reg={ id:oid, tipo:'p', target:tmplId, targetName:nombre, modo:'precio', valor:precio,
    reemplaza:true, hasta:hasta||"", stock:stock||0, pausada:false, _origen:'oportunidades' };
  const i=arr.findIndex(o=>o.id===oid); if(i>=0) arr[i]=reg; else arr.push(reg);
  await escribirSyncOf(arr, varId);
}
// quita el override de un producto (si existía) y restaura la escalera
async function quitarPrecioOferta(varId){
  const arr=await leerSyncOf(); const oid="opo_"+varId;
  const filt=arr.filter(o=>o.id!==oid);
  if(filt.length===arr.length) return;   // no había override de oportunidades para este producto
  await escribirSyncOf(filt, varId);
}
/* Reconciliación: alinea los overrides de precio (eyg.sync_ofertas) con las ofertas del panel
   (eyg.ofertas). Cura casos donde la oferta se creó con el HTML viejo cacheado (fue solo al panel)
   y da de baja overrides cuya oferta ya venció o se borró. Sólo toca los de _origen "oportunidades".
   En estado estable no hace nada (no reescribe ni recalcula). Se corre al cargar el módulo. */
async function reconciliarOfertasConMotor(){
  const hoyS=hoy();
  const activas = OFERTAS.filter(o=>o.tipo==='oferta' && (o.items||[]).length===1 && o.precio>0 && (!o.hasta||o.hasta>=hoyS));
  let arr=await leerSyncOf();
  const porId={}; arr.forEach(o=>porId[o.id]=o);
  // resolver template ids de los productos ofertados (una sola lectura)
  const varIds=[...new Set(activas.map(o=>o.items[0].id))];
  const tmplBy={};
  if(varIds.length){
    try{ const rows=await EYG.rpc("product.product","read",[varIds,["product_tmpl_id"]],LANG); rows.forEach(r=>{ tmplBy[r.id]=r.product_tmpl_id&&r.product_tmpl_id[0]; }); }catch(e){}
  }
  const recalc=new Set(); let changed=false;
  // alta/actualización de overrides faltantes o desfasados
  for(const o of activas){
    const it=o.items[0], varId=it.id, tmpl=tmplBy[varId]; if(!tmpl) continue;
    const oid="opo_"+varId, ex=porId[oid];
    if(!ex || ex.valor!==o.precio || ex.hasta!==(o.hasta||"") || ex.target!==tmpl || ex.pausada){
      const reg={id:oid,tipo:'p',target:tmpl,targetName:it.nombre,modo:'precio',valor:o.precio,reemplaza:true,hasta:o.hasta||"",stock:o.stock||0,pausada:false,_origen:'oportunidades'};
      const i=arr.findIndex(x=>x.id===oid); if(i>=0) arr[i]=reg; else arr.push(reg);
      porId[oid]=reg; recalc.add(varId); changed=true;
    }
  }
  // baja de overrides de oportunidades cuya oferta ya no está activa (vencida / eliminada)
  const activasIds=new Set(activas.map(o=>"opo_"+o.items[0].id));
  for(const o of arr.slice()){
    if(o._origen==='oportunidades' && !activasIds.has(o.id)){
      const varId=parseInt(String(o.id).replace("opo_",""))||0;
      arr=arr.filter(x=>x.id!==o.id); if(varId) recalc.add(varId); changed=true;
    }
  }
  if(changed){
    await setParam(KEY_SYNC_OF, JSON.stringify(arr));
    await setParam(KEY_SYNC_OF_FLAT, ofSyncFlat(arr));
    for(const v of recalc){ try{ await EYG.rpc("ir.actions.server","run",[[1213]],{context:{lang:"es_AR",eyg_solo_producto:v}}); }catch(e){} }
    SYNC_OF=arr;
  }
}

async function cargar(){
  const cont=document.getElementById("cont"); cont.innerHTML='<div class="spin"></div>';
  try{
    STOCK_T={};
    UMBRAL=parseFloat(await getParam("eyg.oferta.umbral","0.10"))||0.10;
    STOCK_MAX=parseInt(await getParam("eyg.oportunidades_stock_max","5"))||5;
    try{ const dsc=JSON.parse(await getParam("eyg.oportunidades_desc","")||"null"); if(dsc&&dsc.vence!=null) STOCK_DESC=dsc; }catch(e){}
    const ofRaw=await getParam("eyg.ofertas","[]");
    try{ OFERTAS=JSON.parse(ofRaw||"[]"); }catch(e){ OFERTAS=[]; }
    // stock real de los productos de cada oferta/combo → sin stock = "Agotada" (gris acá,
    // invisible en el panel de los comerciales; al reponer stock revive sola)
    try{
      const sm=await EYG.ofStockMap(OFERTAS.flatMap(o=>((o&&o.items)||[]).map(i=>i&&i.id)));
      if(sm) OFERTAS.forEach(o=>{ o._agotada=EYG.ofAgotada(o,sm); });
    }catch(e){}
    // descuentos por regla del motor (eyg.sync_ofertas) — se gestionan acá
    const syncRaw=await getParam("eyg.sync_ofertas","[]");
    try{ SYNC_OF=JSON.parse(syncRaw||"[]")||[]; }catch(e){ SYNC_OF=[]; }
    // alinea overrides de precio con el panel (cura ofertas creadas con HTML viejo, baja las vencidas)
    try{ await reconciliarOfertasConMotor(); }catch(e){}
    // precio actual (con la oferta aplicada) para las ofertas de PRODUCTO
    const prodOf=SYNC_OF.filter(o=>o.tipo==='p'&&o.target);
    if(prodOf.length){
      try{
        const its=await EYG.rpc("product.pricelist.item","search_read",[[["pricelist_id","=",3],["product_tmpl_id","in",prodOf.map(o=>o.target)],["min_quantity","=",1]]],{fields:["product_tmpl_id","fixed_price"], limit:5000});
        const byT={}; its.forEach(i=>{ byT[i.product_tmpl_id[0]]=Math.round(i.fixed_price); });
        // éticos: PVP (list_price) para mostrar el descuento contra el PVP, no contra la escalera
        // + stock real (qty_available) para marcar "Agotada" cuando el producto quedó en cero
        // default_code = el código: hace falta para poder BUSCAR el descuento por SKU
        const tps=await EYG.rpc("product.template","read",[prodOf.map(o=>o.target),["list_price","categ_id","qty_available","default_code"]],LANG);
        const pvpT={}, catT={}, skuT={}; tps.forEach(t=>{ STOCK_T[t.id]=t.qty_available||0; catT[t.id]=(t.categ_id&&t.categ_id[1])||""; skuT[t.id]=t.default_code||""; if(/[EÉ]TICO/i.test((t.categ_id&&t.categ_id[1])||"")) pvpT[t.id]=Math.round(t.list_price||0); });
        prodOf.forEach(o=>{ o._precio=byT[o.target]; o._pvp=pvpT[o.target]||0; o._cat=catT[o.target]||""; o._sku=skuT[o.target]||""; });
      }catch(e){}
    }
    /* Costo de TODO lo que está ofertado, para poder mostrar el margen de cada oferta y
       detectar de un vistazo las que están por debajo del costo. x_costo_motor es el mismo
       número con el que el motor calcula el precio (ver el calculador del editor). */
    try{
      const tIds=[...new Set(SYNC_OF.filter(o=>o.tipo===`p`&&o.target).map(o=>o.target))];
      const vIds=[...new Set(OFERTAS.flatMap(o=>((o&&o.items)||[]).map(it=>it&&it.id)).filter(Boolean))];
      if(tIds.length){
        const rows=await EYG.rpc("product.product","search_read",[[["product_tmpl_id","in",tIds]],["product_tmpl_id","x_costo_motor"]],{limit:5000,context:{lang:"es_AR"}});
        for(const r of rows) if((r.x_costo_motor||0)>0) COSTO_T[r.product_tmpl_id[0]]=r.x_costo_motor;
      }
      if(vIds.length){
        const rows=await EYG.rpc("product.product","read",[vIds,["x_costo_motor"]],LANG);
        for(const r of rows) if((r.x_costo_motor||0)>0) COSTO_V[r.id]=r.x_costo_motor;
      }
    }catch(e){}
    // estado de oportunidades por stock (ignorados / archivadas). Las oportunidades se calculan en vivo (refrescarStockOpo).
    try{ const est=JSON.parse(await getParam("eyg.oportunidades_stock_estado","{}")||"{}"); ESTADO={ignora:est.ignora||[], arch:est.arch||[]}; }catch(e){ ESTADO={ignora:[],arch:[]}; }
    OPORT_STOCK=[]; stockLoading=true;
    // oportunidades detectadas
    const prods=await EYG.rpc("product.product","search_read",
      [["&",["active","=",true],"|",["x_oportunidad","=",true],["x_oportunidad_archivada","=",true]]],
      Object.assign({fields:["id","default_code","name","categ_id","qty_available","x_oportunidad","x_oportunidad_archivada","x_oportunidad_costo_ant","x_oportunidad_fecha","x_costo_motor","product_tmpl_id"], limit:500}, LANG));
    // precio de venta actual (escalera base = min_quantity 1) de cada uno
    const tmpls=prods.map(p=>p.product_tmpl_id&&p.product_tmpl_id[0]).filter(Boolean);
    const pit = tmpls.length? await EYG.rpc("product.pricelist.item","search_read",
      [[["pricelist_id","=",LISTA],["applied_on","=","1_product"],["product_tmpl_id","in",tmpls]]],
      {fields:["product_tmpl_id","min_quantity","fixed_price"], limit:20000}) : [];
    const baseT={};
    for(const it of pit){ const t=it.product_tmpl_id[0]; if(!baseT[t]||it.min_quantity<baseT[t].q) baseT[t]={q:it.min_quantity,p:it.fixed_price}; }
    const todos=prods.map(p=>{
      const t=p.product_tmpl_id[0]; const base=baseT[t]?baseT[t].p:0;
      // costoAnt = costo real ANTES de la baja (lo guarda el motor); costoAhora = costo real ACTUAL
      // (x_costo_motor, la fuente única del motor). Fallback a base/1.8 sólo si faltara el dato.
      const costoAnt=p.x_oportunidad_costo_ant||0; const costoAhora=p.x_costo_motor||(base>0?base/1.8:0);
      return { id:p.id, tmpl:t, sku:p.default_code||"", nombre:p.name||"",
        cat:(p.categ_id?p.categ_id[1]:"").replace("ALL / HOSPITALARIOS / ","").replace("ALL / ",""),
        stock:p.qty_available||0, precio:base, costoAnt, costoAhora, fecha:p.x_oportunidad_fecha, _arch:!!p.x_oportunidad_archivada };
    });
    OPOS=todos.filter(x=>!x._arch);
    ARCH=todos.filter(x=>x._arch);
    render();
    refrescarStockOpo();   // calcula en vivo las oportunidades por stock (sin bloquear el render)
  }catch(e){ cont.innerHTML='<div class="empty">No pude leer los datos: '+esc(e.message)+'</div>'; }
}

/* ============ MARGEN DE UNA OFERTA ============
   Con el costo del motor (COSTO_T/COSTO_V) se puede decir si una oferta gana o pierde plata.
   Devuelve null cuando no hay costo cargado: mejor "sin dato" que un margen inventado. */
function mrgDe(precio,costo){ return (precio>0&&costo>0)?Math.round((precio-costo)/precio*100):null; }
/* oferta/descuento del motor (SYNC_OF): sólo las de producto con precio resuelto */
function mrgRegla(o){
  if(o.tipo!==`p`) return null;                       // una regla de categoría no tiene un costo único
  const c=COSTO_T[o.target]||0, p=o._precio||0;
  return mrgDe(p,c);
}
/* oferta o combo del panel (OFERTAS): el costo del combo es la suma de sus productos */
function mrgOferta(o){
  const its=(o.items||[]); if(!its.length||!(o.precio>0)) return null;
  let c=0; for(const it of its){ const x=COSTO_V[it.id]||0; if(!x) return null; c+=x; }
  return mrgDe(o.precio,c);
}
const mrgCls=m=>m==null?"nd":(m<0?"neg":(m<15?"bajo":"ok"));
const mrgTxt=m=>m==null?"s/d":((m<0?"":"+")+m+"%");
/* está en pérdida (para el KPI rojo y la barra roja de la fila) */
function enPerdida(o,esRegla){ const m=esRegla?mrgRegla(o):mrgOferta(o); return m!=null&&m<0; }

/* ============ QUÉ OPORTUNIDAD POR COSTO SE MUESTRA ============
   El motor marca x_oportunidad cuando el costo baja más que el umbral, pero la marca QUEDA:
   si después el costo vuelve a subir, la oportunidad ya no existe y la tarjeta seguía ahí.
   Acá se revalida en vivo contra el costo de hoy (x_costo_motor) y se saca lo que ya no aplica:
     · sin stock  -> no hay nada para ofertar (si repone, vuelve sola)
     · baja < umbral (10%) -> el costo volvió a subir; no es una oportunidad
   No se toca nada en Odoo: es un filtro de vista, reversible con "ver las ocultas". */
const bajaDe=o=>(o.costoAnt>0&&o.costoAhora>0)?(1-o.costoAhora/o.costoAnt):null;
function opoMotivoOculta(o){
  if(!(o.stock>0)) return "sin stock";
  const b=bajaDe(o);
  if(b==null) return "sin costo";
  if(b < UMBRAL-0.0005) return "el costo volvió a subir";
  return "";
}
const opoVale=o=>!opoMotivoOculta(o);

/* ids de productos en oferta ACTIVA (para no re-sugerirlos) */
function idsEnOferta(){ const hoyS=hoy(), s=[]; OFERTAS.filter(o=>!o.hasta||o.hasta>=hoyS).forEach(o=>(o.items||[]).forEach(i=>s.push(i.id))); return s; }
async function guardarEstado(){ return setParam("eyg.oportunidades_stock_estado", JSON.stringify({ignora:ESTADO.ignora, arch:ESTADO.arch})); }

/* Recalcula en vivo las oportunidades por stock (respeta ignorados + ofertas activas) y refresca la sección. */
async function refrescarStockOpo(){
  stockLoading=true; render();
  try{ OPORT_STOCK = await EYGOpo.detectar(EYG.rpc, {ignora:ESTADO.ignora, enOferta:idsEnOferta(), max:STOCK_MAX, desc:STOCK_DESC}); }
  catch(e){ OPORT_STOCK=[]; console.warn("refrescarStockOpo:", e.message); }
  stockLoading=false; render();
}

function vigente(o){ return (!o.hasta || o.hasta>=hoy()); }

/* ============ PANEL DE MÉTRICAS ============
   Cinco números que contestan "¿hay algo que atender?" sin leer una sola fila. El primero es
   el que importa: ofertas que se están vendiendo POR DEBAJO DEL COSTO. Cada uno filtra la
   vista al tocarlo (se toca de nuevo y se saca el filtro). */
window.setFoco=k=>{ FOCO=(FOCO===k?"":k); render(); };
function kpi(k,label,n,sub,cls){
  return `<button class="kpi ${cls||""} ${FOCO===k?"on":""}" onclick="setFoco('${k}')" title="Tocá para ver sólo esto.">
    <span class="l">${label}</span><div class="n">${n}</div><div class="s">${sub}</div></button>`;
}

  const cont=document.getElementById("cont");
  OFERTAS.forEach(o=>o._venc=!vigente(o));

  const singlesT=OFERTAS.filter(o=>o.tipo!=='combo');   // ofertas de 1 producto viejas (compatibilidad)
  const rulesT=rgUserRules();
  // oportunidades por costo: se revalidan en vivo (sin stock / el costo volvió a subir quedan fuera)
  const opoAll=OPOS.slice(), archAll=ARCH.slice();
  const ocultasCosto=opoAll.filter(o=>!opoVale(o));
  const opoVis=opoAll.filter(opoVale);
  const opoOK=VER_OCULTAS?opoAll:opoVis;
  const archOK=VER_OCULTAS?archAll:archAll.filter(opoVale);
  const stkAll=OPORT_STOCK.filter(o=>(o.stock||0)>0), stkArch=(ESTADO.arch||[]).filter(o=>(o.stock||0)>0);
  // ---- métricas ----

  const reglasAct=rulesT.filter(o=>rgEstado(o).c==='act');
  const perdOf=[...combosT,...singlesT].filter(o=>enPerdida(o,false));
  const perdRg=rulesT.filter(o=>enPerdida(o,true));
  const nPerd=perdOf.length+perdRg.length;
  const agot=[...combosT,...singlesT].filter(o=>o._agotada).length
    + rulesT.filter(o=>o.tipo==='p'&&STOCK_T[o.target]!=null&&STOCK_T[o.target]<=0).length;
  const nOfTot=ofActivas.length+reglasAct.length;
  const kpis=`<div class="kpis">
    ${kpi("perdida","🔴 Ofertas en pérdida",nPerd,nPerd?"se venden bajo el costo":"ninguna bajo costo",nPerd?"alerta":"bien")}
    ${kpi("ofertas","🏷️ Ofertas activas",nOfTot,ofActivas.length+" del panel · "+reglasAct.length+" descuentos","")}
    ${kpi("costo","💡 Oportunidades por costo",opoVis.length,ocultasCosto.length?(ocultasCosto.length+" ocultas"):"bajas de costo nuevas","oro")}
    ${kpi("stock","📦 Oportunidades por stock",stockLoading?"…":stkAll.length,"por vencer, sobrestock","")}
    ${kpi("agotadas","⛔ Ofertas sin stock",agot,agot?"apagadas solas":"todas con stock",agot?"apagado":"bien")}
  </div>`;
  // ---- el foco de un KPI filtra las secciones ----
  const ver=s=>!FOCO||FOCO===s;
  const soloPerd=FOCO==="perdida", soloAgot=FOCO==="agotadas";
  const fOf=o=>(soloPerd?enPerdida(o,false):soloAgot?!!o._agotada:true);
  const fRg=o=>(soloPerd?enPerdida(o,true):soloAgot?(o.tipo==='p'&&STOCK_T[o.target]!=null&&STOCK_T[o.target]<=0):true);
  const verOf=ver("ofertas")||soloPerd||soloAgot;
  // ---- y encima de todo, el buscador ----
  const combos=combosT.filter(qOferta).filter(fOf), singles=singlesT.filter(qOferta).filter(fOf);
  const rules=rulesT.filter(qRegla).filter(fRg);
  const nOf=combos.length+singles.length+rules.length, nOfT=combosT.length+singlesT.length+rulesT.length;
  const opos=opoOK.filter(qOpo), arch=archOK.filter(qOpo);
  const oStock=stkAll.filter(qOpo), oStockArch=stkArch.filter(qOpo);
  const nHit=opos.length+arch.length+oStock.length+oStockArch.length+nOf;
  // ---- sección: oportunidades por costo ----
  const nSinStock=ocultasCosto.filter(o=>!(o.stock>0)).length, nSubio=ocultasCosto.length-nSinStock;
  const porQue=[nSinStock?(nSinStock+" sin stock"):"", nSubio?(nSubio+" en las que el costo volvió a subir"):""].filter(Boolean).join(" y ");
  const avisoOcultas = ocultasCosto.length
    ? `<div class="ocultas">🙈 Se ocultan <b>${ocultasCosto.length}</b>: ${porQue}. <button onclick="VER_OCULTAS=!VER_OCULTAS;render()">${VER_OCULTAS?"volver a ocultarlas":"verlas igual"}</button></div>`
    : "";
  const costoBody = avisoOcultas + (opos.length ? `<div class="lista">${opos.map(o=>filaOpo(o,false)).join("")}</div>`
      : vacio("No hay oportunidades nuevas. Cuando un costo baje "+Math.round(UMBRAL*100)+"% o más, aparece acá."))
    + (arch.length?`<div class="subsec">📥 Archivadas (${cnt(arch.length,archAll.length)})</div><div class="lista">${arch.map(o=>filaOpo(o,true)).join("")}</div>`:"");
  // ---- sección: oportunidades por stock ----
  const osBody = (stockLoading
      ? `<div class="empty"><div class="spin" style="margin:6px auto 12px"></div>Buscando oportunidades en el stock…</div>`
      : (oStock.length ? `<div class="lista">${oStock.map(o=>filaOpoStock(o,false)).join("")}</div>`
        : vacio("No hay oportunidades de stock ahora. Se recalculan solas con stock, precios y vencimientos.")))
    + (oStockArch.length?`<div class="subsec">📥 Archivadas (${cnt(oStockArch.length,stkArch.length)})</div><div class="lista">${oStockArch.map(o=>filaOpoStock(o,true)).join("")}</div>`:"");
  // ---- sección: ofertas y descuentos ----
  const editor = rgDraft ? rgFormHTML() : "";
  const ofBody = editor + (nOf
    ? `<div class="lista">${combos.map(filaOferta).join("")}${singles.map(filaOferta).join("")}${rules.map(filaRegla).join("")}</div>`
    : vacio(soloPerd?"Ninguna oferta está por debajo del costo. 👌"
        :soloAgot?"Ninguna oferta se quedó sin stock. 👌"
        :"Todavía no hay ofertas ni descuentos. Tocá <b>+ Nueva oferta o descuento</b>."));
  cont.innerHTML=`
    <div class="intro">
      <div class="grow"><b>Oportunidades y ofertas.</b> Acá se detectan oportunidades (por baja de costo o por stock/vencimiento) y se crean <b>todas</b> las ofertas, descuentos y combos. Lo que confirmes va a la tarjeta <b>“Combos y ofertas de la semana”</b> de los comerciales. Si un producto en oferta se queda <b>sin stock</b>, la oferta se apaga sola: queda gris acá (para reponer o eliminarla) y desaparece del panel de los comerciales.</div>
      <button class="btn cfg" onclick="abrirConfig()" title="Configuración del módulo">⚙️</button>
      <button class="btn nueva" onclick="rgNueva('desc')">＋ Nueva oferta o descuento</button>
    </div>
    ${kpis}
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" placeholder="Buscar producto por nombre, código o categoría…" value="${esc(Q)}" oninput="onBuscar(this.value)" title="Busca al mismo tiempo en las oportunidades por costo, las de stock y las ofertas, combos y descuentos ya creados.">
        ${Q?`<span class="clr" onclick="limpiarBusq()" title="Limpiar la búsqueda">✕</span>`:""}
      </div>
      ${Q.trim()?`<span class="qhit ${nHit?"":"cero"}">${nHit} resultado${nHit===1?"":"s"}</span>`:""}
      ${FOCO?`<button class="btn ghost sm" onclick="setFoco('${FOCO}')">✕ quitar el filtro</button>`:""}
    </div>

/* ============ FILAS ============
   Una fila por ítem, con las mismas columnas siempre en el mismo lugar: se leen scroleando y
   se comparan de un vistazo. La barra de color de la izquierda dice de qué se trata:
   oro = oportunidad por costo · coral = por stock · teal = oferta · rojo = pierde plata. */
const nfmt=n=>(n||0).toLocaleString("es-AR");
function col(k,v,cls){ return `<div class="fnum"><span class="k">${k}</span><span class="v ${cls||""}">${v}</span></div>`; }
function colMrg(m,k){ return `<div class="fmrg ${mrgCls(m)}"><span class="k">${k||"margen"}</span><span class="v">${mrgTxt(m)}</span></div>`; }
function fila(cls,nom,meta,cols,acts){
  return `<div class="fila ${cls}"><div class="fmain"><div class="fnom">${nom}</div><div class="fmeta">${meta}</div></div>
    <div class="fnums">${cols}</div><div class="acts">${acts}</div></div>`;
}

/* --- oportunidad por costo (bajó el costo de compra) --- */
function filaOpo(o,arch){
  const b=bajaDe(o), pc=b==null?null:Math.round(b*100), oculta=opoMotivoOculta(o);
  const chips=[arch?`<span class="chip c-gris">archivada</span>`:"",
    oculta?`<span class="chip c-warn">${esc(oculta)}</span>`:"",
    o.fecha?`<span class="chip c-gris">${fmtF(o.fecha)}</span>`:""].filter(Boolean).join(" ");
  const cols=col("costo antes",money(o.costoAnt),"tach")+col("costo hoy",money(o.costoAhora))
    +col("baja",pc==null?"s/d":("−"+pc+"%"),pc?"baja":"")+col("stock",nfmt(o.stock));
  const acts=`<button class="btn sm" onclick="ofertarDesde(${o.id})">✅ Ofertar</button>`
    +(arch?`<button class="btn ghost sm" onclick="desarchivar(${o.id})">↩ Restaurar</button>`
          :`<button class="btn ghost sm" onclick="archivar(${o.id})">📥 Archivar</button>`)
    +`<button class="btn warn sm" onclick="eliminar(${o.id})">🗑</button>`;
  return fila("opo"+((arch||oculta)?" gris":""), esc(o.nombre), catBadge(o.cat)+esc(o.sku)+" "+chips, cols, acts);

/* --- oportunidad por stock (por vencer / sobrestock / sin venta) --- */
function filaOpoStock(o,arch){
  const mot=o.motivo==="vence"?["c-bad","Por vencer"]:o.motivo==="sobre"?["c-warn","Sobrestock"]:["c-gris","Sin venta"];
  const chips=`<span class="chip ${mot[0]}">${mot[1]}</span>`+(arch?` <span class="chip c-gris">archivada</span>`:"")
    +(o.motivoTxt?` <span title="${esc(o.motivoTxt)}">${esc(o.motivoTxt)}</span>`:"");
  const cols=col("precio hoy",money(o.precio),"tach")+col("sugerido",money(o.sugPrecio))
    +colMrg(o.margenPct,"margen c/oferta")+col("stock",nfmt(o.stock))+col("costo",money(o.costoU));
  const acts=`<button class="btn sm" onclick="ofertarDesdeStock(${o.id})">✅ Ofertar</button>`

/* --- oferta o combo del panel de comerciales --- */
function filaOferta(o){
  const its=(o.items||[]), n=its.length, ag=!!o._agotada, m=mrgOferta(o);
  const chips=[o.tipo===`combo`?`<span class="chip c-teal">🎁 combo · ${n} prod.</span>`:`<span class="chip c-teal">🏷️ oferta</span>`,
    ag?`<span class="chip c-bad">⛔ agotada</span>`:"", o._venc?`<span class="chip c-gris">vencida</span>`:"",
    m!=null&&m<0?`<span class="chip c-bad">pierde plata</span>`:""].filter(Boolean).join(" ");
  const cols=(o.precioAntes?col("antes",money(o.precioAntes),"tach"):"")+col("precio",money(o.precio))
    +colMrg(m)+col("stock ofertado",o.stock?nfmt(o.stock):"—")+col("vigencia",o.hasta?fmtF(o.hasta):"sin límite");
  const acts=`<button class="btn ghost sm" onclick="rgEditarCombo('${o.id}')">Editar</button>`
    +`<button class="btn warn sm" onclick="eliminarOferta('${o.id}')">Eliminar</button>`;

  return fila("of"+(m!=null&&m<0?" mala":"")+(ag||o._venc?" gris":""), nom, meta, cols, acts);
}

let tT=null;
function toast(m,win){ let t=document.getElementById("toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t);} t.textContent=m; t.className="toast show"; clearTimeout(tT); tT=setTimeout(()=>t.className="toast",3000); }

/* ============ Descuentos por regla (portado de "Motor de precios") ============
   Ofertas/descuentos que pisan la escalera del motor. Viven en eyg.sync_ofertas
   (las mismas que este módulo ya carga como SYNC_OF) y se aplican vía acción 1213.
   Antes se creaban en "Motor de precios"; ahora TODAS las ofertas se crean acá.
   Las entradas de _origen "oportunidades" (id "opo_…") las gestiona el propio
   módulo (pisado por oferta manual de 1 producto) y NO se muestran/editan acá. */
let rgDraft=null, rgBusq=[], rgBusqQ="", rgCosto=null, rgTramos=null, rgTramosBase=null, rgApplied=null, rgPvp=0;
let rgCostoFuente="";   // de dónde salió el costo, para poder auditar el margen que se muestra
/* Mismo redondeo que hace el motor con los éticos (_snap_pvp de la acción 1213): el precio que
   se cobra es PVP x (1 - descuento ENTERO/100). Sin esto el calculador muestra el número tipeado
   y el cliente termina pagando otro (7.507 tipeado -> 7.454,50 cobrado). */
function snapPvp(pr,pvp){
  if(!(pvp>0)) return pr;
  let d=Math.round((1-pr/pvp)*100);
  if(d<0) d=0;
  if(d>100) d=100;
  return Math.round(pvp*(1-d/100)*100)/100;
}
const rgPct=x=>Math.round((x||0)*1000)/10;
function rgUserRules(){ return SYNC_OF.filter(o=>o._origen!=='oportunidades'); }
function rgEstado(o){ if(o.pausada) return {t:"Pausada",c:"pau"}; if(o.hasta && o.hasta<hoy()) return {t:"Vencida",c:"ven"}; return {t:"Activa",c:"act"}; }
function rgDesc(o){
  const v=o.modo==='pct'?(rgPct(o.valor)+"%"):("$"+Math.round(o.valor||0));
  const t=o.modo==='pct'?("−"+v):(o.modo==='monto'?("−"+v):("precio fijo "+v));
  const como=(o.reemplaza||o.modo==='precio')?"reemplaza (precio único desde 1)":"pisa la escalera";
  return `${t} · ${como}`;
}
/* --- descuento por regla del motor (producto o categoría) --- */
function filaRegla(o){
  const st=rgEstado(o), m=mrgRegla(o);
  const ag = o.tipo==='p' && STOCK_T[o.target]!=null && STOCK_T[o.target]<=0;
  const descPc = o.modo==='pct'?("−"+rgPct(o.valor)+"%"):o.modo==='monto'?("−"+money(o.valor)):"precio fijo";
  const chips=[o.tipo==='p'?`<span class="chip c-teal">🔖 producto</span>`:`<span class="chip c-gris">📂 categoría</span>`,
    st.c==='pau'?`<span class="chip c-warn">pausado</span>`:"", st.c==='ven'?`<span class="chip c-gris">vencido</span>`:"",
    ag?`<span class="chip c-bad">⛔ agotada</span>`:"", (m!=null&&m<0)?`<span class="chip c-bad">pierde plata</span>`:"",
    (o.reemplaza||o.modo==='precio')?`<span class="chip c-gris">precio único</span>`:`<span class="chip c-gris">sobre la escalera</span>`].filter(Boolean).join(" ");
  // en éticos el "antes" es el PVP de Alfabeta; si no, no hay referencia y se muestra el descuento
  const antes = (o._pvp>o._precio)?o._pvp:null;
  const cols=(antes?col("PVP",money(antes),"tach"):"")
    +col("precio",o._precio?money(o._precio):descPc)
    +(antes&&o._precio?col("desc.","−"+Math.round((1-o._precio/antes)*100)+"%","baja"):"")
    +colMrg(m)+col("stock",o.tipo==='p'&&STOCK_T[o.target]!=null?nfmt(STOCK_T[o.target]):"—")
    +col("vigencia",o.hasta?fmtF(o.hasta):"sin límite");
  const acts=`<button class="btn ghost sm" onclick="rgEditar('${esc(o.id)}')">Editar</button>`
    +`<button class="btn ghost sm" onclick="rgPausar('${esc(o.id)}')">${o.pausada?"Reanudar":"Pausar"}</button>`
    +`<button class="btn warn sm" onclick="rgEliminar('${esc(o.id)}')">Eliminar</button>`;
  const meta=(o.tipo==='p'?catBadge(o._cat)+(o._sku?esc(o._sku)+" ":""):"")+chips;
  return fila("of"+(m!=null&&m<0?" mala":"")+((ag||st.c!=='act')?" gris":""), esc(o.targetName||("#"+o.target)), meta, cols, acts);
}

// costo (misma recencia que el motor: manual > última compra > estándar) + escalera del producto
async function rgCargarRent(tmplId){
  rgPvp=0;
  try{
    const t=await EYG.rpc("product.template","read",[[tmplId],["product_variant_id","list_price","categ_id"]],LANG);
    const th=(t&&t[0])||{};
    if(rgDraft) rgDraft._cat=(th.categ_id&&th.categ_id[1])||"";   // para el badge de categoría
    if(/[EÉ]TICO/i.test((th.categ_id&&th.categ_id[1])||"")) rgPvp=Math.round(th.list_price||0);
    if(rgDraft) rgDraft._pvp=rgPvp;   // ético: el descuento se calcula sobre el PVP (mecánica propia)
    const vid=th.product_variant_id&&th.product_variant_id[0];
    let costo=0; rgCostoFuente="";
    if(vid){
      const pv=await EYG.rpc("product.product","read",[[vid],["x_costo_manual","x_costo_manual_date","standard_price","x_costo_motor"]],LANG);
      const p=(pv&&pv[0])||{};
      /* x_costo_motor = el costo con el que el MOTOR calcula el precio (su regla de 3 fuentes:
         costo manual / última compra / standard_price, el más reciente). Usar el mismo número es
         lo único que garantiza que el margen de acá y el precio que sale sean la misma cuenta. */
      if((p.x_costo_motor||0)>0){ costo=p.x_costo_motor; rgCostoFuente="el que usa el motor"; }
      else{
        const m=p.x_costo_manual||0, md=p.x_costo_manual_date||null;
        let uc=0, uf=null;
        /* ⚠️ purchase.order.line.date_order es un related NO almacenado: Odoo IGNORA
           "order: date_order desc" y devuelve cualquier línea. Con limit:1 devolvía la compra más
           VIEJA y el margen salía inflado. Hay que traerlas todas y elegir acá la más nueva.
           El costo por unidad va por price_subtotal/product_qty (así entran las bonificaciones). */
        try{
          const pol=await EYG.rpc("purchase.order.line","search_read",[[["product_id","=",vid],["state","in",["purchase","done"]],["product_qty",">",0]],["price_subtotal","product_qty","date_order"]],{limit:200,context:{lang:"es_AR"}});
          for(const l of (pol||[])){ if(!(l.price_subtotal>0)) continue; const f=l.date_order||""; if(!uf||f>uf){ uf=f; uc=l.price_subtotal/(l.product_qty||1); } }
        }catch(e){}
        if(m>0 && ((!uf)||(md&&md>=uf))){ costo=m; rgCostoFuente="costo manual"; }
        else if(uc>0){ costo=uc; rgCostoFuente="última compra "+(uf?(uf.slice(8,10)+"/"+uf.slice(5,7)+"/"+uf.slice(0,4)):""); }
        else if((p.standard_price||0)>0){ costo=p.standard_price; rgCostoFuente="costo de Odoo"; }
      }
    }
    rgCosto=costo>0?costo:null;
    const its=await EYG.rpc("product.pricelist.item","search_read",[[["pricelist_id","=",3],["product_tmpl_id","=",tmplId],["compute_price","=","fixed"]],["min_quantity","fixed_price"]],{limit:50,context:{lang:"es_AR"}});
    its.sort((a,b)=>a.min_quantity-b.min_quantity);
    rgTramos=its.map(i=>({q:i.min_quantity,p:i.fixed_price}));
    rgTramosBase=rgTramosBaseFrom(rgTramos, rgApplied);   // deshace la oferta ya aplicada para no descontar dos veces
  }catch(e){ rgCosto=null; rgTramos=null; rgTramosBase=null; }
}
// Recupera la escalera BASE (sin oferta) deshaciendo la oferta que YA está aplicada al pricelist (al editar).
function rgTramosBaseFrom(tramos,applied){
  if(!tramos) return null;
  if(!applied) return tramos;
  if(applied.pausada || (applied.hasta && applied.hasta<hoy())) return tramos;
  const v=applied.valor||0;
  if(applied.modo==='pct' && v>0 && v<1) return tramos.map(t=>({q:t.q,p:t.p/(1-v)}));
  if(applied.modo==='monto' && v>0) return tramos.map(t=>({q:t.q,p:t.p+v}));
  return null;   // 'precio' fijo: la escalera base colapsó a un precio único, no se puede recuperar
}
function rgActualizarRent(){
  const box=document.getElementById("rg-rent"); if(!box||!rgDraft) return;
  const modo=(document.getElementById("rg-modo")||{}).value||rgDraft.modo;
  const valRaw=parseFloat((document.getElementById("rg-valor")||{}).value);
  const rem = modo==='precio'?true:((document.getElementById("rg-reemplaza")||{}).value==='1');
  const costo=rgCosto; const M=n=>money(n);
  const MD=n=>n<0?("−"+money(-n)):money(n);   // diferencia con signo adelante: −$1.284, no $-1.284
  if(costo==null){ box.className="rentbox"; box.innerHTML="No hay costo cargado en Odoo para este producto."; return; }
  const mrg=pr=>pr>0?Math.round((pr-costo)/pr*100):-999;
  const cls=mm=>mm<0?"neg":(mm<15?"low":"ok");
  const etico=rgDraft._pvp>0, pvp=rgDraft._pvp;
  // referencia: descuento con que se vende HOY sobre el PVP (1er tramo de la escalera actual)
  const refEtico=(etico && rgTramosBase && rgTramosBase.length && pvp>0)
    ? `<div class="sub2" style="margin-bottom:5px">Hoy: <b>−${Math.round((1-rgTramosBase[0].p/pvp)*100)}% del PVP</b> (${M(pvp)} → ${M(rgTramosBase[0].p)})</div>` : "";
  // ===== ÉTICOS · PRECIO ÚNICO: el descuento se calcula sobre el PVP de Alfabeta =====
  if(etico && (rem || modo==='precio')){
    if(!(valRaw>0)){ box.className="rentbox"; box.innerHTML=refEtico+`Cargá el valor para ver el precio y el margen. <span class="sub2">PVP ${M(pvp)} · costo ${M(costo)}</span>`; return; }
    const pedido = modo==='precio'?valRaw:(modo==='monto'?pvp-valRaw:pvp*(1-valRaw/100));
    if(!(pedido>0)){ box.className="rentbox neg"; box.innerHTML=refEtico+`Ese descuento deja el precio en cero o menos. <span class="sub2">PVP ${M(pvp)}</span>`; return; }
    const precio = snapPvp(pedido, pvp);   // el que REALMENTE se cobra (el motor redondea el % del PVP)
    const ajuste = Math.abs(precio-pedido)>=1 ? ` <span class="sub2">(cargaste ${M(pedido)}; se cobra ${M(precio)} para que el descuento dé redondo)</span>` : "";
    const mm=mrg(precio), descTot=Math.round((1-precio/pvp)*100);
    box.className="rentbox "+cls(mm);
    box.innerHTML=refEtico+`💊 <b>Ético</b> · Precio final <b>${M(precio)}</b>${ajuste} · Margen <b>${mm}%</b> <span class="sub2">(${MD(precio-costo)}/u · costo ${M(costo)}${rgCostoFuente?" · "+rgCostoFuente:""})</span>
      <div style="margin-top:6px;font-weight:800;color:#0E5C46">🏷️ Descuento total que ve el cliente: −${descTot}% <span class="sub2" style="font-weight:600">(PVP ${M(pvp)} → ${M(precio)})</span></div>
      ${mm<0?'<div style="margin-top:4px;font-weight:700">⚠️ perdés plata</div>':(mm<15?'<div class="sub2" style="margin-top:4px">margen ajustado</div>':'')}`;
    return;
  }
  if(!(valRaw>0)){ box.className="rentbox"; box.innerHTML=refEtico+`Cargá el valor para ver la rentabilidad. <span class="sub2">costo ${M(costo)}</span>`; return; }
  const base=(rgTramosBase&&rgTramosBase.length)?rgTramosBase[0].p:null;
  const finalDe=pr=>modo==='precio'?valRaw:(modo==='monto'?pr-valRaw:pr*(1-valRaw/100));
  if(modo!=='precio' && base==null){ box.className="rentbox"; box.innerHTML="No puedo estimar la escalera base de este producto (la oferta actual es precio fijo o no tiene escalera). Usá <b>Precio fijo</b> para ver la rentabilidad."; return; }
  if(rem || modo==='precio'){
    const pf=modo==='precio'?valRaw:finalDe(base); const mm=mrg(pf);
    box.className="rentbox "+cls(mm);
    box.innerHTML=refEtico+`Precio único <b>${M(pf)}</b> · Rentabilidad <b>${mm}%</b> <span class="sub2">(${MD(pf-costo)}/u · costo ${M(costo)}${rgCostoFuente?" · "+rgCostoFuente:""})</span>${mm<0?' ⚠️ perdés plata':(mm<15?' · margen ajustado':'')}`;
  } else {
    const t1=rgTramosBase[0], tN=rgTramosBase[rgTramosBase.length-1];
    const p1=finalDe(t1.p), pN=finalDe(tN.p); const m1=mrg(p1), mN=mrg(pN);
    box.className="rentbox "+cls(mN);
    const rango=rgTramosBase.length>1?`de <b>${m1}%</b> (${t1.q}u → ${M(p1)}) a <b>${mN}%</b> (${tN.q}u → ${M(pN)})`:`<b>${m1}%</b> (${M(p1)})`;
    const dPvp=(etico&&pvp>0)?` <div style="margin-top:4px;font-weight:800;color:#0E5C46">🏷️ Descuento vs PVP: de −${Math.round((1-p1/pvp)*100)}% a −${Math.round((1-pN/pvp)*100)}%</div>`:"";
    box.innerHTML=refEtico+`Sobre la escalera · Rentabilidad ${rango} <span class="sub2">· costo ${M(costo)}</span>${mN<0?' ⚠️ el último tramo pierde plata':(mN<15?' · último tramo ajustado':'')}${dPvp}`;
  }
}

window.rgGuardar=async()=>{

  if(!(d.items&&d.items.length)){ toast("Elegí al menos un producto"); return; }
  if(!(precio>0)){ toast("Poné el precio del combo"); return; }
  const clean={ id:d.id, tipo:'combo', titulo:(titulo||d.items.map(i=>i.nombre).join(" + ")),
    items:d.items.map(i=>({id:i.id,sku:i.sku,nombre:i.nombre})), precio,
    precioAntes:parseFloat(document.getElementById("rg-antes").value)||0,
    stock:parseFloat(document.getElementById("rg-stock").value)||0,
    hasta:(document.getElementById("rg-hasta").value||""),
    nota:(document.getElementById("rg-nota").value||"").trim(),
    creada:d.creada||new Date().toISOString().slice(0,19).replace("T"," ") };
  const desdeOpo=d._desdeOpo, desdeStock=d._desdeStock;
  const i=OFERTAS.findIndex(o=>o.id===clean.id);
  if(i>=0) OFERTAS[i]=clean; else OFERTAS.push(clean);
  rgDraft=null;
  try{
    await setParam("eyg.ofertas", JSON.stringify(OFERTAS.filter(o=>o.tipo).map(o=>{const c={...o};delete c._venc;delete c._cat;delete c._agotada;return c;})));
    if(desdeOpo){ try{ await EYG.rpc("product.product","write",[[desdeOpo],{x_oportunidad:false,x_oportunidad_archivada:false}],LANG);}catch(e){} OPOS=OPOS.filter(x=>x.id!==desdeOpo); ARCH=ARCH.filter(x=>x.id!==desdeOpo); }
    if(desdeStock){ OPORT_STOCK=OPORT_STOCK.filter(x=>x.id!==desdeStock); ESTADO.arch=ESTADO.arch.filter(x=>x.id!==desdeStock); ESTADO.ignora=ESTADO.ignora.filter(x=>x!==desdeStock); await guardarEstado(); }
    toast("Combo guardado ✓ — ya aparece en el panel de comerciales"); render();
  }catch(e){ toast("Error: "+e.message); }
};
window.rgPausar=async id=>{ const o=SYNC_OF.find(x=>x.id===id); if(!o)return; o.pausada=!o.pausada; await rgSave(o.tipo==='p'?o.target:null); render(); toast(o.pausada?"Oferta pausada ✓":"Oferta reanudada ✓"); };
window.rgEliminar=async id=>{ const o=SYNC_OF.find(x=>x.id===id); if(!o)return; if(!confirm("¿Eliminar esta oferta? Vuelve la escalera normal.")) return; const tgt=o.tipo==='p'?o.target:null; SYNC_OF=SYNC_OF.filter(x=>x.id!==id); await rgSave(tgt); render(); toast("Oferta eliminada ✓"); };

EYG.requireAuth(["inventario"], perfil=>{
  document.body.innerHTML = EYG.layout(perfil,"oportunidades",'<div id="cont"></div><div id="modal"></div>',"Oportunidades y Ofertas");
  cargar();
});
</script>
