<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=13"></script>
<script src="../assets/inventario-oportunidades.js"></script>
<script>
/* ============ EyG Core · Inventario · Oportunidades y Ofertas ============ */
const LANG={context:{lang:"es_AR"}};
const LISTA=3;
const money=n=>"$"+Math.round(n||0).toLocaleString("es-AR");
const esc=s=>EYG.esc(s);
const hoy=()=>new Date().toISOString().slice(0,10);
function masDias(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function fmtF(s){ if(!s) return ""; const [y,m,d]=String(s).slice(0,10).split("-"); return d+"/"+m; }
let OPOS=[], ARCH=[], OFERTAS=[], OPORT_STOCK=[], ESTADO={ignora:[],arch:[]}, stockLoading=true, UMBRAL=0.10, SYNC_OF=[];

async function getParam(k,def){ const r=await EYG.rpc("ir.config_parameter","get_param",[k]); return (r===false||r==null)?def:r; }
async function setParam(k,v){ return EYG.rpc("ir.config_parameter","set_param",[k,String(v)]); }

/* ============ integración con el motor de precios ============
   Una oferta de Oportunidades (por costo o por stock), además de ir al panel del comercial,
   pisa temporalmente la escalera de "Configuración de precios": se inyecta como una oferta de
   PRECIO FIJO en el mismo pipeline que ya recalcula el cron (eyg.sync_ofertas). Al vencer, el
   propio motor la deja de aplicar y vuelve la escalera normal. No toca las ofertas creadas en
   Configuración de precios: cada override lleva id "opo_<producto>" y _origen:"oportunidades". */
const KEY_SYNC_OF="eyg.sync_ofertas", KEY_SYNC_OF_FLAT="eyg.sync_ofertas_flat";
// mismo formato plano que lee el cron (idéntico a ofFlat() de config-precios)
function ofSyncFlat(arr){ return arr.map(o=>[o.id,o.tipo,o.target,o.modo,o.valor,(o.reemplaza||o.modo==='precio')?1:0,o.hasta||'',o.pausada?1:0,o.stock||0].join("~")).join("\n"); }
async function leerSyncOf(){ try{ return JSON.parse(await getParam(KEY_SYNC_OF,"[]")||"[]")||[]; }catch(e){ return []; } }
async function escribirSyncOf(arr, varId){
  await setParam(KEY_SYNC_OF, JSON.stringify(arr));
  await setParam(KEY_SYNC_OF_FLAT, ofSyncFlat(arr));
  // recalcula sólo ese producto (instantáneo), como hace config-precios
  try{ await EYG.rpc("ir.actions.server","run",[[1213]],{context:{lang:"es_AR",eyg_solo_producto:varId}}); }catch(e){}
}
// crea/actualiza el override de precio fijo para el producto y lo aplica ya
async function pisarPrecioConOferta(varId, tmplId, nombre, precio, hasta, stock){
  const arr=await leerSyncOf();
  const oid="opo_"+varId;   // id estable por producto: re-ofertar el mismo producto pisa el anterior
  const reg={ id:oid, tipo:'p', target:tmplId, targetName:nombre, modo:'precio', valor:precio,
    reemplaza:true, hasta:hasta||"", stock:stock||0, pausada:false, _origen:'oportunidades' };
  const i=arr.findIndex(o=>o.id===oid); if(i>=0) arr[i]=reg; else arr.push(reg);
  await escribirSyncOf(arr, varId);
}
// quita el override de un producto (si existía) y restaura la escalera
async function quitarPrecioOferta(varId){
  const arr=await leerSyncOf(); const oid="opo_"+varId;
  const filt=arr.filter(o=>o.id!==oid);
  if(filt.length===arr.length) return;   // no había override de oportunidades para este producto
  await escribirSyncOf(filt, varId);
}
/* Reconciliación: alinea los overrides de precio (eyg.sync_ofertas) con las ofertas del panel
   (eyg.ofertas). Cura casos donde la oferta se creó con el HTML viejo cacheado (fue solo al panel)
   y da de baja overrides cuya oferta ya venció o se borró. Sólo toca los de _origen "oportunidades".
   En estado estable no hace nada (no reescribe ni recalcula). Se corre al cargar el módulo. */
async function reconciliarOfertasConMotor(){
  const hoyS=hoy();
  const activas = OFERTAS.filter(o=>o.tipo==='oferta' && (o.items||[]).length===1 && o.precio>0 && (!o.hasta||o.hasta>=hoyS));
  let arr=await leerSyncOf();
  const porId={}; arr.forEach(o=>porId[o.id]=o);
  // resolver template ids de los productos ofertados (una sola lectura)
  const varIds=[...new Set(activas.map(o=>o.items[0].id))];
  const tmplBy={};
  if(varIds.length){
    try{ const rows=await EYG.rpc("product.product","read",[varIds,["product_tmpl_id"]],LANG); rows.forEach(r=>{ tmplBy[r.id]=r.product_tmpl_id&&r.product_tmpl_id[0]; }); }catch(e){}
  }
  const recalc=new Set(); let changed=false;
  // alta/actualización de overrides faltantes o desfasados
  for(const o of activas){
    const it=o.items[0], varId=it.id, tmpl=tmplBy[varId]; if(!tmpl) continue;
    const oid="opo_"+varId, ex=porId[oid];
    if(!ex || ex.valor!==o.precio || ex.hasta!==(o.hasta||"") || ex.target!==tmpl || ex.pausada){
      const reg={id:oid,tipo:'p',target:tmpl,targetName:it.nombre,modo:'precio',valor:o.precio,reemplaza:true,hasta:o.hasta||"",stock:o.stock||0,pausada:false,_origen:'oportunidades'};
      const i=arr.findIndex(x=>x.id===oid); if(i>=0) arr[i]=reg; else arr.push(reg);
      porId[oid]=reg; recalc.add(varId); changed=true;
    }
  }
  // baja de overrides de oportunidades cuya oferta ya no está activa (vencida / eliminada)
  const activasIds=new Set(activas.map(o=>"opo_"+o.items[0].id));
  for(const o of arr.slice()){
    if(o._origen==='oportunidades' && !activasIds.has(o.id)){
      const varId=parseInt(String(o.id).replace("opo_",""))||0;
      arr=arr.filter(x=>x.id!==o.id); if(varId) recalc.add(varId); changed=true;
    }
  }
  if(changed){
    await setParam(KEY_SYNC_OF, JSON.stringify(arr));
    await setParam(KEY_SYNC_OF_FLAT, ofSyncFlat(arr));
    for(const v of recalc){ try{ await EYG.rpc("ir.actions.server","run",[[1213]],{context:{lang:"es_AR",eyg_solo_producto:v}}); }catch(e){} }
    SYNC_OF=arr;
  }
}

async function cargar(){
  const cont=document.getElementById("cont"); cont.innerHTML='<div class="spin"></div>';
  try{
    UMBRAL=parseFloat(await getParam("eyg.oferta.umbral","0.10"))||0.10;
    const ofRaw=await getParam("eyg.ofertas","[]");
    try{ OFERTAS=JSON.parse(ofRaw||"[]"); }catch(e){ OFERTAS=[]; }
    // ofertas creadas en "Configuración de precios" (solo lectura acá)
    const syncRaw=await getParam("eyg.sync_ofertas","[]");
    try{ SYNC_OF=JSON.parse(syncRaw||"[]")||[]; }catch(e){ SYNC_OF=[]; }
    // alinea overrides de precio con el panel (cura ofertas creadas con HTML viejo, baja las vencidas)
    try{ await reconciliarOfertasConMotor(); }catch(e){}
    // precio actual (con la oferta aplicada) para las ofertas de PRODUCTO
    const prodOf=SYNC_OF.filter(o=>o.tipo==='p'&&o.target);
    if(prodOf.length){
      try{
        const its=await EYG.rpc("product.pricelist.item","search_read",[[["pricelist_id","=",3],["product_tmpl_id","in",prodOf.map(o=>o.target)],["min_quantity","=",1]]],{fields:["product_tmpl_id","fixed_price"], limit:5000});
        const byT={}; its.forEach(i=>{ byT[i.product_tmpl_id[0]]=Math.round(i.fixed_price); });
        // éticos: PVP (list_price) para mostrar el descuento contra el PVP, no contra la escalera
        const tps=await EYG.rpc("product.template","read",[prodOf.map(o=>o.target),["list_price","categ_id"]],LANG);
        const pvpT={}; tps.forEach(t=>{ if(/[EÉ]TICO/i.test((t.categ_id&&t.categ_id[1])||"")) pvpT[t.id]=Math.round(t.list_price||0); });
        prodOf.forEach(o=>{ o._precio=byT[o.target]; o._pvp=pvpT[o.target]||0; });
      }catch(e){}
    }
    // estado de oportunidades por stock (ignorados / archivadas). Las oportunidades se calculan en vivo (refrescarStockOpo).
    try{ const est=JSON.parse(await getParam("eyg.oportunidades_stock_estado","{}")||"{}"); ESTADO={ignora:est.ignora||[], arch:est.arch||[]}; }catch(e){ ESTADO={ignora:[],arch:[]}; }
    OPORT_STOCK=[]; stockLoading=true;
    // oportunidades detectadas
    const prods=await EYG.rpc("product.product","search_read",
      [["&",["active","=",true],"|",["x_oportunidad","=",true],["x_oportunidad_archivada","=",true]]],
      Object.assign({fields:["id","default_code","name","categ_id","qty_available","x_oportunidad","x_oportunidad_archivada","x_oportunidad_costo_ant","x_oportunidad_fecha","x_costo_motor","product_tmpl_id"], limit:500}, LANG));
    // precio de venta actual (escalera base = min_quantity 1) de cada uno
    const tmpls=prods.map(p=>p.product_tmpl_id&&p.product_tmpl_id[0]).filter(Boolean);
    const pit = tmpls.length? await EYG.rpc("product.pricelist.item","search_read",
      [[["pricelist_id","=",LISTA],["applied_on","=","1_product"],["product_tmpl_id","in",tmpls]]],
      {fields:["product_tmpl_id","min_quantity","fixed_price"], limit:20000}) : [];
    const baseT={};
    for(const it of pit){ const t=it.product_tmpl_id[0]; if(!baseT[t]||it.min_quantity<baseT[t].q) baseT[t]={q:it.min_quantity,p:it.fixed_price}; }
    const todos=prods.map(p=>{
      const t=p.product_tmpl_id[0]; const base=baseT[t]?baseT[t].p:0;
      // costoAnt = costo real ANTES de la baja (lo guarda el motor); costoAhora = costo real ACTUAL
      // (x_costo_motor, la fuente única del motor). Fallback a base/1.8 sólo si faltara el dato.
      const costoAnt=p.x_oportunidad_costo_ant||0; const costoAhora=p.x_costo_motor||(base>0?base/1.8:0);
      return { id:p.id, tmpl:t, sku:p.default_code||"", nombre:p.name||"",
        cat:(p.categ_id?p.categ_id[1]:"").replace("ALL / HOSPITALARIOS / ","").replace("ALL / ",""),
        stock:p.qty_available||0, precio:base, costoAnt, costoAhora, fecha:p.x_oportunidad_fecha, _arch:!!p.x_oportunidad_archivada };
    });
    OPOS=todos.filter(x=>!x._arch);
    ARCH=todos.filter(x=>x._arch);
    render();
    refrescarStockOpo();   // calcula en vivo las oportunidades por stock (sin bloquear el render)
  }catch(e){ cont.innerHTML='<div class="empty">No pude leer los datos: '+esc(e.message)+'</div>'; }
}

/* ids de productos en oferta ACTIVA (para no re-sugerirlos) */
function idsEnOferta(){ const hoyS=hoy(), s=[]; OFERTAS.filter(o=>!o.hasta||o.hasta>=hoyS).forEach(o=>(o.items||[]).forEach(i=>s.push(i.id))); return s; }
async function guardarEstado(){ return setParam("eyg.oportunidades_stock_estado", JSON.stringify({ignora:ESTADO.ignora, arch:ESTADO.arch})); }

/* Recalcula en vivo las oportunidades por stock (respeta ignorados + ofertas activas) y refresca la sección. */
async function refrescarStockOpo(){
  stockLoading=true; render();
  try{ OPORT_STOCK = await EYGOpo.detectar(EYG.rpc, {ignora:ESTADO.ignora, enOferta:idsEnOferta()}); }
  catch(e){ OPORT_STOCK=[]; console.warn("refrescarStockOpo:", e.message); }
  stockLoading=false; render();
}

function vigente(o){ return (!o.hasta || o.hasta>=hoy()); }

function render(){
  const cont=document.getElementById("cont");
  OFERTAS.forEach(o=>o._venc=!vigente(o));
  const activas=OFERTAS.filter(o=>!o._venc), vencidas=OFERTAS.filter(o=>o._venc);
  const opoCards = OPOS.length ? OPOS.map(cardOpo).join("") : '<div class="empty">No hay oportunidades nuevas. Cuando un costo baje '+Math.round(UMBRAL*100)+'% o más, aparece acá.</div>';
  const osCards = stockLoading
    ? '<div class="empty"><div class="spin" style="margin:6px auto 12px"></div>Buscando oportunidades en el stock…</div>'
    : (OPORT_STOCK.length ? OPORT_STOCK.map(cardOpoStock).join("") : '<div class="empty">No hay oportunidades de stock ahora. Se recalculan solas con los datos de stock, precios y vencimientos.</div>');
  const osArchCards = (ESTADO.arch&&ESTADO.arch.length) ? ESTADO.arch.map(cardOpoStockArch).join("") : "";
  const ofCards = (activas.length||vencidas.length)
    ? (activas.concat(vencidas).map(cardOferta).join(""))
    : '<div class="empty">Todavía no hay ofertas manuales. Confirmá una oportunidad o agregá una oferta/combo a mano.</div>';
  cont.innerHTML=`
    <div class="intro">
      <div class="grow"><b>Oportunidades y ofertas.</b> El sistema detecta oportunidades cuando <b>baja un costo</b> o cuando el panel de <b>Stock y Sobrestock</b> encuentra productos por vencer, con sobrestock o sin venta. Confirmala (elegí precio, stock y vigencia) y va a la tarjeta <b>“Combos y ofertas de la semana”</b> de los comerciales. También podés agregar ofertas o combos a mano.</div>
      <button class="btn ghost" onclick="abrirConfig()">⚙️ Configuración</button>
      <button class="btn" onclick="abrirOferta(null)">+ Oferta / combo manual</button>
    </div>
    <h2 class="sec">💡 Oportunidades por costo <span class="n">${OPOS.length}</span></h2>
    <div class="grid">${opoCards}</div>
    ${ARCH.length?`<h2 class="sec">📥 Archivadas <span class="n">${ARCH.length}</span></h2><div class="grid">${ARCH.map(cardArch).join("")}</div>`:''}
    <h2 class="sec">📦 Oportunidades por stock <span class="n">${stockLoading?'…':OPORT_STOCK.length}</span><button class="btn ghost sm" style="margin-left:auto" onclick="refrescarStockOpo()" ${stockLoading?'disabled':''}>🔄 Actualizar</button></h2>
    <div class="grid">${osCards}</div>
    ${osArchCards?`<h2 class="sec">📥 Stock archivadas <span class="n">${ESTADO.arch.length}</span></h2><div class="grid">${osArchCards}</div>`:''}
    <h2 class="sec">🏷️ Ofertas y combos <span class="n">${activas.length}</span></h2>
    <div class="grid">${ofCards}</div>
    ${rgRenderSection()}`;
}

  const pc=o.costoAnt>0?Math.round((1-o.costoAhora/o.costoAnt)*100):0;
  return `<div class="card opo"><span class="tag g">Oportunidad</span>
    <h3>${esc(o.nombre)}</h3>
    <div class="meta">${esc(o.sku)} · ${esc(o.cat)}</div>
    <div class="drop"><span>Costo</span> <span class="a">${money(o.costoAnt)}</span> → <span class="b">${money(o.costoAhora)}</span> <span class="pc">−${pc}%</span></div>
    <div class="kv"><span>Precio venta: <b>${money(o.precio)}</b></span><span>Stock: <b>${o.stock}</b></span></div>
    <div class="acts">
      <button class="btn sm" onclick="ofertarDesde(${o.id})">✅ Mandar al panel</button>
      <button class="btn ghost sm" onclick="archivar(${o.id})">📥 Archivar</button>
      <button class="btn warn sm" onclick="eliminar(${o.id})">🗑 Eliminar</button>

}
function cardArch(o){

    <h3>${esc(o.nombre)}</h3>
    <div class="meta">${esc(o.sku)} · ${esc(o.cat)}</div>

function cardOpoStockArch(o){
  return `<div class="card opostock" style="opacity:.78"><span class="tag v">Archivada</span>
    <h3>${esc(o.nombre)}</h3>
    <div class="meta">${esc(o.sku)}${o.cat?' · '+esc(o.cat):''}</div>
    <div class="meta" style="margin-top:5px">${esc(o.motivoTxt||'')}</div>
    <div class="drop"><span class="a">${money(o.precio)}</span> → <span class="b">${money(o.sugPrecio)}</span></div>
    ${o.margenPct!=null?`<div class="margen ${o.margenPct<0?'neg':o.margenPct<15?'bajo':'ok'}">Margen: <b>${o.margenPct<0?'':'+'}${o.margenPct}%</b> · ${money(o.margenAbs)}/u</div>`:''}
    <div class="acts">
      <button class="btn sm" onclick="ofertarDesdeStock(${o.id})">✅ Mandar al panel</button>
      <button class="btn ghost sm" onclick="restaurarStock(${o.id})">↩ Restaurar</button>
      <button class="btn warn sm" onclick="eliminarStock(${o.id})">🗑 Eliminar</button>
    </div></div>`;
}
function ofertarDesdeStock(pid){
  const o=OPORT_STOCK.find(x=>x.id===pid)||(ESTADO.arch||[]).find(x=>x.id===pid); if(!o) return;
  FORM={ id:null, tipo:"oferta", titulo:o.nombre, items:[{id:o.id,sku:o.sku,nombre:o.nombre}],
    precio:o.sugPrecio, precioAntes:o.precio, stock:o.stock, hasta:masDias(7), nota:o.motivoTxt, _desdeStock:pid };
  modalOferta();
}
window.archivarStock=async pid=>{
  const o=OPORT_STOCK.find(x=>x.id===pid); if(!o) return;
  if(!ESTADO.ignora.includes(pid)) ESTADO.ignora.push(pid);
  if(!ESTADO.arch.some(x=>x.id===pid)) ESTADO.arch.push(o);
  OPORT_STOCK=OPORT_STOCK.filter(x=>x.id!==pid);
  try{ await guardarEstado(); toast("Archivada 📥"); refrescarStockOpo(); }catch(e){ toast("Error: "+e.message); render(); }
};
window.eliminarStock=async pid=>{
  if(!confirm("¿Eliminar esta oportunidad de stock? No se va a volver a sugerir. Si querés poder recuperarla, usá Archivar.")) return;
  if(!ESTADO.ignora.includes(pid)) ESTADO.ignora.push(pid);
  ESTADO.arch=ESTADO.arch.filter(x=>x.id!==pid);
  OPORT_STOCK=OPORT_STOCK.filter(x=>x.id!==pid);
  try{ await guardarEstado(); toast("Eliminada 🗑"); refrescarStockOpo(); }catch(e){ toast("Error: "+e.message); render(); }
};
window.restaurarStock=async pid=>{
  ESTADO.ignora=ESTADO.ignora.filter(x=>x!==pid);
  ESTADO.arch=ESTADO.arch.filter(x=>x.id!==pid);
  try{ await guardarEstado(); toast("Restaurada ↩"); refrescarStockOpo(); }catch(e){ toast("Error: "+e.message); render(); }
};

/* ============ crear/editar oferta (modal) ============ */
let FORM=null;
function ofertarDesde(pid){
  const o=OPOS.find(x=>x.id===pid)||ARCH.find(x=>x.id===pid); if(!o) return;
  FORM={ id:null, tipo:"oferta", titulo:o.nombre, items:[{id:o.id,sku:o.sku,nombre:o.nombre}],
    precio:o.precio, precioAntes:o.precio, stock:o.stock, hasta:masDias(7), nota:"", _desdeOpo:pid };
  modalOferta();
}
function abrirOferta(oid){
  if(oid){ const o=OFERTAS.find(x=>x.id===oid); FORM=JSON.parse(JSON.stringify(o)); FORM._antesEdit=true; }
  else { FORM={ id:null, tipo:"oferta", titulo:"", items:[], precio:0, precioAntes:0, stock:0, hasta:masDias(7), nota:"" }; }
  modalOferta();
}
function modalOferta(){
  const f=FORM;
  const combo=f.tipo==="combo";
  const chosen=(f.items||[]).map(i=>`<span>${esc(i.nombre)} <b onclick="quitarItem(${i.id})">✕</b></span>`).join("");
  document.getElementById("modal").innerHTML=`<div class="scrim" onclick="if(event.target===this)cerrarModal()"><div class="modal">
    <div class="mh"><h3>${f.id?'Editar':'Nueva'} ${combo?'combo':'oferta'}</h3></div>
    <div class="mb">
      <div class="fld"><label>Tipo</label><select id="f-tipo" onchange="FORM.tipo=this.value;modalOferta()">
        <option value="oferta" ${!combo?'selected':''}>Oferta (1 producto)</option>
        <option value="combo" ${combo?'selected':''}>Combo (varios productos)</option></select></div>
      <div class="fld"><label>Título</label><input id="f-tit" value="${esc(f.titulo||'')}" placeholder="Ej: Súper oferta Ibuprofeno"></div>
      ${combo?`
      <div class="fld"><label>Productos del combo</label>
        <input id="f-buscar" placeholder="Buscar por nombre o SKU…" oninput="buscarProd(this.value)">
        <div class="prodpick" id="f-pick" style="display:none"></div>
        <div class="chosen">${chosen||'<span style="background:none;color:var(--gris2)">Ninguno todavía</span>'}</div>
      </div>`:`
      <div class="fld"><label>Producto</label>
        ${f.items.length?`<div class="chosen">${chosen}</div>`:`<input id="f-buscar" placeholder="Buscar por nombre o SKU…" oninput="buscarProd(this.value)"><div class="prodpick" id="f-pick" style="display:none"></div>`}
      </div>`}
      <div class="fld"><div class="row2">
        <div><label>Precio de oferta</label><input id="f-precio" type="number" step="0.01" value="${f.precio||''}" oninput="actualizarMargen();actualizarDescuento()"></div>
        <div><label>Precio de lista (antes)</label><input id="f-antes" type="number" step="0.01" value="${f.precioAntes||''}" oninput="FORM._antesEdit=true;actualizarDescuento()"></div>
      </div>
      <div class="hint" id="f-desc"></div>
      <div class="hint" id="f-etico" style="display:none;color:var(--teal-deep);font-weight:600"></div>
      <div class="hint">El “antes” se muestra tachado para resaltar el ahorro.</div></div>
      <div class="fld"><label>Margen con esta oferta</label><div id="f-margen" class="margen-box">calculando…</div>
        <div class="hint">Sobre el costo actual del producto en Odoo (neto, sin IVA). En rojo = perdés plata.</div></div>
      <div class="fld"><div class="row2">
        <div><label>Stock a ofertar</label><input id="f-stock" type="number" value="${f.stock||''}" placeholder="parte del stock"></div>
        <div><label>Vigencia hasta</label><input id="f-hasta" type="date" value="${f.hasta||''}"></div>
      </div></div>
      <div class="fld"><label>Nota (opcional)</label><textarea id="f-nota" rows="2" placeholder="Condiciones, aclaraciones…">${esc(f.nota||'')}</textarea></div>
    </div>
    <div class="mf"><button class="btn ghost" onclick="cerrarModal()">Cancelar</button><button class="btn" onclick="guardarOferta()">Guardar oferta</button></div>
  </div></div>`;
  cargarCostoForm();   // trae el costo actual de Odoo y pinta el margen (se actualiza al editar el precio)
}
/* Costo actual (más reciente, lo sincroniza Odoo) de los productos de la oferta → margen en vivo.
   Además: si la oferta es de UN producto ÉTICO (categoría contiene "ETICO"), el "antes" pasa a ser
   el PVP de Alfabeta (list_price), no la escalera ya rebajada (PVP−31%), para que el descuento
   mostrado se calcule sobre el PVP y sea mayor. Ver [[eyg-eticos-pvp-tarifa]]. */
async function cargarCostoForm(){
  const box=document.getElementById("f-margen"); if(!box) return;
  const ids=(FORM.items||[]).map(i=>i.id);
  if(!ids.length){ FORM._costoTotal=null; FORM._esEtico=false; FORM._pvp=null; actualizarMargen(); aplicarEtico(); return; }
  try{
    const rows=await EYG.rpc("product.product","read",[ids,["standard_price","list_price","categ_id"]],LANG);
    FORM._costoTotal=rows.reduce((a,r)=>a+(r.standard_price||0),0);
    // ético sólo aplica a oferta de 1 producto; categ_id[1] es el complete_name ("ALL / ETICOS / …")
    const etico = FORM.tipo==='oferta' && rows.length===1 && /[EÉ]TICO/i.test((rows[0].categ_id&&rows[0].categ_id[1])||"");
    FORM._pvp = etico ? Math.round(rows[0].list_price||0) : null;
    FORM._esEtico = etico && FORM._pvp>0;
  }
  catch(e){ FORM._costoTotal=null; FORM._esEtico=false; FORM._pvp=null; }
  actualizarMargen();
  aplicarEtico();
}
/* Para éticos: el "antes" es el PVP (list_price). Se autocompleta sólo si el usuario no editó el campo
   y el PVP está por encima del precio de oferta (si no, dejamos la escalera como referencia segura). */
function aplicarEtico(){
  const antes=document.getElementById("f-antes"), et=document.getElementById("f-etico");
  const precio=parseFloat((document.getElementById("f-precio")||{}).value)||FORM.precio||0;
  const ok = FORM._esEtico && FORM._pvp>0 && FORM._pvp>precio;
  if(ok){
    if(antes && !FORM._antesEdit){ antes.value=FORM._pvp; FORM.precioAntes=FORM._pvp; }
    if(et){ et.style.display="block"; et.innerHTML=`💊 Producto <b>ético</b>: el “antes” es el <b>PVP</b> de Alfabeta (${money(FORM._pvp)}). El descuento se calcula sobre el PVP, no sobre el precio ya rebajado.`; }
  } else if(et){ et.style.display="none"; et.innerHTML=""; }
  actualizarDescuento();
}
/* Descuento en vivo (lo que verá el comercial): (antes − precio) / antes. */
function actualizarDescuento(){
  const el=document.getElementById("f-desc"); if(!el) return;
  const precio=parseFloat((document.getElementById("f-precio")||{}).value)||0;
  const antes=parseFloat((document.getElementById("f-antes")||{}).value)||0;
  el.innerHTML=(antes>0&&precio>0&&antes>precio)
    ? `Descuento que verá el comercial: <b style="color:#1E7D46">−${Math.round((1-precio/antes)*100)}%</b>`
    : "";
}
function actualizarMargen(){
  const box=document.getElementById("f-margen"); if(!box) return;
  const precio=parseFloat((document.getElementById("f-precio")||{}).value)||0;
  const costo=FORM._costoTotal;
  if(costo==null){ box.textContent="No hay costo cargado en Odoo para calcular el margen."; box.className="margen-box"; return; }
  if(!(precio>0)){ box.textContent="Poné el precio de oferta para ver el margen."; box.className="margen-box"; return; }
  const abs=Math.round(precio-costo), pct=Math.round((precio-costo)/precio*100);
  box.className="margen-box "+(pct<0?"neg":pct<15?"bajo":"ok");
  box.innerHTML=`<b>${pct<0?'':'+'}${pct}%</b> &nbsp; ${money(abs)} por unidad &nbsp; <span class="cst">(costo ${money(costo)})</span>${pct<0?' &nbsp;⚠️ perdés plata':(pct<15?' &nbsp;margen ajustado':'')}`;
}
window.cerrarModal=()=>{ document.getElementById("modal").innerHTML=""; };
window.quitarItem=id=>{ FORM.items=FORM.items.filter(i=>i.id!==id); modalOferta(); };
let busQ="";
window.buscarProd=EYG.debounce(async q=>{
  busQ=q;
  const pick=document.getElementById("f-pick"); if(!pick) return;
  if(!q||q.length<2){ pick.style.display="none"; return; }
  const r=await EYG.rpc("product.product","search_read",[["|",["name","ilike",q],["default_code","ilike",q]],["id","default_code","name"]],Object.assign({limit:12},LANG));
  if(busQ!==q) return;                 // llegó tarde: ya hay una búsqueda más nueva
  pick.style.display="block";
  pick.innerHTML=r.map(x=>`<div class="r" onclick="addItem(${x.id},'${esc((x.default_code||'')).replace(/'/g,'')}','${esc((x.name||'').slice(0,60)).replace(/'/g,'')}')"><span>${esc(x.name)}</span><span style="color:var(--gris2)">${esc(x.default_code||'')}</span></div>`).join("")||'<div class="r">Sin resultados</div>';
},300);
window.addItem=(id,sku,nombre)=>{ if(!FORM.items.some(i=>i.id===id)){ if(FORM.tipo==='oferta') FORM.items=[]; FORM.items.push({id,sku,nombre}); } modalOferta(); };
async function guardarOferta(){
  const g=id=>document.getElementById(id);
  FORM.titulo=g("f-tit").value.trim();
  FORM.precio=parseFloat(g("f-precio").value)||0;
  FORM.precioAntes=parseFloat(g("f-antes").value)||0;
  FORM.stock=parseFloat(g("f-stock").value)||0;
  FORM.hasta=g("f-hasta").value||"";
  FORM.nota=g("f-nota").value.trim();
  if(!FORM.items.length){ toast("Elegí al menos un producto"); return; }
  if(!(FORM.precio>0)){ toast("Poné el precio de oferta"); return; }
  if(!FORM.titulo) FORM.titulo=FORM.items.map(i=>i.nombre).join(" + ");
  if(!FORM.id){ FORM.id="of"+Date.now(); FORM.creada=new Date().toISOString().slice(0,19).replace("T"," "); OFERTAS.push(FORM); }
  else { const i=OFERTAS.findIndex(o=>o.id===FORM.id); if(i>=0) OFERTAS[i]=FORM; }
  const desdeOpo=FORM._desdeOpo, desdeStock=FORM._desdeStock; delete FORM._venc;
  try{
    await setParam("eyg.ofertas", JSON.stringify(OFERTAS.map(o=>{const c={...o};delete c._venc;delete c._desdeOpo;delete c._desdeStock;return c;})));
    // Además del panel del comercial: pisar temporalmente la escalera con el precio de oferta.
    // Sólo ofertas de UN producto (los combos tienen precio total, no mapea a un precio por producto).
    let pisado=false;
    if(FORM.tipo==='oferta' && FORM.items.length===1 && FORM.precio>0){
      const it=FORM.items[0];
      try{
        const pr=await EYG.rpc("product.product","read",[[it.id],["product_tmpl_id"]],LANG);
        const tmpl=pr&&pr[0]&&pr[0].product_tmpl_id&&pr[0].product_tmpl_id[0];
        if(tmpl){ await pisarPrecioConOferta(it.id, tmpl, it.nombre, FORM.precio, FORM.hasta, FORM.stock); pisado=true; }
      }catch(e){}
    }
    if(desdeOpo){ await EYG.rpc("product.product","write",[[desdeOpo],{x_oportunidad:false,x_oportunidad_archivada:false}],LANG); OPOS=OPOS.filter(x=>x.id!==desdeOpo); ARCH=ARCH.filter(x=>x.id!==desdeOpo); }
    if(desdeStock){
      OPORT_STOCK=OPORT_STOCK.filter(x=>x.id!==desdeStock);
      ESTADO.arch=ESTADO.arch.filter(x=>x.id!==desdeStock); ESTADO.ignora=ESTADO.ignora.filter(x=>x!==desdeStock);
      await guardarEstado(); refrescarStockOpo();   // ya está en oferta activa → se excluye sola y entra una nueva
    }
    // reflejar el precio pisado en las tarjetas sin recargar
    if(pisado){ try{ SYNC_OF=await leerSyncOf(); }catch(e){} }
    cerrarModal();
    toast(pisado ? "Oferta guardada ✓ — en el panel de comerciales y aplicada al precio del producto"
                 : "Oferta guardada ✓ — ya aparece en el panel de comerciales", true);
    render();
  }catch(e){ toast("Error: "+e.message); }
}
window.eliminarOferta=async id=>{
  if(!confirm("¿Eliminar esta oferta? Vuelve el precio normal del producto.")) return;
  const of=OFERTAS.find(x=>x.id===id);
  OFERTAS=OFERTAS.filter(o=>o.id!==id);
  try{
    await setParam("eyg.ofertas", JSON.stringify(OFERTAS));
    if(of&&of.items) for(const it of of.items){ try{ await quitarPrecioOferta(it.id); }catch(e){} }
    try{ SYNC_OF=await leerSyncOf(); }catch(e){}
    toast("Eliminada ✓ — precio del producto restaurado"); render();
  }catch(e){ toast("Error: "+e.message); }
};
window.archivar=async pid=>{
  try{ await EYG.rpc("product.product","write",[[pid],{x_oportunidad:false,x_oportunidad_archivada:true}],LANG);
    const o=OPOS.find(x=>x.id===pid); if(o){ o._arch=true; OPOS=OPOS.filter(x=>x.id!==pid); ARCH.push(o); }
    toast("Archivada 📥"); render(); }catch(e){ toast("Error: "+e.message); }
};
window.desarchivar=async pid=>{
  try{ await EYG.rpc("product.product","write",[[pid],{x_oportunidad:true,x_oportunidad_archivada:false}],LANG);
    const o=ARCH.find(x=>x.id===pid); if(o){ o._arch=false; ARCH=ARCH.filter(x=>x.id!==pid); OPOS.push(o); }
    toast("Restaurada ↩"); render(); }catch(e){ toast("Error: "+e.message); }
};
window.eliminar=async pid=>{
  if(!confirm("¿Eliminar esta oportunidad? Desaparece de la lista (si el costo vuelve a bajar, se detecta de nuevo).")) return;
  try{ await EYG.rpc("product.product","write",[[pid],{x_oportunidad:false,x_oportunidad_archivada:false}],LANG);
    OPOS=OPOS.filter(x=>x.id!==pid); ARCH=ARCH.filter(x=>x.id!==pid); toast("Eliminada 🗑"); render(); }catch(e){ toast("Error: "+e.message); }
};
/* ============ config ============ */
function abrirConfig(){
  document.getElementById("modal").innerHTML=`<div class="scrim" onclick="if(event.target===this)cerrarModal()"><div class="modal">
    <div class="mh"><h3>⚙️ Configuración</h3></div>
    <div class="mb"><div class="fld"><label>Umbral de baja para detectar oportunidad (%)</label>
      <input id="c-umbral" type="number" min="1" max="90" value="${Math.round(UMBRAL*100)}">
      <div class="hint">Cuando el costo de un producto baja este % o más (vs. el anterior), se marca como oportunidad. El cron lo aplica en cada corrida.</div></div></div>
    <div class="mf"><button class="btn ghost" onclick="cerrarModal()">Cancelar</button><button class="btn" onclick="guardarConfig()">Guardar</button></div>
  </div></div>`;
}
async function guardarConfig(){
  const v=parseFloat(document.getElementById("c-umbral").value); if(!(v>0&&v<90)){ toast("Poné un % entre 1 y 89"); return; }
  UMBRAL=v/100;
  try{ await setParam("eyg.oferta.umbral", UMBRAL.toFixed(4)); cerrarModal(); toast("Configuración guardada ✓"); render(); }catch(e){ toast("Error: "+e.message); }
}
let tT=null;
function toast(m,win){ let t=document.getElementById("toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t);} t.textContent=m; t.className="toast show"; clearTimeout(tT); tT=setTimeout(()=>t.className="toast",3000); }

/* ============ Descuentos por regla (portado de "Motor de precios") ============
   Ofertas/descuentos que pisan la escalera del motor. Viven en eyg.sync_ofertas
   (las mismas que este módulo ya carga como SYNC_OF) y se aplican vía acción 1213.
   Antes se creaban en "Motor de precios"; ahora TODAS las ofertas se crean acá.
   Las entradas de _origen "oportunidades" (id "opo_…") las gestiona el propio
   módulo (pisado por oferta manual de 1 producto) y NO se muestran/editan acá. */
let rgDraft=null, rgBusq=[], rgBusqQ="", rgCosto=null, rgTramos=null, rgTramosBase=null, rgApplied=null, rgPvp=0;
const rgPct=x=>Math.round((x||0)*1000)/10;
function rgUserRules(){ return SYNC_OF.filter(o=>o._origen!=='oportunidades'); }
function rgEstado(o){ if(o.pausada) return {t:"Pausada",c:"pau"}; if(o.hasta && o.hasta<hoy()) return {t:"Vencida",c:"ven"}; return {t:"Activa",c:"act"}; }
function rgDesc(o){
  const v=o.modo==='pct'?(rgPct(o.valor)+"%"):("$"+Math.round(o.valor||0));
  const t=o.modo==='pct'?("−"+v):(o.modo==='monto'?("−"+v):("precio fijo "+v));
  const como=(o.reemplaza||o.modo==='precio')?"reemplaza (precio único desde 1)":"pisa la escalera";
  return `${t} · ${como}`;
}
function rgRenderSection(){
  const form = rgDraft ? rgFormHTML() : "";
  const rules = rgUserRules();
  let lista;
  if(!rules.length){ lista=`<div class="empty">No hay descuentos por regla. Tocá <b>+ Nueva oferta por regla</b> para crear uno por categoría o producto.</div>`; }
  else {
    lista = rules.map(o=>{
      const st=rgEstado(o);
      const tgt=o.tipo==='p'?("🔖 "+esc(o.targetName||("#"+o.target))):("📂 "+esc(o.targetName||("cat #"+o.target)));
      return `<div class="ofrow"><div class="ofmain"><div class="oftgt">${tgt}</div><div class="ofdet">${esc(rgDesc(o))}${o.hasta?(" · hasta "+esc(o.hasta)):" · sin vencimiento"}${o.stock?(" · stock "+esc(String(o.stock))):""}</div></div>
        <span class="ofbadge ${st.c}">${st.t}</span>
        <button class="btn-mini" onclick="rgEditar('${esc(o.id)}')">✎ Editar</button>
        <button class="btn-mini" onclick="rgPausar('${esc(o.id)}')">${o.pausada?"▶ Reanudar":"⏸ Pausar"}</button>
        <button class="btn-mini del" onclick="rgEliminar('${esc(o.id)}')">🗑 Eliminar</button></div>`;
    }).join("");
  }
  return `<h2 class="sec">📉 Descuentos por regla <span class="n">${rules.length}</span>
      <button class="btn sm" style="margin-left:auto" onclick="rgNueva()">+ Nueva oferta por regla</button></h2>
    <div class="intro" style="margin-bottom:12px"><div class="grow">Aplican <b>por encima</b> de la escalera del motor de precios y <b>se caen solas</b> al vencer (o al pausar/eliminar). Elegí una <b>categoría, subcategoría o un producto</b>, el descuento (%, monto o precio fijo), si <b>reemplaza</b> la escalera o la <b>pisa</b>, y hasta cuándo. Pueden bajar del piso de margen.</div></div>
    ${form}<div class="oflist">${lista}</div>`;
}
function rgFormHTML(){
  const d=rgDraft;
  const tgtTxt=d.target?(d.tipo==='p'?"🔖 ":"📂 ")+esc(d.targetName):"";
  const results=(!d.target && rgBusq.length)?`<div class="ofbusq">${rgBusq.map(r=>`<div class="ofbitem" onclick="rgElegir('${r.k}',${r.id},'${esc((r.name||'').replace(/'/g,''))}')">${r.k==='p'?"🔖":"📂"} ${esc(r.name)}${r.sku?(" · "+esc(r.sku)):""}</div>`).join("")}</div>`:"";
  const rent=d.tipo==='p'?`<div class="fld2" style="margin-top:4px"><label>Rentabilidad final en vivo</label><div id="rg-rent" class="rentbox">Calculando el costo del producto…</div><div class="hint2">se actualiza al mover el descuento · sobre el costo actual (neto, sin IVA)</div></div>`:"";
  return `<div class="rgform">
    <div class="fld2" style="margin-bottom:12px"><label>Aplicar a (categoría, subcategoría o producto)</label>
      ${d.target?`<div class="oftgtsel">${tgtTxt} <button class="btn-mini" onclick="rgDraft.target=null;rgDraft.targetName='';rgBusq=[];rgBusqQ='';rgCosto=null;rgTramos=null;rgTramosBase=null;rgApplied=null;render()">cambiar</button></div>`
                :`<input type="text" id="rg-busq" placeholder="Escribí nombre o SKU…" value="${esc(rgBusqQ)}" oninput="rgBuscar(this.value)" autocomplete="off">${results}`}
    </div>
    <div class="grid4">
      <div class="fld2"><label>Tipo de descuento</label><select id="rg-modo" onchange="rgDraft.modo=this.value;rgDraft.valor='';render()">
        <option value="pct" ${d.modo==='pct'?'selected':''}>Porcentaje (%)</option>
        <option value="monto" ${d.modo==='monto'?'selected':''}>Monto fijo ($ off)</option>
        <option value="precio" ${d.modo==='precio'?'selected':''}>Precio fijo ($)</option>
      </select><div class="hint2">precio fijo = reemplaza siempre</div></div>
      <div class="fld2"><label>Valor</label><div class="inpu"><input type="number" id="rg-valor" step="0.01" value="${d.valor?(d.modo==='pct'?rgPct(d.valor):d.valor):''}" oninput="rgDraft.valor=(this.value===''?'':(rgDraft.modo==='pct'?parseFloat(this.value)/100:parseFloat(this.value)));rgActualizarRent()"><span class="suf">${d.modo==='pct'?'%':'$'}</span></div><div class="hint2">${d.modo==='pct'?'ej: 20':'ej: 1500'}</div></div>
      <div class="fld2"><label>Cómo aplica</label><select id="rg-reemplaza" ${d.modo==='precio'?'disabled':''} onchange="rgDraft.reemplaza=this.value==='1';rgActualizarRent()">
        <option value="1" ${(d.reemplaza||d.modo==='precio')?'selected':''}>Reemplaza (precio único desde 1)</option>
        <option value="0" ${(!d.reemplaza&&d.modo!=='precio')?'selected':''}>Pisa la escalera (descuenta cada tramo)</option>
      </select><div class="hint2">reemplaza = un solo precio</div></div>
      <div class="fld2"><label>Vigencia hasta</label><input type="date" id="rg-hasta" value="${esc(d.hasta||'')}"><div class="hint2">vacío = sin vencimiento</div></div>
      <div class="fld2"><label>Stock a ofertar (informativo)</label><input type="number" id="rg-stock" min="0" value="${d.stock||''}"><div class="hint2">no se descuenta con ventas · lo controlás vos</div></div>
    </div>
    ${rent}
    <div class="acts2"><button class="cancel" onclick="rgDraft=null;render()">Cancelar</button><button class="ok" onclick="rgGuardar()">Guardar oferta</button></div>
  </div>`;
}
window.rgNueva=()=>{ rgDraft={id:"of"+Date.now(),tipo:null,target:null,targetName:"",modo:"pct",valor:"",reemplaza:true,hasta:"",stock:"",pausada:false}; rgBusq=[];rgBusqQ="";rgCosto=null;rgTramos=null;rgTramosBase=null;rgApplied=null; render(); const el=document.querySelector('.rgform'); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); };
window.rgEditar=async id=>{ const o=SYNC_OF.find(x=>x.id===id); if(!o)return; rgDraft=JSON.parse(JSON.stringify(o)); rgBusq=[];rgBusqQ="";rgCosto=null;rgTramos=null;rgTramosBase=null;
  // la oferta guardada YA está aplicada al pricelist → guardo sus datos para deshacerla y recuperar la base
  rgApplied = o.tipo==='p'?{modo:o.modo,valor:o.valor,reemplaza:o.reemplaza,pausada:o.pausada,hasta:o.hasta}:null;
  render(); const el=document.querySelector('.rgform'); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); if(o.tipo==='p'&&o.target){ await rgCargarRent(o.target); rgActualizarRent(); } };
window.rgBuscar=EYG.debounce(async q=>{
  q=(q||"").trim(); rgBusqQ=q;
  if(q.length<2){ rgBusq=[]; EYG.repintar(render); return; }
  let cats=[], prods=[];
  try{ const cs=await EYG.rpc("product.category","search_read",[[["complete_name","ilike",q]],["complete_name"]],{limit:6,context:{lang:"es_AR"}}); cats=cs.map(c=>({k:'c',id:c.id,name:c.complete_name})); }catch(e){}
  try{ const ps=await EYG.rpc("product.template","search_read",[["|",["name","ilike",q],["default_code","ilike",q]],["name","default_code"]],{limit:8,context:{lang:"es_AR"}}); prods=ps.map(p=>({k:'p',id:p.id,name:p.name,sku:p.default_code})); }catch(e){}
  if(rgBusqQ!==q) return;   // llegó tarde: ya hay una búsqueda más nueva
  rgBusq=cats.concat(prods); EYG.repintar(render);
},350);
window.rgElegir=async(k,id,name)=>{ if(!rgDraft)return; rgDraft.tipo=k; rgDraft.target=id; rgDraft.targetName=name; rgBusq=[];rgBusqQ=""; rgCosto=null;rgTramos=null;rgTramosBase=null;rgApplied=null; render(); if(k==='p'){ await rgCargarRent(id); rgActualizarRent(); } };
// costo (misma recencia que el motor: manual > última compra > estándar) + escalera del producto
async function rgCargarRent(tmplId){
  rgPvp=0;
  try{
    const t=await EYG.rpc("product.template","read",[[tmplId],["product_variant_id","list_price","categ_id"]],LANG);
    const th=(t&&t[0])||{};
    if(/[EÉ]TICO/i.test((th.categ_id&&th.categ_id[1])||"")) rgPvp=Math.round(th.list_price||0);
    const vid=th.product_variant_id&&th.product_variant_id[0];
    let costo=0;
    if(vid){
      const pv=await EYG.rpc("product.product","read",[[vid],["x_costo_manual","x_costo_manual_date","standard_price"]],LANG);
      const p=(pv&&pv[0])||{}; const m=p.x_costo_manual||0, md=p.x_costo_manual_date||null;
      let uc=0, uf=null;
      try{ const pol=await EYG.rpc("purchase.order.line","search_read",[[["product_id","=",vid],["state","in",["purchase","done"]],["product_qty",">",0]],["price_subtotal","product_qty","date_order"]],{limit:1,order:"date_order desc",context:{lang:"es_AR"}}); if(pol&&pol[0]&&pol[0].price_subtotal>0){ uc=pol[0].price_subtotal/(pol[0].product_qty||1); uf=pol[0].date_order||null; } }catch(e){}
      if(m>0 && ((!uf)||(md&&md>=uf))) costo=m; else if(uc>0) costo=uc; else if((p.standard_price||0)>0) costo=p.standard_price;
    }
    rgCosto=costo>0?costo:null;
    const its=await EYG.rpc("product.pricelist.item","search_read",[[["pricelist_id","=",3],["product_tmpl_id","=",tmplId],["compute_price","=","fixed"]],["min_quantity","fixed_price"]],{limit:50,context:{lang:"es_AR"}});
    its.sort((a,b)=>a.min_quantity-b.min_quantity);
    rgTramos=its.map(i=>({q:i.min_quantity,p:i.fixed_price}));
    rgTramosBase=rgTramosBaseFrom(rgTramos, rgApplied);   // deshace la oferta ya aplicada para no descontar dos veces
  }catch(e){ rgCosto=null; rgTramos=null; rgTramosBase=null; }
}
// Recupera la escalera BASE (sin oferta) deshaciendo la oferta que YA está aplicada al pricelist (al editar).
function rgTramosBaseFrom(tramos,applied){
  if(!tramos) return null;
  if(!applied) return tramos;
  if(applied.pausada || (applied.hasta && applied.hasta<hoy())) return tramos;
  const v=applied.valor||0;
  if(applied.modo==='pct' && v>0 && v<1) return tramos.map(t=>({q:t.q,p:t.p/(1-v)}));
  if(applied.modo==='monto' && v>0) return tramos.map(t=>({q:t.q,p:t.p+v}));
  return null;   // 'precio' fijo: la escalera base colapsó a un precio único, no se puede recuperar
}
function rgActualizarRent(){
  const box=document.getElementById("rg-rent"); if(!box||!rgDraft) return;
  const modo=(document.getElementById("rg-modo")||{}).value||rgDraft.modo;
  const valRaw=parseFloat((document.getElementById("rg-valor")||{}).value);
  const rem = modo==='precio'?true:((document.getElementById("rg-reemplaza")||{}).value==='1');
  const costo=rgCosto; const M=n=>money(n);
  if(costo==null){ box.className="rentbox"; box.innerHTML="No hay costo cargado en Odoo para este producto."; return; }
  if(!(valRaw>0)){ box.className="rentbox"; box.innerHTML=`Cargá el valor para ver la rentabilidad. <span class="sub2">costo ${M(costo)}</span>`; return; }
  const base=(rgTramosBase&&rgTramosBase.length)?rgTramosBase[0].p:null;
  const mrg=pr=>pr>0?Math.round((pr-costo)/pr*100):-999;
  const cls=mm=>mm<0?"neg":(mm<15?"low":"ok");
  const finalDe=pr=>modo==='precio'?valRaw:(modo==='monto'?pr-valRaw:pr*(1-valRaw/100));
  if(modo!=='precio' && base==null){ box.className="rentbox"; box.innerHTML="No puedo estimar la escalera base de este producto (la oferta actual es precio fijo o no tiene escalera). Usá <b>Precio fijo</b> para ver la rentabilidad."; return; }
  if(rem || modo==='precio'){
    const pf=modo==='precio'?valRaw:finalDe(base); const mm=mrg(pf);
    box.className="rentbox "+cls(mm);
    box.innerHTML=`Precio único <b>${M(pf)}</b> · Rentabilidad <b>${mm}%</b> <span class="sub2">(${M(pf-costo)}/u · costo ${M(costo)})</span>${mm<0?' ⚠️ perdés plata':(mm<15?' · margen ajustado':'')}`;
  } else {
    const t1=rgTramosBase[0], tN=rgTramosBase[rgTramosBase.length-1];
    const p1=finalDe(t1.p), pN=finalDe(tN.p); const m1=mrg(p1), mN=mrg(pN);
    box.className="rentbox "+cls(mN);
    const rango=rgTramosBase.length>1?`de <b>${m1}%</b> (${t1.q}u → ${M(p1)}) a <b>${mN}%</b> (${tN.q}u → ${M(pN)})`:`<b>${m1}%</b> (${M(p1)})`;
    box.innerHTML=`Sobre la escalera · Rentabilidad ${rango} <span class="sub2">· costo ${M(costo)}</span>${mN<0?' ⚠️ el último tramo pierde plata':(mN<15?' · último tramo ajustado':'')}`;
  }
  if(rgPvp>0){
    const b1=(rgTramosBase&&rgTramosBase.length)?rgTramosBase[0].p:null;
    const pCli=modo==='precio'?valRaw:(b1!=null?finalDe(b1):null);
    if(pCli>0 && rgPvp>pCli){ box.innerHTML+=`<div style="margin-top:6px;font-weight:800;color:#0E5C46">🏷️ El cliente lo ve como −${Math.round((1-pCli/rgPvp)*100)}% (PVP ${M(rgPvp)} → ${M(pCli)})</div>`; }
  }
}
// Escribe eyg.sync_ofertas (+_flat) con TODO SYNC_OF y recalcula (1 producto → instantáneo; categoría → completo).
async function rgSave(recalcTmpl){
  await setParam(KEY_SYNC_OF, JSON.stringify(SYNC_OF));
  await setParam(KEY_SYNC_OF_FLAT, ofSyncFlat(SYNC_OF));
  try{
    if(recalcTmpl){
      const t=await EYG.rpc("product.template","read",[[recalcTmpl],["product_variant_id"]],LANG);
      const vid=t&&t[0]&&t[0].product_variant_id&&t[0].product_variant_id[0];
      if(vid) await EYG.rpc("ir.actions.server","run",[[1213]],{context:{lang:"es_AR",eyg_solo_producto:vid}});
      else await EYG.rpc("ir.actions.server","run",[[1213]],{context:{lang:"es_AR"}});
    } else { await EYG.rpc("ir.actions.server","run",[[1213]],{context:{lang:"es_AR"}}); }
  }catch(e){}
}
window.rgGuardar=async()=>{
  const d=rgDraft; if(!d) return;
  if(!d.target){ toast("Elegí a qué aplica: categoría, subcategoría o producto"); return; }
  d.modo=document.getElementById("rg-modo").value;
  const valorRaw=parseFloat(document.getElementById("rg-valor").value);
  if(!(valorRaw>0)){ toast("Cargá un valor válido (mayor a 0)"); return; }
  d.valor=d.modo==='pct'?valorRaw/100:valorRaw;
  const remEl=document.getElementById("rg-reemplaza");
  d.reemplaza=d.modo==='precio'?true:(remEl&&remEl.value==='1');
  d.hasta=document.getElementById("rg-hasta").value||"";
  d.stock=document.getElementById("rg-stock").value||"";
  delete d._origen;   // regla creada acá = oferta de usuario, nunca override automático
  const i=SYNC_OF.findIndex(o=>o.id===d.id);
  if(i>=0) SYNC_OF[i]=d; else SYNC_OF.push(d);
  const esProd=d.tipo==='p';
  rgDraft=null;
  if(!esProd) toast("Oferta guardada · aplicando a la categoría (unos segundos)…");
  await rgSave(esProd?d.target:null);
  toast("Oferta guardada y aplicada ✓"); render();
};
window.rgPausar=async id=>{ const o=SYNC_OF.find(x=>x.id===id); if(!o)return; o.pausada=!o.pausada; await rgSave(o.tipo==='p'?o.target:null); render(); toast(o.pausada?"Oferta pausada ✓":"Oferta reanudada ✓"); };
window.rgEliminar=async id=>{ const o=SYNC_OF.find(x=>x.id===id); if(!o)return; if(!confirm("¿Eliminar esta oferta? Vuelve la escalera normal.")) return; const tgt=o.tipo==='p'?o.target:null; SYNC_OF=SYNC_OF.filter(x=>x.id!==id); await rgSave(tgt); render(); toast("Oferta eliminada ✓"); };

EYG.requireAuth(["inventario"], perfil=>{
  document.body.innerHTML = EYG.layout(perfil,"oportunidades",'<div id="cont"></div><div id="modal"></div>',"Oportunidades y Ofertas");
  cargar();
});
</script>
