<style>
  .intro{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px;font-size:13.5px;color:var(--gris)}
  .intro b{color:var(--ink)}
  .intro details{margin-top:8px}
  .intro summary{cursor:pointer;color:var(--teal);font-weight:700}
  .intro .std{margin-top:10px;font-size:13px;line-height:1.7}
  .intro code{background:#eef6f5;color:var(--teal-deep);padding:1px 6px;border-radius:5px;font-family:ui-monospace,monospace}

  .kpis{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow);min-width:120px}

  .kpi .l{font-size:11.5px;color:var(--gris);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
  .kpi.warn .n{color:#c2410c} .kpi.good .n{color:var(--teal)} .kpi.bad .n{color:#b45309}
  .escala{grid-column:1/-1;font-size:12px;color:var(--gris);background:#f6faf9;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:2px}
  .escala b{color:var(--teal-deep)}
  /* cambiar la categoría desde la fila */
  .catcell .catbtn{background:#eef6f5;color:var(--teal-deep);border:1px solid var(--teal-med);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;max-width:100%;text-align:left;line-height:1.3}
  .catcell .catbtn:hover{background:#e0f0ee}
  .catcell.edit select{width:100%;padding:7px 9px;border:1px solid var(--teal);border-radius:8px;font-family:inherit;font-size:12.5px}
  .catacts{display:flex;gap:6px;margin-top:5px}
  .catok{background:var(--teal);color:#fff;border:none;border-radius:7px;padding:5px 12px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
  .catok:disabled{opacity:.5}
  .catcancel{background:#fff;color:var(--gris);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  .fld-cat{min-width:210px}
  /* enganche con AlfaBeta */
  .pcard.atado{border-left:4px solid #b45309;background:#fffdf7}
  .abbox{margin-top:6px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}

  .abbtn{background:#b45309;color:#fff;border:none;border-radius:8px;padding:4px 10px;font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit}
  .abbtn:hover{background:#92400e} .abbtn:disabled{opacity:.5;cursor:default}
  .absub{font-size:10px;color:var(--gris2);font-weight:700}
  /* "a corregir" clickeable: sube esos productos al principio de la sección */

  .secchg.on{box-shadow:0 0 0 2px #fff,0 0 0 4px #f97316}
  /* resultados del buscador que están fuera de la categoría abierta */
  .fuera{margin:14px 0;background:#f4fbfa;border:1px dashed var(--teal-med);border-radius:12px;padding:12px 14px}
  .fuera .fhead{font-size:12px;font-weight:800;color:var(--teal-deep);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}

  .sechead{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none;background:var(--surface);position:relative;z-index:1;border-bottom:1px solid transparent;transition:background .12s}

  .sugbox .usar:hover{background:var(--teal-deep)}

    .pc-top{flex-direction:column;gap:8px}

  .kpi.clk{cursor:pointer;transition:all .12s} .kpi.clk:hover{border-color:var(--teal-med);transform:translateY(-1px)}

  .btn-toggle.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .btn-sync{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
  .btn-sync:hover{background:var(--teal-deep)}
  .btn-recalc{background:#f59e0b;color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}

  .btn-undo:hover{background:#fff7ed}

  .addb{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .addb input{width:50px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;font-family:inherit}

  .addb button{background:var(--teal);color:#fff;border:none;border-radius:6px;padding:5px 8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
  .addb button:hover{background:var(--teal-deep)} .addb button:disabled{opacity:.6}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=78"></script>
<script>
/* ================= EyG Core · Depósito · Maestro de productos ================= */
// Categorías raíz que administra el módulo. `excluir` = subcategorías vacías/ajenas al desplegable de asignación.
// formas:true -> abrevia/minúscula la forma farmacéutica (comp, susp, sol, gel…) porque es redundante con la subcategoría.
// En Farmacopea (formas:false) esas palabras SON parte del nombre (SOLUCION, GEL, CREMA) y no se tocan.
const CATEGS = [
  // "Todas" arranca abierta: se ve el catálogo entero y desde arriba se filtra por familia.
  // Las secciones pasan a ser "FAMILIA / subcategoría" (el prefijo "ALL" se saca igual).
  {id:0,  label:"Todas",          prefix:"ALL",                 excluir:["-*-*-"], formas:false, todas:true},
  {id:24, label:"Hospitalarios", prefix:"ALL / HOSPITALARIOS", excluir:["-*-*-","JERINGAS","MEDICACION PSICO"], formas:true},
  {id:10, label:"Farmacopea",     prefix:"ALL / FARMACOPEA",     excluir:["-*-*-"], formas:false},
  {id:51, label:"Descartables",   prefix:"ALL / DESCARTABLES",   excluir:["-*-*-"], formas:false},
  {id:11, label:"Perfumería",     prefix:"ALL / PERFUMERIA",     excluir:["-*-*-"], formas:false},
  {id:369,label:"Equipos Médicos",prefix:"ALL / EQUIPOS MEDICOS",excluir:["-*-*-"], formas:false},
  {id:370,label:"Ortopedia",      prefix:"ALL / ORTOPEDIA",      excluir:["-*-*-"], formas:false},
  // Éticos: 17k productos (casi todo vademécum de Alfabeta sin stock). En el Maestro se cargan
  // solo los que EyG maneja (con stock) para no inundar; el resto no aporta a la escalera.
  {id:12, label:"Éticos",         prefix:"ALL / ETICOS",         excluir:["-*-*-"], formas:false, dom:[["qty_available",">",0]]},
];
let ROOT = CATEGS[0];                 // categoría activa
const LANG = {context:{lang:"es_AR"}};
// saca el prefijo "ALL / CATEGORÍA / " del complete_name para quedarnos con la subcategoría
function stripPrefix(full){
  const rx = new RegExp("^"+ROOT.prefix.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"( / )?");
  return (full||"").replace(rx,"");
}

// Unidad de venta por subcategoria: unifica las columnas Bulto/caja y Embalaje.
// Ampollas: "jeringas" si el nombre dice jer/prell/jga. (Debe coincidir con la config del cron.)
const UNIDAD_SUB = {
  "HOSP. COMPRIMIDOS":"tiras", "HOSP. AMPOLLAS":"amp", "HOSP. FRASCO AMPOLLA":"frascos amp",
  "HOSP. JARABES":"unidades", "HOSP. GOTAS":"unidades", "HOSP.CREMAS":"unidades",
  "HOSP. SPRAYS":"unidades", "HOSP. TIRAS REACTIVAS / TEST RAPIDOS":"unidades"
};
function unidadDe(p){
  let u = UNIDAD_SUB[p.sub] || "unidades";
  if(p.sub==="HOSP. AMPOLLAS" && /jer|prell|jga/i.test(p.nombre||"")) u="jeringas";
  return u;
}
// Unidad que se muestra en el paréntesis del nombre, por subcategoría: {sing, plur, forma}
// forma = palabra de forma farmacéutica que hay que SACAR del cuerpo (redundante con la subcategoría).
const UNI_PAREN = {
  "HOSP. COMPRIMIDOS":  {sing:"tira", plur:"tiras", forma:null},
  "HOSP. AMPOLLAS":     {sing:"amp",  plur:"amp",   forma:/\bampollas?\b|\bamp\b/gi},
  "HOSP. FRASCO AMPOLLA":{sing:"frasco amp", plur:"frascos amp", forma:/\bfrasco\s*ampollas?\b/gi},
  "HOSP. JARABES":      {sing:"unidad", plur:"unidades", forma:null},
  "HOSP. GOTAS":        {sing:"unidad", plur:"unidades", forma:null},
  "HOSP.CREMAS":        {sing:"unidad", plur:"unidades", forma:null},
  "HOSP. SPRAYS":       {sing:"unidad", plur:"unidades", forma:null},
  "HOSP. TIRAS REACTIVAS / TEST RAPIDOS":{sing:"unidad", plur:"unidades", forma:null}
};
function uniParen(sub, nombre){
  let up = UNI_PAREN[sub] || {sing:"unidad", plur:"unidades", forma:null};
  if(sub==="HOSP. AMPOLLAS" && /jer|prell|jga/i.test(nombre||"")) up={sing:"jeringa", plur:"jeringas", forma:/\b(jga|jer|jeringa)\.?\s*prell\.?/gi};
  return up;
}

/* ---------- UNIDAD DE VENTA seleccionable (dropdown → campo Odoo x_unidad) ----------
   El usuario elige la unidad real de venta por producto: "hay de todo, cajas, tiras, ampollas…". */
const UNIDADES = [
  {k:"unidad", sing:"unidad",  plur:"unidades", lbl:"unidad"},
  {k:"caja",   sing:"caja",    plur:"cajas",    lbl:"caja (cerrada)"},
  {k:"tira",   sing:"tira",    plur:"tiras",    lbl:"tira"},
  {k:"blister",sing:"blister", plur:"blisters", lbl:"blister"},
  {k:"amp",    sing:"amp",     plur:"amp",      lbl:"ampolla"},
  {k:"comp",   sing:"comp",    plur:"comp",     lbl:"comprimido"},
  {k:"caps",   sing:"caps",    plur:"caps",     lbl:"cápsula"},
  {k:"jeringa",sing:"jeringa", plur:"jeringas", lbl:"jeringa"},
  {k:"frasco", sing:"frasco",  plur:"frascos",  lbl:"frasco"},
  // "frasco" a secas se usa para jarabes y suspensiones (el frasco de 120 ml). El vial de
  // polvo liofilizado es otra presentación y lleva la suya: frasco ampolla.
  {k:"frascoamp", sing:"frasco amp", plur:"frascos amp", lbl:"frasco ampolla"},
  {k:"sobre",  sing:"sobre",   plur:"sobres",   lbl:"sobre"},
  {k:"ml",     sing:"ml",      plur:"ml",       lbl:"ml"},
  {k:"g",      sing:"g",       plur:"g",        lbl:"gramo"},
  {k:"gotas",  sing:"gotas",   plur:"gotas",    lbl:"gotas"},
];
// clave por defecto según la subcategoría (si el producto no tiene override x_unidad)
function unidadDefKey(sub, nombre){
  const up = uniParen(sub, nombre);
  const f = UNIDADES.find(u=>u.sing===up.sing);
  return f ? f.k : "unidad";
}
function unidadVenta(p){
  const k = (p.ed && p.ed.unidadKey) || unidadDefKey(p.sub, p.nombre);
  return UNIDADES.find(u=>u.k===k) || UNIDADES[0];
}
/* ---------- CONTENEDOR del bulto: no siempre es "Caja" (puede ser Pack, Kit, Bulto…) ---------- */
const CONTENEDORES = ["Caja","Pack","Kit","Bulto","Blister","Estuche"];
function capCont(t){ if(!t) return ""; t=t.toLowerCase(); if(t.indexOf("blister")===0) return "Blister"; return t.charAt(0).toUpperCase()+t.slice(1); }

/* ---------- descompone el nombre en campos editables y recompone ----------
   Modelo Opción A: el NOMBRE es la verdad. Cada campo (droga/conc/present/lab/unidad/bulto)
   se edita por separado y se vuelve a armar el nombre → product.template.name.
   Laboratorio y Unidad además se guardan en campos propios (x_laboratorio / x_unidad). */
function decompose(a){                       // a = resultado de analizar(nombre, sub)
  const cuerpo = (a.cuerpo||"").trim();      // "DROGA CONC x PRESENT - LAB" (ya limpio, sin paréntesis)
  let lab="", body=cuerpo;
  const li = cuerpo.lastIndexOf(" - ");
  if(li>=0){ lab=cuerpo.slice(li+3).trim(); body=cuerpo.slice(0,li).trim(); }
  const xi = body.search(/\sx\s/i);
  const izq = (xi>=0 ? body.slice(0,xi) : body).trim();
  const present = (xi>=0 ? body.slice(xi+3) : "").trim();
  const conc = a.desg.conc || "";
  let droga = izq;
  if(conc){ const di = izq.search(/\d/); if(di>0) droga = izq.slice(0,di).trim(); }
  // unidad del CONTENIDO del bulto (tiras/blisters/amp/…), tomada del nombre si está
  let bultoUnidad = "";
  if(a.desg.bultoTipo){ const f=UNIDADES.find(u=>u.plur===a.desg.bultoTipo||u.sing===a.desg.bultoTipo); if(f) bultoUnidad=f.k; }
  return {
    droga, conc, present, lab,
    contenedor: a.desg.contenedor || "Caja",
    bultoNum: a.desg.bultoNum || null,
    bultoUnidad,
    cajaCerrada: !!a.desg.cajaCerrada,
    extra: a.desg.extra || []
  };
}
function compose(p){
  const e = p.ed || {};
  const u = unidadVenta(p);                          // unidad de VENTA (puede ser "caja")
  const up = uniParen(p.sub, p.nombre);              // unidad NATURAL del contenido (tira/amp/unidad)
  let contPlur;
  if(e.bultoUnidad){ const cu=UNIDADES.find(x=>x.k===e.bultoUnidad); contPlur = cu?cu.plur:up.plur; }
  else contPlur = (u.k==='caja') ? up.plur : u.plur; // el bulto se cuenta en la unidad de contenido
  const pp = ["Precio x "+u.sing];
  if(e.bultoNum) pp.push((e.contenedor||"Caja")+" x "+e.bultoNum+" "+contPlur);
  if(e.cajaCerrada) pp.push("caja cerrada");
  (e.extra||[]).forEach(x=>pp.push(x));
  let cuerpo = (e.droga||"").trim();
  if((e.conc||"").trim())    cuerpo += " "+e.conc.trim();
  if((e.present||"").trim()) cuerpo += " x "+e.present.trim();
  if((e.lab||"").trim())     cuerpo += " - "+e.lab.trim();
  return (cuerpo+" ("+pp.join(" · ")+")").replace(/\s+/g," ").replace(/\s+\)/g,")").trim();
}
// recalcula desg/sugerido/cambia + campos editables desde el nombre actual, conservando overrides
function refrescarEd(p){
  const a = analizar(p.nombre, p.sub);
  p.sugerido=a.sugerido; p.motivos=a.motivos; p.desg=a.desg; p.cuerpo=a.cuerpo; p.cambia=a.cambia;
  const d = decompose(a);
  d.unidadKey = (p.ed && p.ed.unidadKey) || (p.unidadField || "") || unidadDefKey(p.sub, p.nombre);
  if(p.labField) d.lab = p.labField;
  p.ed = d;
}
const SIN_SUB = "(sin subcategoría)";
// para comparar nombres: lo que el ojo ve. El HTML colapsa los espacios de más, así que dos
// textos que sólo difieren en espacios se ven iguales y no tiene sentido "sugerir" el cambio.
const norm = t => String(t||"").replace(/\s+/g," ").trim();
let SUBCATS_ODOO = [];   // subcategorias reales de HOSPITALARIOS (para el desplegable): [{id,name}]
// sugiere la subcategoria segun el nombre del producto
function sugerirSubId(p){
  const n=(p.nombre||"").toLowerCase(); let nom=null;
  if(/frasco\s*ampolla/.test(n)) nom="HOSP. FRASCO AMPOLLA";
  else if(/ampolla/.test(n)) nom="HOSP. AMPOLLAS";
  else if(/spray|aerosol/.test(n)) nom="HOSP. SPRAYS";
  else if(/crema|pomada|\bgel\b|\bpote\b/.test(n)) nom="HOSP.CREMAS";
  else if(/jarabe|\bjbe\b|susp/.test(n)) nom="HOSP. JARABES";
  else if(/gotas/.test(n)) nom="HOSP. GOTAS";
  else if(/\bcomp\b|comprimido|\bcaps\b|capsula/.test(n)) nom="HOSP. COMPRIMIDOS";
  const c=SUBCATS_ODOO.find(x=>x.name===nom); return c?c.id:null;
}
function selectorSub(p){
  const sug=sugerirSubId(p);
  const opts=SUBCATS_ODOO.map(c=>`<option value="${c.id}" ${c.id===sug?"selected":""}>${EYG.esc(c.name)}</option>`).join("");
  return `<div class="subassign"><span class="lbl">📁 Sin subcategoría — asigná una:</span>
    <select id="sub-${p.id}"><option value="" ${sug?"":"selected"}>— elegí —</option>${opts}</select>
    <button onclick="asignarSub(${p.id})">Asignar</button></div>`;
}

/* ---------- diccionario de formas farmacéuticas (detección: multipalabra primero) ---------- */
const FORMAS_DET = [
  {c:"frasco ampolla", re:/\bfrasco\s*ampollas?\b/i, u:""},
  {c:"jga prell",      re:/\b(jga|jer|jeringa)\.?\s*prell/i, u:""},
  {c:"comp",  re:/\b(comprimidos?|comp)\b/i,   u:"comp"},
  {c:"caps",  re:/\b(c[aá]psulas?|caps?)\b/i,   u:"caps"},
  {c:"susp",  re:/\b(suspensi[oó]n|susp)\b/i,    u:"ml"},
  {c:"jbe",   re:/\b(jarabe|jbe)\b/i,            u:"ml"},
  {c:"gotas", re:/\bgotas?\b/i,                  u:"ml"},
  {c:"sol",   re:/\b(soluci[oó]n)\b/i,           u:"ml"},
  {c:"spray", re:/\b(spray|aerosol)\b/i,         u:"ml"},
  {c:"amp",   re:/\b(ampollas?|amp)\b/i,         u:"amp"},
  {c:"vial",  re:/\bvial\b/i,                    u:"u"},
  {c:"gel",   re:/\bgel\b/i,                     u:"g"},
  {c:"crema", re:/\bcrema\b/i,                   u:"g"},
  {c:"pomada",re:/\bpomada\b/i,                  u:"g"},
  {c:"supos", re:/\b(supositorios?|supos?)\b/i,  u:"u"},
  {c:"óvulo", re:/\b([oó]vulos?)\b/i,            u:"u"},
  {c:"sobre", re:/\bsobres?\b/i,                 u:"u"},
];
const FORMAS_SIMPLE = FORMAS_DET.filter(f=>!/\s/.test(f.c)); // sin multipalabra para el replace de casing
const TYPOS = [
  [/HOSPITALRIO/gi,"HOSPITALARIO"], [/HOSPITALARIA\b/gi,"HOSPITALARIO"],
  [/\bVANIER\b/gi,"VANNIER"], [/COMRPIMIDO/gi,"COMPRIMIDO"], [/COMPRMIDO/gi,"COMPRIMIDO"],
];
function uDisp(u){ return u==="ui"?"UI":u; }
function normTipo(t){ if(!t) return ""; t=t.toLowerCase().replace(/\.$/,""); if(/tira/.test(t))return"tiras"; if(/^unidad|^u$/.test(t))return"unidades"; if(/^(comp|caps|amp)/.test(t))return t; return t; }

/* ---------- normaliza el NOMBRE y devuelve {sugerido, motivos, desglose} ---------- */
function analizar(raw, sub){
  const motivos=[]; const add=m=>{ if(!motivos.includes(m)) motivos.push(m); };
  const up = uniParen(sub, raw);
  let s=(raw==null?"":String(raw));
  const parens=[]; let core=s.replace(/\(([^)]*)\)/g,(m,inner)=>{ parens.push(inner.trim()); return " "; });

  if(/^\s*\[[^\]]*\]\s*/.test(core)){ core=core.replace(/^\s*\[[^\]]*\]\s*/,""); add("código en el nombre"); }
  if(/@/.test(core)){ core=core.replace(/@/g," "); add("símbolo @"); }
  if(/\b[HB]-\d+(-\d+)?\b/i.test(core)){ core=core.replace(/\b[HB]-\d+(-\d+)?\b/gi," "); add("ubicación en el nombre"); }

  const antesEsp=core; core=core.replace(/\s+/g," ").replace(/\s+([.,])/g,"$1").trim();
  if(/\s{2,}/.test(antesEsp)||/\s$/.test(raw)||/^\s/.test(raw)) add("espacios");

  if(/(\d)(mg|mcg|ml|gr|kg|cc|g|ui|vol|lt)\b/i.test(core)) add("unidad pegada al número");
  core=core.replace(/(\d)\s*(mg|mcg|ml|gr|kg|cc|g|ui|vol|lt)\b/gi,(m,n,u)=>n+" "+u.toLowerCase());

  const antesDec=core;
  core=core.replace(/(\d)[.,](\d+)\s*%/g,(m,a,b)=>a+","+b+"%").replace(/(\d)\s+%/g,"$1%");
  core=core.replace(/(\d)\.(\d+)\s+(mg|mcg|ml|gr|g|ui|vol)\b/gi,(m,a,b,u)=>a+","+b+" "+u.toLowerCase());
  if(antesDec!==core) add("decimales / %");

  const antesX=core; core=core.replace(/\bx\s*(\d)/gi,"x $1"); if(antesX!==core) add('separación "x"');
  TYPOS.forEach(([re,to])=>{ if(re.test(core)){ core=core.replace(re,to); add("error de tipeo"); } });

  // "HOSPITALARIO/HOSP" en el nombre es redundante (ya está la categoría) -> se saca
  if(/\b(hospitalari[oa]s?|hosp)\b/i.test(core)){ core=core.replace(/\bhospitalari[oa]s?\b/ig," ").replace(/\bhosp\.?\b/ig," "); add("quita 'Hospitalario'"); }

  let ventaCerrada=false;
  if(/se vende por caja cerrada/i.test(core)){ ventaCerrada=true; core=core.replace(/\s*se vende por caja cerrada\s*/ig," "); }

  // bulto/caja escrito FUERA del paréntesis -> lo detecto y lo saco del core (se recompone en el paréntesis)
  let bultoCore=null;
  { const mbc=core.match(/\b(caja|blister(?:a)?|bulto|pack|kit|estuche)\s*x\s*(\d+)\s*(tiras?|comp|caps|amp|unidades?|u)?\b/i);
    if(mbc){ bultoCore={num:parseInt(mbc[2],10), tipo:normTipo(mbc[3]), cont:capCont(mbc[1])}; core=core.replace(mbc[0]," "); add("bulto fuera del paréntesis"); }
    else { const mt=core.match(/\bx\s*(\d+)\s*tiras?\b/i); if(mt){ bultoCore={num:parseInt(mt[1],10), tipo:"tiras"}; core=core.replace(mt[0]," "); add("bulto fuera del paréntesis"); } }
  }

  if(/\b(comprimidos?|c[aá]psulas?|suspensi[oó]n|jarabe|ampollas?|soluci[oó]n|supositorios?)\b/i.test(core)) add("abreviatura");

  const preCase=core;
  let out=core.toUpperCase();
  out=out.replace(/\b(MG|MCG|ML|GR|KG|CC|VOL|G|LT|LITROS?)\b/g,m=>m.toLowerCase());
  out=out.replace(/\bX\b/g,"x");
  // abreviatura/minúscula de formas farmacéuticas: solo donde la forma es redundante con la subcategoría (Hospitalarios)
  if(!ROOT || ROOT.formas!==false){
    FORMAS_SIMPLE.forEach(f=>{ out=out.replace(new RegExp(f.re.source,"gi"), f.c); });
    out=out.replace(/\bFRASCO\s+amp\b/gi,"frasco ampolla");
    out=out.replace(/\b(JGA|JER|JERINGA)\.?\s*PRELL\.?/gi,"jga prell");
  }
  // saca la palabra de forma que ya está implícita en la subcategoría (ej. "ampolla"/"amp" en Ampollas)
  if(up.forma){ const antesF=out; out=out.replace(up.forma," "); if(antesF!==out) add("saca forma redundante"); }
  out=out.replace(/\s+-\s*|\s*-\s+/g," - ").replace(/(?: - ){2,}/g," - ").replace(/^\s*-\s+|\s+-\s*$/g,"").replace(/\s+/g," ").trim();
  out=out.replace(/\b(mg|mcg|ml|gr|kg|cc|g|ui|vol|lt)\.(?=\s|$)/gi,"$1");  // "ml." / "lt." -> "ml" / "lt"
  // limpia colgantes: guion + número suelto al final (ej. "ROSPAW - 4"), guiones/puntos/comas sueltos al final
  const antesCol=out;
  out=out.replace(/\s+-\s+\d+\s*$/,"").replace(/[\s\-–·.,]+$/,"").replace(/^[\s\-–·.,]+/,"").trim();
  if(antesCol!==out) add("limpia colgantes");
  if(preCase!==out && preCase.toLowerCase()===out.toLowerCase()) add("mayúsculas/minúsculas");

  const desg=desglosar(out,parens,add);
  desg.cajaCerrada = desg.cajaCerrada || ventaCerrada;
  if(!desg.bultoNum && bultoCore){ desg.bultoNum=bultoCore.num; desg.bultoTipo=bultoCore.tipo; if(bultoCore.cont) desg.contenedor=bultoCore.cont; }

  // paréntesis ESTÁNDAR por subcategoría: (Precio x <unidad> · Caja x N <unidad> [· caja cerrada])
  const pp=[];
  pp.push("Precio x "+up.sing);
  if(desg.bultoNum) pp.push((desg.contenedor||"Caja")+" x "+desg.bultoNum+" "+up.plur);
  if(desg.cajaCerrada) pp.push("caja cerrada");
  desg.extra.forEach(x=>pp.push(x));
  const parenOut = " ("+pp.join(" · ")+")";

  let sugerido=(out+parenOut).replace(/\s+/g," ").trim();
  // Se compara NORMALIZADO (espacios colapsados y sin bordes): hay 317 nombres con un espacio
  // al final y 186 con espacios dobles adentro, y el HTML los colapsa al mostrarlos. Sin esto,
  // la sugerencia se ve IDÉNTICA al nombre actual y parece que no sugiere nada.
  return { sugerido, motivos, desg, cuerpo: out, cambia: norm(sugerido)!==norm(raw) };
}

/* ---------- extrae concentración, presentación (unidad) y bulto ---------- */
function desglosar(core, parens, add){
  const d={conc:"", presentacion:"", forma:"", bultoNum:null, bultoTipo:"", contenedor:"", cajaCerrada:false, precioX:"", precioModo:"", ubicacion:"", extra:[]};
  for(const f of FORMAS_DET){ if(f.re.test(core)){ d.forma=f.c; break; } }

  const xi=core.search(/\sx\s/i); const izq=xi>=0?core.slice(0,xi):core; const der=xi>=0?core.slice(xi+3):"";
  const dose=[]; const reDose=/(\d+(?:,\d+)?)\s*(%|mg|mcg|ui|gr|g)(?![a-zé])/gi; let m;
  while((m=reDose.exec(izq))!==null){ dose.push(m[1]+(m[2]==="%"?"%":" "+uDisp(m[2].toLowerCase()))); }
  d.conc=dose.join(" + ");

  if(der){ const mp=der.match(/^(\d+(?:,\d+)?)\s*(comp|caps|ml|gr|g|amp)?\b/i);
    if(mp){ d.presentacion = mp[1] + (mp[2]?(" "+mp[2].toLowerCase()):""); } }

  for(const p of parens){
    const pl=p.toLowerCase();
    if(/caja cerrada/.test(pl)) d.cajaCerrada=true;
    const mb=pl.match(/(caja|pack|bulto|blister(?:a)?|kit|estuche)\s*x\s*(\d+)\s*([a-zé]+)?/);
    if(mb){ d.bultoNum=parseInt(mb[2],10); let t=(mb[3]||"").replace(/s$/,""); d.bultoTipo=/tira/.test(t)?"tiras":(t?t+"s":""); d.contenedor=capCont(mb[1]); }
    const mpx=pl.match(/precio\s*x\s*([a-zé]+)/); if(mpx) d.precioX=mpx[1];
    if(/precio\s*unitario/.test(pl)) d.precioModo="Precio unitario";
    else if(/precio\s*por\s*caja/.test(pl)) d.precioModo="Precio por caja";
    const mu=p.match(/\b([HB]-\d+(?:-\d+)?)\b/i); if(mu){ d.ubicacion=mu[1]; add("ubicación en el nombre"); }
    const conocida = mb||mpx||/precio\s*(unitario|por\s*caja)/.test(pl)||mu||/caja cerrada/.test(pl);
    if(!conocida && p.trim()) d.extra.push(p.trim());
  }
  return d;
}

/* =========================== estado + carga =========================== */
let TODOS = [], SUBCATS = [], abiertos = new Set(), filtro = "", HISTORIAL = [], filtros = {conCambios:false, sinBulto:false, sinConc:false, sinStock:false, conStock:false, sinEmbalaje:false, atadoAB:false};
/* ===== ENGANCHE CON ALFABETA =====
   AlfaBeta no mira nuestros productos: mira UN solo campo, `alfabeta_code`. Cada vez que corre
   (novedades cada 3 h, base completa a las 4 de la mañana) busca TODAS las fichas que llevan ese
   código y les escribe encima el PVP, y también la categoría y el impuesto. Por eso un producto
   nuestro que quedó con el código vuelve solo a Éticos cada noche.
   SOLTARLO = ponerle el código en cero y darle un interno de la casa (serie 153xxx).
   Para que AlfaBeta no cree una ficha nueva hay que dejarle un PARARRAYOS: otra ficha con ese
   código. Si el producto ya tiene una gemela en el vademécum, esa hace de pararrayos; si no la
   tiene, se le crea una copia.
   OJO (verificado 13/9/2026): el pararrayos tiene que quedar ACTIVO. Si se archiva, AlfaBeta deja
   de encontrarlo y crea una ficha nueva igual. Se le destilda "Puede ser vendido" para que nadie
   lo venda por error. */
let CATS_TODAS = [];   // todas las categorías de Odoo, para poder mover un producto a cualquiera
let CAT_EDIT = null;   // id del producto al que se le está cambiando la categoría (una por vez)
let ARRIBA = new Set();// subcategorías donde los "a corregir" van primero (badge naranja clickeado)
let GEM = {};          // {tmplId: ficha gemela con el mismo código, si existe}
let PROX_INT = null;   // próximo código interno libre de la serie 153xxx
let FUERA = [];        // resultados del buscador que están FUERA de la categoría cargada
let BUSCANDO = false;

async function cargar(preservar){
  const cont = document.getElementById("cont");
  cont.innerHTML = '<div class="empty"><div class="spinner"></div>Leyendo productos de Odoo…</div>';
  let recs;
  try{
    // "Todas" = las 6 familias completas + los éticos que EyG maneja (con stock). Los ~17.000
    // éticos del vademécum sin stock no entran: inundarían la pantalla y no aportan.
    const dom = ROOT.todas
      ? ["|","&",["categ_id","child_of",12],["qty_available",">",0],["categ_id","child_of",[24,10,51,11,369,370]]]
      : [["categ_id","child_of",ROOT.id]];
    if(!ROOT.todas && ROOT.dom) ROOT.dom.forEach(c=>dom.push(c));   // filtro extra (ej. éticos: solo con stock)
    recs = await EYG.rpc("product.template","search_read",
      [dom,["id","default_code","name","categ_id","qty_available","product_variant_id","x_laboratorio","x_unidad","alfabeta_code","barcode"]],
      Object.assign({limit:5000, order:"name"}, LANG));
  }catch(e){ cont.innerHTML='<div class="empty">No se pudieron leer los productos: '+EYG.esc(e.message)+'</div>'; return; }

  // subcategorías reales de la categoría activa (para el desplegable de asignación)
  try{
    const cats = ROOT.todas ? [] : await EYG.rpc("product.category","search_read",
      [[["parent_id","=",ROOT.id]],["id","name"]], LANG);
    const EXCLUIR = ROOT.excluir||[];   // vacías / ajenas a la categoría
    SUBCATS_ODOO = cats.filter(c=>c.name && EXCLUIR.indexOf(c.name)===-1).sort((a,b)=>a.name.localeCompare(b.name));
  }catch(e){ SUBCATS_ODOO=[]; }

  // Embalaje (product.packaging) por variante — la caja real = mínimo de compra
  const varIds = recs.map(r=>r.product_variant_id&&r.product_variant_id[0]).filter(Boolean);
  const packByVar = {};
  if(varIds.length){
    try{
      const packs = await EYG.rpc("product.packaging","search_read",
        [[["product_id","in",varIds]],["id","name","qty","product_id"]], LANG);
      packs.forEach(k=>{ const v=k.product_id&&k.product_id[0]; if(v && !packByVar[v]) packByVar[v]=k; });
    }catch(e){ /* si falla, se muestran sin embalaje */ }
  }

  TODOS = recs.map(r=>{
    const sub=stripPrefix(r.categ_id&&r.categ_id[1]||"")||"(sin subcategoría)";
    const a = analizar(r.name||"", sub);
    const varId = (r.product_variant_id&&r.product_variant_id[0])||null;
    const pk = varId ? packByVar[varId] : null;
    const labField = r.x_laboratorio||"";
    const unidadField = r.x_unidad||"";
    const ed = decompose(a);
    ed.unidadKey = unidadField || unidadDefKey(sub, r.name||"");
    if(labField) ed.lab = labField;                       // el campo dedicado gana si está cargado
    return { id:r.id, sku:r.default_code||"", nombre:r.name||"",
             stock:(r.qty_available!=null?r.qty_available:0),
             varId, embalaje: pk?pk.qty:null, embId: pk?pk.id:null, embNombre: pk?pk.name:"", sub,
             labField, unidadField, ed, ab:(r.alfabeta_code||0), catId:(r.categ_id&&r.categ_id[0])||0, barcode:(r.barcode||null),
             catFull:((r.categ_id&&r.categ_id[1])||"").replace(/^ALL \/ /,""),
             ...a, aplicado:false };
  });
  await cargarEngancheAB(TODOS);
  if(!CATS_TODAS.length) await cargarCategorias();
  // subcategorías presentes (ordenadas por cantidad)
  const bycat = {};
  TODOS.forEach(p=>{ bycat[p.sub]=(bycat[p.sub]||0)+1; });
  SUBCATS = Object.keys(bycat).sort((x,y)=>bycat[y]-bycat[x]);
  // conserva las secciones abiertas al sincronizar; en la 1ª carga abre la primera
  abiertos = new Set([...abiertos].filter(s=>SUBCATS.includes(s)));
  if(!preservar && !abiertos.size && SUBCATS.length) abiertos.add(SUBCATS[0]);
  render();
}

function filtrarSub(sc){
  let arr = TODOS.filter(p=>p.sub===sc);
  if(filtro){ const q=filtro.toLowerCase(); arr = arr.filter(p=>(p.nombre+" "+p.sku).toLowerCase().includes(q)); }
  if(filtros.conCambios) arr = arr.filter(p=>p.cambia && !p.aplicado);
  if(filtros.sinBulto)   arr = arr.filter(p=>!p.desg.bultoNum);
  if(filtros.sinConc)    arr = arr.filter(p=>!p.desg.conc);
  if(filtros.sinStock)   arr = arr.filter(p=>(p.stock||0)<=0);
  if(filtros.conStock)   arr = arr.filter(p=>(p.stock||0)>0);
  if(filtros.sinEmbalaje)arr = arr.filter(p=>p.embalaje==null);
  if(filtros.atadoAB)    arr = arr.filter(p=>p.ab>0 && !esEtico(p));
  return arr;
}
/* Los ÉTICOS TIENEN que seguir enganchados: de ahí sale su PVP de AlfaBeta. Los que conviene
   soltar son los NUESTROS. Contándolos juntos el KPI decía 390 cuando lo que hay para revisar
   son 111. */
function esEtico(p){ return /^ETICOS/.test(p.catFull||""); }
function hayFiltroActivo(){ return !!filtro || Object.values(filtros).some(Boolean); }

function render(){
  const cont = document.getElementById("cont");
  // KPIs y filtros GLOBALES (sobre todo el catálogo cargado)
  const total = TODOS.length;
  const conCambio = TODOS.filter(p=>p.cambia && !p.aplicado).length;
  const sinConc = TODOS.filter(p=>!p.desg.conc).length;
  const sinBulto = TODOS.filter(p=>!p.desg.bultoNum).length;
  const sinEmb = TODOS.filter(p=>p.embalaje==null).length;
  const sinStock = TODOS.filter(p=>(p.stock||0)<=0).length;
  const atados = TODOS.filter(p=>p.ab>0 && !esEtico(p)).length;

  const kpi = (key,n,label,cls)=>`<div class="kpi ${cls||""} ${key?"clk":""} ${key&&filtros[key]?"on":""}" ${key?`onclick="toggleFiltro('${key}')"`:""}><div class="n">${n}</div><div class="l">${label}</div></div>`;
  const kpis = `<div class="kpis">
    ${kpi(null,total,"Productos","")}
    ${kpi("conCambios",conCambio,"Con corrección","warn")}
    ${kpi("sinConc",sinConc,"Sin concentración","warn")}
    ${kpi("sinBulto",sinBulto,"Sin unidades por caja","warn")}
    ${kpi("sinEmbalaje",sinEmb,"Sin múltiplo de venta","warn")}
    ${kpi("sinStock",sinStock,"Sin stock","")}
    ${kpi("atadoAB",atados,"🧲 Atados a AlfaBeta","bad")}
  </div>`;

  const catsel = `<div class="catsel"><span class="lbl">Categoría</span>${CATEGS.map((c,i)=>`<div class="catpill ${c.id===ROOT.id?"active":""}" onclick="setCateg(${i})">${EYG.esc(c.label)}</div>`).join("")}</div>`;

  const filtrando = hayFiltroActivo();
  const enVista = SUBCATS.reduce((a,sc)=>a+filtrarSub(sc).length,0);
  const algunFiltro = filtros.conCambios||filtros.sinBulto||filtros.sinConc||filtros.sinStock||filtros.conStock||filtros.sinEmbalaje||filtros.atadoAB;
  const toolbar = `<div class="toolbar">
    <button class="btn-sync" onclick="sincronizar()">🔄 Actualizar</button>
    <button class="btn-toggle ${filtros.conStock?"on":""}" onclick="toggleFiltro('conStock')">📦 Solo con stock</button>
    <input type="search" id="buscar" placeholder="Buscar por nombre o SKU (en todas las subcategorías)…" value="${EYG.esc(filtro)}" oninput="onBuscar(this.value)">
    <button class="btn-expand" onclick="toggleTodas()">${abiertos.size>=SUBCATS.length?"Contraer todo":"Expandir todo"}</button>
    ${algunFiltro?`<button class="btn-clear" onclick="limpiarFiltros()">✕ Quitar filtros</button>`:""}
    ${HISTORIAL.length?`<button class="btn-undo" onclick="deshacer()">↩ Deshacer (${HISTORIAL.length})</button>`:""}
    <span class="cnt">${enVista} en vista</span>
  </div>`;


  // acordeón: una sección por subcategoría. Con búsqueda de texto, auto-abre las que tienen match.
  const secciones = SUBCATS.map((sc,i)=>{
    const totalSc = TODOS.filter(p=>p.sub===sc).length;
    const arr = filtrarSub(sc);
    if(filtrando && arr.length===0) return "";           // oculta subcategorías sin coincidencias
    const abierta = abiertos.has(sc) || (!!filtro && arr.length>0);
    const pend = arr.filter(p=>p.cambia && !p.aplicado).length;
    // el badge naranja ordena: primero los que tienen algo para corregir, así no hay que buscarlos
    const pendiente = p => (p.cambia && !p.aplicado) || !p.desg.conc || !p.desg.bultoNum || p.embalaje==null;
    const arrOrd = ARRIBA.has(sc) ? arr.slice().sort((a,b)=>(pendiente(b)?1:0)-(pendiente(a)?1:0)) : arr;
    const cuerpo = abierta
      ? `<div class="secbody">${arrOrd.length?arrOrd.map(p=>fila(p)).join(""):'<div class="empty">Sin coincidencias con el filtro.</div>'}</div>`
      : "";
    return `<div class="sec ${abierta?"open":""}">
      <div class="sechead" onclick="toggleSec(${i})">
        <span class="chev">▶</span>
        <span class="secname">${EYG.esc(sc)}</span>
        <span class="seccount">${filtrando?arr.length+" / "+totalSc:totalSc}</span>
        ${pend?`<span class="secchg clk ${ARRIBA.has(sc)?"on":""}" title="Tocá para traer arriba de todo los que tienen algo para corregir" onclick="event.stopPropagation();subirPendientes('${EYG.esc(sc).replace(/'/g,"\\'")}')">${pend} a corregir${ARRIBA.has(sc)?" ↑":""}</span>`:""}
        <span class="secright">${pend?`<button class="btn-secap" onclick="event.stopPropagation();aplicarTodos(${i})">Aplicar los ${pend} sugeridos</button>`:""}</span>
      </div>${cuerpo}</div>`;
  }).join("");
  const accordion = `<div class="accordion">${secciones||'<div class="empty">Sin resultados. Probá quitar filtros.</div>'}</div>`;
  // lo que el buscador encontró FUERA de la categoría abierta (otra categoría, o sin stock)
  let fueraHTML = "";
  if(String(filtro||"").trim().length>=3){
    if(BUSCANDO) fueraHTML = `<div class="fuera"><div class="fhead">Buscando en todo el catálogo…</div></div>`;
    else if(FUERA.length) fueraHTML = `<div class="fuera">
        <div class="fhead">${FUERA.length} encontrado${FUERA.length===1?"":"s"} fuera de esta categoría</div>
        <div class="fsub">Están en otra categoría, o son de Éticos sin stock (el Maestro no los carga). Desde acá podés soltarlos de AlfaBeta; para editarles el nombre y el bulto, abrí su categoría arriba.</div>
        ${FUERA.map(p=>filaFuera(p)).join("")}
      </div>`;
  }

  cont.innerHTML = `${catsel}<div class="intro">
      <b>Maestro de productos — Depósito.</b> El dato ordenado de cada producto: <b>nombre</b> (detecta mayúsculas, acentos, espacios, unidades pegadas, abreviaturas, códigos sueltos y propone el correcto), <b>unidades por caja</b>, <b>múltiplo de venta</b> y <b>categoría</b>. Cada subcategoría es una <b>sección desplegable</b>: tocá el título para abrirla o cerrarla. <b>Tocá una tarjeta</b> de arriba para filtrar en todas a la vez (con corrección, sin concentración, sin unidades por caja, sin múltiplo de venta, sin stock); el buscador también recorre todas las subcategorías. <b>Unidades por caja</b> sale del nombre y marca la cantidad en la que se llega al <b>descuento máximo</b>. <b>Múltiplo de venta</b> es la cantidad mínima en la que se comercializa el artículo — el embalaje real del proveedor — y es desde donde arranca la escala; en los productos que se venden <b>por caja</b> ese mismo dato pasa a ser el <b>tope de la escala</b>, y el campo se rotula así. Debajo de cada fila se indica en números cómo queda su escala. La <b>categoría</b> se cambia desde la propia fila. Revisá y aplicá con un clic; el resto lo sincroniza el sistema solo.
      <details><summary>🧲 Qué es "Atado a AlfaBeta" y cómo se suelta</summary>
        <div class="std">
          AlfaBeta no mira nuestros productos: mira <b>un solo campo</b>, el Código Alfa Beta. Cada vez que corre
          (novedades cada 3 h, base completa a las 4 de la mañana) busca todas las fichas con ese código y les
          <b>escribe encima el precio, la categoría y el impuesto</b>. Por eso un producto nuestro que quedó con el
          código <b>vuelve solo a Éticos cada noche</b>, aunque lo hayas movido.<br>
          <b>Soltarlo</b> le pone el código en cero y le da un interno de la casa (serie 153xxx). A partir de ahí
          AlfaBeta no lo toca más y la categoría, el impuesto y el precio quedan firmes.<br>
          Para que AlfaBeta no cree una ficha nueva se le deja un <b>pararrayos</b>: otra ficha con ese código.
          Si el producto ya tiene una gemela en el vademécum, esa hace de pararrayos; si no la tiene, <b>se le crea
          una copia</b>. El pararrayos queda <b>activo pero no vendible</b> — si se archiva, AlfaBeta no lo encuentra
          y genera otra ficha igual.<br>
          La tarjeta <b>🧲 Atados a AlfaBeta</b> de arriba filtra todos los que están en esta situación.
        </div>
      </details>
      <details><summary>Ver la regla de nombres que se aplica</summary>
        <div class="std">
          Formato objetivo: <code>MONODROGA CONCENTRACIÓN forma x contenido - LABORATORIO (Caja x N tipo)</code><br>
          • <b>Monodroga y laboratorio</b> en MAYÚSCULAS · <b>unidades y formas</b> en minúscula (mg, ml, comp, susp, amp…).<br>
          • Unidad separada del número: <code>500mg → 500 mg</code> · separador <code>x</code> con espacios: <code>x10 → x 10</code>.<br>
          • Abreviaturas unificadas: comprimidos→<code>comp</code>, cápsulas→<code>caps</code>, suspensión→<code>susp</code>, ampolla→<code>amp</code>, jarabe→<code>jbe</code>.<br>
          • Se quitan del nombre: el código <code>[SKU]</code>, el símbolo <code>@</code> y la ubicación de depósito <code>(H-1-XX)</code>.<br>
          • El bulto se normaliza a <code>(Caja x N tipo)</code>; “SE VENDE POR CAJA CERRADA” se conserva.
        </div>
      </details>
    </div>${kpis}${toolbar}${fueraHTML}${accordion}`;
}

function fila(p){
  const e = p.ed || {};
  const u = unidadVenta(p);
  const stk = `<div class="stk ${(p.stock||0)<=0?'zero':''}">${(p.stock||0)<=0?'sin stock':(p.stock+' u')}</div>`;
  // Nombre editable + sugerencia debajo (desaparece cuando ya coincide)
  const dif = p.sugerido && norm(p.sugerido)!==norm(p.nombre);
  const sug = dif
    ? `<div class="sugbox"><span class="sugtag">sugerido</span> ${EYG.esc(p.sugerido)} <button class="usar" title="Usar la versión ordenada" onclick="usarSug(${p.id})">usar</button></div>`
    : "";
  const subSel = "";   // el selector viejo lo reemplaza la celda "Categoría", que sirve siempre
  const nota = p.desg && p.desg.ubicacion ? `<div class="nota">Ubicación: ${EYG.esc(p.desg.ubicacion)}</div>` : "";
  const inNom = `<textarea class="f-nom" id="nom-${p.id}" rows="2" onchange="guardarNombre(${p.id})">${EYG.esc(p.nombre)}</textarea>`;
  const inLab = `<input class="f-in" id="lab-${p.id}" value="${EYG.esc(e.lab||"")}" placeholder="—" onchange="guardarCampo(${p.id},'lab')">`;
  const inCon = `<input class="f-in" id="con-${p.id}" value="${EYG.esc(e.conc||"")}" placeholder="—" onchange="guardarCampo(${p.id},'conc')">`;
  const inPre = `<input class="f-in" id="pre-${p.id}" value="${EYG.esc(e.present||"")}" placeholder="—" onchange="guardarCampo(${p.id},'present')">`;
  const selUni = `<select class="f-sel" id="uni-${p.id}" onchange="guardarCampo(${p.id},'unidad')">${UNIDADES.map(o=>`<option value="${o.k}" ${o.k===u.k?"selected":""}>${o.lbl}</option>`).join("")}</select>`;
  const up = uniParen(p.sub, p.nombre);
  const contKeyDef = (function(){ const pl=(u.k==='caja')?up.plur:u.plur; const f=UNIDADES.find(x=>x.plur===pl); return f?f.k:'unidad'; })();
  const curCont = e.bultoUnidad || contKeyDef;
  const selCont = `<select class="f-sel" id="cont-${p.id}" onchange="guardarCampo(${p.id},'bulto')">${CONTENEDORES.map(c=>`<option ${c===(e.contenedor||"Caja")?"selected":""}>${c}</option>`).join("")}</select>`;
  const inBn = `<input class="f-num" id="bn-${p.id}" type="number" min="1" value="${e.bultoNum||""}" placeholder="N°" onchange="guardarCampo(${p.id},'bulto')">`;
  const selBu = `<select class="f-sel" id="bu-${p.id}" onchange="guardarCampo(${p.id},'bulto')">${UNIDADES.map(o=>`<option value="${o.k}" ${o.k===curCont?"selected":""}>${o.plur}</option>`).join("")}</select>`;
  const bultoInner = `<div class="bultobox">${selCont}<span class="xx">×</span>${inBn}${selBu}</div>`
    + `<label class="cerr"><input type="checkbox" id="cc-${p.id}" ${e.cajaCerrada?"checked":""} onchange="guardarCampo(${p.id},'bulto')"> caja cerrada</label>`;
  const embInner = embCell(p);
  const cajaHint = (e.unidadKey==='caja')
    ? `<div class="cajahint">🧩 <b>Venta por caja:</b> el <b>costo</b> se carga por <b>tira</b>. <b>Unidades por caja</b> = tiras que contiene una caja. <b>Tope de escala</b> = cantidad máxima de la escala, expresada en tiras; si se iguala a las unidades por caja, el producto queda con precio único.</div>`
    : "";
  const fld = (l,inner,cls)=>`<div class="fld ${cls||""}"><label>${l}</label>${inner}</div>`;
  return `<div class="pcard${p.ab>0?" atado":""}" id="row-${p.id}">
    <div class="pc-top">
      <div class="pc-cod">${EYG.esc(p.sku)||"—"}${stk}${chipAB(p)}</div>
      <div class="pc-nom">
        <label class="pc-lnom">Nombre <span>· se edita acá, se guarda solo</span></label>
        ${inNom}${sug}${subSel}
      </div>
    </div>
    <div class="pc-fields">
      ${fld("Categoría", celdaCat(p), "fld-cat")}
      ${fld("Laboratorio / marca", inLab)}
      ${fld("Concentración", inCon)}
      ${fld("Presentación", inPre)}
      ${fld("Unidad de venta", selUni)}
      ${fld("Unidades por caja", bultoInner, "fld-bulto")}
      ${fld(rotuloEmb(p), embInner, "fld-emb")}
      ${escalaHint(p)}
    </div>${cajaHint}${nota}
  </div>`;
}

/* Todas las categorías de Odoo (son ~250), para poder mover un producto a cualquiera desde acá
   y no tener que ir a Odoo. Se traen una sola vez. */
async function cargarCategorias(){
  try{
    const cs = await EYG.rpc("product.category","search_read",
      [[["id","!=",1]],["id","complete_name","parent_id"]], Object.assign({limit:0}, LANG));
    CATS_TODAS = cs.map(c=>({id:c.id, full:(c.complete_name||"").replace(/^ALL \/ /,""), pid:c.parent_id?c.parent_id[0]:null}))
                   .filter(c=>c.full && c.full!=="ALL")
                   .sort((a,b)=>a.full.localeCompare(b.full));
  }catch(e){ CATS_TODAS = []; }
}
/* Celda "Categoría": muestra la actual y, al tocarla, deja elegir cualquier otra (de cualquier
   familia). Se dibuja el desplegable SOLO en la fila que se está editando: con 2.000 filas,
   poner 250 opciones en cada una haría la pantalla imposible. */
function celdaCat(p){
  const actual = p.catFull || p.sub || "—";
  if(CAT_EDIT !== p.id){
    return `<div class="catcell">
        <button class="catbtn" onclick="editarCat(${p.id})" title="Cambiar la categoría de este producto">📁 ${EYG.esc(actual)} ▾</button>
      </div>`;
  }
  const fams = [...new Set(CATS_TODAS.map(c=>c.full.split(" / ")[0]))].sort();
  const opts = fams.map(f=>{
    const hijas = CATS_TODAS.filter(c=>c.full.split(" / ")[0]===f);
    return `<optgroup label="${EYG.esc(f)}">` + hijas.map(c=>
      `<option value="${c.id}" ${c.full===actual?"selected":""}>${EYG.esc(c.full)}</option>`).join("") + `</optgroup>`;
  }).join("");
  return `<div class="catcell edit">
      <select id="cat-${p.id}">${opts}</select>
      <div class="catacts">
        <button class="catok" onclick="moverCat(${p.id})">Mover</button>
        <button class="catcancel" onclick="CAT_EDIT=null;render()">Cancelar</button>
      </div>
    </div>`;
}
window.editarCat = id => { CAT_EDIT = id; render(); };
window.moverCat = async id => {
  const p = TODOS.find(x=>x.id===id) || FUERA.find(x=>x.id===id);
  if(!p) return;
  const sel = document.getElementById("cat-"+id);
  const catId = parseInt(sel && sel.value, 10);
  if(!catId){ toast("Elegí una categoría"); return; }
  const c = CATS_TODAS.find(x=>x.id===catId); if(!c) return;
  if(c.full === (p.catFull||p.sub)){ CAT_EDIT=null; render(); return; }
  if(p.ab>0 && !confirm("OJO: este producto sigue ATADO A ALFABETA (código "+p.ab+").\n\n"
      + "Si lo movés sin soltarlo antes, AlfaBeta lo va a devolver a su categoría en la próxima\n"
      + "corrida (cada 3 h, y la base completa a las 4 de la mañana).\n\n"
      + "Lo recomendable es tocar \"Soltar\" primero.\n\n¿Lo movés igual?")) return;
  const btn = document.querySelector("#row-"+id+" .catok"); if(btn){ btn.disabled=true; btn.textContent="…"; }
  try{
    await EYG.rpc("product.template","write",[[p.id],{categ_id:catId}], LANG);
    const salioDeLaVista = ROOT.todas ? false : !c.full.startsWith(ROOT.prefix.replace(/^ALL \/ /,""));
    p.catFull = c.full;
    p.sub = stripPrefix("ALL / "+c.full) || SIN_SUB;
    CAT_EDIT = null;
    if(p.fuera){ toast("Movido a "+c.full+" ✓"); render(); return; }
    if(salioDeLaVista){
      TODOS = TODOS.filter(x=>x.id!==p.id);      // se fue a otra familia: ya no va en esta lista
      recomputarSubs();
      toast("Movido a "+c.full+" ✓ — ya no está en "+ROOT.label);
    }else{
      resyncProducto(p);                          // otra subcategoría = otra regla -> recalcular
      recomputarSubs();
      abiertos.add(p.sub);
      toast("Movido a "+c.full+" ✓ — aplicando la escalera…");
    }
    render();
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent="Mover"; } toast("Error: "+EYG.esc(e.message)); }
};

/* Chip 🧲 + botón "Soltar", en la columna del código de cada fila atada a AlfaBeta. */
function chipAB(p){
  if(!p || !(p.ab>0)) return "";
  const g = GEM[p.id];
  const ayuda = "AlfaBeta le escribe encima el precio, la categoría y el impuesto cada vez que corre "
    + "(cada 3 h, y la base completa a las 4 de la mañana). Por eso lo que le cambies acá se deshace solo. "
    + (g ? "Ya existe otra ficha con el mismo código, así que al soltarlo esa queda de pararrayos."
         : "No hay otra ficha con este código: al soltarlo se le crea una copia que queda de pararrayos.");
  return `<div class="abbox">
      <span class="abchip" title="${EYG.esc(ayuda)}">🧲 AlfaBeta ${p.ab}</span>
      <button class="abbtn" onclick="soltarAB(${p.id})" title="Cortarle el enganche y darle un código propio de la casa">Soltar</button>
      <div class="absub">${g ? "tiene pararrayos" : "sin pararrayos"}</div>
    </div>`;
}
/* Corta el enganche de UN producto:
   1. si no hay otra ficha con ese código, se crea una copia que queda de pararrayos (activa y NO
      vendible) para que AlfaBeta le pegue ahí y no genere una ficha nueva;
   2. al producto nuestro se le pone el código de AlfaBeta en cero y un interno de la casa. */
window.soltarAB = async (id) => {
  const p = TODOS.find(x=>x.id===id) || FUERA.find(x=>x.id===id);
  if(!p || !(p.ab>0)) return;
  const g = GEM[p.id];
  if(PROX_INT==null) await calcularProxInterno();
  if(PROX_INT==null){ alert("No pude calcular el próximo código interno. Probá de nuevo."); return; }
  const nuevo = String(PROX_INT);
  const cod = p.ab;
  let msg = "SOLTAR DE ALFABETA\n\n" + p.nombre + "\n\n"
    + "\u2022 Se le pone el Código Alfa Beta en cero: AlfaBeta no lo toca nunca más.\n"
    + "\u2022 Se le asigna el código interno de la casa: " + nuevo + "\n";
  msg += g
    ? "\u2022 Ya existe otra ficha con el código " + cod + " (\"" + String(g.name).slice(0,46) + "\"): esa queda de pararrayos.\n"
    : "\u2022 Se crea una COPIA de esta ficha con el código " + cod + ", que queda de pararrayos.\n"
      + "  Queda activa pero NO vendible. Tiene que quedar activa: si se archiva, AlfaBeta no la\n"
      + "  encuentra y crea otra igual.\n";
  msg += "\nEl historial NO se toca: las compras, las facturas, el stock y las ventas cuelgan del\n"
       + "producto, no de su código. El código de barras se queda con este producto.\n";
  msg += "\nOJO: buscar por el código viejo (" + (p.sku||("AB"+cod)) + ") va a traer la ficha pararrayos,\n"
       + "que no se puede comprar ni vender. De ahora en más este producto es el " + nuevo + ".\n";
  msg += "\n¿Confirmás?";
  if(!confirm(msg)) return;
  const btn = document.querySelector("#row-"+id+" .abbtn");
  if(btn){ btn.disabled = true; btn.textContent = "…"; }
  try{
    let creada = null;
    if(!g){
      // la copia se crea SIN el código, para no tener dos fichas con el mismo a la vez
      const cid = await EYG.rpc("product.template","copy",[[p.id],{
        name: p.nombre, default_code: "AB"+cod, alfabeta_code: 0, sale_ok: false, purchase_ok: false, active: true
      }], LANG);
      creada = Array.isArray(cid) ? cid[0] : cid;
      /* El CÓDIGO DE BARRAS se queda con NUESTRO producto: es el que se escanea al recibir y al
         vender. En Odoo el código de barras es único, así que si la copia se lo llevó hay que
         sacárselo, y si de paso el nuestro lo perdió, devolvérselo. */
      try{
        const chk = await EYG.rpc("product.template","read",[[creada],["barcode"]], LANG);
        if(chk && chk[0] && chk[0].barcode) await EYG.rpc("product.template","write",[[creada],{barcode:false}], LANG);
        if(p.barcode){
          const mio = await EYG.rpc("product.template","read",[[p.id],["barcode"]], LANG);
          if(!(mio && mio[0] && mio[0].barcode)) await EYG.rpc("product.template","write",[[p.id],{barcode:p.barcode}], LANG);
        }
      }catch(e){ /* si el campo no se puede tocar, se avisa abajo */ }
      await EYG.rpc("product.template","write",[[p.id],{alfabeta_code:0, default_code:nuevo}], LANG);
      await EYG.rpc("product.template","write",[[creada],{alfabeta_code:cod}], LANG);
    }else{
      await EYG.rpc("product.template","write",[[p.id],{alfabeta_code:0, default_code:nuevo}], LANG);
    }
    PROX_INT++;
    p.ab = 0; p.sku = nuevo;
    if(creada) GEM[p.id] = {id:creada, name:p.nombre, alfabeta_code:cod, active:true};
    render();
    alert("Listo. " + p.nombre + "\n\nCódigo interno: " + nuevo
      + (creada ? "\nPararrayos creado (ficha " + creada + ")." : "\nPararrayos: la ficha que ya existía.")
      + "\n\nAhora ponele la categoría y el impuesto que correspondan: ya no se los pisa nadie.");
  }catch(e){
    if(btn){ btn.disabled = false; btn.textContent = "Soltar"; }
    alert("No se pudo soltar: " + (e.message||e));
  }
};

/* Para los productos atados a AlfaBeta: busca si ya existe una ficha GEMELA con el mismo código
   (la del vademécum, que hace de pararrayos) y calcula el próximo código interno libre. */
async function cargarEngancheAB(lista){
  GEM = {};
  const conAB = lista.filter(p=>p.ab>0);
  if(!conAB.length){ PROX_INT = PROX_INT || null; return; }
  const codes = [...new Set(conAB.map(p=>p.ab))];
  const ids   = conAB.map(p=>p.id);
  try{
    const gem = await EYG.rpc("product.template","search_read",
      [[["alfabeta_code","in",codes],["id","not in",ids]],["id","name","alfabeta_code","categ_id","active","sale_ok"]],
      {context:{lang:"es_AR", active_test:false}});
    const porCod = {};
    gem.forEach(g=>{ (porCod[g.alfabeta_code]=porCod[g.alfabeta_code]||[]).push(g); });
    conAB.forEach(p=>{
      const g = porCod[p.ab]||[];
      // la del vademécum es la que vive en ÉTICOS o cuelga de la raíz
      GEM[p.id] = g.find(x=>/ETICO/.test(x.categ_id[1])||x.categ_id[1]==="ALL") || g[0] || null;
    });
  }catch(e){ /* si falla, se muestra el chip igual y el botón avisa */ }
  if(PROX_INT==null) await calcularProxInterno();
}
/* Próximo libre de la serie 153xxx (la que usa Depósito para los códigos de la casa). */
async function calcularProxInterno(){
  try{
    const serie = await EYG.rpc("product.template","search_read",
      [[["default_code","=like","153%"]],["default_code"]], {context:{lang:"es_AR", active_test:false}});
    const nums = serie.map(x=>parseInt(x.default_code,10)).filter(n=>n>=153000 && n<154000);
    PROX_INT = (nums.length?Math.max(...nums):153000) + 1;
  }catch(e){ PROX_INT = null; }
}

/* El campo del `product.packaging` cumple DOS funciones distintas en el motor según la unidad de
   venta del producto, y por eso un rótulo fijo confunde:
     · unidad de venta ≠ caja  -> es la cantidad MÍNIMA en que se comercializa (piso de la escala)
     · unidad de venta = caja  -> es la cantidad MÁXIMA de la escala, medida en tiras
   El rótulo acompaña esa diferencia. */
function rotuloEmb(p){
  return (unidadVenta(p).k === "caja") ? "Tope de escala" : "Múltiplo de venta";
}
/* Resumen en números concretos de cómo queda la escala de ese producto. Es lo único que hace
   falta entender: desde qué cantidad se vende y en cuál llega el descuento máximo. */
function escalaHint(p){
  const u = unidadVenta(p);
  const uni = EYG.esc(u.plur);
  if(u.k === "caja"){
    // vendiendo por caja, el contenido y el tope se miden en la SUBUNIDAD (tiras, amp…), no en cajas
    const up = uniParen(p.sub, p.nombre);
    const sub = EYG.esc((p.ed && p.ed.bultoUnidad ? (UNIDADES.find(x=>x.k===p.ed.bultoUnidad)||{}).plur : null) || up.plur || "unidades");
    const tiras = p.desg.bultoNum || 0, tope = p.embalaje;
    if(!tiras) return `<div class="escala">Escala de precios: precio único — el nombre no declara cuántas ${sub} trae la caja.</div>`;
    const cajas = (tope && tope >= tiras) ? Math.floor(tope / tiras) : 1;
    return `<div class="escala">Escala de precios: ${cajas <= 1
      ? "precio único (1 caja)"
      : `de 1 a <b>${cajas}</b> cajas`} · cada caja contiene <b>${tiras}</b> ${sub}${tope ? " · tope <b>"+tope+"</b> "+sub : ""}.</div>`;
  }
  const tope = p.desg.bultoNum || 0, min = p.embalaje;
  if(!tope) return `<div class="escala">Escala de precios: precio único — el nombre no declara la caja.</div>`;
  if(tope <= 1) return `<div class="escala">Escala de precios: precio único — la caja declarada es de 1 ${EYG.esc(u.sing||u.plur)}.</div>`;
  const desde = (min && min > 0 && min < tope) ? min : 1;
  if(desde >= tope) return `<div class="escala">Escala de precios: precio único — el múltiplo de venta (<b>${desde}</b>) iguala o supera la caja declarada (<b>${tope}</b>).</div>`;
  return `<div class="escala">Escala de precios: de <b>${desde}</b> a <b>${tope}</b> ${uni}${desde > 1 ? " · no se comercializa por debajo de "+desde : ""}.</div>`;
}

window.guardarCampo = async (id, campo) => {
  const p = TODOS.find(x=>x.id===id); if(!p) return;
  const e = p.ed || (p.ed={});
  if(campo==='lab')      e.lab = (gv("lab-"+id)||"").trim();
  else if(campo==='conc')    e.conc = (gv("con-"+id)||"").trim();
  else if(campo==='present') e.present = (gv("pre-"+id)||"").trim();
  else if(campo==='unidad')  e.unidadKey = gv("uni-"+id);
  else if(campo==='bulto'){
    e.contenedor = gv("cont-"+id)||"Caja";
    const n = parseInt(gv("bn-"+id),10); e.bultoNum = (n>0?n:null);
    e.bultoUnidad = gv("bu-"+id)||"";
    const cc = document.getElementById("cc-"+id); e.cajaCerrada = !!(cc&&cc.checked);
  }
  const nuevo = compose(p);
  if(nuevo===p.nombre && campo!=='lab' && campo!=='unidad'){ return; }   // nada cambió
  const vals = {name:nuevo};
  if(campo==='lab')    vals.x_laboratorio = e.lab;
  if(campo==='unidad') vals.x_unidad = e.unidadKey;
  const antes = p.nombre;
  try{
    await EYG.rpc("product.template","write",[[id],vals], LANG);
    p.nombre = nuevo;
    if(campo==='lab')    p.labField = e.lab;
    if(campo==='unidad') p.unidadField = e.unidadKey;
    // refresca desg/sugerido/cambia SIN perder los overrides que acaba de tocar el usuario
    const a = analizar(nuevo, p.sub);
    p.sugerido=a.sugerido; p.motivos=a.motivos; p.desg=a.desg; p.cuerpo=a.cuerpo; p.cambia=a.cambia;
    HISTORIAL.push({cambios:[{id,antes,despues:nuevo}], desc:(p.sku||("#"+id))+" · "+campo});
    // cualquier cambio (nombre/unidad/bulto/caja cerrada) puede cambiar la escalera -> recalculá ya
    resyncProducto(p);
    toast("Guardado ✓ — aplicando…"); render();
  }catch(err){ toast("Error: "+EYG.esc(err.message)); }
};

};

function toast(msg){ let t=document.getElementById("toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); } t.textContent=msg; t.classList.add("show"); clearTimeout(tToast); tToast=setTimeout(()=>t.classList.remove("show"),2600); }
