<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  .intro{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px;font-size:13.5px;color:var(--gris)}
  .intro b{color:var(--ink)}
  .intro details{margin-top:8px}
  .intro summary{cursor:pointer;color:var(--teal);font-weight:700}
  .intro .std{margin-top:10px;font-size:13px;line-height:1.7}
  .intro code{background:#eef6f5;color:var(--teal-deep);padding:1px 6px;border-radius:5px;font-family:ui-monospace,monospace}

  .kpis{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow);min-width:120px}
  .kpi .n{font-size:22px;font-weight:900;color:var(--ink);line-height:1}
  .kpi .l{font-size:11.5px;color:var(--gris);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
  .kpi.warn .n{color:#c2410c} .kpi.good .n{color:var(--teal)}

  /* ---- selector de categoría raíz (Hospitalarios / Farmacopea / …) ---- */
  .catsel{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
  .catsel .lbl{font-size:12px;font-weight:800;color:var(--gris2);text-transform:uppercase;letter-spacing:.5px;margin-right:2px}

  .catpill:hover{border-color:var(--teal-med)}
  .catpill.active{background:var(--teal);color:#fff;border-color:var(--teal)}

  /* ---- acordeón de subcategorías (reemplaza a los tabs; escala a cientos) ---- */
  .accordion{display:flex;flex-direction:column;gap:10px}
  .sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .sechead{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none;background:var(--surface);position:sticky;top:51px;z-index:6;border-bottom:1px solid transparent;transition:background .12s}
  .sechead:hover{background:#f7fbfa}
  .sec.open>.sechead{border-bottom-color:var(--line)}
  .chev{color:var(--gris2);font-size:12px;transition:transform .15s;display:inline-block;width:12px}
  .sec.open>.sechead .chev{transform:rotate(90deg)}
  .secname{font-weight:800;color:var(--ink);font-size:14px;letter-spacing:.2px}
  .seccount{background:#eef6f5;color:var(--teal-deep);font-weight:800;font-size:12px;border-radius:20px;padding:2px 9px}
  .secmatch{color:var(--gris);font-size:12px;font-weight:600}
  .secchg{background:#f97316;color:#fff;font-size:11px;font-weight:800;border-radius:10px;padding:2px 8px}
  .secright{margin-left:auto;display:flex;align-items:center;gap:8px}
  .btn-secap{background:var(--teal);color:#fff;border:none;border-radius:9px;padding:7px 13px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .btn-secap:hover{background:var(--teal-deep)}
  .secbody .thead{position:static;border-radius:0;top:auto}
  .secbody .row:last-child{border-radius:0}
  .btn-expand{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--gris);cursor:pointer;font-family:inherit}
  .btn-expand:hover{border-color:var(--teal-med)}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .toolbar input[type=search]{flex:1;min-width:200px;padding:9px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit}
  .toolbar .chk{font-size:13px;color:var(--gris);display:flex;align-items:center;gap:6px;cursor:pointer}
  .btn-bulk{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:9px 15px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
  .btn-bulk:hover{background:var(--teal-deep)} .btn-bulk:disabled{opacity:.5;cursor:default}

  .tablecard{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .thead,.row{display:grid;grid-template-columns:72px 1.2fr 1.3fr 88px 82px 100px 112px 132px;gap:11px;align-items:start;padding:11px 16px}
  .thead{position:sticky;top:51px;background:#f3f8f7;border-bottom:1px solid var(--line);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--gris2);border-radius:14px 14px 0 0;z-index:5}
  .row{border-top:1px solid var(--line);font-size:13px;min-width:0}
  .row:last-child{border-radius:0 0 14px 14px}
  .row>div{min-width:0}
  .sku{font-family:ui-monospace,monospace;font-size:12px;color:var(--gris);font-weight:700}
  .nactual{color:var(--ink);word-break:break-word;line-height:1.4}
  .nsug{color:var(--teal-deep);font-weight:600;word-break:break-word;line-height:1.4}
  .nsug.same{color:var(--gris2);font-weight:400}
  .edsug{background:none;border:none;cursor:pointer;color:var(--gris2);font-size:12px;padding:0 2px;opacity:.6}
  .edsug:hover{opacity:1;color:var(--teal)}
  .sugedit{width:100%;display:flex;gap:5px;align-items:center;margin-top:2px}
  .sugedit input{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--teal-med);border-radius:7px;font-size:13px;font-family:inherit}
  .sugedit button{background:var(--teal);color:#fff;border:none;border-radius:6px;padding:6px 9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  .sugedit button.can{background:#fff;border:1px solid var(--line);color:var(--gris)}
  .motivos{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
  .mchip{background:#fff4ed;color:#c2410c;border:1px solid #fed7aa;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px}
  .mchip.info{background:#eef6f5;color:var(--teal-deep);border-color:#cfe8e4}
  .cell-mono{color:var(--ink);font-weight:600}
  .cell-sub{font-size:11px;color:var(--gris);margin-top:2px}
  .miss{color:#c2410c;font-weight:700}
  .nota{font-size:11px;color:var(--gris2);margin-top:3px}
  .btn-ap{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:6px 10px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;width:100%}
  .btn-ap:hover{background:var(--teal-deep)}
  .btn-ap.ok{background:#16a34a;cursor:default}
  .btn-ap.none{background:transparent;color:var(--gris2);cursor:default;border:1px dashed var(--line)}
  .btn-ap:disabled{opacity:.6;cursor:default}
  .empty{padding:40px;text-align:center;color:var(--gris)}
  @media(max-width:900px){
    .thead{display:none}
    .row{grid-template-columns:1fr 1fr;gap:8px}
    .row>.sku{grid-column:1/3}
    .row>.apcell{grid-column:1/3}
    .row>.embcell{grid-column:1/3}
  }
  .kpi.clk{cursor:pointer;transition:all .12s} .kpi.clk:hover{border-color:var(--teal-med);transform:translateY(-1px)}
  .kpi.on{background:var(--teal);border-color:var(--teal)} .kpi.on .n,.kpi.on .l{color:#fff}
  .btn-toggle{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;color:var(--gris);cursor:pointer;font-family:inherit;white-space:nowrap}
  .btn-toggle:hover{border-color:var(--teal-med)}
  .btn-toggle.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .btn-sync{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
  .btn-sync:hover{background:var(--teal-deep)}
  .btn-undo{background:#fff;border:1px solid #f59e0b;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;color:#b45309;cursor:pointer;font-family:inherit;white-space:nowrap}
  .btn-undo:hover{background:#fff7ed}
  .btn-clear{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--gris);cursor:pointer;font-family:inherit}
  .btn-clear:hover{border-color:var(--teal-med)}
  .cnt{font-size:12px;color:var(--gris2);font-weight:600;margin-left:auto}
  .stk{font-size:10.5px;color:var(--teal-deep);font-weight:700;margin-top:3px} .stk.zero{color:#c2410c}
  .addb{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .addb input{width:50px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;font-family:inherit}
  .addb select{padding:4px 3px;border:1px solid var(--line);border-radius:6px;font-size:11px;font-family:inherit;max-width:76px}
  .addb button{background:var(--teal);color:#fff;border:none;border-radius:6px;padding:5px 8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
  .addb button:hover{background:var(--teal-deep)} .addb button:disabled{opacity:.6}
  .subassign{margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:7px 9px}
  .subassign .lbl{font-size:11px;color:#c2410c;font-weight:800;width:100%}
  .subassign select{padding:5px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;font-family:inherit;max-width:180px;flex:1;min-width:120px}
  .subassign button{background:var(--teal);color:#fff;border:none;border-radius:6px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
  .subassign button:hover{background:var(--teal-deep)} .subassign button:disabled{opacity:.6}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 26px rgba(0,0,0,.25);z-index:9999;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js"></script>
<script>
/* ================= EyG Core · Depósito · Maestro de productos ================= */
// Categorías raíz que administra el módulo. `excluir` = subcategorías vacías/ajenas al desplegable de asignación.
// formas:true -> abrevia/minúscula la forma farmacéutica (comp, susp, sol, gel…) porque es redundante con la subcategoría.
// En Farmacopea (formas:false) esas palabras SON parte del nombre (SOLUCION, GEL, CREMA) y no se tocan.
const CATEGS = [
  {id:24, label:"Hospitalarios", prefix:"ALL / HOSPITALARIOS", excluir:["-*-*-","JERINGAS","MEDICACION PSICO"], formas:true},
  {id:10, label:"Farmacopea",    prefix:"ALL / FARMACOPEA",    excluir:["-*-*-"], formas:false},
];
let ROOT = CATEGS[0];                 // categoría activa
const LANG = {context:{lang:"es_AR"}};
// saca el prefijo "ALL / CATEGORÍA / " del complete_name para quedarnos con la subcategoría
function stripPrefix(full){
  const rx = new RegExp("^"+ROOT.prefix.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"( / )?");
  return (full||"").replace(rx,"");
}

// Unidad de venta por subcategoria: unifica las columnas Bulto/caja y Embalaje.
// Ampollas: "jeringas" si el nombre dice jer/prell/jga. (Debe coincidir con la config del cron.)
const UNIDAD_SUB = {
  "HOSP. COMPRIMIDOS":"tiras", "HOSP. AMPOLLAS":"amp", "HOSP. FRASCO AMPOLLA":"unidades",
  "HOSP. JARABES":"unidades", "HOSP. GOTAS":"unidades", "HOSP.CREMAS":"unidades",
  "HOSP. SPRAYS":"unidades", "HOSP. TIRAS REACTIVAS":"cajas"
};
function unidadDe(p){
  let u = UNIDAD_SUB[p.sub] || "unidades";
  if(p.sub==="HOSP. AMPOLLAS" && /jer|prell|jga/i.test(p.nombre||"")) u="jeringas";
  return u;
}
// Unidad que se muestra en el paréntesis del nombre, por subcategoría: {sing, plur, forma}
// forma = palabra de forma farmacéutica que hay que SACAR del cuerpo (redundante con la subcategoría).
const UNI_PAREN = {
  "HOSP. COMPRIMIDOS":  {sing:"tira", plur:"tiras", forma:null},
  "HOSP. AMPOLLAS":     {sing:"amp",  plur:"amp",   forma:/\bampollas?\b|\bamp\b/gi},
  "HOSP. FRASCO AMPOLLA":{sing:"unidad", plur:"unidades", forma:/\bfrasco\s*ampollas?\b/gi},
  "HOSP. JARABES":      {sing:"unidad", plur:"unidades", forma:null},
  "HOSP. GOTAS":        {sing:"unidad", plur:"unidades", forma:null},
  "HOSP.CREMAS":        {sing:"unidad", plur:"unidades", forma:null},
  "HOSP. SPRAYS":       {sing:"unidad", plur:"unidades", forma:null},
  "HOSP. TIRAS REACTIVAS":{sing:"caja", plur:"cajas", forma:null}
};
function uniParen(sub, nombre){
  let up = UNI_PAREN[sub] || {sing:"unidad", plur:"unidades", forma:null};
  if(sub==="HOSP. AMPOLLAS" && /jer|prell|jga/i.test(nombre||"")) up={sing:"jeringa", plur:"jeringas", forma:/\b(jga|jer|jeringa)\.?\s*prell\.?/gi};
  return up;
}
const SIN_SUB = "(sin subcategoría)";
let SUBCATS_ODOO = [];   // subcategorias reales de HOSPITALARIOS (para el desplegable): [{id,name}]
// sugiere la subcategoria segun el nombre del producto
function sugerirSubId(p){
  const n=(p.nombre||"").toLowerCase(); let nom=null;
  if(/frasco\s*ampolla/.test(n)) nom="HOSP. FRASCO AMPOLLA";
  else if(/ampolla/.test(n)) nom="HOSP. AMPOLLAS";
  else if(/spray|aerosol/.test(n)) nom="HOSP. SPRAYS";
  else if(/crema|pomada|\bgel\b|\bpote\b/.test(n)) nom="HOSP.CREMAS";
  else if(/jarabe|\bjbe\b|susp/.test(n)) nom="HOSP. JARABES";
  else if(/gotas/.test(n)) nom="HOSP. GOTAS";
  else if(/\bcomp\b|comprimido|\bcaps\b|capsula/.test(n)) nom="HOSP. COMPRIMIDOS";
  const c=SUBCATS_ODOO.find(x=>x.name===nom); return c?c.id:null;
}
function selectorSub(p){
  const sug=sugerirSubId(p);
  const opts=SUBCATS_ODOO.map(c=>`<option value="${c.id}" ${c.id===sug?"selected":""}>${EYG.esc(c.name)}</option>`).join("");
  return `<div class="subassign"><span class="lbl">📁 Sin subcategoría — asigná una:</span>
    <select id="sub-${p.id}"><option value="" ${sug?"":"selected"}>— elegí —</option>${opts}</select>
    <button onclick="asignarSub(${p.id})">Asignar</button></div>`;
}

/* ---------- diccionario de formas farmacéuticas (detección: multipalabra primero) ---------- */
const FORMAS_DET = [
  {c:"frasco ampolla", re:/\bfrasco\s*ampollas?\b/i, u:""},
  {c:"jga prell",      re:/\b(jga|jer|jeringa)\.?\s*prell/i, u:""},
  {c:"comp",  re:/\b(comprimidos?|comp)\b/i,   u:"comp"},
  {c:"caps",  re:/\b(c[aá]psulas?|caps?)\b/i,   u:"caps"},
  {c:"susp",  re:/\b(suspensi[oó]n|susp)\b/i,    u:"ml"},
  {c:"jbe",   re:/\b(jarabe|jbe)\b/i,            u:"ml"},
  {c:"gotas", re:/\bgotas?\b/i,                  u:"ml"},
  {c:"sol",   re:/\b(soluci[oó]n)\b/i,           u:"ml"},
  {c:"spray", re:/\b(spray|aerosol)\b/i,         u:"ml"},
  {c:"amp",   re:/\b(ampollas?|amp)\b/i,         u:"amp"},
  {c:"vial",  re:/\bvial\b/i,                    u:"u"},
  {c:"gel",   re:/\bgel\b/i,                     u:"g"},
  {c:"crema", re:/\bcrema\b/i,                   u:"g"},
  {c:"pomada",re:/\bpomada\b/i,                  u:"g"},
  {c:"supos", re:/\b(supositorios?|supos?)\b/i,  u:"u"},
  {c:"óvulo", re:/\b([oó]vulos?)\b/i,            u:"u"},
  {c:"sobre", re:/\bsobres?\b/i,                 u:"u"},
];
const FORMAS_SIMPLE = FORMAS_DET.filter(f=>!/\s/.test(f.c)); // sin multipalabra para el replace de casing
const TYPOS = [
  [/HOSPITALRIO/gi,"HOSPITALARIO"], [/HOSPITALARIA\b/gi,"HOSPITALARIO"],
  [/\bVANIER\b/gi,"VANNIER"], [/COMRPIMIDO/gi,"COMPRIMIDO"], [/COMPRMIDO/gi,"COMPRIMIDO"],
];
function uDisp(u){ return u==="ui"?"UI":u; }
function normTipo(t){ if(!t) return ""; t=t.toLowerCase().replace(/\.$/,""); if(/tira/.test(t))return"tiras"; if(/^unidad|^u$/.test(t))return"unidades"; if(/^(comp|caps|amp)/.test(t))return t; return t; }

/* ---------- normaliza el NOMBRE y devuelve {sugerido, motivos, desglose} ---------- */
function analizar(raw, sub){
  const motivos=[]; const add=m=>{ if(!motivos.includes(m)) motivos.push(m); };
  const up = uniParen(sub, raw);
  let s=(raw==null?"":String(raw));
  const parens=[]; let core=s.replace(/\(([^)]*)\)/g,(m,inner)=>{ parens.push(inner.trim()); return " "; });

  if(/^\s*\[[^\]]*\]\s*/.test(core)){ core=core.replace(/^\s*\[[^\]]*\]\s*/,""); add("código en el nombre"); }
  if(/@/.test(core)){ core=core.replace(/@/g," "); add("símbolo @"); }
  if(/\b[HB]-\d+(-\d+)?\b/i.test(core)){ core=core.replace(/\b[HB]-\d+(-\d+)?\b/gi," "); add("ubicación en el nombre"); }

  const antesEsp=core; core=core.replace(/\s+/g," ").replace(/\s+([.,])/g,"$1").trim();
  if(/\s{2,}/.test(antesEsp)||/\s$/.test(raw)||/^\s/.test(raw)) add("espacios");

  if(/(\d)(mg|mcg|ml|gr|kg|cc|g|ui|vol|lt)\b/i.test(core)) add("unidad pegada al número");
  core=core.replace(/(\d)\s*(mg|mcg|ml|gr|kg|cc|g|ui|vol|lt)\b/gi,(m,n,u)=>n+" "+u.toLowerCase());

  const antesDec=core;
  core=core.replace(/(\d)[.,](\d+)\s*%/g,(m,a,b)=>a+","+b+"%").replace(/(\d)\s+%/g,"$1%");
  core=core.replace(/(\d)\.(\d+)\s+(mg|mcg|ml|gr|g|ui|vol)\b/gi,(m,a,b,u)=>a+","+b+" "+u.toLowerCase());
  if(antesDec!==core) add("decimales / %");

  const antesX=core; core=core.replace(/\bx\s*(\d)/gi,"x $1"); if(antesX!==core) add('separación "x"');
  TYPOS.forEach(([re,to])=>{ if(re.test(core)){ core=core.replace(re,to); add("error de tipeo"); } });

  // "HOSPITALARIO/HOSP" en el nombre es redundante (ya está la categoría) -> se saca
  if(/\b(hospitalari[oa]s?|hosp)\b/i.test(core)){ core=core.replace(/\bhospitalari[oa]s?\b/ig," ").replace(/\bhosp\.?\b/ig," "); add("quita 'Hospitalario'"); }

  let ventaCerrada=false;
  if(/se vende por caja cerrada/i.test(core)){ ventaCerrada=true; core=core.replace(/\s*se vende por caja cerrada\s*/ig," "); }

  // bulto/caja escrito FUERA del paréntesis -> lo detecto y lo saco del core (se recompone en el paréntesis)
  let bultoCore=null;
  { const mbc=core.match(/\b(caja|blister(?:a)?|bulto|pack)\s*x\s*(\d+)\s*(tiras?|comp|caps|amp|unidades?|u)?\b/i);
    if(mbc){ bultoCore={num:parseInt(mbc[2],10), tipo:normTipo(mbc[3])}; core=core.replace(mbc[0]," "); add("bulto fuera del paréntesis"); }
    else { const mt=core.match(/\bx\s*(\d+)\s*tiras?\b/i); if(mt){ bultoCore={num:parseInt(mt[1],10), tipo:"tiras"}; core=core.replace(mt[0]," "); add("bulto fuera del paréntesis"); } }
  }

  if(/\b(comprimidos?|c[aá]psulas?|suspensi[oó]n|jarabe|ampollas?|soluci[oó]n|supositorios?)\b/i.test(core)) add("abreviatura");

  const preCase=core;
  let out=core.toUpperCase();
  out=out.replace(/\b(MG|MCG|ML|GR|KG|CC|VOL|G|LT|LITROS?)\b/g,m=>m.toLowerCase());
  out=out.replace(/\bX\b/g,"x");
  // abreviatura/minúscula de formas farmacéuticas: solo donde la forma es redundante con la subcategoría (Hospitalarios)
  if(!ROOT || ROOT.formas!==false){
    FORMAS_SIMPLE.forEach(f=>{ out=out.replace(new RegExp(f.re.source,"gi"), f.c); });
    out=out.replace(/\bFRASCO\s+amp\b/gi,"frasco ampolla");
    out=out.replace(/\b(JGA|JER|JERINGA)\.?\s*PRELL\.?/gi,"jga prell");
  }
  // saca la palabra de forma que ya está implícita en la subcategoría (ej. "ampolla"/"amp" en Ampollas)
  if(up.forma){ const antesF=out; out=out.replace(up.forma," "); if(antesF!==out) add("saca forma redundante"); }
  out=out.replace(/\s+-\s*|\s*-\s+/g," - ").replace(/(?: - ){2,}/g," - ").replace(/^\s*-\s+|\s+-\s*$/g,"").replace(/\s+/g," ").trim();
  out=out.replace(/\b(mg|mcg|ml|gr|kg|cc|g|ui|vol|lt)\.(?=\s|$)/gi,"$1");  // "ml." / "lt." -> "ml" / "lt"
  // limpia colgantes: guion + número suelto al final (ej. "ROSPAW - 4"), guiones/puntos/comas sueltos al final
  const antesCol=out;
  out=out.replace(/\s+-\s+\d+\s*$/,"").replace(/[\s\-–·.,]+$/,"").replace(/^[\s\-–·.,]+/,"").trim();
  if(antesCol!==out) add("limpia colgantes");
  if(preCase!==out && preCase.toLowerCase()===out.toLowerCase()) add("mayúsculas/minúsculas");

  const desg=desglosar(out,parens,add);
  desg.cajaCerrada = desg.cajaCerrada || ventaCerrada;
  if(!desg.bultoNum && bultoCore){ desg.bultoNum=bultoCore.num; desg.bultoTipo=bultoCore.tipo; }

  // paréntesis ESTÁNDAR por subcategoría: (Precio x <unidad> · Caja x N <unidad> [· caja cerrada])
  const pp=[];
  pp.push("Precio x "+up.sing);
  if(desg.bultoNum) pp.push("Caja x "+desg.bultoNum+" "+up.plur);
  if(desg.cajaCerrada) pp.push("caja cerrada");
  desg.extra.forEach(x=>pp.push(x));
  const parenOut = " ("+pp.join(" · ")+")";

  let sugerido=(out+parenOut).replace(/\s+/g," ").trim();
  return { sugerido, motivos, desg, cambia: sugerido!==raw };
}

/* ---------- extrae concentración, presentación (unidad) y bulto ---------- */
function desglosar(core, parens, add){
  const d={conc:"", presentacion:"", forma:"", bultoNum:null, bultoTipo:"", cajaCerrada:false, precioX:"", precioModo:"", ubicacion:"", extra:[]};
  for(const f of FORMAS_DET){ if(f.re.test(core)){ d.forma=f.c; break; } }

  const xi=core.search(/\sx\s/i); const izq=xi>=0?core.slice(0,xi):core; const der=xi>=0?core.slice(xi+3):"";
  const dose=[]; const reDose=/(\d+(?:,\d+)?)\s*(%|mg|mcg|ui|gr|g)(?![a-zé])/gi; let m;
  while((m=reDose.exec(izq))!==null){ dose.push(m[1]+(m[2]==="%"?"%":" "+uDisp(m[2].toLowerCase()))); }
  d.conc=dose.join(" + ");

  if(der){ const mp=der.match(/^(\d+(?:,\d+)?)\s*(comp|caps|ml|gr|g|amp)?\b/i);
    if(mp){ d.presentacion = mp[1] + (mp[2]?(" "+mp[2].toLowerCase()):""); } }

  for(const p of parens){
    const pl=p.toLowerCase();
    if(/se vende por caja cerrada/.test(pl)) d.cajaCerrada=true;
    const mb=pl.match(/(caja|pack|bulto|blister(?:a)?)\s*x\s*(\d+)\s*([a-zé]+)?/);
    if(mb){ d.bultoNum=parseInt(mb[2],10); let t=(mb[3]||"").replace(/s$/,""); d.bultoTipo=/tira/.test(t)?"tiras":(t?t+"s":""); }
    const mpx=pl.match(/precio\s*x\s*([a-zé]+)/); if(mpx) d.precioX=mpx[1];
    if(/precio\s*unitario/.test(pl)) d.precioModo="Precio unitario";
    else if(/precio\s*por\s*caja/.test(pl)) d.precioModo="Precio por caja";
    const mu=p.match(/\b([HB]-\d+(?:-\d+)?)\b/i); if(mu){ d.ubicacion=mu[1]; add("ubicación en el nombre"); }
    const conocida = mb||mpx||/precio\s*(unitario|por\s*caja)/.test(pl)||mu||/se vende por caja cerrada/.test(pl);
    if(!conocida && p.trim()) d.extra.push(p.trim());
  }
  return d;
}

/* =========================== estado + carga =========================== */
let TODOS = [], SUBCATS = [], abiertos = new Set(), filtro = "", HISTORIAL = [], filtros = {conCambios:false, sinBulto:false, sinConc:false, sinStock:false, conStock:false, sinEmbalaje:false};

async function cargar(preservar){
  const cont = document.getElementById("cont");
  cont.innerHTML = '<div class="empty"><div class="spinner"></div>Leyendo productos de Odoo…</div>';
  let recs;
  try{
    recs = await EYG.rpc("product.template","search_read",
      [[["categ_id","child_of",ROOT.id]],["id","default_code","name","categ_id","qty_available","product_variant_id"]],
      Object.assign({limit:2000, order:"name"}, LANG));
  }catch(e){ cont.innerHTML='<div class="empty">No se pudieron leer los productos: '+EYG.esc(e.message)+'</div>'; return; }

  // subcategorías reales de la categoría activa (para el desplegable de asignación)
  try{
    const cats = await EYG.rpc("product.category","search_read",
      [[["parent_id","=",ROOT.id]],["id","name"]], LANG);
    const EXCLUIR = ROOT.excluir||[];   // vacías / ajenas a la categoría
    SUBCATS_ODOO = cats.filter(c=>c.name && EXCLUIR.indexOf(c.name)===-1).sort((a,b)=>a.name.localeCompare(b.name));
  }catch(e){ SUBCATS_ODOO=[]; }

  // Embalaje (product.packaging) por variante — la caja real = mínimo de compra
  const varIds = recs.map(r=>r.product_variant_id&&r.product_variant_id[0]).filter(Boolean);
  const packByVar = {};
  if(varIds.length){
    try{
      const packs = await EYG.rpc("product.packaging","search_read",
        [[["product_id","in",varIds]],["id","name","qty","product_id"]], LANG);
      packs.forEach(k=>{ const v=k.product_id&&k.product_id[0]; if(v && !packByVar[v]) packByVar[v]=k; });
    }catch(e){ /* si falla, se muestran sin embalaje */ }
  }

  TODOS = recs.map(r=>{
    const sub=stripPrefix(r.categ_id&&r.categ_id[1]||"")||"(sin subcategoría)";
    const a = analizar(r.name||"", sub);
    const varId = (r.product_variant_id&&r.product_variant_id[0])||null;
    const pk = varId ? packByVar[varId] : null;
    return { id:r.id, sku:r.default_code||"", nombre:r.name||"",
             stock:(r.qty_available!=null?r.qty_available:0),
             varId, embalaje: pk?pk.qty:null, embId: pk?pk.id:null, embNombre: pk?pk.name:"", sub,
             ...a, aplicado:false };
  });
  // subcategorías presentes (ordenadas por cantidad)
  const bycat = {};
  TODOS.forEach(p=>{ bycat[p.sub]=(bycat[p.sub]||0)+1; });
  SUBCATS = Object.keys(bycat).sort((x,y)=>bycat[y]-bycat[x]);
  // conserva las secciones abiertas al sincronizar; en la 1ª carga abre la primera
  abiertos = new Set([...abiertos].filter(s=>SUBCATS.includes(s)));
  if(!preservar && !abiertos.size && SUBCATS.length) abiertos.add(SUBCATS[0]);
  render();
}

function filtrarSub(sc){
  let arr = TODOS.filter(p=>p.sub===sc);
  if(filtro){ const q=filtro.toLowerCase(); arr = arr.filter(p=>(p.nombre+" "+p.sku).toLowerCase().includes(q)); }
  if(filtros.conCambios) arr = arr.filter(p=>p.cambia && !p.aplicado);
  if(filtros.sinBulto)   arr = arr.filter(p=>!p.desg.bultoNum);
  if(filtros.sinConc)    arr = arr.filter(p=>!p.desg.conc);
  if(filtros.sinStock)   arr = arr.filter(p=>(p.stock||0)<=0);
  if(filtros.conStock)   arr = arr.filter(p=>(p.stock||0)>0);
  if(filtros.sinEmbalaje)arr = arr.filter(p=>p.embalaje==null);
  return arr;
}
function hayFiltroActivo(){ return !!filtro || Object.values(filtros).some(Boolean); }

function render(){
  const cont = document.getElementById("cont");
  // KPIs y filtros GLOBALES (sobre todo el catálogo cargado)
  const total = TODOS.length;
  const conCambio = TODOS.filter(p=>p.cambia && !p.aplicado).length;
  const sinConc = TODOS.filter(p=>!p.desg.conc).length;
  const sinBulto = TODOS.filter(p=>!p.desg.bultoNum).length;
  const sinEmb = TODOS.filter(p=>p.embalaje==null).length;
  const sinStock = TODOS.filter(p=>(p.stock||0)<=0).length;

  const kpi = (key,n,label,cls)=>`<div class="kpi ${cls||""} ${key?"clk":""} ${key&&filtros[key]?"on":""}" ${key?`onclick="toggleFiltro('${key}')"`:""}><div class="n">${n}</div><div class="l">${label}</div></div>`;
  const kpis = `<div class="kpis">
    ${kpi(null,total,"Productos","")}
    ${kpi("conCambios",conCambio,"Con corrección","warn")}
    ${kpi("sinConc",sinConc,"Sin concentración","warn")}
    ${kpi("sinBulto",sinBulto,"Sin bulto/caja","warn")}
    ${kpi("sinEmbalaje",sinEmb,"Sin embalaje","warn")}
    ${kpi("sinStock",sinStock,"Sin stock","")}
  </div>`;

  const catsel = `<div class="catsel"><span class="lbl">Categoría</span>${CATEGS.map((c,i)=>`<div class="catpill ${c.id===ROOT.id?"active":""}" onclick="setCateg(${i})">${EYG.esc(c.label)}</div>`).join("")}</div>`;

  const filtrando = hayFiltroActivo();
  const enVista = SUBCATS.reduce((a,sc)=>a+filtrarSub(sc).length,0);
  const algunFiltro = filtros.conCambios||filtros.sinBulto||filtros.sinConc||filtros.sinStock||filtros.conStock||filtros.sinEmbalaje;
  const toolbar = `<div class="toolbar">
    <button class="btn-sync" onclick="sincronizar()">🔄 Actualizar</button>
    <button class="btn-toggle ${filtros.conStock?"on":""}" onclick="toggleFiltro('conStock')">📦 Solo con stock</button>
    <input type="search" id="buscar" placeholder="Buscar por nombre o SKU (en todas las subcategorías)…" value="${EYG.esc(filtro)}" oninput="onBuscar(this.value)">
    <button class="btn-expand" onclick="toggleTodas()">${abiertos.size>=SUBCATS.length?"Contraer todo":"Expandir todo"}</button>
    ${algunFiltro?`<button class="btn-clear" onclick="limpiarFiltros()">✕ Quitar filtros</button>`:""}
    ${HISTORIAL.length?`<button class="btn-undo" onclick="deshacer()">↩ Deshacer (${HISTORIAL.length})</button>`:""}
    <span class="cnt">${enVista} en vista</span>
  </div>`;

  const head = `<div class="thead"><div>SKU</div><div>Nombre actual (Odoo)</div><div>Nombre sugerido</div><div>Aplicar</div><div>Concentración</div><div>Presentación</div><div>Bulto / caja</div><div>Embalaje (caja real)</div></div>`;

  // acordeón: una sección por subcategoría. Con búsqueda de texto, auto-abre las que tienen match.
  const secciones = SUBCATS.map((sc,i)=>{
    const totalSc = TODOS.filter(p=>p.sub===sc).length;
    const arr = filtrarSub(sc);
    if(filtrando && arr.length===0) return "";           // oculta subcategorías sin coincidencias
    const abierta = abiertos.has(sc) || (!!filtro && arr.length>0);
    const pend = arr.filter(p=>p.cambia && !p.aplicado).length;
    const cuerpo = abierta
      ? `<div class="secbody">${head}${arr.length?arr.map(p=>fila(p)).join(""):'<div class="empty">Sin coincidencias con el filtro.</div>'}</div>`
      : "";
    return `<div class="sec ${abierta?"open":""}">
      <div class="sechead" onclick="toggleSec(${i})">
        <span class="chev">▶</span>
        <span class="secname">${EYG.esc(sc)}</span>
        <span class="seccount">${filtrando?arr.length+" / "+totalSc:totalSc}</span>
        ${pend?`<span class="secchg">${pend} a corregir</span>`:""}
        <span class="secright">${pend?`<button class="btn-secap" onclick="event.stopPropagation();aplicarTodos(${i})">Aplicar los ${pend} sugeridos</button>`:""}</span>
      </div>${cuerpo}</div>`;
  }).join("");
  const accordion = `<div class="accordion">${secciones||'<div class="empty">Sin resultados. Probá quitar filtros.</div>'}</div>`;

  cont.innerHTML = `${catsel}<div class="intro">
      <b>Maestro de productos — Depósito.</b> El dato ordenado de cada producto: <b>nombre</b> (detecta mayúsculas, acentos, espacios, unidades pegadas, abreviaturas, códigos sueltos y propone el correcto), <b>bulto/caja</b>, <b>embalaje (caja real)</b> y <b>subcategoría</b>. Cada subcategoría es una <b>sección desplegable</b>: tocá el título para abrirla o cerrarla. <b>Tocá una tarjeta</b> de arriba para filtrar en todas a la vez (con corrección, sin concentración, sin bulto, sin embalaje, sin stock); el buscador también recorre todas las subcategorías. Donde falte el <b>bulto/caja</b>, cargalo desde la fila. En <b>Embalaje (caja real)</b>: cuántas unidades trae la caja cerrada — es el mínimo de compra, se guarda en Odoo. A los productos <b>sin subcategoría</b> asignásela con el desplegable. Revisá y aplicá con un clic; el resto lo sincroniza el sistema solo.
      <details><summary>Ver la regla de nombres que se aplica</summary>
        <div class="std">
          Formato objetivo: <code>MONODROGA CONCENTRACIÓN forma x contenido - LABORATORIO (Caja x N tipo)</code><br>
          • <b>Monodroga y laboratorio</b> en MAYÚSCULAS · <b>unidades y formas</b> en minúscula (mg, ml, comp, susp, amp…).<br>
          • Unidad separada del número: <code>500mg → 500 mg</code> · separador <code>x</code> con espacios: <code>x10 → x 10</code>.<br>
          • Abreviaturas unificadas: comprimidos→<code>comp</code>, cápsulas→<code>caps</code>, suspensión→<code>susp</code>, ampolla→<code>amp</code>, jarabe→<code>jbe</code>.<br>
          • Se quitan del nombre: el código <code>[SKU]</code>, el símbolo <code>@</code> y la ubicación de depósito <code>(H-1-XX)</code>.<br>
          • El bulto se normaliza a <code>(Caja x N tipo)</code>; “SE VENDE POR CAJA CERRADA” se conserva.
        </div>
      </details>
    </div>${kpis}${toolbar}${accordion}`;
}

function fila(p){
  const same = !p.cambia || p.aplicado;
  const chips = p.aplicado ? '' : p.motivos.map(m=>`<span class="mchip">${EYG.esc(m)}</span>`).join("");
  const ap = p.aplicado
      ? '<button class="btn-ap ok" disabled>✓ Aplicado</button>'
      : (p.cambia ? `<button class="btn-ap" onclick="aplicar(${p.id})">Aplicar</button>`
                  : '<button class="btn-ap none" disabled>OK</button>');
  const conc = p.desg.conc ? `<span class="cell-mono">${EYG.esc(p.desg.conc)}</span>` : '<span class="miss">— falta</span>';
  const pres = p.desg.presentacion
      ? `<span class="cell-mono">${EYG.esc(p.desg.presentacion)}</span>${p.desg.forma?`<div class="cell-sub">${EYG.esc(p.desg.forma)}</div>`:""}`
      : (p.desg.forma?`<span class="cell-mono">${EYG.esc(p.desg.forma)}</span>`:'<span class="miss">—</span>');
  const uni = unidadDe(p);
  const bulto = p.desg.bultoNum
      ? `<span class="cell-mono">${p.desg.bultoNum} ${EYG.esc(uni)}</span>${p.desg.cajaCerrada?'<div class="cell-sub">caja cerrada</div>':""}`
      : (p.aplicado ? '<span class="miss">— falta</span>'
         : `<div class="addb"><input type="number" min="1" id="bn-${p.id}" placeholder="N°"><span class="cell-sub" style="align-self:center">${EYG.esc(uni)}</span><button onclick="agregarBulto(${p.id})">+ bulto</button></div>`);
  const nota = p.desg.ubicacion ? `<div class="nota">Ubicación: ${EYG.esc(p.desg.ubicacion)}</div>` : "";
  const stk = `<div class="stk ${(p.stock||0)<=0?'zero':''}">${(p.stock||0)<=0?'sin stock':(p.stock+' u')}</div>`;
  const emb = embCell(p);
  const subSel = (p.sub===SIN_SUB) ? selectorSub(p) : "";
  return `<div class="row" id="row-${p.id}">
    <div class="sku">${EYG.esc(p.sku)}${stk}</div>
    <div class="nactual">${EYG.esc(p.aplicado?p.sugerido:p.nombre)}</div>
    <div class="nsug ${same?"same":""}" id="nsug-${p.id}"><span class="sugtxt">${EYG.esc(p.sugerido)}</span> <button class="edsug" title="Editar el nombre a mano" onclick="editarSug(${p.id})">✎</button>${chips?`<div class="motivos">${chips}</div>`:""}${subSel}</div>
    <div class="apcell">${ap}</div>
    <div>${conc}</div>
    <div>${pres}</div>
    <div>${bulto}${nota}</div>
    <div class="embcell">${emb}</div>
  </div>`;
}

/* ---------- celda de EMBALAJE (caja real = mínimo de compra) ---------- */
function embCell(p){
  if(!p.varId) return '<span class="miss">—</span>';
  const uni = unidadDe(p);
  const btnTxt = p.embId ? "Guardar" : "+ caja";
  const mism = (p.embalaje!=null && p.desg.bultoNum && p.embalaje!==p.desg.bultoNum)
      ? `<div class="nota">nombre dice x${p.desg.bultoNum}</div>` : "";
  const actual = p.embalaje!=null ? `<div class="cell-sub">caja real: <b>${p.embalaje}</b> ${EYG.esc(uni)}</div>` : "";
  return `<div class="addb">
      <input type="number" min="1" id="em-${p.id}" value="${p.embalaje!=null?p.embalaje:""}" placeholder="${EYG.esc(uni)}">
      <button onclick="guardarEmbalaje(${p.id})">${btnTxt}</button>
    </div>${actual}${mism}`;
}

/* =========================== acciones =========================== */
window.setCateg = i => {
  const c = CATEGS[i]; if(!c || c.id===ROOT.id) return;
  ROOT = c; filtro=""; abiertos=new Set(); HISTORIAL=[];
  filtros = {conCambios:false, sinBulto:false, sinConc:false, sinStock:false, conStock:false, sinEmbalaje:false};
  cargar();
};
window.toggleSec = i => { const sc=SUBCATS[i]; if(sc==null) return; if(abiertos.has(sc)) abiertos.delete(sc); else abiertos.add(sc); render(); };
window.toggleTodas = () => { if(abiertos.size>=SUBCATS.length) abiertos.clear(); else abiertos=new Set(SUBCATS); render(); };
function recomputarSubs(){
  const bycat={}; TODOS.forEach(p=>{ bycat[p.sub]=(bycat[p.sub]||0)+1; });
  SUBCATS = Object.keys(bycat).sort((x,y)=>bycat[y]-bycat[x]);
}
// asigna la subcategoria elegida al producto (escribe categ_id en Odoo -> el cron le arma la escalera)
window.asignarSub = async id => {
  const p = TODOS.find(x=>x.id===id); if(!p) return;
  const sel = document.getElementById("sub-"+id);
  const catId = parseInt(sel&&sel.value,10);
  if(!catId){ toast("Elegí una subcategoría"); if(sel) sel.focus(); return; }
  const c = SUBCATS_ODOO.find(x=>x.id===catId); if(!c) return;
  const btn = document.querySelector("#row-"+id+" .subassign button"); if(btn){ btn.disabled=true; btn.textContent="…"; }
  try{
    await EYG.rpc("product.template","write",[[p.id],{categ_id:catId}], LANG);
    p.sub = c.name;
    recomputarSubs();
    abiertos.add(c.name);   // deja visible la subcategoría a la que se movió
    toast("Movido a "+c.name+" ✓ — el cron le arma la escalera");
    render();
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent="Asignar"; } toast("Error: "+EYG.esc(e.message)); }
};
let tBuscar=null;
window.onBuscar = v => { filtro=v; clearTimeout(tBuscar); tBuscar=setTimeout(render,180); };
window.toggleFiltro = k => {
  filtros[k]=!filtros[k];
  if(filtros[k]){ if(k==="conStock") filtros.sinStock=false; if(k==="sinStock") filtros.conStock=false; }
  render();
};
window.limpiarFiltros = () => { filtros={conCambios:false,sinBulto:false,sinConc:false,sinStock:false,conStock:false,sinEmbalaje:false}; render(); };
window.agregarBulto = async id => {
  const p = TODOS.find(x=>x.id===id); if(!p) return;
  const nEl=document.getElementById("bn-"+id);
  const n=parseInt(nEl&&nEl.value,10); if(!n||n<1){ toast("Poné cuántas "+unidadDe(p)+" trae la caja"); if(nEl) nEl.focus(); return; }
  const tipo=unidadDe(p);
  const antes = p.nombre;
  const a = analizar(antes + " (Caja x "+n+" "+tipo+")", p.sub);
  const btn=document.querySelector("#row-"+id+" .addb button"); if(btn){ btn.disabled=true; btn.textContent="…"; }
  try{ await escribir(id, a.sugerido); Object.assign(p,a); p.nombre=a.sugerido; p.aplicado=true; p.cambia=false;
       HISTORIAL.push({cambios:[{id,antes,despues:a.sugerido}], desc:(p.sku||("#"+id))+" · bulto"}); toast("Bulto agregado ✓"); render(); }
  catch(e){ if(btn){ btn.disabled=false; btn.textContent="+ bulto"; } toast("Error: "+e.message); }
};

async function escribir(id, nombre){
  return EYG.rpc("product.template","write",[[id],{name:nombre}], LANG);
}
/* editar el nombre sugerido A MANO (por si el automático dejó algo raro) */
window.editarSug = id => {
  const p = TODOS.find(x=>x.id===id); if(!p) return;
  const box = document.getElementById("nsug-"+id); if(!box) return;
  box.innerHTML = `<div class="sugedit"><input id="sug-${id}" value="${EYG.esc(p.sugerido)}">`
    + `<button onclick="guardarSug(${id})">Guardar</button><button class="can" onclick="render()">✕</button></div>`;
  const inp = document.getElementById("sug-"+id); inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") guardarSug(id); if(e.key==="Escape") render(); });

window.guardarSug = async id => {
  const p = TODOS.find(x=>x.id===id); if(!p) return;
  const inp = document.getElementById("sug-"+id); const val=(inp&&inp.value||"").trim();
  if(!val){ toast("El nombre no puede quedar vacío"); return; }
  const antes = p.nombre;
  try{ await escribir(id, val); p.nombre=val; p.sugerido=val; p.cambia=false; p.aplicado=true;
       HISTORIAL.push({cambios:[{id,antes,despues:val}], desc:(p.sku||("#"+id))+" · manual"}); toast("Nombre guardado ✓"); render(); }
  catch(e){ toast("Error: "+e.message); }
};
/* crea o actualiza el product.packaging (Embalaje) del producto — se sincroniza con Odoo */
window.guardarEmbalaje = async id => {
  const p = TODOS.find(x=>x.id===id); if(!p) return;
  if(!p.varId){ toast("Este producto no tiene variante para el embalaje"); return; }
  const el = document.getElementById("em-"+id);
  const n = parseInt(el&&el.value,10);
  const uni = unidadDe(p);
  if(!n||n<1){ toast("Poné cuántas "+uni+" trae la caja real"); if(el) el.focus(); return; }
  const btn = document.querySelector("#row-"+id+" .embcell button"); if(btn){ btn.disabled=true; btn.textContent="…"; }
  const nombre = "CAJA "+n+" "+uni.toUpperCase();
  try{
    if(p.embId){ await EYG.rpc("product.packaging","write",[[p.embId],{qty:n, name:nombre}], LANG); }
    else{ const nid = await EYG.rpc("product.packaging","create",[{product_id:p.varId, qty:n, name:nombre, sales:true, purchase:true}], LANG); p.embId=nid; }
    p.embalaje=n; p.embNombre=nombre; toast("Embalaje guardado ✓"); render();
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent=p.embId?"Guardar":"+ caja"; } toast("Error: "+EYG.esc(e.message)); }
};
window.sincronizar = async () => {
  await cargar(true);   // relee de Odoo conservando pestaña/filtros/búsqueda; se pierde el historial de deshacer
  HISTORIAL = [];
  toast("Datos actualizados desde Odoo ✓");
};
window.aplicar = async id => {
  const p = TODOS.find(x=>x.id===id); if(!p) return;
  const antes = p.nombre;
  const btn = document.querySelector(`#row-${id} .btn-ap`); if(btn){ btn.disabled=true; btn.textContent="Guardando…"; }
  try{ await escribir(id, p.sugerido); const despues=p.sugerido; p.nombre=despues; p.aplicado=true; p.cambia=false;
       HISTORIAL.push({cambios:[{id,antes,despues}], desc:(p.sku||("#"+id))}); toast("Nombre actualizado ✓"); render(); }
  catch(e){ if(btn){ btn.disabled=false; btn.textContent="Aplicar"; } toast("Error: "+e.message); }
};
window.aplicarTodos = async i => {
  const sc = SUBCATS[i]; if(sc==null) return;
  const arr = filtrarSub(sc).filter(p=>p.cambia && !p.aplicado);
  if(!arr.length) return;
  if(!confirm(`Vas a aplicar ${arr.length} nombres corregidos en "${sc}". ¿Continuar?`)) return;
  let ok=0, err=0; const cambios=[];
  for(const p of arr){
    const antes = p.nombre;
    try{ await escribir(p.id, p.sugerido); cambios.push({id:p.id, antes, despues:p.sugerido}); p.nombre=p.sugerido; p.aplicado=true; p.cambia=false; ok++; }
    catch(e){ err++; }
    if((ok+err)%5===0) toast(`Aplicando… ${ok+err}/${arr.length}`);
  }
  if(cambios.length) HISTORIAL.push({cambios, desc:`${cambios.length} nombres · ${sc}`});
  toast(`Listo: ${ok} aplicados${err?`, ${err} con error`:""}`); render();
};
window.deshacer = async () => {
  const entry = HISTORIAL[HISTORIAL.length-1]; if(!entry) return;
  if(!confirm(`¿Deshacer el último cambio (${entry.desc})? Se restauran ${entry.cambios.length} nombre(s) en Odoo.`)) return;
  let ok=0, err=0;
  for(const c of entry.cambios){
    try{ await escribir(c.id, c.antes); const p=TODOS.find(x=>x.id===c.id); if(p){ Object.assign(p, analizar(c.antes, p.sub)); p.nombre=c.antes; p.aplicado=false; } ok++; }
    catch(e){ err++; }
  }
  HISTORIAL.pop();
  toast(`Deshecho: ${ok} restaurado(s)${err?`, ${err} con error`:""}`); render();
};

let tToast=null;
function toast(msg){ let t=document.getElementById("toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); } t.textContent=msg; t.classList.add("show"); clearTimeout(tToast); tToast=setTimeout(()=>t.classList.remove("show"),2600); }

EYG.requireAuth(["inventario"], perfil=>{
  document.body.innerHTML = EYG.layout(perfil, "nombres", '<div id="cont"></div>', "Maestro de productos");
  cargar();
});
