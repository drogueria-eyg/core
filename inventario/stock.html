<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../assets/core.css">
<style>
  /* colores de rotación (5 buckets) — específicos del módulo */
  :root{
    --green:#1E7D46; --greenbg:#E4F5E9; --lime:#6E9B1E; --limebg:#EEF6DD;
    --yel:#B7791F; --yelbg:#FBF3D9; --org:#C4602A; --orgbg:#FBE3D4; --red:#8A1F1C; --redbg:#F7D2D0;
  }
  .intro{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 18px;box-shadow:var(--shadow);margin-bottom:16px;font-size:13.5px;color:var(--gris)}
  .intro b{color:var(--ink)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px;margin-bottom:6px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow)}
  .kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:700;margin-bottom:6px}
  .kpi .n{font-size:24px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
  .kpi .d{font-size:12px;color:var(--gris);margin-top:3px}
  .kpi.warn{border-color:#F2C99B;background:#FFF8F1}.kpi.warn .n{color:var(--org)}
  .kpi.alert{border-color:#F0B3B0;background:#FDF3F2}.kpi.alert .n{color:var(--red)}

  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--teal-deep);font-weight:800;margin:28px 0 12px;display:flex;align-items:center;gap:9px}
  h2.sec:before{content:"";width:5px;height:16px;background:var(--teal);border-radius:3px}

  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  .flux{display:flex;align-items:flex-end;gap:9px;height:200px;padding-top:6px}
  .fcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
  .fbars{display:flex;gap:3px;align-items:flex-end;height:160px;width:100%;justify-content:center}
  .fbar{width:13px;border-radius:3px 3px 0 0}
  .fbar.v{background:var(--teal)}.fbar.c{background:#C9A227}
  .fcol .m{font-size:10px;color:var(--gris);font-weight:600}
  .leg{display:flex;gap:18px;font-size:12px;color:var(--gris);margin-top:8px}
  .leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .note{background:#FFF8F1;border:1px solid #F2C99B;border-left:4px solid var(--org);border-radius:10px;padding:12px 14px;font-size:13px;margin-top:12px;color:#7A3E17}
  .note b{color:var(--org)}

  .rotbar{display:flex;height:36px;border-radius:9px;overflow:hidden;margin:2px 0 14px;border:1px solid var(--line)}
  .rotbar div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
  .rotleg{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px}
  .rl{display:flex;align-items:center;gap:9px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .rl .dot{width:12px;height:12px;border-radius:3px;flex:none}
  .rl .lb{flex:1}.rl .lb b{display:block}.rl .lb span{font-size:11px;color:var(--gris)}
  .rl .vv{font-weight:800;text-align:right}.rl .vv span{display:block;font-size:11px;color:var(--gris);font-weight:600}

  .lst{list-style:none}
  .li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .li:last-child{border:0}.li:hover{background:#F7FBFA}
  .li .nm{flex:1;min-width:0}
  .li .nm b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .nm span{font-size:11.5px;color:var(--gris)}
  .li .amt{font-weight:800;font-size:13.5px;text-align:right;white-space:nowrap}
  .pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
  .pill.red{background:var(--redbg);color:var(--red)}.pill.org{background:var(--orgbg);color:var(--org)}.pill.gray{background:#EEF2F1;color:var(--gris)}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
  .search input{border:0;background:none;outline:none;font-family:inherit;font-size:14px;width:100%;color:var(--ink)}
  .search svg{width:17px;height:17px;color:var(--gris2);flex-shrink:0}
  select,.mini-btn{font-family:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px;color:var(--ink);cursor:pointer;font-weight:500}
  .chip{font-size:12px;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;color:var(--gris)}
  .chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .count-line{font-size:13px;color:var(--gris);margin:2px 0 10px}.count-line b{color:var(--ink)}

  .tablecard{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .thead,.row{display:grid;grid-template-columns:2.6fr 1.3fr 1fr 0.8fr 0.8fr 0.9fr;gap:12px;align-items:center;padding:10px 16px}
  .thead{background:#F0F6F5;border-bottom:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--gris);position:sticky;top:51px;z-index:10;border-radius:14px 14px 0 0;cursor:pointer;user-select:none}
  .thead>div{cursor:pointer}
  .row{border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s}
  .row:hover{background:#F7FBFA}.row:last-child{border-bottom:0}
  .thead>div,.row>div{min-width:0}
  .tr-r{text-align:right;font-variant-numeric:tabular-nums}
  .cname{font-weight:700;font-size:13.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cmeta{font-size:11.5px;color:var(--gris2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .num{font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px}
  .rbadge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px}

  .loading,.empty{text-align:center;padding:70px 20px;color:var(--gris)}
  .prog{font-size:12.5px;color:var(--gris2);margin-top:8px}
  .errbox{background:var(--badbg);border:1px solid #F3B5B2;color:#8A2E2B;padding:16px;border-radius:12px;font-size:14px}

  .scrim{position:fixed;inset:0;background:rgba(6,65,62,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:460px;max-width:94vw;background:var(--surface);z-index:70;box-shadow:-8px 0 40px rgba(6,65,62,.18);transform:translateX(100%);transition:transform .24s ease;display:flex;flex-direction:column}
  .drawer.on{transform:none}
  .dhead{padding:20px 22px;border-bottom:1px solid var(--line);background:var(--teal-deep);color:#fff}
  .dhead .x{float:right;cursor:pointer;opacity:.85;font-size:22px;line-height:1}
  .dhead h2{font-size:17px;font-weight:800;padding-right:24px;line-height:1.3}
  .dhead .deuda{margin-top:8px;font-size:24px;font-weight:800}
  .dhead .badges{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}
  .dbody{padding:20px 22px;overflow-y:auto;flex:1}
  .dsec{margin-bottom:22px}
  .dsec h4{font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--teal-med);margin-bottom:10px}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .kv .k{color:var(--gris)} .kv .v{font-weight:600;text-align:right}
  .fac{display:grid;grid-template-columns:1fr auto auto;gap:8px;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center}
  .fac .fv{color:var(--gris)} .fac .fr{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
  .msgbox{width:100%;font-family:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:10px;padding:12px;min-height:110px;resize:vertical;color:var(--ink);line-height:1.5}
  .wa-send{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--teal);color:#fff;border:0;border-radius:10px;padding:13px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;text-decoration:none}
  .opogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .opocard{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:11px 12px;background:#fff}
  .opocard .on{font-weight:800;font-size:13px;line-height:1.25;margin:6px 0 3px}
  .opocard .om{font-size:11.5px;color:var(--gris)}
  .opocard .op{margin:7px 0 3px;font-size:13px}
  .opocard .op .a{color:var(--gris2);text-decoration:line-through;font-size:12px}
  .opocard .op .b{font-weight:800;color:var(--green)}
  .opocard .op .pc{background:var(--greenbg);color:var(--green);font-weight:800;font-size:11px;border-radius:20px;padding:1px 7px}
  .opocard .ok2{font-size:11px;color:var(--gris2)}
  .omot{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:20px}
  .omot.venc{background:var(--redbg);color:var(--red)} .omot.sob{background:var(--orgbg);color:var(--org)} .omot.mue{background:#EEF2F1;color:var(--gris)}
  @media(max-width:860px){ .grid2{grid-template-columns:1fr} .rotleg{grid-template-columns:1fr}
    .thead,.row{grid-template-columns:2fr 1fr 0.9fr} .hide-sm{display:none} .fbar{width:8px} }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js"></script>
<script src="../assets/inventario-oportunidades.js"></script>
<script>
/* ================= EyG Core · Inventario · Stock y Sobrestock ================= */
const PROVEEDOR_T=2634; // OC gigante de carga inicial, excluida del flujo de compras
const rpc=(m,me,a,k)=>EYG.rpc(m,me,a,k);
const money=EYG.money, esc=EYG.esc;
const fmtM=n=>"$"+(n/1e6).toFixed(1)+"M";
const prog=t=>{const e=document.getElementById("prog");if(e)e.textContent=t;};

const HOY=new Date(); HOY.setHours(0,0,0,0);
const iso=d=>d.toISOString().slice(0,10);
const MESES_ES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
// familia = 1er segmento útil de la categoría (la raíz de Odoo es "ALL", a veces duplicada)
function familia(categ){ if(!categ) return "Sin categoría"; const p=categ[1].split("/").map(s=>s.trim()).filter(s=>s&&s.toUpperCase()!=="ALL"); return p[0]||"Sin categoría"; }
function mesesHasta(f){ if(!f) return null; const d=new Date(f.slice(0,10)); return (d-HOY)/(1000*3600*24*30.44); }

let DATA=[], LOTES={}, FLUJO={meses:[],ventas:[],compras:[]}, TOT=0, KPI={}, BUCKETS=[], FAMS=[], OPORT=[];
let filtro={q:"",fam:"",chip:"",sortK:"val",dir:-1};

const B_DEF=[["Sano","menos de 3 meses",0,3,"green"],["Elevado","3 a 6 meses",3,6,"lime"],["Alto","6 a 12 meses",6,12,"yel"],["Sobrestock","1 a 3 años",12,36,"org"],["Muerto / crítico","más de 3 años o sin venta",36,1e12,"red"]];

async function cargar(){
  try{
    // ventana de 12 meses completos (excluye el mes en curso, parcial)
    const curIni=new Date(HOY.getFullYear(),HOY.getMonth(),1);
    const ini12=new Date(HOY.getFullYear(),HOY.getMonth()-12,1);

    prog("stock, ventas y flujo…");
    const [stock, ventas, so, po] = await Promise.all([
      rpc("stock.quant","read_group",[[["location_id.usage","=","internal"],["quantity",">",0]],["value:sum","quantity:sum"],["product_id"]],{lazy:false,limit:5000}),
      rpc("sale.order.line","read_group",[[["order_id.state","in",["sale","done"]],["order_id.date_order",">=",iso(ini12)]],["product_uom_qty:sum"],["product_id"]],{lazy:false,limit:9000}),
      rpc("sale.order","read_group",[[["state","in",["sale","done"]],["date_order",">=",iso(ini12)],["date_order","<",iso(curIni)]],["amount_untaxed:sum"],["date_order:month"]],{lazy:false}),
      rpc("purchase.order","read_group",[[["state","in",["purchase","done"]],["date_order",">=",iso(ini12)],["date_order","<",iso(curIni)],["partner_id","!=",PROVEEDOR_T]],["amount_untaxed:sum"],["date_order:month"]],{lazy:false}),
    ]);

    const V={}; for(const v of ventas){ if(v.product_id) V[v.product_id[0]]=v.product_uom_qty||0; }
    const stockIds=stock.filter(s=>s.product_id).map(s=>s.product_id[0]);

    prog("categorías y vencimientos…");
    const [meta, quantsLote] = await Promise.all([
      rpc("product.product","read",[stockIds,["categ_id","default_code","name","standard_price","list_price","product_tmpl_id","x_oportunidad","x_oportunidad_archivada"]]),
      rpc("stock.quant","search_read",[[["location_id.usage","=","internal"],["quantity",">",0],["lot_id","!=",false]],["product_id","lot_id","quantity","value"]],{limit:5000}),
    ]);
    const M={}; for(const m of meta) M[m.id]=m;
    const lotIds=[...new Set(quantsLote.filter(q=>q.lot_id).map(q=>q.lot_id[0]))];
    prog("fechas de vencimiento…");
    const lotes = await rpc("stock.lot","read",[lotIds,["expiration_date","name","product_id"]]);
    const L={}; for(const l of lotes) L[l.id]=l;

    // lotes por producto + agregados de vencimiento
    LOTES={}; const vencP={};
    for(const q of quantsLote){
      if(!q.product_id||!q.lot_id) continue;
      const pid=q.product_id[0], lot=L[q.lot_id[0]]||{};
      const mh=lot.expiration_date?mesesHasta(lot.expiration_date):null;
      (LOTES[pid]=LOTES[pid]||[]).push({lote:lot.name||"—",qty:q.quantity,value:q.value,exp:lot.expiration_date?lot.expiration_date.slice(0,10):null,mh});
      const vp=vencP[pid]||(vencP[pid]={venc:0,v6:0,v12:0,min:9999});
      if(mh!==null){ if(mh<vp.min)vp.min=mh; if(mh<0)vp.venc+=q.value; else if(mh<6)vp.v6+=q.value; else if(mh<12)vp.v12+=q.value; }
    }

    // dataset maestro
    DATA=stock.filter(s=>s.product_id).map(s=>{
      const id=s.product_id[0], m=M[id]||{}, vp=vencP[id]||{};
      const val=s.value||0, qty=s.quantity||0, ventaU=Math.round(V[id]||0);
      const meses = ventaU>0 ? qty/(ventaU/12) : 999;
      return {id, tmpl:m.product_tmpl_id?m.product_tmpl_id[0]:null, xop:!!m.x_oportunidad, xarch:!!m.x_oportunidad_archivada,
        code:m.default_code||"", name:s.product_id[1], fam:familia(m.categ_id),
        categ:m.categ_id?m.categ_id[1]:"", val, qty, ventaU,
        meses: meses>900?999:Math.round(meses*10)/10,
        costoU:m.standard_price||0, pvp:m.list_price||0,
        min:(vp.min!==undefined&&vp.min<9999)?Math.round(vp.min*10)/10:null,
        valVenc:Math.round(vp.venc||0), val6:Math.round(vp.v6||0), val12:Math.round(vp.v12||0)};
    });

    // flujo mensual ordenado
    const monK=g=>g.__range?g.__range["date_order:month"].from:g["date_order:month"];
    const label=fromStr=>{const d=new Date(fromStr); return MESES_ES[d.getMonth()]+"'"+String(d.getFullYear()).slice(2);};
    const mapMon=arr=>{const o={};for(const g of arr){const f=monK(g);o[f]=g.amount_untaxed||0;}return o;};
    const soM=mapMon(so), poM=mapMon(po);
    const keys=[...new Set([...Object.keys(soM),...Object.keys(poM)])].sort();
    FLUJO={meses:keys.map(label), ventas:keys.map(k=>(soM[k]||0)/1e6), compras:keys.map(k=>(poM[k]||0)/1e6)};

    computar();
    await detectarOportunidades();
    render();
  }catch(e){
    document.getElementById("app").innerHTML='<div class="errbox"><b>No pude leer el stock desde Odoo.</b><br>'+esc(e.message)+'</div>';
  }
}

/* Detecta hasta 5 oportunidades para OFERTAR a clientes (por vencimiento, sobrestock o sin venta).
   Usa la lógica compartida EYGOpo (misma que el módulo Oportunidades) sobre los datos ya cargados.
   Respeta la lista de ignorados (archivadas/eliminadas) y las que ya están en oferta activa. */
async function detectarOportunidades(){
  OPORT=[];
  try{
    // productos ya en oferta activa + ignorados (archivados/eliminados en Oportunidades)
    let ofertas=[], ignora=[];
    try{ ofertas=JSON.parse(await rpc("ir.config_parameter","get_param",["eyg.ofertas"])||"[]"); }catch(e){}
    try{ const est=JSON.parse(await rpc("ir.config_parameter","get_param",["eyg.oportunidades_stock_estado"])||"{}"); ignora=est.ignora||[]; }catch(e){}
    const hoyS=iso(HOY), enOferta=[];
    (ofertas||[]).filter(o=>!o.hasta||o.hasta>=hoyS).forEach(o=>(o.items||[]).forEach(i=>enOferta.push(i.id)));
    OPORT = await EYGOpo.desdeData(rpc, DATA, {ignora, enOferta});
  }catch(e){ console.warn("detectarOportunidades:", e.message); }
}

function computar(){
  TOT=DATA.reduce((a,r)=>a+r.val,0);
  BUCKETS=B_DEF.map(([lbl,sub,lo,hi,col])=>{const sel=DATA.filter(r=>r.meses>=lo&&r.meses<hi);return{lbl,sub,col,n:sel.length,val:sel.reduce((a,r)=>a+r.val,0)};});
  const muerto=DATA.filter(r=>r.ventaU===0).reduce((a,r)=>a+r.val,0);
  let exceso3=0; for(const r of DATA){ if(r.ventaU>0){const ideal=(r.ventaU/12)*3, cu=r.val/r.qty; if(r.qty>ideal) exceso3+=(r.qty-ideal)*cu;}}
  const vencido=DATA.reduce((a,r)=>a+(r.valVenc||0),0);
  const v6=DATA.reduce((a,r)=>a+(r.val6||0),0);
  let riesgo=0; for(const r of DATA){ if(r.min!==null && r.meses>0 && r.min<r.meses) riesgo+=(r.valVenc+r.val6); }
  const sobre=BUCKETS[3].val+BUCKETS[4].val;
  KPI={inv:TOT, sobre, sobrePct:sobre/TOT*100, inmov:exceso3+muerto, muerto, vencido, v6, riesgo};
  FAMS=[...new Set(DATA.map(r=>r.fam))].sort();
}

const rotCls=m=>m<3?"green":m<6?"lime":m<12?"yel":m<36?"org":"red";
const cleanName=n=>n.replace(/@$/,"").trim();

function render(){
  const app=document.getElementById("app");
  const mx=Math.max(1,...FLUJO.ventas,...FLUJO.compras);
  const frenar=[...DATA].filter(r=>r.meses>12).sort((a,b)=>b.val-a.val).slice(0,25);
  const liquidar=[...DATA].filter(r=>r.valVenc>0||r.val6>0||(r.ventaU===0&&r.val>200000))
    .map(r=>({...r,prio:r.valVenc*4+r.val6*2+(r.ventaU===0?r.val:0)})).sort((a,b)=>b.prio-a.prio).slice(0,25);

  app.innerHTML=`
    <div class="intro">Radiografía del inventario en vivo desde Odoo. <b>Cuánta plata hay parada, dónde, y qué vence antes de venderse.</b> Cada número lleva a una acción: frenar compra o liquidar. Tocá cualquier producto para ver sus lotes y una sugerencia.</div>

    <div class="kpis">
      <div class="kpi"><div class="l">Inventario valorizado</div><div class="n">${fmtM(KPI.inv)}</div><div class="d">${DATA.length} productos con stock</div></div>
      <div class="kpi warn"><div class="l">Sobrestock (+1 año)</div><div class="n">${fmtM(KPI.sobre)}</div><div class="d">${KPI.sobrePct.toFixed(0)}% del inventario</div></div>
      <div class="kpi warn"><div class="l">Plata liberable</div><div class="n">${fmtM(KPI.inmov)}</div><div class="d">sobre 3 meses de demanda</div></div>
      <div class="kpi alert"><div class="l">En riesgo de tirar</div><div class="n">${fmtM(KPI.riesgo)}</div><div class="d">vence antes de venderse · ${money(KPI.vencido)} ya vencido</div></div>
    </div>

    ${OPORT.length?`
    <h2 class="sec">Oportunidades para ofertar a clientes</h2>
    <div class="pcard" style="padding:16px 18px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
        <div style="font-size:13px;color:var(--gris);flex:1;min-width:200px">Detectamos <b>${OPORT.length}</b> productos que conviene ofertar (por vencimiento, sobrestock o sin venta). Ya están en <b>Oportunidades</b> para que el equipo las convierta en ofertas para los clientes.</div>
        <a class="mini-btn" style="background:var(--gold);color:#fff;border-color:var(--gold)" href="${EYG.abs('inventario/oportunidades.html')}">Ir a Oportunidades →</a>
      </div>
      <div class="opogrid">${OPORT.map(o=>{
        const badge=o.motivo==="vence"?'<span class="omot venc">Por vencer</span>':o.motivo==="sobre"?'<span class="omot sob">Sobrestock</span>':'<span class="omot mue">Sin venta</span>';
        return `<div class="opocard">${badge}
          <div class="on">${esc(o.nombre)}</div>
          <div class="om">${esc(o.motivoTxt)}</div>
          <div class="op"><span class="a">${money(o.precio)}</span> → <span class="b">${money(o.sugPrecio)}</span> <span class="pc">−${Math.round(o.desc*100)}%</span></div>
          <div class="ok2">Stock ${o.stock.toLocaleString("es-AR")} u · ${money(o.valor)}</div>
        </div>`}).join("")}</div>
    </div>`:""}

    <h2 class="sec">Flujo de compra y venta · 12 meses</h2>
    <div class="pcard">
      <div class="flux">${FLUJO.meses.map((m,i)=>`<div class="fcol"><div class="fbars">
        <div class="fbar v" style="height:${FLUJO.ventas[i]/mx*100}%" title="Ventas ${m}: $${FLUJO.ventas[i].toFixed(0)}M"></div>
        <div class="fbar c" style="height:${FLUJO.compras[i]/mx*100}%" title="Compras ${m}: $${FLUJO.compras[i].toFixed(0)}M"></div>
        </div><div class="m">${m}</div></div>`).join("")}</div>
      <div class="leg"><span><i style="background:var(--teal)"></i>Ventas (neto s/IVA)</span><span><i style="background:#C9A227"></i>Compras (neto s/IVA)</span></div>
      <div class="note">Compras y ventas se mueven parejas → se compra bien contra lo que se vende. Se excluye una orden de <b>~$1.010M a "PROVEEDOR T"</b> (ago'25) que parece carga inicial, no compra real.</div>
    </div>

    <h2 class="sec">En qué está parada la plata del inventario</h2>
    <div class="pcard">
      <div class="rotbar">${BUCKETS.map(b=>{const p=b.val/TOT*100;return `<div style="background:var(--${b.col});width:${p}%" title="${b.lbl}: ${fmtM(b.val)}">${p>7?p.toFixed(0)+"%":""}</div>`}).join("")}</div>
      <div class="rotleg">${BUCKETS.map(b=>`<div class="rl"><span class="dot" style="background:var(--${b.col})"></span>
        <span class="lb"><b>${b.lbl}</b><span>${b.sub} · ${b.n} productos</span></span>
        <span class="vv">${fmtM(b.val)}<span>${(b.val/TOT*100).toFixed(0)}%</span></span></div>`).join("")}</div>
    </div>

    <h2 class="sec">Dos listas para actuar</h2>
    <div class="grid2">
      <div class="pcard">
        <div style="font-weight:800;font-size:15px">🛑 Frenar compra</div>
        <p style="font-size:12.5px;color:var(--gris);margin:4px 0 8px">Ya hay stock para más de un año. No reponer hasta que baje.</p>
        <ul class="lst">${frenar.map(r=>`<li class="li" onclick="abrir(${r.id})"><div class="nm"><b>${esc(cleanName(r.name))}</b>
          <span>${r.meses>900?"sin venta 12m":r.meses+" meses de stock"} · ${r.qty} u</span></div><div class="amt">${money(r.val)}</div></li>`).join("")}</ul>
      </div>
      <div class="pcard">
        <div style="font-weight:800;font-size:15px">🔥 Liquidar / ofertar ya</div>
        <p style="font-size:12.5px;color:var(--gris);margin:4px 0 8px">Vencido, por vencer, o muerto. Recuperar algo antes de tirarlo.</p>
        <ul class="lst">${liquidar.map(r=>{const tg=r.valVenc>0?`<span class="pill red">vencido ${money(r.valVenc)}</span>`:r.val6>0?`<span class="pill org">vence &lt;6m</span>`:`<span class="pill gray">sin venta</span>`;
          return `<li class="li" onclick="abrir(${r.id})"><div class="nm"><b>${esc(cleanName(r.name))}</b><span>${tg}</span></div><div class="amt">${money(r.val)}</div></li>`}).join("")}</ul>
      </div>
    </div>

    <h2 class="sec">Explorador de inventario</h2>
    <div class="toolbar">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" placeholder="Buscar producto o código…" oninput="onSearch(this.value)"></div>
      <select id="fam" onchange="filtro.fam=this.value;renderTabla()"><option value="">Todas las familias</option>${FAMS.map(f=>`<option>${esc(f)}</option>`).join("")}</select>
      <span class="chip" onclick="setChip('sobre',this)">Sobrestock (+12m)</span>
      <span class="chip" onclick="setChip('muerto',this)">Sin venta</span>
      <span class="chip" onclick="setChip('venc',this)">Riesgo vencimiento</span>
      <button class="mini-btn" onclick="verResumen()" style="background:var(--teal);color:#fff;border-color:var(--teal)">📋 Resumen</button>
      <button class="mini-btn" onclick="exportarCSV()">Exportar CSV</button>
    </div>
    <div id="tabla"></div>`;
  renderTabla();
}

function visibles(){
  return DATA.filter(r=>{
    if(filtro.q){const q=filtro.q.toLowerCase(); if(!(r.name.toLowerCase().includes(q)||(r.code||"").toLowerCase().includes(q))) return false;}
    if(filtro.fam && r.fam!==filtro.fam) return false;
    if(filtro.chip==="sobre" && !(r.meses>12)) return false;
    if(filtro.chip==="muerto" && r.ventaU!==0) return false;
    if(filtro.chip==="venc" && !(r.valVenc>0||r.val6>0)) return false;
    return true;
  });
}
function renderTabla(){
  let d=visibles();
  const k=filtro.sortK;
  d=[...d].sort((a,b)=>{let x=a[k],y=b[k];if(typeof x==="string")return filtro.dir*x.localeCompare(y);return filtro.dir*((x??-1)-(y??-1));});
  const tot=d.reduce((a,r)=>a+r.val,0);
  const cap=d.slice(0,300);
  const arrow=key=>filtro.sortK===key?(filtro.dir<0?" ↓":" ↑"):"";
  document.getElementById("tabla").innerHTML=`
    <div class="count-line"><b>${d.length}</b> productos · ${fmtM(tot)} en stock</div>
    <div class="tablecard">
      <div class="thead">
        <div onclick="sortBy('name')">Producto${arrow('name')}</div>
        <div class="hide-sm" onclick="sortBy('fam')">Familia${arrow('fam')}</div>
        <div class="tr-r" onclick="sortBy('val')">Valor${arrow('val')}</div>
        <div class="tr-r hide-sm" onclick="sortBy('ventaU')">Vta/año${arrow('ventaU')}</div>
        <div class="tr-r" onclick="sortBy('meses')">Meses${arrow('meses')}</div>
        <div class="tr-r" onclick="sortBy('min')">Vence${arrow('min')}</div>
      </div>
      ${cap.map(r=>{const c=rotCls(r.meses);
        const venc=r.min===null?'<span style="color:#CCD5D3">—</span>':r.min<0?'<b style="color:var(--red)">vencido</b>':(r.min<6?'<b style="color:var(--org)">'+r.min+'m</b>':r.min+'m');
        return `<div class="row" onclick="abrir(${r.id})">
          <div><div class="cname">${esc(cleanName(r.name))}</div><div class="cmeta">${esc(r.code||"")}</div></div>
          <div class="hide-sm cmeta">${esc(r.fam)}</div>
          <div class="tr-r num">${money(r.val)}</div>
          <div class="tr-r hide-sm num" style="font-weight:500">${r.ventaU.toLocaleString("es-AR")}</div>
          <div class="tr-r"><span class="rbadge" style="background:var(--${c}bg);color:var(--${c})">${r.meses>900?"—":r.meses+"m"}</span></div>
          <div class="tr-r">${venc}</div>
        </div>`}).join("")}
      ${d.length>300?`<div class="empty" style="padding:16px">…y ${d.length-300} más. Afiná el filtro o el buscador.</div>`:""}
    </div>`;
}
let sT; function onSearch(v){filtro.q=v;clearTimeout(sT);sT=setTimeout(renderTabla,160);}
function setChip(c,el){const on=filtro.chip===c;document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));filtro.chip=on?"":c;if(!on)el.classList.add("on");renderTabla();}
function sortBy(k){if(filtro.sortK===k)filtro.dir*=-1;else{filtro.sortK=k;filtro.dir=(k==="name"||k==="fam")?1:-1;}renderTabla();}

function abrir(id){
  const r=DATA.find(x=>x.id===id); if(!r) return;
  const lotes=(LOTES[id]||[]).sort((a,b)=>(a.mh??9999)-(b.mh??9999));
  const c=rotCls(r.meses);
  const d=document.getElementById("drawer");
  d.innerHTML=`
    <div class="dhead"><span class="x" onclick="cerrar()">✕</span>
      <h2>${esc(cleanName(r.name))}</h2>
      <div class="deuda">${money(r.val)}</div>
      <div class="badges">
        <span class="rbadge" style="background:rgba(255,255,255,.16);color:#fff">${r.meses>900?"sin venta":r.meses+" meses de stock"}</span>
        ${r.min!==null?`<span class="rbadge" style="background:rgba(255,255,255,.16);color:#fff">${r.min<0?"vencido en depósito":"vence en "+r.min+"m"}</span>`:""}
      </div>
    </div>
    <div class="dbody">
      <div class="dsec"><h4>Situación</h4>
        <div class="kv"><span class="k">Código</span><span class="v">${esc(r.code||"—")}</span></div>
        <div class="kv"><span class="k">Familia</span><span class="v">${esc(r.fam)}</span></div>
        <div class="kv"><span class="k">Unidades en stock</span><span class="v">${r.qty.toLocaleString("es-AR")}</span></div>
        <div class="kv"><span class="k">Vendidas último año</span><span class="v">${r.ventaU.toLocaleString("es-AR")}</span></div>
        <div class="kv"><span class="k">Meses de stock</span><span class="v" style="color:var(--${c})">${r.meses>900?"sin ventas":r.meses+" meses"}</span></div>
        <div class="kv"><span class="k">Costo unitario</span><span class="v">${money(r.costoU)}</span></div>
        <div class="kv"><span class="k">Precio de lista</span><span class="v">${money(r.pvp)}</span></div>
      </div>
      <div class="dsec"><h4>Lotes y vencimiento (${lotes.length})</h4>
        ${lotes.length?lotes.map(l=>{const vt=l.mh===null?"sin fecha":l.mh<0?'<b style="color:var(--red)">VENCIDO</b>':l.mh<6?'<b style="color:var(--org)">'+Math.round(l.mh*10)/10+'m</b>':Math.round(l.mh*10)/10+"m";
          return `<div class="fac"><span>Lote ${esc(l.lote)}<div class="fv">vence ${l.exp?l.exp.split("-").reverse().join("/"):"—"} · ${vt}</div></span><span class="fv">${l.qty} u</span><span class="fr">${money(l.value)}</span></div>`}).join(""):'<div class="cmeta">Sin lotes con trazabilidad.</div>'}
      </div>
      <div class="dsec"><h4>Sugerencia</h4>
        <p style="font-size:13.5px;line-height:1.55;color:var(--ink)">${sugerencia(r)}</p>
      </div>
    </div>`;
  d.classList.add("on"); document.getElementById("scrim").classList.add("on");
}
function sugerencia(r){
  if(r.valVenc>0) return `Hay <b>${money(r.valVenc)}</b> ya vencido en depósito: dar de baja contablemente y retirar del stock.`;
  if(r.val6>0 && (r.min!==null && r.meses>r.min)) return `Vence en <b>${r.min} meses</b> pero al ritmo actual tardaría <b>${r.meses}</b> en venderse. Ofertar/liquidar ya para recuperar algo antes de que sea pérdida.`;
  if(r.ventaU===0) return `Sin ventas en el último año. Revisar si sigue vigente: liquidar, devolver al proveedor o discontinuar.`;
  if(r.meses>12) return `Stock para <b>${r.meses} meses</b>. Frenar la reposición hasta que baje a un nivel razonable (2-3 meses).`;
  return `Rotación saludable. Mantener el nivel de reposición actual.`;
}
function cerrar(){document.getElementById("drawer").classList.remove("on");document.getElementById("scrim").classList.remove("on");}
document.addEventListener("keydown",e=>{if(e.key==="Escape")cerrar();});

function textoResumen(){
  const hoyStr=HOY.toLocaleDateString("es-AR",{day:"2-digit",month:"long",year:"numeric"});
  const frenar=[...DATA].filter(r=>r.meses>12).sort((a,b)=>b.val-a.val);
  const frenarM=frenar.reduce((a,r)=>a+r.val,0);
  const vencido=DATA.filter(r=>r.valVenc>0).sort((a,b)=>b.valVenc-a.valVenc);
  const porVencer=DATA.filter(r=>r.val6>0 && r.min!==null && r.meses>r.min).sort((a,b)=>b.val6-a.val6);
  let t=`📦 *Droguería EyG · Stock ${hoyStr}*\n\n`;
  t+=`💰 Inventario: ${fmtM(KPI.inv)}\n🐢 Sobrestock (+1 año): ${fmtM(KPI.sobre)} (${KPI.sobrePct.toFixed(0)}%)\n🗑️ En riesgo de tirar: ${fmtM(KPI.riesgo)}\n\n`;
  t+=`🛑 *Frenar compra (top): ${money(frenarM)} en ${frenar.length} productos*\n`;
  frenar.slice(0,8).forEach(r=>t+=`• ${cleanName(r.name)} — ${money(r.val)} (${r.meses>900?"sin venta":r.meses+"m stock"})\n`);
  if(vencido.length){t+=`\n⚠️ *Ya vencido en depósito: ${money(KPI.vencido)}*\n`;
    vencido.slice(0,6).forEach(r=>t+=`• ${cleanName(r.name)} — ${money(r.valVenc)}\n`);}
  if(porVencer.length){t+=`\n🔥 *Por vencer <6m sin alcanzar a venderse:*\n`;
    porVencer.slice(0,6).forEach(r=>t+=`• ${cleanName(r.name)} — ${money(r.val6)} (vence ${r.min}m)\n`);}
  return t;
}
function verResumen(){
  const d=document.getElementById("drawer");
  d.innerHTML=`<div class="dhead"><span class="x" onclick="cerrar()">✕</span><h2>📋 Resumen de stock</h2>
      <div class="badges"><span class="rbadge" style="background:rgba(255,255,255,.16);color:#fff">para pegar en WhatsApp</span></div></div>
    <div class="dbody">
      <textarea class="msgbox" id="resTxt" style="min-height:360px;white-space:pre-wrap">${esc(textoResumen())}</textarea>
      <button class="wa-send" onclick="copiarRes(this)">Copiar resumen</button>
    </div>`;
  d.classList.add("on"); document.getElementById("scrim").classList.add("on");
}
function copiarRes(btn){const ta=document.getElementById("resTxt");navigator.clipboard.writeText(ta.value).then(()=>{btn.textContent="✓ Copiado";setTimeout(()=>btn.textContent="Copiar resumen",1800);}).catch(()=>{ta.select();document.execCommand("copy");btn.textContent="✓ Copiado";});}

function exportarCSV(){
  const d=[...visibles()].sort((a,b)=>b.val-a.val);
  const head=["Codigo","Producto","Familia","ValorStock","Unidades","VentaAnual","MesesStock","VenceEnMeses","YaVencido","VencePorc6m"];
  const rows=d.map(r=>[r.code,cleanName(r.name),r.fam,Math.round(r.val),r.qty,r.ventaU,r.meses>900?"":r.meses,r.min??"",Math.round(r.valVenc),Math.round(r.val6)].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","));
  const csv="﻿"+[head.join(","),...rows].join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="stock-sobrestock-eyg.csv";a.click();
}

/* =========================== arranque =========================== */
EYG.requireAuth(["finanzas","inventario"], perfil=>{
  document.body.innerHTML = EYG.layout(perfil, "stock",
    '<div id="app"><div class="loading"><div class="spinner"></div>Leyendo el stock desde Odoo…<div class="prog" id="prog"></div></div></div>',
    "Stock y Sobrestock");
  const sc=document.createElement("div"); sc.className="scrim"; sc.id="scrim"; sc.onclick=cerrar; document.body.appendChild(sc);
  const dr=document.createElement("div"); dr.className="drawer"; dr.id="drawer"; document.body.appendChild(dr);
  cargar();
});
</script>
</body>
</html>
