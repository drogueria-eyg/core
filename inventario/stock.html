<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock, Compras y Reposición · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<style>
  /* colores de rotación / urgencia (específicos del módulo) */
  :root{
    --green:#1E7D46; --greenbg:#E4F5E9; --lime:#6E9B1E; --limebg:#EEF6DD;
    --yel:#B7791F; --yelbg:#FBF3D9; --org:#C4602A; --orgbg:#FBE3D4; --red:#8A1F1C; --redbg:#F7D2D0;
    --compra:#C9A227;
  }

  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--teal-deep);font-weight:800;margin:28px 0 12px;display:flex;align-items:center;gap:9px}
  h2.sec:before{content:"";width:5px;height:16px;background:var(--teal);border-radius:3px}
  h2.sec .hint{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--gris2)}

  /* ---------- Tarjeta de salud (patrón reutilizable) ---------- */
  .health{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:8px}
  .health .hh{display:flex;gap:22px;padding:20px 22px;flex-wrap:wrap;align-items:center}
  .ring{--p:0;--c:var(--green);width:118px;height:118px;border-radius:50%;flex:none;
    background:conic-gradient(var(--c) calc(var(--p)*1%), var(--line) 0);display:grid;place-items:center;position:relative}
  .ring:before{content:"";position:absolute;inset:11px;background:var(--surface);border-radius:50%}
  .ring .in{position:relative;text-align:center;line-height:1}
  .ring .in b{font-size:34px;font-weight:800;letter-spacing:-1px}
  .ring .in span{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gris);margin-top:3px}
  .hstate{flex:1;min-width:220px}
  .hstate .lab{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal-med)}
  .hstate .big{font-size:22px;font-weight:800;margin:3px 0 4px}
  .hstate .big.g{color:var(--green)}.hstate .big.y{color:var(--org)}.hstate .big.r{color:var(--red)}
  .hstate p{font-size:13px;color:var(--gris);line-height:1.5}
  .spark{flex:none;width:280px;max-width:100%}
  .spark .st{font-size:11px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:flex;justify-content:space-between}
  .spark .leg{font-size:11px;color:var(--gris);margin-top:5px;display:flex;gap:14px}
  .spark .leg i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:3px;margin-right:5px}
  .chartwrap{cursor:pointer;position:relative;border-radius:8px;transition:background .12s}
  .chartwrap:hover{background:#F6FBFA}
  .chartwrap .zoom{position:absolute;top:-1px;right:2px;font-size:10px;font-weight:800;color:var(--teal);opacity:.7}
  .chartwrap:hover .zoom{opacity:1}
  .spark .mticks{display:flex;justify-content:space-between;font-size:9.5px;color:var(--gris2);margin-top:3px;font-weight:600}
  /* modal gráfico (patrón reutilizable) */
  .scrim2{position:fixed;inset:0;background:rgba(6,65,62,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
  .scrim2.on{opacity:1;pointer-events:auto}
  .chartmodal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.98);opacity:0;pointer-events:none;transition:.2s;z-index:90;
    width:960px;max-width:96vw;max-height:92vh;background:var(--surface);border-radius:16px;box-shadow:0 20px 70px rgba(6,65,62,.3);display:flex;flex-direction:column;overflow:hidden}
  .chartmodal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .cm-head{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
  .cm-head h3{font-size:17px;font-weight:800}
  .cm-head .x{margin-left:auto;cursor:pointer;font-size:22px;color:var(--gris);line-height:1}
  .cm-bar{display:flex;align-items:center;gap:14px;padding:14px 22px 4px;flex-wrap:wrap}
  .cm-legend{display:flex;gap:16px;font-size:12.5px;color:var(--gris);margin-left:auto}
  .cm-legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
  .cm-chart{position:relative;padding:8px 18px 6px}
  .cm-chart svg{width:100%;display:block}
  #cmTip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.55;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  #cmTip b{font-weight:700}
  .cm-note{padding:2px 22px 18px;font-size:12.5px;color:var(--gris)}.cm-note b{color:var(--ink)}
  .hmetrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-top:1px solid var(--line);background:#FAFDFC}
  .hm{padding:13px 18px;border-right:1px solid var(--line)}
  .hm:last-child{border-right:0}
  .hm .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:700}
  .hm .v{font-size:20px;font-weight:800;letter-spacing:-.5px;margin-top:3px}
  .hm .bar{height:5px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
  .hm .bar i{display:block;height:100%;border-radius:3px}
  .hm.good .v{color:var(--green)} .hm.mid .v{color:var(--org)} .hm.bad .v{color:var(--red)}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:8px;margin:22px 0 6px;flex-wrap:wrap}
  .tab{font-family:inherit;font-size:14px;font-weight:700;padding:11px 18px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--gris);cursor:pointer;display:flex;align-items:center;gap:8px}
  .tab.on{background:var(--teal-deep);color:#fff;border-color:var(--teal-deep)}
  .tab .b{font-size:11px;font-weight:800;background:var(--redbg);color:var(--red);padding:1px 7px;border-radius:99px}
  .tab.on .b{background:rgba(255,255,255,.2);color:#fff}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:11px;margin-bottom:6px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow)}
  .kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:700;margin-bottom:6px}
  .kpi .n{font-size:24px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
  .kpi .d{font-size:12px;color:var(--gris);margin-top:3px}
  .kpi.warn{border-color:#F2C99B;background:#FFF8F1}.kpi.warn .n{color:var(--org)}
  .kpi.alert{border-color:#F0B3B0;background:#FDF3F2}.kpi.alert .n{color:var(--red)}
  .kpi.ok{border-color:#B7E0C4;background:#F3FBF6}.kpi.ok .n{color:var(--green)}
  .kpi.clk{cursor:pointer;transition:transform .1s,box-shadow .1s} .kpi.clk:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(6,65,62,.12)}
  .kpi .ver{font-size:11px;color:var(--teal);font-weight:700;margin-top:6px;display:flex;align-items:center;gap:3px}
  .hm.clk{cursor:pointer;transition:transform .1s} .hm.clk:hover{transform:translateY(-2px)}
  .rotbar div{cursor:pointer}

  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  /* política */
  .policy{display:flex;gap:22px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;box-shadow:var(--shadow);margin-bottom:14px}
  .pol{display:flex;flex-direction:column;gap:3px;min-width:190px;flex:1}
  .pol label{font-size:11.5px;font-weight:700;color:var(--gris);display:flex;justify-content:space-between}
  .pol label b{color:var(--teal-deep);font-size:13px}
  .pol input[type=range]{width:100%;accent-color:var(--teal)}
  .segs{display:flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .segs button{font-family:inherit;font-size:12px;font-weight:700;padding:8px 12px;border:0;background:var(--surface);color:var(--gris);cursor:pointer}
  .segs button.on{background:var(--teal);color:#fff}

  .flux{display:flex;align-items:flex-end;gap:9px;height:200px;padding-top:6px}
  .fcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
  .fbars{display:flex;gap:3px;align-items:flex-end;height:160px;width:100%;justify-content:center}
  .fbar{width:13px;border-radius:3px 3px 0 0}
  .fbar.v{background:var(--teal)}.fbar.c{background:var(--compra)}
  .fbar.c.over{background:var(--red)}
  .fcol .m{font-size:10px;color:var(--gris);font-weight:600}
  .fcol .fover{font-size:9px;color:var(--red);height:11px;line-height:11px}
  .fluxsum{display:flex;flex-wrap:wrap;gap:14px;align-items:stretch;margin-bottom:16px}
  .fs-item{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 14px;min-width:110px}
  .fs-item .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:700}
  .fs-item .n{font-size:19px;font-weight:800;margin-top:2px}
  .fs-verdict{flex:1;min-width:220px;border-radius:10px;padding:9px 14px;border:1px solid}
  .fs-verdict b{display:block;font-size:14px} .fs-verdict span{font-size:12px;line-height:1.4}
  .fs-verdict.good{background:var(--greenbg);border-color:#BFE0DC;color:#155C33}
  .fs-verdict.mid{background:#FBF3D9;border-color:#F2C99B;color:#7A3E17}
  .fs-verdict.bad{background:var(--redbg);border-color:#F0B3B0;color:#8A1F1C}
  .leg{display:flex;gap:18px;font-size:12px;color:var(--gris);margin-top:8px}
  .leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .note{background:#FFF8F1;border:1px solid #F2C99B;border-left:4px solid var(--org);border-radius:10px;padding:12px 14px;font-size:13px;margin-top:12px;color:#7A3E17}
  .note b{color:var(--org)}
  .note.info{background:#EEF6F5;border-color:#BFE0DC;border-left-color:var(--teal);color:#245C57}.note.info b{color:var(--teal-deep)}

  .rotbar{display:flex;height:36px;border-radius:9px;overflow:hidden;margin:2px 0 14px;border:1px solid var(--line)}
  .rotbar div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
  .rotleg{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px}
  .rl{display:flex;align-items:center;gap:9px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .rl .dot{width:12px;height:12px;border-radius:3px;flex:none}
  .rl .lb{flex:1}.rl .lb b{display:block}.rl .lb span{font-size:11px;color:var(--gris)}
  .rl .vv{font-weight:800;text-align:right}.rl .vv span{display:block;font-size:11px;color:var(--gris);font-weight:600}

  .lst{list-style:none}
  .li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .li:last-child{border:0}.li:hover{background:#F7FBFA}
  .li .nm{flex:1;min-width:0}
  .li .nm b{font-size:13px;display:block;white-space:normal;overflow-wrap:anywhere;line-height:1.3}
  .li .nm span{font-size:11.5px;color:var(--gris)}
  .li .amt{font-weight:800;font-size:13.5px;text-align:right;white-space:nowrap}
  .pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
  .pill.red{background:var(--redbg);color:var(--red)}.pill.org{background:var(--orgbg);color:var(--org)}
  .pill.yel{background:var(--yelbg);color:var(--yel)}.pill.green{background:var(--greenbg);color:var(--green)}.pill.gray{background:#EEF2F1;color:var(--gris)}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
  .search input{border:0;background:none;outline:none;font-family:inherit;font-size:14px;width:100%;color:var(--ink)}
  .search svg{width:17px;height:17px;color:var(--gris2);flex-shrink:0}
  select,.mini-btn{font-family:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px;color:var(--ink);cursor:pointer;font-weight:500}
  .chip{font-size:12px;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;color:var(--gris)}
  .chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .count-line{font-size:13px;color:var(--gris);margin:2px 0 10px}.count-line b{color:var(--ink)}

  .tablecard{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .thead,.row{display:grid;gap:12px;align-items:center;padding:10px 16px}
  .thead{background:#F0F6F5;border-bottom:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--gris);user-select:none}
  .thead>div{cursor:pointer}
  .row{border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s}
  .row:hover{background:#F7FBFA}.row:last-child{border-bottom:0}
  .thead>div,.row>div{min-width:0}
  .g-stock{grid-template-columns:2.4fr 1.1fr 0.75fr 1fr 0.8fr 0.8fr 0.9fr}
  .g-repo{grid-template-columns:2.4fr 1.4fr 0.8fr 0.8fr 0.9fr 0.9fr}
  .g-win{grid-template-columns:2.4fr 0.8fr 0.9fr 0.8fr 1fr 0.9fr}
  .tr-r{text-align:right;font-variant-numeric:tabular-nums}
  .cname{font-weight:700;font-size:13.5px;line-height:1.3;white-space:normal;overflow-wrap:anywhere}
  .cmeta{font-size:11.5px;color:var(--gris2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .num{font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px}
  .rbadge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px}
  .row.hot{background:#FFFBF3}.row.hot:hover{background:#FFF6E8}

  /* proveedores */
  .prov{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .provcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 17px;cursor:pointer;transition:transform .1s,box-shadow .1s;border-left:4px solid var(--teal)}
  .provcard:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(6,65,62,.12)}
  .provcard.u-quiebre{border-left-color:var(--red)}.provcard.u-urgente{border-left-color:var(--org)}.provcard.u-semana{border-left-color:var(--yel)}
  .provcard .pn{font-weight:800;font-size:15px;line-height:1.25;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .provcard .pc{font-size:12px;color:var(--gris)}
  .provcard .pr{display:flex;justify-content:space-between;align-items:flex-end;margin-top:13px}
  .provcard .pr .est{font-size:22px;font-weight:800;letter-spacing:-.5px}
  .provcard .pr .est span{font-size:12px;color:var(--gris);font-weight:600;display:block}
  .provcard .go{font-size:12px;font-weight:700;color:var(--teal);white-space:nowrap}

  .loading,.empty{text-align:center;padding:70px 20px;color:var(--gris)}
  .prog{font-size:12.5px;color:var(--gris2);margin-top:8px}
  .errbox{background:#FBE4E3;border:1px solid #F3B5B2;color:#8A2E2B;padding:16px;border-radius:12px;font-size:14px}

  .scrim{position:fixed;inset:0;background:rgba(6,65,62,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:520px;max-width:96vw;background:var(--surface);z-index:70;box-shadow:-8px 0 40px rgba(6,65,62,.18);transform:translateX(100%);transition:transform .24s ease;display:flex;flex-direction:column}
  .drawer.on{transform:none}
  .dhead{padding:20px 22px;border-bottom:1px solid var(--line);background:var(--teal-deep);color:#fff}
  .dhead .x{float:right;cursor:pointer;opacity:.85;font-size:22px;line-height:1}
  .dhead h2{font-size:17px;font-weight:800;padding-right:24px;line-height:1.3}
  .dhead .deuda{margin-top:8px;font-size:24px;font-weight:800}
  .dhead .badges{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}
  .dbody{padding:20px 22px;overflow-y:auto;flex:1}
  .dsec{margin-bottom:22px}
  .dsec h4{font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--teal-med);margin-bottom:10px}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .kv .k{color:var(--gris)} .kv .v{font-weight:600;text-align:right}
  .msgbox{width:100%;font-family:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:10px;padding:12px;min-height:110px;resize:vertical;color:var(--ink);line-height:1.5}
  .wa-send{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--teal);color:#fff;border:0;border-radius:10px;padding:13px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;text-decoration:none}
  .wa-send.ghost{background:var(--surface);color:var(--teal-deep);border:1px solid var(--teal)}
  .wa-send:disabled{opacity:.55;cursor:default}

  /* order builder */
  .ord{display:grid;grid-template-columns:1fr 78px 96px;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .ord .on{font-size:12.5px;font-weight:600;line-height:1.3;min-width:0}
  .ord .on span{display:block;font-size:11px;color:var(--gris)}
  .ord input.q{width:100%;font-family:inherit;font-size:14px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:7px 4px;font-weight:700;color:var(--ink)}
  .ord .lt{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}
  .ordfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:2px solid var(--line);font-size:15px}
  .ordfoot b{font-size:20px;font-weight:800}
  .okbox{background:var(--greenbg);border:1px solid #B7E0C4;color:#155C33;padding:13px 15px;border-radius:10px;font-size:13.5px;margin-top:12px;line-height:1.5}
  .okbox b{color:var(--green)}
  /* cargar compra */
  .cinput{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;color:var(--ink)}
  .cpick{border:1px solid var(--line);border-radius:9px;margin-top:5px;max-height:210px;overflow:auto}
  .cpick .r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 11px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--line)}
  .cpick .r:last-child{border-bottom:0} .cpick .r:hover{background:var(--bg)}
  .cpick .r .rp{color:var(--gris2);font-size:11.5px;white-space:nowrap}
  .cchip{display:inline-flex;align-items:center;gap:8px;background:var(--agua);color:var(--teal-deep);font-weight:700;font-size:13px;border-radius:20px;padding:6px 12px}
  .cchip b{cursor:pointer;font-size:15px;line-height:1}
  .cstep{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--gris);margin:2px 0 14px}
  .cstep .s{display:flex;align-items:center;gap:6px} .cstep .s .d{width:20px;height:20px;border-radius:50%;background:var(--line);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px}
  .cstep .s.on .d{background:var(--teal)} .cstep .s.done .d{background:var(--green)} .cstep .s.on{color:var(--ink);font-weight:700}
  .cstep .ln{flex:1;height:2px;background:var(--line);min-width:12px}
  .cprice{width:92px;font-family:inherit;font-size:13px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-weight:700;color:var(--ink)}
  /* multi-proveedor */

<script>
const rpc=(m,me,a,k)=>EYG.rpc(m,me,a,k);
const money=EYG.money, esc=EYG.esc;
const PROVEEDOR_T=2634; // compra informal: se excluye del flujo formal de compras
const fmtM=n=>"$"+(n/1e6).toFixed(1)+"M";
const fmtK=n=>Math.abs(n)>=1e6?fmtM(n):Math.abs(n)>=1000?"$"+Math.round(n/1000)+"k":money(n);
const fmtAxis=n=>{const a=Math.abs(n);return a>=1e6?"$"+(a/1e6).toFixed(a>=1e7?0:1)+"M":a>=1e3?"$"+Math.round(a/1e3)+"k":"$"+Math.round(a);};
const prog=t=>{const e=document.getElementById("prog");if(e)e.textContent=t;};

const HOY=new Date(); HOY.setHours(0,0,0,0);
const iso=d=>d.toISOString().slice(0,10);
const MESES_ES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
function familia(categ){ if(!categ) return "Sin categoría"; const p=categ[1].split("/").map(s=>s.trim()).filter(s=>s.toUpperCase()!=="ALL"); return p[0]||"Sin categoría"; }
function mesesHasta(f){ if(!f) return null; const d=new Date(f.slice(0,10)); return (d-HOY)/(1000*3600*24*30.44); }
const cleanName=n=>(n||"").replace(/@$/,"").replace(/@\s+\d+T?$/,"").trim();

/* Duración legible: años / meses / semanas / días según la magnitud (nada de "0,4 meses").
   fmtDur = versión larga (para textos), fmtDurC = compacta (para badges angostos). */
function fmtDur(m){
  if(m==null || m>=900) return "—";
  const neg=m<0; m=Math.abs(m);
  let s;
  if(m>=24) s=Math.round(m/12)+" años";
  else if(m>=2) s=Math.round(m)+" meses";
  else if(m>=0.92) s="1 mes";
  else { const semF=m*4.345;
    if(semF>=1.5) s=Math.round(semF)+" semanas";
    else if(semF>=0.75) s="1 semana";
    else { const d=Math.max(1,Math.round(m*30.44)); s=d+(d>1?" días":" día"); } }
  return neg?"hace "+s:s;
}
function fmtDurC(m){
  if(m==null || m>=900) return "—";
  const neg=m<0; m=Math.abs(m); let s;
  if(m>=24) s=Math.round(m/12)+"a";
  else if(m>=2) s=Math.round(m)+"m";
  else if(m>=0.92) s="1m";
  else { const semF=m*4.345;
    if(semF>=1.5) s=Math.round(semF)+" sem";
    else if(semF>=0.75) s="1 sem";
    else s=Math.max(1,Math.round(m*30.44))+"d"; }
  return neg?"-"+s:s;
}

let DATA=[], ARCH=[], VALROTO=[], LOTES={}, FLUJO={meses:[],ventas:[],compras:[]}, CAD={}, TOT=0, KPI={}, BUCKETS=[], FAMS=[];
let TAB="repo";
let pol={umbral:1.0, objetivo:2.0, fuente:"12m"};
let filtro={q:"",fam:"",chip:"",sortK:"val",dir:-1};
let rfiltro={q:"",soloRepo:true,sortK:"margenAnual",dir:-1};
let CAT={loaded:false,loading:false,rows:[],fams:[],labs:[],provs:[]};
let PRES={loaded:false,loading:false,rows:[],base:"",vista:"lista"};   // presupuestos (RFQ borrador/enviado de Odoo)
let COT={po:null,lines:[]};                              // presupuesto que se está cotizando
let cfil={q:"",fam:"",lab:"",prov:"",stock:"",sortK:"name",dir:1};
// laboratorio fabricante = segmento después de "ETICOS" en la categoría (los éticos se ordenan por lab)
function labDe(categ){ if(!categ) return ""; const p=categ[1].split("/").map(s=>s.trim());
  const i=p.findIndex(s=>s.toUpperCase()==="ETICOS"); return (i>=0&&p[i+1])?p[i+1]:""; }

const B_DEF=[["Sano","menos de 3 meses",0,3,"green"],["Elevado","3 a 6 meses",3,6,"lime"],["Alto","6 a 12 meses",6,12,"yel"],["Sobrestock","1 a 3 años",12,36,"org"],["Muerto / crítico","más de 3 años o sin venta",36,1e12,"red"]];

async function cargar(){
  try{
    const curIni=new Date(HOY.getFullYear(),HOY.getMonth(),1);
    const ini12=new Date(HOY.getFullYear(),HOY.getMonth()-12,1);
    const ini3=new Date(HOY.getFullYear(),HOY.getMonth()-3,1);

    prog("stock, ventas y compras…");
    const [stock, ventas, ventas3, so, po, cad] = await Promise.all([
      rpc("stock.quant","read_group",[[["location_id.usage","=","internal"],["quantity","!=",0]],["value:sum","quantity:sum"],["product_id"]],{lazy:false,limit:6000}),
      rpc("sale.order.line","read_group",[[["order_id.state","in",["sale","done"]],["order_id.date_order",">=",iso(ini12)]],["product_uom_qty:sum"],["product_id"]],{lazy:false,limit:9000}),
      rpc("sale.order.line","read_group",[[["order_id.state","in",["sale","done"]],["order_id.date_order",">=",iso(ini3)]],["product_uom_qty:sum"],["product_id"]],{lazy:false,limit:9000}),
      rpc("sale.order","read_group",[[["state","in",["sale","done"]],["date_order",">=",iso(ini12)],["date_order","<",iso(curIni)]],["amount_untaxed:sum"],["date_order:month"]],{lazy:false}),
      rpc("purchase.order","read_group",[[["state","in",["purchase","done"]],["date_order",">=",iso(ini12)],["date_order","<",iso(curIni)],["partner_id","!=",PROVEEDOR_T]],["amount_untaxed:sum"],["date_order:month"]],{lazy:false}),
      rpc("purchase.order","read_group",[[["state","in",["purchase","done"]],["date_order",">=",iso(ini12)],["partner_id","!=",PROVEEDOR_T]],["__count"],["partner_id"]],{lazy:false,limit:400}),
    ]);

    const V={}, F={}, V3={};
    for(const v of ventas){ if(v.product_id){ V[v.product_id[0]]=v.product_uom_qty||0; F[v.product_id[0]]=v.__count||0; } }
    for(const v of ventas3){ if(v.product_id) V3[v.product_id[0]]=v.product_uom_qty||0; }
    for(const g of cad){ if(g.partner_id) CAD[g.partner_id[0]]=g.__count||0; }
    const stockIds=stock.filter(s=>s.product_id).map(s=>s.product_id[0]);

    prog("categorías, proveedores y en camino…");
    const [meta, quantsLote] = await Promise.all([
      rpc("product.product","read",[stockIds,["categ_id","default_code","name","standard_price","list_price","incoming_qty","seller_ids","uom_po_id","active","qty_available","x_costo_manual","x_costo_manual_date"]]),
      rpc("stock.quant","search_read",[[["location_id.usage","=","internal"],["quantity",">",0],["lot_id","!=",false]],["product_id","lot_id","quantity","value"]],{limit:5000}),
    ]);
    const M={}; for(const m of meta) M[m.id]=m;

    prog("plazos y precios de proveedor…");
    const sellerIds=[...new Set(meta.flatMap(m=>m.seller_ids||[]))];
    const SI={};
    if(sellerIds.length){
      const sinfo=await rpc("product.supplierinfo","read",[sellerIds,["partner_id","price","min_qty","sequence"]]);
      for(const s of sinfo) SI[s.id]=s;
    }

    const lotIds=[...new Set(quantsLote.filter(q=>q.lot_id).map(q=>q.lot_id[0]))];
    prog("fechas de vencimiento…");
    const lotes = lotIds.length? await rpc("stock.lot","read",[lotIds,["expiration_date","name","product_id"]]) : [];
    const L={}; for(const l of lotes) L[l.id]=l;

    LOTES={}; const vencP={};
    for(const q of quantsLote){
      if(!q.product_id||!q.lot_id) continue;
      const pid=q.product_id[0], lot=L[q.lot_id[0]]||{};
      const mh=lot.expiration_date?mesesHasta(lot.expiration_date):null;
      (LOTES[pid]=LOTES[pid]||[]).push({lote:lot.name||"—",qty:q.quantity,value:q.value,exp:lot.expiration_date?lot.expiration_date.slice(0,10):null,mh});
      const vp=vencP[pid]||(vencP[pid]={venc:0,v6:0,v12:0,min:9999});
      if(mh!==null){ if(mh<vp.min)vp.min=mh; if(mh<0)vp.venc+=q.value; else if(mh<6)vp.v6+=q.value; else if(mh<12)vp.v12+=q.value; }
    }

    DATA=stock.filter(s=>s.product_id).map(s=>{
      const id=s.product_id[0], m=M[id]||{}, vp=vencP[id]||{};
      const ventaU=Math.round(V[id]||0), venta3=Math.round(V3[id]||0), freq=Math.round(F[id]||0);
      const cost=m.standard_price||0, qa=Math.round(m.qty_available||0);
      const qty=qa;                                 // cantidad = on-hand real (neto, como en Odoo)
      const val=Math.round(s.value||0);             // valor NETO de Odoo (suma de todos los quants) — sin inventar nada
      const valRoto = val<0;                        // Odoo lo valoriza en negativo (roto por stock negativo) → a "A revisar"
      const meses = ventaU>0 ? qty/(ventaU/12) : 999;
      const sellers=(m.seller_ids||[]).map(sid=>SI[sid]).filter(Boolean).sort((a,b)=>(a.sequence||0)-(b.sequence||0));
      const formal=sellers.find(x=>x.partner_id && x.partner_id[0]!==PROVEEDOR_T);
      const hayT=sellers.some(x=>x.partner_id && x.partner_id[0]===PROVEEDOR_T);
      // TODOS los proveedores del producto (dedup por partner, precio base = menor min_qty), en orden de preferencia de Odoo
      const provMap={};
      for(const x of sellers){ if(!x.partner_id||x.partner_id[0]===PROVEEDOR_T) continue; const pid=x.partner_id[0];
        if(!provMap[pid] || (x.min_qty||1)<provMap[pid].minQty) provMap[pid]={id:pid,name:x.partner_id[1],price:x.price>0?x.price:0,minQty:x.min_qty||1}; }
      const provs=Object.values(provMap);
      const costoU=cost, pvp=m.list_price||0;
      return {id, code:m.default_code||"", archivado:m.active===false, valRoto, qa, manualC:m.x_costo_manual||0, manualD:m.x_costo_manual_date||null, name:s.product_id[1], fam:familia(m.categ_id),
        categ:m.categ_id?m.categ_id[1]:"", val, qty, ventaU, venta3, freq,
        incoming:Math.round(m.incoming_qty||0),
        meses: meses>900?999:Math.round(meses*10)/10,
        costoU, pvp, margenU:Math.max(0,pvp-costoU), margenPct:pvp>0?(pvp-costoU)/pvp*100:null,
        margenAnual: (ventaU>0 && pvp>costoU) ? ventaU*(pvp-costoU) : 0,
        provId:formal?formal.partner_id[0]:null, provName:formal?formal.partner_id[1]:null,
        provPrice:formal&&formal.price>0?formal.price:0, minQty:formal?(formal.min_qty||1):1, provs,
        uomPo:m.uom_po_id?m.uom_po_id[0]:1, viaOtra:!formal&&hayT,
        min:(vp.min!==undefined&&vp.min<9999)?Math.round(vp.min*10)/10:null,
        valVenc:valRoto?0:Math.round(vp.venc||0), val6:valRoto?0:Math.round(vp.v6||0), val12:valRoto?0:Math.round(vp.v12||0)};
    });
    // apartar de las listas normales: archivados, valorización rota y los que no tienen stock real (on-hand<=0)
    const TODOS=DATA;
    ARCH=TODOS.filter(r=>r.archivado).sort((a,b)=>b.val-a.val);
    VALROTO=TODOS.filter(r=>!r.archivado && r.valRoto).sort((a,b)=>a.val-b.val);   // más negativo (peor) primero
    DATA=TODOS.filter(r=>!r.archivado && !r.valRoto && r.qty>0);                            // sólo productos con stock real
    // costo actual del motor para los rotos (para revalorizar): última compra vs costo manual, gana el más reciente
    if(VALROTO.length){ try{
      const pol2=await rpc("purchase.order.line","search_read",[[["product_id","in",VALROTO.map(r=>r.id)],["order_id.state","in",["purchase","done"]]]],{fields:["product_id","price_unit","date_planned"],order:"date_planned desc",limit:3000});
      const ucm={}; for(const l of pol2){ const pid=l.product_id[0]; if(!ucm[pid]) ucm[pid]={p:l.price_unit,f:(l.date_planned||"").slice(0,10)}; }
      for(const r of VALROTO){ const u=ucm[r.id]; r.ucC=u?u.p:0; r.ucF=u?u.f:null; r.costoMotor=costoMotorDe(r); }
    }catch(e){ for(const r of VALROTO) r.costoMotor=r.costoU; } }

    const monK=g=>g.__range?g.__range["date_order:month"].from:g["date_order:month"];
    const label=fromStr=>{const d=new Date(fromStr); return MESES_ES[d.getMonth()]+"'"+String(d.getFullYear()).slice(2);};
    const mapMon=arr=>{const o={};for(const g of arr){const f=monK(g);o[f]=g.amount_untaxed||0;}return o;};
    const soM=mapMon(so), poM=mapMon(po);
    const keys=[...new Set([...Object.keys(soM),...Object.keys(poM)])].sort();
    FLUJO={meses:keys.map(label), ventas:keys.map(k=>(soM[k]||0)/1e6), compras:keys.map(k=>(poM[k]||0)/1e6)};

    computar(); render();
  }catch(e){
    document.getElementById("app").innerHTML='<div class="errbox"><b>No pude leer los datos desde Odoo.</b><br>'+esc(e.message)+'</div>';
  }
}

// ---------- cálculo de reposición (depende de la política) ----------
function demandaMes(r){ return pol.fuente==="3m" ? r.venta3/3 : r.ventaU/12; }
function repo(r){
  const dm=demandaMes(r);
  const pos=r.qty+r.incoming;
  const cob = dm>0 ? pos/dm : (pos>0?999:0);
  const objU = dm*pol.objetivo;
  const necesita = dm>0 && cob<pol.umbral;
  let sug = necesita ? Math.max(0, Math.ceil(objU-pos)) : 0;
  if(sug>0 && sug<r.minQty) sug=r.minQty;
  const precio = r.provPrice>0?r.provPrice:r.costoU;
  const urg = pos<=0?"quiebre":cob<0.5?"urgente":cob<1?"semana":"reponer";
  return {dm, pos, cob:cob>900?999:Math.round(cob*10)/10, necesita, sug, precio, costoLinea:sug*precio, urg};
}
const URG_ORD={quiebre:0,urgente:1,semana:2,reponer:3};
const URG_COL={quiebre:"red",urgente:"org",semana:"yel",reponer:"green"};
const URG_LBL={quiebre:"Quiebre",urgente:"Urgente",semana:"Esta semana",reponer:"Reponer"};

function computar(){
  TOT=DATA.reduce((a,r)=>a+r.val,0);
  BUCKETS=B_DEF.map(([lbl,sub,lo,hi,col])=>{const sel=DATA.filter(r=>r.meses>=lo&&r.meses<hi);return{lbl,sub,col,n:sel.length,val:sel.reduce((a,r)=>a+r.val,0)};});
  const muerto=DATA.filter(r=>r.ventaU===0).reduce((a,r)=>a+r.val,0);
  let exceso3=0; for(const r of DATA){ if(r.ventaU>0){const ideal=(r.ventaU/12)*3, cu=r.val/r.qty; if(r.qty>ideal) exceso3+=(r.qty-ideal)*cu;}}
  const vencido=DATA.reduce((a,r)=>a+(r.valVenc||0),0);
  const v6=DATA.reduce((a,r)=>a+(r.val6||0),0);
  let riesgo=0; for(const r of DATA){ if(r.min!==null && r.meses>0 && r.min<r.meses) riesgo+=(r.valVenc+r.val6); }
  const sobre=BUCKETS[3].val+BUCKETS[4].val;
  KPI={inv:TOT, sobre, sobrePct:sobre/TOT*100, inmov:exceso3+muerto, muerto, vencido, v6, riesgo};
  FAMS=[...new Set(DATA.map(r=>r.fam))].sort();
}

function repoData(){
  const rows=DATA.map(r=>({r, rp:repo(r)}));
  const necesita=rows.filter(x=>x.rp.necesita);
  const conDem=DATA.filter(r=>demandaMes(r)>0).length;
  const quiebres=DATA.filter(r=>{const rp=repo(r); return rp.dm>0 && rp.pos<=0;}).length;
  const byProv={};
  for(const x of necesita){
    if(!x.r.provId){ continue; }
    const g=byProv[x.r.provId]||(byProv[x.r.provId]={id:x.r.provId,name:x.r.provName,items:[],valor:0,urg:"reponer"});
    g.items.push(x); g.valor+=x.rp.costoLinea;
    if(URG_ORD[x.rp.urg]<URG_ORD[g.urg]) g.urg=x.rp.urg;
  }
  const provs=Object.values(byProv).sort((a,b)=>(URG_ORD[a.urg]-URG_ORD[b.urg])||(b.valor-a.valor));
  const otra=necesita.filter(x=>!x.r.provId && x.r.viaOtra);
  const sinProv=necesita.filter(x=>!x.r.provId && !x.r.viaOtra);
  const valorCompra=necesita.filter(x=>x.r.provId).reduce((a,x)=>a+x.rp.costoLinea,0);
  return {rows,necesita,conDem,quiebres,provs,otra,sinProv,valorCompra};
}

// ---------- salud del abastecimiento ----------
function salud(rd){
  const conDem=rd.conDem||1;
  const quiebrePct=rd.quiebres/conDem*100;
  const reponerPct=rd.necesita.length/conDem*100;
  const sobrePct=KPI.sobrePct;
  const vencPct=KPI.inv>0?KPI.riesgo/KPI.inv*100:0;
  let score=100;
  score-=Math.min(35,quiebrePct*1.4);
  score-=Math.min(28,Math.max(0,sobrePct-15)*1.0);
  score-=Math.min(20,vencPct*2.2);
  score-=Math.min(12,Math.max(0,reponerPct-12)*0.4);
  score=Math.max(0,Math.min(100,Math.round(score)));
  const st = score>=80?["g","Buena","El abastecimiento está sano: pocos quiebres y la plata bien puesta."]
    : score>=60?["y","Con atención","Hay puntos para corregir: mirá quiebres, sobrestock o vencimientos."]
    : ["r","Crítica","Varias señales en rojo. Priorizá reponer ganadores y liberar sobrestock."];
  return {score,st,quiebrePct,reponerPct,sobrePct,vencPct};
}

async function fetchDiario(){

    rpc("purchase.order","read_group",[[["state","in",["purchase","done"]],["date_order",">=",iso(ini)],["partner_id","!=",PROVEEDOR_T]],["amount_untaxed:sum"],["date_order:day"]],{lazy:false,limit:3000}),
  ]);
  const key=g=>(g.__range&&g.__range["date_order:day"])?g.__range["date_order:day"].from.slice(0,10):null;
  const V={},C={}; let min=iso(HOY);

const pad2=n=>String(n).padStart(2,"0");
function aggregar(gran){
  const {V,C,min}=DIARIO;
  const start=new Date(min+"T00:00:00"), end=new Date(HOY);
  const out=[];
  if(gran==="dia"){
    for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
      const k=`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
      out.push({lab:`${pad2(d.getDate())}/${pad2(d.getMonth()+1)}`, sub:`${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`, v:V[k]||0, c:C[k]||0});
    }
  } else if(gran==="semana"){
    const b={};
    const lunes=dt=>{const x=new Date(dt);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);x.setHours(0,0,0,0);return x;};
    for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
      const k=`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
      const mk=lunes(d), kk=`${mk.getFullYear()}-${pad2(mk.getMonth()+1)}-${pad2(mk.getDate())}`;
      const o=b[kk]||(b[kk]={mk,v:0,c:0}); o.v+=V[k]||0; o.c+=C[k]||0;
    }
    Object.values(b).sort((a,b)=>a.mk-b.mk).forEach(o=>{const mk=o.mk;
      out.push({lab:`${pad2(mk.getDate())}/${pad2(mk.getMonth()+1)}`, sub:`semana del ${pad2(mk.getDate())}/${pad2(mk.getMonth()+1)}/${mk.getFullYear()}`, v:o.v, c:o.c});});
  } else {
    const b={};
    for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
      const k=`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
      const mk=`${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
      const o=b[mk]||(b[mk]={y:d.getFullYear(),m:d.getMonth(),v:0,c:0}); o.v+=V[k]||0; o.c+=C[k]||0;
    }
    Object.keys(b).sort().forEach(mk=>{const o=b[mk];
      out.push({lab:`${MESES_ES[o.m]}'${String(o.y).slice(2)}`, sub:`${MESES_ES[o.m]} ${o.y}`, v:o.v, c:o.c});});
  }
  return out;
}
function chartSVG(data){

  const X=i=>padL+(n===1?plotW/2:i*plotW/(n-1));
  const Y=v=>padT+plotH-v/mx*plotH;
  let grid="",ylab=""; const GL=4;
  for(let g=0;g<=GL;g++){const yy=(padT+plotH-g/GL*plotH).toFixed(1), val=mx*g/GL;
    grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`;
    ylab+=`<text x="${padL-8}" y="${(+yy+4)}" text-anchor="end" font-size="11" fill="var(--gris2)">${fmtAxis(val)}</text>`;}
  const step=Math.max(1,Math.ceil(n/11)); let xlab="";

  const area=`${X(0).toFixed(1)},${(padT+plotH).toFixed(1)} ${data.map((d,i)=>X(i).toFixed(1)+","+Y(d.v).toFixed(1)).join(" ")} ${X(n-1).toFixed(1)},${(padT+plotH).toFixed(1)}`;
  GRAF.geom={W,H,padL,padR,padT,padB,plotW,plotH,mx,n};
  return `<svg id="cmSvg" viewBox="0 0 ${W} ${H}">

  </svg>`;
}

// costo actual del motor (como Costos y Rentabilidad): gana el más reciente entre costo manual y última compra; si no, standard_price
function costoMotorDe(r){

// Revalorizar un producto con el ASISTENTE NATIVO de Odoo (stock.valuation.layer.revaluation): lleva el valor a
// cantidad on-hand × costo actual. Verificado: no toca la contabilidad (todo el catálogo es valorización manual_periodic).
async function accionRevalorizar(id){
  const r=VALROTO.find(x=>x.id===id); if(!r) return;
  if(!(r.qty>0)){ alert("Este producto no tiene stock positivo para revalorizar. Primero regularizá la cantidad (Poner en 0 / Destruir / Archivar)."); return; }
  const costo=r.costoMotor||r.costoU||0;
  if(!(costo>0)){ alert("No hay un costo definido para este producto (ni manual, ni última compra, ni costo Odoo). Cargale el costo primero en Costos y Rentabilidad."); return; }
  const objetivo=Math.round(r.qty*costo);
  if(!confirm(`Revalorizar "${cleanName(r.name)}" con la herramienta oficial de Odoo:\n\n• Valor de hoy en Odoo:  ${money(r.val)}   (roto)\n• Va a quedar:  ${money(objetivo)}   (= ${r.qty} u × ${money(costo)} costo actual)\n\nNo toca la contabilidad. ¿Confirmás?`)) return;
  try{
    const wiz=await rpc("stock.valuation.layer.revaluation","create",[{product_id:id, company_id:1, added_value:0, reason:"Revalorización desde EyG Core — corregir stock negativo histórico"}]);
    const w=(await rpc("stock.valuation.layer.revaluation","read",[[wiz],["current_value_svl","current_quantity_svl"]]))[0];
    const added=Math.round((((w.current_quantity_svl>0?w.current_quantity_svl:r.qty)*costo) - (w.current_value_svl||0))*100)/100;
    await rpc("stock.valuation.layer.revaluation","write",[[wiz],{added_value:added}]);
    await rpc("stock.valuation.layer.revaluation","action_validate_revaluation",[[wiz]]);
    toast("✓ Revalorizado a "+money(objetivo)); await cargar();
  }catch(e){ alert("No se pudo revalorizar: "+(e.message||e)); }
}
// recomendación de qué hacer con un producto de valorización rota
function sugerenciaRoto(r){
  const costo=r.costoMotor||r.costoU||0, obj=Math.round(r.qty*costo);
  if(r.qty>0 && costo>0) return {ico:"🔧", txt:`Revalorizá a <b>${money(obj)}</b> (${r.qty} u × ${money(costo)} costo actual).`};
  if(r.qty<0)  return {ico:"⚠️", txt:"Debe más de lo que tiene: ajustá el stock a lo real (Poner en 0) primero."};
  if(r.qty===0) return {ico:"📥", txt:"Sin stock real. Archivalo hasta la próxima compra."};
  return {ico:"📥", txt:"Sin costo cargado: archivalo, o cargá el costo en Costos y Rentabilidad."};
}

function copiarValRoto(){
  let t=`Productos con valorización rota (stock negativo) · Droguería EyG\nRegularizar en Odoo (revalorizar / ajustar stock):\n\n`;
  VALROTO.forEach(r=>t+=`• ${r.code?r.code+" — ":""}${cleanName(r.name)} · on-hand ${r.qty} u · Odoo valoriza ${money(r.val)}\n`);
  navigator.clipboard.writeText(t).then(()=>toast("📋 Lista copiada"));
}
async function _quantsInternos(pid, pos){
  return await rpc("stock.quant","search_read",[[["product_id","=",pid],["location_id.usage","=","internal"],["quantity",pos?">":"!=",0]]],{fields:["id","quantity","lot_id","location_id"]});
}
const odooProd=id=>"https://drogueriaeyg.odoo.com/web#id="+id+"&model=product.product&view_type=form";  // abre la ficha del producto en Odoo
async function accionCero(id){
  const r=ARCH.find(x=>x.id===id)||VALROTO.find(x=>x.id===id); if(!r) return;
  if(!confirm(`¿Poner en CERO el stock de "${cleanName(r.name)}" (${r.qty} u)?\n\nAjuste de inventario a 0 en Odoo. Es reversible.`)) return;
  try{
    const qs=await _quantsInternos(id,false);
    for(const q of qs){ await rpc("stock.quant","write",[[q.id],{inventory_quantity:0}]); await rpc("stock.quant","action_apply_inventory",[[q.id]]); }
    toast("✓ Stock puesto en 0"); await cargar();
  }catch(e){ alert("No se pudo poner en 0: "+(e.message||e)); }
}
async function accionDestruir(id){
  const r=ARCH.find(x=>x.id===id)||VALROTO.find(x=>x.id===id); if(!r) return;
  if(!confirm(`¿Marcar para DESTRUIR "${cleanName(r.name)}" (${r.qty} u)?\n\nCrea un scrap en Odoo: las unidades pasan a la ubicación Scrap y salen del stock. Queda registrado.`)) return;
  try{
    const qs=await _quantsInternos(id,true);
    for(const q of qs){ const vals={product_id:id,scrap_qty:q.quantity,location_id:q.location_id[0],scrap_location_id:16}; if(q.lot_id)vals.lot_id=q.lot_id[0];
      const sid=await rpc("stock.scrap","create",[vals]); await rpc("stock.scrap","action_validate",[[sid]]); }
    toast("✓ Enviado a destruir (scrap)"); await cargar();
  }catch(e){ alert("No se pudo destruir: "+(e.message||e)); }
}
async function accionDesarchivar(id){
  const r=ARCH.find(x=>x.id===id); if(!r) return;
  if(!confirm(`¿Desarchivar "${cleanName(r.name)}"?\n\nVuelve al catálogo activo y reaparece en las listas normales.`)) return;
  try{ await rpc("product.product","write",[[id],{active:true}]); toast("✓ Desarchivado"); await cargar(); }
  catch(e){ alert("No se pudo desarchivar: "+(e.message||e)); }
}
async function accionArchivar(id){
  const r=VALROTO.find(x=>x.id===id)||DATA.find(x=>x.id===id); if(!r) return;
  if(!confirm(`¿Archivar "${cleanName(r.name)}"?\n\nSe da de baja en Odoo (active=false): deja de aparecer en las listas y en "A revisar". Vuelve solo si hay un nuevo movimiento (ej. una compra) o si lo desarchivás.`)) return;
  try{ await rpc("product.product","write",[[id],{active:false}]); toast("✓ Archivado"); await cargar(); }
  catch(e){ alert("No se pudo archivar: "+(e.message||e)); }
}

const rotCls=m=>m<3?"green":m<6?"lime":m<12?"yel":m<36?"org":"red";
function visibles(){
  return DATA.filter(r=>{
    if(filtro.q){const q=filtro.q.toLowerCase(); if(!(r.name.toLowerCase().includes(q)||(r.code||"").toLowerCase().includes(q))) return false;}
    if(filtro.fam && r.fam!==filtro.fam) return false;
    if(filtro.chip==="sobre" && !(r.meses>12)) return false;
    if(filtro.chip==="muerto" && r.ventaU!==0) return false;
    if(filtro.chip==="venc" && !(r.valVenc>0||r.val6>0)) return false;
    return true;
  });
}
function renderTabla(){

      </div>
      ${cap.map(r=>{const c=rotCls(r.meses);
        const venc=r.min===null?'<span style="color:#CCD5D3">—</span>':r.min<0?'<b style="color:var(--red)">vencido</b>':(r.min<6?'<b style="color:var(--org)">'+fmtDurC(r.min)+'</b>':fmtDurC(r.min));
        return `<div class="row g-stock" onclick="abrirProd(${r.id})">
          <div><div class="cname">${esc(cleanName(r.name))}</div><div class="cmeta">${esc(r.code||"")}</div></div>

          <div class="tr-r">${venc}</div>
        </div>`}).join("")}
      ${d.length>300?`<div class="empty" style="padding:16px">…y ${d.length-300} más. Afiná el filtro o el buscador.</div>`:""}

}

async function loadCatalogo(){
  CAT.loading=true;
  try{
    const [prods, si] = await Promise.all([
      rpc("product.product","search_read",[[["active","=",true]]],{fields:["id","default_code","name","categ_id","product_tmpl_id","standard_price","list_price"],limit:100000}),
      rpc("product.supplierinfo","search_read",[[]],{fields:["product_tmpl_id","product_id","partner_id","price","min_qty"],limit:100000}),
    ]);
    const byTmpl={};
    for(const s of si){ if(!s.partner_id||s.partner_id[0]===PROVEEDOR_T) continue; const t=s.product_tmpl_id?s.product_tmpl_id[0]:null; if(!t) continue;
      const m=(byTmpl[t]=byTmpl[t]||{}), pid=s.partner_id[0], cur=m[pid];
      if(!cur || (s.min_qty||1)<cur.minQty) m[pid]={id:pid,name:s.partner_id[1],price:s.price>0?s.price:0,minQty:s.min_qty||1}; }
    const stQty={}; DATA.forEach(r=>stQty[r.id]=r.qty); ARCH.forEach(r=>stQty[r.id]=r.qty);
    CAT.rows=prods.map(p=>{ const t=p.product_tmpl_id?p.product_tmpl_id[0]:null;
      const provs=t&&byTmpl[t]?Object.values(byTmpl[t]):[];
      const costoU=p.standard_price||0, pvp=p.list_price||0;
      return {id:p.id, code:p.default_code||"", name:cleanName(p.name||""), fam:familia(p.categ_id), lab:labDe(p.categ_id),
        qty:Math.round(stQty[p.id]||0), costoU, pvp, margenPct:pvp>0?(pvp-costoU)/pvp*100:null,
        provs, provName:provs.length?provs[0].name:"", provId:provs.length?provs[0].id:null, provPrice:provs.length?provs[0].price:0}; });
    CAT.fams=[...new Set(CAT.rows.map(r=>r.fam).filter(Boolean))].sort();
    CAT.labs=[...new Set(CAT.rows.map(r=>r.lab).filter(Boolean))].sort();
    CAT.provs=[...new Set(CAT.rows.flatMap(r=>r.provs.map(p=>p.name)))].sort();
    CAT.loaded=true; CAT.loading=false;
    if(TAB==="cat") render();
  }catch(e){ CAT.loading=false; const c=document.getElementById("tabc"); if(c)c.innerHTML='<div class="errbox">No pude cargar el catálogo: '+esc(e.message)+'</div>'; }
}

      ${d.length>300?`<div class="empty" style="padding:16px">…y ${(d.length-300).toLocaleString("es-AR")} más. Afiná los filtros o el buscador.</div>`:""}

function sugerencia(r,rp){
  if(r.valVenc>0) return `Hay <b>${money(r.valVenc)}</b> ya vencido en depósito: dar de baja contablemente y retirar del stock.`;
  if(r.val6>0 && (r.min!==null && r.meses>r.min)) return `Vence en <b>${fmtDur(r.min)}</b> pero al ritmo actual tardaría <b>${fmtDur(r.meses)}</b> en venderse. Ofertar/liquidar ya.`;
  if(rp.pos<=0 && rp.dm>0) return `<b>Quiebre:</b> se vende (${r.freq}×/año) y no hay stock. ${r.provName?`Pedir ~<b>${rp.sug} u</b> a ${esc(r.provName)}.`:"Reponer cuanto antes."}`;
  if(rp.necesita) return `Quedan <b>${fmtDur(rp.cob)}</b> de cobertura. ${r.provName?`Conviene pedir ~<b>${rp.sug} u</b> a ${esc(r.provName)} (${money(rp.costoLinea)}) para cubrir ${pol.objetivo} meses.`:"Reponer para cubrir "+pol.objetivo+" meses."}`;
  if(r.ventaU===0) return `Sin ventas en el último año. Revisar si sigue vigente: liquidar, devolver o discontinuar.`;
  if(r.meses>12) return `Stock para <b>${fmtDur(r.meses)}</b>. Frenar la reposición hasta que baje.`;
  return `Rotación saludable. Mantener el nivel de reposición actual.`;
}
function cerrar(){document.getElementById("drawer").classList.remove("on");document.getElementById("scrim").classList.remove("on");}
