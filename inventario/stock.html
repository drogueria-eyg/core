// ====== DRILL-DOWN: tocar una métrica/tarjeta abre la lista de productos detrás ======
function liberableDe(r){ if(r.ventaU===0) return r.val; const ideal=(r.ventaU/12)*3, cu=r.qty>0?r.val/r.qty:0; return r.qty>ideal?Math.round((r.qty-ideal)*cu):0; }
const LISTAS={
  quiebre:{ t:"En quiebre hoy", d:"Se venden y hoy no hay stock. Reponé cuanto antes.",
    sel:()=>DATA.filter(r=>{const rp=repo(r);return rp.dm>0&&rp.pos<=0;}).sort((a,b)=>b.margenAnual-a.margenAnual),
    val:r=>r.margenAnual, meta:r=>`vende ${r.freq}×/año · ${r.provName||"sin proveedor"}` },
  reponer:{ t:"Productos a reponer", d:`Cobertura por debajo de ${pol.umbral} mes. Sugerido para cubrir ${pol.objetivo} meses.`,
    sel:()=>DATA.map(r=>({r,rp:repo(r)})).filter(x=>x.rp.necesita&&(x.r.provId||x.r.viaOtra)).sort((a,b)=>(URG_ORD[a.rp.urg]-URG_ORD[b.rp.urg])||(b.r.margenAnual-a.r.margenAnual)).map(x=>x.r),
    val:r=>repo(r).costoLinea, meta:r=>{const rp=repo(r);return `cobertura ${rp.cob>900?"—":fmtDur(rp.cob)} · pedir ${rp.sug} u · ${r.provName||"—"}`;} },
  sobre:{ t:"Sobrestock (+1 año)", d:"Ya hay stock para más de un año. Frená la compra hasta que baje.",
    sel:()=>DATA.filter(r=>r.meses>12).sort((a,b)=>b.val-a.val),
    val:r=>r.val, meta:r=>`${r.meses>900?"sin venta 12m":fmtDur(r.meses)+" de stock"} · ${r.qty} u` },
  riesgo:{ t:"En riesgo de tirar", d:"Vencido o por vencer antes de alcanzar a venderse. Ofertá o liquidá para recuperar algo.",
    sel:()=>DATA.filter(r=>r.valVenc>0||r.val6>0).sort((a,b)=>(b.valVenc+b.val6)-(a.valVenc+a.val6)),
    val:r=>r.valVenc+r.val6, meta:r=>r.valVenc>0?`vencido en depósito · ${money(r.valVenc)}`:`vence en ${fmtDur(r.min)}` },
  inventario:{ t:"Inventario valorizado", d:"Todo el stock activo, del que más plata tiene parada al que menos.",
    sel:()=>[...DATA].sort((a,b)=>b.val-a.val),
    val:r=>r.val, meta:r=>`${r.qty} u · ${r.meses>900?"sin venta":fmtDur(r.meses)+" de stock"}` },
  liberable:{ t:"Plata liberable", d:"Lo que sobra por encima de 3 meses de demanda, más lo que no vende. Se puede desinmovilizar.",
    sel:()=>DATA.map(r=>({r,l:liberableDe(r)})).filter(x=>x.l>0).sort((a,b)=>b.l-a.l).map(x=>x.r),
    val:r=>liberableDe(r), meta:r=>r.ventaU===0?`sin venta 12m · ${r.qty} u`:`${fmtDur(r.meses)} de stock · sobra sobre 3m` },
};
function abrirLista(tipo){
  const L=LISTAS[tipo]; if(!L) return;
  const rows=L.sel(); const tot=rows.reduce((a,r)=>a+(L.val(r)||0),0);
  const d=document.getElementById("drawer");
  d.innerHTML=`<div class="dhead"><span class="x" onclick="cerrar()">✕</span>
      <h2>${L.t}</h2><div class="deuda">${money(tot)}</div>
      <div class="badges"><span class="rbadge" style="background:rgba(255,255,255,.16);color:#fff">${rows.length} producto${rows.length===1?"":"s"}</span></div></div>
    <div class="dbody">
      ${L.d?`<p style="font-size:12.5px;color:var(--gris);margin:-4px 0 12px">${L.d}</p>`:""}
      <ul class="lst">${rows.slice(0,150).map(r=>`<li class="li" onclick="abrirProd(${r.id})">
        <div class="nm"><b>${esc(cleanName(r.name))}</b><span>${L.meta(r)}</span></div>
        <div class="amt">${money(L.val(r))}</div></li>`).join("")}</ul>
      ${rows.length>150?`<div class="count-line" style="margin-top:8px">…y ${rows.length-150} más. Usá el explorador para verlos todos.</div>`:""}
      ${!rows.length?'<div class="empty">Nada acá. 👌</div>':""}
    </div>`;
  d.classList.add("on"); document.getElementById("scrim").classList.add("on");
}
function abrirBucket(i){
  const b=B_DEF[i]; if(!b) return; const [lbl,sub,lo,hi]=b;
  const rows=DATA.filter(r=>r.meses>=lo&&r.meses<hi).sort((a,b)=>b.val-a.val);
  const tot=rows.reduce((a,r)=>a+r.val,0);
  const d=document.getElementById("drawer");
  d.innerHTML=`<div class="dhead"><span class="x" onclick="cerrar()">✕</span>
      <h2>Rotación: ${lbl}</h2><div class="deuda">${money(tot)}</div>
      <div class="badges"><span class="rbadge" style="background:rgba(255,255,255,.16);color:#fff">${sub} · ${rows.length} productos</span></div></div>
    <div class="dbody"><ul class="lst">${rows.slice(0,150).map(r=>`<li class="li" onclick="abrirProd(${r.id})">
        <div class="nm"><b>${esc(cleanName(r.name))}</b><span>${r.meses>900?"sin venta 12m":fmtDur(r.meses)+" de stock"} · ${r.qty} u</span></div>
        <div class="amt">${money(r.val)}</div></li>`).join("")}</ul>
      ${rows.length>150?`<div class="count-line" style="margin-top:8px">…y ${rows.length-150} más.</div>`:""}</div>`;
  d.classList.add("on"); document.getElementById("scrim").classList.add("on");
}

// ---------- drawer proveedor: armar pedido + borrador Odoo ----------
let PEDIDO={id:null,name:"",items:[]};
async function abrirProveedor(provId){
  const rd=repoData();
  const g=rd.provs.find(p=>p.id===provId); if(!g) return;
  PEDIDO={id:provId,name:g.name,items:g.items.map(x=>({r:x.r,rp:x.rp,qty:x.rp.sug}))};
  const cad=CAD[provId]?Math.round(365/CAD[provId]):null;
  const d=document.getElementById("drawer");
  d.innerHTML=`
    <div class="dhead"><span class="x" onclick="cerrar()">✕</span>
      <h2>Pedido a ${esc(g.name)}</h2>
      <div class="deuda" id="ordTot">${money(g.valor)}</div>
      <div class="badges"><span class="rbadge" style="background:rgba(255,255,255,.16);color:#fff">${g.items.length} productos</span>
        <span class="rbadge" style="background:rgba(255,255,255,.16);color:#fff" id="ordCad">${cad?`comprás ~cada ${cad}d`:"poco frecuente"}</span></div>
    </div>
    <div class="dbody">
      <div class="dsec"><h4>Cantidades sugeridas (editá lo que quieras)</h4>
        <div class="ord" style="border-bottom:2px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:700">
          <div>Producto</div><div style="text-align:center">Unid.</div><div style="text-align:right">Costo</div></div>
        ${PEDIDO.items.map((it,i)=>`<div class="ord">
          <div class="on">${esc(cleanName(it.r.name))}<span>cobertura ${it.rp.cob>900?"—":fmtDur(it.rp.cob)} · vende ${it.r.freq}×/año · <span class="pill ${URG_COL[it.rp.urg]}" style="font-size:9px">${URG_LBL[it.rp.urg]}</span></span></div>
          <input class="q" type="number" min="0" step="1" value="${it.qty}" oninput="ordQty(${i},this.value)">
          <div class="lt" id="lt${i}">${money(it.qty*it.rp.precio)}</div>
        </div>`).join("")}
        <div class="ordfoot"><span>Total estimado</span><b id="ordFoot">${money(g.valor)}</b></div>
      </div>
      <div id="ordMsg"></div>
      <button class="wa-send" id="btnOdoo" onclick="crearOC()">📝 Crear borrador en Odoo</button>
      <button class="wa-send ghost" onclick="copiarPedido()">Copiar pedido (texto)</button>
      <p style="font-size:11.5px;color:var(--gris);margin-top:10px;line-height:1.5">El borrador queda en Odoo <b>sin confirmar</b>: revisalo y confirmalo desde ahí. Precio estimado con el último costo conocido; se ajusta al confirmar.</p>
    </div>`;
  d.classList.add("on"); document.getElementById("scrim").classList.add("on");
}
function ordTotal(){return PEDIDO.items.reduce((a,it)=>a+it.qty*it.rp.precio,0);}
function ordQty(i,v){PEDIDO.items[i].qty=Math.max(0,parseInt(v)||0);
  document.getElementById("lt"+i).textContent=money(PEDIDO.items[i].qty*PEDIDO.items[i].rp.precio);
  const t=money(ordTotal());document.getElementById("ordTot").textContent=t;document.getElementById("ordFoot").textContent=t;}
function copiarPedido(){
  const its=PEDIDO.items.filter(it=>it.qty>0);
  let t=`Pedido · Droguería EyG\nProveedor: ${PEDIDO.name}\n\n`;
  its.forEach(it=>t+=`• ${it.qty} u — ${cleanName(it.r.name)}${it.r.code?" ("+it.r.code+")":""}\n`);
  t+=`\nTotal estimado: ${money(ordTotal())}`;
  navigator.clipboard.writeText(t).then(()=>toast("✓ Pedido copiado"));
}
async function crearOC(){
  const its=PEDIDO.items.filter(it=>it.qty>0);
  if(!its.length){toast("No hay unidades para pedir");return;}
  if(!confirm(`¿Crear un borrador de orden de compra a ${PEDIDO.name} con ${its.length} productos por ${money(ordTotal())}?\n\nQueda en borrador en Odoo, sin confirmar.`)) return;
  const btn=document.getElementById("btnOdoo"); btn.disabled=true; btn.textContent="Creando en Odoo…";
  try{
    const dp=new Date(HOY); dp.setDate(dp.getDate()+7);
    const lines=its.map(it=>[0,0,{product_id:it.r.id, product_qty:it.qty, price_unit:Math.round(it.rp.precio*100)/100,
      product_uom:it.r.uomPo, name:cleanName(it.r.name), date_planned:iso(dp)+" 00:00:00"}]);
    const poId=await rpc("purchase.order","create",[{partner_id:PEDIDO.id, order_line:lines}]);
    const info=await rpc("purchase.order","read",[[poId],["name"]]);
    const nm=info&&info[0]?info[0].name:("#"+poId);
    document.getElementById("ordMsg").innerHTML=`<div class="okbox">✓ Borrador <b>${esc(nm)}</b> creado en Odoo con ${its.length} líneas.<br>Revisalo y confirmalo en <b>Compras → Órdenes de compra</b>.</div>`;
    btn.textContent="✓ Borrador creado";
  }catch(e){
    document.getElementById("ordMsg").innerHTML=`<div class="errbox">No pude crear el borrador: ${esc(e.message)}</div>`;
    btn.disabled=false; btn.textContent="📝 Crear borrador en Odoo";
  }
}
// ---------- CARGAR COMPRA: arma una OC desde cero (proveedor + productos) → borrador Odoo → confirmar ----------
let COMPRA={prov:null,provName:"",items:[],poId:null,poName:"",estado:"draft"};
function nuevaCompra(){ COMPRA={prov:null,provName:"",items:[],poId:null,poName:"",estado:"draft"}; renderCompra(); document.getElementById("drawer").classList.add("on"); document.getElementById("scrim").classList.add("on"); }
const carritoActivo=()=>!!(COMPRA.prov && !COMPRA.poId);
// Pedir un producto a un proveedor puntual (desde el detalle o la lista de proveedores) → arranca o suma al carrito y abre el pedido
function compraDesdeProd(prodId,provId,provName){
  if(carritoActivo() && provId!==COMPRA.prov){
    if(!confirm(`Tenés un pedido abierto a ${COMPRA.provName}. Voy a agregar este producto a ESE pedido.\nPara pedirle a ${provName}, primero finalizá o descartá el pedido actual. ¿Continuar?`)) return;
  } else if(!carritoActivo()){
    COMPRA={prov:provId,provName,items:[],poId:null,poName:"",estado:"draft"};
  }
  agregarLinea(prodId); verCarrito();
}
// Suma un producto al carrito ACTIVO (deriva precio del proveedor del carrito y cantidad sugerida). No abre el drawer.
function agregarLinea(prodId){
  if(!carritoActivo()) return;
  const r=DATA.find(x=>x.id===prodId), cr=(!r&&CAT.loaded)?CAT.rows.find(x=>x.id===prodId):null, src=r||cr;
  if(!src){ toast("No encuentro ese producto"); return; }
  const name=r?cleanName(r.name):src.name;
  const ex=COMPRA.items.find(it=>it.id===prodId);
  if(ex){ ex.qty += r?Math.max(1,repo(r).sug||1):1; pintarCarrito(); toast(`＋ ${name} (${ex.qty} u)`); return; }
  const pm=(src.provs||[]).find(p=>p.id===COMPRA.prov);
  const precio = pm&&pm.price>0 ? pm.price : (src.costoU||src.provPrice||0);
  const qty = r?Math.max(1,repo(r).sug||r.minQty||1):1;
  COMPRA.items.push({id:prodId, code:src.code||"", name, qty, precio});
  pintarCarrito(); toast(`✓ Al pedido: ${name} (${COMPRA.items.length})`);
}
// Botón "Pedir" del catálogo cuando NO hay carrito: arranca uno con el proveedor de ese producto y sigue en el catálogo
function pedirCat(prodId){
  if(carritoActivo()){ agregarLinea(prodId); return; }
  const cr=CAT.loaded?CAT.rows.find(x=>x.id===prodId):null, r=DATA.find(x=>x.id===prodId), src=cr||r;
  if(!src||!src.provId){ toast("Ese producto no tiene proveedor cargado en Odoo. Empezá con 'Cargar una compra'."); return; }
  COMPRA={prov:src.provId, provName:src.provName, items:[], poId:null, poName:"", estado:"draft"};
  agregarLinea(prodId);
  renderCatTabla();  // los botones pasan de "Pedir" a "Agregar"
}
// Barra flotante del carrito: se mantiene entre pestañas y con el drawer cerrado
function pintarCarrito(){
  let bar=document.getElementById("cartbar");
  if(!carritoActivo()){ if(bar) bar.remove(); return; }
  if(!bar){ bar=document.createElement("div"); bar.id="cartbar"; bar.className="cartbar"; document.body.appendChild(bar); }
  const n=COMPRA.items.length, tot=COMPRA.items.reduce((a,it)=>a+it.qty*it.precio,0);
  bar.innerHTML=`<div class="ci">🛒<div><b>Pedido a ${esc(COMPRA.provName)}</b><span>${n} producto${n===1?"":"s"} · ${money(tot)}</span></div></div>
    <div class="ca">
      ${TAB!=="cat"?`<button class="cbtn ghost" onclick="seguirCatalogo()">Agregar del catálogo</button>`:""}
      <button class="cbtn" onclick="verCarrito()">Ver / finalizar →</button>
      <button class="cbtn x" onclick="cancelarCarrito()" title="Descartar pedido">✕</button>
    </div>`;
}
function verCarrito(){ renderCompra(); document.getElementById("drawer").classList.add("on"); document.getElementById("scrim").classList.add("on"); }
function seguirCatalogo(){ cerrar(); TAB="cat"; cfil.prov=COMPRA.provName||""; render(); }
function cancelarCarrito(){
  if(COMPRA.items.length && !confirm("¿Descartar este pedido sin terminar?")) return;
  COMPRA={prov:null,provName:"",items:[],poId:null,poName:"",estado:"draft"};
  pintarCarrito(); cerrar(); if(TAB==="cat") renderCatTabla();
}
function pasos(){
  const p = COMPRA.estado==="sent"?4 : COMPRA.poId?3 : COMPRA.prov?2 : 1;
  const S=(n,t)=>`<div class="s ${p>n?'done':p===n?'on':''}"><span class="d">${p>n?'✓':n}</span>${t}</div>`;
  return `<div class="cstep">${S(1,"Proveedor")}<span class="ln"></span>${S(2,"Productos")}<span class="ln"></span>${S(3,"Borrador")}<span class="ln"></span>${S(4,"Enviar")}</div>`;
}
function renderCompra(){
  const d=document.getElementById("drawer");
  const total=COMPRA.items.reduce((a,it)=>a+it.qty*it.precio,0);
  let body;
  if(!COMPRA.prov){
    body=`<div class="dsec"><h4>1 · ¿A qué proveedor le comprás?</h4>
      <input class="cinput" id="cprov" placeholder="Buscar proveedor por nombre o CUIT…" oninput="buscarProvCompra(this.value)" autocomplete="off">
      <div class="cpick" id="cpickProv" style="display:none"></div></div>`;
  } else if(!COMPRA.poId){
    body=`<div class="dsec"><h4>Proveedor</h4><span class="cchip">${esc(COMPRA.provName)} <b onclick="cambiarProv()" title="Cambiar">✕</b></span></div>
      <div class="dsec"><h4>2 · Agregá productos</h4>
        <input class="cinput" id="cprod" placeholder="Buscar producto por nombre o código…" oninput="buscarProdCompra(this.value)" autocomplete="off">
        <div class="cpick" id="cpickProd" style="display:none"></div>
        <button class="wa-send ghost" style="margin-top:10px" onclick="seguirCatalogo()">🔎 Buscar en el catálogo (más datos y filtros)</button>
        ${COMPRA.items.length?`<div style="margin-top:12px">
          <div class="ord" style="border-bottom:2px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:700"><div>Producto</div><div style="text-align:center">Unid.</div><div style="text-align:right">Precio u.</div></div>
          ${COMPRA.items.map((it,i)=>`<div class="ord">
            <div class="on">${esc(it.name)}<span>${it.code?esc(it.code)+" · ":""}<a onclick="quitarLineaCompra(${i})" style="color:var(--red);cursor:pointer">quitar</a></span></div>
            <input class="q" type="number" min="0" step="1" value="${it.qty}" oninput="compraQty(${i},this.value)">
            <input class="cprice" type="number" min="0" step="0.01" value="${it.precio}" oninput="compraPrecio(${i},this.value)"></div>`).join("")}
          <div class="ordfoot"><span>Total estimado</span><b id="cTot">${money(total)}</b></div>
        </div>`:'<div class="cmeta" style="margin-top:10px">Todavía no agregaste productos.</div>'}
      </div>
      <div id="cMsg"></div>
      <button class="wa-send" id="cBtn" onclick="crearOCCompra()" ${COMPRA.items.length?"":"disabled style=opacity:.5"}>📝 Crear borrador en Odoo</button>`;
  } else {
    body=`<div class="dsec"><h4>Proveedor</h4><span class="cchip">${esc(COMPRA.provName)}</span></div>
      <div class="okbox">✓ Borrador <b>${esc(COMPRA.poName)}</b> creado en Odoo con ${COMPRA.items.filter(i=>i.qty>0).length} líneas por ${money(total)}.</div>
      <div class="dsec" style="margin-top:14px"><h4>3 · Cotizalo con el proveedor</h4>
        <p style="font-size:13px;color:var(--gris);line-height:1.55">Quedó como presupuesto en Odoo. Ajustá precios y descuentos en vivo, mandáselo por WhatsApp o mail, y confirmalo cuando cierren.</p>
        <button class="wa-send" onclick="irACotizar(${COMPRA.poId})" style="background:var(--teal)">📄 Cotizar / negociar y enviar →</button></div>
      <button class="wa-send ghost" onclick="nuevaCompra()" style="margin-top:12px">➕ Otro presupuesto</button>`;
  }
  d.innerHTML=`<div class="dhead"><span class="x" onclick="cerrar()">✕</span><h2>Cargar una compra</h2>
      <div class="badges"><span class="rbadge" style="background:rgba(255,255,255,.16);color:#fff">${money(total)}</span></div></div>
    <div class="dbody">${pasos()}${body}</div>`;
  pintarCarrito();
}
let tProv=null;
function buscarProvCompra(q){ clearTimeout(tProv); tProv=setTimeout(async()=>{
  const box=document.getElementById("cpickProv"); if(!box) return;
  if(!q||q.length<2){ box.style.display="none"; return; }
  try{ const r=await rpc("res.partner","search_read",[["&",["supplier_rank",">",0],"|",["name","ilike",q],["vat","ilike",q]]],{fields:["id","name","vat"],limit:12});
    box.style.display="block";
    box.innerHTML=r.length?r.map(x=>`<div class="r" onclick="setProvCompra(${x.id},'${esc((x.name||'')).replace(/'/g,'')}')"><span>${esc(x.name)}</span><span class="rp">${esc(x.vat||'')}</span></div>`).join(""):'<div class="r">Sin proveedores. Probá otro nombre.</div>';
  }catch(e){ box.style.display="block"; box.innerHTML='<div class="r">Error: '+esc(e.message)+'</div>'; }
},260); }
function setProvCompra(id,name){ COMPRA.prov=id; COMPRA.provName=name; renderCompra(); }
function cambiarProv(){ COMPRA.prov=null; COMPRA.provName=""; renderCompra(); }
let tProd=null;
function buscarProdCompra(q){ clearTimeout(tProd); tProd=setTimeout(async()=>{
  const box=document.getElementById("cpickProd"); if(!box) return;
  if(!q||q.length<2){ box.style.display="none"; return; }
  try{ const r=await rpc("product.product","search_read",[["&",["active","=",true],"|",["name","ilike",q],["default_code","ilike",q]]],{fields:["id","default_code","name","product_tmpl_id","standard_price"],limit:14});
    box.style.display="block";
    box.innerHTML=r.length?r.map(x=>`<div class="r" onclick="addLineaCompra(${x.id},'${esc((x.default_code||'')).replace(/'/g,'')}','${esc((x.name||'')).replace(/'/g,'')}',${x.product_tmpl_id?x.product_tmpl_id[0]:0},${x.standard_price||0})"><span>${esc(x.name)}</span><span class="rp">${esc(x.default_code||'')}</span></div>`).join(""):'<div class="r">Sin resultados.</div>';
  }catch(e){ box.style.display="block"; box.innerHTML='<div class="r">Error: '+esc(e.message)+'</div>'; }
},260); }
async function addLineaCompra(id,code,name,tmpl,sp){
  if(COMPRA.items.some(it=>it.id===id)){ toast("Ese producto ya está en la lista"); return; }
  let precio=Math.round((sp||0)*100)/100;
  try{ const si=await rpc("product.supplierinfo","search_read",[["&",["partner_id","=",COMPRA.prov],"|",["product_tmpl_id","=",tmpl],["product_id","=",id]]],{fields:["price"],limit:1}); if(si.length&&si[0].price>0) precio=si[0].price; }catch(e){}
  COMPRA.items.push({id,code,name,qty:1,precio}); renderCompra();
}
function quitarLineaCompra(i){ COMPRA.items.splice(i,1); renderCompra(); }
function compraQty(i,v){ COMPRA.items[i].qty=Math.max(0,parseInt(v)||0); const t=COMPRA.items.reduce((a,it)=>a+it.qty*it.precio,0); const e=document.getElementById("cTot"); if(e)e.textContent=money(t); pintarCarrito(); }
function compraPrecio(i,v){ COMPRA.items[i].precio=Math.max(0,parseFloat(v)||0); const t=COMPRA.items.reduce((a,it)=>a+it.qty*it.precio,0); const e=document.getElementById("cTot"); if(e)e.textContent=money(t); pintarCarrito(); }
async function crearOCCompra(){
  const its=COMPRA.items.filter(it=>it.qty>0); if(!its.length){ toast("Agregá productos con cantidad"); return; }
  const total=its.reduce((a,it)=>a+it.qty*it.precio,0);
  if(!confirm(`¿Crear borrador de compra a ${COMPRA.provName} con ${its.length} productos por ${money(total)}?\n\nQueda en borrador en Odoo, sin confirmar.`)) return;
  const btn=document.getElementById("cBtn"); if(btn){btn.disabled=true;btn.textContent="Creando en Odoo…";}
  try{
    const dp=new Date(HOY); dp.setDate(dp.getDate()+7);
    const lines=its.map(it=>[0,0,{product_id:it.id, product_qty:it.qty, price_unit:Math.round(it.precio*100)/100, name:it.name, date_planned:iso(dp)+" 00:00:00"}]);
    const poId=await rpc("purchase.order","create",[{partner_id:COMPRA.prov, order_line:lines}]);
    const info=await rpc("purchase.order","read",[[poId],["name"]]);
    COMPRA.poId=poId; COMPRA.poName=(info&&info[0])?info[0].name:("#"+poId);
    renderCompra();
  }catch(e){ if(btn){btn.disabled=false;btn.textContent="📝 Crear borrador en Odoo";} const m=document.getElementById("cMsg"); if(m)m.innerHTML=`<div class="errbox">No pude crear el borrador: ${esc(e.message)}</div>`; }
}
async function confirmarOCCompra(){
  if(!confirm(`¿Confirmar la orden ${COMPRA.poName} y enviarla al proveedor?\n\nPasa de borrador a orden de compra confirmada en Odoo.`)) return;
  const btn=document.getElementById("cConf"); if(btn){btn.disabled=true;btn.textContent="Confirmando…";}
  try{ await rpc("purchase.order","button_confirm",[[COMPRA.poId]]); COMPRA.estado="sent"; renderCompra(); toast("✓ Orden confirmada y enviada"); }
  catch(e){ if(btn){btn.disabled=false;btn.textContent="✅ Confirmar y enviar al proveedor";} alert("No se pudo confirmar: "+(e.message||e)); }
}
function copiarCompra(){
  const its=COMPRA.items.filter(it=>it.qty>0);
  let t=`Pedido de compra · Droguería EyG\nProveedor: ${COMPRA.provName}\nOrden: ${COMPRA.poName}\n\n`;
  its.forEach(it=>t+=`• ${it.qty} u — ${it.name}${it.code?" ("+it.code+")":""} · ${money(it.precio)}/u\n`);
  t+=`\nTotal estimado: ${money(its.reduce((a,it)=>a+it.qty*it.precio,0))}`;
  navigator.clipboard.writeText(t).then(()=>toast("✓ Pedido copiado"));
}

// ===================== PRESUPUESTOS · RFQ de Odoo (cotizar / enviar / confirmar) =====================
function tabPres(){
  if(!PRES.loaded){ if(!PRES.loading) setTimeout(loadPres,10);
    return `<div class="pcard empty"><div class="spinner" style="margin:6px auto 14px"></div>Cargando los presupuestos abiertos…</div>`; }
  return `<div class="note info">Pedidos de <b>presupuesto abiertos</b> (borradores de Odoo). Abrí uno para <b>cotizar</b> con el proveedor —editás cantidades y precios en vivo—, <b>enviarlo</b> por WhatsApp o mail (preview de Odoo), y cuando cierran, <b>confirmarlo</b>. Al confirmar, la recepción de la mercadería se hace en el módulo de Depósito.</div>
    <div class="toolbar" style="margin-top:12px">
      <button class="wa-send" style="width:auto;margin:0;padding:10px 18px" onclick="nuevaCompra()">➕ Nuevo presupuesto</button>
      <button class="mini-btn" onclick="loadPres()">🔄 Actualizar</button>
      <div class="segs" style="margin-left:auto"><button class="${PRES.vista==='lista'?'on':''}" onclick="setPresVista('lista')">☰ Lista</button><button class="${PRES.vista==='grid'?'on':''}" onclick="setPresVista('grid')">▦ Tarjetas</button></div>
    </div>
    <div id="preslist" style="margin-top:14px"></div>`;
}
async function loadPres(){
  PRES.loading=true;
  try{
    if(!PRES.base){ try{ PRES.base=(await rpc("ir.config_parameter","get_param",["web.base.url"]))||"https://drogueriaeyg.odoo.com"; }catch(e){ PRES.base="https://drogueriaeyg.odoo.com"; } }
    PRES.rows=await rpc("purchase.order","search_read",[["|",["state","=","draft"],["state","=","sent"]]],
      {fields:["id","name","partner_id","amount_untaxed","date_order","state","order_line"],limit:200,order:"write_date desc"});
    PRES.loaded=true; PRES.loading=false;
    if(TAB==="pres") render(); else pintarCarrito();
  }catch(e){ PRES.loading=false; const c=document.getElementById("tabc"); if(c&&TAB==="pres")c.innerHTML='<div class="errbox">No pude cargar los presupuestos: '+esc(e.message)+'</div>'; }
}
function setPresVista(v){ PRES.vista=v; document.querySelectorAll("#tabc .segs button").forEach(b=>b.classList.toggle("on",b.textContent.toLowerCase().includes(v==="lista"?"lista":"tarjetas"))); renderPresList(); }
function renderPresList(){
  const el=document.getElementById("preslist"); if(!el) return;
  if(!PRES.rows.length){ el.innerHTML='<div class="pcard empty">No hay presupuestos abiertos. Armá uno con "Nuevo presupuesto" o desde el catálogo.</div>'; return; }
  const est=p=>p.state==="sent"?["Enviado","pe-sent"]:["Borrador","pe-draft"];
  if(PRES.vista==="grid"){
    el.innerHTML=`<div class="presgrid">${PRES.rows.map(p=>{ const n=(p.order_line||[]).length, e=est(p);
      return `<div class="prescard" onclick="abrirCotizar(${p.id})">
        <div class="ph"><span class="pnm">${esc(p.name)}</span><div style="display:flex;align-items:center;gap:7px"><span class="pest ${e[1]}">${e[0]}</span><button class="delx" onclick="eliminarPres(${p.id},'${p.state}',event)" title="Eliminar presupuesto">🗑</button></div></div>
        <div class="pprov">${esc(p.partner_id?p.partner_id[1]:"—")}</div>
        <div class="pfoot"><span>${n} producto${n===1?"":"s"}</span><b>${money(p.amount_untaxed||0)}</b></div>
      </div>`; }).join("")}</div>`;
    return;
  }
  el.innerHTML=`<div class="tablecard">
    <div class="prow prhead"><div>Presupuesto</div><div class="hide-sm">Proveedor</div><div class="tr-r">Prod.</div><div class="tr-r">Total</div><div class="tr-r">Estado</div></div>
    ${PRES.rows.map(p=>{ const n=(p.order_line||[]).length, e=est(p);
      return `<div class="prow" onclick="abrirCotizar(${p.id})">
        <div><div class="pn">${esc(p.name)}</div><div class="cmeta hide-lg">${esc(p.partner_id?p.partner_id[1]:"—")}</div></div>
        <div class="hide-sm cmeta">${esc(p.partner_id?p.partner_id[1]:"—")}</div>
        <div class="tr-r num" style="font-weight:500">${n}</div>
        <div class="tr-r num">${money(p.amount_untaxed||0)}</div>
        <div class="tr-r" style="display:flex;align-items:center;justify-content:flex-end;gap:7px"><span class="pest ${e[1]}">${e[0]}</span><button class="delx" onclick="eliminarPres(${p.id},'${p.state}',event)" title="Eliminar presupuesto">🗑</button></div>
      </div>`; }).join("")}
  </div>`;
}
async function abrirCotizar(poId){
  const d=document.getElementById("drawer");
  d.innerHTML=`<div class="dbody"><div class="loading" style="padding:50px"><div class="spinner"></div>Abriendo el presupuesto…</div></div>`;
  d.classList.add("on"); document.getElementById("scrim").classList.add("on");
  try{
    const [po]=await rpc("purchase.order","read",[[poId],["name","partner_id","state","amount_untaxed"]]);
    const lines=await rpc("purchase.order.line","search_read",[[["order_id","=",poId]]],{fields:["id","product_id","name","product_qty","price_unit"],order:"sequence,id"});
    try{ po._purl=await rpc("purchase.order","get_portal_url",[[poId]]); }catch(e){ po._purl="/my/purchase/"+poId; }
    try{ const pt=po.partner_id?await rpc("res.partner","read",[[po.partner_id[0]],["email"]]):null; po._email=pt&&pt[0]?pt[0].email:""; }catch(e){}
    COT={po,lines}; renderCot();
  }catch(e){ d.innerHTML=`<div class="dbody"><div class="errbox" style="margin:16px">No pude abrir el presupuesto: ${esc(e.message)}</div></div>`; }
}
function cotTotal(){ return COT.lines.reduce((a,l)=>a+(l.product_qty*l.price_unit),0); }
function cotLink(){ return (PRES.base||"https://drogueriaeyg.odoo.com").replace(/\/$/,"")+(COT.po._purl||("/my/purchase/"+COT.po.id)); }
function renderCot(){
  const d=document.getElementById("drawer"); const p=COT.po; const est=p.state==="sent"?"Enviado":"Borrador";
  d.innerHTML=`<div class="dhead"><span class="x" onclick="cerrar()">✕</span>
      <h2>${esc(p.name)}</h2><div class="deuda" id="cotTot">${money(cotTotal())}</div>
      <div class="badges"><span class="rbadge" style="background:rgba(255,255,255,.16);color:#fff">${esc(p.partner_id?p.partner_id[1]:"")}</span>
        <span class="rbadge" style="background:rgba(255,255,255,.16);color:#fff">${est} · ${COT.lines.length} líneas</span></div></div>
    <div class="dbody">
      <div class="dsec"><h4>Cotización · editá cantidad y precio con el proveedor</h4>
        <div class="cotrow cothead"><div>Producto</div><div>Cant.</div><div>Precio u.</div><div>Subtotal</div></div>
        ${COT.lines.length?COT.lines.map((l,i)=>`<div class="cotrow">
          <div class="cn">${esc(l.product_id?cleanName(l.product_id[1]):l.name)}<span><a onclick="cotQuitar(${i})" style="color:var(--red);cursor:pointer">quitar</a></span></div>
          <input class="q" type="number" min="0" step="1" value="${l.product_qty}" onchange="cotQty(${i},this.value)">
          <input class="cprice" type="number" min="0" step="0.01" value="${l.price_unit}" onchange="cotPrecio(${i},this.value)">
          <div class="cst" id="cotst${i}">${money(l.product_qty*l.price_unit)}</div>
        </div>`).join(""):'<div class="cmeta">Sin líneas. Agregá productos abajo.</div>'}
        <div class="ordfoot"><span>Total (neto sin IVA)</span><b id="cotFoot">${money(cotTotal())}</b></div>
      </div>
      <div class="dsec"><h4>Agregar producto</h4>
        <input class="cinput" id="cotBuscar" placeholder="Buscar producto por nombre o código…" oninput="cotBuscarProd(this.value)" autocomplete="off">
        <div class="cpick" id="cotPick" style="display:none"></div></div>
      <div class="dsec"><h4>Enviar al proveedor</h4>
        <p style="font-size:12.5px;color:var(--gris);margin-bottom:8px">Se abre la vista de Odoo con el presupuesto (preview).</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="cbtn" style="background:var(--wa)" onclick="cotWhatsApp()">🟢 WhatsApp</button>
          <button class="cbtn ghost" style="background:#eef6f5;color:var(--teal-deep)" onclick="cotMail()">✉️ Mail</button>
          <button class="cbtn ghost" style="background:#eef6f5;color:var(--teal-deep)" onclick="cotCopiarLink()">🔗 Copiar link</button>
        </div></div>
      <button class="wa-send" onclick="cotConfirmar()">✅ Confirmar pedido</button>
      <p style="font-size:11.5px;color:var(--gris);margin-top:8px;line-height:1.55">Al confirmar pasa a orden de compra. La <b>recepción</b> (lote, vencimiento, control) se hará en el <b>módulo de Depósito</b> — se ancla acá cuando esté. · <a onclick="cotCancelar()" style="color:var(--red);cursor:pointer">Cancelar</a> · <a onclick="eliminarPres(COT.po.id,COT.po.state)" style="color:var(--red);cursor:pointer">🗑 Eliminar</a></p>
    </div>`;
}
function cotPintarTot(i){ const l=COT.lines[i]; const st=document.getElementById("cotst"+i); if(st)st.textContent=money(l.product_qty*l.price_unit);
  const t=money(cotTotal()); ["cotTot","cotFoot"].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=t;}); }
async function cotQty(i,v){ const q=Math.max(0,parseFloat(v)||0); COT.lines[i].product_qty=q; cotPintarTot(i);
  try{ await rpc("purchase.order.line","write",[[COT.lines[i].id],{product_qty:q}]); }catch(e){ toast("No se guardó la cantidad: "+e.message); } }
async function cotPrecio(i,v){ const pr=Math.max(0,parseFloat(v)||0); COT.lines[i].price_unit=pr; cotPintarTot(i);
  try{ await rpc("purchase.order.line","write",[[COT.lines[i].id],{price_unit:pr}]); }catch(e){ toast("No se guardó el precio: "+e.message); } }
async function cotQuitar(i){ const l=COT.lines[i]; if(!confirm(`¿Quitar "${l.product_id?cleanName(l.product_id[1]):l.name}" del presupuesto?`)) return;
  try{ await rpc("purchase.order.line","unlink",[[l.id]]); COT.lines.splice(i,1); renderCot(); toast("Quitado"); }catch(e){ alert("No se pudo quitar: "+(e.message||e)); } }
let tCot=null;
function cotBuscarProd(q){ clearTimeout(tCot); tCot=setTimeout(async()=>{ const box=document.getElementById("cotPick"); if(!box)return;
  if(!q||q.length<2){box.style.display="none";return;}
  try{ const r=await rpc("product.product","search_read",[["&",["active","=",true],"|",["name","ilike",q],["default_code","ilike",q]]],{fields:["id","default_code","name","standard_price"],limit:14});
    box.style.display="block"; box.innerHTML=r.length?r.map(x=>`<div class="r" onclick="cotAddProd(${x.id},'${esc((x.name||'')).replace(/'/g,'')}',${x.standard_price||0})"><span>${esc(x.name)}</span><span class="rp">${esc(x.default_code||'')}</span></div>`).join(""):'<div class="r">Sin resultados.</div>';
  }catch(e){ box.style.display="block"; box.innerHTML='<div class="r">Error</div>'; } },260); }
async function cotAddProd(id,name,sp){
  if(COT.lines.some(l=>l.product_id&&l.product_id[0]===id)){ toast("Ya está en el presupuesto"); return; }
  try{ await rpc("purchase.order","write",[[COT.po.id],{order_line:[[0,0,{product_id:id,product_qty:1,price_unit:sp||0,name}]]}]);
    COT.lines=await rpc("purchase.order.line","search_read",[[["order_id","=",COT.po.id]]],{fields:["id","product_id","name","product_qty","price_unit"],order:"sequence,id"});
    renderCot(); toast("✓ Agregado al presupuesto");
  }catch(e){ alert("No se pudo agregar: "+(e.message||e)); } }
function cotCopiarLink(){ navigator.clipboard.writeText(cotLink()).then(()=>toast("🔗 Link copiado")); }
function cotWhatsApp(){ const t=`Hola, te paso el presupuesto de Droguería EyG (${COT.po.name}): ${cotLink()}`; window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank"); }
function cotMail(){ const to=COT.po._email||""; const sub=`Presupuesto Droguería EyG · ${COT.po.name}`; const body=`Hola,\n\nTe paso el presupuesto para tu revisión:\n${cotLink()}\n\nSaludos.`; window.location.href=`mailto:${to}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`; }
async function cotConfirmar(){ if(!confirm(`¿Confirmar ${COT.po.name}? Pasa a orden de compra confirmada en Odoo.\nLa recepción de la mercadería se hará en Depósito.`)) return;
  try{ await rpc("purchase.order","button_confirm",[[COT.po.id]]); toast("✓ Pedido confirmado"); cerrar(); PRES.loaded=false; loadPres(); }
  catch(e){ alert("No se pudo confirmar: "+(e.message||e)); } }
async function cotCancelar(){ if(!confirm(`¿Cancelar el presupuesto ${COT.po.name}?`)) return;
  try{ await rpc("purchase.order","button_cancel",[[COT.po.id]]); toast("Presupuesto cancelado"); cerrar(); PRES.loaded=false; loadPres(); }
  catch(e){ alert("No se pudo cancelar: "+(e.message||e)); } }
// Eliminar un presupuesto. Odoo EXIGE cancelar antes de borrar (incluso borradores): cancelamos y borramos en un paso.
async function eliminarPres(id, state, ev){ if(ev){ ev.stopPropagation(); }
  const p=PRES.rows.find(x=>x.id===id); const nm=p?p.name:("#"+id);
  const msg = state==="draft"
    ? `¿Eliminar el presupuesto "${nm}"? Se borra de Odoo y no se puede deshacer.`
    : `"${nm}" está ${state==="sent"?"enviado":"confirmado"}. Para borrarlo primero se cancela. ¿Cancelar y eliminar?`;
  if(!confirm(msg)) return;
  try{
    await rpc("purchase.order","button_cancel",[[id]]);   // Odoo pide cancelar antes de eliminar, sea cual sea el estado
    await rpc("purchase.order","unlink",[[id]]);
    PRES.rows=PRES.rows.filter(x=>x.id!==id); toast("🗑 Presupuesto eliminado"); renderPresList();
    if(document.getElementById("drawer").classList.contains("on")&&COT.po&&COT.po.id===id) cerrar();
  }catch(e){ alert("No se pudo eliminar: "+(e.message||e)); }
}
// Desde el carrito recién creado → abrir a cotizar (limpia el carrito y marca la lista para refrescar)
function irACotizar(id){ COMPRA={prov:null,provName:"",items:[],poId:null,poName:"",estado:"draft"}; pintarCarrito(); PRES.loaded=false; abrirCotizar(id); }

let toastT; function toast(msg){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";
  t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.25)";document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity="1";clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity="0",1800);}

// ---------- resumen y CSV (stock) ----------
function textoResumen(){
  const hoyStr=HOY.toLocaleDateString("es-AR",{day:"2-digit",month:"long",year:"numeric"});
  const frenar=[...DATA].filter(r=>r.meses>12).sort((a,b)=>b.val-a.val);
  const frenarM=frenar.reduce((a,r)=>a+r.val,0);
  const vencido=DATA.filter(r=>r.valVenc>0).sort((a,b)=>b.valVenc-a.valVenc);
  const porVencer=DATA.filter(r=>r.val6>0 && r.min!==null && r.meses>r.min).sort((a,b)=>b.val6-a.val6);
  let t=`📦 *Droguería EyG · Stock ${hoyStr}*\n\n`;
  t+=`💰 Inventario: ${fmtM(KPI.inv)}\n🐢 Sobrestock (+1 año): ${fmtM(KPI.sobre)} (${KPI.sobrePct.toFixed(0)}%)\n🗑️ En riesgo de tirar: ${fmtM(KPI.riesgo)}\n\n`;
  t+=`🛑 *Frenar compra (top): ${money(frenarM)} en ${frenar.length} productos*\n`;
  frenar.slice(0,8).forEach(r=>t+=`• ${cleanName(r.name)} — ${money(r.val)} (${r.meses>900?"sin venta":r.meses+"m stock"})\n`);
  if(vencido.length){t+=`\n⚠️ *Ya vencido en depósito: ${money(KPI.vencido)}*\n`;
    vencido.slice(0,6).forEach(r=>t+=`• ${cleanName(r.name)} — ${money(r.valVenc)}\n`);}
  if(porVencer.length){t+=`\n🔥 *Por vencer <6m sin alcanzar a venderse:*\n`;
    porVencer.slice(0,6).forEach(r=>t+=`• ${cleanName(r.name)} — ${money(r.val6)} (vence ${r.min}m)\n`);}
  return t;
}
function verResumen(){
  const d=document.getElementById("drawer");
  d.innerHTML=`<div class="dhead"><span class="x" onclick="cerrar()">✕</span><h2>📋 Resumen de stock</h2>
      <div class="badges"><span class="rbadge" style="background:rgba(255,255,255,.16);color:#fff">para pegar en WhatsApp</span></div></div>
    <div class="dbody">
      <textarea class="msgbox" id="resTxt" style="min-height:360px;white-space:pre-wrap">${esc(textoResumen())}</textarea>
      <button class="wa-send" onclick="copiarRes(this)">Copiar resumen</button>
    </div>`;
  d.classList.add("on"); document.getElementById("scrim").classList.add("on");
}
function copiarRes(btn){const ta=document.getElementById("resTxt");navigator.clipboard.writeText(ta.value).then(()=>{btn.textContent="✓ Copiado";setTimeout(()=>btn.textContent="Copiar resumen",1800);}).catch(()=>{ta.select();document.execCommand("copy");btn.textContent="✓ Copiado";});}

function exportarCSV(){
  const d=[...visibles()].sort((a,b)=>b.val-a.val);
  const head=["Codigo","Producto","Familia","ValorStock","Unidades","VentaAnual","VecesVendido","MesesStock","Proveedor","VenceEnMeses","YaVencido"];
  const rows=d.map(r=>[r.code,cleanName(r.name),r.fam,Math.round(r.val),r.qty,r.ventaU,r.freq,r.meses>900?"":r.meses,r.provName||"",r.min??"",Math.round(r.valVenc)].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","));
  const csv="﻿"+[head.join(","),...rows].join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="stock-eyg.csv";a.click();
}
