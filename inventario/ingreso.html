<script>
/* ===== Ingreso de mercadería =====
   Lo que hasta ahora se hacía en Odoo, hecho para el depósito: escanear la caja,
   cargar lote y vencimiento, confirmar.

   Y algo que Odoo no hace: cuando se escanea un código que NO está en ningún
   producto, se ofrece pegárselo a una línea de esta misma recepción. Ahí es
   donde el catálogo se completa solo, con el trabajo que ya se hace — hoy
   faltan 478 códigos de barras de los 711 productos con stock.

   Lo mismo con la FOTO: el único momento en que alguien tiene la caja en la
   mano es cuando la recibe. Si el producto no tiene foto, se saca acá y queda
   en su ficha de Odoo (image_1920) para siempre — la misma que usan la web,
   Cargar venta y el asistente de WhatsApp.

   El buscador y la ficha de producto NO están duplicados acá: salen de
   assets/producto.js, la misma pieza que usa la Ficha de producto. */

const TIPO_RECIBIDOS = 1;              /* stock.picking.type "Recibidos" (almacén EYG) */
let PERFIL = null;
/* `editando` = las líneas YA completas que se dejaron abiertas a mano. Una línea
   completa se pliega sola en un renglón verde; si se toca "Editar" vuelve a
   abrirse y queda acá para que el siguiente repintado no la cierre de nuevo. */
/* `linea` = la pantalla de UN producto (la que abre el escáner). `abiertos` =
   qué bloques de la ficha están desplegados ahí adentro. */
/* `tab` = qué se está mirando en la lista: lo que falta recibir o lo que YA se
   recibió. Las hechas son 2.553 desde diciembre de 2024, así que no se traen
   todas de golpe: se piden de a 50 y hay buscador contra Odoo. */
const PAGINA = 50;
const ST = { vista:"lista", pend:[], rec:null, cargando:true,
             foco:null, desconocido:null, guardando:false, editando:new Set(),
             linea:null, abiertos:new Set(), extra:null,
             tab:"pend", hechas:[], q:"", nHechas:null, hayMas:false, buscando:false };

const esc = s => EYG.esc(s);
const rpc = (m,me,a,k)=>EYG.rpc(m,me,a,Object.assign({context:{lang:"es_AR"}},k||{}));
let tToast;
function toast(msg, mal){
  let t = document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; document.body.appendChild(t); }
  t.className = "toast show"+(mal?" mal":""); t.textContent = msg;
  clearTimeout(tToast); tToast = setTimeout(()=>t.classList.remove("show"), mal?4500:2400);
}
function pintar(){
  const c = document.getElementById("cont");
  if(ST.vista === "producto")      c.innerHTML = vistaProducto();
  else if(ST.vista === "recepcion") c.innerHTML = vistaRecepcion();
  else                              c.innerHTML = vistaLista();
  if(ST.vista==="recepcion"){
    const i = document.getElementById("scan"); if(i) i.focus();
    if(ST.foco){ const n = document.getElementById("ln_"+ST.foco); if(n) n.scrollIntoView({block:"center",behavior:"smooth"}); }
  }
}
/* Al ENTRAR a la pantalla de un producto el cursor va directo a lo que hay que
   cargar: el lote si lo pide, si no la cantidad. Es a lo que se viene.
   Ojo: esto se llama sólo al entrar, NO en cada repintado. Si estuviera dentro
   de pintar(), al tocar "+ Otro lote" el cursor se volvería solo al primer
   campo y el lote nuevo quedaría sin escribir.
   El campo de escaneo queda arriba para saltar a otro producto sin volver. */
function focoDeCarga(){
  const m = lineaActual(); if(!m) return;
  setTimeout(function(){
    const i = document.getElementById(m.pideLote ? "lote_"+m.id+"_0" : "cant_"+m.id+"_0");
    if(i && !i.value) { i.focus(); if(i.select) i.select(); }
    else { const s = document.getElementById("scan"); if(s) s.focus(); }
  }, 90);
}

/* ============ FECHAS ============
   Odoo guarda los datetime en UTC. Las recepciones ya hechas tienen los
   vencimientos grabados como "2030-07-30 03:00:00" = medianoche de Argentina.
   Se respeta exactamente esa convención para no quedar un día corrido. */
function fechaAOdoo(d){ return d ? (d+" 03:00:00") : false; }
function fechaDeOdoo(s){ return s ? String(s).slice(0,10) : ""; }

/* ===================== LISTA DE RECEPCIONES ===================== */
const CAMPOS_PICK = ["id","name","partner_id","state","scheduled_date","date_done",
                     "origin","move_ids","return_id","backorder_id"];

/* El mismo buscador para las dos pestañas: número de recepción, proveedor o
   cliente, documento de origen (la orden de compra o el remito devuelto) y
   PRODUCTO. Lo de producto sólo se puede resolver del lado de Odoo, así que
   las dos listas buscan igual y no hay que explicar dos comportamientos. */
function dominioBusca(base, q){
  const dom = base.slice();
  q = String(q||"").trim();
  if(q) dom.push("|","|","|",
    ["name","ilike",q], ["partner_id","ilike",q],
    ["origin","ilike",q], ["move_ids.product_id","ilike",q]);
  return dom;
}

async function cargarPendientes(){
  ST.cargando = true; pintar();
  try{
    const [ps, n] = await Promise.all([
      rpc("stock.picking","search_read",
        [dominioBusca([["picking_type_id","=",TIPO_RECIBIDOS],["state","not in",["done","cancel"]]], ST.q),
         CAMPOS_PICK],
        {order:"scheduled_date desc", limit:100}),
      ST.nHechas == null
        ? rpc("stock.picking","search_count",[[["picking_type_id","=",TIPO_RECIBIDOS],["state","=","done"]]])
        : Promise.resolve(ST.nHechas),
    ]);
    ST.pend = ps || [];
    ST.nHechas = n;
  }catch(e){ ST.pend = []; toast(e.message, true); }
  ST.cargando = false; pintar();
  /* El "1 de 2" llega un instante después: la lista no espera por él. */
  await marcarPartes(ST.pend); pintar();
}

/* ---- las que YA se recibieron ----
   Son 2.553 y arrancan en diciembre de 2024: no entran en una pantalla ni
   conviene traerlas. Se piden de a 50, y el buscador va contra Odoo porque lo
   que se busca casi nunca está en las 50 que se trajeron. */
async function cargarHechas(mas){
  ST.buscando = true;
  if(!mas) ST.hechas = [];
  pintar();
  const dom = dominioBusca([["picking_type_id","=",TIPO_RECIBIDOS],["state","=","done"]], ST.q);
  let nuevas = [];
  try{
    nuevas = await rpc("stock.picking","search_read",[dom, CAMPOS_PICK],
      {order:"date_done desc", limit:PAGINA, offset: mas ? ST.hechas.length : 0}) || [];
    ST.hechas = mas ? ST.hechas.concat(nuevas) : nuevas;
    ST.hayMas = nuevas.length === PAGINA;
  }catch(e){ toast(e.message, true); ST.hayMas = false; }
  ST.buscando = false; pintar();
  await marcarPartes(nuevas); pintar();
}

function verTab(t){
  ST.tab = t; pintar();
  if(t === "hechas" && !ST.hechas.length && !ST.buscando) cargarHechas();
}
/* Buscar recarga la pestaña que se esté mirando. Va contra Odoo en las dos
   (no filtra lo ya traído) porque lo que se busca —sobre todo un producto—
   casi nunca está entre las filas que se bajaron. */
function correrBusqueda(){ return ST.tab === "hechas" ? cargarHechas() : cargarPendientes(); }
const buscarDeb = EYG.buscador(function(v){ ST.q = v; correrBusqueda(); }, 420);
function limpiarBusca(){ ST.q = ""; correrBusqueda(); }

/* ¿Es una devolución de un cliente, o una compra a un proveedor?
   No es lo mismo y hoy se mezclaban: de las 2.953 recepciones, 956 son
   devoluciones. Odoo lo marca en `return_id` (945), y las 11 más viejas sólo
   lo tienen en el texto del origen — se miran las dos cosas. */
function esDevolucion(p){
  return !!p.return_id || /^Devoluci[oó]n de/i.test(String(p.origin||""));
}

/* Un pedido puede entrar en dos veces: si falta mercadería, Odoo deja el resto
   pendiente en una recepción nueva (`backorder_id`). Todas comparten el mismo
   documento de origen, así que agrupando por ahí se puede decir "1 de 2".
   Sin esto aparecen dos WH/IN distintos de la misma orden y no se entiende. */
function parteDe(p){ return p.parte || ""; }

function filaRecepcion(p, hecha){
  const dev = esDevolucion(p);
  const cuando = hecha ? String(p.date_done||"").slice(0,10) : String(p.scheduled_date||"").slice(0,10);
  const quien = p.partner_id ? p.partner_id[1] : (dev ? "cliente sin identificar" : "sin proveedor");
  const parte = parteDe(p);
  const varias = parte && !/^1\/1$/.test(parte);
  /* La devolución trae el remito que se le había mandado al cliente; la compra,
     la orden de compra. En los dos casos es LA referencia para encontrarla. */
  const ref = dev ? String(p.origin||"").replace(/^Devoluci[oó]n de\s*/i,"") : (p.origin||"");
  return `<div class="ritem ${hecha?"hecha":"porrecibir"}${dev?" dev":""}" onclick="abrirRecepcion(${p.id})">
      <div class="mid">
        <div class="prov">${esc(quien)}</div>
        <div class="sub">
          <span class="cod">${esc(p.name)}</span>
          ${ref?`<span class="cod">${esc(ref)}</span>`:""}
          ${parte?`<span class="parte${varias?" varias":""}" title="${varias
            ? "Este pedido entró en varias veces: ésta es la parte "+parte
            : "El pedido entró completo en una sola recepción"}">${parte}</span>`:""}
          <span>${(p.move_ids||[]).length} producto(s)</span>
          <span>${hecha?"recibida el ":""}${esc(cuando)}</span>
        </div>
      </div>
      <span class="tipo ${dev?"dev":"compra"}">${dev?"devolución":"compra"}</span>
      ${hecha ? `<span class="pill stock">recibida</span><span class="go">Ver →</span>`
              : `<span class="pill ${p.state==="assigned"?"list":"esp"}">${p.state==="assigned"?"lista para recibir":esc(p.state)}</span>
                 <span class="go">Recibir →</span>`}
    </div>`;
}

/* Marca cada fila con su "parte i/n". Es UNA consulta para toda la página:
   se piden todas las recepciones que comparten documento de origen con alguna
   de las filas que se están mostrando, y se cuentan en orden de creación. */
async function marcarPartes(filas){
  const orgs = [...new Set((filas||[]).map(f=>f.origin).filter(Boolean))];
  if(!orgs.length) return;
  try{
    const todos = await rpc("stock.picking","search_read",
      [[["picking_type_id","=",TIPO_RECIBIDOS],["origin","in",orgs]], ["id","origin"]],
      {order:"id", limit:1000});
    const por = {};
    (todos||[]).forEach(p=>{ (por[p.origin] = por[p.origin] || []).push(p.id); });
    filas.forEach(f=>{
      const g = por[f.origin];
      if(g && g.length) f.parte = (g.indexOf(f.id)+1) + "/" + g.length;
    });
  }catch(e){ /* sin esto la lista se ve igual, sólo sin el "1 de 2" */ }
}

function vistaLista(){
  if(ST.cargando) return `<div class="cargando"><div class="spinner"></div>Buscando recepciones…</div>`;
  const hechas = ST.tab === "hechas";
  const filas  = hechas ? ST.hechas : ST.pend;

  const tabs = `<div class="tabs">
      <button class="tab ${hechas?"":"on"}" onclick="verTab('pend')">
        Por recibir <span class="n">${ST.pend.length}</span></button>
      <button class="tab ${hechas?"on":""}" onclick="verTab('hechas')">
        Ya recibidas <span class="n">${ST.nHechas==null?"…":ST.nHechas.toLocaleString("es-AR")}</span></button>
    </div>`;

  /* Un solo buscador para las dos pestañas. La referencia con la que se busca
     en el depósito es el PROVEEDOR — por eso va primero en el texto de ayuda y
     es lo más grande de cada fila. */
  const buscador = `<div class="busca">
      <div class="buscarow">
        <input id="qh" type="search" autocomplete="off" value="${esc(ST.q)}"
               placeholder="Proveedor, número de recepción, orden de compra… o un producto"
               oninput="buscarDeb(this.value)">
        ${ST.q?`<button class="btn sec" onclick="limpiarBusca()">Limpiar</button>`:""}
      </div>
      <div class="buscahint">También busca por <b>producto</b>: escribí el nombre y te muestra en qué
        recepciones entró.${ST.buscando?" <b>Buscando…</b>":""}</div>
    </div>`;

  /* Las devoluciones de clientes se separan de las compras. Son un tercio de
     todo (956 de 2.953) y no tienen nada que ver: una trae mercadería nueva de
     un proveedor, la otra vuelve de una farmacia. Mezcladas, la lista es un
     revoltijo; separadas, se encuentra. */
  const compras = filas.filter(p=>!esDevolucion(p));
  const devol   = filas.filter(esDevolucion);
  const grupo = (tit, arr, ico) => arr.length ? `<div class="seccion">
      <div class="sechead">${ico} ${tit} <span class="cnt">${arr.length}</span></div>
      <div class="rlist">${arr.map(p=>filaRecepcion(p,hechas)).join("")}</div>
    </div>` : "";

  let cuerpo;
  if(ST.buscando && !filas.length){
    cuerpo = `<div class="cargando"><div class="spinner"></div>Buscando…</div>`;
  }else if(!filas.length){
    cuerpo = ST.q
      ? `<div class="vacio">No encontré ninguna recepción con «${esc(ST.q)}».<br>
           Probá con el proveedor, el número (WH/IN/…), la orden de compra o el nombre de un producto.</div>`
      : (hechas ? `<div class="vacio">No hay recepciones confirmadas.</div>`
                : `<div class="vacio">No hay recepciones pendientes. Cuando Compras confirme una orden, aparece acá.</div>`);
  }else{
    cuerpo = grupo(hechas?"Compras recibidas":"Compras a proveedores", compras, "🛒") +
             grupo(hechas?"Devoluciones recibidas":"Devoluciones de clientes", devol, "↩️") +
             (hechas ? `<div class="masbtn">${ST.hayMas
                 ? `<button class="btn sec" onclick="cargarHechas(true)" ${ST.buscando?"disabled":""}>
                      ${ST.buscando?"Buscando…":"Ver 50 más"}</button>`
                 : `<span class="quieto">Eso es todo lo que hay para esta búsqueda.</span>`}</div>` : "");
  }

  const intro = hechas
    ? `<div class="intro">Todo lo que <b>ya entró al depósito</b>, desde la primera recepción (diciembre de 2024).
        Se abre de <b>sólo lectura</b>: se ve lo que entró de cada producto con su lote y su vencimiento.
        Aun así, desde adentro se le puede seguir cargando al producto la <b>foto</b>, el <b>código de barras</b>
        o lo que le falte.</div>`
    : `<div class="intro">Las órdenes de compra confirmadas que <b>todavía no entraron al depósito</b>.
        Abrí una, escaneá las cajas, cargá <b>lote y vencimiento</b>, y confirmala: recién ahí suma stock en Odoo.</div>`;

  const kpis = hechas ? "" : `<div class="kpis">
      <div class="kpi" title="Recepciones confirmadas por Compras que todavía no se recibieron"><div class="n">${ST.pend.length}</div><div class="l">Por recibir</div></div>
      <div class="kpi" title="Compras a proveedores esperando entrar"><div class="n">${compras.length}</div><div class="l">Compras</div></div>
      <div class="kpi" title="Mercadería que vuelve de un cliente"><div class="n">${devol.length}</div><div class="l">Devoluciones</div></div>
      <div class="kpi" title="Productos distintos esperando entrar"><div class="n">${filas.reduce((a,p)=>a+(p.move_ids||[]).length,0)}</div><div class="l">Productos</div></div>
    </div>`;

  return intro + tabs + buscador + kpis +
    (hechas ? "" : `<div style="margin-bottom:12px"><button class="btn sec" onclick="cargarPendientes()">🔄 Actualizar</button></div>`) +
    cuerpo;
}

/* ===================== ABRIR UNA RECEPCIÓN ===================== */
async function abrirRecepcion(pid){
  document.getElementById("cont").innerHTML = `<div class="cargando"><div class="spinner"></div>Abriendo la recepción…</div>`;
  try{
    /* LAS TRES DE UNA. Cada llamada al conector cuesta ~1,3 s de piso, traiga
       1 KB o 100 KB: lo que se paga es la ida y vuelta, no el tamaño. Estas
       tres sólo dependen del número de recepción, así que no hay ningún motivo
       para hacerlas en fila — así eran 4 s, ahora es una.
       El movimiento ya trae `product_tmpl_id`, así que TAMBIÉN se eliminó la
       consulta a product.product que había en el medio sólo para traducir la
       variante a su ficha. */
    const [pks, moves, mls] = await Promise.all([
      rpc("stock.picking","read",[[pid],
        ["id","name","partner_id","state","scheduled_date","date_done","origin","move_ids","location_id","location_dest_id"]]),
      rpc("stock.move","search_read",
        [[["picking_id","=",pid]],
         ["id","product_id","product_tmpl_id","product_uom_qty","quantity","picked","product_uom","state","move_line_ids","location_id","location_dest_id"]]),
      rpc("stock.move.line","search_read",
        [[["picking_id","=",pid]],["id","product_id","lot_name","lot_id","quantity","expiration_date","move_id"]]),
    ]);
    const pk = pks[0];

    /* La FICHA ENTERA de cada producto, de una sola vez.
       Antes se leían cuatro campos sueltos de product.product. Ahora se lee el
       product.template completo (los mismos CAMPOS_LEER de la Ficha) porque la
       pantalla de carga muestra todo el producto y avisa qué datos le faltan
       (categoría, categoría web, laboratorio, peso…). Son 8-30 productos por
       recepción: UNA consulta, no una por línea.
       `image_128` va en la misma lectura: son los mismos bytes que el navegador
       bajaba igual para la miniatura, y de paso dice quién no tiene foto.
       El seguimiento y el vencimiento son del producto: definen si la línea
       pide lote y fecha. Es el campo que estaba mal en el camisolín. */
    const tids = [...new Set(moves.map(m=>m.product_tmpl_id && m.product_tmpl_id[0]).filter(Boolean))];
    const tpls = tids.length ? await rpc("product.template","read",
      [tids, EYGP.CAMPOS_LEER.concat(["image_128"])]) : [];
    const porTmpl = {}; tpls.forEach(t=>porTmpl[t.id]=t);

    /* Los desplegables de la ficha se piden SIN esperarlos: hacen falta recién
       cuando se abre un producto, y esperarlos acá retrasaba la recepción
       entera. Cuando llegan, si hay un producto abierto, se repinta solo. */
    EYGP.catalogos().then(function(){
      if(ST.vista === "producto") pintar();
    }).catch(function(){});

    /* Una recepción ya confirmada se abre para MIRAR: no se le puede cambiar
       lo que entró (eso ya movió stock en Odoo). Lo que sí se sigue pudiendo
       hacer desde adentro es completarle datos al producto — foto, código de
       barras, categoría — que es para lo que Martina las quiere ver. */
    const hecha = pk.state === "done";

    ST.rec = {
      pk, hecha,
      moves: moves.map(m=>{
        const tid = m.product_tmpl_id ? m.product_tmpl_id[0] : null;
        const p = porTmpl[tid] || {};
        const mias = mls.filter(l=>l.move_id && l.move_id[0]===m.id);
        const pideLote = p.tracking==="lot" || p.tracking==="serial";
        return {
          id:m.id, prodId:m.product_id[0], nombre:m.product_id[1],
          tmplId: tid, t: p,                    /* t = la ficha completa del producto */
          barcode: p.barcode || "", codigo: p.default_code || "",
          foto: p.image_128 || "",              /* "" = este producto no tiene foto */
          demanda: m.product_uom_qty || 0, uomId: m.product_uom ? m.product_uom[0] : 1,
          locId: m.location_id?m.location_id[0]:false, locDest: m.location_dest_id?m.location_dest_id[0]:false,
          tracking: p.tracking||"none", pideLote, vence: !!p.use_expiration_date,
          /* ARRANCA EN CERO, a propósito.
             Odoo deja una línea por movimiento con la cantidad PEDIDA ya puesta
             y el vencimiento en "ahora". Eso no es lo que llegó: es lo que se
             había encargado. Aceptarlo a ciegas es cargar stock que quizá no
             entró — y además dejaba TODAS las líneas en el mismo estado, sin
             poder distinguir lo cargado de lo que falta.
             Quien recibe pone lo que contó; para el caso normal (vino todo)
             está el botón "Vino todo", que es un clic.
             Si ya había un lote cargado (avance guardado antes), eso SÍ se
             respeta y vuelve tal cual. */
          /* En una recepción YA HECHA no se arranca de cero: se muestra lo que
             realmente entró, tal cual quedó grabado. La regla de arrancar en
             cero es para lo que todavía se está recibiendo. */
          parts: mias.length ? mias.map(l=>{
            const cargada = hecha || !!(l.lot_id || l.lot_name);
            return { id:l.id, lote:l.lot_name || (l.lot_id?l.lot_id[1]:"") || "",
                     cant: cargada ? (l.quantity||0) : 0,
                     vto: cargada ? fechaDeOdoo(l.expiration_date) : "" };
          }) : [{id:null, lote:"", cant:0, vto:""}],
        };
      }),
    };
    ST.vista = "recepcion"; ST.foco = null; ST.desconocido = null; ST.editando = new Set();
    pintar();
  }catch(e){ toast(e.message, true); ST.vista="lista"; pintar(); }
}
function volver(){ ST.vista="lista"; ST.rec=null; ST.foco=null; ST.desconocido=null; ST.editando=new Set(); pintar(); }

/* ===================== ESCANEAR ===================== */
/* Un lector de códigos "tipea" el número y manda Enter: por eso se resuelve en
   el Enter y no mientras se escribe. */
function scanKey(ev){
  if(ev.key !== "Enter") return;
  ev.preventDefault();
  const v = ev.target.value.trim();
  ev.target.value = "";
  if(v) resolverCodigo(v);
}

/* UN MISMO PRODUCTO SE ESCRIBE DE VARIAS FORMAS. Comparar los textos tal cual
   dejaba afuera casos reales: el envase de IBUPROFENO KLONAL FORTE dice
   7795360000168, y ese mismo producto tiene en `gtins` 07795360000168 — el
   GTIN-14, que es el EAN-13 con un cero adelante, que es como lo manda
   AlfaBeta. Al escanear el de 14 la línea "no estaba" en su propia recepción.
     · los ceros de adelante no cambian el producto
     · el código interno de Alfabeta va con y sin el prefijo AB
     · `gtins` puede traer VARIOS códigos pegados sin separador, de a 14 */
function normCod(s){
  s = String(s||"").trim().toUpperCase();
  if(/^AB\d+$/.test(s)) s = s.slice(2);
  return s.replace(/^0+(?=[0-9])/, "");
}
function codigosDe(m){
  const l = [m.barcode, m.codigo];
  const g = String((m.t && m.t.gtins) || "").trim();
  if(/^[0-9]+$/.test(g) && g.length > 14){ for(let i=0;i<g.length;i+=14) l.push(g.slice(i,i+14)); }
  else if(g) l.push.apply(l, g.split(/[^0-9]+/));
  return l.filter(Boolean).map(normCod);
}

async function resolverCodigo(cod){
  const r = ST.rec;
  /* 1) ¿es un producto de ESTA recepción?
     Se abre DERECHO su pantalla de carga. Es lo que pidió el depósito: con una
     orden de 10 productos, buscar la línea a mano entre diez iguales es lo que
     hace lento el trabajo. Se dispara la pistola y aparece ese producto, con
     el cursor en el lote. */
  const n = normCod(cod);
  const linea = r.moves.find(m => codigosDe(m).indexOf(n) >= 0);
  if(linea){
    ST.desconocido = null;
    abrirProducto(linea.id);
    toast("✓ "+linea.nombre.slice(0,44));
    return;
  }
  /* 2) Si acá no apareció, se le pregunta a Odoo — que busca además por el
     GTIN de Alfabeta y por el código interno con prefijo. */
  toast("Buscando el código…");
  let p = null;
  try{ p = await EYGP.porCodigo(cod); }catch(e){}
  if(p){
    /* RED DE SEGURIDAD: si Odoo lo reconoció y ese producto SÍ es una línea de
       esta recepción, se abre igual. Nunca más "existe pero no está acá"
       teniendo la línea a la vista: alcanza con que coincida el producto. */
    const suya = r.moves.find(m => m.tmplId === p.id);
    if(suya){
      ST.desconocido = null;
      abrirProducto(suya.id);
      toast("✓ "+suya.nombre.slice(0,44));
      return;
    }
    ST.desconocido = null; ST.foco = null; pintar();
    toast("«"+String(p.name).slice(0,40)+"» existe, pero NO está en esta recepción.", true);
    return;
  }
  /* 3) no existe en ningún lado: es la oportunidad de completar el catálogo. */
  ST.desconocido = cod; ST.foco = null; pintar();
}

function panelDesconocido(){
  const cod = ST.desconocido;
  if(!cod) return "";
  return `<div class="desc">
    <h3>⚠️ Este código no está en ningún producto</h3>
    <div class="cd">${esc(cod)}</div>
    <div style="font-size:12.5px;color:var(--gris);line-height:1.55;margin-bottom:6px">
      Si la caja que tenés en la mano es uno de los productos de esta recepción, <b>tocalo acá abajo</b>:
      le queda pegado el código y la próxima vez se escanea solo. Así es como se completan
      los <b>478 productos con stock que hoy no tienen código de barras</b>.
    </div>
    ${ST.rec.moves.filter(m=>!m.barcode).map(m=>`<div class="opt" onclick="pegarCodigo(${m.id})">
        <span class="nm">${esc(m.nombre)}</span><span class="go">Es este →</span></div>`).join("")}
    ${ST.rec.moves.filter(m=>m.barcode).length?`<div style="font-size:11.5px;color:var(--gris2);margin-top:9px">
      Los otros productos de esta recepción ya tienen su código cargado y no figuran acá.</div>`:""}
    <div style="margin-top:12px;display:flex;gap:9px;flex-wrap:wrap">
      <a class="btn sec" href="producto.html" target="_blank" rel="noopener">Abrir la Ficha de producto ↗</a>
      <button class="btn sec" onclick="ST.desconocido=null;pintar()">Cancelar</button>
    </div>
  </div>`;
}

async function pegarCodigo(moveId){
  const m = ST.rec.moves.find(x=>x.id===moveId);
  const cod = ST.desconocido;
  if(!m || !cod) return;
  if(!confirm(`¿Guardar el código ${cod} en «${m.nombre}»?\n\nQueda cargado en la ficha del producto para siempre.`)) return;
  try{
    await rpc("product.template","write",[[m.tmplId],{barcode:cod}]);
    m.barcode = cod;
    if(m.t) m.t.barcode = cod;
    ST.desconocido = null;
    abrirProducto(m.id);                    /* igual que si lo hubiera reconocido */
    toast("Código guardado en el producto ✓");
  }catch(e){
    /* El código de barras es único en Odoo: si ya lo tiene otro producto, avisa. */
    toast("No se pudo guardar: "+e.message, true);
  }
}

/* ===================== LA FOTO =====================
   El único momento en que alguien tiene el producto en la mano es cuando lo
   recibe. Si no tiene foto, se saca acá: se achica en el navegador y va a
   `image_1920` del product.template — el mismo campo y la misma función que
   usa la Ficha de producto (EYGP.subirImagen). No se inventa otro lugar.

   El <input type=file> vive colgado del BODY y no del HTML de la pantalla:
   si estuviera adentro de #cont, un repintado mientras la cámara está abierta
   se lleva el elemento puesto y la foto elegida nunca llega. */
let INPFOTO = null, FOTO_MOVE = null;

function pedirFoto(moveId){
  const m = ST.rec && ST.rec.moves.find(x=>x.id===moveId); if(!m) return;
  if(!m.tmplId) return toast("No encuentro la ficha de este producto en Odoo.", true);
  if(m.foto && !confirm(`«${m.nombre}»\n\nYa tiene foto. ¿Sacar una nueva y reemplazarla?`)) return;
  FOTO_MOVE = moveId;
  if(!INPFOTO){
    INPFOTO = document.createElement("input");
    INPFOTO.type = "file"; INPFOTO.accept = "image/*";
    /* En la tablet del depósito abre la cámara de atrás directo, que es el caso
       real. En una PC no se pone `capture` para que se pueda elegir el archivo
       que mandó el laboratorio. */
    if(window.matchMedia && window.matchMedia("(pointer:coarse)").matches) INPFOTO.capture = "environment";
    INPFOTO.style.display = "none";
    INPFOTO.addEventListener("change", function(){
      const f = this.files && this.files[0];
      this.value = "";               /* sin esto, elegir DOS VECES la misma foto no dispara nada */
      if(f) subirFoto(FOTO_MOVE, f);
    });
    document.body.appendChild(INPFOTO);
  }
  INPFOTO.click();
}

async function subirFoto(moveId, file){
  const m = ST.rec && ST.rec.moves.find(x=>x.id===moveId); if(!m) return;
  if(!/^image\//.test(file.type||"")) return toast("Eso no es una imagen.", true);
  toast("Subiendo la foto…");
  try{
    const b64 = await EYGP.subirImagen(m.tmplId, file);   /* achica a 1200px y escribe image_1920 */
    m.foto = b64;
    /* Se repinta SÓLO la cabecera de esa línea — la miniatura y el cartelito de
       "sacar la foto" están las dos ahí. Repintar la pantalla entera tiraría el
       campo que se esté cargando en otra línea (la misma trampa que setPart). */
    const cab = document.getElementById("cab_"+m.id);
    const pos = ST.rec.moves.findIndex(x=>x.id===m.id) + 1;
    if(cab) cab.outerHTML = cabeceraLinea(m, pos);
    pintarAvisoFotos();
    toast("Foto guardada en el producto ✓");
  }catch(e){ toast("No se pudo guardar la foto: "+e.message, true); }
}

/* La miniatura ES el botón: se toca la caja gris y se saca la foto. Cuando no
   hay foto queda con borde punteado y la cámara marcada, para que se vea que
   falta algo y que se puede hacer algo al respecto desde acá. */
function fotoHTML(m, tam){
  const dentro = m.foto
    ? `<img src="data:image/png;base64,${m.foto}" alt="">`
    : `<span class="ph">${tam==="grande"?"📦<br><b>Sacar la foto</b>":"📦"}</span>`;
  return `<button class="thfoto${tam==="grande"?" grande":""}${m.foto?"":" sinfoto"}"
      id="foto_${m.id}" onclick="event.stopPropagation();pedirFoto(${m.id})"
      title="${m.foto?"Cambiar la foto de este producto":"Este producto no tiene foto: sacale una con la caja en la mano"}">
      ${dentro}<span class="cam">📷</span></button>`;
}

function sinFoto(){ return ST.rec ? ST.rec.moves.filter(m=>!m.foto).length : 0; }
function avisoFotos(){
  const n = sinFoto();
  if(!n) return "";
  return `<div class="aviso">📷 <b>${n}</b> producto(s) de esta recepción <b>no tienen foto</b>.
    Tocá el recuadro gris de la izquierda y sacale una: queda en la ficha del producto,
    y con eso la ven la web, Cargar venta y el asistente de WhatsApp.</div>`;
}
function pintarAvisoFotos(){
  const c = document.getElementById("avisofotos");
  if(c) c.innerHTML = avisoFotos();
}

/* ===================== LAS LÍNEAS ===================== */
function recibidoDe(m){ return m.parts.reduce((a,p)=>a+(parseFloat(String(p.cant).replace(",","."))||0), 0); }
function completa(m){
  const rec = recibidoDe(m);
  if(rec <= 0) return false;
  if(m.pideLote && m.parts.some(p=>(parseFloat(String(p.cant).replace(",","."))||0)>0 && !String(p.lote).trim())) return false;
  if(m.vence   && m.parts.some(p=>(parseFloat(String(p.cant).replace(",","."))||0)>0 && !p.vto)) return false;
  return true;
}

function setPart(moveId, i, campo, valor){
  if(ST.rec && ST.rec.hecha) return;            /* cerrada: no se toca lo que entró */
  const m = ST.rec.moves.find(x=>x.id===moveId); if(!m) return;
  m.parts[i][campo] = valor;
  /* Mientras se tipea NO se repinta la pantalla: se actualizan sólo la cabecera
     de la línea, su color de estado, los campos que faltan y el progreso. Si se
     repintara todo, el navegador tira el input y se pierde el foco a la segunda
     tecla — la misma trampa que documenta EYG.buscador en el núcleo.
     Tampoco se pliega la línea al completarla: eso sacaría de abajo del cursor
     el campo que se está usando. Se pliega en el próximo repintado. */
  const cab = document.getElementById("cab_"+moveId);
  const pos = ST.rec.moves.findIndex(x=>x.id===moveId) + 1;
  if(cab) cab.outerHTML = cabeceraLinea(m, pos);
  const caja = document.getElementById("ln_"+moveId);
  if(caja) caja.className = "ln " + estadoLinea(m) + (ST.foco===moveId?" foco":"");
  if(campo === "cant"){                       /* cambia qué campos quedan en falta */
    m.parts.forEach((p,j)=>{
      const c = parseFloat(String(p.cant).replace(",","."))||0;
      const lote = document.getElementById("lote_"+moveId+"_"+j);
      if(lote) lote.classList.toggle("falta", m.pideLote && c>0 && !String(p.lote).trim());
    });
  }
  pintarBarra();
}
function agregarPart(moveId){
  const m = ST.rec.moves.find(x=>x.id===moveId); if(!m) return;
  m.parts.push({id:null, lote:"", cant:0, vto:""});
  ST.editando.add(moveId);                    /* que no se pliegue al agregar */
  pintar();
  setTimeout(()=>{ const i=document.getElementById("lote_"+moveId+"_"+(m.parts.length-1)); if(i) i.focus(); },60);
}
/* Quitar una partida. Si es la única, no se borra la fila: se VACÍA (queda una
   partida en 0), que es lo que hace falta para corregir un lote mal cargado. */
function quitarPart(moveId, i){
  const m = ST.rec.moves.find(x=>x.id===moveId); if(!m) return;
  if(m.parts.length > 1) m.parts.splice(i,1);
  else m.parts[0] = {id:m.parts[0].id, lote:"", cant:0, vto:""};
  ST.editando.add(moveId);
  pintar();
}

/* La cabecera entera es el acceso a la pantalla del producto: en una tablet no
   se puede pedir puntería para un enlace de 12 píxeles. */
function cabeceraLinea(m, pos){
  const rec = recibidoDe(m);
  const clase = rec===0 ? "" : (Math.abs(rec-m.demanda)<0.001 ? "ok" : "dif");
  const faltan = faltantesDe(m).length;
  return `<div class="lnh" id="cab_${m.id}" onclick="abrirProducto(${m.id})" title="Abrir este producto">
    <div class="npos">${pos}</div>
    ${fotoHTML(m)}
    <div class="mid">
      <div class="nm">${esc(m.nombre)}</div>
      <div class="sub">
        ${m.barcode?`<span class="cod">⌗ ${esc(m.barcode)}</span>`:`<span class="pill sin">sin código de barras</span>`}
        ${faltan?`<span class="pill sin">le faltan ${faltan} dato(s)</span>`:""}
        ${m.pideLote?`<span>${m.tracking==="serial"?"por número de serie":"por lote"}</span>`:`<span>sin seguimiento</span>`}
        ${m.vence?`<span>con vencimiento</span>`:""}
      </div>
    </div>
    <div class="cant ${clase}">
      <div class="g">${rec.toLocaleString("es-AR")} / ${m.demanda.toLocaleString("es-AR")}</div>
      <div class="p">recibido / pedido</div>
    </div>
    <span class="go">Abrir →</span>
  </div>`;
}

/* Una línea ya cargada se pliega en un renglón verde: deja de competir por la
   atención y hace que salte a la vista lo que TODAVÍA falta. Se vuelve a abrir
   con "Editar". Sin esto todas las líneas se ven iguales y uno se pierde. */
function resumenLinea(m){
  const hecha = ST.rec && ST.rec.hecha;
  const det = m.parts.filter(p=>(parseFloat(String(p.cant).replace(",","."))||0)>0)
    .map(p=>`<b>${esc(p.lote||"—")}</b> × ${p.cant}${p.vto?` (vence ${esc(p.vto)})`:""}`).join(" · ");
  /* Una línea de una recepción hecha puede haber quedado en cero: se pidió y
     no vino. Decirlo es el dato — un renglón vacío no se entiende. */
  if(!det) return `<div class="resumen nada2">No entró nada de este producto</div>`;
  return `<div class="resumen">✓ ${det}
    ${hecha ? "" : `<button class="editar" onclick="editarLinea(${m.id})">Editar</button>`}</div>`;
}

function estadoLinea(m){
  if(completa(m)) return "lista";
  return recibidoDe(m) > 0 ? "pend" : "";
}

/* ===================== LA PANTALLA DE UN PRODUCTO =====================
   Es la pantalla en la que se pasa el día el depósito: se dispara la pistola y
   aparece ESTE producto, con el cursor en el lote. Tiene tres partes, en este
   orden, porque ese es el orden en que se hacen las cosas:

     1. LO QUE VINO — lote, vencimiento y cantidad, en grande. Es a lo que se
        vino. Todo lo demás está abajo.
     2. QUÉ LE FALTA AL PRODUCTO — categoría, categoría web, laboratorio, peso,
        foto… lo que impide que después funcione (sin categoría no hay precio;
        sin categoría web no aparece en el portal). Se completa acá, con el
        producto en la mano, que es el único momento en que alguien lo tiene.
     3. LA FICHA COMPLETA — los mismos bloques de la Ficha de producto, con el
        mismo formulario (EYGP.campoHTML). No hay una segunda versión de la
        ficha: es la misma pieza. */

function lineaActual(){ return ST.rec ? ST.rec.moves.find(m=>m.id===ST.linea) : null; }

function abrirProducto(moveId){
  const m = ST.rec && ST.rec.moves.find(x=>x.id===moveId); if(!m) return;
  ST.linea = moveId; ST.vista = "producto"; ST.extra = null;
  /* Se abren solos los bloques que hay que mirar: los dos de siempre y,
     además, CUALQUIERA que tenga un dato importante sin cargar. Si están todos
     cerrados, "completá lo que falte" es una frase que nadie va a obedecer:
     hay que tener el campo delante. */
  ST.abiertos = new Set(["identidad","clasificacion"]);
  if(m.t) EYGP.faltanClave(m.t).forEach(function(d){
    const b = EYGP.BLOQUES.find(b=>b.campos.some(c=>c.f===d.f));
    if(b) ST.abiertos.add(b.key);
  });
  pintar();
  focoDeCarga();
  cargarExtra(m);                 /* embalaje y proveedores, sin frenar la pantalla */
}
/* Al volver, la línea que se estaba cargando queda resaltada y centrada: si no,
   en una lista de 20 uno no sabe dónde estaba parado. */
function volverALista(){ ST.foco = ST.linea; ST.linea = null; ST.vista = "recepcion"; pintar(); }

/* Embalaje (la caja real) y proveedores viven en otras dos tablas de Odoo. No
   se leen al abrir la recepción — serían dos consultas más por 30 productos que
   quizá nadie mire — sino al entrar a la pantalla del producto. */
async function cargarExtra(m){
  if(!m.tmplId) return;
  try{
    const [packs, sellers] = await Promise.all([
      m.t && m.t.product_variant_id
        ? rpc("product.packaging","search_read",
              [[["product_id","=",m.t.product_variant_id[0]]],["id","name","qty"]])
        : Promise.resolve([]),
      rpc("product.supplierinfo","search_read",
          [[["product_tmpl_id","=",m.tmplId]],["id","partner_id","product_code","price","min_qty"]],
          {order:"sequence"}),
    ]);
    if(ST.linea !== m.id) return;                 /* ya se fue a otro producto */
    ST.extra = {packs: packs||[], sellers: sellers||[]};
    const n = document.getElementById("extra");
    if(n) n.innerHTML = bloqueExtra();
  }catch(e){ /* la pantalla sirve igual sin esto */ }
}

/* ---- 1. lo que vino ---- */
function bloqueCarga(m){
  /* Recepción ya cerrada: se muestra lo que entró, sin campos. Cambiarlo acá
     no tendría efecto (el stock ya se movió) y ofrecerlo sería mentir. */
  if(ST.rec && ST.rec.hecha){
    const det = m.parts.filter(p=>(parseFloat(String(p.cant).replace(",","."))||0)>0);
    return `<div class="carga hecha">
      <div class="ct">📥 Lo que entró de este producto</div>
      <div class="parts">
        ${det.length ? det.map(p=>`<div class="entro">
            <div class="e1"><span class="el">Cantidad</span><b>${p.cant}</b></div>
            ${m.pideLote?`<div class="e1"><span class="el">${m.tracking==="serial"?"N° de serie":"Lote"}</span><b class="mono">${esc(p.lote||"—")}</b></div>`:""}
            ${m.vence?`<div class="e1"><span class="el">Vence</span><b>${esc(p.vto||"—")}</b></div>`:""}
          </div>`).join("")
          : `<div class="nada">No entró nada de este producto: se había pedido ${m.demanda} y quedó en cero.</div>`}
      </div>
    </div>`;
  }
  return `<div class="carga">
    <div class="ct">📥 ¿Qué vino de este producto?</div>
    <div class="parts">
      ${m.parts.map((p,i)=>partHTML(m,p,i)).join("")}
      <div class="acc">
        ${m.pideLote?`<button class="addp" onclick="agregarPart(${m.id})">+ Otro lote de este producto</button>`:""}
        <button class="addp" onclick="vinoTodo(${m.id})">Vino todo (${m.demanda})</button>
        <button class="addp" style="color:var(--gris)" onclick="noVino(${m.id})">No vino nada</button>
      </div>
    </div>
  </div>`;
}

/* ---- 1bis. el código de barras, a mano ----
   El caso más común del depósito: la caja tiene el código impreso pero el
   producto no lo tiene cargado (hoy pasa en 478 de los 711 productos con
   stock). Se puede disparar la pistola parado en este campo o tipearlo del
   envase. Se comprueba ANTES que no lo tenga otro producto: el código de
   barras es único en Odoo y, si choca, el error que devuelve no se entiende. */
function bloqueGtin(m){
  if(m.barcode) return "";
  return `<div class="gtin" id="gtinbox_${m.id}">
    <div class="gt">⌗ Este producto todavía no tiene código de barras</div>
    <div class="grow">
      <input class="in mono" id="gtin_${m.id}" inputmode="numeric" autocomplete="off"
             placeholder="Disparale la pistola al envase, o tipeá el número"
             onkeydown="gtinKey(event,${m.id})">
      <button class="btn" onclick="guardarGtin(${m.id})">Guardar el código</button>
    </div>
    <div class="gh">Queda pegado a la ficha del producto: la próxima vez que llegue, se escanea solo.</div>
  </div>`;
}
function gtinKey(ev, moveId){ if(ev.key === "Enter"){ ev.preventDefault(); guardarGtin(moveId); } }

async function guardarGtin(moveId){
  const m = ST.rec && ST.rec.moves.find(x=>x.id===moveId); if(!m) return;
  const el = document.getElementById("gtin_"+moveId); if(!el) return;
  const cod = String(el.value||"").trim();
  if(!cod) return toast("Escribí o escaneá el código.", true);
  /* Un GTIN real tiene 8, 12, 13 o 14 dígitos. Si viene otra cosa puede ser un
     código interno del proveedor: se deja pasar, pero avisando. */
  if(!/^[0-9]{6,20}$/.test(cod) &&
     !confirm(`«${cod}» no parece un código de barras (los GTIN son 8, 12, 13 o 14 números).\n\n¿Guardarlo igual?`)) return;
  el.disabled = true;
  try{
    const otro = await EYGP.porCodigo(cod);
    if(otro && otro.id !== m.tmplId){
      toast("Ese código ya es de «"+String(otro.name).slice(0,40)+"». No se guardó.", true);
      return;
    }
    await EYGP.guardar(m.tmplId, "barcode", cod);
    m.barcode = cod;
    if(m.t) m.t.barcode = cod;
    toast("Código de barras guardado ✓");
    pintar();
  }catch(e){ toast("No se pudo guardar: "+e.message, true); }
  finally{ el.disabled = false; }
}

/* ---- 2. qué le falta al producto ---- */
function faltantesDe(m){
  const f = m.t ? EYGP.faltanClave(m.t).map(d=>({f:d.f, lbl:d.lbl})) : [];
  if(!m.foto) f.unshift({f:"__foto", lbl:"Foto"});
  return f;
}
function bloqueFaltan(m){
  const f = faltantesDe(m);
  if(!f.length) return `<div class="nota">✓ Este producto tiene todos los datos importantes cargados.</div>`;
  return `<div class="aviso">
    <b>Le faltan ${f.length} dato(s) importantes:</b> ${f.map(x=>esc(x.lbl)).join(" · ")}.<br>
    <span style="font-size:12px">Sin categoría el motor no le calcula precio; sin categoría web no aparece en el portal;
    sin peso no se cotiza el envío. Está todo abajo para completarlo ahora, con el producto en la mano.</span>
    <div class="chips">${f.map(x=>x.f==="__foto"
      ? `<button class="chip" onclick="pedirFoto(${m.id})">📷 Sacar la foto</button>`
      : `<button class="chip" onclick="irACampo('${x.f}')">${esc(x.lbl)} →</button>`).join("")}</div>
  </div>`;
}
/* Llevar al campo y dejarlo marcado: en una ficha larga, "falta la categoría"
   sin decir dónde está no sirve de nada. */
function irACampo(campo){
  const m = lineaActual();
  /* El código de barras tiene su propio recuadro arriba, con el botón de
     guardar al lado: el atajo lleva a ESE, no al campo del formulario. */
  if(campo === "barcode" && m && !m.barcode){
    const g = document.getElementById("gtin_"+m.id);
    if(g){ g.scrollIntoView({block:"center",behavior:"smooth"}); g.focus();
           g.classList.add("senalado"); setTimeout(()=>g.classList.remove("senalado"), 1800); return; }
  }
  for(const b of EYGP.BLOQUES){
    if(b.campos.some(c=>c.f===campo)){ ST.abiertos.add(b.key); break; }
  }
  pintar();
  setTimeout(function(){
    const el = document.getElementById("ing_"+campo);
    if(!el) return;
    el.scrollIntoView({block:"center", behavior:"smooth"});
    el.focus();
    el.classList.add("senalado");
    setTimeout(()=>el.classList.remove("senalado"), 1800);
  }, 120);
}

/* ---- 3. la ficha completa, con el formulario compartido ---- */
function toggleBlk(k){ if(ST.abiertos.has(k)) ST.abiertos.delete(k); else ST.abiertos.add(k); pintar(); }

async function guardarCampoIng(campo, el){
  const m = lineaActual(); if(!m || !m.t) return;
  const def = EYGP.campoDef(campo);
  const valor = EYGP.leerControl(def, el);
  el.disabled = true;
  try{
    const guardado = await EYGP.guardar(m.tmplId, campo, valor);
    /* Se refleja lo que quedó en Odoo, no lo que se tipeó. */
    if(def.tipo === "m2o")      m.t[campo] = guardado ? [guardado, EYGP.nombreDe(def.cat, guardado)] : false;
    else if(def.tipo === "m2m") m.t[campo] = valor;
    else                        m.t[campo] = guardado;
    /* Estos dos cambian cómo se recibe: si se prende "tiene vencimiento" o se
       pasa a "por lotes", la carga de arriba tiene que pedir esos campos YA. */
    if(campo === "tracking" || campo === "use_expiration_date"){
      m.pideLote = m.t.tracking === "lot" || m.t.tracking === "serial";
      m.vence    = !!m.t.use_expiration_date;
    }
    if(campo === "barcode") m.barcode = guardado || "";
    toast("Guardado ✓");
    pintar();                     /* el contador de faltantes y las etiquetas cambian */
  }catch(e){
    toast(e.message, true);
    pintar();                     /* deja a la vista el valor real de Odoo */
  }finally{ el.disabled = false; }
}

          s.price?EYG.money(s.price):"sin precio"}${s.min_qty?" · mín "+s.min_qty:""}</span></div>`).join("")
    : `<div class="nada">Sin proveedores cargados. Se agregan desde la Ficha de producto.</div>`;

async function guardarEmb(){
  const m = lineaActual(); if(!m || !ST.extra) return;
  const n = document.getElementById("emb_n").value.trim();
  const q = document.getElementById("emb_q").value;
  const p = ST.extra.packs[0] || null;
  try{
    const varId = m.t && m.t.product_variant_id ? m.t.product_variant_id[0] : null;
    const id = await EYGP.guardarEmbalaje(varId, p?p.id:null, q, n);
    const qq = parseFloat(String(q).replace(",",".")) || 0;
    ST.extra.packs = (id && qq>0) ? [{id, name:n||"Caja", qty:qq}] : [];
    toast("Embalaje guardado ✓");
    const el = document.getElementById("extra"); if(el) el.innerHTML = bloqueExtra();
  }catch(e){ toast(e.message, true); }
}

function vistaRecepcion(){
  const r = ST.rec, pk = r.pk;
  const listas = r.moves.filter(completa).length;
  const total  = r.moves.length;
  const pct = total ? Math.round(listas*100/total) : 0;

  const lineas = r.moves.map((m,idx)=>{
    const est = estadoLinea(m);
    /* En una recepción ya hecha TODAS las líneas van plegadas: es un registro
       de lo que entró, no un formulario. */
    const plegada = r.hecha || (est==="lista" && !ST.editando.has(m.id));
    const cuerpo = plegada ? resumenLinea(m) : `<div class="parts">
        ${m.parts.map((p,i)=>partHTML(m,p,i)).join("")}
        <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">
          ${m.pideLote?`<button class="addp" onclick="agregarPart(${m.id})">+ Otro lote de este producto</button>`:""}
          <button class="addp" onclick="vinoTodo(${m.id})" title="Completar con la cantidad que se había pedido">Vino todo (${m.demanda})</button>
          <button class="addp" style="color:var(--gris)" onclick="noVino(${m.id})" title="No llegó nada de este producto: al confirmar queda pendiente para otra entrega">No vino nada</button>
        </div>
      </div>`;
    return `<div class="ln ${est}${ST.foco===m.id?" foco":""}" id="ln_${m.id}">
      ${cabeceraLinea(m, idx+1)}
      ${cuerpo}
    </div>`;
  }).join("");

  const cabecera = `<button class="volver" onclick="volver()">← Volver a las recepciones</button>
    <div class="rhead${r.hecha?" hecha":""}">
      <h2>${esc(pk.name)} ${r.hecha?`<span class="pill stock">recibida</span>`:""}</h2>
      <div class="linea">
        <span><b>${esc(pk.partner_id?pk.partner_id[1]:"sin proveedor")}</b></span>
        ${pk.origin?`<span class="cod">${esc(pk.origin)}</span>`:""}
        <span>${r.hecha?"recibida el ":"prevista para el "}${esc(String((r.hecha?pk.date_done:pk.scheduled_date)||"").slice(0,16))}</span>
        <a href="${EYGP.ODOO_BASE}/odoo/inventory/${pk.id}" target="_blank" rel="noopener">Ver en Odoo ↗</a>
      </div>
      ${r.hecha?"":`<div class="prog" id="prog">${contenidoProg(listas,total,pct)}</div>`}
    </div>`;

  const escaneo = `<div class="scan">
      <div class="lbl">📷 ${r.hecha?"Buscá un producto de esta recepción":"Escaneá la caja"}</div>
      <input id="scan" autocomplete="off" placeholder="Disparale la pistola, o tipeá el código y Enter" onkeydown="scanKey(event)">
      <div class="hint">${r.hecha
        ? "Abre la pantalla del producto que leyó. Lo que entró no se puede cambiar desde acá, pero al producto sí se le puede completar lo que le falte."
        : "Si el código no está en ningún producto, te dejo pegárselo a una línea de esta recepción — así se completa el catálogo solo."}</div>
    </div>`;

  /* La recepción cerrada no ofrece guardar ni confirmar: no hay nada que
     guardar. Lo único que queda abajo es el resumen de lo que entró. */
  const pie = r.hecha
    ? `<div class="barra"><div class="info">${total} producto(s) · ${
        r.moves.reduce((a,m)=>a+recibidoDe(m),0).toLocaleString("es-AR")} unidades ingresadas</div>
        <a class="btn sec" href="${EYGP.ODOO_BASE}/odoo/inventory/${pk.id}" target="_blank" rel="noopener">Ver el movimiento en Odoo ↗</a></div>`
    : `<div class="barra" id="barra">${contenidoBarra(listas)}</div>`;

  const nota = r.hecha
    ? `<div class="nota">Esta recepción <b>ya entró al depósito</b>: lo que ves es lo que se cargó, con su lote y su
        vencimiento, y no se puede cambiar desde acá (ya movió stock en Odoo). Lo que sí podés hacer es
        <b>abrir cualquier producto</b> y completarle la foto, el código de barras o lo que le falte.</div>`
    : `<div class="nota">Cargá <b>lote y vencimiento</b> como figuran en la caja. Si un producto vino en <b>varios lotes</b>,
        agregá una fila por lote. Las líneas que completes se pliegan solas en verde, para que se vea lo que falta.
        Recién al <b>confirmar</b> suma stock en Odoo.<br>
        Y si a un producto le falta la <b>foto</b> o el <b>código de barras</b>, este es el momento de cargarlos:
        lo tenés en la mano. Quedan en la ficha del producto, no en esta recepción.</div>`;

  return cabecera + escaneo + panelDesconocido() +
    `<div id="avisofotos">${avisoFotos()}</div>` + nota + lineas + pie;
}

/* Una partida = un lote. El botón de quitar está SIEMPRE, aunque sea la única:
   antes sólo aparecía con dos o más, así que en la práctica no se veía nunca y
   no había forma de corregir un lote mal cargado. */
function partHTML(m, p, i){
  const cant = parseFloat(String(p.cant).replace(",","."))||0;
  const faltaLote = m.pideLote && cant>0 && !String(p.lote).trim();
  const faltaVto  = m.vence   && cant>0 && !p.vto;
  /* Los anchos salen de producto.css (.fld.lote / .fld.vto / .fld.cant) y NO
     de un style= acá: un estilo puesto a mano le gana a la regla de tablet, y
     los campos quedaban chicos justo en la pantalla donde más importan. */
  return `<div class="part">
    ${m.pideLote?`<div class="fld lote">
      <label>${m.tracking==="serial"?"N° de serie":"Lote"}</label>
      <input class="in mono${faltaLote?" falta":""}" id="lote_${m.id}_${i}" value="${esc(p.lote)}"
             placeholder="como figura en la caja" oninput="setPart(${m.id},${i},'lote',this.value)"></div>`:""}
    ${m.vence?`<div class="fld vto"><label>Vence</label>
      <input class="in${faltaVto?" falta":""}" type="date" id="vto_${m.id}_${i}" value="${esc(p.vto)}"
             oninput="setPart(${m.id},${i},'vto',this.value)"></div>`:""}
    <div class="fld cant"><label>Cantidad</label>
      <input class="in num" type="number" step="any" inputmode="decimal" id="cant_${m.id}_${i}" value="${p.cant}"
             oninput="setPart(${m.id},${i},'cant',this.value)"></div>
    <button class="btn mini peli" onclick="quitarPart(${m.id},${i})"
            title="${m.parts.length>1?"Borrar este lote de la carga":"Vaciar esta partida"}">${m.parts.length>1?"Quitar lote":"Vaciar"}</button>
  </div>`;
}

/* ---- acciones rápidas por línea ---- */
function vinoTodo(moveId){
  const m = ST.rec.moves.find(x=>x.id===moveId); if(!m) return;
  const ya = m.parts.reduce((a,p)=>a+(parseFloat(String(p.cant).replace(",","."))||0),0);
  const falta = m.demanda - ya;
  if(Math.abs(falta) < 0.001) return toast("Ya está la cantidad completa.");
  const u = m.parts[m.parts.length-1];
  u.cant = (parseFloat(String(u.cant).replace(",","."))||0) + falta;
  ST.editando.add(moveId); pintar();
}
function noVino(moveId){
  const m = ST.rec.moves.find(x=>x.id===moveId); if(!m) return;
  m.parts = [{id:(m.parts[0]?m.parts[0].id:null), lote:"", cant:0, vto:""}];
  ST.editando.delete(moveId);
  pintar();
  toast("Queda en 0: al confirmar, Odoo lo deja pendiente para otra entrega.");
}
function editarLinea(moveId){ ST.editando.add(moveId); ST.foco = moveId; pintar(); }

function contenidoProg(listas,total,pct){
  return `<div class="barra-p"><i style="width:${pct}%"></i></div>
    <div class="txt">${listas} de ${total} línea(s) listas · ${pct}%</div>`;
}
function contenidoBarra(listas){
  const r = ST.rec;
  if(listas === undefined) listas = r.moves.filter(completa).length;
  const total = r.moves.length;
  const conAlgo = r.moves.filter(m=>recibidoDe(m)>0).length;
  return `<div class="info">${listas} de ${total} línea(s) completas${
    conAlgo<total?` · ${total-conAlgo} sin cargar` : ""}</div>
    <button class="btn sec" onclick="guardarAvance()" ${ST.guardando?"disabled":""}>Guardar avance</button>
    <button class="btn ok" onclick="confirmarRecepcion()" ${ST.guardando||!conAlgo?"disabled":""}>Confirmar la recepción</button>`;
}
function pintarBarra(){
  const r = ST.rec; if(!r) return;
  const listas = r.moves.filter(completa).length, total = r.moves.length;
  const b = document.getElementById("barra");
  /* En la pantalla de UN producto la barra dice otra cosa (el estado de esa
     línea): si se pisara con la de la recepción, al tipear la cantidad
     aparecerían de golpe los botones de confirmar toda la recepción. */
  if(b && ST.vista !== "producto") b.innerHTML = contenidoBarra(listas);
  if(b && ST.vista === "producto"){
    const m = lineaActual();
    const i = b.querySelector(".info");
    if(m && i) i.textContent = completa(m) ? "✓ Esta línea está lista"
      : (recibidoDe(m)>0 ? "Falta el lote o el vencimiento" : "Todavía no cargaste nada de este producto");
  }
  const p = document.getElementById("prog");
  if(p) p.innerHTML = contenidoProg(listas, total, total?Math.round(listas*100/total):0);
}

/* ===================== ESCRIBIR EN ODOO ===================== */
/* Deja las líneas de movimiento de Odoo iguales a lo que se cargó en pantalla:
   reescribe las que ya existen, crea las que faltan y borra las que sobran.
   No valida nada: se puede dejar a medias y seguir mañana. */
async function guardarAvance(silencioso){
  if(ST.guardando) return;
  /* Candado: una recepción cerrada ya movió stock en Odoo. Ni un botón que
     quedó colgado ni un Enter perdido tienen que poder reescribirle las
     líneas de lo que entró. */
  if(ST.rec && ST.rec.hecha) return;
  ST.guardando = true; pintarBarra();
  const r = ST.rec;
  try{
    /* UNA LÍNEA NO ESPERA A LA OTRA. Cada escritura al conector cuesta ~1,3 s;
       en fila, una recepción de 10 productos tardaba más de 13 segundos en
       guardarse. Cada línea sigue haciendo lo suyo en orden (primero crear o
       actualizar sus partidas, después borrar las que sobraron), pero las
       líneas corren juntas — el núcleo deja 4 consultas en vuelo, así que se
       guarda en tandas de 4. */
    await Promise.all(r.moves.map(async function(m){
      const quiero = m.parts
        .map(p=>({...p, cant: parseFloat(String(p.cant).replace(",","."))||0}))
        .filter(p=>p.cant > 0);
      const existentes = m.parts.filter(p=>p.id).map(p=>p.id);

      for(let i=0;i<quiero.length;i++){
        const p = quiero[i];
        const vals = { quantity: p.cant };
        if(m.pideLote) vals.lot_name = String(p.lote).trim() || false;
        if(m.vence)    vals.expiration_date = fechaAOdoo(p.vto);
        if(p.id){ await rpc("stock.move.line","write",[[p.id], vals]); }
        else{
          const nuevo = await rpc("stock.move.line","create",[Object.assign({
            move_id:m.id, picking_id:r.pk.id, product_id:m.prodId,
            product_uom_id:m.uomId, location_id:m.locId, location_dest_id:m.locDest,
          }, vals)]);
          p.id = nuevo;
          const orig = m.parts.find(x=>!x.id && x.lote===p.lote && String(x.cant)===String(p.cant));
          if(orig) orig.id = nuevo;
        }
      }
      /* Las que quedaron sin cantidad ya no van: se borran para que Odoo no
         reciba una partida fantasma en 0. */
      const vivos = new Set(quiero.map(p=>p.id).filter(Boolean));
      const sobran = existentes.filter(id=>!vivos.has(id));
      if(sobran.length) await rpc("stock.move.line","unlink",[sobran]);
      m.parts = m.parts.filter(p=>(parseFloat(String(p.cant).replace(",","."))||0) > 0);
      if(!m.parts.length) m.parts = [{id:null, lote:"", cant:0, vto:""}];
    }));
    if(!silencioso) toast("Avance guardado ✓");
  }catch(e){
    toast("No se pudo guardar: "+e.message, true);
    throw e;
  }finally{ ST.guardando = false; pintarBarra(); }
}

async function confirmarRecepcion(){
  const r = ST.rec;
  if(r.hecha) return toast("Esta recepción ya fue confirmada.", true);
  const incompletas = r.moves.filter(m=>recibidoDe(m)>0 && !completa(m));
  if(incompletas.length){
    toast("Faltan lote o vencimiento en "+incompletas.length+" línea(s).", true);
    const n = document.getElementById("ln_"+incompletas[0].id);
    if(n) n.scrollIntoView({block:"center", behavior:"smooth"});
    return;
  }
  const parcial = r.moves.filter(m=>Math.abs(recibidoDe(m)-m.demanda) > 0.001);
  const sinNada = r.moves.filter(m=>recibidoDe(m) <= 0);
  let msg = `¿Confirmar ${r.pk.name}?\n\nSuma el stock en Odoo y deja el ingreso registrado. No se puede deshacer desde acá.`;
  if(parcial.length) msg += `\n\nOJO: ${parcial.length} línea(s) no coinciden con lo pedido.`;
  if(sinNada.length) msg += `\n${sinNada.length} línea(s) sin nada cargado: Odoo va a ofrecer dejarlas pendientes.`;
  if(!confirm(msg)) return;

  ST.guardando = true; pintarBarra();
  try{
    await guardarAvance(true);

    /* En Odoo 17 una línea solo se da por recibida si queda `picked`. */
    const conAlgo = r.moves.filter(m=>recibidoDe(m) > 0).map(m=>m.id);
    if(conAlgo.length) await rpc("stock.move","write",[conAlgo, {picked:true}]);

    const res = await rpc("stock.picking","button_validate",[[r.pk.id]]);

    /* Si se recibió menos de lo pedido, Odoo devuelve el asistente de entrega
       parcial en vez de terminar. Se le responde creando el pendiente, que es
       lo correcto: lo que falta sigue debiéndose. */
    if(res && typeof res === "object" && res.res_model === "stock.backorder.confirmation"){
      const ctx = Object.assign({}, res.context||{});
      const wid = await rpc("stock.backorder.confirmation","create",
        [{pick_ids:[[6,0,[r.pk.id]]]}], {context:ctx});
      await rpc("stock.backorder.confirmation","process",[[wid]], {context:ctx});
      toast("Recepción confirmada ✓ — quedó un pendiente por lo que faltó");
    }else{
      toast("Recepción confirmada ✓");
    }
    ST.guardando = false;
    volver();
    cargarPendientes();
  }catch(e){
    ST.guardando = false; pintarBarra();
    toast("No se pudo confirmar: "+e.message, true);
  }
}

/* ===================== arranque ===================== */
EYG.guard(["inventario","maestro","direccion","finanzas","admin"])
  .then(function(perfil){
    PERFIL = perfil;
    document.body.innerHTML = EYG.layout(perfil, "ingreso",
      '<div id="cont"><div class="cargando"><div class="spinner"></div>Cargando…</div></div>',
      "Ingreso de mercadería");
    cargarPendientes();
  });
</script>
