<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Depósito · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<style>
  :root{
    --green:#1E7D46; --greenbg:#E4F5E9; --yel:#B7791F; --yelbg:#FBF3D9;
    --org:#C4602A; --orgbg:#FBE3D4; --red:#8A1F1C; --redbg:#F7D2D0;
  }
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--teal-deep);font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:9px}
  h2.sec:before{content:"";width:5px;height:16px;background:var(--teal);border-radius:3px}

  /* Salud */
  .health{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
  .health .hh{display:flex;gap:22px;padding:20px 22px;flex-wrap:wrap;align-items:center}
  .ring{--p:0;--c:var(--green);width:118px;height:118px;border-radius:50%;flex:none;
    background:conic-gradient(var(--c) calc(var(--p)*1%), var(--line) 0);display:grid;place-items:center;position:relative}
  .ring:before{content:"";position:absolute;inset:11px;background:var(--surface);border-radius:50%}
  .ring .in{position:relative;text-align:center;line-height:1}
  .ring .in b{font-size:32px;font-weight:800;letter-spacing:-1px}
  .ring .in span{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gris);margin-top:3px}
  .hstate{flex:1;min-width:230px}
  .hstate .lab{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal-med)}
  .hstate .big{font-size:22px;font-weight:800;margin:3px 0 4px}
  .hstate .big.g{color:var(--green)}.hstate .big.y{color:var(--org)}.hstate .big.r{color:var(--red)}
  .hstate p{font-size:13px;color:var(--gris);line-height:1.5}
  .hmetrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-top:1px solid var(--line);background:#FAFDFC}
  .hm{padding:13px 18px;border-right:1px solid var(--line)}
  .hm:last-child{border-right:0}
  .hm .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:700}
  .hm .v{font-size:20px;font-weight:800;letter-spacing:-.5px;margin-top:3px}
  .hm.bad .v{color:var(--red)} .hm.mid .v{color:var(--org)} .hm.good .v{color:var(--green)}

  /* Tabs */
  .tabs{display:flex;gap:8px;margin:6px 0 14px;flex-wrap:wrap}
  .tab{font-family:inherit;font-size:14px;font-weight:700;padding:11px 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--gris);cursor:pointer;display:flex;align-items:center;gap:8px}
  .tab.on{background:var(--teal-deep);color:#fff;border-color:var(--teal-deep)}
  .tab .b{font-size:11px;font-weight:800;background:var(--redbg);color:var(--red);padding:1px 7px;border-radius:99px}
  .tab.on .b{background:rgba(255,255,255,.2);color:#fff}

  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
  .pcard.empty{text-align:center;color:var(--gris);padding:40px}

  .note{background:#FFF8F1;border:1px solid #F2C99B;border-left:4px solid var(--org);border-radius:10px;padding:12px 14px;font-size:13px;margin:0 0 12px;color:#7A3E17}
  .note b{color:var(--org)}
  .note.info{background:#EEF6F5;border-color:#BFE0DC;border-left-color:var(--teal);color:#245C57}.note.info b{color:var(--teal-deep)}
  .note.ok{background:var(--greenbg);border-color:#BFE0DC;border-left-color:var(--green);color:#155C33}.note.ok b{color:var(--green)}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
  .search input{border:0;background:none;outline:none;font-family:inherit;font-size:14px;width:100%;color:var(--ink)}
  .search svg{width:18px;height:18px;color:var(--gris2);flex-shrink:0}
  .chip{font-size:12.5px;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;color:var(--gris)}
  .chip.on{background:var(--red);color:#fff;border-color:var(--red)}
  select,.mini-btn{font-family:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px;color:var(--ink);cursor:pointer;font-weight:600}
  .mini-btn:hover{border-color:var(--teal)}
  .mini-btn.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
  .mini-btn:disabled{opacity:.5;cursor:default}
  .count-line{font-size:13px;color:var(--gris);margin:2px 0 10px}.count-line b{color:var(--ink)}

  .tablecard{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .thead,.row{display:grid;gap:10px;align-items:center;padding:10px 14px}
  .thead{background:#F0F6F5;border-bottom:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--gris)}
  .row{border-bottom:1px solid var(--line);font-size:13px}
  .row:last-child{border-bottom:0}
  .row:hover{background:#F7FBFA}
  .tr-r{text-align:right}
  .pname{min-width:0}
  .pname b{font-size:13px;display:block;white-space:normal;overflow-wrap:anywhere;line-height:1.3}
  .pname span{font-size:11px;color:var(--gris)}
  .neg{color:var(--red);font-weight:700}
  .pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;display:inline-block}
  .pill.red{background:var(--redbg);color:var(--red)}.pill.org{background:var(--orgbg);color:var(--org)}
  .pill.yel{background:var(--yelbg);color:var(--yel)}.pill.green{background:var(--greenbg);color:var(--green)}.pill.gray{background:#EEF2F1;color:var(--gris)}
  .cnt-in{width:78px;font-family:inherit;font-size:14px;font-weight:700;text-align:right;border:1px solid var(--line);border-radius:8px;padding:7px 8px;color:var(--ink)}
  .cnt-in:focus{outline:none;border-color:var(--teal)}
  .difpos{color:var(--green);font-weight:700}.difneg{color:var(--red);font-weight:700}

  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite;margin:60px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .subgrp{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--teal-deep);background:#EAF4F3;padding:7px 14px;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=34"></script>
<script>
const RPC="https://yxotopoklgjowcudveoj.supabase.co/functions/v1/odoo-rpc";
const ES={lang:"es_AR"};
const money=n=>"$"+Math.round(n||0).toLocaleString("es-AR");
const esc=s=>(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const SCRAP_LOC=16; // Virtual Locations/Scrap
async function rpc(model,method,args,kwargs={},intentos=3){
  let ultimo;
  for(let i=0;i<intentos;i++){
    try{
      const r=await EYG.gate(()=>fetch(RPC,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model,method,args,kwargs})}));
      const j=await r.json();
      if(!j.ok){ ultimo=new Error(j.error||"Error Odoo"); if(i<intentos-1 && /http2|connection|timeout|EOF|reset/i.test(j.error||"")){ await new Promise(s=>setTimeout(s,500*(i+1))); continue; } throw ultimo; }
      return j.result;
    }catch(e){ ultimo=e; if(i<intentos-1){ await new Promise(s=>setTimeout(s,500*(i+1))); continue; } throw ultimo; }
  }
  throw ultimo;
}
function toast(m){ let t=document.getElementById("toast"); if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);} t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2600); }
function cleanName(n){ return (n||"").replace(/^\[[^\]]+\]\s*/,"").replace(/\s*\(H-[^)]*\)/i,"").replace(/@/g,"").trim(); }
const nf=n=>Math.round(n||0).toLocaleString("es-AR");

// ===== Regla "IVA al costo" (parenterales: IVA no descontable, se suma al costo de compra) =====
const REGLAS_IVA_COSTO=[{nombre:"Parenterales",match:/parenteral/i,iva:0.21}];
function reglaIvaCosto(cat){ return REGLAS_IVA_COSTO.find(r=>r.match.test(cat||"")); }
// costo del MOTOR: gana el más reciente entre costo manual y última compra; fallback costo Odoo.
function costoMotorDe(p,uc){
  const manualC=p.x_costo_manual||0, manualD=p.x_costo_manual_date||null;
  const ucF=uc?uc.f:null, ucC=uc?uc.c:0;
  const reg=reglaIvaCosto((p.categ_id&&p.categ_id[1])||"");
  const iva=1+(reg?reg.iva:0);
  if(manualC>0 && (!ucF || (manualD && manualD>=ucF))) return {costo:manualC,fuente:"manual",fecha:manualD,iva:false};
  if(ucC>0) return {costo:ucC*iva,fuente:"compra",fecha:ucF,iva:!!reg};
  return {costo:p.standard_price||0,fuente:"odoo",fecha:null,iva:false};
}
function fuenteLbl(f){ return f==="manual"?"✎ costo manual":f==="compra"?"🧾 última compra":"◦ costo Odoo"; }

// ===================== ESTADO =====================
let DATA=[];      // por producto
let VIEW={tab:"valuacion"};
let CONT={q:"",cat:"todos",soloNeg:false};
let VAL={q:"",sel:new Set()};

// ===================== CARGA =====================
async function cargar(){
  const app=document.getElementById("cap");
  app.innerHTML='<div class="spin"></div>';
  try{
    // 1) todos los quants internos
    const quants=await rpc("stock.quant","search_read",[[["location_id.usage","=","internal"]]],
      {fields:["product_id","quantity","value","lot_id","location_id"],limit:6000,context:ES});
    const byP=new Map();
    for(const q of quants){ if(!q.product_id) continue; const id=q.product_id[0];
      if(!byP.has(id)) byP.set(id,{id,name:q.product_id[1],qty:0,val:0,quants:[]});
      const o=byP.get(id); o.qty+=q.quantity; o.val+=q.value;
      o.quants.push({id:q.id,qty:q.quantity,val:q.value,lot:q.lot_id?q.lot_id[0]:null,lotName:q.lot_id?q.lot_id[1]:"",loc:q.location_id?q.location_id[1]:"",locId:q.location_id?q.location_id[0]:null});
    }
    const ids=[...byP.keys()];
    // 2) maestro (incluye archivados: active_test:false)
    const prods=await rpc("product.product","read",[ids,["default_code","name","categ_id","standard_price","qty_available","x_costo_manual","x_costo_manual_date","active"]],{context:{lang:"es_AR",active_test:false}});
    const P=new Map(prods.map(x=>[x.id,x]));
    // 3) última compra
    const ult={};
    const pol=await rpc("purchase.order.line","search_read",[[["product_id","in",ids],["state","in",["purchase","done"]]]],
      {fields:["product_id","date_order","price_subtotal","product_qty"],limit:100000});
    for(const l of pol){ if(!l.product_id) continue; const id=l.product_id[0];
      if(!ult[id] || (l.date_order||"")>ult[id].f) ult[id]={f:l.date_order, c:l.product_qty>0? l.price_subtotal/l.product_qty : 0}; }
    // 4) armar filas
    DATA=[];
    for(const o of byP.values()){
      const p=P.get(o.id)||{};
      const catFull=((p.categ_id?p.categ_id[1]:"")||"").replace(/^ALL\s*\/\s*/i,"");
      const catTop=catFull.split(" / ")[0]||"—";
      const cm=costoMotorDe(p,ult[o.id]);
      const r={ id:o.id, code:p.default_code||"", name:p.name||o.name, active:p.active!==false,
        cat:catFull, catTop, qty:Math.round(o.qty*100)/100, val:o.val, quants:o.quants,
        costo:cm.costo, fuente:cm.fuente, fechaCosto:cm.fecha, ivaAplicado:!!cm.iva, std:p.standard_price||0 };
      r.valObj = r.qty*r.costo;
      r.dif = r.val - r.valObj;            // <0 = Odoo lo valúa por debajo (o negativo)
      r.clase = clasificar(r);
      DATA.push(r);
    }
    render();
  }catch(e){ app.innerHTML='<div class="pcard empty">No se pudo cargar Odoo: '+esc(e.message||String(e))+'<br><br><button class="mini-btn pri" onclick="cargar()">Reintentar</button></div>'; }
}

function clasificar(r){
  if(/^SAMPLE_/i.test(r.code) || /^(table (top|leg))/i.test(r.name)) return "basura";
  if(!r.active) return "archivado";
  if(!(r.costo>0)) return "sincosto";
  // torcido: hay stock positivo y el valor de Odoo difiere claramente del valor a costo
  if(r.qty>0){
    const base=Math.max(Math.abs(r.valObj),1);
    if(Math.abs(r.dif)>1000 && Math.abs(r.dif)/base>0.05) return "torcido";
  }
  return "sano";
}
const grupo=c=>DATA.filter(r=>r.clase===c);

// ===================== SALUD + TABS =====================
function render(){
  const g={torcido:grupo("torcido"),sincosto:grupo("sincosto"),archivado:grupo("archivado"),basura:grupo("basura"),sano:grupo("sano")};
  const total=DATA.length;
  const sanos=g.sano.length;
  const pct=total?Math.round(sanos/total*100):100;
  const gap=g.torcido.reduce((a,r)=>a+(r.valObj-r.val),0); // plata mal valuada (lo que falta para el valor real)
  const negLines=DATA.filter(r=>r.clase!=="basura").reduce((a,r)=>a+r.quants.filter(q=>q.qty<0).length,0);
  const color=pct>=90?"var(--green)":pct>=70?"var(--org)":"var(--red)";
  const est=pct>=90?["g","Depósito sano"]:pct>=70?["y","Necesita atención"]:["r","Depósito desordenado"];
  const health=`
   <div class="health">
    <div class="hh">
      <div class="ring" style="--p:${pct};--c:${color}"><div class="in"><b>${pct}%</b><span>fiel</span></div></div>
      <div class="hstate">
        <div class="lab">Estado del depósito</div>
        <div class="big ${est[0]}">${est[1]}</div>
        <p>${sanos} de ${total} productos con stock están bien. <b>${g.torcido.length+g.sincosto.length+g.archivado.length+g.basura.length}</b> necesitan corrección. La plata mal valuada por el desorden suma <b>${money(gap)}</b> — es lo que el sistema no está reflejando del valor real del inventario.</p>
      </div>
    </div>
    <div class="hmetrics">
      <div class="hm ${negLines?'bad':'good'}" style="cursor:pointer" onclick="irNeg()" title="Lotes con cantidad negativa: es físicamente imposible (se entregó más de lo ingresado). Tocá para ir a contarlos y ajustarlos."><div class="k">⚠️ Stock negativo</div><div class="v">${negLines}</div></div>
      <div class="hm ${g.torcido.length?'bad':'good'}"><div class="k">⚖️ Valuación torcida</div><div class="v">${g.torcido.length}</div></div>
      <div class="hm ${g.sincosto.length?'mid':'good'}"><div class="k">🏷️ Sin costo</div><div class="v">${g.sincosto.length}</div></div>
      <div class="hm ${g.archivado.length?'mid':'good'}"><div class="k">🗃️ Archivados c/stock</div><div class="v">${g.archivado.length}</div></div>
      <div class="hm ${g.basura.length?'mid':'good'}"><div class="k">🧹 Basura</div><div class="v">${g.basura.length}</div></div>
    </div>
   </div>`;

  const tabs=[
    ["valuacion","⚖️ Valuación",g.torcido.length],
    ["conteo","📋 Conteo físico",0],
    ["sincosto","🏷️ Sin costo",g.sincosto.length],
    ["archivado","🗃️ Archivados",g.archivado.length],
    ["basura","🧹 Basura",g.basura.length],
  ];
  const tabsHtml='<div class="tabs">'+tabs.map(([k,l,n])=>`<button class="tab ${VIEW.tab===k?'on':''}" onclick="irTab('${k}')">${l}${n?`<span class="b">${n}</span>`:''}</button>`).join('')+'</div>';

  let body="";
  if(VIEW.tab==="valuacion") body=tabValuacion(g.torcido);
  else if(VIEW.tab==="conteo") body=tabConteo();
  else if(VIEW.tab==="sincosto") body=tabSinCosto(g.sincosto);
  else if(VIEW.tab==="archivado") body=tabArchivado(g.archivado);
  else if(VIEW.tab==="basura") body=tabBasura(g.basura);

  document.getElementById("cap").innerHTML=health+tabsHtml+'<div id="tbody">'+body+'</div>';
  if(VIEW.tab==="conteo") setTimeout(bindConteo,0);
  if(VIEW.tab==="valuacion") setTimeout(bindVal,0);
}
function irTab(k){ VIEW.tab=k; render(); }
function irNeg(){ VIEW.tab="conteo"; CONT.soloNeg=true; CONT.q=""; CONT.cat="todos"; render(); }
function toggleNeg(){ CONT.soloNeg=!CONT.soloNeg; repintarBody(); }
function repintarBody(){
  const g={torcido:grupo("torcido"),sincosto:grupo("sincosto"),archivado:grupo("archivado"),basura:grupo("basura")};
  let body="";
  if(VIEW.tab==="valuacion") body=tabValuacion(g.torcido);
  else if(VIEW.tab==="conteo") body=tabConteo();
  else if(VIEW.tab==="sincosto") body=tabSinCosto(g.sincosto);
  else if(VIEW.tab==="archivado") body=tabArchivado(g.archivado);
  else if(VIEW.tab==="basura") body=tabBasura(g.basura);
  document.getElementById("tbody").innerHTML=body;
  if(VIEW.tab==="conteo") setTimeout(bindConteo,0);
  if(VIEW.tab==="valuacion") setTimeout(bindVal,0);
}

// ===================== TAB VALUACIÓN =====================
function tabValuacion(list){
  if(!list.length) return `<div class="pcard empty">🎉 No hay valuaciones torcidas. El inventario está fiel a su costo.</div>`;
  const q=VAL.q.toLowerCase();
  let arr=list.filter(r=>!q || r.name.toLowerCase().includes(q) || (r.code||"").toLowerCase().includes(q));
  arr.sort((a,b)=>Math.abs(b.dif)-Math.abs(a.dif));
  const totGap=list.reduce((a,r)=>a+(r.valObj-r.val),0);
  const rows=arr.map(r=>{
    const objetivo=Math.round(r.valObj);
    const difTxt=(r.dif<0?"−":"+")+money(Math.abs(r.dif)).slice(1);
    return `<div class="row" style="grid-template-columns:26px 2.4fr .7fr 1fr 1.2fr 1fr 1.1fr 96px">
      <div><input type="checkbox" class="vchk" data-id="${r.id}" ${VAL.sel.has(r.id)?'checked':''}></div>
      <div class="pname"><b>${esc(cleanName(r.name))}</b><span>${esc(r.code)} · ${esc(r.catTop)}</span></div>
      <div class="tr-r">${nf(r.qty)}</div>
      <div class="tr-r ${r.val<0?'neg':''}">${money(r.val)}</div>
      <div class="tr-r">${money(r.costo)}<br><span style="font-size:10px;color:var(--gris)">${fuenteLbl(r.fuente)}</span></div>
      <div class="tr-r"><b>${money(objetivo)}</b></div>
      <div class="tr-r difneg">${difTxt}</div>
      <div class="tr-r"><button class="mini-btn pri" onclick="revalorizar(${r.id})" title="Corrige el valor a ${money(objetivo)} con la herramienta oficial de Odoo. No toca la contabilidad.">🔧 Corregir</button></div>
    </div>`;
  }).join('');
  return `<div class="note">⚖️ <b>Valuación torcida.</b> Estos productos <b>tienen stock físico</b>, pero Odoo los valúa mal (a veces en negativo) por haber entregado sin haber ingresado antes. El botón <b>Corregir</b> lleva el valor a <b>cantidad × costo del motor</b> con la herramienta oficial de Odoo (revalorización). Verificado: <b>no genera asiento contable</b>. De raíz: <b>ingresar la mercadería antes de entregarla</b>.</div>
   <div class="toolbar">
     <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg><input id="valq" placeholder="Buscar producto o código…" value="${esc(VAL.q)}"></div>
     <button class="mini-btn" onclick="valSelAll()">Seleccionar todos (${arr.length})</button>
     <button class="mini-btn pri" onclick="revalorizarSel()">🔧 Corregir seleccionados</button>
   </div>
   <div class="count-line"><b>${arr.length}</b> productos · plata mal valuada total: <b>${money(totGap)}</b></div>
   <div class="tablecard">
     <div class="thead" style="grid-template-columns:26px 2.4fr .7fr 1fr 1.2fr 1fr 1.1fr 96px">
       <div></div><div>Producto</div><div class="tr-r">Stock</div><div class="tr-r">Vale en Odoo</div><div class="tr-r">Costo motor</div><div class="tr-r">Debería valer</div><div class="tr-r">Diferencia</div><div></div>
     </div>${rows}</div>`;
}
function bindVal(){

  if(i) i.oninput=e=>{ VAL.q=e.target.value; const p=e.target.selectionStart; repintarBody(); const n=document.getElementById("valq"); if(n){n.focus();n.setSelectionRange(p,p);} };
  document.querySelectorAll(".vchk").forEach(c=>c.onchange=e=>{ const id=+e.target.dataset.id; if(e.target.checked)VAL.sel.add(id); else VAL.sel.delete(id); });
}
function valSelAll(){ grupo("torcido").forEach(r=>VAL.sel.add(r.id)); repintarBody(); }

// Revalorización con el asistente nativo de Odoo (no genera asiento; valorización manual_periodic).
async function revalorizarUno(r){
  const wiz=await rpc("stock.valuation.layer.revaluation","create",[{product_id:r.id,company_id:1,added_value:0,reason:"Revalorización desde EyG Core · Control de Depósito"}]);
  const w=(await rpc("stock.valuation.layer.revaluation","read",[[wiz],["current_value_svl","current_quantity_svl"]]))[0];
  const qbase=(w.current_quantity_svl>0?w.current_quantity_svl:r.qty);
  const added=Math.round((qbase*r.costo - (w.current_value_svl||0))*100)/100;
  await rpc("stock.valuation.layer.revaluation","write",[[wiz],{added_value:added}]);
  await rpc("stock.valuation.layer.revaluation","action_validate_revaluation",[[wiz]]);
}
async function revalorizar(id){
  const r=DATA.find(x=>x.id===id); if(!r) return;
  if(!(r.qty>0)){ alert("Este producto no tiene stock positivo. Primero ajustá la cantidad en Conteo físico."); return; }
  if(!(r.costo>0)){ alert("No tiene costo cargado. Andá a la pestaña Sin costo y cargale el costo primero."); return; }
  const objetivo=Math.round(r.valObj);
  if(!confirm(`Corregir la valuación de "${cleanName(r.name)}":\n\n• Hoy Odoo dice:  ${money(r.val)}${r.val<0?"   (imposible)":""}\n• Va a quedar:  ${money(objetivo)}   (= ${nf(r.qty)} u × ${money(r.costo)})\n\nUsa la herramienta oficial de Odoo. No toca la contabilidad. ¿Confirmás?`)) return;
  try{ await revalorizarUno(r); toast("✓ Corregido a "+money(objetivo)); VAL.sel.delete(id); await cargar(); }
  catch(e){ alert("No se pudo corregir: "+(e.message||e)); }
}
async function revalorizarSel(){
  const ids=[...VAL.sel]; const list=grupo("torcido").filter(r=>ids.includes(r.id) && r.qty>0 && r.costo>0);
  if(!list.length){ alert("Seleccioná al menos un producto (con stock y costo)."); return; }
  const totObj=list.reduce((a,r)=>a+Math.round(r.valObj),0);
  if(!confirm(`Corregir la valuación de ${list.length} productos.\nQuedarán valuados en ${money(totObj)} en total (cantidad × costo motor).\nHerramienta oficial de Odoo, no toca la contabilidad. ¿Seguir?`)) return;
  let ok=0,err=0;
  for(const r of list){ try{ await revalorizarUno(r); ok++; toast(`Corrigiendo… ${ok}/${list.length}`); }catch(e){ err++; } }
  VAL.sel.clear();
  toast(`✓ ${ok} corregidos${err?` · ${err} con error`:""}`);
  await cargar();
}

// ===================== TAB CONTEO FÍSICO =====================
// líneas = un quant (producto + lote) para ajustar la cantidad real a lo que Martina cuenta.
function lineasConteo(){
  const q=CONT.q.toLowerCase();
  let arr=DATA.filter(r=>r.clase!=="basura");
  if(CONT.cat!=="todos") arr=arr.filter(r=>r.catTop===CONT.cat);
  if(q) arr=arr.filter(r=>r.name.toLowerCase().includes(q)||(r.code||"").toLowerCase().includes(q));
  return arr.sort((a,b)=>a.name.localeCompare(b.name));
}
function tabConteo(){
  const cats=[...new Set(DATA.map(r=>r.catTop))].sort();
  const negTotal=DATA.filter(r=>r.clase!=="basura").reduce((a,r)=>a+r.quants.filter(q=>q.qty<0).length,0);
  let arr=lineasConteo();
  if(CONT.soloNeg) arr=arr.filter(r=>r.quants.some(q=>q.qty<0));
  const LIMIT=CONT.soloNeg?9999:200;
  const shown=arr.slice(0,LIMIT);
  let rows="";
  for(const r of shown){
    // una línea por quant; si el producto tiene varios lotes, se listan todos
    for(const qn of r.quants){
      if(CONT.soloNeg && !(qn.qty<0)) continue;
      const key=`q${qn.id}`;
      rows+=`<div class="row" data-qid="${qn.id}" style="grid-template-columns:2.4fr 1fr .8fr 96px .9fr 90px">
        <div class="pname"><b>${esc(cleanName(r.name))}</b><span>${esc(r.code)}${qn.lotName?` · lote ${esc(qn.lotName)}`:""}</span></div>
        <div style="font-size:11px;color:var(--gris)">${esc(r.catTop)}</div>
        <div class="tr-r">sistema<br><b class="${qn.qty<0?'neg':''}">${nf(qn.qty)}</b></div>
        <div class="tr-r"><input class="cnt-in" id="${key}" inputmode="decimal" placeholder="conté" data-sis="${qn.qty}"></div>
        <div class="tr-r" id="dif-${key}"></div>
        <div class="tr-r"><button class="mini-btn" id="btn-${key}" disabled onclick="ajustar(${qn.id},'${key}')">Ajustar</button></div>
      </div>`;
    }
  }
  return `<div class="note info">📋 <b>Conteo físico.</b> Contá la mercadería real en el depósito y anotá lo que hay en <b>Conté</b>: el sistema te muestra la diferencia y con <b>Ajustar</b> corrige la cantidad en Odoo (ajuste de inventario, queda registrado). Contá <b>por lote</b> cuando el producto tiene varios. Buscá o filtrá por categoría para contar de a partes. Después de ajustar cantidades, revisá la pestaña <b>Valuación</b> por si quedó algún valor para corregir.</div>
   <div class="toolbar">
     <button class="chip ${CONT.soloNeg?'on':''}" onclick="toggleNeg()" title="Lotes con cantidad negativa: físicamente imposible. Contalos y ajustalos a lo real.">⚠️ Solo stock negativo${negTotal?` (${negTotal})`:''}</button>
     <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg><input id="cq" placeholder="Buscar producto o código…" value="${esc(CONT.q)}"></div>
     <select id="ccat"><option value="todos">Todas las categorías</option>${cats.map(c=>`<option value="${esc(c)}" ${CONT.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
   </div>
   <div class="count-line">${CONT.soloNeg?`<b style="color:var(--red)">Mostrando solo lotes con stock negativo.</b> `:''}Mostrando <b>${Math.min(shown.length,arr.length)}</b>${!CONT.soloNeg&&arr.length>LIMIT?` de ${arr.length} (afiná la búsqueda para ver el resto)`:''} productos.</div>
   <div class="tablecard">
     <div class="thead" style="grid-template-columns:2.4fr 1fr .8fr 96px .9fr 90px">
       <div>Producto / lote</div><div>Categoría</div><div class="tr-r">Sistema</div><div class="tr-r">Conté</div><div class="tr-r">Diferencia</div><div></div>
     </div>${rows||'<div class="row">Sin resultados.</div>'}</div>`;
}
function bindConteo(){
  const cq=document.getElementById("cq");
  if(cq) cq.oninput=EYG.debounce(e=>{ CONT.q=e.target.value; repintarBody(); },300);
  const cc=document.getElementById("ccat");
  if(cc) cc.onchange=e=>{ CONT.cat=e.target.value; repintarBody(); };
  document.querySelectorAll(".cnt-in").forEach(inp=>{
    inp.oninput=()=>{
      const sis=parseFloat(inp.dataset.sis);
      const v=inp.value.trim().replace(",",".");
      const key=inp.id;
      const difEl=document.getElementById("dif-"+key), btn=document.getElementById("btn-"+key);
      if(v===""||isNaN(parseFloat(v))){ difEl.innerHTML=""; btn.disabled=true; return; }
      const c=parseFloat(v), d=Math.round((c-sis)*100)/100;
      difEl.innerHTML=d===0?'<span style="color:var(--gris)">igual</span>':`<span class="${d>0?'difpos':'difneg'}">${d>0?'+':''}${nf(d)}</span>`;
      btn.disabled=false; btn.classList.toggle("pri",d!==0);
    };
  });
}
async function ajustar(qid,key){
  const inp=document.getElementById(key); if(!inp) return;
  const contado=parseFloat(inp.value.trim().replace(",","."));
  if(isNaN(contado)){ return; }
  const sis=parseFloat(inp.dataset.sis);
  if(!confirm(`Ajustar el stock a lo contado:\n\n• Sistema: ${nf(sis)} u\n• Contado: ${nf(contado)} u\n\nCorrige la cantidad en Odoo (ajuste de inventario). ¿Confirmás?`)) return;
  const btn=document.getElementById("btn-"+key); if(btn){btn.disabled=true;btn.textContent="…";}
  try{
    await rpc("stock.quant","write",[[qid],{inventory_quantity:contado}],{context:ES});
    await rpc("stock.quant","action_apply_inventory",[[qid]]);
    toast("✓ Stock ajustado a "+nf(contado));
    await cargar();
  }catch(e){
    try{ await rpc("stock.quant","write",[[qid],{inventory_quantity_set:false}],{context:ES}); }catch(_){}
    alert("No se pudo ajustar: "+(e.message||e)+"\n\n(Puede ser por la unidad de medida del producto: no admite ese decimal.)");
    if(btn){btn.disabled=false;btn.textContent="Ajustar";}
  }
}

function tabSinCosto(list){
  if(!list.length) return `<div class="pcard empty">🎉 Todos los productos con stock tienen costo cargado.</div>`;
  const q=(CONT.q||"").toLowerCase();
  const rows=list.sort((a,b)=>b.val-a.val).map(r=>`<div class="row" data-id="${r.id}" style="grid-template-columns:2.6fr .8fr 1fr 120px 96px">
      <div class="pname"><b>${esc(cleanName(r.name))}</b><span>${esc(r.code)} · ${esc(r.catTop)}</span></div>
      <div class="tr-r">${nf(r.qty)}</div>
      <div class="tr-r ${r.val<0?'neg':''}">${money(r.val)}</div>
      <div class="tr-r"><input class="cnt-in" id="cost-${r.id}" inputmode="decimal" placeholder="costo $"></div>
      <div class="tr-r"><button class="mini-btn pri" onclick="guardarCosto(${r.id})">Guardar</button></div>
    </div>`).join('');
  return `<div class="note">🏷️ <b>Sin costo.</b> Tienen stock pero costo $0 en el sistema, así que no valen nada y rompen el margen. Cargá el costo (queda como costo manual) y después corregí la valuación. También podés definirlo en <b>Costos y Rentabilidad</b>.</div>
   <div class="tablecard">
     <div class="thead" style="grid-template-columns:2.6fr .8fr 1fr 120px 96px"><div>Producto</div><div class="tr-r">Stock</div><div class="tr-r">Valor hoy</div><div class="tr-r">Costo unitario</div><div></div></div>
     ${rows}</div>`;
}
async function guardarCosto(id){
  const inp=document.getElementById("cost-"+id); const v=parseFloat((inp.value||"").trim().replace(",","."));
  if(isNaN(v)||v<=0){ alert("Ingresá un costo mayor a 0."); return; }
  const r=DATA.find(x=>x.id===id);
  if(!confirm(`Cargar costo ${money(v)} a "${cleanName(r.name)}"?\n(Queda como costo manual del motor de precios.)`)) return;
  const nowStr=new Date().toISOString().slice(0,19).replace("T"," ");
  try{ await rpc("product.product","write",[[id],{x_costo_manual:v,x_costo_manual_date:nowStr}],{context:ES});
    toast("✓ Costo cargado"); await cargar(); }
  catch(e){ alert("No se pudo guardar: "+(e.message||e)); }
}

// ===================== TAB ARCHIVADOS =====================
function tabArchivado(list){
  if(!list.length) return `<div class="pcard empty">🎉 No hay productos archivados con stock.</div>`;
  const rows=list.sort((a,b)=>b.val-a.val).map(r=>`<div class="row" style="grid-template-columns:2.6fr .7fr 1fr 1.5fr 260px">
      <div class="pname"><b>${esc(cleanName(r.name))}</b><span>${esc(r.code)} · ${esc(r.catTop)} · <span class="pill gray">archivado</span></span></div>
      <div class="tr-r ${r.qty<0?'neg':''}">${nf(r.qty)}</div>
      <div class="tr-r ${r.val<0?'neg':''}">${money(r.val)}</div>
      <div style="font-size:11.5px;color:var(--gris)">${r.qty>0?"Hay mercadería real: contala/destruila o desarchivá.":"Fantasma del sistema: poné en 0."}</div>
      <div style="display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap">
        <button class="mini-btn" onclick="accionCero(${r.id})" title="Ajusta el stock a 0.">Poner en 0</button>
        <button class="mini-btn" onclick="accionScrap(${r.id})" title="Manda a scrap (destruir).">Destruir</button>
        <button class="mini-btn" onclick="desarchivar(${r.id})" title="Lo reactiva.">Desarchivar</button>
      </div>
    </div>`).join('');
  return `<div class="note">🗃️ <b>Archivados con stock.</b> Están dados de baja en Odoo pero todavía figuran con existencias. Decidí: <b>Poner en 0</b> (era un fantasma), <b>Destruir</b> (está pero hay que darlo de baja físico) o <b>Desarchivar</b> (sigue vigente).</div>
   <div class="tablecard"><div class="thead" style="grid-template-columns:2.6fr .7fr 1fr 1.5fr 260px"><div>Producto</div><div class="tr-r">Stock</div><div class="tr-r">Valor</div><div>Sugerencia</div><div></div></div>${rows}</div>`;
}
async function accionCero(id){
  const r=DATA.find(x=>x.id===id);
  if(!confirm(`Poner en 0 el stock de "${cleanName(r.name)}" (${nf(r.qty)} u)?\nAjuste de inventario, reversible.`)) return;
  try{ for(const q of r.quants){ if(q.qty===0) continue; await rpc("stock.quant","write",[[q.id],{inventory_quantity:0}],{context:ES}); await rpc("stock.quant","action_apply_inventory",[[q.id]]); }
    toast("✓ Puesto en 0"); await cargar(); }
  catch(e){ alert("No se pudo: "+(e.message||e)); }
}
async function accionScrap(id){
  const r=DATA.find(x=>x.id===id);
  if(!confirm(`DESTRUIR "${cleanName(r.name)}" (${nf(r.qty)} u)?\nCrea un scrap: las unidades pasan a la ubicación de descarte y salen del stock. Queda registrado.`)) return;
  try{ for(const q of r.quants){ if(q.qty<=0) continue; const vals={product_id:id,scrap_qty:q.qty,location_id:q.locId,scrap_location_id:SCRAP_LOC}; if(q.lot)vals.lot_id=q.lot;
      const sid=await rpc("stock.scrap","create",[vals]); await rpc("stock.scrap","action_validate",[[sid]]); }
    toast("✓ Enviado a destruir"); await cargar(); }
  catch(e){ alert("No se pudo: "+(e.message||e)); }
}
async function desarchivar(id){
  const r=DATA.find(x=>x.id===id);
  if(!confirm(`Desarchivar "${cleanName(r.name)}"? Vuelve al catálogo activo.`)) return;
  try{ await rpc("product.product","write",[[id],{active:true}],{context:ES}); toast("✓ Desarchivado"); await cargar(); }
  catch(e){ alert("No se pudo: "+(e.message||e)); }
}

// ===================== TAB BASURA =====================
function tabBasura(list){
  if(!list.length) return `<div class="pcard empty">🎉 No hay productos de prueba en el stock.</div>`;
  const rows=list.map(r=>`<div class="row" style="grid-template-columns:2.6fr .7fr 1fr 200px">
      <div class="pname"><b>${esc(r.name)}</b><span>${esc(r.code)}</span></div>
      <div class="tr-r">${nf(r.qty)}</div>
      <div class="tr-r">${money(r.val)}</div>
      <div style="display:flex;gap:6px;justify-content:flex-end">
        <button class="mini-btn pri" onclick="limpiarBasura(${r.id})" title="Pone en 0 y archiva.">Poner en 0 y archivar</button>
      </div>
    </div>`).join('');
  return `<div class="note">🧹 <b>Basura.</b> Productos de prueba de Odoo (demo) que quedaron con stock. Limpialos: pone la cantidad en 0 y los archiva.</div>
   <div class="tablecard"><div class="thead" style="grid-template-columns:2.6fr .7fr 1fr 200px"><div>Producto</div><div class="tr-r">Stock</div><div class="tr-r">Valor</div><div></div></div>${rows}</div>`;
}
async function limpiarBasura(id){
  const r=DATA.find(x=>x.id===id);
  if(!confirm(`Limpiar "${r.name}"? Pone el stock en 0 y lo archiva.`)) return;
  try{ for(const q of r.quants){ if(q.qty!==0){ await rpc("stock.quant","write",[[q.id],{inventory_quantity:0}],{context:ES}); await rpc("stock.quant","action_apply_inventory",[[q.id]]); } }
    await rpc("product.product","write",[[id],{active:false}],{context:ES});
    toast("✓ Limpiado"); await cargar(); }
  catch(e){ alert("No se pudo: "+(e.message||e)); }
}
