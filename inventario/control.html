  /* ---------- Conteo físico tipo tablet ---------- */

<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=45"></script>
<script>
const RPC="https://yxotopoklgjowcudveoj.supabase.co/functions/v1/odoo-rpc";
const ES={lang:"es_AR"};
const ODOO_BASE="https://drogueriaeyg.odoo.com";
const DIAS_COMPROMISO=10;  // mismo plazo que vender.html: pasado esto sin entregar, el pedido libera su stock
const money=n=>"$"+Math.round(n||0).toLocaleString("es-AR");
const esc=s=>(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const SCRAP_LOC=16; // Virtual Locations/Scrap
async function rpc(model,method,args,kwargs={},intentos=3){
  let ultimo;
  for(let i=0;i<intentos;i++){
    try{
      const r=await EYG.gate(()=>fetch(RPC,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model,method,args,kwargs})}));
      const j=await r.json();
      if(!j.ok){ ultimo=new Error(j.error||"Error Odoo"); if(i<intentos-1 && /http2|connection|timeout|EOF|reset/i.test(j.error||"")){ await new Promise(s=>setTimeout(s,500*(i+1))); continue; } throw ultimo; }
      return j.result;
    }catch(e){ ultimo=e; if(i<intentos-1){ await new Promise(s=>setTimeout(s,500*(i+1))); continue; } throw ultimo; }
  }
  throw ultimo;
}
function toast(m){ let t=document.getElementById("toast"); if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);} t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2600); }
function cleanName(n){ return (n||"").replace(/^\[[^\]]+\]\s*/,"").replace(/\s*\(H-[^)]*\)/i,"").replace(/@/g,"").trim(); }
const nf=n=>Math.round(n||0).toLocaleString("es-AR");

// ===== Regla "IVA al costo" (parenterales: IVA no descontable, se suma al costo de compra) =====
const REGLAS_IVA_COSTO=[{nombre:"Parenterales",match:/parenteral/i,iva:0.21}];
function reglaIvaCosto(cat){ return REGLAS_IVA_COSTO.find(r=>r.match.test(cat||"")); }
// costo del MOTOR: gana el más reciente entre costo manual y última compra; fallback costo Odoo.
function costoMotorDe(p,uc){
  const manualC=p.x_costo_manual||0, manualD=p.x_costo_manual_date||null;
  const ucF=uc?uc.f:null, ucC=uc?uc.c:0;
  const reg=reglaIvaCosto((p.categ_id&&p.categ_id[1])||"");
  const iva=1+(reg?reg.iva:0);
  if(manualC>0 && (!ucF || (manualD && manualD>=ucF))) return {costo:manualC,fuente:"manual",fecha:manualD,iva:false};
  if(ucC>0) return {costo:ucC*iva,fuente:"compra",fecha:ucF,iva:!!reg};
  return {costo:p.standard_price||0,fuente:"odoo",fecha:null,iva:false};
}
function fuenteLbl(f){ return f==="manual"?"✎ costo manual":f==="compra"?"🧾 última compra":"◦ costo Odoo"; }

// ===================== ESTADO =====================
let DATA=[];      // por producto
let PEND=[];      // pedidos confirmados sin entregar (delivery_status pending/partial)
let EXP={};       // lot_id -> vencimiento (YYYY-MM-DD)
let ULT={};       // "product|lot" -> último conteo {ts,email,contado}
let PERFIL=null;  // perfil logueado (para registrar quién contó)
let VIEW={tab:"valuacion"};
let CONT={q:"",cat:"todos",filtro:"",abiertos:new Set()}; // filtro: "" | "neg"
let VAL={q:"",sel:new Set()};

// ===================== CARGA =====================
async function cargar(){
  const app=document.getElementById("cap");
  app.innerHTML='<div class="spin"></div>';
  try{
    // 1) todos los quants internos
    const quants=await rpc("stock.quant","search_read",[[["location_id.usage","=","internal"]]],
      {fields:["product_id","quantity","value","reserved_quantity","lot_id","location_id"],limit:6000,context:ES});
    const byP=new Map();
    for(const q of quants){ if(!q.product_id) continue; const id=q.product_id[0];
      if(!byP.has(id)) byP.set(id,{id,name:q.product_id[1],qty:0,val:0,res:0,quants:[]});
      const o=byP.get(id); o.qty+=q.quantity; o.val+=q.value; o.res+=(q.reserved_quantity||0);
      o.quants.push({id:q.id,qty:q.quantity,val:q.value,res:(q.reserved_quantity||0),lot:q.lot_id?q.lot_id[0]:null,lotName:q.lot_id?q.lot_id[1]:"",loc:q.location_id?q.location_id[1]:"",locId:q.location_id?q.location_id[0]:null});
    }
    const ids=[...byP.keys()];
    // 2) maestro (incluye archivados: active_test:false)
    const prods=await rpc("product.product","read",[ids,["default_code","name","categ_id","standard_price","qty_available","x_costo_manual","x_costo_manual_date","active"]],{context:{lang:"es_AR",active_test:false}});
    const P=new Map(prods.map(x=>[x.id,x]));
    // 3) última compra
    const ult={};
    const pol=await rpc("purchase.order.line","search_read",[[["product_id","in",ids],["state","in",["purchase","done"]]]],
      {fields:["product_id","date_order","price_subtotal","product_qty"],limit:100000});
    for(const l of pol){ if(!l.product_id) continue; const id=l.product_id[0];
      if(!ult[id] || (l.date_order||"")>ult[id].f) ult[id]={f:l.date_order, c:l.product_qty>0? l.price_subtotal/l.product_qty : 0}; }
    // 4) armar filas
    DATA=[];
    for(const o of byP.values()){
      const p=P.get(o.id)||{};
      const catFull=((p.categ_id?p.categ_id[1]:"")||"").replace(/^ALL\s*\/\s*/i,"");
      const catTop=catFull.split(" / ")[0]||"—";
      const cm=costoMotorDe(p,ult[o.id]);
      const r={ id:o.id, code:p.default_code||"", name:p.name||o.name, active:p.active!==false,
        cat:catFull, catTop, qty:Math.round(o.qty*100)/100, val:o.val, quants:o.quants,
        res:Math.round(o.res*100)/100, disp:Math.round((o.qty-o.res)*100)/100,
        costo:cm.costo, fuente:cm.fuente, fechaCosto:cm.fecha, ivaAplicado:!!cm.iva, std:p.standard_price||0 };
      r.valObj = r.qty*r.costo;
      r.dif = r.val - r.valObj;            // <0 = Odoo lo valúa por debajo (o negativo)
      r.clase = clasificar(r);
      DATA.push(r);
    }
    try{ PEND=await cargarPendientes(); }catch(e){ PEND=[]; }
    try{ EXP=await cargarVtos(); }catch(e){ EXP={}; }
    try{ ULT=await cargarUltimosConteos(); }catch(e){ ULT={}; }
    render();
  }catch(e){ app.innerHTML='<div class="pcard empty">No se pudo cargar Odoo: '+esc(e.message||String(e))+'<br><br><button class="mini-btn pri" onclick="cargar()">Reintentar</button></div>'; }
}
// vencimientos por lote (de los lotes que tienen stock)
async function cargarVtos(){
  const ids=[...new Set(DATA.flatMap(r=>r.quants.map(q=>q.lot).filter(Boolean)))];
  if(!ids.length) return {};
  const lots=await rpc("stock.lot","read",[ids,["expiration_date"]],{context:ES});
  const m={}; lots.forEach(l=>{ if(l.expiration_date) m[l.id]=String(l.expiration_date).slice(0,10); }); return m;
}
// último conteo por producto+lote (de la tabla de auditoría en Supabase)
async function cargarUltimosConteos(){
  try{
    const {data}=await EYG.supa().from("deposito_conteos").select("product_id,lot_id,ts,email,contado").order("ts",{ascending:false}).limit(5000);
    const m={}; (data||[]).forEach(x=>{ const k=x.product_id+"|"+(x.lot_id||0); if(!m[k]) m[k]=x; }); return m;
  }catch(e){ return {}; }
}
// pedidos confirmados con entrega pendiente/parcial (+ días desde el pedido)
async function cargarPendientes(){
  const orders=await rpc("sale.order","search_read",
    [[["state","=","sale"],["delivery_status","in",["pending","partial"]]],
     ["name","date_order","partner_id","user_id","amount_total","delivery_status"]],
    {limit:500,order:"date_order asc",context:ES});
  const hoy=Date.now();
  return orders.map(o=>({...o, dias: o.date_order? Math.round((hoy-new Date(String(o.date_order).replace(" ","T")))/86400000):0 }));
}

function clasificar(r){
  if(/^SAMPLE_/i.test(r.code) || /^(table (top|leg))/i.test(r.name)) return "basura";
  if(!r.active) return "archivado";
  if(!(r.costo>0)) return "sincosto";
  // ROTO = Odoo perdió el valor del stock: valor NEGATIVO (imposible) o casi cero (quedó por debajo
  // del 40% de lo que debería, no es un simple desfasaje por inflación). Los que solo están más baratos
  // porque el costo subió (valor de Odoo = promedio real pagado) NO son errores → quedan sanos.
  if(r.qty>0 && r.valObj>0){
    const falta=r.valObj-r.val;
    if(falta>1000 && r.val < 0.4*r.valObj) return "torcido";
  }
  return "sano";
}
const grupo=c=>DATA.filter(r=>r.clase===c);

      <div class="hm clk ${raroLines?'bad':'good'}" onclick="irRaro()" title="Productos con algo para corregir: lote en negativo, stock sin número de lote, o líneas sin stock apartadas por error. Tocá para revisarlos, cada uno te dice qué hacer."><div class="k">🚩 A revisar</div><div class="v">${raroLines}</div></div>
      <div class="hm clk ${negLines?'bad':'good'}" onclick="irNeg()" title="Lotes en negativo. Casi nunca es falta de stock: el producto suele tener stock en otros lotes. Tocá para verlos."><div class="k">⚠️ Lotes negativos</div><div class="v">${negLines}</div></div>
      <div class="hm clk ${g.torcido.length?'bad':'good'}" onclick="irTab('valuacion')" title="Productos donde Odoo perdió el valor del stock (negativo o casi cero). NO incluye los que solo están más baratos por inflación. Tocá para verlos y corregirlos."><div class="k">⚖️ Valor roto</div><div class="v">${g.torcido.length}</div></div>

      <div class="hm clk ${g.basura.length?'mid':'good'}" onclick="irTab('basura')" title="Productos de prueba con stock. Tocá para limpiarlos."><div class="k">🧹 Basura</div><div class="v">${g.basura.length}</div></div>
    </div>
   </div>`;

  const tabs=[
    ["valuacion","⚖️ Valuación",g.torcido.length],
    ["conteo","📋 Conteo físico",0],
    ["pendientes","📦 Sin entregar",PEND.filter(o=>o.dias>DIAS_COMPROMISO).length],

// Revalorización con el asistente nativo de Odoo (no genera asiento; valorización manual_periodic).
async function revalorizarUno(r){
  const wiz=await rpc("stock.valuation.layer.revaluation","create",[{product_id:r.id,company_id:1,added_value:0,reason:"Revalorización desde EyG Core · Control de Depósito"}]);
  const w=(await rpc("stock.valuation.layer.revaluation","read",[[wiz],["current_value_svl","current_quantity_svl"]]))[0];
  const qbase=(w.current_quantity_svl>0?w.current_quantity_svl:r.qty);
  const added=Math.round((qbase*r.costo - (w.current_value_svl||0))*100)/100;
  await rpc("stock.valuation.layer.revaluation","write",[[wiz],{added_value:added}]);
  await rpc("stock.valuation.layer.revaluation","action_validate_revaluation",[[wiz]]);
}
async function revalorizar(id){
  const r=DATA.find(x=>x.id===id); if(!r) return;
  if(!(r.qty>0)){ alert("Este producto no tiene stock positivo. Primero ajustá la cantidad en Conteo físico."); return; }
  if(!(r.costo>0)){ alert("No tiene costo cargado. Andá a la pestaña Sin costo y cargale el costo primero."); return; }
  const objetivo=Math.round(r.valObj);
  if(!confirm(`Corregir la valuación de "${cleanName(r.name)}":\n\n• Hoy Odoo dice:  ${money(r.val)}${r.val<0?"   (imposible)":""}\n• Va a quedar:  ${money(objetivo)}   (= ${nf(r.qty)} u × ${money(r.costo)})\n\nUsa la herramienta oficial de Odoo. No toca la contabilidad. ¿Confirmás?`)) return;
  try{ await revalorizarUno(r); toast("✓ Corregido a "+money(objetivo)); VAL.sel.delete(id); await cargar(); }
  catch(e){ alert("No se pudo corregir: "+(e.message||e)); }
}
async function revalorizarSel(){
  const ids=[...VAL.sel]; const list=grupo("torcido").filter(r=>ids.includes(r.id) && r.qty>0 && r.costo>0);
  if(!list.length){ alert("Seleccioná al menos un producto (con stock y costo)."); return; }
  const totObj=list.reduce((a,r)=>a+Math.round(r.valObj),0);
  if(!confirm(`Corregir la valuación de ${list.length} productos.\nQuedarán valuados en ${money(totObj)} en total (cantidad × costo motor).\nHerramienta oficial de Odoo, no toca la contabilidad. ¿Seguir?`)) return;
  let ok=0,err=0;
  for(const r of list){ try{ await revalorizarUno(r); ok++; toast(`Corrigiendo… ${ok}/${list.length}`); }catch(e){ err++; } }
  VAL.sel.clear();
  toast(`✓ ${ok} corregidos${err?` · ${err} con error`:""}`);
  await cargar();
}

// ===================== TAB CONTEO FÍSICO (consolidación por producto → lote) =====================
// Martina cuenta lo FÍSICO. El conteo ajusta el stock real en Odoo; el disponible se recalcula solo.
// El "reservado" no se muestra (no es relevante para contar); si una reserva pegada traba el ajuste,
// se libera por debajo automáticamente.
// Anomalía de un lote (lo "raro" que hay que priorizar). null = normal.
// Cada una trae una explicación EN CRIOLLO de qué es y qué hacer (se muestra a la vista, no en tooltip).
function anomLote(qn){
  if(qn.qty<0) return {cls:'neg',txt:'⚠️ en negativo',
    help:'El sistema dice que hay <b>menos que cero</b>, y eso es imposible. Es un error de carga. Contá lo que hay <b>realmente</b> en el depósito y tocá <b>Guardar</b> para dejarlo bien.'};
  if(!qn.lot && qn.qty!==0) return {cls:'slot',txt:'🏷️ sin N° de lote',
    help:'Hay stock cargado <b>sin número de lote</b>. Tocá <b>🏷️＋</b> para ponerle el lote y su vencimiento (o <b>🗑️</b> si no corresponde).'};
  if(qn.qty===0 && qn.res>0) return {cls:'ghost',txt:'🔒 sin stock, apartado por error',
    help:`No hay stock físico (0), pero el sistema tiene <b>${nf(qn.res)} u apartadas</b> para un pedido que <b>ya no existe</b> — quedó colgado de una entrega vieja. <b>No hay nada para contar acá.</b> Tocá <b>🗑️</b> para limpiar esta línea.`};
  return null;
}
function prodRaro(r){ return r.quants.some(anomLote); }
function lotesConStock(r){ return r.quants.filter(q=>q.qty!==0||q.res>0); }              // lotes "con algo" (para el conteo del header)
function lotesOrden(r){ return r.quants.slice().sort((a,b)=>{ const ra=anomLote(a)?0:1, rb=anomLote(b)?0:1; return ra!==rb?ra-rb:(b.qty||0)-(a.qty||0); }); } // rarezas primero
function prodsConteo(){
  const q=CONT.q.toLowerCase();
  let arr=DATA.filter(r=>r.clase!=="basura");
  // se incluye si tiene lotes con stock, o alguna rareza, o coincide con la búsqueda (así se puede contar hasta un producto en 0)
  arr=arr.filter(r=> lotesConStock(r).length>0 || prodRaro(r) || (q&&(r.name.toLowerCase().includes(q)||(r.code||"").toLowerCase().includes(q))) );
  if(CONT.cat!=="todos") arr=arr.filter(r=>r.catTop===CONT.cat);
  if(q) arr=arr.filter(r=>r.name.toLowerCase().includes(q)||(r.code||"").toLowerCase().includes(q));
  if(CONT.filtro==="neg") arr=arr.filter(r=>r.quants.some(x=>x.qty<0));
  if(CONT.filtro==="raro") arr=arr.filter(prodRaro);
  // los raros primero, después alfabético
  return arr.sort((a,b)=>{ const ra=prodRaro(a)?0:1, rb=prodRaro(b)?0:1; return ra!==rb?ra-rb:a.name.localeCompare(b.name); });
}
function diasVto(d){ try{ return Math.round((new Date(d+"T00:00:00")-new Date(EYG.argToday()+"T00:00:00"))/86400000); }catch(e){ return 99999; } }
function fmtFecha(d){ const p=String(d).split("-"); return p.length===3?`${p[2]}/${p[1]}/${p[0].slice(2)}`:d; }
function vtoDe(qn){ const d=qn.lot&&EXP[qn.lot]; if(!d) return ""; const dd=diasVto(d); return `<span class="vtochip ${dd<180?'corto':''}" title="Vencimiento del lote">⏳ ${fmtFecha(d)}</span>`; }
function fmtTs(ts){ try{ return new Date(ts).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
function ultConteo(qn,pid){ const u=ULT[pid+"|"+(qn.lot||0)]; if(!u) return ""; return `<div class="ultc">✓ último conteo: ${fmtTs(u.ts)}${u.email?` · ${esc(String(u.email).split("@")[0])}`:""}</div>`; }

// aplica el conteo; si Odoo lo traba por una reserva pegada, la libera y reintenta
async function aplicarConteo(qid, contado){
  try{
    await rpc("stock.quant","write",[[qid],{inventory_quantity:contado}],{context:ES});
    await rpc("stock.quant","action_apply_inventory",[[qid]]);
  }catch(e){
    try{ await rpc("stock.quant","write",[[qid],{reserved_quantity:0}],{context:ES}); }catch(_){}
    await rpc("stock.quant","write",[[qid],{inventory_quantity:contado}],{context:ES});
    await rpc("stock.quant","action_apply_inventory",[[qid]]);
  }
}
async function guardarConteo(qid,key){
  const inp=document.getElementById(key); if(!inp) return;
  const v=inp.value.trim().replace(",","."); if(v===""||isNaN(parseFloat(v))) return;
  const contado=parseFloat(v), sis=parseFloat(inp.dataset.sis);
  let r=null,qn=null; for(const x of DATA){ const f=x.quants.find(q=>q.id===qid); if(f){r=x;qn=f;break;} }
  if(!qn) return;
  const btn=document.getElementById("btn-"+key); if(btn){btn.disabled=true;btn.textContent="…";}
  try{
    await aplicarConteo(qid, contado);
    registrarConteo({ email:(PERFIL&&PERFIL.email)||null, product_id:r.id, product_name:cleanName(r.name), lot_id:qn.lot||null, lot_name:qn.lotName||null, sistema:sis, contado, diff:Math.round((contado-sis)*100)/100, accion:'ajuste' });
    // actualización local (sin recargar todo): el lote y el total del producto
    qn.qty=contado; qn.res=Math.min(qn.res||0,contado>0?qn.res:0);
    r.qty=Math.round(r.quants.reduce((a,q)=>a+q.qty,0)*100)/100; r.disp=Math.round((r.qty-r.res)*100)/100;
    r.val=r.qty*r.costo; r.valObj=r.qty*r.costo; r.dif=r.val-r.valObj; r.clase=clasificar(r);
    ULT[r.id+"|"+(qn.lot||0)]={ ts:new Date().toISOString(), email:(PERFIL&&PERFIL.email)||"", contado };
    toast("✓ Guardado: "+nf(contado)+" u");
    // refrescar solo esta card
    const card=document.getElementById("lot-"+qid); if(card){ if(contado===0){ card.remove(); } else { card.outerHTML=lotConteo(r,qn); } bindInputsConteo(); }
    const phs=document.getElementById("phs-"+r.id); if(phs) phs.innerHTML=`<b class="${r.qty<0?'neg':''}">${nf(r.qty)}</b><span>en sistema${lotesConStock(r).length>1?` · ${lotesConStock(r).length} lotes`:""}</span>`;
  }catch(e){
    try{ await rpc("stock.quant","write",[[qid],{inventory_quantity_set:false}],{context:ES}); }catch(_){}
    alert("No se pudo guardar: "+(e.message||e)+"\n\n(Puede ser por la unidad de medida del producto: no admite ese número.)");
    if(btn){btn.disabled=false;btn.textContent="Guardar";}
  }
}

async function guardarAsignarLote(qid){

async function guardarLoteVto(lotId,qid){
  const nombre=(document.getElementById("ed-lote").value||"").trim();
  const vto=(document.getElementById("ed-vto").value||"").trim();
  if(!nombre){ alert("El N° de lote no puede quedar vacío."); return; }
  let r=null; for(const x of DATA){ if(x.quants.some(q=>q.id===qid)){ r=x; break; } }
  try{
    await rpc("stock.lot","write",[[lotId],{name:nombre, expiration_date: vto? (vto+" 00:00:00") : false}],{context:ES});
    for(const x of DATA) for(const q of x.quants) if(q.lot===lotId) q.lotName=nombre;
    if(vto) EXP[lotId]=vto; else delete EXP[lotId];
    registrarConteo({ email:(PERFIL&&PERFIL.email)||null, product_id:r?r.id:null, product_name:r?cleanName(r.name):null, lot_id:lotId, lot_name:nombre, accion:'editar lote/vto' });
    cerrarModal(); toast("✓ Lote actualizado"); repintarBody();
  }catch(e){ alert("No se pudo guardar: "+(e.message||e)); }
}
async function eliminarLote(qid){
  let r=null,qn=null; for(const x of DATA){ const f=x.quants.find(q=>q.id===qid); if(f){r=x;qn=f;break;} } if(!qn) return;
  const conStock=qn.qty>0;
  const msg=conStock
    ? `Eliminar el lote "${qn.lotName||''}" de "${cleanName(r.name)}" (${nf(qn.qty)} u)?\n\nManda esas unidades a descarte (scrap): salen del stock y queda registrado.`
    : `Eliminar el lote "${qn.lotName||''}" de "${cleanName(r.name)}"?\n\nLo pone en 0 y lo saca del inventario.`;
  if(!confirm(msg)) return;
  try{
    if(conStock){ const vals={product_id:r.id,scrap_qty:qn.qty,location_id:qn.locId,scrap_location_id:SCRAP_LOC}; if(qn.lot)vals.lot_id=qn.lot;
      const sid=await rpc("stock.scrap","create",[vals],{context:ES}); await rpc("stock.scrap","action_validate",[[sid]]); }
    else { await aplicarConteo(qid,0); }
    registrarConteo({ email:(PERFIL&&PERFIL.email)||null, product_id:r.id, product_name:cleanName(r.name), lot_id:qn.lot||null, lot_name:qn.lotName||null, sistema:qn.qty, contado:0, diff:-qn.qty, accion:conStock?'scrap':'eliminar' });
    toast("✓ Lote eliminado"); await cargar();
  }catch(e){ alert("No se pudo eliminar: "+(e.message||e)); }
}

  return `<div class="note">📦 <b>Pedidos sin entregar.</b> Pedidos ya confirmados que todavía no salieron. Los de <b>más de ${X} días</b> (en rojo) ya <b>liberaron su stock</b> para vender (dejaron de comprometerlo): revisalos con logística — entregar cuanto antes, o <b>cancelar</b> si el pedido ya no va (los muy viejos suelen ser abandonados). <b>Cancelar</b> es reversible en Odoo; si el pedido tiene factura, primero hay que anularla allá.</div>
   <div class="count-line"><b>${PEND.length}</b> pedidos sin entregar · <b style="color:var(--red)">${viejos.length}</b> con más de ${X} días (stock ya liberado, a revisar).</div>
   <div class="tablecard">
     <div class="thead" style="grid-template-columns:1fr 1.7fr 1.2fr .6fr 1fr 190px"><div>Pedido</div><div>Cliente</div><div>Comercial</div><div class="tr-r">Días</div><div class="tr-r">Monto</div><div></div></div>
     ${rows}</div>`;
}
function abrirPedidoOdoo(id){ window.open(`${ODOO_BASE}/web#id=${id}&model=sale.order&view_type=form`,"_blank"); }
async function cancelarPedido(id){
  const o=PEND.find(x=>x.id===id); const name=o?o.name:("#"+id);
  if(!confirm(`¿Cancelar el pedido ${name}?\n\nLo pasa a "Cancelado" en Odoo y libera lo comprometido. Es reversible (se puede volver a borrador). Si tiene factura registrada, Odoo no va a dejar hasta anularla.`)) return;
  try{ await rpc("sale.order","action_cancel",[[id]],{context:ES}); toast("✓ Pedido cancelado"); PEND=await cargarPendientes(); render(); }
  catch(e){ alert("No se pudo cancelar: "+(e.message||e)+"\n\n(Si tiene factura registrada, anulala primero en Odoo.)"); }
}
