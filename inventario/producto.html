<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de producto · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<style>
  .intro{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px;font-size:13.5px;color:var(--gris);line-height:1.6}
  .intro b{color:var(--ink)}

  /* ---- buscador: la puerta de entrada del módulo ---- */
  .busca{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px}
  .buscarow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .buscarow input{flex:1;min-width:230px;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;color:var(--ink);outline:none}
  .buscarow input:focus{border-color:var(--teal-med);box-shadow:0 0 0 3px rgba(4,135,130,.12)}
  .btn{background:var(--teal);color:#fff;border:none;border-radius:11px;padding:12px 17px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .btn:hover{background:var(--teal-deep)} .btn:disabled{opacity:.5;cursor:default}
  .btn.sec{background:#fff;border:1px solid var(--line);color:var(--gris)} .btn.sec:hover{border-color:var(--teal-med);color:var(--teal-deep);background:#fff}
  .btn.mini{padding:6px 11px;font-size:12.5px;border-radius:8px}
  .btn.peli{background:#fff;border:1px solid #f0b4b4;color:#b91c1c} .btn.peli:hover{background:#fef2f2}
  .buscahint{font-size:12px;color:var(--gris2);margin-top:9px}

  /* ---- resultados ---- */
  .seccion{margin-bottom:18px}
  .sechead{font-size:12px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--teal-med);margin-bottom:9px;display:flex;align-items:center;gap:8px}
  .sechead .cnt{background:#eef6f5;color:var(--teal-deep);border-radius:20px;padding:1px 9px;font-size:11.5px;letter-spacing:0}
  .rlist{display:flex;flex-direction:column;gap:8px}
  .ritem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:border-color .12s,transform .12s}
  .ritem:hover{border-color:var(--teal-med);transform:translateX(2px)}
  .ritem .th{width:46px;height:46px;flex:0 0 46px;border-radius:9px;background:var(--agua);object-fit:contain;border:1px solid var(--line)}
  .ritem .th.ph{display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--teal-med)}
  .ritem .mid{flex:1;min-width:0}
  .ritem .nm{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.35;word-break:break-word}
  .ritem .sub{font-size:11.5px;color:var(--gris);margin-top:3px;display:flex;flex-wrap:wrap;gap:9px;align-items:center}
  .ritem .go{color:var(--teal);font-weight:800;font-size:13px;white-space:nowrap}
  .cod{font-family:ui-monospace,monospace;font-weight:700;color:var(--gris)}
  .pill{border-radius:20px;padding:1px 8px;font-size:10.5px;font-weight:800;letter-spacing:.3px}
  .pill.stock{background:#e7f6ec;color:#16794a} .pill.sin{background:#fdf0e7;color:#c2410c}
  .pill.off{background:#eef2f1;color:var(--gris2)} .pill.nuevo{background:#eaf2fd;color:#1d4ed8}

  .vacio{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--gris);font-size:13.5px}

  /* ---- ficha ---- */
  .fhead{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px;display:flex;gap:16px;flex-wrap:wrap}
  .fimg{flex:0 0 150px;display:flex;flex-direction:column;gap:7px}
  .fimg .box{width:150px;height:150px;border:1.5px dashed var(--line);border-radius:12px;background:#fbfdfd;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;cursor:pointer;transition:border-color .12s}
  .fimg .box:hover{border-color:var(--teal-med)}
  .fimg .box.drag{border-color:var(--teal);background:var(--agua)}
  .fimg .box img{width:100%;height:100%;object-fit:contain}
  .fimg .box .ph{text-align:center;color:var(--gris2);font-size:11.5px;padding:8px;line-height:1.5}
  .fimg .ops{display:flex;gap:6px;flex-wrap:wrap}
  .fmeta{flex:1;min-width:230px}
  .fmeta h2{font-size:19px;font-weight:800;color:var(--ink);line-height:1.3;word-break:break-word}
  .fmeta .linea{margin-top:8px;display:flex;flex-wrap:wrap;gap:9px;align-items:center;font-size:12.5px;color:var(--gris)}

  /* ---- bloques ---- */
  .blk{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:11px;overflow:hidden}
  .blkh{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none;transition:background .12s}
  .blkh:hover{background:#f7fbfa}
  .blk.open .blkh{border-bottom:1px solid var(--line)}
  .blkh .chev{color:var(--gris2);font-size:12px;width:12px;transition:transform .15s}
  .blk.open .blkh .chev{transform:rotate(90deg)}
  .blkh .tit{font-weight:800;font-size:14px;color:var(--ink)}
  .blkh .falta{margin-left:auto;background:#fff4ed;color:#c2410c;border:1px solid #fed7aa;border-radius:20px;padding:1px 9px;font-size:11px;font-weight:800}
  .blkb{padding:13px 16px 16px}
  .nota{font-size:12px;color:var(--gris);background:#f2faf8;border:1px solid #d7ece8;border-left:3px solid var(--teal);border-radius:9px;padding:8px 11px;line-height:1.55;margin-bottom:13px}
  .nota b{color:var(--ink)}

  .grid{display:flex;flex-wrap:wrap;gap:12px}
  .fld{display:flex;flex-direction:column;gap:5px;flex:1 1 190px;min-width:165px}
  .fld.chico{flex:0 0 130px;min-width:130px} .fld.medio{flex:1 1 250px} .fld.ancho{flex:1 1 100%}
  .fld>label{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:800;color:var(--gris2);cursor:help;display:flex;align-items:center;gap:4px}
  .fld>label .q{color:var(--teal-med);font-weight:900}
  .in,.sel,.ta{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff;outline:none}
  .in:focus,.sel:focus,.ta:focus{border-color:var(--teal-med);box-shadow:0 0 0 2px rgba(4,135,130,.12)}
  .ta{resize:vertical;min-height:62px;line-height:1.45}
  .sel[multiple]{min-height:88px}
  .ro{padding:8px 10px;border:1px dashed var(--line);border-radius:8px;font-size:13px;color:var(--gris);background:#fafcfc;min-height:35px;display:flex;align-items:center;word-break:break-word}
  .ro.vacio2{color:var(--gris2);font-style:italic;padding:8px 10px;border-style:dashed;background:#fafcfc;text-align:left;font-size:12.5px}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);cursor:pointer;padding:8px 0}
  .chk input{width:17px;height:17px;accent-color:var(--teal);cursor:pointer}
  .falta-c{border-color:#f0b775!important;background:#fffdf9}

  /* ---- sub-tablas (proveedores, embalaje, archivos, vademécum) ---- */
  .sub{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px}
  .sub .sh{background:#f7fbfa;padding:8px 12px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--gris);display:flex;align-items:center;gap:8px}
  .sub .sh .btn{margin-left:auto}
  .row{display:flex;gap:9px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
  .row .nm{flex:1 1 160px;min-width:0;font-size:13px;color:var(--ink);word-break:break-word}
  .row .in{width:auto;flex:0 0 auto}
  .row .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.4px;font-weight:800;color:var(--gris2)}
  .cell{display:flex;flex-direction:column;gap:3px}

  /* ---- vademécum: el dato con su fuente ---- */
  .vd{border-top:1px solid var(--line);padding:10px 12px}
  .vd .top{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
  .vd .campo{font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:800;color:var(--gris2);flex:0 0 130px}
  .vd .valor{font-size:13.5px;color:var(--ink);font-weight:600;flex:1;min-width:120px;word-break:break-word}
  .vd .fuente{font-size:11px;color:var(--gris2);margin-top:4px;margin-left:139px;line-height:1.5}
  .vd.prop{background:#fffdf6}
  .vd .ev{font-size:11.5px;color:var(--gris);background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:7px 0 0 139px;line-height:1.5}
  .vd .acc{display:flex;gap:6px;margin:8px 0 0 139px}
  .est{border-radius:20px;padding:1px 8px;font-size:10px;font-weight:800;letter-spacing:.3px}
  .est.propuesto{background:#fef3c7;color:#92400e} .est.aprobado{background:#e7f6ec;color:#16794a} .est.rechazado{background:#fee2e2;color:#991b1b}
  @media(max-width:620px){ .vd .fuente,.vd .ev,.vd .acc{margin-left:0} .vd .campo{flex:1 1 100%} }

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);background:var(--ink);color:#fff;padding:11px 19px;border-radius:11px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .22s;z-index:90;box-shadow:0 8px 30px rgba(0,0,0,.22)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.mal{background:#b91c1c}
  .cargando{padding:40px;text-align:center;color:var(--gris)}
  .err{background:#fef2f2;border:1px solid #fca5a5;border-left:4px solid #dc2626;border-radius:10px;padding:11px 14px;color:#991b1b;font-size:13px;margin-bottom:13px;line-height:1.55}
  .volver{background:none;border:none;color:var(--teal);font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;padding:0;margin-bottom:12px}
</style>
</head>
<body>
<div id="cont"><div class="cargando"><div class="spinner"></div>Cargando…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=58"></script>
<script src="../assets/producto.js?v=1"></script>
<script>
/* ===== Ficha de producto — el corazón del catálogo =====
   Buscar → si existe, mostrar TODO y editarlo; si no existe, crearlo (con los
   datos del registro oficial si están, o de cero).

   Toda la lógica de datos vive en assets/producto.js, compartida con el módulo
   de Ingreso de mercadería: acá está solamente la pantalla. */

let PERFIL = null;
const ST = { vista:"buscar", q:"", res:[], reg:[], buscando:false,
             f:null, vade:null, abiertos:new Set(["identidad","clasificacion","deposito"]),
             alta:null, guardando:{} };

const esc = s => EYG.esc(s);
let tToast;
function toast(msg, mal){
  let t = document.getElementById("toast");
  if(!t){ t = document.createElement("div"); t.id="toast"; document.body.appendChild(t); }
  t.className = "toast show" + (mal?" mal":"");
  t.textContent = msg;
  clearTimeout(tToast); tToast = setTimeout(()=>t.classList.remove("show"), mal?4200:2400);
}
function pintar(){ document.getElementById("cont").innerHTML = vista(); }
function vista(){
  if(ST.vista === "ficha") return vistaFicha();
  if(ST.vista === "alta")  return vistaAlta();
  return vistaBuscar();
}

/* ===================== BUSCAR ===================== */
const buscarDeb = EYG.buscador(function(v){ ST.q = v; correrBusqueda(); }, 340);

async function correrBusqueda(){
  const q = ST.q.trim();
  if(q.length < 2){ ST.res = []; ST.reg = []; ST.buscando = false; pintar(); return; }
  ST.buscando = true; pintar();
  const mio = q;
  /* Los dos carriles en paralelo: el catálogo casi siempre vuelve primero y el
     registro del Ministerio tarda más. Si el usuario siguió tipeando, se
     descarta la respuesta vieja (`mio !== ST.q`) para que no pise la nueva. */
  const [cat, reg] = await Promise.all([
    EYGP.buscarCatalogo(q, 25).catch(e=>{ console.warn(e); return []; }),
    EYGP.buscarRegistro(q).catch(()=>[]),
  ]);
  if(mio !== ST.q.trim()) return;
  ST.res = cat;
  /* Del registro oficial solo interesa lo que NO tenemos: si el GTIN ya está en
     el catálogo, mostrarlo como "nuevo" sería mentir. */
  const gtinsNuestros = new Set(cat.map(r=>String(r.barcode||"")).filter(Boolean));
  ST.reg = reg.filter(r=>{
    const g = String(r.GTIN1||r.C_BARRA||"").trim();
    return !g || !gtinsNuestros.has(g);
  });
  ST.buscando = false;
  pintar();
}

function itemCatalogo(r){
  const stock = r.qty_available||0;
  return `<div class="ritem" onclick="abrir(${r.id})">
    <img class="th" loading="lazy" src="${EYGP.urlImagen(r.id,128)}" alt=""
         onerror="this.outerHTML='<div class=&quot;th ph&quot;>📦</div>'">
    <div class="mid">
      <div class="nm">${esc(r.name)}</div>
      <div class="sub">
        <span class="cod">${esc(r.default_code||"sin código")}</span>
        ${r.barcode?`<span class="cod">⌗ ${esc(r.barcode)}</span>`:`<span class="pill sin">sin código de barras</span>`}
        ${stock>0?`<span class="pill stock">${stock.toLocaleString("es-AR")} en depósito</span>`:""}
        ${r.active===false?`<span class="pill off">archivado</span>`:""}
      </div>
    </div>
    <span class="go">Abrir →</span>
  </div>`;
}

function itemRegistro(r, i){
  const g = String(r.GTIN1||r.C_BARRA||"").trim();
  return `<div class="ritem" onclick="altaDesdeRegistro(${i})">
    <div class="th ph">💊</div>
    <div class="mid">
      <div class="nm">${esc(r.NOMBRE)}${r.PRESENTACION?` <span style="color:var(--gris);font-weight:400">· ${esc(r.PRESENTACION)}</span>`:""}</div>
      <div class="sub">
        <span>${esc(r.LABORATORIO||"")}</span>
        ${r.DROGA?`<span>${esc(r.DROGA)}</span>`:""}
        ${g?`<span class="cod">⌗ ${esc(g)}</span>`:""}
        <span class="pill nuevo">no lo tenemos</span>
      </div>
    </div>
    <span class="go">Crear →</span>
  </div>`;
}

function vistaBuscar(){
  const q = ST.q.trim();
  let cuerpo = "";
  if(ST.buscando){
    cuerpo = `<div class="cargando"><div class="spinner"></div>Buscando…</div>`;
  }else if(q.length < 2){
    cuerpo = `<div class="vacio">Escribí el nombre, el código o la droga — o disparale la pistola de códigos a la caja.</div>`;
  }else{
    if(ST.res.length) cuerpo += `<div class="seccion">
      <div class="sechead">En el catálogo <span class="cnt">${ST.res.length}</span></div>
      <div class="rlist">${ST.res.map(itemCatalogo).join("")}</div></div>`;
    if(ST.reg.length) cuerpo += `<div class="seccion">
      <div class="sechead">En el registro oficial del Ministerio <span class="cnt">${ST.reg.length}</span></div>
      <div class="rlist">${ST.reg.map(itemRegistro).join("")}</div></div>`;
    if(!ST.res.length && !ST.reg.length) cuerpo = `<div class="vacio">
      No aparece ni en el catálogo ni en el registro oficial.<br><br>
      <button class="btn" onclick="altaDeCero()">Crear «${esc(q)}» de cero</button></div>`;
  }

  return `<div class="intro">
      Buscá un producto por <b>nombre, código interno, código de barras o droga</b>. Si ya existe, se abre su ficha
      completa y se edita ahí mismo; si no, se puede crear — y si está en el <b>registro oficial del Ministerio</b>,
      viene casi entero cargado. Es el mismo buscador que usa el <b>Ingreso de mercadería</b>.
    </div>
    <div class="busca">
      <div class="buscarow">
        <input id="q" type="search" autocomplete="off" placeholder="Nombre, código, código de barras o droga…"
               value="${esc(ST.q)}" oninput="buscarDeb(this.value)">
        <button class="btn sec" onclick="altaDeCero()">+ Crear de cero</button>
      </div>
      <div class="buscahint">Si escribís solo números se busca <b>exacto</b> por código de barras o código interno — así funciona la pistola lectora.</div>
    </div>
    ${cuerpo}`;
}

/* ===================== ABRIR LA FICHA ===================== */
async function abrir(tmplId){
  document.getElementById("cont").innerHTML = `<div class="cargando"><div class="spinner"></div>Abriendo la ficha…</div>`;
  try{
    ST.f = await EYGP.leer(tmplId);
    ST.vade = null;
    ST.vista = "ficha";
    pintar();
    /* El vademécum es Supabase: se carga después para que no frene la ficha. */
    EYGP.vade(tmplId).then(v=>{ ST.vade = v; if(ST.vista==="ficha" && ST.f && ST.f.tmplId===tmplId) pintar(); });
  }catch(e){
    ST.vista = "buscar"; pintar();
    toast(e.message, true);
  }
}
function volver(){ ST.vista="buscar"; ST.f=null; ST.vade=null; ST.alta=null; pintar();
  setTimeout(()=>{ const i=document.getElementById("q"); if(i) i.focus(); },30); }
function toggleBlk(k){ if(ST.abiertos.has(k)) ST.abiertos.delete(k); else ST.abiertos.add(k); pintar(); }

/* ===================== LOS CAMPOS ===================== */
function valorDe(t, def){
  const v = t[def.f];
  if(def.tipo === "m2o") return (v && Array.isArray(v)) ? v[0] : "";
  if(def.tipo === "m2m") return v || [];
  if(def.tipo === "bool") return !!v;
  if(v === false || v == null) return "";
  return v;
}
function vacioCampo(t, def){
  const v = valorDe(t, def);
  if(def.tipo === "bool") return false;              /* un "no" no es un faltante */
  if(def.tipo === "m2m")  return !v.length;
  return v === "" || v === 0;
}

function campoHTML(def, t, modo){
  const v = valorDe(t, def);
  const id = "c_" + def.f;
  const ancho = def.ancho ? " " + def.ancho : "";
  const lbl = `<label for="${id}" title="${esc(def.ayuda||"")}">${esc(def.lbl)} <span class="q">?</span></label>`;
  const onch = modo==="alta" ? `onchange="altaSet('${def.f}',this)"` : `onchange="guardarCampo('${def.f}',this)"`;
  let ctrl = "";

  switch(def.tipo){
    case "ro":
      ctrl = `<div class="ro${v===""?" vacio2":""}">${v===""?"—":esc(Array.isArray(t[def.f])?t[def.f][1]:v)}${
        def.f==="die_code" && t.is_die_canceled ? ' <span class="pill sin" style="margin-left:7px">anulado</span>' : ""}</div>`;
      break;
    case "bool":
      ctrl = `<label class="chk"><input type="checkbox" id="${id}" ${v?"checked":""} ${onch}> ${v?"Sí":"No"}</label>`;
      break;
    case "text":
      ctrl = `<textarea class="ta" id="${id}" ${onch}>${esc(v)}</textarea>`;
      break;
    case "sel": {
      const ops = [["","—"]].concat(def.opts);
      ctrl = `<select class="sel" id="${id}" ${onch}>${ops.map(o=>
        `<option value="${esc(o[0])}" ${String(o[0])===String(v)?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`;
      break;
    }
    case "m2o": {
      const ops = [["","—"]].concat(EYGP.CAT[def.cat]||[]);
      ctrl = `<select class="sel" id="${id}" ${onch}>${ops.map(o=>
        `<option value="${o[0]}" ${String(o[0])===String(v)?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`;
      break;
    }
    case "m2m": {
      const sel = new Set((v||[]).map(Number));
      ctrl = `<select class="sel" multiple id="${id}" ${onch}>${(EYGP.CAT[def.cat]||[]).map(o=>
        `<option value="${o[0]}" ${sel.has(o[0])?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`;
      break;
    }
    case "num": case "money":
      ctrl = `<input class="in" type="number" step="any" id="${id}" value="${v===""?"":v}" ${onch}>`;
      break;
    default:
      ctrl = `<input class="in" type="text" id="${id}" value="${esc(v)}" ${onch}
                ${def.escanea?'inputmode="numeric" placeholder="Escaneá o tipeá el código"':""}>`;
  }
  return `<div class="fld${ancho}">${lbl}${ctrl}</div>`;
}

function leerControl(def, el){
  switch(def.tipo){
    case "bool": return el.checked;
    case "m2m":  return [...el.selectedOptions].map(o=>parseInt(o.value,10));
    default:     return el.value;
  }
}

async function guardarCampo(campo, el){
  const def = EYGP.campoDef(campo);
  const valor = leerControl(def, el);
  el.disabled = true;
  try{
    const guardado = await EYGP.guardar(ST.f.tmplId, campo, valor);
    /* Se refleja lo que quedó en Odoo, no lo que se tipeó. */
    if(def.tipo === "m2o")      ST.f.t[campo] = guardado ? [guardado, EYGP.nombreDe(def.cat, guardado)] : false;
    else if(def.tipo === "m2m") ST.f.t[campo] = valor;
    else                        ST.f.t[campo] = guardado;
    toast("Guardado ✓");
    if(def.tipo==="bool" || def.tipo==="m2o") pintar();   /* cambian etiquetas visibles */
  }catch(e){
    toast(e.message, true);
    pintar();                                            /* deja a la vista el valor real */
  }finally{ el.disabled = false; }
}

/* ---- proveedores ---- */

  const s = ST.f.sellers || [];

      <div class="cell"><span class="lbl">Código del proveedor</span>

               onchange="guardarProv(${x.id},'product_code',this.value)"></div>
      <div class="cell"><span class="lbl">Precio</span>

async function guardarProv(id, campo, valor){
  const vals = {}; vals[campo] = (campo==="product_code") ? (valor||false) : (parseFloat(String(valor).replace(",","."))||0);
  try{ await EYGP.guardarProveedor(id, vals);
       const s = ST.f.sellers.find(x=>x.id===id); if(s) s[campo]=vals[campo];
       toast("Guardado ✓"); }
  catch(e){ toast(e.message, true); }
}
async function borrarProv(id){
  if(!confirm("¿Quitar este proveedor del producto?")) return;
  try{ await EYGP.quitarProveedor(id);
       ST.f.sellers = ST.f.sellers.filter(x=>x.id!==id);
       toast("Proveedor quitado"); pintar(); }
  catch(e){ toast(e.message, true); }
}
async function nuevoProv(){
  const q = prompt("Nombre o CUIT del proveedor:");
  if(!q) return;
  try{
    const cands = await EYGP.buscarProveedor(q);
    if(!cands.length) return toast("No encontré ningún contacto con ese nombre.", true);
    let elegido = cands[0];
    if(cands.length > 1){
      const txt = cands.map((c,i)=>`${i+1}. ${c.name}${c.vat?" ("+c.vat+")":""}`).join("\n");
      const n = prompt("¿Cuál?\n\n"+txt, "1");
      const i = parseInt(n,10) - 1;
      if(isNaN(i) || !cands[i]) return;
      elegido = cands[i];
    }
    const id = await EYGP.agregarProveedor(ST.f.tmplId, elegido.id, {});
    ST.f.sellers.push({id, partner_id:[elegido.id, elegido.name], product_code:"", price:0, min_qty:0, delay:0});
    toast("Proveedor agregado ✓"); pintar();
  }catch(e){ toast(e.message, true); }
}

/* ---- imagen ---- */
function elegirImagen(inp){ if(inp.files && inp.files[0]) subirImg(inp.files[0]); }
function soltarImagen(ev){
  ev.preventDefault();
  const b = document.getElementById("imgbox"); if(b) b.classList.remove("drag");

async function subirImg(file){
  if(!/^image\//.test(file.type||"")) return toast("Eso no es una imagen.", true);
  toast("Subiendo la foto…");
  try{
    const b64 = await EYGP.subirImagen(ST.f.tmplId, file);
    const img = document.getElementById("imgprev");
    if(img){ img.src = "data:image/jpeg;base64,"+b64; img.style.display="block";
             if(img.nextElementSibling) img.nextElementSibling.style.display="none"; }
    toast("Foto guardada ✓");
  }catch(e){ toast(e.message, true); }
}
async function quitarImagen(){
  if(!confirm("¿Quitar la foto de este producto?")) return;
  try{ await EYGP.borrarImagen(ST.f.tmplId); toast("Foto quitada"); pintar(); }
  catch(e){ toast(e.message, true); }
}
/* Pegar con Ctrl+V: sirve para la foto que manda el laboratorio por WhatsApp. */
document.addEventListener("paste", function(ev){
  if(ST.vista !== "ficha" || !ST.f) return;
  const it = [...(ev.clipboardData ? ev.clipboardData.items : [])].find(x=>/^image\//.test(x.type));
  if(!it) return;
  const f = it.getAsFile(); if(f){ ev.preventDefault(); subirImg(f); }
});

/* ---- vademécum: el dato con su fuente, y las propuestas a revisar ---- */
function blkVademecum(){
  const abierto = ST.abiertos.has("vademecum");
  const v = ST.vade;
  const props = v ? v.datos.filter(d=>d.estado==="propuesto") : [];
  let cuerpo;
  if(!v){
    cuerpo = `<div class="cargando" style="padding:18px">Consultando el vademécum…</div>`;
  }else if(!v.datos.length){
    cuerpo = `<div class="nota">Este producto todavía no tiene datos en el vademécum.
      Los cargan solas las tareas que consultan el registro oficial del Ministerio y ANMAT.</div>`;
  }else{
    const orden = {propuesto:0, aprobado:1, rechazado:2};
    cuerpo = v.datos.slice()
      .sort((a,b)=>(orden[a.estado]??3)-(orden[b.estado]??3) || String(a.campo).localeCompare(b.campo))
      .map(d=>`<div class="vd ${d.estado==="propuesto"?"prop":""}">
        <div class="top">
          <span class="campo">${esc(EYGP.CAMPO_LBL[d.campo]||d.campo)}</span>
          <span class="valor">${esc(d.valor)}</span>
          <span class="est ${esc(d.estado)}">${esc(d.estado)}</span>
        </div>
        <div class="fuente">${esc(EYGP.FUENTE_LBL[d.fuente]||d.fuente)} · consultado el ${esc(d.fecha_consulta||"—")} · ${esc(d.metodo||"")}</div>
        ${d.estado==="propuesto" && d.evidencia?`<div class="ev">${esc(d.evidencia)}</div>`:""}
        ${d.estado==="propuesto"?`<div class="acc">
          <button class="btn mini" onclick="vadeOk(${d.id},'aprobado')">✓ Confirmar</button>
          <button class="btn mini peli" onclick="vadeOk(${d.id},'rechazado')">✗ Rechazar</button>
        </div>`:""}
      </div>`).join("");
  }
  return `<div class="blk ${abierto?"open":""}">
    <div class="blkh" onclick="toggleBlk('vademecum')">
      <span class="chev">▶</span><span>💊</span><span class="tit">Vademécum — lo que Odoo no guarda</span>
      ${props.length?`<span class="falta" title="Hay datos propuestos esperando que alguien los confirme">${props.length} a revisar</span>`:""}
    </div>
    ${abierto?`<div class="blkb" style="padding:0">
      <div class="blkb" style="padding-bottom:0"><div class="nota">
        Vía, forma, condición de venta, acción terapéutica, ATC y el GTIN propuesto. Cada dato guarda
        <b>de dónde salió y cuándo</b>. Lo que entró por parecido queda en <b>propuesto</b> hasta que alguien lo mire:
        si tenés la caja en la mano, sos la persona indicada para confirmarlo.
      </div></div>${cuerpo}
    </div>`:""}
  </div>`;
}

    toast(estado==="aprobado" ? "Confirmado ✓" : "Rechazado");
    pintar();
  }catch(e){
    toast("No se pudo guardar: "+e.message, true);
  }

    </div>` : `<div class="nota" style="margin-bottom:14px">

      <button class="btn sec" onclick="volver()">Cancelar</button>
    </div>`;

async function crearProducto(){
  const b = document.getElementById("btncrear");
  b.disabled = true; b.textContent = "Creando…";
  try{
    /* Los valores se pasan por el mismo convertidor que usa el guardado, para
       que un alta y una edición escriban exactamente igual en Odoo. */
    const vals = {};
    Object.keys(ST.alta.vals).forEach(k=>{
      const def = EYGP.campoDef(k);
      const v = ST.alta.vals[k];
      if(v === "" || v == null) return;
      vals[k] = def ? EYGP.aOdoo(def, v) : v;
    });
    const id = await EYGP.crear(vals);
    toast("Producto creado ✓");

    /* Lo que no tiene campo en Odoo va al vademécum, con su fuente y su fecha.
       Si esto falla, el producto YA está creado: se avisa y no se pierde nada. */
    if(ST.alta.vade && ST.alta.vade.length){
      try{ await guardarVadeAlta(id, ST.alta.vade, ST.alta.origen); }
      catch(e){ toast("El producto se creó, pero los datos del vademécum no: "+e.message, true); }
    }
    ST.alta = null;
    abrir(id);
  }catch(e){
    toast(e.message, true);
    b.disabled = false; b.textContent = "Crear el producto";
  }
}

/* Escribe en las tablas del vademécum que YA existen — no se creó ninguna nueva.
   Entra como `propuesto`: lo trajo una fuente automática, así que respeta el
   mismo candado que el resto del vademécum. */
async function guardarVadeAlta(tmplId, pares, crudo){
  const sb = EYG.supa();
  const {data:ins, error:e1} = await sb.from("vademecum_producto")
    .insert([{tmpl:tmplId, codigo:null, nombre:String(crudo&&crudo.NOMBRE||"").slice(0,200), revision:"a_revisar"}])
    .select("id");
  if(e1) throw new Error(e1.message);
  const pid = ins && ins[0] && ins[0].id;
  if(!pid) throw new Error("No se pudo registrar el producto en el vademécum.");
  const hoy = EYG.argToday();
  const filas = pares.map(([campo, valor])=>({
    ambito:"producto", producto_id:pid, campo, valor:String(valor),
    fuente:"precios_medicamentos", fecha_consulta:hoy,
    url:"https://www.argentina.gob.ar/precios-de-medicamentos",
    metodo:"exacto", estado:"propuesto",
    evidencia:`Alta del producto desde el registro oficial: "${crudo&&crudo.NOMBRE}" (${crudo&&crudo.LABORATORIO}, ${crudo&&crudo.PRESENTACION}). El dato viene del mismo registro que se eligió al crearlo.`,
  }));
  const {error:e2} = await sb.from("vademecum_dato").insert(filas);
  if(e2) throw new Error(e2.message);
}
