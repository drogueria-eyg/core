<html lang="es">
<head>
<meta charset="UTF-8">

<style>
  .intro{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px;font-size:13.5px;color:var(--gris);line-height:1.65}
  .intro b{color:var(--ink)}
  .intro details{margin-top:10px}
  .intro summary{cursor:pointer;color:var(--teal);font-weight:700}
  .intro ol{margin:10px 0 0 18px;padding:0} .intro ol li{margin-bottom:6px}
  .intro code{background:#eef6f5;color:var(--teal-deep);padding:1px 6px;border-radius:5px;font-family:ui-monospace,monospace}

  .kpis{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow);min-width:130px}
  .kpi .n{font-size:22px;font-weight:900;color:var(--ink);line-height:1}
  .kpi .l{font-size:11.5px;color:var(--gris);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .toolbar input[type=search]{flex:1;min-width:210px;padding:9px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit}
  .pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:700;color:var(--gris);cursor:pointer;transition:all .12s}
  .pill:hover{border-color:var(--teal-med)}
  .pill.active{background:var(--teal);color:#fff;border-color:var(--teal)}
  .btn{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}
  .btn:hover{background:var(--teal-deep)} .btn:disabled{opacity:.45;cursor:default}
  .btn.ghost{background:#fff;color:var(--gris);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--teal-med);background:#f7fbfa}

  .barra{position:sticky;top:0;z-index:5;background:var(--agua);border:1px solid var(--teal-med);border-radius:12px;
    padding:11px 15px;margin-bottom:12px;display:none;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow)}
  .barra.on{display:flex}
  .barra .cnt{font-weight:900;color:var(--teal-deep);font-size:14px}

  .lista{display:flex;flex-direction:column;gap:10px}
  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px rgba(6,65,62,.07);display:flex;gap:12px;align-items:flex-start}
  .pcard.sel{border-color:var(--teal);background:#f7fbfa}
  .pcard.hecho{opacity:.55}
  .pcard input[type=checkbox]{margin-top:3px;width:17px;height:17px;cursor:pointer;flex:0 0 auto}
  .pc-body{flex:1;min-width:0}
  .pc-nom{font-weight:800;color:var(--ink);font-size:14px;line-height:1.35}
  .pc-meta{font-size:12.5px;color:var(--gris);margin-top:4px}
  .pc-meta span{margin-right:14px;white-space:nowrap}
  .pc-meta b{color:var(--ink);font-weight:700}
  .tags{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11.5px;font-weight:700;border-radius:7px;padding:3px 8px}
  .tag.ok{background:var(--okbg);color:var(--ok)}
  .tag.bad{background:var(--badbg);color:var(--bad)}
  .tag.warn{background:var(--warnbg);color:var(--warn)}
  .tag.info{background:#eef6f5;color:var(--teal-deep)}
  .pc-act{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
  .pc-act .btn{padding:7px 12px;font-size:12px}
  .gemela{margin-top:8px;padding:8px 11px;background:#f7fbfa;border:1px dashed var(--line);border-radius:9px;font-size:12.5px;color:var(--gris)}
  .gemela b{color:var(--ink)}
  .vacio{text-align:center;padding:50px 20px;color:var(--gris)}
  .cargando{text-align:center;padding:50px;color:var(--gris);font-size:14px}
  .log{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 15px;font-size:12.5px;color:var(--gris);max-height:240px;overflow:auto;display:none}
  .log.on{display:block} .log div{padding:3px 0;border-bottom:1px solid #f0f5f4} .log b{color:var(--ink)}

  /* ---- vista "A decidir": una sección por motivo ---- */
  .sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
       overflow:hidden;margin-bottom:14px}
  .sechead{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .sechead .ico{font-size:17px}
  .secname{font-weight:800;color:var(--ink);font-size:14.5px}
  .seccount{background:#eef6f5;color:var(--teal-deep);font-weight:800;font-size:12px;border-radius:20px;padding:2px 9px}
  .secbajada{padding:11px 16px;font-size:12.8px;color:var(--gris);line-height:1.6;background:#f7fbfa;
             border-bottom:1px solid var(--line)}
  .secbajada b{color:var(--ink)}
  .sec .lista{padding:10px;background:#eef5f4}
  .decidido{font-size:12px;font-weight:800;color:var(--ok);background:var(--okbg);border-radius:8px;
            padding:6px 11px;text-align:center;white-space:nowrap}
  .pc-act{min-width:190px}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=62"></script>
<script>
/* ============ EyG Core · Depósito · Enganches de AlfaBeta ============
   AlfaBeta no mira nuestros productos: mira UN solo campo, `alfabeta_code`.
   Cada 3 h trae los productos que cambiaron de precio y, para cada uno, busca
   en Odoo TODAS las fichas que lleven ese código y les escribe el PVP encima.
   Si no encuentra ninguna, crea una ficha nueva (así crece el vademécum).

   Consecuencia: una ficha de trabajo (hospitalario, descartable...) que quedó
   con el código -- típicamente porque se creó duplicando la del vademécum --
   recibe el PVP de AlfaBeta como precio de venta. Este módulo las lista y las
   desengancha: pone el código en cero y le asigna el interno de la casa.

   La ficha del vademécum NO se borra: es el pararrayos. Mientras exista una
   ficha con ese código, AlfaBeta le pega ahí y no crea otra. Se archiva para
   que nadie la venda por error. */

const LANG = {context:{lang:"es_AR"}};
const SINFILTRO = {context:{lang:"es_AR", active_test:false}};
const TARIFAS = [3,16,5];          // (1) Farmacias · (2) SAMCOs · (3) Instituciones
let DATOS = [], FILTRO = "riesgo", BUSCA = "", PROX = null, HECHOS = [];
const POSTERGADOS = new Set();   // "dejar así por ahora" — dura lo que dura la pantalla

const $ = s => document.querySelector(s);
const esc = EYG.esc;
const plata = n => "$" + Math.round(n||0).toLocaleString("es-AR");

/* ---------- carga ---------- */
async function cargar(){
  $("#cont").innerHTML = '<div class="cargando">Buscando productos enganchados...</div>';

  /* 1) fichas de TRABAJO con código de AlfaBeta = todo lo que no es vademécum.
        El vademécum vive en ÉTICOS o cuelga de la raíz "ALL": esos quedan afuera
        a propósito -- los éticos DEBEN conservar el código, de ahí sale su PVP. */
  const prods = await EYG.rpc("product.template","search_read",[
    [["alfabeta_code","!=",0],["active","=",true],
     ["categ_id.complete_name","not like","ETICO"],["categ_id.complete_name","!=","ALL"]],
    ["id","name","default_code","alfabeta_code","categ_id","standard_price","list_price",
     "barcode","gtins","laboratory","sale_ok","product_variant_id"]
  ], LANG);

  const codigos = [...new Set(prods.map(p => p.alfabeta_code))];
  const ids     = prods.map(p => p.id);
  const varIds  = prods.map(p => p.product_variant_id && p.product_variant_id[0]).filter(Boolean);

  // 2) las gemelas: cualquier OTRA ficha con el mismo código (normalmente, la del vademécum)
  const gemelas = codigos.length ? await EYG.rpc("product.template","search_read",[
    [["alfabeta_code","in",codigos],["id","not in",ids]],
    ["id","name","default_code","alfabeta_code","categ_id","list_price","active"]
  ], SINFILTRO) : [];
  const porCodigo = {};
  gemelas.forEach(g => { (porCodigo[g.alfabeta_code] = porCodigo[g.alfabeta_code] || []).push(g); });

  // 3) stock
  const vars = varIds.length ? await EYG.rpc("product.product","read",[varIds,["id","qty_available"]], LANG) : [];
  const stockDe = {}; vars.forEach(v => stockDe[v.id] = v.qty_available);

  /* 4) ¿tiene regla de precio propia en alguna de las 3 tarifas? Si no la tiene,
        el precio que se cobra ES el de la ficha -- o sea, el PVP que le puso
        AlfaBeta. Esos no se pueden soltar y olvidar: hay que ponerles precio. */
  const items = ids.length ? await EYG.rpc("product.pricelist.item","search_read",[
    [["pricelist_id","in",TARIFAS],"|",["product_tmpl_id","in",ids],["product_id","in",varIds]],
    ["product_tmpl_id","product_id"]
  ], LANG) : [];
  const tmplDeVar = {};
  prods.forEach(p => { if(p.product_variant_id) tmplDeVar[p.product_variant_id[0]] = p.id; });
  const conRegla = new Set();
  items.forEach(it => {
    const t = it.product_tmpl_id ? it.product_tmpl_id[0]
            : tmplDeVar[it.product_id && it.product_id[0]];
    if(t) conRegla.add(t);
  });

  /* 5) ¿qué tiene encima la ficha del vademécum? Archivar NO borra nada: las
        facturas, los pedidos y los movimientos viejos quedan intactos y se
        revierte con un clic. Lo único que frena el archivado es el STOCK: si
        tiene unidades, archivarla esconde mercadería que existe de verdad en
        el depósito. Las ventas y compras viejas se informan, pero no frenan. */
  const gIds  = gemelas.map(g => g.id);
  const gVars = gIds.length ? await EYG.rpc("product.product","search_read",[
    [["product_tmpl_id","in",gIds]], ["id","product_tmpl_id","qty_available"]
  ], SINFILTRO) : [];
  const gvIds = gVars.map(v => v.id);
  const contar = async (model, estados) => {
    if(!gvIds.length) return {};
    const r = await EYG.rpc(model,"read_group",[
      [["product_id","in",gvIds],["state","in",estados]], [], ["product_id"]
    ], {lazy:true, context:{lang:"es_AR"}});
    const o = {}; r.forEach(x => o[x.product_id[0]] = x.product_id_count); return o;
  };
  const vend = await contar("sale.order.line",     ["sale","done"]);
  const comp = await contar("purchase.order.line", ["purchase","done"]);
  const histDe = {};
  gVars.forEach(v => {
    const t = v.product_tmpl_id[0];
    const h = histDe[t] = histDe[t] || {stock:0, ventas:0, compras:0};
    h.stock   += v.qty_available || 0;
    h.ventas  += vend[v.id] || 0;
    h.compras += comp[v.id] || 0;
  });
  gemelas.forEach(g => {
    g.hist    = histDe[g.id] || {stock:0, ventas:0, compras:0};
    g.conStock= g.hist.stock > 0;                                   // el único freno real
    g.usada   = !!(g.hist.ventas || g.hist.compras);                // tuvo movimiento alguna vez
  });

  // 6) próximo código interno libre de la serie 153xxx que usa Depósito
  const serie = await EYG.rpc("product.template","search_read",[
    [["default_code","=like","153%"]], ["default_code"]
  ], SINFILTRO);
  const nums = serie.map(x => parseInt(x.default_code,10)).filter(n => n >= 153000 && n < 154000);
  PROX = (nums.length ? Math.max(...nums) : 153000) + 1;

  DATOS = prods.map(p => {
    const g  = porCodigo[p.alfabeta_code] || [];
    const gv = g.find(x => /ETICO/.test(x.categ_id[1]) || x.categ_id[1] === "ALL") || g[0] || null;
    return Object.assign({}, p, {
      stock:    stockDe[p.product_variant_id && p.product_variant_id[0]] || 0,
      regla:    conRegla.has(p.id),
      gemela:   gv,
      codigoAB: /^AB\d+$/.test(p.default_code || ""),   // arrastró el código AB#####
      pisado:   p.list_price > 100,                      // le cayó un PVP encima
      hecho:    false
    });
  });
  // el peligro primero: sin regla de precio y con PVP encima
  DATOS.sort((a,b) => (riesgo(b) - riesgo(a)) || String(a.name).localeCompare(String(b.name),"es"));
  pintar();
}

// 2 = hoy se cobra el PVP de AlfaBeta · 1 = sin regla, queda expuesto · 0 = tranquilo
function riesgo(p){ if(!p.regla && p.pisado) return 2; if(!p.regla) return 1; return 0; }

/* "Sin riesgo" = soltarlo no cambia ningún precio (el producto tiene tarifa propia),
   hay ficha del vademécum haciendo de pararrayos, y esa ficha no tiene stock. Que
   tenga ventas o compras viejas no molesta: archivar no borra la historia. */
function esSeguro(p){ return p.regla && p.gemela && !p.gemela.conStock; }

/* Los que NO son "sin riesgo" necesitan que alguien decida, y el motivo cambia
   la decisión. Son excluyentes y en este orden de gravedad. */
function motivo(p){
  if(!p.regla)                             return "precio";     // el precio que se cobra es el de la ficha
  if(p.gemela && p.gemela.conStock)        return "stock";      // archivarla escondería mercadería
  if(!p.gemela)                            return "singemela";  // AlfaBeta se va a fabricar la suya
  return null;
}
const GRUPOS = [
  {k:"precio", ico:"💸", titulo:"Sin precio propio en las tarifas",
   bajada:"El precio que se cobra <b>es el de la ficha</b>, y ahí es donde escribe AlfaBeta. Soltarlo corta el problema " +
          "hacia adelante, pero el precio que quedó puesto sigue vivo hasta que alguien le ponga uno de verdad. " +
          "Por eso está el botón para sacarlo de la venta mientras tanto."},
  {k:"stock", ico:"📦", titulo:"La ficha del vademécum tiene stock",
   bajada:"Soltarlo es seguro. Lo que no se puede hacer a ciegas es <b>archivar</b> esa ficha: hay unidades cargadas ahí " +
          "y esconderla dejaría mercadería fantasma en el depósito. Primero hay que decidir qué pasa con esas unidades."},
  {k:"singemela", ico:"🆕", titulo:"No tienen ficha en el vademécum",
   bajada:"Nadie está haciendo de pararrayos. Al soltarlo, la próxima vez que AlfaBeta cambie el precio de ese producto " +
          "<b>va a crear su propia ficha</b> en el vademécum. Nace limpia, sin stock ni historia, y después se archiva. " +
          "No es un problema, pero conviene saber que van a aparecer."}
];

/* ---------- pintado ---------- */
function pintar(){
  const total    = DATOS.length;
  const cobran   = DATOS.filter(p => riesgo(p) === 2).length;
  const sinRegla = DATOS.filter(p => !p.regla).length;
  const conAB    = DATOS.filter(p => p.codigoAB).length;
  const seguros  = DATOS.filter(esSeguro).length;
  const decidir  = DATOS.filter(p => !esSeguro(p) && !p.hecho).length;

  const vis = DATOS.filter(p => {
    if(p.hecho) return FILTRO !== "decidir";
    if(FILTRO === "riesgo"  && p.regla) return false;
    if(FILTRO === "seguros" && !esSeguro(p)) return false;
    if(FILTRO === "decidir" && esSeguro(p)) return false;
    if(FILTRO === "ab"      && !p.codigoAB) return false;
    if(BUSCA){
      const t = (p.name + " " + p.default_code + " " + (p.categ_id ? p.categ_id[1] : "")).toLowerCase();
      if(!t.includes(BUSCA)) return false;
    }
    return true;
  });

  $("#cont").innerHTML =
    '<div class="intro">' +
      '<b>Qué es esto.</b> AlfaBeta no mira nuestros productos: mira un solo campo, el <code>Código Alfa Beta</code>. ' +
      'Cada 3 horas trae los productos que cambiaron de precio y le escribe el PVP encima a <b>todas</b> las fichas ' +
      'que lleven ese código, sin importar la categoría ni el nombre.' +
      '<details><summary>Cómo se engancha un producto nuestro, y cómo se suelta</summary><ol>' +
        '<li>Al <b>duplicar</b> una ficha del vademécum para crear un producto propio, el duplicado nace con el ' +
            'código puesto. Eso está bien: así se trae el laboratorio, la droga, la acción terapéutica, el ATC y ' +
            'el GTIN. Lo que falta es soltarlo después.</li>' +
        '<li><b>Desenganchar</b> pone el código en cero. A partir de ahí AlfaBeta no lo toca nunca más, y si el ' +
            'producto tenía código <code>AB#####</code> se le asigna el interno de la casa (153xxx).</li>' +
        '<li>La ficha del vademécum <b>no se borra</b>: es el pararrayos. Mientras exista, AlfaBeta le pega ahí. ' +
            'Si la borráramos, se fabricaría otra sola. Se <b>archiva</b> para que nadie la venda por error.</li>' +
        '<li>Los <b>éticos de verdad no van acá</b> y este módulo ni los muestra: ellos tienen que conservar el ' +
            'código, es de donde sale su precio.</li>' +
      '</ol></details>' +
    '</div>' +

    '<div class="kpis">' +
      '<div class="kpi"><div class="n">' + total + '</div><div class="l">enganchados</div></div>' +
      '<div class="kpi ' + (cobran ? "bad" : "good") + '"><div class="n">' + cobran + '</div><div class="l">se cobran al PVP</div></div>' +
      '<div class="kpi ' + (sinRegla ? "warn" : "good") + '"><div class="n">' + sinRegla + '</div><div class="l">sin precio propio</div></div>' +
      '<div class="kpi"><div class="n">' + conAB + '</div><div class="l">con código AB</div></div>' +
      '<div class="kpi good"><div class="n">' + HECHOS.length + '</div><div class="l">soltados hoy</div></div>' +
    '</div>' +

    '<div class="toolbar">' +
      '<div class="pill ' + (FILTRO==="riesgo"?"active":"")  + '" data-f="riesgo">Los expuestos (' + sinRegla + ')</div>' +
      '<div class="pill ' + (FILTRO==="seguros"?"active":"") + '" data-f="seguros">Sin riesgo (' + seguros + ')</div>' +
      '<div class="pill ' + (FILTRO==="decidir"?"active":"") + '" data-f="decidir">A decidir (' + decidir + ')</div>' +
      '<div class="pill ' + (FILTRO==="ab"?"active":"")      + '" data-f="ab">Con código AB (' + conAB + ')</div>' +
      '<div class="pill ' + (FILTRO==="todos"?"active":"")   + '" data-f="todos">Todos (' + total + ')</div>' +
      '<input type="search" id="q" placeholder="Buscar por nombre, código o categoría..." value="' + esc(BUSCA) + '">' +
    '</div>' +

    (FILTRO === "decidir" ? "" :
      '<div class="barra" id="barra">' +
        '<span class="cnt" id="bcnt"></span>' +
        '<button class="btn" id="bsoltar">Desenganchar de AlfaBeta</button>' +
        '<button class="btn ghost" id="barch">Desenganchar y archivar la del vademécum</button>' +
        '<button class="btn ghost" id="bnada">Deseleccionar</button>' +
      '</div>') +

    (FILTRO === "decidir"
      ? listaDecidir(vis)
      : '<div class="lista">' + (vis.length ? vis.map(p => tarjeta(p)).join("")
          : '<div class="vacio">No hay productos con ese filtro.</div>') + '</div>') +

    '<div class="log ' + (HECHOS.length ? "on" : "") + '" id="log">' +
      HECHOS.map(h => "<div>" + h + "</div>").join("") + '</div>';

  document.querySelectorAll(".pill").forEach(el => el.onclick = () => { FILTRO = el.dataset.f; pintar(); });
  $("#q").oninput = EYG.debounce(e => { BUSCA = e.target.value.trim().toLowerCase(); pintar(); }, 250);
  document.querySelectorAll(".pcard input[type=checkbox]").forEach(c => c.onchange = marcar);
  if($("#bnada")){
    $("#bnada").onclick   = () => { document.querySelectorAll(".pcard input:checked").forEach(c => c.checked = false); marcar(); };
    $("#bsoltar").onclick = () => correr("soltar");
    $("#barch").onclick   = () => correr("archivar");
  }
  // botones de decisión, uno por fila (vista "A decidir")
  document.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => {
    const p = DATOS.find(x => x.id === +b.dataset.id);
    if(p) decidirUno(p, b.dataset.dec);
  });
  marcar();
}

/* botones: HTML opcional con las decisiones de esa fila. Si viene, la tarjeta no
   lleva casilla de selección: se decide de a uno, no en tanda. */
function tarjeta(p, botones){
  const tags = [];
  if(!p.regla && p.pisado) tags.push('<span class="tag bad">hoy se cobra ' + plata(p.list_price) + ' &mdash; el PVP de AlfaBeta</span>');
  else if(!p.regla)        tags.push('<span class="tag warn">sin precio propio en las tarifas</span>');
  else                     tags.push('<span class="tag ok">tiene precio propio &middot; soltarlo no cambia el precio</span>');
  if(p.codigoAB) tags.push('<span class="tag warn">código AB &mdash; se le asigna el interno de la casa</span>');
  if(!p.gemela)  tags.push('<span class="tag info">sin ficha en el vademécum &middot; AlfaBeta se va a crear la suya</span>');
  if(p.gemela && p.gemela.conStock)
    tags.push('<span class="tag bad">la ficha del vademécum tiene ' + p.gemela.hist.stock +
              ' de stock &mdash; resolver esas unidades antes de archivarla</span>');
  if(p.hecho)    tags.push('<span class="tag ok">&#10003; soltado</span>');

  if(POSTERGADOS.has(p.id)) tags.push('<span class="tag info">postergado &middot; lo miramos después</span>');

  return '<div class="pcard ' + (p.hecho ? "hecho" : "") + (POSTERGADOS.has(p.id) ? " hecho" : "") +
         '" data-id="' + p.id + '">' +
    (botones ? "" : (p.hecho ? '<div style="width:17px"></div>' : '<input type="checkbox" data-id="' + p.id + '">')) +
    '<div class="pc-body">' +
      '<div class="pc-nom">' + esc(p.name) + '</div>' +
      '<div class="pc-meta">' +
        '<span>código <b>' + esc(p.default_code || "sin código") + '</b></span>' +
        '<span>AlfaBeta <b>' + p.alfabeta_code + '</b></span>' +
        '<span>' + esc((p.categ_id ? p.categ_id[1] : "").replace("ALL / ","")) + '</span>' +
        '<span>costo <b>' + plata(p.standard_price) + '</b></span>' +
        '<span>stock <b>' + p.stock + '</b></span>' +
      '</div>' +
      '<div class="tags">' + tags.join("") + '</div>' +
      (p.gemela
        ? '<div class="gemela">Ficha del vademécum: <b>' + esc(p.gemela.default_code || p.gemela.id) + '</b> &middot; ' +
          esc(String(p.gemela.name).slice(0,58)) + ' &middot; PVP <b>' + plata(p.gemela.list_price) + '</b> &middot; ' +
          (p.gemela.active ? "activa (se puede vender por error)" : "ya archivada") +
          (p.gemela.conStock
            ? " &middot; <b>" + p.gemela.hist.stock + " de stock</b> (hay mercadería cargada ahí)"
            : p.gemela.usada
              ? " &middot; " + p.gemela.hist.ventas + " venta(s) y " + p.gemela.hist.compras +
                " compra(s) viejas, sin stock: archivarla no borra nada"
              : " &middot; sin movimiento: se archiva tranquilo") + '</div>'
        : "") +
    '</div>' +
    '<div class="pc-act">' +
      (botones || "") +
      '<a class="btn ghost" target="_blank" rel="noopener" ' +
         'href="https://drogueriaeyg.odoo.com/odoo/inventory/product/' + p.id + '">Ver en Odoo</a>' +
    '</div>' +
  '</div>';
}

/* ---------- vista "A decidir": agrupada por motivo, con botones por fila ---------- */
function listaDecidir(vis){
  let html = "";
  for(const g of GRUPOS){
    const items = vis.filter(p => motivo(p) === g.k);
    if(!items.length) continue;
    html += '<div class="sec"><div class="sechead"><span class="ico">' + g.ico + '</span>' +
            '<span class="secname">' + g.titulo + '</span>' +
            '<span class="seccount">' + items.length + '</span></div>' +
            '<div class="secbajada">' + g.bajada + '</div>' +
            '<div class="lista">' + items.map(p => tarjeta(p, botonesDe(p))).join("") + '</div></div>';
  }
  return html || '<div class="vacio">No queda nada por decidir.</div>';
}

function botonesDe(p){
  if(p.hecho || POSTERGADOS.has(p.id)) return '<span class="decidido">decidido</span>';
  const b = [];
  const m = motivo(p);
  if(m === "precio"){
    b.push(btn(p, "pausar", "Soltar y sacar de la venta", ""));
    b.push(btn(p, "soltar", "Soltar y dejar el precio", "ghost"));
  }else if(m === "stock"){
    b.push(btn(p, "soltar",   "Soltar (sin archivar)", ""));
    b.push(btn(p, "archivar", "Soltar y archivar igual", "ghost"));
  }else{
    b.push(btn(p, "soltar", "Soltar", ""));
  }
  b.push(btn(p, "postergar", "Dejar así por ahora", "ghost"));
  return b.join("");
}
function btn(p, dec, txt, clase){
  return '<button class="btn ' + clase + '" data-dec="' + dec + '" data-id="' + p.id + '">' + txt + '</button>';
}

async function decidirUno(p, dec){
  if(dec === "postergar"){ POSTERGADOS.add(p.id); pintar(); return; }

  let aviso = "";
  if(dec === "pausar")
    aviso = 'Además de soltarlo de AlfaBeta, se destilda "Puede ser vendido".\n'
          + 'El producto deja de poder cargarse en pedidos nuevos hasta que se le ponga precio.\n'
          + 'Se revierte con un clic. No se toca el stock ni nada más.\n\n';
  if(dec === "archivar" && p.gemela && p.gemela.conStock)
    aviso = 'OJO: la ficha del vademécum tiene ' + p.gemela.hist.stock + ' unidades cargadas.\n'
          + 'Al archivarla, ese stock deja de verse aunque la mercadería siga en el depósito.\n'
          + 'Confirmá sólo si ya sabés qué se hace con esas unidades.\n\n';
  if(!confirm(aviso + '"' + String(p.name).trim().slice(0,60) + '"\n\n¿Confirmás?')) return;

  try{
    const vals = { alfabeta_code: 0 };
    let nuevo = null;
    if(p.codigoAB){ nuevo = String(PROX++); vals.default_code = nuevo; }
    if(dec === "pausar") vals.sale_ok = false;
    await EYG.rpc("product.template","write",[[p.id], vals], LANG);

    let extra = "";
    if(dec === "archivar" && p.gemela && p.gemela.active){
      await EYG.rpc("product.template","write",[[p.gemela.id], {active:false}], LANG);
      p.gemela.active = false;
      extra = " &middot; ficha del vademécum archivada";
    }
    if(dec === "pausar"){ p.sale_ok = false; extra = " &middot; sacado de la venta hasta ponerle precio"; }
    p.hecho = true; p.alfabeta_code = 0;
    if(nuevo){ p.default_code = nuevo; p.codigoAB = false; }
    HECHOS.push("<b>" + esc(String(p.name).slice(0,52)) + "</b> &mdash; soltado" +
                (nuevo ? " &middot; código nuevo <b>" + nuevo + "</b>" : "") + extra);
  }catch(e){
    HECHOS.push('<b style="color:var(--bad)">' + esc(String(p.name).slice(0,52)) +
                "</b> &mdash; NO se pudo: " + esc(e.message || e));
  }
  pintar();
}

function marcar(){
  const n = document.querySelectorAll(".pcard input:checked").length;
  $("#barra").classList.toggle("on", n > 0);
  if(n) $("#bcnt").textContent = (n === 1 ? "1 producto seleccionado" : n + " productos seleccionados");
  document.querySelectorAll(".pcard").forEach(c => {
    const chk = c.querySelector("input");
    c.classList.toggle("sel", !!(chk && chk.checked));
  });
}

/* ---------- acciones ---------- */
async function correr(modo){
  const ids = [...document.querySelectorAll(".pcard input:checked")].map(c => +c.dataset.id);
  if(!ids.length) return;
  const sel = DATOS.filter(p => ids.includes(p.id));

  const conAB    = sel.filter(p => p.codigoAB).length;
  // sólo se archiva la ficha del vademécum si está MUERTA (sin stock, ventas ni compras)
  const archivar = modo === "archivar" ? sel.filter(p => p.gemela && p.gemela.active && !p.gemela.conStock) : [];
  const saltear  = modo === "archivar" ? sel.filter(p => p.gemela && p.gemela.active &&  p.gemela.conStock) : [];

  let msg = "Vas a desenganchar " + sel.length + " producto(s) de AlfaBeta.\n\n"
          + "• Se les pone el Código Alfa Beta en cero: AlfaBeta no los toca nunca más.\n";
  if(conAB) msg += "• A " + conAB + " con código AB##### se les asigna el interno de la casa (desde " + PROX + ").\n";
  if(archivar.length){
    msg += "• Se archivan " + archivar.length + " ficha(s) del vademécum. Archivar no borra nada:\n"
         + "  las facturas y los pedidos viejos quedan intactos, y se revierte con un clic.\n";
  }
  if(saltear.length){
    msg += "\nOJO: " + saltear.length + " ficha(s) del vademécum NO se archivan porque TIENEN STOCK.\n"
         + "Archivarlas escondería mercadería que está en el depósito. Hay que decidir antes\n"
         + "qué se hace con esas unidades:\n"
         + saltear.slice(0,5).map(p => "   - " + String(p.gemela.name).slice(0,44) +
                                       " (" + p.gemela.hist.stock + " u.)").join("\n") + "\n"
         + (saltear.length > 5 ? "   ...y " + (saltear.length-5) + " más\n" : "")
         + "Esos productos igual se desenganchan, que es seguro.\n";
  }
  msg += "\nNO se toca ningún precio, ni el stock, ni las compras, ni las facturas.\n\n¿Confirmás?";
  if(!confirm(msg)) return;

  document.querySelectorAll(".barra .btn").forEach(b => b.disabled = true);

  for(const p of sel){
    try{
      const vals = { alfabeta_code: 0 };
      let nuevo = null;
      if(p.codigoAB){ nuevo = String(PROX++); vals.default_code = nuevo; }
      await EYG.rpc("product.template","write",[[p.id], vals], LANG);

      let extra = "";
      if(modo === "archivar" && p.gemela && p.gemela.active && !p.gemela.conStock){
        await EYG.rpc("product.template","write",[[p.gemela.id], {active:false}], LANG);
        p.gemela.active = false;
        extra = " &middot; ficha del vademécum archivada";
      }
      p.hecho = true; p.alfabeta_code = 0;
      if(nuevo){ p.default_code = nuevo; p.codigoAB = false; }
      HECHOS.push("<b>" + esc(String(p.name).slice(0,52)) + "</b> &mdash; soltado" +
                  (nuevo ? " &middot; código nuevo <b>" + nuevo + "</b>" : "") + extra);
    }catch(e){
      HECHOS.push('<b style="color:var(--bad)">' + esc(String(p.name).slice(0,52)) +
                  "</b> &mdash; NO se pudo: " + esc(e.message || e));
    }
  }
  pintar();
  const lg = $("#log"); if(lg) lg.scrollTop = lg.scrollHeight;
}

EYG.requireAuth(["inventario","maestro"], perfil => {
  document.body.innerHTML = EYG.layout(perfil, "alfabeta", '<div id="cont"></div>', "Enganches de AlfaBeta");
  cargar().catch(e => {
    $("#cont").innerHTML = '<div class="vacio">No se pudo cargar: ' + esc(e.message || e) + '</div>';
  });
});
