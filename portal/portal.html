<script>
/* ============ EyG Core · Portal web ============
   Todo lo del portal de clientes (drogueriaeyg.odoo.com) en un solo lugar:
   · Métricas: quién entra, qué mira, qué busca y qué compra, en cualquier período
     desde marzo de 2025 (filtros por fecha, comercial y rubro; detalle por cliente).
   · Cinta: la franja de avisos que ven los clientes, con su segmentación y los
     pedidos de beneficios que llegan desde ahí.
   · Noticias: las novedades que se publican en el portal (blog de Odoo).
   Acá se irán sumando más cosas del portal (notificaciones, campañas, etc.). */
const esc=s=>EYG.esc(s), money=s=>EYG.money(s);
const hoy=()=>EYG.argToday();
function fD(s){ if(!s) return ""; s=String(s).slice(0,10); return s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4); }
const num=n=>Math.round(n||0).toLocaleString("es-AR");

let PERFIL, TAB="resumen";
let toastT; function toast(msg, ok){ const t=document.getElementById("toast"); if(!t)return; t.textContent=msg; t.className="toast show"+(ok?" ok":""); clearTimeout(toastT); toastT=setTimeout(()=>t.className="toast",2600); }

EYG.guard(["direccion","admin"]).then(async perfil=>{
  PERFIL=perfil; window.__perfil=perfil;
  document.body.innerHTML = EYG.layout(perfil,"portal",'<div id="cont"><div class="spin"></div></div><div class="toast" id="toast"></div><div id="tip"></div>',"Portal web");
  render(); cargarTab();
});

function render(){
  const cont=document.getElementById("cont"); if(!cont) return;
  const tabs=`<div class="tabs">
    <button class="tab ${TAB==='resumen'?'on':''}" onclick="setTab('resumen')">📈 Métricas</button>
    <button class="tab ${TAB==='cinta'?'on':''}" onclick="setTab('cinta')">📢 Cinta de avisos</button>
    <button class="tab ${TAB==='noticias'?'on':''}" onclick="setTab('noticias')">📰 Noticias</button>
    <a class="tab" href="../finanzas/altas.html" title="Solicitudes de alta al portal (Administración)" style="text-decoration:none">🪪 Altas de clientes ↗</a>
  </div>`;
  let body="";
  if(TAB==="resumen") body=vistaResumen();
  else if(TAB==="cinta") body=vistaCinta();
  else body=vistaNoticias();
  cont.innerHTML=tabs+`<div id="body">${body}</div>`;
}
function setTab(t){ if(t===TAB) return; TAB=t; CEDIT=null; render(); cargarTab(); }
function cargarTab(){
  if(TAB==="resumen" && !MET) metricas();
  if(TAB==="resumen" && !CINTA) cintaCargar();
  if(TAB==="cinta" && !CINTA) cintaCargar();
  if(TAB==="noticias" && !POSTS) noticiasCargar();
}

/* ======================= MÉTRICAS =======================
   Qué hacen los clientes en el portal, en cualquier período desde que el portal
   empezó a registrar visitas (marzo de 2025). Todo sale de Odoo en vivo:
   · website.track: cada página o producto que abre un cliente logueado (ojo: también
     lo anónimo que Odoo le pasa al cliente al iniciar sesión; se separa en depurar()) (Odoo
     registra el inicio, las fichas de producto, contacto y noticias; el catálogo,
     las categorías y el carrito NO quedan registrados). Las búsquedas se ven cuando
     el cliente abre un producto desde el buscador: la URL trae "?search=…".
   · website.visitor: une cada registro con el contacto (uno por contacto).
   · sale.order con website_id: lo que pasa por el carrito del portal. Confirmados =
     pedidos; borrador = carrito sin confirmar (los que carga el comercial no llevan
     website_id).
   Todo se lleva a la cuenta del cliente (commercial_partner_id), no al contacto.
   Una "visita" = un cliente que entró un día (si entra tres veces el mismo día,
   cuenta una). Horarios y días, en hora argentina (UTC-3, sin horario de verano). */
const INICIO_HIST="2025-03-01";
const REG_DESDE="2026-11-02";   // desde acá el portal registra lo que Odoo no guarda (portal_evento)
const PRESETS=[["hoy","Hoy"],["ayer","Ayer"],["7","7 días"],["30","30 días"],["mes","Este mes"],["mesant","Mes pasado"],["90","90 días"],["anio","Este año"],["todo","Todo el histórico"]];
const RUBRO="x_studio_selection_field_6ui_1j42g6fu9";
const TZ_ODOO={context:{tz:"America/Argentina/Buenos_Aires"}};
let MET=null, INTERNOS=[], RANGO={p:"30",desde:"",hasta:""};
let MF={sec:"resumen",act:"",com:"",rubro:"",estado:"todos",q:"",orden:"monto",dir:-1,ver:50}, SERIE="clientes", CLI_AB=null, CLI_DET={};
/* La gente de EyG entra al portal todo el día (para mirar precios, cargar pedidos o
   probar cosas): si no los sacamos, la mitad de las visitas son nuestras. Internos =
   usuarios de Odoo que NO son del portal (share=false), también los dados de baja:
   los ex empleados siguen teniendo años de visitas (Matias Angelini: 36 mil páginas).
   El 4 es el usuario público. */
async function cargarInternos(){
  if(INTERNOS.length) return INTERNOS;
  try{
    const u=await EYG.rpc("res.users","search_read",[[["share","=",false]]],{fields:["partner_id"],limit:500,context:{active_test:false}});
    INTERNOS=[...new Set((u||[]).map(x=>x.partner_id&&x.partner_id[0]).filter(Boolean))];
  }catch(e){ INTERNOS=[]; }
  return INTERNOS;
}
const arr=x=>Array.isArray(x)?x:[];
function addD(ymd,n){ const d=new Date(ymd+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function diasEntre(a,b){ return Math.round((new Date(b+"T12:00:00Z")-new Date(a+"T12:00:00Z"))/864e5)+1; }
const aUTC=ymd=>ymd+" 03:00:00";                        // medianoche argentina, en UTC
function enAR(s){ const d=new Date(String(s).replace(" ","T")+"Z"); d.setUTCHours(d.getUTCHours()-3); return d; } // leer con getUTC*
const diaAR=s=>enAR(s).toISOString().slice(0,10);
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const DSEM=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const fCorta=ymd=>+ymd.slice(8,10)+" "+MESES[+ymd.slice(5,7)-1];
const pct=(a,b)=>b?Math.round(a/b*100):0;
const pesos=v=>"$"+num(v);   // en los tableros, sin centavos
const sinCod=s=>String(s||"").replace(/^\[[^\]]*\]\s*/,"");
/* en las tablas, sin la presentación "(Precio x caja · …)": el nombre completo queda al pasar el mouse */
const corto=s=>String(s||"").replace(/\s*\(precio x[^)]*\)\s*$/i,"").trim();
const prodTd=nom=>`<td class="url" title="${esc(nom)}">${esc(corto(nom))}</td>`;

function rango(){
  const h=hoy(), p=RANGO.p; let d=h, a=h;
  if(p==="ayer"){ d=a=addD(h,-1); }
  else if(/^\d+$/.test(p)) d=addD(h,-(+p-1));
  else if(p==="mes") d=h.slice(0,8)+"01";
  else if(p==="mesant"){ a=addD(h.slice(0,8)+"01",-1); d=a.slice(0,8)+"01"; }
  else if(p==="anio") d=h.slice(0,4)+"-01-01";
  else if(p==="todo") d=INICIO_HIST;
  else if(p==="custom"){ d=RANGO.desde||h; a=RANGO.hasta||h; if(d>a) [d,a]=[a,d]; }
  if(d<INICIO_HIST) d=INICIO_HIST;
  if(a>h) a=h;
  const n=diasEntre(d,a);
  return {d,a,n,pd:addD(d,-n),pa:addD(d,-1),comparar:p!=="todo" && addD(d,-n)>=INICIO_HIST};
}

/* ---------- lo que Odoo le anota a un cliente sin que sea suyo ----------
   Odoo junta en UN solo visitante todo lo que entra sin sesión (el usuario público:
   anuncios, Google, gente que mira sin cuenta) y, cuando alguien inicia sesión, le
   pasa todo ese acumulado a ese cliente. Encima, el monitor de estado (función
   status-check) abre la portada cada 5 minutos en punto para ver si el portal anda,
   y eso también va a parar ahí. Medido el 2/11/2026: desde octubre, dos de cada tres
   registros "de clientes" eran eso (Fcia. Ricca: 613 páginas un domingo sin entrar).
   El monitor es justamente la marca para separarlo: cada tramo de aperturas del
   monitor anotadas a un cliente es tiempo en que lo anónimo se le estaba juntando a
   él; todo lo suyo dentro del tramo (y en los 5 minutos previos) no es de él.
   Antes de que existiera el monitor (fines de agosto de 2026) no hay marca.
   🔴 Si status-check deja de abrir la portada, esto deja de separar. */
const MON_DESDE="2026-08-25";
/* Qué tan seguido entra cada cliente: siempre las últimas 8 semanas hasta hoy (no
   depende del período elegido), contando días con páginas propias (ya sin lo anónimo).
   Tener usuario no es usar el portal: el 2/11/2026 había 437 usuarios de clientes y
   135 nunca habían iniciado sesión (Odoo los deja en estado "nunca conectado"). */
const ACT_SEM=8;
const SEGS=[
  ["frecuente","Frecuentes","entraron 6 o más de las últimas 8 semanas","#1E7D46"],
  ["aveces","De vez en cuando","entre 2 y 5 de las últimas 8 semanas","#048782"],
  ["una","Una sola semana","entraron en 1 de las últimas 8 semanas","#7FB8B4"],
  ["dormido","Dormidos","usaron su cuenta, pero no en las últimas 8 semanas","#C9A227"],
  ["nunca","Nunca la activaron","tienen usuario y nunca iniciaron sesión","#B0322F"],
  ["sinusuario","Compran y no tienen usuario","compraron en los últimos 90 días, sin usuario del portal","#8A9A97"]];
function segmento(c){
  if(!c.acceso) return c.v90?"sinusuario":"";
  if(!c.uso && !c.act.w.size) return "nunca";
  const w=c.act.w.size;
  return w>=6?"frecuente":w>=2?"aveces":w===1?"una":"dormido";
}
const segNom=k=>(SEGS.find(x=>x[0]===k)||[,""])[1];
const HOME="https://drogueriaeyg.odoo.com/";
const tsUTC=s=>Date.parse(String(s).replace(" ","T")+"Z");
const fUTC=k=>new Date(k).toISOString().slice(0,19).replace("T"," ");
/* el monitor abre la portada pelada en los primeros segundos de cada múltiplo de 5 minutos */
const esMonitor=t=>t.url===HOME && ((+t.visit_datetime.slice(14,16))%5)*60+(+t.visit_datetime.slice(17,19))<15;
async function depurar(mon,esCliente){
  const T=[], TV={}; let cur=null;
  mon=arr(mon).map(t=>({...t,url:HOME}));   // la consulta trae sólo aperturas de la portada
  mon.filter(esMonitor).forEach(t=>{ const v=t.visitor_id&&t.visitor_id[0], k=tsUTC(t.visit_datetime);
    if(cur && cur.v===v && k-cur.fin<=11*60e3){ cur.fin=k; return; }
    cur={v,ini:k,fin:k}; if(esCliente[v]){ T.push(cur); (TV[v]=TV[v]||[]).push(cur); } });
  const dentro=(v,k)=>(TV[v]||[]).some(b=>k>=b.ini-5*60e3 && k<=b.fin+30e3);
  const filas=[];
  mon.forEach(t=>{ const v=t.visitor_id&&t.visitor_id[0]; if(!esCliente[v]) return;
    if(esMonitor(t)) filas.push({...t,mon:true}); else if(dentro(v,tsUTC(t.visit_datetime))) filas.push(t); });
  /* lo demás que cayó en esos tramos (fichas, anuncios, contacto…): en tandas, porque
     un filtro con cientos de tramos juntos Odoo no lo acepta */
  const tramos=T.map(b=>["&","&",["visitor_id","=",b.v],["visit_datetime",">=",fUTC(b.ini-5*60e3)],["visit_datetime","<=",fUTC(b.fin+30e3)]]);
  const tandas=[]; for(let i=0;i<tramos.length;i+=80) tandas.push(tramos.slice(i,i+80));
  const res=await Promise.all(tandas.map(L=>EYG.rpc("website.track","search_read",
    [[["url","!=",HOME]].concat(Array(L.length-1).fill("|"),...L)],{fields:["visitor_id","visit_datetime","product_id","url"],limit:0})));
  res.forEach(r=>arr(r).forEach(t=>filas.push(t)));
  return filas;
}

let MET_N=0;   // si se cambia de período antes de que termine, gana la última lectura
async function metricas(){

  const b=document.getElementById("body"); if(b) b.innerHTML=filtrosHTML(true)+'<div class="spin"></div><div class="hint" style="text-align:center">Leyendo el portal… (el histórico completo tarda unos segundos)</div>';
  const R=rango(); MET=null; CLI_AB=null; CLI_DET={};
  try{
    const ints=(await cargarInternos()).concat([4]);
    const en=(c,x,y)=>[[c,">=",aUTC(x)],[c,"<",aUTC(addD(y,1))]];
    const tr=(x,y)=>en("visit_datetime",x,y).concat([["visitor_id.partner_id","not in",ints]]);
    const so=(x,y)=>en("date_order",x,y).concat([["website_id","!=",false],["partner_id","not in",ints]]);
    const CONF=["sale","done"];
    /* las aperturas de la portada traen la marca del monitor (ver depurar); un día antes, por los tramos que vienen de atrás */
    const H=hoy(), dAct=addD(H,-(ACT_SEM*7-1));
    const monD=[addD([R.comparar?R.pd:R.d,dAct].sort()[0],-1),MON_DESDE].sort()[1];
    const pVis=EYG.rpc("website.visitor","search_read",[[["partner_id","not in",ints]]],{fields:["partner_id"],limit:0});
    /* lo anónimo se separa en paralelo con lo demás: necesita las aperturas de la portada y los visitantes que son clientes */
    const pAnon=Promise.all([
      EYG.rpc("website.track","search_read",[[["url","=",HOME],["visit_datetime",">=",aUTC(monD)],["visit_datetime","<",aUTC(addD(H,1))]]],{fields:["visitor_id","visit_datetime"],limit:0,order:"visit_datetime asc"}),
      pVis]).then(([m,v])=>{ const ok={}; arr(v).forEach(x=>{ if(x.partner_id) ok[x.id]=1; }); return depurar(m,ok); });
    const [vis,users,dias,prods,horas,busq,ords,lineas,diasP,ordsP,evr,anon,ad,pubP,diasA,v90]=await Promise.all([
      pVis,
      EYG.rpc("res.users","search_read",[[["share","=",true],["active","=",true]]],{fields:["partner_id","login_date"],limit:0}),
      // páginas: sólo los registros con dirección (Odoo anota cada ficha dos veces: la página y el producto)
      EYG.rpc("website.track","read_group",[tr(R.d,R.a).concat([["url","!=",false]]),["id"],["visitor_id","visit_datetime:day"]],{lazy:false,...TZ_ODOO}),
      EYG.rpc("website.track","read_group",[tr(R.d,R.a).concat([["product_id","!=",false]]),["id"],["visitor_id","product_id"]],{lazy:false}),
      EYG.rpc("website.track","read_group",[tr(R.d,R.a).concat([["url","!=",false]]),["id"],["visit_datetime:hour"]],{lazy:false,...TZ_ODOO}),
      EYG.rpc("website.track","search_read",[tr(R.d,R.a).concat([["url","ilike","search="]])],{fields:["url","visitor_id"],limit:0}),
      EYG.rpc("sale.order","search_read",[so(R.d,R.a).concat([["state","in",["draft","sent","sale","done"]]])],{fields:["name","partner_id","amount_total","date_order","state","cart_quantity"],limit:0,order:"date_order desc"}),
      EYG.rpc("sale.order.line","read_group",[[["order_id.website_id","!=",false],["order_id.state","in",CONF],["order_id.partner_id","not in",ints],["order_id.date_order",">=",aUTC(R.d)],["order_id.date_order","<",aUTC(addD(R.a,1))],["display_type","=",false],["is_delivery","=",false]],["product_uom_qty:sum","price_subtotal:sum"],["order_partner_id","product_id"]],{lazy:false}),
      R.comparar?EYG.rpc("website.track","read_group",[tr(R.pd,R.pa).concat([["url","!=",false]]),["id"],["visitor_id","visit_datetime:day"]],{lazy:false,...TZ_ODOO}):[],
      R.comparar?EYG.rpc("sale.order","search_read",[so(R.pd,R.pa).concat([["state","in",CONF]])],{fields:["partner_id","amount_total"],limit:0}):[],
      // registro propio del portal (bloque eyg-analytics → portal-evento → tabla portal_evento)
      R.a>=REG_DESDE?EYG.supa().rpc("portal_eventos_resumen",{p_desde:R.d+"T00:00:00-03:00",p_hasta:addD(R.a,1)+"T00:00:00-03:00",p_excluir:ints}).then(r=>r.error?null:r.data).catch(()=>null):null,
      pAnon,
      // llegadas desde los anuncios de Meta (son de gente sin sesión: Odoo las reparte entre los clientes)
      EYG.rpc("website.track","search_count",[en("visit_datetime",R.d,R.a).concat([["url","ilike","utm_source=meta"]])]),
      // lo anónimo que todavía no le tocó a nadie (sigue en el usuario público)
      EYG.rpc("website.track","read_group",[en("visit_datetime",R.d,R.a).concat([["visitor_id.partner_id","=",4],["product_id","!=",false]]),["id"],["product_id"]],{lazy:false}),
      // actividad: días con páginas en las últimas 8 semanas, y quién compró en 90 días por cualquier canal
      EYG.rpc("website.track","read_group",[tr(dAct,H).concat([["url","!=",false]]),["id"],["visitor_id","visit_datetime:day"]],{lazy:false,...TZ_ODOO}),
      EYG.rpc("sale.order","read_group",[[["state","in",CONF],["date_order",">=",aUTC(addD(H,-89))],["partner_id","not in",ints]],["id"],["partner_id"]],{lazy:false}),
    ]);
    /* contacto → cuenta del cliente */
    const pids=new Set();
    arr(vis).forEach(v=>v.partner_id&&pids.add(v.partner_id[0]));
    arr(users).forEach(u=>u.partner_id&&pids.add(u.partner_id[0]));
    arr(ords).concat(arr(ordsP)).forEach(o=>o.partner_id&&pids.add(o.partner_id[0]));
    arr(v90).forEach(g=>g.partner_id&&pids.add(g.partner_id[0]));
    const ps=arr(await EYG.rpc("res.partner","read",[[...pids],["commercial_partner_id"]],{context:{active_test:false}}));
    const cuentaDe={}; ps.forEach(p=>cuentaDe[p.id]=p.commercial_partner_id?p.commercial_partner_id[0]:p.id);
    const cids=[...new Set(Object.values(cuentaDe))];
    const cs=arr(await EYG.rpc("res.partner","read",[cids,["name","x_studio_nombre_de_fantasia","user_id","city",RUBRO]],{context:{active_test:false}}));
    const CLI={};
    const nuevo=c=>({id:c.id, nom:c.x_studio_nombre_de_fantasia||c.name||("Cliente "+c.id), razon:c.x_studio_nombre_de_fantasia?c.name:"",
      com:c.user_id?c.user_id[1]:"", ciudad:c.city||"", rubro:c[RUBRO]||"", acceso:false, login:"",
      dias:new Set(), pv:0, prodV:0, prodD:0, prods:{}, busq:0, ped:0, monto:0, carr:0, carrMonto:0, ultVisita:"", ultPed:"", vids:[], pids:[], ev:{ses:0,busq:0,sin:0,carr:0,desc_:0,cuenta:0},
      pvP:0, diasP:new Set(), pedP:0, montoP:0, uso:false, act:{w:new Set(),d:new Set()}, v90:false});
    cs.forEach(c=>CLI[c.id]=nuevo(c));
    Object.entries(cuentaDe).forEach(([pc,cid])=>{ if(CLI[cid]) CLI[cid].pids.push(+pc); });
    const cli=pid=>CLI[cuentaDe[pid]];
    const vis2cli={};
    arr(vis).forEach(v=>{ if(!v.partner_id) return; const c=cli(v.partner_id[0]); if(c){ vis2cli[v.id]=c; c.vids.push(v.id); } });
    arr(users).forEach(u=>{ const c=u.partner_id&&cli(u.partner_id[0]); if(!c) return; c.acceso=true; if(u.login_date){ c.uso=true; if(u.login_date>c.login) c.login=u.login_date; } });
    arr(v90).forEach(g=>{ const c=g.partner_id&&cli(g.partner_id[0]); if(c) c.v90=true; });
    /* lo anónimo anotado a clientes: se descuenta de cada cuenta y se junta aparte (pestaña "Visitantes sin cuenta") */
    const ANON=new Set(), aDia={}, aProd={}, aHora={}, aAct={}, iniA=tsUTC(aUTC(dAct));
    const SC={mon:0,pag:0,prodV:0,prods:{}};
    const sumaP=(id,nom,n)=>{ const p=SC.prods[id]||(SC.prods[id]={nom:sinCod(nom),n:0}); p.n+=n; SC.prodV+=n; };
    const ini=tsUTC(aUTC(R.d)), fin=tsUTC(aUTC(addD(R.a,1))), iniP=tsUTC(aUTC(R.pd)), finP=tsUTC(aUTC(addD(R.pa,1)));
    arr(anon).forEach(t=>{
      const k=tsUTC(t.visit_datetime), v=t.visitor_id[0], ahora=k>=ini&&k<fin, antes=R.comparar&&k>=iniP&&k<finP;
      if(!vis2cli[v]) return;
      if(t.url && k>=iniA){ const ka=v+"|"+diaAR(t.visit_datetime); aAct[ka]=(aAct[ka]||0)+1; }
      if(!ahora&&!antes) return;
      ANON.add(t.id);
      if(t.url){ const kd=(ahora?"":"P")+v+"|"+diaAR(t.visit_datetime); aDia[kd]=(aDia[kd]||0)+1;
        if(ahora){ const h=enAR(t.visit_datetime), kh=((h.getUTCDay()+6)%7)+"|"+h.getUTCHours(); aHora[kh]=(aHora[kh]||0)+1; } }
      else if(t.product_id && ahora){ const kp=v+"|"+t.product_id[0]; aProd[kp]=(aProd[kp]||0)+1; }
      if(!ahora) return;
      if(t.mon) SC.mon++; else if(t.url) SC.pag++; else if(t.product_id) sumaP(t.product_id[0],t.product_id[1],1); });
    arr(pubP).forEach(g=>g.product_id&&sumaP(g.product_id[0],g.product_id[1],g.__count));
    /* visitas por día */
    const porDia={};   // dia → {pv, cli:Set, ped, monto}
    const dDia=k=>porDia[k]||(porDia[k]={pv:0,cli:new Set(),ped:0,monto:0});
    const diaDe=g=>{ const r=g.__range&&g.__range["visit_datetime:day"]; return r?diaAR(r.from):""; };
    arr(dias).forEach(g=>{ const v=g.visitor_id&&g.visitor_id[0], c=vis2cli[v], k=diaDe(g); if(!c||!k) return;
      const n=g.__count-(aDia[v+"|"+k]||0); if(n<=0) return;
      c.dias.add(k); c.pv+=n; if(k>c.ultVisita) c.ultVisita=k; const x=dDia(k); x.pv+=n; x.cli.add(c.id); });
    arr(diasP).forEach(g=>{ const v=g.visitor_id&&g.visitor_id[0], c=vis2cli[v], k=diaDe(g); if(!c||!k) return;
      const n=g.__count-(aDia["P"+v+"|"+k]||0); if(n<=0) return; c.diasP.add(k); c.pvP+=n; });
    arr(diasA).forEach(g=>{ const v=g.visitor_id&&g.visitor_id[0], c=vis2cli[v], k=diaDe(g); if(!c||!k) return;
      if(g.__count-(aAct[v+"|"+k]||0)<=0) return; c.act.d.add(k); c.act.w.add(Math.floor((diasEntre(dAct,k)-1)/7)); });
    /* productos mirados */
    const PROD={};     // product_id → {nom, vistas, cli:Set (lo miraron), comp:Set (lo compraron por el portal)}
    const dProd=g=>PROD[g.product_id[0]]||(PROD[g.product_id[0]]={id:g.product_id[0],nom:sinCod(g.product_id[1]),vistas:0,cli:new Set(),comp:new Set(),ped:0,uni:0,monto:0});
    arr(prods).forEach(g=>{ const v=g.visitor_id&&g.visitor_id[0], c=vis2cli[v]; if(!c||!g.product_id) return;
      const n=g.__count-(aProd[v+"|"+g.product_id[0]]||0); if(n<=0) return;
      const p=dProd(g); p.vistas+=n; p.cli.add(c.id);
      const m=c.prods[p.id]||(c.prods[p.id]={nom:p.nom,n:0}); if(!m.n) c.prodD++; m.n+=n; c.prodV+=n; });
    arr(lineas).forEach(g=>{ if(!g.product_id) return; const p=dProd(g);
      p.ped+=g.__count; p.uni+=g.product_uom_qty||0; p.monto+=g.price_subtotal||0;
      const c=g.order_partner_id&&cli(g.order_partner_id[0]); if(c) p.comp.add(c.id); });
    /* búsquedas (las que terminaron abriendo un producto) */
    const BUS={};
    arr(busq).forEach(t=>{ const c=t.visitor_id&&vis2cli[t.visitor_id[0]]; if(!c||ANON.has(t.id)) return;
      let q=""; try{ q=new URL(t.url).searchParams.get("search")||""; }catch(e){}
      q=q.trim().toLowerCase().replace(/\s+/g," "); if(!q) return;
      c.busq++; const x=BUS[q]||(BUS[q]={q,n:0,cli:new Set()}); x.n++; x.cli.add(c.id); });
    /* pedidos y carritos */
    const CARR=[], PEDS=[];
    arr(ords).forEach(o=>{ const c=o.partner_id&&cli(o.partner_id[0]); if(!c) return; const k=diaAR(o.date_order);
      if(o.state==="sale"||o.state==="done"){ c.ped++; c.monto+=o.amount_total||0; if(k>c.ultPed) c.ultPed=k; const x=dDia(k); x.ped++; x.monto+=o.amount_total||0; PEDS.push({...o,cli:c,dia:k}); }
      else if((o.cart_quantity||0)>0 && (o.amount_total||0)>0){ c.carr++; c.carrMonto+=o.amount_total||0; CARR.push({...o,cli:c,dia:k}); } });
    arr(ordsP).forEach(o=>{ const c=o.partner_id&&cli(o.partner_id[0]); if(!c) return; c.pedP++; c.montoP+=o.amount_total||0; });
    /* horarios: semana × hora */
    const HORA=Array.from({length:7},()=>Array(24).fill(0));
    arr(horas).forEach(g=>{ const r=g.__range&&g.__range["visit_datetime:hour"]; if(!r) return; const d=enAR(r.from), f=(d.getUTCDay()+6)%7, h=d.getUTCHours();
      HORA[f][h]+=Math.max(0,g.__count-(aHora[f+"|"+h]||0)); });
    /* registro propio: se lleva a la cuenta del cliente igual que lo de Odoo */
    let EV=null;
    if(evr && evr.total){
      const aCli=ps=>new Set((ps||[]).map(x=>cuentaDe[x]).filter(Boolean));
      (evr.por_partner||[]).forEach(x=>{ const c=cli(x.p); if(!c) return; for(const k of ["ses","busq","sin","carr","desc_","cuenta"]) c.ev[k]+=x[k]||0; });
      Object.values(CLI).forEach(c=>{ c.busq=Math.max(c.busq,c.ev.busq); });
      EV={...evr, busq:(evr.busquedas||[]).map(b=>({...b,cli:aCli(b.pids)})), cats:(evr.categorias||[]).map(b=>({...b,cli:aCli(b.pids)})),
        carro:(evr.carrito||[]).map(b=>({...b,cli:aCli(b.pids)}))};
      /* el nombre de la categoría se toma de Odoo por su número: en el portal el
         título de la página dice "Tienda" y el h1 es el titular de la portada */
      const catIds=EV.cats.map(x=>x.id).filter(Boolean);
      if(catIds.length){ try{ const cn=arr(await EYG.rpc("product.public.category","read",[catIds,["name"]]));
        const nom={}; cn.forEach(x=>nom[x.id]=x.name); EV.cats.forEach(x=>{ x.nombre=nom[x.id]||("Categoría "+x.id); }); }catch(e){} }
    }
    if(yo!==MET_N) return;
    MET={R, CLI:Object.values(CLI), porDia, PROD:Object.values(PROD), BUS:Object.values(BUS), CARR, PEDS, HORA, EV, ANON, SC, AD:+ad||0, dAct};
  }catch(e){ if(yo!==MET_N) return; MET={R, error:String(e.message||e)}; }
  render();
}

/* ---------- filtros ---------- */
function filtrosHTML(cargando){
  const R=rango();
  const chips=PRESETS.map(([v,l])=>`<button class="chip ${RANGO.p===v?'on':''}" ${cargando?'disabled':''} onclick="metPreset('${v}')">${l}</button>`).join("");
  const coms=MET&&MET.CLI?[...new Set(MET.CLI.map(c=>c.com).filter(Boolean))].sort():[];
  const rubs=MET&&MET.CLI?[...new Set(MET.CLI.map(c=>c.rubro).filter(Boolean))].sort():[];
  return `<div class="filtros">

      ${rubs.length?`<select onchange="MF.rubro=this.value;MF.ver=50;render()"><option value="">Todos los rubros</option>${rubs.map(c=>`<option ${MF.rubro===c?"selected":""}>${esc(c)}</option>`).join("")}</select>`:""}

function metPreset(p){ RANGO.p=p; if(p==="custom"){ const R=rango(); RANGO.desde=RANGO.desde||R.d; RANGO.hasta=RANGO.hasta||R.a; render(); return; } metricas(); }

/* clientes que pasan los filtros de comercial y rubro (no los de la tabla) */
function base(){ return MET.CLI.filter(c=>(!MF.com||(MF.com==="—"?!c.com:c.com===MF.com)) && (!MF.rubro||c.rubro===MF.rubro)); }

function delta(hoy,antes,R){
  if(!R.comparar) return "";
  if(!antes) return hoy?`<div class="d up">nuevo en el período</div>`:`<div class="d flat">igual que antes</div>`;
  const p=Math.round((hoy-antes)/antes*100);
  if(p===0) return `<div class="d flat">igual que antes</div>`;
  return `<div class="d ${p>0?'up':'down'}" title="antes: ${num(antes)}">${p>0?'▲':'▼'} ${Math.abs(p)}% vs período anterior</div>`;
}

/* Métricas en cinco partes, para no tener todo en una sola tira:
   Resumen (los números del período), Clientes (la tabla y el detalle de cada uno),
   Miraron y no compraron, Productos y búsquedas, y Visitantes sin cuenta. */
const SECS=[["resumen","Resumen"],["clientes","Clientes"],["nocompraron","Miraron y no compraron"],["productos","Productos y búsquedas"],["sincuenta","Visitantes sin cuenta"]];
function metSec(s){ MF.sec=s; CLI_AB=null; render(); window.scrollTo(0,0); }
function vistaResumen(){
  if(!MET) return filtrosHTML(true)+`<div class="spin"></div>`;
  if(MET.error) return filtrosHTML()+`<div class="empty">No pude leer las métricas del portal.<br><span style="font-size:12.5px">${esc(MET.error)}</span></div>`;
  const B=base(), ids=new Set(B.map(c=>c.id));
  const secs=`<div class="chips secs">${SECS.map(([v,l])=>`<button class="chip ${MF.sec===v?'on':''}" onclick="metSec('${v}')">${l}</button>`).join("")}</div>`;
  const cuerpo=MF.sec==="clientes"?clientesHTML(B)
    :MF.sec==="nocompraron"?noCompraronHTML(B,ids)
    :MF.sec==="productos"?productosHTML(ids)

  return filtrosHTML()+secs+cuerpo;
}
const kpiH=(k,v,d,sub)=>`<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div>${d||""}${sub?`<div class="sub">${sub}</div>`:""}</div>`;
function actividadHTML(B){

  const conUsr=SEGS.slice(0,5).reduce((a,x)=>a+(n[x[0]]||0),0);

    ${SEGS.map(([k,l,d,col],i)=>`${i===5?'<div class="segsep"></div>':""}<div class="seg" onclick="metAct('${k}')"><span class="l"><i style="background:${col}"></i>${l}<span class="d">${d}${k==="sinusuario"&&!MF.rubro&&n[k]?` · ${num(farm)} son farmacias`:""}</span></span>
      <span class="bar"><i style="width:${Math.max(n[k]?1:0,pct(n[k]||0,conUsr||1))}%;background:${col}"></i></span><b>${num(n[k]||0)}</b><span class="p">${i<5?pct(n[k]||0,conUsr)+"%":""}</span></div>`).join("")}
    <div class="hint" style="margin-top:8px">Se cuenta una semana cuando el cliente entró al menos un día. "Compran y no tienen usuario" son los que conviene invitar al portal.</div></div>`;
}
function metAct(k){ MF.act=k; MF.estado="todos"; MF.ver=50; metSec("clientes"); }
function resumenHTML(B,ids){
  const R=MET.R, s=(f)=>B.reduce((a,c)=>a+f(c),0);

  const compraron=B.filter(c=>c.ped).length, compraronYEntraron=entraron.filter(c=>c.ped).length;
  const miraron=entraron.filter(c=>c.prodV).length, armaron=B.filter(c=>c.ped||c.carr).length;
  const carr=MET.CARR.filter(o=>ids.has(o.cli.id));
  const kpis=`<div class="kpis">

    ${kpiH("Visitas",num(visitas),delta(visitas,visitasP,R),"un cliente en un día")}
    ${kpiH("Páginas vistas",num(pv),delta(pv,pvP,R),`${num(s(c=>c.prodV))} fichas de producto`)}

  </div>`;
  const limp=MET.ANON?MET.SC.mon+MET.SC.pag+MET.SC.prodV:0;
  const nota=(limp||R.d<MON_DESDE)?`<div class="hint depu">🧹 ${limp?`Se descartaron ${num(limp)} registros que Odoo anotó a clientes y no eran suyos: el monitor del sistema, que abre el portal cada 5 minutos, y visitas sin iniciar sesión que Odoo le pasa al próximo cliente que entra (se ven en «Visitantes sin cuenta»).`:""}${R.d<MON_DESDE?` Antes del ${fD(MON_DESDE)} eso no se puede separar: las páginas de esas fechas pueden venir infladas.`:""}</div>`:"";

  const rec=recorridoHTML();
  return kpis+nota+actividadHTML(B)+graficoHTML(B,ids)+(rec?`<div class="dos">${emb}${rec}</div>${horasHTML()}`:`<div class="dos">${emb}${horasHTML()}</div>`)+cintaPanelHTML();
}

/* ---------- evolución ---------- */
const SERIES=[["clientes","Clientes que entraron"],["visitas","Visitas"],["pv","Páginas vistas"],["ped","Pedidos"],["monto","Facturado online"]];
function graficoHTML(B,ids){
  const R=MET.R, porMes=R.n>62, cubos={};
  const clave=d=>porMes?d.slice(0,7):d;
  // un balde por día (o por mes), aunque esté vacío, para que se vean los huecos
  for(let d=R.d; d<=R.a; d=addD(d,1)){ const k=clave(d); if(!cubos[k]) cubos[k]={k,cli:new Set(),visitas:0,pv:0,ped:0,monto:0}; }
  const todos=!MF.com&&!MF.rubro;
  for(const [d,x] of Object.entries(MET.porDia)){ const c=cubos[clave(d)]; if(!c) continue;
    if(todos){ c.pv+=x.pv; } x.cli.forEach(id=>{ if(ids.has(id)){ c.cli.add(id); c.visitas++; } }); }
  /* las páginas vistas por día están sumadas para todos: con un comercial o rubro elegido esa serie no se ofrece */
  MET.PEDS.forEach(o=>{ if(!ids.has(o.cli.id)) return; const c=cubos[clave(o.dia)]; if(c){ c.ped++; c.monto+=o.amount_total||0; } });
  const L=Object.values(cubos);
  const ser=(!todos&&SERIE==="pv")?"visitas":SERIE;
  const val=c=>ser==="clientes"?c.cli.size:c[ser];
  const max=Math.max(1,...L.map(val)), tot=ser==="clientes"?null:L.reduce((a,c)=>a+val(c),0);
  const fmt=v=>ser==="monto"?pesos(v):num(v);
  const rot=k=>porMes?MESES[+k.slice(5,7)-1]+" "+k.slice(2,4):fCorta(k);
  const cada=Math.ceil(L.length/14);
  const opciones=SERIES.filter(([v])=>todos||v!=="pv").map(([v,l])=>`<button class="chip sm ${ser===v?'on':''}" onclick="SERIE='${v}';render()">${l}</button>`).join("");
  return `<div class="panel"><h3>Evolución <span class="lite">· por ${porMes?"mes":"día"}${tot!==null?" · total "+fmt(tot):""}</span></h3>
    <div class="chips" style="margin-bottom:10px">${opciones}</div>
    <div class="evo" onmouseleave="tipOff()">${L.map((c,i)=>`<div class="b" onmousemove="tipOn(event,'${rot(c.k)}','${esc(fmt(val(c)))}')"><i style="height:${val(c)?Math.max(2,val(c)/max*100):0}%"></i><span>${i%cada===0?rot(c.k):""}</span></div>`).join("")}</div>
    ${!todos?'<div class="hint" style="margin-top:6px">Con un comercial o rubro elegido, las páginas vistas se ven en la tabla de clientes.</div>':""}</div>`;
}
function tipOn(e,a,b){ const t=document.getElementById("tip"); if(!t) return; t.innerHTML=`<b>${a}</b><br>${b}`; t.style.display="block"; t.style.left=(e.clientX+14)+"px"; t.style.top=(e.clientY-10)+"px"; }
function tipOff(){ const t=document.getElementById("tip"); if(t) t.style.display="none"; }

function horasHTML(){
  const H=MET.HORA, max=Math.max(1,...H.flat());
  const pico=[]; H.forEach((f,d)=>f.forEach((v,h)=>pico.push([v,d,h]))); pico.sort((a,b)=>b[0]-a[0]);
  const top=pico[0]&&pico[0][0]?`Pico: ${DSEM[pico[0][1]]} de ${pico[0][2]} a ${pico[0][2]+1} h`:"Sin datos";
  return `<div class="panel"><h3>Cuándo entran <span class="lite">· páginas vistas por día y hora · ${top}</span></h3>
    <div class="calor" onmouseleave="tipOff()">
      <div></div>${Array.from({length:24},(_,h)=>`<span class="hh">${h%3===0?h:""}</span>`).join("")}
      ${H.map((f,d)=>`<span class="dd">${DSEM[d]}</span>`+f.map((v,h)=>`<i onmousemove="tipOn(event,'${DSEM[d]} ${h}–${h+1} h','${num(v)} páginas')" style="background:${v?`rgba(4,135,130,${(.12+.88*v/max).toFixed(2)})`:"#F0F4F3"}"></i>`).join("")).join("")}
    </div>
    <div class="hint" style="margin-top:8px">Hora argentina. ${!MF.com&&!MF.rubro?"":"Es de todos los clientes (no se filtra por comercial ni rubro). "}Sirve para elegir cuándo mandar avisos o campañas.</div></div>`;
}

/* ---------- clientes ---------- */
const ESTADOS=[["todos","Todos"],["compraron","Compraron"],["nocompraron","Entraron y no compraron"],["carrito","Carrito sin confirmar"],["noentraron","Tienen usuario y no entraron"]];
function estadoCli(c){
  if(c.ped) return ["Compró","ok"];
  if(c.carr) return ["Carrito abierto","warn"];
  if(c.dias.size) return ["Miró, no compró","mid"];
  if(c.acceso) return ["No entró","off"];
  return ["",""];
}
function clientesFiltrados(B){
  let L=B.filter(c=>c.dias.size||c.ped||c.carr||c.acceso||c.v90);
  if(MF.act) L=L.filter(c=>segmento(c)===MF.act);
  const e=MF.estado;
  if(e==="compraron") L=L.filter(c=>c.ped);
  else if(e==="nocompraron") L=L.filter(c=>c.dias.size&&!c.ped);
  else if(e==="carrito") L=L.filter(c=>c.carr);
  else if(e==="noentraron") L=L.filter(c=>c.acceso&&!c.dias.size&&!c.ped);
  else if(!MF.act) L=L.filter(c=>c.dias.size||c.ped||c.carr);
  const q=(MF.q||"").trim().toLowerCase();
  if(q) L=L.filter(c=>(c.nom+" "+c.razon+" "+c.ciudad+" "+c.com).toLowerCase().includes(q));
  const k=MF.orden, v=c=>k==="nom"?c.nom.toLowerCase():k==="com"?c.com:k==="dias"?c.dias.size:k==="sem"?c.act.w.size:k==="ult"?(c.ultVisita||c.login||""):c[k];
  L.sort((a,b)=>{ const x=v(a), y=v(b); return (x<y?-1:x>y?1:0)*MF.dir || b.monto-a.monto || b.pv-a.pv; });
  return L;
}
function clientesHTML(B){
  const L=clientesFiltrados(B);
  return `<div class="panel" id="p-clientes"><h3>Clientes <span class="lite">· <span id="n-clientes">${num(L.length)}</span> · tocá uno para ver qué miró, buscó y compró</span></h3>
    <div class="chips" style="margin-bottom:8px"><span class="rot" style="margin:0 4px 0 0">Actividad:</span><button class="chip sm ${!MF.act?'on':''}" onclick="MF.act='';MF.ver=50;CLI_AB=null;render()">Todas</button>${SEGS.map(([v,l,d,col])=>`<button class="chip sm ${MF.act===v?'on':''}" title="${d}" onclick="MF.act='${v}';MF.ver=50;CLI_AB=null;render()"><i class="pt" style="background:${col}"></i>${l}</button>`).join("")}</div>
    <div class="fechas" style="margin-bottom:10px">
      <div class="chips"><span class="rot" style="margin:0 4px 0 0">En el período:</span>${ESTADOS.map(([v,l])=>`<button class="chip sm ${MF.estado===v?'on':''}" onclick="MF.estado='${v}';MF.ver=50;CLI_AB=null;render()">${l}</button>`).join("")}</div>
      <input class="buscar" placeholder="Buscar cliente, ciudad o comercial" value="${esc(MF.q)}" oninput="MF.q=this.value;metTabla()">
      <button class="btn ghost sm" onclick="metCSV()">⬇ Descargar CSV</button></div>

function filaCli(c){
  const [et,cl]=estadoCli(c), ab=CLI_AB===c.id;
  return `<tr class="cl ${ab?'ab':''}" onclick="metCliente(${c.id})">
    <td><b>${esc(c.nom)}</b>${c.razon?`<div class="sub">${esc(c.razon)}</div>`:""}<div class="sub">${esc([c.ciudad,c.com].filter(Boolean).join(" · "))}</div></td>
    <td>${et?`<span class="est ${cl}">${et}</span>`:""}${(sg=>sg?`<div class="sub" style="white-space:nowrap"><i class="pt" style="background:${SEGS.find(x=>x[0]===sg)[3]}"></i>${segNom(sg)}</div>`:"")(segmento(c))}</td>
    <td class="n" style="color:var(--gris)" title="semanas con ingreso, de las últimas ${ACT_SEM}">${c.act.w.size?num(c.act.w.size):"—"}</td>
    <td class="n">${num(c.dias.size)}</td><td class="n">${num(c.pv)}</td><td class="n">${num(c.prodD)}</td><td class="n">${num(c.busq)}</td>
    <td class="n">${num(c.ped)}</td><td class="n">${c.monto?pesos(c.monto):"—"}</td>

function tablaCli(L){
  const th=(k,l,n)=>`<th class="${n?'r':''} ord ${MF.orden===k?'on':''}" onclick="metOrden('${k}')">${l}${MF.orden===k?(MF.dir<0?" ↓":" ↑"):""}</th>`;

    <tbody>${filas||`<tr><td colspan="10" class="hint" style="padding:16px">Ningún cliente con esos filtros.</td></tr>`}</tbody></table>
    ${L.length>MF.ver?`<div style="text-align:center;margin-top:10px"><button class="btn ghost sm" onclick="MF.ver+=100;render()">Ver ${num(Math.min(100,L.length-MF.ver))} más (quedan ${num(L.length-MF.ver)})</button></div>`:""}`;

/* el buscador redibuja sólo la tabla, para no perder el foco del campo */
function metTabla(){
  const t=document.getElementById("t-clientes"); if(!t) return;
  const L=clientesFiltrados(base()); CLI_AB=null; t.innerHTML=tablaCli(L);
  const n=document.getElementById("n-clientes"); if(n) n.textContent=num(L.length);

function metOrden(k){ if(MF.orden===k) MF.dir*=-1; else { MF.orden=k; MF.dir=(k==="nom"||k==="com")?1:-1; } render(); }
async function metCliente(id){
  if(CLI_AB===id){ CLI_AB=null; render(); return; }
  CLI_AB=id; render();
  if(CLI_DET[id]) return;
  const c=MET.CLI.find(x=>x.id===id), R=MET.R;
  try{
    const ords=MET.PEDS.concat(MET.CARR).filter(o=>o.cli.id===id).map(o=>o.id);
    const [tr,lin,evs]=await Promise.all([
      c.vids.length?EYG.rpc("website.track","search_read",[[["visitor_id","in",c.vids],["visit_datetime",">=",aUTC(R.d)],["visit_datetime","<",aUTC(addD(R.a,1))]]],{fields:["url","product_id","visit_datetime"],limit:1500,order:"visit_datetime desc"}):[],
      ords.length?EYG.rpc("sale.order.line","search_read",[[["order_id","in",ords],["display_type","=",false],["is_delivery","=",false]]],{fields:["order_id","product_id","product_uom_qty","price_subtotal"],limit:0}):[],
      (R.a>=REG_DESDE && c.pids.length)?EYG.supa().from("portal_evento").select("ts,tipo,dato").in("partner_id",c.pids)
        .gte("ts",R.d+"T00:00:00-03:00").lt("ts",addD(R.a,1)+"T00:00:00-03:00").order("ts",{ascending:false}).limit(1000).then(r=>r.data||[]).catch(()=>[]):[],
    ]);
    const T=arr(tr), suyo=T.filter(t=>!MET.ANON.has(t.id) && !(t.visit_datetime>=MON_DESDE && esMonitor(t)));
    CLI_DET[id]={tr:suyo, fuera:T.length-suyo.length, tope:T.length>=1500, lin:arr(lin), ev:arr(evs)};
  }catch(e){ CLI_DET[id]={error:String(e.message||e)}; }
  if(CLI_AB===id) render();
}
function detalleHTML(c){
  const D=CLI_DET[c.id];
  if(!D) return `<div class="spin" style="margin:16px auto;width:26px;height:26px"></div>`;
  if(D.error) return `<div class="hint">No pude leer el detalle: ${esc(D.error)}</div>`;
  const dias={};
  const dia=k=>dias[k]||(dias[k]={k,pv:0,prods:[],busq:[],sin:[],cats:[],carro:[],cuenta:[],ords:[]});
  D.tr.forEach(t=>{ const x=dia(diaAR(t.visit_datetime)); if(t.url) x.pv++;
    if(t.product_id){ const n=sinCod(t.product_id[1]); if(!x.prods.includes(n)) x.prods.push(n); }
    try{ const q=new URL(t.url).searchParams.get("search"); if(q && !x.busq.includes(q.toLowerCase())) x.busq.push(q.toLowerCase()); }catch(e){} });

/* ---------- registro propio del portal ----------
   Lo que Odoo no guarda y anota el bloque eyg-analytics de la cabecera del portal
   (función portal-evento → tabla portal_evento, desde el 2/11/2026). Una "sesión"
   es un navegador hasta que pasan 30 minutos sin actividad. */
const PAG_NOM={inicio:"Inicio",catalogo:"Catálogo",categoria:"Categorías",producto:"Fichas de producto",resultados:"Resultados de búsqueda",buscar:"Buscador",
  carrito:"Carrito",compra_datos:"Compra · datos",compra_pago:"Compra · pago",compra_confirmada:"Compra confirmada",favoritos:"Favoritos",
  mi_cuenta:"Mi cuenta",mis_pedidos:"Mis pedidos",mi_pedido:"Un pedido",mis_facturas:"Mis facturas",mi_factura:"Una factura",mis_presupuestos:"Mis presupuestos",
  vademecum:"Vademécum",noticias:"Noticias",login:"Inicio de sesión",clave:"Crear o recuperar contraseña",alta:"Pedido de alta",contacto:"Contacto",otra:"Otras"};
const regTabla=(tit,sub,cols,filas,vacio)=>`<div class="panel"><h3>${tit}${sub?` <span class="lite">· ${sub}</span>`:""}</h3>${filas.length?`<table class="lista"><thead><tr>${cols.map((c,i)=>`<th${i?' class="r"':""}>${c}</th>`).join("")}</tr></thead><tbody>${filas.join("")}</tbody></table>`:`<div class="hint">${vacio}</div>`}</div>`;
const regFila=(t,...ns)=>`<tr><td class="url">${esc(t)}</td>${ns.map((n,i)=>`<td class="n"${i?' style="color:var(--gris)"':""}>${n}</td>`).join("")}</tr>`;
const deCli=(L,ids)=>L.map(x=>({...x,c:[...x.cli].filter(id=>ids.has(id)).length}));
/* sin registro propio en el período (es anterior al 2/11/2026) */
const regFalta=que=>`<div class="panel"><h3>${que}</h3><div class="hint">El portal lo registra desde el ${fD(REG_DESDE)}: elegí un período que llegue a esa fecha.</div></div>`;

/* ---------- Miraron y no compraron ----------

function noCompraronHTML(B,ids){
  const ent=B.filter(c=>c.dias.size), NC=ent.filter(c=>!c.ped), nc=new Set(NC.map(c=>c.id));

    ${hay?kpiH("Buscaron y no encontraron",num(NC.reduce((a,c)=>a+c.ev.sin,0)),"","búsquedas sin resultado"):""}

      <td class="mir">${t.length?t.slice(0,4).map(p=>`<span title="${esc(p.nom)}">${esc(corto(p.nom))}</span>`).join(" · ")+(t.length>4?` <span class="lite">y ${t.length-4} más</span>`:""):'<span class="lite">sólo la portada</span>'}</td>
      <td class="n">${num(c.dias.size)}</td><td class="n">${c.carr?pesos(c.carrMonto):"—"}</td>
      <td class="n" style="font-weight:600;color:var(--gris)">${c.ultVisita?fD(c.ultVisita):"—"}</td></tr>`; }).join("");
  const cada=`<div class="panel"><h3>Qué miró cada uno <span class="lite">· tocá uno para ver su detalle día por día</span></h3>
    ${filas?`<div style="overflow-x:auto"><table class="lista"><thead><tr><th>Cliente</th><th>Lo que más miró</th><th class="r">Visitas</th><th class="r">Carrito</th><th class="r">Última visita</th></tr></thead><tbody>${filas}</tbody></table></div>
      ${L.length>30?`<div style="text-align:center;margin-top:10px"><button class="btn ghost sm" onclick="MF.estado='nocompraron';MF.ver=50;metSec('clientes')">Ver los ${num(L.length)} en la tabla de clientes</button></div>`:""}`

  const P=MET.PROD.map(p=>{ const m=[...p.cli].filter(id=>ids.has(id)), k=m.filter(id=>p.comp.has(id)).length; return {...p,m:m.length,k,no:m.length-k}; })
    .filter(p=>p.no).sort((a,b)=>b.no-a.no||b.m-a.m).slice(0,20);
  const prods=regTabla("Productos que miran y no compran","de los clientes que lo miraron",["Producto","Miraron","Lo compraron","No"],
    P.map(p=>`<tr>${prodTd(p.nom)}<td class="n" style="color:var(--gris)">${num(p.m)}</td><td class="n" style="color:var(--gris)">${num(p.k)}</td><td class="n">${num(p.no)}</td></tr>`),"Sin productos mirados en el período.");
  let reg="";
  if(hay){
    const cats=deCli(E.cats,nc).filter(x=>x.c).sort((a,b)=>b.c-a.c||b.n-a.n).slice(0,12);

    </div>`;
  }
  return kpis+cada+`<div class="dos">${prods}${carritosHTML(MET.CARR.filter(o=>nc.has(o.cli.id)))}</div>`+reg+

  const name=(document.getElementById("n-tit")||{}).value||"", sub=(document.getElementById("n-sub")||{}).value||"", txt=(document.getElementById("n-txt")||{}).value||"";

function estadoPill(c){
  return c.activo===false ? '<span class="pill off">Desactivada</span>'
       : (c.desde&&c.desde>hoy()) ? '<span class="pill prog">Programada</span>'
       : (c.hasta&&c.hasta<hoy()) ? '<span class="pill venc">Vencida</span>'
       : '<span class="pill dest">Activa</span>';
}

/* ================= Cinta del portal (la ven los CLIENTES) =================
   Es la franja que va debajo de la barra verde del menú, en el portal de clientes
   (drogueriaeyg.odoo.com). Dos piezas:
   · Config: `ir.config_parameter` eyg.portal_cinta (SEPARADO de eyg.comunicaciones,
     que es interno). { activo, alcance, cerrable, notificarA, copiaA, avisos:[…] }.
   · Quién ve cada aviso: lo decide la edge function `portal-cinta` server-side, para
     que los datos del cliente (perfil crediticio, deuda) NUNCA viajen a su navegador.
   El PERFIL CREDITICIO es el mismo que ve el comercial en su panel: cruza BCRA con el
   historial de pago en EyG (EYG.evalCredito). Los avisos tipo "beneficio" muestran un
   botón: al tocarlo, le entra una novedad al comercial en la campanita y queda el

/* Pedidos del beneficio + entregas (a quién se le mostró y qué hizo). */
async function cintaDatos(){
  try{
    await cargarInternos();
    const [ped,ent]=await Promise.all([
      EYG.supa().from("portal_beneficio").select("*").order("creado",{ascending:false}).limit(500),
      EYG.supa().from("portal_entrega").select("*").limit(5000),
    ]);
    CPED = ped.error?[]:(ped.data||[]);
    CENT = ent.error?[]:(ent.data||[]);
  }catch(e){ CPED=[]; CENT=[]; }
  return CPED;
}
/* Resumen por aviso: entregados, vistas, activaron, descartaron, sin responder. */
function cintaStats(avisoId){
  const f=CENT.filter(x=>x.aviso_id===avisoId && !INTERNOS.includes(x.partner_id));
  const act=f.filter(x=>x.activado).length, rec=f.filter(x=>x.rechazado).length;
  return {entregados:f.length,
          vistas:f.reduce((a,x)=>a+(x.vistas||0),0),
          imp:f.reduce((a,x)=>a+(x.impresiones||x.vistas||0),0),
          act, rec, mudos:Math.max(0,f.length-act-rec), tasa:f.length?Math.round(act/f.length*100):0};
}

      <div class="fld"><label>Lo importante (en negrita)</label><input id="c-tit" maxlength="80" placeholder="Tu cuenta aplica para pagar a 120 días con cheque." value="${esc(e.titulo||"")}" oninput="cintaPrev()"></div>
    </div>
    <div class="fld"><label>El resto del texto</label><input id="c-txt" maxlength="140" placeholder="Es un beneficio para clientes seleccionados del portal." value="${esc(e.texto||"")}" oninput="cintaPrev()"><div class="hint">Es una sola línea: entre las dos, no más de ~150 caracteres.</div></div>
    <div class="row2">
      <div class="fld"><label>${esBen?"Texto del botón":"Botón (opcional)"}</label><input id="c-cta" maxlength="28" placeholder="${esBen?"Quiero aplicarlo":"Consultar por WhatsApp"}" value="${esc(e.ctaTexto||"")}" oninput="cintaPrev()"><div class="hint">${esBen?"Que no repita lo que ya dice la cinta.":""}</div></div>
      ${esBen?"":`<div class="fld"><label>Adónde lleva</label><input id="c-url" placeholder="https://wa.me/549341… o /shop/category/263" value="${esc(e.ctaUrl||"")}" oninput="cintaPrev()"><div class="hint">Un link de WhatsApp, o una página del portal (arrancá con /).</div></div>`}
    </div>
    ${esBen?`<div class="row2">
      <div class="fld"><label>Confirmación (lo que ve al tocar el botón)</label><input id="c-conf" maxlength="130" placeholder="Listo: ya le avisamos a tu vendedor para que aplique el beneficio en tu cuenta." value="${esc(e.confirmacion||"")}" oninput="cintaPrev()"></div>
      <div class="fld"><label>Letra chica</label><input id="c-fine" maxlength="120" placeholder="Aplican términos y condiciones, que te vamos a informar." value="${esc(e.letraChica||"")}" oninput="cintaPrev()"></div>
    </div>`:""}

    <div style="border-top:1px dashed var(--line);margin:16px 0 14px;padding-top:14px">
      <label style="display:block;font-size:12px;font-weight:700;color:var(--gris);margin-bottom:8px">¿A QUIÉNES LES LLEGA?</label>
      <div class="hint" style="margin:-4px 0 12px">Todo lo que dejes vacío no filtra. Se evalúa en el momento en que el cliente entra al portal.</div>

      <div class="fld"><label>Perfil crediticio</label>
        ${chips("perfil",PERFILES)}
        <div class="hint">El mismo que ve el comercial en su listado de clientes: cruza el BCRA (situación y cheques rechazados) con cómo paga en EyG. Para un beneficio de pago, lo natural es <b>Apto</b> (y si querés, <b>Apto con reparos</b>).</div></div>

      <div class="row2">
        <div class="fld"><label>Rubro</label>${chips("rubro",opc.rubro.map(r=>[r,r]).concat([[SINVAL,"Sin rubro"]]))}</div>
      </div>
      <div class="fld"><label>Comercial asignado</label>${chips("comercial",opc.comercial.map(c=>[c,c]).concat([[SINVAL,"Sin comercial"]]))}</div>
      <div class="row2">
        <div class="fld"><label>Provincia</label>${chips("provincia",opc.provincia.map(p=>[p,p]).concat([[SINVAL,"Sin provincia"]]))}</div>
      </div>
      <div class="fld"><label>Condición de pago que tiene hoy</label>${chips("pago",opc.pago.map(p=>[p,p]).concat([[SINVAL,"Sin condición"]]))}
        <div class="hint">Sirve para no ofrecérselo a quien ya lo tiene.</div></div>

      <div class="row2">
        <div class="fld"><label>Compró en los últimos… (días)</label><input id="c-dias" type="number" min="0" value="${e.filtros?(e.filtros.compro_dias||0):0}" placeholder="0"><div class="hint">0 = no filtra.</div></div>
        <div class="fld"><label>Facturación acumulada mínima ($)</label><input id="c-fact" type="number" min="0" value="${e.filtros?(e.filtros.facturado_min||0):0}" placeholder="0"><div class="hint">0 = no filtra.</div></div>
      </div>

      <div class="fld"><label>Modo prueba — mostrárselo SOLO a estos clientes</label>
        ${cintaPicker("solo_ids")}
        <div class="hint">Si hay alguno acá, nadie más lo ve. Ideal para probar antes de largarlo.</div></div>
      <div class="fld"><label>Excluir estos clientes</label>${cintaPicker("excluir_ids")}</div>

      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="btn ghost sm" onclick="cintaContar()">👥 ¿A cuántos les llega?</button>
        <span class="hint" id="c-cuenta">${CCUENTA||""}</span>
      </div>
    </div>

    <div style="border-top:1px dashed var(--line);margin:16px 0 14px;padding-top:14px">
      <label style="display:block;font-size:12px;font-weight:700;color:var(--gris);margin-bottom:8px">¿CÓMO SE ENTREGA?</label>
      <div class="sw" style="margin-bottom:10px">
        <div class="knob ${e.seguirEntregando===false?'':'on'}" onclick="cintaEntrega('seguirEntregando',${e.seguirEntregando===false})"><i></i></div>
        <b style="flex:none">Seguir entregándolo a los que se sumen</b>
        <span class="hint">Un cliente nuevo que se registra en el portal, o uno que empieza a cumplir las condiciones, lo recibe solo. Si lo apagás, queda congelado en los que ya lo tienen.</span>
      </div>
      <div class="fld" style="max-width:280px"><label>Máximo de veces por cliente</label>
        <input id="c-veces" type="number" min="0" value="${e.maxVistas||0}" placeholder="0">
        <div class="hint"><b>0 = hasta que responda</b> (le sigue apareciendo mientras no lo active ni lo descarte). Con 3, por ejemplo, se lo mostramos tres visitas y no lo molestamos más.</div></div>
      <div class="hint">A nadie se le entrega dos veces lo mismo: queda registrado quién ya lo recibió. Si después <b>ampliás las condiciones</b>, el aviso sale solo para los que entran ahora.</div>
    </div>

    <div class="row2">
      <div class="fld"><label>Desde</label><input id="c-desde" type="date" value="${esc(e.desde||hoy())}"></div>
      <div class="fld"><label>Hasta (opcional)</label><input id="c-hasta" type="date" value="${esc(e.hasta||"")}"><div class="hint">Vacío = hasta que lo saques.</div></div>
    </div>
    <div class="acts" style="margin-top:4px">
      <button class="btn" id="c-guardar" onclick="cintaGuardarAviso()">Guardar aviso</button>
      <button class="btn ghost" onclick="CEDIT=null;CBUSCA=null;render()">Cancelar</button>
    </div></div>`;
}
/* Buscador de clientes para las listas de incluir/excluir. */
function cintaPicker(campo){
  const f=CEDIT.filtros||filtrosDefault(), ids=f[campo]||[];
  const puestos=ids.map(id=>`<div class="chk on" onclick="cintaQuitarId('${campo}',${id})">${esc(CNOM[id]||("Cliente "+id))} ✕</div>`).join("");
  const res=(CBUSCA&&CBUSCA.campo===campo)?`<div class="chks" style="margin-top:6px">${
      CBUSCA.items.length?CBUSCA.items.map(p=>`<div class="chk" onclick="cintaSumarId('${campo}',${p.id},'${esc(String(p.name).replace(/'/g,"\\'"))}')">${esc(p.name)}</div>`).join("")
      :'<span class="hint">No encontré ningún cliente con ese nombre.</span>'}</div>`:"";
  return `<div class="chks">${puestos||'<span class="hint">Nadie por ahora.</span>'}</div>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
      <input id="c-busca-${campo}" placeholder="Buscar cliente por nombre…" style="flex:1;min-width:200px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px" onkeydown="if(event.key==='Enter'){event.preventDefault();cintaBuscar('${campo}')}">
      <button class="btn ghost sm" onclick="cintaBuscar('${campo}')">Buscar</button>
    </div>${res}`;
}
function cintaLista(){
  const avisos=CINTA.avisos||[];
  if(!avisos.length) return `<div class="empty">Todavía no hay avisos en la cinta.<br><span style="font-size:12.5px">Creá uno y sale al portal en el momento.</span></div>`;
  return avisos.map(a=>{
    const ped=CPED.filter(p=>p.aviso_id===a.id && !INTERNOS.includes(p.partner_id)).length, st=cintaStats(a.id);
    const f=a.filtros||{};
    const seg=[];
    if((f.perfil||[]).length) seg.push("perfil: "+f.perfil.map(p=>(PERFILES.find(x=>x[0]===p)||[p,p])[1]).join(", "));
    if((f.rubro||[]).length) seg.push("rubro: "+f.rubro.join(", "));
    if((f.comercial||[]).length) seg.push(f.comercial.length+" comercial(es)");
    if((f.provincia||[]).length) seg.push(f.provincia.join(", "));
    if((f.pago||[]).length) seg.push("cond. de pago");
    if(f.compro_dias>0) seg.push("compró en "+f.compro_dias+" días");
    if(f.facturado_min>0) seg.push("facturó +$"+f.facturado_min);
    if((f.excluir_ids||[]).length) seg.push(f.excluir_ids.length+" excluido(s)");
    const prueba=(f.solo_ids||[]).length;
    return `<div class="card">
      <div class="top">${a.destacado?`<span class="pill dest">${esc(a.destacado)}</span>`:""}
        ${a.tipo==="beneficio"?'<span class="pill" style="background:#FBE3D4;color:#B45816">🎁 Beneficio</span>':""}
        <h3>${esc(a.titulo||a.texto||"(sin texto)")}</h3>${estadoPill(a)}
        ${prueba?`<span class="pill prog">Prueba · ${prueba} cliente${prueba===1?"":"s"}</span>`:""}</div>
      ${a.titulo&&a.texto?`<div class="cuerpo">${esc(a.texto)}</div>`:""}
      <div class="meta">
        <span>👥 ${prueba?"solo la lista de prueba":(seg.length?esc(seg.join(" · ")):"todos los clientes")}</span>
        <span>🗓️ desde ${a.desde?fD(a.desde):"siempre"}</span>${a.hasta?`<span>⏳ hasta ${fD(a.hasta)}</span>`:""}
        ${a.tipo==="beneficio"?`<span>🤝 ${ped} pedido${ped===1?"":"s"}</span>`:""}
        <span>👁️ ${st.entregados} recibieron${st.act?` · ${st.act} activaron`:""}${st.rec?` · ${st.rec} descartaron`:""}</span>
        ${a.seguirEntregando===false?'<span>⏸️ congelado</span>':''}${a.maxVistas?`<span>máx ${a.maxVistas} veces</span>`:''}</div>
      <div class="acts">
        <button class="btn ghost sm" onclick="cintaEditar('${a.id}')">✏️ Editar</button>
        <button class="btn ghost sm" onclick="cintaToggle('${a.id}')">${a.activo===false?"✅ Reactivar":"🚫 Desactivar"}</button>
        <button class="btn warn sm" onclick="cintaBorrar('${a.id}')">🗑️ Borrar</button>
      </div></div>`;
  }).join("");
}
function cintaPedidosHTML(){
  if(!CPED.length) return "";
  return `<div class="formbox" style="max-width:860px;margin-top:16px">
    <h2>🤝 Pidieron el beneficio (${CPED.filter(p=>!INTERNOS.includes(p.partner_id)).length})</h2>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="text-align:left;color:var(--gris2);font-size:11.5px">
        <th style="padding:6px 8px">Cuándo</th><th style="padding:6px 8px">Cliente</th><th style="padding:6px 8px">Comercial</th><th style="padding:6px 8px">Aviso</th></tr></thead>
      <tbody>${CPED.map(p=>`<tr style="border-top:1px solid var(--line)">
        <td style="padding:7px 8px;white-space:nowrap">${fD(p.creado)}</td>
        <td style="padding:7px 8px"><b>${esc(p.partner_nombre||("Cliente "+p.partner_id))}</b>${INTERNOS.includes(p.partner_id)?' <span class="pill prog">prueba interna</span>':''}</td>
        <td style="padding:7px 8px">${esc(p.comercial||"—")} ${p.notificado?'<span class="pill dest">avisado</span>':'<span class="pill off">sin avisar</span>'}</td>
        <td style="padding:7px 8px;color:var(--gris)">${esc((p.detalle&&p.detalle.titulo)||p.aviso_id)}</td></tr>`).join("")}</tbody>
    </table></div></div>`;
}

/* ---------------- Acciones ---------------- */
function cintaPrev(){
  if(!CEDIT) return; cintaSync();
  const box=document.querySelector(".cinprev .cinta:not(.ok)"); if(box) box.innerHTML=cintaPreviewHTML(CEDIT);
  const ok=document.querySelector(".cinprev .cinta.ok"); if(ok) ok.innerHTML=cintaPreviewOK(CEDIT);
}
function cintaSync(){
  if(!CEDIT) return;
  const g=id=>{ const e=document.getElementById(id); return e?e.value:undefined; };
  const map={destacado:"c-dest",titulo:"c-tit",texto:"c-txt",ctaTexto:"c-cta",ctaUrl:"c-url",
             confirmacion:"c-conf",letraChica:"c-fine",desde:"c-desde",hasta:"c-hasta"};
  Object.keys(map).forEach(k=>{ const v=g(map[k]); if(v!==undefined) CEDIT[k]=v; });
  CEDIT.filtros=CEDIT.filtros||filtrosDefault();
  const d=g("c-dias"), fa=g("c-fact"), v=g("c-veces");
  if(d!==undefined) CEDIT.filtros.compro_dias=Math.max(0,parseInt(d||"0",10)||0);
  if(fa!==undefined) CEDIT.filtros.facturado_min=Math.max(0,parseFloat(fa||"0")||0);
  if(v!==undefined) CEDIT.maxVistas=Math.max(0,parseInt(v||"0",10)||0);
}
function cintaEntrega(campo,valor){ cintaSync(); CEDIT[campo]=valor; render(); }
async function cintaGeneral(campo,valor){ CINTA[campo]=valor; render(); await cintaGuardar("Listo ✓"); }
function cintaTipo(t){ cintaSync(); CEDIT.tipo=t; if(t==="beneficio") CEDIT.ctaUrl=""; render(); }
function cintaFiltro(campo,valor){
  cintaSync();
  const f=CEDIT.filtros=CEDIT.filtros||filtrosDefault();
  const s=new Set(f[campo]||[]); s.has(valor)?s.delete(valor):s.add(valor);
  f[campo]=[...s]; CCUENTA=null; render();
}
function cintaSumarId(campo,id,nombre){
  cintaSync(); CNOM[id]=nombre;
  const f=CEDIT.filtros=CEDIT.filtros||filtrosDefault();
  if(!(f[campo]||[]).includes(id)) f[campo]=[...(f[campo]||[]),id];
  CBUSCA=null; CCUENTA=null; render();
}
function cintaQuitarId(campo,id){
  cintaSync();
  const f=CEDIT.filtros=CEDIT.filtros||filtrosDefault();
  f[campo]=(f[campo]||[]).filter(x=>x!==id); CCUENTA=null; render();
}
async function cintaBuscar(campo){
  const q=(document.getElementById("c-busca-"+campo)||{}).value||"";
  if(q.trim().length<2){ toast("Escribí al menos 2 letras."); return; }
  cintaSync();
  try{
    const r=await EYG.rpc("res.partner","search_read",[[["name","ilike",q.trim()]]],{fields:["id","name"],limit:12,context:{lang:"es_AR"}});
    CBUSCA={campo, items:r||[]}; render();
  }catch(e){ toast("No pude buscar: "+(e.message||e)); }
}
async function cintaContar(){
  cintaSync();
  const el=document.getElementById("c-cuenta"); if(el) el.textContent="Contando…";
  try{
    const j=await cintaFn({accion:"contar", filtros:CEDIT.filtros||filtrosDefault()});
    if(!j||!j.ok) throw new Error((j&&j.error)||"no pude contar");
    CCUENTA=`Le llega a ${j.cumplen} de ${j.total} clientes.` +
      (j.sinBcra?` (a ${j.sinBcra} todavía no les consultamos el BCRA: se verifica solo cuando entran al portal)`:"");
    if(el) el.textContent=CCUENTA;
  }catch(e){ CCUENTA=""; if(el) el.textContent="No pude contar: "+(e.message||e); }
}
function cintaNuevo(){
  CEDIT={id:"cin_"+Date.now()+"_"+Math.random().toString(36).slice(2,6), tipo:"aviso", destacado:"Nuevo", seguirEntregando:true, maxVistas:0,
         titulo:"", texto:"", ctaTexto:"", ctaUrl:"", confirmacion:"", letraChica:"",
         desde:hoy(), hasta:"", activo:true, filtros:filtrosDefault()};
  CBUSCA=null; CCUENTA=null; render();
}
function cintaEditar(id){
  const a=(CINTA.avisos||[]).find(x=>x.id===id); if(!a) return;
  CEDIT={...a, filtros:Object.assign(filtrosDefault(), a.filtros||{})};
  CBUSCA=null; CCUENTA=null; render();
  cintaNombres(CEDIT.filtros);
}
/* Trae los nombres de los clientes elegidos (para las pastillas). */
async function cintaNombres(f){
  const ids=[...new Set([...(f.solo_ids||[]),...(f.excluir_ids||[])])].filter(id=>!CNOM[id]);
  if(!ids.length) return;
  try{
    const r=await EYG.rpc("res.partner","read",[ids,["name"]],{context:{lang:"es_AR"}});
    (r||[]).forEach(p=>CNOM[p.id]=p.name);
    if(TAB==="cinta"&&CEDIT) render();
  }catch(e){}
}
async function cintaGuardarAviso(){
  cintaSync();
  if(!(CEDIT.titulo||"").trim() && !(CEDIT.texto||"").trim()){ toast("Escribí el aviso."); return; }
  const esBen=(CEDIT.tipo==="beneficio");
  if(esBen && !(CEDIT.ctaTexto||"").trim()){ toast("Ponele texto al botón."); return; }
  if(!esBen){
    const url=(CEDIT.ctaUrl||"").trim();
    if((CEDIT.ctaTexto||"").trim() && !url){ toast("Al botón le falta el link."); return; }
    if(url && !/^(https?:\/\/|\/)/.test(url)){ toast("El link tiene que empezar con https:// o con /"); return; }
  }
  const btn=document.getElementById("c-guardar"); if(btn){ btn.disabled=true; btn.textContent="Guardando…"; }
  const i=(CINTA.avisos||[]).findIndex(x=>x.id===CEDIT.id);
  if(i>-1) CINTA.avisos[i]={...CINTA.avisos[i], ...CEDIT}; else CINTA.avisos.push({...CEDIT, activo:true});
  const ok=await cintaGuardar("Aviso publicado en el portal ✓");
  if(ok){ CEDIT=null; CBUSCA=null; render(); } else if(btn){ btn.disabled=false; btn.textContent="Guardar aviso"; }
}
async function cintaToggle(id){ const a=(CINTA.avisos||[]).find(x=>x.id===id); if(!a) return; a.activo=(a.activo===false); render(); await cintaGuardar(a.activo?"Aviso reactivado":"Aviso desactivado"); }
async function cintaBorrar(id){ if(!confirm("¿Borrar este aviso de la cinta?")) return; CINTA.avisos=(CINTA.avisos||[]).filter(x=>x.id!==id); render(); await cintaGuardar("Borrado"); }

</script>
</body>
</html>
