<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal web · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<style>
  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .tab{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 15px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--gris);display:flex;align-items:center;gap:7px}
  .tab.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .btn{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit}
  .btn:hover{background:var(--teal-deep)} .btn:disabled{opacity:.55;cursor:default}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--gris)} .btn.ghost:hover{border-color:var(--teal-med)}
  .btn.warn{background:#fff;border:1px solid #f0b8b5;color:#b0322f} .btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:15px 16px;margin-bottom:13px}
  .card .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card h3{font-size:15.5px;font-weight:800;line-height:1.3}
  .card .cuerpo{font-size:13.5px;color:var(--gris);white-space:pre-wrap;line-height:1.45;margin-top:6px}
  .card .meta{font-size:11.5px;color:var(--gris2);margin-top:9px;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
  .card .acts{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
  .pill{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;border-radius:20px;padding:2px 9px}
  .pill.dest{background:var(--agua);color:var(--teal-deep)} .pill.venc{background:#eee;color:#888} .pill.prog{background:#fbf0d6;color:#9a6a0b} .pill.off{background:#eee;color:#888}
  .empty{padding:34px;text-align:center;color:var(--gris);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
  .fld{margin-bottom:13px} .fld label{display:block;font-size:12px;font-weight:700;color:var(--gris);margin-bottom:5px}
  .fld input,.fld textarea,.fld select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff}
  .fld textarea{min-height:150px;resize:vertical} .row2{display:flex;gap:12px;flex-wrap:wrap} .row2>div{flex:1;min-width:150px}
  .hint{font-size:11.5px;color:var(--gris2);margin-top:4px}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .opt{border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--gris);display:flex;align-items:center;gap:7px}
  .opt.on{border-color:var(--teal);background:var(--agua);color:var(--teal-deep)}
  .chks{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .chk{border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--gris)}
  .chk.on{border-color:var(--teal);background:var(--agua);color:var(--teal-deep)}
  .formbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px;max-width:720px}
  .formbox h2{font-size:16px;font-weight:800;margin-bottom:14px}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;margin:44px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 26px rgba(0,0,0,.25);z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}

  /* ---- Resumen ---- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 15px}
  .kpi .k{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--gris2)}
  .kpi .v{font-size:25px;font-weight:800;letter-spacing:-.7px;margin-top:5px;color:var(--ink)}
  .kpi .d{font-size:11.5px;font-weight:700;margin-top:4px}
  .kpi .d.up{color:#1E7D46} .kpi .d.down{color:#B0322F} .kpi .d.flat{color:var(--gris2)}
  .kpi .sub{font-size:11.5px;color:var(--gris2);margin-top:3px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
  .panel h3{font-size:14.5px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .panel h3 .lite{font-weight:600;font-size:12px;color:var(--gris2)}
  .barras{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
  .barras .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
  .barras .b i{display:block;width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#0AA89F,#048782);min-height:3px}
  .barras .b span{font-size:10px;color:var(--gris2);white-space:nowrap}
  .barras .b b{font-size:10.5px;color:var(--teal-deep)}
  .lista{width:100%;border-collapse:collapse;font-size:13px}
  .lista th{text-align:left;color:var(--gris2);font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:6px 8px;font-weight:700}
  .lista td{padding:7px 8px;border-top:1px solid var(--line)}
  .lista td.n{text-align:right;font-variant-numeric:tabular-nums;color:var(--teal-deep);font-weight:700;white-space:nowrap}
  .lista .url{color:var(--gris);word-break:break-all}

  /* ---- Cinta: vista previa igual a la del portal ---- */
  .cinprev{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow)}
  .cinprev .barra{background:#06413E;color:#fff;font-size:12px;letter-spacing:1.6px;padding:13px 16px;display:flex;gap:22px;font-weight:600}
  .cinprev .pie{background:radial-gradient(90% 130% at 50% -20%,#E2F1EF,#FBFCFB 72%);padding:14px 16px;text-align:center;color:#8A9A97;font-size:12.5px}
  .cinta{position:relative;overflow:hidden;color:#fff;background:linear-gradient(100deg,#E4763F 0%,#EC8B5E 46%,#F0A177 100%);display:flex;align-items:center;min-height:44px}
  .cinta::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 2px,transparent 2px 16px);pointer-events:none}
  .cinta.ok{background:linear-gradient(100deg,#0A6F66 0%,#048782 55%,#0AA89F 100%)}
  .cinta .cin{position:relative;z-index:1;width:100%;padding:5px 18px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
  .cinta .cin-pill{flex:0 0 auto;font-size:10px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;border-radius:999px;padding:4px 10px;background:rgba(255,255,255,.92);color:#B4501C}
  .cinta.ok .cin-pill{color:#04635F}
  .cinta .cin-ico svg{width:18px;height:18px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .cinta .cin-txt{font-size:13.8px;font-weight:500;line-height:1.3} .cinta .cin-txt b{font-weight:800}
  .cinta .cin-fine{display:block;font-size:11.5px;font-weight:400;opacity:.85;margin-top:2px}
  .cinta .cin-cta{margin-left:auto;flex:0 0 auto;font-size:12.8px;font-weight:700;line-height:1.2;background:#fff;color:#B4501C;border-radius:999px;padding:6px 15px;white-space:nowrap}
  .cinta.ok .cin-cta{color:#04635F}
  .cinta .cin-no{flex:0 0 auto;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.82);text-decoration:underline;margin-left:12px}
  .cinta .cin.sincta .cin-no{margin-left:auto}
  .cinta .vacia{padding:13px 18px;font-size:13.5px;color:#fff;opacity:.9}
  .sw{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:13px;flex-wrap:wrap}
  .sw b{font-size:13.5px} .sw .hint{margin:0}
  .sw select{padding:7px 10px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px;background:#fff}
  .knob{width:46px;height:26px;border-radius:20px;background:#cfd8d6;position:relative;cursor:pointer;flex:none;transition:background .15s}
  .knob i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .knob.on{background:var(--teal)} .knob.on i{left:23px}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=43"></script>
<script>
/* ============ EyG Core · Portal web ============
   Todo lo del portal de clientes (drogueriaeyg.odoo.com) en un solo lugar:
   · Resumen: qué pasa en el portal (visitas, clientes que entran, pedidos online).
   · Cinta: la franja de avisos que ven los clientes, con su segmentación y los
     pedidos de beneficios que llegan desde ahí.
   · Noticias: las novedades que se publican en el portal (blog de Odoo).
   Acá se irán sumando más cosas del portal (notificaciones, campañas, etc.). */
const esc=s=>EYG.esc(s), money=s=>EYG.money(s);
const hoy=()=>EYG.argToday();
function fD(s){ if(!s) return ""; s=String(s).slice(0,10); return s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4); }
function nDias(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,19).replace("T"," "); }
const num=n=>Math.round(n||0).toLocaleString("es-AR");

let PERFIL, TAB="resumen";
let toastT; function toast(msg, ok){ const t=document.getElementById("toast"); if(!t)return; t.textContent=msg; t.className="toast show"+(ok?" ok":""); clearTimeout(toastT); toastT=setTimeout(()=>t.className="toast",2600); }

EYG.guard(["direccion","admin"]).then(async perfil=>{
  PERFIL=perfil; window.__perfil=perfil;
  document.body.innerHTML = EYG.layout(perfil,"portal",'<div id="cont"><div class="spin"></div></div><div class="toast" id="toast"></div>',"Portal web");
  render(); cargarTab();
});

function render(){
  const cont=document.getElementById("cont"); if(!cont) return;
  const tabs=`<div class="tabs">
    <button class="tab ${TAB==='resumen'?'on':''}" onclick="setTab('resumen')">📈 Resumen</button>
    <button class="tab ${TAB==='cinta'?'on':''}" onclick="setTab('cinta')">📢 Cinta de avisos</button>
    <button class="tab ${TAB==='noticias'?'on':''}" onclick="setTab('noticias')">📰 Noticias</button>
  </div>`;
  let body="";
  if(TAB==="resumen") body=vistaResumen();
  else if(TAB==="cinta") body=vistaCinta();
  else body=vistaNoticias();
  cont.innerHTML=tabs+`<div id="body">${body}</div>`;
}
function setTab(t){ if(t===TAB) return; TAB=t; CEDIT=null; render(); cargarTab(); }
function cargarTab(){
  if(TAB==="resumen" && !MET) metricas();
  if(TAB==="resumen" && !CINTA) cintaCargar();
  if(TAB==="cinta" && !CINTA) cintaCargar();
  if(TAB==="noticias" && !POSTS) noticiasCargar();
}

/* ======================= RESUMEN =======================
   Todo sale de Odoo en vivo: website.track (páginas vistas), website.visitor
   (visitantes), res.users share=true (clientes con acceso) y sale.order con
   website_id (los pedidos que entran POR el portal, no los que carga el
   comercial). Se compara contra el período anterior de igual largo. */
let MET=null, DIAS=30, INTERNOS=[];
/* La gente de EyG entra al portal todo el día (para mirar precios, cargar pedidos o
   probar cosas): si no los sacamos, la mitad de las visitas son nuestras. Internos =
   usuarios de Odoo que NO son del portal (share=false). */
async function cargarInternos(){
  if(INTERNOS.length) return INTERNOS;
  try{
    const u=await EYG.rpc("res.users","search_read",[[["share","=",false],["active","=",true]]],{fields:["partner_id"],limit:300});
    INTERNOS=[...new Set((u||[]).map(x=>x.partner_id&&x.partner_id[0]).filter(Boolean))];
  }catch(e){ INTERNOS=[]; }
  return INTERNOS;
}
const DESDE=d=>nDias(d);
/* La URL viene entera (https://drogueriaeyg.odoo.com/shop/…): mostramos sólo el camino,
   y le ponemos nombre a las páginas conocidas para que se lea de un vistazo.
   Las categorías del portal son las del panel de la tienda (public.category). */
const CATS={64:"Hospitalarios",63:"Descartables",66:"Línea Éticos",65:"Perfumería",67:"Farmacopea",
  262:"Equipos Médicos",265:"Ortopedia",263:"Ofertas",264:"Nuevos ingresos"};
function linda(u){
  let p=String(u||"").replace(/^https?:\/\/[^/]+/,"")||"/";
  p=p.split("?")[0];
  if(p==="/"||p==="/home") return "Inicio";
  if(p==="/shop") return "Catálogo";
  if(p.startsWith("/shop/category/")){
    const id=p.split("/").pop();
    return "Categoría · "+(CATS[id]||id);
  }
  if(/^\/shop\/.+-\d+$/.test(p)) return "Producto · "+p.split("/").pop().replace(/-\d+$/,"").replace(/^[a-z0-9]+-/,"").replace(/-/g," ");
  if(p.startsWith("/shop/cart")) return "Carrito";
  if(p.startsWith("/blog")) return "Noticias";
  if(p==="/salud") return "ANMAT y Salud";
  if(p.startsWith("/my")) return "Mi cuenta";
  return p;
}
async function metricas(){
  const cont=document.getElementById("body"); if(cont) cont.innerHTML='<div class="spin"></div>';
  const d0=DESDE(DIAS), dPrev=DESDE(DIAS*2);
  const ints=await cargarInternos();
  const noEquipoTrack=["visitor_id.partner_id","not in",ints];
  const noEquipoVis=["partner_id","not in",ints];
  const web=[["website_id","!=",false],["partner_id","not in",ints]];
  const pedidos=(desde,hasta)=>{ const d=web.concat([["state","in",["sale","done"]],["date_order",">=",desde]]); if(hasta) d.push(["date_order","<",hasta]); return d; };
  try{
    const [vis, visPrev, visitantes, users, usersAct, ped, pedPrev, carritos, porMes, topPag, topProd] = await Promise.all([
      EYG.rpc("website.track","search_count",[[["visit_datetime",">=",d0],noEquipoTrack]]),
      EYG.rpc("website.track","search_count",[[["visit_datetime",">=",dPrev],["visit_datetime","<",d0],noEquipoTrack]]),
      EYG.rpc("website.visitor","search_count",[[["last_connection_datetime",">=",d0],noEquipoVis]]),
      EYG.rpc("res.users","search_count",[[["share","=",true],["active","=",true]]]),
      EYG.rpc("res.users","search_count",[[["share","=",true],["active","=",true],["login_date",">=",d0]]]),
      EYG.rpc("sale.order","read_group",[pedidos(d0),["amount_total:sum"],[]]),
      EYG.rpc("sale.order","read_group",[pedidos(dPrev,d0),["amount_total:sum"],[]]),
      EYG.rpc("sale.order","search_count",[web.concat([["state","=","draft"],["date_order",">=",d0]])]),
      EYG.rpc("sale.order","read_group",[pedidos(DESDE(365)),["amount_total:sum"],["date_order:month"]]),
      EYG.rpc("website.track","read_group",[[["visit_datetime",">=",d0],["url","!=",false],noEquipoTrack],["id"],["url"]],{limit:400}),
      EYG.rpc("website.track","read_group",[[["visit_datetime",">=",d0],["product_id","!=",false],noEquipoTrack],["id"],["product_id"]],{limit:400}),
    ]);
    const cnt=g=>(g&&g[0])?(g[0].__count||g[0].date_order_count||0):0;
    const sum=g=>(g&&g[0])?(g[0].amount_total||0):0;
    MET={
      vis, visPrev, visitantes, users, usersAct, carritos,
      ped:cnt(ped), pedMonto:sum(ped), pedPrev:cnt(pedPrev), pedMontoPrev:sum(pedPrev),
      meses:(porMes||[]).map(x=>({m:x["date_order:month"], n:x.__count||x.date_order_count||0, monto:x.amount_total||0})),
      pags:(topPag||[]).map(x=>({url:linda(x.url), n:x.url_count||x.__count||0})).sort((a,b)=>b.n-a.n).slice(0,10),
      prods:(topProd||[]).map(x=>({p:x.product_id?x.product_id[1]:"—", n:x.product_id_count||x.__count||0})).sort((a,b)=>b.n-a.n).slice(0,10),
    };
  }catch(e){ MET={error:String(e.message||e)}; }
  render();
}
function delta(hoy,antes){
  if(!antes) return `<div class="d flat">sin comparación</div>`;
  const p=Math.round((hoy-antes)/antes*100);
  if(p===0) return `<div class="d flat">igual que antes</div>`;
  return `<div class="d ${p>0?'up':'down'}">${p>0?'▲':'▼'} ${Math.abs(p)}% vs los ${DIAS} días previos</div>`;
}
function vistaResumen(){
  if(!MET) return `<div class="spin"></div>`;
  if(MET.error) return `<div class="empty">No pude leer las métricas del portal.<br><span style="font-size:12.5px">${esc(MET.error)}</span></div>`;
  const m=MET, ticket=m.ped?m.pedMonto/m.ped:0;
  const sel=`<div class="sw"><b style="flex:none">Período</b>
    <select onchange="MET=null;DIAS=+this.value;render();metricas()">
      ${[[7,"Últimos 7 días"],[30,"Últimos 30 días"],[90,"Últimos 90 días"]].map(([v,l])=>`<option value="${v}" ${DIAS===v?"selected":""}>${l}</option>`).join("")}
    </select>
    <span class="hint">Los pedidos son los que entraron <b>por el portal</b> (no los que carga el comercial). No se cuenta la navegación del equipo de EyG (${INTERNOS.length} usuarios internos).</span></div>`;
  const kpis=`<div class="kpis">
    <div class="kpi"><div class="k">Pedidos por el portal</div><div class="v">${num(m.ped)}</div>${delta(m.ped,m.pedPrev)}</div>
    <div class="kpi"><div class="k">Facturado online</div><div class="v">${money(m.pedMonto)}</div>${delta(m.pedMonto,m.pedMontoPrev)}</div>
    <div class="kpi"><div class="k">Pedido promedio</div><div class="v">${money(ticket)}</div><div class="sub">${m.carritos} carrito${m.carritos===1?"":"s"} sin confirmar</div></div>
    <div class="kpi"><div class="k">Páginas vistas</div><div class="v">${num(m.vis)}</div>${delta(m.vis,m.visPrev)}</div>
    <div class="kpi"><div class="k">Visitantes</div><div class="v">${num(m.visitantes)}</div><div class="sub">distintos en el período</div></div>
    <div class="kpi"><div class="k">Clientes que entraron</div><div class="v">${num(m.usersAct)}</div><div class="sub">de ${num(m.users)} con acceso</div></div>
  </div>`;
  const max=Math.max(1,...m.meses.map(x=>x.monto));
  const graf=`<div class="panel"><h3>Pedidos por el portal <span class="lite">· último año, por mes</span></h3>
    <div class="barras">${m.meses.map(x=>`<div class="b" title="${num(x.n)} pedidos · ${money(x.monto)}">
      <b>${num(x.n)}</b><i style="height:${Math.max(3,Math.round(x.monto/max*100))}%"></i>
      <span>${String(x.m||"").slice(0,3)}</span></div>`).join("")}</div>
    ${m.meses.length?"":'<div class="hint">Todavía no hay pedidos para mostrar.</div>'}</div>`;
  const tabla=(titulo,filas,col)=>`<div class="panel"><h3>${titulo}</h3>
    ${filas.length?`<table class="lista"><thead><tr><th>${col}</th><th style="text-align:right">Vistas</th></tr></thead>
      <tbody>${filas.map(f=>`<tr><td class="url">${esc(f.t)}</td><td class="n">${num(f.n)}</td></tr>`).join("")}</tbody></table>`
    :'<div class="hint">Sin datos en el período.</div>'}</div>`;
  return sel+kpis+graf+cintaPanelHTML()+
    tabla("Lo más visitado", m.pags.map(p=>({t:p.url,n:p.n})), "Página")+
    tabla("Productos más mirados", m.prods.map(p=>({t:p.p,n:p.n})), "Producto");
}

/* Cómo viene cada aviso de la cinta: a cuántos les llegó y qué hicieron.
   "Sin responder" son los que la vieron y siguieron de largo (ni la activaron
   ni la descartaron); la cinta les sigue apareciendo. */
function cintaPanelHTML(){
  if(!CINTA || !(CINTA.avisos||[]).length) return "";
  const filas=(CINTA.avisos||[]).map(a=>{
    const st=cintaStats(a.id);
    if(!st.entregados && a.activo===false) return "";
    const barra=st.entregados?`<div style="display:flex;height:7px;border-radius:20px;overflow:hidden;background:#eef1f0;margin-top:6px;max-width:230px">
        <i style="width:${st.act/st.entregados*100}%;background:#1E7D46"></i>
        <i style="width:${st.rec/st.entregados*100}%;background:#B0322F"></i>
        <i style="width:${st.mudos/st.entregados*100}%;background:#CBD8D4"></i></div>`:"";
    return `<tr>
      <td style="padding:9px 8px;border-top:1px solid var(--line)">

function vistaNoticias(){

function noticiaNueva(){ NEDIT={name:"",subtitle:"",texto:""}; render(); }
async function noticiaEditar(id){
  const p=POSTS.find(x=>x.id===id); if(!p) return;
  NEDIT={...p, texto:"…"}; render();
  try{
    const r=await EYG.rpc("blog.post","read",[[id],["content"]],{context:{lang:"es_AR"}});
    const html=(r[0]&&r[0].content)||"";
    NEDIT.texto=html.replace(/<br\s*\/?>/gi,"\n").replace(/<\/p>/gi,"\n\n").replace(/<[^>]+>/g,"").replace(/&nbsp;/g," ").trim();
    render();
  }catch(e){ NEDIT.texto=""; render(); }
}
function noticiaHTML(txt){
  return (txt||"").split(/\n{2,}/).map(p=>`<p>${EYG.esc(p).replace(/\n/g,"<br/>")}</p>`).join("");
}
async function noticiaGuardar(){
  const name=(document.getElementById("n-tit")||{}).value||"", sub=(document.getElementById("n-sub")||{}).value||"", txt=(document.getElementById("n-txt")||{}).value||"";
  if(!name.trim()){ toast("Ponele un título."); return; }
  if(!txt.trim()){ toast("Escribí la noticia."); return; }
  const btn=document.getElementById("n-guardar"); if(btn){ btn.disabled=true; btn.textContent="Guardando…"; }
  const vals={name:name.trim(), subtitle:sub.trim(), content:noticiaHTML(txt)};
  try{
    if(NEDIT.id) await EYG.rpc("blog.post","write",[[NEDIT.id],vals],{context:{lang:"es_AR"}});
    else await EYG.rpc("blog.post","create",[Object.assign({blog_id:BLOG_ID, is_published:false}, vals)],{context:{lang:"es_AR"}});
    NEDIT=null; POSTS=null; render(); await noticiasCargar();
    toast("Listo ✓ La noticia quedó como borrador hasta que la publiques.", true);
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent="Guardar"; } toast("No se pudo guardar: "+(e.message||e)); }
}
async function noticiaPublicar(id,pub){
  try{
    await EYG.rpc("blog.post","write",[[id],{is_published:pub}]);
    POSTS=null; render(); await noticiasCargar();
    toast(pub?"Publicada en el portal ✓":"Sacada del portal", true);
  }catch(e){ toast("No se pudo: "+(e.message||e)); }
}

/* ---- estado de un aviso (activo / programado / vencido) ---- */
function estadoPill(c){
  return c.activo===false ? '<span class="pill off">Desactivada</span>'
       : (c.desde&&c.desde>hoy()) ? '<span class="pill prog">Programada</span>'
       : (c.hasta&&c.hasta<hoy()) ? '<span class="pill venc">Vencida</span>'
       : '<span class="pill dest">Activa</span>';
}
let CINTA=null, CEDIT=null;

/* ================= Cinta del portal (la ven los CLIENTES) =================
   Es la franja que va debajo de la barra verde del menú, en el portal de clientes
   (drogueriaeyg.odoo.com). Dos piezas:
   · Config: `ir.config_parameter` eyg.portal_cinta (SEPARADO de eyg.comunicaciones,
     que es interno). { activo, alcance, cerrable, notificarA, copiaA, avisos:[…] }.
   · Quién ve cada aviso: lo decide la edge function `portal-cinta` server-side, para
     que los datos del cliente (perfil crediticio, deuda) NUNCA viajen a su navegador.
   El PERFIL CREDITICIO es el mismo que ve el comercial en su panel: cruza BCRA con el
   historial de pago en EyG (EYG.evalCredito). Los avisos tipo "beneficio" muestran un
   botón: al tocarlo, le entra una novedad al comercial en la campanita y queda el
   pedido registrado (tabla portal_beneficio). El dibujo vive en el bloque `eyg-cinta`
   del Código del sitio (custom_code_head). */
const CINTA_KEY="eyg.portal_cinta";
const CINTA_ICO='<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.6"></circle><path d="M6 12h.01M18 12h.01"></path></svg>';
const ALCANCES=[["inicio","Solo el inicio"],["inicio_shop","Inicio y catálogo"],["sitio","Todo el portal"]];
const PERFILES=[["apto","Apto"],["reparos","Apto con reparos"],["consultar","Consultar con Cobranzas"],["noapto","No apto"]];
const SINVAL="__sin__";
let COPC=null, CPED=[], CENT=[], CBUSCA=null, CNOM={}, CCUENTA=null;

function cintaDefault(){ return {activo:true, alcance:"inicio_shop", cerrable:true, notificarA:"", copiaA:"", avisos:[]}; }
function filtrosDefault(){ return {perfil:[], rubro:[], comercial:[], provincia:[], pago:[], facturado_min:0, compro_dias:0, solo_ids:[], excluir_ids:[]}; }
function cintaFn(body){
  return EYG.supa().functions.invoke("portal-cinta",{body}).then(r=>{ if(r.error) throw r.error; return r.data; });
}
async function cintaCargar(){
  try{ CINTA=JSON.parse(await EYG.rpc("ir.config_parameter","get_param",[CINTA_KEY])||"null")||cintaDefault(); }
  catch(e){ CINTA=cintaDefault(); }
  if(!Array.isArray(CINTA.avisos)) CINTA.avisos=[];
  render();
  cintaOpciones().then(()=>{ if(TAB==="cinta") render(); });
  cintaDatos().then(()=>{ if(TAB==="cinta"||TAB==="resumen") render(); });
}
/* Opciones reales para los filtros (salen de Odoo, no se hardcodean). */
async function cintaOpciones(){
  if(COPC) return COPC;
  const RUBRO="x_studio_selection_field_6ui_1j42g6fu9";
  try{
    const [campos,porCom,porProv,terms]=await Promise.all([
      EYG.rpc("res.partner","fields_get",[[RUBRO],["selection"]]),
      EYG.rpc("res.partner","read_group",[[["customer_rank",">",0]],["id"],["user_id"]]),
      EYG.rpc("res.partner","read_group",[[["customer_rank",">",0]],["id"],["state_id"]]),
      EYG.rpc("account.payment.term","search_read",[[]],{fields:["name"],limit:60,context:{lang:"es_AR"}}),
    ]);
    COPC={
      rubro:((campos[RUBRO]||{}).selection||[]).map(x=>x[0]),
      comercial:porCom.filter(g=>g.user_id).sort((a,b)=>b.user_id_count-a.user_id_count).map(g=>g.user_id[1]),
      provincia:porProv.filter(g=>g.state_id).sort((a,b)=>b.state_id_count-a.state_id_count).slice(0,10).map(g=>g.state_id[1]),
      pago:terms.map(t=>t.name),
    };
  }catch(e){ COPC={rubro:[],comercial:[],provincia:[],pago:[]}; }
  return COPC;
}
/* Pedidos del beneficio + entregas (a quién se le mostró y qué hizo). */
async function cintaDatos(){
  try{
    await cargarInternos();
    const [ped,ent]=await Promise.all([
      EYG.supa().from("portal_beneficio").select("*").order("creado",{ascending:false}).limit(500),
      EYG.supa().from("portal_entrega").select("*").limit(5000),
    ]);
    CPED = ped.error?[]:(ped.data||[]);
    CENT = ent.error?[]:(ent.data||[]);
  }catch(e){ CPED=[]; CENT=[]; }
  return CPED;
}
/* Resumen por aviso: entregados, vistas, activaron, descartaron, sin responder. */
function cintaStats(avisoId){
  const f=CENT.filter(x=>x.aviso_id===avisoId && !INTERNOS.includes(x.partner_id));
  const act=f.filter(x=>x.activado).length, rec=f.filter(x=>x.rechazado).length;
  return {entregados:f.length,
          vistas:f.reduce((a,x)=>a+(x.vistas||0),0),
          imp:f.reduce((a,x)=>a+(x.impresiones||x.vistas||0),0),
          act, rec, mudos:Math.max(0,f.length-act-rec), tasa:f.length?Math.round(act/f.length*100):0};
}
async function cintaGuardar(msg){
  try{ await EYG.rpc("ir.config_parameter","set_param",[CINTA_KEY, JSON.stringify(CINTA)]); if(msg) toast(msg,true); return true; }
  catch(e){ toast("No se pudo guardar: "+(e.message||e)); return false; }
}
function cintaVigente(a){ const h=hoy(); return a && a.activo!==false && (!a.desde||a.desde<=h) && (!a.hasta||a.hasta>=h); }
function cintaSegmentado(a){
  const f=a.filtros||{};
  return !!((f.perfil||[]).length||(f.rubro||[]).length||(f.comercial||[]).length||(f.provincia||[]).length||
            (f.pago||[]).length||(f.solo_ids||[]).length||f.facturado_min>0||f.compro_dias>0);
}

      </div>
      <div class="fld"><label>Condición de pago que tiene hoy</label>${chips("pago",opc.pago.map(p=>[p,p]).concat([[SINVAL,"Sin condición"]]))}
        <div class="hint">Sirve para no ofrecérselo a quien ya lo tiene.</div></div>

      <div class="row2">
        <div class="fld"><label>Compró en los últimos… (días)</label><input id="c-dias" type="number" min="0" value="${e.filtros?(e.filtros.compro_dias||0):0}" placeholder="0"><div class="hint">0 = no filtra.</div></div>
        <div class="fld"><label>Facturación acumulada mínima ($)</label><input id="c-fact" type="number" min="0" value="${e.filtros?(e.filtros.facturado_min||0):0}" placeholder="0"><div class="hint">0 = no filtra.</div></div>
      </div>

      <div class="fld"><label>Modo prueba — mostrárselo SOLO a estos clientes</label>
        ${cintaPicker("solo_ids")}
        <div class="hint">Si hay alguno acá, nadie más lo ve. Ideal para probar antes de largarlo.</div></div>
      <div class="fld"><label>Excluir estos clientes</label>${cintaPicker("excluir_ids")}</div>

      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="btn ghost sm" onclick="cintaContar()">👥 ¿A cuántos les llega?</button>
        <span class="hint" id="c-cuenta">${CCUENTA||""}</span>
      </div>
    </div>

    <div style="border-top:1px dashed var(--line);margin:16px 0 14px;padding-top:14px">
      <label style="display:block;font-size:12px;font-weight:700;color:var(--gris);margin-bottom:8px">¿CÓMO SE ENTREGA?</label>
      <div class="sw" style="margin-bottom:10px">
        <div class="knob ${e.seguirEntregando===false?'':'on'}" onclick="cintaEntrega('seguirEntregando',${e.seguirEntregando===false})"><i></i></div>
        <b style="flex:none">Seguir entregándolo a los que se sumen</b>
        <span class="hint">Un cliente nuevo que se registra en el portal, o uno que empieza a cumplir las condiciones, lo recibe solo. Si lo apagás, queda congelado en los que ya lo tienen.</span>
      </div>
      <div class="fld" style="max-width:280px"><label>Máximo de veces por cliente</label>
        <input id="c-veces" type="number" min="0" value="${e.maxVistas||0}" placeholder="0">
        <div class="hint"><b>0 = hasta que responda</b> (le sigue apareciendo mientras no lo active ni lo descarte). Con 3, por ejemplo, se lo mostramos tres visitas y no lo molestamos más.</div></div>
      <div class="hint">A nadie se le entrega dos veces lo mismo: queda registrado quién ya lo recibió. Si después <b>ampliás las condiciones</b>, el aviso sale solo para los que entran ahora.</div>
    </div>

    <div class="row2">
      <div class="fld"><label>Desde</label><input id="c-desde" type="date" value="${esc(e.desde||hoy())}"></div>
      <div class="fld"><label>Hasta (opcional)</label><input id="c-hasta" type="date" value="${esc(e.hasta||"")}"><div class="hint">Vacío = hasta que lo saques.</div></div>
    </div>
    <div class="acts" style="margin-top:4px">
      <button class="btn" id="c-guardar" onclick="cintaGuardarAviso()">Guardar aviso</button>
      <button class="btn ghost" onclick="CEDIT=null;CBUSCA=null;render()">Cancelar</button>
    </div></div>`;
}
/* Buscador de clientes para las listas de incluir/excluir. */
function cintaPicker(campo){
  const f=CEDIT.filtros||filtrosDefault(), ids=f[campo]||[];
  const puestos=ids.map(id=>`<div class="chk on" onclick="cintaQuitarId('${campo}',${id})">${esc(CNOM[id]||("Cliente "+id))} ✕</div>`).join("");
  const res=(CBUSCA&&CBUSCA.campo===campo)?`<div class="chks" style="margin-top:6px">${
      CBUSCA.items.length?CBUSCA.items.map(p=>`<div class="chk" onclick="cintaSumarId('${campo}',${p.id},'${esc(String(p.name).replace(/'/g,"\\'"))}')">${esc(p.name)}</div>`).join("")
      :'<span class="hint">No encontré ningún cliente con ese nombre.</span>'}</div>`:"";
  return `<div class="chks">${puestos||'<span class="hint">Nadie por ahora.</span>'}</div>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
      <input id="c-busca-${campo}" placeholder="Buscar cliente por nombre…" style="flex:1;min-width:200px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px" onkeydown="if(event.key==='Enter'){event.preventDefault();cintaBuscar('${campo}')}">
      <button class="btn ghost sm" onclick="cintaBuscar('${campo}')">Buscar</button>
    </div>${res}`;
}
function cintaLista(){
  const avisos=CINTA.avisos||[];
  if(!avisos.length) return `<div class="empty">Todavía no hay avisos en la cinta.<br><span style="font-size:12.5px">Creá uno y sale al portal en el momento.</span></div>`;
  return avisos.map(a=>{
    const ped=CPED.filter(p=>p.aviso_id===a.id && !INTERNOS.includes(p.partner_id)).length, st=cintaStats(a.id);
    const f=a.filtros||{};
    const seg=[];
    if((f.perfil||[]).length) seg.push("perfil: "+f.perfil.map(p=>(PERFILES.find(x=>x[0]===p)||[p,p])[1]).join(", "));
    if((f.rubro||[]).length) seg.push("rubro: "+f.rubro.join(", "));
    if((f.comercial||[]).length) seg.push(f.comercial.length+" comercial(es)");
    if((f.provincia||[]).length) seg.push(f.provincia.join(", "));
    if((f.pago||[]).length) seg.push("cond. de pago");
    if(f.compro_dias>0) seg.push("compró en "+f.compro_dias+" días");
    if(f.facturado_min>0) seg.push("facturó +$"+f.facturado_min);
    if((f.excluir_ids||[]).length) seg.push(f.excluir_ids.length+" excluido(s)");
    const prueba=(f.solo_ids||[]).length;
    return `<div class="card">
      <div class="top">${a.destacado?`<span class="pill dest">${esc(a.destacado)}</span>`:""}
        ${a.tipo==="beneficio"?'<span class="pill" style="background:#FBE3D4;color:#B45816">🎁 Beneficio</span>':""}
        <h3>${esc(a.titulo||a.texto||"(sin texto)")}</h3>${estadoPill(a)}
        ${prueba?`<span class="pill prog">Prueba · ${prueba} cliente${prueba===1?"":"s"}</span>`:""}</div>
      ${a.titulo&&a.texto?`<div class="cuerpo">${esc(a.texto)}</div>`:""}
      <div class="meta">
        <span>👥 ${prueba?"solo la lista de prueba":(seg.length?esc(seg.join(" · ")):"todos los clientes")}</span>
        <span>🗓️ desde ${a.desde?fD(a.desde):"siempre"}</span>${a.hasta?`<span>⏳ hasta ${fD(a.hasta)}</span>`:""}
        ${a.tipo==="beneficio"?`<span>🤝 ${ped} pedido${ped===1?"":"s"}</span>`:""}
        <span>👁️ ${st.entregados} recibieron${st.act?` · ${st.act} activaron`:""}${st.rec?` · ${st.rec} descartaron`:""}</span>
        ${a.seguirEntregando===false?'<span>⏸️ congelado</span>':''}${a.maxVistas?`<span>máx ${a.maxVistas} veces</span>`:''}</div>
      <div class="acts">
        <button class="btn ghost sm" onclick="cintaEditar('${a.id}')">✏️ Editar</button>
        <button class="btn ghost sm" onclick="cintaToggle('${a.id}')">${a.activo===false?"✅ Reactivar":"🚫 Desactivar"}</button>
        <button class="btn warn sm" onclick="cintaBorrar('${a.id}')">🗑️ Borrar</button>
      </div></div>`;
  }).join("");
}
function cintaPedidosHTML(){
  if(!CPED.length) return "";
  return `<div class="formbox" style="max-width:860px;margin-top:16px">
    <h2>🤝 Pidieron el beneficio (${CPED.filter(p=>!INTERNOS.includes(p.partner_id)).length})</h2>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="text-align:left;color:var(--gris2);font-size:11.5px">
        <th style="padding:6px 8px">Cuándo</th><th style="padding:6px 8px">Cliente</th><th style="padding:6px 8px">Comercial</th><th style="padding:6px 8px">Aviso</th></tr></thead>
      <tbody>${CPED.map(p=>`<tr style="border-top:1px solid var(--line)">
        <td style="padding:7px 8px;white-space:nowrap">${fD(p.creado)}</td>
        <td style="padding:7px 8px"><b>${esc(p.partner_nombre||("Cliente "+p.partner_id))}</b>${INTERNOS.includes(p.partner_id)?' <span class="pill prog">prueba interna</span>':''}</td>
        <td style="padding:7px 8px">${esc(p.comercial||"—")} ${p.notificado?'<span class="pill dest">avisado</span>':'<span class="pill off">sin avisar</span>'}</td>
        <td style="padding:7px 8px;color:var(--gris)">${esc((p.detalle&&p.detalle.titulo)||p.aviso_id)}</td></tr>`).join("")}</tbody>
    </table></div></div>`;
}

/* ---------------- Acciones ---------------- */
function cintaPrev(){
  if(!CEDIT) return; cintaSync();
  const box=document.querySelector(".cinprev .cinta:not(.ok)"); if(box) box.innerHTML=cintaPreviewHTML(CEDIT);
  const ok=document.querySelector(".cinprev .cinta.ok"); if(ok) ok.innerHTML=cintaPreviewOK(CEDIT);
}
function cintaSync(){
  if(!CEDIT) return;
  const g=id=>{ const e=document.getElementById(id); return e?e.value:undefined; };
  const map={destacado:"c-dest",titulo:"c-tit",texto:"c-txt",ctaTexto:"c-cta",ctaUrl:"c-url",
             confirmacion:"c-conf",letraChica:"c-fine",desde:"c-desde",hasta:"c-hasta"};
  Object.keys(map).forEach(k=>{ const v=g(map[k]); if(v!==undefined) CEDIT[k]=v; });
  CEDIT.filtros=CEDIT.filtros||filtrosDefault();
  const d=g("c-dias"), fa=g("c-fact"), v=g("c-veces");
  if(d!==undefined) CEDIT.filtros.compro_dias=Math.max(0,parseInt(d||"0",10)||0);
  if(fa!==undefined) CEDIT.filtros.facturado_min=Math.max(0,parseFloat(fa||"0")||0);
  if(v!==undefined) CEDIT.maxVistas=Math.max(0,parseInt(v||"0",10)||0);
}
function cintaEntrega(campo,valor){ cintaSync(); CEDIT[campo]=valor; render(); }
async function cintaGeneral(campo,valor){ CINTA[campo]=valor; render(); await cintaGuardar("Listo ✓"); }
function cintaTipo(t){ cintaSync(); CEDIT.tipo=t; if(t==="beneficio") CEDIT.ctaUrl=""; render(); }
function cintaFiltro(campo,valor){
  cintaSync();
  const f=CEDIT.filtros=CEDIT.filtros||filtrosDefault();
  const s=new Set(f[campo]||[]); s.has(valor)?s.delete(valor):s.add(valor);
  f[campo]=[...s]; CCUENTA=null; render();
}
function cintaSumarId(campo,id,nombre){
  cintaSync(); CNOM[id]=nombre;
  const f=CEDIT.filtros=CEDIT.filtros||filtrosDefault();
  if(!(f[campo]||[]).includes(id)) f[campo]=[...(f[campo]||[]),id];
  CBUSCA=null; CCUENTA=null; render();
}
function cintaQuitarId(campo,id){
  cintaSync();
  const f=CEDIT.filtros=CEDIT.filtros||filtrosDefault();
  f[campo]=(f[campo]||[]).filter(x=>x!==id); CCUENTA=null; render();
}
async function cintaBuscar(campo){
  const q=(document.getElementById("c-busca-"+campo)||{}).value||"";
  if(q.trim().length<2){ toast("Escribí al menos 2 letras."); return; }
  cintaSync();
  try{
    const r=await EYG.rpc("res.partner","search_read",[[["name","ilike",q.trim()]]],{fields:["id","name"],limit:12,context:{lang:"es_AR"}});
    CBUSCA={campo, items:r||[]}; render();
  }catch(e){ toast("No pude buscar: "+(e.message||e)); }
}
async function cintaContar(){
  cintaSync();
  const el=document.getElementById("c-cuenta"); if(el) el.textContent="Contando…";
  try{
    const j=await cintaFn({accion:"contar", filtros:CEDIT.filtros||filtrosDefault()});
    if(!j||!j.ok) throw new Error((j&&j.error)||"no pude contar");
    CCUENTA=`Le llega a ${j.cumplen} de ${j.total} clientes.` +
      (j.sinBcra?` (a ${j.sinBcra} todavía no les consultamos el BCRA: se verifica solo cuando entran al portal)`:"");
    if(el) el.textContent=CCUENTA;
  }catch(e){ CCUENTA=""; if(el) el.textContent="No pude contar: "+(e.message||e); }
}
function cintaNuevo(){
  CEDIT={id:"cin_"+Date.now()+"_"+Math.random().toString(36).slice(2,6), tipo:"aviso", destacado:"Nuevo", seguirEntregando:true, maxVistas:0,
         titulo:"", texto:"", ctaTexto:"", ctaUrl:"", confirmacion:"", letraChica:"",
         desde:hoy(), hasta:"", activo:true, filtros:filtrosDefault()};
  CBUSCA=null; CCUENTA=null; render();
}
function cintaEditar(id){
  const a=(CINTA.avisos||[]).find(x=>x.id===id); if(!a) return;
  CEDIT={...a, filtros:Object.assign(filtrosDefault(), a.filtros||{})};
  CBUSCA=null; CCUENTA=null; render();
  cintaNombres(CEDIT.filtros);
}
/* Trae los nombres de los clientes elegidos (para las pastillas). */
async function cintaNombres(f){
  const ids=[...new Set([...(f.solo_ids||[]),...(f.excluir_ids||[])])].filter(id=>!CNOM[id]);
  if(!ids.length) return;
  try{
    const r=await EYG.rpc("res.partner","read",[ids,["name"]],{context:{lang:"es_AR"}});
    (r||[]).forEach(p=>CNOM[p.id]=p.name);
    if(TAB==="cinta"&&CEDIT) render();
  }catch(e){}
}
async function cintaGuardarAviso(){
  cintaSync();
  if(!(CEDIT.titulo||"").trim() && !(CEDIT.texto||"").trim()){ toast("Escribí el aviso."); return; }
  const esBen=(CEDIT.tipo==="beneficio");
  if(esBen && !(CEDIT.ctaTexto||"").trim()){ toast("Ponele texto al botón."); return; }
  if(!esBen){
    const url=(CEDIT.ctaUrl||"").trim();
    if((CEDIT.ctaTexto||"").trim() && !url){ toast("Al botón le falta el link."); return; }
    if(url && !/^(https?:\/\/|\/)/.test(url)){ toast("El link tiene que empezar con https:// o con /"); return; }
  }
  const btn=document.getElementById("c-guardar"); if(btn){ btn.disabled=true; btn.textContent="Guardando…"; }
  const i=(CINTA.avisos||[]).findIndex(x=>x.id===CEDIT.id);
  if(i>-1) CINTA.avisos[i]={...CINTA.avisos[i], ...CEDIT}; else CINTA.avisos.push({...CEDIT, activo:true});
  const ok=await cintaGuardar("Aviso publicado en el portal ✓");
  if(ok){ CEDIT=null; CBUSCA=null; render(); } else if(btn){ btn.disabled=false; btn.textContent="Guardar aviso"; }
}
async function cintaToggle(id){ const a=(CINTA.avisos||[]).find(x=>x.id===id); if(!a) return; a.activo=(a.activo===false); render(); await cintaGuardar(a.activo?"Aviso reactivado":"Aviso desactivado"); }
async function cintaBorrar(id){ if(!confirm("¿Borrar este aviso de la cinta?")) return; CINTA.avisos=(CINTA.avisos||[]).filter(x=>x.id!==id); render(); await cintaGuardar("Borrado"); }

</script>
</body>
</html>
