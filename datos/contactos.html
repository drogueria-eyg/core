<head>

<style>

  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}

  .wrap{max-width:1320px;margin:0 auto;padding:18px 22px 90px}

  /* Tabs */
  .tabs{display:flex;gap:6px;margin:2px 0 18px;flex-wrap:wrap}

  h3.sec{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gris);margin:8px 2px 12px}

  /* Comercial cards */
  .coms{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:22px}
  .comcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;cursor:pointer;transition:border-color .12s,box-shadow .12s;box-shadow:var(--shadow)}

  .comcard .tot{font-size:18px;font-weight:800;color:var(--teal-deep)}
  .comcard.role{border-width:1.5px}
  .comcard.gerente{border-color:#C9A227;background:linear-gradient(180deg,#FFFCF2,#fff)}
  .comcard.lider{border-color:var(--coral);background:linear-gradient(180deg,#FDF4EF,#fff)}
  .comcard .av.gerente{background:#F7ECC4;color:#8A6D1A} .comcard .av.lider{background:#FBE0D2;color:#B0532A}
  .rolechip{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:2px 8px;border-radius:20px;margin-top:8px}
  .rolechip.gerente{background:#F7ECC4;color:#8A6D1A} .rolechip.lider{background:#FBE0D2;color:#B0532A}
  .comcard.sinasig{border-color:var(--gris2);border-style:dashed;background:linear-gradient(180deg,#F2F5F4,#fff)}
  .comcard .av.sinasig{background:#E6EBEA;color:var(--gris)} .rolechip.sinasig{background:#E6EBEA;color:var(--gris)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:border-color .12s,box-shadow .12s}

  .padr{font-size:12.5px;color:var(--ink);margin-top:2px}.padr b{color:var(--teal-deep)}
  .toggles{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:13px;color:var(--gris)}

  .flags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}

  .badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
  .ok{background:var(--okbg);color:var(--ok)} .warn{background:var(--warnbg);color:var(--warn)} .bad{background:var(--badbg);color:var(--bad)}
  .teal{background:var(--agua);color:var(--teal-deep)}

  .rub{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
  .rubchips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
  .rchip{font-family:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}

  .mini-btn.bovon{background:#F3E9DA;border-color:#E0CBA0;color:#8A6D1A}
  .bovbanner{background:#F7F0E4;border:1px solid #E7D6B4;color:#7A5E1E;border-radius:10px;padding:10px 13px;font-size:13px;margin-bottom:12px}.bovbanner a{color:#04635F;font-weight:700;cursor:pointer;margin-left:6px}
  .bovbox{background:#FBF6EE;border:1px solid #EAD9BC;border-radius:10px;padding:12px 13px;font-size:13px;color:#5F5232}
  .bovinput{width:100%;font-family:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:9px;padding:10px 11px;color:var(--ink)}
  .mini-btn.provon{background:#EFE3D0;border-color:#E0CBA0;color:#8A6D1A}
  .provbanner{background:#F7F1E6;border:1px solid #E7D9BE;color:#7A6636;border-radius:10px;padding:10px 13px;font-size:13px;margin-bottom:12px}.provbanner a{color:#04635F;font-weight:700;cursor:pointer;margin-left:6px}
  .provbox{background:#FBF7EF;border:1px solid #EADCC2;border-radius:10px;padding:12px 13px;font-size:13px;color:#5F5232}
  .bulkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 13px;margin-bottom:12px}
  .bulkbar .ba{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
  .bulkbar .bcount{font-size:12.5px;font-weight:800;color:var(--teal-deep);background:var(--agua);border-radius:20px;padding:3px 10px}
  .bulkbar .bsel{font-size:13px;padding:8px 10px}

  .bulkbar .bbtn.ghost{background:var(--surface);border-color:var(--line);color:var(--gris)}
  .bulkbar .bbtn.danger{background:#FBE4E3;border-color:#F3B5B2;color:#B0322F}
  .rowchk{width:17px;height:17px;flex:none;margin-top:1px;cursor:pointer;accent-color:var(--teal)}
  .row.selrow{background:#EDF7F5}

  .loading,.empty{text-align:center;padding:60px 20px;color:var(--gris)}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .errbox{background:#FBE4E3;border:1px solid #F3B5B2;color:#8A2E2B;padding:16px;border-radius:12px}
  .info{background:#EAF6F4;border:1px solid #BFE3DE;color:#0B5C57;padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:14px}
  .alert{border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.35}

  .alert.aten{background:#FBF0DA;border:1px solid #EAD6A6;color:#7A5B12}
  .alert.okk{background:#E4F5E9;border:1px solid #BFE3CB;color:#1E7D46}
  .dupitem{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:border-color .12s}
  .dupitem:hover{border-color:var(--teal-med);background:#F7FBFA}
  .linkbox{background:var(--bg);border:1px dashed var(--line);border-radius:9px;padding:9px 11px;font-size:12px;color:var(--gris);word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace}

  /* Drawer + edit form */
  .scrim{position:fixed;inset:0;background:rgba(6,65,62,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}.scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:440px;max-width:94vw;background:var(--surface);z-index:50;box-shadow:-8px 0 40px rgba(6,65,62,.18);transform:translateX(100%);transition:transform .24s;display:flex;flex-direction:column}.drawer.on{transform:none}
  .dhead{padding:20px 22px;border-bottom:1px solid var(--line);background:var(--teal-deep);color:#fff}
  .dhead .x{float:right;cursor:pointer;opacity:.85;font-size:22px}.dhead h2{font-size:18px;font-weight:800;padding-right:24px;line-height:1.25}
  .dhead .dsub{font-size:12.5px;color:var(--aqua);font-weight:600;margin-top:3px}
  .dbody{padding:18px 22px;overflow-y:auto;flex:1}
  .dsec{margin-bottom:20px} .dsec h4{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--teal-med);margin-bottom:9px}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line)}.kv .k{color:var(--gris)}.kv .v{font-weight:600;text-align:right}
  .kv .v.falta{color:var(--bad)}
  .assign{display:flex;gap:8px;align-items:center}.assign select{flex:1}
  .actbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .abtn{flex:1;min-width:120px;text-align:center;text-decoration:none;font-weight:700;font-size:13px;border-radius:10px;padding:11px;cursor:pointer;border:0;font-family:inherit}
  .abtn.wa{background:var(--wa);color:#fff} .abtn.call{background:var(--teal);color:#fff} .abtn.edit{background:var(--agua);color:var(--teal-deep)} .abtn.odoo{background:#EEF1F0;color:var(--gris)}
  .watext{width:100%;font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:9px;padding:10px;min-height:74px;resize:vertical;margin-bottom:8px}
  .tmpls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .tmpl{font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 10px;cursor:pointer}.tmpl:hover{border-color:var(--teal-med)}
  .eform .fld{margin-bottom:13px}
  .eform label{display:block;font-size:12px;font-weight:600;color:var(--gris);margin-bottom:5px}
  .eform input,.eform select{width:100%;font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:10px 11px;color:var(--ink);background:var(--surface)}
  .eform input:focus,.eform select:focus{outline:none;border-color:var(--teal-med);box-shadow:0 0 0 3px rgba(4,135,130,.1)}
  .eform .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .eform .prev{font-size:12px;color:var(--teal);font-weight:600;margin-top:4px}
  .dfoot{padding:14px 22px;border-top:1px solid var(--line);background:var(--surface)}
  .btn-save{width:100%;background:var(--teal);color:#fff;border:0;border-radius:10px;padding:13px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
  .btn-save:disabled{opacity:.6;cursor:default}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;z-index:100;box-shadow:0 8px 30px rgba(6,65,62,.28);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
  .toast.on{opacity:1}

  @media(max-width:900px){.thead{grid-template-columns:2fr 1.1fr 1fr}.row{grid-template-columns:2fr 1.1fr 1fr}.hide-sm{display:none}}
</style>

  <div class="wrap"><div id="app"><div class="loading"><div class="spinner"></div>Cargando contactos y ventas desde Odoo…</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=38"></script>
<script>
/* ===== EyG Core · Contactos (CRM): gestionar existentes + prospectar el padrón oficial ===== */
const money=EYG.money, esc=EYG.esc;
const rpc=(m,me,a,k)=>EYG.rpc(m,me,a||[],k||{});
const soloDig=s=>(s||"").replace(/\D/g,"");
const iso=d=>d.toISOString().slice(0,10);
const mailOk=e=>/.+@.+\..+/.test(e||"");

/* --- WhatsApp / teléfono (mismos helpers probados que Cobranzas, con el fix del "15") --- */
function waNumber(m,p){for(const c of[m,p]){let d=soloDig(c);if(!d)continue;if(d.startsWith("00"))d=d.slice(2);if(d.startsWith("54"))d=d.slice(2);if(d.startsWith("9")&&d.length>=11)d=d.slice(1);d=d.replace(/^0/,"");if(d.length>10)d=d.replace(/^(\d{2,4})15(\d{6,8})$/,"$1$2");if(d.length>=10)return"549"+d;}return"";}
const telLink=(m,p)=>{let d=soloDig(m||p);if(d.length<6)return"";if(!d.startsWith("54"))d="54"+d.replace(/^0/,"");return"+"+d;};

/* --- Formateadores para guardar en Odoo (teléfono/doc/oración) --- */
const IDT={cuit:4,dni:5,cuil:6};
function fmtDoc(raw,idtypeId){const d=soloDig(raw);if(!d)return"";if(idtypeId===IDT.dni){if(d.length<7||d.length>8)return raw.trim();return d.replace(/\B(?=(\d{3})+(?!\d))/g,".");}if(idtypeId===IDT.cuit||idtypeId===IDT.cuil){if(d.length!==11)return raw.trim();return d.slice(0,2)+"-"+d.slice(2,10)+"-"+d.slice(10);}return raw.trim();}
function fmtTel(raw){let d=soloDig(raw);if(!d)return"";if(d.startsWith("0054"))d=d.slice(4);if(d.startsWith("54"))d=d.slice(2);d=d.replace(/^0/,"");if(d.length>10)d=d.replace(/^(\d{2,4})15(\d{6,8})$/,"$1$2");if(d.length<8)return raw.trim();let area,local;if(d.length===10){if(d.startsWith("11")){area="11";local=d.slice(2);}else{area=d.slice(0,3);local=d.slice(3);}}else if(d.length===11){area=d.slice(0,4);local=d.slice(4);}else return"+54 "+d;const ls=local.length>=8?local.slice(0,4)+"-"+local.slice(4):local.slice(0,3)+"-"+local.slice(3);return"+54 "+area+" "+ls;}
function oracion(s){s=(s||"").trim().replace(/\s+/g," ");if(!s)return"";return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();}

/* --- Nombres prolijos (para mostrar y cruzar el padrón oficial, tomado del Tablero) --- */
const NORM = s => (s||"").toString().trim().toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ");
const norm2 = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
const SIGLAS=new Set(["SA","SRL","SAS","SH","SCS","SAMCO","OSPE","PAMI","IAPOS","IPS","ART","OSDE","CIC","CAPS","SIES","ACA","EPE","CEMAR","AMR","APROSS","IOMA","SAU","SACIF","SAIC","II","III","IV","VI","VII","VIII","IX"]);
const ENLACES=new Set(["DE","DEL","LA","LAS","LOS","EL","Y","E","EN","A","AL","POR","PARA","CON"]);
const TILDES={ANALISIS:"Análisis",CLINICO:"Clínico",CLINICA:"Clínica",CLINICOS:"Clínicos",CLINICAS:"Clínicas",MEDICO:"Médico",MEDICA:"Médica",MEDICOS:"Médicos",MEDICAS:"Médicas",ATENCION:"Atención",DIAGNOSTICO:"Diagnóstico",IMAGENES:"Imágenes",FARMACEUTICO:"Farmacéutico",FARMACEUTICA:"Farmacéutica",ASOCIACION:"Asociación",FUNDACION:"Fundación",FEDERACION:"Federación",PROTECCION:"Protección",ADMINISTRACION:"Administración",REHABILITACION:"Rehabilitación",INTERNACION:"Internación",NUTRICION:"Nutrición",CIRUGIA:"Cirugía",DIALISIS:"Diálisis",ONCOLOGIA:"Oncología",CARDIOLOGIA:"Cardiología",TRAUMATOLOGIA:"Traumatología",OFTALMOLOGIA:"Oftalmología",RADIOLOGIA:"Radiología",ODONTOLOGIA:"Odontología",PSICOLOGIA:"Psicología",GINECOLOGIA:"Ginecología",NEUROLOGIA:"Neurología",NEFROLOGIA:"Nefrología",UROLOGIA:"Urología",KINESIOLOGIA:"Kinesiología",PUBLICO:"Público",PUBLICA:"Pública",JOSE:"José",MARIA:"María",NICOLAS:"Nicolás",ANDRES:"Andrés",TOMAS:"Tomás",MARTIN:"Martín",RAMON:"Ramón",JULIAN:"Julián",ADRIAN:"Adrián",HECTOR:"Héctor",VICTOR:"Víctor",ANGEL:"Ángel",INES:"Inés",JESUS:"Jesús",BELEN:"Belén",GERMAN:"Germán",JOAQUIN:"Joaquín",SIMON:"Simón",CONCEPCION:"Concepción"};
function titulo(s){let t=(s||"").toString().replace(/\s+/g," ").trim();if(!t)return"";return t.split(" ").map((w,i)=>{const u=w.toUpperCase().replace(/[^A-ZÁÉÍÓÚÑ0-9]/g,"");if(SIGLAS.has(u))return w.toUpperCase();if(TILDES[u])return TILDES[u];if(/^\d/.test(w))return w;if(w.length<=1)return w.toUpperCase();const low=w.toLowerCase();if(i>0&&ENLACES.has(u))return low;return low.charAt(0).toUpperCase()+low.slice(1);}).join(" ");}

/* --- Cruce con el padrón oficial (mismo criterio conservador del Tablero) --- */
const LOC_ALIAS={"ROSARIO SUD":"ROSARIO","ROSARIO NORTE":"ROSARIO","ROSARIOS":"ROSARIO","RSOARIO":"ROSARIO","BARRIO FISHERTON":"ROSARIO","BARRIO PARQUE":"ROSARIO","ROSARIO SANTA FE":"ROSARIO","V GOBERNADOR GALVEZ":"VILLA GOBERNADOR GALVEZ","CABA":"CIUDAD AUTONOMA DE BUENOS AIRES","CIUDAD DE BUENOS AIRES":"CIUDAD AUTONOMA DE BUENOS AIRES","BARRIO NUEVA CORDOBA":"CORDOBA","EMPALME":"EMPALME VILLA CONSTITUCION","SAN JERONIMO":"SAN JERONIMO SUD","VILLA CONSTITUC":"VILLA CONSTITUCION"};
/* Normaliza la ciudad de un contacto a la clave de localidad del padrón: saca puntos
   ("V.Gobernador Galvez"), corta en la coma ("Rosario, Santa Fe" → "Rosario") y aplica alias. */
function locKey(city){ let loc=NORM(city).replace(/\./g," ").split(",")[0].replace(/\s+/g," ").trim(); return LOC_ALIAS[loc]||loc; }
const RUIDO=/\b(FARMACIA|FARMACIAS|FCIA|SRL|S R L|SA|S A|SAS|S A S|SH|S H|DE|DEL|LA|EL|LOS|LAS|Y|E|HIJOS|HNOS|HERMANOS|SOCIEDAD|ANONIMA|LTDA|LIMITADA|CIA)\b/g;
const GENERICO=new Set(["PARQUE","CENTRO","NORTE","SUR","ESTE","OESTE","NUEVA","NUEVO","SAN","SANTA","CENTRAL","MODELO","ESPANOL","ESPANOLA","ITALIANO","ITALIANA","MUNICIPAL","PROVINCIAL","REGIONAL","GENERAL","MEDICA","MEDICO","SALUD","VIDA","CRUZ","PLAZA","MITRE","BELGRANO","SARMIENTO","MORENO","URQUIZA","ALBERDI","RIVADAVIA"]);
const clave = s => NORM(s).replace(/[^A-Z0-9 ]/g," ").replace(RUIDO," ").replace(/\s+/g," ").trim();
const _tk = s => s.split(" ").filter(x=>x.length>2);
function _coincide(a,b){
  if(!a||!b) return false;
  const ta=_tk(a), tb=_tk(b); if(!ta.length||!tb.length) return false;
  // núcleo idéntico. Si es una sola palabra, exigimos ≥4 letras y que no sea genérica:
  // dentro de la MISMA localidad, un apellido corto igual (Amat, Vega, Azar…) es un match real.
  if(a===b){ if(ta.length===1) return ta[0].length>=4 && !GENERICO.has(ta[0]); return true; }
  if(ta.length>=2 && tb.length>=2){ const A=new Set(ta),B=new Set(tb); let i=0; for(const x of A) if(B.has(x)) i++; if(i/(A.size+B.size-i)>=0.67) return true; }
  const corto=a.length<=b.length?a:b, largo=a.length<=b.length?b:a;
  if(corto.length>=8 && _tk(corto).length>=2 && largo.includes(corto)) return true;
  return false;
}

let _cargando=false, _lastLoad=0;
async function cargar(silent){
  if(_cargando) return; _cargando=true;
  try{
    const HOY=new Date(); const m30=iso(new Date(HOY-30*864e5)), d7=iso(new Date(HOY-7*864e5));
    const base=[["state","in",["sale","done"]]];
    const [ct,gTot,gMes,gSem,gRec,bovMsgs]=await Promise.all([
      rpc("res.partner","search_read",[[["type","=","contact"]]],{fields:PFIELDS,limit:0,context:{lang:"es_AR"}}),
      rpc("sale.order","read_group",[base,["amount_total:sum"],["partner_id"]],{lazy:false}),
      rpc("sale.order","read_group",[[...base,["date_order",">=",m30]],["amount_total:sum"],["partner_id"]],{lazy:false}),
      rpc("sale.order","read_group",[[...base,["date_order",">=",d7]],["amount_total:sum"],["partner_id"]],{lazy:false}),
      rpc("sale.order","read_group",[base,["date_order:max"],["partner_id"]],{lazy:false,limit:4000}),
      rpc("mail.message","search_read",[[["model","=","res.partner"],["body","like",BOV_TAG]]],{fields:["res_id","body","date"],limit:0})
    ]);
    // catálogos + roster de comerciales: no cambian seguido → se cargan 1 sola vez
    if(!CAT.prov.length){
      const [fiscal,idt,prov,users,vent]=await Promise.all([
        rpc("l10n_ar.afip.responsibility.type","search_read",[[]],{fields:["id","name"],context:{lang:"es_AR"}}),
        rpc("l10n_latam.identification.type","search_read",[[["active","=",true]]],{fields:["id","name"],context:{lang:"es_AR"}}),
        rpc("res.country.state","search_read",[[["country_id.code","=","AR"]]],{fields:["id","name"],limit:0}),
        rpc("res.users","search_read",[[["share","=",false],["active","=",true]]],{fields:["id","name"],context:{lang:"es_AR"}}),
        // organigrama real: empleados ACTIVOS del depto Ventas → los comerciales de verdad
        rpc("hr.employee","search_read",[[["department_id.name","ilike","venta"],["active","=",true]]],{fields:["name","job_title","user_id","parent_id"],context:{lang:"es_AR"}})
      ]);
      CAT={fiscal,idt,prov};
      PROVIDX={}; prov.forEach(p=>{ PROVIDX[NORM(p.name.replace(/\s*\((AR|IT)\)$/,""))]=p.id; });
      // roster de usuarios internos (para reasignar cualquier contacto)
      COMLIST=users.filter(u=>u.id>1).map(u=>({id:u.id,name:u.name})).sort((a,b)=>rolRank(a.name)-rolRank(b.name)||a.name.localeCompare(b.name));
      // COMERCIALES + LÍDERES para "Enviar a comercial": depto Ventas activo (incluye a Marcela)
      // + sus jefes de arriba que NO están en Ventas (Germán, Diego). Se limpia solo con el organigrama.
      const vf=(vent||[]).filter(e=>e.user_id);
      const rmap={}; vf.forEach(e=>{ rmap[e.user_id[0]]={id:e.user_id[0],name:e.user_id[1]}; });
      const ventEmp=new Set(vf.map(e=>e.id));
      const jefeIds=[...new Set(vf.map(e=>e.parent_id&&e.parent_id[0]).filter(pid=>pid&&!ventEmp.has(pid)))];
      if(jefeIds.length){ try{ const jefes=await rpc("hr.employee","read",[jefeIds],{fields:["user_id"],context:{lang:"es_AR"}}); jefes.forEach(j=>{ if(j.user_id) rmap[j.user_id[0]]={id:j.user_id[0],name:j.user_id[1]}; }); }catch(_){} }
      COMROSTER=Object.values(rmap).sort((a,b)=>rolRank(a.name)-rolRank(b.name)||a.name.localeCompare(b.name));
    }
    // bóveda: el último marcador por contacto manda (salir = fuera)
    BOVEDA={}; bovMsgs.sort((a,b)=>(b.date||"").localeCompare(a.date||"")); const _vb=new Set();
    for(const msg of bovMsgs){ if(_vb.has(msg.res_id)) continue; _vb.add(msg.res_id);
      const body=(msg.body||"").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," "); if(/salir/i.test(body)) continue;
      BOVEDA[msg.res_id]={nota:(body.split("]").slice(1).join("]")||"").trim()}; }

    VENTA={}; const put=(g,k)=>g.forEach(x=>{if(x.partner_id){(VENTA[x.partner_id[0]]=VENTA[x.partner_id[0]]||{})[k]=x.amount_total;}});
    put(gTot,"tot"); put(gMes,"mes"); put(gSem,"sem");
    const REC={}, NPED={};
    gRec.forEach(g=>{ if(g.partner_id){ REC[g.partner_id[0]]=g.date_order; NPED[g.partner_id[0]]=g.__count||0; } });

    // duplicados por CUIT y por nombre
    const vatMap={}, nameMap={};
    ct.forEach(p=>{ if(p.vat){(vatMap[p.vat]=vatMap[p.vat]||[]).push(p.id);} const nk=norm2(p.name); if(nk){(nameMap[nk]=nameMap[nk]||[]).push(p.id);} });
    DUPVAT={}; Object.entries(vatMap).forEach(([v,ids])=>{if(ids.length>1)ids.forEach(id=>DUPVAT[id]=v);});
    DUPNAME={}; Object.entries(nameMap).forEach(([n,ids])=>{if(ids.length>1)ids.forEach(id=>DUPNAME[id]=n);});

    DATA=ct.map(p=>{
      const v=VENTA[p.id]||{};
      const d=soloDig(p.mobile||p.phone);
      const telEstado = !d?"falta":(d.length>=8&&d.length<=13?"ok":"dudoso");
      const nped=NPED[p.id]||0, dias=diasDesde(REC[p.id]);
      const faltantes=[];
      if(telEstado==="falta")faltantes.push("teléfono"); else if(telEstado==="dudoso")faltantes.push("tel. formato");
      if(!mailOk(p.email))faltantes.push("email");
      if(!p.vat)faltantes.push("CUIT");
      if(!p.l10n_ar_afip_responsibility_type_id)faltantes.push("cond. fiscal");
      const c={ id:p.id, nombre:p.name||"(sin nombre)", ciudad:p.city||"", prov:p.state_id?p.state_id[1].replace(/\s*\((AR|IT)\)$/,""):"",
        telv:(p.mobile||p.phone||""), telEstado, email:p.email||"", emailOk:mailOk(p.email),
        cuit:p.vat||"", fiscal:p.l10n_ar_afip_responsibility_type_id?p.l10n_ar_afip_responsibility_type_id[1]:"",
        comercial:p.user_id?p.user_id[1]:"Sin asignar", comercialId:p.user_id?p.user_id[0]:false,
        rubro:p[RUBRO_FIELD]||"", esCliente:p.customer_rank>0||nped>0, compro:nped>0, nped, dias,
        proveedor:(p.supplier_rank||0)>0, empresa:(p.is_company||p.company_type==="company"),
        comprado:v.tot||0, mesv:v.mes||0, semv:v.sem||0, faltantes,
        wa:waNumber(p.mobile,p.phone), tellink:telLink(p.mobile,p.phone),
        dupVat:DUPVAT[p.id]||"", dupName:DUPNAME[p.id]||"", enPadron:false, nombreOficial:"", part:p, boveda:BOVEDA[p.id]||null,
        noUsar:/\(no usar\)/i.test(p.name||""), combo:/combo|super combo|^oferta|^promo|^tanda|^bloque|prueba|test\b/i.test(p.name||"") };
      c.seg=segmentar(c);
      return c;
    });
    if(UNI) cruzar();
    recalcComs();
    if(silent){ const y=window.scrollY; render(); window.scrollTo(0,y); } else render();
    if(!UNI) cargarUniverso();   // el padrón (~900 KB) se trae 1 vez y actualiza los cruces al llegar
    Promise.all([cargarAsignados(),cargarMarcas()]).then(()=>{ if(filtro.tab==="conquistar") renderConquistar(); });   // ocultar asignados + aplicar marcas (descartado/pendiente)
    if(!silent || Date.now()-_riesgoAt>180000) cargarRiesgos();   // alerta de crédito (más liviana: cada ~3 min)
    if(!silent) cargarNuevos();   // historial de contactos nuevos (se refresca al abrir la pestaña)
    if(!silent) cargarPortalEstado();   // estado del acceso al portal por contacto (para el ícono de la fila)
  }catch(e){ if(!silent) document.getElementById("app").innerHTML='<div class="errbox"><b>No pude cargar.</b><br>'+esc(e.message||e)+'</div>'; }
  finally{ _cargando=false; _lastLoad=Date.now(); }
}
function drawerAbierto(){ const d=document.getElementById("drawer"); return d&&d.classList.contains("on"); }
function editando(){ const a=document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName||""); }
/* Alerta de crédito: cruza cuenta corriente + bóveda incobrable + marca manual (motor en core.js).
   Se trae aparte (no frena el primer render) y actualiza los badges cuando llega. */
async function cargarRiesgos(){
  try{
    const M=await EYG.riesgoCartera(); _riesgoAt=Date.now();
    DATA.forEach(c=>{ c.riesgo=M[c.id]||null; });
    if(filtro.tab==="nuestros" && !drawerAbierto() && !editando()){ const y=window.scrollY; renderLista(); window.scrollTo(0,y); }
  }catch(e){ console.warn("riesgos:",e.message); }
}

/* Historial de contactos NUEVOS (creados desde el Core): quién los creó, a quién están
   asignados hoy, si fueron contactados (cruce con los marcadores del comercial) y si vendieron.
   Se re-consulta en vivo → los datos se van actualizando solos. */
async function cargarNuevos(){
  try{
    const msgs=await rpc("mail.message","search_read",[[["model","=","res.partner"],["body","like",NUEVO_TAG]]],{fields:["res_id","body","date"],limit:0});
    msgs.sort((a,b)=>(a.date||"").localeCompare(b.date||""));   // el más viejo = la creación
    const creado={};
    for(const m of msgs){ if(creado[m.res_id]) continue; const b=(m.body||"").replace(/<[^>]+>/g," "); const mm=b.match(/por=([^<\n]+)/); creado[m.res_id]={creador:((mm&&mm[1])||"").trim()||"—", fecha:m.date}; }
    const ids=Object.keys(creado).map(x=>+x);
    if(!ids.length){ NUEVOS=[]; if(filtro.tab==="nuevos") renderNuevos(); const t=document.getElementById("cntNuevos"); if(t)t.textContent="0"; return; }
    const [parts, contactMsgs, ventas]=await Promise.all([
      rpc("res.partner","read",[ids],{fields:["id","name","user_id","city","create_date","active",RUBRO_FIELD],context:{lang:"es_AR"}}),
      rpc("mail.message","search_read",[[["model","=","res.partner"],["res_id","in",ids],"|","|","|",["body","like","[COBRO-CONTACTO]"],["body","like","EyGWA"],["body","like","EyGCRM"],["body","like","[EyGWA]"]]],{fields:["res_id","date","body"],limit:0}),
      rpc("sale.order","read_group",[[["partner_id","in",ids],["state","in",["sale","done"]]],["amount_total:sum"],["partner_id"]],{lazy:false})
    ]);
    // último contacto por cliente: fecha/hora + quién lo hizo (del "· por X" del marcador del comercial)
    const cont={};
    contactMsgs.forEach(m=>{ const prev=cont[m.res_id]; if(!prev||m.date>prev.date){ const b=(m.body||"").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," "); const pm=b.match(/\bpor\s+([^<\n·]+?)\s*$/i); cont[m.res_id]={date:m.date, por:(pm&&pm[1]?pm[1].trim():"")}; } });
    const vt={}; ventas.forEach(g=>{ if(g.partner_id) vt[g.partner_id[0]]={tot:g.amount_total||0,n:g.__count||0}; });
    const byId={}; parts.forEach(p=>byId[p.id]=p);
    // Solo cuentan como NUEVOS los que existen y están activos: si un "creado" resultó
    // ser duplicado (se archivó) o se dio de baja, NO es un contacto nuevo → fuera.
    NUEVOS=ids.filter(id=>byId[id] && byId[id].active!==false).map(id=>{ const p=byId[id], cr=creado[id], v=vt[id]||{}; return {
      id, nombre:p.name||"(sin nombre)", creador:cr.creador, fecha:p.create_date||cr.fecha,
      comercial:p.user_id?p.user_id[1]:"Sin asignar", rubro:p[RUBRO_FIELD]||"",
      contactado:cont[id]||null, ventaTot:v.tot||0, nped:v.n||0 };
    }).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
    const t=document.getElementById("cntNuevos"); if(t) t.textContent=NUEVOS.length;
    if(filtro.tab==="nuevos" && !drawerAbierto()) renderNuevos();
  }catch(e){ console.warn("nuevos:",e.message); }
}

function comercialesDe(rows){
  const m=new Map();
  rows.forEach(c=>{ if(c.comercialId && !m.has(c.comercialId)) m.set(c.comercialId,c.comercial); });
  return [...m.entries()].map(([id,name])=>({id,name})).sort((a,b)=>rolRank(a.name)-rolRank(b.name)||a.name.localeCompare(b.name));
}
function recalcComs(){
  const cm={};
  // 1) primero los que TIENEN contactos, con el nombre exacto como viene de Odoo (es_AR)
  base().forEach(c=>{ const o=cm[c.comercial]||(cm[c.comercial]={comercial:c.comercial,n:0,tot:0,mes:0,sem:0}); o.n++; o.tot+=c.comprado; o.mes+=c.mesv; o.sem+=c.semv; });
  // 2) sembrar el equipo que NO apareció (0 contactos), SIN duplicar por acentos (ej. "Lucia" vs "Lucía")
  const yaNorm=new Set(Object.keys(cm).map(n=>norm2(n)));
  COMERCIALES.forEach(n=>{ if(!yaNorm.has(norm2(n))) cm[n]={comercial:n,n:0,tot:0,mes:0,sem:0}; });
  COMS=Object.values(cm).sort((a,b)=>rolRank(a.comercial)-rolRank(b.comercial)||b.tot-a.tot);
}

/* ================= Padrón oficial ================= */
async function cargarUniverso(){
  try{
    const r=await fetch(EYG.BASE+"direccion/universo-salud.json");
    if(!r.ok) throw new Error("HTTP "+r.status);
    UNI=await r.json();
    // provincia por defecto (Santa Fe) ANTES de contar, así el número de la pestaña
    // y el de la tarjeta "Por conquistar" hablan de la MISMA provincia.
    if(!filtro.pProv){ const ps=provinciasConquista(); filtro.pProv=ps.find(p=>/santa fe/i.test(p))||ps[0]||""; }
    cruzar();
    if(filtro.tab==="conquistar"){ render(); }
    else { renderLista(); const tb=document.getElementById("cntConq"), cb=filtro.pProv?coberturaProv(filtro.pProv):null; if(tb) tb.textContent=cb?cb.falta.toLocaleString("es-AR"):"…"; }
  }catch(e){ console.warn("universo:",e.message); UNI=null; }
}
/* Dirección normalizada: número de puerta + palabras significativas de la calle.
   Sirve para reconocer el MISMO lugar aunque el padrón lo nombre distinto
   (ej. "Farmacia Porta" vs "Farmacia Alejandra Porta", ambas en Baigorria 1477). */
function claveDir(s){ if(!s) return null; const num=((""+s).match(/\d{2,}/)||[])[0]; if(!num) return null;
  const calle=NORM(s).replace(/[^A-Z0-9 ]/g," ").split(" ").filter(w=>w.length>=4 && !/^\d+$/.test(w) && !["CALLE","AVDA","AVENIDA","BULEVAR","BOULEVARD"].includes(w));
  return {num, calle}; }
function _coincideDir(a,b){ if(!a||!b) return false; if(a.num!==b.num) return false; if(!a.calle.length||!b.calle.length) return false; return a.calle.some(t=>b.calle.includes(t)); }
function cruzar(){
  if(!UNI) return;
  // índice localidad "PROV|LOC" -> posición en locs
  const pos=new Map();
  UNI.locs.forEach((l,i)=>pos.set(NORM(l[1])+"|"+NORM(l[0]),i));
  // nuestros contactos por localidad (con nombre Y dirección normalizados)
  const mios=new Map();
  DATA.forEach(c=>{ c.enPadron=false; c.nombreOficial=""; const loc=locKey(c.ciudad); if(!loc) return; const i=pos.get(NORM(c.prov)+"|"+loc); if(i===undefined) return; if(!mios.has(i)) mios.set(i,[]); mios.get(i).push({c,k:clave(c.nombre),dir:claveDir(c.part&&c.part.street)}); });
  UNI.est.forEach(e=>{ e[6]=0; });
  for(const e of UNI.est){
    const cands=mios.get(e[1]); if(!cands) continue;
    const ke=clave(e[0]); const edir=claveDir(e[3]); if(!ke && !edir) continue;
    for(const cd of cands){ if((ke&&_coincide(cd.k,ke)) || _coincideDir(cd.dir,edir)){ e[6]=cd.c.id; cd.c.enPadron=true; cd.c.nombreOficial=titulo(e[0]); break; } }
  }
}
/* Establecimientos oficiales que NO son contacto nuestro (los "por conquistar") */
function porConquistar(){
  if(!UNI) return [];
  const provOk = filtro.pProv ? NORM(filtro.pProv) : null;
  const est = filtro.pEstado||"activo";   // activo | pendiente | descartado
  const out=[];
  UNI.est.forEach((e,idx)=>{
    const L=UNI.locs[e[1]]; if(!L) return;
    const nombre=titulo(e[0]); const ck=cqKey(nombre, L[0]);
    const m=MARCAS[ck]||null; const mEstado=m&&m.estado;
    if(est==="descartado"){
      if(mEstado!=="descartado") return;                    // vista de descartados: solo esos
    } else {
      if(e[6]) return; if(CREADOS.has(idx)) return;          // ya es contacto / recién creado
      if(ASIGNADOS.size && ASIGNADOS.has(ck)) return;        // ya asignado a un comercial
      if(mEstado==="descartado") return;                     // descartado a mano → fuera
      if(est==="pendiente" && mEstado!=="pendiente") return; // vista de pendientes: solo los marcados
    }
    if(provOk && NORM(L[1])!==provOk) return;
    if(filtro.pTipo==="farm" && e[2]!==0) return;
    if(filtro.pTipo==="inst" && e[2]!==1) return;
    if(filtro.pLoc && NORM(L[0])!==NORM(filtro.pLoc)) return;
    if(filtro.pQ){ const q=filtro.pQ.toLowerCase(); if(!(nombre.toLowerCase().includes(q)||(L[0]||"").toLowerCase().includes(q))) return; }
    out.push({idx,nombre,tipo:e[2],loc:L[0],prov:L[1],dom:e[3]||"", cqKey:ck, marca:m});
  });
  return out;
}
// contadores de marcas por provincia (para los chips de estado)
function marcasEnProv(estado){ const p=filtro.pProv?NORM(filtro.pProv):null; return Object.values(MARCAS).filter(m=>m&&m.estado===estado&&(!p||NORM(m.prov||"")===p)).length; }
async function cargarMarcas(){ try{ MARCAS=JSON.parse(await rpc("ir.config_parameter","get_param",[MARCAS_KEY])||"{}")||{}; }catch(e){ MARCAS={}; } }
// items: [{cqKey,nombre,loc,prov}]. estado=null quita la marca. RMW para no pisar a otros usuarios.
async function marcarProspectos(items, estado, nota){
  if(!items||!items.length) return;
  let fresh; try{ fresh=JSON.parse(await rpc("ir.config_parameter","get_param",[MARCAS_KEY])||"{}")||{}; }catch(e){ fresh={}; }
  const por=(PERFIL&&(PERFIL.nombre||PERFIL.email))||"—", fecha=new Date().toISOString();
  items.forEach(it=>{ if(!it||!it.cqKey) return; if(estado===null) delete fresh[it.cqKey]; else fresh[it.cqKey]={estado, por, fecha, nombre:it.nombre||"", loc:it.loc||"", prov:it.prov||"", nota:nota||""}; });
  await rpc("ir.config_parameter","set_param",[MARCAS_KEY, JSON.stringify(fresh)]);
  MARCAS=fresh;
}
/* provincias del padrón que traen detalle uno por uno (SF/ER/CBA) */
function provinciasConquista(){ return (UNI&&UNI.detalle)?UNI.detalle.map(p=>titulo(p)):[]; }
function coberturaProv(provName){
  if(!UNI) return null; const provOk=NORM(provName); let tot=0,mios=0;
  UNI.est.forEach(e=>{ const L=UNI.locs[e[1]]; if(!L||NORM(L[1])!==provOk) return; tot++; if(e[6])mios++; });
  return {tot,mios,falta:tot-mios,pct:tot?Math.round(mios/tot*100):0};
}

/* ================= Filtros de "Nuestros contactos" ================= */
/* base = universo de trabajo: sin ruido, sin archivados en bóveda y sin proveedores puros. */
const esProvPuro = c => c.proveedor && !c.esCliente;   // proveedor y NO cliente → fuera de la lista de clientes
function base(){ return DATA.filter(c=> !c.boveda && !esProvPuro(c) && !(filtro.ocultarRuido && (c.combo||c.noUsar))); }
function enBoveda(){ return DATA.filter(c=> c.boveda && !(filtro.ocultarRuido && (c.combo||c.noUsar))); }
function enProveedores(){ return DATA.filter(c=> esProvPuro(c) && !c.boveda && !(filtro.ocultarRuido && (c.combo||c.noUsar))); }
function visibles(){
  if(filtro.boveda){ const q=(filtro.q||"").toLowerCase(); return enBoveda().filter(c=> !q || c.nombre.toLowerCase().includes(q) || (c.ciudad||"").toLowerCase().includes(q)); }
  if(filtro.proveedores){ const q=(filtro.q||"").toLowerCase(); return enProveedores().filter(c=> !q || c.nombre.toLowerCase().includes(q) || (c.ciudad||"").toLowerCase().includes(q)); }
  return base().filter(c=>{
    if(filtro.com && c.comercial!==filtro.com) return false;
    if(filtro.seg && c.seg!==filtro.seg) return false;
    if(filtro.rubro==="__none"){ if(c.rubro) return false; } else if(filtro.rubro){ if(c.rubro!==filtro.rubro) return false; }
    if(filtro.issue==="tel0" && c.telEstado!=="falta") return false;
    if(filtro.issue==="telbad" && c.telEstado!=="dudoso") return false;
    if(filtro.issue==="mail0" && c.emailOk) return false;
    if(filtro.issue==="cuit0" && c.cuit) return false;
    if(filtro.issue==="fiscal0" && c.fiscal) return false;
    if(filtro.issue==="dup" && !(c.dupVat||c.dupName)) return false;
    if(filtro.issue==="pad" && !c.enPadron) return false;
    if(filtro.issue==="riesgo" && !(c.riesgo && c.riesgo.nivel && c.riesgo.nivel!=="ok")) return false;
    if(filtro.issue==="portal" && !c.portal) return false;
    if(filtro.issue==="portal-no" && !(c.portal && !c.portal.loggedIn)) return false;
    if(filtro.q){const q=filtro.q.toLowerCase(); if(!(c.nombre.toLowerCase().includes(q)||(c.cuit||"").includes(q)||(c.ciudad||"").toLowerCase().includes(q))) return false;}
    return true;
  });
}

/* Barra de acciones en lote de prospectos (enviar a comercial los tildados). */
function pBulkBarHTML(){
  const list=porConquistar(); const vis=list.slice(0,600); const allSel=vis.length>0 && vis.every(p=>PSEL.has(p.idx)); const n=PSEL.size; const est=filtro.pEstado||"activo";
  let acc;
  if(!n){ acc=`<span class="muted" style="font-size:12px">Tildá establecimientos para enviarlos a un comercial, marcarlos "sin WhatsApp" o descartarlos en lote.</span>`; }
  else if(est==="descartado"){ acc=`<span class="bcount">${n} seleccionados</span><button class="bbtn" onclick="restaurarLote()">↩ Restaurar a la lista</button><button class="bbtn ghost" onclick="PSEL.clear();renderProspectos()">✕ Limpiar</button>`; }
  else{ acc=`<span class="bcount">${n} seleccionados</span>
      <select class="bsel" onchange="enviarAConquistarLote(this.value);this.selectedIndex=0"><option value="">📨 Enviar a comercial…</option>${COMROSTER.map(o=>`<option value="${esc(o.name)}">${esc(o.name)}</option>`).join("")}</select>
      ${est==="pendiente"?`<button class="bbtn" onclick="restaurarLote()">✓ Quitar pendiente</button>`:`<button class="bbtn" style="background:#FBF0DA;border-color:#EAD6A6;color:#9A6B12" onclick="pendienteLote()">⏳ Sin WhatsApp</button>`}
      <button class="bbtn danger" onclick="descartarLote()">🚫 Descartar</button>
      <button class="bbtn ghost" onclick="PSEL.clear();renderProspectos()">✕ Limpiar</button>`; }
  return `<div id="pbulkwrap" class="bulkbar"><label class="ba"><input type="checkbox" ${allSel?'checked':''} onchange="pselAll(this.checked)"> Seleccionar los ${vis.length}</label>${acc}</div>`;
}
function togglePSel(idx){ if(PSEL.has(idx))PSEL.delete(idx); else PSEL.add(idx); const bw=document.getElementById("pbulkwrap"); if(bw) bw.outerHTML=pBulkBarHTML(); }
function pselAll(on){ const ids=porConquistar().slice(0,600).map(p=>p.idx); if(on) ids.forEach(i=>PSEL.add(i)); else ids.forEach(i=>PSEL.delete(i)); renderProspectos(); }
async function enviarAConquistarLote(comName){
  if(!comName || !PSEL.size) return;
  const items=[...PSEL].map(idx=>{ const e=UNI.est[idx]; if(!e) return null; const L=UNI.locs[e[1]]||[]; return {nombre:titulo(e[0]),tipo:e[2],loc:L[0]||"",prov:L[1]||"",dom:e[3]?titulo(e[3]):""}; }).filter(Boolean);
  if(!items.length) return;
  if(!confirm(`¿Enviar ${items.length} establecimiento(s) a la carpeta "A conquistar" de ${comName}?`)) return;
  try{
    const por=(PERFIL&&(PERFIL.nombre||PERFIL.email))||"—";
    await EYG.conquistarAsignar(items, comName, por);
    items.forEach(it=>ASIGNADOS.add(cqKey(it.nombre,it.loc)));
    PSEL.clear(); toast(`📨 ${items.length} enviado(s) a la carpeta de ${comName}`);
    renderProspectos();
  }catch(e){ toast("⚠ No se pudo enviar: "+(e.message||e)); }
}

/* Enviar un establecimiento del padrón a la carpeta "A conquistar" de un comercial (bolsillo del panel). */
function enviarAConquistar(idx, comName){
  if(!comName) return;
  const e=UNI.est[idx]; if(!e) return; const L=UNI.locs[e[1]]||[];
  const it={ nombre:titulo(e[0]), tipo:e[2], loc:L[0]||"", prov:L[1]||"", dom:e[3]?titulo(e[3]):"" };
  const por=(PERFIL&&(PERFIL.nombre||PERFIL.email))||"—";
  EYG.conquistarAsignar([it], comName, por)
    .then(n=>{ ASIGNADOS.add(cqKey(it.nombre, it.loc)); if(filtro.tab==="conquistar") renderProspectos();   // sale de la lista al toque
      toast(n?("📨 Enviado a la carpeta de "+comName):("Ya estaba en la carpeta de "+comName)); })
    .catch(()=>toast("⚠ No se pudo enviar"));
}

function itemDe(idx){ const e=UNI.est[idx]; if(!e) return null; const L=UNI.locs[e[1]]||[]; const nombre=titulo(e[0]); return {cqKey:cqKey(nombre,L[0]||""), nombre, loc:L[0]||"", prov:L[1]||""}; }
async function descartarUno(idx){ const it=itemDe(idx); if(!it) return; if(!confirm(`¿Sacar "${it.nombre}" de la lista? (ya es cliente o no aplica). Reversible desde "Descartados".`)) return; try{ await marcarProspectos([it],"descartado"); toast("🚫 Descartado de la lista"); renderConquistar(); }catch(e){ toast("⚠ No se pudo: "+(e.message||e)); } }
async function pendienteUno(idx,on){ const it=itemDe(idx); if(!it) return; try{ await marcarProspectos([it], on?"pendiente":null); toast(on?"⏳ Marcado: buscar WhatsApp por otro medio":"✓ Quitado de pendientes"); renderConquistar(); }catch(e){ toast("⚠ No se pudo: "+(e.message||e)); } }
async function descartarLote(){ if(!PSEL.size) return; const items=[...PSEL].map(itemDe).filter(Boolean); if(!confirm(`¿Descartar ${items.length} de la lista? (ya son clientes o no aplican). Reversible.`)) return; try{ await marcarProspectos(items,"descartado"); PSEL.clear(); toast(`🚫 ${items.length} descartado(s)`); renderConquistar(); }catch(e){ toast("⚠ No se pudo: "+(e.message||e)); } }
async function pendienteLote(){ if(!PSEL.size) return; const items=[...PSEL].map(itemDe).filter(Boolean); try{ await marcarProspectos(items,"pendiente"); PSEL.clear(); toast(`⏳ ${items.length} marcado(s): buscar WhatsApp`); renderConquistar(); }catch(e){ toast("⚠ No se pudo: "+(e.message||e)); } }
async function restaurarLote(){ if(!PSEL.size) return; const items=[...PSEL].map(itemDe).filter(Boolean); try{ await marcarProspectos(items,null); PSEL.clear(); toast(`↩ ${items.length} restaurado(s)`); renderConquistar(); }catch(e){ toast("⚠ No se pudo: "+(e.message||e)); } }

/* ================= Reasignar comercial (rápido) ================= */
async function reasignar(id,val){
  const c=DATA.find(x=>x.id===id); if(!c) return;
  const uid=val?parseInt(val,10):false;
  const sel=document.getElementById("reasg"); if(sel) sel.disabled=true;
  try{
    await rpc("res.partner","write",[[id],{user_id:uid}],{context:{lang:"es_AR"}});
    c.comercialId=uid; c.comercial=uid?(COMLIST.find(o=>o.id===uid)||{}).name||"—":"Sin asignar";
    if(uid && !COMLIST.some(o=>o.id===uid)) COMLIST.push({id:uid,name:c.comercial});
    recalcComs(); toast("✅ Reasignado a "+c.comercial);
    if(sel) sel.disabled=false;
  }catch(e){ if(sel) sel.disabled=false; toast("⚠ No se pudo reasignar: "+(e.message||e)); }
}

/* ================= Acciones en LOTE (curar rápido) ================= */
const idsSel=()=>[...SEL];
async function asignarLote(val){
  const ids=idsSel(); const uid=val?parseInt(val,10):false; if(!ids.length||!uid) return;
  const nom=(COMLIST.find(o=>o.id===uid)||{}).name||"comercial";
  // posible cruce: seleccionados que son duplicado (CUIT/nombre) de un contacto YA asignado a OTRO comercial
  const cruce=ids.map(id=>DATA.find(c=>c.id===id)).filter(Boolean).filter(c=>(c.dupVat||c.dupName)&&DATA.some(o=>o.id!==c.id&&o.comercialId&&o.comercialId!==uid&&((c.dupVat&&o.dupVat===c.dupVat)||(c.dupName&&o.dupName===c.dupName))));
  let msg=`¿Asignar ${ids.length} contacto(s) a ${nom}?`;
  if(cruce.length) msg+=`\n\n⚠ ${cruce.length} podrían ser el mismo cliente que ya tiene OTRO comercial (posible cruce). Fijate los marcados "⚠ dup".`;
  if(!confirm(msg)) return;
  try{
    await rpc("res.partner","write",[ids,{user_id:uid}],{context:{lang:"es_AR"}});
    ids.forEach(id=>{const c=DATA.find(x=>x.id===id); if(c){c.comercialId=uid;c.comercial=nom;}});
    SEL.clear(); recalcComs(); toast(`✅ ${ids.length} asignado(s) a ${nom}`); render();
  }catch(e){ toast("⚠ No se pudo asignar: "+(e.message||e)); }
}

async function consultarBCRA(cuit){
  const box=document.getElementById("bcrabox"); if(!box) return;
  box.innerHTML='<div class="muted" style="margin-top:8px">Consultando BCRA…</div>';
  const r=await EYG.riesgoBCRA(cuit);
  if(!r){ box.innerHTML='<div class="muted" style="margin-top:8px">CUIT inválido para consultar.</div>'; return; }
  if(r.error){ box.innerHTML='<div class="muted" style="margin-top:8px">No se pudo consultar el BCRA ('+esc(r.error)+').</div>'; return; }
  if(r.sinRegistros){ box.innerHTML='<div class="alert okk" style="margin-top:8px">🏦 BCRA: sin registros de deuda financiera.</div>'; return; }
  const cls=r.nivel==="alto"?"alto":r.nivel==="atencion"?"aten":"okk";
  const SITL={1:"Normal",2:"Riesgo bajo",3:"Riesgo medio",4:"Riesgo alto",5:"Irrecuperable",6:"Irrec. téc."};
  box.innerHTML=`<div class="alert ${cls}" style="margin-top:8px">🏦 <b>BCRA:</b> deuda financiera ${money(r.total)} en ${r.n} entidad(es). Peor situación: <b>${r.sitMax} · ${SITL[r.sitMax]||"—"}</b>.${r.irreg>0?` En irregular (3-5): ${money(r.irreg)} (${Math.round(r.pct*100)}%).`:" Todo normal."}${r.jud?" ⚖ Proceso judicial.":""}</div>`;
}

/* ================= Acceso al portal (web de Odoo) =================
   Crea el usuario portal (grupo 10) SIN mandar mail (no_reset_password) y genera un
   link de invitación con token para pasar por WhatsApp; el cliente pone su propia clave. */
const GRUPO_PORTAL=10;
const emailValido=e=>/^[^\s;,@]+@[^\s;,@]+\.[^\s;,@]+$/.test((e||"").trim());
async function cargarPortal(id){
  const box=document.getElementById("portalbox"); if(!box) return;
  const c=DATA.find(x=>x.id===id); if(!c) return;
  if(!c.email){ box.innerHTML=`<p class="muted">Para el portal necesita un <b>email</b> (es su usuario). Cargalo con "✏️ Editar datos".</p>`; return; }
  if(!emailValido(c.email)){ box.innerHTML=`<p class="muted">El email <b>${esc(c.email)}</b> no es válido (¿tiene varios juntos o falta algo?). Corregilo con "✏️ Editar datos" antes de dar acceso.</p>`; return; }
  try{
    const p=(await rpc("res.partner","read",[[id]],{fields:["user_ids"]}))[0];
    const uids=(p&&p.user_ids)||[];
    if(uids.length){
      const us=await rpc("res.users","read",[uids],{fields:["id","login","share","active","login_date"]});
      const interno=us.find(u=>!u.share);
      if(interno){ box.innerHTML=`<p class="muted">Tiene un usuario <b>interno</b> de la empresa (no es un cliente del portal). No se toca desde acá.</p>`; return; }
      const share=us.find(u=>u.share);
      if(share){
        // login_date con fecha = ya ingresó y creó su clave; vacío = todavía no entró (link pendiente)
        const estado = share.login_date
          ? `<div class="alert okk" style="margin-bottom:8px">✅ <b>Ya ingresó y creó su clave.</b> Último ingreso: ${fmtDiaHora(share.login_date)}.</div>`
          : `<div class="alert aten" style="margin-bottom:8px">⏳ <b>Todavía no ingresó.</b> Tiene el acceso creado pero aún no puso su clave — pasale el link.</div>`;
        box.innerHTML=`<div class="linkbox" style="margin-bottom:8px;font-family:inherit">👤 Login: <b>${esc(share.login)}</b>${share.active?'':' · <b style="color:#B0322F">revocado</b>'}</div>
          ${estado}
          <button class="abtn" style="background:var(--agua);color:var(--teal-deep);width:100%" onclick="linkPortal(${id})">🔗 Generar link de acceso</button>
          <div id="portallink"></div>
          <button class="abtn" style="background:#EEF1F0;color:var(--gris);width:100%;margin-top:8px" onclick="revocarPortal(${id},${share.id})">Revocar acceso</button>`;
        return;
      }
    }
    box.innerHTML=`<p class="muted" style="margin-bottom:8px">Dale acceso a la web de Odoo (ve sus pedidos, facturas y saldo). Se crea su usuario y generás un link para que ponga su clave.</p>
      <button class="abtn" style="background:var(--teal);color:#fff;width:100%" onclick="darAccesoPortal(${id})">🌐 Dar acceso al portal</button>`;
  }catch(e){ box.innerHTML=`<p class="muted">No pude leer el estado del portal (${esc(e.message||e)}).</p>`; }
}
async function darAccesoPortal(id){

// Busca en Odoo posibles duplicados por NOMBRE o por DIRECCIÓN (nº de puerta + ciudad).
// Incluye archivados (active_test:false) para no recrear algo que ya existe/dimos de baja.
const FDUP=["id","name","city","user_id","active","street",RUBRO_FIELD];
// nombres de pila comunes: un match SOLO por estos no alcanza para gritar "duplicado" (ej. "Alejandra")
const NOMBRES_COMUNES=new Set(["MARIA","JOSE","JUAN","CARLOS","ANA","ALEJANDRA","ALEJANDRO","LAURA","SILVIA","GABRIELA","MARCELA","SANDRA","MONICA","PATRICIA","CLAUDIA","VERONICA","ANDREA","ANDRES","DANIEL","SERGIO","JORGE","LUIS","ROBERTO","MARTA","SUSANA","GRACIELA","NORMA","ELENA","ROSA","MIGUEL","PABLO","DIEGO","JAVIER","FERNANDO","GUSTAVO","ADRIANA","NATALIA","VALERIA","FLORENCIA","LUCIA","SOLEDAD","EDUARDO","RICARDO","OSCAR","HECTOR","RUBEN","RAUL","WALTER","CRISTINA","BEATRIZ","TERESA","NANCY","MIRTA"]);
function dupFuerte(pTokens, pDir, cand){
  if(_coincideDir(pDir, claveDir(cand.street))) return true;                 // misma dirección = casi seguro el mismo
  const ct=clave(cand.name).split(" ").filter(x=>x.length>=4);
  return ct.some(t=>pTokens.has(t) && !NOMBRES_COMUNES.has(t));              // comparten un token DISTINTIVO (no un nombre de pila)
}
async function buscarDuplicados(name, city, street){
  const nk=[...new Set(clave(name).split(" ").filter(x=>x.length>=4))].slice(0,4);
  const numero=((street||"").match(/\d{2,}/)||[])[0]; const cityW=NORM(city).split(" ")[0];
  const tareas=[];
  if(nk.length){ const dom=Array(Math.max(0,nk.length-1)).fill("|").concat(nk.map(t=>["name","ilike",t])).concat([["type","=","contact"]]); tareas.push(rpc("res.partner","search_read",[dom],{fields:FDUP,limit:40,context:{lang:"es_AR",active_test:false}})); }
  if(numero && cityW){ tareas.push(rpc("res.partner","search_read",[[["type","=","contact"],["street","ilike",numero],["city","ilike",cityW]]],{fields:FDUP,limit:40,context:{lang:"es_AR",active_test:false}})); }
  if(!tareas.length) return [];
  const res=await Promise.all(tareas); const seen={}, todos=[];
  res.flat().forEach(p=>{ if(!seen[p.id]){ seen[p.id]=1; todos.push(p); } });
  const pTokens=new Set(clave(name).split(" ").filter(x=>x.length>=4)), pDir=claveDir(street);
  // fuertes primero (misma dirección arriba), y solo los relevantes
  return todos.filter(p=>dupFuerte(pTokens,pDir,p)).sort((a,b)=>(_coincideDir(pDir,claveDir(b.street))?1:0)-(_coincideDir(pDir,claveDir(a.street))?1:0));
}

  const d=document.getElementById("drawer");

      <div class="dsub" style="color:#FBD5D2">Encontré ${dups.length} contacto(s) parecido(s). Revisá antes de crear un duplicado.</div></div>
    <div class="dbody">
      <div class="alert alto" style="margin-bottom:12px">Coincidencias por <b>nombre</b> o <b>dirección</b>. Si es el mismo lugar, <b>no lo crees de nuevo</b>: tocalo para abrirlo y trabajá ese.</div>
      ${dups.map(p=>`<div class="dupitem" onclick="abrir(${p.id})">
        <div class="cname">${esc(p.name)} ${p.active?'':'<span class="badge bad" style="font-size:10px">archivado</span>'}</div>

    </div>
    <div class="dfoot" style="display:flex;gap:8px">
      <button class="abtn" style="flex:1;background:#EEF1F0;color:var(--gris)" onclick="crearProspecto(${idx})">← Volver a los datos</button>
      <button class="abtn" style="flex:1;background:#FBE4E3;color:#B0322F" onclick="_forzarCrear=true;guardarProspecto(${idx})">No es el mismo · crear igual</button>
    </div>`;
}
let _forzarCrear=false;
async function guardarProspecto(idx){
  const btn=document.getElementById("btnNew"); if(!btn) return;
  const val=x=>{const el=document.getElementById(x);return el?el.value.trim():"";};
  const num=x=>{const v=val(x);return v?parseInt(v,10):false;};
  const name=val("np_name"); if(!name){ toast("⚠ Falta el nombre"); return; }
  // CAPA 2: antes de crear, buscar duplicados en Odoo (nombre + dirección). Si hay, avisar.
  if(!_forzarCrear){
    btn.disabled=true; btn.textContent="Buscando duplicados…";
    let dups=[]; try{ dups=await buscarDuplicados(name, val("np_city"), val("np_street")); }catch(e){}
    btn.disabled=false; btn.textContent="Crear contacto en Odoo";
    if(dups.length){ mostrarDuplicados(idx, dups); return; }
  }
  btn.disabled=true; btn.textContent="Creando…";
  const tieneVat=!!val("np_vat");
  const vals={ name, company_type:"company", city:val("np_city")?oracion(val("np_city")):false,
    state_id:num("np_state"), street:val("np_street")?oracion(val("np_street")):false, user_id:num("np_com"),
    phone:val("np_phone")?fmtTel(val("np_phone")):false, email:val("np_email")||false,
    vat:tieneVat?fmtDoc(val("np_vat"),IDT.cuit):false, l10n_latam_identification_type_id:tieneVat?IDT.cuit:false,
    l10n_ar_afip_responsibility_type_id:num("np_fiscal") };
  vals[RUBRO_FIELD]=val("np_rubro")||false;
  try{
    const newId=await rpc("res.partner","create",[vals],{context:{lang:"es_AR"}});
    // marca de "contacto nuevo" con el creador real (el create_uid de Odoo es el conector, no el usuario del Core)
    const quien=(PERFIL&&(PERFIL.nombre||PERFIL.email))||"—";
    try{ await rpc("res.partner","message_post",[[newId]],{body:"👤 "+NUEVO_TAG+" por="+quien,message_type:"comment"}); }catch(_){}
    CREADOS.add(idx); if(UNI&&UNI.est[idx]) UNI.est[idx][6]=newId; _forzarCrear=false;
    toast("✅ Contacto creado en Odoo");
    cerrar(); render(); cargarNuevos();
  }catch(e){ btn.disabled=false; btn.textContent="Crear contacto en Odoo"; toast("⚠ No se pudo crear: "+(e.message||e)); }
}

/* ================= Auto-refresco (la info se va actualizando en Odoo) =================
   Recarga silenciosa cada ~45s: no molesta si la pestaña está oculta, si hay un panel
   abierto o si estás escribiendo/eligiendo en un campo. Preserva el scroll y los filtros. */
function iniciarAutoRefresco(){
  setInterval(()=>{ if(document.hidden||drawerAbierto()||editando()||_cargando) return; if(Date.now()-_lastLoad<45000) return; cargar(true); }, 30000);
