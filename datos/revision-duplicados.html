<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisión de duplicados · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css?v=83">
<style>
  .rd{--ok:#1E7D46;--ok-bg:#E4F5E9;--mal:#B0322F;--mal-bg:#FBE4E3;--amb:#9A6B12;--amb-bg:#FBF0DA;--azul:#1E5FA8;--azul-bg:#E7F0FB}
  .rd .intro{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 18px;
    box-shadow:var(--shadow);margin-bottom:16px;font-size:13.5px;color:var(--gris);line-height:1.6}
  .rd .intro b{color:var(--ink)}
  .rd .intro ul{margin:9px 0 0;padding-left:20px} .rd .intro li{margin:3px 0}
  .rd .barra{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .rd .sel,.rd .btn{font:inherit;font-size:12.5px;font-weight:700;padding:7px 11px;border:1px solid var(--line);
    border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer}
  .rd .btn{font-weight:800;color:var(--teal-deep)} .rd .btn:hover{background:var(--agua)}
  .rd .sello{font-size:12px;color:var(--gris2);margin-left:auto}
  .rd .sello.ok{color:var(--ok);font-weight:700}

  .rd .avance{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 17px;
    box-shadow:var(--shadow);margin-bottom:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .rd .avance .n{font-size:30px;font-weight:900;color:var(--teal-deep);letter-spacing:-.8px;line-height:1}
  .rd .avance .n span{font-size:15px;color:var(--gris2)}
  .rd .avance .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--gris2);font-weight:800}
  .rd .avance .bar{flex:1;min-width:180px;height:10px;border-radius:6px;background:#EDF3F2;overflow:hidden}
  .rd .avance .bar i{display:block;height:100%;border-radius:6px;background:var(--teal);transition:width .4s}

  .rd h2{font-size:15px;font-weight:900;color:var(--ink);margin:26px 0 10px;padding-bottom:7px;
    border-bottom:2px solid var(--teal);display:flex;align-items:baseline;gap:10px}
  .rd h2 span{font-size:12px;color:var(--gris2);font-weight:700;margin-left:auto}

  .rd .caso{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);
    border-radius:13px;padding:13px 16px;margin-bottom:11px;box-shadow:var(--shadow)}
  .rd .caso.ojo{border-left-color:var(--mal)}
  .rd .caso.hecho{border-left-color:var(--ok);background:#FAFDFB}
  .rd .ch{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px;flex-wrap:wrap}
  .rd .ch .mot{font-weight:800;color:var(--teal-deep)}
  .rd .ch .otra{color:var(--amb);font-weight:700}
  .rd .ch .al{color:var(--mal);font-weight:800;margin-left:auto}
  .rd table{width:100%;border-collapse:collapse;font-size:13px}
  .rd th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris2);
    font-weight:800;border-bottom:1px solid var(--line);padding:4px 6px}
  .rd td{padding:7px 6px;border-bottom:1px solid #EEF3F2;vertical-align:top}
  .rd tr:last-child td{border-bottom:0}
  .rd tr.vacia td{color:var(--gris2)}
  .rd td.id{font-weight:900;color:var(--teal-deep);width:52px}
  .rd td.r,.rd th.r{text-align:right;font-variant-numeric:tabular-nums}
  .rd .fan{color:var(--teal);font-size:11px;font-weight:700}
  .rd .dir{color:var(--gris2);font-size:11px}

  .rd .dec{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);display:flex;gap:9px;
    flex-wrap:wrap;align-items:center}
  .rd .op{font:inherit;font-size:12.5px;font-weight:700;padding:7px 13px;border:1px solid var(--line);
    border-radius:9px;background:var(--surface);color:var(--gris);cursor:pointer;white-space:nowrap}
  .rd .op:hover{border-color:var(--teal)}
  .rd .op.on.misma{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
  .rd .op.on.distintas{background:var(--azul-bg);border-color:var(--azul);color:var(--azul)}
  .rd .op.on.preguntar{background:var(--amb-bg);border-color:var(--amb);color:var(--amb)}
  .rd .queda{font-size:12.5px;color:var(--gris);display:flex;align-items:center;gap:6px}
  .rd .queda select{font:inherit;font-size:12.5px;font-weight:700;padding:6px 9px;border:1px solid var(--line);
    border-radius:9px;background:var(--surface);color:var(--ink)}
  .rd .obs{flex:1;min-width:170px;font:inherit;font-size:12.5px;padding:7px 10px;border:1px solid var(--line);
    border-radius:9px;background:var(--surface);color:var(--ink)}
  .rd .quien{font-size:11px;color:var(--gris2);width:100%}
  .rd .vacio{padding:26px;text-align:center;color:var(--gris);font-size:13.5px}
  .rd .errbox{background:#FBE4E3;color:#8A2320;border-radius:12px;padding:14px 16px;font-size:13px;margin-bottom:14px}
  @media print{
    .rd .barra,.rd .op,.rd .obs,.rd .queda select{display:none}
    .rd .caso{break-inside:avoid;box-shadow:none}
  }
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spinner"></div>Buscando duplicados…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=110"></script>
<script>
/* ============================================================================
   REVISIÓN DE DUPLICADOS
   La pantalla para sentarse con las comerciales y resolver, caso por caso, si
   dos fichas son el mismo cliente o no. Cada decisión se guarda sola en Odoo
   (parámetro eyg.contactos.revision_dup), así que se puede cortar y seguir
   después, y se puede revisar entre varias personas sin pisarse.
   Lo que se marca acá NO toca las fichas: queda anotado para aplicarlo después.
   ============================================================================ */
const F=EYG.FANT, RUB=EYG.RUBRO_FIELD;
const KEY="eyg.contactos.revision_dup";
const esc=EYG.esc;
const dig=s=>(s||"").replace(/\D/g,"");
const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
const tail=s=>{ const d=dig(s); return d.length>=8?d.slice(-8):""; };
/* Un domicilio que dice "sin datos" no es un domicilio: agrupaba como duplicadas
   a cuatro fichas cuyo único parecido era no tener dirección cargada. Y sin número
   de puerta una calle tampoco identifica un lugar. */
const SIN_DOM=/^(sin ?datos?|s ?\/ ?d|no ?tiene|ninguno?|na|n ?\/ ?a|-+|\.+|x+)$/i;
const calle=s=>{
  const t=(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9 ]/g," ").replace(/\b(av|avda|avenida|bv|blvd|bvd|calle|nro|n|num)\b/g," ")
    .replace(/\s+/g," ").trim();
  if(SIN_DOM.test(t)) return "";
  if(!/\d/.test(t)) return "";
  return t;
};
const M=n=>"$"+Math.round(n||0).toLocaleString("es-AR");
const Mk=n=>{ n=n||0; if(Math.abs(n)>=1e6) return "$"+(n/1e6).toFixed(1).replace(".",",")+"M";
              if(Math.abs(n)>=1e3) return "$"+Math.round(n/1e3)+"k"; return "$"+Math.round(n); };

let PERFIL=null, GRUPOS=[], DOC={}, R={}, POR={}, ORDEN=[];
let filtro={com:"", estado:"pendientes"};
let _guardando=false, _pend=false;

/* ---------------- datos ---------------- */
async function cargar(){
  const P=await EYG.rpc("res.partner","search_read",[[["type","=","contact"],["parent_id","=",false],["active","=",true]]],
    {fields:["name",F,"vat","city","street","phone","mobile","user_id",RUB,"customer_rank","create_uid"],
     limit:0, context:{lang:"es_AR"}});
  let bov={}, nodup={};
  try{ bov=JSON.parse(await EYG.rpc("ir.config_parameter","get_param",["eyg.contactos.boveda"])||"{}")||{}; }catch(e){}
  try{ nodup=JSON.parse(await EYG.rpc("ir.config_parameter","get_param",["eyg.contactos.no_duplicados"])||"{}")||{}; }catch(e){}
  try{ R=JSON.parse(await EYG.rpc("ir.config_parameter","get_param",[KEY])||"{}")||{}; }catch(e){ R={}; }

  const basura=c=>/combo|super combo|^oferta|^promo|^tanda|^bloque|prueba|test\b|\(no usar\)/i.test(c.name||"");
  const base=P.filter(c=>!bov[c.id] && !basura(c));
  const ids=base.map(c=>c.id);
  const [gf,gp]=await Promise.all([
    EYG.rpc("account.move","read_group",[[["partner_id","in",ids],["move_type","in",["out_invoice","out_refund"]],["state","=","posted"]],["amount_total"],["partner_id"]],{lazy:false}),
    EYG.rpc("sale.order","read_group",[[["partner_id","in",ids]],["id"],["partner_id"]],{lazy:false}),
  ]);
  DOC={}; base.forEach(c=>DOC[c.id]={fac:0,monto:0,ped:0});
  gf.forEach(x=>{ const i=x.partner_id&&x.partner_id[0]; if(DOC[i]){ DOC[i].fac=x.__count||0; DOC[i].monto=x.amount_total||0; } });
  gp.forEach(x=>{ const i=x.partner_id&&x.partner_id[0]; if(DOC[i]) DOC[i].ped=x.__count||0; });

  const dupKey=a=>[...a].sort((x,y)=>x-y).join("-");
  const visto=new Set(Object.keys(nodup));
  GRUPOS=[];
  const juntar=(motivo,clave)=>{
    const m={}; base.forEach(c=>{ const k=clave(c); if(k) (m[k]=m[k]||[]).push(c); });
    Object.values(m).filter(a=>a.length>1).forEach(a=>{
      const u=[...new Map(a.map(x=>[x.id,x])).values()];
      if(u.length<2) return;
      const k=dupKey(u.map(c=>c.id)); if(visto.has(k)) return; visto.add(k);
      GRUPOS.push({key:k, motivo, items:u});
    });
  };
  juntar("Mismo CUIT", c=>dig(c.vat).length===11?dig(c.vat):"");
  const idxTel={}; base.forEach(c=>{ [tail(c.phone),tail(c.mobile)].filter(Boolean).forEach(t=>{ (idxTel[t]=idxTel[t]||[]).push(c); }); });
  base.filter(c=>c.create_uid&&c.create_uid[1]==="Public user").forEach(f=>{
    const t=tail(f.phone)||tail(f.mobile); if(!t) return;
    const otros=[...new Map((idxTel[t]||[]).filter(x=>x.id!==f.id).map(x=>[x.id,x])).values()];
    if(!otros.length) return;
    const k=dupKey([f.id,...otros.map(x=>x.id)]); if(visto.has(k)) return; visto.add(k);
    GRUPOS.push({key:k, motivo:"Ficha que creó sola la mensajería de WhatsApp", items:[f,...otros]});
  });
  juntar("Mismo domicilio y localidad", c=>{ const s=calle(c.street), ci=norm(c.city); return (s.length>5&&ci)? s+"@"+ci : ""; });
  juntar("Mismo teléfono", c=>tail(c.phone)||tail(c.mobile)||"");
  juntar("Mismo nombre", c=>{ const n=norm(c.name); return n.length>=4?n:""; });

  const comDe=c=>c.user_id?c.user_id[1]:"Sin comercial asignado";
  GRUPOS.forEach(g=>{
    g.items.sort((a,b)=>DOC[b.id].fac-DOC[a.id].fac);
    g.conFac=g.items.filter(c=>DOC[c.id].fac>0).length;
    g.plata=g.items.reduce((a,c)=>a+DOC[c.id].monto,0);
    g.quien=comDe(g.items[0]);
    g.otras=[...new Set(g.items.slice(1).map(comDe))].filter(x=>x!==g.quien);
  });
  POR={}; GRUPOS.forEach(g=>{ (POR[g.quien]=POR[g.quien]||[]).push(g); });
  ORDEN=Object.keys(POR).sort((a,b)=>{
    const SC="Sin comercial asignado";
    if(a===SC) return 1; if(b===SC) return -1;
    return POR[b].length-POR[a].length;
  });
  ORDEN.forEach(k=>POR[k].sort((a,b)=>(b.conFac-a.conFac)||(b.plata-a.plata)));
}

/* ---------------- guardar ---------------- */
async function guardar(){
  if(_guardando){ _pend=true; return; }
  _guardando=true; sello("guardando…");
  try{
    await EYG.rpc("ir.config_parameter","set_param",[KEY, JSON.stringify(R)]);
    sello("guardado ✓", true);
  }catch(e){ sello("no se pudo guardar: "+(e.message||e)); }
  finally{
    _guardando=false;
    if(_pend){ _pend=false; setTimeout(guardar,300); }
  }
}
function sello(t,ok){ const s=document.getElementById("rdSello"); if(s){ s.textContent=t; s.className="sello"+(ok?" ok":""); } }

/* ---------------- interacción ---------------- */
window.marcar=(key,valor)=>{
  const g=GRUPOS.find(x=>x.key===key); if(!g) return;
  const r=R[key]=R[key]||{};
  r.decision = (r.decision===valor) ? "" : valor;
  if(r.decision!=="misma") delete r.queda;
  if(r.decision==="misma" && !r.queda) r.queda=g.items[0].id;
  r.por=(PERFIL.nombre||PERFIL.email); r.fecha=new Date().toISOString();
  if(!r.decision) delete R[key];
  guardar(); render();
};
window.setQueda=(key,id)=>{ const r=R[key]; if(!r) return; r.queda=+id; r.fecha=new Date().toISOString(); guardar(); };
window.setObs=(key,txt)=>{
  const r=R[key]=R[key]||{};
  r.obs=txt; r.por=(PERFIL.nombre||PERFIL.email); r.fecha=new Date().toISOString();
  if(!r.decision && !txt) delete R[key];
  clearTimeout(window._obsT); window._obsT=setTimeout(guardar, 700);
};
window.setCom=v=>{ filtro.com=v; render(); };
window.setEstado=v=>{ filtro.estado=v; render(); };

/* ---------------- dibujo ---------------- */
function visibles(com){
  return (POR[com]||[]).filter(g=>{
    const r=R[g.key];
    if(filtro.estado==="pendientes") return !r||!r.decision;
    if(filtro.estado==="resueltos")  return !!(r&&r.decision);
    if(filtro.estado==="preguntar")  return !!(r&&r.decision==="preguntar");
    return true;
  });
}
function caso(g){
  const r=R[g.key]||{};
  const ETQ={misma:"Es la misma",distintas:"Son distintas",preguntar:"Preguntar"};
  return `<div class="caso ${g.conFac>1?"ojo":""} ${r.decision?"hecho":""}">
    <div class="ch">
      <span class="mot">${esc(g.motivo)}</span>
      ${g.otras.length?`<span class="otra">también la lleva ${esc(g.otras.join(" y "))}</span>`:""}
      ${g.conFac>1?`<span class="al">facturación en ${g.conFac} fichas</span>`:""}
    </div>
    <table>
      <tr><th>N°</th><th>Nombre en el sistema</th><th>CUIT</th><th>Localidad y domicilio</th>
          <th class="r">Facturas</th><th class="r">Facturado</th><th>Comercial</th></tr>
      ${g.items.map(c=>`<tr class="${DOC[c.id].fac?"":"vacia"}">
        <td class="id">${c.id}</td>
        <td><b>${esc(c.name)}</b>${(typeof c[F]==="string"&&c[F])?`<br><span class="fan">${esc(c[F])}</span>`:""}</td>
        <td>${esc(c.vat||"—")}</td>
        <td>${esc(c.city||"—")}<br><span class="dir">${esc(c.street||"—")}</span></td>
        <td class="r">${DOC[c.id].fac||"—"}</td>
        <td class="r">${DOC[c.id].fac?Mk(DOC[c.id].monto):"—"}</td>
        <td>${esc(c.user_id?c.user_id[1].split(" ")[0]:"—")}</td></tr>`).join("")}
    </table>
    <div class="dec">
      ${["misma","distintas","preguntar"].map(v=>
        `<button class="op ${v} ${r.decision===v?"on":""}" onclick="marcar('${g.key}','${v}')">${ETQ[v]}</button>`).join("")}
      ${r.decision==="misma"?`<span class="queda">queda la
        <select onchange="setQueda('${g.key}',this.value)">
          ${g.items.map(c=>`<option value="${c.id}" ${(+r.queda===c.id)?"selected":""}>N° ${c.id} — ${esc(String(c.name).slice(0,34))}</option>`).join("")}
        </select></span>`:""}
      <input class="obs" placeholder="Observación (opcional)" value="${esc(r.obs||"")}"
             oninput="setObs('${g.key}',this.value)">
      ${r.por?`<div class="quien">lo marcó ${esc(r.por)} · ${esc(String(r.fecha||"").slice(0,10))}</div>`:""}
    </div>
  </div>`;
}

function render(){
  const total=GRUPOS.length;
  const hechos=GRUPOS.filter(g=>R[g.key]&&R[g.key].decision).length;
  const preg=GRUPOS.filter(g=>R[g.key]&&R[g.key].decision==="preguntar").length;
  const pct=total?Math.round(hechos/total*100):0;
  const main=`
  <div class="rd">
    <div class="intro">
      <b>Qué es esto.</b> Son fichas de clientes que parecen estar cargadas dos o más veces. El sistema las detectó
      porque comparten el CUIT, el teléfono, el domicilio o el nombre.
      <ul>
        <li><b>En cada caso hay que decidir una sola cosa:</b> si son el mismo cliente o si son dos clientes distintos.</li>
        <li>Si son el mismo, marcá <b>Es la misma</b> y elegí con cuál ficha quedarse. Al unificarlas no se pierde ninguna factura.</li>
        <li>Si son distintos — pasa con hermanos, con padre e hija o con dos locales del mismo apellido — marcá <b>Son distintas</b>.</li>
        <li>Si no estás segura, marcá <b>Preguntar</b> y seguí. Después se ven juntas.</li>
        <li>Los casos con el borde rojo tienen <b>facturación en más de una ficha</b>: ahí la cuenta corriente del cliente
            está partida, así que son los más importantes.</li>
      </ul>
      <div style="margin-top:9px;color:var(--teal-deep);font-weight:700">
        Lo que marcás se guarda solo. Podés cortar y seguir después, y nada se toca hasta que se aplique.</div>
    </div>

    <div class="avance">
      <div><div class="l">Revisados</div><div class="n">${hechos} <span>de ${total}</span></div></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div><div class="l">Para preguntar</div><div class="n">${preg}</div></div>
      <div><div class="l">Facturación partida</div><div class="n">${GRUPOS.filter(g=>g.conFac>1).length}</div></div>
    </div>

    <div class="barra">
      <select class="sel" onchange="setCom(this.value)">
        <option value="">Todas las comerciales</option>
        ${ORDEN.map(c=>`<option value="${esc(c)}" ${c===filtro.com?"selected":""}>${esc(c)} (${(POR[c]||[]).length})</option>`).join("")}
      </select>
      <select class="sel" onchange="setEstado(this.value)">
        <option value="pendientes" ${filtro.estado==="pendientes"?"selected":""}>Lo que falta revisar</option>
        <option value="resueltos"  ${filtro.estado==="resueltos"?"selected":""}>Lo ya revisado</option>
        <option value="preguntar"  ${filtro.estado==="preguntar"?"selected":""}>Lo marcado para preguntar</option>
        <option value="todos"      ${filtro.estado==="todos"?"selected":""}>Todo</option>
      </select>
      <button class="btn" onclick="window.print()">🖨️ Imprimir</button>
      <span class="sello" id="rdSello">se guarda solo</span>
    </div>

    ${ORDEN.filter(c=>!filtro.com||c===filtro.com).map(com=>{
      const gs=visibles(com); if(!gs.length) return "";
      const f=gs.filter(g=>g.conFac>1).length;
      return `<h2>${esc(com)}<span>${gs.length} caso${gs.length===1?"":"s"}${f?" · "+f+" con facturación partida":""}</span></h2>`
        + gs.map(caso).join("");
    }).join("") || `<div class="vacio">No queda nada con ese filtro. 🎉</div>`}
  </div>`;
  document.getElementById("app").innerHTML=main;
}

/* ---------------- arranque ---------------- */
EYG.guard(["lider","direccion","admin"]).then(async perfil=>{
  PERFIL=perfil;
  document.body.innerHTML = EYG.layout(perfil, "contactos",
    `<div id="app"><div class="loading"><div class="spinner"></div>Buscando duplicados…</div></div>`,
    "Revisión de duplicados");
  try{ await cargar(); render(); }
  catch(e){
    document.getElementById("app").innerHTML =
      `<div class="rd"><div class="errbox"><b>No pude cargar los duplicados.</b><br>${esc(e.message||e)}</div></div>`;
  }
});
</script>
</body>
</html>
