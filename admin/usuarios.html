<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios y accesos · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=37"></script>
<style>
  :root{ --teal:#048782; --teal-deep:#04635F; --aqua:#5FC8BF; --ink:#0E1F1D; --gris:#5F716E; --gris2:#8A9A97; --bg:#F4F8F7; --line:#DCE8E6; --surface:#fff; --ok:#1E7D46; --okbg:#E7F6EC; --bad:#B0322F; --badbg:#FBE2E1; --warn:#9A6A0B; --warnbg:#FBF0D6; --shadow:0 1px 2px rgba(6,65,62,.05),0 8px 30px rgba(6,65,62,.07); }
  .uhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .uhead h2{font-size:20px;font-weight:800;letter-spacing:-.3px;margin:0}
  .uhead .sub{color:var(--gris);font-size:13.5px;margin-top:2px}
  .btn-teal{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:7px}
  .btn-teal:hover{filter:brightness(1.07)} .btn-teal:disabled{opacity:.55;cursor:default}
  .spacer{margin-left:auto}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead th{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--gris);font-weight:700;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.5px}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fafcfb}
  .uname{font-weight:700;font-size:14px;color:var(--ink)}
  .uemail{font-size:12px;color:var(--gris2)}
  .rolchip{display:inline-block;font-size:11px;font-weight:800;color:var(--teal-deep);background:#E2F1EF;border-radius:20px;padding:3px 10px;white-space:nowrap}
  .rolchip.adm{color:#7a3ea3;background:#f0e6f7}
  .estchip{font-size:11px;font-weight:800;border-radius:20px;padding:3px 10px;white-space:nowrap}
  .estchip.on{color:var(--ok);background:var(--okbg)} .estchip.off{color:var(--bad);background:var(--badbg)}
  .permresumen{font-size:11.5px;color:var(--gris);margin-top:3px}
  .permresumen b{color:var(--ink)}
  .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .btn-mini{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--teal-deep);cursor:pointer;font-family:inherit;white-space:nowrap}
  .btn-mini:hover{border-color:var(--teal)}
  .btn-mini.danger{color:var(--bad)} .btn-mini.warn{color:var(--warn)}
  .uload,.uerr{padding:34px;text-align:center;color:var(--gris)}
  .uerr{color:var(--bad)}
  /* Drawer */
  .scrim{position:fixed;inset:0;background:rgba(8,30,28,.42);z-index:60;display:flex;justify-content:flex-end}
  .drawer{width:min(560px,100%);background:var(--bg);height:100%;overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.2);animation:slidein .22s ease}
  @keyframes slidein{from{transform:translateX(30px);opacity:.4}to{transform:translateX(0);opacity:1}}
  .dwhead{position:sticky;top:0;background:var(--teal-deep);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:10px;z-index:2}
  .dwhead h3{margin:0;font-size:16px;font-weight:800}
  .dwhead .x{margin-left:auto;background:rgba(255,255,255,.16);border:0;color:#fff;width:30px;height:30px;border-radius:8px;font-size:17px;cursor:pointer}
  .dwbody{padding:18px 20px 90px}
  .fld{margin-bottom:15px}
  .fld label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--gris);margin-bottom:6px}
  .fld input,.fld select{width:100%;box-sizing:border-box;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;font-family:inherit;background:#fff;outline:none}
  .fld input:focus,.fld select:focus{border-color:var(--teal)}
  .fld .hint{font-size:11.5px;color:var(--gris2);margin-top:5px;line-height:1.4}
  .row2{display:flex;gap:12px} .row2 .fld{flex:1}
  .toggle{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;font-size:14px;font-weight:600}
  .toggle input{width:18px;height:18px;accent-color:var(--teal)}
  .genpwd{display:flex;gap:8px} .genpwd input{flex:1}
  .genbtn{background:#eef5f4;border:1px solid var(--line);border-radius:9px;padding:0 13px;font-weight:700;font-size:12.5px;color:var(--teal-deep);cursor:pointer;font-family:inherit;white-space:nowrap}
  .permbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 4px;margin-top:6px}
  .permdept{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--teal-deep);padding:10px 12px 4px}
  .permrow{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:9px}
  .permrow:hover{background:#f4faf9}
  .permrow input{width:17px;height:17px;accent-color:var(--teal);flex:none}
  .permrow .pm{flex:1;font-size:13.5px;font-weight:600;color:var(--ink)}
  .permrow .pt{font-size:10.5px;font-weight:800;border-radius:20px;padding:2px 8px;white-space:nowrap}
  .pt.rol{background:#E2F1EF;color:var(--teal-deep)} .pt.extra{background:#FBF0D6;color:var(--warn)} .pt.quita{background:var(--badbg);color:var(--bad)}
  .savebar{position:fixed;bottom:0;right:0;width:min(560px,100%);background:#fff;border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;box-shadow:0 -6px 24px rgba(0,0,0,.07)}
  .savebar .btn-teal{flex:1;justify-content:center}
  .btn-plain{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 18px;font-family:inherit;font-size:14px;font-weight:700;color:var(--gris);cursor:pointer}
  .dwmsg{font-size:13px;border-radius:10px;padding:10px 12px;margin-bottom:14px;line-height:1.4;display:none}
  .dwmsg.err{display:block;background:var(--badbg);color:var(--bad)} .dwmsg.ok{display:block;background:var(--okbg);color:var(--ok)}
  .pwdshow{background:#ECF7F5;border:1px dashed var(--teal);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--ink);line-height:1.5}
  .pwdshow code{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:800;color:var(--teal-deep);background:#fff;padding:2px 8px;border-radius:6px;border:1px solid var(--line)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 22px;border-radius:30px;font-weight:600;font-size:14px;opacity:0;transition:.3s;z-index:120;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:640px){ .hide-sm{display:none} }
</style>
</head>
<body>
<script>
/* ===== EyG Core · Usuarios y accesos (Sistema) ============================
   Solo admin. ABM contra la edge function admin-usuarios (service_role) +
   reset de contraseña por mail (supabase.auth.resetPasswordForEmail, SMTP de
   Supabase). Permisos POR PERSONA: modulos_extra / modulos_quita sobre el rol.
========================================================================== */
window.UI = (function(){
  const esc = EYG.esc;
  const SUPABASE_URL  = "https://yxotopoklgjowcudveoj.supabase.co";
  const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4b3RvcG9rbGdqb3djdWR2ZW9qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0OTE3OTAsImV4cCI6MjEwMDA2Nzc5MH0.39DqIenUuRZovmgG89R_JgHco4Lg6OvmP9AgF1Hd7rQ";
  const FN = SUPABASE_URL + "/functions/v1/admin-usuarios";

  const ROLES = [
    {v:"comercial",  t:"Comercial"},
    {v:"lider",      t:"Líder comercial"},
    {v:"finanzas",   t:"Administración / Finanzas"},
    {v:"cobranzas",  t:"Cobranzas"},
    {v:"inventario", t:"Inventario / Compras / Depósito"},
    {v:"maestro",    t:"Maestro de datos"},
    {v:"direccion",  t:"Dirección"},
    {v:"admin",      t:"Administrador (Sistema)"},
  ];
  const ROLT = Object.fromEntries(ROLES.map(r=>[r.v,r.t]));

  let P=null, USERS=[], ST={mode:null, user:null, checked:null};

  /* Módulos sobre los que tiene sentido asignar permisos: publicados y no en pruebas. */
  /* Todas las herramientas reales (publicadas), incluidas las "en pruebas":
     un permiso puntual por persona habilita incluso un módulo en pruebas. */
  function modsEditables(){ return EYG.MODULOS.filter(m=>m.ready); }
  function baseRol(rol, key){
    const m = EYG.MODULOS.find(x=>x.key===key); if(!m) return false;
    return rol==="admin" || rol==="direccion" || m.roles.includes(rol);
  }
  function efectivo(u, key){
    const base = baseRol(u.rol, key);
    return base ? !(u.modulos_quita||[]).includes(key) : (u.modulos_extra||[]).includes(key);
  }

  async function api(action, payload){
    const s = await EYG.session();
    const r = await fetch(FN, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "apikey":ANON, "Authorization":"Bearer "+((s&&s.access_token)||"") },
      body: JSON.stringify(Object.assign({action}, payload||{})),
    });
    let j; try{ j = await r.json(); }catch(e){ j = {error:"respuesta inválida del servidor"}; }
    if(!r.ok || (j && j.error)) throw new Error((j&&j.error)||("HTTP "+r.status));
    return j;
  }

  function shell(){ return `<div id="uwrap"><div class="uload">Cargando usuarios…</div></div><div id="drawer"></div><div class="toast" id="toast"></div>`; }

  async function init(perfil){ P=perfil; await recargar(); }

  async function recargar(){
    const w=document.getElementById("uwrap");
    try{ const {users}=await api("list"); USERS=users||[]; render(); }
    catch(e){ if(w) w.innerHTML=`<div class="uerr">No pude cargar los usuarios.<br><span style="font-size:12.5px">${esc(e.message)}</span></div>`; }
  }

  function resumenPerms(u){
    const ex=(u.modulos_extra||[]).length, qu=(u.modulos_quita||[]).length;
    if(u.rol==="admin") return "Ve todo el sistema";
    const p=[]; if(ex) p.push(`+${ex} extra`); if(qu) p.push(`−${qu} quitado`);
    return p.length ? ("Según su rol · "+p.join(" · ")) : "Según su rol";
  }

  function render(){
    const w=document.getElementById("uwrap"); if(!w) return;
    const filas = USERS.map(u=>{
      const adm = u.rol==="admin";
      return `<tr>
        <td>
          <div class="uname">${esc(u.nombre||"—")}${u.debe_cambiar_pwd?' <span title="Todavía no cambió su contraseña inicial" style="font-size:11px;color:var(--warn);font-weight:700">· clave inicial</span>':''}</div>
          <div class="uemail">${esc(u.email)}</div>
          <div class="permresumen">${esc(resumenPerms(u))}</div>
        </td>
        <td class="hide-sm"><span class="rolchip ${adm?'adm':''}">${esc(ROLT[u.rol]||u.rol)}</span></td>
        <td><span class="estchip ${u.activo?'on':'off'}">${u.activo?'Activo':'Inactivo'}</span></td>
        <td>
          <div class="acts">
            <button class="btn-mini" onclick="UI.editar('${esc(u.email)}')">Editar</button>
            <button class="btn-mini warn" onclick="UI.reset('${esc(u.email)}')">Restablecer clave</button>
            <button class="btn-mini ${u.activo?'danger':''}" onclick="UI.toggleActivo('${esc(u.email)}')">${u.activo?'Desactivar':'Activar'}</button>
          </div>
        </td>
      </tr>`;
    }).join("");
    w.innerHTML = `
      <div class="uhead">
        <div>
          <h2>Usuarios y accesos</h2>
          <div class="sub">${USERS.length} usuario${USERS.length===1?'':'s'} · alta de personal, roles y permisos por persona</div>
        </div>
        <div class="spacer"></div>
        <button class="btn-teal" onclick="UI.nuevo()">＋ Nuevo usuario</button>
      </div>
      <div class="card">
        <table>
          <thead><tr><th>Persona</th><th class="hide-sm">Rol</th><th>Estado</th><th style="text-align:right">Acciones</th></tr></thead>
          <tbody>${filas || `<tr><td colspan="4" class="uload">Todavía no hay usuarios cargados.</td></tr>`}</tbody>
        </table>
      </div>`;
  }

  /* ---------- Toast ---------- */
  let _tt=null;
  function toast(t){ const el=document.getElementById("toast"); if(!el) return; el.textContent=t; el.classList.add("on"); clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove("on"),3200); }

  /* ---------- Drawer: nuevo ---------- */
  function genpwd(){ const c="abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<10;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }

  function nuevo(){
    ST={mode:"nuevo"};
    const d=document.getElementById("drawer");
    d.innerHTML = `<div class="scrim" onclick="UI.cerrarSiFondo(event)"><div class="drawer">
      <div class="dwhead"><h3>Nuevo usuario</h3><button class="x" onclick="UI.cerrar()">✕</button></div>
      <div class="dwbody">
        <div class="dwmsg" id="dwmsg"></div>
        <div class="fld"><label>Email</label><input id="f-email" type="email" placeholder="nombre@drogueriaeyg.com.ar" autocomplete="off">
          <div class="hint">Es el usuario para entrar. Tiene que ser el email exacto (minúsculas).</div></div>
        <div class="fld"><label>Nombre y apellido</label><input id="f-nombre" type="text" placeholder="Ej: Juan Pérez"></div>
        <div class="fld"><label>Rol</label><select id="f-rol">${ROLES.map(r=>`<option value="${r.v}">${esc(r.t)}</option>`).join("")}</select>
          <div class="hint">El rol define qué módulos ve. Después podés ajustar permisos puntuales con "Editar".</div></div>
        <div class="fld"><label>Nombre en Odoo (solo comerciales)</label><input id="f-ref" type="text" placeholder="Su nombre exacto de vendedor en Odoo">
          <div class="hint">Solo para el rol Comercial: enlaza su panel con sus ventas. Dejalo vacío si no aplica.</div></div>
        <div class="fld"><label>Contraseña inicial</label>
          <div class="genpwd"><input id="f-pwd" type="text" value="${esc(genpwd())}"><button class="genbtn" type="button" onclick="document.getElementById('f-pwd').value=UI.genpwd()">↻ Otra</button></div>
          <div class="hint">Se la pasás a la persona. Al entrar por primera vez, el sistema la obliga a crear su propia contraseña.</div></div>
      </div>
      <div class="savebar"><button class="btn-plain" onclick="UI.cerrar()">Cancelar</button><button class="btn-teal" id="f-save" onclick="UI.guardarNuevo()">Crear usuario</button></div>
    </div></div>`;
    setTimeout(()=>{ const e=document.getElementById("f-email"); if(e) e.focus(); },50);
  }

  async function guardarNuevo(){
    const email=(val("f-email")||"").trim().toLowerCase();
    const nombre=val("f-nombre").trim(), rol=val("f-rol"), ref=val("f-ref").trim(), pwd=val("f-pwd");
    if(!email || !email.includes("@")) return dwmsg("Poné un email válido.");
    if(pwd.length<8) return dwmsg("La contraseña inicial tiene que tener al menos 8 caracteres.");
    const b=document.getElementById("f-save"); b.disabled=true; b.textContent="Creando…";
    try{
      await api("create",{email, nombre, rol, comercial_ref:ref||null, password:pwd});
      cerrar(); await recargar();
      mostrarClave(email, pwd, "Usuario creado");
    }catch(e){
      b.disabled=false; b.textContent="Crear usuario";
      dwmsg(e.message==="ya-existe" ? "Ya existe un usuario con ese email." : ("No se pudo crear: "+e.message));
    }
  }

  /* Modal simple para mostrar la clave inicial una vez. */
  function mostrarClave(email, pwd, titulo){
    const d=document.getElementById("drawer");
    d.innerHTML = `<div class="scrim" onclick="UI.cerrarSiFondo(event)"><div class="drawer">
      <div class="dwhead"><h3>${esc(titulo)}</h3><button class="x" onclick="UI.cerrar()">✕</button></div>
      <div class="dwbody">
        <div class="pwdshow">Pasale estos datos a la persona:<br><br>
          <b>Email:</b> ${esc(email)}<br>
          <b>Contraseña inicial:</b> <code>${esc(pwd)}</code><br><br>
          Al entrar por primera vez, el sistema le va a pedir que cree su propia contraseña.</div>
        <button class="btn-teal" style="width:100%;justify-content:center" onclick="UI.copiar('${esc(pwd)}')">📋 Copiar contraseña</button>
      </div>
    </div></div>`;
  }
  function copiar(t){ try{ navigator.clipboard.writeText(t); toast("Contraseña copiada"); }catch(e){ toast("Copiala a mano: "+t); } }

  /* ---------- Drawer: editar ---------- */
  function editar(email){
    const u=USERS.find(x=>x.email===email); if(!u) return;
    ST={mode:"editar", user:u, checked:new Set(modsEditables().filter(m=>efectivo(u,m.key)).map(m=>m.key))};
    pintarEditar();
  }
  function pintarEditar(){
    const u=ST.user, d=document.getElementById("drawer");
    d.innerHTML = `<div class="scrim" onclick="UI.cerrarSiFondo(event)"><div class="drawer">
      <div class="dwhead"><h3>${esc(u.nombre||u.email)}</h3><button class="x" onclick="UI.cerrar()">✕</button></div>
      <div class="dwbody">
        <div class="dwmsg" id="dwmsg"></div>
        <div class="fld"><label>Email</label><input type="email" value="${esc(u.email)}" disabled style="opacity:.7;background:#f0f4f3">
          <div class="hint">El email no se cambia (es la llave de la cuenta).</div></div>
        <div class="row2">
          <div class="fld"><label>Nombre</label><input id="e-nombre" type="text" value="${esc(u.nombre||'')}"></div>
        </div>
        <div class="fld"><label>Rol</label><select id="e-rol" onchange="UI.rolCambio()">${ROLES.map(r=>`<option value="${r.v}" ${r.v===u.rol?'selected':''}>${esc(r.t)}</option>`).join("")}</select></div>
        <div class="fld"><label>Nombre en Odoo (solo comerciales)</label><input id="e-ref" type="text" value="${esc(u.comercial_ref||'')}" placeholder="Su nombre de vendedor en Odoo"></div>
        <div class="fld"><label>Estado</label>
          <label class="toggle"><input id="e-activo" type="checkbox" ${u.activo?'checked':''}> Usuario activo (puede entrar)</label></div>
        <div class="fld"><label>Permisos · qué módulos ve</label>
          <div class="hint" style="margin:0 0 8px">Tildá los módulos que puede ver. El chip indica si viene por su rol o es un permiso puntual. Los cambios se calculan respecto del rol elegido.</div>
          <div class="permbox" id="permbox">${permHTML()}</div>
        </div>
      </div>
      <div class="savebar"><button class="btn-plain" onclick="UI.cerrar()">Cancelar</button><button class="btn-teal" id="e-save" onclick="UI.guardarEdit()">Guardar cambios</button></div>
    </div></div>`;
  }
  function permHTML(){
    const rol = ST.user ? (document.getElementById("e-rol")?document.getElementById("e-rol").value:ST.user.rol) : "comercial";
    const mods = modsEditables();
    let html="";
    for(const dep of EYG.DEPTS){
      const dm = mods.filter(m=>m.dept===dep.key); if(!dm.length) continue;
      html += `<div class="permdept">${esc(dep.nom)}</div>`;
      for(const m of dm){
        const on = ST.checked.has(m.key);
        const base = baseRol(rol, m.key);
        let tag = base ? `<span class="pt rol">por rol</span>` : `<span class="pt" style="color:var(--gris2)">no incluido</span>`;
        if(base && !on)  tag = `<span class="pt quita">quitado</span>`;
        if(!base && on)  tag = `<span class="pt extra">extra</span>`;
        const tit = esc(EYG.T(m.titulo, {rol}));
        const enPruebas = (m.pruebas && m.pruebas.length) ? ` <span style="font-size:10px;color:var(--warn);font-weight:800">· en pruebas</span>` : "";
        html += `<label class="permrow"><input type="checkbox" ${on?'checked':''} onchange="UI.togglePerm('${m.key}',this.checked)"><span class="pm">${m.ico?m.ico+' ':''}${tit}${enPruebas}</span>${tag}</label>`;
      }
    }
    return html || `<div class="hint" style="padding:12px">No hay módulos configurables.</div>`;
  }
  function togglePerm(key, on){ if(on) ST.checked.add(key); else ST.checked.delete(key); const pb=document.getElementById("permbox"); if(pb) pb.innerHTML=permHTML(); }
  function rolCambio(){ const pb=document.getElementById("permbox"); if(pb) pb.innerHTML=permHTML(); }

  async function guardarEdit(){
    const u=ST.user;
    const nombre=val("e-nombre").trim(), rol=val("e-rol"), ref=val("e-ref").trim();
    const activo=document.getElementById("e-activo").checked;
    const extra=[], quita=[];
    for(const m of modsEditables()){
      const base=baseRol(rol,m.key), on=ST.checked.has(m.key);
      if(base && !on) quita.push(m.key);
      if(!base && on) extra.push(m.key);
    }
    const b=document.getElementById("e-save"); b.disabled=true; b.textContent="Guardando…";
    try{
      await api("update",{email:u.email, nombre, rol, comercial_ref:ref||null, activo, modulos_extra:extra, modulos_quita:quita});
      cerrar(); await recargar(); toast("Cambios guardados");
    }catch(e){ b.disabled=false; b.textContent="Guardar cambios"; dwmsg("No se pudo guardar: "+e.message); }
  }

  /* ---------- Reset de contraseña por mail ---------- */
  async function reset(email){
    if(!confirm("¿Enviar un mail de restablecimiento de contraseña a "+email+"?\n\nLa persona va a recibir un enlace para crear una contraseña nueva.")) return;
    try{
      const {error}=await EYG.supa().auth.resetPasswordForEmail(email, {redirectTo: EYG.BASE+"recuperar.html"});
      if(error) throw error;
      toast("Mail de restablecimiento enviado a "+email);
    }catch(e){ toast("No se pudo enviar: "+e.message); }
  }

  /* ---------- Activar / desactivar ---------- */
  async function toggleActivo(email){
    const u=USERS.find(x=>x.email===email); if(!u) return;
    const nuevo=!u.activo;
    if(!nuevo && !confirm("¿Desactivar a "+ (u.nombre||email) +"?\n\nNo va a poder entrar al Core hasta que lo reactives. (No se borra nada.)")) return;
    try{ await api("update",{email, activo:nuevo}); await recargar(); toast(nuevo?"Usuario activado":"Usuario desactivado"); }
    catch(e){ toast("No se pudo: "+e.message); }
  }

  /* ---------- helpers drawer ---------- */
  function val(id){ const e=document.getElementById(id); return e?e.value:""; }
  function dwmsg(t, ok){ const m=document.getElementById("dwmsg"); if(!m) return; m.textContent=t; m.className="dwmsg "+(ok?"ok":"err"); }
  function cerrar(){ const d=document.getElementById("drawer"); if(d) d.innerHTML=""; ST={mode:null}; }
  function cerrarSiFondo(ev){ if(ev.target.classList.contains("scrim")) cerrar(); }

  return { init, shell, nuevo, guardarNuevo, editar, guardarEdit, reset, toggleActivo, togglePerm, rolCambio, cerrar, cerrarSiFondo, copiar, genpwd, mostrarClave };
})();

EYG.requireAuth(["admin"], perfil=>{
  document.body.innerHTML = EYG.layout(perfil, "usuarios", UI.shell(), "Usuarios y accesos");
  UI.init(perfil);
});
</script>
