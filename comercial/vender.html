<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cargar venta · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=13"></script>
<style>
  :root{
    --teal:#048782; --teal-deep:#04635F; --teal-med:#0AA89F; --aqua:#5FC8BF; --agua:#E2F1EF;
    --ink:#0E1F1D; --gris:#5F716E; --gris2:#8A9A97; --surface:#fff; --bg:#F4F8F7; --line:#DCE8E6;
    --radius:16px; --gold:#E5A93B; --ok:#1E7D46; --okbg:#E7F6EC; --bad:#B0322F; --badbg:#FBE2E1;
    --shadow:0 1px 2px rgba(6,65,62,.05), 0 8px 30px rgba(6,65,62,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  /* ---- topbar ---- */
  .topbar{background:var(--teal-deep);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40}
  .mono{font-family:Georgia,serif;font-weight:700;font-size:22px;letter-spacing:.5px;line-height:1}
  .mono .y{color:var(--aqua)}
  .topbar .tag{font-weight:700;font-size:10px;letter-spacing:2px;text-transform:uppercase;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:20px}
  .topbar .back{color:#fff;text-decoration:none;font-size:13px;font-weight:600;opacity:.9;background:rgba(255,255,255,.1);padding:7px 12px;border-radius:10px}
  .topbar .who{margin-left:auto;text-align:right;font-size:12px;line-height:1.2}
  .topbar .who b{display:block;font-size:14px}
  .topbar .who span{color:var(--aqua)}
  .wrap{max-width:1280px;margin:0 auto;padding:18px 18px 40px}

  /* ---- botones grandes (tablet) ---- */
  .btn{font-family:inherit;font-weight:700;border:0;border-radius:12px;cursor:pointer;font-size:15px;padding:13px 20px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
  .btn:active{transform:scale(.98)}
  .btn.teal{background:var(--teal);color:#fff;box-shadow:var(--shadow)}
  .btn.teal:hover{filter:brightness(1.07)}
  .btn.deep{background:var(--teal-deep);color:#fff}
  .btn.ghost{background:var(--surface);color:var(--teal-deep);border:1.5px solid var(--line)}
  .btn.big{font-size:17px;padding:16px 26px;border-radius:14px}
  .btn.grn{background:var(--ok);color:#fff}
  .btn.red{background:#fff;color:var(--bad);border:1.5px solid #f0c4c2}
  .btn:disabled{opacity:.55;cursor:default}

  .loading,.empty{text-align:center;padding:60px 20px;color:var(--gris)}
  .spinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .errbox{background:#FBE4E3;border:1px solid #F3B5B2;color:#8A2E2B;padding:16px;border-radius:12px}

  /* ===== INICIO ===== */
  .hero{margin-bottom:16px}
  .hero h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
  .hero p{color:var(--gris);font-size:14px;margin-top:3px}
  .sect-t{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--gris);margin:22px 2px 10px}
  .draft-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .draft{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;transition:.12s}
  .draft:hover{border-color:var(--teal-med);transform:translateY(-1px)}
  .draft .n{font-size:11px;color:var(--gris2);font-weight:700;letter-spacing:.5px}
  .draft .cli{font-size:16px;font-weight:800;line-height:1.2}
  .draft .meta{font-size:12.5px;color:var(--gris);margin-top:2px}
  .draft .tot{font-size:19px;font-weight:800;color:var(--teal-deep);margin-top:6px}
  .draft .re{margin-top:9px;font-size:12.5px;font-weight:800;color:var(--teal)}

  /* ===== selector de cliente ===== */
  .picker{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;max-width:640px;margin:0 auto}
  .picker .search{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .picker .search input{border:0;outline:none;font-family:inherit;font-size:17px;width:100%;background:none}
  .picker .list{max-height:60vh;overflow:auto}
  .clirow{padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;align-items:center;gap:12px}
  .clirow:hover{background:var(--agua)}
  .clirow:last-child{border-bottom:0}
  .clirow .av{width:40px;height:40px;border-radius:10px;background:var(--agua);color:var(--teal-deep);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
  .clirow .nm{font-weight:700;font-size:15.5px;line-height:1.2}
  .clirow .sub{font-size:12px;color:var(--gris);margin-top:2px}

  /* ===== VENTA (catálogo + carrito) ===== */
  .sale{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
  .clihdr{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .clihdr .who2{flex:1;min-width:180px}
  .clihdr .who2 .nm{font-size:18px;font-weight:800;line-height:1.15}
  .clihdr .who2 .badges{margin-top:5px;display:flex;gap:7px;flex-wrap:wrap}
  .bdg{font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 10px;background:var(--agua);color:var(--teal-deep)}
  .bdg.plazo{background:#FBF0D6;color:#9A6A0B}

  /* catálogo */
  .cat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .cat-tools{padding:13px 14px;border-bottom:1px solid var(--line);position:sticky;top:60px;background:var(--surface);z-index:10}
  .search2{display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 14px}
  .search2 input{border:0;outline:none;font-family:inherit;font-size:15px;width:100%;background:none}
  .fams{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .fam{font-size:13px;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--gris);border-radius:22px;padding:8px 15px;cursor:pointer;white-space:nowrap}
  .fam.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:14px}
  .prod{border:1px solid var(--line);border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;gap:6px;background:var(--surface);transition:.12s}
  .prod.incart{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
  .prod .pn{font-weight:700;font-size:13.5px;line-height:1.25;min-height:34px}
  .prod .pm{font-size:11px;color:var(--gris2)}
  .prod .stk{font-size:11px;font-weight:700;color:var(--ok)}
  .prod .stk.low{color:var(--gold)}
  .prod .pr{font-size:17px;font-weight:800;color:var(--teal-deep);margin-top:auto}
  .prod .pr small{font-size:11px;color:var(--gris);font-weight:600}
  .add{margin-top:6px}
  .add .plus{width:100%;background:var(--teal);color:#fff;border:0;border-radius:11px;padding:11px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
  .add .plus:active{transform:scale(.97)}
  .stepper{display:flex;align-items:center;gap:6px}
  .stepper button{width:44px;height:44px;border-radius:11px;border:0;font-size:22px;font-weight:800;cursor:pointer;background:var(--agua);color:var(--teal-deep);display:flex;align-items:center;justify-content:center}
  .stepper button:active{transform:scale(.94)}
  .stepper input{flex:1;text-align:center;font-family:inherit;font-size:17px;font-weight:800;border:1.5px solid var(--line);border-radius:11px;padding:9px 4px;width:100%;min-width:0;-moz-appearance:textfield}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  /* carrito */
  .cart{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);position:sticky;top:60px;display:flex;flex-direction:column;max-height:calc(100vh - 78px)}
  .cart .ch{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .cart .ch h3{font-size:16px;font-weight:800}
  .cart .ch .cnt{margin-left:auto;font-size:12px;font-weight:800;color:#fff;background:var(--teal);border-radius:20px;padding:3px 10px;min-width:24px;text-align:center}
  .cart .ch .sync{margin-left:6px;font-size:11px;color:var(--gris2)}
  .citems{overflow:auto;flex:1;min-height:60px}
  .citem{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
  .citem .ci-nm{font-size:13px;font-weight:700;line-height:1.2}
  .citem .ci-m{font-size:11px;color:var(--gris2);margin-top:1px}
  .citem .ci-r{margin-left:auto;text-align:right;flex:none}
  .citem .ci-sub{font-weight:800;font-size:14px;color:var(--teal-deep)}
  .citem .ci-u{font-size:11px;color:var(--gris)}
  .ministep{display:flex;align-items:center;gap:4px;margin-top:6px}
  .ministep button{width:30px;height:30px;border-radius:8px;border:0;font-size:17px;font-weight:800;cursor:pointer;background:var(--agua);color:var(--teal-deep)}
  .ministep .q{min-width:30px;text-align:center;font-weight:800;font-size:14px}
  .ministep .del{background:none;color:var(--bad);font-size:15px;width:auto;padding:0 6px}
  .cart-empty{padding:40px 20px;text-align:center;color:var(--gris2);font-size:13.5px}
  .cfoot{border-top:1px solid var(--line);padding:14px 16px}
  .cfoot .row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--gris);margin-bottom:4px}
  .cfoot .row.tot{font-size:20px;font-weight:800;color:var(--ink);margin:8px 0 12px}
  .cfoot .btns{display:flex;flex-direction:column;gap:9px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 24px;border-radius:30px;font-weight:600;font-size:14px;opacity:0;transition:.3s;z-index:120;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90vw}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.win{background:linear-gradient(135deg,var(--teal),var(--teal-deep))}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(6,40,38,.55);display:flex;align-items:center;justify-content:center;z-index:110;padding:20px}
  .modal{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
  .modal h3{font-size:20px;font-weight:800;margin-bottom:8px}
  .modal p{color:var(--gris);font-size:14.5px;line-height:1.45}
  .modal .mb{display:flex;gap:10px;margin-top:20px}
  .modal .mb .btn{flex:1}

  .success{max-width:480px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:34px 28px;text-align:center}
  .success .big{font-size:56px;margin-bottom:10px}
  .success h2{font-size:24px;font-weight:800}
  .success p{color:var(--gris);margin:6px 0 22px;font-size:15px}
  .success .btns{display:flex;flex-direction:column;gap:10px}

  /* tablet vertical / móvil: carrito abajo, botón flotante para verlo */
  @media(max-width:860px){
    .sale{grid-template-columns:1fr}
    .cart{position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:20px 20px 0 0;max-height:82vh;z-index:100;transform:translateY(calc(100% - 66px));transition:transform .25s ease;box-shadow:0 -8px 40px rgba(0,0,0,.2)}
    .cart.open{transform:translateY(0)}
    .cart .ch{cursor:pointer}
    .cat-tools{top:56px}
    .grid{padding:12px 12px 90px}
    .wrap{padding:14px 12px 30px}
  }
  @media(max-width:520px){ .grid{grid-template-columns:1fr 1fr;gap:9px} .prod .pn{font-size:12.5px;min-height:32px} }
</style>
</head>
<body>
  <div class="topbar">
    <span class="mono">E<span class="y">y</span>G</span><span class="tag">Core</span>
    <a class="back" id="navBack" href="../index.html">← Inicio</a>
    <div class="who"><b id="whoName">…</b><span>Cargar venta</span></div>
  </div>
  <div class="wrap"><div id="app"><div class="loading"><div class="spinner"></div>Cargando…</div></div></div>
  <div class="toast" id="toast"></div>
  <div id="modalHost"></div>

<script>
const rpc = EYG.rpc;
const money = EYG.money;
const esc = EYG.esc;
const ES = {lang:"es_AR"};

// Familias del catálogo (mismas raíces que usa el módulo de Precios)
const FAMILIAS = [
  {k:"HOSPITALARIOS", id:24, label:"Hospitalarios"},
  {k:"ETICOS",        id:12, label:"Éticos"},
  {k:"FARMACOPEA",    id:10, label:"Farmacopea"},
  {k:"DESCARTABLES",  id:51, label:"Descartables"},
  {k:"PERFUMERIA",    id:11, label:"Perfumería"},
  {k:"EQUIPOS MEDICOS", id:369, label:"Equipos"},
];
const CATALOG_ROOTS = FAMILIAS.map(f=>f.id);

let COMERCIAL="";
let ST = {
  perfil:null, userId:null,
  cartera:[],                 // res.partner de la cartera del comercial
  view:"inicio",              // inicio | picker | venta | success
  qCliente:"",
  // venta activa
  order:null,                 // {id, partnerId, partnerName, pricelistId, listName, plazo}
  want:{},                    // product_id -> cantidad deseada (intención del comercial)
  lines:{},                   // product_id -> {lineId, qty, price_unit, discount, subtotal, name, sku}
  amount:{untaxed:0, total:0},
  syncing:false, dirty:false,
  // catálogo
  fam:"HOSPITALARIOS", qProd:"", prods:[], precios:{}, cargandoCat:false,
  cartOpen:false,
};

/* ---------- utilidades ---------- */
function toast(msg, win){ const t=document.getElementById("toast"); t.textContent=msg; t.className="toast on"+(win?" win":""); clearTimeout(t._t); t._t=setTimeout(()=>t.className="toast",2200); }
function ini(nombre){ const p=(nombre||"?").trim().split(/\s+/); return ((p[0]||"")[0]||"")+((p[1]||"")[0]||""); }
function catCorta(cn){ return String(cn||"").replace("ALL / ","").split(" / ").slice(1).join(" · ") || String(cn||"").replace("ALL / ",""); }
function plazoTxt(c){ const t=c&&c.property_payment_term_id; if(!t||!t[1]) return ""; const m=String(t[1]).match(/(\d+)/); return m?(m[1]+" días"):t[1]; }
function nItems(){ return Object.values(ST.want).filter(q=>q>0).length; }

/* ============================================================
   ARRANQUE
   ============================================================ */
async function cargar(){
  try{
    const u = await rpc("res.users","search_read",[[["name","=",COMERCIAL]]],{fields:["id","name"],limit:1});
    if(!u.length) throw new Error("No encontré al comercial \""+COMERCIAL+"\" en Odoo.");
    ST.userId = u[0].id;
    document.getElementById("whoName").textContent = u[0].name;
    const [cartera, drafts] = await Promise.all([
      rpc("res.partner","search_read",[[["user_id","=",ST.userId]]],
        {fields:["id","name","property_product_pricelist","property_payment_term_id","city","vat"], limit:0, context:ES}),
      rpc("sale.order","search_read",[[["user_id","=",ST.userId],["state","=","draft"]]],
        {fields:["id","name","partner_id","amount_total","order_line","write_date"], order:"write_date desc", limit:50}),
    ]);
    ST.cartera = cartera.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
    ST.drafts = drafts;
    ST.view="inicio"; render();
  }catch(e){
    document.getElementById("app").innerHTML='<div class="errbox"><b>No pude cargar.</b><br>'+esc(e.message)+'</div>';
  }
}

/* ============================================================
   RENDER (despacha por vista)
   ============================================================ */
function render(){
  const app=document.getElementById("app");
  if(ST.view==="inicio")  app.innerHTML = vInicio();
  else if(ST.view==="picker") { app.innerHTML = vPicker(); const i=document.getElementById("cliSearch"); if(i){ i.focus(); } }
  else if(ST.view==="venta")  { app.innerHTML = vVenta(); renderGrid(); renderCart(); }
  else if(ST.view==="success") app.innerHTML = vSuccess();
}

/* ---------- INICIO: presupuestos en curso + nueva venta ---------- */
function vInicio(){
  const d = ST.drafts||[];
  const cards = d.map(o=>{
    const cli = o.partner_id ? o.partner_id[1] : "Sin cliente";
    const n = (o.order_line||[]).length;
    return `<button class="draft" onclick="reanudar(${o.id})">
      <span class="n">${esc(o.name||"")}</span>
      <span class="cli">${esc(cli)}</span>
      <span class="meta">${n} producto${n===1?"":"s"} · ${o.write_date?esc(o.write_date.slice(8,10)+"/"+o.write_date.slice(5,7)):""}</span>
      <span class="tot">${money(o.amount_total)}</span>
      <span class="re">Retomar →</span>
    </button>`;
  }).join("");
  return `<div class="hero"><h1>Cargar venta 🛒</h1><p>Elegí el cliente y armá el pedido desde el catálogo. Se guarda solo como presupuesto en Odoo hasta que lo confirmes.</p></div>
    <button class="btn teal big" onclick="abrirPicker()">＋ Nueva venta</button>
    ${d.length?`<div class="sect-t">Presupuestos en curso (${d.length})</div><div class="draft-grid">${cards}</div>`
      :`<div class="empty" style="padding:34px 0">No tenés presupuestos en curso.</div>`}`;
}

/* ---------- PICKER de cliente ---------- */
function abrirPicker(){ ST.view="picker"; ST.qCliente=""; render(); }
window.buscarCliente = EYG.buscador(v=>{ ST.qCliente=v; renderCliList(); });
function vPicker(){
  return `<div class="hero"><h1>¿A qué cliente?</h1><p>Buscá en tu cartera por nombre.</p></div>
    <div class="picker">
      <div class="search">🔎 <input id="cliSearch" placeholder="Nombre del cliente…" value="${esc(ST.qCliente)}" oninput="buscarCliente(this.value)"></div>
      <div class="list" id="cliList"></div>
    </div>
    <div style="text-align:center;margin-top:16px"><button class="btn ghost" onclick="volverInicio()">← Cancelar</button></div>`;
}
function renderCliList(){
  const el=document.getElementById("cliList"); if(!el) return;
  const q=(ST.qCliente||"").toLowerCase().trim();
  let arr=ST.cartera;
  if(q) arr=arr.filter(c=>(c.name||"").toLowerCase().includes(q) || (c.vat||"").toLowerCase().includes(q));
  arr=arr.slice(0,60);
  if(!arr.length){ el.innerHTML='<div class="cart-empty">Sin resultados en tu cartera.</div>'; return; }
  el.innerHTML=arr.map(c=>{
    const lst = c.property_product_pricelist ? c.property_product_pricelist[1] : "";
    const sub=[c.city, lst].filter(Boolean).join(" · ");
    return `<div class="clirow" onclick="elegirCliente(${c.id})">
      <div class="av">${esc(ini(c.name))}</div>
      <div><div class="nm">${esc(c.name||"")}</div>${sub?`<div class="sub">${esc(sub)}</div>`:""}</div>
    </div>`;
  }).join("");
}

/* ============================================================
   ABRIR / CREAR la venta (presupuesto borrador en Odoo)
   ============================================================ */
async function elegirCliente(pid){
  const c = ST.cartera.find(x=>x.id===pid); if(!c) return;
  document.getElementById("app").innerHTML='<div class="loading"><div class="spinner"></div>Creando presupuesto…</div>';
  try{
    // Crea el pedido en borrador. Odoo asigna lista de precios y vendedor a partir del cliente;
    // forzamos user_id al comercial logueado por las dudas.
    const id = await rpc("sale.order","create",[{partner_id:pid, user_id:ST.userId}],{context:ES});
    const [o] = await rpc("sale.order","read",[[id]],{fields:["id","name","partner_id","pricelist_id","payment_term_id"],context:ES});
    ST.order = {
      id:o.id, name:o.name, partnerId:pid, partnerName:(o.partner_id&&o.partner_id[1])||c.name,
      pricelistId:(o.pricelist_id&&o.pricelist_id[0])||null, listName:(o.pricelist_id&&o.pricelist_id[1])||"",
      plazo:(o.payment_term_id&&o.payment_term_id[1])||plazoTxt(c),
    };
    ST.want={}; ST.lines={}; ST.amount={untaxed:0,total:0};
    await entrarVenta();
  }catch(e){ toast("No pude crear el presupuesto"); ST.view="inicio"; render(); }
}

async function reanudar(orderId){
  document.getElementById("app").innerHTML='<div class="loading"><div class="spinner"></div>Abriendo presupuesto…</div>';
  try{
    const [o] = await rpc("sale.order","read",[[orderId]],{fields:["id","name","partner_id","pricelist_id","payment_term_id","state"],context:ES});
    if(!o){ toast("No existe ese presupuesto"); return cargar(); }
    if(o.state!=="draft"){ toast("Ese pedido ya fue confirmado"); return cargar(); }
    ST.order={ id:o.id, name:o.name, partnerId:o.partner_id&&o.partner_id[0], partnerName:(o.partner_id&&o.partner_id[1])||"",
      pricelistId:(o.pricelist_id&&o.pricelist_id[0])||null, listName:(o.pricelist_id&&o.pricelist_id[1])||"",
      plazo:(o.payment_term_id&&o.payment_term_id[1])||"" };
    ST.want={}; ST.lines={};
    await refrescarLineas();       // trae las líneas ya cargadas
    Object.values(ST.lines).forEach(l=>{ ST.want[l.pid]=l.qty; });
    await entrarVenta();
  }catch(e){ toast("No pude abrir el presupuesto"); cargar(); }
}

async function entrarVenta(){
  ST.view="venta"; ST.fam="HOSPITALARIOS"; ST.qProd=""; ST.cartOpen=false;
  render();
  await cargarCatalogo();
}

/* ============================================================
   CATÁLOGO
   ============================================================ */
async function cargarCatalogo(){
  ST.cargandoCat=true; renderGrid();
  try{
    let dom;
    const q=(ST.qProd||"").trim();
    if(q){
      // Búsqueda en TODO el catálogo vendible, con stock:
      //   qty>0  AND  (name ILIKE q OR code ILIKE q)  AND  (dentro de alguna familia vendible)
      const rootsOr=[];
      for(let i=0;i<CATALOG_ROOTS.length-1;i++) rootsOr.push("|");
      CATALOG_ROOTS.forEach(id=>rootsOr.push(["categ_id","child_of",id]));
      dom=["&","&",["qty_available",">",0],"|",["name","ilike",q],["default_code","ilike",q]].concat(rootsOr);
    }else{
      const fam=FAMILIAS.find(f=>f.k===ST.fam)||FAMILIAS[0];
      dom=[["categ_id","child_of",fam.id],["qty_available",">",0]];
    }
    const prods = await rpc("product.product","search_read",[dom],
      {fields:["id","default_code","name","categ_id","product_tmpl_id","qty_available","uom_id","list_price"], context:ES, order:"name", limit:200});
    ST.prods=prods;
    await cargarPrecios(prods);
  }catch(e){ ST.prods=[]; toast("No pude leer el catálogo"); }
  ST.cargandoCat=false; renderGrid();
}

// Precio de referencia por producto = escalera de la lista del cliente (tramo de menor cantidad).
// El precio EXACTO lo pone Odoo al agregar la línea (fuente de verdad, se ve en el carrito).
async function cargarPrecios(prods){
  ST.precios={};
  if(!ST.order.pricelistId || !prods.length) { prods.forEach(p=>{ ST.precios[p.id]=(p.list_price>1?p.list_price:null); }); return; }
  const tmpls=[...new Set(prods.map(p=>p.product_tmpl_id&&p.product_tmpl_id[0]).filter(Boolean))];
  let items=[];
  try{
    items=await rpc("product.pricelist.item","search_read",
      [[["pricelist_id","=",ST.order.pricelistId],["applied_on","=","1_product"],["product_tmpl_id","in",tmpls]]],
      {fields:["product_tmpl_id","min_quantity","fixed_price","compute_price"], limit:20000});
  }catch(e){}
  const porT={};
  items.forEach(it=>{ if(!it.product_tmpl_id) return; const t=it.product_tmpl_id[0]; (porT[t]=porT[t]||[]).push(it); });
  prods.forEach(p=>{
    const t=p.product_tmpl_id&&p.product_tmpl_id[0];
    const arr=(porT[t]||[]).filter(i=>i.compute_price==="fixed"&&i.fixed_price>0).sort((a,b)=>(a.min_quantity||0)-(b.min_quantity||0));
    ST.precios[p.id] = arr.length ? arr[0].fixed_price : (p.list_price>1?p.list_price:null);
  });
}

function renderGrid(){
  const el=document.getElementById("gridWrap"); if(!el) return;
  if(ST.cargandoCat){ el.innerHTML='<div class="loading"><div class="spinner"></div>Leyendo catálogo…</div>'; return; }
  if(!ST.prods.length){ el.innerHTML='<div class="empty">'+(ST.qProd?"No encontré productos con ese nombre (y stock).":"No hay productos con stock en esta familia.")+'</div>'; return; }
  el.innerHTML='<div class="grid">'+ST.prods.map(cardProd).join("")+'</div>'+
    (ST.prods.length>=200?'<div style="text-align:center;color:var(--gris2);font-size:12px;padding:0 0 16px">Mostrando los primeros 200. Afiná con el buscador.</div>':"");
}
function cardProd(p){
  const q=ST.want[p.id]||0;
  const pr=ST.precios[p.id];
  const stk=p.qty_available||0;
  return `<div class="prod ${q>0?"incart":""}" id="prod-${p.id}">
    <div class="pn">${esc(p.name)}</div>
    <div class="pm">${p.default_code?("["+esc(p.default_code)+"] "):""}${esc(catCorta(p.categ_id&&p.categ_id[1]))}</div>
    <div class="stk ${stk<10?"low":""}">${stk<10?"⚠ ":"✓ "}${Math.round(stk)} en stock</div>
    <div class="pr">${pr!=null?money(pr):'<small>precio al agregar</small>'}<small>${pr!=null?" c/u":""}</small></div>
    <div class="add" id="add-${p.id}">${q>0?stepper(p.id,q):`<button class="plus" onclick="addProd(${p.id})">＋ Agregar</button>`}</div>
  </div>`;
}
function stepper(pid,q){
  return `<div class="stepper">
    <button onclick="chgQty(${pid},-1)">−</button>
    <input type="number" inputmode="numeric" min="0" value="${q}" onchange="setQty(${pid},this.value)">
    <button onclick="chgQty(${pid},1)">＋</button>
  </div>`;
}

/* ---------- alta/baja de cantidades (optimista + sync a Odoo) ---------- */
function addProd(pid){ ST.want[pid]=(ST.want[pid]||0)+1; refrescarCelda(pid); marcarDirty(); }
function chgQty(pid,d){ ST.want[pid]=Math.max(0,(ST.want[pid]||0)+d); if(ST.want[pid]===0) delete ST.want[pid]; refrescarCelda(pid); marcarDirty(); }
function setQty(pid,v){ let n=Math.max(0,Math.floor(+v||0)); if(n===0) delete ST.want[pid]; else ST.want[pid]=n; refrescarCelda(pid); marcarDirty(); }

function refrescarCelda(pid){
  const add=document.getElementById("add-"+pid); const card=document.getElementById("prod-"+pid);
  const q=ST.want[pid]||0;
  if(add) add.innerHTML = q>0?stepper(pid,q):`<button class="plus" onclick="addProd(${pid})">＋ Agregar</button>`;
  if(card) card.classList.toggle("incart",q>0);
  renderCartBadge();
}
function marcarDirty(){ ST.dirty=true; renderCartBadge(); syncSoon(); }

let _syncT=null;
function syncSoon(){ clearTimeout(_syncT); _syncT=setTimeout(syncOrder, 600); }

async function syncOrder(){
  if(!ST.order) return;
  if(ST.syncing){ syncSoon(); return; }
  ST.syncing=true; ST.dirty=false; renderCartBadge();
  try{
    const cmds=[];
    // altas y cambios
    for(const pid of Object.keys(ST.want)){
      const q=ST.want[pid]; const l=ST.lines[pid];
      if(q>0 && !l) cmds.push([0,0,{product_id:+pid, product_uom_qty:q}]);
      else if(q>0 && l && l.qty!==q) cmds.push([1,l.lineId,{product_uom_qty:q}]);
    }
    // bajas: líneas en Odoo que ya no están (o quedaron en 0)
    for(const pid of Object.keys(ST.lines)){
      if(!(ST.want[pid]>0)) cmds.push([2, ST.lines[pid].lineId]);
    }
    if(cmds.length){
      await rpc("sale.order","write",[[ST.order.id],{order_line:cmds}],{context:ES});
      await refrescarLineas();
    }
  }catch(e){ toast("No pude guardar en Odoo"); ST.dirty=true; }
  ST.syncing=false;
  renderCart();
  // si el usuario siguió tocando mientras sincronizaba, vuelve a sincronizar
  if(ST.dirty) syncSoon();
}

async function refrescarLineas(){
  const [o]=await rpc("sale.order","read",[[ST.order.id]],{fields:["amount_untaxed","amount_total","order_line"],context:ES});
  ST.amount={untaxed:o.amount_untaxed||0, total:o.amount_total||0};
  const ids=o.order_line||[];
  ST.lines={};
  if(ids.length){
    const ls=await rpc("sale.order.line","read",[ids],{fields:["id","product_id","product_uom_qty","price_unit","discount","price_subtotal","name"],context:ES});
    ls.forEach(l=>{ if(!l.product_id) return; const pid=l.product_id[0];
      ST.lines[pid]={ pid, lineId:l.id, qty:l.product_uom_qty, price_unit:l.price_unit, discount:l.discount||0,
        subtotal:l.price_subtotal, name:l.product_id[1] }; });
  }
}

/* ============================================================
   VISTA VENTA
   ============================================================ */
function vVenta(){
  const o=ST.order;
  return `<div class="sale">
    <div class="clihdr">
      <div class="who2">
        <div class="nm">${esc(o.partnerName)}</div>
        <div class="badges">
          <span class="bdg">${esc(o.name||"Presupuesto")}</span>
          ${o.listName?`<span class="bdg">🏷️ ${esc(o.listName)}</span>`:""}
          ${o.plazo?`<span class="bdg plazo">🕐 ${esc(o.plazo)}</span>`:""}
        </div>
      </div>
      <button class="btn ghost" onclick="volverInicio()">← Volver</button>
    </div>

    <div class="cat-card">
      <div class="cat-tools">
        <div class="search2">🔎 <input id="prodSearch" placeholder="Buscar producto por nombre o código…" value="${esc(ST.qProd)}" oninput="buscarProd(this.value)"></div>
        <div class="fams">${FAMILIAS.map(f=>`<button class="fam ${ST.fam===f.k&&!ST.qProd?"on":""}" onclick="setFam('${f.k}')">${esc(f.label)}</button>`).join("")}</div>
      </div>
      <div id="gridWrap"></div>
    </div>

    <div class="cart ${ST.cartOpen?"open":""}" id="cartBox">
      <div class="ch" onclick="toggleCart()">
        <h3>🛒 Pedido</h3><span class="cnt" id="cartCnt">${nItems()}</span>
        <span class="sync" id="cartSync"></span>
      </div>
      <div class="citems" id="cartItems"></div>
      <div class="cfoot" id="cartFoot"></div>
    </div>
  </div>`;
}

window.buscarProd = EYG.buscador(v=>{ ST.qProd=v; cargarCatalogo(); }, 380);
function setFam(k){ ST.fam=k; ST.qProd=""; const s=document.getElementById("prodSearch"); if(s) s.value=""; document.querySelectorAll(".fam").forEach(b=>b.classList.remove("on")); cargarCatalogo(); render(); }
function toggleCart(){ ST.cartOpen=!ST.cartOpen; const b=document.getElementById("cartBox"); if(b) b.classList.toggle("open",ST.cartOpen); }

function renderCartBadge(){
  const c=document.getElementById("cartCnt"); if(c) c.textContent=nItems();
  const s=document.getElementById("cartSync"); if(s) s.textContent = ST.syncing?"guardando…" : (ST.dirty?"…":"✓ guardado");
}
function renderCart(){
  renderCartBadge();
  const items=document.getElementById("cartItems"), foot=document.getElementById("cartFoot"); if(!items||!foot) return;
  const pids=Object.keys(ST.want).filter(pid=>ST.want[pid]>0);
  if(!pids.length){ items.innerHTML='<div class="cart-empty">Todavía no cargaste productos.<br>Tocá ＋ en el catálogo.</div>'; foot.innerHTML=""; return; }
  items.innerHTML = pids.map(pid=>{
    const q=ST.want[pid]; const l=ST.lines[pid];
    const nombre = (l&&l.name) || (ST.prods.find(p=>p.id==pid)||{}).name || "Producto";
    const sub = l? l.subtotal : null;
    const unit = l? l.price_unit*(1-(l.discount||0)/100) : ST.precios[pid];
    return `<div class="citem">
      <div>
        <div class="ci-nm">${esc(nombre)}</div>
        <div class="ci-m">${unit!=null?money(unit)+" c/u"+((l&&l.discount)?(" · −"+Math.round(l.discount)+"%"):""):"calculando…"}</div>
        <div class="ministep">
          <button onclick="chgQty(${pid},-1)">−</button>
          <span class="q">${q}</span>
          <button onclick="chgQty(${pid},1)">＋</button>
          <button class="del" onclick="quitar(${pid})" title="Quitar">🗑</button>
        </div>
      </div>
      <div class="ci-r"><div class="ci-sub">${sub!=null?money(sub):"…"}</div></div>
    </div>`;
  }).join("");
  foot.innerHTML=`
    <div class="row"><span>Neto (sin IVA)</span><b>${money(ST.amount.untaxed)}</b></div>
    <div class="row tot"><span>Total</span><span>${money(ST.amount.total)}</span></div>
    <div class="btns">
      <button class="btn grn big" onclick="confirmarVenta()" ${ST.syncing?"disabled":""}>✓ Confirmar venta</button>
      <button class="btn red" onclick="pedirDescartar()">Descartar presupuesto</button>
    </div>`;
}
function quitar(pid){ delete ST.want[pid]; refrescarCelda(pid); marcarDirty(); renderCart(); }

/* ============================================================
   CONFIRMAR / DESCARTAR
   ============================================================ */
function confirmarVenta(){
  if(!nItems()) return toast("Cargá al menos un producto");
  modal(`<h3>Confirmar venta</h3>
    <p>Vas a confirmar el pedido de <b>${esc(ST.order.partnerName)}</b> por <b>${money(ST.amount.total)}</b> (${nItems()} producto${nItems()===1?"":"s"}).<br><br>Queda como pedido de venta confirmado en Odoo.</p>
    <div class="mb"><button class="btn ghost" onclick="cerrarModal()">Cancelar</button><button class="btn grn" onclick="doConfirmar()">Sí, confirmar</button></div>`);
}
async function doConfirmar(){
  cerrarModal();
  if(ST.dirty||ST.syncing){ await syncOrder(); }
  document.getElementById("app").innerHTML='<div class="loading"><div class="spinner"></div>Confirmando el pedido…</div>';
  try{
    await rpc("sale.order","action_confirm",[[ST.order.id]],{context:ES});
    ST.view="success"; render();
  }catch(e){ toast("No pude confirmar: "+(e.message||"")); ST.view="venta"; render(); }
}

function pedirDescartar(){
  modal(`<h3>Descartar presupuesto</h3>
    <p>Se va a eliminar este presupuesto de <b>${esc(ST.order.partnerName)}</b> y todo lo que cargaste. Esta acción no se puede deshacer.</p>
    <div class="mb"><button class="btn ghost" onclick="cerrarModal()">No, seguir</button><button class="btn red" onclick="doDescartar()">Sí, descartar</button></div>`);
}
async function doDescartar(){
  cerrarModal();
  document.getElementById("app").innerHTML='<div class="loading"><div class="spinner"></div>Descartando…</div>';
  try{ await rpc("sale.order","unlink",[[ST.order.id]]); toast("Presupuesto descartado"); }
  catch(e){ toast("No pude descartar"); }
  ST.order=null; ST.want={}; ST.lines={}; cargar();
}

function vSuccess(){
  return `<div class="success">
    <div class="big">✅</div>
    <h2>¡Venta confirmada!</h2>
    <p>Pedido <b>${esc(ST.order.name||"")}</b> de <b>${esc(ST.order.partnerName)}</b> por <b>${money(ST.amount.total)}</b> quedó confirmado en Odoo.</p>
    <div class="btns">
      <button class="btn teal big" onclick="abrirPicker()">＋ Cargar otra venta</button>
      <button class="btn ghost" onclick="volverInicio()">Volver al inicio</button>
    </div>
  </div>`;
}

/* ---------- navegación / modal ---------- */
async function volverInicio(){
  // Si el borrador quedó sin nada cargado, lo borramos para no dejar presupuestos vacíos.
  if(ST.view==="venta" && ST.order && ST.order.id && nItems()===0 && !Object.keys(ST.lines).length){
    try{ await rpc("sale.order","unlink",[[ST.order.id]]); }catch(e){}
  }
  ST.view="inicio"; ST.order=null; ST.want={}; ST.lines={}; cargar();
}
function modal(html){ document.getElementById("modalHost").innerHTML=`<div class="scrim" onclick="if(event.target===this)cerrarModal()"><div class="modal">${html}</div></div>`; }
function cerrarModal(){ document.getElementById("modalHost").innerHTML=""; }

   LOGIN + identidad
   ============================================================ */
EYG.guard(["comercial","lider","admin","direccion"]).then(perfil=>{
  ST.perfil=perfil;
  const q=new URLSearchParams(location.search).get("c");
  if(perfil.rol==="comercial"){
    COMERCIAL = perfil.comercial_ref || perfil.nombre || perfil.email;
    const nb=document.getElementById("navBack");
    if(nb){ nb.textContent="Salir"; nb.href="#"; nb.title="Cerrar sesión"; nb.onclick=(e)=>{e.preventDefault();EYG.logout();}; }
  } else {
    COMERCIAL = q || perfil.comercial_ref || "Natividad Sanchez";
  }
  cargar();
});
</script>
