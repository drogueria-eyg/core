<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cargar venta · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=37"></script>
<style>
  :root{
    --teal:#048782; --teal-deep:#04635F; --teal-med:#0AA89F; --aqua:#5FC8BF; --agua:#E2F1EF;
    --ink:#0E1F1D; --gris:#5F716E; --gris2:#8A9A97; --surface:#fff; --bg:#F4F8F7; --line:#DCE8E6;
    --radius:16px; --gold:#E5A93B; --ok:#1E7D46; --okbg:#E7F6EC; --bad:#B0322F; --badbg:#FBE2E1; --coral:#EC5E4F;
    --shadow:0 1px 2px rgba(6,65,62,.05), 0 8px 30px rgba(6,65,62,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  /* ---- topbar ---- */
  .topbar{background:var(--teal-deep);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40}
  .mono{font-family:Georgia,serif;font-weight:700;font-size:22px;letter-spacing:.5px;line-height:1}
  .mono .y{color:var(--aqua)}
  .topbar .tag{font-weight:700;font-size:10px;letter-spacing:2px;text-transform:uppercase;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:20px}
  .topbar .back{color:#fff;text-decoration:none;font-size:13px;font-weight:600;opacity:.9;background:rgba(255,255,255,.1);padding:7px 12px;border-radius:10px}
  .topbar .who{margin-left:auto;text-align:right;font-size:12px;line-height:1.2}
  .topbar .who b{display:block;font-size:14px}
  .topbar .who span{color:var(--aqua)}
  .wrap{max-width:1280px;margin:0 auto;padding:18px 18px 40px}

  /* ---- botones grandes (tablet) ---- */
  .btn{font-family:inherit;font-weight:700;border:0;border-radius:12px;cursor:pointer;font-size:15px;padding:13px 20px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
  .btn:active{transform:scale(.98)}
  .btn.teal{background:var(--teal);color:#fff;box-shadow:var(--shadow)}
  .btn.teal:hover{filter:brightness(1.07)}
  .btn.deep{background:var(--teal-deep);color:#fff}
  .btn.ghost{background:var(--surface);color:var(--teal-deep);border:1.5px solid var(--line)}
  .btn.big{font-size:17px;padding:16px 26px;border-radius:14px}
  .btn.grn{background:var(--ok);color:#fff}
  .btn.gold{background:#C9A227;color:#fff}
  .pfrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .pfrow:hover{background:#F7FBFA}
  .pfsel{background:#EEF6F5;border:1px solid #BFE0DC;border-radius:9px;padding:9px 12px;font-size:14px}
  .btn.red{background:#fff;color:var(--bad);border:1.5px solid #f0c4c2}
  .btn:disabled{opacity:.55;cursor:default}

  .loading,.empty{text-align:center;padding:60px 20px;color:var(--gris)}
  .spinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .errbox{background:#FBE4E3;border:1px solid #F3B5B2;color:#8A2E2B;padding:16px;border-radius:12px}

  /* ===== INICIO ===== */
  .hero{margin-bottom:16px}
  .hero h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
  .hero p{color:var(--gris);font-size:14px;margin-top:3px}
  .sect-t{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--gris);margin:22px 2px 10px}
  .draft-list{display:flex;flex-direction:column;gap:8px}
  .draft{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;box-shadow:var(--shadow);transition:.12s}
  .draft:hover{border-color:var(--teal-med)}
  .draft .di{min-width:0;flex:1;cursor:pointer}
  .draft .cli{font-size:15.5px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .draft .meta{font-size:12px;color:var(--gris);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .draft .tot{font-size:17px;font-weight:800;color:var(--teal-deep);white-space:nowrap;flex-shrink:0}
  .draft .acts{display:flex;gap:8px;flex-shrink:0}
  .draft .acts .btn{padding:9px 14px;font-size:13.5px}
  .dbtn{background:#fff;color:var(--bad);border:1.5px solid #f0c4c2;border-radius:10px;font-size:16px;width:42px;height:40px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .dbtn:active{transform:scale(.95)}
  @media(max-width:560px){ .draft{flex-wrap:wrap} .draft .di{flex:1 1 100%} .draft .acts{margin-left:auto} }

  /* ===== selector de cliente ===== */
  .picker{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;max-width:640px;margin:0 auto}
  .picker .search{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .picker .search input{border:0;outline:none;font-family:inherit;font-size:17px;width:100%;background:none}
  .picker .list{max-height:60vh;overflow:auto}
  .clirow{padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;align-items:center;gap:12px}
  .clirow:hover{background:var(--agua)}
  .clirow:last-child{border-bottom:0}
  .clirow .av{width:40px;height:40px;border-radius:10px;background:var(--agua);color:var(--teal-deep);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
  .clirow .nm{font-weight:700;font-size:15.5px;line-height:1.2}
  .clirow .sub{font-size:12px;color:var(--gris);margin-top:2px}

  /* ===== VENTA (catálogo + carrito) ===== */
  .sale{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
  .clihdr{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .clihdr .who2{flex:1;min-width:180px}
  .clihdr .who2 .nm{font-size:18px;font-weight:800;line-height:1.15}
  .clihdr .who2 .badges{margin-top:5px;display:flex;gap:7px;flex-wrap:wrap}
  .bdg{font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 10px;background:var(--agua);color:var(--teal-deep)}
  .bdg.plazo{background:#FBF0D6;color:#9A6A0B}
  .bdg.entrega{background:#EAF3FF;color:#12507F;cursor:pointer}
  .bdg.entrega:hover{filter:brightness(.97)}
  /* paso "¿a dónde entregás?" (modal): opciones tocables grandes */
  .eopts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
  .eopt{justify-content:flex-start;text-align:left;gap:10px;padding:14px 16px}
  .eopt small{color:var(--gris);font-weight:500;font-size:12.5px}
  .eopt.eadd{border-style:dashed;color:var(--teal-deep)}
  /* selector de lista de precios (paso previo, tablet-friendly) */
  .lista-wrap{display:flex;flex-direction:column;gap:14px;margin-top:6px}
  .lista-opt{justify-content:flex-start;text-align:left;gap:16px;padding:24px 22px;font-size:19px;border-radius:16px;border-width:2px;min-height:72px}
  .lista-opt.sel{border-color:var(--teal);background:var(--agua);color:var(--teal-deep)}
  .lista-opt .lopt-ic{font-size:26px;line-height:1}
  .lista-opt .lopt-tx small{display:block;font-weight:500;color:var(--gris);font-size:13.5px;margin-top:3px}
  .lista-badge{cursor:pointer}
  /* formulario "nueva dirección de entrega" */
  .eform{display:flex;flex-direction:column;gap:4px;margin-top:8px}
  .eform label{font-size:12px;font-weight:700;color:var(--gris);margin-top:7px}
  .eform input{border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-family:inherit;font-size:15px;outline:none}
  .eform input:focus{border-color:var(--teal)}

  /* catálogo */
  .cat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .cat-tools{padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:var(--topH,56px);background:var(--surface);z-index:20;border-radius:var(--radius) var(--radius) 0 0}
  .search2{display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 13px}
  .search2 input{border:0;outline:none;font-family:inherit;font-size:15px;width:100%;background:none}
  .fams{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
  .fam{font-size:12.5px;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--gris);border-radius:22px;padding:6px 13px;cursor:pointer;white-space:nowrap}
  .fam.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .fam.of{color:var(--coral);border-color:#f3c9c3}
  .fam.of.on{background:var(--coral);border-color:var(--coral);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(174px,1fr));gap:10px;padding:12px}
  .prod{position:relative;border:1px solid var(--line);border-radius:12px;padding:9px;display:flex;flex-direction:column;gap:6px;background:var(--surface);transition:.12s}
  .prod.incart{border-color:var(--teal);box-shadow:inset 0 0 0 1.5px var(--teal)}
  /* Oferta: fondo muy claro (mantiene contraste del texto) + borde coral con glow neón titilante */
  .prod.oferta{background:#FEF5F3;border-color:var(--coral);animation:ofGlow 2.4s ease-in-out infinite}
  .prod.oferta.incart{border-color:var(--teal)}
  @keyframes ofGlow{
    0%,100%{box-shadow:0 0 0 1px var(--coral), 0 0 9px rgba(236,94,79,.30)}
    50%{box-shadow:0 0 0 1px var(--coral), 0 0 18px rgba(236,94,79,.55)}
  }
  @media(prefers-reduced-motion:reduce){ .prod.oferta{animation:none;box-shadow:0 0 0 1px var(--coral),0 0 12px rgba(236,94,79,.4)} }
  /* en ofertas, textos secundarios un tono más oscuro para no perder contraste sobre el tinte */
  .prod.oferta .pm, .prod.oferta .esc{color:var(--gris)}
  .foot{margin-top:auto;display:flex;flex-direction:column;gap:5px}
  .prod .top{display:flex;gap:9px;align-items:flex-start}
  .prod .thumb{width:52px;height:52px;border-radius:9px;background:#f2f6f5;border:1px solid var(--line);flex:none;object-fit:contain;display:block}
  .prod .thumb.ph{display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--gris2)}
  .prod .ti{min-width:0;flex:1}
  .prod .pn{font-weight:700;font-size:12.8px;line-height:1.22;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:31px}
  .prod .pm{font-size:10.5px;color:var(--gris2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prod .stk{font-size:10.5px;font-weight:700;color:var(--ok);margin-top:2px}
  .prod .stk.low{color:var(--gold)}
  .prod .pr{font-size:16px;font-weight:800;color:var(--teal-deep);line-height:1}
  .prod .pr small{font-size:10.5px;color:var(--gris);font-weight:600}
  .prod .pr.of{color:var(--coral)}
  .prod .pr .pr-old{color:var(--gris2);text-decoration:line-through;font-size:12px;font-weight:600;margin-right:5px}
  /* escalera: tramos en una línea, limpia y con alto reservado (alinea todas las tarjetas) */
  .esc{min-height:16px;font-size:10.5px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--gris2)}
  .esc .tg{margin-right:9px}
  .esc .tg i{font-style:normal;color:var(--gris2)}
  .esc .tg b{color:var(--teal-deep);font-weight:800}
  .nextd{font-size:10.5px;font-weight:800;color:#9A6A0B;background:#FBF4E3;border:1px solid #f0e0b8;border-radius:7px;padding:3px 7px;line-height:1.2;display:inline-block}
  .add .plus{width:100%;background:var(--teal);color:#fff;border:0;border-radius:10px;padding:10px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer}
  .add .plus:active{transform:scale(.97)}
  /* vencimientos: badge de stock tocable + vto más próximo + popup de lotes */
  .stk.tap{cursor:pointer}
  .vto{font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px;background:#eef2f1;color:var(--gris);white-space:nowrap}
  .vto.corto{background:#FBE4E3;color:#b0322f}
  /* disponible / comprometido */
  .prod .stk.out,.rprod .stk.out,.stk.out{color:#B42318;font-weight:800}
  .cmp{font-size:10px;font-weight:800;color:#B42318;background:#FDECEA;border-radius:6px;padding:1px 6px;white-space:nowrap;margin-left:4px}
  .add .plus.out{background:#F0EDEA;color:#9A8F86;cursor:not-allowed}
  .add .plus.out:active{transform:none}
  .add .plus.repo{background:#FBF4E3;color:#8a6a1f;border:1px solid #E0B84A}
  .add .plus.repo:active{transform:scale(.97)}
  .stkline{margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .lotlist{display:flex;flex-direction:column;gap:7px;max-height:44vh;overflow:auto}
  .lotrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
  .lotrow.viejo{border-color:#f0c9a0;background:#FBF4E3}
  .lbadge{font-size:10px;font-weight:800;background:#9A6A0B;color:#fff;border-radius:20px;padding:1px 7px;margin-left:5px}
  .lotrow .ld{display:flex;gap:12px;align-items:center;white-space:nowrap}
  .lvto{font-weight:800;color:var(--teal-deep)} .lvto.corto{color:#b0322f}
  .lotrow .lq{color:var(--gris);font-weight:700}
  .stepper{display:flex;align-items:center;gap:6px}
  .stepper button{width:40px;height:40px;border-radius:10px;border:0;font-size:20px;font-weight:800;cursor:pointer;background:var(--agua);color:var(--teal-deep);display:flex;align-items:center;justify-content:center}
  .stepper button:active{transform:scale(.94)}
  .stepper input{flex:1;text-align:center;font-family:inherit;font-size:16px;font-weight:800;border:1.5px solid var(--line);border-radius:10px;padding:8px 4px;width:100%;min-width:0;-moz-appearance:textfield}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  /* ---- toolbar: buscador + toggle de vista ---- */
  .toolrow{display:flex;gap:9px;align-items:center}
  .toolrow .search2{flex:1}
  .vtoggle{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px;flex:none}
  .vbtn{width:38px;height:38px;border:0;background:none;border-radius:8px;font-size:16px;cursor:pointer;color:var(--gris);display:flex;align-items:center;justify-content:center}
  .vbtn.on{background:var(--teal);color:#fff}

  /* ---- vista FILAS (mejor para scrollear) ---- */
  .rows{display:flex;flex-direction:column;padding:12px;gap:8px}
  .rprod{position:relative;display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--surface);transition:.12s}
  .rprod.incart{border-color:var(--teal);box-shadow:inset 0 0 0 1.5px var(--teal)}
  .rprod.oferta{background:#FEF5F3;border-color:var(--coral);animation:ofGlow 2.4s ease-in-out infinite}
  .rprod.oferta.incart{border-color:var(--teal)}
  .rprod.pre{opacity:.72}
  .pre-load{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--gris2);white-space:nowrap}
  .pspin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;flex:none}
  @media(prefers-reduced-motion:reduce){ .rprod.oferta{animation:none;box-shadow:0 0 0 1px var(--coral),0 0 12px rgba(236,94,79,.4)} }
  .rprod .thumb{width:62px;height:62px;border-radius:10px;background:#f2f6f5;border:1px solid var(--line);flex:none;object-fit:contain;display:block}
  .rprod .thumb.ph{display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--gris2)}
  .rinfo{flex:1;min-width:0}
  .rprod .pn{font-weight:700;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rprod .pm{font-size:11px;color:var(--gris2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rmeta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:4px}
  .rprod .stk{font-size:11px;font-weight:700;color:var(--ok);flex:none}
  .rprod .stk.low{color:var(--gold)}
  .rprod .esc{min-height:0;flex:1;min-width:120px}
  .rprod.oferta .pm,.rprod.oferta .esc{color:var(--gris)}
  .rright{flex:none;width:176px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
  .rright .pr{font-size:17px;font-weight:800;color:var(--teal-deep);line-height:1;text-align:right}
  .rright .pr small{font-size:10.5px;color:var(--gris);font-weight:600}
  .rright .pr.of{color:var(--coral)}
  .rright .pr .pr-old{color:var(--gris2);text-decoration:line-through;font-size:12.5px;font-weight:600;margin-right:5px}
  @media(max-width:560px){
    .rprod{flex-wrap:wrap}
    .rright{width:100%}
    .rprod .thumb{width:52px;height:52px}
    .rinfo{flex:1 1 60%}
  }

  /* carrito */
  .cart{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);position:sticky;top:var(--topH,56px);display:flex;flex-direction:column;max-height:calc(100vh - var(--topH,56px) - 16px)}
  .cart .ch{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .cart .ch h3{font-size:16px;font-weight:800}
  .cart .ch .cnt{margin-left:auto;font-size:12px;font-weight:800;color:#fff;background:var(--teal);border-radius:20px;padding:3px 10px;min-width:24px;text-align:center}
  .cart .ch .sync{margin-left:6px;font-size:11px;color:var(--gris2)}
  .citems{overflow:auto;flex:1;min-height:60px}
  .citem{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
  .citem .ci-nm{font-size:13px;font-weight:700;line-height:1.2}
  .citem .ci-m{font-size:11px;color:var(--gris2);margin-top:1px}
  .citem .ci-r{margin-left:auto;text-align:right;flex:none}
  .citem .ci-u{font-size:11px;color:var(--gris);white-space:nowrap}
  .ci-disc{display:inline-block;background:var(--okbg);color:var(--ok);font-size:11px;font-weight:800;border-radius:7px;padding:2px 7px;line-height:1.25;white-space:nowrap}
  .citem .ci-sub{font-weight:800;font-size:15px;color:var(--teal-deep);margin-top:1px}
  .ministep{display:flex;align-items:center;gap:5px;margin-top:7px}
  .ministep button{width:32px;height:32px;border-radius:8px;border:0;font-size:18px;font-weight:800;cursor:pointer;background:var(--agua);color:var(--teal-deep)}
  .ministep input.q{width:48px;height:32px;text-align:center;font-family:inherit;font-weight:800;font-size:14px;border:1.5px solid var(--line);border-radius:8px;padding:0 2px;-moz-appearance:textfield}
  .ministep input.q::-webkit-outer-spin-button,.ministep input.q::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .ministep .del{background:none;color:var(--bad);font-size:16px;width:auto;padding:0 6px;cursor:pointer;border:0}
  .descstep{display:flex;align-items:center;gap:7px;margin-top:7px}
  .descstep .dl{font-size:12.5px;font-weight:700;color:var(--gris)}
  .descstep button{width:32px;height:32px;border-radius:8px;border:0;font-size:18px;font-weight:800;cursor:pointer;background:#FBF0DA;color:#9A6A0B}
  .descstep button:active{transform:scale(.94)}
  .descstep .dv{min-width:42px;text-align:center;font-weight:800;font-size:15px;color:#9A6A0B}
  .cart-empty{padding:40px 20px;text-align:center;color:var(--gris2);font-size:13.5px}

<body>
  <div class="topbar">
    <span class="mono">E<span class="y">y</span>G</span><span class="tag">Core</span>
    <a class="back" id="navBack" href="../index.html">← Inicio</a>
    <div class="who"><b id="whoName">…</b><span>Cargar venta</span></div>
  </div>
  <div class="wrap"><div id="app"><div class="loading"><div class="spinner"></div>Cargando…</div></div></div>
  <div class="toast" id="toast"></div>
  <div id="modalHost"></div>

<script>
const rpc = EYG.rpc;
// Precio EXACTO en el panel: muestra centavos cuando los hay (ej. $285,06); enteros quedan limpios ($310).
// El EYG.money global redondea a pesos enteros; acá lo pisamos solo para la vista de venta (que cotiza).
const money = n => { n=Math.round((+n||0)*100)/100; return "$"+n.toLocaleString("es-AR",{minimumFractionDigits:Number.isInteger(n)?0:2, maximumFractionDigits:2}); };
const esc = EYG.esc;
const ES = {lang:"es_AR"};
const PPAL_TAG = "[ENTREGA-PPAL]"; // marca reversible (chatter) de la dirección de entrega principal
// Base pública de Odoo para servir imágenes de producto por <img src> (fuera del canal RPC).
const ODOO_BASE = "https://drogueriaeyg.odoo.com";

// Familias del catálogo (mismas raíces que usa el módulo de Precios)
const FAMILIAS = [
  {k:"HOSPITALARIOS", id:24, label:"Hospitalarios"},
  {k:"ETICOS",        id:12, label:"Éticos"},
  {k:"FARMACOPEA",    id:10, label:"Farmacopea"},
  {k:"DESCARTABLES",  id:51, label:"Descartables"},
  {k:"PERFUMERIA",    id:11, label:"Perfumería"},
  {k:"EQUIPOS MEDICOS", id:369, label:"Equipos"},
];
const CATALOG_ROOTS = FAMILIAS.map(f=>f.id);
const TIER2_LIST = 16;   // (2) SAMCOs y clínicas: única lista con descuento comercial

let COMERCIAL="";
let ST = {
  perfil:null, userId:null,
  cartera:[],                 // res.partner de la cartera del comercial
  riesgos:{},                 // partnerId -> alerta de crédito (motor compartido EYG.riesgoCartera)
  view:"inicio",              // inicio | picker | venta | success
  qCliente:"",
  // venta activa
  order:null,                 // {id, partnerId, partnerName, pricelistId, listName, plazo}
  want:{},                    // product_id -> cantidad deseada (intención del comercial)
  lines:{},                   // product_id -> {lineId, qty, price_unit, discount, subtotal, name, sku}
  desc:{},                    // product_id -> % de descuento comercial (SOLO tier 2)
  baseUnit:{},                // product_id -> precio unitario BASE de la lista (sin descuento)
  maxDescT2:5,                // tope de descuento en tier 2 (se recalcula del piso de margen)
  lotes:{},                   // product_id -> [{n:lote, exp:vto, qty}] ordenados por vencimiento
  amount:{untaxed:0, total:0},
  syncing:false, dirty:false,
  // catálogo
  fam:"HOSPITALARIOS", qProd:"", prods:[], precios:{}, tiers:{}, imgs:{}, catCache:{}, prodCache:{}, ofertaPids:new Set(), ofertaTmpls:new Set(), ofertaInfo:{}, ofertaRule:{}, _ofLoaded:false, cargandoCat:false,
  fisico:{}, comprometido:{}, _compTs:0,   // stock físico y comprometido (confirmado sin entregar) por producto → disponible
  cartOpen:false,
  vista:(function(){ try{ return localStorage.getItem("eyg_vender_vista")||"filas"; }catch(e){ return "filas"; } })(),  // "filas" | "grilla"
};

/* ---------- utilidades ---------- */
function toast(msg, win){ const t=document.getElementById("toast"); t.textContent=msg; t.className="toast on"+(win?" win":""); clearTimeout(t._t); t._t=setTimeout(()=>t.className="toast",2200); }
function ini(nombre){ const p=(nombre||"?").trim().split(/\s+/); return ((p[0]||"")[0]||"")+((p[1]||"")[0]||""); }
function catCorta(cn){ return String(cn||"").replace("ALL / ","").split(" / ").slice(1).join(" · ") || String(cn||"").replace("ALL / ",""); }
function plazoTxt(c){ const t=c&&c.property_payment_term_id; if(!t||!t[1]) return ""; const m=String(t[1]).match(/(\d+)/); return m?(m[1]+" días"):t[1]; }
function nItems(){ return Object.values(ST.want).filter(q=>q>0).length; }

/* ============================================================
   ARRANQUE
   ============================================================ */
async function cargar(){
  try{
    const u = await rpc("res.users","search_read",[[["name","=",COMERCIAL]]],{fields:["id","name"],limit:1});
    if(!u.length) throw new Error("No encontré al comercial \""+COMERCIAL+"\" en Odoo.");
    ST.userId = u[0].id;
    document.getElementById("whoName").textContent = u[0].name;
    const [cartera, drafts] = await Promise.all([
      // Cartera del comercial. Filtro: solo CLIENTES FISCALES (parent_id=false), o sea los que se
      // facturan (uno por CUIT, siempre nivel superior). Esto deja afuera del buscador tanto las
      // DIRECCIONES de entrega (p.ej. "OSIAD SAN LORENZO", colgada de su obra social) como los
      // CONTACTOS-persona de la empresa (a los que no se factura): la sucursal aparece en el paso
      // "¿a dónde entregás?" y las personas irán a la libreta de contactos de la ficha.
      rpc("res.partner","search_read",[[["user_id","=",ST.userId],["parent_id","=",false]]],
        {fields:["id","name","property_product_pricelist","property_payment_term_id","city","vat"], limit:0, context:ES}),
      rpc("sale.order","search_read",[[["user_id","=",ST.userId],["state","in",["draft","sent"]]]],
        {fields:["id","name","partner_id","amount_total","order_line","write_date"], order:"write_date desc", limit:50}),
    ]);
    ST.cartera = cartera.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
    ST.drafts = drafts;
    cargarListas();          // precargar las listas (para que el paso de selección salga al toque)
    precargarCatalogo();     // precargar productos de Hospitalarios en 2º plano → entrar a la venta es instantáneo
    // Alerta de crédito (motor compartido): se trae aparte para no frenar el arranque y
    // repinta cuando llega. Avisa al comercial (ej. no ofrecer plazos a un mal pagador).
    EYG.riesgoCartera().then(m=>{ ST.riesgos=m||{}; if(ST.view==="picker") renderCliList(); else if(ST.view==="venta") render(); }).catch(()=>{});
    // Entradas directas desde el panel:
    //  ?reanudar=ID → abre ese presupuesto para seguir cargándolo.
    //  ?nuevo=1     → salta el listado y va directo a elegir cliente (crear la venta).
    const P=new URLSearchParams(location.search);
    const _rean=P.get("reanudar"), _nuevo=P.get("nuevo");
    // Consumimos el parámetro apenas se lee: así un refresh o un descarte que vuelve a cargar()
    // NO reintenta abrir el mismo presupuesto (evita el loop "no existe ese presupuesto").
    if(_rean||_nuevo){
      const keep=new URLSearchParams(); if(P.get("c")) keep.set("c",P.get("c"));   // preservamos ?c= (comercial)
      try{ history.replaceState(null,"",location.pathname+(keep.toString()?"?"+keep.toString():"")); }catch(e){}
    }
    if(_rean){ ST.view="inicio"; render(); reanudar(parseInt(_rean,10)); return; }
    if(_nuevo){ ST.view="picker"; ST.qCliente=""; render(); return; }
    ST.view="inicio"; render();
  }catch(e){
    document.getElementById("app").innerHTML='<div class="errbox"><b>No pude cargar.</b><br>'+esc(e.message)+'</div>';
  }
}

/* ============================================================
   RENDER (despacha por vista)
   ============================================================ */
function render(){
  const app=document.getElementById("app");
  if(ST.view==="inicio")  app.innerHTML = vInicio();
  else if(ST.view==="picker") { app.innerHTML = vPicker(); const i=document.getElementById("cliSearch"); if(i){ i.focus(); } }
  else if(ST.view==="lista")  app.innerHTML = vLista();
  else if(ST.view==="venta")  { app.innerHTML = vVenta(); renderGrid(); renderCart(); }
  else if(ST.view==="success") app.innerHTML = vSuccess();
}

/* ---------- INICIO: presupuestos en curso + nueva venta ---------- */
function vInicio(){
  // Más nuevo → más antiguo (la consulta ya ordena por write_date desc; reforzamos por las dudas)
  const d = (ST.drafts||[]).slice().sort((a,b)=>String(b.write_date||"").localeCompare(String(a.write_date||"")));
  const rows = d.map(o=>{
    const cli = o.partner_id ? o.partner_id[1] : "Sin cliente";
    const n = (o.order_line||[]).length;
    let f=""; if(o.write_date){ const ap=EYG.argParts(o.write_date); f=ap.date.slice(8,10)+"/"+ap.date.slice(5,7)+" "+ap.hm; }
    return `<div class="draft">
      <div class="di" onclick="reanudar(${o.id})">
        <div class="cli">${esc(cli)}</div>
        <div class="meta">${esc(o.name||"")} · ${n} producto${n===1?"":"s"}${f?" · "+f:""}</div>
      </div>
      <div class="tot">${money(o.amount_total)}</div>
      <div class="acts">
        <button class="btn teal" onclick="reanudar(${o.id})">Retomar</button>
        <button class="dbtn" title="Eliminar presupuesto" onclick="eliminarDraft(${o.id},event)">🗑</button>
      </div>
    </div>`;
  }).join("");
  return `<div class="hero"><h1>Cargar venta 🛒</h1><p>Elegí el cliente y armá el pedido desde el catálogo. Se guarda solo como presupuesto en Odoo hasta que lo confirmes.</p></div>
    <button class="btn teal big" onclick="abrirPicker()">＋ Nueva venta</button>
    ${d.length?`<div class="sect-t">Presupuestos en curso (${d.length})</div><div class="draft-list">${rows}</div>`
      :`<div class="empty" style="padding:34px 0">No tenés presupuestos en curso.</div>`}`;
}
/* Eliminar un presupuesto rápido, sin entrar. */
function eliminarDraft(id, ev){
  if(ev){ ev.stopPropagation(); }
  const o=(ST.drafts||[]).find(x=>x.id===id);
  const cli=(o&&o.partner_id)?o.partner_id[1]:"este presupuesto";
  modal(`<h3>Eliminar presupuesto</h3><p>¿Eliminar el presupuesto de <b>${esc(cli)}</b>? No se puede deshacer.</p>
    <div class="mb"><button class="btn ghost" onclick="cerrarModal()">Cancelar</button><button class="btn red" onclick="doEliminarDraft(${id})">Sí, eliminar</button></div>`);
}
async function doEliminarDraft(id){
  cerrarModal();
  try{ await rpc("sale.order","unlink",[[id]]); ST.drafts=(ST.drafts||[]).filter(x=>x.id!==id); toast("Presupuesto eliminado"); }
  catch(e){ toast("No pude eliminar"); }
  render();
}

/* ---------- PICKER de cliente ---------- */
function abrirPicker(){ ST.view="picker"; ST.qCliente=""; render(); }
window.buscarCliente = EYG.buscador(v=>{ ST.qCliente=v; renderCliList(); });
function vPicker(){
  return `<div class="hero"><h1>¿A qué cliente?</h1><p>Buscá en tu cartera por nombre.</p></div>
    <div class="picker">
      <div class="search">🔎 <input id="cliSearch" placeholder="Nombre del cliente…" value="${esc(ST.qCliente)}" oninput="buscarCliente(this.value)"></div>
      <div class="list" id="cliList"></div>
    </div>
    <div style="text-align:center;margin-top:16px"><button class="btn ghost" onclick="volverInicio()">← Cancelar</button></div>`;
}
function renderCliList(){
  const el=document.getElementById("cliList"); if(!el) return;
  const q=(ST.qCliente||"").toLowerCase().trim();
  let arr=ST.cartera;
  if(q) arr=arr.filter(c=>(c.name||"").toLowerCase().includes(q) || (c.vat||"").toLowerCase().includes(q));
  arr=arr.slice(0,60);
  if(!arr.length){ el.innerHTML='<div class="cart-empty">Sin resultados en tu cartera.</div>'; return; }
  el.innerHTML=arr.map(c=>{
    const lst = c.property_product_pricelist ? c.property_product_pricelist[1] : "";
    const sub=[c.city, lst].filter(Boolean).join(" · ");
    const rb = EYG.badgeRiesgo(ST.riesgos[c.id]&&ST.riesgos[c.id].nivel);
    return `<div class="clirow" onclick="elegirCliente(${c.id})">
      <div class="av">${esc(ini(c.name))}</div>
      <div><div class="nm">${esc(c.name||"")} ${rb}</div>${sub?`<div class="sub">${esc(sub)}</div>`:""}</div>
    </div>`;
  }).join("");
}

/* ============================================================
   ABRIR / CREAR la venta (presupuesto borrador en Odoo)
   ============================================================ */
async function elegirCliente(pid){
  const c = ST.cartera.find(x=>x.id===pid); if(!c) return;
  // ¿el cliente tiene direcciones de entrega propias (sucursales)? Odoo NO las asigna solo al crear
  // el pedido sobre la central, así que las resolvemos acá.
  document.getElementById("app").innerHTML='<div class="loading"><div class="spinner"></div>Abriendo cliente…</div>';
  const dels = await cargarEntregas(pid);
  if(dels.length===1){ await crearOrden(pid, c, dels[0]); return; }  // una sola → directo
  if(dels.length>=2){                                                // varias: si hay una marcada principal, va sola
    const ppalId = await principalDe(dels.map(d=>d.id));
    const ppal = ppalId && dels.find(d=>d.id===ppalId);
    if(ppal){ await crearOrden(pid, c, ppal); return; }             // (se puede cambiar desde el encabezado)
  }
  elegirEntrega(pid, c, dels, "create");                             // 0, ó 2+ sin principal → elegir / agregar
}

// Direcciones de entrega (sucursales) de un cliente.
async function cargarEntregas(pid){
  try{ return await rpc("res.partner","search_read",[[["parent_id","=",pid],["type","=","delivery"]]],
    {fields:["id","name","street","city"], order:"name", context:ES}); }
  catch(e){ return []; }
}
// Dirección de entrega principal entre un set de ids (marca reversible en el chatter; gana la marca "in" más reciente).
async function principalDe(delIds){
  if(!delIds || !delIds.length) return null;
  let msgs=[];
  try{ msgs = await rpc("mail.message","search_read",[[["model","=","res.partner"],["res_id","in",delIds],["body","like",PPAL_TAG]]],{fields:["res_id","body","date"],limit:0}); }catch(e){}
  const st={}, seen=new Set();
  msgs.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  for(const m of msgs){ if(seen.has(m.res_id)) continue; seen.add(m.res_id);
    const out=/salir/i.test((m.body||"").replace(/<[^>]+>/g," ")); st[m.res_id]={in:!out,date:m.date||""}; }
  let ppal=null,best="";
  for(const rid in st){ if(st[rid].in && st[rid].date>best){ best=st[rid].date; ppal=+rid; } }
  return ppal;
}

// Paso "¿a dónde entregás?": elegir una existente, agregar una nueva, o la dirección fiscal.
// mode="create" (antes de crear el pedido) | "edit" (cambiar la entrega de un pedido ya abierto)
async function elegirEntrega(pid, c, dels, mode){
  ST._entrega = {pid, c, dels, mode};
  // Dirección fiscal real (calle/localidad): se muestra bajo la opción "fiscal" para no entregar a ciegas.
  let fdir="";
  try{ const r=await rpc("res.partner","read",[[pid],["street","city"]],{context:ES}); const f=r&&r[0]; if(f) fdir=[f.street,f.city].filter(Boolean).join(", "); }catch(e){}
  const rows = (dels||[]).map((d,i)=>{
    const dir=[d.street,d.city].filter(Boolean).join(", ");
    return `<button class="btn ghost eopt" onclick="usarEntrega(${i})">📍 <span><b>${esc(d.name||"Sucursal")}</b>${dir?`<br><small>${esc(dir)}</small>`:""}</span></button>`;
  }).join("");
  const intro = (dels&&dels.length) ? "Elegí a dónde va este pedido (se factura igual a la central)."
    : "Este cliente todavía no tiene dirección de entrega. Agregá una — la dirección fiscal (del CUIT) casi nunca es la de entrega.";
  modal(`<h3>¿A dónde lo entregás?</h3>
    <p><b>${esc(c.name||"")}</b>. ${intro}</p>
    <div class="eopts">${rows}
      <button class="btn ghost eopt eadd" onclick="agregarEntrega()">＋ <span><b>Agregar dirección de entrega</b><br><small>Nueva sucursal / punto de entrega</small></span></button>
      <button class="btn ghost eopt" onclick="usarEntrega(-1)">🏢 <span><b>Entregar en la dirección fiscal</b><br><small>${fdir?esc(fdir):"La misma del CUIT"}</small></span></button>
    </div>
    <div class="mb"><button class="btn ghost" onclick="cancelarEntrega()" style="flex:1">Cancelar</button></div>`);
}
function volverElegirEntrega(){ const e=ST._entrega||{}; elegirEntrega(e.pid, e.c, e.dels, e.mode); }
function cancelarEntrega(){ cerrarModal(); if((ST._entrega||{}).mode==="create") volverInicio(); }

// eligió una existente (i>=0) o la fiscal (i=-1)
async function usarEntrega(i){
  const e=ST._entrega||{}; const ship=(i>=0 && e.dels)?e.dels[i]:null;
  cerrarModal(); await aplicarEntrega(ship);
}

// formulario para agregar una dirección de entrega nueva (se guarda como sucursal del cliente)
function agregarEntrega(){
  const e=ST._entrega||{};
  modal(`<h3>Nueva dirección de entrega</h3>
    <p>Para <b>${esc(e.c?e.c.name:"")}</b>. Se guarda como sucursal del cliente; no cambia la facturación.</p>
    <div class="eform">
      <label>Nombre / referencia</label>
      <input id="ne_name" placeholder="Ej: Depósito San Lorenzo, Sucursal Centro…">
      <label>Dirección</label>
      <input id="ne_street" placeholder="Calle y número">
      <label>Localidad</label>
      <input id="ne_city" placeholder="Ej: Rosario">
    </div>
    <div class="mb">
      <button class="btn ghost" onclick="volverElegirEntrega()" style="flex:1">← Volver</button>
      <button class="btn grn" onclick="guardarNuevaEntrega()" style="flex:1">Guardar y usar</button>
    </div>`);
  setTimeout(()=>{ const i=document.getElementById("ne_name"); if(i) i.focus(); },60);
}
async function guardarNuevaEntrega(){
  const e=ST._entrega||{};
  const val=id=>{ const el=document.getElementById(id); return el?el.value.trim():""; };
  const name=val("ne_name"), street=val("ne_street"), city=val("ne_city");
  if(!name && !street){ toast("Poné al menos un nombre o la dirección"); return; }
  cerrarModal();
  document.getElementById("app").innerHTML='<div class="loading"><div class="spinner"></div>Guardando dirección…</div>';
  try{
    const vals={parent_id:e.pid, type:"delivery", name:name||city||"Entrega"};
    if(street) vals.street=street; if(city) vals.city=city;
    const id=await rpc("res.partner","create",[vals],{context:ES});
    e.dels=(e.dels||[]).concat([{id, name:vals.name, street, city}]);   // queda disponible para próximas veces
    await aplicarEntrega({id, name:vals.name});
  }catch(err){ toast("No pude guardar la dirección"); elegirEntrega(e.pid, e.c, e.dels, e.mode); }
}

// aplica la entrega elegida según el modo (crear el pedido, o cambiarlo si ya existe)
async function aplicarEntrega(ship){
  const e=ST._entrega||{};
  if(e.mode==="edit" && ST.order){
    document.getElementById("app").innerHTML='<div class="loading"><div class="spinner"></div>Actualizando entrega…</div>';
    try{
      const shipId=ship?ship.id:e.pid;
      await rpc("sale.order","write",[[ST.order.id],{partner_shipping_id:shipId}],{context:ES});
      ST.order.shipId=shipId; ST.order.shipName=(ship && shipId!==e.pid)?ship.name:"";
      toast("📦 Entrega actualizada");
    }catch(err){ toast("No pude cambiar la entrega"); }
    ST.view="venta"; render(); return;
  }
  await crearOrden(e.pid, e.c, ship);   // mode create
}

// cambiar la entrega de un pedido ya abierto (desde el encabezado)
async function cambiarEntrega(){
  if(!ST.order) return;
  const dels=await cargarEntregas(ST.order.partnerId);
  elegirEntrega(ST.order.partnerId, {name:ST.order.partnerName}, dels, "edit");
}

async function crearOrden(pid, c, ship){
  document.getElementById("app").innerHTML='<div class="loading"><div class="spinner"></div>Creando presupuesto…</div>';
  try{
    // Crea el pedido en borrador. Odoo asigna lista de precios y vendedor a partir del cliente;
    // forzamos user_id al comercial logueado por las dudas.
    // Contexto: el conector entra como Diego (uid 520); sin esto Odoo le manda al comercial la
    // notificación "Diego te asignó un pedido". mail_auto_subscribe_no_notify la silencia
    // (el comercial igual queda de vendedor); mail_create_nolog evita el log de creación.
    const CREAR = {...ES, mail_auto_subscribe_no_notify:true, mail_create_nolog:true};
    const vals = {partner_id:pid, user_id:ST.userId};
    if(ship) vals.partner_shipping_id = ship.id;      // entregar en la sucursal, no en la central
    const id = await rpc("sale.order","create",[vals],{context:CREAR});
    let [o] = await rpc("sale.order","read",[[id]],{fields:["id","name","partner_id","partner_shipping_id","pricelist_id","payment_term_id"],context:ES});
    // Odoo a veces recalcula la entrega desde partner_id al crear: la reafirmamos SOLO si quedó distinta.
    if(ship && (!o.partner_shipping_id || o.partner_shipping_id[0]!==ship.id)){
      try{ await rpc("sale.order","write",[[id],{partner_shipping_id:ship.id}],{context:ES}); o.partner_shipping_id=[ship.id, ship.name||""]; }catch(e){}
    }
    const shipId=(o.partner_shipping_id&&o.partner_shipping_id[0])||pid;
    ST.order = {
      id:o.id, name:o.name, partnerId:pid, partnerName:(o.partner_id&&o.partner_id[1])||c.name,
      shipId, shipName:(shipId!==pid && o.partner_shipping_id)?o.partner_shipping_id[1]:"",
      pricelistId:(o.pricelist_id&&o.pricelist_id[0])||null, listName:(o.pricelist_id&&o.pricelist_id[1])||"",
      plazo:(o.payment_term_id&&o.payment_term_id[1])||plazoTxt(c),
    };
    ST.want={}; ST.lines={}; ST.amount={untaxed:0,total:0};
    await irAElegirLista();
  }catch(e){ toast("No pude crear el presupuesto"); ST.view="inicio"; render(); }
}

/* ---------- SELECTOR DE LISTA DE PRECIOS (paso previo al catálogo) ---------- */
// Listas que puede usar el comercial. Por ahora todas las activas; más adelante se filtra por comercial.
// Qué listas puede ver/elegir cada comercial (por user_id de Odoo). Default: solo Farmacias (3).
// El orden acá manda el orden en pantalla (la 1ª es la que se fuerza si el cliente tiene una no permitida).
const LISTAS_POR_USER = {
  12:  [3, 16, 5],  // German Banquero (líder)          → todas
  520: [3, 16, 5],  // Diego Velazquez (líder/conector) → todas
  215: [3, 16],     // Antonella Infanti  → Farmacias + SAMCOs y clínicas
  18:  [3, 16, 5],  // Natividad Sanchez  → todas (tiene algunos clientes de Farmacias)
  498: [3, 16, 5],  // Ruth Aguayo        → todas (ídem)
};
async function cargarListas(){
  if(ST.listas) return ST.listas;
  const permitidas = LISTAS_POR_USER[ST.userId] || [3];   // resto de comerciales: solo Farmacias
  try{
    const all = await rpc("product.pricelist","search_read",[[["id","in",permitidas],["active","=",true]]],{fields:["id","name"],context:ES});
    ST.listas = permitidas.map(id=>all.find(l=>l.id===id)).filter(Boolean);   // respeta el orden de 'permitidas'
  }
  catch(e){ ST.listas=[]; }
  return ST.listas;
}
// Va al paso de elegir lista tras crear el pedido. Si hay una sola lista, saltea directo al catálogo.
async function irAElegirLista(){
  await cargarListas();
  const listas=ST.listas||[];
  // Si la lista fijada del cliente NO está entre las permitidas del comercial, forzar la 1ª permitida.
  if(listas.length && !listas.some(l=>l.id===ST.order.pricelistId)){
    document.getElementById("app").innerHTML='<div class="loading"><div class="spinner"></div>Aplicando lista…</div>';
    await aplicarLista(listas[0].id);
  }
  if(listas.length<=1){ await entrarVenta(); return; }   // una sola opción → directo al catálogo
  ST._listaFrom="create"; ST.view="lista"; render();
}
// Reabre el selector desde el encabezado (a mitad del pedido).

// Escribe la lista en el pedido y recalcula (sin navegar). La usan el paso previo y el forzado.
async function aplicarLista(plId){
  const o=ST.order;
  if(!plId || plId===o.pricelistId) return;
  try{
    await rpc("sale.order","write",[[o.id],{pricelist_id:plId}],{context:ES});
    if(Object.keys(ST.lines||{}).length){ try{ await rpc("sale.order","action_update_prices",[[o.id]],{context:ES}); }catch(e){} }   // recalcula SOLO si ya hay líneas
    const l=(ST.listas||[]).find(x=>x.id===plId);
    o.pricelistId=plId; o.listName=l?l.name:"";
    // la caché de precios es por familia+lista (ckey), así que la lista nueva ya re-arma precios sola; los productos NO se re-bajan
  }catch(e){ toast("No pude cambiar la lista"); }
}

async function reanudar(orderId){
  document.getElementById("app").innerHTML='<div class="loading"><div class="spinner"></div>Abriendo presupuesto…</div>';
  try{
    const [o] = await rpc("sale.order","read",[[orderId]],{fields:["id","name","partner_id","partner_shipping_id","pricelist_id","payment_term_id","state"],context:ES});
    if(!o){ toast("No existe ese presupuesto"); return cargar(); }
    // draft = borrador/carrito abierto · sent = presupuesto enviado o pedido web cerrado por el cliente
    // (ambos se pueden editar y confirmar). Solo bloqueamos los ya confirmados (sale/done) o cancelados.
    if(o.state!=="draft" && o.state!=="sent"){ toast("Ese pedido ya fue confirmado"); return cargar(); }
    const pId=o.partner_id&&o.partner_id[0];
    const sId=(o.partner_shipping_id&&o.partner_shipping_id[0])||pId;
    ST.order={ id:o.id, name:o.name, partnerId:pId, partnerName:(o.partner_id&&o.partner_id[1])||"",
      shipId:sId, shipName:(sId!==pId && o.partner_shipping_id)?o.partner_shipping_id[1]:"",
      pricelistId:(o.pricelist_id&&o.pricelist_id[0])||null, listName:(o.pricelist_id&&o.pricelist_id[1])||"",
      plazo:(o.payment_term_id&&o.payment_term_id[1])||"" };
    ST.want={}; ST.lines={};

    Object.values(ST.lines).forEach(l=>{ ST.want[l.pid]=l.qty; });

// Productos en oferta = ítems de las ofertas vigentes (mismas que ve el comercial en "Combos y ofertas").
async function cargarOfertas(){
  ST.ofertaPids=new Set(); ST.ofertaTmpls=new Set(); ST.ofertaInfo={}; ST.ofertaRule={}; ST.ofertaPvp={};
  const hoy=EYG.argToday();
  try{
    // (1) eyg.ofertas: ofertas/combos confirmados. items[].id = producto (variante). Traen "precio antes".
    const raw=await rpc("ir.config_parameter","get_param",["eyg.ofertas"]);
    (JSON.parse(raw||"[]")||[]).filter(o=>o && (!o.hasta || o.hasta>=hoy)).forEach(o=>{
      (o.items||[]).forEach(i=>{ if(i&&i.id){
        ST.ofertaPids.add(i.id);
        if((o.items||[]).length===1 && o.precioAntes>0) ST.ofertaInfo[i.id]={antes:o.precioAntes, precio:o.precio};
      }});
    });
  }catch(e){}
  try{
    // (2) eyg.sync_ofertas: reglas del motor de precios. tipo 'p' → target = PLANTILLA (product.template).
    const raw2=await rpc("ir.config_parameter","get_param",["eyg.sync_ofertas"]);
    (JSON.parse(raw2||"[]")||[]).filter(o=>o && !o.pausada && (!o.hasta || o.hasta>=hoy)).forEach(o=>{
      if(o.tipo==="p" && o.target){ ST.ofertaTmpls.add(o.target); ST.ofertaRule[o.target]={modo:o.modo, valor:o.valor}; }
      // tipo 'c' (categoría entera) queda pendiente: marcar toda una familia sería demasiado amplio.
    });
  }catch(e){}
  // éticos: PVP de Alfabeta por plantilla → el "antes" tachado se muestra contra el PVP (oferta más tentadora)
  const synTmpls=[...ST.ofertaTmpls];
  if(synTmpls.length){
    try{
      const tps=await rpc("product.template","read",[synTmpls,["list_price","categ_id"]],{context:{lang:"es_AR"}});
      tps.forEach(t=>{ if(/[EÉ]TICO/i.test((t.categ_id&&t.categ_id[1])||"")) ST.ofertaPvp[t.id]=Math.round(t.list_price||0); });
    }catch(e){}
  }
  ST._ofLoaded=true;
  if(ST.view==="venta" && !ST.cargandoCat) renderGrid();   // repinta para mostrar las ofertas
}
// ¿este producto está en oferta? (por variante o por plantilla)
function esOferta(p){ return (ST.ofertaPids&&ST.ofertaPids.has(p.id)) || (ST.ofertaTmpls&&p.product_tmpl_id&&ST.ofertaTmpls.has(p.product_tmpl_id[0])); }

// Precarga en 2º plano los productos de Hospitalarios (familia por defecto) para que entrar a la venta sea instantáneo.
async function precargarCatalogo(){
  try{
    const fam=FAMILIAS.find(f=>f.k==="HOSPITALARIOS")||FAMILIAS[0];
    if(ST.prodCache[fam.k]) return;
    const prods=await rpc("product.product","search_read",[[["categ_id","child_of",fam.id],["qty_available",">",0]]],
      {fields:["id","default_code","name","categ_id","product_tmpl_id","qty_available","list_price"],context:ES,order:"name",limit:200});
    ST.prodCache[fam.k]=prods;
    cargarLotes(prods);   // y los vencimientos de esos productos
  }catch(e){}
}
// BÚSQUEDA DE PRODUCTOS con el mismo motor que el buscador del portal (buscar_web, pg_trgm en Supabase):
// rápida y DIFUSA por palabra → "ibu 600" trae IBUPROFENO 600, "taf 1g" trae TAFIROL 1 g, tolera tipeo y busca por droga.
// FLUJO EN 2 PASOS para que se sienta igual de rápido que la web:
//  (1) buscar_web devuelve al instante (Postgres) los productos que matchean → se PINTAN ya (nombre+foto).
//  (2) recién ahí pedimos a Odoo las variantes de SÓLO esas plantillas (por id) + precios de la lista, y repintamos.
// buscar_web devuelve ids de PLANTILLA; Odoo trae las variantes por product_tmpl_id (indexado = instantáneo).
async function buscarWebRows(q){
  const {data,error}=await EYG.supa().rpc("buscar_web",{q, lim:40});
  if(error) throw error;
  return data||[];
}
async function variantesDeRows(rows){
  const tmplIds=[...new Set(rows.map(f=>f.id).filter(Boolean))];
  if(!tmplIds.length) return [];
  const rank={}; tmplIds.forEach((id,i)=>{ rank[id]=i; });   // orden de relevancia que ya calculó buscar_web
  const prods=await rpc("product.product","search_read",
    [[["product_tmpl_id","in",tmplIds]]],
    {fields:["id","default_code","name","categ_id","product_tmpl_id","qty_available","list_price"], context:ES, limit:200});
  const conStock=prods.filter(p=>(p.qty_available||0)>0);   // sólo con stock (como el catálogo)
  conStock.sort((a,b)=>{
    const ra=rank[a.product_tmpl_id&&a.product_tmpl_id[0]] ?? 1e9, rb=rank[b.product_tmpl_id&&b.product_tmpl_id[0]] ?? 1e9;
    return ra-rb || (a.name||"").localeCompare(b.name||"");
  });
  return conStock;
}
// Vista previa INSTANTÁNEA con lo que ya trajo buscar_web (nombre + foto de la plantilla + código),
// mientras Odoo completa precio/stock/variante en 2º plano. La foto usa product.template (aún no hay variante).
function renderPreview(rows){
  const el=document.getElementById("gridWrap"); if(!el) return;
  ST.cargandoCat=false;
  el.innerHTML='<div class="rows">'+rows.slice(0,40).map(r=>`
    <div class="rprod pre">
      <img class="thumb" loading="lazy" decoding="async" alt="" src="${ODOO_BASE}/web/image/product.template/${r.id}/image_128" onerror="imgFallback(this)">
      <div class="rinfo"><div class="pn">${esc(r.nombre||"")}</div>
        <div class="pm">${r.codigo?("["+esc(r.codigo)+"] "):""}${esc(r.categoria||"")}</div></div>
      <div class="rright"><div class="pre-load"><span class="pspin"></span>precio y stock…</div></div>
    </div>`).join("")+'</div>';
}
// Respaldo: la búsqueda vieja en Odoo (name/código contiene). Sólo se usa si buscar_web falla.
async function buscarProductosOdoo(q){
  const rootsOr=[];
  for(let i=0;i<CATALOG_ROOTS.length-1;i++) rootsOr.push("|");
  CATALOG_ROOTS.forEach(id=>rootsOr.push(["categ_id","child_of",id]));
  const dom=["&","&",["qty_available",">",0],"|",["name","ilike",q],["default_code","ilike",q]].concat(rootsOr);
  return await rpc("product.product","search_read",[dom],
    {fields:["id","default_code","name","categ_id","product_tmpl_id","qty_available","list_price"], context:ES, order:"name", limit:200});
}
async function cargarCatalogo(){
  const token=(ST._catToken=(ST._catToken||0)+1);
  desconectarIO();
  cargarComprometido();   // refresca (throttle 45s) el comprometido para el disponible; no bloquea el render
  const q=(ST.qProd||"").trim();
  const key = q ? null : ST.fam;                  // solo cacheamos las familias (no las búsquedas)
  const cacheable = !!key && ST.fam!=="OFERTAS";  // familias reales (no búsqueda ni ofertas)
  const plId = ST.order && ST.order.pricelistId;
  const ckey = cacheable ? (key+"|"+plId) : null; // caché por familia+lista (los precios dependen de la lista)
  // Caché completa (productos + precios de esta lista) → INSTANTÁNEO.
  if(ckey && ST.catCache[ckey]){
    const c=ST.catCache[ckey]; ST.prods=c.prods; ST.precios=c.precios; ST.tiers=c.tiers;
    ST.cargandoCat=false; renderGrid(); cargarLotes(ST.prods);
    return;
  }
  ST.cargandoCat=true; renderGrid();
  try{
    let prods;
    if(cacheable && ST.prodCache[key]){ prods=ST.prodCache[key]; }   // productos ya cargados (no cambian con la lista)
    else if(q){
      // Búsqueda rápida y difusa con buscar_web. No se cachea (varía por texto).
      // (1) traer las filas del índice (instantáneo) y PINTAR ya; (2) enriquecer con Odoo.
      let rows;
      try{ rows = await buscarWebRows(q); }
      catch(e){ prods = await buscarProductosOdoo(q); }   // si el índice no responde, modo viejo
      if(token!==ST._catToken) return;
      if(rows){
        if(!rows.length){ prods = []; }
        else { renderPreview(rows); prods = await variantesDeRows(rows); }
        if(token!==ST._catToken) return;
      }
    }
    else { let dom;
    if(ST.fam==="OFERTAS"){
      if(!ST._ofLoaded) await cargarOfertas();
      const pids=[...ST.ofertaPids], tmpls=[...ST.ofertaTmpls];
      if(!pids.length && !tmpls.length){ ST.prods=[]; ST.precios={}; ST.tiers={}; if(token===ST._catToken){ST.cargandoCat=false; renderGrid();} return; }
      const orPart = (pids.length&&tmpls.length) ? ["|",["id","in",pids],["product_tmpl_id","in",tmpls]]
                    : (pids.length ? [["id","in",pids]] : [["product_tmpl_id","in",tmpls]]);
      dom=["&",["qty_available",">",0]].concat(orPart);
    }else{
      const fam=FAMILIAS.find(f=>f.k===ST.fam)||FAMILIAS[0];
      dom=[["categ_id","child_of",fam.id],["qty_available",">",0]];
    }
    prods = await rpc("product.product","search_read",[dom],
      {fields:["id","default_code","name","categ_id","product_tmpl_id","qty_available","list_price"], context:ES, order:"name", limit:200});
    if(token!==ST._catToken) return;              // el usuario cambió de familia/búsqueda: descartamos
    if(cacheable) ST.prodCache[key]=prods;
    }
    ST.prods=prods;
    await cargarPrecios(prods);
    cargarLotes(prods);          // vencimientos en paralelo (no bloquea el catálogo; repinta al llegar)
    if(token!==ST._catToken) return;
    if(ckey) ST.catCache[ckey]={prods:ST.prods, precios:ST.precios, tiers:ST.tiers};
  }catch(e){ ST.prods=[]; toast("No pude leer el catálogo"); }
  if(token!==ST._catToken) return;
  ST.cargandoCat=false; renderGrid();
}

// Escalera de precios de la lista del cliente por producto: ST.tiers[pid]=[{q,p}] (cantidad→precio).
// El precio EXACTO lo pone Odoo al agregar la línea (fuente de verdad, se ve en el carrito).
async function cargarPrecios(prods){
  ST.precios={}; ST.tiers={};
  prods.forEach(p=>{ if(p.qty_available!=null) ST.fisico[p.id]=p.qty_available; });   // stock físico para el disponible
  if(!ST.order.pricelistId || !prods.length){ prods.forEach(p=>{ ST.precios[p.id]=(p.list_price>1?p.list_price:null); }); return; }
  const tmpls=[...new Set(prods.map(p=>p.product_tmpl_id&&p.product_tmpl_id[0]).filter(Boolean))];
  const vids=prods.map(p=>p.id);
  let items=[];
  try{
    // Farmacias usa ítems por PLANTILLA (1_product, con escalera); tier 2/3 usan ítems por VARIANTE
    // (0_product_variant, precio único). Traemos las dos formas en una sola query.
    items=await rpc("product.pricelist.item","search_read",
      [["&",["pricelist_id","=",ST.order.pricelistId],"|",
         "&",["applied_on","=","1_product"],["product_tmpl_id","in",tmpls],
         "&",["applied_on","=","0_product_variant"],["product_id","in",vids]]],
      {fields:["product_tmpl_id","product_id","applied_on","min_quantity","fixed_price","compute_price"], limit:20000});
  }catch(e){}
  const porT={}, porV={};
  items.forEach(it=>{
    if(it.applied_on==="0_product_variant" && it.product_id){ (porV[it.product_id[0]]=porV[it.product_id[0]]||[]).push(it); }
    else if(it.product_tmpl_id){ (porT[it.product_tmpl_id[0]]=porT[it.product_tmpl_id[0]]||[]).push(it); }
  });
  prods.forEach(p=>{
    const t=p.product_tmpl_id&&p.product_tmpl_id[0];
    // el ítem por variante (tier 2/3) manda sobre el de plantilla si existe
    const src=(porV[p.id]&&porV[p.id].length) ? porV[p.id] : (porT[t]||[]);
    let arr=src.filter(i=>i.compute_price==="fixed"&&i.fixed_price>0)
      .map(i=>({q:i.min_quantity||1, p:i.fixed_price})).sort((a,b)=>a.q-b.q);
    // Quirk EyG: el 1er tramo (min≤1) que DUPLICA el precio del 2do es el "precio general" oculto → se fusiona.
    if(arr.length>=2 && arr[0].q<=1 && Math.round(arr[0].p)===Math.round(arr[1].p)){ arr=arr.slice(1); arr[0]={...arr[0], q:1}; }
    if(arr.length && arr[0].q<1) arr[0]={...arr[0], q:1};
    ST.tiers[p.id]=arr;
    ST.precios[p.id] = arr.length ? arr[0].p : (p.list_price>1?p.list_price:null);
    if(ST.precios[p.id]!=null) ST.baseUnit[p.id]=ST.precios[p.id];   // base sin descuento (para tier 2)
  });
}

// Lotes con stock y su vencimiento por producto (el vendedor informa al cliente si algo está corto de vto).
async function cargarLotes(prods){
  try{
    ST._lotesDone = ST._lotesDone || new Set();
    const pids=prods.map(p=>p.id).filter(id=>!ST._lotesDone.has(id));   // no re-consultar los ya traídos
    if(!pids.length) return;
    pids.forEach(id=>ST._lotesDone.add(id));
    const lots=await rpc("stock.lot","search_read",[[["product_id","in",pids],["product_qty",">",0]],["product_id","name","expiration_date","product_qty"]],{limit:5000});
    const by={};
    lots.forEach(l=>{ if(!l.product_id) return; const pid=l.product_id[0]; (by[pid]=by[pid]||[]).push({n:l.name||"", exp:(l.expiration_date||"").slice(0,10), qty:l.product_qty||0}); });
    Object.keys(by).forEach(pid=>{ by[pid].sort((a,b)=>(a.exp||"9999").localeCompare(b.exp||"9999")); });
    ST.lotes=Object.assign(ST.lotes||{}, by);
    if(ST.view==="venta" && !ST.cargandoCat) renderGrid();
  }catch(e){}
}
function fmtVto(d){ if(!d) return "—"; const p=d.split("-"); return p.length===3 ? (p[2]+"/"+p[1]+"/"+p[0].slice(2)) : d; }
function diasHasta(d){ if(!d) return 99999; try{ const t=new Date(d+"T00:00:00"), h=new Date(EYG.argToday()+"T00:00:00"); return Math.round((t-h)/86400000); }catch(e){ return 99999; } }
/* ---------- DISPONIBLE = físico − comprometido (confirmado sin entregar) ----------
   El comprometido son las unidades de pedidos YA CONFIRMADOS con entrega pendiente/parcial:
   están vendidas aunque sigan en el depósito, así que NO se pueden vender de nuevo.
   Un presupuesto (borrador) NO cuenta. */
// Un pedido confirmado compromete stock por DIAS_COMPROMISO días. Pasado ese plazo sin entregar,
// se libera solo (el stock vuelve a estar disponible) y logística/el comercial deben revisarlo.
const DIAS_COMPROMISO = 10;
function cutoffCompromiso(){ return new Date(Date.now()-DIAS_COMPROMISO*86400000).toISOString().slice(0,19).replace("T"," "); }
async function cargarComprometido(force){
  const now=Date.now();
  if(!force && ST._compTs && (now-ST._compTs)<45000) return;   // throttle: no reconsultar tan seguido
  try{
    const g=await rpc("sale.order.line","read_group",
      [[["order_id.state","=","sale"],["order_id.delivery_status","in",["pending","partial"]],["order_id.date_order",">=",cutoffCompromiso()]],
       ["product_uom_qty:sum","qty_delivered:sum"],["product_id"]],{lazy:false,limit:5000,context:ES});
    const m={};
    for(const r of g){ if(!r.product_id) continue; const c=(r.product_uom_qty||0)-(r.qty_delivered||0); if(c>0.001) m[r.product_id[0]]=c; }
    ST.comprometido=m; ST._compTs=now;
    if(ST.view==="venta" && !ST.cargandoCat) renderGrid();   // repinta badges/botones con el disponible real
  }catch(e){}
}
function compDe(pid){ return ST.comprometido[pid]||0; }
function fisicoDe(pid){ const v=ST.fisico[pid]; if(v!=null) return v; const p=(ST.prods||[]).find(x=>x.id==pid); return p?(p.qty_available||0):0; }
function dispDe(pid){ return Math.round((fisicoDe(pid)-compDe(pid))*100)/100; }        // puede ser negativo
function dispP(p){ return Math.round(((p.qty_available||0)-compDe(p.id))*100)/100; }

// badge de stock: muestra el DISPONIBLE (no el físico). Si está comprometido, avisa.
function stockHtml(p){
  const disp=dispP(p), cmp=compDe(p.id);
  const ls=(ST.lotes&&ST.lotes[p.id])||null; const has=ls&&ls.length;
  const vto=(has&&ls[0].exp) ? `<span class="vto ${diasHasta(ls[0].exp)<180?'corto':''}">⏳ ${fmtVto(ls[0].exp)}</span>` : "";
  const cmpTxt = cmp>0 ? ` <span class="cmp" title="${Math.round(cmp)} u ya comprometidas a pedidos confirmados sin entregar">🔒 ${Math.round(cmp)} comprom.</span>` : "";
  if(disp<=0){
    return `<span class="stk out" title="En depósito hay ${Math.round(p.qty_available||0)} u, pero están comprometidas a pedidos ya confirmados. No se pueden vender de nuevo.">⛔ sin stock disponible</span>${cmpTxt}${vto}`;
  }
  return `<span class="stk ${disp<10?"low":""}${has?" tap":""}" ${has?`onclick="verLotes(${p.id},event)"`:""}>${disp<10?"⚠ ":"✓ "}${Math.round(disp)} disp.${has?" ▾":""}</span>${cmpTxt}${vto}`;
}
// popup con los lotes y vencimientos, resaltando el más viejo
window.verLotes=(pid,ev)=>{
  if(ev){ ev.stopPropagation(); }

      <div class="ld"><span class="lvto ${corto?'corto':''}">${l.exp?fmtVto(l.exp):"sin vto"}</span><span class="lq">${Math.round(l.qty)} u</span></div>

// ---- helpers de escalera ----
// tramo que aplica a la cantidad q (el de mayor min_quantity <= q)
function tramoDe(pid,q){ const t=ST.tiers[pid]||[]; let r=t[0]||null; for(const x of t){ if(x.q<=Math.max(1,q)) r=x; } return r; }
// % de descuento SOBRE EL PVP (como la web): base = list_price (PVP Alfabeta en éticos). Si el
// producto no tiene PVP real (hospitalarios, list_price 0/1) usamos el 1er tramo de la lista.
function descPct(pid,tier){ const t=ST.tiers[pid]||[]; if(!t.length||!tier) return 0; const pvp=(ST.pvp&&ST.pvp[pid])||0; const base=pvp>1?pvp:t[0].p; return base>0?Math.round((1-tier.p/base)*100):0; }
// próximo tramo con mejor precio a partir de q → {need, tier, pct}
function proxTramo(pid,q){ const t=ST.tiers[pid]||[]; const cur=tramoDe(pid,q); for(const x of t){ if(x.q>Math.max(1,q) && (!cur||x.p<cur.p)){ return {need:x.q-Math.max(0,q), tier:x, pct:descPct(pid,x)}; } } return null; }
// precio normal (para tacharlo) de un producto en oferta. El precio ACTUAL (cur) es el de oferta.
//  1) eyg.ofertas trae el "antes" explícito por variante (lo más fiable).
//  2) motor de precios (sync) por plantilla: revertimos el descuento sobre el precio actual.
function precioNormal(p, cur){
  const oi=ST.ofertaInfo&&ST.ofertaInfo[p.id];
  if(oi && oi.antes>cur) return oi.antes;
  const tmpl=p.product_tmpl_id && p.product_tmpl_id[0];
  // éticos: el "antes" es el PVP de Alfabeta (más tentador que revertir la escalera)
  const pvp=tmpl && ST.ofertaPvp && ST.ofertaPvp[tmpl];
  if(pvp>cur) return pvp;
  const r=tmpl && ST.ofertaRule[tmpl];
  if(r && cur>0){
    if(r.modo==="pct"   && r.valor>0 && r.valor<1) return cur/(1-r.valor);  // −X% → normal = actual/(1−X)
    if(r.modo==="monto" && r.valor>0)              return cur+r.valor;       // −$ fijo → normal = actual+$
    // modo 'precio': el valor ES el precio de oferta; no tenemos el normal → sin tachado
  }
  return null;
}
// precio de la tarjeta: si es oferta, muestra el precio normal tachado + el actual en coral
function precioHtml(p, pr, oferta){
  const cur = pr!=null ? pr : ((ST.ofertaInfo[p.id]||{}).precio ?? null);
  if(cur==null) return `<div class="pr">precio al agregar</div>`;
  const antes = oferta ? precioNormal(p, cur) : null;
  if(antes && antes>cur)
    return `<div class="pr of"><span class="pr-old">${money(antes)}</span>${money(cur)}<small> c/u</small></div>`;
  return `<div class="pr ${oferta?"of":""}">${money(cur)}<small> c/u</small></div>`;
}
// escalera: los tramos de descuento en una línea limpia (slot siempre presente para alinear)
function escHtml(pid){
  const t=ST.tiers[pid]||[]; if(t.length<2) return '<div class="esc"></div>';
  // Si el 1er tramo ya trae descuento sobre PVP (éticos), lo mostramos (como la web). Si no
  // (hospitalarios: el 1er tramo ES la base), arrancamos en el 2do para no mostrar un −0%.
  const start = descPct(pid,t[0])>0 ? 0 : 1;
  const segs=t.slice(start,start+3).map(x=>`<span class="tg"><i>x${x.q}</i> <b>−${descPct(pid,x)}%</b></span>`).join("");
  return `<div class="esc" title="Descuentos sobre el PVP">${segs}</div>`;
}
// aviso de salto de tramo
function hintHtml(pid,q){
  if(!(q>0)) return "";
  const nx=proxTramo(pid,q); if(!nx) return "";
  return `<div class="nextd">＋${nx.need} u → ${money(nx.tier.p)} c/u${nx.pct>0?` (−${nx.pct}%)`:""}</div>`;
}

function renderGrid(){
  const el=document.getElementById("gridWrap"); if(!el) return;
  if(ST.cargandoCat){ el.innerHTML='<div class="loading"><div class="spinner"></div>Leyendo catálogo…</div>'; return; }
  // El comercial SÓLO ve lo DISPONIBLE (físico − comprometido > 0). Lo comprometido/sin stock
  // no aparece en el catálogo: se pide por Reposición ("📋 Falta sin stock" o el buscador).
  const vis = ST.prods.filter(p=>dispDe(p.id)>0);
  if(!vis.length){
    const hayComprometido = ST.prods.length>0;   // había productos pero todos sin disponible
    el.innerHTML='<div class="empty">'+(ST.qProd
      ? `No encontré productos <b>con stock disponible</b> con ese nombre.<br><br>Si el cliente lo necesita igual, pedilo a reposición:<br><br><button class="btn gold" onclick="dejarPendiente('${esc((ST.qProd||"").replace(/'/g,""))}')">📋 Pedir reposición</button>`
      : hayComprometido
        ? `Estos productos están <b>sin stock disponible</b> (comprometidos a pedidos ya confirmados), por eso no aparecen. Si el cliente los necesita, pedilos a reposición.<br><br><button class="btn gold" onclick="dejarPendiente()">📋 Pedir reposición</button>`
        : (ST.fam==="OFERTAS"?"No hay ofertas vigentes con stock por ahora.":"No hay productos con stock disponible en esta familia."))+'</div>';
    return;
  }
  // PVP por producto (list_price): en éticos = PVP Alfabeta. Base para mostrar el descuento como en la web.
  ST.pvp={}; vis.forEach(p=>{ ST.pvp[p.id]=p.list_price||0; });
  const cuerpo = ST.vista==="grilla"
    ? '<div class="grid">'+vis.map(cardProd).join("")+'</div>'
    : '<div class="rows">'+vis.map(rowProd).join("")+'</div>';
  el.innerHTML = cuerpo +
    (ST.prods.length>=200?'<div style="text-align:center;color:var(--gris2);font-size:12px;padding:0 0 16px">Mostrando los primeros 200. Afiná con el buscador.</div>':"");
  // imágenes: <img loading="lazy" src="/web/image/..."> directo (ver thumbHtml), fuera del canal RPC
}
// ---- vista FILAS: foto + info a la izquierda, precio/escalera al centro, stepper a la derecha ----
function rowProd(p){
  const q=ST.want[p.id]||0;
  const pr=ST.precios[p.id];
  const stk=p.qty_available||0;
  const oferta=esOferta(p);
  return `<div class="rprod ${q>0?"incart":""} ${oferta?"oferta":""}" id="prod-${p.id}">
    ${thumbHtml(p)}
    <div class="rinfo">
      <div class="pn">${esc(p.name)}</div>
      <div class="pm">${p.default_code?("["+esc(p.default_code)+"] "):""}${esc(catCorta(p.categ_id&&p.categ_id[1]))}</div>
      <div class="rmeta">${stockHtml(p)}${escHtml(p.id)}</div>
    </div>
    <div class="rright">
      ${precioHtml(p, pr, oferta)}
      <div id="dyn-${p.id}">${dynHtml(p.id,q)}</div>
    </div>
  </div>`;
}
function thumbHtml(p){
  // Imagen DIRECTA del controlador de Odoo (/web/image): NO pasa por el canal RPC/edge, así que
  // no gasta los turnos del límite global ni compite con las consultas de datos; la cachea el
  // navegador (ETag/304). loading="lazy" baja solo las visibles. Si falla, cae a 📦.
  // Ver [[eyg-odoo-carga-performance]].
  return `<img class="thumb" loading="lazy" decoding="async" alt="" src="${ODOO_BASE}/web/image/product.product/${p.id}/image_128" onerror="imgFallback(this)">`;
}
function imgFallback(im){ const d=document.createElement("div"); d.className="thumb ph"; d.textContent="📦"; try{ im.replaceWith(d); }catch(e){} }
function cardProd(p){
  const q=ST.want[p.id]||0;
  const pr=ST.precios[p.id];
  const stk=p.qty_available||0;
  const oferta=esOferta(p);
  return `<div class="prod ${q>0?"incart":""} ${oferta?"oferta":""}" id="prod-${p.id}">
    <div class="top">
      ${thumbHtml(p)}
      <div class="ti">
        <div class="pn">${esc(p.name)}</div>
        <div class="pm">${p.default_code?("["+esc(p.default_code)+"] "):""}${esc(catCorta(p.categ_id&&p.categ_id[1]))}</div>
        <div class="stkline">${stockHtml(p)}</div>
      </div>
    </div>
    <div class="foot">
      ${precioHtml(p, pr, oferta)}
      ${escHtml(p.id)}
      <div id="dyn-${p.id}">${dynHtml(p.id,q)}</div>
    </div>
  </div>`;
}
// parte dinámica de la tarjeta (aviso de tramo + botón/stepper), depende de la cantidad
function dynHtml(pid,q){
  const disp=dispDe(pid);
  // Sin stock disponible: NO se puede vender ni cotizar. El único camino es pedirlo a reposición.
  if(disp<=0 && !(q>0)) return `<div class="add"><button class="plus repo" onclick="reponerProd(${pid})" title="Sin stock disponible: no se puede vender. Cargalo a la lista de reposición.">📋 Pedir reposición</button></div>`;
  return hintHtml(pid,q)+
    `<div class="add">${q>0?stepper(pid,q):`<button class="plus" onclick="addProd(${pid})">＋ Agregar</button>`}</div>`;
}
function stepper(pid,q){
  return `<div class="stepper">
    <button onclick="chgQty(${pid},-1)">−</button>
    <input type="number" inputmode="numeric" min="0" value="${q}" onfocus="this.select()" onclick="this.select()" onchange="setQty(${pid},this.value)">
    <button onclick="chgQty(${pid},1)">＋</button>
  </div>`;
}

/* Imágenes PEREZOSAS: solo se bajan las fotos de las tarjetas que entran en pantalla
   (IntersectionObserver). El grid aparece al instante y no gastamos datos en productos
   que el comercial ni ve. Las que ya se bajaron quedan cacheadas en ST.imgs. */
let _io=null, _imgQ=new Set(), _imgT=null;
function desconectarIO(){ if(_io){ _io.disconnect(); _io=null; } }
function observarImagenes(){
  desconectarIO();
  const phs=document.querySelectorAll(".thumb.ph[data-pid]");
  if(!phs.length) return;
  if(!("IntersectionObserver" in window)){ encolarImagenes([...phs].map(el=>+el.dataset.pid)); return; }
  _io=new IntersectionObserver((entries)=>{
    const ids=[];
    entries.forEach(e=>{ if(e.isIntersecting){ const id=+e.target.dataset.pid; if(id) ids.push(id); _io.unobserve(e.target); } });
    if(ids.length) encolarImagenes(ids);
  }, {rootMargin:"350px"});
  phs.forEach(el=>{ if(ST.imgs[+el.dataset.pid]===undefined) _io.observe(el); });
}
function encolarImagenes(ids){ ids.forEach(i=>{ if(ST.imgs[i]===undefined) _imgQ.add(i); }); clearTimeout(_imgT); _imgT=setTimeout(flushImagenes,120); }
async function flushImagenes(){
  const ids=[..._imgQ]; _imgQ.clear();
  if(!ids.length) return;
  const token=ST._catToken;
  for(let i=0;i<ids.length;i+=30){
    if(token!==ST._catToken) return;
    const lote=ids.slice(i,i+30);
    let rows=[];
    try{ rows=await rpc("product.product","read",[lote],{fields:["id","image_128"]}); }catch(e){ continue; }
    const map={}; rows.forEach(r=>{ map[r.id]=r.image_128||false; });
    lote.forEach(id=>{ ST.imgs[id]=(map[id]!==undefined?map[id]:false); pintarImagen(id); });
  }
}
function pintarImagen(id){
  const el=document.getElementById("img-"+id); if(!el) return;
  const val=ST.imgs[id];
  if(val){ const im=document.createElement("img"); im.className="thumb"; im.id="img-"+id; im.src="data:image/png;base64,"+val; im.alt=""; el.replaceWith(im); }
  else { el.textContent="📦"; }
}

/* ---------- alta/baja de cantidades (optimista + sync a Odoo) ---------- */
// Aviso (no bloqueo) al pasarse del disponible: el presupuesto puede excederlo, pero al CONFIRMAR se bloquea.
function _avisarTope(pid,n){
  const t=dispDe(pid);
  if(t<=0) toast("Sin stock disponible: está comprometido a pedidos confirmados. Podés dejarlo en presupuesto, pero no vas a poder confirmarlo.",true);
  else if(n>t) toast(`Ojo: solo hay ${Math.round(t)} disponibles (el resto está comprometido). Podés presupuestarlo, pero al confirmar te va a frenar.`,true);
}
function addProd(pid){ if(dispDe(pid)<=0){ reponerProd(pid); return; }  /* sin stock: no cotiza, va a reposición */ ST.want[pid]=(ST.want[pid]||0)+1; _avisarTope(pid,ST.want[pid]); refrescarCelda(pid); marcarDirty(); }
function chgQty(pid,d){ ST.want[pid]=Math.max(0,(ST.want[pid]||0)+d); if(ST.want[pid]===0) delete ST.want[pid]; else if(d>0) _avisarTope(pid,ST.want[pid]); refrescarCelda(pid); marcarDirty(); }
function setQty(pid,v){ let n=Math.max(0,Math.floor(+v||0)); if(n===0) delete ST.want[pid]; else { ST.want[pid]=n; _avisarTope(pid,n); } refrescarCelda(pid); marcarDirty(); }

/* ---------- descuento comercial (SOLO tier 2): va al PRECIO UNITARIO, nunca a la columna descuento ---------- */
function esTier2(){ return !!(ST.order && ST.order.pricelistId===TIER2_LIST); }
function chgDesc(pid,d){
  let n=Math.max(0, Math.min(ST.maxDescT2||5, (ST.desc[pid]||0)+d));
  n=Math.round(n*10)/10;
  if(n>0) ST.desc[pid]=n; else delete ST.desc[pid];
  renderCart(); marcarDirty();
}
async function cargarMaxDescT2(){
  try{
    const raw=await rpc("ir.config_parameter","get_param",["eyg.t2_precios_config"]);
    const g=(raw?JSON.parse(raw):{}).global||{};
    const margen=(g.margen!=null?g.margen:0.20), piso=(g.pisoduro!=null?g.pisoduro:0.15);
    // el descuento no puede perforar el piso de margen: desc <= 1-(1-margen)/(1-piso)
    const capPiso=(piso<1)?(1-(1-margen)/(1-piso)):0;
    ST.maxDescT2=Math.max(0, Math.min(5, Math.floor(capPiso*1000)/10));   // tope de negocio 5%, acotado por el piso
  }catch(e){ ST.maxDescT2=5; }
}
// Aplica el descuento al PRECIO UNITARIO de cada línea (después de sincronizar cantidades, que resetean el precio).
async function aplicarDescuentos(){
  if(!esTier2()) return;
  const cambios=[];
  for(const pid of Object.keys(ST.lines)){
    const l=ST.lines[pid]; if(!l) continue;
    const base=(ST.baseUnit[pid]!=null)?ST.baseUnit[pid]:l.price_unit;
    const disc=Math.max(0, Math.min(ST.maxDescT2||5, ST.desc[pid]||0));
    const target=Math.round(base*(1-disc/100)*100)/100;
    if(Math.abs((l.price_unit||0)-target)>0.005 || (l.discount||0)!==0) cambios.push({id:l.lineId, price_unit:target});
  }
  if(cambios.length){
    for(const c of cambios){ await rpc("sale.order.line","write",[[c.id],{price_unit:c.price_unit,discount:0}],{context:ES}); }
    await refrescarLineas();
  }
}
// Al reanudar un presupuesto tier 2: reconstruye el % de descuento comparando el precio de la línea con el base de la lista.
async function derivarDescuentos(){
  const pids=Object.keys(ST.lines).map(Number); if(!pids.length) return;
  try{
    const items=await rpc("product.pricelist.item","search_read",[[["pricelist_id","=",ST.order.pricelistId],["applied_on","=","0_product_variant"],["product_id","in",pids]],["product_id","fixed_price"]],{limit:20000});
    const baseByPid={}; items.forEach(it=>{ if(it.product_id&&it.fixed_price>0) baseByPid[it.product_id[0]]=it.fixed_price; });
    Object.keys(ST.lines).forEach(pid=>{
      const l=ST.lines[pid], base=baseByPid[pid];
      if(base){ ST.baseUnit[pid]=base;
        const d=Math.round((1-(l.price_unit||base)/base)*1000)/10;
        if(d>0.05) ST.desc[pid]=Math.min(ST.maxDescT2||5, d); }
    });
  }catch(e){}
}

function refrescarCelda(pid){
  const dyn=document.getElementById("dyn-"+pid); const card=document.getElementById("prod-"+pid);
  const q=ST.want[pid]||0;
  if(dyn) dyn.innerHTML = dynHtml(pid,q);
  if(card) card.classList.toggle("incart",q>0);
  renderCartBadge();
}
function marcarDirty(){ ST.dirty=true; renderCartBadge(); syncSoon(); }

let _syncT=null;
function syncSoon(){ clearTimeout(_syncT); _syncT=setTimeout(syncOrder, 600); }

async function syncOrder(){
  if(!ST.order) return;
  if(ST.syncing){ syncSoon(); return; }
  ST.syncing=true; ST.dirty=false; renderCartBadge();
  try{
    const cmds=[];
    // altas y cambios
    for(const pid of Object.keys(ST.want)){
      const q=ST.want[pid]; const l=ST.lines[pid];
      if(q>0 && !l) cmds.push([0,0,{product_id:+pid, product_uom_qty:q}]);
      else if(q>0 && l && l.qty!==q) cmds.push([1,l.lineId,{product_uom_qty:q}]);
    }
    // bajas: líneas en Odoo que ya no están (o quedaron en 0)
    for(const pid of Object.keys(ST.lines)){
      if(!(ST.want[pid]>0)) cmds.push([2, ST.lines[pid].lineId]);
    }
    if(cmds.length){
      await rpc("sale.order","write",[[ST.order.id],{order_line:cmds}],{context:ES});
      await refrescarLineas();
    }
    await aplicarDescuentos();   // tier 2: baja el precio unitario según el descuento comercial

// Re-lee físico + comprometido FRESCOS de los productos del carrito y devuelve los que se pasan del disponible.
async function chequearDisponibilidad(){
  const pids=Object.keys(ST.want).filter(p=>ST.want[p]>0).map(Number);
  if(!pids.length) return null;
  const g=await rpc("sale.order.line","read_group",
    [[["product_id","in",pids],["order_id.state","=","sale"],["order_id.delivery_status","in",["pending","partial"]],["order_id.date_order",">=",cutoffCompromiso()]],
     ["product_uom_qty:sum","qty_delivered:sum"],["product_id"]],{lazy:false,context:ES});
  const comp={}; for(const r of g){ if(r.product_id) comp[r.product_id[0]]=Math.max(0,(r.product_uom_qty||0)-(r.qty_delivered||0)); }
  const prods=await rpc("product.product","read",[pids,["qty_available","name"]],{context:ES});
  const P={}; prods.forEach(p=>{ P[p.id]=p; ST.fisico[p.id]=p.qty_available||0; });
  ST.comprometido=Object.assign({},ST.comprometido,comp); ST._compTs=Date.now();
  const falt=[];
  for(const pid of pids){
    const disp=Math.round(((P[pid]&&P[pid].qty_available)||0)-(comp[pid]||0));
    if(ST.want[pid]>disp) falt.push({name:(P[pid]&&P[pid].name)||("#"+pid), quiere:ST.want[pid], disp:Math.max(0,disp)});
  }
  return falt.length?falt:null;
}

  const yo=COMERCIAL, email=(ST.perfil&&ST.perfil.email)||null, sb=EYG.supa();
  try{
    // ¿ya hay una orden de reposición ABIERTA para este producto? → sumo. Si no, la creo.
    let {data:ex}=await sb.from("reposicion_orden").select("id").eq("producto_id",p.id).eq("estado","abierta").limit(1);
    let ordenId, nueva=false;
    if(ex&&ex.length){ ordenId=ex[0].id; }
    else{
      const {data:ins,error:e1}=await sb.from("reposicion_orden").insert([{producto_id:p.id,producto_codigo:p.default_code||"",producto_nombre:_limpiaNom(p.name),estado:"abierta",creada_por:yo,creada_email:email}]).select("id");
      if(e1) throw e1; ordenId=ins[0].id; nueva=true;
    }
    const {error:e2}=await sb.from("reposicion_linea").insert([{orden_id:ordenId,comercial:yo,comercial_email:email,cliente_id:ST.order.partnerId,cliente_nombre:ST.order.partnerName,cantidad:cant,nota:nota||null}]);
    if(e2) throw e2;
    await sb.from("reposicion_log").insert([{orden_id:ordenId,accion:(nueva?"crear":"agregar"),por:yo,por_email:email,detalle:`${cant} u para ${ST.order.partnerName||""}`}]);
    await sb.from("reposicion_orden").update({ult_mod_por:yo,ult_mod_ts:new Date().toISOString()}).eq("id",ordenId);
    if(nueva){ try{
      const arr=await EYG.comsLeer();
      arr.push({ id:"repo-"+ordenId+"-"+Date.now(), clase:"novedad", activo:true,
        alcance:"departamento", departamentos:["comercial"],
        titulo:"📋 Reposición: "+_limpiaNom(p.name),
        cuerpo:yo+" abrió una orden de reposición de "+_limpiaNom(p.name)+" (no había stock). Si vos también lo necesitás para un cliente, entrá a Pendientes de reposición y sumá tus unidades.",
        autor:yo, ts:new Date().toISOString(),
        hasta:new Date(Date.now()+14*86400000).toISOString().slice(0,10),
        link:"inventario/pendientes.html", linkLabel:"Ir a Pendientes →", leidoPor:[] });
      await EYG.comsGuardar(arr);
    }catch(e){} }
    cerrarModal(); toast(nueva?"✓ Orden de reposición creada — se avisa a los demás":"✓ Sumado a la orden de reposición");
  }catch(e){ alert("No se pudo cargar el pendiente: "+(e.message||e)); }
}


/* Alto real de la topbar → variable CSS --topH, para que el catálogo y el carrito
   (position:sticky) queden justo debajo y no tapen la primera fila de productos. */
function setTopH(){ const tb=document.querySelector(".topbar"); const h=tb?tb.offsetHeight:56; document.documentElement.style.setProperty("--topH", h+"px"); }
window.addEventListener("resize", setTopH);
window.addEventListener("orientationchange", setTopH);

/* ============================================================
   LOGIN + identidad
   ============================================================ */
EYG.guard(["comercial","lider","admin","direccion"]).then(perfil=>{
  ST.perfil=perfil;
  const q=new URLSearchParams(location.search).get("c");
  if(perfil.rol==="comercial"){
    COMERCIAL = perfil.comercial_ref || perfil.nombre || perfil.email;
  } else {
    COMERCIAL = q || perfil.comercial_ref || "Natividad Sanchez";
  }
  // El botón atrás vuelve al panel del comercial (la pantalla anterior).
  const nb=document.getElementById("navBack");
  if(nb){ nb.textContent="← Panel"; nb.href="#"; nb.title="Volver al panel del comercial"; nb.onclick=(e)=>{e.preventDefault();irAlPanel();}; }
  setTopH();
  cargar();
});
</script>
