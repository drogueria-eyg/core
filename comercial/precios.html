<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rentabilidad y Precios · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js"></script>
<style>
  :root{
    --teal:#048782; --teal-deep:#04635F; --teal-med:#0AA89F; --aqua:#5FC8BF; --agua:#E2F1EF;
    --ink:#0E1F1D; --gris:#5F716E; --gris2:#8A9A97; --surface:#fff; --bg:#F4F8F7; --line:#DCE8E6;
    --radius:14px; --gold:#E5A93B; --shadow:0 1px 2px rgba(6,65,62,.05), 0 8px 30px rgba(6,65,62,.07);
    /* badges de margen */
    --m-ok2:#0E6B39; --m-ok2bg:#DDF3E6; --m-ok:#1E7D46; --m-okbg:#E7F6EC;
    --m-warn:#9A6A0B; --m-warnbg:#FBF0D6; --m-bad:#B0322F; --m-badbg:#FBE2E1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .topbar{background:var(--teal-deep);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:13px;position:sticky;top:0;z-index:30}
  .mono{font-family:Georgia,serif;font-weight:700;font-size:23px;letter-spacing:.5px;line-height:1}
  .mono .y{color:var(--aqua)}
  .topbar .tag{font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:20px}
  .topbar .who{margin-left:auto;text-align:right;font-size:13px}
  .topbar .who b{display:block;font-size:15px}
  .topbar .who span{color:var(--aqua);font-size:12px}
  .wrap{max-width:1200px;margin:0 auto;padding:22px 22px 90px}
  .hero{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .hero h1{font-size:25px;font-weight:800;letter-spacing:-.5px}
  .hero .msg{color:var(--gris);font-size:14px;margin-top:3px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-bottom:20px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 18px;box-shadow:var(--shadow)}
  .kpi .l{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gris)}
  .kpi .v{font-size:24px;font-weight:800;margin-top:3px}
  .kpi.alert .v{color:var(--m-bad)}
  .controls{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 13px}
  .search input{border:0;background:none;outline:none;font-family:inherit;font-size:14px;width:100%}
  .chip{font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--gris);border-radius:20px;padding:7px 13px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .syncwrap{margin-left:auto;text-align:right;flex-shrink:0}
  .btnsync{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow)}
  .btnsync:hover{filter:brightness(1.07)} .btnsync:disabled{opacity:.6;cursor:default}
  .syncst{font-size:12px;color:var(--gris);margin-top:6px;min-height:15px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 24px;border-radius:30px;font-weight:600;font-size:14px;opacity:0;transition:.3s;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90vw}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.win{background:linear-gradient(135deg,var(--teal),var(--teal-deep))}

  .tablecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse}
  thead th{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--gris);font-weight:700;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg);position:sticky;top:51px;z-index:5}
  thead th.n{text-align:center}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.5px}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fafcfb}
  .pn{font-weight:700;font-size:14px;line-height:1.25}
  .pmeta{font-size:11.5px;color:var(--gris2);margin-top:2px}
  .cat{display:inline-block;font-size:10.5px;font-weight:700;color:var(--teal-deep);background:var(--agua);border-radius:6px;padding:2px 7px;margin-top:4px}
  td.costo{text-align:right;font-variant-numeric:tabular-nums}
  td.costo .cv{font-weight:800;font-size:14.5px}
  td.costo .cd{font-size:10.5px;color:var(--gris2);margin-top:1px}
  td.costo .old{color:var(--m-warn);font-weight:700}
  .tier{text-align:center;min-width:96px}
  .tier .pr{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
  .bmg{display:inline-block;margin-top:4px;font-size:11px;font-weight:800;border-radius:20px;padding:2px 9px}
  .bmg.ok2{color:var(--m-ok2);background:var(--m-ok2bg)}
  .bmg.ok{color:var(--m-ok);background:var(--m-okbg)}
  .bmg.warn{color:var(--m-warn);background:var(--m-warnbg)}
  .bmg.bad{color:var(--m-bad);background:var(--m-badbg)}
  .rowalert{box-shadow:inset 3px 0 0 var(--m-bad)}
  .loading,.empty{text-align:center;padding:60px 20px;color:var(--gris)}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .errbox{background:#FBE4E3;border:1px solid #F3B5B2;color:#8A2E2B;padding:16px;border-radius:12px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:14px 2px 0;font-size:12px;color:var(--gris)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  @media(max-width:820px){ thead{display:none} tbody td{display:block;text-align:left!important;padding:6px 14px} tbody tr{display:block;padding:8px 0;border-bottom:2px solid var(--line)} .tier{min-width:0} }
</style>
</head>
<body>
  <div class="topbar">
    <span class="mono">E<span class="y">y</span>G</span><span class="tag">Core</span>
    <a href="../index.html" style="color:#fff;text-decoration:none;font-size:13px;font-weight:600;opacity:.9">← Inicio</a>
    <div class="who"><b>Rentabilidad y Precios</b><span>escalas de LISTA 1 EyG · Hospitalarios</span></div>
  </div>
  <div class="wrap"><div id="app"><div class="loading"><div class="spinner"></div>Leyendo precios y costos de Odoo…</div></div></div>
  <div class="toast" id="toast"></div>

<script>
const RPC="https://yxotopoklgjowcudveoj.supabase.co/functions/v1/odoo-rpc";
const LISTA=3; // LISTA 1 EyG (web)
const money=n=>"$"+Math.round(n||0).toLocaleString("es-AR");
const esc=s=>(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
async function rpc(model,method,args,kwargs={},intentos=3){
  let ultimo;
  for(let i=0;i<intentos;i++){
    try{
      const r=await fetch(RPC,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model,method,args,kwargs})});
      const j=await r.json();
      if(!j.ok){ ultimo=new Error(j.error||"Error Odoo"); if(i<intentos-1 && /http2|connection|timeout|EOF|reset/i.test(j.error||"")){ await new Promise(s=>setTimeout(s,500*(i+1))); continue; } throw ultimo; }
      return j.result;
    }catch(e){ ultimo=e; if(i<intentos-1){ await new Promise(s=>setTimeout(s,500*(i+1))); continue; } throw ultimo; }
  }
  throw ultimo;
}
const ES={lang:"es_AR"};
const now=new Date();
const diasDe=f=> f? Math.floor((now-new Date(f))/86400000):null;
// rango de cantidad según min_quantity de los tramos ordenados
function rango(minq, arr, idx){ const next=arr[idx+1]; const lo=minq<=1?1:minq; return next? `${lo}–${next.q-1} u` : `${lo}+ u`; }
// color del badge por margen %
function badge(m){
  if(m==null) return ['—','warn'];
  const t = m>=40?'ok2': m>=33?'ok': m>=27?'warn':'bad';
  return [m.toFixed(0)+'%', t];
}
function bucket(m){ return m==null?null: m>=40?'ok2': m>=33?'ok': m>=27?'warn':'bad'; }
let ST={items:[], q:"", cat:"todos", salud:"todos", sinStock:false};

async function cargar(){
  try{
    // 1) NUESTROS productos = los que tienen la tabla eyg-ladder (los que actualizamos)
    const nuestros=await rpc("product.template","search_read",
      [[["description_ecommerce","ilike","eyg-ladder"],["categ_id","child_of",24]]], {fields:["id"], context:ES, limit:5000});
    const setT=new Set(nuestros.map(t=>t.id));
    if(!setT.size){ document.getElementById("app").innerHTML='<div class="empty">Todavía no actualizamos ningún producto con la escalera.</div>'; return; }
    // sus reglas de precio (escalera) en LISTA 1 EyG
    const raw=await rpc("product.pricelist.item","search_read",
      [[["pricelist_id","=",LISTA],["applied_on","=","1_product"],["product_tmpl_id","in",[...setT]]]],
      {fields:["product_tmpl_id","min_quantity","fixed_price","compute_price"]});
    const porT={};
    for(const it of raw){ if(!it.product_tmpl_id) continue; const t=it.product_tmpl_id[0];
      (porT[t]=porT[t]||[]).push({q:it.min_quantity||0, p:it.fixed_price, tipo:it.compute_price}); }
    const tmplIds=[...setT].filter(t=>porT[t]&&porT[t].length);
    if(!tmplIds.length){ document.getElementById("app").innerHTML='<div class="empty">Los productos actualizados aún no tienen escalera de precio.</div>'; return; }
    // 2) info de producto (variante) por template
    const prods=await rpc("product.product","search_read",
      [[["product_tmpl_id","in",tmplIds]]],
      {fields:["id","default_code","name","categ_id","product_tmpl_id","standard_price","qty_available"], context:{...ES,active_test:false}, limit:3000});
    const pid2=prods.map(p=>p.id);
    // 3) última compra por producto (costo de reposición)
    const pol=await rpc("purchase.order.line","search_read",
      [[["product_id","in",pid2],["state","in",["purchase","done"]]]],
      {fields:["product_id","date_order","price_subtotal","product_qty"], limit:100000});
    const ult={};
    for(const l of pol){ if(!l.product_id) continue; const id=l.product_id[0];
      if(!ult[id] || (l.date_order||"")>ult[id].f){ ult[id]={f:l.date_order, c:l.product_qty>0? l.price_subtotal/l.product_qty : 0}; } }
    // 4) armar filas
    ST.items = prods.map(p=>{
      const tramos=(porT[p.product_tmpl_id[0]]||[]).slice().sort((a,b)=>a.q-b.q);
      const uc=ult[p.id];
      const costo = uc && uc.c>0 ? uc.c : (p.standard_price||0);
      const fuente = uc && uc.c>0 ? 'compra' : 'odoo';
      const tr = tramos.map((t,i)=>({ rango: rango(t.q,tramos,i), precio:t.p, margen: t.p>0 && costo>0 ? (t.p-costo)/t.p*100 : null }));
      const ms = tr.map(t=>t.margen).filter(m=>m!=null);
      return {
        id:p.id, sku:p.default_code, name:p.name,
        cat:(p.categ_id?p.categ_id[1]:'').replace("ALL / ",""),
        costo, fecha: uc?uc.f:null, fuente,
        stock: (p.qty_available!=null? p.qty_available : 0),
        tramos: tr, peor: ms.length? Math.min(...ms): null
      };
    }).sort((a,b)=>(a.cat+a.name).localeCompare(b.cat+b.name));
    render();
  }catch(e){ document.getElementById("app").innerHTML='<div class="errbox"><b>No pude leer los datos.</b><br>'+esc(e.message)+'</div>'; }
}

function render(){
  const app=document.getElementById("app");
  let arr=ST.items;
  if(ST.q){ const q=ST.q.toLowerCase(); arr=arr.filter(x=>(x.name||"").toLowerCase().includes(q)||(x.sku||"").toLowerCase().includes(q)); }
  const cats=[...new Set(ST.items.map(x=>x.cat))].sort();
  if(ST.cat!=="todos") arr=arr.filter(x=>x.cat===ST.cat);
  // KPIs
  const nProd=ST.items.length;
  const margenLista = ST.items.map(x=>x.tramos[0]?.margen).filter(m=>m!=null);
  const promLista = margenLista.length? margenLista.reduce((a,b)=>a+b,0)/margenLista.length : 0;
  const alertas = ST.items.filter(x=>x.tramos.some(t=>t.margen!=null && t.margen<26)).length;
  const viejos = ST.items.filter(x=>diasDe(x.fecha)>180).length;
  if(ST.salud!=="todos") arr=arr.filter(x=>bucket(x.peor)===ST.salud);
  if(ST.sinStock) arr=arr.filter(x=>(x.stock||0)<=0);
  const nSinStock=ST.items.filter(x=>(x.stock||0)<=0).length;
  const cntS={ok2:0,ok:0,warn:0,bad:0}; ST.items.forEach(x=>{ const b=bucket(x.peor); if(b) cntS[b]++; });
  const pill=(k,lab,color)=>`<div class="chip ${ST.salud===k?'on':''}" onclick="ST.salud='${ST.salud===k?'todos':k}';render()"><span class="dot" style="background:${color}"></span> ${lab} <b>${cntS[k]}</b></div>`;
  const saludbar=`<div class="controls" style="margin:-4px 0 14px"><span style="font-size:12px;color:var(--gris);font-weight:700;align-self:center">Salud (peor tramo):</span><div class="chip ${ST.salud==='todos'?'on':''}" onclick="ST.salud='todos';render()">Todas</div>${pill('ok2','≥40%','var(--m-ok2)')}${pill('ok','33–40%','var(--m-ok)')}${pill('warn','27–33%','var(--m-warn)')}${pill('bad','&lt;27% piso','var(--m-bad)')}</div>`;
  const maxTramos = Math.max(1,...ST.items.map(x=>x.tramos.length));
  const th = Array.from({length:maxTramos}).map((_,i)=>`<th class="n">Tramo ${i+1}</th>`).join("");
  const filas = arr.map(x=>{
    const alerta = x.tramos.some(t=>t.margen!=null && t.margen<26);
    const dias=diasDe(x.fecha);
    const celdas = Array.from({length:maxTramos}).map((_,i)=>{
      const t=x.tramos[i]; if(!t) return '<td class="tier"></td>';
      const [txt,cls]=badge(t.margen);
      return `<td class="tier"><div class="pr">${money(t.precio)}</div><div class="pmeta">${t.rango}</div><span class="bmg ${cls}">${txt}</span></td>`;
    }).join("");
    return `<tr class="${alerta?'rowalert':''}">
      <td><div class="pn">${esc(x.name)}</div><div class="pmeta">${esc(x.sku||"")} · ${(x.stock||0)<=0?'<b style="color:var(--m-bad)">sin stock</b>':('stock '+x.stock+' u')}</div><span class="cat">${esc(x.cat||"—")}</span></td>
      <td class="costo"><div class="cv">${money(x.costo)}</div><div class="cd ${dias>180?'old':''}">${x.fuente==='compra'? (dias===0?'compra hoy':dias!=null?'compra '+dias+'d':'') : 'costo Odoo'}${dias>180?' ⚠':''}</div></td>
      ${celdas}
    </tr>`;
  }).join("");
  app.innerHTML=`
    <div class="hero"><div><h1>Rentabilidad y precios</h1>
      <div class="msg">Se llena solo a medida que actualizamos productos. Margen = (precio − costo de última compra) / precio.</div></div>
      <div class="syncwrap"><button id="btnSync" class="btnsync" onclick="sincronizar()">🔄 Sincronizar</button><div id="syncStatus" class="syncst">Busca productos nuevos en las categorías definidas</div></div></div>
    <div class="kpis">
      <div class="kpi"><div class="l">Productos</div><div class="v">${nProd}</div></div>
      <div class="kpi"><div class="l">Margen lista prom.</div><div class="v">${promLista.toFixed(0)}%</div></div>
      <div class="kpi ${alertas?'alert':''}"><div class="l">Bajo el piso (26%)</div><div class="v">${alertas}</div></div>
      <div class="kpi"><div class="l">Costo +6 meses</div><div class="v">${viejos}</div></div>
    </div>
    ${saludbar}
    <div class="controls">
      <div class="search"><input placeholder="Buscar por nombre o SKU…" value="${esc(ST.q)}" oninput="ST.q=this.value;render()"></div>
      <div class="chip ${ST.sinStock?'on':''}" onclick="ST.sinStock=!ST.sinStock;render()">📦 Sin stock <b>${nSinStock}</b></div>
      <div class="chip ${ST.cat==='todos'?'on':''}" onclick="ST.cat='todos';render()">Todas</div>
      ${cats.map(c=>`<div class="chip ${ST.cat===c?'on':''}" onclick="ST.cat='${esc(c)}';render()">${esc(c)}</div>`).join("")}
    </div>
    <div class="tablecard"><table>
      <thead><tr><th>Producto</th><th class="n" style="text-align:right">Costo (últ. compra)</th>${th}</tr></thead>
      <tbody>${filas||'<tr><td colspan="9" class="empty">Sin resultados.</td></tr>'}</tbody>
    </table></div>
    <div class="legend">
      <span><span class="dot" style="background:var(--m-ok2)"></span>≥40% excelente</span>
      <span><span class="dot" style="background:var(--m-ok)"></span>33–40% bien</span>
      <span><span class="dot" style="background:var(--m-warn)"></span>27–33% ajustado</span>
      <span><span class="dot" style="background:var(--m-bad)"></span>&lt;27% bajo el piso</span>
    </div>`;
}
// ===== Sincronizar: aplica la escalera a productos nuevos de la categoría definida =====
// Config de categorías ya definidas (recargo sobre costo + cortes de cantidad + descuentos por tramo)
const SYNC_CATS=[
  { catId:331, nombre:"HOSP. Jarabes",     recargo:0.70, cortes:[1,12,24,48],  desc:[0,0.07,0.14,0.20] },
  { catId:299, nombre:"HOSP. Comprimidos", recargo:0.70, cortes:[1,10,20,40], desc:[0,0.07,0.14,0.20] },
  { catId:15,  nombre:"HOSP. Ampollas",    recargo:0.70, cortes:[1,20,50,100], desc:[0,0.07,0.14,0.20] }
];
function preciosTramos(costo,cat){ return cat.cortes.map((q,i)=>Math.round(costo*(1+cat.recargo)*(1-cat.desc[i]))); }
// etiquetas de cantidad + ahorro, según los cortes de cada categoría
function tramoLabels(cat){ return cat.cortes.map((q,i)=>{ const next=cat.cortes[i+1]; const rng= next? `${q} a ${next-1} u` : `${q} u o más`; const ah = cat.desc[i]? "−"+Math.round(cat.desc[i]*100)+"%":""; return [rng, ah]; }); }
async function ultimaCompra(pid){
  const pol=await rpc("purchase.order.line","search_read",[[["product_id","=",pid],["state","in",["purchase","done"]]]],{fields:["date_order","price_subtotal","product_qty"],limit:200});
  if(!pol.length) return null;
  pol.sort((a,b)=>(b.date_order||"").localeCompare(a.date_order||""));
  const uc=pol[0]; return uc.product_qty>0? uc.price_subtotal/uc.product_qty : null;
}
function tablaHTML(prices,cat){
  const L=tramoLabels(cat);
  const row=(lab,pr,ah,alt)=>`<tr style="background:${alt?'#f6faf9':'#ffffff'}"><td style="padding:5px 14px;border-top:1px solid #e2ecea">${lab}</td><td style="padding:5px 14px;border-top:1px solid #e2ecea;text-align:right;font-weight:700">${money(pr)}</td><td style="padding:5px 14px;border-top:1px solid #e2ecea;text-align:right;color:#1E7D46;font-weight:700">${ah||'—'}</td></tr>`;
  return `<div class="eyg-ladder" style="font-family:inherit;margin:12px 0;border:1px solid #cfe0dd;border-radius:12px;overflow:hidden;max-width:440px"><div style="font-family:inherit;background:#04635F;color:#ffffff;padding:8px 14px;font-weight:700;font-size:15px">Precio por cantidad</div><table style="font-family:inherit;width:100%;border-collapse:collapse;font-size:14px;color:#0e2a29"><tr style="background:#eef5f4"><td style="padding:6px 14px;font-weight:700">Cantidad</td><td style="padding:6px 14px;text-align:right;font-weight:700">Precio c/u</td><td style="padding:6px 14px;text-align:right;font-weight:700">Ahorro</td></tr>${prices.map((pr,i)=>row(L[i][0],pr,L[i][1],i%2===1)).join("")}</table><div style="font-family:inherit;padding:7px 14px;font-size:12.5px;color:#5b7573;background:#eef5f4">Cuanto más comprás, mejor precio. El precio se ajusta solo al cargar la cantidad en el carrito.</div></div>`;
}
let toastT;
function toast(msg,win){ const t=document.getElementById("toast"); t.textContent=msg; t.className="toast on"+(win?" win":""); clearTimeout(toastT); toastT=setTimeout(()=>t.className="toast",4200); }
function sst(m){ const el=document.getElementById("syncStatus"); if(el) el.textContent=m; }

async function sincronizar(){
  const btn=document.getElementById("btnSync"); if(!btn||btn.disabled) return;
  btn.disabled=true; btn.textContent="Sincronizando…";
  let aplicados=0, sinCosto=[], errores=0, yaEstaban=0;
  try{
    for(const cat of SYNC_CATS){
      const prods=await rpc("product.product","search_read",[[["categ_id","=",cat.catId]]],
        {fields:["id","default_code","name","product_tmpl_id","website_published","description_ecommerce"], context:{...ES,active_test:false}, limit:2000});
      const nuevos=prods.filter(p=>!((p.description_ecommerce||"").includes("eyg-ladder")));
      yaEstaban += prods.length-nuevos.length;
      for(let k=0;k<nuevos.length;k++){
        const p=nuevos[k];
        sst(`${cat.nombre}: ${p.default_code} (${k+1}/${nuevos.length})`);
        try{
          const costo=await ultimaCompra(p.id);
          if(costo==null||costo<=0){ sinCosto.push(p.default_code); continue; }
          const prices=preciosTramos(costo,cat);
          const tmpl=p.product_tmpl_id[0];
          const viejas=await rpc("product.pricelist.item","search",[[["pricelist_id","=",LISTA],"|",["product_id","=",p.id],["product_tmpl_id","=",tmpl]]]);
          if(viejas.length) await rpc("product.pricelist.item","unlink",[viejas]);
          for(let i=0;i<cat.cortes.length;i++)
            await rpc("product.pricelist.item","create",[{pricelist_id:LISTA,applied_on:"1_product",product_tmpl_id:tmpl,compute_price:"fixed",fixed_price:prices[i],min_quantity:cat.cortes[i]}]);
          if(!p.website_published) await rpc("product.template","write",[[tmpl],{website_published:true}]);
          let de=(p.description_ecommerce||"").replace(/<div class="eyg-ladder"[\s\S]*?en el carrito\.<\/div><\/div>\s*/g,"").trim();
          await rpc("product.template","write",[[tmpl],{description_ecommerce:tablaHTML(prices,cat)+(de?("\n"+de):"")}],{context:ES});
          aplicados++;
        }catch(e){ errores++; }
      }
    }
    let msg = aplicados? `✅ ${aplicados} producto(s) nuevo(s) actualizado(s)` : "Todo al día, no había productos nuevos";
    if(sinCosto.length) msg += ` · ⚠ ${sinCosto.length} sin costo (${sinCosto.slice(0,4).join(", ")}${sinCosto.length>4?'…':''})`;
    if(errores) msg += ` · ${errores} con error`;
    toast(msg, aplicados>0);
    await cargar();
  }catch(e){ toast("No se pudo sincronizar: "+e.message); }
  finally{ const b=document.getElementById("btnSync"); if(b){ b.disabled=false; b.textContent="🔄 Sincronizar"; } }
}

EYG.guard(["comercial","lider","finanzas","inventario"]).then(()=>cargar());
</script>
