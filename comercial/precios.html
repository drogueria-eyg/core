<style>
  :root{
    --teal:#048782; --teal-deep:#04635F; --teal-med:#0AA89F; --aqua:#5FC8BF; --agua:#E2F1EF;
    --ink:#0E1F1D; --gris:#5F716E; --gris2:#8A9A97; --surface:#fff; --bg:#F4F8F7; --line:#DCE8E6;
    --radius:14px; --gold:#E5A93B; --shadow:0 1px 2px rgba(6,65,62,.05), 0 8px 30px rgba(6,65,62,.07);
    /* badges de margen */
    --m-ok2:#0E6B39; --m-ok2bg:#DDF3E6; --m-ok:#1E7D46; --m-okbg:#E7F6EC;
    --m-warn:#9A6A0B; --m-warnbg:#FBF0D6; --m-bad:#B0322F; --m-badbg:#FBE2E1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .topbar{background:var(--teal-deep);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:13px;position:sticky;top:0;z-index:30}
  .mono{font-family:Georgia,serif;font-weight:700;font-size:23px;letter-spacing:.5px;line-height:1}

  .topbar .tag{font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:20px}
  .topbar .who{margin-left:auto;text-align:right;font-size:13px}
  .topbar .who b{display:block;font-size:15px}
  .topbar .who span{color:var(--aqua);font-size:12px}
  .wrap{max-width:1200px;margin:0 auto;padding:22px 22px 90px}
  .hero{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .hero h1{font-size:25px;font-weight:800;letter-spacing:-.5px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-bottom:20px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 18px;box-shadow:var(--shadow)}

  .controls{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 13px}
  .search input{border:0;background:none;outline:none;font-family:inherit;font-size:14px;width:100%}
  .chip{font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--gris);border-radius:20px;padding:7px 13px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--teal);border-color:var(--teal);color:#fff}

  .syncwrap{margin-left:auto;text-align:right;flex-shrink:0}
  .btnsync{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow)}
  .btnsync:hover{filter:brightness(1.07)} .btnsync:disabled{opacity:.6;cursor:default}
  .syncst{font-size:12px;color:var(--gris);margin-top:6px;min-height:15px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 24px;border-radius:30px;font-weight:600;font-size:14px;opacity:0;transition:.3s;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90vw}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.win{background:linear-gradient(135deg,var(--teal),var(--teal-deep))}

  .tablecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse}
  thead th{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--gris);font-weight:700;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg);position:sticky;top:51px;z-index:5}
  thead th.n{text-align:center}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.5px}
  tbody tr:last-child td{border-bottom:none}

  td.costo{text-align:right;font-variant-numeric:tabular-nums}
  td.costo .cv{font-weight:800;font-size:14.5px}
  td.costo .cd{font-size:10.5px;color:var(--gris2);margin-top:1px}
  td.costo .old{color:var(--m-warn);font-weight:700}
  .costedit{display:flex;gap:3px;margin-top:5px;justify-content:flex-end}
  .costedit input{width:76px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;font-family:inherit;text-align:right}
  .costedit button{background:var(--teal);color:#fff;border:none;border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer}
  .costedit button:hover{background:var(--teal-deep)} .costedit button:disabled{opacity:.6}
  .tier{text-align:center;min-width:96px}
  .tier .pr{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
  .bmg{display:inline-block;margin-top:4px;font-size:11px;font-weight:800;border-radius:20px;padding:2px 9px}
  .bmg.ok2{color:var(--m-ok2);background:var(--m-ok2bg)}
  .bmg.ok{color:var(--m-ok);background:var(--m-okbg)}
  .bmg.warn{color:var(--m-warn);background:var(--m-warnbg)}
  .bmg.bad{color:var(--m-bad);background:var(--m-badbg)}
  .rowalert{box-shadow:inset 3px 0 0 var(--m-bad)}
  .loading,.empty{text-align:center;padding:60px 20px;color:var(--gris)}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .errbox{background:#FBE4E3;border:1px solid #F3B5B2;color:#8A2E2B;padding:16px;border-radius:12px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:14px 2px 0;font-size:12px;color:var(--gris)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  @media(max-width:820px){ thead{display:none} tbody td{display:block;text-align:left!important;padding:6px 14px} tbody tr{display:block;padding:8px 0;border-bottom:2px solid var(--line)} .tier{min-width:0} }

<body>
  <div class="topbar">
    <span class="mono">E<span class="y">y</span>G</span><span class="tag">Core</span>
    <a href="../index.html" style="color:#fff;text-decoration:none;font-size:13px;font-weight:600;opacity:.9">← Inicio</a>
    <div class="who"><b>Rentabilidad y Precios</b><span>escalas de LISTA 1 EyG · Hosp. + Farmacopea + Descartables + Perfumería + Equipos + Éticos</span></div>
  </div>
  <div class="wrap"><div id="app"><div class="loading"><div class="spinner"></div>Leyendo precios y costos de Odoo…</div></div></div>
  <div class="toast" id="toast"></div>

<script>
const RPC="https://yxotopoklgjowcudveoj.supabase.co/functions/v1/odoo-rpc";
const LISTA=3; // LISTA 1 EyG (web)
// ===== Regla "IVA al costo" =====
// Categorías donde el IVA de la compra NO se descarga (no hay crédito fiscal) y se venden exentos:
// al costo de COMPRA se le suma el IVA y se toma como neto. Para aplicarla a otra cosa,
// agregá acá otra entrada con su patrón de categoría (se matchea contra el nombre de la categoría).
const REGLAS_IVA_COSTO = [
  { nombre:"Parenterales", match:/parenteral/i, iva:0.21 },
];
function reglaIvaCosto(cat){ return REGLAS_IVA_COSTO.find(r=>r.match.test(cat||"")) || null; }
const money=n=>"$"+Math.round(n||0).toLocaleString("es-AR");
const esc=s=>(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
async function rpc(model,method,args,kwargs={},intentos=3){
  let ultimo;
  for(let i=0;i<intentos;i++){
    try{
      const r=await fetch(RPC,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model,method,args,kwargs})});
      const j=await r.json();
      if(!j.ok){ ultimo=new Error(j.error||"Error Odoo"); if(i<intentos-1 && /http2|connection|timeout|EOF|reset/i.test(j.error||"")){ await new Promise(s=>setTimeout(s,500*(i+1))); continue; } throw ultimo; }
      return j.result;
    }catch(e){ ultimo=e; if(i<intentos-1){ await new Promise(s=>setTimeout(s,500*(i+1))); continue; } throw ultimo; }
  }
  throw ultimo;
}
const ES={lang:"es_AR"};
const now=new Date();
const diasDe=f=> f? Math.floor((now-new Date(f))/86400000):null;
// rango de cantidad según min_quantity de los tramos ordenados
function rango(minq, arr, idx){ const next=arr[idx+1]; const lo=minq<=1?1:minq; return next? `${lo}–${next.q-1} u` : `${lo}+ u`; }
// color del badge por margen %
function badge(m){
  if(m==null) return ['—','warn'];
  const t = m>=40?'ok2': m>=33?'ok': m>=27?'warn':'bad';
  return [m.toFixed(0)+'%', t];
}
function bucket(m){ return m==null?null: m>=40?'ok2': m>=33?'ok': m>=27?'warn':'bad'; }
// costo efectivo: gana el más reciente entre el costo manual y la última compra (una compra posterior pisa al manual).
// PARENTERALES: al costo de COMPRA se le suma 21% (IVA no descontable); el manual NO se toca (ya se carga con el 21%).
function costoEfectivo(it){
  const m=it.manualC||0, md=it.manualD||null, uf=it.ucF||null, uc=it.ucC||0;
  const iva = 1 + (it.ivaCosto||0);   // regla "IVA al costo" (0 si no aplica)
  if(m>0 && (!uf || (md && md>=uf))) return {costo:m, fuente:'manual', fecha:md};
  if(uc>0) return {costo:uc*iva, fuente:'compra', fecha:uf, iva:(it.ivaCosto>0)};
  return {costo:(it.std||0), fuente:'odoo', fecha:null};
}
function aplicarCosto(it){
  const e=costoEfectivo(it); it.costo=e.costo; it.fuente=e.fuente; it.fecha=e.fecha; it.ivaAplicado=!!e.iva;
  it.tramos = it.tramosRaw.map((t,i)=>({ rango: rango(t.q,it.tramosRaw,i), precio:t.p, margen: t.p>0 && it.costo>0 ? (t.p-it.costo)/t.p*100 : null }));
  const ms=it.tramos.map(t=>t.margen).filter(m=>m!=null);
  it.peor = ms.length? Math.min(...ms): null;
}
function fmtDT(s){ if(!s) return ""; try{ return new Date(String(s).replace(" ","T")+"Z").toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }catch(e){ return s; } }
function fuenteLbl(x,dias){ if(x.fuente==='manual') return '✎ manual '+fmtDT(x.manualD); if(x.fuente==='compra'){ const b=dias===0?'compra hoy':dias!=null?'compra '+dias+'d':'compra'; return b+(x.ivaAplicado?(' +'+Math.round(x.ivaCosto*100)+'% IVA'):''); } return 'costo Odoo'; }
function costoTip(x){ const p=[]; if(x.manualC>0) p.push('Manual: '+money(x.manualC)+' ('+fmtDT(x.manualD)+')'); if(x.ucC>0) p.push('Última compra: '+money(x.ucC)+(x.ivaCosto>0?(' +'+Math.round(x.ivaCosto*100)+'% = '+money(x.ucC*(1+x.ivaCosto))):'')+' ('+fmtDT(x.ucF)+')'); if(x.ivaCosto>0) p.push('Regla "IVA al costo" ('+x.reglaIva+'): al costo de compra se le suma '+Math.round(x.ivaCosto*100)+'% (IVA no descontable)'); p.push('En uso: '+(x.fuente==='manual'?'costo manual':x.fuente==='compra'?'última compra':'costo Odoo')+' — gana el más reciente'); return p.join(' · '); }
let ST={items:[], q:"", cat:"todos", sub:"todos", salud:"todos", sinStock:false, conStock:false, sinEsc:false};

async function cargar(){
  try{
    // 1) TODAS las escaleras de la LISTA (para saber qué templates tienen escalera)
    const raw=await rpc("product.pricelist.item","search_read",
      [[["pricelist_id","=",LISTA],["applied_on","=","1_product"],["min_quantity",">",0]]],
      {fields:["product_tmpl_id","min_quantity","fixed_price","compute_price"], limit:40000});
    const porT={};
    for(const it of raw){ if(!it.product_tmpl_id) continue; const t=it.product_tmpl_id[0];
      (porT[t]=porT[t]||[]).push({q:it.min_quantity||0, p:it.fixed_price, tipo:it.compute_price}); }
    const conEsc=Object.keys(porT).map(Number);
    // 2) Hosp(24)+Farma(10)+Descart(51)+Perfum(11)+Equipos(369) completos + Éticos(12) SOLO con stock o con escalera
    //    (los éticos son 17k del catálogo Alfabeta; sin este filtro colgaría el navegador)
    const domBase=["|","|","|","|",["categ_id","child_of",24],["categ_id","child_of",10],["categ_id","child_of",51],["categ_id","child_of",11],["categ_id","child_of",369]];
    const domEticos=["&",["categ_id","child_of",12],"|",["qty_available",">",0],["product_tmpl_id","in",conEsc]];
    const prods=await rpc("product.product","search_read",[["|"].concat(domBase,domEticos)],
      {fields:["id","default_code","name","categ_id","product_tmpl_id","standard_price","qty_available","x_costo_manual","x_costo_manual_date"], context:ES, limit:8000});
    if(!prods.length){ document.getElementById("app").innerHTML='<div class="empty">No hay productos para mostrar.</div>'; return; }
    // 3) última compra de TODOS (para el margen y para comparar contra el costo manual)
    const pid2=prods.map(p=>p.id);
    const ult={};
    const pol=await rpc("purchase.order.line","search_read",
      [[["product_id","in",pid2],["state","in",["purchase","done"]]]],
      {fields:["product_id","date_order","price_subtotal","product_qty"], limit:100000});
    for(const l of pol){ if(!l.product_id) continue; const id=l.product_id[0];
      if(!ult[id] || (l.date_order||"")>ult[id].f){ ult[id]={f:l.date_order, c:l.product_qty>0? l.price_subtotal/l.product_qty : 0}; } }
    // 4) armar filas (costo = manual vs última compra; gana el más reciente por fecha)
    ST.items = prods.map(p=>{
      const tmpl=p.product_tmpl_id&&p.product_tmpl_id[0];
      let tramosRaw=(porT[tmpl]||[]).slice().sort((a,b)=>a.q-b.q);
      // Regla: el tramo 1 (min ≤1) que DUPLICA el precio del tramo 2 es el "precio general" oculto en la web
      // (se creó para que el precio unitario coincida con la menor escala). Se fusiona: el 1er tramo real cubre desde 1.
      let tramoBase=false;
      if(tramosRaw.length>=2 && tramosRaw[0].q<=1 && Math.round(tramosRaw[0].p)===Math.round(tramosRaw[1].p)){
        tramosRaw=tramosRaw.slice(1); tramosRaw[0]={...tramosRaw[0], q:1}; tramoBase=true;
      }
      const uc=ult[p.id]||{};
      const regIva=reglaIvaCosto((p.categ_id&&p.categ_id[1])||"");
      const catFull=(p.categ_id?p.categ_id[1]:'').replace("ALL / ","");
      const cparts=catFull.split(" / "); const catTop=cparts[0]||"—", catSub=cparts.slice(1).join(" / ");
      const it={
        id:p.id, tmpl, sku:p.default_code, name:p.name,
        cat:catFull, catTop, catSub,
        stock:(p.qty_available!=null?p.qty_available:0),
        sinEscalera:!tramosRaw.length, tramoBase, tramosRaw, std:(p.standard_price||0),
        ivaCosto:(regIva?regIva.iva:0), reglaIva:(regIva?regIva.nombre:""),
        manualC:(p.x_costo_manual||0), manualD:(p.x_costo_manual_date||null),
        ucF:(uc.f||null), ucC:(uc.c||0)
      };
      aplicarCosto(it);
      return it;
    }).sort((a,b)=>(a.cat+a.name).localeCompare(b.cat+b.name));
    render();
  }catch(e){ document.getElementById("app").innerHTML='<div class="errbox"><b>No pude leer los datos.</b><br>'+esc(e.message)+'</div>'; }
}

/* render() redibuja TODA la vista, incluido el propio campo de búsqueda. Sin
   debounce eso rearmaba la tabla entera en cada tecla y el input se perdía el
   foco. EYG.buscador filtra al soltar la tecla y devuelve foco + cursor. */
window.buscar = EYG.buscador(v => { ST.q=v; render(); });

function render(){
  const app=document.getElementById("app");
  let arr=ST.items;
  if(ST.q){ const q=ST.q.toLowerCase(); arr=arr.filter(x=>(x.name||"").toLowerCase().includes(q)||(x.sku||"").toLowerCase().includes(q)); }
  if(ST.cat!=="todos") arr=arr.filter(x=>x.catTop===ST.cat);
  if(ST.sub!=="todos"){ if(ST.sub==="__dir__") arr=arr.filter(x=>!x.catSub); else arr=arr.filter(x=>x.catSub===ST.sub); }
  // KPIs
  const nProd=ST.items.length;
  const margenLista = ST.items.map(x=>x.tramos[0]?.margen).filter(m=>m!=null);
  const promLista = margenLista.length? margenLista.reduce((a,b)=>a+b,0)/margenLista.length : 0;
  const alertas = ST.items.filter(x=>x.tramos.some(t=>t.margen!=null && t.margen<26)).length;
  const viejos = ST.items.filter(x=>diasDe(x.fecha)>180).length;
  if(ST.salud!=="todos") arr=arr.filter(x=>bucket(x.peor)===ST.salud);
  if(ST.sinStock) arr=arr.filter(x=>(x.stock||0)<=0);
  if(ST.conStock) arr=arr.filter(x=>(x.stock||0)>0);
  if(ST.sinEsc) arr=arr.filter(x=>x.sinEscalera);
  const nSinStock=ST.items.filter(x=>(x.stock||0)<=0).length;
  const nConStock=ST.items.filter(x=>(x.stock||0)>0).length;
  const nSinEsc=ST.items.filter(x=>x.sinEscalera).length;
  const nConEsc=ST.items.length-nSinEsc;
  const cntS={ok2:0,ok:0,warn:0,bad:0}; ST.items.forEach(x=>{ const b=bucket(x.peor); if(b) cntS[b]++; });
  const pill=(k,lab,color)=>`<div class="chip ${ST.salud===k?'on':''}" onclick="ST.salud='${ST.salud===k?'todos':k}';render()"><span class="dot" style="background:${color}"></span> ${lab} <b>${cntS[k]}</b></div>`;
  const saludbar=`<div class="controls" style="margin:-4px 0 14px"><span style="font-size:12px;color:var(--gris);font-weight:700;align-self:center">Salud (peor tramo):</span><div class="chip ${ST.salud==='todos'?'on':''}" onclick="ST.salud='todos';render()">Todas</div>${pill('ok2','≥40%','var(--m-ok2)')}${pill('ok','33–40%','var(--m-ok)')}${pill('warn','27–33%','var(--m-warn)')}${pill('bad','&lt;27% piso','var(--m-bad)')}</div>`;
  // ===== navegación por categoría (2 niveles) =====
  const ORDEN=["HOSPITALARIOS","FARMACOPEA","DESCARTABLES","PERFUMERIA","EQUIPOS MEDICOS","ETICOS"];
  const tops=[...new Set(ST.items.map(x=>x.catTop))].sort((a,b)=>{const ia=ORDEN.indexOf(a),ib=ORDEN.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b);});
  const cntTop=c=>ST.items.filter(x=>x.catTop===c).length;
  const catRow=`<div class="controls catrow"><div class="chip ${ST.cat==='todos'?'on':''}" onclick="ST.cat='todos';ST.sub='todos';render()">Todas <b>${ST.items.length}</b></div>`+
    tops.map(c=>`<div class="chip ${ST.cat===c?'on':''}" onclick="ST.cat='${esc(c)}';ST.sub='todos';render()">${esc(c)} <b>${cntTop(c)}</b></div>`).join("")+`</div>`;
  let subRow="";
  if(ST.cat!=='todos'){
    const subs=[...new Set(ST.items.filter(x=>x.catTop===ST.cat && x.catSub).map(x=>x.catSub))].sort();
    const cntSub=s=>ST.items.filter(x=>x.catTop===ST.cat && x.catSub===s).length;
    const dir=ST.items.filter(x=>x.catTop===ST.cat && !x.catSub).length;
    subRow=`<div class="controls subrow"><span class="sublbl">${esc(ST.cat)} →</span><div class="chip sm ${ST.sub==='todos'?'on':''}" onclick="ST.sub='todos';render()">Todas</div>`+
      subs.map(s=>`<div class="chip sm ${ST.sub===s?'on':''}" onclick="ST.sub='${esc(s)}';render()">${esc(s)} <b>${cntSub(s)}</b></div>`).join("")+
      (dir?`<div class="chip sm ${ST.sub==='__dir__'?'on':''}" onclick="ST.sub='__dir__';render()">(sin subcat.) <b>${dir}</b></div>`:"")+`</div>`;
  }
  const maxTramos = Math.max(1,...ST.items.map(x=>x.tramos.length));
  const th = Array.from({length:maxTramos}).map((_,i)=>`<th class="n">Tramo ${i+1}</th>`).join("");
  const filas = arr.map(x=>{
    const alerta = x.tramos.some(t=>t.margen!=null && t.margen<26);
    const dias=diasDe(x.fecha);
    const celdas = x.sinEscalera
      ? `<td class="tier" colspan="${maxTramos}" style="text-align:left"><span class="bmg warn">sin escalera</span></td>`
      : Array.from({length:maxTramos}).map((_,i)=>{
          const t=x.tramos[i]; if(!t) return '<td class="tier"></td>';
          const [txt,cls]=badge(t.margen);
          return `<td class="tier"><div class="pr">${money(t.precio)}</div><div class="pmeta">${t.rango}</div><span class="bmg ${cls}">${txt}</span></td>`;
        }).join("");
    return `<tr class="${alerta?'rowalert':''}">
      <td><div class="pn">${esc(x.name)}</div><div class="pmeta">${esc(x.sku||"")} · ${(x.stock||0)<=0?'<b style="color:var(--m-bad)">sin stock</b>':('stock '+x.stock+' u')}</div><span class="cat">${esc(x.cat||"—")}</span>${x.tramoBase?'<span class="cat" style="background:#fff4ed;color:#c2410c;margin-left:5px" title="Tenía un precio unitario base (min 1) que coincidía con el 1er tramo y se oculta en la web. Se fusionó para mostrar la escala real.">✓ base fusionado</span>':''}</td>
      <td class="costo" title="${esc(costoTip(x))}"><div class="cv">${money(x.costo)}</div><div class="cd ${dias>180?'old':''}">${fuenteLbl(x,dias)}${dias>180?' ⚠':''}</div><div class="costedit"><input type="number" step="0.01" id="cm-${x.id}" placeholder="manual" value="${x.manualC>0?(Math.round(x.manualC*100)/100):''}"><button onclick="guardarCosto(${x.id})" title="Guardar costo manual (pisa la última compra)">💾</button></div></td>
      ${celdas}
    </tr>`;
  }).join("");
  app.innerHTML=`
    <div class="hero"><div><h1>Rentabilidad y precios</h1>
      <div class="msg">Hospitalarios, Farmacopea, Descartables, Perfumería, Equipos Médicos y Éticos (de éticos solo los que tienen stock o escalera, no el catálogo entero). Los que tienen escalera muestran su margen por tramo; los que no, quedan marcados <b>“sin escalera”</b>. Podés fijar un <b>costo manual</b> en cada fila (💾): <b>gana el más reciente</b> entre ese costo y la última compra — si después entra una compra posterior, la compra vuelve a pisar.</div></div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="l">Productos</div><div class="v">${nProd}</div></div>
      <div class="kpi"><div class="l">Con escalera</div><div class="v">${nConEsc}</div></div>
      <div class="kpi"><div class="l">Margen lista prom.</div><div class="v">${promLista.toFixed(0)}%</div></div>
      <div class="kpi ${alertas?'alert':''}"><div class="l">Bajo el piso (26%)</div><div class="v">${alertas}</div></div>
      <div class="kpi"><div class="l">Costo +6 meses</div><div class="v">${viejos}</div></div>
    </div>
    ${saludbar}
    <div class="controls">
      <div class="search"><input id="q" placeholder="Buscar por nombre o SKU…" value="${esc(ST.q)}" oninput="buscar(this.value)"></div>
      <div class="chip ${ST.conStock?'on':''}" onclick="ST.conStock=!ST.conStock;ST.sinStock=false;render()">📦 Con stock <b>${nConStock}</b></div>
      <div class="chip ${ST.sinStock?'on':''}" onclick="ST.sinStock=!ST.sinStock;ST.conStock=false;render()">📦 Sin stock <b>${nSinStock}</b></div>
      <div class="chip ${ST.sinEsc?'on':''}" onclick="ST.sinEsc=!ST.sinEsc;render()">🏷️ Sin escalera <b>${nSinEsc}</b></div>
    </div>
    ${catRow}${subRow}
    <div class="tablecard"><table>
      <thead><tr><th>Producto</th><th class="n" style="text-align:right">Costo (últ. compra)</th>${th}</tr></thead>
      <tbody>${filas||'<tr><td colspan="9" class="empty">Sin resultados.</td></tr>'}</tbody>
    </table></div>
    <div class="legend">
      <span><span class="dot" style="background:var(--m-ok2)"></span>≥40% excelente</span>
      <span><span class="dot" style="background:var(--m-ok)"></span>33–40% bien</span>
      <span><span class="dot" style="background:var(--m-warn)"></span>27–33% ajustado</span>
      <span><span class="dot" style="background:var(--m-bad)"></span>&lt;27% bajo el piso</span>
    </div>`;
}
// El sync de precios ahora es ÚNICO: el motor del cron (action 1213), configurable desde
// el módulo "Configuración de precios". Se quitó el sync viejo de acá (recargo fijo 0.70,
// solo 3 categorías, escribía el pricelist a mano) para no tener dos fuentes de verdad.
let toastT;
function toast(msg,win){ const t=document.getElementById("toast"); t.textContent=msg; t.className="toast on"+(win?" win":""); clearTimeout(toastT); toastT=setTimeout(()=>t.className="toast",4200); }

// relee la escalera (pricelist items list 3) de UN producto y recalcula margenes
async function releerEscalera(p){
  const raw=await rpc("product.pricelist.item","search_read",
    [[["pricelist_id","=",LISTA],["applied_on","=","1_product"],["min_quantity",">",0],["product_tmpl_id","=",p.tmpl]]],
    {fields:["min_quantity","fixed_price"], limit:50});
  let tr=raw.map(x=>({q:x.min_quantity||0, p:x.fixed_price})).sort((a,b)=>a.q-b.q);
  let base=false;
  if(tr.length>=2 && tr[0].q<=1 && Math.round(tr[0].p)===Math.round(tr[1].p)){ tr=tr.slice(1); tr[0]={...tr[0], q:1}; base=true; }
  p.tramosRaw=tr; p.tramoBase=base; p.sinEscalera=!tr.length;
  aplicarCosto(p);
}
window.guardarCosto = async id => {
  const p=ST.items.find(x=>x.id===id); if(!p) return;
  const el=document.getElementById("cm-"+id); const val=parseFloat(el&&el.value);
  if(!(val>0)){ toast("Poné un costo válido (mayor a 0)"); if(el) el.focus(); return; }
  const nowStr=new Date().toISOString().slice(0,19).replace("T"," ");
  const btn=el&&el.nextElementSibling; if(btn){ btn.disabled=true; btn.textContent="…"; }
  try{
    await rpc("product.product","write",[[id],{x_costo_manual:val, x_costo_manual_date:nowStr}],{context:ES});
    p.manualC=val; p.manualD=nowStr;
    // re-sincroniza la escalera de ESTE producto (misma lógica del cron, id 1213) y la relee -> impacto al instante
    await rpc("ir.actions.server","run",[[1213]],{context:{...ES, eyg_solo_producto:id}});
    await releerEscalera(p);
    toast("Costo guardado y escalera sincronizada ✓", true); render();
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent="💾"; } toast("Error: "+e.message); }
};
EYG.guard(["comercial","lider","finanzas","inventario"]).then(()=>cargar());
</script>
