<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=76"></script>
<script>
/* ===== Rentabilidad por rubro =============================================
   Qué contesta: por dónde se vende, cuánto deja cada tipo de cliente y —lo que
   no se veía— cuánto de ese margen se lo come el PLAZO de pago.

   Cómo se arma (importa para no romperlo):
   · El rubro sale de EYG.rubroDe(): manda el campo Rubro de la ficha y, si está
     vacío, la etiqueta vieja. Los dos rubros a reclasificar aparecen como fila
     propia: verlos ahí es parte del trabajo de catalogar.
   · La VENTA y el MARGEN salen de sale.order.line de pedidos confirmados, sin
     IVA, y SOLO de las líneas con costo cargado (purchase_price>0). Las que no
     tienen costo darían margen = 100% y ensuciarían todo; cuánto queda afuera
     se mide aparte y se avisa abajo de la tabla.
   · El PLAZO se lee del nb_days de la LÍNEA del plazo de pago, no del nombre:
     la línea es lo que Odoo usa de verdad para calcular el vencimiento. Hoy los
     10 plazos en uso tienen nombre y días coincidentes (se corrigió en sept-2026;
     antes el "30 días" vencía a 21), y leerlo de la línea hace que un renombre
     futuro no pase inadvertido.
   · Una consulta por período del gráfico, agrupada por cliente. Con eso salen
     a la vez los totales por rubro y el detalle por cliente, sin pedir de nuevo.
========================================================================== */
const rpc=EYG.rpc, money=EYG.money, esc=EYG.esc;
const CTX={context:{lang:"es_AR", tz:"America/Argentina/Buenos_Aires"}};
const RUBRO_FIELD=EYG.RUBRO_FIELD;
const TASA_KEY="eyg.rentabilidad.tasa_mensual";
const TASA_DEF=3.2;   // medida sobre los 12 préstamos bancarios cargados en Odoo

/* ---------- fechas ---------- */
const dObj = s => new Date(s.slice(0,10)+"T00:00:00Z");
const dStr = d => d.toISOString().slice(0,10);
const addD = (s,n)=>{ const d=dObj(s); d.setUTCDate(d.getUTCDate()+n); return dStr(d); };
const addM = (s,n)=>{ const d=dObj(s.slice(0,7)+"-01"); d.setUTCMonth(d.getUTCMonth()+n); return dStr(d); };
const addA = (s,n)=> (Number(s.slice(0,4))+n)+s.slice(4);
const dow  = s => (dObj(s).getUTCDay()+6)%7;
const uDesde = s => s+" 03:00:00";                 // Odoo guarda en UTC; Argentina es UTC−3
const MES3=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const dm = s => s.slice(8,10)+"/"+s.slice(5,7);

/* n = cuántos períodos se piden. Cada uno cuesta UNA consulta, así que el tope
   es lo que tarda en cargar: 14 consultas ≈ 7 s con el límite de 4 en vuelo. */
const GRAN={
  dia:   {lab:"Día",    uni:"día",    pl:"días",    ult:"últimos", det:"los últimos", n:14, prev:(s,k)=>addD(s,-k),   ini:s=>s,                  fin:s=>addD(s,1)},
  semana:{lab:"Semana", uni:"semana", pl:"semanas", ult:"últimas", det:"las últimas", n:12, prev:(s,k)=>addD(s,-7*k), ini:s=>addD(s,-dow(s)),    fin:s=>addD(s,7)},
  mes:   {lab:"Mes",    uni:"mes",    pl:"meses",   ult:"últimos", det:"los últimos", n:12, prev:(s,k)=>addM(s,-k),   ini:s=>s.slice(0,7)+"-01", fin:s=>addM(s,1)},
  ano:   {lab:"Año",    uni:"año",    pl:"años",    ult:"últimos", det:"los últimos", n:4,  prev:(s,k)=>addA(s,-k),   ini:s=>s.slice(0,4)+"-01-01", fin:s=>addA(s,1)},
};
function etiqueta(k,s){
  if(k==="dia")    return dm(s);
  if(k==="semana") return dm(s);
  if(k==="mes")    return MES3[+s.slice(5,7)-1]+"'"+s.slice(2,4);
  return s.slice(0,4);
}
function etiquetaLarga(k,s){
  if(k==="dia")    return "el "+(+s.slice(8,10))+" de "+MES[+s.slice(5,7)-1];
  if(k==="semana") return "semana del "+dm(s)+" al "+dm(addD(s,6));
  if(k==="mes")    return MES[+s.slice(5,7)-1]+" de "+s.slice(0,4);
  return "año "+s.slice(0,4);
}

/* ---------- formato ---------- */
function mc(n){ n=n||0; const a=Math.abs(n);
  if(a>=1e6){ const v=n/1e6; return "$"+(a>=1e8?Math.round(v).toLocaleString("es-AR"):v.toFixed(1).replace(".",","))+"M"; }
  if(a>=1e4) return "$"+Math.round(n/1e3).toLocaleString("es-AR")+"k";
  return "$"+Math.round(n).toLocaleString("es-AR"); }
const p1 = n => (n==null?"—":(Math.round(n*10)/10).toFixed(1).replace(".",",")+"%");
const ent = n => Math.round(n||0).toLocaleString("es-AR");

/* ---------- estado ---------- */
let GRA="mes", TASA=TASA_DEF, FOCO=null;
let PART={};          // id -> {rubro, dias, name, due, overdue, com}
let DATOS=null;       // {buckets, ventaTotal, pedidos, desde, hasta}
let DEUDA=null;       // {rubro:{due,venc}} — llega en una segunda ola, no frena la tabla
let CARGANDO=false;
const CACHE={};       // por granularidad

/* ---------- carga ---------- */
async function cargarPadron(){
  if(Object.keys(PART).length) return;
  /* Los días de cada plazo salen de la LÍNEA (nb_days), que es lo que Odoo usa
     para el vencimiento, no del nombre. Hoy coinciden, pero ya pasó una vez que
     no: si alguien renombra un plazo sin tocar la línea, acá se sigue contando
     bien y el costo de financiar no se deforma. */
  const [terms, parts] = await Promise.all([
    rpc("account.payment.term","search_read",[[]],Object.assign({fields:["id","name","line_ids"],limit:200},CTX)),
    rpc("res.partner","search_read",[[["customer_rank",">",0]]],
        Object.assign({fields:["id","name","parent_id",RUBRO_FIELD,"category_id","property_payment_term_id","user_id"],limit:0},CTX)),
  ]);
  const lids=[].concat(...terms.map(t=>t.line_ids||[]));
  const lines = lids.length ? await rpc("account.payment.term.line","read",[lids,["nb_days","delay_type","payment_id"]],CTX) : [];
  const porTerm={}; lines.forEach(l=>{ if(l.payment_id) (porTerm[l.payment_id[0]]=porTerm[l.payment_id[0]]||[]).push(l); });
  const DIAS={};
  terms.forEach(t=>{
    const li=porTerm[t.id]||[];
    if(!li.length){ DIAS[t.id]=null; return; }
    /* Si son varias cuotas manda la última: hasta ahí se financia la venta.
       "fin del mes siguiente" se cuenta como 45 días (el promedio del mes). */
    const finMes = li.some(l=>/end_of_next_month/.test(l.delay_type||""));
    DIAS[t.id] = finMes ? 45 : Math.max(...li.map(l=>l.nb_days||0));
  });
  const RUB={};
  parts.forEach(p=>{ RUB[p.id]=EYG.rubroDe(p)||null; });
  parts.forEach(p=>{ if(!RUB[p.id] && p.parent_id) RUB[p.id]=RUB[p.parent_id[0]]||null; });
  PART={};
  parts.forEach(p=>{
    const t=p.property_payment_term_id;
    /* tagRub = lo que dice la ETIQUETA vieja, aparte de lo que diga el campo.
       Con eso se muestra qué hay escondido adentro de los rubros a reclasificar. */
    let tr=null; for(const tg of (p.category_id||[])) if(EYG.TAG_RUBRO[tg]){ tr=EYG.TAG_RUBRO[tg]; break; }
    PART[p.id]={ name:p.name||"—", rubro:RUB[p.id]||"", dias:t?(DIAS[t[0]]!=null?DIAS[t[0]]:null):null,
                 plazo:t?t[1]:"", com:p.user_id?p.user_id[1]:"", tagRub:tr };
  });
}

/* Una consulta por período. Devuelve, por cliente, venta y margen de ese período. */
async function bucket(desde, hasta){
  const g=await rpc("sale.order.line","read_group",[
    [["order_id.state","in",["sale","done"]],
     ["order_id.date_order",">=",uDesde(desde)],["order_id.date_order","<",uDesde(hasta)],
     ["purchase_price",">",0]],
    ["margin:sum","price_subtotal:sum"],["order_partner_id"]],
    Object.assign({lazy:false,limit:4000},CTX));
  const o={};
  g.forEach(x=>{ const id=x.order_partner_id&&x.order_partner_id[0]; if(!id) return;
    o[id]={v:x.price_subtotal||0, m:x.margin||0}; });
  return o;
}

async function cargar(){
  if(CACHE[GRA]){ DATOS=CACHE[GRA]; pintar(); return; }
  CARGANDO=true; pintar();
  try{
    await cargarPadron();
    const g=GRAN[GRA], hoy=EYG.argToday(), fin=g.ini(hoy);
    const claves=[]; for(let i=g.n-1;i>=0;i--) claves.push(g.prev(fin,i));
    const buckets=await Promise.all(claves.map(async k=>({key:k, porCliente:await bucket(k, g.fin(k))})));
    /* Una sola consulta más, sobre los PEDIDOS de toda la ventana. Sirve para dos
       cosas a la vez: cuántos pedidos hizo cada rubro (y su ticket promedio) y
       cuánta venta queda AFUERA del margen por no tener el costo cargado. */
    const ini=claves[0], finVentana=g.fin(claves[claves.length-1]);
    const ord=await rpc("sale.order","read_group",[
      [["state","in",["sale","done"]],["date_order",">=",uDesde(ini)],["date_order","<",uDesde(finVentana)]],
      ["amount_untaxed:sum"],["partner_id"]], Object.assign({lazy:false,limit:4000},CTX));
    const ventaTotal={}, pedidos={};
    ord.forEach(x=>{ const id=x.partner_id&&x.partner_id[0]; if(!id) return;
      const r=(PART[id]&&PART[id].rubro)||"";
      ventaTotal[r]=(ventaTotal[r]||0)+(x.amount_untaxed||0);
      pedidos[r]=(pedidos[r]||0)+(x.__count||0); });
    DATOS=CACHE[GRA]={buckets, ventaTotal, pedidos, desde:ini, hasta:hoy};
  }catch(e){
    DATOS={error:(e&&e.message)||String(e)};
  }
  CARGANDO=false; pintar();
  cargarDeuda();
}
/* Deuda abierta HOY por rubro. Va en una segunda ola porque total_due y
   total_overdue son campos calculados y tardan: la tabla no tiene que esperarlos. */
async function cargarDeuda(){
  if(DEUDA) return;
  try{
    const ps=await rpc("res.partner","search_read",[[["customer_rank",">",0],["parent_id","=",false]]],
      Object.assign({fields:["id","total_due","total_overdue"],limit:0},CTX));
    const o={};
    ps.forEach(p=>{ const r=(PART[p.id]&&PART[p.id].rubro)||"";
      const x=o[r]||(o[r]={due:0,venc:0});
      x.due+=p.total_due||0; x.venc+=Math.max(0,p.total_overdue||0); });
    DEUDA=o; if(!CARGANDO) pintar();
  }catch(e){ /* sin deuda la tabla sigue sirviendo */ }
}

/* ---------- agregados ---------- */
/* Junta todos los períodos: totales por rubro y detalle por cliente. El plazo
   de cada rubro es el PROMEDIO PONDERADO POR VENTA: un cliente grande a 90 días
   pesa más que uno chico a 30, que es como se financia en la realidad. */
function agregar(){
  const porRubro={}, porCliente={};
  (DATOS.buckets||[]).forEach(b=>{
    Object.entries(b.porCliente).forEach(([id,d])=>{
      const p=PART[id]||{}; const r=p.rubro||"";
      const R=porRubro[r]||(porRubro[r]={v:0,m:0,dias:0,conDias:0,clientes:new Set()});
      R.v+=d.v; R.m+=d.m; R.clientes.add(+id);
      if(p.dias!=null){ R.dias+=d.v*p.dias; R.conDias+=d.v; }
      const C=porCliente[id]||(porCliente[id]={v:0,m:0});
      C.v+=d.v; C.m+=d.m;
    });
  });
  return {porRubro, porCliente};
}
const metaRubro = r => EYG.RUBRO_META[r] ||
  {ab:"Sin rubro", l:"Sin rubro", ico:"❔", c:"#8A9A97", bg:"#F3F5F4",
   desc:"Clientes a los que todavía nadie les puso rubro. Se catalogan en Contactos → Rubros."};
/* margen financiero = margen nominal − lo que cuesta financiar el plazo.
   Cada mes de plazo se come `TASA` puntos del margen, porque durante ese mes la
   venta está financiada con plata que cuesta esa tasa. */
const costoPlazo = dias => (dias==null?0:(dias/30)*TASA);
function filaRubro(r,d){
  const dias = d.conDias ? d.dias/d.conDias : null;
  const mg = d.v ? d.m/d.v*100 : 0;
  const costo = costoPlazo(dias);
  return {r, v:d.v, m:d.m, mg, dias, costo, mgf:mg-costo, mfPesos:d.v*(mg-costo)/100,
          n:d.clientes.size, cli:d.clientes, ped:((DATOS.pedidos||{})[r])||0};
}

/* Qué se esconde adentro de un rubro viejo, leído de las etiquetas. Es la forma
   de ver los SAMCO (y los sanatorios, y los centros) ANTES de catalogarlos: ya
   tienen la etiqueta puesta, lo que falta es pasarla al campo Rubro. */
function adentroDe(set){
  const o={}; (set||[]).forEach(id=>{ const t=(PART[id]||{}).tagRub; if(t) o[t]=(o[t]||0)+1; });
  return Object.entries(o).sort((a,b)=>b[1]-a[1]);
}
function adentroHTML(f){
  const m=metaRubro(f.r); if(!m.viejo) return "";
  const l=adentroDe(f.cli); if(!l.length) return "";
  const txt=l.map(function(x){ return x[1]+" "+((EYG.RUBRO_META[x[0]]||{ab:x[0]}).ab); }).join(" · ");
  return '<div class="sub rojo" title="Estos clientes ya tienen una etiqueta vieja que dice lo que son, pero el rubro todavía no está puesto. Se catalogan en Contactos → Rubros y pasan a tener fila propia acá.">⚠ sin repartir: '+esc(txt)+'</div>';
}

/* ---------- pintado ---------- */
function pintar(){
  const c=document.getElementById("cont"); if(!c) return;
  if(CARGANDO){ c.innerHTML=introHTML()+barraHTML()+`<div class="card"><div class="cargando">Leyendo ventas y márgenes de Odoo… <b>${GRAN[GRA].n}</b> ${GRAN[GRA].pl}, tarda unos segundos.</div></div>`; return; }
  if(!DATOS){ c.innerHTML=introHTML()+barraHTML(); return; }
  if(DATOS.error){ c.innerHTML=introHTML()+barraHTML()+`<div class="errbox"><b>No pude leer Odoo.</b> ${esc(DATOS.error)}</div>`; return; }
  c.innerHTML = introHTML()+barraHTML()+(FOCO?detalleHTML():panoramaHTML());
  if(!FOCO) engancharGrafico();
}

function introHTML(){
  return `<div class="intro">
    <b>Qué mira esta pantalla.</b> Cuánto se vende y cuánto deja cada tipo de cliente — y, sobre todo, cuánto de ese margen se lo lleva el <b>plazo de pago</b>.
    <div class="ej">Una venta cobrada a 90 días está financiada tres meses. Si la plata cuesta <b>${p1(TASA)}</b> por mes, esa venta pierde <b>${p1(TASA*3)}</b> de margen antes de que llegue el pago. Por eso un rubro que parece dejar más puede estar dejando menos.</div>
    Pedidos confirmados, importes <b>sin IVA</b>. El plazo de cada cliente sale de lo que Odoo usa para calcular el vencimiento, no del nombre del plazo.
  </div>`;
}
const fechaLarga = s => (+s.slice(8,10))+" de "+MES[+s.slice(5,7)-1]+" de "+s.slice(0,4);
/* Una línea que diga SIEMPRE qué se está contando y desde cuándo. */
function rangoTexto(){
  if(!DATOS||!DATOS.desde) return "";
  return "del "+fechaLarga(DATOS.desde)+" al "+fechaLarga(DATOS.hasta||EYG.argToday());
}
function periodoHTML(){
  if(!DATOS||!DATOS.desde) return "";
  return `<div class="periodo" title="Todo lo que ves en esta pantalla está contado en este rango. Se toma la FECHA DEL PEDIDO, no la de la factura.">
    <span class="pk">Estás viendo</span>
    <b>${esc(rangoTexto())}</b>
    <span class="pd">${GRAN[GRA].ult} ${GRAN[GRA].n} ${GRAN[GRA].pl} · pedidos confirmados, sin IVA, por fecha de pedido</span>
  </div>`;
}
function barraHTML(){
  return `<div class="barra">
    <div class="pills">${Object.keys(GRAN).map(k=>
      `<button class="${k===GRA?"on":""}" onclick="verGran('${k}')" title="Mira ${GRAN[k].det} ${GRAN[k].n} ${GRAN[k].pl}.">${GRAN[k].lab}</button>`).join("")}</div>
    <div class="tasabox">
      <label for="tasa" title="Cuánto te cuesta la plata cada mes. Con esto se calcula lo que cuesta esperar el pago de una venta.">💸 La plata cuesta</label>
      <input id="tasa" type="number" step="0.1" min="0" max="30" value="${TASA}" onchange="setTasa(this.value)" title="Cambiala y toda la pantalla se recalcula. Queda guardada para todo el equipo.">
      <span class="pc">% por mes</span>
      <span class="de" title="Es el promedio real de los 12 préstamos bancarios cargados en Odoo (Santa Fe, Macro, BBVA y Credicoop), ponderado por monto: cada banco entre 2,6% y 3,5% mensual. No es una estimación.">¿de dónde sale?</span>
    </div>
    <span style="margin-left:auto;font-size:11.5px;color:var(--gris2)">${GRAN[GRA].ult} ${GRAN[GRA].n} ${GRAN[GRA].pl}${DATOS&&DATOS.desde?` · desde ${dm(DATOS.desde)}/${DATOS.desde.slice(2,4)}`:""}</span>
  </div>`;
}

function panoramaHTML(){
  const {porRubro}=agregar();
  const filas=Object.entries(porRubro).map(([r,d])=>filaRubro(r,d)).filter(f=>f.v>0).sort((a,b)=>b.v-a.v);
  if(!filas.length) return `<div class="card"><div class="cargando">No hay ventas con costo cargado en este período.</div></div>`;
  const V=filas.reduce((a,f)=>a+f.v,0), M=filas.reduce((a,f)=>a+f.m,0);
  const MF=filas.reduce((a,f)=>a+f.mfPesos,0);
  const mg=V?M/V*100:0, mgf=V?MF/V*100:0;
  const costoTotal=M-MF;
  const nPed=filas.reduce((a,f)=>a+f.ped,0), nCli=filas.reduce((a,f)=>a+f.n,0);
  const max=Math.max(...filas.map(f=>f.v));
  const D=DEUDA||{};
  const dueTot=Object.values(D).reduce((a,x)=>a+x.due,0), vencTot=Object.values(D).reduce((a,x)=>a+x.venc,0);

  const kpis=`<div class="kpis">
    <div class="kpi" title="Suma de los pedidos confirmados del período, sin IVA. Solo las líneas con el costo cargado, que son las que permiten calcular margen.">
      <div class="l">Venta del período</div><div class="v">${mc(V)}</div>
      <div class="s">${ent(nPed)} pedidos · ${ent(nCli)} clientes · ticket ${mc(nPed?V/nPed:0)}</div></div>
    <div class="kpi" title="Venta menos costo de la mercadería, las dos cosas sin IVA. Es el margen que se ve hoy en todos lados.">
      <div class="l">Margen nominal</div><div class="v">${p1(mg)}</div><div class="s">${mc(M)}</div></div>
    <div class="kpi ${mgf<mg/2?"alerta":""}" title="El margen que queda después de descontar lo que cuesta esperar el cobro, según el plazo real de cada cliente.">
      <div class="l">Margen real (con el plazo)</div><div class="v">${p1(mgf)}</div><div class="s">${mc(MF)}</div></div>
    <div class="kpi alerta" title="La diferencia entre los dos márgenes: cuánta plata se va en financiar los plazos de pago que damos.">
      <div class="l">Se lo come el plazo</div><div class="v">${mc(costoTotal)}</div><div class="s">${p1(mg-mgf)} de margen</div></div>
    ${DEUDA?`<div class="kpi ${vencTot>dueTot*0.2?"alerta":""}" title="Lo que los clientes deben HOY, sin importar el período elegido arriba. Entre paréntesis, la parte que ya venció.">
      <div class="l">Deuda abierta hoy</div><div class="v">${mc(dueTot)}</div><div class="s">${mc(vencTot)} vencido (${p1(dueTot?vencTot/dueTot*100:0)})</div></div>`:""}
  </div>`;

  const rows=filas.map(f=>{
    const m=metaRubro(f.r); const dd=D[f.r];
    return `<div class="trow" onclick="verRubro('${esc(f.r).replace(/'/g,"\\'")}')" title="${esc(m.desc||m.l)} — tocá para ver sus clientes uno por uno.">
      <div><div class="rname"><span class="rdot" style="background:${m.c}"></span>${m.ico} ${esc(m.l)}<span class="chev">›</span></div>
        <div class="sub">${ent(f.n)} cliente${f.n===1?"":"s"}</div>${adentroHTML(f)}
        <div class="share"><i style="width:${(f.v/max*100).toFixed(1)}%;background:${m.c}"></i></div></div>
      <div class="num big" data-l="Venta" title="${money(f.v)}">${mc(f.v)}<div class="sub">${p1(f.v/V*100)} del total</div></div>
      <div class="num" data-l="Pedidos" title="Pedidos confirmados del período y cuánto salió cada uno en promedio.">${ent(f.ped)}<div class="sub">${mc(f.ped?f.v/f.ped:0)} c/u</div></div>
      <div class="num" data-l="Margen" title="Venta menos costo de la mercadería, sin IVA.">${p1(f.mg)}<div class="sub">${mc(f.m)}</div></div>
      <div class="num" data-l="Plazo" title="Días promedio hasta el cobro, ponderado por venta: un cliente grande a 90 días pesa más que uno chico a 30.">${f.dias==null?"—":Math.round(f.dias)+" d"}</div>
      <div class="num ${f.mgf<0?"mal":f.mgf>=20?"bien":""}" data-l="Margen real" title="Lo que queda después de pagar la espera: ${p1(f.mg)} − ${p1(f.costo)} de costo del plazo.">${p1(f.mgf)}<div class="sub">${mc(f.mfPesos)}</div></div>
      <div class="num" data-l="Deuda hoy" title="${dd?`Lo que este rubro debe hoy, sin importar el período de arriba. Vencido: ${money(dd.venc)}.`:"Cargando la deuda…"}">${dd?(dd.due<0?mc(-dd.due)+" a favor":mc(dd.due)):"…"}<div class="sub ${dd&&dd.venc>0?"rojo":""}">${dd?(dd.venc>0?mc(dd.venc)+" vencido":"al día"):""}</div></div>
    </div>`;
  }).join("");

  /* Cuánta venta se está dejando afuera por no tener el costo cargado. */
  const fuera=Object.entries(DATOS.ventaTotal||{}).map(([r,t])=>{
    const d=porRubro[r]; const con=d?d.v:0; const dif=t-con;
    return {r, t, dif, pct:t?dif/t*100:0};
  }).filter(x=>x.pct>=5 && x.dif>0).sort((a,b)=>b.dif-a.dif);
  const aviso=fuera.length?`<div class="avisos">⚠️ Ojo al leer estos márgenes: hay venta <b>sin costo cargado</b> que queda afuera del cálculo —
    ${fuera.map(x=>`<b>${esc(metaRubro(x.r).ab)}</b> ${p1(x.pct)} (${mc(x.dif)})`).join(" · ")}.
    En esos rubros el margen está calculado sobre el resto, así que tomalo como referencia y no como número cerrado.</div>`:"";

  return periodoHTML()+kpis+graficoHTML(filas)+`<div class="card">
    <h3>📊 Rentabilidad por rubro <span class="hint">${rangoTexto()} · tocá un rubro para ver sus clientes</span></h3>
    <div class="thead">
      <div>Rubro</div><div class="num">Venta</div><div class="num">Pedidos</div><div class="num">Margen</div>
      <div class="num">Plazo</div><div class="num">Margen real</div><div class="num">Deuda hoy</div>
    </div>
    ${rows}
    <div class="trow tot">
      <div><div class="rname">Total</div><div class="sub">${ent(nCli)} clientes</div></div>
      <div class="num big" data-l="Venta">${mc(V)}<div class="sub">100%</div></div>
      <div class="num" data-l="Pedidos">${ent(nPed)}<div class="sub">${mc(nPed?V/nPed:0)} c/u</div></div>
      <div class="num" data-l="Margen">${p1(mg)}<div class="sub">${mc(M)}</div></div>
      <div class="num" data-l="Plazo">—</div>
      <div class="num" data-l="Margen real">${p1(mgf)}<div class="sub">${mc(MF)}</div></div>
      <div class="num" data-l="Deuda hoy">${DEUDA?(dueTot<0?mc(-dueTot)+" a favor":mc(dueTot)):"…"}<div class="sub ${vencTot>0?"rojo":""}">${DEUDA?mc(vencTot)+" vencido":""}</div></div>
    </div>
    ${aviso}
  </div>`;
}

/* Barras apiladas: cómo se mueve la mezcla de rubros período a período. */
function graficoHTML(filas){
  const orden=filas.map(f=>f.r);
  const pts=(DATOS.buckets||[]).map(b=>{
    const seg={}; let tot=0;
    Object.entries(b.porCliente).forEach(([id,d])=>{ const r=(PART[id]&&PART[id].rubro)||""; seg[r]=(seg[r]||0)+d.v; tot+=d.v; });
    return {key:b.key, seg, tot};
  });
  if(!pts.length) return "";
  const max=Math.max(...pts.map(p=>p.tot),1);
  const esc10=Math.pow(10,Math.floor(Math.log10(max)));
  const top=Math.ceil(max/esc10*2)/2*esc10 || max;
  const chico=(window.innerWidth||1000)<760;
  const W=chico?430:1000, H=chico?260:230, PL=chico?46:52, PR=8, PT=14, PB=26;
  const x0=PL, x1=W-PR, y0=PT, y1=H-PB;
  const Y=v=>y1-(v/top)*(y1-y0);
  const slot=(x1-x0)/pts.length, bw=Math.min(slot*0.64,52), off=(slot-bw)/2;
  let grid="";
  for(let i=0;i<=2;i++){ const v=top*i/2, y=Y(v);
    grid+=`<line x1="${x0}" y1="${y.toFixed(1)}" x2="${x1}" y2="${y.toFixed(1)}" stroke="#EBF2F1" stroke-width="1"/>`
        + `<text x="${x0-8}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="${chico?12:11}" font-weight="700" fill="#9AACA8">${i?esc(mc(v)):"0"}</text>`; }
  let bars="", hits="", labs="";
  pts.forEach((p,i)=>{
    const x=x0+slot*i+off; let acc=0;
    orden.forEach(r=>{ const v=p.seg[r]||0; if(v<=0) return;
      const yT=Y(acc+v), yB=Y(acc);
      bars+=`<rect x="${x.toFixed(1)}" y="${yT.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(yB-yT-1,1).toFixed(1)}" fill="${metaRubro(r).c}"/>`;
      acc+=v; });
    hits+=`<rect class="hit" data-i="${i}" x="${(x0+slot*i).toFixed(1)}" y="${y0}" width="${slot.toFixed(1)}" height="${(y1-y0).toFixed(1)}" fill="transparent"/>`;
    const paso=Math.ceil(pts.length/(chico?5:14));
    if(i%paso===0||i===pts.length-1)
      labs+=`<text x="${(x0+slot*i+slot/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="${chico?12:11}" font-weight="700" fill="#9AACA8">${esc(etiqueta(GRA,p.key))}</text>`;
  });
  window._PTS=pts; window._ORDEN=orden;
  return `<div class="card">
    <h3>📈 Cómo se mueve la mezcla <span class="hint">venta por rubro, ${GRAN[GRA].uni} a ${GRAN[GRA].uni}</span></h3>
    <div class="chartwrap" id="gr">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Venta por rubro">${grid}${bars}${labs}${hits}</svg>
      <div class="tt" id="grtt"></div>
    </div>
    <div class="leyenda">${orden.map(r=>{const m=metaRubro(r); return `<span title="${esc(m.ab)}"><i style="background:${m.c}"></i>${m.ico} ${esc(m.ab)}</span>`;}).join("")}</div>
  </div>`;
}
function engancharGrafico(){
  const w=document.getElementById("gr"), tt=document.getElementById("grtt"); if(!w||!tt) return;
  const svg=w.querySelector("svg"); if(!svg) return;
  svg.addEventListener("mouseleave", ()=>tt.classList.remove("on"));
  svg.addEventListener("mousemove", ev=>{
    const t=ev.target; if(!t.classList.contains("hit")) return;
    const p=(window._PTS||[])[+t.dataset.i]; if(!p) return;
    const filas=(window._ORDEN||[]).filter(r=>(p.seg[r]||0)>0)
      .map(r=>`<div><b style="color:${metaRubro(r).c}">■</b> ${esc(metaRubro(r).ab)} · ${esc(mc(p.seg[r]))} <span style="opacity:.7">(${esc(p1(p.seg[r]/p.tot*100))})</span></div>`);
    tt.innerHTML=`<div class="t1">${esc(etiquetaLarga(GRA,p.key))}</div><div>${esc(mc(p.tot))}</div>${filas.join("")||"<div>sin ventas</div>"}`;
    const r=t.getBoundingClientRect(), wr=w.getBoundingClientRect();
    tt.style.left=(r.left-wr.left+r.width/2)+"px";
    tt.style.top=(r.top-wr.top+r.height*0.3)+"px";
    tt.classList.add("on");
  });
}

/* ---------- detalle de un rubro ---------- */
function detalleHTML(){
  const {porCliente}=agregar();
  const m=metaRubro(FOCO);
  const lista=Object.entries(porCliente)
    .filter(([id])=>((PART[id]&&PART[id].rubro)||"")===FOCO)
    .map(([id,d])=>{
      const p=PART[id]||{}; const mg=d.v?d.m/d.v*100:0; const costo=costoPlazo(p.dias);
      return {id:+id, name:p.name||"—", com:p.com||"", v:d.v, m:d.m, mg, dias:p.dias, plazo:p.plazo, mgf:mg-costo};
    }).sort((a,b)=>b.v-a.v);
  const V=lista.reduce((a,c)=>a+c.v,0), M=lista.reduce((a,c)=>a+c.m,0);
  const pierden=lista.filter(c=>c.mgf<0);
  const rows=lista.slice(0,300).map(c=>`<div class="crow">
      <div><div class="cn" title="${esc(c.name)}">${esc(c.name)}</div><div class="cm">${esc(c.com||"sin comercial")}${c.plazo?` · ${esc(c.plazo)}`:""}</div></div>
      <div class="num" data-l="Venta" title="${money(c.v)}">${mc(c.v)}</div>
      <div class="num" data-l="% del rubro" title="Qué parte de la venta del rubro es este cliente.">${p1(V?c.v/V*100:0)}</div>
      <div class="num" data-l="Margen" title="Venta menos costo, sin IVA.">${p1(c.mg)}</div>
      <div class="num" data-l="Plazo" title="Días reales hasta el vencimiento, según la línea del plazo de pago.">${c.dias==null?"—":c.dias+" d"}</div>
      <div class="num ${c.mgf<0?"mal":c.mgf>=20?"bien":""}" data-l="Margen real" title="Margen menos el costo de esperar el cobro.">${p1(c.mgf)}${c.mgf<0?' <span class="badge mal">pierde</span>':""}</div>
    </div>`).join("");
  const alerta=pierden.length?`<div class="avisos">🔴 <b>${pierden.length} cliente(s) de este rubro pierden plata</b> una vez descontado el costo del plazo:
    ${pierden.slice(0,6).map(c=>`${esc(c.name)} (${p1(c.mgf)}, ${mc(c.v)})`).join(" · ")}${pierden.length>6?` y ${pierden.length-6} más`:""}.</div>`:"";
  return `<button class="back" onclick="verRubro(null)">← Volver a todos los rubros</button>`+periodoHTML()+`
    <div class="card">
      <h3><span class="rdot" style="background:${m.c}"></span>${m.ico} ${esc(m.l)}
        <span class="hint">${lista.length} clientes · ${mc(V)} · margen ${p1(V?M/V*100:0)}</span></h3>
      <div class="avisos" style="padding-top:8px;color:var(--gris)">${esc(m.desc||"")}</div>
      <div class="chead"><div>Cliente</div><div class="num">Venta</div><div class="num">%</div><div class="num">Margen</div><div class="num">Plazo</div><div class="num">Margen real</div></div>
      ${rows||'<div class="cargando">Sin ventas con costo cargado en este período.</div>'}
      ${lista.length>300?'<div class="avisos">Mostrando los 300 que más compraron.</div>':""}
      ${alerta}
    </div>`;
}

/* ---------- acciones ---------- */
function verGran(k){ if(k===GRA) return; GRA=k; FOCO=null; cargar(); }
function verRubro(r){ FOCO=r||null; pintar(); window.scrollTo(0,0); }
async function setTasa(v){
  const n=Math.max(0, Math.min(30, parseFloat(String(v).replace(",","."))||0));
  TASA=n; pintar();
  try{ await rpc("ir.config_parameter","set_param",[TASA_KEY, String(n)]); }catch(e){}
}
async function leerTasa(){
  try{ const v=await rpc("ir.config_parameter","get_param",[TASA_KEY]); const n=parseFloat(v); if(n>0) TASA=n; }catch(e){}
}

/* =========================== arranque =========================== */
EYG.requireAuth(["finanzas","direccion"], perfil=>{
  document.body.innerHTML = EYG.layout(perfil, "rentabilidad", '<div id="cont"></div>', "Rentabilidad por rubro");
  leerTasa().then(cargar);
});
</script>
