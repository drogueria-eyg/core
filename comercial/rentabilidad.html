<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Rentabilidad comercial · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<style>
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--teal-deep);font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  h2.sec:before{content:"";width:5px;height:16px;background:var(--teal);border-radius:3px}
  h2.sec .ayuda{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--gris2)}

  .per{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .per button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:7px 13px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
  .per button.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .per .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  .per input[type=month]{border:1px solid var(--line);border-radius:9px;padding:6px 10px;font:inherit;font-size:12.5px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:12px;margin-bottom:6px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .kpi .t{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--gris2);font-weight:800}
  .kpi .v{font-size:23px;font-weight:900;color:var(--ink);margin-top:4px;letter-spacing:-.5px}
  .kpi .s{font-size:11.5px;color:var(--gris);margin-top:3px}
  .kpi.ok .v{color:var(--ok)} .kpi.mal .v{color:var(--coral)} .kpi.teal .v{color:var(--teal)}

  table.rt{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  table.rt th{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--gris2);font-weight:800;text-align:right;padding:9px 10px;background:#FAFCFC;border-bottom:1px solid var(--line);white-space:nowrap}
  table.rt th.nm,table.rt td.nm{text-align:left}
  table.rt td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);font-size:12.5px;white-space:nowrap}
  table.rt tr:last-child td{border-bottom:none}
  table.rt tr.tot td{font-weight:900;background:#F3FAF8}
  table.rt tr.cli{cursor:pointer} table.rt tr.cli:hover td{background:#F7FBFA}
  .neg{color:var(--coral)} .pos{color:var(--ok)}
  .mut{color:var(--gris2);font-size:11px}

  .gr{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
  .leg{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--gris);margin-top:8px}
  .leg span{display:inline-flex;align-items:center;gap:6px}
  .leg i{width:11px;height:11px;border-radius:3px;display:inline-block}

  .desg{background:#FAFDFC;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
  .drow{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:12.5px;border-bottom:1px dashed var(--line)}
  .drow:last-child{border-bottom:none}
  .drow.t{font-weight:900;border-top:2px solid var(--line);margin-top:4px;padding-top:8px}
  .drow .l{color:var(--gris)}

  .knobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .knob label{display:block;font-size:11px;font-weight:800;color:var(--teal-deep);margin-bottom:5px}
  .knob input{width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font:inherit;font-size:13px}
  .knob .kd{font-size:10.5px;color:var(--gris2);margin-top:4px;line-height:1.35}
  .aviso{background:#FFFDF5;border:1px solid #EFE0B0;border-radius:12px;padding:12px 15px;font-size:12.5px;line-height:1.5;margin:12px 0}
  .btn{border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:10px;padding:9px 16px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}
  .btn.sec{background:#fff;color:var(--teal-deep)}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=113"></script>
<script>
const M=EYG.money, esc=EYG.esc;
const M1=n=>{const a=Math.abs(n||0); const s=n<0?"−":"";
  return a>=1e6? s+"$"+(a/1e6).toFixed(1).replace(".",",")+"M" : s+"$"+Math.round(a/1000)+"k"; };
const P=n=>isFinite(n)?(n*100).toFixed(1).replace(".",",")+"%":"—";
const MESL=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const mesLbl=k=>{const [y,m]=k.split("-"); return MESL[(+m)-1]+" "+y.slice(2);};
const hoy=()=>EYG.argToday?EYG.argToday():new Date().toISOString().slice(0,10);
const mesDe=f=>String(f).slice(0,7);
const finDeMes=k=>{const [y,m]=k.split("-").map(Number); return k+"-"+String(new Date(y,m,0).getDate()).padStart(2,"0");};
const mesesEntre=(a,b)=>{const out=[]; let [y,m]=a.split("-").map(Number); const [fy,fm]=b.split("-").map(Number);
  while(y<fy||(y===fy&&m<=fm)){ out.push(y+"-"+String(m).padStart(2,"0")); m++; if(m>12){m=1;y++;} } return out;};

/* ===== LA CONFIGURACIÓN DE COSTOS =====
   Vive en ir.config_parameter `eyg.costos_comerciales`. Odoo NO tiene los sueldos: el módulo de
   personal está vacío (0 contratos, 0 recibos) y en la contabilidad todo va a "Sueldos
   Administrativos", sin abrir por persona ni por área. Así que el básico de cada una se carga acá.

   SUELDOS CON VIGENCIA: cada persona tiene una lista {desde, bruto}. El costo de un mes usa el
   valor que regía ESE mes, así un aumento en noviembre no reescribe lo que costó octubre. Es la
   misma regla que en las comisiones, y por la misma razón: un número ya informado no se mueve. */
const COSTOS_KEY="eyg.costos_comerciales";
const COSTOS_DEF={
  cargas:{ patronales:0.2400, art:0.0300, artFijo:0, seguroVida:0, sindicato:0, comisionLlevaCargas:true },
  provisiones:{ sac:0.0833, vacaciones:0, cargasSobreSac:true },
  personas:{}   // uid -> {nombre, sueldos:[{desde:"YYYY-MM", bruto:N}], viaticos:N}
};
let CFG=null, COMIS={}, DATOS=null;
const ST={ desde:null, hasta:null, preset:"3m", abierta:null, vista:"resumen" };

/* el sueldo que regía en un mes */
function sueldoDe(uid, mes){
  const p=(CFG.personas||{})[String(uid)]; if(!p) return 0;
  const l=(p.sueldos||[]).filter(s=>s.desde<=mes).sort((a,b)=>a.desde<b.desde?-1:1);
  return l.length? (+l[l.length-1].bruto||0) : 0;
}
/* EL COSTO DE UNA COMERCIAL EN UN MES, devengado.
   Devengado y no "lo que salió del banco": el aguinaldo se gana todos los meses aunque se pague
   en dos, y las cargas de un mes se depositan al siguiente. Si se mirara la caja, el costo
   saltaría en junio y diciembre y mentiría el resto del año. */
function costoDe(uid, mes, comision){
  const c=CFG.cargas||{}, pr=CFG.provisiones||{};
  const per=(CFG.personas||{})[String(uid)]||{};
  const bruto=sueldoDe(uid,mes);
  const comi=+comision||0;
  /* MONOTRIBUTISTA: factura. No hay cargas, ni SAC, ni ART, ni seguro de vida — su costo es
     lo que factura más la comisión y los viáticos. Aplicarle la fórmula de relación de
     dependencia le sumaría casi un 40% que la empresa no paga, y el margen de su cartera
     saldría mal. */
  if(per.regimen==="monotributo"){
    const v=(+per.viaticos||0);
    return { regimen:"monotributo", bruto, comi, sac:0, patronales:0, art:0, otros:0,
             vacaciones:0, viaticos:v, total: bruto+comi+v };
  }
  const remun = bruto + (c.comisionLlevaCargas!==false ? comi : 0);
  const sac   = remun*(+pr.sac||0);
  const base  = remun + (pr.cargasSobreSac!==false ? sac : 0);
  const patr  = base*(+c.patronales||0);
  const art   = base*(+c.art||0) + (+c.artFijo||0);
  const otros = (+c.seguroVida||0) + (+c.sindicato||0);
  const vac   = remun*(+pr.vacaciones||0);
  const viat  = (+per.viaticos||0);
  return { regimen:"relacion", bruto, comi, sac, patronales:patr, art, otros, vacaciones:vac,
           viaticos:viat, total: bruto+comi+sac+patr+art+otros+vac+viat };
}

EYG.guard(["admin","direccion","finanzas"]).then(async perfil=>{
  document.body.innerHTML=EYG.layout(perfil,"comerciales",
    `<div id="cap"><div class="spin"></div><p class="cargando">Leyendo ventas, margen y comisiones…</p></div>`,"Rentabilidad comercial");
  const h=hoy(); ST.hasta=mesDe(h);
  ST.desde=(()=>{ let [y,m]=ST.hasta.split("-").map(Number); m-=2; while(m<1){m+=12;y--;} return y+"-"+String(m).padStart(2,"0"); })();
  try{ await cargar(); render(); }
  catch(e){ document.getElementById("cap").innerHTML=`<div class="nota aviso"><b>No pude leer los datos.</b> ${esc(String(e.message||e))}</div>`; }
});

/* ===== lectura ===== */
async function cargar(){
  /* La config de costos. Si nunca se cargó, se arranca con la de fábrica y los sueldos en cero:
     el módulo igual muestra venta, margen y comisión, que es lo que ya existe. */
  try{ CFG=Object.assign({},COSTOS_DEF,JSON.parse(await EYG.rpc("ir.config_parameter","get_param",[COSTOS_KEY])||"{}")); }
  catch(e){ CFG=JSON.parse(JSON.stringify(COSTOS_DEF)); }
  CFG.cargas=Object.assign({},COSTOS_DEF.cargas,CFG.cargas||{});
  CFG.provisiones=Object.assign({},COSTOS_DEF.provisiones,CFG.provisiones||{});
  CFG.personas=CFG.personas||{};

  const meses=mesesEntre(ST.desde,ST.hasta);
  /* UNA sola consulta para todo el período: el margen vive en la cabecera del pedido, así que
     agrupando por día y vendedor sale venta y margen de una. Se cotejó contra el renglón por
     renglón y da igual al peso en las cinco comerciales. */
  const g=await EYG.rpc("sale.order","read_group",[[["state","in",["sale","done"]],
    ["date_order",">=",ST.desde+"-01"],["date_order","<=",finDeMes(ST.hasta)+" 23:59:59"]],
    ["amount_untaxed:sum","margin:sum"],["date_order:day","user_id"]],{lazy:false});

  /* Las comisiones REALES salen del cierre congelado de cada mes. Un mes sin liquidar no tiene
     comisión cierta: se marca aparte y no se inventa un número. */
  COMIS={};
  let cierres=[]; try{ cierres=JSON.parse(await EYG.rpc("ir.config_parameter","get_param",["eyg.comisiones_cierres"])||"[]"); }catch(e){}
  for(const mes of meses.filter(m=>cierres.includes(m))){
    try{
      const c=JSON.parse(await EYG.rpc("ir.config_parameter","get_param",["eyg.comisiones_cierre_"+mes])||"{}");
      COMIS[mes]={}; for(const x of (c.comerciales||[])) COMIS[mes][x.uid]={comi:x.comiFinal||0, neto:x.neto||0, nombre:x.nombre};
    }catch(e){}
  }

  /* Gerencia y Dirección venden, pero con margen de 84-88%: son productos sin costo cargado
     (triangulación y similares). No son fuerza de ventas y meterlos acá taparía el número real,
     así que se listan aparte. Quién es comercial lo dice el departamento Ventas de Odoo. */
  const emps=await EYG.rpc("hr.employee","search_read",[[["department_id.complete_name","ilike","Ventas"]]],{fields:["name","user_id"],limit:0}).catch(()=>[]);
  const uidVentas=new Set(emps.map(e=>e.user_id&&e.user_id[0]).filter(Boolean));

  const dias={}, porCom={}, otros={};
  for(const r of g){
    const rg=r.__range&&r.__range["date_order:day"];
    const dia=rg?String(rg.from).slice(0,10):null;
    const u=r.user_id||[]; const uid=u[0], nom=u[1]||"?";
    if(!dia||!uid) continue;
    const v=r.amount_untaxed||0, mg=r.margin||0, mes=dia.slice(0,7);
    if(!uidVentas.has(uid)){ (otros[nom]=otros[nom]||{v:0,m:0}); otros[nom].v+=v; otros[nom].m+=mg; continue; }
    const P1=(porCom[uid]=porCom[uid]||{uid,nombre:nom,meses:{},v:0,m:0});
    P1.v+=v; P1.m+=mg;
    const mm=(P1.meses[mes]=P1.meses[mes]||{v:0,m:0}); mm.v+=v; mm.m+=mg;
    const dd=(dias[dia]=dias[dia]||{v:0,m:0}); dd.v+=v; dd.m+=mg;
  }
  DATOS={ meses, dias, porCom, otros, cierres };
}

/* ===== cálculo ===== */
function filas(){
  const out=[];
  for(const uid of Object.keys(DATOS.porCom)){
    const p=DATOS.porCom[uid];
    let comi=0, costo={bruto:0,comi:0,sac:0,patronales:0,art:0,otros:0,vacaciones:0,viaticos:0,total:0}, sinLiq=[];
    for(const mes of DATOS.meses){
      const mm=p.meses[mes]; if(!mm && !sueldoDe(uid,mes)) continue;
      const cm=(COMIS[mes]&&COMIS[mes][uid])?COMIS[mes][uid].comi:null;
      if(cm==null && mm) sinLiq.push(mes);
      const c=costoDe(uid,mes,cm||0);
      for(const k in costo) costo[k]+=c[k];
      comi+=cm||0;
    }
    const neto=p.m-costo.total;
    out.push({uid:+uid, nombre:p.nombre, venta:p.v, margen:p.m, pctMargen:p.v?p.m/p.v:0,
      comi, costo, costoTotal:costo.total, neto, pctNeto:p.v?neto/p.v:0,
      equilibrio: (p.v&&p.m>0)? costo.total/(p.m/p.v) : null, sinLiq});
  }
  return out.sort((a,b)=>b.margen-a.margen);
}
const sumar=fs=>fs.reduce((a,f)=>({venta:a.venta+f.venta,margen:a.margen+f.margen,comi:a.comi+f.comi,
  costoTotal:a.costoTotal+f.costoTotal,neto:a.neto+f.neto}),{venta:0,margen:0,comi:0,costoTotal:0,neto:0});

/* ===== pantalla ===== */
function render(){
  const F=filas(), T=sumar(F);
  const haySueldos=Object.values(CFG.personas||{}).some(p=>(p.sueldos||[]).some(s=>+s.bruto>0));
  const sinLiq=[...new Set(F.flatMap(f=>f.sinLiq))].sort();
  document.getElementById("cap").outerHTML=`<div id="cap">
    ${periodoHTML()}
    ${!haySueldos?`<div class="aviso"><b>Faltan los sueldos.</b> Odoo no los tiene: el módulo de personal está vacío y en la contabilidad todo va a “Sueldos Administrativos”, sin abrir por persona ni por área — las cuentas “Sueldos Comercial” y “Cargas Sociales Comercial” tienen cero asientos en 2026. Hasta que se carguen, el costo que se ve es sólo la comisión. <button class="btn sec" style="margin-left:6px" onclick="irA('costos')">Cargar sueldos y cargas</button></div>`:""}
    ${sinLiq.length?`<div class="aviso">Hay ${sinLiq.length===1?"un mes sin liquidar":"meses sin liquidar"}: <b>${sinLiq.map(mesLbl).join(", ")}</b>. De esos meses no hay comisión cierta, así que entra en cero y el margen que ves queda <b>mejor de lo que va a ser</b>.</div>`:""}
    ${kpisHTML(T,F)}
    <h2 class="sec">Por comercial <span class="ayuda">tocá una fila para ver el desglose del costo</span></h2>
    ${tablaHTML(F,T)}
    ${ST.abierta?desgloseHTML(F.find(f=>f.uid===ST.abierta)):""}
    <h2 class="sec">Mes a mes</h2>
    ${mesesHTML(F)}
    <h2 class="sec">Día a día <span class="ayuda">venta y margen de los pedidos, acumulado del período</span></h2>
    ${diasHTML()}
    ${otrosHTML()}
    <h2 class="sec">Sueldos y cargas <span class="ayuda">lo que no está en Odoo y se carga acá</span></h2>
    <div id="costos">${costosHTML()}</div>
  </div>`;
}

function periodoHTML(){
  const b=(k,t)=>`<button class="${ST.preset===k?"on":""}" onclick="setPreset('${k}')">${t}</button>`;
  return `<div class="per">
    ${b("mes","Este mes")}${b("ant","Mes pasado")}${b("3m","Últimos 3")}${b("6m","Últimos 6")}${b("ano","Año")}
    <span class="sep"></span>
    <input type="month" id="f_desde" value="${ST.desde}" max="${ST.hasta}" onchange="setRango()">
    <span class="mut">a</span>
    <input type="month" id="f_hasta" value="${ST.hasta}" onchange="setRango()">
  </div>`;
}
function kpisHTML(T,F){
  const pm=T.venta?T.margen/T.venta:0, pn=T.venta?T.neto/T.venta:0;
  const pc=T.margen?T.costoTotal/T.margen:0;
  return `<div class="kpis">
    <div class="kpi"><div class="t">Vendido</div><div class="v">${M1(T.venta)}</div><div class="s">${F.length} comerciales · pedidos confirmados</div></div>
    <div class="kpi teal"><div class="t">Margen bruto</div><div class="v">${M1(T.margen)}</div><div class="s">${P(pm)} de la venta</div></div>
    <div class="kpi"><div class="t">Costo de la fuerza</div><div class="v">${M1(T.costoTotal)}</div><div class="s">${P(pc)} del margen${T.comi?` · comisión ${M1(T.comi)}`:""}</div></div>
    <div class="kpi ${T.neto>=0?"ok":"mal"}"><div class="t">Margen después del costo</div><div class="v">${M1(T.neto)}</div><div class="s">${P(pn)} de la venta</div></div>
  </div>`;
}
function tablaHTML(F,T){
  const fila=f=>`<tr class="cli" onclick="abrir(${f.uid})"><td class="nm"><b>${esc(f.nombre)}</b>${f.sinLiq.length?` <span class="mut">· ${f.sinLiq.length} mes(es) sin liquidar</span>`:""}</td>
    <td>${M1(f.venta)}</td><td>${M1(f.margen)}</td><td>${P(f.pctMargen)}</td>
    <td>${f.comi?M1(f.comi):"—"}</td><td>${f.costoTotal?M1(f.costoTotal):"—"}</td>
    <td class="${f.neto>=0?"pos":"neg"}"><b>${M1(f.neto)}</b></td><td class="${f.neto>=0?"pos":"neg"}">${P(f.pctNeto)}</td>
    <td>${f.equilibrio?M1(f.equilibrio):"—"}</td></tr>`;
  return `<table class="rt">
    <tr><th class="nm">Comercial</th><th>Vendido</th><th>Margen</th><th>%</th><th>Comisión</th><th>Costo total</th><th>Queda</th><th>% s/venta</th><th>Equilibrio</th></tr>
    ${F.map(fila).join("")}
    <tr class="tot"><td class="nm">Total</td><td>${M1(T.venta)}</td><td>${M1(T.margen)}</td><td>${P(T.venta?T.margen/T.venta:0)}</td>
      <td>${M1(T.comi)}</td><td>${M1(T.costoTotal)}</td><td class="${T.neto>=0?"pos":"neg"}">${M1(T.neto)}</td>
      <td class="${T.neto>=0?"pos":"neg"}">${P(T.venta?T.neto/T.venta:0)}</td><td></td></tr>
  </table>
  <div class="mut" style="margin-top:7px"><b>Equilibrio</b>: cuánto tendría que vender, a su mismo margen, para cubrir lo que cuesta.</div>`;
}
function desgloseHTML(f){
  if(!f) return "";
  const c=f.costo, r=(l,v,cl)=>`<div class="drow"><span class="l">${l}</span><b class="${cl||""}">${M(v)}</b></div>`;
  return `<div class="desg">
    <div style="font-size:13.5px;font-weight:900;margin-bottom:8px">${esc(f.nombre)} · de dónde sale el número</div>
    ${r("Margen bruto de sus ventas",f.margen,"pos")}
    <div style="height:8px"></div>
    ${c.regimen==="monotributo"
      ? r("Honorarios (monotributo)",c.bruto)+r("Comisión",c.comi)+(c.viaticos?r("Viáticos",c.viaticos):"")+
        '<div class="mut" style="padding:4px 0">Factura: no genera cargas sociales, SAC ni ART.</div>'
      : r("Sueldo bruto (básico + antigüedad)",c.bruto)+r("Comisión",c.comi)+r("SAC devengado",c.sac)+
        r("Contribuciones patronales",c.patronales)+r("ART",c.art)+
        (c.otros?r("Seguro de vida",c.otros):"")+(c.vacaciones?r("Vacaciones provisionadas",c.vacaciones):"")+
        (c.viaticos?r("Viáticos",c.viaticos):"")}
    <div class="drow t"><span>Costo total</span><b>${M(f.costoTotal)}</b></div>
    <div class="drow t"><span>Queda para la casa</span><b class="${f.neto>=0?"pos":"neg"}">${M(f.neto)} · ${P(f.pctNeto)} de su venta</b></div>
  </div>`;
}
/* gráfico de barras mes a mes: margen bruto contra costo de la fuerza */
function mesesHTML(F){
  const ms=DATOS.meses.map(mes=>{
    let v=0,m=0,c=0;
    for(const uid of Object.keys(DATOS.porCom)){
      const mm=DATOS.porCom[uid].meses[mes]; if(mm){ v+=mm.v; m+=mm.m; }
      const cm=(COMIS[mes]&&COMIS[mes][uid])?COMIS[mes][uid].comi:0;
      if(mm||sueldoDe(uid,mes)) c+=costoDe(uid,mes,cm).total;
    }
    return {mes,v,m,c,n:m-c};
  });
  const max=Math.max(1,...ms.map(x=>Math.max(x.m,x.c)));
  const W=Math.max(360, ms.length*86), H=170, pad=26;
  const bw=(W-pad*2)/ms.length;
  const barras=ms.map((x,i)=>{
    const x0=pad+i*bw, w=bw*0.33;
    const hm=(x.m/max)*(H-40), hc=(x.c/max)*(H-40);
    return `<rect x="${x0+bw*0.12}" y="${H-20-hm}" width="${w}" height="${Math.max(1,hm)}" rx="3" fill="var(--teal)"></rect>
      <rect x="${x0+bw*0.5}" y="${H-20-hc}" width="${w}" height="${Math.max(1,hc)}" rx="3" fill="var(--coral)"></rect>
      <text x="${x0+bw/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--gris2)">${mesLbl(x.mes)}</text>`;
  }).join("");
  return `<div class="gr">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px">${barras}</svg>
    <div class="leg"><span><i style="background:var(--teal)"></i>Margen bruto</span><span><i style="background:var(--coral)"></i>Costo de la fuerza</span></div>
    <table class="rt" style="margin-top:12px;border:none">
      <tr><th class="nm">Mes</th><th>Vendido</th><th>Margen</th><th>%</th><th>Costo</th><th>Queda</th><th>% s/venta</th></tr>
      ${ms.map(x=>`<tr><td class="nm"><b>${mesLbl(x.mes)}</b>${DATOS.cierres.includes(x.mes)?"":' <span class="mut">sin liquidar</span>'}</td>
        <td>${M1(x.v)}</td><td>${M1(x.m)}</td><td>${P(x.v?x.m/x.v:0)}</td><td>${x.c?M1(x.c):"—"}</td>
        <td class="${x.n>=0?"pos":"neg"}"><b>${M1(x.n)}</b></td><td class="${x.n>=0?"pos":"neg"}">${P(x.v?x.n/x.v:0)}</td></tr>`).join("")}
    </table>
  </div>`;
}
/* curva acumulada del período, día por día */
function diasHTML(){
  const ds=Object.keys(DATOS.dias).sort();
  if(!ds.length) return `<div class="gr"><div class="mut">Sin pedidos en el período.</div></div>`;
  let av=0, am=0; const pts=[];
  for(const d of ds){ av+=DATOS.dias[d].v; am+=DATOS.dias[d].m; pts.push({d,av,am}); }
  const max=Math.max(1,av), W=720, H=150, pad=24;
  const px=i=>pad+(i/(Math.max(1,pts.length-1)))*(W-pad*2);
  const py=v=>H-18-(v/max)*(H-34);
  const linea=(sel,col)=>`<polyline fill="none" stroke="${col}" stroke-width="2.5" points="${pts.map((p,i)=>px(i)+","+py(sel(p))).join(" ")}"></polyline>`;
  return `<div class="gr">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px">
      ${linea(p=>p.av,"var(--teal)")}${linea(p=>p.am,"var(--gold)")}
      <text x="${pad}" y="${H-3}" font-size="10" fill="var(--gris2)">${ds[0].slice(8)}/${ds[0].slice(5,7)}</text>
      <text x="${W-pad}" y="${H-3}" text-anchor="end" font-size="10" fill="var(--gris2)">${ds[ds.length-1].slice(8)}/${ds[ds.length-1].slice(5,7)}</text>
    </svg>
    <div class="leg"><span><i style="background:var(--teal)"></i>Vendido acumulado ${M1(av)}</span><span><i style="background:var(--gold)"></i>Margen acumulado ${M1(am)}</span><span class="mut">${ds.length} días con pedidos</span></div>
  </div>`;
}
function otrosHTML(){
  const o=DATOS.otros||{}; const ks=Object.keys(o).filter(k=>o[k].v>0).sort((a,b)=>o[b].v-o[a].v);
  if(!ks.length) return "";
  return `<h2 class="sec">Fuera de la fuerza de ventas <span class="ayuda">pedidos cargados por otras personas</span></h2>
  <table class="rt"><tr><th class="nm">Quién</th><th>Vendido</th><th>Margen</th><th>%</th></tr>
    ${ks.map(k=>{const x=o[k], p=x.v?x.m/x.v:0;
      return `<tr><td class="nm">${esc(k)}</td><td>${M1(x.v)}</td><td>${M1(x.m)}</td><td class="${p>0.5?"neg":""}">${P(p)}${p>0.5?' <span class="mut">← revisar costos</span>':""}</td></tr>`;}).join("")}
  </table>
  <div class="mut" style="margin-top:7px">No entran en el cálculo de arriba: no son fuerza de ventas. Un margen por encima del 50% casi siempre significa <b>productos sin costo cargado</b>, no una venta extraordinaria.</div>`;
}
function costosHTML(){
  const c=CFG.cargas, pr=CFG.provisiones;
  const pct=(id,lbl,val,ayuda)=>`<div class="knob"><label>${lbl}</label><input type="number" step="0.01" id="${id}" value="${(val*100).toFixed(2)}"><div class="kd">${ayuda}</div></div>`;
  const uids=Object.keys(DATOS.porCom);
  const mesAct=ST.hasta;
  return `<div class="gr">
    <div class="knobs">
      ${pct("k_patr","Contribuciones patronales %",c.patronales,"Lo que paga la empresa sobre el sueldo bruto.")}
      ${pct("k_art","ART %",c.art,"Porcentaje sobre la masa salarial.")}
      ${pct("k_sac","SAC devengado %",pr.sac,"8,33% = un sueldo al año, devengado mes a mes.")}
      ${pct("k_vac","Vacaciones provisionadas %",pr.vacaciones,"Dejalo en 0 si no se provisionan.")}
      <div class="knob"><label>ART, parte fija por persona</label><input type="number" step="1000" id="k_artf" value="${c.artFijo||0}"><div class="kd">Si la póliza cobra un fijo además del porcentaje.</div></div>
      <div class="knob"><label>Seguro de vida + sindicato</label><input type="number" step="1000" id="k_otros" value="${(c.seguroVida||0)+(c.sindicato||0)}"><div class="kd">Por persona y por mes, la parte de la empresa.</div></div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;font-weight:700">
      <input type="checkbox" id="k_comicargas" ${c.comisionLlevaCargas!==false?"checked":""} style="width:18px;height:18px">
      La comisión lleva cargas sociales
    </label>
    <div class="kd" style="margin:4px 0 14px">Siendo remunerativa debería llevarlas. Destildalo sólo si se paga como no remunerativa.</div>

    <table class="rt">
      <tr><th class="nm">Comercial</th><th>Régimen</th><th>Bruto mensual</th><th>Rige desde</th><th>Viáticos/mes</th><th>Costo en ${mesLbl(mesAct)}</th></tr>
      ${uids.map(uid=>{
        const p=(CFG.personas||{})[uid]||{}, s=(p.sueldos||[]);
        const ult=s.length?s[s.length-1]:{desde:mesAct,bruto:0};
        const cm=(COMIS[mesAct]&&COMIS[mesAct][uid])?COMIS[mesAct][uid].comi:0;
        const co=costoDe(uid,mesAct,cm);
        const reg=p.regimen||"relacion";
        return `<tr><td class="nm"><b>${esc(DATOS.porCom[uid].nombre)}</b></td>
          <td><select id="r_${uid}" style="border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit">
            <option value="relacion"${reg==="relacion"?" selected":""}>Relación de dependencia</option>
            <option value="monotributo"${reg==="monotributo"?" selected":""}>Monotributo</option></select></td>
          <td><input type="number" step="10000" id="s_${uid}" value="${ult.bruto||0}" style="width:130px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:5px 8px"></td>
          <td><input type="month" id="d_${uid}" value="${ult.desde||mesAct}" style="border:1px solid var(--line);border-radius:8px;padding:5px 8px"></td>
          <td><input type="number" step="10000" id="v_${uid}" value="${p.viaticos||0}" style="width:110px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:5px 8px"></td>
          <td><b>${M(co.total)}</b></td></tr>`;
      }).join("")}
    </table>
    <div class="mut" style="margin:8px 0 14px"><b>Monotributo</b>: lo que factura. No lleva cargas, ni SAC, ni ART.<br><b>Rige desde</b>: el sueldo se guarda con su fecha. Un aumento cargado hoy no cambia lo que costaron los meses anteriores — se agrega como un valor nuevo y el pasado queda como fue.</div>
    <button class="btn" onclick="guardarCostos()">Guardar</button>
    <button class="btn sec" onclick="render()">Cancelar</button>
  </div>`;
}

/* ===== acciones ===== */
function setPreset(k){
  ST.preset=k; const h=hoy(), mes=mesDe(h);
  const atras=n=>{ let [y,m]=mes.split("-").map(Number); m-=n; while(m<1){m+=12;y--;} return y+"-"+String(m).padStart(2,"0"); };
  if(k==="mes"){ ST.desde=mes; ST.hasta=mes; }
  else if(k==="ant"){ ST.desde=atras(1); ST.hasta=atras(1); }
  else if(k==="3m"){ ST.desde=atras(2); ST.hasta=mes; }
  else if(k==="6m"){ ST.desde=atras(5); ST.hasta=mes; }
  else if(k==="ano"){ ST.desde=mes.slice(0,4)+"-01"; ST.hasta=mes; }
  recargar();
}
function setRango(){
  const d=document.getElementById("f_desde").value, h=document.getElementById("f_hasta").value;
  if(!d||!h) return;
  ST.desde=d<=h?d:h; ST.hasta=d<=h?h:d; ST.preset="";
  recargar();
}
async function recargar(){
  const cap=document.getElementById("cap");
  if(cap) cap.innerHTML='<div class="spin"></div><p class="cargando">Leyendo el período…</p>';
  try{ await cargar(); render(); }
  catch(e){ if(cap) cap.innerHTML=`<div class="nota aviso"><b>No pude leer los datos.</b> ${esc(String(e.message||e))}</div>`; }
}
function abrir(uid){ ST.abierta=(ST.abierta===uid?null:uid); render(); }
function irA(id){ const e=document.getElementById(id); if(e) e.scrollIntoView({behavior:"smooth",block:"center"}); }
async function guardarCostos(){
  const num=(id,d)=>{ const e=document.getElementById(id); const x=e?parseFloat(e.value):NaN; return isFinite(x)?x:d; };
  const nueva=JSON.parse(JSON.stringify(CFG));
  nueva.cargas.patronales=num("k_patr",24)/100;
  nueva.cargas.art=num("k_art",3)/100;
  nueva.cargas.artFijo=num("k_artf",0);
  nueva.cargas.seguroVida=num("k_otros",0);
  nueva.cargas.sindicato=0;   // van juntos en una sola perilla
  nueva.cargas.comisionLlevaCargas=!!(document.getElementById("k_comicargas")||{}).checked;
  nueva.provisiones.sac=num("k_sac",8.33)/100;
  nueva.provisiones.vacaciones=num("k_vac",0)/100;
  nueva.personas=nueva.personas||{};
  for(const uid of Object.keys(DATOS.porCom)){
    const bruto=num("s_"+uid,0), desde=(document.getElementById("d_"+uid)||{}).value||ST.hasta, viat=num("v_"+uid,0);
    const p=(nueva.personas[uid]=nueva.personas[uid]||{nombre:DATOS.porCom[uid].nombre,sueldos:[]});
    p.nombre=DATOS.porCom[uid].nombre; p.viaticos=viat;
    p.regimen=((document.getElementById("r_"+uid)||{}).value)||"relacion";
    p.sueldos=(p.sueldos||[]).filter(s=>s.desde!==desde);
    if(bruto>0) p.sueldos.push({desde,bruto});
    p.sueldos.sort((a,b)=>a.desde<b.desde?-1:1);
  }
  try{
    await EYG.rpc("ir.config_parameter","set_param",[COSTOS_KEY,JSON.stringify(nueva)]);
    CFG=nueva; render();
    alert("Guardado. Los sueldos quedan con su fecha de vigencia, así que los meses anteriores no se mueven.");
  }catch(e){ alert("No pude guardar: "+(e.message||e)); }
}
</script>
