<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=80"></script>
<script>
/* ===== Rentabilidad por rubro =============================================
   Qué contesta: por dónde se vende, cuánto deja cada tipo de cliente y cuánto
   de ese margen se lo come el tiempo que tarda en entrar la plata.

   EL HALLAZGO QUE LE DIO FORMA (15/9/2026): el plazo PACTADO no alcanza. Cuando
   un cliente paga con cheque a 90 días, Odoo da la factura por pagada y la deuda
   baja a cero, pero la plata NO entró: queda como cheque en cartera. Había $421M
   así, invisibles para cobranzas. Por eso el margen real no se calcula con el
   plazo del papel sino con los DÍAS REALES DE COBRO:
       (deuda abierta + cheques en cartera) / facturado de 12 meses × 365.

   Cómo se arma (importa para no romperlo):
   · El rubro sale de EYG.rubroDe(): manda el campo Rubro y, si está vacío, la
     etiqueta vieja. Son 6 rubros + Personal; ver el comentario en core.js.
   · VENTA y MARGEN salen de sale.order.line de pedidos confirmados, sin IVA, y
     SOLO de las líneas con costo cargado (purchase_price>0): las que no tienen
     costo darían 100% de margen. Cuánto queda afuera se avisa bajo la tabla.
   · PLATA PARADA y DÍAS REALES son de HOY y de los últimos 12 meses, NO del
     período elegido arriba. Está dicho en la pantalla para que no se mezcle.
   · Los días del plazo pactado salen del nb_days de la LÍNEA del plazo, no del
     nombre (ya pasó una vez que no coincidieran).
   · Una consulta por período del gráfico, agrupada por cliente: de ahí salen a
     la vez los totales por rubro y el detalle por cliente.
========================================================================== */
const rpc=EYG.rpc, money=EYG.money, esc=EYG.esc;
const CTX={context:{lang:"es_AR", tz:"America/Argentina/Buenos_Aires"}};
const RUBRO_FIELD=EYG.RUBRO_FIELD;
const TASA_KEY="eyg.rentabilidad.tasa_mensual";
/* 3,84% = lo que cuesta ANTICIPAR la plata, medido en Odoo: $156M de "Intereses
   por venta de valores" sobre $1.688M de cheques descontados en bancos en 12
   meses = 9,25% del valor, y como el cheque viene a 72 días promedio, eso da
   3,84% mensual. Sale más caro que un préstamo bancario (3,18%), que es la otra
   forma de financiarse. */
const TASA_DEF=3.84;
const DIARIOS_CHEQUES=[16,36];   // "Cheques de terceros" y "Cheques de terceros B"

/* ---------- fechas ---------- */
const dObj = s => new Date(s.slice(0,10)+"T00:00:00Z");
const dStr = d => d.toISOString().slice(0,10);
const addD = (s,n)=>{ const d=dObj(s); d.setUTCDate(d.getUTCDate()+n); return dStr(d); };
const addM = (s,n)=>{ const d=dObj(s.slice(0,7)+"-01"); d.setUTCMonth(d.getUTCMonth()+n); return dStr(d); };
const addA = (s,n)=> (Number(s.slice(0,4))+n)+s.slice(4);
const dow  = s => (dObj(s).getUTCDay()+6)%7;
const uDesde = s => s+" 03:00:00";
const MES3=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const dm = s => s.slice(8,10)+"/"+s.slice(5,7);
const fechaLarga = s => (+s.slice(8,10))+" de "+MES[+s.slice(5,7)-1]+" de "+s.slice(0,4);

const GRAN={
  dia:   {lab:"Día",    uni:"día",    pl:"días",    ult:"últimos", det:"los últimos", n:14, prev:(s,k)=>addD(s,-k),   ini:s=>s,                     fin:s=>addD(s,1)},
  semana:{lab:"Semana", uni:"semana", pl:"semanas", ult:"últimas", det:"las últimas", n:12, prev:(s,k)=>addD(s,-7*k), ini:s=>addD(s,-dow(s)),       fin:s=>addD(s,7)},
  mes:   {lab:"Mes",    uni:"mes",    pl:"meses",   ult:"últimos", det:"los últimos", n:12, prev:(s,k)=>addM(s,-k),   ini:s=>s.slice(0,7)+"-01",    fin:s=>addM(s,1)},
  ano:   {lab:"Año",    uni:"año",    pl:"años",    ult:"últimos", det:"los últimos", n:4,  prev:(s,k)=>addA(s,-k),   ini:s=>s.slice(0,4)+"-01-01", fin:s=>addA(s,1)},
};
function etiqueta(k,s){
  if(k==="dia"||k==="semana") return dm(s);
  if(k==="mes") return MES3[+s.slice(5,7)-1]+"'"+s.slice(2,4);
  return s.slice(0,4);
}
function etiquetaLarga(k,s){
  if(k==="dia")    return "el "+(+s.slice(8,10))+" de "+MES[+s.slice(5,7)-1];
  if(k==="semana") return "semana del "+dm(s)+" al "+dm(addD(s,6));
  if(k==="mes")    return MES[+s.slice(5,7)-1]+" de "+s.slice(0,4);
  return "año "+s.slice(0,4);
}

/* ---------- formato ---------- */
function mc(n){ n=n||0; const a=Math.abs(n);
  if(a>=1e6){ const v=n/1e6; return "$"+(a>=1e8?Math.round(v).toLocaleString("es-AR"):v.toFixed(1).replace(".",","))+"M"; }
  if(a>=1e4) return "$"+Math.round(n/1e3).toLocaleString("es-AR")+"k";
  return "$"+Math.round(n).toLocaleString("es-AR"); }
const p1 = n => (n==null?"—":(Math.round(n*10)/10).toFixed(1).replace(".",",")+"%");
const ent = n => Math.round(n||0).toLocaleString("es-AR");
const dds = n => n==null?"—":Math.round(n)+" d";

/* ---------- estado ---------- */
let GRA="mes", TASA=TASA_DEF, VISTA="rubros", FOCO=null;
let PART={};          // id -> {name, rubro, dias, plazo, com, due, venc}
let COB=null;         // rubro -> {due,venc,chq,chqFut,fac} — segunda ola
let CHQ=null;         // cheques que siguen en cartera, uno por uno
let DATOS=null;       // {buckets, ventaTotal, pedidos, desde, hasta}
let CARGANDO=false;
const CACHE={};

/* ---------- carga: padrón de clientes ---------- */
async function cargarPadron(){
  if(Object.keys(PART).length) return;
  const [terms, parts] = await Promise.all([
    rpc("account.payment.term","search_read",[[]],Object.assign({fields:["id","name","line_ids"],limit:200},CTX)),
    rpc("res.partner","search_read",[[["customer_rank",">",0]]],
        Object.assign({fields:["id","name","parent_id",RUBRO_FIELD,"category_id","property_payment_term_id","user_id","total_due","total_overdue"],limit:0},CTX)),
  ]);
  const lids=[].concat(...terms.map(t=>t.line_ids||[]));
  const lines = lids.length ? await rpc("account.payment.term.line","read",[lids,["nb_days","delay_type","payment_id"]],CTX) : [];
  const porTerm={}; lines.forEach(l=>{ if(l.payment_id) (porTerm[l.payment_id[0]]=porTerm[l.payment_id[0]]||[]).push(l); });
  const DIAS={};
  terms.forEach(t=>{
    const li=porTerm[t.id]||[];
    if(!li.length){ DIAS[t.id]=null; return; }
    /* Varias cuotas: manda la última, que es hasta cuándo se financia la venta.
       "fin del mes siguiente" se cuenta como 45 días. */
    const finMes = li.some(l=>/end_of_next_month/.test(l.delay_type||""));
    DIAS[t.id] = finMes ? 45 : Math.max(...li.map(l=>l.nb_days||0));
  });
  const RUB={};
  parts.forEach(p=>{ RUB[p.id]=EYG.rubroDe(p)||null; });
  parts.forEach(p=>{ if(!RUB[p.id] && p.parent_id) RUB[p.id]=RUB[p.parent_id[0]]||null; });
  PART={};
  parts.forEach(p=>{
    const t=p.property_payment_term_id;
    PART[p.id]={ name:p.name||"—", rubro:RUB[p.id]||"", dias:t?(DIAS[t[0]]!=null?DIAS[t[0]]:null):null,
                 plazo:t?t[1]:"sin plazo", com:p.user_id?p.user_id[1]:"",
                 due:p.total_due||0, venc:Math.max(0,p.total_overdue||0) };
  });
}

/* ---------- carga: cobranza real (segunda ola) ----------
   Junta lo que de verdad está financiando la droguería:
     · la deuda abierta, y
     · los CHEQUES EN CARTERA: entraron y siguen en el diario de cheques de
       terceros, sin depositar ni entregar. Para Odoo la factura está pagada,
       pero esa plata todavía no entró.
   Contra el facturado de los últimos 12 meses sale el día real de cobro. */
async function cargarCobranza(){
  if(COB) return;
  try{
    const hace12 = addM(EYG.argToday(), -12);
    const [chq, fac] = await Promise.all([
      rpc("account.payment","search_read",[[["journal_id","in",DIARIOS_CHEQUES],["payment_type","=","inbound"],["state","=","posted"]]],
          Object.assign({fields:["partner_id","amount","date","l10n_latam_check_number","l10n_latam_check_bank_id",
                                 "l10n_latam_check_payment_date","l10n_latam_check_current_journal_id"],limit:0},CTX)),
      rpc("account.move","read_group",[[["move_type","in",["out_invoice","out_refund"]],["state","=","posted"],["invoice_date",">=",hace12]],
          ["amount_total_signed:sum"],["partner_id"]], Object.assign({lazy:false,limit:4000},CTX)),
    ]);
    const hoy=EYG.argToday(), R={}, enCartera=[];
    const de=r=>R[r]||(R[r]={due:0,venc:0,chq:0,chqFut:0,nChq:0,espera:0,fac:0});
    Object.values(PART).forEach(p=>{ const o=de(p.rubro||""); o.due+=p.due; o.venc+=p.venc; });
    chq.forEach(c=>{
      const j=c.l10n_latam_check_current_journal_id;
      if(!j || !DIARIOS_CHEQUES.includes(j[0])) return;   // ya se depositó o se entregó
      const id=c.partner_id&&c.partner_id[0]; if(!id) return;
      const o=de((PART[id]&&PART[id].rubro)||""); const v=c.amount||0;
      o.chq+=v; o.nChq++;
      const f=c.l10n_latam_check_payment_date;
      if(f && f>hoy){ o.chqFut+=v; o.espera+=v*Math.round((dObj(f)-dObj(hoy))/864e5); }
      enCartera.push({pid:id, pname:c.partner_id[1], monto:v, date:(c.date||"").slice(0,10),
                      pago:c.l10n_latam_check_payment_date||null, nro:c.l10n_latam_check_number||"",
                      banco:c.l10n_latam_check_bank_id?c.l10n_latam_check_bank_id[1]:""});
    });
    CHQ=enCartera;
    fac.forEach(x=>{ const id=x.partner_id&&x.partner_id[0]; if(!id) return;
      de((PART[id]&&PART[id].rubro)||"").fac += x.amount_total_signed||0; });
    COB=R;
    if(!CARGANDO) pintar();
  }catch(e){ /* sin esto la pantalla sigue sirviendo con el plazo pactado */ }
}
/* Días reales de cobro de un rubro: cuánta plata tiene parada hoy, medida contra
   lo que factura por año. Si no hay con qué medirlo, se cae al plazo pactado. */
function diasReales(r){
  const c=COB&&COB[r]; if(!c) return null;
  const parada=c.due+c.chq;
  if(!(c.fac>0) || parada<=0) return null;
  return parada/c.fac*365;
}

/* ---------- carga: venta y margen por período ---------- */
async function bucket(desde, hasta){
  const g=await rpc("sale.order.line","read_group",[
    [["order_id.state","in",["sale","done"]],
     ["order_id.date_order",">=",uDesde(desde)],["order_id.date_order","<",uDesde(hasta)],
     ["purchase_price",">",0]],
    ["margin:sum","price_subtotal:sum"],["order_partner_id"]],
    Object.assign({lazy:false,limit:4000},CTX));
  const o={};
  g.forEach(x=>{ const id=x.order_partner_id&&x.order_partner_id[0]; if(!id) return;
    o[id]={v:x.price_subtotal||0, m:x.margin||0}; });
  return o;
}
async function cargar(){
  if(CACHE[GRA]){ DATOS=CACHE[GRA]; pintar(); cargarCobranza(); return; }
  CARGANDO=true; pintar();
  try{
    await cargarPadron();
    const g=GRAN[GRA], hoy=EYG.argToday(), fin=g.ini(hoy);
    const claves=[]; for(let i=g.n-1;i>=0;i--) claves.push(g.prev(fin,i));
    const buckets=await Promise.all(claves.map(async k=>({key:k, porCliente:await bucket(k, g.fin(k))})));
    /* Una consulta más sobre los PEDIDOS de toda la ventana: de ahí salen los
       pedidos por rubro y cuánta venta queda afuera por no tener costo. */
    const ini=claves[0], finVentana=g.fin(claves[claves.length-1]);
    const ord=await rpc("sale.order","read_group",[
      [["state","in",["sale","done"]],["date_order",">=",uDesde(ini)],["date_order","<",uDesde(finVentana)]],
      ["amount_untaxed:sum"],["partner_id"]], Object.assign({lazy:false,limit:4000},CTX));
    const ventaTotal={}, pedidos={};
    ord.forEach(x=>{ const id=x.partner_id&&x.partner_id[0]; if(!id) return;
      const r=(PART[id]&&PART[id].rubro)||"";
      ventaTotal[r]=(ventaTotal[r]||0)+(x.amount_untaxed||0);
      pedidos[r]=(pedidos[r]||0)+(x.__count||0); });
    DATOS=CACHE[GRA]={buckets, ventaTotal, pedidos, desde:ini, hasta:hoy};
  }catch(e){ DATOS={error:(e&&e.message)||String(e)}; }
  CARGANDO=false; pintar();
  cargarCobranza();
}

/* ---------- agregados ---------- */
function agregar(){
  const porRubro={}, porCliente={};
  (DATOS.buckets||[]).forEach(b=>{
    Object.entries(b.porCliente).forEach(([id,d])=>{
      const p=PART[id]||{}; const r=p.rubro||"";
      const R=porRubro[r]||(porRubro[r]={v:0,m:0,dias:0,conDias:0,clientes:new Set()});
      R.v+=d.v; R.m+=d.m; R.clientes.add(+id);
      if(p.dias!=null){ R.dias+=d.v*p.dias; R.conDias+=d.v; }
      const C=porCliente[id]||(porCliente[id]={v:0,m:0});
      C.v+=d.v; C.m+=d.m;
    });
  });
  return {porRubro, porCliente};
}
const metaRubro = r => EYG.RUBRO_META[EYG.rubroNorm(r)] ||
  {ab:"Sin rubro", l:"Sin rubro", ico:"❔", c:"#8A9A97", bg:"#F3F5F4",
   desc:"Clientes a los que todavía nadie les puso rubro. Se catalogan en Contactos → Rubros."};
/* Cada mes de espera se lleva `TASA` puntos del margen: durante ese mes la venta
   está financiada con plata que cuesta esa tasa. */
const costoPlazo = d => (d==null?0:(d/30)*TASA);
function filaRubro(r,d){
  const pac = d.conDias ? d.dias/d.conDias : null;
  const real = diasReales(r);
  const usa = real!=null ? real : pac;
  const mg = d.v ? d.m/d.v*100 : 0;
  const costo = costoPlazo(usa);
  const c = (COB&&COB[r])||null;
  return {r, v:d.v, m:d.m, mg, pac, real, usa, costo, mgf:mg-costo, mfPesos:d.v*(mg-costo)/100,
          n:d.clientes.size, cli:d.clientes, ped:((DATOS.pedidos||{})[r])||0,
          due:c?c.due:null, venc:c?c.venc:null, chq:c?c.chq:null, parada:c?c.due+c.chq:null};
}

/* ---------- pintado ---------- */
function pintar(){
  const c=document.getElementById("cont"); if(!c) return;
  if(CARGANDO){ c.innerHTML=introHTML()+barraHTML()+`<div class="card"><div class="cargando">Leyendo ventas y márgenes de Odoo… <b>${GRAN[GRA].n}</b> ${GRAN[GRA].pl}, tarda unos segundos.</div></div>`; return; }
  if(!DATOS){ c.innerHTML=introHTML()+barraHTML(); return; }
  if(DATOS.error){ c.innerHTML=introHTML()+barraHTML()+`<div class="errbox"><b>No pude leer Odoo.</b> ${esc(DATOS.error)}</div>`; return; }
  c.innerHTML = introHTML()+barraHTML()+(FOCO?detalleHTML():
    VISTA==="morosos"?morososHTML(): VISTA==="cheques"?chequesHTML(): panoramaHTML());
  if(!FOCO && VISTA==="rubros") engancharGrafico();
}

  return `<div class="intro">
    <b>Qué mira esta pantalla.</b> Cuánto vende y cuánto deja cada tipo de cliente — y cuánto de ese margen se lo lleva el tiempo que tarda en entrar la plata.

    Pedidos confirmados, importes <b>sin IVA</b>. A <b>${p1(TASA)}</b> por mes, cada mes de espera se lleva <b>${p1(TASA)}</b> de margen.
  </div>`;
}

}

/* ================= vista: por rubro ================= */
function panoramaHTML(){
  const {porRubro}=agregar();
  const filas=Object.entries(porRubro).map(([r,d])=>filaRubro(r,d)).filter(f=>f.v>0).sort((a,b)=>b.v-a.v);
  if(!filas.length) return periodoHTML()+`<div class="card"><div class="cargando">No hay ventas con costo cargado en este período.</div></div>`;
  const V=filas.reduce((a,f)=>a+f.v,0), M=filas.reduce((a,f)=>a+f.m,0);
  const MF=filas.reduce((a,f)=>a+f.mfPesos,0);
  const mg=V?M/V*100:0, mgf=V?MF/V*100:0;
  const nPed=filas.reduce((a,f)=>a+f.ped,0), nCli=filas.reduce((a,f)=>a+f.n,0);
  const max=Math.max(...filas.map(f=>f.v));
  /* La plata parada es de HOY. Se suman sólo los rubros con saldo deudor: un
     saldo a favor no es plata que estemos financiando. */
  const C=COB||{};
  const paradaTot=Object.values(C).reduce((a,x)=>a+Math.max(0,x.due+x.chq),0);
  const chqTot=Object.values(C).reduce((a,x)=>a+x.chq,0);
  const chqFut=Object.values(C).reduce((a,x)=>a+x.chqFut,0);
  const vencTot=Object.values(C).reduce((a,x)=>a+x.venc,0);
  const costoAnual=paradaTot*TASA/100*12;

  const kpis=`<div class="kpis">
    <div class="kpi" title="Suma de los pedidos confirmados del período, sin IVA, de las líneas con el costo cargado.">
      <div class="l">Venta del período</div><div class="v">${mc(V)}</div>
      <div class="s">${ent(nPed)} pedidos · ${ent(nCli)} clientes · ticket ${mc(nPed?V/nPed:0)}</div></div>
    <div class="kpi" title="Venta menos costo de la mercadería, las dos cosas sin IVA. Es el margen que se ve en todos lados.">
      <div class="l">Margen nominal</div><div class="v">${p1(mg)}</div><div class="s">${mc(M)}</div></div>
    <div class="kpi ${mgf<mg/2?"alerta":""}" title="Lo que queda del margen después de descontar el costo de esperar el cobro, con los días reales.">
      <div class="l">Margen real</div><div class="v">${p1(mgf)}</div><div class="s">${mc(MF)}</div></div>
    ${COB?`<div class="kpi alerta" title="Plata que ya vendiste y todavía no entró: deuda abierta más cheques en cartera. Es de HOY, no del período de arriba.">
      <div class="l">Plata parada hoy</div><div class="v">${mc(paradaTot)}</div>
      <div class="s">${mc(chqTot)} en cheques${chqFut?` · ${mc(chqFut)} ni se pueden cobrar`:""}</div></div>
    <div class="kpi alerta" title="Lo que cuesta financiar esa plata parada durante un año, a la tasa de arriba.">
      <div class="l">Financiarla cuesta</div><div class="v">${mc(costoAnual)}</div>
      <div class="s">por año · ${mc(vencTot)} está vencido</div></div>`:""}
  </div>`;

  const rows=filas.map(f=>{
    const m=metaRubro(f.r);
    const atraso = (f.pac!=null&&f.real!=null) ? f.real-f.pac : null;
    return `<div class="trow" onclick="verRubro('${esc(f.r).replace(/'/g,"\\'")}')" title="${esc(m.desc||m.l)} — tocá para ver sus clientes.">
      <div><div class="rname"><span class="rdot" style="background:${m.c}"></span><span class="nm">${m.ico} ${esc(m.l)}</span><span class="chev">›</span></div>
        <div class="sub">${ent(f.n)} cliente${f.n===1?"":"s"} · ${ent(f.ped)} pedidos</div>
        <div class="share"><i style="width:${(f.v/max*100).toFixed(1)}%;background:${m.c}"></i></div></div>
      <div class="num big" data-l="Venta" title="${money(f.v)}">${mc(f.v)}<div class="sub">${p1(f.v/V*100)} del total</div></div>
      <div class="num" data-l="Margen" title="Venta menos costo de la mercadería, sin IVA.">${p1(f.mg)}<div class="sub">${mc(f.m)}</div></div>
      <div class="num" data-l="Cobro: pactado → real" title="A la izquierda lo pactado; a la derecha lo que tarda de verdad en entrar la plata, medido con lo que está parado hoy contra lo que factura por año.">
        ${dds(f.pac)}${f.real!=null?` <span class="flecha">→</span> <b>${dds(f.real)}</b>`:""}
        ${atraso!=null&&Math.abs(atraso)>=7?`<div class="sub ${atraso>0?"rojo":""}">${atraso>0?"+"+Math.round(atraso)+" d de atraso":Math.round(atraso)+" d, cobra antes"}</div>`:""}</div>
      <div class="num ${f.mgf<0?"mal":f.mgf>=20?"bien":""}" data-l="Margen real" title="El margen menos el costo de la espera: ${p1(f.mg)} − ${p1(f.costo)}.">${p1(f.mgf)}<div class="sub">${mc(f.mfPesos)}</div></div>
      <div class="num" data-l="Plata parada" title="${f.parada!=null?`Deuda ${money(f.due)} + cheques en cartera ${money(f.chq)}. Vencido: ${money(f.venc)}.`:"Cargando la cobranza…"}">
        ${f.parada!=null?(f.parada<0?mc(-f.parada)+" a favor":mc(f.parada)):"…"}
        ${f.parada!=null?`<div class="sub ${f.venc>0?"rojo":""}">${f.chq>0?mc(f.chq)+" en cheques":""}${f.venc>0?(f.chq>0?" · ":"")+mc(f.venc)+" vencido":""}</div>`:""}</div>
    </div>`;
  }).join("");

  const fuera=Object.entries(DATOS.ventaTotal||{}).map(([r,t])=>{
    const d=porRubro[r]; const con=d?d.v:0; const dif=t-con;
    return {r, dif, pct:t?dif/t*100:0};
  }).filter(x=>x.pct>=5 && x.dif>0).sort((a,b)=>b.dif-a.dif);
  const aviso=fuera.length?`<div class="avisos">⚠️ Ojo al leer estos márgenes: hay venta <b>sin costo cargado</b> que queda afuera —
    ${fuera.map(x=>`<b>${esc(metaRubro(x.r).ab)}</b> ${p1(x.pct)} (${mc(x.dif)})`).join(" · ")}. En esos rubros el margen sale sobre el resto.</div>`:"";
  const notaCob=COB?`<div class="avisos" style="color:var(--gris)">La <b style="color:var(--gris)">plata parada</b> y los <b style="color:var(--gris)">días reales de cobro</b> son de <b style="color:var(--gris)">hoy</b>, no del período de arriba: se miden con lo que está sin cobrar contra lo facturado en los últimos 12 meses.</div>`:"";

  return periodoHTML()+kpis+graficoHTML(filas)+`<div class="card">
    <h3>📊 Rentabilidad por rubro <span class="hint">${rangoTexto()} · tocá un rubro para ver sus clientes</span></h3>
    <div class="thead">
      <div>Rubro</div><div class="num">Venta</div><div class="num">Margen</div>
      <div class="num">Cobro: pactado → real</div><div class="num">Margen real</div><div class="num">Plata parada hoy</div>
    </div>
    ${rows}
    <div class="trow tot">
      <div><div class="rname">Total</div><div class="sub">${ent(nCli)} clientes · ${ent(nPed)} pedidos</div></div>
      <div class="num big" data-l="Venta">${mc(V)}<div class="sub">100%</div></div>
      <div class="num" data-l="Margen">${p1(mg)}<div class="sub">${mc(M)}</div></div>
      <div class="num" data-l="Cobro">—</div>
      <div class="num" data-l="Margen real">${p1(mgf)}<div class="sub">${mc(MF)}</div></div>
      <div class="num" data-l="Plata parada">${COB?mc(paradaTot):"…"}<div class="sub ${vencTot>0?"rojo":""}">${COB?mc(vencTot)+" vencido":""}</div></div>
    </div>
    ${aviso}${notaCob}
  </div>`;
}

/* Barras apiladas: cómo se mueve la mezcla de rubros período a período. */
function graficoHTML(filas){
  const orden=filas.map(f=>f.r);
  const pts=(DATOS.buckets||[]).map(b=>{
    const seg={}; let tot=0;
    Object.entries(b.porCliente).forEach(([id,d])=>{ const r=(PART[id]&&PART[id].rubro)||""; seg[r]=(seg[r]||0)+d.v; tot+=d.v; });
    return {key:b.key, seg, tot};
  });
  if(!pts.length) return "";
  const max=Math.max(...pts.map(p=>p.tot),1);
  const e10=Math.pow(10,Math.floor(Math.log10(max)));
  const top=Math.ceil(max/e10*2)/2*e10 || max;
  const chico=(window.innerWidth||1000)<760;
  const W=chico?430:1000, H=chico?260:230, PL=chico?46:52, PR=8, PT=14, PB=26;
  const x0=PL, x1=W-PR, y0=PT, y1=H-PB;
  const Y=v=>y1-(v/top)*(y1-y0);
  const slot=(x1-x0)/pts.length, bw=Math.min(slot*0.64,52), off=(slot-bw)/2;
  let grid="";
  for(let i=0;i<=2;i++){ const v=top*i/2, y=Y(v);
    grid+=`<line x1="${x0}" y1="${y.toFixed(1)}" x2="${x1}" y2="${y.toFixed(1)}" stroke="#EBF2F1" stroke-width="1"/>`
        + `<text x="${x0-8}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="${chico?12:11}" font-weight="700" fill="#9AACA8">${i?esc(mc(v)):"0"}</text>`; }
  let bars="", hits="", labs="";
  pts.forEach((p,i)=>{
    const x=x0+slot*i+off; let acc=0;
    orden.forEach(r=>{ const v=p.seg[r]||0; if(v<=0) return;
      const yT=Y(acc+v), yB=Y(acc);
      bars+=`<rect x="${x.toFixed(1)}" y="${yT.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(yB-yT-1,1).toFixed(1)}" fill="${metaRubro(r).c}"/>`;
      acc+=v; });
    hits+=`<rect class="hit" data-i="${i}" x="${(x0+slot*i).toFixed(1)}" y="${y0}" width="${slot.toFixed(1)}" height="${(y1-y0).toFixed(1)}" fill="transparent"/>`;
    const paso=Math.ceil(pts.length/(chico?5:14));
    if(i%paso===0||i===pts.length-1)
      labs+=`<text x="${(x0+slot*i+slot/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="${chico?12:11}" font-weight="700" fill="#9AACA8">${esc(etiqueta(GRA,p.key))}</text>`;
  });
  window._PTS=pts; window._ORDEN=orden;
  return `<div class="card">
    <h3>📈 Cómo se mueve la mezcla <span class="hint">venta por rubro, ${GRAN[GRA].uni} a ${GRAN[GRA].uni}</span></h3>
    <div class="chartwrap" id="gr">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Venta por rubro">${grid}${bars}${labs}${hits}</svg>
      <div class="tt" id="grtt"></div>
    </div>
    <div class="leyenda">${orden.map(r=>{const m=metaRubro(r); return `<span title="${esc(m.desc||m.l)}"><i style="background:${m.c}"></i>${m.ico} ${esc(m.ab)}</span>`;}).join("")}</div>
  </div>`;
}
function engancharGrafico(){
  const w=document.getElementById("gr"), tt=document.getElementById("grtt"); if(!w||!tt) return;
  const svg=w.querySelector("svg"); if(!svg) return;
  svg.addEventListener("mouseleave", ()=>tt.classList.remove("on"));
  svg.addEventListener("mousemove", ev=>{
    const t=ev.target; if(!t.classList.contains("hit")) return;
    const p=(window._PTS||[])[+t.dataset.i]; if(!p) return;
    const filas=(window._ORDEN||[]).filter(r=>(p.seg[r]||0)>0)
      .map(r=>`<div><b style="color:${metaRubro(r).c}">■</b> ${esc(metaRubro(r).ab)} · ${esc(mc(p.seg[r]))} <span style="opacity:.7">(${esc(p1(p.seg[r]/p.tot*100))})</span></div>`);
    tt.innerHTML=`<div class="t1">${esc(etiquetaLarga(GRA,p.key))}</div><div>${esc(mc(p.tot))}</div>${filas.join("")||"<div>sin ventas</div>"}`;
    const r=t.getBoundingClientRect(), wr=w.getBoundingClientRect();
    tt.style.left=(r.left-wr.left+r.width/2)+"px";
    tt.style.top=(r.top-wr.top+r.height*0.3)+"px";
    tt.classList.add("on");
  });
}

/* ================= detalle de un rubro, abierto POR PLAZO ================= */
const TRAMOS=[
  {k:0,   lab:"Contado",           test:d=>d!=null&&d<=0},
  {k:15,  lab:"Hasta 15 días",     test:d=>d!=null&&d>0&&d<=15},
  {k:30,  lab:"30 días",           test:d=>d!=null&&d>15&&d<=30},
  {k:60,  lab:"45 a 60 días",      test:d=>d!=null&&d>30&&d<=60},
  {k:90,  lab:"90 días",           test:d=>d!=null&&d>60&&d<=90},
  {k:120, lab:"Más de 90 días",    test:d=>d!=null&&d>90},
  {k:null,lab:"Sin plazo cargado", test:d=>d==null},
];
function detalleHTML(){
  const {porCliente}=agregar();
  const m=metaRubro(FOCO);
  const lista=Object.entries(porCliente)
    .filter(([id])=>((PART[id]&&PART[id].rubro)||"")===FOCO)
    .map(([id,d])=>{
      const p=PART[id]||{}; const mg=d.v?d.m/d.v*100:0;
      return {id:+id, name:p.name||"—", com:p.com||"", v:d.v, m:d.m, mg, dias:p.dias, plazo:p.plazo,
              mgf:mg-costoPlazo(p.dias), due:p.due||0, venc:p.venc||0};
    }).sort((a,b)=>b.v-a.v);
  const V=lista.reduce((a,c)=>a+c.v,0), M=lista.reduce((a,c)=>a+c.m,0);
  const pierden=lista.filter(c=>c.mgf<0);

  /* Abierto por PLAZO: es el corte que explica la rentabilidad adentro del rubro
     y no depende de que nadie catalogue nada — el plazo ya está cargado. */
  let bloques="";
  TRAMOS.forEach(t=>{
    const g=lista.filter(c=>t.test(c.dias)); if(!g.length) return;
    const gv=g.reduce((a,c)=>a+c.v,0), gm=g.reduce((a,c)=>a+c.m,0);
    const gvenc=g.reduce((a,c)=>a+c.venc,0);
    const mg=gv?gm/gv*100:0, mgf=mg-costoPlazo(t.k);
    bloques+=`<div class="grupo">
      <b>${esc(t.lab)}</b>
      <span>${g.length} cliente${g.length===1?"":"s"}</span>
      <span><b>${mc(gv)}</b> · ${p1(V?gv/V*100:0)} del rubro</span>
      <span>margen ${p1(mg)} → <b>real ${p1(mgf)}</b></span>
      ${gvenc>0?`<span style="color:#B0322F">${mc(gvenc)} vencido</span>`:""}
    </div>`+g.slice(0,120).map(c=>`<div class="crow">
      <div><div class="cn" title="${esc(c.name)}">${esc(c.name)}</div><div class="cm">${esc(c.com||"sin comercial")} · ${esc(c.plazo)}</div></div>
      <div class="num" data-l="Venta" title="${money(c.v)}">${mc(c.v)}</div>
      <div class="num" data-l="% del rubro">${p1(V?c.v/V*100:0)}</div>
      <div class="num" data-l="Margen" title="Venta menos costo, sin IVA.">${p1(c.mg)}</div>
      <div class="num ${c.mgf<0?"mal":c.mgf>=20?"bien":""}" data-l="Margen real" title="Margen menos el costo de esperar el cobro pactado.">${p1(c.mgf)}${c.mgf<0?' <span class="etq mal">pierde</span>':""}</div>
      <div class="num" data-l="Debe" title="Lo que debe hoy. Vencido: ${money(c.venc)}.">${c.due<0?mc(-c.due)+" a favor":mc(c.due)}${c.venc>0?`<div class="sub rojo">${mc(c.venc)} vencido</div>`:""}</div>
    </div>`).join("")+(g.length>120?`<div class="avisos">Mostrando los 120 de este tramo que más compraron, de ${g.length}.</div>`:"");
  });

  const alerta=pierden.length?`<div class="avisos">🔴 <b>${pierden.length} cliente(s) de este rubro pierden plata</b> una vez descontado el costo del plazo:
    ${pierden.slice(0,6).map(c=>`${esc(c.name)} (${p1(c.mgf)}, ${mc(c.v)})`).join(" · ")}${pierden.length>6?` y ${pierden.length-6} más`:""}.</div>`:"";
  return `<button class="back" onclick="verRubro(null)">← Volver a todos los rubros</button>`+periodoHTML()+`
    <div class="card">
      <h3><span class="rdot" style="background:${m.c}"></span>${m.ico} ${esc(m.l)}
        <span class="hint">${lista.length} clientes · ${mc(V)} · margen ${p1(V?M/V*100:0)}</span></h3>
      <div class="avisos" style="padding-top:8px;color:var(--gris)">${esc(m.desc||"")} <b style="color:var(--gris)">Abierto por plazo de pago</b>, que es lo que explica la diferencia de rentabilidad adentro del rubro.</div>
      <div class="chead"><div>Cliente</div><div class="num">Venta</div><div class="num">%</div><div class="num">Margen</div><div class="num">Margen real</div><div class="num">Debe</div></div>
      ${bloques||'<div class="cargando">Sin ventas con costo cargado en este período.</div>'}
      ${alerta}
    </div>`;
}

/* ================= vista: morosos ================= */
function morososHTML(){
  const l=Object.entries(PART).map(([id,p])=>Object.assign({id:+id},p)).filter(c=>c.venc>0).sort((a,b)=>b.venc-a.venc);
  if(!l.length) return `<div class="card"><div class="cargando">No hay clientes con plata vencida.</div></div>`;
  const tot=l.reduce((a,c)=>a+c.venc,0);
  const top10=l.slice(0,10).reduce((a,c)=>a+c.venc,0);
  const porRubro={};
  l.forEach(c=>{ const r=c.rubro||""; const o=porRubro[r]||(porRubro[r]={n:0,v:0}); o.n++; o.v+=c.venc; });
  const kpis=`<div class="kpis" style="padding:14px 18px 0;margin:0">
    <div class="kpi alerta" title="Suma de todo lo que está vencido hoy, en todos los clientes.">
      <div class="l">Vencido total</div><div class="v">${mc(tot)}</div><div class="s">${l.length} clientes</div></div>
    <div class="kpi" title="Qué parte del vencido está en los 10 peores. Si es alto, el problema es de pocos y se resuelve con pocas llamadas.">
      <div class="l">Los 10 peores</div><div class="v">${p1(tot?top10/tot*100:0)}</div><div class="s">${mc(top10)} del total</div></div>
    <div class="kpi" title="Lo que cuesta financiar ese vencido durante un año, a la tasa de arriba.">
      <div class="l">Ese atraso cuesta</div><div class="v">${mc(tot*TASA/100*12)}</div><div class="s">por año</div></div>
  </div>`;
  const chips=`<div class="avisos" style="padding-top:12px">Por rubro: ${Object.entries(porRubro).sort((a,b)=>b[1].v-a[1].v)
    .map(([r,o])=>`${EYG.rubroBadge(r)} <b style="color:var(--gris)">${mc(o.v)}</b> <span style="color:var(--gris2)">(${o.n})</span>`).join(" · ")}</div>`;
  const rows=l.slice(0,300).map(c=>`<div class="crow">
      <div><div class="cn" title="${esc(c.name)}">${esc(c.name)}</div><div class="cm">${esc(c.com||"sin comercial")} · ${esc(c.plazo)}</div></div>
      <div data-l="Rubro">${EYG.rubroBadge(c.rubro)}</div>
      <div class="num" data-l="Debe" title="${money(c.due)}">${mc(c.due)}</div>
      <div class="num mal" data-l="Vencido" title="${money(c.venc)}">${mc(c.venc)}</div>
      <div class="num" data-l="% vencido" title="Qué parte de lo que debe ya venció.">${p1(c.due>0?c.venc/c.due*100:100)}</div>
      <div class="num" data-l="Del total" title="Qué parte de todo el vencido de la droguería es este cliente.">${p1(tot?c.venc/tot*100:0)}</div>
    </div>`).join("");
  return `<div class="card">
    <h3>🔴 Clientes con plata vencida <span class="hint">de mayor a menor · situación de hoy, no del período</span></h3>
    ${kpis}${chips}
    <div class="chead"><div>Cliente</div><div>Rubro</div><div class="num">Debe</div><div class="num">Vencido</div><div class="num">% vencido</div><div class="num">Del total</div></div>
    ${rows}
    ${l.length>300?`<div class="avisos">Mostrando los 300 con más vencido, de ${l.length}.</div>`:""}
  </div>`;
}

/* ================= vista: cheques en cartera =================
   Un cheque que sigue en el diario de cheques de terceros es plata que NO entró.
   Con el circuito normal (2 días entre que entra y se descuenta en el banco) un
   cheque no debería quedarse ahí. Los que llevan meses, o los que ya pasaron su
   fecha de pago y siguen sin moverse, son plata que figura cobrada y no está. */
function chequesHTML(){
  if(!CHQ) return `<div class="card"><div class="cargando">Leyendo los cheques de Odoo…</div></div>`;
  const hoy=EYG.argToday();
  const l=CHQ.map(c=>{
    const p=PART[c.pid]||{};
    return {...c, name:p.name||c.pname||"—", com:p.com||"", rubro:p.rubro||"",
            enCartera:Math.round((dObj(hoy)-dObj(c.date))/864e5),
            cobrable: c.pago ? c.pago<=hoy : null};
  }).sort((a,b)=>b.monto-a.monto);
  if(!l.length) return `<div class="card"><div class="cargando">No hay cheques en cartera.</div></div>`;
  const tot=l.reduce((a,c)=>a+c.monto,0);
  const viejos=l.filter(c=>c.enCartera>90);
  const vencidos=l.filter(c=>c.cobrable===true);   // ya se podían cobrar y siguen ahí
  const kpis=`<div class="kpis" style="padding:14px 18px 0;margin:0">
    <div class="kpi" title="Cheques que entraron y siguen en el diario de cheques de terceros: no se depositaron ni se entregaron.">
      <div class="l">En cartera hoy</div><div class="v">${mc(tot)}</div><div class="s">${l.length} cheques</div></div>
    <div class="kpi ${vencidos.length?"alerta":""}" title="Ya pasó la fecha en que el cheque se podía cobrar y sigue sin moverse. Es lo más urgente de revisar.">
      <div class="l">Ya se podían cobrar</div><div class="v">${mc(vencidos.reduce((a,c)=>a+c.monto,0))}</div>
      <div class="s">${vencidos.length} cheques</div></div>
    <div class="kpi ${viejos.length?"alerta":""}" title="Llevan más de 90 días en cartera contando desde que entraron. Con un circuito de 2 días, no deberían estar ahí. La mayoría también aparece en el grupo de arriba.">
      <div class="l">Más de 90 días quietos</div><div class="v">${mc(viejos.reduce((a,c)=>a+c.monto,0))}</div>
      <div class="s">${viejos.length} cheques</div></div>
  </div>`;
  const fila=c=>`<div class="crow">
      <div><div class="cn" title="${esc(c.name)}">${esc(c.name)}</div>
        <div class="cm">${esc(c.com||"sin comercial")}${c.nro?" · cheque "+esc(c.nro):""}${c.banco?" · "+esc(c.banco):""}</div></div>
      <div data-l="Rubro">${EYG.rubroBadge(c.rubro)}</div>
      <div class="num" data-l="Monto" title="${money(c.monto)}">${mc(c.monto)}</div>
      <div class="num ${c.enCartera>90?"mal":""}" data-l="En cartera" title="Días desde que entró el cheque. El circuito normal son 2 días.">${c.enCartera} d<div class="sub">desde ${dm(c.date)}</div></div>
      <div class="num" data-l="Se cobra" title="Fecha a partir de la cual el cheque se puede cobrar.">${c.pago?dm(c.pago):"—"}</div>
      <div data-l="Estado">${c.cobrable===true?'<span class="etq mal">ya se podía cobrar</span>'
        :c.cobrable===false?'<span class="etq esp">todavía no vence</span>':'<span class="etq esp">sin fecha</span>'}</div>
    </div>`;
  const grupo=(tit,arr,ay)=>arr.length?`<div class="grupo" title="${esc(ay)}"><b>${esc(tit)}</b><span>${arr.length} cheques</span><span><b>${mc(arr.reduce((a,c)=>a+c.monto,0))}</b></span></div>`+arr.map(fila).join(""):"";
  const resto=l.filter(c=>c.cobrable!==true && c.enCartera<=90);
  return `<div class="card">
    <h3>🧾 Cheques en cartera <span class="hint">plata que figura cobrada y todavía no entró · situación de hoy</span></h3>
    ${kpis}
    <div class="avisos" style="color:var(--gris)">El circuito normal es: entra el cheque y a los <b style="color:var(--gris)">2 días</b> se descuenta en el banco. Lo que sigue acá es lo que no salió.</div>
    <div class="chead"><div>Cliente</div><div>Rubro</div><div class="num">Monto</div><div class="num">En cartera</div><div class="num">Se cobra</div><div>Estado</div></div>
    ${grupo("🔴 Ya se podían cobrar y siguen acá", vencidos, "Pasó la fecha de pago del cheque y no se depositó ni se entregó. Puede ser un rechazo sin registrar, o que falte cargar la operación.")}
    ${grupo("⚠️ Más de 90 días quietos, pero todavía sin vencer", viejos.filter(c=>c.cobrable!==true), "Entraron hace más de tres meses y no se movieron, aunque su fecha de cobro todavía no llegó. Los que además ya vencieron están arriba.")}
    ${grupo("Los demás", resto, "Cheques recientes, en circuito normal.")}
  </div>`;
}

/* ---------- acciones ---------- */
function verGran(k){ if(k===GRA) return; GRA=k; FOCO=null; cargar(); }
function verVista(v){ VISTA=v; FOCO=null; pintar(); window.scrollTo(0,0); }
function verRubro(r){ FOCO=r||null; pintar(); window.scrollTo(0,0); }
async function setTasa(v){
  const n=Math.max(0, Math.min(30, parseFloat(String(v).replace(",","."))||0));
  TASA=n; pintar();
  try{ await rpc("ir.config_parameter","set_param",[TASA_KEY, String(n)]); }catch(e){}
}
async function leerTasa(){
  try{ const v=await rpc("ir.config_parameter","get_param",[TASA_KEY]); const n=parseFloat(v); if(n>0) TASA=n; }catch(e){}
}

/* =========================== arranque =========================== */
EYG.requireAuth(["finanzas","direccion"], perfil=>{
  document.body.innerHTML = EYG.layout(perfil, "rentabilidad", '<div id="cont"></div>', "Rentabilidad por rubro");
  leerTasa().then(cargar);
});
</script>
