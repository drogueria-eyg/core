/* ═══════════════ OFERTAS Y COMBOS · UNA FILA POR OFERTA ═══════════════════
   Una fila por oferta/combo, ordenadas de MEJOR a PEOR rendimiento (manda lo
   facturado; si empatan, las vendidas y después la conversión). Así la que más
   rinde queda arriba y la que nadie mueve queda al final, a la vista.
   Los datos son los que ya calcula la solapa Ofertas (OF_LIDER): se computan una
   sola vez y abrir esa solapa después no cuesta nada.                          */
function renderOfertasTira(){
  const box=document.getElementById("ofSemana"); if(!box)return;
  if(!UIDS.length){ box.innerHTML=""; return; }
  const cab='<div class="secrow"><h2 class="sec">🎁 Ofertas y combos vigentes</h2>';
  if(!OF_LIDER){ box.innerHTML=cab+'</div><div class="gfbox"><div class="floading"><span class="spin-sm"></span> midiendo el rendimiento de cada oferta…</div></div>'; return; }
  const OF=OF_LIDER.OF, uidName=OF_LIDER.uidName;
  if(!OF.length){ box.innerHTML=cab+'</div><div class="scopenote">No hay ofertas ni combos vigentes en este momento.</div>'; return; }
  const sum=o=>Object.values(o||{}).reduce((a,b)=>a+b,0);
  const fn=uid=>(uidName[uid]||"?").split(" ")[0];

  const filas=OF.map(o=>{
    const env=sum(o.sent), ven=sum(o.sold), monto=sum(o.monto);
    return {o:o, env:env, ven:ven, monto:monto, conv:env>0?Math.round(ven/env*100):null};
  }).sort((a,b)=> (b.monto-a.monto) || (b.ven-a.ven) || ((b.conv||0)-(a.conv||0)));

  const maxM=Math.max.apply(null,filas.map(f=>f.monto).concat([1]));
  const cuerpo=filas.map((f,i)=>{
    const o=f.o;
    const ccol=f.conv==null?'var(--gris2)':f.conv>=30?'var(--teal)':f.conv>=10?'var(--gold)':'var(--coral)';
    const top=Object.entries(o.sold||{}).sort((a,b)=>b[1]-a[1]).slice(0,3);
    const quien=top.length?top.map(t=>'<span class="ofq">'+esc(fn(+t[0]))+' <b>'+t[1]+'</b></span>').join("")
                          :'<span class="ofnad">nadie la vendió</span>';
    return '<div class="ofrow'+(f.ven===0?' fria':'')+'">'
      +'<div class="ofpos">'+(i+1)+'</div>'
      +'<div class="ofnom"><span class="oftipo '+(o.tipo==="combo"?"combo":"")+'">'+(o.tipo==="combo"?"🧩 Combo":"🎁 Oferta")+'</span>'
        +'<span class="ofn" title="'+esc(o.titulo)+'">'+esc(o.titulo)+'</span></div>'
      +'<div class="ofc2" title="Veces que el equipo se la mandó a un cliente">'+f.env+'</div>'
      +'<div class="ofc2" title="Clientes que la compraron">'+f.ven+'</div>'
      +'<div class="ofc2" style="color:'+ccol+';font-weight:800" title="Cuántas de las enviadas terminaron en venta">'+(f.conv==null?'—':f.conv+'%')+'</div>'
      +'<div class="ofmon"><b>'+Mabbr(f.monto)+'</b><i style="width:'+Math.max(2,Math.round(f.monto/maxM*100))+'%"></i></div>'
      +'<div class="ofquien">'+quien+'</div></div>';
  }).join("");

  const totEnv=filas.reduce((s,f)=>s+f.env,0), totVen=filas.reduce((s,f)=>s+f.ven,0), totM=filas.reduce((s,f)=>s+f.monto,0);
  box.innerHTML=cab
    +'<span class="muted" style="margin-left:auto;font-size:12px">'+OF.length+' vigentes · '+totEnv+' enviadas · '+totVen+' vendidas · '+Mabbr(totM)+'</span></div>'
    +'<div class="tblwrap"><div class="oflist">'
    +'<div class="ofrow ofhead"><div class="ofpos">#</div><div class="ofnom">Oferta o combo</div>'
    +'<div class="ofc2">Enviadas</div><div class="ofc2">Vendidas</div><div class="ofc2">Convierte</div>'
    +'<div class="ofmon">Facturado</div><div class="ofquien">Quiénes la vendieron</div></div>'
    + cuerpo +'</div></div>'
    +'<div class="tblnote">Ordenadas de <b>mejor a peor rendimiento</b> (manda lo facturado). Las que nadie vendió quedan al final, en gris. '
    +'Las publica el administrador desde Oportunidades; acá ves cómo le fue a cada una <b>en tu equipo</b>. El detalle completo, con quién envió cada una, está en la solapa <b>Ofertas</b>.</div>';
}

/* ═══════════════ COMISIÓN DEL MES ══════════════════════════════════════════
   La comisión NO es filtrable por fecha: el motor la calcula sobre el MES entero
   (facturado neto → tramos → nivel → salud). Ver [[eyg-comisiones-niveles]].
   Por eso la columna muestra siempre la del mes, y de dos fuentes distintas:
     · mes YA LIQUIDADO  → el número CONGELADO del cierre (es el que se pagó);
     · mes EN CURSO      → la estimación en vivo que trae la ficha del comercial.
   Un mes pasado sin liquidar no se puede mostrar: las fichas sólo calculan el
   mes en curso. En ese caso va "—" y el tooltip lo explica.                    */
let CIERRES=null, CIERRE_MES={}, COMI_FUENTE="";
function mesComision(){ return RANGO ? (mesDelRango(RANGO) || RANGO.hasta.slice(0,7)) : null; }
async function cargarComisiones(){
  const m=mesComision(); if(!m) return;
  try{
    if(CIERRES==null) CIERRES = (window.EYGLIQ ? await EYGLIQ.cierresLeer().catch(()=>[]) : []);
    if(CIERRES.includes(m) && !CIERRE_MES[m]){
      const c=await EYGLIQ.cierreLeer(m).catch(()=>null);
      if(c){ CIERRE_MES[m]={}; (c.comerciales||[]).forEach(f=>{ CIERRE_MES[m][f.uid]=f; }); }
    }
  }catch(e){}
  renderEquipo();
}
/* Devuelve {val, fuente} para el comercial: val=null si ese mes no se puede saber. */
function comisionDe(uid){
  const m=mesComision(), moHoy=argToday().slice(0,7);
  if(m && CIERRE_MES[m] && CIERRE_MES[m][uid]) return {val:CIERRE_MES[m][uid].comiFinal||0, fuente:"liquidado"};
  if(m===moHoy){ const f=FICHAS[uid]; return f&&f.com ? {val:f.com.total||0, fuente:"estimada"} : {val:null, fuente:"cargando"}; }
  return {val:null, fuente:"sin-liquidar"};
}

/* ═══════════════ TABLA COMPARATIVA POR COMERCIAL ═══════════════════════════
   Una fila por comercial y una columna por métrica, ordenable por cualquiera.
   Es la herramienta para comparar y coordinar; el análisis individual (nivel,
   salud, fortalezas, oportunidades) sigue abriéndose al tocar la fila.        */
const COLS=[
  {k:"nombre",  lab:"Comercial",       tipo:"txt",   ayuda:"Tocá una fila para abrir su análisis completo."},
  {k:"ped",     lab:"Pedidos",         tipo:"num",   ayuda:"Pedidos confirmados en el período."},
  {k:"vendido", lab:"Vendido",         tipo:"money", ayuda:"Suma de sus pedidos confirmados en el período, con IVA."},
  {k:"ticket",  lab:"Ticket prom.",    tipo:"money", ayuda:"Vendido dividido la cantidad de pedidos: cuánto vale en promedio cada pedido que carga."},
  {k:"cli",     lab:"Clientes",        tipo:"num",   ayuda:"Clientes distintos que le compraron en el período."},
  {k:"nuevos",  lab:"Nuevos",          tipo:"num",   ayuda:"Clientes dados de alta a su nombre dentro del período."},
  {k:"cob",     lab:"Cobrado",         tipo:"money", ayuda:"Pagos entrantes del período sobre su cartera. No es la cobranza de estas ventas: es la del período."},
  {k:"margen",  lab:"Margen",          tipo:"pct1",  ayuda:"Margen de sus pedidos del período, sobre el neto sin IVA."},
  {k:"venc",    lab:"Vencido",         tipo:"money", ayuda:"Deuda vencida de su cartera A HOY. No depende del período elegido."},
  {k:"comi",    lab:"Comisión",        tipo:"money", ayuda:"Comisión del MES (el motor la calcula sobre el mes entero, no por rango de fechas)."},
];
function valCol(uid,k){
  const b=EQ&&EQ.byUid[uid], f=FICHAS[uid], c=COM.find(x=>x.uid===uid);
  switch(k){
    case "nombre": return c?c.name:"";
    case "venc":   return f?(f.vencido||0):null;
    case "comi":   return comisionDe(uid).val;
    default:       return b?(b[k]!=null?b[k]:null):null;
  }
}
function fmtCol(tipo,v){
  if(v==null) return '<span class="na">—</span>';
  if(tipo==="money") return Mabbr(v);
  if(tipo==="pct1")  return v.toFixed(1).replace(".",",")+"%";
  if(tipo==="num")   return Math.round(v).toLocaleString("es-AR");
  return esc(String(v));
}
function ordenar(k){
  if(ORD.col===k) ORD.dir=-ORD.dir;
  else ORD={col:k, dir:(k==="nombre"?1:-1)};
  renderEquipo();
}
function renderEquipo(){
  const box=document.getElementById("equipo"); if(!box)return;
  if(!COM.length){
    box.innerHTML='<div class="eqhead"><h2>👥 Rendimiento por comercial</h2></div>'
      +'<div class="floading" style="padding:26px;text-align:center;color:var(--gris);background:var(--surface);border:1px dashed var(--line);border-radius:14px">Todavía no tenés comerciales a cargo.<br><span style="font-size:12px">Cuando te asignen, vas a ver acá el rendimiento de cada uno.</span></div>';
    return;
  }
  const m=mesComision(), moHoy=argToday().slice(0,7);
  const comiLbl = (CIERRE_MES[m]) ? "liquidada de "+MESES[(+m.slice(5,7))-1] : (m===moHoy ? "estimada del mes en curso" : "sin liquidar");
  const filas=COM.slice().sort((a,b)=>{
    const va=valCol(a.uid,ORD.col), vb=valCol(b.uid,ORD.col);
    if(ORD.col==="nombre") return ORD.dir*String(va).localeCompare(String(vb));
    return -ORD.dir*((vb==null?-Infinity:vb)-(va==null?-Infinity:va));   // dir -1 = de mayor a menor
  });
  const mejor={}; COLS.forEach(c=>{ if(c.tipo==="txt"||c.k==="venc")return;
    const vs=COM.map(x=>valCol(x.uid,c.k)).filter(v=>v!=null); if(vs.length) mejor[c.k]=Math.max.apply(null,vs); });

  const th=COLS.map(c=>'<div class="th '+(c.tipo==="txt"?"l":"r")+(ORD.col===c.k?" ord":"")+'" title="'+esc(c.ayuda)+'" onclick="ordenar(\''+c.k+'\')">'
    +esc(c.lab)+(ORD.col===c.k?'<span class="ar">'+(ORD.dir<0?'▼':'▲')+'</span>':'')+'</div>').join("");

  const tr=filas.map(c=>{
    const sel=SEL===c.uid?" sel":"";
    const tds=COLS.map(col=>{
      if(col.k==="nombre"){
        const f=FICHAS[c.uid];
        const lv=f?(f.perfil==="externo"?"🔵 Externo":(f.nivel.emoji+" "+f.nivel.nombre)):(FICHAS_LOADING?'<span class="shim">analizando…</span>':"&nbsp;");
        return '<div class="td l"><span class="pt" style="background:'+c.color+'"></span><b>'+esc(c.name)+'</b><span class="lv">'+lv+'</span></div>';
      }
      const v=valCol(c.uid,col.k);
      if(col.k==="comi"){
        const cd=comisionDe(c.uid);
        const tt = cd.fuente==="liquidado" ? "Comisión ya liquidada y congelada de "+m
                 : cd.fuente==="estimada"  ? "Estimación en vivo del mes en curso: cambia hasta que se cierre el mes"
                 : cd.fuente==="cargando"  ? "Calculando la ficha de este comercial…"
                 : "El mes "+m+" no está liquidado y las fichas sólo calculan el mes en curso";
        return '<div class="td r" title="'+esc(tt)+'">'+(cd.val==null?(cd.fuente==="cargando"?'<span class="shim">…</span>':'<span class="na">—</span>'):Mabbr(cd.val))+'</div>';
      }
      if(col.k==="venc" && !FICHAS[c.uid]) return '<div class="td r">'+(FICHAS_LOADING?'<span class="shim">…</span>':'<span class="na">—</span>')+'</div>';
      const top = (mejor[col.k]!=null && v!=null && v===mejor[col.k] && v>0 && COM.length>1) ? " top" : "";
      // en Vendido, además, cómo le fue contra el mismo largo de días anterior
      if(col.k==="vendido" && EQ && EQ.prev){
        const d=delta(v,(EQ.prev.byUid[c.uid]||{}).vendido);
        return '<div class="td r'+top+'">'+fmtCol(col.tipo,v)+chipDelta(d)+'</div>';
      }

    }).join("");
    return '<div class="tr'+sel+'" onclick="selCom('+c.uid+')">'+tds+'</div>';

  const t=EQ?EQ.tot:null;
  const comiTot=COM.reduce((a,c)=>{ const v=comisionDe(c.uid).val; return v==null?a:a+v; },0);
  const vencTot=COM.reduce((a,c)=>a+((FICHAS[c.uid]&&FICHAS[c.uid].vencido)||0),0);
  const totTds=COLS.map(col=>{
    if(col.k==="nombre") return '<div class="td l"><b>Todo el equipo</b><span class="lv">'+COM.length+' comerciales</span></div>';
    let v=null;
    if(col.k==="venc") v=vencTot; else if(col.k==="comi") v=comiTot; else if(t) v=(t[col.k]!=null?t[col.k]:null);
    return '<div class="td r">'+fmtCol(col.tipo,v)+'</div>';
  }).join("");

  box.innerHTML='<div class="eqhead"><h2>👥 Rendimiento por comercial</h2>'
    +'<span class="muted">'+esc(RANGO?RANGO.lbl:"")+' · tocá el título de una columna para ordenar, o una fila para el análisis</span></div>'
    +'<div class="tblwrap"><div class="tblcom" style="--cols:'+COLS.length+'">'
    +'<div class="tr th-row">'+th+'</div>'
    +'<div class="tr tot">'+totTds+'</div>'
    + tr
    +'</div></div>'
    +'<div class="tblnote">📅 <b>Vendido, pedidos, ticket, clientes, nuevos, cobrado y margen</b> son del período elegido arriba. '
    +'<b>Vencido</b> es la foto de hoy (una deuda no pertenece a un rango de fechas). '
    +'<b>Comisión</b> es del mes ('+esc(comiLbl)+'), porque el motor la calcula sobre el mes entero.</div>'
    +'<div id="detCom"></div>';
  if(SEL!=null) renderDetalle();
}

// ---- puntos fuertes / a mejorar / oportunidades (derivados de la ficha vs equipo) ----
function fortDeb(d){
  const fuertes=[], debiles=[];
  for(const m of METR){
    const v=mval(d,m.k), a=AGG&&AGG.avg[m.k]; if(v==null||a==null) continue;
    const mejor = m.higher ? v>=a*1.12 : v<=a*0.88;   // 12% mejor que el promedio
    const peor  = m.higher ? v<=a*0.85 : v>=a*1.20;
    const txt = `${m.lab}: <b>${fmtMetric(m.fmt,v)}</b> <span class="muted">(equipo ${fmtMetric(m.fmt,a)})</span>`;
    if(mejor) fuertes.push(txt); else if(peor) debiles.push(txt);
  }
  return {fuertes:fuertes.slice(0,4), debiles:debiles.slice(0,4)};
}
function oportunidades(d){
  if(d.perfil==="externo") return [];
  const ops=[];
  const vencPct=mval(d,"vencPct"), fichas=mval(d,"fichas"), cumpl=mval(d,"cumpl");
  const meta=(d.meta!=null?d.meta:(d.factBaseline||0)*1.2);
  // 1) vencido → recupera tasa de comisión (salud)
  if(vencPct>25){
    // comisión que recupera si la salud vuelve a 100 (el recorte es penaltyPt/100 de la tasa)
    const gain=(d.factMes||0)*(d.salud.penaltyPt/100)*(d.nivel.mult||1);
    ops.push({ic:"🩸",tx:`Bajar el <b>vencido</b> del ${Math.round(vencPct)}% a menos del 25% recupera salud y tasa de comisión.`, gain:gain>500?"+"+M(gain):""});
  }
  // 2) meta del mes
  if(cumpl<100 && meta>0){ const falta=Math.max(0,meta-d.factMes);
    ops.push({ic:"🎯",tx:`Va al <b>${Math.round(cumpl)}%</b> de su meta. Faltan <b>${M(falta)}</b> para el objetivo del mes.`, gain:""}); }
  // 3) nuevos
  if((d.nuevos||0)<3){ ops.push({ic:"🆕",tx:`Le faltan <b>${3-(d.nuevos||0)}</b> cliente(s) nuevo(s) para el objetivo (${d.nuevos||0}/3).`, gain:"+nivel"}); }
  // 4) fichas
  if(fichas<60){ ops.push({ic:"🗂️",tx:`Fichas al <b>${Math.round(fichas)}%</b> — completar datos sube la salud y destraba comisión.`, gain:""}); }
  // 5) combos (siempre palanca de nivel)
  ops.push({ic:"🎁",tx:`Colocar los <b>combos y ofertas</b> de la semana suma hasta 25 pts de nivel (multiplica toda la comisión).`, gain:"+nivel"});
  return ops.slice(0,4);
}
function cmpRow(d,m){
  const v=mval(d,m.k); if(v==null) return "";
  const a=AGG?AGG.avg[m.k]:null, best=AGG?AGG.best[m.k]:v;
  const scale=Math.max(v,best||0,a||0,m.fmt==="pct"?100:1)||1;
  const w=Math.min(100,v/scale*100), aw=a!=null?Math.min(100,a/scale*100):null;
  const bien = m.higher ? (a!=null&&v>=a) : (a!=null&&v<=a);
  const col = bien?'linear-gradient(90deg,var(--aqua),var(--teal))':'linear-gradient(90deg,#F0B49C,var(--coral))';
  return `<div class="cmprow"><div class="cl"><span>${m.lab}</span><b>${fmtMetric(m.fmt,v)}</b></div>
    <div class="track"><div class="fill" style="width:${w}%;background:${col}"></div>${aw!=null?`<div class="avg" data-l="equipo" style="left:${aw}%"></div>`:""}</div></div>`;
}

      <div class="sec">Ficha completa</div>

/* OPTIMIZADO: 8 consultas agregadas (antes 14, dos de ellas leían miles de registros).
   Como el edge function contiende en Odoo con consultas pesadas, menos y más livianas
   = mucho más rápido. Los buckets por mes salen del __range que devuelve read_group. */
async function fichaData(uid, name, carteraIn, pfIn){
  const t=argToday(), y=t.slice(0,4), mo=t.slice(0,7), inicioMes=mo+"-01", inicioAno=y+"-01-01";
  // cartera (ids) y ficha (pf) pueden venir pre-cargadas a nivel equipo (1 consulta reutilizada);
  // si no, se traen acá (camino de 1 comercial, ej. al seleccionar).
  const cartera=carteraIn||await EYG.rpc("res.partner","search",[[["user_id","=",uid]]]);
  const [movG,payG,ml,ordG,estG,pf,mg,waMsgs,ofVenG,ofEnvC]=await Promise.all([
    // facturas+NC por mes y tipo (190d) → factMes, baseline y desglose de facturación
    EYG.rpc("account.move","read_group",[[["partner_id","in",cartera],["move_type","in",["out_invoice","out_refund"]],["state","=","posted"],["invoice_date",">=",EYG.hace(190)]],["amount_total:sum"],["invoice_date:month","move_type"]],{lazy:false}),
    // cobros entrantes por mes (100d) → cobrado del mes + objetivo (prom 3m)
    EYG.rpc("account.payment","read_group",[[["partner_id","in",cartera],["payment_type","=","inbound"],["state","=","posted"],["date",">=",EYG.hace(100)]],["amount:sum"],["date:month"]],{lazy:false}),
    // saldos a cobrar sin conciliar → por cobrar / vencido
    EYG.rpc("account.move.line","search_read",[[["account_id.account_type","=","asset_receivable"],["parent_state","=","posted"],["full_reconcile_id","=",false],"|",["move_id.invoice_line_ids.sale_line_ids.order_id.user_id","=",uid],"&",["move_id.invoice_line_ids.sale_line_ids.order_id.user_id","=",452],["move_id.invoice_line_ids.sale_line_ids.order_id.partner_id.user_id","=",uid]]],{fields:["amount_residual","date_maturity"],limit:0}),
    // pedidos confirmados por mes y cliente (190d) → promedios, actividad, ticket y pedidos netos del mes
    EYG.rpc("sale.order","read_group",[[["user_id","=",uid],["state","in",["sale","done"]],["date_order",">=",EYG.hace(190)]],["amount_total:sum"],["date_order:month","partner_id"]],{lazy:false}),
    // órdenes del mes por estado → cancelados / presupuestos (desglose)
    EYG.rpc("sale.order","read_group",[[["user_id","=",uid],["date_order",">=",inicioMes]],["amount_total:sum"],["state"]],{lazy:false}),
    // cartera: datos de ficha + fecha de alta (para "nuevos" sin consulta aparte)
    pfIn?Promise.resolve(pfIn):EYG.rpc("res.partner","search_read",[[["user_id","=",uid]]],{fields:["vat","phone","mobile","email","street","create_date"],limit:0}),
    // margen del año → rentabilidad
    EYG.rpc("sale.order.line","read_group",[[["order_id.user_id","=",uid],["order_id.state","in",["sale","done"]],["order_id.date_order",">=",inicioAno]],["margin:sum","price_subtotal:sum"],[]],{lazy:false}),
    // mensajes WA confirmados de la semana sobre su cartera
    EYG.rpc("mail.message","search_read",[[["model","=","res.partner"],["res_id","in",cartera],["date",">=",EYG.hace(7)+" 00:00:00"],"|",["body","like","EyGWA"],["body","like","EyGCRM"]]],{fields:["res_id","date","body"],limit:0}),
    // ofertas VENDIDAS este mes (cliente × oferta) sobre productos en oferta
    EYG.rpc("sale.order.line","read_group",[[["order_partner_id","in",cartera],["product_id","in",OFPIDS_LIDER.length?OFPIDS_LIDER:[0]],["state","in",["sale","done"]],["order_id.date_order",">=",inicioMes]],["price_subtotal:sum"],["order_partner_id","product_id"]],{lazy:false}),
    // ofertas ENVIADAS este mes (notas [EyGOFENV] en el partner del comercial)
    EYG.rpc("mail.message","search_count",[[["model","=","res.partner"],["res_id","=",PARTMAP[uid]||0],["date",">=",inicioMes+" 00:00:00"],["body","like","EyGOFENV"]]]),
  ]);
  const mkey=(r,f)=>{ const rg=r.__range&&r.__range[f]; return rg?rg.from.slice(0,7):String(r[f]||"").slice(0,7); };
  // WhatsApp: hoy (contactos distintos + mensajes + nuevo/seg) y semana
  const _wt=t.slice(0,10); const _pw=b=>{const s=(b||"").replace(/<[^>]+>/g,"");const m=s.match(/\[EyGWA\]\s*(\w+)\/(\w+)/);return m?m[2]:(/EyGCRM/.test(s)?"seg":null);};
  const _wm=(waMsgs||[]).map(x=>({res_id:x.res_id,date:(x.date||"").slice(0,10),ng:_pw(x.body)})).filter(x=>x.ng);
  const _wh=_wm.filter(x=>x.date===_wt);
  const waHoyMsg=_wh.length, waHoyCont=new Set(_wh.map(x=>x.res_id)).size, waHoyNuevo=_wh.filter(x=>x.ng==="nuevo").length, waSemMsg=_wm.length;
  // Facturación: neto por mes + desglose del mes
  const netMes={}; let facMonto=0,facN=0,ncMonto=0,ncN=0;
  for(const r of movG){ const m=mkey(r,"invoice_date:month"), amt=r.amount_total||0, inv=r.move_type==="out_invoice";
    netMes[m]=(netMes[m]||0)+(inv?1:-1)*amt;
    if(m===mo){ if(inv){facMonto=amt;facN=r.__count||0;} else {ncMonto=amt;ncN=r.__count||0;} } }
  const facturadoMes=facMonto-ncMonto;   // facturado por cartera (para el desglose visual)
  // BASE de la comisión (desde agosto) = FACTURADO NETO atribuido a QUIEN GENERÓ EL PEDIDO (cruce factura→pedido→vendedor)
  const fact={}, factT={};   // fact = facturado NETO (comisión) · factT = facturado TOTAL c/IVA (métrica)
  try{
    // HÍBRIDO: quien generó el pedido; si el pedido está bajo la genérica (452), el dueño del cliente
    const domF=(mt)=>[["parent_state","=","posted"],["move_id.move_type","=",mt],["date",">=",EYG.hace(210)],
      "|",["sale_line_ids.order_id.user_id","=",uid],
          "&",["sale_line_ids.order_id.user_id","=",452],["sale_line_ids.order_id.partner_id.user_id","=",uid]];
    const [fi,fr]=await Promise.all([
      EYG.rpc("account.move.line","read_group",[domF("out_invoice"),["price_subtotal:sum","price_total:sum"],["date:month"]],{lazy:false}),
      EYG.rpc("account.move.line","read_group",[domF("out_refund"),["price_subtotal:sum","price_total:sum"],["date:month"]],{lazy:false}),
    ]);
    for(const r of fi){ const rg=r.__range&&r.__range["date:month"]; const k=rg?rg.from.slice(0,7):null; if(k){ fact[k]=(fact[k]||0)+(r.price_subtotal||0); factT[k]=(factT[k]||0)+(r.price_total||0); } }
    for(const r of fr){ const rg=r.__range&&r.__range["date:month"]; const k=rg?rg.from.slice(0,7):null; if(k){ fact[k]=(fact[k]||0)-(r.price_subtotal||0); factT[k]=(factT[k]||0)-(r.price_total||0); } }
  }catch(e){}
  const _cfg = await EYG.comisionesConfig().catch(()=>EYG.COMI_DEF);
  const _md = EYG.metaDesde(fact, mo, _cfg);
  const factMes=fact[mo]||0;             // base comisión = facturado neto por cruce
  const factMesTotal=factT[mo]||0;       // métrica = facturado total con IVA (por cruce)
  const factBaseline=_md.baseline, metaMes=_md.meta;
  // Cobros
  let cobradoMes=0, cob3=0;
  for(const r of payG){ const m=mkey(r,"date:month"), amt=r.amount||0; cob3+=amt; if(m===mo) cobradoMes=amt; }
  const objetivoCobro=cob3/3*1.1;
  // Por cobrar / vencido
  let porCobrar=0,vencido=0; for(const l of ml){const r=l.amount_residual||0; if(r>0){porCobrar+=r; if(l.date_maturity&&l.date_maturity<t)vencido+=r;}}
  // Actividad / ticket / pedidos netos del mes (cada fila = un cliente en un mes)
  const bk={}; let sumTot=0,cnt=0, pedM=0,pedN=0;
  for(const r of ordG){ const m=mkey(r,"date_order:month"), n=r.__count||0, amt=r.amount_total||0;
    (bk[m]=bk[m]||{ped:0,cli:0,tot:0}); bk[m].ped+=n; bk[m].cli+=1; bk[m].tot+=amt; sumTot+=amt; cnt+=n;
    if(m===mo){ pedM+=amt; pedN+=n; } }
  const prev=Object.keys(bk).filter(m=>m<mo), nP=prev.length||1;
  const promPed=Math.round(prev.reduce((s,m)=>s+bk[m].ped,0)/nP)||1, promCli=Math.round(prev.reduce((s,m)=>s+bk[m].cli,0)/nP)||1;
  const cur=bk[mo]||{ped:0,cli:0};
  const actividadRatio=(Math.min(cur.ped/promPed,1)+Math.min((cur.cli||0)/promCli,1))/2;
  const avgTicket=cnt?sumTot/cnt:0;
  // Estados del mes: cancelados / presupuestos
  let canN=0,canM=0,draN=0,draM=0;
  for(const r of estG){ const st=r.state, n=r.__count||0, amt=r.amount_total||0;
    if(st==="cancel"){canN+=n;canM+=amt;} else if(st==="draft"||st==="sent"){draN+=n;draM+=amt;} }
  // Fichas + nuevos (de la cartera ya traída)
  const compl=pf.filter(p=>p.vat&&(p.phone||p.mobile)&&p.email&&p.street).length, fichasPct=pf.length?compl/pf.length:0;
  const nuevos=pf.filter(p=>(p.create_date||"")>=inicioMes).length;
  const rentabilidad=(mg[0]&&mg[0].price_subtotal)?(mg[0].margin/mg[0].price_subtotal):null;
  const dd=new Date(), dim=new Date(dd.getFullYear(),dd.getMonth()+1,0).getDate(), diaMesFrac=dd.getDate()/dim;
  const perfil=EYGM.perfilDe(name, avgTicket);
  const desglose={ pedN, pedM, canN, canM, draN, draM, facN, facMonto, ncN, ncMonto };
  const ofVendidas=(ofVenG||[]).length, ofEnviadas=ofEnvC||0;
  const d={nombre:name, perfil, factMes, factMesTotal, factBaseline, meta:metaMes, metaMetodo:_cfg.metaMetodo, rates:_cfg.rates, externoCorte:_cfg.externoCorte, cobradoMes, objetivoCobro, vencido, porCobrar, fichasPct, nuevos, actividadRatio, ofEnviadas, ofVendidas, avgTicket, diaMesFrac, cartera:pf.length, rentabilidad, waHoyMsg, waHoyCont, waHoyNuevo, waSemMsg, pedMes:pedM, desglose};
  d.nivel=EYGM.nivel(d); d.salud=EYGM.salud(d); d.com=EYGM.comision(d);
  return d;
}
/* Bloque de ventas: PEDIDOS (neto) grande vs FACTURADO (neto) abajo, con el detalle
   contable desplegable. Se usa para un comercial (detalle) y para el equipo (arriba).
   opts: {quien, id, titulo, cargaLbl, factLbl} para reusar sin chocar ids. */
function ventasHTML(d, opts){
  opts=opts||{};
  const quien=opts.quien||esc((d.nombre||"").split(" ")[0]);
  const id=opts.id||"desgBox";
  const titulo=opts.titulo||"💵 Ventas del mes";
  const cargaLbl=opts.cargaLbl||("lo que cargó "+quien+" · órdenes confirmadas");
  const factLbl=opts.factLbl||"facturas − notas de crédito, de su cartera";
  const g=d.desglose||{pedN:0,pedM:0,canN:0,canM:0,draN:0,draM:0,facN:0,facMonto:0,ncN:0,ncMonto:0};
  const op=n=>n===1?"1 operación":(n||0).toLocaleString("es-AR")+" operaciones";
  const drow=(ic,lab,n,m,neg,mut)=>`<div class="drow2${mut?' mut':''}"><span class="dl">${ic} ${lab}</span><span class="dc">${op(n)}</span><b class="da">${neg&&m?'−':''}${M(m)}</b></div>`;
  return `<div class="ventas">
      <div class="vhead"><div class="vt">${titulo}</div><button class="vinfo" onclick="toggleDesg('${id}')">🧮 Ver la cuenta</button></div>
      <div class="vmain">
        <div class="vcol"><div class="vlab">Pedidos <span class="mut2">(con IVA)</span></div><div class="vbig">${Mabbr(d.pedMes)}</div><div class="vsrc">${cargaLbl}</div></div>
        <div class="vsep">vs</div>
        <div class="vcol"><div class="vlab">Facturado <span class="mut2">(con IVA)</span></div><div class="vbig2">${Mabbr((g.facMonto||0)-(g.ncMonto||0))}</div><div class="vsrc">${factLbl}</div></div>
      </div>
      <div id="${id}" class="desg" style="display:none">
        <div class="desgh">Pedidos (por vendedor de la orden)</div>
        ${drow("🧾","Pedidos confirmados", g.pedN, g.pedM)}
        ${drow("🚫","Pedidos cancelados", g.canN, g.canM, true, true)}
        ${drow("📝","Presupuestos abiertos", g.draN, g.draM, false, true)}
        <div class="drow2 tot"><span class="dl">Pedidos netos (confirmados)</span><b class="da">${M(g.pedM)}</b></div>
        <div class="desgh" style="margin-top:12px">Facturación (por cliente de la cartera)</div>

/* Desglose de ventas del EQUIPO con consultas propias a nivel equipo (pocas y rápidas),
   NO sumando las fichas (que son 14 consultas c/u y saturaban). Coincide con los KPIs
   de arriba porque usa el mismo criterio (sale.order por user_id in UIDS). */
/* Desglose de facturación del equipo para el período elegido (pedidos, cancelados,
   presupuestos, facturas y notas de crédito). Acompaña a la barra de arriba. */
let VENTASEQ={};        // cacheado por rango (clave desde_hasta)
let CARTERA_EQ=null;    // cartera del equipo, para no reconsultarla en cada período
/* Desglose para un rango [desde, hasta). 'hasta' EXCLUSIVO. Lo usa también el histórico. */
async function desgloseEquipo(desde, hasta){
  if(!CARTERA_EQ) CARTERA_EQ=await EYG.rpc("res.partner","search",[[["user_id","in",UIDS]]]);
  const cartera=CARTERA_EQ;
  const rg=f=>{ const d=[[f,">=",desde]]; if(hasta) d.push([f,"<",hasta]); return d; };
  const so=st=>EYG.rpc("sale.order","read_group",[[["user_id","in",UIDS],...st,...rg("date_order")],["amount_total:sum"],[]],{lazy:false});
  const am=mt=>EYG.rpc("account.move","read_group",[[["partner_id","in",cartera],["move_type","=",mt],["state","=","posted"],...rg("invoice_date")],["amount_total:sum"],[]],{lazy:false});
  const [ped,can,dra,fac,nc]=await Promise.all([
    so([["state","in",["sale","done"]]]), so([["state","=","cancel"]]), so([["state","in",["draft","sent"]]]),
    am("out_invoice"), am("out_refund"),
  ]);
  const gN=g=>g&&g[0]?g[0].__count||0:0, gM=g=>g&&g[0]?g[0].amount_total||0:0;
  const desglose={pedN:gN(ped),pedM:gM(ped),canN:gN(can),canM:gM(can),draN:gN(dra),draM:gM(dra),facN:gN(fac),facMonto:gM(fac),ncN:gN(nc),ncMonto:gM(nc)};
  return {n:COM.length, pedMes:desglose.pedM, factMes:desglose.facMonto-desglose.ncMonto, desglose};
}
function claveRango(){ return RANGO ? (RANGO.desde+"_"+RANGO.hasta) : ""; }
async function cargarVentasEq(){
  if(!RANGO||!UIDS.length) return;
  const key=claveRango();
  if(VENTASEQ[key]){ renderVentasEq(); return; }
  renderVentasEq();                                   // muestra "cargando…" del período pedido
  try{ VENTASEQ[key]=await desgloseEquipo(RANGO.desde, sumaDias(RANGO.hasta,1)); }catch(e){}
  renderVentasEq(); renderGraficos();   // el embudo se arma con este desglose
}
function renderVentasEq(){
  const box=document.getElementById("ventasEq"); if(!box) return;
  if(!UIDS.length||!RANGO){ box.innerHTML=""; return; }   // líder sin comerciales
  const lbl=RANGO.lbl, v=VENTASEQ[claveRango()];
  if(!v){ box.innerHTML='<div class="ventas"><div class="floading"><span class="spin-sm"></span> sumando ventas del equipo ('+esc(lbl)+')…</div></div>'; return; }

   Punto 0 = lanzamiento del sistema (agosto 2026): los meses previos se ven como
   referencia (gris), sin puntos ni niveles (que arrancan recién ahora). */
const LAUNCH="2026-08";
let HIST=null, HISTMES=null;
function mesLbl(m){ return MESES[(+m.split("-")[1])-1]||m; }
async function cargarHistorico(){
  if(HIST){ renderHistorico(); return; }
  const box=document.getElementById("hist"); if(box) box.innerHTML=`<div class="floading"><span class="spin-sm"></span> cargando el histórico del equipo…</div>`;
  const desde=argToday().slice(0,4)+"-01-01";
  try{
    if(!CARTERA_EQ) CARTERA_EQ=await EYG.rpc("res.partner","search",[[["user_id","in",UIDS]]]);
    const [movG,ordCom]=await Promise.all([
      EYG.rpc("account.move","read_group",[[["partner_id","in",CARTERA_EQ],["move_type","in",["out_invoice","out_refund"]],["state","=","posted"],["invoice_date",">=",desde]],["amount_total:sum"],["invoice_date:month","move_type"]],{lazy:false}),
      EYG.rpc("sale.order","read_group",[[["user_id","in",UIDS],["state","in",["sale","done"]],["date_order",">=",desde]],["amount_total:sum"],["date_order:month","user_id"]],{lazy:false}),
    ]);
    const mk=(r,f)=>{const rg=r.__range&&r.__range[f];return rg?rg.from.slice(0,7):"";};
    const teamNet={}; for(const r of movG){ const m=mk(r,"invoice_date:month"); if(m) teamNet[m]=(teamNet[m]||0)+(r.move_type==="out_invoice"?1:-1)*(r.amount_total||0); }
    const byCom={}, teamPed={};
    for(const r of ordCom){ const m=mk(r,"date_order:month"); const uid=r.user_id&&r.user_id[0], amt=r.amount_total||0; if(!m)continue; teamPed[m]=(teamPed[m]||0)+amt; if(uid){ (byCom[uid]=byCom[uid]||{})[m]=(byCom[uid][m]||0)+amt; } }
    const meses=[...new Set([...Object.keys(teamNet),...Object.keys(teamPed)])].sort();
    HIST={meses, teamNet, teamPed, byCom};
  }catch(e){ HIST={meses:[],teamNet:{},teamPed:{},byCom:{}}; }
  renderHistorico();
}
function renderHistorico(){
  const box=document.getElementById("hist"); if(!box) return;
  if(!HIST){ box.innerHTML=`<div class="floading"><span class="spin-sm"></span> cargando…</div>`; return; }

    const last=vals[vals.length-1]||0, prev=vals.length>1?vals[vals.length-2]:0; const dpct=prev>0?Math.round((last/prev-1)*100):null;

  box.innerHTML=`
    <div class="scopenote">📈 Evolución histórica del equipo. El sistema de <b>puntos y niveles arranca en agosto 2026</b> (lanzamiento). Los meses anteriores se muestran como <b>referencia</b> (en gris), sin puntaje.</div>
    <div class="chartbox"><div class="ch-head"><h2>Facturado del equipo · por mes (con IVA)</h2></div>
      ${barChart(serie)}

    </div>
    <div class="eqhead"><h2>👥 Evolución por comercial <span class="muted" style="font-weight:600;font-size:12px">· pedidos por mes</span></h2></div>
    <div class="tbl">
      <div class="hrow head"><div>Comercial</div><div>Evolución</div><div class="num">Último mes</div><div class="num">vs anterior</div></div>
      ${filas.map(f=>`<div class="hrow"><div class="nm"><span class="dotc" style="background:${f.c.color}"></span>${esc(f.c.name)}</div><div>${spark(f.vals)}</div><div class="num">${M(f.last)}</div><div class="num ${f.dpct==null?'':f.dpct>=0?'up':'down'}">${f.dpct==null?'—':(f.dpct>=0?'▲ ':'▼ ')+Math.abs(f.dpct)+'%'}</div></div>`).join("")}
    </div>
    <div class="eqhead" style="margin-top:18px"><h2>🔎 Consultar un mes</h2><span class="muted">tocá un mes para ver su desglose completo</span></div>
    <div class="cfilters">${meses.slice().reverse().map(m=>`<div class="cchip ${HISTMES===m?'on':''}" data-m="${m}" onclick="verMesHist('${m}')">${mesLbl(m)} ${m.slice(0,4)}${m<LAUNCH?' · ref.':''}</div>`).join("")}</div>
    <div id="histMes"></div>`;
  if(HISTMES) verMesHist(HISTMES);

  const has={name:!!c.name,tel:!!(c.phone||c.mobile),email:!!c.email,street:!!c.street,zip:!!c.zip,city:!!c.city,
    state:!!(c.state_id&&c.state_id[0]),idtype:!!(c.l10n_latam_identification_type_id&&c.l10n_latam_identification_type_id[0]),
    vat:!!c.vat,fiscal:!!(c.l10n_ar_afip_responsibility_type_id&&c.l10n_ar_afip_responsibility_type_id[0])};
  return {has, pct:Math.round(REQ.filter(r=>has[r.k]).length/REQ.length*100)};
}
function rubroActual(c){ for(const t of (c.category_id||[])) if(RUBRO_MAP[t]) return RUBRO_MAP[t]; return ""; }

// dueños posibles = el líder + sus comerciales (para asignar/reasignar)
function duenos(){ return [{uid:LIDER.uid,name:LIDER.name,color:"#0E5C58",lider:true}, ...COM.map(c=>({uid:c.uid,name:c.name,color:c.color}))]; }
function dueno(uid){ return duenos().find(d=>d.uid===uid) || {uid:null,name:"Sin asignar",color:"#B0413E"}; }

async function cargarContactos(){
  const owners=[LIDER.uid,...UIDS];
  const [list,sinAsig,fiscal,idt,prov]=await Promise.all([
    EYG.rpc("res.partner","search_read",[[["user_id","in",owners],["customer_rank",">",0],["category_id","not in",[ARCH_TAG]]]],{fields:PFIELDS_C,limit:0}),
    // pool GLOBAL de contactos sin comercial asignado (para repartir al equipo), sin los archivados
    EYG.rpc("res.partner","search_read",[[["user_id","=",false],["customer_rank",">",0],["category_id","not in",[ARCH_TAG]]]],{fields:PFIELDS_C,limit:0}),
    EYG.rpc("l10n_ar.afip.responsibility.type","search_read",[[]],{fields:["id","name"]}),
    EYG.rpc("l10n_latam.identification.type","search_read",[[["active","=",true]]],{fields:["id","name"]}),
    EYG.rpc("res.country.state","search_read",[[["country_id.code","=","AR"]]],{fields:["id","name"],limit:0}),
  ]);
  CT.list=list; CT.sinAsig=sinAsig; CT.cat={prov,idt,fiscal}; CT.cargado=true;
}
async function renderContactos(){
  const v=document.getElementById("vista"); if(!v)return;
  if(!CT.cargado){
    v.innerHTML='<div class="floading"><span class="spin-sm"></span> Cargando los contactos del equipo…</div>';
    try{ await cargarContactos(); }catch(e){ v.innerHTML='<div class="errbox">No pude leer los contactos: '+esc(e.message)+'</div>'; return; }
    if(VISTA!=="contactos") return;
  }
  // conteo por dueño
  const cnt={}; CT.list.forEach(c=>{ const u=c.user_id?c.user_id[0]:0; cnt[u]=(cnt[u]||0)+1; });
  const sinN=CT.sinAsig.length;
  const chips=[`<div class="cchip ${CT.filtro==='all'?'on':''}" onclick="setCFiltro('all')">Todos <b>${CT.list.length}</b></div>`]
    .concat(duenos().map(d=>`<div class="cchip ${CT.filtro==d.uid?'on':''}" onclick="setCFiltro(${d.uid})"><span class="c" style="background:${d.color}"></span>${esc(d.name.split(" ")[0])}${d.lider?' (líder)':''} <b>${cnt[d.uid]||0}</b></div>`))
    .concat([`<div class="cchip sin ${CT.filtro==='sinasig'?'on':''}" onclick="setCFiltro('sinasig')" title="Clientes sin comercial asignado — repartilos a tu equipo">🕳️ Sin asignar <b>${sinN}</b></div>`]).join("");
  const q=CT.q.trim().toLowerCase();
  const enSin = CT.filtro==="sinasig";
  let arr=(enSin?CT.sinAsig:CT.list).slice();
  if(!enSin && CT.filtro!=="all") arr=arr.filter(c=>(c.user_id?c.user_id[0]:0)===CT.filtro);
  if(q) arr=arr.filter(c=>((c.name||"")+" "+(c.city||"")+" "+(c.vat||"")).toLowerCase().includes(q));
  arr.sort((a,b)=>completar(a).pct-completar(b).pct);  // incompletos primero
  v.innerHTML=`
    <div class="cfilters">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="cq" placeholder="Buscar por nombre, localidad o CUIT…" value="${esc(CT.q)}" oninput="cbuscar(this.value)"></div>
      <button class="newbtn" onclick="nuevoContacto()">＋ Nuevo contacto</button>
    </div>
    <div class="cfilters">${chips}</div>
    ${enSin?`<div class="sinbanner">Estos <b>${sinN}</b> clientes no tienen comercial. Elegí un comercial en cada tarjeta para sumarlos a tu equipo.</div>`:""}
    ${arr.length?`<div class="clist">${arr.map(ccard).join("")}</div>`
      :`<div class="cempty">No hay contactos${enSin?' sin asignar':CT.filtro!=='all'?' para este filtro':''}${q?' que coincidan con la búsqueda':''}.${enSin?'':'<br>Podés crear uno con <b>＋ Nuevo contacto</b>.'}</div>`}`;
  const inp=document.getElementById("cq"); if(inp&&q){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); }
}
window.cbuscar = EYG.buscador ? EYG.buscador(v=>{ CT.q=v; renderContactos(); }) : (v=>{ CT.q=v; renderContactos(); });
function setCFiltro(f){ CT.filtro=f; renderContactos(); }
function ccard(c){
  const comp=completar(c); const own=dueno(c.user_id?c.user_id[0]:null);
  const tipoEmpresa=(c.is_company||c.company_type==="company");
  const col=comp.pct>=100?'var(--teal)':comp.pct>=60?'var(--teal-med)':comp.pct>=30?'var(--gold)':'var(--coral)';
  const tel=c.phone||c.mobile;
  return `<div class="cc">
    <div class="top"><div class="nm">${esc(c.name||'(sin nombre)')}</div><span class="tipo">${tipoEmpresa?'Empresa':'Persona'}</span></div>
    <div class="meta">
      ${tel?`<span class="mi">📞 ${esc(fmtTel(tel))}</span>`:'<span class="mi" style="color:var(--coral)">📞 sin teléfono</span>'}
      ${c.city?`<span class="mi">📍 ${esc(c.city)}${c.state_id?', '+esc(c.state_id[1]):''}</span>`:''}
      ${c.vat?`<span class="mi">🪪 ${esc(c.vat)}</span>`:''}
    </div>
    <div class="pct"><i style="width:${comp.pct}%;background:${col}"></i></div>
    <div style="font-size:11px;color:var(--gris2)">Ficha ${comp.pct}% completa</div>
    <div class="asig"><span class="dc" style="background:${own.color}"></span><span>${own.uid==null?'Asignar a':'Asignado a'}</span>
      <select onchange="reasignar(${c.id}, this.value)" style="flex:1;font-family:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:5px 7px;color:var(--ink);background:var(--surface)">
        ${own.uid==null?'<option value="" selected disabled>— sin asignar —</option>':''}
        ${duenos().map(d=>`<option value="${d.uid}" ${own.uid===d.uid?'selected':''}>${esc(d.name)}${d.lider?' (líder)':''}</option>`).join("")}
      </select>
    </div>
    <div class="acts">
      <button class="prim" onclick="editarContacto(${c.id})">✎ Editar</button>
      <button onclick="archivar(${c.id})" title="Archivar (sale de la lista, no se elimina)">🗂️ Archivar</button>
      <a href="https://drogueriaeyg.odoo.com/web#id=${c.id}&model=res.partner&view_type=form" target="_blank">Odoo ↗</a>
    </div>
  </div>`;
}
async function reasignar(id, uidStr){
  const uid=parseInt(uidStr,10); if(!uid) return;
  let c=CT.list.find(x=>x.id===id), desdeSin=false;
  if(!c){ c=CT.sinAsig.find(x=>x.id===id); desdeSin=true; }
  if(!c)return;
  const t=dueno(uid); const prev=c.user_id;
  c.user_id=[uid,t.name];   // optimista
  try{
    await EYG.rpc("res.partner","write",[[id],{user_id:uid}]);
    if(desdeSin){ CT.sinAsig=CT.sinAsig.filter(x=>x.id!==id); CT.list.push(c); }  // sale del pool, entra al equipo
    FICHAS_STALE=true;   // cambió la cartera: al volver a Rendimiento se recalcula
    toast((desdeSin?"Asignado a ":"Reasignado a ")+t.name+" ✓", true);
    renderContactos();
  }catch(e){ c.user_id=prev; toast("No se pudo asignar: "+e.message); renderContactos(); }
}
/* Archivar = marca suave (etiqueta 63): sale de la lista del líder y entra a la cola de
   revisión de la gerencia. NO se elimina ni se desactiva en Odoo. Ver memoria. */
async function archivar(id){
  const c=CT.list.find(x=>x.id===id)||CT.sinAsig.find(x=>x.id===id); if(!c)return;
  if(!confirm('¿Archivar «'+(c.name||"este contacto")+'»?\n\nSale de tu lista y queda para revisión de la gerencia. No se elimina.')) return;
  try{
    await EYG.rpc("res.partner","write",[[id],{category_id:[[4,ARCH_TAG]]}]);
    try{ await EYG.rpc("res.partner","message_post",[[id]],{body:"🗂️ [EyG-ARCH] Archivado por "+LIDER.name, message_type:"comment"}); }catch(e){}
    CT.list=CT.list.filter(x=>x.id!==id); CT.sinAsig=CT.sinAsig.filter(x=>x.id!==id);
    toast("Archivado ✓ — queda para revisión de la gerencia", true);
    renderContactos();
  }catch(e){ toast("No se pudo archivar: "+e.message); }
}

// ---- Drawer: crear / editar contacto ----
function nuevoContacto(){ abrirDrawer({id:null,company_type:"person",category_id:[]}, true); }
function editarContacto(id){ const c=CT.list.find(x=>x.id===id); if(c) abrirDrawer(c,false); }
function optSel(cat,sel,ph){ return `<option value="">${ph||'— elegir —'}</option>`+cat.map(o=>`<option value="${o.id}" ${sel&&(Array.isArray(sel)?sel[0]===o.id:sel===o.id)?'selected':''}>${esc(o.name)}</option>`).join(""); }
function abrirDrawer(c,isNew){
  CT.edit={id:c.id,isNew};
  const comp=completar(c); const tipo=(c.is_company||c.company_type==="company")?"company":"person";
  const rubroSel=rubroActual(c);
  const asignados=duenos();
  const asigDefault=isNew?LIDER.uid:(c.user_id?c.user_id[0]:LIDER.uid);
  const d=document.getElementById("cdrawer");
  d.innerHTML=`
    <div class="dh"><button class="x" onclick="cerrarDrawer()">✕</button><h3>${isNew?'Nuevo contacto':esc(c.name||'Editar ficha')}</h3></div>
    <div class="db">
      ${isNew?'':`<div class="hint" style="margin-bottom:12px">Ficha ${comp.pct}% completa · completá lo que falte.</div>`}
      <div class="fld"><label>Asignar a</label><select id="c_owner">${asignados.map(a=>`<option value="${a.uid}" ${asigDefault===a.uid?'selected':''}>${esc(a.name)}${a.lider?' (líder)':''}</option>`).join("")}</select>
        <div class="hint">${isNew?'Por defecto queda para vos (líder); después lo repartís.':'Cambiar acá mueve el cliente de cartera.'}</div></div>
      <div class="fld"><label>Tipo</label><select id="c_type" onchange="cTipo()">
        <option value="person" ${tipo!=='company'?'selected':''}>Persona</option><option value="company" ${tipo==='company'?'selected':''}>Empresa</option></select></div>
      <div class="fld"><label id="c_lblname">${tipo==='company'?'Razón social':'Apellido y nombre'} ${comp.has.name||isNew?'':'<span class="miss">falta</span>'}</label>
        <input id="c_name" value="${esc(c.name||'')}" placeholder="${tipo==='company'?'Ej: Farmacia del Sol S.R.L.':'Ej: Pérez, Juan'}">
        <div class="hint" id="c_hintname">${tipo==='company'?'Nombre tipo oración + sufijo (SRL, SAS…)':'Formato: Apellido, Nombre.'}</div></div>
      <div class="fld"><label>Rubro</label><select id="c_rubro"><option value="">— elegir rubro —</option>${RUBROS.map(r=>`<option value="${r.v}" ${rubroSel===r.v?'selected':''}>${esc(r.l)}</option>`).join("")}</select></div>
      <div class="fld"><label>Teléfono ${comp.has.tel||isNew?'':'<span class="miss">falta</span>'}</label>
        <input id="c_phone" value="${esc(c.phone||c.mobile||'')}" oninput="cPrevTel()" placeholder="0341 155033943">
        <div class="hint" id="c_prevtel">Área sin 0, celular sin 15. Se guarda formateado.</div></div>
      <div class="fld"><label>Email ${comp.has.email||isNew?'':'<span class="miss">falta</span>'}</label><input id="c_email" value="${esc(c.email||'')}" placeholder="nombre@dominio.com"></div>
      <div class="fld"><label>Dirección ${comp.has.street||isNew?'':'<span class="miss">falta</span>'}</label><input id="c_street" value="${esc(c.street||'')}" placeholder="San martín 1234"></div>
      <div class="fld2">
        <div class="fld"><label>Código postal ${comp.has.zip||isNew?'':'<span class="miss">falta</span>'}</label><input id="c_zip" value="${esc(c.zip||'')}" placeholder="2000"></div>
        <div class="fld"><label>Localidad ${comp.has.city||isNew?'':'<span class="miss">falta</span>'}</label><input id="c_city" value="${esc(c.city||'')}" placeholder="Rosario"></div>
      </div>
      <div class="fld"><label>Provincia ${comp.has.state||isNew?'':'<span class="miss">falta</span>'}</label><select id="c_state">${optSel(CT.cat.prov,c.state_id,'— provincia —')}</select></div>
      <div class="fld2">
        <div class="fld"><label>Tipo de doc ${comp.has.idtype||isNew?'':'<span class="miss">falta</span>'}</label><select id="c_idtype" onchange="cPrevDoc()">${optSel(CT.cat.idt,c.l10n_latam_identification_type_id,'— tipo —')}</select></div>
        <div class="fld"><label>Número ${comp.has.vat||isNew?'':'<span class="miss">falta</span>'}</label><input id="c_vat" value="${esc(c.vat||'')}" oninput="cPrevDoc()" placeholder="20-12345678-9"><div class="hint" id="c_prevdoc"></div></div>
      </div>
      <div class="fld"><label>Condición fiscal (AFIP) ${comp.has.fiscal||isNew?'':'<span class="miss">falta</span>'}</label><select id="c_fiscal">${optSel(CT.cat.fiscal,c.l10n_ar_afip_responsibility_type_id,'— condición —')}</select></div>
    </div>
    <div class="foot"><button class="cancel" onclick="cerrarDrawer()">Cancelar</button><button class="ok" id="c_save" onclick="guardarContacto()">${isNew?'Crear contacto':'Guardar ficha'}</button></div>`;
  d.classList.add("on"); document.getElementById("scrim").classList.add("on");
  cPrevTel(); cPrevDoc();
}
function cerrarDrawer(){ const d=document.getElementById("cdrawer"); if(d)d.classList.remove("on"); const s=document.getElementById("scrim"); if(s)s.classList.remove("on"); CT.edit=null; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape")cerrarDrawer(); });
function cTipo(){ const t=document.getElementById("c_type").value;
  document.getElementById("c_lblname").innerHTML=(t==='company'?'Razón social':'Apellido y nombre');
  document.getElementById("c_hintname").textContent=(t==='company'?'Nombre tipo oración + sufijo (SRL, SAS…)':'Formato: Apellido, Nombre.');
  document.getElementById("c_name").placeholder=(t==='company'?'Ej: Farmacia del Sol S.R.L.':'Ej: Pérez, Juan'); }
function cPrevTel(){ const v=document.getElementById("c_phone").value; const el=document.getElementById("c_prevtel"); if(el)el.textContent=v?('Se guardará: '+fmtTel(v)):'Área sin 0, celular sin 15.'; }
function cPrevDoc(){ const t=parseInt(document.getElementById("c_idtype").value||0,10); const v=document.getElementById("c_vat").value; const el=document.getElementById("c_prevdoc"); if(el)el.textContent=v?('→ '+fmtDoc(v,t)):''; }
async function guardarContacto(){
  if(!CT.edit)return; const btn=document.getElementById("c_save"); btn.disabled=true; btn.textContent="Guardando…";
  const val=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
  const num=id=>{const x=val(id);return x?parseInt(x,10):false;};
  const idtype=num("c_idtype"), owner=num("c_owner")||LIDER.uid;
  const vals={ company_type:val("c_type"), name:val("c_name"),
    phone: val("c_phone")?fmtTel(val("c_phone")):false, mobile:false,
    email: val("c_email")||false, street: val("c_street")?oracion(val("c_street")):false,
    zip: val("c_zip")||false, city: val("c_city")?oracion(val("c_city")):false,
    state_id: num("c_state"), l10n_latam_identification_type_id: idtype,
    vat: val("c_vat")?fmtDoc(val("c_vat"),idtype):false,
    l10n_ar_afip_responsibility_type_id: num("c_fiscal"), user_id: owner };
  const rubro=num("c_rubro"); if(rubro) vals.category_id=[[4,rubro]];
  if(!vals.name){ btn.disabled=false; btn.textContent=CT.edit.isNew?"Crear contacto":"Guardar ficha"; toast("⚠️ Falta el nombre"); return; }
  try{
    let id=CT.edit.id;
    if(CT.edit.isNew){ id=await EYG.rpc("res.partner","create",[vals]); }
    else { await EYG.rpc("res.partner","write",[[id],vals]); }
    const fresh=(await EYG.rpc("res.partner","read",[[id]],{fields:PFIELDS_C}))[0];
    const i=CT.list.findIndex(x=>x.id===id);
    if(i>=0) CT.list[i]=fresh; else CT.list.push(fresh);
    FICHAS_STALE=true;   // la cartera pudo cambiar
    cerrarDrawer();
    toast(CT.edit&&CT.edit.isNew?"🎉 Contacto creado ✓":"Ficha guardada ✓", true);
    renderContactos();
  }catch(e){ btn.disabled=false; btn.textContent=CT.edit&&CT.edit.isNew?"Crear contacto":"Guardar ficha"; toast("⚠️ No se pudo guardar: "+e.message); }
}
</script>
</body>
