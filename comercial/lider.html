<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del Líder · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<style>
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .l{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--gris);font-weight:700}
  .kpi .v{font-size:22px;font-weight:900;letter-spacing:-.5px;margin-top:3px}
  .kpi .s{font-size:11.5px;color:var(--gris2);margin-top:2px}
  .kpi.hoy{background:linear-gradient(145deg,var(--teal),var(--teal-deep));color:#fff} .kpi.hoy .l,.kpi.hoy .s{color:#d9f1ee}
  .kpi.period{cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;position:relative}
  .kpi.period:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(6,65,62,.13);border-color:var(--teal-med)}
  .kpi.period.sel{background:linear-gradient(145deg,var(--teal),var(--teal-deep));color:#fff;border-color:var(--teal)}
  .kpi.period.sel .l,.kpi.period.sel .s{color:#d9f1ee}
  .kpi.period .pick{position:absolute;top:10px;right:12px;font-size:11px;opacity:.55}
  .kpi.period.sel .pick{opacity:1}
  /* barras del gráfico por período */
  .chartbox .segs{display:inline-flex;gap:0;background:#EDF2F1;border-radius:9px;padding:3px;margin-left:auto}
  .chartbox .segs button{border:0;background:none;font-family:inherit;font-size:12px;font-weight:700;color:var(--gris);padding:5px 11px;border-radius:7px;cursor:pointer}
  .chartbox .segs button.on{background:var(--surface);color:var(--teal-deep);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  /* chart */
  .chartbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px 12px;box-shadow:var(--shadow);margin-bottom:22px}
  .chartbox .ch-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .chartbox h2{font-size:16px;font-weight:800}
  .chartbox .live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--teal-med)}
  .chartbox .live .dot{width:8px;height:8px;border-radius:50%;background:#22e0c6;box-shadow:0 0 8px #22e0c6;animation:liveblink 1.4s ease-in-out infinite}
  @keyframes liveblink{0%,100%{opacity:1;box-shadow:0 0 10px #22e0c6}50%{opacity:.4;box-shadow:0 0 2px #22e0c6}}
  .chartbox .ch-tot{font-size:22px;font-weight:900;color:var(--teal-deep)}
  svg .neon{animation:neondot 1.3s ease-in-out infinite}
  @keyframes neondot{0%,100%{r:5;opacity:1}50%{r:8;opacity:.75}}
  /* tabla comerciales */
  .tbl{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .tbl .row{display:grid;grid-template-columns:1.3fr repeat(4,1fr) 1.4fr;gap:10px;align-items:center;padding:13px 18px;border-top:1px solid var(--line)}
  .tbl .row.head{border-top:0;background:#F1F7F6;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--gris);font-weight:800}
  .tbl .row:hover:not(.head){background:#FAFDFC}
  .tbl .nm{font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:9px}
  .tbl .dotc{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .tbl .num{text-align:right;font-weight:700;font-size:14px} .tbl .num.hoy{color:var(--teal-deep);font-weight:900}
  .tbl .num .sub{display:block;font-size:10.5px;color:var(--gris2);font-weight:600}
  .tbl .spark{display:flex;align-items:flex-end;gap:2px;height:34px}
  .tbl .spark i{flex:1;background:var(--aqua);border-radius:2px 2px 0 0;min-height:2px;transition:height .5s}
  .tbl .spark i.now{background:var(--coral)}
  .tbl a.row{color:inherit;text-decoration:none}
  .muted{color:var(--gris2);font-size:12px}
  @media(max-width:720px){ .tbl .row{grid-template-columns:1.2fr 1fr 1fr;} .tbl .col-sem,.tbl .col-ano,.tbl .spark{display:none} }
  /* productos más vendidos */
  .prodsbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 20px;margin-bottom:22px}
  .prodsbox h2{font-size:16px;font-weight:800;margin-bottom:6px}
  .prow{display:grid;grid-template-columns:26px 1fr 92px 112px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
  .prow.h{border-top:0;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--gris2);font-weight:800}
  .prow .rk{font-weight:800;color:var(--teal-med);text-align:center}
  .prow .pn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow .pq{text-align:right;color:var(--gris);font-size:12.5px}
  .prow .pv{text-align:right;font-weight:800}
  /* ficha desplegable por comercial */
  .crow .row{cursor:pointer}
  .crow .ficha{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease;background:#F6FBFA;border-top:1px solid var(--line)}
  .crow.open .ficha{grid-template-rows:1fr}
  .crow .ficha>.fw{overflow:hidden}
  .fichin{padding:12px 20px 22px}
  .chev{color:var(--gris2);font-size:11px;transition:transform .25s;margin-left:4px} .crow.open .chev{transform:rotate(180deg)}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:4px 0 16px}
  .fstat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .fstat .l{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--gris);font-weight:700}
  .fstat .v{font-size:18px;font-weight:900;margin-top:2px;letter-spacing:-.3px} .fstat .s{font-size:11px;color:var(--gris2);margin-top:1px}
  .fsub{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--teal-med);margin:14px 0 8px}
  .prm{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;margin:7px 0 3px}
  .pb{height:6px;background:#EDF2F1;border-radius:4px;overflow:hidden} .pb>i{display:block;height:100%;border-radius:4px}
  .logros{display:flex;flex-wrap:wrap;gap:8px}
  .lg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:20px;border:1px solid var(--line)}
  .lg.on{background:linear-gradient(135deg,#FFF6E4,#fff);border-color:var(--gold);color:#8a6414} .lg.off{opacity:.45;filter:grayscale(.5)}
  .floading{padding:18px;text-align:center;color:var(--gris);font-size:13px}
  .fplink{display:inline-block;margin-top:14px;color:var(--teal);font-weight:800;font-size:13px;text-decoration:none}
  /* aviso de alcance + ventas + desglose + fuentes */
  .scopenote{background:#EFF6F5;border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--gris);margin-bottom:20px;line-height:1.45}
  .ventas{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
  .ventas .vhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .ventas .vt{font-size:13px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--teal-med)}
  .vinfo{border:1px solid var(--line);background:var(--surface);color:var(--teal-deep);font-family:inherit;font-size:12px;font-weight:700;border-radius:8px;padding:6px 11px;cursor:pointer}
  .vinfo:hover{background:#F0FAF8}
  .ventas .vmain{display:flex;align-items:center;gap:14px}
  .ventas .vcol{flex:1}
  .ventas .vlab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--gris)} .ventas .mut2{color:var(--gris2);font-weight:600}
  .ventas .vbig{font-size:27px;font-weight:900;letter-spacing:-.6px;color:var(--ink);line-height:1.1;margin:2px 0}
  .ventas .vbig2{font-size:20px;font-weight:800;letter-spacing:-.3px;color:var(--teal-deep);line-height:1.1;margin:2px 0}
  .ventas .vsrc{font-size:11px;color:var(--gris2);line-height:1.3}
  .ventas .vsep{color:var(--gris2);font-size:12px;font-weight:700;align-self:center}
  .desg{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
  .desgh{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--gris2);margin-bottom:5px}
  .drow2{display:flex;align-items:center;gap:10px;font-size:13px;padding:5px 0}
  .drow2 .dl{flex:1} .drow2 .dc{color:var(--gris2);font-size:11.5px} .drow2 .da{font-weight:800;font-variant-numeric:tabular-nums}
  .drow2.mut{color:var(--gris2)} .drow2.mut .da{font-weight:700}
  .drow2.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:8px;font-weight:800}
  .desgnote{font-size:11px;color:var(--gris2);line-height:1.5;margin-top:10px;background:#F7FAF9;border-radius:8px;padding:9px 11px}
  .desgnote code,.fuentes code{background:#E9F2F0;color:var(--teal-deep);border-radius:4px;padding:1px 5px;font-size:11px;font-family:ui-monospace,monospace}
  .fuentes{background:#F7FAF9;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:6px}
  .fuentes ul{list-style:none;display:grid;gap:8px} .fuentes li{font-size:12.5px;line-height:1.5;color:var(--gris)} .fuentes li b{color:var(--ink)}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:22px} @media(max-width:640px){.cols2{grid-template-columns:1fr}}
  /* ===== equipo: tarjetas seleccionables ===== */
  .eqhead{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;margin:2px 4px 12px}
  .eqhead h2{font-size:16px;font-weight:800}
  .eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:13px;margin-bottom:16px}
  .ec{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 16px 14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .13s,box-shadow .13s,border-color .13s;overflow:hidden}
  .ec:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(6,65,62,.14)}
  .ec.sel{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal),0 14px 32px rgba(6,65,62,.16)}
  .ec .accent{position:absolute;left:0;top:0;bottom:0;width:4px}
  .ec .ehead{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .ec .rank{width:24px;height:24px;border-radius:50%;background:#F1F7F6;color:var(--gris);font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ec .rank.m1{background:#FFF4D6;color:#9a6b00} .ec .rank.m2{background:#EEF1F4;color:#6b7684} .ec .rank.m3{background:#F7E6D8;color:#9a5a2a}
  .ec .who{flex:1;min-width:0} .ec .who .nm{font-weight:800;font-size:14.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ec .who .lv{font-size:11px;font-weight:700;color:var(--gris2);margin-top:1px}
  .ec .salud{width:38px;height:38px;flex-shrink:0}
  .ec .big{display:flex;align-items:baseline;gap:7px;margin-bottom:3px}
  .ec .big .v{font-size:21px;font-weight:900;letter-spacing:-.5px}
  .ec .big .trend{font-size:12px;font-weight:800}
  .ec .lbl{font-size:11px;color:var(--gris2);font-weight:600}
  .ec .prog{height:6px;background:#EDF2F1;border-radius:4px;overflow:hidden;margin:9px 0 3px} .ec .prog>i{display:block;height:100%;border-radius:4px;transition:width .5s}
  .ec .foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;gap:8px}
  .ec .foot .hoy{font-size:12px;color:var(--gris)} .ec .foot .hoy b{color:var(--teal-deep);font-weight:900;font-size:13.5px}
  .ec .metaline{font-size:11px;color:var(--gris2);margin-top:4px} .ec .metaline b{color:var(--ink)}
  .ec .wamini{font-size:11.5px;color:var(--gris);background:#F0FAF8;border:1px solid #D6EFEA;border-radius:8px;padding:5px 9px;margin:8px 0 2px} .ec .wamini b{color:var(--teal-deep)}
  .metabox{background:#F7FAF9;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.5;margin-bottom:8px}
  .metabox b{color:var(--ink)} .metabox .falta{color:var(--coral);font-weight:800} .metabox .ok{color:var(--teal);font-weight:800}
  .ec .spark{display:flex;align-items:flex-end;gap:1.5px;height:26px;flex:1;max-width:120px}
  .ec .spark i{flex:1;background:var(--aqua);border-radius:2px 2px 0 0;min-height:2px} .ec .spark i.now{background:var(--coral)}
  .ec .shim{color:var(--gris2);font-size:11px;display:inline-flex;align-items:center;gap:6px}
  .up{color:#1E7D46} .down{color:#C0554A}
  /* histórico: evolución por comercial */
  .hrow{display:grid;grid-template-columns:1.3fr 2fr 1fr .9fr;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
  .hrow.head{border-top:0;background:#F1F7F6;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--gris);font-weight:800}
  .hrow .nm{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}
  .hrow .num{text-align:right;font-weight:700;font-size:13.5px}
  .hspark{display:flex;align-items:flex-end;gap:3px;height:36px}
  .hspark i{flex:1;background:var(--aqua);border-radius:2px 2px 0 0;min-height:2px} .hspark i.pre{background:#cddedb} .hspark i.cur{background:var(--coral)}
  @media(max-width:620px){ .hrow{grid-template-columns:1.2fr 1.4fr .9fr} .hrow .col-va{display:none} }
  /* panel de detalle del comercial seleccionado */
  .det{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:0;margin-bottom:22px;overflow:hidden;animation:fadeup .35s both}
  .det .dtop{display:flex;align-items:center;gap:13px;padding:18px 22px;background:linear-gradient(135deg,var(--teal),var(--teal-deep));color:#fff}
  .det .dtop .av{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;flex-shrink:0}
  .det .dtop .nm{font-size:19px;font-weight:900} .det .dtop .sub{font-size:12.5px;color:#dbf3ef;margin-top:1px}
  .det .dtop .close{margin-left:auto;background:rgba(255,255,255,.16);border:0;color:#fff;width:34px;height:34px;border-radius:9px;font-size:16px;cursor:pointer}
  .det .dbody{padding:18px 22px 22px}
  .det .sec{font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--teal-med);margin:20px 0 11px} .det .sec:first-child{margin-top:0}
  /* barras comparativas */
  .cmp{display:grid;gap:11px}
  .cmprow .cl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px} .cmprow .cl b{font-weight:800}
  .cmprow .track{position:relative;height:16px;background:#EDF2F1;border-radius:8px;overflow:visible}
  .cmprow .fill{position:absolute;left:0;top:0;bottom:0;border-radius:8px;transition:width .5s}
  .cmprow .avg{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
  .cmprow .avg::after{content:attr(data-l);position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--gris);white-space:nowrap}
  /* fuertes / débiles / oportunidades */
  .sw{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media(max-width:640px){.sw{grid-template-columns:1fr}}
  .swbox{border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .swbox.good{background:#F1FAF5;border-color:#C9EBD8} .swbox.bad{background:#FEF4F1;border-color:#F6D9CF}
  .swbox h4{font-size:12.5px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .swbox ul{list-style:none;display:grid;gap:6px} .swbox li{font-size:12.5px;line-height:1.35;display:flex;gap:7px;align-items:flex-start}
  .swbox li .i{flex-shrink:0}
  .opps{display:grid;gap:9px}
  .opp{display:flex;gap:11px;background:linear-gradient(135deg,#FFFDF6,#FFF8E8);border:1px solid #F0E2BD;border-radius:12px;padding:12px 14px}
  .opp .ic{font-size:19px;flex-shrink:0} .opp .tx{font-size:13px;line-height:1.4} .opp .tx b{font-weight:800}
  .opp .gain{margin-left:auto;font-size:11px;font-weight:800;color:#9a6b00;white-space:nowrap;align-self:center}
  /* header del líder + tabs */
  .ldhead{display:flex;align-items:center;gap:14px;background:linear-gradient(140deg,var(--teal),var(--teal-deep));color:#fff;border-radius:16px;padding:16px 20px;margin-bottom:16px;box-shadow:0 10px 30px rgba(6,65,62,.2)}
  .ldhead .ic{font-size:30px}
  .ldhead .t{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#cdeeea;font-weight:800}
  .ldhead .n{font-size:20px;font-weight:900;letter-spacing:-.3px}
  .ldhead .sub{font-size:12.5px;color:#e7faf8;margin-top:1px}
  .ldhead .chg{margin-left:auto;background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:9px;padding:8px 13px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
  .ldhead .chg:hover{background:rgba(255,255,255,.28)}
  /* "Mis ventas" — la mitad propia del líder que TAMBIÉN vende. Es la misma
     familia visual que la mitad izquierda de la tarjeta partida de German y
     Diego en el Panel comerciales (comerciales.html): un líder que vende ve
     acá SU cartera y entra a su panel de venta; abajo sigue todo su equipo. */
  .mvcard{display:block;background:linear-gradient(145deg,var(--teal),var(--teal-deep));border:1px solid var(--teal-deep);border-radius:16px;padding:15px 20px 16px;margin-bottom:16px;box-shadow:0 10px 30px rgba(6,65,62,.2);color:#fff;text-decoration:none;transition:transform .13s,box-shadow .13s}
  .mvcard:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(6,65,62,.3)}
  .mvcard .mvtop{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .mvcard .mvic{font-size:22px}
  .mvcard .mvhd{font-size:15.5px;font-weight:900;letter-spacing:-.2px}
  .mvcard .mvsub{font-size:12px;color:#cdeeea;margin-top:1px}
  .mvcard .mvgo{margin-left:auto;background:var(--gold);color:#3a2c07;font-weight:800;font-size:12.5px;border-radius:9px;padding:8px 14px;white-space:nowrap}
  .mvcard .mvrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-top:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18)}
  .mvcard .mvk .l{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:#a9d8d3;font-weight:700}
  .mvcard .mvk .v{font-size:18px;font-weight:900;letter-spacing:-.4px;margin-top:2px}
  .mvcard .mvpend{margin-top:11px;font-size:12px;color:#eafcfa;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:9px;padding:8px 11px}
  .mvcard .mvpend b{color:#fff}
  .mvcard .mvload{font-size:12.5px;color:#cdeeea;margin-top:11px}
  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .tab{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 16px;font-family:inherit;font-size:14px;font-weight:700;color:var(--gris);cursor:pointer;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:7px}
  .tab.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  /* ---- barra de período: manda sobre toda la vista Rendimiento ---- */
  .perbar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:16px}
  .pchips{display:flex;gap:7px;flex-wrap:wrap}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const M=EYG.money, esc=EYG.esc;
const COLORS=["#048782","#EC8B5E","#0AA89F","#E5A93B","#5FC8BF","#B0413E","#6E8B86","#04635F"];
let COM=[], UIDS=[], DATA=[], TODAY=[], PRODS=[], FICHAS={}, chartTimer=null;
let PERFIL=null, LIDER=null;   // LIDER = {uid, name, empId, team:[{uid,name}]}
/* Período elegido: gobierna TODA la vista Rendimiento (KPIs, gráfico, tabla comparativa y
   desglose de ventas). Fechas ARGENTINAS inclusivas: {preset, desde, hasta, lbl}.
   EQ = métricas del equipo ya calculadas para ese rango. ORD = orden de la tabla. */
let RANGO=null, EQ=null, EQ_ERR=null, ORD={col:"vendido", dir:-1};
const MESES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const DIASSEM=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];

EYG.requireAuth(["lider","admin","direccion"], perfil=>{
  PERFIL=perfil;
  document.body.innerHTML = EYG.layout(perfil, "panel",
    '<div id="ld"><div class="loading"><div class="spinner"></div>Armando el tablero del equipo…</div></div>',
    "Panel del Líder");
  document.body.insertAdjacentHTML("beforeend",
    '<div class="scrim" id="scrim" onclick="cerrarDrawer()"></div><div class="cdrawer" id="cdrawer"></div><div class="toast" id="toast"></div>');
  // Campana de novedades en la barra superior (a la derecha), cerca del título/nombre.
  const mbar=document.querySelector(".mbar");
  if(mbar){ mbar.insertAdjacentHTML("beforeend",'<div id="bellSlot" style="margin-left:auto;display:flex;align-items:center;color:var(--ink)"></div>'); if(EYG.bellComunicaciones) EYG.bellComunicaciones("bellSlot", perfil); }
  boot();
});
let toastT;
function toast(msg, ok){ const t=document.getElementById("toast"); if(!t)return; t.textContent=msg; t.className="toast on"+(ok?" ok":""); clearTimeout(toastT); toastT=setTimeout(()=>t.className="toast",2600); }

/* El equipo de un líder sale del ORGANIGRAMA de Odoo (hr.employee.parent_id), pero SÓLO cuenta
   como comercial a los subordinados del departamento VENTAS que no son a su vez líderes (sin
   subordinados propios). Así el jefe de un área (ej. Germán) no toma a Facturación/Cobranzas/
   Finanzas ni a otro líder como "comerciales". Mismo criterio que el Panel comerciales. */
async function resolverLider(name){
  const u = await EYG.rpc("res.users","search_read",[[["name","=",name]]],{fields:["id","name"]});
  if(!u.length) throw new Error('No encontré al líder "'+name+'" en Odoo.');
  const emp = await EYG.rpc("hr.employee","search_read",[[["user_id","=",u[0].id]]],{fields:["id","name","child_ids"]});
  if(!emp.length) throw new Error("El líder no tiene ficha de empleado en Odoo (hace falta para leer su equipo).");
  const childIds = emp[0].child_ids||[];
  let team=[];
  if(childIds.length){
    const subs = await EYG.rpc("hr.employee","read",[childIds,["name","user_id","department_id","child_ids"]]);
    team = subs.filter(s=>s.user_id && s.department_id && /ventas/i.test(s.department_id[1]) && !(s.child_ids||[]).length)
               .map(s=>({uid:s.user_id[0], name:s.user_id[1]}));
  }
  return {uid:u[0].id, name:u[0].name, empId:emp[0].id, team};
}
/* Líderes = empleados con subordinados que tienen usuario. Para el selector de admin. */

async function boot(){
  const params=new URLSearchParams(location.search);
  const esLider = PERFIL.rol==="lider";
  // Un líder ve SÓLO su equipo (perfil.comercial_ref) y nunca a otros líderes.
  // Admin/dirección pueden elegir con ?lider=Nombre o con el selector.
  let liderName = esLider ? (PERFIL.comercial_ref||"") : (params.get("lider")||"");
  try{
    if(esLider){
      // un líder NUNCA ve el selector ni la existencia de otros líderes
      if(!liderName){ ldErr("Tu usuario de líder todavía no tiene configurado su comercial (falta <b>comercial_ref</b> en tu perfil). Avisá al administrador."); return; }
    } else if(!liderName){
      const lideres = await listarLideres();
      if(lideres.length===1) liderName=lideres[0].name;
      else if(lideres.length===0){ ldErr("No hay líderes definidos en el organigrama de Odoo todavía."); return; }
      else return selectorLider(lideres);
    }
    LIDER = await resolverLider(liderName);
    // Equipo en 0 (ej. Germán, todavía sin comerciales): NO es error, se muestra preparado en 0.
    COM = (LIDER.team||[]).map((c,i)=>({...c, color:COLORS[i%COLORS.length]}));
    UIDS = COM.map(c=>c.uid);
    init();
  }catch(e){ ldErr("No pude armar el equipo: "+esc(e.message)); }
}

function argToday(){ return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Argentina/Buenos_Aires"}).format(new Date()); }
function argParts(s){ const d=new Date(s.replace(" ","T")+"Z");
  const p=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Argentina/Buenos_Aires",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(d);
  const g={}; p.forEach(x=>g[x.type]=x.value); return {date:`${g.year}-${g.month}-${g.day}`, hour:+g.hour, frac:(+g.hour)+(+g.minute)/60}; }
function nowFrac(){ const p=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Argentina/Buenos_Aires",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()); const g={}; p.forEach(x=>g[x.type]=x.value); return (+g.hour)+(+g.minute)/60; }
// Monto ABREVIADO para las tarjetas (millones → "$X,X M") para que no se desborden.
function Mabbr(n){ n=Math.round(n||0); if(Math.abs(n)>=1e6) return "$"+(n/1e6).toLocaleString("es-AR",{minimumFractionDigits:1,maximumFractionDigits:1})+" M"; return "$"+n.toLocaleString("es-AR"); }
async function init(){
  try{
    // COM y UIDS ya vienen resueltos por boot() con el equipo del líder (organigrama Odoo).
    RANGO=rangoPreset("mes");            // el panel abre en el mes en curso
    DATA=COM.map(c=>({...c, hoy:0, horas:new Array(24).fill(0)}));   // pulso de HOY (para el gráfico en vivo y la presencia)
    await refreshHoy();
    render();
    cargarRango();                       // métricas del período: 3 consultas para TODO el equipo
    cargarComisiones();                  // comisión del mes (cierre congelado o estimación en vivo)
    cargarMisVentas();   // banda "Mis ventas" del líder que vende (async, no bloquea el equipo)
    chartTimer=setInterval(tick, 180000);   // 180s (era 60s): menos carga recurrente sobre Odoo
    if(UIDS.length){        // sin comerciales (ej. Germán): panel preparado en 0, sin cargas por-comercial
      cargarVentasEq();     // ventas del equipo con consultas propias (rápido, no espera a las fichas)
      cargarFichas();       // análisis por comercial (nivel/salud/comparativas) en segundo plano
      cargarProductos();
      cargarPresencia();    // conectados X/X en la vista principal (async, no bloquea)
    }
  }catch(e){ const el=document.getElementById("ld"); if(el) el.innerHTML='<div class="errbox">No pude cargar el tablero: '+esc(e.message)+'</div>'; }
}
async function refreshHoy(){
  const desde=new Date(Date.now()-30*3600*1000).toISOString().slice(0,10)+" 00:00:00";
  const ord=await EYG.rpc("sale.order","search_read",[[["user_id","in",UIDS],["state","in",["sale","done"]],["date_order",">=",desde]],["user_id","date_order","amount_total"]],{limit:0});
  const t=argToday();
  TODAY=ord.map(o=>({uid:o.user_id&&o.user_id[0], amt:o.amount_total||0, ...argParts(o.date_order)})).filter(o=>o.date===t);
  const byU={}; DATA.forEach(d=>{d.hoy=0; d.horas=new Array(24).fill(0); byU[d.uid]=d;});
  for(const o of TODAY){ const d=byU[o.uid]; if(d){ d.hoy+=o.amt; d.horas[o.hour]+=o.amt; } }
}
function tick(){ if(typeof document!=="undefined" && document.hidden) return;   // pestaña oculta: no consultar
  refreshHoy().then(()=>{ renderKpis(); renderChart(); renderEquipo(); }).catch(()=>{}); cargarPresencia();
  if(RANGO && RANGO.hasta===argToday()) cargarRango(true);   // el período llega hasta hoy: lo actualizo en silencio
}

/* Presencia del equipo (heartbeat en la tabla eyg_presencia de Supabase; antes vivía en
   ir.config_parameter de Odoo y era el ~21% del trafico del Core). Se carga async, no bloquea el panel.
   La usa la vista principal (conectados X/X) y la pestaña Actividad. */
let PRES=null;
function presOnline(){ if(!PRES) return null; const now=Date.now(), hoy=argToday();
  return UIDS.filter(uid=>{ const p=PRES[uid]||{}; return p.online && p.dia===hoy && (now-new Date(p.online).getTime())<4*60000; }); }
async function cargarPresencia(){
  try{
    // El latido dejó de vivir en Odoo (era el ~21% del tráfico del Core, solo
    // para guardar quién está conectado). Ahora sale de Supabase: 1 query, y
    // sin ocupar un worker de Odoo. El objeto guardado es el mismo de antes.
    const {data}=await EYG.supa().from("eyg_presencia").select("uid,estado").in("uid",UIDS);
    const porUid={}; (data||[]).forEach(r=>{ porUid[r.uid]=r.estado||{}; });
    const m={}; UIDS.forEach(uid=>{ m[uid]=porUid[uid]||{}; }); PRES=m;
    renderKpis(); if(VISTA==="actividad" && ACT_LIDER) renderActividadLider();
  }catch(e){}
}

/* ===== "Mis ventas": la mitad propia del líder que además vende ==============
   Un líder que vende (German, Diego y ahora Marcela) necesita las dos cosas en
   la misma pantalla: SU cartera y la de su equipo. Esta banda es la mitad
   "🛒 Mis ventas" de la tarjeta partida del Panel comerciales, con los MISMOS
   números y el mismo criterio (cruce al vendedor del pedido; el 452 es el
   vendedor genérico, ahí manda el dueño del cliente). Se carga en segundo
   plano: si Odoo tarda, el panel del equipo ya está en pantalla. */
let MIO=null;
async function cargarMisVentas(){
  try{
    const u=LIDER.uid, hoy=argToday(), inicioMes=hoy.slice(0,8)+"01";
    const facDom=mt=>[["parent_state","=","posted"],["move_id.move_type","=",mt],["date",">=",inicioMes],
      "|",["sale_line_ids.order_id.user_id","=",u],
          "&",["sale_line_ids.order_id.user_id","=",452],["sale_line_ids.order_id.partner_id.user_id","=",u]];
    const deudaDom=[["account_id.account_type","=","asset_receivable"],["parent_state","=","posted"],["full_reconcile_id","=",false],
      "|",["move_id.invoice_line_ids.sale_line_ids.order_id.user_id","=",u],
          "&",["move_id.invoice_line_ids.sale_line_ids.order_id.user_id","=",452],["move_id.invoice_line_ids.sale_line_ids.order_id.partner_id.user_id","=",u]];
    const parts=await EYG.rpc("res.partner","search_read",[[["user_id","=",u],["customer_rank",">",0]]],{fields:["id"],limit:0});
    const ids=parts.map(p=>p.id);
    const [fi,fr,deu,cobG,hoyG]=await Promise.all([
      EYG.rpc("account.move.line","read_group",[facDom("out_invoice"),["price_total:sum"],[]],{lazy:false}).catch(()=>[]),
      EYG.rpc("account.move.line","read_group",[facDom("out_refund"),["price_total:sum"],[]],{lazy:false}).catch(()=>[]),
      EYG.rpc("account.move.line","search_read",[deudaDom],{fields:["amount_residual","date_maturity"],limit:0}).catch(()=>[]),
      ids.length?EYG.rpc("account.payment","read_group",[[["partner_id","in",ids],["payment_type","=","inbound"],["state","=","posted"],["date",">=",inicioMes]],["amount:sum"],[]],{lazy:false}).catch(()=>[]):[],
      EYG.rpc("sale.order","read_group",[[["user_id","=",u],["state","in",["sale","done"]],["date_order",">=",hoy+" 00:00:00"]],["amount_total:sum"],[]],{lazy:false}).catch(()=>[]),
    ]);
    let deuda=0, venc=0;
    for(const l of (deu||[])){ const r=l.amount_residual||0; if(r>0){ deuda+=r; if(l.date_maturity && l.date_maturity<hoy) venc+=r; } }
    MIO={ fact:((fi[0]&&fi[0].price_total)||0)-((fr[0]&&fr[0].price_total)||0),
          cob:(cobG[0]&&cobG[0].amount)||0, cartera:ids.length, deuda, venc,
          vencPct:deuda>0?Math.round(venc/deuda*100):0, hoy:(hoyG[0]&&hoyG[0].amount_total)||0 };
  }catch(e){ MIO={err:e.message||"no pude leer tus ventas"}; }
  renderMisVentas();
}
function renderMisVentas(){
  const box=document.getElementById("misventas"); if(!box || !LIDER) return;
  const nrm=s=>(s||"").toString().trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  /* ¿Es SU propio panel? Comparamos sin acentos ni mayúsculas, y aceptamos que el perfil
     traiga sólo el nombre de pila ("Diego" vs "Diego Velazquez"): si no, a German y a Diego,
     que entran acá desde el Panel comerciales, les diría "sus ventas" en vez de "mis ventas". */
  const yo=nrm(PERFIL && (PERFIL.comercial_ref||PERFIL.nombre)), el=nrm(LIDER.name);
  const propio = !!yo && (yo===el || el.startsWith(yo+" ") || yo.startsWith(el+" "));
  const nom1 = esc((LIDER.name||"").split(" ")[0]);
  const url = "panel.html?c="+encodeURIComponent(LIDER.name);
  const tit = propio ? "Mis ventas" : "Ventas propias de "+nom1;

                     : "La cartera propia de "+nom1+", aparte de la de su equipo.";
  const cta = propio ? "Abrir mi panel de venta →" : "Abrir su panel de venta →";
  const top = `<div class="mvtop"><span class="mvic">🛒</span>
      <div><div class="mvhd">${tit}</div><div class="mvsub">${sub}</div></div>
      <span class="mvgo">${cta}</span></div>`;
  let cuerpo;
  if(!MIO)          cuerpo = `<div class="mvload">cargando tus números…</div>`;
  else if(MIO.err)  cuerpo = `<div class="mvload">No pude leer estas ventas ahora (${esc(MIO.err)}). Entrá igual al panel de venta.</div>`;
  else{
    const vcol = MIO.vencPct>=40 ? "#FFB49A" : MIO.vencPct>=25 ? "var(--gold)" : "#fff";
    const k=(l,v,color)=>`<div class="mvk"><div class="l">${l}</div><div class="v"${color?` style="color:${color}"`:""}>${v}</div></div>`;
    cuerpo = `<div class="mvrow">
      ${k("Facturado del mes", Mabbr(MIO.fact))}
      ${k("Cobrado", Mabbr(MIO.cob))}
      ${k("Clientes", MIO.cartera.toLocaleString("es-AR"))}
      ${k("Vencido", Mabbr(MIO.venc)+" · "+MIO.vencPct+"%", vcol)}
      ${k("Hoy", Mabbr(MIO.hoy))}
    </div>
    <div class="mvpend" title="El motor de comisiones calcula el esquema de los COMERCIALES. Para los líderes todavía no hay uno definido.">📌 Tu comisión como líder está <b>a definir</b> — el esquema todavía no existe.</div>`;
  }
  box.innerHTML = `<a class="mvcard" href="${url}">${top}${cuerpo}</a>`;
}

/* ═══════════════ PERÍODO ═══════════════════════════════════════════════════
   Un solo selector manda sobre toda la vista Rendimiento. Los atajos son los que se
   piden en la práctica; "Personalizado" abre dos fechas para cualquier rango.        */
function ymd(d){ return d.toISOString().slice(0,10); }
function sumaDias(f,n){ const d=new Date(f+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return ymd(d); }
function ultDiaMes(f){ const [y,m]=f.split("-").map(Number); return y+"-"+String(m).padStart(2,"0")+"-"+String(new Date(y,m,0).getDate()).padStart(2,"0"); }
function lunesDe(f){ const d=new Date(f+"T12:00:00Z"); const dow=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-dow); return ymd(d); }
function rangoPreset(p){
  const t=argToday(), mo=t.slice(0,7);
  if(p==="hoy")  return {preset:p, desde:t, hasta:t, lbl:"hoy"};
  if(p==="ayer"){ const a=sumaDias(t,-1); return {preset:p, desde:a, hasta:a, lbl:"ayer"}; }
  if(p==="sem")  return {preset:p, desde:lunesDe(t), hasta:t, lbl:"esta semana"};
  if(p==="sem7") return {preset:p, desde:sumaDias(t,-6), hasta:t, lbl:"los últimos 7 días"};
  if(p==="mesant"){ const pm=sumaDias(mo+"-01",-1).slice(0,7)+"-01"; return {preset:p, desde:pm, hasta:ultDiaMes(pm), lbl:"el mes pasado"}; }
  if(p==="ano")  return {preset:p, desde:t.slice(0,4)+"-01-01", hasta:t.slice(0,4)+"-12-31", lbl:"este año"};
  return {preset:"mes", desde:mo+"-01", hasta:ultDiaMes(mo+"-01"), lbl:"este mes"};
}
/* ¿El rango es exactamente UN MES CALENDARIO? La comisión sólo tiene sentido así:
   el nivel y la salud del comercial se calculan sobre el mes entero. */
function mesDelRango(r){
  if(!r) return null;
  const m=r.desde.slice(0,7);
  return (r.desde===m+"-01" && r.hasta===ultDiaMes(r.desde)) ? m : null;
}
function diasRango(r){ return Math.round((new Date(r.hasta+"T12:00:00Z")-new Date(r.desde+"T12:00:00Z"))/86400000)+1; }
function fechaCorta(f){ const p=f.split("-"); return (+p[2])+" "+MESES[(+p[1])-1].toLowerCase(); }
function rangoTxt(r){
  if(r.desde===r.hasta) return fechaCorta(r.desde)+" de "+r.desde.slice(0,4);
  return "del "+fechaCorta(r.desde)+" al "+fechaCorta(r.hasta)+" de "+r.hasta.slice(0,4);
}

/* ═══════════════ MÉTRICAS DEL EQUIPO PARA EL RANGO ═════════════════════════
   UNA sola consulta de pedidos trae todo lo que se puede sacar de ventas (monto,
   cantidad, clientes distintos, ticket promedio y la serie del gráfico) para los N
   comerciales juntos, y se bucketea por FECHA ARGENTINA — no por UTC, que corría
   los días. Antes cada tarjeta pedía ~10 consultas POR COMERCIAL; ahora son 3 para
   todo el equipo. El vencido y la comisión NO salen de acá: son del mes y llegan
   con las fichas (ver cargarFichas). */
async function cargarRango(silencioso){
  const R=RANGO;
  if(!UIDS.length){ EQ={byUid:{},tot:{vendido:0,ped:0,cli:0,nuevos:0,cob:0,ticket:0,margen:null},serie:[],granul:"dia"}; renderRango(); return; }
  if(!silencioso){ EQ=null; EQ_ERR=null; renderRango(); }
  const desdeUTC=new Date(new Date(R.desde+"T00:00:00-03:00").getTime()-6*3600e3).toISOString().slice(0,19).replace("T"," ");
  const hastaUTC=new Date(new Date(R.hasta+"T23:59:59-03:00").getTime()+6*3600e3).toISOString().slice(0,19).replace("T"," ");
  const domPed=[["user_id","in",UIDS],["state","in",["sale","done"]],["date_order",">=",desdeUTC],["date_order","<=",hastaUTC]];
  try{
    // 'margin' lo agrega el módulo de márgenes de Odoo. Si no estuviera, reintento sin él
    // y la columna Margen queda en "—" en vez de tumbar toda la pantalla.
    let ords, conMargen=true;
    const F=["user_id","partner_id","date_order","amount_total","amount_untaxed"];
    try{ ords=await EYG.rpc("sale.order","search_read",[domPed],{fields:F.concat(["margin"]),limit:0}); }
    catch(e){ conMargen=false; ords=await EYG.rpc("sale.order","search_read",[domPed],{fields:F,limit:0}); }
    ords=ords.map(function(o){ const p=argParts(o.date_order); return Object.assign({},o,{_d:p.date,_h:p.hour}); })
             .filter(function(o){ return o._d>=R.desde && o._d<=R.hasta; });   // la ventana UTC trae de más a propósito

    const res = await Promise.all([
      EYG.rpc("res.partner","read_group",[[["user_id","in",UIDS],["customer_rank",">",0],["create_date",">=",R.desde+" 00:00:00"],["create_date","<=",R.hasta+" 23:59:59"]],["id"],["user_id"]],{lazy:false}).catch(()=>[]),
      cobradoDelRango(R).catch(()=>({})),
    ]);
    const nuevosG=res[0], cobG=res[1];

    const byUid={}; UIDS.forEach(u=>{ byUid[u]={vendido:0,ped:0,cliSet:new Set(),nuevos:0,cob:cobG[u]||0,margenD:0,baseD:0}; });
    for(const o of ords){ const u=o.user_id&&o.user_id[0]; const b=byUid[u]; if(!b)continue;
      b.vendido+=o.amount_total||0; b.ped++; if(o.partner_id) b.cliSet.add(o.partner_id[0]);
      b.margenD+=o.margin||0; b.baseD+=o.amount_untaxed||0; }
    for(const g of nuevosG){ const u=g.user_id&&g.user_id[0]; if(u!=null&&byUid[u]) byUid[u].nuevos=g.__count||0; }
    const cliByUid={}; UIDS.forEach(u=>{ cliByUid[u]=byUid[u].cliSet; });   // para comparar contra el período anterior
    UIDS.forEach(u=>{ const b=byUid[u]; b.cli=b.cliSet.size; delete b.cliSet;
      b.ticket=b.ped?b.vendido/b.ped:0; b.margen=(conMargen&&b.baseD>0)?(b.margenD/b.baseD*100):null; });

    const tot={vendido:0,ped:0,nuevos:0,cob:0,margenD:0,baseD:0};
    UIDS.forEach(u=>{ const b=byUid[u]; tot.vendido+=b.vendido; tot.ped+=b.ped; tot.nuevos+=b.nuevos; tot.cob+=b.cob; tot.margenD+=b.margenD; tot.baseD+=b.baseD; });
    tot.cli=new Set(ords.map(o=>o.partner_id&&o.partner_id[0]).filter(Boolean)).size;   // sin contar dos veces al cliente que le compró a dos
    tot.ticket=tot.ped?tot.vendido/tot.ped:0;
    tot.margen=(conMargen&&tot.baseD>0)?(tot.margenD/tot.baseD*100):null;

    const s=serieDe(ords,R);
    // mapa de calor día de la semana × hora, de los mismos pedidos ya traídos
    const heat=[0,1,2,3,4,5,6].map(()=>new Array(24).fill(0));
    for(const o of ords){ const dd=new Date(o._d+"T12:00:00Z"); heat[(dd.getUTCDay()+6)%7][o._h]+=o.amount_total||0; }
    const cliAll=new Set(ords.map(o=>o.partner_id&&o.partner_id[0]).filter(Boolean));
    EQ={byUid:byUid, tot:tot, conMargen:conMargen, serie:s.serie, serieTicket:s.serieTicket, granul:s.granul,
        heat:heat, cliByUid:cliByUid, cliAll:cliAll, prev:null};
    // el período anterior llega después: no vale la pena hacer esperar a todo lo demás
    cargarPrevio(R).then(p=>{ if(EQ&&RANGO===R){ EQ.prev=p; renderKpis(); renderEquipo(); renderGraficos(); } }).catch(()=>{});
    EQ_ERR=null;
  }catch(e){ EQ_ERR=e.message||"no pude leer las ventas del período"; EQ=null; }
  renderRango();
}
/* Cobrado del rango: pagos entrantes sobre la cartera del equipo, atribuidos al DUEÑO
   del cliente (mismo criterio que el Panel comerciales). La cartera se consulta una vez. */
let CART_DUENO=null;
async function cobradoDelRango(R){
  if(!CART_DUENO){
    const parts=await EYG.rpc("res.partner","search_read",[[["user_id","in",UIDS],["customer_rank",">",0]]],{fields:["id","user_id"],limit:0});
    CART_DUENO={}; parts.forEach(p=>{ if(p.user_id) CART_DUENO[p.id]=p.user_id[0]; });
  }
  const ids=Object.keys(CART_DUENO).map(Number);
  if(!ids.length) return {};
  const g=await EYG.rpc("account.payment","read_group",[[["partner_id","in",ids],["payment_type","=","inbound"],["state","=","posted"],["date",">=",R.desde],["date","<=",R.hasta]],["amount:sum"],["partner_id"]],{lazy:false});
  const m={}; for(const r of g){ const u=CART_DUENO[r.partner_id&&r.partner_id[0]]; if(u!=null) m[u]=(m[u]||0)+(r.amount||0); }
  return m;
}
/* Serie del gráfico: la granularidad la decide el largo del rango (hora / día / mes). */
function serieDe(ords,R){
  // devuelve la serie de MONTO y, en paralelo, la de TICKET PROMEDIO (monto/pedidos)
  const dias=diasRango(R), t=argToday();
  const cnt={}, hcnt=new Array(24).fill(0);
  ords.forEach(o=>{ cnt[o._d]=(cnt[o._d]||0)+1; hcnt[o._h]++; });
  if(dias===1){
    const m=new Array(24).fill(0); ords.forEach(o=>{ m[o._h]=(m[o._h]||0)+(o.amount_total||0); });
    const arr=[]; const curH=Math.floor(nowFrac());
    const tk=[];
    for(let h=7;h<=21;h++){ arr.push({label:h+"h", val:m[h]||0, cur:R.hasta===t&&h===curH});
      tk.push({label:h+"h", val:hcnt[h]?(m[h]||0)/hcnt[h]:0, cur:R.hasta===t&&h===curH}); }
    return {serie:arr, serieTicket:tk, granul:"hora"};
  }
  if(dias<=62){
    const m={}; ords.forEach(o=>{ m[o._d]=(m[o._d]||0)+(o.amount_total||0); });
    const arr=[], tk=[];
    for(let f=R.desde; f<=R.hasta; f=sumaDias(f,1)){
      const dd=new Date(f+"T12:00:00Z"); const wd=(dd.getUTCDay()+6)%7;
      const lb=(dias<=14?DIASSEM[wd]+" ":"")+(+f.slice(8,10));
      arr.push({label:lb, val:m[f]||0, cur:f===t});
      tk.push({label:lb, val:cnt[f]?(m[f]||0)/cnt[f]:0, cur:f===t});
    }
    return {serie:arr, serieTicket:tk, granul:"dia"};
  }
  const m={}, mc={}; ords.forEach(o=>{ const k=o._d.slice(0,7); m[k]=(m[k]||0)+(o.amount_total||0); mc[k]=(mc[k]||0)+1; });
  const arr=[], tk=[], moHoy=t.slice(0,7);
  for(let f=R.desde.slice(0,7)+"-01"; f<=R.hasta; f=sumaDias(ultDiaMes(f),1)){
    const k=f.slice(0,7), lb=MESES[(+k.slice(5,7))-1];
    arr.push({label:lb, val:m[k]||0, cur:k===moHoy});
    tk.push({label:lb, val:mc[k]?(m[k]||0)/mc[k]:0, cur:k===moHoy});
  }
  return {serie:arr, serieTicket:tk, granul:"mes"};
}

/* ═══════════════ GRÁFICO DEL PERÍODO ═══════════════════════════════════════ */
// gráfico de barras (semana/mes/año). viewBox normal para que las etiquetas no se deformen.
function barChart(series){
  const W=1000,H=230,PADB=28,PADT=12,PADL=6; const n=series.length||1;
  const max=Math.max(...series.map(s=>s.val),1);
  const bw=(W-PADL*2)/n; const gap=n>20?1.5:n>12?2.5:6;
  const bars=series.map((s,i)=>{ const h=(s.val/max)*(H-PADB-PADT); const x=PADL+i*bw+gap/2, yy=H-PADB-h, w=Math.max(1,bw-gap);
    const fill=s.cur?'var(--coral)':s.pre?'#cddedb':'url(#gb)';
    return `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="${Math.min(3,w/2).toFixed(1)}" fill="${fill}"><title>${esc(s.label)}: ${M(s.val)}</title></rect>`; }).join("");
  const step=n>24?Math.ceil(n/15):1;
  const labels=series.map((s,i)=>{ if(i%step!==0 && !s.cur) return ""; const x=PADL+i*bw+bw/2;
    return `<text x="${x.toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="12" fill="${s.cur?'var(--coral)':'#9AAcA8'}" font-weight="${s.cur?800:500}">${esc(s.label)}</text>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin-top:6px">
    <defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0AA89F"/><stop offset="1" stop-color="#7ad5cc"/></linearGradient></defs>
    ${bars}${labels}</svg>`;
}
function chartHoy(){
  const orders=TODAY.slice().sort((a,b)=>a.frac-b.frac);
  const x0=7, x1=21; const W=1000, H=210, PADB=22;
  let cum=0; const pts=[[x0,0]];
  for(const o of orders){ cum+=o.amt; pts.push([Math.max(x0,Math.min(x1,o.frac)), cum]); }
  const nf=Math.max(x0,Math.min(x1,nowFrac())); pts.push([nf,cum]);
  const maxY=Math.max(cum,1);
  const X=f=>((f-x0)/(x1-x0))*W;
  const Y=v=>H-PADB-(v/maxY)*(H-PADB-8);
  const line=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
  const area=line+` L ${X(nf).toFixed(1)} ${H-PADB} L ${X(x0).toFixed(1)} ${H-PADB} Z`;
  const lastX=X(nf), lastY=Y(cum);
  const ticks=[]; for(let h=x0;h<=x1;h+=2){ ticks.push(`<text x="${X(h).toFixed(0)}" y="${H-6}" fill="#9AAcA8" font-size="11" text-anchor="middle">${h}h</text><line x1="${X(h)}" y1="0" x2="${X(h)}" y2="${H-PADB}" stroke="#EEF4F3"/>`); }
  return { tot:cum, totLbl:"acumulado del día", live:true,
    svg:`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:210px;display:block;margin-top:6px">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0AA89F" stop-opacity=".28"/><stop offset="1" stop-color="#0AA89F" stop-opacity="0"/></linearGradient></defs>
      ${ticks.join("")}
      <path d="${area}" fill="url(#g)"/>
      <path d="${line}" fill="none" stroke="#048782" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="9" fill="#22e0c6" opacity=".25"/>
      <circle class="neon" cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="5" fill="#22e0c6" style="filter:drop-shadow(0 0 6px #22e0c6)"/>
    </svg>` };
}

const GRAN_TIT={hora:"Ventas del día · por hora", dia:"Ventas del período · por día", mes:"Ventas del período · por mes"};

  const box=document.getElementById("chart"); if(!box||!RANGO)return;
  const hoyVivo = RANGO.desde===RANGO.hasta && RANGO.hasta===argToday();

  else { total=EQ.serie.reduce((a,b)=>a+b.val,0); svg=barChart(EQ.serie); tit=GRAN_TIT[EQ.granul]; }

    + svg +'</div>';
}

/* Prepara, una sola vez, los ids de producto de las ofertas vigentes y el partner de

async function prepOfertasLider(){

    let sync=(JSON.parse(syncR||"[]")||[]).filter(o=>o&&o.id&&!o.pausada&&o.tipo==="p"&&(!o.hasta||o.hasta>=hoy)).filter(o=>{const m=/^opo_(\d+)$/.exec(o.id||"");return !(m&&propiaPids.has(+m[1]));});

    const sent=notes.map(n=>(n.body||"").replace(/<[^>]+>/g,""));

    await mapLimit(OF,3,async o=>{
      const desdeTS=(o.desde&&o.desde.length>10)?o.desde:((o.desde||o.hasta||"2000-01-01").slice(0,10)+" 00:00:00");
      const hasta=(o.hasta||hoy).slice(0,10);

      o.sold={}; o.monto={};

        g.forEach(x=>{const uid=P2UID[x.order_partner_id[0]];if(uid){o.sold[uid]=(o.sold[uid]||0)+1;o.monto[uid]=(o.monto[uid]||0)+(x.price_subtotal||0);}}); }catch(e){}

/* ===== Pieza 2: Actividad y presencia del equipo =====
   Presencia: lee la tabla eyg_presencia de Supabase (heartbeat del panel del comercial).
   Actividad de hoy: contactos [EyGWA], ofertas [EyGOFENV] y altas de contacto, con hora. */
let ACT_LIDER=null;
function horaAR(s){ if(s==null||s==="") return ""; const d=(typeof s==="number")?new Date(s):new Date(String(s).includes("T")?s:(String(s).replace(" ","T")+"Z")); return new Intl.DateTimeFormat("es-AR",{timeZone:"America/Argentina/Buenos_Aires",hour:"2-digit",minute:"2-digit",hour12:false}).format(d); }
function durTxt(min){ min=Math.round(min); if(min<1) return "0 min"; const h=Math.floor(min/60), m=min%60; return h?(h+"h"+(m?" "+m+"m":"")):(m+" min"); }
async function cargarActividadLider(){
  const box=document.getElementById("actLider");
  try{
    const hoy=argToday(), ini=hoy+" 00:00:00";
    if(!PRES) cargarPresencia();   // presencia compartida con la vista principal (no la re-pide acá)
    const [users,cart]=await Promise.all([
      EYG.rpc("res.users","read",[UIDS,["partner_id","name"]]).catch(()=>[]),
      EYG.rpc("res.partner","search_read",[[["user_id","in",UIDS]]],{fields:["user_id"],limit:0}).catch(()=>[]),
    ]);
    const uidName={}, PART={}, partUid={}, nameToUid={};
    users.forEach(u=>{ uidName[u.id]=u.name; nameToUid[u.name]=u.id; if(u.partner_id)PART[u.id]=u.partner_id[0]; });
    cart.forEach(p=>{ if(p.user_id) partUid[p.id]=p.user_id[0]; });
    const cartIds=cart.map(p=>p.id), partIds=Object.values(PART);
    const [wa,ofe,altas]=await Promise.all([
      cartIds.length?EYG.rpc("mail.message","search_read",[[["model","=","res.partner"],["res_id","in",cartIds],["date",">=",ini],"|",["body","like","EyGWA"],["body","like","EyGCRM"]]],{fields:["res_id","date","body"],limit:0}).catch(()=>[]):[],
      partIds.length?EYG.rpc("mail.message","search_read",[[["model","=","res.partner"],["res_id","in",partIds],["date",">=",ini],["body","like","EyGOFENV"]]],{fields:["res_id","date","body"],limit:0}).catch(()=>[]):[],
      EYG.rpc("res.partner","search_read",[[["user_id","in",UIDS],["create_date",">=",ini]]],{fields:["name","user_id","create_date"],limit:0}).catch(()=>[]),
    ]);
    const cliIds=[...new Set(wa.map(w=>w.res_id))]; let cliName={};
    if(cliIds.length){ const cs=await EYG.rpc("res.partner","read",[cliIds,["name"]]).catch(()=>[]); cs.forEach(c=>cliName[c.id]=c.name); }
    const ev={}; UIDS.forEach(u=>ev[u]=[]);
    for(const w of wa){ const b=(w.body||"").replace(/<[^>]+>/g,""); const m=b.match(/por\s+(.+?)\s*$/); const uid=(m&&nameToUid[m[1].trim()])||partUid[w.res_id]; if(!uid||!ev[uid])continue; const camp=/campana/.test(b); ev[uid].push({t:w.date, ic:"📤", tx:(camp?"Mensaje WA a ":"Contactó a ")+(cliName[w.res_id]||"un cliente")}); }
    for(const o of ofe){ const b=(o.body||"").replace(/<[^>]+>/g,""); const m=b.match(/\[EyGOFENV\]\s*(.+?)\s*·\s*(.+)$/); const uid=m&&nameToUid[m[1].trim()]; if(!uid||!ev[uid])continue; ev[uid].push({t:o.date, ic:"🎁", tx:"Compartió: "+String(m?m[2]:"oferta").slice(0,44)}); }
    for(const a of altas){ const uid=a.user_id&&a.user_id[0]; if(!uid||!ev[uid])continue; ev[uid].push({t:a.create_date, ic:"➕", tx:"Creó contacto "+(a.name||"")}); }
    Object.values(ev).forEach(list=>list.sort((x,y)=>String(x.t).localeCompare(String(y.t))));
    ACT_LIDER={uidName, ev};
    renderActividadLider();
  }catch(e){ if(box) box.innerHTML='<div class="scopenote">No pude cargar la actividad. '+esc(e.message||"")+'</div>'; }
}
function renderActividadLider(){
  const box=document.getElementById("actLider"); if(!box) return;
  if(!ACT_LIDER){ box.innerHTML='<div class="floading" style="padding:26px;text-align:center;color:var(--gris)"><span class="spin-sm"></span> cargando presencia y actividad del equipo…</div>'; return; }

  const toMs=s=>{ if(s==null) return NaN; if(typeof s==="number") return s; return new Date(String(s).includes("T")?s:(String(s).replace(" ","T")+"Z")).getTime(); };
  const info=UIDS.map(uid=>{
    const p=presencia[uid]||{}; const bandas=(p.dia===hoy&&Array.isArray(p.bandas))?p.bandas:[];
    const online=!!p.online && p.dia===hoy && (nowMs-new Date(p.online).getTime())<4*60000;
    const acts=ev[uid]||[];
    // "Conectado hoy" se deriva de DOS fuentes: el latido (bandas de presencia) Y la actividad
    // real en Odoo (cada contacto/oferta/alta prueba que estaba trabajando a esa hora). Así se
    // recupera la mañana aunque el latido sea nuevo. Se mergean huecos < 30 min.
    const ivs=[
      ...bandas.map(b=>[toMs(b[0]),toMs(b[1])]),
      ...acts.map(a=>{ const m=toMs(a.t); return [m,m]; }),
    ].filter(x=>!isNaN(x[0])).sort((a,b)=>a[0]-b[0]);
    const segs=[];
    for(const iv of ivs){ const L=segs[segs.length-1]; if(L && iv[0]-L[1]<30*60000){ L[1]=Math.max(L[1],iv[1]); } else segs.push([iv[0],iv[1]]); }
    let mins=0; segs.forEach(([s,e])=>mins+=(e-s)/60000);
    const lastMs=Math.max(p.online?toMs(p.online):0, segs.length?segs[segs.length-1][1]:0)||null;
    const ultAct=p.lastAct?toMs(p.lastAct):(acts.length?Math.max(...acts.map(a=>toMs(a.t)).filter(m=>!isNaN(m))):null);
    return {uid, name:uidName[uid]||("#"+uid), online, mins, first:segs.length?segs[0][0]:null, last:lastMs, ultAct, segs, acts};
  }).sort((a,b)=>(b.online-a.online)||(b.mins-a.mins));
  const enLinea=info.filter(x=>x.online);
  const cuenta=(list,ic)=>list.filter(a=>a.ic===ic).length;

      <div class="scopenote" style="margin:0;flex:1">🟢 Presencia y actividad de tu equipo <b>hoy</b>. El <b>tiempo conectado</b> combina el latido del panel con la <b>actividad real en Odoo</b> (cada contacto/oferta/alta prueba que estaban trabajando), así cuenta desde que arrancaron a la mañana. "En línea ahora" = latido de los últimos minutos.</div>
      <button onclick="cargarActividadLider()" style="background:#12A366;color:#fff;border:0;border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap">🔄 Actualizar</button>
    </div>
    <div style="background:linear-gradient(135deg,#0E5C46,#12A366);color:#fff;border-radius:14px;padding:13px 16px;margin-bottom:14px">
      <div style="font-size:12.5px;opacity:.9">En línea ahora</div>
      <div style="font-size:20px;font-weight:800">${enLinea.length} / ${UIDS.length}${enLinea.length?' · '+enLinea.map(x=>esc(x.name.split(" ")[0])).join(", "):''}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
    ${info.map(x=>{
      const bandTxt=x.segs.map(b=>horaAR(b[0])+"–"+horaAR(b[1])).join(" · ");
      return `<div style="background:#fff;border:1px solid #e8efee;border-radius:14px;padding:13px 15px;box-shadow:0 2px 10px rgba(0,0,0,.05)">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:${x.online?'#22c55e':'#c9d3d1'};box-shadow:${x.online?'0 0 0 3px rgba(34,197,94,.2)':'none'};flex:none"></span><b style="font-size:15px;color:#0E1F1D">${esc(x.name)}</b><span style="font-size:11.5px;color:${x.online?'#12A366':'var(--gris2)'};font-weight:700">${x.online?'en línea':'desconectado'}</span></div>
          <div style="text-align:right"><div style="font-size:15px;font-weight:800;color:var(--teal-deep)">${durTxt(x.mins)}</div><div style="font-size:10.5px;color:var(--gris2)">conectado hoy</div></div>
        </div>
        ${x.first?`<div style="font-size:11.5px;color:var(--gris2);margin-bottom:8px" title="Tramos: ${bandTxt}${x.ultAct?` · última interacción ${horaAR(x.ultAct)}`:''}">🕐 ${x.online?'activo desde':'de'} las ${horaAR(x.first)} ${x.online?'':'a '+horaAR(x.last)}${x.segs.length>1?` · ${x.segs.length} tramos`:''}</div>`:'<div style="font-size:11.5px;color:var(--gris2);margin-bottom:8px">Sin conexión registrada hoy</div>'}
        <div style="display:flex;gap:14px;font-size:12px;font-weight:700;margin-bottom:8px;color:#3a4a47">
          <span>📤 ${cuenta(x.acts,"📤")} contactos</span><span>🎁 ${cuenta(x.acts,"🎁")} ofertas</span><span>➕ ${cuenta(x.acts,"➕")} altas</span>
        </div>
        ${x.acts.length?`<details><summary style="cursor:pointer;font-size:12px;color:var(--teal);font-weight:700">Ver registro por hora (${x.acts.length})</summary>
          <div style="margin-top:6px;max-height:280px;overflow:auto">${x.acts.map(a=>`<div style="display:flex;gap:8px;font-size:12.5px;padding:3px 0;border-bottom:1px solid #f2f5f4"><span style="color:var(--gris2);font-variant-numeric:tabular-nums;min-width:42px">${horaAR(a.t)}</span><span style="flex:none">${a.ic}</span><span style="color:#3a4a47">${esc(a.tx)}</span></div>`).join("")}</div></details>`:'<div style="font-size:12px;color:var(--gris2)">Sin actividad registrada hoy.</div>'}
      </div>`;
    }).join("")}
    </div>`;

async function cargarMensajeria(){

      partIds.length?EYG.rpc("mail.message","search_read",[[["model","=","res.partner"],["res_id","in",partIds],["date",">=",desde6],["body","like","EyGOFENV"]]],{fields:["res_id","date","body"],limit:0}).catch(()=>[]):[],
    ]);
    const strip=b=>(b||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
    const perCom={}; UIDS.forEach(u=>perCom[u]={cli:new Set(),cliExist:new Set(),cliNuevo:new Set(),msgs:0,of:0,dias:new Set()});
    const histWA={}, histCamp={}, histOf={}, histWAcom={};        // "YYYY-MM" -> conteo
    const contactoIds=new Set(), perComMesRows=[];                // clientes contacto del mes (para clasificar)
    const diasActTeam=new Set();                                  // fechas con actividad del equipo (para el promedio diario)
    let campMesMsgs=0; const campMesCli=new Set();
    for(const w of wa){
      const dstr=argParts(w.date).date, mm=dstr.slice(0,7);
      const b=strip(w.body);
      const tm=b.match(/\[EyGWA\]\s*(\w+)\//); const tipo=tm?tm[1]:(/EyGCRM/.test(b)?"contacto":"?");
      if(tipo==="campana"){ histCamp[mm]=(histCamp[mm]||0)+1; if(mm===mesActual){ campMesMsgs++; campMesCli.add(w.res_id); } continue; }
      if(tipo!=="contacto") continue;                            // cobranza u otros: no es mensajería comercial
      histWA[mm]=(histWA[mm]||0)+1;
      const por=(b.match(/por\s+(.+?)\s*$/)||[])[1];
      const uid=(por&&nameToUid[norm(por)])||P2UID[w.res_id];
      if(uid){ (histWAcom[uid]=histWAcom[uid]||{})[mm]=(histWAcom[uid][mm]||0)+1; }
      if(mm===mesActual){ contactoIds.add(w.res_id); diasActTeam.add(dstr); if(uid&&perCom[uid]){ perCom[uid].msgs++; perCom[uid].cli.add(w.res_id); perCom[uid].dias.add(dstr); perComMesRows.push({uid,id:w.res_id}); } }
    }
    for(const o of ofe){
      const b=strip(o.body); const mm=argParts(o.date).date.slice(0,7);
      histOf[mm]=(histOf[mm]||0)+1;
      if(mm===mesActual){ const por=(b.match(/\[EyGOFENV\]\s*(.+?)\s*·/)||[])[1]; const uid=por&&nameToUid[norm(por)]; if(uid&&perCom[uid]) perCom[uid].of++; }
    }
    // Existente vs nuevo: ¿el cliente contactado ya tenía pedido confirmado ANTES del mes?
    const ids=[...contactoIds]; let before=new Set();
    if(ids.length){
      try{
        const ord=await EYG.rpc("sale.order","search_read",[[["state","in",["sale","done"]],["date_order","<",inicioMes+" 00:00:00"],"|",["partner_id","in",ids],["commercial_partner_id","in",ids]]],{fields:["partner_id","commercial_partner_id"],limit:0});
        const idset=new Set(ids);
        ord.forEach(r=>{ [r.partner_id&&r.partner_id[0], r.commercial_partner_id&&r.commercial_partner_id[0]].forEach(x=>{ if(idset.has(x)) before.add(x); }); });
      }catch(e){}
    }
    perComMesRows.forEach(r=>{ const g=perCom[r.uid]; if(!g)return; if(before.has(r.id)) g.cliExist.add(r.id); else g.cliNuevo.add(r.id); });
    const meses=[...new Set([...Object.keys(histWA),...Object.keys(histOf),...Object.keys(histCamp)])].sort();
    MSG_LIDER={uidName, perCom, meses, histWA, histCamp, histOf, histWAcom, mesActual,
      diasAct:Math.max(1,diasActTeam.size),
      teamCli:ids.length, teamMsgs:Object.values(perCom).reduce((s,g)=>s+g.msgs,0),
      teamExist:before.size, teamNuevo:ids.length-before.size,
      teamOf:Object.values(perCom).reduce((s,g)=>s+g.of,0),
      campMsgs:campMesMsgs, campCli:campMesCli.size};
    renderMensajeria();
  }catch(e){ if(box) box.innerHTML='<div class="scopenote">No pude cargar la mensajería del equipo. '+esc(e.message||"")+'</div>'; }
}

/* Carga la ficha completa de cada comercial (nivel/salud/comisión/cartera) en paralelo,
   arma los promedios del equipo (AGG) para las comparativas, y repinta las tarjetas. */
// Corre fn sobre items con como máximo `limit` en paralelo (evita saturar el edge function).
async function mapLimit(items, limit, fn){
  let i=0; const work=async()=>{ while(i<items.length){ const idx=i++; try{ await fn(items[idx],idx); }catch(e){} } };
  await Promise.all(Array.from({length:Math.min(limit,items.length||1)}, work));
}
const FICHAS_INFLIGHT=new Set();
/* Carga la ficha de UN comercial (si no está ya cargada ni en curso). Repinta las
   tarjetas y, si es el comercial abierto, su detalle. La usan tanto la carga de fondo
   como el clic (que la prioriza para no esperar a la cola). */
async function loadFicha(c, carteraIn, pfIn){
  if(FICHAS[c.uid] || FICHAS_INFLIGHT.has(c.uid)) return FICHAS[c.uid]||null;
  FICHAS_INFLIGHT.add(c.uid);
  try{
    const d=await fichaData(c.uid,c.name,carteraIn,pfIn);
    if(d){ FICHAS[c.uid]=d; computeAGG(); renderEquipo(); if(SEL===c.uid) renderDetalle(); }
    return d;
  }catch(e){ return null; }
  finally{ FICHAS_INFLIGHT.delete(c.uid); }
}
async function cargarFichas(){
  FICHAS_LOADING=true; renderEquipo();
  await prepOfertasLider();   // ids de ofertas + partners (para ofertas vendidas/enviadas)
  // Una sola consulta de cartera del equipo (ids + datos de ficha), reutilizada por todas las
  // fichas: reemplaza 2 consultas por comercial (search + search_read = 12) por 1 de equipo, y
  // evita el fetch serial de cartera antes del Promise.all de cada ficha.
  let cartByUid={}, pfByUid={};
  try{
    const parts=await EYG.rpc("res.partner","search_read",[[["user_id","in",UIDS]]],{fields:["user_id","vat","phone","mobile","email","street","create_date"],limit:0});
    UIDS.forEach(u=>{ cartByUid[u]=[]; pfByUid[u]=[]; });
    parts.forEach(p=>{ const u=p.user_id&&p.user_id[0]; if(!u||!cartByUid[u])return; cartByUid[u].push(p.id); pfByUid[u].push(p); });
  }catch(e){ cartByUid={}; pfByUid={}; }
  // De a 2 comerciales por vez: fiable y sin trabar.
  await mapLimit(COM, 2, c=>loadFicha(c, cartByUid[c.uid], pfByUid[c.uid]));
  computeAGG(); FICHAS_LOADING=false; renderEquipo();
}
// métricas comparables de una ficha
function mval(d,k){
  if(!d) return null;
  switch(k){
    case "factMes": return d.factMesTotal||0;
    case "cobradoMes": return d.cobradoMes||0;
    case "actividad": return (d.actividadRatio||0)*100;
    case "nuevos": return d.nuevos||0;
    case "vencPct": return d.porCobrar>0?(d.vencido/d.porCobrar*100):0;
    case "fichas": return (d.fichasPct||0)*100;
    case "ticket": return d.avgTicket||0;
    case "salud": return d.salud?d.salud.salud:0;
    case "rent": return d.rentabilidad!=null?d.rentabilidad*100:null;
    case "cumpl": { const meta=(d.meta!=null?d.meta:(d.factBaseline||0)*1.2); return meta>0?d.factMes/meta*100:0; }
    case "ritmo": { const esp=(d.factBaseline||0)*(d.diaMesFrac||1); return esp>0?d.factMes/esp*100:100; }
    case "nivelPts": return d.nivel?d.nivel.pts:0;
  }
  return null;
}
const METR=[
  {k:"factMes", lab:"Facturado del mes (con IVA)", fmt:"money", higher:true},
  {k:"cobradoMes", lab:"Cobrado del mes", fmt:"money", higher:true},
  {k:"actividad", lab:"Actividad", fmt:"pct", higher:true},
  {k:"nuevos", lab:"Clientes nuevos", fmt:"num", higher:true},
  {k:"vencPct", lab:"Vencido de cartera", fmt:"pct", higher:false},
  {k:"fichas", lab:"Fichas completas", fmt:"pct", higher:true},
  {k:"ticket", lab:"Ticket promedio", fmt:"money", higher:true},
  {k:"salud", lab:"Salud de la cuenta", fmt:"pct", higher:true},
];
function fmtMetric(fmt,v){ if(v==null) return "—"; if(fmt==="money") return M(v); if(fmt==="pct") return Math.round(v)+"%"; return Math.round(v).toLocaleString("es-AR"); }
function computeAGG(){
  const ds=COM.map(c=>FICHAS[c.uid]).filter(Boolean);
  if(!ds.length){ AGG=null; return; }
  AGG={n:ds.length, avg:{}, best:{}, worst:{}};
  for(const m of METR){
    const vals=ds.map(d=>mval(d,m.k)).filter(v=>v!=null);
    if(!vals.length){ AGG.avg[m.k]=null; continue; }
    AGG.avg[m.k]=vals.reduce((s,x)=>s+x,0)/vals.length;
    AGG.best[m.k]=m.higher?Math.max(...vals):Math.min(...vals);
    AGG.worst[m.k]=m.higher?Math.min(...vals):Math.max(...vals);
  }
}
/* ═══════════════ PERÍODO ANTERIOR (para comparar) ══════════════════════════
   Un número solo no dice nada: "$17,9 M" no es bueno ni malo hasta que se lo compara.
   Traemos el MISMO largo de días inmediatamente anterior y de ahí salen los ▲▼ de los
   KPIs y de la tabla, y el movimiento de clientes (quién se sumó y quién dejó de comprar).
   Es UNA consulta agrupada por vendedor y cliente: de ahí sale todo junto.
   Los límites son exactos: Argentina es UTC-3 todo el año (sin horario de verano), así
   que el día ARGENTINO va de las 03:00 UTC a las 02:59 UTC del día siguiente. */
function rangoPrevio(R){
  const d=diasRango(R);
  return {desde:sumaDias(R.desde,-d), hasta:sumaDias(R.desde,-1), dias:d};
}
function utcIni(f){ return f+" 03:00:00"; }
function utcFin(f){ return sumaDias(f,1)+" 02:59:59"; }
async function cargarPrevio(R){
  const p=rangoPrevio(R);
  const g=await EYG.rpc("sale.order","read_group",[[["user_id","in",UIDS],["state","in",["sale","done"]],
      ["date_order",">=",utcIni(p.desde)],["date_order","<=",utcFin(p.hasta)]],
      ["amount_total:sum"],["user_id","partner_id"]],{lazy:false});
  const byUid={}, setU={}, cliAll=new Set();
  UIDS.forEach(u=>{ byUid[u]={vendido:0,ped:0,cli:0,ticket:0}; setU[u]=new Set(); });
  for(const r of g){
    const u=r.user_id&&r.user_id[0], pid=r.partner_id&&r.partner_id[0];
    if(u==null||!byUid[u]) continue;
    byUid[u].vendido+=r.amount_total||0; byUid[u].ped+=r.__count||0;
    if(pid){ setU[u].add(pid); cliAll.add(pid); }
  }
  const tot={vendido:0,ped:0};
  UIDS.forEach(u=>{ const b=byUid[u]; b.cli=setU[u].size; b.ticket=b.ped?b.vendido/b.ped:0; tot.vendido+=b.vendido; tot.ped+=b.ped; });
  tot.cli=cliAll.size; tot.ticket=tot.ped?tot.vendido/tot.ped:0;
  return {rango:p, byUid:byUid, tot:tot, setU:setU, cliAll:cliAll};
}
/* Variación contra el período anterior. null si antes no había nada (no se puede
   dividir por cero, y "infinito %" no le dice nada a nadie). */
function delta(actual, previo){
  if(previo==null||previo<=0) return null;
  return Math.round((actual-previo)/previo*100);
}
function chipDelta(d, invertido){
  if(d==null) return '';
  const bueno = invertido ? d<=0 : d>=0;
  return '<span class="dlt '+(bueno?'up':'down')+'" title="Contra el mismo período anterior">'+(d>=0?'▲':'▼')+' '+Math.abs(d)+'%</span>';
}

/* ═══════════════ GRÁFICOS DEL PERÍODO ══════════════════════════════════════
   Todos salen de la MISMA consulta de pedidos que ya trajo cargarRango: no cuestan
   ni una consulta más a Odoo. Son SVG y CSS a mano, sin librerías (la página no
   carga nada de afuera).                                                          */

// Barras horizontales: el ranking se lee de un vistazo y los nombres entran enteros.
function barrasH(items, opts){
  opts=opts||{};
  const max=Math.max.apply(null,items.map(i=>i.val).concat([1]));
  return '<div class="bh">'+items.map(i=>
    '<div class="bhrow"'+(i.tit?' title="'+esc(i.tit)+'"':'')+'>'
    +'<div class="bhl"><span class="pt" style="background:'+(i.color||'var(--teal)')+'"></span>'+esc(i.label)+'</div>'
    +'<div class="bhbar"><i style="width:'+Math.max(1,Math.round(i.val/max*100))+'%;background:'+(i.color||'var(--teal)')+'"></i>'
    + (i.val2!=null?'<b class="bhmark" style="left:'+Math.min(100,Math.round(i.val2/max*100))+'%" title="'+esc(opts.lbl2||'')+': '+M(i.val2)+'"></b>':'')
    +'</div>'
    +'<div class="bhv">'+(opts.fmt?opts.fmt(i.val):Mabbr(i.val))+'</div></div>').join("")+'</div>';
}

// Dona: cuánto pesa cada comercial dentro del total. Con el total en el centro.
function dona(items, centroVal, centroLbl){
  const tot=items.reduce((a,b)=>a+b.val,0)||1;
  const R=70, C=2*Math.PI*R; let off=0;
  const arcos=items.map(i=>{
    const frac=i.val/tot, len=C*frac;
    const s='<circle cx="90" cy="90" r="'+R+'" fill="none" stroke="'+i.color+'" stroke-width="26"'
      +' stroke-dasharray="'+len.toFixed(1)+' '+(C-len).toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'"'
      +' transform="rotate(-90 90 90)"><title>'+esc(i.label)+': '+M(i.val)+' ('+Math.round(frac*100)+'%)</title></circle>';
    off+=len; return s;
  }).join("");
  return '<div class="donawrap"><svg viewBox="0 0 180 180" class="dona">'+arcos
    +'<text x="90" y="86" text-anchor="middle" font-size="19" font-weight="900" fill="var(--ink)">'+centroVal+'</text>'
    +'<text x="90" y="104" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9AAcA8">'+esc(centroLbl)+'</text></svg>'
    +'<div class="donaleg">'+items.map(i=>'<div class="dl"><span class="pt" style="background:'+i.color+'"></span>'
      +'<span class="dln">'+esc(i.label)+'</span><b>'+Math.round(i.val/tot*100)+'%</b></div>').join("")+'</div></div>';
}

// Mapa de calor día × hora: dónde está de verdad la venta de la semana.
function heatmap(mat){
  let max=1; mat.forEach(f=>f.forEach(v=>{ if(v>max)max=v; }));
  const horas=[]; for(let h=8;h<=20;h++) horas.push(h);
  return '<div class="heat"><div class="heatgrid" style="grid-template-columns:34px repeat('+horas.length+',1fr)">'
    +'<div></div>'+horas.map(h=>'<div class="hh">'+h+'</div>').join("")
    + mat.map((fila,d)=>'<div class="hd">'+DIASSEM[d]+'</div>'+horas.map(h=>{
        const v=fila[h]||0, a=v?(0.12+0.88*Math.pow(v/max,0.6)):0;
        return '<div class="hc" style="background:rgba(4,135,130,'+a.toFixed(3)+')" title="'+DIASSEM[d]+' '+h+'h: '+M(v)+'"></div>';
      }).join("")).join("")
    +'</div><div class="heatlbl">Más oscuro = más vendido. Sale de los mismos pedidos del período.</div></div>';
}

/* Embudo: presupuestos → pedidos → facturado → cobrado. OJO, y está aclarado en
   pantalla: NO es un seguimiento de los mismos comprobantes (un presupuesto de este
   mes puede facturarse el que viene). Son cuatro medidas del MISMO período puestas
   una al lado de la otra: sirve para ver dónde se achica el caudal, no para auditar. */
function embudo(){
  const v=VENTASEQ[claveRango()];
  if(!v) return '<div class="floading"><span class="spin-sm"></span> sumando el desglose…</div>';
  const d=v.desglose;
  const pasos=[
    {lab:"Presupuestos", val:d.draM+d.pedM, n:d.draN+d.pedN, col:"#7ad5cc", ay:"Todo lo que se cargó: los que siguen en borrador más los que ya se confirmaron."},
    {lab:"Pedidos confirmados", val:d.pedM, n:d.pedN, col:"#0AA89F", ay:"Los que el cliente confirmó."},
    {lab:"Facturado", val:d.facMonto-d.ncMonto, n:d.facN, col:"#048782", ay:"Facturas menos notas de crédito, sobre la cartera del equipo."},
    {lab:"Cobrado", val:(EQ&&EQ.tot?EQ.tot.cob:0), n:null, col:"#04635F", ay:"Pagos entrantes del período. No son necesariamente de estas facturas."},
  ];
  const max=Math.max.apply(null,pasos.map(p=>p.val).concat([1]));
  return '<div class="emb">'+pasos.map((p,i)=>{
    const prev=i?pasos[i-1].val:null;
    const pct=(prev&&prev>0)?Math.round(p.val/prev*100):null;
    return '<div class="embrow" title="'+esc(p.ay)+'">'
      +'<div class="embl">'+esc(p.lab)+(p.n!=null?'<span class="embn">'+p.n+'</span>':'')+'</div>'
      +'<div class="embbar"><i style="width:'+Math.max(2,Math.round(p.val/max*100))+'%;background:'+p.col+'"></i>'
      +'<span class="embv">'+Mabbr(p.val)+'</span></div>'
      +'<div class="embp">'+(pct==null?'':'<span class="'+(pct>=70?'ok':pct>=40?'md':'ba')+'">'+pct+'%</span>')+'</div></div>';
  }).join("")+'</div>';
}

/* Movimiento de clientes: se sumaron / siguen / dejaron de comprar, contra el mismo
   largo de días anterior. "Dejaron de comprar" NO quiere decir perdidos para siempre:
   quiere decir que en estos días no compraron y en los anteriores sí. Es la lista para
   levantar el teléfono. */
function movimientoClientes(){
  if(!EQ||!EQ.prev) return '<div class="floading"><span class="spin-sm"></span> comparando con el período anterior…</div>';
  const ahora=EQ.cliAll, antes=EQ.prev.cliAll;
  let siguen=0, sumados=0, perdidos=0;
  ahora.forEach(id=>{ if(antes.has(id)) siguen++; else sumados++; });
  antes.forEach(id=>{ if(!ahora.has(id)) perdidos++; });
  const porCom=COM.map(c=>{
    const a=EQ.cliByUid[c.uid]||new Set(), b=EQ.prev.setU[c.uid]||new Set();
    let p=0; b.forEach(id=>{ if(!a.has(id)) p++; });
    return {label:c.name.split(" ")[0], color:c.color, val:p, tit:c.name+": "+p+" clientes que le compraron en el período anterior y en éste no"};
  }).filter(x=>x.val>0).sort((x,y)=>y.val-x.val);
  const tile=(n,lab,col,ay)=>'<div class="mvt" title="'+esc(ay)+'"><div class="mvn" style="color:'+col+'">'+n+'</div><div class="mvl">'+lab+'</div></div>';
  return '<div class="mvtiles">'
    + tile(sumados,"Se sumaron","var(--teal)","Le compraron al equipo en este período y en el anterior no. Son altas nuevas o clientes recuperados.")
    + tile(siguen,"Siguen","var(--ink)","Compraron en los dos períodos.")
    + tile(perdidos,"Dejaron de comprar","var(--coral)","Compraron en el período anterior y en éste no. No están perdidos: hay que llamarlos.")
    +'</div>'
    + (porCom.length?'<div class="mvsub">Quién tiene que llamar</div>'+barrasH(porCom,{fmt:v=>Math.round(v)+" cli."})
       :'<div class="mvok">👏 Nadie del equipo dejó de vender a un cliente que compraba antes.</div>');
}
