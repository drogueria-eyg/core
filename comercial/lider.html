<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del Líder · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<style>
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .l{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--gris);font-weight:700}
  .kpi .v{font-size:22px;font-weight:900;letter-spacing:-.5px;margin-top:3px}
  .kpi .s{font-size:11.5px;color:var(--gris2);margin-top:2px}
  .kpi.hoy{background:linear-gradient(145deg,var(--teal),var(--teal-deep));color:#fff} .kpi.hoy .l,.kpi.hoy .s{color:#d9f1ee}
  .kpi.period{cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;position:relative}
  .kpi.period:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(6,65,62,.13);border-color:var(--teal-med)}
  .kpi.period.sel{background:linear-gradient(145deg,var(--teal),var(--teal-deep));color:#fff;border-color:var(--teal)}
  .kpi.period.sel .l,.kpi.period.sel .s{color:#d9f1ee}
  .kpi.period .pick{position:absolute;top:10px;right:12px;font-size:11px;opacity:.55}
  .kpi.period.sel .pick{opacity:1}
  /* barras del gráfico por período */
  .chartbox .segs{display:inline-flex;gap:0;background:#EDF2F1;border-radius:9px;padding:3px;margin-left:auto}
  .chartbox .segs button{border:0;background:none;font-family:inherit;font-size:12px;font-weight:700;color:var(--gris);padding:5px 11px;border-radius:7px;cursor:pointer}
  .chartbox .segs button.on{background:var(--surface);color:var(--teal-deep);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  /* chart */
  .chartbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px 12px;box-shadow:var(--shadow);margin-bottom:22px}
  .chartbox .ch-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .chartbox h2{font-size:16px;font-weight:800}
  .chartbox .live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--teal-med)}
  .chartbox .live .dot{width:8px;height:8px;border-radius:50%;background:#22e0c6;box-shadow:0 0 8px #22e0c6;animation:liveblink 1.4s ease-in-out infinite}
  @keyframes liveblink{0%,100%{opacity:1;box-shadow:0 0 10px #22e0c6}50%{opacity:.4;box-shadow:0 0 2px #22e0c6}}
  .chartbox .ch-tot{font-size:22px;font-weight:900;color:var(--teal-deep)}
  svg .neon{animation:neondot 1.3s ease-in-out infinite}
  @keyframes neondot{0%,100%{r:5;opacity:1}50%{r:8;opacity:.75}}
  /* tabla comerciales */
  .tbl{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .tbl .row{display:grid;grid-template-columns:1.3fr repeat(4,1fr) 1.4fr;gap:10px;align-items:center;padding:13px 18px;border-top:1px solid var(--line)}
  .tbl .row.head{border-top:0;background:#F1F7F6;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--gris);font-weight:800}
  .tbl .row:hover:not(.head){background:#FAFDFC}
  .tbl .nm{font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:9px}
  .tbl .dotc{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .tbl .num{text-align:right;font-weight:700;font-size:14px} .tbl .num.hoy{color:var(--teal-deep);font-weight:900}
  .tbl .num .sub{display:block;font-size:10.5px;color:var(--gris2);font-weight:600}
  .tbl .spark{display:flex;align-items:flex-end;gap:2px;height:34px}
  .tbl .spark i{flex:1;background:var(--aqua);border-radius:2px 2px 0 0;min-height:2px;transition:height .5s}
  .tbl .spark i.now{background:var(--coral)}
  .tbl a.row{color:inherit;text-decoration:none}
  .muted{color:var(--gris2);font-size:12px}
  @media(max-width:720px){ .tbl .row{grid-template-columns:1.2fr 1fr 1fr;} .tbl .col-sem,.tbl .col-ano,.tbl .spark{display:none} }
  /* productos más vendidos */
  .prodsbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 20px;margin-bottom:22px}
  .prodsbox h2{font-size:16px;font-weight:800;margin-bottom:6px}
  .prow{display:grid;grid-template-columns:26px 1fr 92px 112px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
  .prow.h{border-top:0;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--gris2);font-weight:800}
  .prow .rk{font-weight:800;color:var(--teal-med);text-align:center}
  .prow .pn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow .pq{text-align:right;color:var(--gris);font-size:12.5px}
  .prow .pv{text-align:right;font-weight:800}
  /* ficha desplegable por comercial */
  .crow .row{cursor:pointer}
  .crow .ficha{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease;background:#F6FBFA;border-top:1px solid var(--line)}
  .crow.open .ficha{grid-template-rows:1fr}
  .crow .ficha>.fw{overflow:hidden}
  .fichin{padding:12px 20px 22px}
  .chev{color:var(--gris2);font-size:11px;transition:transform .25s;margin-left:4px} .crow.open .chev{transform:rotate(180deg)}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:4px 0 16px}
  .fstat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .fstat .l{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--gris);font-weight:700}
  .fstat .v{font-size:18px;font-weight:900;margin-top:2px;letter-spacing:-.3px} .fstat .s{font-size:11px;color:var(--gris2);margin-top:1px}
  .fsub{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--teal-med);margin:14px 0 8px}
  .prm{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;margin:7px 0 3px}
  .pb{height:6px;background:#EDF2F1;border-radius:4px;overflow:hidden} .pb>i{display:block;height:100%;border-radius:4px}
  .logros{display:flex;flex-wrap:wrap;gap:8px}
  .lg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:20px;border:1px solid var(--line)}
  .lg.on{background:linear-gradient(135deg,#FFF6E4,#fff);border-color:var(--gold);color:#8a6414} .lg.off{opacity:.45;filter:grayscale(.5)}
  .floading{padding:18px;text-align:center;color:var(--gris);font-size:13px}
  .fplink{display:inline-block;margin-top:14px;color:var(--teal);font-weight:800;font-size:13px;text-decoration:none}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:22px} @media(max-width:640px){.cols2{grid-template-columns:1fr}}
  /* ===== equipo: tarjetas seleccionables ===== */
  .eqhead{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;margin:2px 4px 12px}
  .eqhead h2{font-size:16px;font-weight:800}
  .eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:13px;margin-bottom:16px}
  .ec{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 16px 14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .13s,box-shadow .13s,border-color .13s;overflow:hidden}
  .ec:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(6,65,62,.14)}
  .ec.sel{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal),0 14px 32px rgba(6,65,62,.16)}
  .ec .accent{position:absolute;left:0;top:0;bottom:0;width:4px}
  .ec .ehead{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .ec .rank{width:24px;height:24px;border-radius:50%;background:#F1F7F6;color:var(--gris);font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ec .rank.m1{background:#FFF4D6;color:#9a6b00} .ec .rank.m2{background:#EEF1F4;color:#6b7684} .ec .rank.m3{background:#F7E6D8;color:#9a5a2a}
  .ec .who{flex:1;min-width:0} .ec .who .nm{font-weight:800;font-size:14.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ec .who .lv{font-size:11px;font-weight:700;color:var(--gris2);margin-top:1px}
  .ec .salud{width:38px;height:38px;flex-shrink:0}
  .ec .big{display:flex;align-items:baseline;gap:7px;margin-bottom:3px}
  .ec .big .v{font-size:21px;font-weight:900;letter-spacing:-.5px}
  .ec .big .trend{font-size:12px;font-weight:800}
  .ec .lbl{font-size:11px;color:var(--gris2);font-weight:600}
  .ec .prog{height:6px;background:#EDF2F1;border-radius:4px;overflow:hidden;margin:9px 0 3px} .ec .prog>i{display:block;height:100%;border-radius:4px;transition:width .5s}
  .ec .foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;gap:8px}
  .ec .foot .hoy{font-size:12px;color:var(--gris)} .ec .foot .hoy b{color:var(--teal-deep);font-weight:900;font-size:13.5px}
  .ec .wamini{font-size:11.5px;color:var(--gris);background:#F0FAF8;border:1px solid #D6EFEA;border-radius:8px;padding:5px 9px;margin:8px 0 2px} .ec .wamini b{color:var(--teal-deep)}
  .ec .spark{display:flex;align-items:flex-end;gap:1.5px;height:26px;flex:1;max-width:120px}
  .ec .spark i{flex:1;background:var(--aqua);border-radius:2px 2px 0 0;min-height:2px} .ec .spark i.now{background:var(--coral)}
  .ec .shim{color:var(--gris2);font-size:11px;display:inline-flex;align-items:center;gap:6px}
  .up{color:#1E7D46} .down{color:#C0554A}
  /* panel de detalle del comercial seleccionado */
  .det{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:0;margin-bottom:22px;overflow:hidden;animation:fadeup .35s both}
  .det .dtop{display:flex;align-items:center;gap:13px;padding:18px 22px;background:linear-gradient(135deg,var(--teal),var(--teal-deep));color:#fff}
  .det .dtop .av{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;flex-shrink:0}
  .det .dtop .nm{font-size:19px;font-weight:900} .det .dtop .sub{font-size:12.5px;color:#dbf3ef;margin-top:1px}
  .det .dtop .close{margin-left:auto;background:rgba(255,255,255,.16);border:0;color:#fff;width:34px;height:34px;border-radius:9px;font-size:16px;cursor:pointer}
  .det .dbody{padding:18px 22px 22px}
  .det .sec{font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--teal-med);margin:20px 0 11px} .det .sec:first-child{margin-top:0}
  /* barras comparativas */
  .cmp{display:grid;gap:11px}
  .cmprow .cl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px} .cmprow .cl b{font-weight:800}
  .cmprow .track{position:relative;height:16px;background:#EDF2F1;border-radius:8px;overflow:visible}
  .cmprow .fill{position:absolute;left:0;top:0;bottom:0;border-radius:8px;transition:width .5s}
  .cmprow .avg{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
  .cmprow .avg::after{content:attr(data-l);position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--gris);white-space:nowrap}
  /* fuertes / débiles / oportunidades */
  .sw{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media(max-width:640px){.sw{grid-template-columns:1fr}}
  .swbox{border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .swbox.good{background:#F1FAF5;border-color:#C9EBD8} .swbox.bad{background:#FEF4F1;border-color:#F6D9CF}
  .swbox h4{font-size:12.5px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .swbox ul{list-style:none;display:grid;gap:6px} .swbox li{font-size:12.5px;line-height:1.35;display:flex;gap:7px;align-items:flex-start}
  .swbox li .i{flex-shrink:0}
  .opps{display:grid;gap:9px}
  .opp{display:flex;gap:11px;background:linear-gradient(135deg,#FFFDF6,#FFF8E8);border:1px solid #F0E2BD;border-radius:12px;padding:12px 14px}
  .opp .ic{font-size:19px;flex-shrink:0} .opp .tx{font-size:13px;line-height:1.4} .opp .tx b{font-weight:800}
  .opp .gain{margin-left:auto;font-size:11px;font-weight:800;color:#9a6b00;white-space:nowrap;align-self:center}
  /* header del líder + tabs */
  .ldhead{display:flex;align-items:center;gap:14px;background:linear-gradient(140deg,var(--teal),var(--teal-deep));color:#fff;border-radius:16px;padding:16px 20px;margin-bottom:16px;box-shadow:0 10px 30px rgba(6,65,62,.2)}
  .ldhead .ic{font-size:30px}
  .ldhead .t{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#cdeeea;font-weight:800}
  .ldhead .n{font-size:20px;font-weight:900;letter-spacing:-.3px}
  .ldhead .sub{font-size:12.5px;color:#e7faf8;margin-top:1px}
  .ldhead .chg{margin-left:auto;background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:9px;padding:8px 13px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
  .ldhead .chg:hover{background:rgba(255,255,255,.28)}
  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .tab{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 16px;font-family:inherit;font-size:14px;font-weight:700;color:var(--gris);cursor:pointer;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:7px}
  .tab.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  /* contactos */
  .cfilters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .cfilters .search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  .cfilters .search svg{width:16px;height:16px;color:var(--gris2);flex-shrink:0}
  .cfilters .search input{border:0;background:none;outline:none;font-family:inherit;font-size:14px;width:100%}
  .cchip{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:700;color:var(--gris);cursor:pointer;white-space:nowrap}
  .cchip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .cchip.sin{border-color:var(--gold);color:#9a6b00} .cchip.sin.on{background:var(--gold);color:#3a2c07;border-color:var(--gold)}
  .cchip .c{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .sinbanner{background:#FFF8E8;border:1px solid #F0E2BD;color:#7a5a12;border-radius:11px;padding:11px 14px;font-size:13px;margin-bottom:12px}
  .newbtn{margin-left:auto;background:var(--coral);color:#fff;border:0;border-radius:10px;padding:9px 15px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
  .clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .cc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
  .cc .top{display:flex;align-items:flex-start;gap:8px}
  .cc .nm{font-weight:800;font-size:15px;line-height:1.25;flex:1}
  .cc .tipo{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:6px;background:#EDF5F4;color:var(--teal-deep);white-space:nowrap}
  .cc .meta{font-size:12px;color:var(--gris);line-height:1.5}
  .cc .meta .mi{display:inline-flex;align-items:center;gap:4px;margin-right:10px}
  .cc .pct{height:5px;background:#EDF2F1;border-radius:4px;overflow:hidden} .cc .pct>i{display:block;height:100%;border-radius:4px}
  .cc .asig{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--gris);border-top:1px solid var(--line);padding-top:9px;margin-top:2px}
  .cc .asig .dc{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .cc .acts{display:flex;gap:7px;margin-top:2px}
  .cc .acts button, .cc .acts a{flex:1;font-family:inherit;font-size:12.5px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px;cursor:pointer;text-align:center;text-decoration:none}
  .cc .acts .prim{background:var(--teal);color:#fff;border-color:var(--teal)}
  .cempty{padding:40px 20px;text-align:center;color:var(--gris);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
  /* drawer (form contacto) */
  .scrim{position:fixed;inset:0;background:rgba(8,26,24,.42);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}
  .cdrawer{position:fixed;top:0;right:0;height:100%;width:min(440px,94vw);background:var(--bg);box-shadow:-10px 0 40px rgba(6,65,62,.2);transform:translateX(100%);transition:transform .28s cubic-bezier(.22,1,.36,1);z-index:41;overflow-y:auto}
  .cdrawer.on{transform:none}
  .cdrawer .dh{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;align-items:center;gap:10px;z-index:2}
  .cdrawer .dh h3{font-size:16px;font-weight:800;flex:1}
  .cdrawer .dh .x{background:none;border:0;font-size:20px;color:var(--gris);cursor:pointer;line-height:1}
  .cdrawer .db{padding:16px 20px 90px}
  .fld{margin-bottom:13px} .fld label{display:block;font-size:11.5px;font-weight:700;color:var(--gris);margin-bottom:5px}
  .fld input,.fld select{width:100%;font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--ink);background:var(--surface)}
  .fld2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cdrawer .foot{position:fixed;bottom:0;right:0;width:min(440px,94vw);background:var(--surface);border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:10px}
  .cdrawer .foot button{flex:1;font-family:inherit;font-size:14.5px;font-weight:700;border:0;border-radius:10px;padding:12px;cursor:pointer}
  .cdrawer .foot .cancel{background:#EDF2F1;color:var(--gris)} .cdrawer .foot .ok{background:var(--teal);color:#fff}
  .miss{color:var(--coral);font-size:10px;font-weight:800;margin-left:4px}
  .hint{font-size:11px;color:var(--gris2);margin-top:4px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;max-width:90vw}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{background:var(--teal-deep)}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=3"></script>
<script src="../assets/metrics.js"></script>
<script>
const M=EYG.money, esc=EYG.esc;
const COLORS=["#048782","#EC8B5E","#0AA89F","#E5A93B","#5FC8BF","#B0413E","#6E8B86","#04635F"];
let COM=[], UIDS=[], DATA=[], TODAY=[], PRODS=[], FICHAS={}, chartTimer=null;
let PERFIL=null, LIDER=null;   // LIDER = {uid, name, empId, team:[{uid,name}]}
let PERIODO="hoy", SERIES={};  // período elegido para el gráfico + series por día/mes cacheadas
const MESES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const DIASSEM=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];

EYG.requireAuth(["lider","admin","direccion"], perfil=>{
  PERFIL=perfil;
  document.body.innerHTML = EYG.layout(perfil, "panel",

/* El equipo de un líder sale del ORGANIGRAMA de Odoo (hr.employee.parent_id): el líder
   es un empleado y sus comerciales son sus subordinados directos. No se hardcodea nada;
   el panel superior (admin) mueve ese parent_id y acá se refleja solo. */
async function resolverLider(name){
  const u = await EYG.rpc("res.users","search_read",[[["name","=",name]]],{fields:["id","name"]});
  if(!u.length) throw new Error('No encontré al líder "'+name+'" en Odoo.');
  const emp = await EYG.rpc("hr.employee","search_read",[[["user_id","=",u[0].id]]],{fields:["id","name","child_ids"]});
  if(!emp.length) throw new Error("El líder no tiene ficha de empleado en Odoo (hace falta para leer su equipo).");
  const childIds = emp[0].child_ids||[];
  let team=[];
  if(childIds.length){
    const subs = await EYG.rpc("hr.employee","read",[childIds,["name","user_id"]]);
    // sólo subordinados que son usuarios del sistema (tienen cuenta de vendedor)
    team = subs.filter(s=>s.user_id).map(s=>({uid:s.user_id[0], name:s.user_id[1]}));
  }
  return {uid:u[0].id, name:u[0].name, empId:emp[0].id, team};
}
/* Líderes = empleados con subordinados que tienen usuario. Para el selector de admin. */
async function listarLideres(){
  const emps = await EYG.rpc("hr.employee","search_read",[[["child_ids","!=",false]]],{fields:["id","name","user_id","child_ids"]});
  return emps.filter(e=>e.user_id && (e.child_ids||[]).length).map(e=>({uid:e.user_id[0], name:e.user_id[1], empId:e.id}));
}
async function boot(){
  const params=new URLSearchParams(location.search);
  // Un líder ve SU equipo (perfil.comercial_ref). Admin/dirección eligen con ?lider=Nombre.
  let liderName = PERFIL.rol==="lider" ? (PERFIL.comercial_ref||"") : (params.get("lider")||"");
  try{
    if(!liderName){
      const lideres = await listarLideres();
      if(lideres.length===1) liderName=lideres[0].name;
      else if(lideres.length===0){ ldErr("No hay líderes definidos en el organigrama de Odoo todavía."); return; }
      else return selectorLider(lideres);
    }
    LIDER = await resolverLider(liderName);
    if(!LIDER.team.length){ ldErr('El líder <b>'+esc(LIDER.name)+'</b> no tiene comerciales asignados. Asignáselos desde el panel superior.'); return; }
    COM = LIDER.team.map((c,i)=>({...c, color:COLORS[i%COLORS.length]}));

}

function argToday(){ return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Argentina/Buenos_Aires"}).format(new Date()); }
function argParts(s){ const d=new Date(s.replace(" ","T")+"Z");
  const p=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Argentina/Buenos_Aires",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(d);
  const g={}; p.forEach(x=>g[x.type]=x.value); return {date:`${g.year}-${g.month}-${g.day}`, hour:+g.hour, frac:(+g.hour)+(+g.minute)/60}; }
function nowFrac(){ const p=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Argentina/Buenos_Aires",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()); const g={}; p.forEach(x=>g[x.type]=x.value); return (+g.hour)+(+g.minute)/60; }

async function periodo(desde){
  const g=await EYG.rpc("sale.order","read_group",[[["user_id","in",UIDS],["state","in",["sale","done"]],["date_order",">=",desde]],["amount_untaxed:sum"],["user_id"]],{lazy:false});
  const m={}; for(const r of g){ if(r.user_id) m[r.user_id[0]]=r.amount_untaxed||0; } return m;
}
async function init(){
  try{
    // COM y UIDS ya vienen resueltos por boot() con el equipo del líder (organigrama Odoo).
    const y=argToday().slice(0,4), m=argToday().slice(0,7);
    const d=new Date(); const dow=(d.getDay()+6)%7; const lun=new Date(d); lun.setDate(d.getDate()-dow); const inicioSem=lun.toISOString().slice(0,10);
    const [aA,aM,aS]=await Promise.all([periodo(y+"-01-01"), periodo(m+"-01"), periodo(inicioSem)]);
    DATA=COM.map(c=>({...c, ano:aA[c.uid]||0, mes:aM[c.uid]||0, sem:aS[c.uid]||0, hoy:0, horas:new Array(24).fill(0)}));

async function refreshHoy(){
  const desde=new Date(Date.now()-30*3600*1000).toISOString().slice(0,10)+" 00:00:00";
  const ord=await EYG.rpc("sale.order","search_read",[[["user_id","in",UIDS],["state","in",["sale","done"]],["date_order",">=",desde]],["user_id","date_order","amount_untaxed"]],{limit:0});
  const t=argToday();
  TODAY=ord.map(o=>({uid:o.user_id&&o.user_id[0], amt:o.amount_untaxed||0, ...argParts(o.date_order)})).filter(o=>o.date===t);
  const byU={}; DATA.forEach(d=>{d.hoy=0; d.horas=new Array(24).fill(0); byU[d.uid]=d;});
  for(const o of TODAY){ const d=byU[o.uid]; if(d){ d.hoy+=o.amt; d.horas[o.hour]+=o.amt; } }
}

/* Serie temporal del equipo para el período: semana→por día, mes→por día, año→por mes.
   Odoo read_group agrupa por fecha y devuelve el rango exacto de cada bucket en __range. */
async function cargarSerie(p){
  if(SERIES[p]) return SERIES[p];
  const t=argToday(), y=t.slice(0,4), mo=t.slice(0,7);
  const dom=(desde,gran)=>EYG.rpc("sale.order","read_group",[[["user_id","in",UIDS],["state","in",["sale","done"]],["date_order",">=",desde+" 00:00:00"]],["amount_untaxed:sum"],["date_order:"+gran]],{lazy:false});
  const bucket=(g,gran)=>{ const m={}; g.forEach(r=>{ const rg=r.__range&&r.__range["date_order:"+gran]; const f=rg?rg.from.slice(0,10):null; if(f) m[f]=(m[f]||0)+(r.amount_untaxed||0); }); return m; };
  if(p==="sem"){
    const d=new Date(t+"T00:00:00"); const dow=(d.getDay()+6)%7; const lun=new Date(d); lun.setDate(d.getDate()-dow);
    const ini=lun.toISOString().slice(0,10); const m=bucket(await dom(ini,"day"),"day"); const arr=[];
    for(let i=0;i<7;i++){ const dd=new Date(lun); dd.setDate(lun.getDate()+i); const k=dd.toISOString().slice(0,10); arr.push({label:DIASSEM[i], val:m[k]||0, cur:k===t}); }
    return SERIES.sem=arr;
  }
  if(p==="mes"){
    const ini=mo+"-01"; const m=bucket(await dom(ini,"day"),"day");
    const [yy,mm]=mo.split("-").map(Number); const dim=new Date(yy,mm,0).getDate(); const arr=[];
    for(let dd=1;dd<=dim;dd++){ const k=`${mo}-${String(dd).padStart(2,"0")}`; arr.push({label:String(dd), val:m[k]||0, cur:k===t}); }
    return SERIES.mes=arr;
  }
  if(p==="ano"){
    const m=bucket(await dom(y+"-01-01","month"),"month"); const arr=[];
    for(let mm=1;mm<=12;mm++){ const k=`${y}-${String(mm).padStart(2,"0")}`; arr.push({label:MESES[mm-1], val:m[k+"-01"]||0, cur:k===mo}); }
    return SERIES.ano=arr;
  }
}
// gráfico de barras (semana/mes/año). viewBox normal para que las etiquetas no se deformen.
function barChart(series){
  const W=1000,H=230,PADB=28,PADT=12,PADL=6; const n=series.length||1;
  const max=Math.max(...series.map(s=>s.val),1);
  const bw=(W-PADL*2)/n; const gap=n>20?1.5:n>12?2.5:6;
  const bars=series.map((s,i)=>{ const h=(s.val/max)*(H-PADB-PADT); const x=PADL+i*bw+gap/2, yy=H-PADB-h, w=Math.max(1,bw-gap);
    return `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="${Math.min(3,w/2).toFixed(1)}" fill="${s.cur?'var(--coral)':'url(#gb)'}"><title>${esc(s.label)}: ${M(s.val)}</title></rect>`; }).join("");
  const step=n>24?Math.ceil(n/15):1;
  const labels=series.map((s,i)=>{ if(i%step!==0 && !s.cur) return ""; const x=PADL+i*bw+bw/2;
    return `<text x="${x.toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="12" fill="${s.cur?'var(--coral)':'#9AAcA8'}" font-weight="${s.cur?800:500}">${esc(s.label)}</text>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin-top:6px">
    <defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0AA89F"/><stop offset="1" stop-color="#7ad5cc"/></linearGradient></defs>
    ${bars}${labels}</svg>`;
}
const CHART_TIT={hoy:"Evolución de hoy",sem:"Ventas de la semana · por día",mes:"Ventas del mes · por día",ano:"Ventas del año · por mes"};
function chartHoy(){
  const orders=TODAY.slice().sort((a,b)=>a.frac-b.frac);
  const x0=7, x1=21; const W=1000, H=210, PADB=22;
  let cum=0; const pts=[[x0,0]];
  for(const o of orders){ cum+=o.amt; pts.push([Math.max(x0,Math.min(x1,o.frac)), cum]); }
  const nf=Math.max(x0,Math.min(x1,nowFrac())); pts.push([nf,cum]);
  const maxY=Math.max(cum,1);
  const X=f=>((f-x0)/(x1-x0))*W;
  const Y=v=>H-PADB-(v/maxY)*(H-PADB-8);
  const line=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
  const area=line+` L ${X(nf).toFixed(1)} ${H-PADB} L ${X(x0).toFixed(1)} ${H-PADB} Z`;
  const lastX=X(nf), lastY=Y(cum);
  const ticks=[]; for(let h=x0;h<=x1;h+=2){ ticks.push(`<text x="${X(h).toFixed(0)}" y="${H-6}" fill="#9AAcA8" font-size="11" text-anchor="middle">${h}h</text><line x1="${X(h)}" y1="0" x2="${X(h)}" y2="${H-PADB}" stroke="#EEF4F3"/>`); }
  return { tot:cum, totLbl:"acumulado del día", live:true,
    svg:`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:210px;display:block;margin-top:6px">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0AA89F" stop-opacity=".28"/><stop offset="1" stop-color="#0AA89F" stop-opacity="0"/></linearGradient></defs>
      ${ticks.join("")}
      <path d="${area}" fill="url(#g)"/>
      <path d="${line}" fill="none" stroke="#048782" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="9" fill="#22e0c6" opacity=".25"/>
      <circle class="neon" cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="5" fill="#22e0c6" style="filter:drop-shadow(0 0 6px #22e0c6)"/>
    </svg>` };
}

let SEL=null, AGG=null, FICHAS_LOADING=false, FICHAS_STALE=false;

/* Carga la ficha completa de cada comercial (nivel/salud/comisión/cartera) en paralelo,
   arma los promedios del equipo (AGG) para las comparativas, y repinta las tarjetas. */
async function cargarFichas(){
  FICHAS_LOADING=true; renderEquipo();
  const res=await Promise.all(COM.map(c=>fichaData(c.uid,c.name).then(d=>({uid:c.uid,d})).catch(()=>({uid:c.uid,d:null}))));
  res.forEach(r=>{ if(r.d) FICHAS[r.uid]=r.d; });
  computeAGG(); FICHAS_LOADING=false; renderEquipo();
}
// métricas comparables de una ficha
function mval(d,k){
  if(!d) return null;
  switch(k){
    case "factMes": return d.factMes||0;
    case "cobradoMes": return d.cobradoMes||0;
    case "actividad": return (d.actividadRatio||0)*100;
    case "nuevos": return d.nuevos||0;
    case "vencPct": return d.porCobrar>0?(d.vencido/d.porCobrar*100):0;
    case "fichas": return (d.fichasPct||0)*100;
    case "ticket": return d.avgTicket||0;
    case "salud": return d.salud?d.salud.salud:0;
    case "rent": return d.rentabilidad!=null?d.rentabilidad*100:null;
    case "cumpl": { const meta=(d.factBaseline||0)*1.3; return meta>0?d.factMes/meta*100:0; }
    case "ritmo": { const esp=(d.factBaseline||0)*(d.diaMesFrac||1); return esp>0?d.factMes/esp*100:100; }
    case "nivelPts": return d.nivel?d.nivel.pts:0;
  }
  return null;
}
const METR=[
  {k:"factMes", lab:"Facturado del mes", fmt:"money", higher:true},
  {k:"cobradoMes", lab:"Cobrado del mes", fmt:"money", higher:true},
  {k:"actividad", lab:"Actividad", fmt:"pct", higher:true},
  {k:"nuevos", lab:"Clientes nuevos", fmt:"num", higher:true},
  {k:"vencPct", lab:"Vencido de cartera", fmt:"pct", higher:false},
  {k:"fichas", lab:"Fichas completas", fmt:"pct", higher:true},
  {k:"ticket", lab:"Ticket promedio", fmt:"money", higher:true},
  {k:"salud", lab:"Salud de la cuenta", fmt:"pct", higher:true},
];
function fmtMetric(fmt,v){ if(v==null) return "—"; if(fmt==="money") return M(v); if(fmt==="pct") return Math.round(v)+"%"; return Math.round(v).toLocaleString("es-AR"); }
function computeAGG(){
  const ds=COM.map(c=>FICHAS[c.uid]).filter(Boolean);
  if(!ds.length){ AGG=null; return; }
  AGG={n:ds.length, avg:{}, best:{}, worst:{}};
  for(const m of METR){
    const vals=ds.map(d=>mval(d,m.k)).filter(v=>v!=null);
    if(!vals.length){ AGG.avg[m.k]=null; continue; }
    AGG.avg[m.k]=vals.reduce((s,x)=>s+x,0)/vals.length;
    AGG.best[m.k]=m.higher?Math.max(...vals):Math.min(...vals);
    AGG.worst[m.k]=m.higher?Math.min(...vals):Math.max(...vals);
  }
}
// ranking del equipo por facturado del mes (usa DATA que siempre está)

function ringSVG(pct,color,size){ size=size||38; const r=(size-6)/2, c=2*Math.PI*r, off=c*(1-Math.min(100,Math.max(0,pct))/100);

// ---- puntos fuertes / a mejorar / oportunidades (derivados de la ficha vs equipo) ----
function fortDeb(d){
  const fuertes=[], debiles=[];
  for(const m of METR){
    const v=mval(d,m.k), a=AGG&&AGG.avg[m.k]; if(v==null||a==null) continue;
    const mejor = m.higher ? v>=a*1.12 : v<=a*0.88;   // 12% mejor que el promedio
    const peor  = m.higher ? v<=a*0.85 : v>=a*1.20;
    const txt = `${m.lab}: <b>${fmtMetric(m.fmt,v)}</b> <span class="muted">(equipo ${fmtMetric(m.fmt,a)})</span>`;
    if(mejor) fuertes.push(txt); else if(peor) debiles.push(txt);
  }
  return {fuertes:fuertes.slice(0,4), debiles:debiles.slice(0,4)};
}
function oportunidades(d){
  if(d.perfil==="externo") return [];
  const ops=[];
  const vencPct=mval(d,"vencPct"), fichas=mval(d,"fichas"), cumpl=mval(d,"cumpl");
  const meta=(d.factBaseline||0)*1.3;
  // 1) vencido → recupera tasa de comisión (salud)
  if(vencPct>25){
    // comisión que recupera si la salud vuelve a 100 (el recorte es penaltyPt/100 de la tasa)
    const gain=(d.factMes||0)*(d.salud.penaltyPt/100)*(d.nivel.mult||1);
    ops.push({ic:"🩸",tx:`Bajar el <b>vencido</b> del ${Math.round(vencPct)}% a menos del 25% recupera salud y tasa de comisión.`, gain:gain>500?"+"+M(gain):""});
  }
  // 2) meta del mes
  if(cumpl<100 && meta>0){ const falta=Math.max(0,meta-d.factMes);
    ops.push({ic:"🎯",tx:`Va al <b>${Math.round(cumpl)}%</b> de su meta. Faltan <b>${M(falta)}</b> para el objetivo del mes.`, gain:""}); }
  // 3) nuevos
  if((d.nuevos||0)<3){ ops.push({ic:"🆕",tx:`Le faltan <b>${3-(d.nuevos||0)}</b> cliente(s) nuevo(s) para el objetivo (${d.nuevos||0}/3).`, gain:"+nivel"}); }
  // 4) fichas
  if(fichas<60){ ops.push({ic:"🗂️",tx:`Fichas al <b>${Math.round(fichas)}%</b> — completar datos sube la salud y destraba comisión.`, gain:""}); }
  // 5) combos (siempre palanca de nivel)
  ops.push({ic:"🎁",tx:`Colocar los <b>combos y ofertas</b> de la semana suma hasta 25 pts de nivel (multiplica toda la comisión).`, gain:"+nivel"});
  return ops.slice(0,4);
}
function cmpRow(d,m){
  const v=mval(d,m.k); if(v==null) return "";
  const a=AGG?AGG.avg[m.k]:null, best=AGG?AGG.best[m.k]:v;
  const scale=Math.max(v,best||0,a||0,m.fmt==="pct"?100:1)||1;
  const w=Math.min(100,v/scale*100), aw=a!=null?Math.min(100,a/scale*100):null;
  const bien = m.higher ? (a!=null&&v>=a) : (a!=null&&v<=a);
  const col = bien?'linear-gradient(90deg,var(--aqua),var(--teal))':'linear-gradient(90deg,#F0B49C,var(--coral))';
  return `<div class="cmprow"><div class="cl"><span>${m.lab}</span><b>${fmtMetric(m.fmt,v)}</b></div>
    <div class="track"><div class="fill" style="width:${w}%;background:${col}"></div>${aw!=null?`<div class="avg" data-l="equipo" style="left:${aw}%"></div>`:""}</div></div>`;
}

  if(!d){ host.innerHTML=`<div class="det"><div class="dbody"><div class="floading"><span class="spin-sm"></span> Cargando el análisis de ${esc(c?c.name:"")}…</div></div></div>`; return; }

async function fichaData(uid, name){
  const t=argToday(), y=t.slice(0,4), mo=t.slice(0,7), inicioMes=mo+"-01", inicioAno=y+"-01-01";
  const cartera=await EYG.rpc("res.partner","search",[[["user_id","=",uid]]]);
  const [facM,ncM,cobM,ml,facHist,cob3,nuevos,ord6,pf,mg,waMsgs]=await Promise.all([
    EYG.rpc("account.move","read_group",[[["partner_id","in",cartera],["move_type","=","out_invoice"],["state","=","posted"],["invoice_date",">=",inicioMes]],["amount_untaxed:sum"],[]],{lazy:false}),
    EYG.rpc("account.move","read_group",[[["partner_id","in",cartera],["move_type","=","out_refund"],["state","=","posted"],["invoice_date",">=",inicioMes]],["amount_untaxed:sum"],[]],{lazy:false}),
    EYG.rpc("account.payment","read_group",[[["partner_id","in",cartera],["payment_type","=","inbound"],["state","=","posted"],["date",">=",inicioMes]],["amount:sum"],[]],{lazy:false}),
    EYG.rpc("account.move.line","search_read",[[["partner_id","in",cartera],["account_id.account_type","=","asset_receivable"],["parent_state","=","posted"],["full_reconcile_id","=",false]]],{fields:["amount_residual","date_maturity"],limit:0}),
    EYG.rpc("account.move","search_read",[[["partner_id","in",cartera],["move_type","in",["out_invoice","out_refund"]],["state","=","posted"],["invoice_date",">=",EYG.hace(190)]]],{fields:["invoice_date","amount_untaxed","move_type"],limit:0}),
    EYG.rpc("account.payment","read_group",[[["partner_id","in",cartera],["payment_type","=","inbound"],["state","=","posted"],["date",">=",EYG.hace(100)]],["amount:sum"],[]],{lazy:false}),
    EYG.rpc("res.partner","search_count",[[["user_id","=",uid],["create_date",">=",inicioMes]]]),
    EYG.rpc("sale.order","search_read",[[["user_id","=",uid],["state","in",["sale","done"]],["date_order",">=",EYG.hace(190)]]],{fields:["partner_id","date_order","amount_untaxed"],limit:0}),
    EYG.rpc("res.partner","search_read",[[["user_id","=",uid]]],{fields:["vat","phone","mobile","email","street"],limit:0}),
    EYG.rpc("sale.order.line","read_group",[[["order_id.user_id","=",uid],["order_id.state","in",["sale","done"]],["order_id.date_order",">=",inicioAno]],["margin:sum","price_subtotal:sum"],[]],{lazy:false}),
    // mensajes WA confirmados de la semana sobre su cartera (para medir contactos por WhatsApp)
    EYG.rpc("mail.message","search_read",[[["model","=","res.partner"],["res_id","in",cartera],["date",">=",EYG.hace(7)+" 00:00:00"],"|",["body","like","EyGWA"],["body","like","EyGCRM"]]],{fields:["res_id","date","body"],limit:0}),
  ]);
  // WA: hoy (contactos distintos + mensajes + nuevo/seg) y semana
  const _wt=t.slice(0,10); const _pw=b=>{const s=(b||"").replace(/<[^>]+>/g,"");const m=s.match(/\[EyGWA\]\s*(\w+)\/(\w+)/);return m?m[2]:(/EyGCRM/.test(s)?"seg":null);};
  const _wm=(waMsgs||[]).map(x=>({res_id:x.res_id,date:(x.date||"").slice(0,10),ng:_pw(x.body)})).filter(x=>x.ng);
  const _wh=_wm.filter(x=>x.date===_wt);
  const waHoyMsg=_wh.length, waHoyCont=new Set(_wh.map(x=>x.res_id)).size, waHoyNuevo=_wh.filter(x=>x.ng==="nuevo").length, waSemMsg=_wm.length;
  const factMes=(facM[0]?.amount_untaxed||0)-(ncM[0]?.amount_untaxed||0), cobradoMes=cobM[0]?.amount||0;
  let porCobrar=0,vencido=0; for(const l of ml){const r=l.amount_residual||0; if(r>0){porCobrar+=r; if(l.date_maturity&&l.date_maturity<t)vencido+=r;}}
  const fbk={}; for(const x of facHist){const m=(x.invoice_date||"").slice(0,7); if(!m)continue; fbk[m]=(fbk[m]||0)+(x.move_type==="out_refund"?-1:1)*(x.amount_untaxed||0);}
  const fprev=Object.keys(fbk).filter(m=>m<mo); const factBaseline=fprev.length?fprev.reduce((s,m)=>s+fbk[m],0)/fprev.length:0;
  const objetivoCobro=(cob3[0]?.amount||0)/3*1.1;

  const prev=Object.keys(bk).filter(m=>m<mo), nP=prev.length||1;
  const promPed=Math.round(prev.reduce((s,m)=>s+bk[m].ped,0)/nP)||1, promCli=Math.round(prev.reduce((s,m)=>s+bk[m].cli.size,0)/nP)||1;
  const cur=bk[mo]||{ped:0,cli:new Set()};
  const actividadRatio=(Math.min(cur.ped/promPed,1)+Math.min((cur.cli.size||0)/promCli,1))/2;
  const avgTicket=cnt?sumTot/cnt:0;
  const compl=pf.filter(p=>p.vat&&(p.phone||p.mobile)&&p.email&&p.street).length, fichasPct=pf.length?compl/pf.length:0;
  const rentabilidad=(mg[0]&&mg[0].price_subtotal)?(mg[0].margin/mg[0].price_subtotal):null;
  const dd=new Date(), dim=new Date(dd.getFullYear(),dd.getMonth()+1,0).getDate(), diaMesFrac=dd.getDate()/dim;

  d.nivel=EYGM.nivel(d); d.salud=EYGM.salud(d); d.com=EYGM.comision(d);
  return d;
}

/* ===================== CONTACTOS DEL EQUIPO ===========================
   El líder ve y gestiona los contactos de SUS comerciales (y los propios, sin
   asignar todavía). Reasignar = escribir res.partner.user_id: mueve el cliente
   entero de cartera. Crear un contacto lo asigna al líder por defecto (después lo
   reparte). Espeja los campos y formateadores de panel.html para no divergir. */
const PFIELDS_C=["id","name","company_type","is_company","street","street2","city","zip","state_id","phone","mobile","email","vat","l10n_ar_afip_responsibility_type_id","l10n_latam_identification_type_id","category_id","customer_rank","user_id"];
const REQ=[{k:"name"},{k:"tel"},{k:"email"},{k:"street"},{k:"zip"},{k:"city"},{k:"state"},{k:"idtype"},{k:"vat"},{k:"fiscal"}];
const RUBROS=[{v:30,l:"Farmacia"},{v:32,l:"Sanatorio / Clínica"},{v:37,l:"Empresa de salud"},{v:33,l:"Institución / Mutual"},{v:34,l:"Distribuidora / Droguería"},{v:35,l:"Veterinaria"},{v:62,l:"SAMCO"}];
const RUBRO_MAP={28:30,29:30,30:30, 8:35,35:35, 7:34,34:34, 31:33,33:33,36:33, 20:32,32:32, 37:37, 62:62};
const ARCH_TAG=63;   // etiqueta res.partner.category "Archivado (Core)" — cola de revisión. Ver memoria eyg-archivado-contactos.
let CT={ list:[], sinAsig:[], q:"", filtro:"all", cat:{prov:[],idt:[],fiscal:[]}, cargado:false, edit:null };

const digits=s=>(s||"").replace(/\D/g,"");
function oracion(s){ s=(s||"").trim().replace(/\s+/g," "); if(!s) return ""; return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase(); }
function fmtTel(raw){ let d=digits(raw); if(!d) return "";
  if(d.startsWith("0054")) d=d.slice(4); if(d.startsWith("54")) d=d.slice(2); d=d.replace(/^0/,"");
  if(d.length>10) d=d.replace(/^(\d{2,4})15(\d{6,8})$/,"$1$2"); if(d.length<8) return raw.trim();
  let area,local; if(d.length===10){ if(d.startsWith("11")){area="11";local=d.slice(2);} else {area=d.slice(0,3);local=d.slice(3);} }
  else if(d.length===11){ area=d.slice(0,4);local=d.slice(4); } else return "+54 "+d;
  const ls = local.length>=8 ? local.slice(0,4)+"-"+local.slice(4) : local.slice(0,3)+"-"+local.slice(3);
  return "+54 "+area+" "+ls; }
const IDT={cuit:4,dni:5,cuil:6};
function fmtDoc(raw,idtypeId){ const d=digits(raw); if(!d) return "";
  if(idtypeId===IDT.dni){ if(d.length<7||d.length>8) return raw.trim(); return d.replace(/\B(?=(\d{3})+(?!\d))/g,"."); }
  if(idtypeId===IDT.cuit||idtypeId===IDT.cuil){ if(d.length!==11) return raw.trim(); return d.slice(0,2)+"-"+d.slice(2,10)+"-"+d.slice(10); }
  return raw.trim(); }
function completar(c){
  const has={name:!!c.name,tel:!!(c.phone||c.mobile),email:!!c.email,street:!!c.street,zip:!!c.zip,city:!!c.city,
    state:!!(c.state_id&&c.state_id[0]),idtype:!!(c.l10n_latam_identification_type_id&&c.l10n_latam_identification_type_id[0]),
    vat:!!c.vat,fiscal:!!(c.l10n_ar_afip_responsibility_type_id&&c.l10n_ar_afip_responsibility_type_id[0])};
  return {has, pct:Math.round(REQ.filter(r=>has[r.k]).length/REQ.length*100)};
}
function rubroActual(c){ for(const t of (c.category_id||[])) if(RUBRO_MAP[t]) return RUBRO_MAP[t]; return ""; }

// dueños posibles = el líder + sus comerciales (para asignar/reasignar)
function duenos(){ return [{uid:LIDER.uid,name:LIDER.name,color:"#0E5C58",lider:true}, ...COM.map(c=>({uid:c.uid,name:c.name,color:c.color}))]; }
function dueno(uid){ return duenos().find(d=>d.uid===uid) || {uid:null,name:"Sin asignar",color:"#B0413E"}; }

async function cargarContactos(){
  const owners=[LIDER.uid,...UIDS];
  const [list,sinAsig,fiscal,idt,prov]=await Promise.all([
    EYG.rpc("res.partner","search_read",[[["user_id","in",owners],["customer_rank",">",0],["category_id","not in",[ARCH_TAG]]]],{fields:PFIELDS_C,limit:0}),
    // pool GLOBAL de contactos sin comercial asignado (para repartir al equipo), sin los archivados
    EYG.rpc("res.partner","search_read",[[["user_id","=",false],["customer_rank",">",0],["category_id","not in",[ARCH_TAG]]]],{fields:PFIELDS_C,limit:0}),
    EYG.rpc("l10n_ar.afip.responsibility.type","search_read",[[]],{fields:["id","name"]}),
    EYG.rpc("l10n_latam.identification.type","search_read",[[["active","=",true]]],{fields:["id","name"]}),
    EYG.rpc("res.country.state","search_read",[[["country_id.code","=","AR"]]],{fields:["id","name"],limit:0}),
  ]);
  CT.list=list; CT.sinAsig=sinAsig; CT.cat={prov,idt,fiscal}; CT.cargado=true;
}
async function renderContactos(){
  const v=document.getElementById("vista"); if(!v)return;
  if(!CT.cargado){
    v.innerHTML='<div class="floading"><span class="spin-sm"></span> Cargando los contactos del equipo…</div>';
    try{ await cargarContactos(); }catch(e){ v.innerHTML='<div class="errbox">No pude leer los contactos: '+esc(e.message)+'</div>'; return; }
    if(VISTA!=="contactos") return;
  }
  // conteo por dueño
  const cnt={}; CT.list.forEach(c=>{ const u=c.user_id?c.user_id[0]:0; cnt[u]=(cnt[u]||0)+1; });
  const sinN=CT.sinAsig.length;
  const chips=[`<div class="cchip ${CT.filtro==='all'?'on':''}" onclick="setCFiltro('all')">Todos <b>${CT.list.length}</b></div>`]
    .concat(duenos().map(d=>`<div class="cchip ${CT.filtro==d.uid?'on':''}" onclick="setCFiltro(${d.uid})"><span class="c" style="background:${d.color}"></span>${esc(d.name.split(" ")[0])}${d.lider?' (líder)':''} <b>${cnt[d.uid]||0}</b></div>`))
    .concat([`<div class="cchip sin ${CT.filtro==='sinasig'?'on':''}" onclick="setCFiltro('sinasig')" title="Clientes sin comercial asignado — repartilos a tu equipo">🕳️ Sin asignar <b>${sinN}</b></div>`]).join("");
  const q=CT.q.trim().toLowerCase();
  const enSin = CT.filtro==="sinasig";
  let arr=(enSin?CT.sinAsig:CT.list).slice();
  if(!enSin && CT.filtro!=="all") arr=arr.filter(c=>(c.user_id?c.user_id[0]:0)===CT.filtro);
  if(q) arr=arr.filter(c=>((c.name||"")+" "+(c.city||"")+" "+(c.vat||"")).toLowerCase().includes(q));
  arr.sort((a,b)=>completar(a).pct-completar(b).pct);  // incompletos primero
  v.innerHTML=`
    <div class="cfilters">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="cq" placeholder="Buscar por nombre, localidad o CUIT…" value="${esc(CT.q)}" oninput="cbuscar(this.value)"></div>
      <button class="newbtn" onclick="nuevoContacto()">＋ Nuevo contacto</button>
    </div>
    <div class="cfilters">${chips}</div>
    ${enSin?`<div class="sinbanner">Estos <b>${sinN}</b> clientes no tienen comercial. Elegí un comercial en cada tarjeta para sumarlos a tu equipo.</div>`:""}
    ${arr.length?`<div class="clist">${arr.map(ccard).join("")}</div>`
      :`<div class="cempty">No hay contactos${enSin?' sin asignar':CT.filtro!=='all'?' para este filtro':''}${q?' que coincidan con la búsqueda':''}.${enSin?'':'<br>Podés crear uno con <b>＋ Nuevo contacto</b>.'}</div>`}`;
  const inp=document.getElementById("cq"); if(inp&&q){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); }
}
window.cbuscar = EYG.buscador ? EYG.buscador(v=>{ CT.q=v; renderContactos(); }) : (v=>{ CT.q=v; renderContactos(); });
function setCFiltro(f){ CT.filtro=f; renderContactos(); }
function ccard(c){
  const comp=completar(c); const own=dueno(c.user_id?c.user_id[0]:null);
  const tipoEmpresa=(c.is_company||c.company_type==="company");
  const col=comp.pct>=100?'var(--teal)':comp.pct>=60?'var(--teal-med)':comp.pct>=30?'var(--gold)':'var(--coral)';
  const tel=c.phone||c.mobile;
  return `<div class="cc">
    <div class="top"><div class="nm">${esc(c.name||'(sin nombre)')}</div><span class="tipo">${tipoEmpresa?'Empresa':'Persona'}</span></div>
    <div class="meta">
      ${tel?`<span class="mi">📞 ${esc(fmtTel(tel))}</span>`:'<span class="mi" style="color:var(--coral)">📞 sin teléfono</span>'}
      ${c.city?`<span class="mi">📍 ${esc(c.city)}${c.state_id?', '+esc(c.state_id[1]):''}</span>`:''}
      ${c.vat?`<span class="mi">🪪 ${esc(c.vat)}</span>`:''}
    </div>
    <div class="pct"><i style="width:${comp.pct}%;background:${col}"></i></div>
    <div style="font-size:11px;color:var(--gris2)">Ficha ${comp.pct}% completa</div>
    <div class="asig"><span class="dc" style="background:${own.color}"></span><span>${own.uid==null?'Asignar a':'Asignado a'}</span>
      <select onchange="reasignar(${c.id}, this.value)" style="flex:1;font-family:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:5px 7px;color:var(--ink);background:var(--surface)">
        ${own.uid==null?'<option value="" selected disabled>— sin asignar —</option>':''}
        ${duenos().map(d=>`<option value="${d.uid}" ${own.uid===d.uid?'selected':''}>${esc(d.name)}${d.lider?' (líder)':''}</option>`).join("")}
      </select>
    </div>
    <div class="acts">
      <button class="prim" onclick="editarContacto(${c.id})">✎ Editar</button>
      <button onclick="archivar(${c.id})" title="Archivar (sale de la lista, no se elimina)">🗂️ Archivar</button>
      <a href="https://drogueriaeyg.odoo.com/web#id=${c.id}&model=res.partner&view_type=form" target="_blank">Odoo ↗</a>
    </div>
  </div>`;
}
async function reasignar(id, uidStr){
  const uid=parseInt(uidStr,10); if(!uid) return;
  let c=CT.list.find(x=>x.id===id), desdeSin=false;
  if(!c){ c=CT.sinAsig.find(x=>x.id===id); desdeSin=true; }
  if(!c)return;
  const t=dueno(uid); const prev=c.user_id;
  c.user_id=[uid,t.name];   // optimista
  try{
    await EYG.rpc("res.partner","write",[[id],{user_id:uid}]);
    if(desdeSin){ CT.sinAsig=CT.sinAsig.filter(x=>x.id!==id); CT.list.push(c); }  // sale del pool, entra al equipo
    FICHAS_STALE=true;   // cambió la cartera: al volver a Rendimiento se recalcula
    toast((desdeSin?"Asignado a ":"Reasignado a ")+t.name+" ✓", true);
    renderContactos();
  }catch(e){ c.user_id=prev; toast("No se pudo asignar: "+e.message); renderContactos(); }
}
/* Archivar = marca suave (etiqueta 63): sale de la lista del líder y entra a la cola de
   revisión de la gerencia. NO se elimina ni se desactiva en Odoo. Ver memoria. */
async function archivar(id){
  const c=CT.list.find(x=>x.id===id)||CT.sinAsig.find(x=>x.id===id); if(!c)return;
  if(!confirm('¿Archivar «'+(c.name||"este contacto")+'»?\n\nSale de tu lista y queda para revisión de la gerencia. No se elimina.')) return;
  try{
    await EYG.rpc("res.partner","write",[[id],{category_id:[[4,ARCH_TAG]]}]);
    try{ await EYG.rpc("res.partner","message_post",[[id]],{body:"🗂️ [EyG-ARCH] Archivado por "+LIDER.name, message_type:"comment"}); }catch(e){}
    CT.list=CT.list.filter(x=>x.id!==id); CT.sinAsig=CT.sinAsig.filter(x=>x.id!==id);
    toast("Archivado ✓ — queda para revisión de la gerencia", true);
    renderContactos();
  }catch(e){ toast("No se pudo archivar: "+e.message); }
}

// ---- Drawer: crear / editar contacto ----
function nuevoContacto(){ abrirDrawer({id:null,company_type:"person",category_id:[]}, true); }
function editarContacto(id){ const c=CT.list.find(x=>x.id===id); if(c) abrirDrawer(c,false); }
function optSel(cat,sel,ph){ return `<option value="">${ph||'— elegir —'}</option>`+cat.map(o=>`<option value="${o.id}" ${sel&&(Array.isArray(sel)?sel[0]===o.id:sel===o.id)?'selected':''}>${esc(o.name)}</option>`).join(""); }
function abrirDrawer(c,isNew){
  CT.edit={id:c.id,isNew};
  const comp=completar(c); const tipo=(c.is_company||c.company_type==="company")?"company":"person";
  const rubroSel=rubroActual(c);
  const asignados=duenos();
  const asigDefault=isNew?LIDER.uid:(c.user_id?c.user_id[0]:LIDER.uid);
  const d=document.getElementById("cdrawer");
  d.innerHTML=`
    <div class="dh"><button class="x" onclick="cerrarDrawer()">✕</button><h3>${isNew?'Nuevo contacto':esc(c.name||'Editar ficha')}</h3></div>
    <div class="db">
      ${isNew?'':`<div class="hint" style="margin-bottom:12px">Ficha ${comp.pct}% completa · completá lo que falte.</div>`}
      <div class="fld"><label>Asignar a</label><select id="c_owner">${asignados.map(a=>`<option value="${a.uid}" ${asigDefault===a.uid?'selected':''}>${esc(a.name)}${a.lider?' (líder)':''}</option>`).join("")}</select>
        <div class="hint">${isNew?'Por defecto queda para vos (líder); después lo repartís.':'Cambiar acá mueve el cliente de cartera.'}</div></div>
      <div class="fld"><label>Tipo</label><select id="c_type" onchange="cTipo()">
        <option value="person" ${tipo!=='company'?'selected':''}>Persona</option><option value="company" ${tipo==='company'?'selected':''}>Empresa</option></select></div>
      <div class="fld"><label id="c_lblname">${tipo==='company'?'Razón social':'Apellido y nombre'} ${comp.has.name||isNew?'':'<span class="miss">falta</span>'}</label>
        <input id="c_name" value="${esc(c.name||'')}" placeholder="${tipo==='company'?'Ej: Farmacia del Sol S.R.L.':'Ej: Pérez, Juan'}">
        <div class="hint" id="c_hintname">${tipo==='company'?'Nombre tipo oración + sufijo (SRL, SAS…)':'Formato: Apellido, Nombre.'}</div></div>
      <div class="fld"><label>Rubro</label><select id="c_rubro"><option value="">— elegir rubro —</option>${RUBROS.map(r=>`<option value="${r.v}" ${rubroSel===r.v?'selected':''}>${esc(r.l)}</option>`).join("")}</select></div>
      <div class="fld"><label>Teléfono ${comp.has.tel||isNew?'':'<span class="miss">falta</span>'}</label>
        <input id="c_phone" value="${esc(c.phone||c.mobile||'')}" oninput="cPrevTel()" placeholder="0341 155033943">
        <div class="hint" id="c_prevtel">Área sin 0, celular sin 15. Se guarda formateado.</div></div>
      <div class="fld"><label>Email ${comp.has.email||isNew?'':'<span class="miss">falta</span>'}</label><input id="c_email" value="${esc(c.email||'')}" placeholder="nombre@dominio.com"></div>
      <div class="fld"><label>Dirección ${comp.has.street||isNew?'':'<span class="miss">falta</span>'}</label><input id="c_street" value="${esc(c.street||'')}" placeholder="San martín 1234"></div>
      <div class="fld2">
        <div class="fld"><label>Código postal ${comp.has.zip||isNew?'':'<span class="miss">falta</span>'}</label><input id="c_zip" value="${esc(c.zip||'')}" placeholder="2000"></div>
        <div class="fld"><label>Localidad ${comp.has.city||isNew?'':'<span class="miss">falta</span>'}</label><input id="c_city" value="${esc(c.city||'')}" placeholder="Rosario"></div>
      </div>
      <div class="fld"><label>Provincia ${comp.has.state||isNew?'':'<span class="miss">falta</span>'}</label><select id="c_state">${optSel(CT.cat.prov,c.state_id,'— provincia —')}</select></div>
      <div class="fld2">
        <div class="fld"><label>Tipo de doc ${comp.has.idtype||isNew?'':'<span class="miss">falta</span>'}</label><select id="c_idtype" onchange="cPrevDoc()">${optSel(CT.cat.idt,c.l10n_latam_identification_type_id,'— tipo —')}</select></div>
        <div class="fld"><label>Número ${comp.has.vat||isNew?'':'<span class="miss">falta</span>'}</label><input id="c_vat" value="${esc(c.vat||'')}" oninput="cPrevDoc()" placeholder="20-12345678-9"><div class="hint" id="c_prevdoc"></div></div>
      </div>
      <div class="fld"><label>Condición fiscal (AFIP) ${comp.has.fiscal||isNew?'':'<span class="miss">falta</span>'}</label><select id="c_fiscal">${optSel(CT.cat.fiscal,c.l10n_ar_afip_responsibility_type_id,'— condición —')}</select></div>
    </div>
    <div class="foot"><button class="cancel" onclick="cerrarDrawer()">Cancelar</button><button class="ok" id="c_save" onclick="guardarContacto()">${isNew?'Crear contacto':'Guardar ficha'}</button></div>`;
  d.classList.add("on"); document.getElementById("scrim").classList.add("on");
  cPrevTel(); cPrevDoc();
}
function cerrarDrawer(){ const d=document.getElementById("cdrawer"); if(d)d.classList.remove("on"); const s=document.getElementById("scrim"); if(s)s.classList.remove("on"); CT.edit=null; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape")cerrarDrawer(); });
function cTipo(){ const t=document.getElementById("c_type").value;
  document.getElementById("c_lblname").innerHTML=(t==='company'?'Razón social':'Apellido y nombre');
  document.getElementById("c_hintname").textContent=(t==='company'?'Nombre tipo oración + sufijo (SRL, SAS…)':'Formato: Apellido, Nombre.');
  document.getElementById("c_name").placeholder=(t==='company'?'Ej: Farmacia del Sol S.R.L.':'Ej: Pérez, Juan'); }
function cPrevTel(){ const v=document.getElementById("c_phone").value; const el=document.getElementById("c_prevtel"); if(el)el.textContent=v?('Se guardará: '+fmtTel(v)):'Área sin 0, celular sin 15.'; }
function cPrevDoc(){ const t=parseInt(document.getElementById("c_idtype").value||0,10); const v=document.getElementById("c_vat").value; const el=document.getElementById("c_prevdoc"); if(el)el.textContent=v?('→ '+fmtDoc(v,t)):''; }
async function guardarContacto(){
  if(!CT.edit)return; const btn=document.getElementById("c_save"); btn.disabled=true; btn.textContent="Guardando…";
  const val=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
  const num=id=>{const x=val(id);return x?parseInt(x,10):false;};
  const idtype=num("c_idtype"), owner=num("c_owner")||LIDER.uid;
  const vals={ company_type:val("c_type"), name:val("c_name"),
    phone: val("c_phone")?fmtTel(val("c_phone")):false, mobile:false,
    email: val("c_email")||false, street: val("c_street")?oracion(val("c_street")):false,
    zip: val("c_zip")||false, city: val("c_city")?oracion(val("c_city")):false,
    state_id: num("c_state"), l10n_latam_identification_type_id: idtype,
    vat: val("c_vat")?fmtDoc(val("c_vat"),idtype):false,
    l10n_ar_afip_responsibility_type_id: num("c_fiscal"), user_id: owner };
  const rubro=num("c_rubro"); if(rubro) vals.category_id=[[4,rubro]];
  if(!vals.name){ btn.disabled=false; btn.textContent=CT.edit.isNew?"Crear contacto":"Guardar ficha"; toast("⚠️ Falta el nombre"); return; }
  try{
    let id=CT.edit.id;
    if(CT.edit.isNew){ id=await EYG.rpc("res.partner","create",[vals]); }
    else { await EYG.rpc("res.partner","write",[[id],vals]); }
    const fresh=(await EYG.rpc("res.partner","read",[[id]],{fields:PFIELDS_C}))[0];
    const i=CT.list.findIndex(x=>x.id===id);
    if(i>=0) CT.list[i]=fresh; else CT.list.push(fresh);
    FICHAS_STALE=true;   // la cartera pudo cambiar
    cerrarDrawer();
    toast(CT.edit&&CT.edit.isNew?"🎉 Contacto creado ✓":"Ficha guardada ✓", true);
    renderContactos();
  }catch(e){ btn.disabled=false; btn.textContent=CT.edit&&CT.edit.isNew?"Crear contacto":"Guardar ficha"; toast("⚠️ No se pudo guardar: "+e.message); }
}
</script>
</body>
