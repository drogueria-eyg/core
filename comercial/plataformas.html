<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataformas · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css?v=79">
<style>
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--teal-deep);font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:9px}
  h2.sec:before{content:"";width:5px;height:16px;background:var(--teal);border-radius:3px}
  h2.sec .ayuda{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--gris2)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:18px}

  .nota{background:var(--agua);border:1px solid #BFE0DC;border-left:4px solid var(--teal);border-radius:10px;padding:12px 15px;font-size:13px;color:#245C57;line-height:1.6;margin-bottom:16px}
  .nota b{color:var(--teal-deep)}
  .nota.aviso{background:var(--warnbg);border-color:#E7CE9A;border-left-color:var(--warn);color:#7A5310}
  .nota.aviso b{color:var(--warn)}

  /* ---- fila de indicadores ---- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:13px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .lb{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--gris2);font-weight:800}
  .kpi .vl{font-size:31px;font-weight:900;line-height:1.05;margin-top:7px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
  .kpi .vl.t{color:var(--teal-deep)}
  .kpi .sub{font-size:12px;color:var(--gris);margin-top:5px;line-height:1.4}

  /* ---- barras verticales (evolución) ---- */
  .ev{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:end;min-height:190px;padding:6px 4px 0}
  .ev .mes{display:flex;flex-direction:column;align-items:center;gap:8px}
  .ev .barras{display:flex;gap:5px;align-items:flex-end;height:150px}
  .ev .b{width:26px;border-radius:5px 5px 0 0;position:relative;min-height:3px}
  .ev .b.ped{background:var(--teal)}
  .ev .b.ren{background:var(--aqua)}
  .ev .b .n{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;color:var(--gris);white-space:nowrap;font-variant-numeric:tabular-nums}
  .ev .et{font-size:11.5px;font-weight:700;color:var(--gris);text-align:center}
  .ev .et small{display:block;font-weight:500;color:var(--gris2);font-size:10.5px}
  .leg{display:flex;gap:16px;justify-content:center;margin-top:14px;font-size:12px;color:var(--gris);font-weight:600}
  .leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  /* ---- barras horizontales (clientes) ---- */
  .rank{display:flex;flex-direction:column;gap:9px}
  .rk{display:grid;grid-template-columns:minmax(0,190px) 1fr 44px;gap:12px;align-items:center}
  .rk .nm{font-size:12.5px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rk .pista{background:#EEF4F3;border-radius:6px;height:18px;overflow:hidden}
  .rk .fill{height:100%;background:var(--teal);border-radius:6px}
  .rk .fill.b{background:var(--aqua)}
  .rk .vl{font-size:12.5px;font-weight:800;color:var(--teal-deep);text-align:right;font-variant-numeric:tabular-nums}
  @media(max-width:620px){ .rk{grid-template-columns:minmax(0,130px) 1fr 38px} }

  /* ---- estados ---- */
  .est{display:flex;gap:10px;flex-wrap:wrap}
  .es{flex:1;min-width:150px;border:1px solid var(--line);border-radius:11px;padding:13px 15px;background:var(--surface)}
  .es .n{font-size:24px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .es .t{font-size:12px;font-weight:700;color:var(--gris);margin-top:5px}
  .es .p{font-size:11.5px;color:var(--gris2);margin-top:2px}
  .es.ok .n{color:var(--ok)} .es.neu .n{color:var(--gris)} .es.esp .n{color:var(--warn)}

  /* ---- embudo de renglones ---- */
  .emb{display:flex;flex-direction:column;gap:11px}
  .paso{display:grid;grid-template-columns:132px 1fr;gap:13px;align-items:center}
  .paso .lb{font-size:12px;font-weight:700;color:var(--gris);text-align:right}
  .paso .bar{height:30px;border-radius:8px;display:flex;align-items:center;padding:0 11px;color:#fff;font-size:13px;font-weight:800;min-width:56px;font-variant-numeric:tabular-nums}
  .paso .bar.p1{background:var(--teal-deep)}
  .paso .bar.p2{background:var(--teal-med)}
  .paso .bar.p3{background:var(--ok)}
  .caso{border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:13px;background:var(--surface)}
  .caso .hd{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:13px;padding-bottom:11px;border-bottom:1px solid var(--line)}
  .caso .hd .id{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--teal-deep);font-weight:700}
  .caso .hd .cl{font-size:13px;font-weight:700;color:var(--ink)}
  .caso .hd .ti{font-size:12px;color:var(--gris)}

  /* ---- pendiente ---- */
  .pend{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px}
  .pz{border:1px dashed var(--line);border-radius:12px;padding:15px 16px;background:#FAFDFC}
  .pz b{display:block;font-size:13px;color:var(--ink);margin-bottom:5px}
  .pz p{font-size:12.5px;color:var(--gris);line-height:1.5}
  .pz .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:#EEF2F1;color:var(--gris2);margin-bottom:8px}

  .tabs{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
  .tab{font-size:13px;padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;color:var(--gris);font-family:inherit}
  .tab:hover{border-color:var(--teal)}
  .tab.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .tab[disabled]{opacity:.5;cursor:not-allowed}
  .tab[disabled]:hover{border-color:var(--line)}

  .corte{font-size:11.5px;color:var(--gris2);margin-top:22px;text-align:center;line-height:1.6}
  .spin{width:30px;height:30px;border:4px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite;margin:34px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=79"></script>
<script>
/* ============================================================
   PLATAFORMAS — cómo nos va en los portales de compras de salud
   ============================================================
   Para qué existe: EyG cotiza en portales donde los hospitales publican
   pedidos (Bionexo y Portada Salud). Hasta ahora no había forma de ver cómo
   nos iba: cuánto cotizamos, cuánto ganamos, contra quién, en qué productos.
   Cada cotización moría en la plataforma.

   LOS DOS NÚMEROS QUE MANDAN — y que miden cosas distintas:

     · Tasa de respuesta = renglones cotizados / renglones pedidos.
       Mide PRESENCIA. Si está baja, faltan HORAS: se pierde sin competir.

     · Tasa de éxito = renglones ganados / renglones cotizados.
       Mide PRECIO. Si está baja, competimos y perdemos.

   Confundirlas es el error clásico ("perdimos"), porque se arreglan de
   maneras opuestas: una con tiempo, la otra con margen.

   DE DÓNDE SALEN LOS DATOS (v1, 15/09/2026)
   Bionexo no dio credenciales de API, así que el historial se lee navegando
   la web con la sesión del proveedor. La plataforma FRENA si se le piden
   muchas páginas seguidas (medido: después de ~60 consultas dejó de
   responder), por eso el recolector no puede correr acá adentro: va aparte,
   despacio y sostenido, guardando a medida que avanza.

   Mientras tanto este v1 muestra lo YA medido, que es el índice completo de
   las 260 cotizaciones. El detalle renglón por renglón está medido sólo en
   una muestra de 2 pedidos y se señala como tal en pantalla: NUNCA se
   extrapola una muestra al total, se muestra lo que hay.

   CUANDO EXISTA LA TABLA: crear `bionexo_cotizaciones` en Supabase (el SQL
   está en el repo) y reemplazar leerDatos() por la consulta. El resto del
   módulo no cambia: ya lee todo desde el objeto que devuelve esa función.
   ============================================================ */
const esc = EYG.esc;
const nf = n => Math.round(n||0).toLocaleString("es-AR");
const pct = (a,b) => b ? (a*100/b) : 0;
const fpct = (a,b) => b ? (Math.round(pct(a,b)*10)/10).toString().replace(".",",")+"%" : "—";

/* ---------------------------------------------------------------
   DATOS v1 — medidos el 15/09/2026 sobre la cuenta de proveedor.
   El índice (260 cotizaciones / 10.897 renglones) está COMPLETO.
   El detalle por renglón es una MUESTRA de 2 pedidos: se muestra
   como muestra, no se proyecta.
   --------------------------------------------------------------- */
const SEMILLA = {
  corte: "15/09/2026",
  fuente: "Transacciones de Venta · Bionexo Argentina",
  indiceCompleto: true,
  totales: { cotizaciones:260, renglones:10897, confirmadas:98, cerradas:158, pendientes:4 },
  tipos:   { normal:227, urgencia:31, pdc:2 },
  meses: [
    { m:"Junio",      ped:49, ren:1708, parcial:false },
    { m:"Julio",      ped:83, ren:3530, parcial:false },
    { m:"Agosto",     ped:79, ren:4045, parcial:false },
    { m:"Septiembre", ped:49, ren:1614, parcial:true  }
  ],
  clientes: [
    { nm:"Aurea Med (Sanatorio Centro)",      n:52 },
    { nm:"Hospital Privado de Rosario",       n:32 },
    { nm:"Grupo Gamma (Compras)",             n:30 },
    { nm:"Instituto Gamma",                   n:20 },
    { nm:"Sanatorio Primordial",              n:19 },
    { nm:"CEDYCA — AMR Salud",                n:18 },
    { nm:"Policlínicos Unión (Delta)",        n:14 },
    { nm:"Sanatorio Garay",                   n:13 },
    { nm:"RED AMR — Fideicomiso",             n:10 },
    { nm:"RED AMR — Hospital Español",        n:10 },
    { nm:"Sanatorio San Martín",              n:8  },
    { nm:"Sanatorio Regional Totoras",        n:8  }
  ],
  muestras: [
    { id:"18638486", cl:"RED AMR — Fideicomiso", ti:"Descartables",
      ren:133, cot:30, gan:1, rech:124, pend:7, canc:1 },
    { id:"18780079", cl:"Grupo Gamma", ti:"Urgencia · Medicamentos",
      ren:4, cot:1, gan:0, rech:4, pend:0, canc:0 }
  ],
  catalogo: { enBionexo:1967, distintosEnMuestra:793, pedidosDeLaMuestra:30 }
};

/* Puerta única de datos. Hoy devuelve la semilla; cuando exista la tabla en
   Supabase, acá se cambia por la consulta y el resto del módulo sigue igual. */
async function leerDatos(){ return SEMILLA; }

let D = null;

/* ---------------- arranque ---------------- */
EYG.guard(["lider","admin","direccion"]).then(async perfil=>{
  document.body.innerHTML = EYG.layout(perfil,"plataformas", `<div id="cap"><div class="spin"></div></div>`, "Plataformas");
  D = await leerDatos();
  render();
});

/* ---------------- pintado ---------------- */
function render(){
  const T = D.totales;
  const renMuestra = D.muestras.reduce((s,x)=>s+x.ren,0);
  const cotMuestra = D.muestras.reduce((s,x)=>s+x.cot,0);
  const ganMuestra = D.muestras.reduce((s,x)=>s+x.gan,0);

  document.getElementById("cap").innerHTML = `
    <div class="tabs">
      <button class="tab on">Bionexo</button>
      <button class="tab" disabled title="Todavía no relevado">Portada Salud</button>
    </div>

    <div class="nota">
      <b>Cómo leer esto.</b> Arriba están las cotizaciones que EyG respondió en Bionexo entre junio y septiembre.
      Más abajo, lo que pasó adentro de cada una: cuántos renglones se llegaron a cotizar y cuántos se ganaron.
      Son dos cosas distintas — no cotizar un renglón es perderlo sin competir.
    </div>

    ${kpis(T)}

    <h2 class="sec">Evolución <span class="ayuda">cotizaciones respondidas y renglones, por mes</span></h2>
    <div class="card pad">${evolucion(D.meses)}</div>

    <h2 class="sec">Cómo terminaron <span class="ayuda">estado final de las 260 cotizaciones</span></h2>
    ${estados(T)}

    <h2 class="sec">Clientes <span class="ayuda">quién nos pide más, en cantidad de cotizaciones</span></h2>
    <div class="card pad"><div class="rank">${ranking(D.clientes)}</div></div>

    <h2 class="sec">Qué pasa adentro de un pedido <span class="ayuda">muestra medida, no proyectada</span></h2>
    <div class="nota aviso">
      <b>Ojo: esto es una muestra de ${D.muestras.length} pedidos, no el total.</b>
      El detalle renglón por renglón de las 260 cotizaciones está pendiente de recolección —
      Bionexo frena si se le piden muchas páginas seguidas, así que se levanta de a poco.
      Lo que se ve acá es real y está medido, pero no representa todavía a toda la cartera.
    </div>
    ${D.muestras.map(caso).join("")}
    <div class="card pad">
      <div class="emb">
        ${paso("Renglones pedidos", renMuestra, renMuestra, "p1")}
        ${paso("Los cotizamos", cotMuestra, renMuestra, "p2")}
        ${paso("Los ganamos", ganMuestra, renMuestra, "p3")}
      </div>
      <div class="leg" style="margin-top:16px">
        <span>Tasa de respuesta <b style="color:var(--teal-deep)">${fpct(cotMuestra,renMuestra)}</b></span>
        <span>Tasa de éxito <b style="color:var(--teal-deep)">${fpct(ganMuestra,cotMuestra)}</b></span>
      </div>
    </div>

    <h2 class="sec">El catálogo no alcanza</h2>
    <div class="card pad">
      <p style="font-size:14px;line-height:1.65;color:var(--gris);margin:0">
        En apenas <b style="color:var(--ink)">${D.catalogo.pedidosDeLaMuestra} pedidos</b> los clientes pidieron
        <b style="color:var(--ink)">${nf(D.catalogo.distintosEnMuestra)} productos distintos</b>.
        En Bionexo hay cargados <b style="color:var(--ink)">${nf(D.catalogo.enBionexo)}</b> productos de EyG, muchos sin actualizar desde 2025.
        Cada producto que EyG vende y la plataforma no reconoce es un renglón que no se puede cotizar bien.
      </p>
    </div>

    <h2 class="sec">Lo que falta</h2>
    <div class="pend">
      <div class="pz"><span class="tag">En marcha</span><b>Detalle de las 260</b>
        <p>Recolectar renglón por renglón todo el historial para saber qué productos ganamos siempre y cuáles perdemos siempre. Va lento a propósito.</p>
        <p style="margin-top:8px"><a href="recolector.html" style="font-weight:700">Abrir el recolector →</a></p></div>
      <div class="pz"><span class="tag">Sin verificar</span><b>Precio de la competencia</b>
        <p>Cada cotización cerrada ofrece un Reporte de Confirmación. Si dice a qué precio se adjudicó, el sistema deja de estimar y aprende el precio de corte de cada hospital.</p></div>
      <div class="pz"><span class="tag">Sin relevar</span><b>Portada Salud</b>
        <p>La segunda plataforma. Login propio y tecnología más vieja: hay que relevarla antes de sumarla acá.</p></div>
      <div class="pz"><span class="tag">Después</span><b>Montos</b>
        <p>Cuánta plata se cotizó y cuánta se ganó. Sale del mismo detalle, multiplicando precio por cantidad.</p></div>
    </div>

    <p class="corte">
      Datos al ${esc(D.corte)} · Fuente: ${esc(D.fuente)}<br>
      El índice de ${nf(T.cotizaciones)} cotizaciones está completo. El detalle por renglón es una muestra.
    </p>
  `;
}

function kpis(T){
  return `<div class="kpis">
    <div class="kpi"><div class="lb">Cotizaciones</div><div class="vl">${nf(T.cotizaciones)}</div><div class="sub">respondidas de junio a septiembre</div></div>
    <div class="kpi"><div class="lb">Renglones</div><div class="vl">${nf(T.renglones)}</div><div class="sub">productos que nos pidieron cotizar</div></div>
    <div class="kpi"><div class="lb">Terminaron en pedido</div><div class="vl t">${nf(T.confirmadas)}</div><div class="sub">${fpct(T.confirmadas,T.cotizaciones)} de las cotizaciones dejaron venta</div></div>
    <div class="kpi"><div class="lb">Promedio por pedido</div><div class="vl">${nf(T.renglones/T.cotizaciones)}</div><div class="sub">renglones por cotización</div></div>
  </div>`;
}

function evolucion(meses){
  const maxP = Math.max(...meses.map(m=>m.ped));
  const maxR = Math.max(...meses.map(m=>m.ren));
  return `<div class="ev">${meses.map(m=>`
    <div class="mes">
      <div class="barras">
        <div class="b ped" style="height:${Math.max(3,m.ped/maxP*150)}px"><span class="n">${m.ped}</span></div>
        <div class="b ren" style="height:${Math.max(3,m.ren/maxR*150)}px"><span class="n">${nf(m.ren)}</span></div>
      </div>
      <div class="et">${esc(m.m)}${m.parcial?'<small>en curso</small>':''}</div>
    </div>`).join("")}</div>
    <div class="leg">
      <span><i style="background:var(--teal)"></i>Cotizaciones</span>
      <span><i style="background:var(--aqua)"></i>Renglones</span>
    </div>`;
}

function estados(T){
  return `<div class="est">
    <div class="es ok"><div class="n">${nf(T.confirmadas)}</div><div class="t">Pedido confirmado</div><div class="p">${fpct(T.confirmadas,T.cotizaciones)} · dejaron venta</div></div>
    <div class="es neu"><div class="n">${nf(T.cerradas)}</div><div class="t">Cerradas</div><div class="p">${fpct(T.cerradas,T.cotizaciones)} · sin compra a EyG</div></div>
    <div class="es esp"><div class="n">${nf(T.pendientes)}</div><div class="t">Pendientes</div><div class="p">esperando resolución</div></div>
    <div class="es neu"><div class="n">${nf(T.urgencia||SEMILLA.tipos.urgencia)}</div><div class="t">Por urgencia</div><div class="p">vencen en 12 a 18 horas</div></div>
  </div>`;
}

function ranking(cls){
  const max = Math.max(...cls.map(c=>c.n));
  return cls.map((c,i)=>`
    <div class="rk">
      <div class="nm" title="${esc(c.nm)}">${esc(c.nm)}</div>
      <div class="pista"><div class="fill${i>2?' b':''}" style="width:${Math.max(2,c.n/max*100)}%"></div></div>
      <div class="vl">${c.n}</div>
    </div>`).join("");
}

function caso(c){
  return `<div class="caso">
    <div class="hd">
      <span class="id">#${esc(c.id)}</span>
      <span class="cl">${esc(c.cl)}</span>
      <span class="ti">${esc(c.ti)}</span>
    </div>
    <div class="emb">
      ${paso("Renglones pedidos", c.ren, c.ren, "p1")}
      ${paso("Los cotizamos", c.cot, c.ren, "p2")}
      ${paso("Los ganamos", c.gan, c.ren, "p3")}
    </div>
  </div>`;
}

function paso(lb, v, base, cls){
  const w = base ? Math.max(4, v/base*100) : 4;
  return `<div class="paso">
    <div class="lb">${esc(lb)}</div>
    <div class="bar ${cls}" style="width:${w}%">${nf(v)}</div>
  </div>`;
}
</script>
</body>
</html>
