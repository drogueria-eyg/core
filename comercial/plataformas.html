<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataformas · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<style>
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--teal-deep);font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  h2.sec:before{content:"";width:5px;height:16px;background:var(--teal);border-radius:3px}
  h2.sec .ayuda{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--gris2)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:18px}
  .nota{background:var(--agua);border:1px solid #BFE0DC;border-left:4px solid var(--teal);border-radius:10px;padding:12px 15px;font-size:13px;color:#245C57;line-height:1.6;margin-bottom:16px}
  .nota b{color:var(--teal-deep)}
  .nota.aviso{background:var(--warnbg);border-color:#E7CE9A;border-left-color:var(--warn);color:#7A5310}
  .nota.aviso b{color:var(--warn)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow)}
  .kpi .lb{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--gris2);font-weight:800}
  .kpi .vl{font-size:28px;font-weight:900;line-height:1.05;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
  .kpi .vl.t{color:var(--teal-deep)}
  .kpi .sub{font-size:11.5px;color:var(--gris);margin-top:5px;line-height:1.4}

  .dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin-top:14px}
  .tasa{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border-top:4px solid var(--teal)}
  .tasa.b{border-top-color:var(--gold)}
  .tasa .nm{font-size:13px;font-weight:800;color:var(--ink)}
  .tasa .big{font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1;margin:10px 0 4px;font-variant-numeric:tabular-nums;color:var(--teal-deep)}
  .tasa.b .big{color:#9A6B12}
  .tasa .frac{font-size:12.5px;color:var(--gris);font-variant-numeric:tabular-nums}
  .tasa .dice{font-size:12.5px;color:var(--gris);line-height:1.55;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
  .tasa .dice b{color:var(--ink)}

  .ev{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(58px,1fr);gap:12px;align-items:end;min-height:190px;padding:6px 4px 0;overflow-x:auto}
  .ev .mes{display:flex;flex-direction:column;align-items:center;gap:8px}
  .ev .barras{display:flex;gap:4px;align-items:flex-end;height:150px}
  .ev .b{width:22px;border-radius:5px 5px 0 0;position:relative;min-height:3px}
  .ev .b.ped{background:var(--teal)} .ev .b.ren{background:var(--aqua)}
  .ev .b .n{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;color:var(--gris);white-space:nowrap;font-variant-numeric:tabular-nums}
  .ev .et{font-size:11px;font-weight:700;color:var(--gris);text-align:center;white-space:nowrap}
  .leg{display:flex;gap:16px;justify-content:center;margin-top:14px;font-size:12px;color:var(--gris);font-weight:600}
  .leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .est{display:flex;gap:10px;flex-wrap:wrap}
  .es{flex:1;min-width:148px;border:1px solid var(--line);border-radius:11px;padding:13px 15px;background:var(--surface)}
  .es .n{font-size:23px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .es .t{font-size:12px;font-weight:700;color:var(--gris);margin-top:5px}
  .es .p{font-size:11.5px;color:var(--gris2);margin-top:2px}
  .es.ok .n{color:var(--ok)} .es.neu .n{color:var(--gris)} .es.esp .n{color:var(--warn)} .es.bad .n{color:var(--bad)}

  /* ---- navegación interna ---- */
  .tabs{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
  .tab{font-size:13px;padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;color:var(--gris);font-family:inherit}
  .tab:hover{border-color:var(--teal)}
  .tab.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .tab[disabled]{opacity:.5;cursor:not-allowed} .tab[disabled]:hover{border-color:var(--line)}
  .tab .c{opacity:.7;font-weight:600;margin-left:5px}

  /* ---- herramientas de tabla ---- */
  .tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
  .busca{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;flex:1;min-width:210px}
  .busca:focus-within{border-color:var(--teal)}
  .busca input{border:0;background:none;outline:none;font-family:inherit;font-size:14px;width:100%;color:var(--ink)}
  .filtros{display:flex;gap:6px;flex-wrap:wrap}
  .f{font-size:12px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;color:var(--gris);font-family:inherit;white-space:nowrap}
  .f:hover{border-color:var(--teal)}
  .f.on{background:var(--teal-deep);color:#fff;border-color:var(--teal-deep)}
  .btn{font-size:12.5px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;color:var(--gris);font-family:inherit;white-space:nowrap}
  .btn:hover{border-color:var(--teal);color:var(--teal-deep)}
  .cuenta{font-size:12.5px;color:var(--gris2);font-weight:600;white-space:nowrap}

  /* Sin scroll propio: la tabla fluye con la página. Un recuadro con barra de
     deslizamiento adentro de otra obliga a cazar la barra correcta y es incómodo
     (pedido del usuario, 15/9/2026). El encabezado queda pegado arriba mientras
     se baja — eso sólo funciona si NINGÚN contenedor recorta el alto, por eso acá
     no hay max-height ni overflow-y. El overflow-x aparece únicamente en pantallas
     angostas, donde no queda otra. */
  .scroll{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
  table{border-collapse:collapse;width:100%;font-size:13px;table-layout:auto}
  th{font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--gris2);text-align:left;padding:11px 13px;white-space:nowrap;background:#F4FAF9;position:sticky;top:0;z-index:3;cursor:pointer;user-select:none;box-shadow:inset 0 -1px 0 var(--line)}
  th:hover{color:var(--teal-deep);background:#EAF5F3}
  th .ord{opacity:.45;font-size:9px;margin-left:3px}
  th.r,td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  td{padding:9px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#FAFDFC}
  td.nm{font-weight:600;line-height:1.35}
  @media(max-width:860px){ .scroll{overflow-x:auto} table{min-width:700px} }
  td.cod{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--gris2);white-space:nowrap}
  .mini{height:6px;border-radius:99px;background:#EEF4F3;overflow:hidden;min-width:50px}
  .mini i{display:block;height:100%;border-radius:99px;background:var(--teal)}
  .mini i.mal{background:var(--bad)} .mini i.bien{background:var(--ok)}
  .pill{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .pill.ok{background:var(--okbg);color:var(--ok)} .pill.bad{background:var(--badbg);color:var(--bad)}
  .pill.neu{background:#EEF2F1;color:var(--gris)} .pill.warn{background:var(--warnbg);color:var(--warn)}
  .vacio{text-align:center;color:var(--gris2);padding:34px 12px;font-size:13.5px}
  .mas{text-align:center;color:var(--gris2);font-size:12.5px;padding:14px 10px 4px}

  .corte{font-size:11.5px;color:var(--gris2);margin-top:22px;text-align:center;line-height:1.6}
  .spin{width:30px;height:30px;border:4px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite;margin:34px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .cargando{text-align:center;color:var(--gris);font-size:13.5px;padding:10px}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=78"></script>
<script>
/* ============================================================
   PLATAFORMAS — cómo nos va en los portales de compras de salud
   ============================================================
   LOS DOS NÚMEROS QUE MANDAN — miden cosas distintas y se arreglan al revés:

     · Tasa de respuesta = renglones cotizados / renglones pedidos.
       Mide PRESENCIA. Si está baja, faltan HORAS: se pierde sin competir.

     · Tasa de éxito = renglones ganados / renglones cotizados.
       Mide PRECIO. Si está baja, competimos y perdemos.

   NADA SE CORTA (pedido del usuario, 15/9/2026). Las tablas muestran TODAS
   las filas, no un top N: los recortes escondían justo lo que hay que mirar.
   Para que siga siendo usable, cada tabla trae buscador, orden por columna
   (clic en el encabezado) y descarga a Excel. Los filtros de arriba son
   atajos a preguntas concretas, no recortes de los datos.

   DE DÓNDE SALEN LOS DATOS
   De bionexo_cotizaciones y bionexo_renglones, que llena el recolector
   (ver comercial/recolector.html). Se leen DIRECTO con la sesión del Core:
   las tablas tienen RLS con lectura para usuarios logueados; la edge
   function bionexo-ingesta es sólo para ESCRIBIR.

   OJO CON EL LÍMITE DE 1000: PostgREST devuelve como mucho 1000 filas por
   consulta. Las cabeceras entran de una, pero los renglones son más de
   10.000: se traen paginados con range(). Si algún día una lista sale
   corta sin motivo, mirar ahí primero.
   ============================================================ */
const esc = EYG.esc;
const nf = n => Math.round(n||0).toLocaleString("es-AR");
const fpct = (a,b) => b ? (Math.round(a*1000/b)/10).toString().replace(".",",")+"%" : "—";
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

let D = null;
/* `tope` = cuántas filas hay dibujadas. NO es un recorte de datos: al llegar al final
   de la página se agranda solo y sigue apareciendo el resto. Dibujar 3.000 filas de
   una deja el navegador pegajoso al ordenar y al escribir en el buscador. */
const PASO = 300;
const ST = { vista:"resumen", q:"", filtro:"todos", ord:{}, tope:PASO };

EYG.guard(["lider","admin","direccion"]).then(async perfil=>{
  document.body.innerHTML = EYG.layout(perfil,"plataformas",
    `<div id="cap"><div class="spin"></div><p class="cargando">Leyendo el historial completo…</p></div>`, "Plataformas");
  try{
    D = await leerDatos();
    render();
  }catch(e){
    document.getElementById("cap").innerHTML =
      `<div class="nota aviso"><b>No pude leer los datos.</b> ${esc(String(e.message||e))}</div>`;
  }
});

/* ---------------- lectura ---------------- */
async function leerDatos(){
  const sb = EYG.supa();
  const cab = [];
  for(let d=0; d<10000; d+=1000){
    const { data, error } = await sb.from("bionexo_cotizaciones")
      .select("id,cliente,cuit,titulo,tipo,vence,estado,renglones,cotizados,ganados,rechazados,monto_cotizado,monto_ganado,detalle_leido")
      .range(d, d+999);
    if(error) throw new Error(error.message);
    cab.push(...(data||[]));
    if(!data || data.length < 1000) break;
  }
  const rens = [];
  for(let d=0; d<60000; d+=1000){
    const { data, error } = await sb.from("bionexo_renglones")
      .select("cotizacion_id,cod_bionexo,producto,marca_pedida,cantidad,cod_eyg,precio,marca,estado")
      .range(d, d+999);
    if(error) throw new Error(error.message);
    rens.push(...(data||[]));
    if(!data || data.length < 1000) break;
  }
  return armar(cab, rens);
}

/* ---------------- cálculo ---------------- */
function armar(cab, rens){
  const conDetalle = cab.filter(c=>c.detalle_leido);
  const esConf = e => /^confirm/i.test(e||"");
  const N = v => Number(v)||0;

  const porMes = {};
  cab.forEach(c=>{
    if(!c.vence) return;
    const d = new Date(c.vence);
    const k = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    const m = porMes[k] = porMes[k] || { k, nombre: MESES[d.getMonth()]+" "+String(d.getFullYear()).slice(2), ped:0, ren:0, cot:0, gan:0 };
    m.ped++; m.ren += N(c.renglones);
    if(c.detalle_leido){ m.cot += N(c.cotizados); m.gan += N(c.ganados); }
  });
  const meses = Object.values(porMes).sort((a,b)=>a.k.localeCompare(b.k));

  const porCli = {};
  cab.forEach(c=>{
    const k = (c.cliente||"(sin nombre)");
    const x = porCli[k] = porCli[k] || { nm:k, cuit:c.cuit||"", n:0, ren:0, cot:0, gan:0, conf:0, monto:0 };
    x.n++;
    if(/confirm/i.test(c.estado||"")) x.conf++;
    if(c.detalle_leido){ x.ren += N(c.renglones); x.cot += N(c.cotizados); x.gan += N(c.ganados); x.monto += N(c.monto_ganado); }
  });
  const clientes = Object.values(porCli).sort((a,b)=>b.n-a.n);

  const porProd = {};
  rens.forEach(r=>{
    const k = r.cod_bionexo || ("s/c:"+(r.producto||"").slice(0,40));
    const p = porProd[k] = porProd[k] || { cod:r.cod_bionexo||"—", nm:r.producto||"(sin nombre)", ped:0, cot:0, gan:0, cant:0, codEyg:"", marcas:{} };
    p.ped++; p.cant += N(r.cantidad);
    if(N(r.precio) > 0) p.cot++;
    if(esConf(r.estado)) p.gan++;
    if(r.cod_eyg && !p.codEyg) p.codEyg = r.cod_eyg;
    if(r.marca_pedida && !/^-$|acept/i.test(r.marca_pedida)) p.marcas[r.marca_pedida] = 1;
  });
  const productos = Object.values(porProd).map(p=>({ ...p, marca:Object.keys(p.marcas)[0]||"" })).sort((a,b)=>b.ped-a.ped);

  const cotizaciones = cab.map(c=>({
    id:c.id, cliente:c.cliente||"", titulo:c.titulo||"", tipo:c.tipo||"", estado:c.estado||"",
    vence:c.vence||"", ren:N(c.renglones), cot:N(c.cotizados), gan:N(c.ganados),
    monto:N(c.monto_ganado), leido:!!c.detalle_leido
  })).sort((a,b)=>String(b.vence).localeCompare(String(a.vence)));

  const suma = (a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);
  return {
    hayDatos: cab.length>0,
    totales: {
      cotizaciones: cab.length, conDetalle: conDetalle.length,
      renglones: suma(cab,c=>N(c.renglones)),
      confirmadas: cab.filter(c=>/confirm/i.test(c.estado||"")).length,
      cerradas:    cab.filter(c=>/cerrad/i.test(c.estado||"")).length,
      pendientes:  cab.filter(c=>/pend/i.test(c.estado||"")).length,
      urgencias:   cab.filter(c=>/urgenc/i.test(c.tipo||"")).length,
      montoGanado: suma(conDetalle,c=>N(c.monto_ganado)),
      montoCotizado: suma(conDetalle,c=>N(c.monto_cotizado))
    },
    embudo: {
      pedidos:   suma(conDetalle,c=>N(c.renglones)),
      cotizados: suma(conDetalle,c=>N(c.cotizados)),
      ganados:   suma(conDetalle,c=>N(c.ganados))
    },
    meses, clientes, productos, cotizaciones
  };
}

/* ---------------- pintado ---------------- */
function render(){
  const T=D.totales, falta = T.cotizaciones - T.conDetalle;
  const cnt = { productos:D.productos.length, clientes:D.clientes.length, cotizaciones:D.cotizaciones.length };
  document.getElementById("cap").innerHTML = `
    ${!D.hayDatos ? `<div class="nota aviso"><b>Todavía no hay datos.</b> Hay que correr el
      <a href="recolector.html">recolector</a> para traer el historial de Bionexo.</div>` : ""}
    ${falta>0 ? `<div class="nota aviso"><b>Faltan ${nf(falta)} cotizaciones por leer en detalle.</b>
      Los renglones son sobre las ${nf(T.conDetalle)} ya leídas. <a href="recolector.html">Seguir →</a></div>` : ""}
    ${cabecera(T)}
    <div class="tabs" id="tabs">
      ${["resumen","productos","clientes","cotizaciones"].map(v=>`
        <button class="tab ${ST.vista===v?"on":""}" data-v="${v}">${v[0].toUpperCase()+v.slice(1)}${
          cnt[v]!=null?`<span class="c">${nf(cnt[v])}</span>`:""}</button>`).join("")}
      <button class="tab" disabled title="Todavía no relevado">Portada Salud</button>
    </div>
    <div id="vista"></div>
    <p class="corte">
      ${nf(T.cotizaciones)} cotizaciones · ${nf(T.conDetalle)} leídas en detalle · ${nf(D.productos.length)} productos distintos<br>
      Datos en vivo de Bionexo Argentina · se actualizan con el <a href="recolector.html">recolector</a>
    </p>`;
  document.querySelectorAll("#tabs .tab[data-v]").forEach(b=>b.onclick=()=>{
    ST.vista=b.dataset.v; ST.q=""; ST.filtro="todos"; render();
  });
  pintarVista();
}

function cabecera(T){
  const E=D.embudo;
  return `${`<div class="kpis">
    <div class="kpi"><div class="lb">Cotizaciones</div><div class="vl">${nf(T.cotizaciones)}</div><div class="sub">respondidas en Bionexo</div></div>
    <div class="kpi"><div class="lb">Renglones</div><div class="vl">${nf(T.renglones)}</div><div class="sub">productos que nos pidieron</div></div>
    <div class="kpi"><div class="lb">Terminaron en pedido</div><div class="vl t">${nf(T.confirmadas)}</div><div class="sub">${fpct(T.confirmadas,T.cotizaciones)} de las cotizaciones</div></div>
    <div class="kpi"><div class="lb">Por urgencia</div><div class="vl">${nf(T.urgencias)}</div><div class="sub">vencen en 12 a 18 horas</div></div>
    <div class="kpi"><div class="lb">Productos distintos</div><div class="vl">${nf(D.productos.length)}</div><div class="sub">nos pidieron cotizar</div></div>
  </div>`}
  <div class="dos">
    <div class="tasa">
      <div class="nm">Tasa de respuesta</div>
      <div class="big">${fpct(E.cotizados,E.pedidos)}</div>
      <div class="frac">${nf(E.cotizados)} de ${nf(E.pedidos)} renglones pedidos</div>
      <div class="dice">Mide <b>presencia</b>. Lo que falta acá se pierde sin competir: el renglón queda
        en blanco y no entra en la comparación del comprador. Se arregla con <b>horas</b>.</div>
    </div>
    <div class="tasa b">
      <div class="nm">Tasa de éxito</div>
      <div class="big">${fpct(E.ganados,E.cotizados)}</div>
      <div class="frac">${nf(E.ganados)} ganados de ${nf(E.cotizados)} cotizados</div>
      <div class="dice">Mide <b>precio</b>. Acá sí competimos y perdimos. Se arregla mirando el
        <b>margen</b> renglón por renglón, no trabajando más horas.</div>
    </div>
  </div>`;
}

/* ---------------- vistas ---------------- */
function pintarVista(){
  const v = document.getElementById("vista");
  if(ST.vista==="resumen")           v.innerHTML = vistaResumen();
  else if(ST.vista==="productos")    v.innerHTML = vistaTabla("productos");
  else if(ST.vista==="clientes")     v.innerHTML = vistaTabla("clientes");
  else                               v.innerHTML = vistaTabla("cotizaciones");
  enganchar();
}

function vistaResumen(){
  const T=D.totales;
  return `
    <h2 class="sec">Evolución <span class="ayuda">todos los meses, sin recortar</span></h2>
    <div class="card pad">${evolucion(D.meses)}</div>
    <h2 class="sec">Cómo terminaron</h2>
    <div class="est">
      <div class="es ok"><div class="n">${nf(T.confirmadas)}</div><div class="t">Pedido confirmado</div><div class="p">${fpct(T.confirmadas,T.cotizaciones)} · dejaron venta</div></div>
      <div class="es neu"><div class="n">${nf(T.cerradas)}</div><div class="t">Cerradas</div><div class="p">${fpct(T.cerradas,T.cotizaciones)} · sin compra a EyG</div></div>
      <div class="es esp"><div class="n">${nf(T.pendientes)}</div><div class="t">Pendientes</div><div class="p">esperando resolución</div></div>
      <div class="es neu"><div class="n">${nf(T.conDetalle)}</div><div class="t">Leídas en detalle</div><div class="p">${fpct(T.conDetalle,T.cotizaciones)} del total</div></div>
    </div>
    <h2 class="sec">Mes a mes, con el detalle</h2>
    <div class="scroll"><table>
      <thead><tr><th>Mes</th><th class="r">Cotizaciones</th><th class="r">Renglones</th><th class="r">Cotizados</th><th class="r">Ganados</th><th class="r">Respuesta</th><th class="r">Éxito</th></tr></thead>
      <tbody>${D.meses.map(m=>`<tr>
        <td class="nm">${esc(m.nombre)}</td><td class="r">${nf(m.ped)}</td><td class="r">${nf(m.ren)}</td>
        <td class="r">${nf(m.cot)}</td><td class="r">${nf(m.gan)}</td>
        <td class="r">${fpct(m.cot,m.ren)}</td><td class="r">${fpct(m.gan,m.cot)}</td></tr>`).join("")}</tbody>
    </table></div>`;
}

/* Definición de cada tabla: columnas, filtros y cómo se saca cada valor.
   Todas las filas se muestran siempre; el buscador y los filtros no borran
   datos, sólo enfocan. */
const TABLAS = {
  productos: {
    titulo:"Todos los productos que nos pidieron",
    ayuda:"clic en el encabezado para ordenar",
    filtros:[
      {k:"todos",  t:"Todos"},
      {k:"nunca",  t:"Nunca cotizados", test:p=>p.cot===0},
      {k:"pierde", t:"Cotizados y nunca ganados", test:p=>p.cot>=1&&p.gan===0},
      {k:"gana",   t:"Ganados alguna vez", test:p=>p.gan>0},
      {k:"sineyg", t:"Sin producto de EyG asociado", test:p=>!p.codEyg}
    ],
    cols:[
      {k:"nm",   t:"Producto", cls:"nm", v:p=>esc(p.nm)},
      {k:"cod",  t:"Cód. Bionexo", cls:"cod", v:p=>esc(p.cod)},
      {k:"codEyg",t:"Cód. EyG", cls:"cod", v:p=>p.codEyg?esc(p.codEyg):'<span style="color:var(--gris2)">—</span>'},
      {k:"marca",t:"Marca pedida", v:p=>p.marca?esc(p.marca):'<span style="color:var(--gris2)">indistinta</span>'},
      {k:"ped",  t:"Veces pedido", cls:"r", v:p=>nf(p.ped)},
      {k:"cot",  t:"Cotizado", cls:"r", v:p=>nf(p.cot)},
      {k:"gan",  t:"Ganado", cls:"r", v:p=>p.gan?`<span class="pill ok">${p.gan}</span>`:(p.cot?`<span class="pill bad">0</span>`:`<span class="pill neu">—</span>`)},
      {k:"resp", t:"Respuesta", cls:"r", n:p=>p.ped?p.cot/p.ped:0, v:p=>fpct(p.cot,p.ped)},
      {k:"exito",t:"Éxito", cls:"r", n:p=>p.cot?p.gan/p.cot:0, v:p=>p.cot?fpct(p.gan,p.cot):"—"},
      {k:"cant", t:"Unidades", cls:"r", v:p=>nf(p.cant)}
    ],
    busca:p=>(p.nm+" "+p.cod+" "+p.codEyg+" "+p.marca).toLowerCase(),
    orden:"ped"
  },
  clientes: {
    titulo:"Todos los clientes",
    ayuda:"cuánto nos piden y cómo nos va con cada uno",
    filtros:[
      {k:"todos", t:"Todos"},
      {k:"flojo", t:"Les respondemos menos de la mitad", test:c=>c.ren>0&&c.cot/c.ren<0.5},
      {k:"singan",t:"Nunca les ganamos", test:c=>c.cot>0&&c.gan===0}
    ],
    cols:[
      {k:"nm",   t:"Cliente", cls:"nm", v:c=>esc(c.nm)},
      {k:"n",    t:"Cotizaciones", cls:"r", v:c=>nf(c.n)},
      {k:"conf", t:"Terminaron en pedido", cls:"r", v:c=>nf(c.conf)},
      {k:"ren",  t:"Renglones", cls:"r", v:c=>nf(c.ren)},
      {k:"cot",  t:"Cotizados", cls:"r", v:c=>nf(c.cot)},
      {k:"gan",  t:"Ganados", cls:"r", v:c=>nf(c.gan)},
      {k:"resp", t:"Respuesta", cls:"r", n:c=>c.ren?c.cot/c.ren:0, v:c=>fpct(c.cot,c.ren)},
      {k:"exito",t:"Éxito", cls:"r", n:c=>c.cot?c.gan/c.cot:0, v:c=>c.cot?`<span class="pill ${c.gan?"ok":"bad"}">${fpct(c.gan,c.cot)}</span>`:"—"}
    ],
    busca:c=>(c.nm+" "+c.cuit).toLowerCase(),
    orden:"n"
  },
  cotizaciones: {
    titulo:"Todas las cotizaciones",
    ayuda:"una fila por pedido respondido",
    filtros:[
      {k:"todos",  t:"Todas"},
      {k:"conf",   t:"Terminaron en pedido", test:c=>/confirm/i.test(c.estado)},
      {k:"urg",    t:"De urgencia", test:c=>/urgenc/i.test(c.tipo)},
      {k:"blanco", t:"Respondimos menos de la mitad", test:c=>c.leido&&c.ren>0&&c.cot/c.ren<0.5},
      {k:"noleida",t:"Sin leer en detalle", test:c=>!c.leido}
    ],
    cols:[
      {k:"vence",  t:"Vence", cls:"cod", v:c=>c.vence?esc(new Date(c.vence).toLocaleDateString("es-AR")):"—"},
      {k:"id",     t:"ID", cls:"cod", v:c=>esc(c.id)},
      {k:"cliente",t:"Cliente", cls:"nm", v:c=>esc(c.cliente)},
      {k:"titulo", t:"Pedido", v:c=>esc(c.titulo)},
      {k:"tipo",   t:"Tipo", v:c=>/urgenc/i.test(c.tipo)?`<span class="pill warn">urgencia</span>`:esc(c.tipo.replace("Cotización ",""))},
      {k:"estado", t:"Estado", v:c=>/confirm/i.test(c.estado)?`<span class="pill ok">confirmado</span>`:/cerrad/i.test(c.estado)?`<span class="pill neu">cerrada</span>`:`<span class="pill warn">pendiente</span>`},
      {k:"ren",    t:"Renglones", cls:"r", v:c=>nf(c.ren)},
      {k:"cot",    t:"Cotizados", cls:"r", v:c=>c.leido?nf(c.cot):"—"},
      {k:"gan",    t:"Ganados", cls:"r", v:c=>c.leido?(c.gan?`<span class="pill ok">${c.gan}</span>`:"0"):"—"},
      {k:"resp",   t:"Respuesta", cls:"r", n:c=>c.ren?c.cot/c.ren:0, v:c=>c.leido?fpct(c.cot,c.ren):"—"}
    ],
    busca:c=>(c.cliente+" "+c.titulo+" "+c.id).toLowerCase(),
    orden:"vence"
  }
};

function vistaTabla(nombre){
  const def = TABLAS[nombre];
  const filas = filtrar(nombre);
  const visibles = filas.slice(0, ST.tope);
  return `
    <h2 class="sec">${esc(def.titulo)} <span class="ayuda">${esc(def.ayuda)}</span></h2>
    <div class="tools">
      <label class="busca">🔎 <input id="q" placeholder="Buscar…" value="${esc(ST.q)}" autocomplete="off"></label>
      <div class="filtros">${def.filtros.map(f=>`
        <button class="f ${ST.filtro===f.k?"on":""}" data-f="${f.k}">${esc(f.t)}</button>`).join("")}</div>
      <span class="cuenta" id="cuenta">${nf(filas.length)} de ${nf(D[nombre].length)}</span>
      <button class="btn" id="csv">Descargar Excel</button>
    </div>
    ${filas.length ? `<div class="scroll"><table>
      <thead><tr>${def.cols.map(c=>{
        const o = ST.ord[nombre];
        const flecha = o && o.k===c.k ? (o.desc?"▼":"▲") : "";
        return `<th class="${c.cls==='r'?'r':''}" data-k="${c.k}">${esc(c.t)}<span class="ord">${flecha}</span></th>`;
      }).join("")}</tr></thead>
      <tbody id="tb">${visibles.map(x=>fila(def,x)).join("")}</tbody>
    </table></div>
    <div id="mas" class="mas">${filas.length>visibles.length
      ? `Mostrando ${nf(visibles.length)} de ${nf(filas.length)} · seguí bajando para ver el resto`
      : `${nf(filas.length)} ${filas.length===1?"fila":"filas"} · eso es todo`}</div>`
    : `<div class="card"><p class="vacio">No hay filas que coincidan con la búsqueda.</p></div>`}`;
}

const fila = (def,x) => `<tr>${def.cols.map(c=>`<td class="${c.cls||""}">${c.v(x)}</td>`).join("")}</tr>`;

function filtrar(nombre){
  const def = TABLAS[nombre];
  let filas = D[nombre].slice();
  const f = def.filtros.find(x=>x.k===ST.filtro);
  if(f && f.test) filas = filas.filter(f.test);
  if(ST.q){ const q=ST.q.toLowerCase(); filas = filas.filter(x=>def.busca(x).includes(q)); }
  const o = ST.ord[nombre];
  if(o){
    const col = def.cols.find(c=>c.k===o.k);
    const val = x => col && col.n ? col.n(x) : (x[o.k]!=null?x[o.k]:"");
    filas.sort((a,b)=>{
      const A=val(a), B=val(b);
      const r = (typeof A==="number"&&typeof B==="number") ? A-B : String(A).localeCompare(String(B),"es");
      return o.desc ? -r : r;
    });
  }
  return filas;
}

let _obs = null;
function enganchar(){
  const q = document.getElementById("q");
  if(q) q.oninput = EYG.debounce ? EYG.debounce(()=>{ ST.q=q.value.trim(); ST.tope=PASO; repintarTabla(); },220)
                                 : ()=>{ ST.q=q.value.trim(); ST.tope=PASO; repintarTabla(); };
  document.querySelectorAll(".f[data-f]").forEach(b=>b.onclick=()=>{ ST.filtro=b.dataset.f; ST.tope=PASO; pintarVista(); });
  document.querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{
    const n=ST.vista, k=th.dataset.k, o=ST.ord[n];
    ST.ord[n] = (o&&o.k===k) ? {k, desc:!o.desc} : {k, desc:true};
    ST.tope = PASO;
    pintarVista();
  });
  const csv = document.getElementById("csv");
  if(csv) csv.onclick = ()=>bajarCsv(ST.vista);   // el Excel sale COMPLETO, no sólo lo dibujado

  /* Al acercarse al final de la página se dibuja el próximo tramo. */
  if(_obs) _obs.disconnect();
  const pie = document.getElementById("mas");
  if(pie && window.IntersectionObserver){
    _obs = new IntersectionObserver(es=>{
      if(!es[0].isIntersecting) return;
      const total = filtrar(ST.vista).length;
      if(ST.tope >= total) return;
      ST.tope += PASO;
      repintarTabla();
    }, {rootMargin:"600px"});
    _obs.observe(pie);
  }
}

/* Repinta sólo el cuerpo para no perder el foco del buscador mientras se escribe. */
function repintarTabla(){
  const def = TABLAS[ST.vista], filas = filtrar(ST.vista);
  const tb = document.getElementById("tb");
  if(!tb){ pintarVista(); return; }
  const visibles = filas.slice(0, ST.tope);
  tb.innerHTML = visibles.map(x=>fila(def,x)).join("");
  const cuenta = document.getElementById("cuenta");
  if(cuenta) cuenta.textContent = `${nf(filas.length)} de ${nf(D[ST.vista].length)}`;
  const pie = document.getElementById("mas");
  if(pie) pie.textContent = filas.length>visibles.length
    ? `Mostrando ${nf(visibles.length)} de ${nf(filas.length)} · seguí bajando para ver el resto`
    : `${nf(filas.length)} ${filas.length===1?"fila":"filas"} · eso es todo`;
}

/* Excel de verdad: BOM + punto y coma, que es lo que espera Excel en español.
   Sin el BOM, los acentos salen rotos. */
function bajarCsv(nombre){
  const def = TABLAS[nombre], filas = filtrar(nombre);
  const limpio = s => '"' + String(s==null?"":s).replace(/<[^>]*>/g,"").replace(/"/g,'""').replace(/\s+/g," ").trim() + '"';
  const head = def.cols.map(c=>limpio(c.t)).join(";");
  const body = filas.map(x=>def.cols.map(c=>limpio(c.v(x))).join(";")).join("\n");
  const blob = new Blob(["﻿"+head+"\n"+body], {type:"text/csv;charset=utf-8;"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bionexo-"+nombre+"-"+new Date().toISOString().slice(0,10)+".csv";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

function evolucion(meses){
  if(!meses.length) return `<p class="cargando">Sin fechas para graficar.</p>`;
  const maxP = Math.max(...meses.map(m=>m.ped), 1);
  const maxR = Math.max(...meses.map(m=>m.ren), 1);
  return `<div class="ev">${meses.map(m=>`
    <div class="mes">
      <div class="barras">
        <div class="b ped" style="height:${Math.max(3,m.ped/maxP*150)}px"><span class="n">${m.ped}</span></div>
        <div class="b ren" style="height:${Math.max(3,m.ren/maxR*150)}px"><span class="n">${nf(m.ren)}</span></div>
      </div>
      <div class="et">${esc(m.nombre)}</div>
    </div>`).join("")}</div>
    <div class="leg">
      <span><i style="background:var(--teal)"></i>Cotizaciones</span>
      <span><i style="background:var(--aqua)"></i>Renglones</span>
    </div>`;
}
