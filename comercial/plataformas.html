<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataformas · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<style>
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--teal-deep);font-weight:800;margin:28px 0 12px;display:flex;align-items:center;gap:9px}
  h2.sec:before{content:"";width:5px;height:16px;background:var(--teal);border-radius:3px}
  h2.sec .ayuda{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--gris2)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:18px}
  .nota{background:var(--agua);border:1px solid #BFE0DC;border-left:4px solid var(--teal);border-radius:10px;padding:12px 15px;font-size:13px;color:#245C57;line-height:1.6;margin-bottom:16px}
  .nota b{color:var(--teal-deep)}
  .nota.aviso{background:var(--warnbg);border-color:#E7CE9A;border-left-color:var(--warn);color:#7A5310}
  .nota.aviso b{color:var(--warn)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:13px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .lb{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--gris2);font-weight:800}
  .kpi .vl{font-size:31px;font-weight:900;line-height:1.05;margin-top:7px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
  .kpi .vl.t{color:var(--teal-deep)}
  .kpi .sub{font-size:12px;color:var(--gris);margin-top:5px;line-height:1.4}

  /* los dos números que mandan */
  .dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
  .tasa{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border-top:4px solid var(--teal)}
  .tasa.b{border-top-color:var(--gold)}
  .tasa .nm{font-size:13px;font-weight:800;color:var(--ink)}
  .tasa .big{font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1;margin:10px 0 4px;font-variant-numeric:tabular-nums;color:var(--teal-deep)}
  .tasa.b .big{color:#9A6B12}
  .tasa .frac{font-size:12.5px;color:var(--gris);font-variant-numeric:tabular-nums}
  .tasa .dice{font-size:12.5px;color:var(--gris);line-height:1.55;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
  .tasa .dice b{color:var(--ink)}

  .ev{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:14px;align-items:end;min-height:190px;padding:6px 4px 0}
  .ev .mes{display:flex;flex-direction:column;align-items:center;gap:8px}
  .ev .barras{display:flex;gap:5px;align-items:flex-end;height:150px}
  .ev .b{width:24px;border-radius:5px 5px 0 0;position:relative;min-height:3px}
  .ev .b.ped{background:var(--teal)} .ev .b.ren{background:var(--aqua)}
  .ev .b .n{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:800;color:var(--gris);white-space:nowrap;font-variant-numeric:tabular-nums}
  .ev .et{font-size:11.5px;font-weight:700;color:var(--gris);text-align:center}
  .leg{display:flex;gap:16px;justify-content:center;margin-top:14px;font-size:12px;color:var(--gris);font-weight:600}
  .leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .est{display:flex;gap:10px;flex-wrap:wrap}
  .es{flex:1;min-width:150px;border:1px solid var(--line);border-radius:11px;padding:13px 15px;background:var(--surface)}
  .es .n{font-size:24px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .es .t{font-size:12px;font-weight:700;color:var(--gris);margin-top:5px}
  .es .p{font-size:11.5px;color:var(--gris2);margin-top:2px}
  .es.ok .n{color:var(--ok)} .es.neu .n{color:var(--gris)} .es.esp .n{color:var(--warn)}

  .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
  th{font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--gris2);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFDFC}
  th.r,td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#FAFDFC}
  td.nm{font-weight:600;line-height:1.35}
  td.cod{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--gris2)}
  .mini{height:7px;border-radius:99px;background:#EEF4F3;overflow:hidden;min-width:56px}
  .mini i{display:block;height:100%;border-radius:99px;background:var(--teal)}
  .mini i.mal{background:var(--bad)} .mini i.bien{background:var(--ok)}
  .pill{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .pill.ok{background:var(--okbg);color:var(--ok)} .pill.bad{background:var(--badbg);color:var(--bad)} .pill.neu{background:#EEF2F1;color:var(--gris)}

  .tabs{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
  .tab{font-size:13px;padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;color:var(--gris);font-family:inherit}
  .tab:hover{border-color:var(--teal)}
  .tab.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .tab[disabled]{opacity:.5;cursor:not-allowed} .tab[disabled]:hover{border-color:var(--line)}

  .corte{font-size:11.5px;color:var(--gris2);margin-top:22px;text-align:center;line-height:1.6}
  .spin{width:30px;height:30px;border:4px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite;margin:34px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .cargando{text-align:center;color:var(--gris);font-size:13.5px;padding:10px}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=78"></script>
<script>
/* ============================================================
   PLATAFORMAS — cómo nos va en los portales de compras de salud
   ============================================================
   LOS DOS NÚMEROS QUE MANDAN — y que miden cosas distintas:

     · Tasa de respuesta = renglones cotizados / renglones pedidos.
       Mide PRESENCIA. Si está baja, faltan HORAS: se pierde sin competir.

     · Tasa de éxito = renglones ganados / renglones cotizados.
       Mide PRECIO. Si está baja, competimos y perdemos.

   Confundirlas es el error clásico ("perdimos"), porque se arreglan de
   maneras opuestas: una con tiempo, la otra con margen.

   DE DÓNDE SALEN LOS DATOS
   De las tablas bionexo_cotizaciones y bionexo_renglones, que llena el
   recolector (comercial/recolector.js, ver comercial/recolector.html).
   Se leen DIRECTO con la sesión del Core: las tablas tienen RLS con lectura
   para usuarios logueados, así que no hace falta pasar por la edge function
   (esa es sólo para ESCRIBIR).

   OJO CON EL LÍMITE DE 1000: PostgREST devuelve como mucho 1000 filas por
   consulta. Las cabeceras son ~260 y entran de una, pero los renglones son
   más de 10.000: por eso se traen paginados con range(). Si algún día el
   ranking de productos sale corto sin motivo, mirar ahí primero.
   ============================================================ */
const esc = EYG.esc;
const nf = n => Math.round(n||0).toLocaleString("es-AR");
const fpct = (a,b) => b ? (Math.round(a*1000/b)/10).toString().replace(".",",")+"%" : "—";
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

let D = null;

EYG.guard(["lider","admin","direccion"]).then(async perfil=>{
  document.body.innerHTML = EYG.layout(perfil,"plataformas",
    `<div id="cap"><div class="spin"></div><p class="cargando">Leyendo el historial…</p></div>`, "Plataformas");
  try{
    D = await leerDatos();
    render();
  }catch(e){
    document.getElementById("cap").innerHTML =
      `<div class="nota aviso"><b>No pude leer los datos.</b> ${esc(String(e.message||e))}</div>`;
  }
});

/* ---------------- lectura ---------------- */
async function leerDatos(){
  const sb = EYG.supa();

  const { data: cab, error: e1 } = await sb.from("bionexo_cotizaciones")
    .select("id,cliente,titulo,tipo,vence,estado,renglones,cotizados,ganados,rechazados,detalle_leido")
    .limit(2000);
  if(e1) throw new Error(e1.message);

  // Los renglones pasan de 10.000: PostgREST corta en 1000 por consulta.
  const rens = [];
  for(let desde=0; desde<40000; desde+=1000){
    const { data, error } = await sb.from("bionexo_renglones")
      .select("cod_bionexo,producto,cantidad,precio,estado")
      .range(desde, desde+999);
    if(error) throw new Error(error.message);
    rens.push(...(data||[]));
    if(!data || data.length < 1000) break;
  }
  return armar(cab||[], rens);
}

/* ---------------- cálculo ---------------- */
function armar(cab, rens){
  const conDetalle = cab.filter(c=>c.detalle_leido);
  const esConf = e => /^confirm/i.test(e||"");

  // Evolución: se agrupa por el mes de vencimiento del pedido.
  const porMes = {};
  cab.forEach(c=>{
    if(!c.vence) return;
    const d = new Date(c.vence);
    const k = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    const m = porMes[k] = porMes[k] || { k, nombre: MESES[d.getMonth()], ped:0, ren:0 };
    m.ped++; m.ren += c.renglones||0;
  });
  const meses = Object.values(porMes).sort((a,b)=>a.k.localeCompare(b.k)).slice(-8);

  // Clientes: además del volumen, CÓMO nos va con cada uno.
  const porCli = {};
  cab.forEach(c=>{
    const k = (c.cliente||"(sin nombre)").slice(0,60);
    const x = porCli[k] = porCli[k] || { nm:k, n:0, ren:0, cot:0, gan:0 };
    x.n++;
    if(c.detalle_leido){ x.ren += c.renglones||0; x.cot += c.cotizados||0; x.gan += c.ganados||0; }
  });
  const clientes = Object.values(porCli).sort((a,b)=>b.n-a.n);

  // Productos: la pregunta del negocio — qué ganamos, qué perdemos y
  // sobre todo qué nos piden una y otra vez sin que lleguemos a cotizarlo.
  const porProd = {};
  rens.forEach(r=>{
    const k = r.cod_bionexo || ("s/c:"+(r.producto||"").slice(0,40));
    const p = porProd[k] = porProd[k] || { cod:r.cod_bionexo||"—", nm:r.producto||"(sin nombre)", ped:0, cot:0, gan:0, cant:0 };
    p.ped++; p.cant += Number(r.cantidad)||0;
    if(Number(r.precio) > 0) p.cot++;
    if(esConf(r.estado)) p.gan++;
    if(!p.nm && r.producto) p.nm = r.producto;
  });
  const prods = Object.values(porProd);

  const suma = (a,f) => a.reduce((s,x)=>s+(f(x)||0),0);
  return {
    hayDatos: cab.length>0,
    totales: {
      cotizaciones: cab.length,
      conDetalle: conDetalle.length,
      renglones: suma(cab,c=>c.renglones),
      confirmadas: cab.filter(c=>/confirm/i.test(c.estado||"")).length,
      cerradas:    cab.filter(c=>/cerrad/i.test(c.estado||"")).length,
      pendientes:  cab.filter(c=>/pend/i.test(c.estado||"")).length,
      urgencias:   cab.filter(c=>/urgenc/i.test(c.tipo||"")).length
    },
    embudo: {
      pedidos:   suma(conDetalle,c=>c.renglones),
      cotizados: suma(conDetalle,c=>c.cotizados),
      ganados:   suma(conDetalle,c=>c.ganados)
    },
    meses, clientes,
    productosDistintos: prods.length,
    // Nunca cotizados y muy pedidos = la lista de trabajo más corta y más rentable.
    nuncaCotizados: prods.filter(p=>p.cot===0).sort((a,b)=>b.ped-a.ped).slice(0,15),
    ganadores:      prods.filter(p=>p.gan>0).sort((a,b)=>b.gan-a.gan).slice(0,15),
    perdedores:     prods.filter(p=>p.cot>=3 && p.gan===0).sort((a,b)=>b.cot-a.cot).slice(0,15)
  };
}

/* ---------------- pintado ---------------- */
function render(){
  const T=D.totales, E=D.embudo;
  const falta = T.cotizaciones - T.conDetalle;

  document.getElementById("cap").innerHTML = `
    <div class="tabs">
      <button class="tab on">Bionexo</button>
      <button class="tab" disabled title="Todavía no relevado">Portada Salud</button>
    </div>

    ${!D.hayDatos ? `<div class="nota aviso"><b>Todavía no hay datos.</b> Hay que correr el
      <a href="recolector.html">recolector</a> para traer el historial de Bionexo.</div>` : ""}

    ${falta>0 ? `<div class="nota aviso"><b>Faltan ${nf(falta)} cotizaciones por leer en detalle.</b>
      Los números de abajo son sobre las ${nf(T.conDetalle)} ya leídas.
      <a href="recolector.html">Seguir la recolección →</a></div>` : ""}

    ${kpis(T)}

    <h2 class="sec">Los dos números <span class="ayuda">miden cosas distintas y se arreglan al revés</span></h2>
    <div class="dos">
      <div class="tasa">
        <div class="nm">Tasa de respuesta</div>
        <div class="big">${fpct(E.cotizados,E.pedidos)}</div>
        <div class="frac">${nf(E.cotizados)} de ${nf(E.pedidos)} renglones pedidos</div>
        <div class="dice">Mide <b>presencia</b>. Lo que falta acá se pierde sin competir: el renglón
          queda en blanco, no aparece en la comparación del comprador. Se arregla con <b>horas</b>, no con precio.</div>
      </div>
      <div class="tasa b">
        <div class="nm">Tasa de éxito</div>
        <div class="big">${fpct(E.ganados,E.cotizados)}</div>
        <div class="frac">${nf(E.ganados)} ganados de ${nf(E.cotizados)} cotizados</div>
        <div class="dice">Mide <b>precio</b>. Acá sí competimos y perdimos. Se arregla mirando el
          <b>margen</b> renglón por renglón, no trabajando más horas.</div>
      </div>
    </div>

    <h2 class="sec">Evolución <span class="ayuda">cotizaciones y renglones por mes</span></h2>
    <div class="card pad">${evolucion(D.meses)}</div>

    <h2 class="sec">Cómo terminaron</h2>
    ${estados(T)}

    <h2 class="sec">Nos piden y no llegamos a cotizar <span class="ayuda">la lista de trabajo más rentable</span></h2>
    <div class="nota">Productos que los clientes pidieron una y otra vez y que <b>nunca</b> se cotizaron.
      No se perdieron por precio: no se presentaron. Es lo primero para atacar.</div>
    ${tablaProd(D.nuncaCotizados, "nunca")}

    <h2 class="sec">Los que ganamos <span class="ayuda">acá el precio funciona</span></h2>
    ${tablaProd(D.ganadores, "gana")}

    <h2 class="sec">Los que perdemos siempre <span class="ayuda">cotizados 3 veces o más, ganados nunca</span></h2>
    <div class="nota aviso">Acá sí se compitió y se perdió todas las veces. O el precio está alto,
      o no tenemos la marca que piden. <b>Revisar estos antes que ningún otro.</b></div>
    ${tablaProd(D.perdedores, "pierde")}

    <h2 class="sec">Clientes <span class="ayuda">volumen y cómo nos va con cada uno</span></h2>
    ${tablaClientes(D.clientes)}

    <p class="corte">
      ${nf(T.cotizaciones)} cotizaciones · ${nf(T.conDetalle)} leídas en detalle · ${nf(D.productosDistintos)} productos distintos<br>
      Datos en vivo de Bionexo Argentina · se actualizan con el <a href="recolector.html">recolector</a>
    </p>`;
}

function kpis(T){
  return `<div class="kpis">
    <div class="kpi"><div class="lb">Cotizaciones</div><div class="vl">${nf(T.cotizaciones)}</div><div class="sub">respondidas en Bionexo</div></div>
    <div class="kpi"><div class="lb">Renglones</div><div class="vl">${nf(T.renglones)}</div><div class="sub">productos que nos pidieron cotizar</div></div>
    <div class="kpi"><div class="lb">Terminaron en pedido</div><div class="vl t">${nf(T.confirmadas)}</div><div class="sub">${fpct(T.confirmadas,T.cotizaciones)} de las cotizaciones dejaron venta</div></div>
    <div class="kpi"><div class="lb">Por urgencia</div><div class="vl">${nf(T.urgencias)}</div><div class="sub">vencen en 12 a 18 horas</div></div>
  </div>`;
}

function evolucion(meses){
  if(!meses.length) return `<p class="cargando">Sin fechas para graficar.</p>`;
  const maxP = Math.max(...meses.map(m=>m.ped), 1);
  const maxR = Math.max(...meses.map(m=>m.ren), 1);
  return `<div class="ev">${meses.map(m=>`
    <div class="mes">
      <div class="barras">
        <div class="b ped" style="height:${Math.max(3,m.ped/maxP*150)}px"><span class="n">${m.ped}</span></div>
        <div class="b ren" style="height:${Math.max(3,m.ren/maxR*150)}px"><span class="n">${nf(m.ren)}</span></div>
      </div>
      <div class="et">${esc(m.nombre)}</div>
    </div>`).join("")}</div>
    <div class="leg">
      <span><i style="background:var(--teal)"></i>Cotizaciones</span>
      <span><i style="background:var(--aqua)"></i>Renglones</span>
    </div>`;
}

function estados(T){
  return `<div class="est">
    <div class="es ok"><div class="n">${nf(T.confirmadas)}</div><div class="t">Pedido confirmado</div><div class="p">${fpct(T.confirmadas,T.cotizaciones)} · dejaron venta</div></div>
    <div class="es neu"><div class="n">${nf(T.cerradas)}</div><div class="t">Cerradas</div><div class="p">${fpct(T.cerradas,T.cotizaciones)} · sin compra a EyG</div></div>
    <div class="es esp"><div class="n">${nf(T.pendientes)}</div><div class="t">Pendientes</div><div class="p">esperando resolución</div></div>
    <div class="es neu"><div class="n">${nf(T.conDetalle)}</div><div class="t">Leídas en detalle</div><div class="p">${fpct(T.conDetalle,T.cotizaciones)} del total</div></div>
  </div>`;
}

function tablaProd(lista, modo){
  if(!lista.length) return `<div class="card pad"><p class="cargando" style="margin:0">Nada para mostrar todavía.</p></div>`;
  const max = Math.max(...lista.map(p=>p.ped), 1);
  const col = modo==="gana" ? "Ganados" : modo==="pierde" ? "Cotizados sin ganar" : "Veces pedido";
  return `<div class="scroll"><table>
    <thead><tr>
      <th>Producto</th><th>Código</th><th class="r">Pedido</th><th class="r">Cotizado</th>
      <th class="r">${col}</th><th class="r">Unidades</th><th></th>
    </tr></thead>
    <tbody>${lista.map(p=>{
      const destaque = modo==="gana"
        ? `<span class="pill ok">${p.gan} ganados</span>`
        : modo==="pierde"
          ? `<span class="pill bad">0 de ${p.cot}</span>`
          : `<span class="pill neu">nunca cotizado</span>`;
      const cls = modo==="gana" ? "bien" : modo==="pierde" ? "mal" : "";
      return `<tr>
        <td class="nm">${esc(p.nm)}</td>
        <td class="cod">${esc(p.cod)}</td>
        <td class="r">${nf(p.ped)}</td>
        <td class="r">${nf(p.cot)}</td>
        <td class="r">${destaque}</td>
        <td class="r">${nf(p.cant)}</td>
        <td style="width:90px"><div class="mini"><i class="${cls}" style="width:${Math.max(4,p.ped/max*100)}%"></i></div></td>
      </tr>`;
    }).join("")}</tbody></table></div>`;
}

function tablaClientes(cls){
  if(!cls.length) return "";
  return `<div class="scroll"><table>
    <thead><tr>
      <th>Cliente</th><th class="r">Cotizaciones</th><th class="r">Renglones</th>
      <th class="r">Respondimos</th><th class="r">Ganamos</th>
    </tr></thead>
    <tbody>${cls.map(c=>`
      <tr>
        <td class="nm">${esc(c.nm)}</td>
        <td class="r">${nf(c.n)}</td>
        <td class="r">${nf(c.ren)}</td>
        <td class="r">${c.ren? fpct(c.cot,c.ren) : "—"}</td>
        <td class="r">${c.cot? `<span class="pill ${c.gan? "ok":"neu"}">${fpct(c.gan,c.cot)}</span>` : "—"}</td>
      </tr>`).join("")}</tbody></table></div>`;
}
</script>
</body>
</html>
