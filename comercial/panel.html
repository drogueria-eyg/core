   El comercial vive encerrado en este panel, así que sin este botón no tendría
   por dónde entrar. Abre en OTRA PESTAÑA: el panel es su sesión de venta y no
   se pisa. Muestra cuántas conversaciones tiene y late si hay una en curso.
   Aparece solo si el interruptor core_config.wsp_comerciales está encendido;
   quién ve qué lo decide el servidor (wsp-visibles), no este botón.          */
async function botonChats(perfil){
  if(!perfil || !perfil._cfg || perfil._cfg.wsp_comerciales!==true) return;
  if(perfil.rol!=="comercial" && perfil.rol!=="lider") return;
  const b=document.createElement("a");
  b.className="fabchats";
  b.href="../comunicaciones/whatsapp.html";
  b.target="_blank"; b.rel="noopener";
  b.title="Las conversaciones del asistente con tus clientes (se abre en otra pestaña)";
  b.innerHTML='<span class="ic">💬</span><span class="tx">Chats</span><span class="n"></span><i class="vv"></i>';
  document.body.appendChild(b);
  async function refrescar(){
    try{
      const {data,error}=await EYG.supa().functions.invoke("wsp-visibles",{body:{accion:"lista"}});
      if(error||!data||!data.ok){ b.style.display="none"; return; }
      const n=(data.canales||[]).length;
      b.style.display=n?"":"none";           // sin chats propios, no molesta
      b.querySelector(".n").textContent=n||"";
      b.classList.toggle("viva", !!data.en_vivo);
    }catch(e){ b.style.display="none"; }
  }
  refrescar();
  setInterval(refrescar,60000);
}

EYG.guard(["comercial","lider","admin","direccion"]).then(async perfil=>{
  window.__perfil = perfil;
  botonChats(perfil);
  const q = new URLSearchParams(location.search).get("c");
  if(perfil.rol==="comercial"){
    COMERCIAL = perfil.comercial_ref || perfil.nombre || perfil.email;  // forzado a su propia cuenta de Odoo
    // Un comercial no tiene "inicio" (entra directo acá): el ← pasa a ser "Salir".
    const nb=document.getElementById("navBack");
    if(nb){ nb.textContent="Salir"; nb.href="#"; nb.title="Cerrar sesión"; nb.onclick=(e)=>{e.preventDefault();EYG.logout();}; }
  } else {
    COMERCIAL = q || perfil.comercial_ref || "Natividad Sanchez";       // líder/admin: puede elegir con ?c=
    // Candado: un LÍDER sólo puede ver su propia cartera o la de SU equipo (no otros equipos, ej. la de Diego).
    if(perfil.rol==="lider"){
      const _self=perfil.comercial_ref||perfil.nombre||"", _norm=s=>(s||"").toString().trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
      try{ const _perm=await EYG.orgDescendientes(_self); const _ok=new Set([..._perm].map(_norm)); _ok.add(_norm(_self)); if(!_ok.has(_norm(COMERCIAL))) COMERCIAL=_self; }
      catch(e){ COMERCIAL=_self; }
    }
    // Modo dirección/líder: su propia cartera SIN gamificación (nivel/comisión/salud/objetivos) + gráfico de evolución.
    MODO_LIDER = new URLSearchParams(location.search).get("modo")==="lider";
    if(MODO_LIDER){
      const sub=document.querySelector(".who span"); if(sub) sub.textContent="Mi cartera · Dirección";
      const nb=document.getElementById("navBack"); if(nb){ nb.href="comerciales.html"; nb.title="Volver al Panel comerciales"; }
    }
  }
  // ¿El dueño de este panel es un líder? Entonces su comisión está a definir (ver SIN_COMISION).
  EYG.rosterCore().then(r=>{
    const nrm=s=>(s||"").toString().trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    const u=(r||[]).find(x=>nrm(x.comercial_ref)===nrm(COMERCIAL)||nrm(x.nombre)===nrm(COMERCIAL));
    const esLider=u && ["lider","direccion","admin"].includes(u.rol);
    if(esLider){ SIN_COMISION=true; render(); }
  }).catch(()=>{});
  cargar().then(()=>{
    // Presencia: solo si es SU propia cuenta (no cuando un líder/admin espía el panel con ?c=).
    if(perfil.rol==="comercial" && ST.userId && EYG.startPresencia) EYG.startPresencia(ST.userId);
  });
  // Novedades/bajadas (Comunicaciones): campana con badge en el header, cerca del nombre.
  // Para un comercial, la campana además avisa de mensajes de WhatsApp para enviar (opts.wa),
  // con "Ver" que hace scroll a la sección #waSection del panel.
  BELL_OPTS = {wa: perfil.rol==="comercial", waTarget:"waSection"};
  if(EYG.bellComunicaciones) EYG.bellComunicaciones("bellSlot", perfil, BELL_OPTS);
});
</script>
