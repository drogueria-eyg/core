window.buscar = EYG.buscador(v => { ST.q=v; lista(); });

function lista(){
  const box=document.getElementById("lista"); if(!box) return;
  let arr=ST.contactos.map(c=>({c,comp:completar(c),o:ST.orders[c.id]}));
  if(ST.q){const q=ST.q.toLowerCase();arr=arr.filter(x=>x.c.name&&x.c.name.toLowerCase().includes(q));}
  if(ST.filtro==='hoyno') arr=arr.filter(x=>!ST.contactadosHoy.has(x.c.id));
  if(ST.filtro==='sintel') arr=arr.filter(x=>!(x.c.phone||x.c.mobile));
  if(ST.filtro==='deudavenc') arr=arr.filter(x=>(ST.cc.porP[x.c.id]?.vencido||0)>1);
  const _est=['caliente','tibio','frio','dormido','nuevo'];
  if(_est.includes(ST.filtro)) arr=arr.filter(x=>estadoCli(x.c).k===ST.filtro);
  if(ST.filtro==='pend') arr=arr.filter(x=>x.comp.pct<100);   // "Ficha incompleta" = solo las que NO están al 100%
  if(ST.filtro==='deudavenc') arr.sort((a,b)=>(ST.cc.porP[b.c.id]?.vencido||0)-(ST.cc.porP[a.c.id]?.vencido||0));
  else if(ST.filtro==='pend') arr.sort((a,b)=>a.comp.pct-b.comp.pct);
  else if(_est.includes(ST.filtro)) arr.sort((a,b)=>(diasDe(b.o?.ultima)??1e9)-(diasDe(a.o?.ultima)??1e9));  // más urgente (más días) primero
  else arr.sort((a,b)=>(a.c.name||"").localeCompare(b.c.name||""));
  if(ST.alFondo.size) arr=[...arr.filter(x=>!ST.alFondo.has(x.c.id)), ...arr.filter(x=>ST.alFondo.has(x.c.id))];
  if(!arr.length){box.innerHTML='<div class="empty">Sin contactos con ese filtro.</div>';return;}
  box.innerHTML=arr.slice(0,300).map(({c,comp,o})=>{
    const hoy=ST.contactadosHoy.has(c.id); const d=diasDe(o?.ultima); const enFondo=ST.alFondo.has(c.id);
    const sinTel=!(c.phone||c.mobile);
    const dd=ST.cc.porP[c.id]; const deuda=dd?Math.max(0,dd.deuda):0, dvenc=dd?Math.max(0,dd.vencido):0;
    const debtBadge = deuda>1 ? `<span class="debt ${dvenc>1?'v':''}">${dvenc>1?'Vencido ':'Debe '}${money(dvenc>1?dvenc:deuda)}</span>` : '';
    const e=estadoCli(c); const estBadge=`<span class="estado" style="color:${e.col};background:${e.bg}">${e.em} ${e.lab}</span>`;
    const rec = o ? `<div class="rec"><b>${d===0?'hoy':d+'d'}</b> sin comprar<div class="sub">${o.pedidos} ped · ${money(o.total)}</div></div>` : `<div class="rec"><span class="sub">sin compras</span></div>`;
    return `<div class="cc ${hoy?'hoy':''} ${sinTel?'st':''} ${enFondo?'alfondo':''}" onclick="abrir(${c.id})">
      <div><div class="nm">${esc(c.name||"(sin nombre)")} ${portalIcon(c)}</div><div class="mt">${esc(c.city||"—")} · ${c.customer_rank>0?'cliente':'contacto'}${hoy?' · ✅ hoy':''}</div>${estBadge}<span class="cred-slot" data-pid="${c.id}">${credListHTML(c)}</span>${sinTel?'<span class="notel">📞 Falta teléfono</span>':''}${plazoBadge(c)}${debtBadge}</div>
      ${rec}
      <div class="compbar"><div class="lab"><span>Ficha</span><span>${comp.pct}%</span></div><div class="track"><div class="fill" style="width:${comp.pct}%;background:${colorPct(comp.pct)}"></div></div></div>
      <div class="ccact">${hoy?'<span class="done-tag">Hoy ✓</span>':'<span class="go">Abrir →</span>'}<button class="fbtn" title="${enFondo?'Traer arriba':'Pasar al fondo y seguir'}" onclick="alFondo(event,${c.id})">${enFondo?'↑ subir':'⤓ al fondo'}</button></div>
    </div>`;
  }).join("");
}

/* ===== Perfil crediticio del contacto (SOLO en la ficha, no en la lista) =====
   Cruza el BCRA (externo, cacheado por CUIT) + el historial de pago interno (ST.riesgos,
   de riesgoCartera) en UN veredicto de 4 niveles. Se muestra como un chip "Perfil" al lado
   del plazo de pago (bajo el nombre) y, al tocarlo, un resumen de 2 líneas que contrasta el
   BCRA con los pagos a EyG. La decisión final la hace Cobranzas. */
let CREDIT_CFG={moraConsultar:30, moraNoApto:90, vencidoMin:1000};
function bcraStale(r){ if(!r||r.error) return true; if(!r.ts) return false; const d=(Date.now()-new Date(r.ts+"T00:00:00").getTime())/864e5; return d>25; }
// {loading} | {v: veredicto}   (interno=fila de riesgoCartera; sin CUIT se evalúa solo con lo interno)
function credVerdicto(c){
  const cu=cuitDe(c); const b=cu?ST.bcra[cu]:null; const interno=(ST.riesgos||{})[c.id]||null;
  if(cu && b===undefined) return {loading:true};                       // BCRA todavía cargando
  const bb=(b&&!b.error)?b:null;
  return {v: EYG.evalCredito(bb, interno, CREDIT_CFG), sinCuit:!cu, bcraErr:!!(b&&b.error)};
}
// Badge ABREVIADO para la lista (sutil, no compite con el plazo; mismos colores que la ficha).
function credListHTML(c){
  const cu=cuitDe(c), iv=(ST.riesgos||{})[c.id]||null;
  if(cu && ST.bcra[cu]===undefined) return "";                 // aún cargando → aparece al llegar
  if(!cu && (!iv||iv.nivel==="ok")) return "";                 // no evaluable y sin señal interna → nada
  const v=EYG.evalCredito((ST.bcra[cu]&&!ST.bcra[cu].error)?ST.bcra[cu]:null, iv, CREDIT_CFG);
  const short=((EYG.CRED_NIV||{})[v.nivel]||{}).chip||v.titulo;
  return `<span class="cred-mini ${v.luz}" title="Perfil crediticio: ${esc(v.titulo)}${v.motivo?(' — '+esc(v.motivo)):''}"><span class="cm-dot"></span>${esc(short)}</span>`;
}
function actualizarCredCuit(cu){
  ST.contactos.filter(x=>cuitDe(x)===cu).forEach(x=>{ const el=document.querySelector('.cred-slot[data-pid="'+x.id+'"]'); if(el) el.innerHTML=credListHTML(x); });
  refrescarPerfilFicha();
}
// Completa el BCRA en 2º plano (throttled ×3) para poblar los badges de la lista, y cachea.
async function trickleBCRA(){
  if(ST._bcraRun) return; ST._bcraRun=true;
  const hoy=hoyStr.slice(0,10), vistos=new Set(), pend=[];
  for(const c of ST.contactos){ const cu=cuitDe(c); if(!cu||vistos.has(cu)) continue; vistos.add(cu); if(bcraStale(ST.bcra[cu])) pend.push(cu); }
  let i=0, activos=0, sinGuardar=0; const nuevos={};
  await new Promise(res=>{
    const flush=()=>{ if(sinGuardar>0){ EYG.bcraCacheMerge({...nuevos}); sinGuardar=0; } };
    const paso=()=>{ if(i>=pend.length && activos===0){ flush(); res(); return; }
      while(activos<3 && i<pend.length){ const cu=pend[i++]; activos++;
        EYG.bcraResumen(cu).then(r=>{ if(r&&!r.error){ r.ts=hoy; ST.bcra[cu]=r; nuevos[cu]=r; sinGuardar++; actualizarCredCuit(cu); } })
          .catch(()=>{}).finally(()=>{ activos--; if(sinGuardar>=12) flush(); paso(); }); }
    }; paso();
  });
  ST._bcraRun=false;
}
// Estado cualitativo de cada fuente (sin montos), para el resumen contrastado.
function bcraTexto(c){ const cu=cuitDe(c); if(!cu) return "falta el CUIT para consultar"; const b=ST.bcra[cu]; if(b===undefined) return "consultando…"; if(!b||b.error) return "no disponible ahora"; if(b.sin) return "sin deuda registrada"; return b.luz==="g"?"situación normal":b.luz==="y"?"con una marca menor":("situación irregular"+((b.chImpagos||0)>0?" · cheques impagos":"")); }
function eygTexto(c){ const iv=(ST.riesgos||{})[c.id]; if(!iv||iv.nivel==="ok") return "paga al día"; if(iv.manual) return "marcado con problemas de pago"; if(iv.bovIncobrable) return "marcado incobrable"; if(iv.nivel==="alto") return "muy atrasado"; return "registra atrasos"; }
// Chip "Perfil: <nivel>" para el encabezado de la ficha
function perfilChipHTML(c){
  const cu=cuitDe(c), iv=(ST.riesgos||{})[c.id]||null;
  if(cu && ST.bcra[cu]===undefined) return `<span class="pf-chip load"><span class="pf-cdot"></span><span class="pf-lab">Perfil crediticio</span> evaluando…</span>`;
  if(!cu && (!iv||iv.nivel==="ok")) return `<span class="pf-chip n"><span class="pf-cdot"></span><span class="pf-lab">Perfil crediticio</span> falta CUIT</span>`;
  const v=EYG.evalCredito((ST.bcra[cu]&&!ST.bcra[cu].error)?ST.bcra[cu]:null, iv, CREDIT_CFG);
  const short=((EYG.CRED_NIV||{})[v.nivel]||{}).chip||v.titulo;
  return `<span class="pf-chip ${v.luz}"><span class="pf-cdot"></span><span class="pf-lab">Perfil crediticio</span> ${esc(short)}</span>`;
}
// Resumen (2 líneas contrastadas + contexto), se abre al tocar el chip
function perfilResumenHTML(c){
  const r=credVerdicto(c);
  if(r.loading) return `<div class="pf-load">Evaluando el perfil… (cruzando BCRA + pagos con EyG)</div>`;
  const v=r.v, cu=cuitDe(c), b=cu?ST.bcra[cu]:null, iv=(ST.riesgos||{})[c.id]||null;
  const cobra=(v.nivel==="consultar"||v.nivel==="noapto");
  const bcraMark = !!(b && !b.error && !b.sin && (b.luz==="y"||b.luz==="r"));   // el BCRA aporta la marca
  const eygMark  = !!(iv && iv.nivel!=="ok");                                   // los pagos aportan la marca
  const motivo = v.motivo ? (v.motivo.charAt(0).toUpperCase()+v.motivo.slice(1)+".") : "";
  return `<div class="pf-head"><span class="cf-circ ${v.luz}"></span><div><div class="pf-t">${esc(v.titulo)}</div><div class="pf-s">${esc(v.sub)}</div></div></div>
    ${(v.nivel!=="apto"&&motivo)?`<div class="pf-why pf-${v.luz}"><b>Por qué no es “Apto”:</b> ${esc(motivo)}</div>`:''}
    <div class="pf-cruce">
      <div class="pf-src"><span class="pf-ico">🏦</span><span class="pf-k">Bancos (BCRA)</span><b class="${bcraMark?'mark':''}">${esc(bcraTexto(c))}</b></div>
      <div class="pf-src"><span class="pf-ico">🤝</span><span class="pf-k">Pagos con EyG</span><b class="${eygMark?'mark':''}">${esc(eygTexto(c))}</b></div>
    </div>
    ${cobra?'<div class="cf-cob">🤝 La evaluación final la hace Cobranzas.</div>':''}
    <button class="cf-info" onclick="toggleLeyenda(this)">ℹ️ ¿Qué significan los niveles?</button>
    <div class="cf-leg" style="display:none">${EYG.credLeyendaHTML()}</div>`;
}
function toggleLeyenda(btn){ const el=btn.nextElementSibling; if(!el) return; const show=el.style.display==="none"; el.style.display=show?"block":"none"; btn.textContent=show?"▲ Ocultar":"ℹ️ ¿Qué significan los niveles?"; }
// Abrir/cerrar el resumen desde el chip
function togglePerfil(){
  const box=document.getElementById("perfilBox"); if(!box) return;
  const c=ST.contactos.find(x=>x.id===(EDIT&&EDIT.id)); if(!c) return;
  const abrir = box.style.display==="none" || !box.style.display;
  if(abrir){ box.innerHTML=perfilResumenHTML(c); box.style.display="block"; box.scrollIntoView({behavior:"smooth",block:"nearest"}); }
  else box.style.display="none";
}
// Refresca el chip (y el resumen si está abierto) de la ficha abierta
function refrescarPerfilFicha(){
  if(!EDIT || EDIT.isNew) return; const c=ST.contactos.find(x=>x.id===EDIT.id); if(!c) return;
  const chip=document.getElementById("perfilChip"); if(chip) chip.innerHTML=perfilChipHTML(c);
  const box=document.getElementById("perfilBox"); if(box && box.style.display==="block") box.innerHTML=perfilResumenHTML(c);
}
// Al abrir la ficha: si falta el BCRA, se consulta; luego refresca el chip/resumen.
async function credFichaFetch(c){
  const cu=cuitDe(c);
  if(cu && (!ST.bcra[cu] || bcraStale(ST.bcra[cu]))){
    try{ const r=await EYG.bcraResumen(cu); if(r&&!r.error){ r.ts=hoyStr.slice(0,10); ST.bcra[cu]=r; EYG.bcraCacheMerge({[cu]:r}); } else if(r){ ST.bcra[cu]=r; } }catch(e){}
  }
  refrescarPerfilFicha();
}
/* ===== Carpeta "A conquistar" (bolsillo del comercial) ===== */
function conqRubro(t){ return t===1 ? {e:"🏥",l:"Institución"} : {e:"💊",l:"Farmacia"}; }
// PENDIENTES = lo que todavía hay que trabajar: ni creado (ya pasó a la cartera) ni descartado.

function conqTrabajados(){ return (ST.conquistar||[]).filter(it=>it.partnerId && !it.descartado).length; }

   Un solo mapa con MIS CLIENTES y los POTENCIALES (farmacias e instituciones habilitadas del
   padrón oficial que todavía no son contacto de nadie). Sirve para dos cosas: ver la zona real
   donde trabajo y salir a conquistar lo que tengo al lado.

   Cómo se reparten los potenciales (ver el motor en core.js):
   · Los ven TODOS los comerciales. El que "lo toma" se lo reserva por 15 días y para el resto
     queda en GRIS con el nombre de quien lo tiene — en gris y no invisible, para que nadie llame
     dos veces al mismo lugar y para que se vea que hay movimiento.
   · Si en esos 15 días no lo contactó ni lo convirtió en cliente, la reserva vence sola y vuelve
     al mapa de todos. Registrar un contacto (WhatsApp/llamada) renueva el plazo.
   · Tope de 20 reservas abiertas por comercial: para tomar más, hay que cerrar las que tenés.
   · Zonas: una localidad sin dueño es libre para todos (así queda Rosario, donde estamos todos).
     Una localidad con dueño la trabaja solo ese comercial (el interior, donde el viaje cuesta).
     Las asignan los líderes desde el módulo Contactos. */
let MAPA=null, MAPACAPA=null, _mapaFit="";
const MAPTEL={};
const ES_LIDER = () => ["lider","admin","direccion"].includes(((window.__perfil)||{}).rol);
function mapaCardHTML(){
  const r=(ST.mapa&&ST.mapa.misReservas)||0;
  return `<div class="conqcard mapa" onclick="mostrarVista('mapa')">
      <span class="cc-ic">🗺️</span>
      <div class="cc-tx"><b>Mapa de mi zona</b><span>Mis clientes y las farmacias e instituciones que todavía no son de nadie${r?` · ${r} tomado${r>1?'s':''} por vos`:''}</span></div>
      <span class="cc-go">Abrir →</span>
    </div>`;
}
async function cargarMapa(){
  const uni=await EYG.padCargar();
  EYG.padCruzar(uni, ST.contactos||[], {
    nombre:c=>c.name, ciudad:c=>c.city, calle:c=>c.street, id:c=>c.id,
    prov:c=>c.state_id?String(c.state_id[1]).replace(/\s*\((AR|IT)\)$/,""):""
  });
  const [todos, zonas]=await Promise.all([EYG.conquistarLeer(), EYG.zonasLeer()]);
  const hoy=EYG.argToday();
  ST.mapa={ uni, zonas, todos, ix:EYG.conqIndice(todos,hoy), hoy,
            misReservas:EYG.conqReservasDe(todos,COMERCIAL,hoy).length };
  ST.conquistar=EYG.conquistarDeComercial(todos, COMERCIAL);
  if(!ST.mapaFil) ST.mapaFil={prov:"Santa Fe", loc:"", tipo:"", verMios:true, verLibres:true, verOtros:true, verAprox:false};
}
function pintarMapa(app){
  app.innerHTML=`<div class="vhead"><button class="vback" onclick="volverDash()">← Volver</button><h1>🗺️ Mapa de mi zona</h1></div>
    <div id="mapabody"><div class="ppempty">Cargando el mapa y el padrón oficial…</div></div>`;
  if(ST.mapa) return pintarMapaCuerpo();
  cargarMapa().then(pintarMapaCuerpo).catch(e=>{
    const b=document.getElementById("mapabody");
    if(b) b.innerHTML=`<div class="ppempty">No pude cargar el mapa (${esc(e.message||e)}). Probá de nuevo en un rato.</div>`;
  });
}
/* Qué se ve, según los filtros y las reglas de zona/reserva. */
function mapaDatos(){
  const M=ST.mapa, F=ST.mapaFil, out={mios:[], pot:[]};
  if(!M) return out;
  const N=EYG.padNorm, provOk=F.prov?N(F.prov):null;
  const byId={}; (ST.contactos||[]).forEach(c=>byId[c.id]=c);
  M.uni.est.forEach((e,idx)=>{
    const L=M.uni.locs[e[1]]; if(!L) return;
    if(provOk && N(L[1])!==provOk) return;
    if(F.loc && N(L[0])!==N(F.loc)) return;
    if(F.tipo==="farm" && e[2]!==0) return;
    if(F.tipo==="inst" && e[2]!==1) return;
    const pt=EYG.padPunto(M.uni, idx); if(!pt) return;
    if(pt.aprox && !F.verAprox) return;
    if(e[6]){                                   // ya es contacto de la casa
      const c=byId[e[6]]; if(!c) return;        // de otro comercial: no es asunto mío
      if(F.verMios) out.mios.push({idx, pt, c, loc:L[0]});
      return;
    }
    const nombre=EYG.padTitulo(e[0]);
    const it=M.ix[((nombre||"")+"|"+(L[0]||"")).toLowerCase().replace(/\s+/g," ").trim()]||null;
    // descartado por alguien del equipo (cerró / no aplica): no se le ofrece más a nadie
    if(it && EYG.conqEstado(it, M.hoy)==="descartado") return;
    const mio=!!(it && it.com===COMERCIAL);
    const zona=EYG.zonaDe(M.zonas, L[0]);
    const puedo=EYG.zonaPermite(M.zonas, L[0], COMERCIAL, ES_LIDER());
    if(it && !mio && !F.verOtros) return;
    if(!it && !F.verLibres) return;
    out.pot.push({idx, pt, nombre, tipo:e[2], dom:e[3]||"", loc:L[0], prov:L[1], it, mio, zona, puedo});
  });
  return out;
}
function pintarMapaCuerpo(){
  const b=document.getElementById("mapabody"); if(!b) return;
  const M=ST.mapa, F=ST.mapaFil;
  if(!window.L){ b.innerHTML='<div class="ppempty">No pude cargar el mapa. Revisá la conexión.</div>'; return; }
  const D=mapaDatos();
  const provs=[...new Set(M.uni.locs.map(l=>l[1]))].sort();
  const locs=[...new Set(M.uni.est.map(e=>M.uni.locs[e[1]]).filter(l=>l&&(!F.prov||EYG.padNorm(l[1])===EYG.padNorm(F.prov))).map(l=>l[0]))].sort();
  const cupo=M.misReservas, tope=EYG.TOPE_RESERVAS;
  const libres=D.pot.filter(p=>!p.it).length, mios=D.pot.filter(p=>p.mio).length, otros=D.pot.filter(p=>p.it&&!p.mio).length;
  if(!document.getElementById("mimapa")){
    b.innerHTML=`<div class="mapanota">Los puntos <b>naranjas y azules</b> son farmacias e instituciones habilitadas que <b>todavía no son clientes de nadie</b>. Tocá uno y <b>tomalo</b>: queda reservado para vos ${EYG.RESERVA_DIAS} días y el resto lo ve en gris. Si no lo trabajás, vuelve al mapa de todos.</div>
      <div id="mapabar" class="mapabar"></div>
      <div class="mapawrap"><div id="mimapa"></div><div class="mapaleg" id="mapaleg"></div></div>`;
  }
  document.getElementById("mapabar").innerHTML=`
    <select onchange="setMapaFil('prov',this.value)" title="Provincia">${provs.map(p=>`<option ${F.prov===p?"selected":""}>${esc(p)}</option>`).join("")}</select>
    <select onchange="setMapaFil('loc',this.value)" title="Localidad"><option value="">Todas las localidades</option>${locs.slice(0,500).map(l=>`<option ${F.loc===l?"selected":""}>${esc(l)}</option>`).join("")}</select>
    <select onchange="setMapaFil('tipo',this.value)" title="Farmacias o instituciones">
      <option value="" ${F.tipo===""?"selected":""}>Farmacias e instituciones</option>
      <option value="farm" ${F.tipo==="farm"?"selected":""}>Solo farmacias</option>
      <option value="inst" ${F.tipo==="inst"?"selected":""}>Solo instituciones</option></select>
    <label style="font-size:12.5px;display:flex;align-items:center;gap:5px;cursor:pointer" title="Tus clientes actuales, ubicados con la dirección del padrón oficial"><input type="checkbox" ${F.verMios?"checked":""} onchange="setMapaFil('verMios',this.checked)"> Mis clientes</label>
    <label style="font-size:12.5px;display:flex;align-items:center;gap:5px;cursor:pointer" title="Los que tienen otros comerciales reservados, en gris"><input type="checkbox" ${F.verOtros?"checked":""} onchange="setMapaFil('verOtros',this.checked)"> Tomados por otros</label>
    <label style="font-size:12.5px;display:flex;align-items:center;gap:5px;cursor:pointer" title="El padrón no trae la ubicación exacta de todos: estos se apoyan en el centro de la localidad"><input type="checkbox" ${F.verAprox?"checked":""} onchange="setMapaFil('verAprox',this.checked)"> Ubicación aproximada</label>
    <span class="mapacupo ${cupo>=tope?'lleno':''}" title="Podés tener hasta ${tope} potenciales tomados a la vez. Para tomar más, convertí o soltá alguno.">🎯 ${cupo} de ${tope} tomados</span>`;
  document.getElementById("mapaleg").innerHTML=`
    <span class="lg"><span class="dot" style="background:#048782"></span> Mis clientes (${D.mios.length})</span>
    <span class="lg"><span class="dot" style="background:#EC8B5E"></span> Potencial · farmacia</span>
    <span class="lg"><span class="dot" style="background:#1E5FA8"></span> Potencial · institución</span>
    <span class="lg"><span class="dot" style="background:#1E7D46"></span> Tomados por vos (${mios})</span>
    <span class="lg"><span class="dot" style="background:#B9C4C2"></span> De otro comercial (${otros})</span>
    <span class="lg">${libres.toLocaleString("es-AR")} libres para tomar</span>
    <span class="lg" id="mapavista" style="margin-left:auto;font-weight:500;color:var(--gris2)"></span>`;
  dibujarMiMapa(D);
}
function setMapaFil(k,v){ ST.mapaFil[k]=v; if(k==="prov") ST.mapaFil.loc=""; _mapaFit=""; pintarMapaCuerpo(); }
function dibujarMiMapa(D){
  const div=document.getElementById("mimapa"); if(!div) return;
  if(!MAPA || !document.body.contains(MAPA.getContainer())){
    if(MAPA){ try{ MAPA.remove(); }catch(e){} MAPA=null; }
    MAPA=L.map(div,{zoomControl:true,preferCanvas:true}).setView([-32.95,-60.66],11);
    EYG.mapaBase(MAPA,"calles");     // OpenStreetMap: trae los nombres de calle, que es lo que sirve para salir a la calle
    MAPACAPA=L.layerGroup().addTo(MAPA); _mapaFit="";
  }
  // Una sola lista de puntos → la dibuja el motor compartido (de lejos agrupa por localidad,
  // de cerca dibuja solo lo que entra en pantalla). Con esto el mapa no se traba.
  const items=[];
  D.mios.forEach(m=>items.push({lat:m.pt.lat, lon:m.pt.lon, loc:m.loc, color:"#048782", radio:6,
    opacidad:m.pt.aprox?.45:.92, popup:()=>popupCliente(m), ancho:290}));
  D.pot.forEach(p=>items.push({lat:p.pt.lat, lon:p.pt.lon, loc:p.loc,
    color: p.mio?"#1E7D46":p.it?"#B9C4C2":(p.tipo===0?"#EC8B5E":"#1E5FA8"),
    radio: p.mio?8:5.5, borde: p.mio?"#0E5C33":"#fff", peso: p.mio?2.5:1.4,
    opacidad: (p.it&&!p.mio)?.55:(p.pt.aprox?.45:.9), popup:()=>popupPotencial(p), ancho:300}));
  const key=[ST.mapaFil.prov,ST.mapaFil.loc,ST.mapaFil.tipo].join("|");
  if(items.length && _mapaFit!==key){
    _mapaFit=key;
    try{ MAPA.fitBounds(L.latLngBounds(items.map(i=>[i.lat,i.lon])).pad(.08),{maxZoom:14}); }catch(e){}
  }
  EYG.mapaPuntos(MAPA, MAPACAPA, items, {onPintado:info=>{
    const el=document.getElementById("mapavista"); if(!el) return;
    el.textContent = info.modo==="grupos"
      ? `${info.enVista} en pantalla, agrupados — acercate para verlos uno por uno`
      : (info.fuera ? `Viendo ${info.dibujados} en pantalla` : `Viendo los ${info.dibujados} de esta zona`);
  }});
  setTimeout(()=>{ try{ MAPA.invalidateSize(); }catch(e){} },60);
}
function popupCliente(m){
  const c=m.c, tel=c.mobile||c.phone||"", wa=waN(tel);
  return `<div class="mpn">${esc(c.name)}</div>
    <div class="mpd">✅ <b>Ya es cliente tuyo</b><br>${esc(c.street||"")}${c.city?"<br>"+esc(c.city):""}${tel?"<br>"+esc(fmtTel(tel)):""}</div>
    <div class="mpb">${wa?`<a class="wa" href="https://api.whatsapp.com/send?phone=${wa}" target="_blank" rel="noopener">WhatsApp</a>`:""}
      ${tel?`<a href="tel:${esc(digits(tel))}">📞 Llamar</a>`:""}
      <button onclick="abrir(${c.id})">Abrir ficha</button></div>`;
}
function popupPotencial(p){
  const q=[p.nombre,p.loc,p.prov].filter(Boolean).join(" ");
  const g="https://www.google.com/search?q="+encodeURIComponent(q+" teléfono");
  const mp="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([p.nombre,p.dom,p.loc,p.prov].filter(Boolean).join(" "));
  const fg="https://app.farmageo.com.ar/#/buscarfarmacia?f="+encodeURIComponent((p.nombre||"").replace(/^farmacias?\s+/i,"").trim());
  const dias=p.it?EYG.conqDiasRestantes(p.it, ST.mapa.hoy):null;
  let estado, acciones;
  if(p.mio){
    estado=`<span style="color:#1E7D46;font-weight:700">🎯 Lo tomaste vos</span>${dias!=null?` · te quedan <b>${dias} día${dias===1?'':'s'}</b>`:''}`;
    acciones=`<button class="go" onclick="crearDesdeMapa('${p.it.id}')">✅ Crear la ficha del cliente</button>
      <button class="off" onclick="soltarDelMapa('${p.it.id}')" title="Vuelve al mapa de todos">Soltar</button>`;
  }else if(p.it){
    estado=`<span style="color:#7A8886;font-weight:700">🔒 Lo tiene ${esc(p.it.com||"otro comercial")}</span>${dias!=null?` · le quedan ${dias} día${dias===1?'':'s'}`:''}<br><span style="font-size:11.5px">No lo llames: si no lo trabaja, en unos días vuelve al mapa.</span>`;
    acciones=ES_LIDER()?`<button class="off" onclick="soltarDelMapa('${p.it.id}')" title="Como líder podés liberarlo para que lo trabaje otro">Liberar</button>`:"";
  }else if(!p.puedo){
    estado=`<span style="color:#B7791F;font-weight:700">📍 Zona de ${esc(p.zona)}</span><br><span style="font-size:11.5px">Esta localidad la trabaja ${esc(p.zona)}. Si te interesa, pedíselo a tu líder.</span>`;
    acciones="";
  }else{
    estado=`<span style="color:var(--coral);font-weight:700">✨ Libre</span> · nadie lo está trabajando`;
    acciones=`<button class="go" onclick="tomarDelMapa(${p.idx})">🎯 Lo tomo</button>`;
  }
  return `<div class="mpn">${esc(p.nombre)}</div>
    <div class="mpd">${p.tipo===0?'💊 Farmacia':'🏥 Institución'} · ${esc(p.loc)}<br>📍 <b>${esc(p.dom||"sin dirección en el padrón")}</b>${p.pt.aprox?'<br><span style="color:#B7791F">⚠ ubicación aproximada</span>':''}<br>${estado}</div>
    <div class="mptel"><input placeholder="pegá el teléfono que encontraste" value="${esc(MAPTEL[p.idx]||'')}" oninput="MAPTEL[${p.idx}]=this.value">
      <button class="wa" title="Abrir WhatsApp" onclick="waDelMapa(${p.idx}${p.it&&p.mio?",'"+p.it.id+"'":""})">💬</button>
      <button title="Llamar" onclick="llamarDelMapa(${p.idx}${p.it&&p.mio?",'"+p.it.id+"'":""})">📞</button></div>
    <div class="mpb"><a href="${g}" target="_blank" rel="noopener">🔎 Google</a><a href="${mp}" target="_blank" rel="noopener">📍 Maps</a>${p.tipo===0?`<a href="${fg}" target="_blank" rel="noopener" title="Mapa del Colegio de Farmacéuticos: te dice si está activa y si tiene WhatsApp">🟢 Farmageo</a>`:""}</div>
    <div class="mpb">${acciones}</div>`;
}
async function tomarDelMapa(idx){
  const M=ST.mapa, e=M.uni.est[idx], L2=M.uni.locs[e[1]]||[];
  const item={nombre:EYG.padTitulo(e[0]), tipo:e[2], loc:L2[0]||"", prov:L2[1]||"", dom:e[3]?EYG.padTitulo(e[3]):""};
  if(!EYG.zonaPermite(M.zonas, item.loc, COMERCIAL, ES_LIDER())){ toast("Esa localidad la trabaja "+EYG.zonaDe(M.zonas,item.loc)); return; }
  toast("Tomando…");
  try{
    const r=await EYG.conquistarTomar(item, COMERCIAL, COMERCIAL);
    if(!r.ok && r.motivo==="ocupado"){ toast("Te ganaron de mano: lo tiene "+(r.de||"otro comercial")); }
    else if(!r.ok && r.motivo==="tope"){ toast(`Ya tenés ${r.tope} tomados. Convertí o soltá alguno para tomar más.`); }
    else if(r.ok){ toast(r.motivo==="renovado"?"Renovaste el plazo 🎯":"¡Es tuyo por "+EYG.RESERVA_DIAS+" días! 🎯", true); }
    if(MAPA) MAPA.closePopup();
    await cargarMapa(); pintarMapaCuerpo();
  }catch(err){ toast("No pude tomarlo: "+(err.message||err)); }
}
async function soltarDelMapa(id){
  if(!confirm("¿Soltarlo? Vuelve al mapa de todos y lo puede tomar cualquiera.")) return;
  try{ await EYG.conquistarLiberar(id); if(MAPA) MAPA.closePopup(); toast("Lo soltaste"); await cargarMapa(); pintarMapaCuerpo(); }
  catch(e){ toast("No pude soltarlo: "+(e.message||e)); }
}
// "Crear la ficha" reusa el mismo formulario prellenado que el bolsillo de a conquistar
function crearDesdeMapa(id){ const it=(ST.conquistar||[]).find(x=>x.id===id); if(!it){ toast("No encontré ese contacto"); return; } tomar(id); }
/* Registrar el contacto renueva el plazo: es la señal de que lo está trabajando de verdad. */
function _registrarContacto(itId, via){ if(itId) EYG.conquistarContacto(itId, via).then(()=>cargarMapa()).catch(()=>{}); }
function waDelMapa(idx, itId){
  const n=waN(MAPTEL[idx]||""); if(!n){ toast("Pegá primero un celular válido"); return; }
  _registrarContacto(itId,"whatsapp"); window.open("https://wa.me/"+n,"_blank");
}
function llamarDelMapa(idx, itId){
  const d=digits(MAPTEL[idx]||""); if(d.length<6){ toast("Pegá primero un número"); return; }
  _registrarContacto(itId,"llamada"); window.location.href="tel:"+d;
}

// ===== Descartar un contacto a conquistar (con motivo → lo revisa el líder) =====
const MOTIVOS_DESCARTE=["Ya no existe / cerró","No se pudo comunicar","No le interesa","Datos incorrectos"];
function descartarConquistar(id){
  const it=(ST.conquistar||[]).find(x=>x.id===id); if(!it) return;
  let host=document.getElementById("conqModal"); if(!host){ host=document.createElement("div"); host.id="conqModal"; document.body.appendChild(host); }
  host.innerHTML=`<div class="cq-ov" onclick="if(event.target===this)cerrarDescartar()"><div class="cq-card">
    <div class="cq-hd"><b>Descartar contacto</b><button class="cq-x" onclick="cerrarDescartar()">✕</button></div>
    <div class="cq-bd">
      <div class="cq-nm">${esc(it.nombre)}</div>
      <div class="cq-sub">¿Por qué lo descartás? Tu líder lo va a revisar.</div>
      <div class="cq-motivos">${MOTIVOS_DESCARTE.map((m,i)=>`<button class="cq-mot" onclick="doDescartar('${id}',${i})">${esc(m)}</button>`).join("")}</div>
      <input id="cqOtro" class="cq-otro" placeholder="Otro motivo (opcional)…" onkeydown="if(event.key==='Enter')doDescartarOtro('${id}')">
      <button class="cq-otrob" onclick="doDescartarOtro('${id}')">Descartar con este motivo</button>
    </div></div></div>`;
}
function cerrarDescartar(){ const h=document.getElementById("conqModal"); if(h) h.innerHTML=""; }
function doDescartar(id, i){ _descartar(id, MOTIVOS_DESCARTE[i]||"Sin motivo"); }
function doDescartarOtro(id){ const el=document.getElementById("cqOtro"); const v=(el&&el.value||"").trim()||"Otro motivo"; _descartar(id, v); }
async function _descartar(id, motivo){
  cerrarDescartar();
  const it=(ST.conquistar||[]).find(x=>x.id===id); if(!it) return;
  it.descartado={motivo, por:COMERCIAL, ts:new Date().toISOString()};   // sale del bolsillo al instante
  render();
  try{
    await EYG.conquistarPatch(id, {descartado:it.descartado});
    await EYG.notificarLideresDe(COMERCIAL, {
      titulo:"Contacto descartado · A conquistar",
      cuerpo:`${COMERCIAL} descartó "${it.nombre}"${it.loc?(" ("+it.loc+")"):""}.\nMotivo: ${motivo}.\nRevisalo para archivarlo o eliminarlo.`,
      autor:COMERCIAL });
    toast("Descartado. Le avisamos a tu líder.");
  }catch(e){ toast("Se descartó (no pude avisar al líder)"); }
}
// Provincia del padrón → id de res.country.state (para prellenar el formulario)
function matchProvId(prov){ if(!prov) return false; const n=prov.toLowerCase().trim();
  const L=ST.catProv||[]; const hit=L.find(p=>(p.name||"").toLowerCase()===n) || L.find(p=>{const pn=(p.name||"").toLowerCase(); return pn.includes(n)||n.includes(pn);});
  return hit?hit.id:false; }
// Tomar un ítem: abre el formulario de "nuevo contacto" prellenado con los datos del padrón.
function tomar(id){
  const it=(ST.conquistar||[]).find(x=>x.id===id); if(!it) return;
  const provId=matchProvId(it.prov), rubroTag=it.tipo===1?33:30;   // 33 Institución · 30 Farmacia
  const pseudo={ id:0, name:it.nombre, company_type:"company", is_company:true, city:it.loc||"", street:it.dom||"",
    state_id: provId?[provId, it.prov]:false, category_id: rubroTag?[rubroTag]:[], phone:"", mobile:"", email:"", vat:"" };
  ST._tomando=id;
  abrirForm(pseudo, true);
}
/* ===== Acceso al portal (web de Odoo) — replicado del módulo Contactos =====
   Crea el usuario portal (grupo 10) SIN mandar mail (no_reset_password) y genera un link con
   token (signup_url) para pasar por WhatsApp; el cliente pone su propia clave. Necesita EMAIL. */
const GRUPO_PORTAL=10;
const emailValido=e=>/^[^\s;,@]+@[^\s;,@]+\.[^\s;,@]+$/.test((e||"").trim());
function fmtDiaHora(s){ if(!s) return ""; try{ const ap=EYG.argParts(s); return ap.date.slice(8,10)+"/"+ap.date.slice(5,7)+" "+ap.hm; }catch(e){ return String(s).slice(8,10)+"/"+String(s).slice(5,7)+" "+String(s).slice(11,16); } }
// ícono de la fila (verde=ya ingresó · ámbar=tiene acceso pero no ingresó · nada=sin acceso)
function portalIcon(c){
  const p=ST.portal&&ST.portal[c.id]; if(!p) return "";
  return p.loggedIn

async function cargarPortal(id){
  const box=document.getElementById("portalbox"); if(!box) return;
  const c=ST.contactos.find(x=>x.id===id); if(!c) return;
  if(!c.email){ box.innerHTML=`<p class="pmuted">Para el portal necesita un <b>email</b> (es su usuario). Cargalo abajo en la ficha con "Guardar".</p>`; return; }
  if(!emailValido(c.email)){ box.innerHTML=`<p class="pmuted">El email <b>${esc(c.email)}</b> no parece válido. Corregilo antes de dar acceso.</p>`; return; }
  try{
    const p=(await rpc("res.partner","read",[[id]],{fields:["user_ids"]}))[0];
    const uids=(p&&p.user_ids)||[];
    if(uids.length){
      const us=await rpc("res.users","read",[uids],{fields:["id","login","share","active","login_date"]});
      const interno=us.find(u=>!u.share);
      if(interno){ box.innerHTML=`<p class="pmuted">Tiene un usuario <b>interno</b> de la empresa (no es cliente del portal). No se toca desde acá.</p>`; return; }
      const share=us.find(u=>u.share);
      if(share){
        const estado = share.login_date
          ? `<div class="palert ok">✅ <b>Ya ingresó y creó su clave.</b> Último ingreso: ${fmtDiaHora(share.login_date)}.</div>`
          : `<div class="palert pend">⏳ <b>Todavía no ingresó.</b> Tiene el acceso creado pero aún no puso su clave — pasale el link.</div>`;
        box.innerHTML=`<div class="plogin">👤 Usuario: <b>${esc(share.login)}</b>${share.active?'':' · <b style="color:var(--bad)">revocado</b>'}</div>
          ${estado}
          <button class="pbtn agua" onclick="linkPortal(${id})">🔗 Generar link de acceso</button>
          <div id="portallink"></div>
          <button class="pbtn gris" onclick="revocarPortal(${id},${share.id})">Revocar acceso</button>`;
        return;
      }
    }
    box.innerHTML=`<p class="pmuted">Dale acceso a la web de Odoo (ve sus pedidos, facturas y saldo). Se crea su usuario y generás un link para que ponga su clave.</p>
      <button class="pbtn teal" onclick="darAccesoPortal(${id})">🌐 Dar acceso al portal</button>`;
  }catch(e){ box.innerHTML=`<p class="pmuted">No pude leer el estado del portal (${esc(e.message||e)}).</p>`; }
}
async function darAccesoPortal(id){
  const c=ST.contactos.find(x=>x.id===id); if(!c||!emailValido(c.email)) return;
  const box=document.getElementById("portalbox"); if(box) box.innerHTML='<p class="pmuted">Creando acceso…</p>';
  try{
    const p=(await rpc("res.partner","read",[[id]],{fields:["user_ids","name","email"]}))[0];
    if(!(p.user_ids&&p.user_ids.length)){
      await rpc("res.users","create",[{login:(p.email||"").trim(),name:p.name||c.name,partner_id:id,groups_id:[[6,0,[GRUPO_PORTAL]]]}],{context:{no_reset_password:true,lang:"es_AR"}});

// ===== Ofertas y combos =====
const OF_DIAS_DEF=30;                       // ventana de conteo cuando la oferta no trae 'desde' ni 'creada'
const fFecha=s=>{const p=String(s||"").slice(0,10).split("-"); return p.length===3?p[2]+"/"+p[1]:"";};
// Vencimiento de producto: se muestra MM/AAAA (los lotes de farma usan mes/año; el día es 01).
const fVenc=s=>{const p=String(s||"").slice(0,10).split("-"); return p.length===3?p[1]+"/"+p[0]:"";};
const ofItems=o=>(o.items||[]).map(i=>i.nombre).filter(Boolean).join(" + ");
const ofDesc=o=>(o.precioAntes>0&&o.precioAntes>o.precio)?Math.round((1-o.precio/o.precioAntes)*100):0;
const ofMeta=o=>o.metaClientes>0?o.metaClientes:OF_META_CLIENTES;
// Inicio de la ventana de conteo = timestamp EXACTO de publicación (no las 00:00 del día),
// para no contar compras de rutina hechas antes de que la oferta existiera. Devuelve
// "YYYY-MM-DD HH:MM:SS"; si sólo hay fecha, arranca a las 00:00.
const ofDesde=o=>{ const d=String(o.desde||o.creada||(hace(OF_DIAS_DEF)+" 00:00:00")); return d.length<=10?(d+" 00:00:00"):d; };
// clientes DISTINTOS con al menos una oferta vigente colocada (es la unidad de la meta del nivel)
// puntos de la dimensión ofertas = enviar (actividad) + vender (resultado)
function ofPuntos(){ return Math.min((ST.ofEnviadas||0)/OF_META_ENV,1)*OF_PTS_ENV + Math.min((ST.ofVendidas||0)/OF_META_VEN,1)*OF_PTS_VEN; }
/* Ofertas compartidas hoy / en la semana ([EyGOFENV] en el partner propio). Cuentan como
   actividad de contacto del día (se suman a la meta de "contactos") y como mensajes enviados. */
function ofHoy(){ const _t=hoyStr.slice(0,10); return (ST.ofMsgs||[]).filter(m=>m.date===_t).length; }
function ofSem(){ return (ST.ofMsgs||[]).filter(m=>m.date>=inicioSem).length; }

/* Texto para compartir por WhatsApp. Formato de WhatsApp: *negrita*, ~tachado~.
   Sale del mismo dato que se publicó, así el comercial no reescribe nada. */
function ofertaMsg(o){
  const items=ofItems(o), off=ofDesc(o), tit=o.titulo||items, L=[];
  L.push(o.tipo==="combo"?"🎁 *Combo Droguería EyG*":"🏷️ *Oferta Droguería EyG*");
  L.push("*"+tit+"*");
  if(items && items!==tit) L.push(items);   // si el título ES la lista de items, no la repite
  if(o._info){                              // sin precio único (categoría entera)
    if(o._alcance) L.push(o._alcance);
    if(o._off)     L.push("*"+o._off+"*");
  }else{
    L.push(o.precioAntes>o.precio
      ? "~"+money(o.precioAntes)+"~ → *"+money(o.precio)+"*"+(off?" (−"+off+"%)":"")
      : "*"+money(o.precio)+"*");
  }
  if(o.stock>0) L.push("📦 "+o.stock+" disponibles");
  if(o.venc)    L.push("📅 Vencimiento del producto"+(o.vencMulti?" (más próximo)":"")+": "+fVenc(o.venc));
  if(o.nota)    L.push("📝 "+o.nota);
  if(o.hasta)   L.push("⏳ Válido hasta el "+fFecha(o.hasta));
  L.push("");
  L.push("¿Lo sumamos a tu próximo pedido?");
  return L.join("\n");
}

// Rendimiento por oferta (global): conversión = vendidas ÷ enviadas por todos, + volumen.
function ofStat(o){ const g=ST.ofertas[o.id]||{}; const env=g.gEnv||0, ven=g.gVen||0, conv=env>0?ven/env:0; return {env,ven,conv, score:conv*100+ven}; }
function ofertasHTML(){
  if(!OFERTAS.length) return "";
  const SC=OFERTAS.map(ofStat);
  // Las mejores: hasta 4 con ventas reales, ordenadas por rendimiento. Llevan la llamita.
  const hotIds=new Set(OFERTAS.map((o,i)=>({id:o.id,s:SC[i]})).filter(x=>x.s.ven>=1)
    .sort((a,b)=>b.s.score-a.s.score).slice(0,4).map(x=>x.id));
  // Orden de aparición: primero las mejores (por rendimiento), después las nuevas/resto (orden original).
  const order=OFERTAS.map((o,i)=>i).sort((a,b)=>{
    const ha=hotIds.has(OFERTAS[a].id), hb=hotIds.has(OFERTAS[b].id);
    if(ha!==hb) return ha?-1:1;
    if(ha&&hb) return SC[b].score-SC[a].score;
    return a-b;
  });
  const cards=order.map(i=>{ const o=OFERTAS[i];
    const st=ST.ofertas[o.id]; const col=st?st.colocados:null;
    const meta=ofMeta(o);
    const pct=col==null?0:Math.min(100,Math.round(col/meta*100));
    const off=ofDesc(o), items=ofItems(o), tit=o.titulo||items;
    // Veces que ESTE comercial compartió esta oferta este mes (notas [EyGOFENV] cuyo cuerpo
    // incluye el título con el que se registró el envío). Es la "actividad" de la tarjeta.
    const envN=(ST.ofMsgs||[]).filter(m=>m.body&&tit&&m.body.includes(tit)).length;
    // días enteros de calendario: con la resta de timestamps, una oferta que cierra hoy
    // daba "vence mañana" y una a 5 días daba 6.
    const dl=o.hasta?Math.round((new Date(o.hasta+"T00:00:00")-new Date(hoyStr+"T00:00:00"))/86400000):null;
    const venc=dl==null?"Sin fecha de cierre":dl<=0?"Último día":dl===1?"Vence mañana":("Vence en "+dl+"d");
    // _info = descuento sobre una categoría entera: no hay precio único que mostrar ni
    // producto contra el cual contar, así que va sin precio y sin barra de progreso.
    const badge = o._info ? (o._off?`<span class="of-off">${esc(o._off)}</span>`:'')
                          : (off?`<span class="of-off">−${off}%</span>`:'');
    const s=SC[i], hot=hotIds.has(o.id), rendPct=s.env>0?Math.round(s.conv*100):null;
    const rendCls=rendPct==null?'':(rendPct>=40?'alta':rendPct>=15?'media':'baja');
    return `<div class="of-card${hot?' hot':''}">
      <div class="of-top"><span class="of-name">${esc(tit)}</span>${badge}</div>
      <div class="of-prod">${o._info?esc(o._alcance||'Descuento en la categoría'):((items&&items!==tit)?esc(items):'&nbsp;')}</div>
      <div class="of-price">${o._info?`<span class="of-new" style="font-size:14px">🏷️ Descuento aplicado</span>`:`${o.precioAntes>o.precio?`<span class="of-old">${money(o.precioAntes)}</span>`:''}<span class="of-new">${money(o.precio)}</span>`}</div>
      <div class="of-extra">${(o.stock>0||o.nota)?`${o.stock>0?'📦 '+o.stock+' disp.':''}${(o.stock>0&&o.nota)?' · ':''}${o.nota?'📝 '+esc(o.nota):''}`:'&nbsp;'}</div>
      ${o._info?'':`<div class="of-bar"><i style="width:${pct}%"></i></div>`}
      <div class="of-perf" title="Rendimiento de esta oferta en toda la droguería (últimos 120 días)">
        <span title="Enviadas por todo el equipo">📤 <b>${s.env}</b></span>
        <span title="Clientes que la compraron">🛒 <b>${s.ven}</b></span>
        ${rendPct!=null?`<span class="of-rend ${rendCls}" title="Vendidas ÷ enviadas">${rendPct}%</span>`:''}
        ${(!o._info&&col!=null)?`<span class="of-mine" title="De tu cartera (meta ${meta})">vos ${col}/${meta}</span>`:''}
      </div>
      ${envN?`<div class="of-shared">📤 la compartiste ${envN}${envN===1?' vez':' veces'} este mes</div>`:''}
      <div class="of-actions">
        <span class="of-venc">⏳ ${venc}</span>
        <a class="of-wa" href="https://api.whatsapp.com/send?text=${encodeURIComponent(ofertaMsg(o))}" target="_blank" rel="noopener" onclick="confirmarCompartir('${(o.id||'').replace(/'/g,'')}')">${hot?'<span class="of-fire">🔥</span> ':''}Compartir por WhatsApp</a>
      </div>
    </div>`;
  }).join("");
  return `<div class="ofertas">
    <div class="of-head"><div><span class="of-ttl">🎁 Ofertas y combos</span><span class="of-sub">Publicadas por EyG · colocalas y sumás puntos</span></div>
      <span class="of-pts">+${Math.round(ofPuntos())} de ${OF_PTS_ENV+OF_PTS_VEN} pts</span></div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin:2px 0 12px;font-size:12.5px;font-weight:800;color:rgba(255,255,255,.9)">
      <span>📤 ${ST.ofEnviadas||0} enviada${(ST.ofEnviadas||0)===1?'':'s'} este mes</span>
      <span>🛒 ${ST.ofVendidas||0} vendida${(ST.ofVendidas||0)===1?'':'s'} este mes</span>
    </div>
    <div class="of-grid">${cards}</div>
  </div>`;
}

/* Texto del descuento de una oferta de Configuración de precios, que es relativo. */
function ofTxtSync(o){
  if(o.modo==="pct")   return "−"+(Math.round((o.valor||0)*1000)/10)+"%";
  if(o.modo==="monto") return "−"+money(o.valor)+" c/u";
  return "Precio "+money(o.valor);
}

/* Pasa las ofertas de Configuración de precios (eyg.sync_ofertas) a la forma de
   eyg.ofertas, para que el resto del bloque no tenga que saber de dónde vienen.
   - tipo 'p' (un producto): resuelve la variante y trae el precio de la lista TAL CUAL
     (ya viene con la oferta aplicada por el motor). Si no hay precio, cae a informativa.
   - tipo 'c' (categoría entera): no hay precio único ni producto que contar →
     tarjeta informativa (_info): descuento y vigencia, sin barra de progreso. */
async function normalizarSync(sync){
  const tmpls=[...new Set(sync.filter(o=>o.tipo==="p"&&o.target).map(o=>o.target))];
  const variante={}, base={}, pvpEtico={};
  if(tmpls.length){
    const [tps,pit]=await Promise.all([
      rpc("product.template","read",[tmpls,["product_variant_id","list_price","categ_id"]],{context:{lang:"es_AR"}}).catch(()=>[]),
      rpc("product.pricelist.item","search_read",
        [[["pricelist_id","=",LISTA],["applied_on","=","1_product"],["product_tmpl_id","in",tmpls]]],
        {fields:["product_tmpl_id","min_quantity","fixed_price"],limit:20000}).catch(()=>[])
    ]);
    for(const t of tps){ if(t.product_variant_id) variante[t.id]=t.product_variant_id[0];
      // éticos: guardamos el PVP (list_price) para mostrar el descuento contra el PVP, no la escalera
      if(/[EÉ]TICO/i.test((t.categ_id&&t.categ_id[1])||"")) pvpEtico[t.id]=Math.round(t.list_price||0); }
    // precio base = el tramo de la escalera con menor cantidad mínima
    for(const it of pit){ const t=it.product_tmpl_id[0];
      if(!base[t]||it.min_quantity<base[t].q) base[t]={q:it.min_quantity,p:it.fixed_price}; }
  }
  return sync.map(o=>{
    // fecha de creación: el id de sync es "of<timestamp ms>" → así el conteo cuenta
    // clientes DESDE que se publicó la oferta, no de los últimos 30 días.
    const mts=/^of(\d{13})$/.exec(o.id||""); const creada=mts?new Date(+mts[1]).toISOString().slice(0,19).replace("T"," "):"";
    const com={ id:"sync:"+o.id, tipo:"oferta", titulo:o.targetName||("#"+o.target),
      stock:o.stock||0, hasta:o.hasta||"", nota:"", creada, _off:ofTxtSync(o) };
    if(o.tipo!=="p") return {...com, items:[], precio:0, precioAntes:0, _info:true,
      _alcance:"📂 Descuento en toda la línea"};
    const pv=variante[o.target], precio=base[o.target]?base[o.target].p:0;
    if(!(precio>0) || !pv) return {...com, items:[], precio:0, precioAntes:0, _info:true,
      _alcance:"🔖 Descuento sobre el precio de lista"};
    // OJO: el precio de la lista YA VIENE CON LA OFERTA APLICADA. Al guardar en
    // Configuracion de precios se corre la accion 1213 (el motor), que reescribe la
    // escalera con el descuento adentro. Asi que el precio se trae tal cual, sin tocar:
    // volver a aplicarle el descuento lo dejaba al cuadrado (un -20% daba -36%).
    // El "antes" es lo unico que se calcula, revirtiendo el descuento.
    const v=o.valor||0;
    let antes = o.modo==="pct"   ? (v>0&&v<1 ? precio/(1-v) : 0)
              : o.modo==="monto" ? (v>0 ? precio+v : 0)
              :                    0;   // precio fijo: no hay "antes" que reconstruir
    // ÉTICOS: el "antes" es el PVP de Alfabeta (list_price), no la escalera ya rebajada.
    // Así el descuento que ve el cliente se calcula sobre el PVP y es mayor (oferta más tentadora).
    const pvp=pvpEtico[o.target]||0;
    if(pvp>precio) antes=pvp;
    return {...com, items:[{id:pv, nombre:o.targetName||("#"+o.target)}],
      precio, precioAntes: antes>precio ? antes : 0};
  });
}

/* Trae TODO lo activo —lo confirmado en Oportunidades y lo creado en Configuración de
   precios— y, para lo que apunta a productos concretos, cuenta contra Odoo a qué
   clientes de esta cartera se les colocó dentro de la vigencia. */
async function cargarOfertas(ids){
  try{
    const [rawOf,rawSync]=await Promise.all([
      rpc("ir.config_parameter","get_param",["eyg.ofertas"]).catch(()=>"[]"),
      rpc("ir.config_parameter","get_param",["eyg.sync_ofertas"]).catch(()=>"[]")
    ]);
    const propias=(JSON.parse(rawOf||"[]")||[]).filter(o=>o && o.id && (!o.hasta || o.hasta>=hoyStr));
    // productos (variantes) ya cubiertos por una oferta confirmada, para no duplicar
    const propiaPids=new Set(propias.flatMap(o=>(o.items||[]).map(i=>i.id)));
    // las de sync nacen activas: alcanza con que no estén pausadas y sigan vigentes.
    // Al confirmar una oportunidad se crea la oferta (eyg.ofertas) Y su regla de precio
    // (eyg.sync_ofertas con id "opo_<variante>"): son la MISMA oferta. Se descartan acá
    // para que no aparezca dos veces la misma tarjeta.
    let sync=(JSON.parse(rawSync||"[]")||[]).filter(o=>o && o.id && !o.pausada && (!o.hasta || o.hasta>=hoyStr))
      .filter(o=>{ const m=/^opo_(\d+)$/.exec(o.id||""); return !(m && propiaPids.has(+m[1])); });
    let syncNorm = sync.length?await normalizarSync(sync):[];
    // por si quedara algún producto ya cubierto por una oferta propia, se saca también
    syncNorm = syncNorm.filter(o=>{ const pv=(o.items||[])[0]&&o.items[0].id; return !(pv && propiaPids.has(pv)); });
    OFERTAS=propias.concat(syncNorm);
    // Sin stock real = la oferta se apaga sola de este panel (el producto no se puede vender).
    // Queda en gris "Agotada" en Oportunidades y Ofertas, para que Inventario reponga o la elimine.
    try{
      const sm=await EYG.ofStockMap(OFERTAS.flatMap(o=>(o.items||[]).map(i=>i&&i.id)));
      if(sm) OFERTAS=OFERTAS.filter(o=>!EYG.ofAgotada(o,sm));
    }catch(e){}
  }catch(e){ OFERTAS=[]; return; }
  await Promise.all(OFERTAS.map(async o=>{
    const pids=(o.items||[]).map(i=>i.id).filter(Boolean);
    if(!pids.length || !ids.length){ ST.ofertas[o.id]={colocados:0,cli:[]}; return; }
    const desde=ofDesde(o), hasta=(o.hasta||hoyStr).slice(0,10);
    try{
      // GLOBAL: clientes de TODA la droguería que compraron la oferta en su vigencia (sin
      // restringir a la cartera del comercial). De acá se derivan: lo mío (intersección con
      // mi cartera) y lo de TODOS (para las estadísticas de rendimiento de la oferta).
      // MISMA consulta que hace core.js para la tarjeta del líder, y una por
      // oferta: con 9 ofertas eran 9 read_group caros cada vez que un comercial
      // abría el panel. El resultado es GLOBAL (a propósito, ver el comentario
      // de arriba), o sea idéntico para todos: se comparte por la clave
      // "oferta-ventas-<id>". Lo mío se sigue derivando abajo, de este mismo
      // resultado, cruzando con mi cartera.
      const g=await EYG.cacheOdoo("oferta-ventas-"+o.id, 600, ()=>rpc("sale.order.line","read_group",
        [[["product_id","in",pids],["state","in",["sale","done"]],
          ["order_id.date_order",">=",desde],["order_id.date_order","<=",hasta+" 23:59:59"]],
         ["price_subtotal:sum"],["order_partner_id"]],{lazy:false}));
      const idset=new Set(ids);
      const rows=g.map(x=>({p:x.order_partner_id&&x.order_partner_id[0], m:x.price_subtotal||0})).filter(x=>x.p);
      const mios=rows.filter(x=>idset.has(x.p));
      ST.ofertas[o.id]={ colocados:mios.length, cli:mios.map(x=>x.p), monto:mios.reduce((s,x)=>s+x.m,0),
        gVen:rows.length, gMonto:rows.reduce((s,x)=>s+x.m,0) };
    }catch(e){ ST.ofertas[o.id]={colocados:0,cli:[],gVen:0,gMonto:0,err:true}; }
  }));
  // ---- Puntaje/encabezado: VENDIDAS = suma de "colocados" por oferta (cliente × oferta).
  // Cada colocados ya usa la ventana correcta [publicación exacta → cierre], así que NO
  // cuenta compras de rutina previas a la oferta. Consistente con lo que muestra cada tarjeta. ----
  OFPIDS=[...new Set(OFERTAS.flatMap(o=>(o.items||[]).map(i=>i.id)).filter(Boolean))];
  // Vencimiento del producto para el mensaje de WhatsApp. gg_lot_expiration_date = fecha del
  // lote MÁS PRÓXIMO con stock (verificado: coincide con el vencimiento a despachar por FEFO).
  // 1 sola consulta para todas las variantes; se guarda o.venc (el más próximo del combo).
  try{
    if(OFPIDS.length){
      const pr=await rpc("product.product","read",[OFPIDS,["gg_lot_expiration_date"]]);
      const vm={}; pr.forEach(p=>{ if(p.gg_lot_expiration_date) vm[p.id]=String(p.gg_lot_expiration_date).slice(0,10); });
      OFERTAS.forEach(o=>{ const vs=(o.items||[]).map(i=>vm[i.id]).filter(Boolean).sort(); o.venc=vs[0]||null; o.vencMulti=(new Set(vs).size>1); });
    }
  }catch(e){}
  // ENVÍOS GLOBALES por oferta: notas [EyGOFENV] de TODOS los comerciales (en cualquier partner),
  // agrupadas por el título con el que se registró el envío. Ventana: últimos 120 días.
  try{
    // MISMA consulta que hace core.js para la tarjeta del lider: un LIKE sobre
    // las 822k filas de mail.message, ~2 s de CPU de Odoo. Se comparte por la
    // clave "ofertas-enviadas-120d" en vez de que cada panel la repita.
    const allEnv=await EYG.cacheOdoo("ofertas-enviadas-120d", 600, ()=>rpc("mail.message","search_read",[[["model","=","res.partner"],["body","like","EyGOFENV"],["date",">=",hace(120)+" 00:00:00"]]],{fields:["body"],limit:0}));
    const envTexts=allEnv.map(m=>(m.body||"").replace(/<[^>]+>/g,""));
    OFERTAS.forEach(o=>{ const tit=o.titulo||ofItems(o); const g=(ST.ofertas[o.id]=ST.ofertas[o.id]||{}); g.gEnv=tit?envTexts.filter(b=>b.includes(tit)).length:0; });
  }catch(e){}
  ST.ofVendidas=OFERTAS.reduce((s,o)=>s+(((ST.ofertas[o.id]||{}).colocados)||0),0);
  try{
    if(ST.userPartner){
      // Notas [EyGOFENV] del mes en el partner del propio comercial: sirven para el puntaje
      // (ofEnviadas) Y para contar las ofertas como mensajes enviados hoy/semana (ofMsgs).
      const ofn=await rpc("mail.message","search_read",[[["model","=","res.partner"],["res_id","=",ST.userPartner],["date",">=",inicioMes+" 00:00:00"],["body","like","EyGOFENV"]]],{fields:["date","body"],limit:0});
      ST.ofMsgs=ofn.map(n=>({date:(n.date||"").slice(0,10), body:(n.body||"").replace(/<[^>]+>/g,"")}));
      ST.ofEnviadas=ST.ofMsgs.length;
    }
  }catch(e){ ST.ofEnviadas=0; ST.ofMsgs=[]; }
}

/* ===== Nivel 2: direcciones de entrega gestionadas desde la ficha (ver/agregar/editar/eliminar/principal) ===== */
async function cargarEntregasFicha(id){
  let dels=[];
  try{ dels=await rpc("res.partner","search_read",[[["parent_id","=",id],["type","=","delivery"]]],
    {fields:["id","name","street","city"],order:"name",context:{lang:"es_AR"}}); }catch(e){}
  const ppal = dels.length ? await principalDe(dels.map(d=>d.id)) : null;
  ST._entregas={parent:id, dels, ppal};
  pintarEntregas();
}
// principal entre un set de direcciones (marca reversible en el chatter; gana la marca "in" más reciente)
async function principalDe(delIds){
  if(!delIds||!delIds.length) return null;
  let msgs=[];
  try{ msgs=await rpc("mail.message","search_read",[[["model","=","res.partner"],["res_id","in",delIds],["body","like",PPAL_TAG]]],{fields:["res_id","body","date"],limit:0}); }catch(e){}
  const st={}, seen=new Set();
  msgs.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  for(const m of msgs){ if(seen.has(m.res_id)) continue; seen.add(m.res_id);
    const out=/salir/i.test((m.body||"").replace(/<[^>]+>/g," ")); st[m.res_id]={in:!out,date:m.date||""}; }
  let ppal=null,best=""; for(const rid in st){ if(st[rid].in && st[rid].date>best){ best=st[rid].date; ppal=+rid; } }
  return ppal;
}
function pintarEntregas(){
  const box=document.getElementById("entregas"); if(!box) return;
  const E=ST._entregas||{dels:[]};
  const rows=(E.dels||[]).map(d=>{
    const dir=[d.street,d.city].filter(Boolean).join(", ");
    const isP=E.ppal===d.id;
    return `<div class="lb-row"><div class="lb-i"><div class="lb-n">${isP?'⭐ ':''}${esc(d.name||"Sucursal")}</div>
      <div class="lb-f">${esc(dir)||"&nbsp;"}</div></div>
      <div class="lb-a">${isP?'<span class="lb-tag">Principal</span>':`<button class="lb-b" onclick="setPrincipal(${d.id})">Hacer principal</button>`}
        <button class="lb-b" onclick="editarEntregaF(${d.id})">Editar</button>
        <button class="lb-b del" onclick="eliminarEntregaF(${d.id})">Eliminar</button></div></div>`;
  }).join("");
  box.innerHTML=`<div class="libhead"><h4>📦 Direcciones de entrega</h4><button class="fbtn" onclick="addEntregaF()">＋ Agregar</button></div>
    ${(E.dels&&E.dels.length)?`<div class="lb-list">${rows}</div>`:'<div class="lb-empty">Sin direcciones de entrega. La mercadería iría a la dirección fiscal (que casi nunca es la de entrega).</div>'}`;
}
function addEntregaF(){ formEntregaF(null); }
function editarEntregaF(id){ formEntregaF((ST._entregas.dels||[]).find(x=>x.id===id)); }
function formEntregaF(d){
  const box=document.getElementById("entregas"); if(!box) return;
  box.innerHTML=`<div class="libhead"><h4>📦 ${d?'Editar dirección':'Nueva dirección de entrega'}</h4></div>
    <div class="pform">
      <input id="ne_name" placeholder="Nombre / referencia (Ej: Depósito Centro)" value="${d?esc(d.name||''):''}">
      <input id="ne_street" placeholder="Calle y número" value="${d?esc(d.street||''):''}">
      <input id="ne_city" placeholder="Localidad" value="${d?esc(d.city||''):''}">
      <div class="pform-b"><button class="fbtn" onclick="pintarEntregas()">Cancelar</button>
        <button class="fbtn go" onclick="guardarEntregaF(${d?d.id:0})">Guardar</button></div>
    </div>`;
  const i=document.getElementById("ne_name"); if(i) i.focus();

async function guardarEntregaF(id){
  const E=ST._entregas||{}; const v=x=>{const el=document.getElementById(x);return el?el.value.trim():"";};
  const name=v("ne_name"), street=v("ne_street"), city=v("ne_city");
  if(!name && !street){ toast("Poné un nombre o la dirección"); return; }
  try{
    if(id) await rpc("res.partner","write",[[id],{name:name||city||"Entrega",street,city}],{context:{lang:"es_AR"}});
    else   await rpc("res.partner","create",[{parent_id:E.parent,type:"delivery",name:name||city||"Entrega",street,city}],{context:{lang:"es_AR"}});
    toast(id?"📦 Dirección actualizada":"📦 Dirección agregada"); await cargarEntregasFicha(E.parent);
  }catch(e){ toast("⚠ No pude guardar: "+(e.message||e)); }
}
function eliminarEntregaF(id){
  const box=document.getElementById("entregas"); if(!box) return;
  const d=(ST._entregas.dels||[]).find(x=>x.id===id);
  box.innerHTML=`<div class="libhead"><h4>Eliminar dirección</h4></div>
    <div class="lb-empty">¿Eliminar <b>${esc(d?d.name:'')}</b>? Deja de estar disponible para entregas.</div>
    <div class="pform-b" style="margin-top:8px"><button class="fbtn" onclick="pintarEntregas()">Cancelar</button>
      <button class="fbtn del2" onclick="doEliminarEntregaF(${id})">Sí, eliminar</button></div>`;
}
async function doEliminarEntregaF(id){
  const E=ST._entregas||{};
  try{
    try{ await rpc("res.partner","unlink",[[id]]); }                     // borrado real si no está en uso
    catch(_){ await rpc("res.partner","write",[[id],{active:false}]); }  // si está en uso (pedidos), se archiva
    toast("Dirección eliminada"); await cargarEntregasFicha(E.parent);
  }catch(e){ toast("⚠ No pude eliminar: "+(e.message||e)); }
}
async function setPrincipal(id){
  const E=ST._entregas||{};
  try{
    await rpc("res.partner","message_post",[[id]],{body:`⭐ ${PPAL_TAG}`,message_type:"comment"});
    E.ppal=id; toast("⭐ Dirección principal"); pintarEntregas();
  }catch(e){ toast("⚠ No pude marcarla: "+(e.message||e)); }

    {fields:["id","name","function","phone","mobile","email"],context:{lang:"es_AR"}}); }catch(e){}

function pintarLibreta(){

  const rows=(L.people||[]).map(p=>{

      ? `${wa?`<a class="lb-b wa" href="https://api.whatsapp.com/send?phone=${wa}" target="_blank">WhatsApp</a>`:""}<a class="lb-b" href="tel:${esc(digits(tel))}">Llamar</a>`

  }).join("");

    ${(L.people&&L.people.length)?`<div class="lb-list">${rows}</div>`:'<div class="lb-empty">Sin contactos ni teléfonos cargados.</div>'}`;

function agregarPersona(pid){
  const box=document.getElementById("libreta"); if(!box) return;
  const L=ST._libreta||{}; const ed=pid?(L.people||[]).find(p=>p.id===pid):null;
  box.innerHTML=`<div class="libhead"><h4>👥 ${ed?"Editar contacto":"Nuevo contacto / teléfono"}</h4></div>
    <div class="pform">
      <input id="np_name" placeholder="Nombre o etiqueta — ej: Celular de pagos" value="${ed?esc(ed.name||""):""}">
      <input id="np_func" placeholder="Cargo (compras, pagos, dueño…) — opcional" value="${ed?esc(ed.function||""):""}">

    </div>`;
  const i=document.getElementById("np_name"); if(i) i.focus();
}
function editarPersona(pid){ agregarPersona(pid); }
async function guardarPersona(pid){
  const L=ST._libreta||{}; const v=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
  const name=v("np_name"), func=v("np_func"), phone=v("np_phone");
  if(!name && !phone){ toast("⚠️ Poné al menos un nombre/etiqueta o un teléfono"); return; }
  try{
    if(pid){
      // El teléfono se consolida en `phone` (y se limpia `mobile`) para que quede en un solo lugar;
      // el bot de WhatsApp busca en phone Y mobile, así que igual lo va a encontrar.
      await rpc("res.partner","write",[[pid],{name:name||"Contacto", function:func||false, phone:phone||false, mobile:false}],{context:{lang:"es_AR"}});
      toast("✓ Contacto actualizado");
    }else{
      const vals={parent_id:L.parent, type:"contact", is_company:false, name:name||"Contacto"};
      if(func) vals.function=func; if(phone) vals.phone=phone;
      await rpc("res.partner","create",[vals],{context:{lang:"es_AR"}});
      toast("👤 Contacto agregado");
    }
    await cargarContactos(L.parent);
  }catch(e){ toast("⚠ No pude guardar: "+(e.message||e)); }
}
async function eliminarPersona(pid){
  const L=ST._libreta||{};
  if(!confirm("¿Eliminar este contacto/teléfono del cliente?")) return;
  try{
    // Si el contacto está referenciado en Odoo (algún documento), unlink falla → se archiva (reversible).
    try{ await rpc("res.partner","unlink",[[pid]]); }
    catch(e){ await rpc("res.partner","write",[[pid],{active:false}],{context:{lang:"es_AR"}}); }
    toast("🗑️ Contacto eliminado"); await cargarContactos(L.parent);
  }catch(e){ toast("⚠ No pude eliminar: "+(e.message||e)); }
}

/* Personaliza el texto de un mensaje WA de campaña con el nombre del comercial activo.
   Tokens escritos al crear el mensaje en Comunicaciones, reemplazados acá al mostrarlo/enviarlo
   por la cuenta logueada (COMERCIAL): {NOMBRE} = sólo nombre de pila (para el saludo);
   {NOMBRECOMPLETO} (alias {COMERCIAL}) = nombre y apellido (para la firma). Así el mismo mensaje
   sirve para todo el equipo y cada uno lo manda firmado con su nombre. Case-insensitive. */
function waPersonaliza(txt){ const full=(COMERCIAL||"").trim()||"tu asesor comercial de Droguería EyG";
  const first=full.split(/\s+/)[0]||full;
  return String(txt||"")
    .replace(/\{\s*(NOMBRECOMPLETO|COMERCIAL)\s*\}/gi, full)
    .replace(/\{\s*NOMBRE\s*\}/gi, first); }
function msgPred(c){ const o=ST.orders[c.id]; const dias=o?diasDe(o.ultima):null;

  return "Hola! Te escribimos de Droguería EyG 👋 ¿Armamos tu próximo pedido? Cualquier cosa que necesites, escribinos.";
}

async function guardar(){
  if(!EDIT) return; const btn=document.getElementById("btnSave"); btn.disabled=true; btn.textContent="Guardando…";
  const val=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
  const num=id=>{const x=val(id);return x?parseInt(x,10):false;};
  const idtype=num("f_idtype");
  const vals={
    company_type:val("f_type"), name:val("f_name"),
    phone: val("f_phone")?fmtTel(val("f_phone")):false, mobile:false,
    email: val("f_email")||false, street: val("f_street")?oracion(val("f_street")):false,
    zip: val("f_zip")||false, city: val("f_city")?oracion(val("f_city")):false,
    state_id: num("f_state"), l10n_latam_identification_type_id: idtype,
    vat: val("f_vat")?fmtDoc(val("f_vat"),idtype):false,
    l10n_ar_afip_responsibility_type_id: num("f_fiscal")
  };
  const rubro=num("f_rubro");
  if(rubro) vals.category_id=[[4,rubro]];
  if(!vals.name){ btn.disabled=false; btn.textContent=EDIT.isNew?"Crear contacto":"Guardar ficha"; toast("⚠️ Falta el nombre"); return; }
  try{
    let id=EDIT.id;
    if(EDIT.isNew){ vals.user_id=ST.userId; id=await rpc("res.partner","create",[vals]); ST.nuevos++; }
    else { await rpc("res.partner","write",[[id],vals]); }
    const fresh=(await rpc("res.partner","read",[[id]],{fields:PFIELDS}))[0];
    const i=ST.contactos.findIndex(x=>x.id===id);
    if(i>=0) ST.contactos[i]=fresh; else ST.contactos.push(fresh);
    // Si veníamos "tomando" un contacto a conquistar, lo vinculamos al ítem de la carpeta.
    if(EDIT.isNew && ST._tomando){ const it=(ST.conquistar||[]).find(x=>x.id===ST._tomando); if(it) it.partnerId=id; EYG.conquistarSetPartner(ST._tomando,id).catch(()=>{}); ST._tomando=null; }
    const pct=completar(fresh).pct;
    cerrar();
    if(EDIT&&EDIT.isNew){ toast("🎉 ¡Nuevo contacto creado! +1 nuevo",true); confetti(); }
    else { toast(pct>=100?"🎉 ¡Ficha completa! ✨":"Ficha guardada ✓", pct>=100); if(pct>=100) confetti(); }
    render();
    // Situación crediticia: si el contacto tiene CUIT, calcularla y cachearla automáticamente
    // (contacto nuevo, o si acaban de cargar/corregir el CUIT). Queda "ligada" al contacto por CUIT.
    const _cu=cuitDe(fresh); if(_cu){ EYG.bcraResumen(_cu).then(r=>{ if(r&&!r.error){ r.ts=hoyStr.slice(0,10); ST.bcra[_cu]=r; EYG.bcraCacheMerge({[_cu]:r}); actualizarCredCuit(_cu); } }).catch(()=>{}); }
  }catch(e){ btn.disabled=false; btn.textContent=EDIT&&EDIT.isNew?"Crear contacto":"Guardar ficha"; toast("⚠️ No se pudo guardar: "+e.message); }
}

/* Lee un mensaje WA del cuerpo de la nota. Nuevo formato: "[EyGWA] tipo/nuevo|seg · por X".
   Legacy "[EyGCRM] Contacto trabajado" → contacto/seg (sin distinción nuevo). */
function parseWA(body){ const b=(body||"").replace(/<[^>]+>/g,""); const m=b.match(/\[EyGWA\]\s*(\w+)\/(\w+)/); if(m) return {tipo:m[1],ng:m[2]}; if(/EyGCRM/.test(b)) return {tipo:"contacto",ng:"seg"}; return null; }

/* Al tocar "Contactar por WhatsApp" se ABRE el chat (href) y aparece esta confirmación:
   el contacto NO cuenta hasta que el comercial confirma que envió. Así un clic solo no infla. */
function confirmarEnvio(id, tipo){
  const c=ST.contactos.find(x=>x.id===id); const nom=c?(c.name||"este contacto"):"este contacto";
  let el=document.getElementById("waconfirm");
  if(!el){ el=document.createElement("div"); el.id="waconfirm"; el.className="waconfirm"; document.body.appendChild(el); }
  el.innerHTML=`<div class="wcbox"><div class="wct">📤 ¿Enviaste el mensaje a <b>${esc(nom)}</b>?</div>
    <div class="wcsub">Solo se cuenta como contacto trabajado si confirmás el envío.</div>
    <div class="wcb"><button class="no" onclick="cerrarWAConfirm()">No, no envié</button><button class="si" onclick="registrarEnvio(${id},'${tipo}')">Sí, envié ✓</button></div></div>`;
  requestAnimationFrame(()=>el.classList.add("on"));
}
function cerrarWAConfirm(){ const el=document.getElementById("waconfirm"); if(el) el.classList.remove("on"); }
async function registrarEnvio(id, tipo){
  cerrarWAConfirm();
  // nuevo vs seguimiento: ¿ya le habíamos mandado un WA antes?
  let ng="nuevo";
  try{ const prev=await rpc("mail.message","search_count",[[["model","=","res.partner"],["res_id","=",id],["body","like","EyGWA"]]]); if(prev>0) ng="seg"; }catch(e){}
  try{ await rpc("res.partner","message_post",[[id]],{body:"📤 [EyGWA] "+tipo+"/"+ng+" · por "+COMERCIAL, message_type:"comment"}); }catch(e){}
  const t=hoyStr.slice(0,10); ST.msgs.push({res_id:id, date:t, tipo, ng});
  const eraContacto=ST.contactadosHoy.has(id); ST.contactadosHoy.add(id); const n=ST.contactadosHoy.size;
  if(!eraContacto && n===OBJ.diarioContactos){ toast("🏆 ¡Meta diaria cumplida! "+OBJ.diarioContactos+" contactos 🎉",true); confetti(); }
  else toast("Mensaje registrado ✓ ("+(ng==="nuevo"?"nuevo contacto":"seguimiento")+")", true);
  render();
}

/* Al compartir una OFERTA (botón de la tarjeta): abre WhatsApp y pide confirmar.
   Sólo cuenta como "enviada" si el comercial confirma. Se registra en su propio
   partner con el marcador [EyGOFENV] para contarlas por mes (puntaje). */
function confirmarCompartir(ofId){
  const o=OFERTAS.find(x=>x.id===ofId); const tit=o?(o.titulo||ofItems(o)||"la oferta"):"la oferta";
  let el=document.getElementById("waconfirm");
  if(!el){ el=document.createElement("div"); el.id="waconfirm"; el.className="waconfirm"; document.body.appendChild(el); }
  el.innerHTML=`<div class="wcbox"><div class="wct">📤 ¿Compartiste <b>${esc(tit)}</b>?</div>
    <div class="wcsub">Solo se cuenta como oferta enviada si confirmás.</div>
    <div class="wcb"><button class="no" onclick="cerrarWAConfirm()">No</button><button class="si" onclick="registrarEnvioOferta('${(ofId||'').replace(/'/g,'')}')">Sí, la compartí ✓</button></div></div>`;
  requestAnimationFrame(()=>el.classList.add("on"));
}
async function registrarEnvioOferta(ofId){
  cerrarWAConfirm();
  const o=OFERTAS.find(x=>x.id===ofId); const tit=o?(o.titulo||ofItems(o)||"oferta"):"oferta";
  if(!ST.userPartner){ toast("No pude registrar el envío"); return; }
  try{ await rpc("res.partner","message_post",[[ST.userPartner]],{body:"📤 [EyGOFENV] "+COMERCIAL+" · "+tit, message_type:"comment"}); }catch(e){}
  ST.ofEnviadas=(ST.ofEnviadas||0)+1;
  // Reflejo en vivo (sin F5): sumo la nota a ofMsgs para que el conteo diario de mensajes
  // (msgHoy) y el "la compartiste N veces" de la tarjeta se actualicen al instante.
  (ST.ofMsgs=ST.ofMsgs||[]).push({date:hoyStr.slice(0,10), body:"📤 [EyGOFENV] "+COMERCIAL+" · "+tit});
  const meta=OF_META_ENV;
  if(ST.ofEnviadas===meta){ toast("🏆 ¡Meta de ofertas enviadas! "+meta+" este mes 🎉",true); confetti(); }
  else toast("Oferta enviada ✓ ("+ST.ofEnviadas+"/"+meta+" este mes)", true);
  render();
}

/* ===== Gráfico de evolución (modo dirección) — período año/mes/semana/hoy, con "hoy" minuto a
   minuto en vivo. Portado del Panel del Líder, acá para la cartera propia (ST.userId). ===== */
const LD_TZ="America/Argentina/Buenos_Aires";
const LD_MESES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const LD_DIAS=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
let LD={per:"hoy", tot:{hoy:0,sem:0,mes:0,ano:0}, series:{}, today:[], timer:null, _iniSem:null};
function ldToday(){ return new Intl.DateTimeFormat("en-CA",{timeZone:LD_TZ}).format(new Date()); }
function ldParts(s){ const d=new Date(String(s).replace(" ","T")+"Z"); const p=new Intl.DateTimeFormat("en-CA",{timeZone:LD_TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(d); const g={};p.forEach(x=>g[x.type]=x.value); const hh=(+g.hour)%24; return {date:`${g.year}-${g.month}-${g.day}`,hour:hh,frac:hh+(+g.minute)/60}; }
function ldNowFrac(){ const p=new Intl.DateTimeFormat("en-CA",{timeZone:LD_TZ,hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()); const g={};p.forEach(x=>g[x.type]=x.value); return ((+g.hour)%24)+(+g.minute)/60; }
async function ldPerTot(desde){ const g=await rpc("sale.order","read_group",[[["user_id","=",ST.userId],["state","in",["sale","done"]],["date_order",">=",desde]],["amount_untaxed:sum"],[]],{lazy:false}); return (g[0]&&g[0].amount_untaxed)||0; }
async function ldInit(){
  try{
    const t=ldToday(), y=t.slice(0,4), mo=t.slice(0,7);
    const d=new Date(t+"T00:00:00"); const dow=(d.getDay()+6)%7; const lun=new Date(d); lun.setDate(d.getDate()-dow); const _l=lun.toISOString().slice(0,10); LD._iniSem=_l<(mo+"-01")?(mo+"-01"):_l;
    const [aA,aM,aS]=await Promise.all([ldPerTot(y+"-01-01"),ldPerTot(mo+"-01"),ldPerTot(LD._iniSem)]);
    LD.tot.ano=aA; LD.tot.mes=aM; LD.tot.sem=aS;
    await ldRefreshHoy();
    ldRender();
    LD.timer=setInterval(()=>{ if(!document.hidden){ ldRefreshHoy().then(()=>{ if(LD.per==="hoy") ldRender(); }).catch(()=>{}); } },180000);
  }catch(e){ const b=document.getElementById("ldchartbox"); if(b) b.innerHTML='<div class="errbox">No pude cargar el gráfico: '+esc(e.message)+'</div>'; }
}
async function ldRefreshHoy(){
  const desde=new Date(Date.now()-30*3600*1000).toISOString().slice(0,10)+" 00:00:00";
  const ord=await rpc("sale.order","search_read",[[["user_id","=",ST.userId],["state","in",["sale","done"]],["date_order",">=",desde]]],{fields:["date_order","amount_untaxed"],limit:0});
  const t=ldToday();
  LD.today=ord.map(o=>({amt:o.amount_untaxed||0, ...ldParts(o.date_order)})).filter(o=>o.date===t);
  LD.tot.hoy=LD.today.reduce((a,o)=>a+o.amt,0);
}
async function ldSetPer(p){ if(p===LD.per)return; LD.per=p; ldRender(); if(p!=="hoy" && !LD.series[p]){ try{ await ldSerie(p); }catch(e){} ldRender(); } }
async function ldSerie(p){
  if(LD.series[p]) return LD.series[p];
  const t=ldToday(), y=t.slice(0,4), mo=t.slice(0,7);
  const dom=(desde,gran)=>rpc("sale.order","read_group",[[["user_id","=",ST.userId],["state","in",["sale","done"]],["date_order",">=",desde+" 00:00:00"]],["amount_untaxed:sum"],["date_order:"+gran]],{lazy:false});
  const bucket=(g,gran)=>{ const m={}; g.forEach(r=>{ const rg=r.__range&&r.__range["date_order:"+gran]; const f=rg?rg.from.slice(0,10):null; if(f)m[f]=(m[f]||0)+(r.amount_untaxed||0); }); return m; };
  if(p==="sem"){ const ini=LD._iniSem; const lun=new Date(t+"T00:00:00"); const dow=(lun.getDay()+6)%7; lun.setDate(lun.getDate()-dow); const m=bucket(await dom(ini,"day"),"day"); const arr=[]; for(let i=0;i<7;i++){ const dd=new Date(lun); dd.setDate(lun.getDate()+i); const k=dd.toISOString().slice(0,10); arr.push({label:LD_DIAS[i], val:m[k]||0, cur:k===t}); } return LD.series.sem=arr; }
  if(p==="mes"){ const ini=mo+"-01"; const m=bucket(await dom(ini,"day"),"day"); const [yy,mm]=mo.split("-").map(Number); const dim=new Date(yy,mm,0).getDate(); const arr=[]; for(let dd=1;dd<=dim;dd++){ const k=`${mo}-${String(dd).padStart(2,"0")}`; arr.push({label:String(dd), val:m[k]||0, cur:k===t}); } return LD.series.mes=arr; }
  if(p==="ano"){ const m=bucket(await dom(y+"-01-01","month"),"month"); const arr=[]; for(let mm=1;mm<=12;mm++){ const k=`${y}-${String(mm).padStart(2,"0")}`; arr.push({label:LD_MESES[mm-1], val:m[k+"-01"]||0, cur:k===mo}); } return LD.series.ano=arr; }
}
function ldChartHoy(){
  const orders=LD.today.slice().sort((a,b)=>a.frac-b.frac);
  const x0=7,x1=21,W=1000,H=210,PADB=22;
  let cum=0; const pts=[[x0,0]];
  for(const o of orders){ cum+=o.amt; pts.push([Math.max(x0,Math.min(x1,o.frac)),cum]); }
  const nf=Math.max(x0,Math.min(x1,ldNowFrac())); pts.push([nf,cum]);
  const maxY=Math.max(cum,1);
  const X=f=>((f-x0)/(x1-x0))*W, Y=v=>H-PADB-(v/maxY)*(H-PADB-8);
  const line=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
  const area=line+` L ${X(nf).toFixed(1)} ${H-PADB} L ${X(x0).toFixed(1)} ${H-PADB} Z`;
  const lastX=X(nf),lastY=Y(cum);
  const ticks=[]; for(let h=x0;h<=x1;h+=2){ ticks.push(`<text x="${X(h).toFixed(0)}" y="${H-6}" fill="#9AAcA8" font-size="11" text-anchor="middle">${h}h</text><line x1="${X(h)}" y1="0" x2="${X(h)}" y2="${H-PADB}" stroke="#EEF4F3"/>`); }
  return { tot:cum, totLbl:"acumulado del día",
    svg:`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:210px;display:block;margin-top:6px"><defs><linearGradient id="ldg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0AA89F" stop-opacity=".28"/><stop offset="1" stop-color="#0AA89F" stop-opacity="0"/></linearGradient></defs>${ticks.join("")}<path d="${area}" fill="url(#ldg)"/><path d="${line}" fill="none" stroke="#048782" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="9" fill="#22e0c6" opacity=".25"/><circle class="ldneon" cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="5" fill="#22e0c6" style="filter:drop-shadow(0 0 6px #22e0c6)"/></svg>` };
}
function ldBar(series){
  const W=1000,H=230,PADB=28,PADT=12,PADL=6,n=series.length||1;
  const max=Math.max(...series.map(s=>s.val),1);
  const bw=(W-PADL*2)/n, gap=n>20?1.5:n>12?2.5:6;
  const bars=series.map((s,i)=>{ const h=(s.val/max)*(H-PADB-PADT); const x=PADL+i*bw+gap/2,yy=H-PADB-h,w=Math.max(1,bw-gap); const fill=s.cur?'var(--coral)':'url(#ldgb)'; return `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="${Math.min(3,w/2).toFixed(1)}" fill="${fill}"><title>${esc(s.label)}: ${money(s.val)}</title></rect>`; }).join("");
  const step=n>24?Math.ceil(n/15):1;
  const labels=series.map((s,i)=>{ if(i%step!==0 && !s.cur) return ""; const x=PADL+i*bw+bw/2; return `<text x="${x.toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="12" fill="${s.cur?'var(--coral)':'#9AAcA8'}" font-weight="${s.cur?800:500}">${esc(s.label)}</text>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin-top:6px"><defs><linearGradient id="ldgb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0AA89F"/><stop offset="1" stop-color="#7ad5cc"/></linearGradient></defs>${bars}${labels}</svg>`;
}
function ldRender(){
  const box=document.getElementById("ldchartbox"); if(!box)return;
  const kc=(k,lab,sub)=>`<div class="ldkpi ${LD.per===k?'sel':''}" onclick="ldSetPer('${k}')"><div class="ldk-l">${lab}</div><div class="ldk-v">${money(LD.tot[k]||0)}</div><div class="ldk-s">${sub}</div></div>`;
  const kpis=`<div class="ldkpis">${kc("hoy","Hoy",LD.today.length+" pedido"+(LD.today.length===1?"":"s"))}${kc("sem","Esta semana","por día")}${kc("mes","Este mes","por día")}${kc("ano","Este año","por mes")}</div>`;
  const TIT={hoy:"Evolución de hoy",sem:"Ventas de la semana · por día",mes:"Ventas del mes · por día",ano:"Ventas del año · por mes"};
  let tot=0,totLbl="",svg="",live=false;
  if(LD.per==="hoy"){ const c=ldChartHoy(); tot=c.tot; totLbl=c.totLbl; svg=c.svg; live=true; }
  else{ const s=LD.series[LD.per]; if(!s){ svg='<div class="floading"><span class="spin-sm"></span> cargando…</div>'; } else { tot=s.reduce((a,b)=>a+b.val,0); totLbl="total del período"; svg=ldBar(s); } }
  box.innerHTML=`<div class="secrow"><h2 class="sec">📈 Evolución de tus ventas</h2></div>${kpis}
    <div class="chartbox"><div class="ch-head"><h3>${TIT[LD.per]}</h3>${live?'<span class="live"><span class="dot"></span>En vivo · minuto a minuto</span>':''}</div>
    <div class="ch-tot">${money(tot)} <span class="ch-totl">${totLbl}</span></div>${svg}</div>`;
}

async function ldTeamInit(){

               .map(s=>({uid:s.user_id[0], name:s.user_id[1]}));

    ]);

    team=team.map(m=>({...m, mes:mes[m.uid]||0, hoy:hoy[m.uid]||0})).sort((a,b)=>b.mes-a.mes);
    LDTEAM={team, tot:team.reduce((a,b)=>a+b.mes,0), totHoy:team.reduce((a,b)=>a+b.hoy,0)};
