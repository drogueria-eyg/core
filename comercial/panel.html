<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Panel · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="../assets/core.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../assets/core.js?v=52"></script>
<style>
  :root{
    --teal:#048782; --teal-deep:#04635F; --teal-med:#0AA89F; --aqua:#5FC8BF;
    --agua:#E2F1EF; --coral:#EC8B5E; --ink:#0E1F1D; --gris:#5F716E; --gris2:#8A9A97;
    --surface:#fff; --bg:#F4F8F7; --line:#DCE8E6; --radius:14px; --wa:#25D366;
    --gold:#E5A93B; --shadow:0 1px 2px rgba(6,65,62,.05), 0 8px 30px rgba(6,65,62,.07);
    --ok:#1E7D46; --okbg:#E4F5E9; --bad:#B0413E; --badbg:#FBE4E3; --warn:#B7791F; --warnbg:#FBF0DA;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .topbar{background:var(--teal-deep);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:13px;position:sticky;top:0;z-index:30;flex-wrap:wrap}
  .mono{font-family:Georgia,serif;font-weight:700;font-size:23px;letter-spacing:.5px;line-height:1}
  .mono .y{color:var(--aqua)}
  .topbar .tag{font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:20px}
  .topbar .who{margin-left:auto;text-align:right;font-size:13px}
  .topbar .who b{display:block;font-size:15px}
  .topbar .who span{color:var(--aqua);font-size:12px}
  .wrap{max-width:1120px;margin:0 auto;padding:22px 22px 90px}

  .hero{display:flex;align-items:center;gap:18px;margin-bottom:22px;flex-wrap:wrap}
  .hero h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
  .hero .msg{color:var(--gris);font-size:14px;margin-top:2px}
  /* Botón flotante de los chats. Abajo a la izquierda: a la derecha, en el
     teléfono, cae justo donde está el pulgar y taparía el contenido. */
  .fabchats{position:fixed;left:18px;bottom:18px;z-index:60;display:inline-flex;align-items:center;gap:9px;
            background:linear-gradient(135deg,var(--teal),var(--teal-deep));color:#fff;text-decoration:none;
            font-weight:800;font-size:14px;padding:12px 18px;border-radius:999px;
            box-shadow:0 8px 26px rgba(4,135,130,.34);transition:.14s}
  .fabchats:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(4,135,130,.42)}
  .fabchats .ic{font-size:17px;line-height:1}
  .fabchats .n{min-width:21px;height:21px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.22);
               display:inline-flex;align-items:center;justify-content:center;font-size:12px}
  .fabchats .n:empty{display:none}
  /* Charla en curso: el mismo latido que en la bandeja, para que signifique lo mismo */
  .fabchats .vv{display:none;width:8px;height:8px;border-radius:50%;background:#8ef5c9}
  .fabchats.viva .vv{display:inline-block;animation:fablatir 2.4s ease-out infinite}
  @keyframes fablatir{0%{box-shadow:0 0 0 0 rgba(142,245,201,.7)}70%{box-shadow:0 0 0 7px rgba(142,245,201,0)}100%{box-shadow:0 0 0 0 rgba(142,245,201,0)}}
  @media (prefers-reduced-motion:reduce){ .fabchats .vv{animation:none} }
  @media(max-width:640px){ .fabchats{left:12px;bottom:12px;padding:11px 15px;font-size:13px} .fabchats .tx{display:none} }

  .cta-venta{display:inline-flex;align-items:center;gap:8px;margin-top:12px;background:linear-gradient(135deg,var(--teal),var(--teal-deep));color:#fff;text-decoration:none;font-weight:800;font-size:16px;padding:13px 22px;border-radius:13px;box-shadow:var(--shadow);transition:.12s}
  .cta-venta:hover{filter:brightness(1.07);transform:translateY(-1px)}
  .cta-venta:active{transform:scale(.98)}
  .cta-venta.big{font-size:17px;padding:15px 26px}
  /* Centro de control en el header: nivel + salud + ayuda */
  .ctrl{display:flex;align-items:center;gap:7px}
  .ctrlchip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:20px;padding:5px 11px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;line-height:1;white-space:nowrap}
  .ctrlchip:hover{background:rgba(255,255,255,.24)}
  .ctrlchip small{opacity:.82;font-weight:600}
  .ctrlchip.warn{background:rgba(236,139,94,.3);border-color:rgba(236,139,94,.55)}
  .ctrlchip.q{width:30px;height:30px;justify-content:center;padding:0;font-size:15px;border-radius:50%}
  .ctrlback{position:fixed;inset:0;background:rgba(6,40,38,.5);z-index:60;display:flex;justify-content:center;align-items:flex-start;padding:64px 16px 16px}
  .ctrlcard{background:var(--surface);border-radius:16px;max-width:600px;width:100%;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.35);animation:fadeup .25s both}
  .ctrlhd{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}
  .ctrlhd b{font-size:16px} .ctrlhd .x{cursor:pointer;color:var(--gris);font-size:19px;line-height:1}
  .ctrlbd{padding:16px 18px;overflow:auto}
  /* Estado del cliente por recencia (a quién contactar) */
  .estado{display:inline-block;margin-top:5px;margin-right:6px;font-size:11px;font-weight:800;border-radius:20px;padding:2px 9px}
  .level{margin-left:auto;background:linear-gradient(135deg,var(--teal),var(--teal-deep));color:#fff;border-radius:16px;padding:12px 18px;text-align:center;min-width:120px;box-shadow:var(--shadow)}
  .level .lv{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.85}
  .level .lvn{font-size:22px;font-weight:900;line-height:1.1}
  .level .streak{font-size:12px;margin-top:3px}

  .goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:24px}
  .goal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
  .goal.done{border-color:var(--ok);background:linear-gradient(180deg,#F2FBF5,#fff)}
  .ring{--p:0;--c:var(--teal);width:88px;height:88px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
    background:radial-gradient(closest-side,#fff 79%,transparent 80% 100%),conic-gradient(var(--c) calc(var(--p)*1%),#EAF1F0 0);transition:--p 1s ease}
  @property --p{syntax:'<number>';inherits:false;initial-value:0}
  .ring .rv{font-size:19px;font-weight:900;line-height:1} .ring .rt{font-size:10px;color:var(--gris)}
  .goal .gt{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--gris)}
  .goal .gn{font-size:24px;font-weight:800;margin:2px 0} .goal .gs{font-size:12.5px;color:var(--gris)}
  .goal .chk{position:absolute;top:12px;right:12px;font-size:18px;opacity:0;transform:scale(.5);transition:.3s}
  .goal.done .chk{opacity:1;transform:scale(1)}

  .achv{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
  .badge-a{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:7px 14px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
  .badge-a.on{background:linear-gradient(135deg,#FFF6E4,#fff);border-color:var(--gold);color:#8a6414}
  .badge-a.off{opacity:.45;filter:grayscale(.6)}
  .badge-a .em{font-size:17px}

  .money-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:26px}
  .mcard{background:var(--teal-deep);color:#fff;border-radius:var(--radius);padding:18px 20px}
  .mcard.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  .mcard .l{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.85} .mcard.alt .l{color:var(--gris);opacity:1}
  .mcard .v{font-size:24px;font-weight:800;margin-top:4px}
  .mcard .sub{font-size:12px;opacity:.8;margin-top:3px} .mcard.alt .sub{color:var(--gris2)}
  .mcard.cobrar{background:var(--teal)} .mcard.venc{background:#A5312E}
  .mcard{position:relative} .mcard.lk{cursor:pointer;transition:transform .1s,box-shadow .1s}
  .mcard.lk:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(6,65,62,.14)}
  .mcard .odoo{position:absolute;top:9px;right:11px;font-size:10px;font-weight:700;opacity:.65;letter-spacing:.3px}
  .mcard.alt .odoo{color:var(--teal-deep)}
  .debt{display:inline-block;margin-top:5px;font-size:11px;font-weight:700;color:var(--teal-deep);background:var(--agua);border-radius:6px;padding:2px 8px}
  .plazo{display:inline-block;margin-top:5px;margin-right:6px;font-size:11px;font-weight:700;color:#0E5C46;background:#E3F3F0;border:1px solid #cfe9e3;border-radius:999px;padding:2px 8px}
  .dhead .plazo{margin-top:8px}
  .debt.v{color:#fff;background:#A5312E}

  .secrow{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
  h2.sec{font-size:16px;font-weight:800;display:flex;align-items:center;gap:10px}
  h2.sec .pill{font-size:12px;font-weight:700;background:var(--agua);color:var(--teal-deep);border-radius:20px;padding:3px 11px}
  .newbtn{margin-left:auto;background:var(--teal);color:#fff;border:0;border-radius:10px;padding:9px 15px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
  .newbtn:hover{filter:brightness(1.06)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--gris);border-radius:20px;padding:7px 13px;cursor:pointer}
  .chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 12px}
  .search input{border:0;background:none;outline:none;font-family:inherit;font-size:14px;width:100%}
  .search svg{width:16px;height:16px;color:var(--gris2)}

  .clist{display:flex;flex-direction:column;gap:10px}
  .cc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr 130px 120px auto;gap:14px;align-items:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s,border-color .1s}
  .cc:hover{transform:translateY(-1px);border-color:var(--teal-med)}
  .cc.hoy{border-left:4px solid var(--ok)}
  .cc>div{min-width:0}
  .cc .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cc .mt{font-size:12px;color:var(--gris2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cc .rec{font-size:12.5px} .cc .rec b{font-weight:700} .cc .rec .sub{color:var(--gris2);font-size:11.5px}
  .compbar .lab{font-size:11px;color:var(--gris);margin-bottom:4px;display:flex;justify-content:space-between}
  .compbar .track{height:7px;background:#EAF1F0;border-radius:6px;overflow:hidden}
  .compbar .fill{height:100%;border-radius:6px;transition:width .5s}
  .cc .go{font-size:12px;font-weight:700;color:var(--teal);white-space:nowrap}
  .cc .done-tag{font-size:11px;font-weight:700;color:var(--ok);background:var(--okbg);border-radius:20px;padding:3px 9px}
  .notel{display:inline-block;margin-top:5px;font-size:11px;font-weight:700;color:var(--bad);background:var(--badbg);border-radius:6px;padding:2px 8px}
  .cc.st{border-left:4px solid var(--bad)}
  .cc.st.hoy{border-left-color:var(--ok)}

  .loading,.empty{text-align:center;padding:60px 20px;color:var(--gris)}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .errbox{background:#FBE4E3;border:1px solid #F3B5B2;color:#8A2E2B;padding:16px;border-radius:12px}

  .scrim{position:fixed;inset:0;background:rgba(6,65,62,.35);opacity:0;pointer-events:none;transition:.2s;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:500px;max-width:96vw;background:var(--surface);z-index:50;box-shadow:-8px 0 40px rgba(6,65,62,.18);transform:translateX(100%);transition:transform .24s;display:flex;flex-direction:column}
  .drawer.on{transform:none}
  .dhead{padding:18px 22px;border-bottom:1px solid var(--line);background:var(--teal-deep);color:#fff}
  .dhead .x{float:right;cursor:pointer;font-size:22px;opacity:.85}
  .dhead h3{font-size:17px;font-weight:800;padding-right:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dhead .cbar{margin-top:10px;height:8px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden}
  .dhead .cbar .f{height:100%;background:var(--aqua);border-radius:6px;transition:width .5s}
  .dhead .cpct{font-size:12px;margin-top:6px;opacity:.9}
  .dbody{overflow-y:auto;flex:1}
  /* intel */
  .intel{padding:16px 22px;background:#F0F6F5;border-bottom:1px solid var(--line)}
  .intel h4,.form h4{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--teal-med);margin-bottom:10px}
  .istat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
  .istat .b{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;text-align:center}
  .istat .b .v{font-size:15px;font-weight:800;line-height:1.1} .istat .b .l{font-size:10.5px;color:var(--gris);margin-top:2px}
  .prod{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .prod .pq{color:var(--teal-deep);font-weight:700;white-space:nowrap}
  .wa-contact{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--wa);color:#fff;border:0;border-radius:10px;padding:12px;font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:12px;text-decoration:none}
  .wa-contact:hover{filter:brightness(1.05)} .wa-contact[data-off]{background:#EFF1F1;color:#B3BDBB;cursor:default}
  /* ===== Acceso al portal (ficha + ícono de fila) ===== */
  .portalsec{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .portalsec h4{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--teal-med);margin-bottom:9px}
  .pmuted{font-size:12.5px;color:var(--gris);line-height:1.5;margin:0 0 8px}
  .pbtn{display:block;width:100%;text-align:center;font-family:inherit;font-size:13.5px;font-weight:700;border:0;border-radius:10px;padding:11px;cursor:pointer;text-decoration:none;box-sizing:border-box}
  .pbtn.teal{background:var(--teal);color:#fff} .pbtn.teal:hover{filter:brightness(1.06)}
  .pbtn.agua{background:var(--agua);color:var(--teal-deep)} .pbtn.agua:hover{background:#d3ece7}
  .pbtn.gris{background:#EEF1F0;color:var(--gris);margin-top:8px}
  .pbtn.wa{background:var(--wa);color:#fff}
  .plogin{font-size:12.5px;color:var(--ink);margin-bottom:8px}
  .palert{font-size:12.5px;line-height:1.45;border-radius:9px;padding:9px 11px;margin-bottom:9px;border:1px solid}
  .palert.ok{background:var(--okbg);border-color:#cfe9d8;color:var(--ok)}
  .palert.pend{background:var(--warnbg);border-color:#ecd9a8;color:var(--warn)}
  .plink{font-size:11.5px;color:var(--teal-deep);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;word-break:break-all;margin-top:8px;font-family:ui-monospace,monospace}
  .pbtns{display:flex;gap:8px;margin-top:8px} .pbtns .pbtn{margin-top:0}
  .picon{font-size:12px;vertical-align:1px;margin-left:2px;cursor:default}
  .picon.pend{opacity:.85}
  .form{padding:18px 22px}
  .fld{margin-bottom:13px}
  .fld label{display:block;font-size:12px;font-weight:700;color:var(--gris);margin-bottom:5px}
  .fld label .miss{color:var(--bad);font-weight:700;margin-left:6px;font-size:11px}
  .fld input,.fld select{width:100%;font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--ink);background:var(--surface)}
  .fld input:focus,.fld select:focus{outline:none;border-color:var(--teal-med);box-shadow:0 0 0 3px rgba(10,168,159,.12)}
  .fld .hint{font-size:11px;color:var(--gris2);margin-top:4px}
  .fld .prev{font-size:11.5px;color:var(--teal-deep);font-weight:600;margin-top:4px;min-height:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .dfoot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;background:var(--surface)}
  .btn{flex:1;font-family:inherit;font-size:14.5px;font-weight:700;border:0;border-radius:10px;padding:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
  .btn.save{background:var(--teal);color:#fff} .btn.save:hover{filter:brightness(1.06)}
  .btn.arch{flex:0 0 auto;background:#FBE4E3;color:#8A2E2B} .btn.arch:hover{filter:brightness(.98)}
  .btn[disabled]{opacity:.5;cursor:default}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 22px;border-radius:30px;font-weight:600;font-size:14px;opacity:0;transition:.3s;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.win{background:linear-gradient(135deg,var(--gold),#c9871f)}
  /* confirmación de envío de WhatsApp */
  .kpi.ayuda{background:linear-gradient(160deg,#F3FAF9,#fff);border-color:#D6EFEA;margin-bottom:20px}
  .ayudabox{font-size:13px;color:var(--gris);line-height:1.5}
  .ayudabox h4{font-size:13px;font-weight:800;color:var(--ink);margin:12px 0 3px} .ayudabox h4:first-child{margin-top:0}
  .ayudabox p{margin:0 0 6px} .ayudabox b{color:var(--ink)}
  .ayudabox .ayl{list-style:none;display:grid;gap:5px;margin:4px 0 6px} .ayudabox .ayl li{padding-left:14px;position:relative} .ayudabox .ayl li::before{content:"•";position:absolute;left:2px;color:var(--teal)}
  .waconfirm{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:16px;z-index:90;pointer-events:none;transform:translateY(120%);transition:transform .28s cubic-bezier(.22,1,.36,1)}
  .waconfirm.on{transform:none;pointer-events:auto}
  .waconfirm .wcbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(6,65,62,.25);padding:16px 18px;max-width:440px;width:100%}
  .waconfirm .wct{font-size:15px;font-weight:700;color:var(--ink)}
  .waconfirm .wcsub{font-size:12px;color:var(--gris2);margin:4px 0 12px}
  .waconfirm .wcb{display:flex;gap:10px}
  .waconfirm .wcb button{flex:1;font-family:inherit;font-size:14px;font-weight:700;border:0;border-radius:10px;padding:12px;cursor:pointer}
  .waconfirm .wcb .no{background:#EFF2F1;color:var(--gris)}
  .waconfirm .wcb .si{background:var(--wa);color:#fff}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
  .conf{position:absolute;width:9px;height:14px;opacity:.95;will-change:transform}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.6}}
  /* Ofertas y combos (destacada) */
  .ofertas{background:linear-gradient(160deg,#05423f,var(--teal-deep));border-radius:16px;padding:18px 20px;margin-bottom:26px;position:relative;overflow:hidden;box-shadow:0 10px 34px rgba(6,65,62,.22)}
  .ofertas::after{content:"";position:absolute;inset:0;border-radius:16px;padding:1.5px;

<script>
const RPC="https://yxotopoklgjowcudveoj.supabase.co/functions/v1/odoo-rpc";
// Deep-links a Odoo (abre el listado/documento exacto; el vendedor logueado ve solo lo suyo)
const ODOO="https://drogueriaeyg.odoo.com/web#";
const odoo=p=>ODOO+p;
function verOdoo(p){ window.open(odoo(p),"_blank"); }
// Enlaces a "Cargar venta": el líder/admin arrastra ?c= para operar sobre el comercial elegido.
function venderURL(qs){ const c=(window.__perfil&&window.__perfil.rol!=='comercial')?('&c='+encodeURIComponent(COMERCIAL)):''; return "vender.html?"+qs+c; }
const money=n=>"$"+Math.round(n||0).toLocaleString("es-AR");
const esc=s=>(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
async function rpc(model,method,args,kwargs={},intentos=3){
  let ultimo;
  for(let i=0;i<intentos;i++){
    try{
      const r=await EYG.gate(()=>fetch(RPC,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model,method,args,kwargs})}));
      const j=await r.json();
      if(!j.ok){ ultimo=new Error(j.error||"Error Odoo"); if(i<intentos-1 && /http2|connection|SendRequest|timeout|EOF|reset/i.test(j.error||"")){ await new Promise(s=>setTimeout(s,500*(i+1))); continue; } throw ultimo; }
      return j.result;
    }catch(e){ ultimo=e; if(i<intentos-1){ await new Promise(s=>setTimeout(s,500*(i+1))); continue; } throw ultimo; }
  }
  throw ultimo;
}

// ===== Config / objetivos =====
const OBJ={diarioContactos:10, mensualNuevos:3, semanalFact:10000000}; // semanalFact = objetivo de VENTA NETA semanal (sin IVA, ya descontadas las notas de crédito)
const BOV_TAG="[BOVEDA-CONTACTO]"; // marcador reversible en el chatter del contacto (misma bóveda que usa la líder en Contactos). La gerencia revisa lo archivado.
const PPAL_TAG="[ENTREGA-PPAL]"; // marca reversible (chatter) de la dirección de entrega principal → Cargar Venta la usa por defecto
// ===== Comisión (DESDE AGOSTO 2026): la base es TUS PEDIDOS (lo que vos vendés, sale.order por vendedor),
//   no lo facturado por cartera. Antes de agosto NO cambia (julio y anteriores quedaron como estaban).
//   La META = promedio (o mediana) de tus últimos meses cerrados + un %, todo CONFIGURABLE por Dirección
//   en eyg.comisiones (ver EYG.comisionesConfig / metaDesde en core.js). El cobro sigue siendo PREMIO (nivel).
//   Escalera 2 tramos: 🏥 Instituciones 2/3% · 💊 Farmacias 2,5/3,5% (× nivel) · 🔵 Externo 3/4% @ corte fijo, sin nivel.
const EXTERNOS=["Samanta Luna"];
const esExterno=()=>EXTERNOS.includes(COMERCIAL);
const CFGC=()=> (ST.comiCfg||EYG.COMI_DEF);   // config de comisiones (con defaults si aún no cargó)
const corteObjetivo=()=> esExterno()? (CFGC().externoCorte||50e6) : (ST.base?.meta||0);   // meta = promedio de meses cerrados + %
const comisionRates=()=> esExterno()? (CFGC().rates.externo||{base:.03,high:.04}) : (CFGC().rates[ST.base?.perfil]||CFGC().rates.farm);
function ratesConSalud(){const r=comisionRates(),pen=(esExterno()?0:saludCuenta().penaltyPt)/100;return {base:Math.max(0,r.base-pen),high:Math.max(0,r.high-pen)};}
function comisionBase(v){const c=corteObjetivo(),r=ratesConSalud();return v<=c?v*r.base:c*r.base+(v-c)*r.high;}
function comisionDesglose(v){const c=corteObjetivo(),r=ratesConSalud(),t=[];t.push({lo:0,hi:c,r:r.base,base:Math.min(v,c),comi:Math.min(v,c)*r.base});if(v>c)t.push({lo:c,hi:Infinity,r:r.high,base:v-c,comi:(v-c)*r.high});return t;}
const NIV=[{n:"Bronce",e:"🥉",m:1.00},{n:"Plata",e:"🥈",m:1.05},{n:"Oro",e:"🥇",m:1.10},{n:"Platino",e:"💎",m:1.15},{n:"Diamante",e:"👑",m:1.20}];
const params=new URLSearchParams(location.search);
let COMERCIAL="";  // se define en el arranque según la cuenta logueada (o ?c= para líder/admin)
/* Los LÍDERES que venden (Marcela, German, Diego) todavía NO tienen definido su esquema de
   comisión: el motor de este panel es el de los COMERCIALES (facturado neto → tramos → nivel
   → salud) y aplicárselo a un líder daría un número inventado. Mientras no se defina, la
   tarjeta de comisión muestra "a definir" en vez de una cifra. Se resuelve por el ROL del
   dueño del panel en core_users, no por nombre, así al nombrar un líder nuevo funciona solo.
   Cuando se defina el esquema: implementarlo y sacar este flag. */
let SIN_COMISION=false;
let MODO_LIDER=false;  // ?modo=lider (solo no-comercial): panel de cartera SIN gamificación + gráfico de evolución
const REQ=[{k:"name",l:"Nombre"},{k:"tel",l:"Teléfono"},{k:"email",l:"Email"},{k:"street",l:"Dirección"},{k:"zip",l:"CP"},{k:"city",l:"Localidad"},{k:"state",l:"Provincia"},{k:"idtype",l:"Tipo doc"},{k:"vat",l:"Nº doc"},{k:"fiscal",l:"Cond. fiscal"}];
// Rubro (vive en category_id / etiquetas de Odoo). Mapa tag->valor canónico
const RUBROS=[{v:30,l:"Farmacia"},{v:32,l:"Sanatorio / Clínica"},{v:37,l:"Empresa de salud"},{v:33,l:"Institución / Mutual"},{v:34,l:"Distribuidora / Droguería"},{v:35,l:"Veterinaria"},{v:62,l:"SAMCO"}];
const RUBRO_MAP={28:30,29:30,30:30, 8:35,35:35, 7:34,34:34, 31:33,33:33,36:33, 20:32,32:32, 37:37, 62:62};
const IDT={cuit:4,dni:5,cuil:6};

// ===== Formateadores (estandarización) =====
const digits=s=>(s||"").replace(/\D/g,"");
function fmtDoc(raw,idtypeId){
  const d=digits(raw); if(!d) return "";
  if(idtypeId===IDT.dni){ if(d.length<7||d.length>8) return raw.trim(); return d.replace(/\B(?=(\d{3})+(?!\d))/g,"."); } // 00.000.000
  if(idtypeId===IDT.cuit||idtypeId===IDT.cuil){ if(d.length!==11) return raw.trim(); return d.slice(0,2)+"-"+d.slice(2,10)+"-"+d.slice(10); } // 00-00000000-0
  return raw.trim();
}
function fmtTel(raw){
  let d=digits(raw); if(!d) return "";
  if(d.startsWith("0054")) d=d.slice(4);
  if(d.startsWith("54")) d=d.slice(2);
  d=d.replace(/^0/,"");                              // área sin 0
  if(d.length>10) d=d.replace(/^(\d{2,4})15(\d{6,8})$/,"$1$2"); // celular sin 15 (solo si sobra largo)
  if(d.length<8) return raw.trim();
  let area,local;
  if(d.length===10){ if(d.startsWith("11")){area="11";local=d.slice(2);} else {area=d.slice(0,3);local=d.slice(3);} }
  else if(d.length===11){ area=d.slice(0,4);local=d.slice(4); }
  else return "+54 "+d;
  const ls = local.length>=8 ? local.slice(0,4)+"-"+local.slice(4) : local.slice(0,3)+"-"+local.slice(3);
  return "+54 "+area+" "+ls;
}
function oracion(s){ s=(s||"").trim().replace(/\s+/g," "); if(!s) return ""; return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase(); }
function waN(tel){let d=digits(tel);if(d.length<8)return"";if(d.startsWith("54"))d=d.slice(2);if(d.startsWith("9")&&d.length>=11)d=d.slice(1);d=d.replace(/^0/,"");if(d.length>10)d=d.replace(/^(\d{2,4})15(\d{6,8})$/,"$1$2");if(d.length>=10)return"549"+d;return"";}

// hoy AR
const now=new Date(); const pad=n=>String(n).padStart(2,"0");
const hoyStr=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const inicioMes=`${now.getFullYear()}-${pad(now.getMonth()+1)}-01`;
// Semana CALENDARIO: lunes de la semana actual, pero nunca antes del 1º del mes (así "esta
// semana" no arrastra ventas del mes pasado; ej. el lun 3/8 la semana arranca el 3, no el 27/7).
const inicioSem=(()=>{ const d=new Date(now); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); const lun=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; return lun<inicioMes?inicioMes:lun; })();
const hace=d=>{const x=new Date(now);x.setDate(x.getDate()-d);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`;};

// ===== Ofertas y combos =====
// El comercial ve TODO lo que está activo, venga de donde venga. Hay dos orígenes:
//
//   eyg.ofertas       ← "Oportunidades y Ofertas" (inventario/oportunidades.html).
//                       Son las que Inventario confirmó a mano, sea desde una oportunidad
//                       por costo, una por stock, o cargadas manualmente. Activa = vigente.
//                       {id, tipo:'oferta'|'combo', titulo, items:[{id,sku,nombre}],
//                        precio, precioAntes, stock, hasta, nota, creada}
//
//   eyg.sync_ofertas  ← "Configuración de precios" (comercial/config-precios.html).
//                       Nacen ya activas: son reglas de precio que el motor aplica solas.
//                       Activa = !pausada y vigente. Modelo distinto: apuntan a un
//                       product.template O a una categoría entera, y el descuento es
//                       RELATIVO (modo pct/monto/precio + valor), no un precio absoluto.
//                       {id, tipo:'p'|'c', target, targetName, modo, valor, reemplaza,
//                        stock, hasta, pausada}
//
// Las de sync se normalizan a la forma de eyg.ofertas (ver normalizarSync). Las que
// apuntan a una categoría no tienen precio único: quedan como tarjeta informativa
// (_info), sin precio ni barra de progreso, sólo el descuento y la vigencia.
const LISTA=3;              // pricelist de la que sale el precio base (misma que usa Oportunidades)
const OF_META_CLIENTES=5;   // meta de clientes por oferta (display de cada tarjeta)
// Puntaje de ofertas en el nivel (25 pts): actividad exigible (enviar) + resultado (vender, fuerte)
const OF_PTS_ENV=8,  OF_META_ENV=30;   // ofertas ENVIADAS este mes → 8 pts
const OF_PTS_VEN=17, OF_META_VEN=10;   // ofertas VENDIDAS este mes (cliente×oferta) → 17 pts (fuerte)
let OFERTAS=[], OFPIDS=[];   // OFPIDS = ids de variante de todas las ofertas vigentes

let ST={userId:null, contactos:[], catFiscal:[], catId:[], catProv:[], fact:{sem:0,mes:0,semPed:0,semNC:0,mesPed:0,mesNC:0}, cc:{porP:{},porCobrar:0,vencido:0,cobradoMes:0,aFacturar:0,aParcial:0,nDeud:0}, nuevos:0, contactadosHoy:new Set(), msgs:[], orders:{}, ofertas:{}, ofEnviadas:0, ofVendidas:0, ofMsgs:[], userPartner:null, base:null, act:{ped:0,cli:0}, diag:{ventasHoy:0,pedHoy:0,pedSem:0,cliSem:0}, alFondo:new Set(), filtro:"todos", q:"", waMsgs:[], pp:null, drafts:[], pedMesList:[], vista:null, bcra:{}, _bcraRun:false, conquistar:[], _tomando:null, portal:{}};
// CUIT del contacto (11 dígitos) para cruzar con el BCRA; "" si no tiene.
function cuitDe(c){ const d=String((c&&c.vat)||"").replace(/\D/g,""); return d.length===11?d:""; }
let WA_PICK=null, BELL_OPTS=null;

const PFIELDS=["id","name","company_type","is_company","street","street2","city","zip","state_id","phone","mobile","email","vat","l10n_ar_afip_responsibility_type_id","l10n_latam_identification_type_id","category_id","customer_rank","property_payment_term_id"];
// Plazo de pago acordado con el cliente (res.partner.property_payment_term_id). Lo ve Cobranzas;
// se lo mostramos también al comercial como badge para que sepa el acuerdo antes de contactar.
function plazoTxt(c){ const t=c&&c.property_payment_term_id; if(!t||!t[1]) return ""; const m=String(t[1]).match(/(\d+)/); return m?(m[1]+" d"):t[1]; }
function plazoBadge(c){ const p=plazoTxt(c); return p?`<span class="plazo" title="Plazo de pago acordado: ${esc((c.property_payment_term_id||[])[1]||'')}">🕐 ${esc(p)}</span>`:''; }

function completar(c){
  const has={name:!!c.name,tel:!!(c.phone||c.mobile),email:!!c.email,street:!!c.street,zip:!!c.zip,city:!!c.city,
    state:!!(c.state_id&&c.state_id[0]),idtype:!!(c.l10n_latam_identification_type_id&&c.l10n_latam_identification_type_id[0]),
    vat:!!c.vat,fiscal:!!(c.l10n_ar_afip_responsibility_type_id&&c.l10n_ar_afip_responsibility_type_id[0])};
  return {has, pct:Math.round(REQ.filter(r=>has[r.k]).length/REQ.length*100)};
}
const colorPct=p=>p>=100?'var(--ok)':p>=60?'var(--teal-med)':p>=30?'var(--warn)':'var(--bad)';
function rubroActual(c){ for(const t of (c.category_id||[])) if(RUBRO_MAP[t]) return RUBRO_MAP[t]; return ""; }
const diasDe=f=> f? Math.floor((now-new Date(f))/86400000):null;

async function cargar(){
  try{
    const u=await rpc("res.users","search_read",[[["name","=",COMERCIAL]]],{fields:["id","name","partner_id"],limit:1});
    if(!u.length) throw new Error("No encontré al comercial \""+COMERCIAL+"\".");
    ST.userId=u[0].id; ST.userPartner=u[0].partner_id&&u[0].partner_id[0]; document.getElementById("whoName").textContent=u[0].name;
    // CARTERA = clientes REALES del comercial: excluye direcciones de entrega (type=delivery),
    // de facturación (invoice) y sub-contactos (parent_id) — esos no son fichas a completar.
    const CARTERA=[["user_id","=",ST.userId],["type","=","contact"],["parent_id","=",false]];
    const [contactos,fiscal,idt,prov,nuevos] = await Promise.all([
      rpc("res.partner","search_read",[CARTERA],{fields:PFIELDS,limit:0}),
      rpc("l10n_ar.afip.responsibility.type","search_read",[[]],{fields:["id","name"]}),
      rpc("l10n_latam.identification.type","search_read",[[["active","=",true]]],{fields:["id","name"]}),
      rpc("res.country.state","search_read",[[["country_id.code","=","AR"]]],{fields:["id","name"],limit:0}),
      rpc("res.partner","search_count",[[["user_id","=",ST.userId],["type","=","contact"],["parent_id","=",false],["create_date",">=",inicioMes]]])
    ]);
    ST.contactos=contactos; ST.catFiscal=fiscal; ST.catId=idt; ST.catProv=prov; ST.nuevos=nuevos;
    const ids=contactos.map(c=>c.id);
    // recencia/frecuencia + notas de hoy + cuentas corrientes (deuda) + cobrado del mes
    const [og,notas,ccLines,cobrado,aFact,facMes,facSem,ncMes,ncSem,bovMsgs, ordHist,cobro3,facHist,drafts]=await Promise.all([
      rpc("sale.order","read_group",[[["partner_id","in",ids],["state","in",["sale","done"]]],["date_order:max","amount_total:sum"],["partner_id"]],{lazy:false}),
      // Mensajes de WhatsApp registrados (confirmados) de la SEMANA: [EyGWA] tipo/nuevo|seg. Incluye legacy [EyGCRM].
      rpc("mail.message","search_read",[[["model","=","res.partner"],["res_id","in",ids],["date",">=",hace(7)+" 00:00:00"],"|",["body","like","EyGWA"],["body","like","EyGCRM"]]],{fields:["res_id","date","body"],limit:0}),
      // DEUDA y VENCIDO del cliente = campos NATIVOS de Odoo (Adeudo total / Total atrasado, del reporte
      // de seguimiento). NO calculamos nada propio: leemos lo que dice Odoo → idéntico a Cobranzas.
      // total_overdue ya netea las NC vencidas y NO cuenta el saldo de migración (que no tiene fecha).
      rpc("res.partner","read",[ids],{fields:["total_due","total_overdue"],context:{lang:"es_AR"}}),
      // cobrado del mes = pagos entrantes (posted) de la cartera → base de la comisión
      rpc("account.payment","read_group",[[["partner_id","in",ids],["payment_type","=","inbound"],["state","=","posted"],["date",">=",inicioMes]],["amount:sum"],[]],{lazy:false}),
      // SIN FACTURAR = "Importe a facturar" (sale.order.amount_to_invoice) de sus pedidos a facturar → coincide exacto con Odoo
      rpc("sale.order","read_group",[[["user_id","=",ST.userId],["state","in",["sale","done"]],["invoice_status","=","to invoice"]],["amount_to_invoice:sum"],[]],{lazy:false}),
      // VENTA = FACTURADO de la cartera (out_invoice neto). Atribuye por cliente, no por invoice_user_id (que a veces es la cuenta genérica)
      rpc("account.move","read_group",[[["partner_id","in",ids],["move_type","=","out_invoice"],["state","=","posted"],["invoice_date",">=",inicioMes]],["amount_untaxed:sum"],[]],{lazy:false}),
      rpc("account.move","read_group",[[["partner_id","in",ids],["move_type","=","out_invoice"],["state","=","posted"],["invoice_date",">=",inicioSem]],["amount_untaxed:sum"],[]],{lazy:false}),
      // NC de la cartera (se restan de la venta facturada)
      rpc("account.move","read_group",[[["partner_id","in",ids],["move_type","=","out_refund"],["state","=","posted"],["invoice_date",">=",inicioMes]],["amount_untaxed:sum"],[]],{lazy:false}),
      rpc("account.move","read_group",[[["partner_id","in",ids],["move_type","=","out_refund"],["state","=","posted"],["invoice_date",">=",inicioSem]],["amount_untaxed:sum"],[]],{lazy:false}),
      // bóveda: marcadores de archivado de esta cartera (para sacar los archivados de la lista)
      rpc("mail.message","search_read",[[["model","=","res.partner"],["res_id","in",ids],["body","like",BOV_TAG]]],{fields:["res_id","body","date"],limit:0}),
      // ---- Historial 190d (NIVEL/SALUD) + presupuestos: viajan en la MISMA tanda; si fallan no rompen el panel ----
      rpc("sale.order","search_read",[[["user_id","=",ST.userId],["state","in",["sale","done"]],["date_order",">=",hace(190)]]],{fields:PED_FIELDS,limit:0}).catch(()=>[]),
      rpc("account.payment","read_group",[[["partner_id","in",ids],["payment_type","=","inbound"],["state","=","posted"],["date",">=",hace(100)]],["amount:sum"],[]],{lazy:false}).catch(()=>[]),
      rpc("account.move","search_read",[[["partner_id","in",ids],["move_type","in",["out_invoice","out_refund"]],["state","=","posted"],["invoice_date",">=",hace(190)]]],{fields:["invoice_date","amount_untaxed","move_type"],limit:0}).catch(()=>[]),
      // Presupuestos abiertos del comercial (draft=borrador/carrito web · sent=enviado o pedido web cerrado sin confirmar).
      rpc("sale.order","search_read",[[["user_id","=",ST.userId],["state","in",["draft","sent"]]]],{fields:["id","name","partner_id","amount_total","amount_untaxed","create_date","write_date","website_id","order_line","state","is_abandoned_cart","cart_quantity"],order:"write_date desc",limit:0}).catch(()=>[])
    ]);
    // aplicar bóveda: los contactos archivados salen de la cartera (los revisa la gerencia)
    { const seen=new Set(), bov=new Set();
      (bovMsgs||[]).sort((a,b)=>(b.date||"").localeCompare(a.date||"")).forEach(m=>{
        if(seen.has(m.res_id)) return; seen.add(m.res_id);
        if(/salir/i.test((m.body||"").replace(/<[^>]+>/g," "))) return; bov.add(m.res_id); });
      if(bov.size) ST.contactos=ST.contactos.filter(c=>!bov.has(c.id)); }
    ST.orders={}; og.forEach(g=>{if(g.partner_id)ST.orders[g.partner_id[0]]={ultima:g.date_order,pedidos:g.__count,total:g.amount_total};});
    // Historial de pedidos (190 d) = fuente única de la vista de pedidos y de las métricas.
    // La fecha se pasa a hora ARGENTINA una sola vez (Odoo guarda en UTC: sin convertir, todo lo
    // cargado después de las 21 h caía en el día siguiente y "hoy/semana/mes" mentían).
    (ordHist||[]).forEach(o=>{ o.__d=pedFechaAR(o.date_order); });
    ST.ordHist=ordHist||[]; ST.pedFuenteDesde=hace(190);
    // Mensajes WA de la semana, parseados; contactados hoy = distintos con mensaje hoy
    ST.msgs=notas.map(n=>{const p=parseWA(n.body); return p?{res_id:n.res_id,date:(n.date||"").slice(0,10),tipo:p.tipo,ng:p.ng}:null;}).filter(Boolean);
    const _t=hoyStr.slice(0,10);
    ST.contactadosHoy=new Set(ST.msgs.filter(m=>m.date===_t).map(m=>m.res_id));
    // ---- VENTA = facturado neto (facturas − NC) de la cartera ----
    const facM=facMes[0]?.amount_untaxed||0, facS=facSem[0]?.amount_untaxed||0;
    const ncM=ncMes[0]?.amount_untaxed||0, ncS=ncSem[0]?.amount_untaxed||0;
    ST.fact={ mes:facM-ncM, sem:facS-ncS, mesFac:facM, mesNC:ncM, semFac:facS, semNC:ncS };
    // ---- Sin facturar = "Importe a facturar" de sus pedidos "a facturar" (coincide con Odoo) ----
    const afSin = aFact[0]?.amount_to_invoice||0;
    // ---- Cuentas corrientes = campos NATIVOS de Odoo (Adeudo total / Total atrasado) + migración. ----
    // Deuda = total_due. Vencido = total_overdue (netea NC vencidas) + saldo de MIGRACIÓN sin fecha
    // (deuda vieja impaga = vencida, criterio del usuario). Mismo criterio EXACTO que Cobranzas.
    let migMap={}, ncMap={}, ovMap={}, migArch={};
    const _hoy=hoyStr.slice(0,10);
    try{ const [mg,nc,ov,mk]=await Promise.all([
        rpc("account.move.line","read_group",[[["account_id.account_type","=","asset_receivable"],["parent_state","=","posted"],["full_reconcile_id","=",false],["amount_residual",">",0],["date_maturity","=",false],["partner_id","in",ids]],["amount_residual:sum"],["partner_id"]],{lazy:false}),
        rpc("account.move.line","read_group",[[["account_id.account_type","=","asset_receivable"],["parent_state","=","posted"],["full_reconcile_id","=",false],["move_id.move_type","=","out_refund"],["amount_residual","!=",0],["partner_id","in",ids]],["amount_residual:sum"],["partner_id"]],{lazy:false}),
        // FACTURAS VENCIDAS (bruto, positivas y pasadas de fecha): el vencido NO descuenta NC sin imputar
        rpc("account.move.line","read_group",[[["account_id.account_type","=","asset_receivable"],["parent_state","=","posted"],["full_reconcile_id","=",false],["amount_residual",">",0],["date_maturity","<",_hoy],["partner_id","in",ids]],["amount_residual:sum"],["partner_id"]],{lazy:false}),
        // marcador de "deuda migrada archivada" que pone Cobranzas → el comercial ve el MISMO estado
        rpc("mail.message","search_read",[[["model","=","res.partner"],["res_id","in",ids],["body","like","[MIG-ARCHIVADA]"]]],{fields:["res_id","body","date"],limit:0})
      ]);
      (mg||[]).forEach(g=>{ if(g.partner_id) migMap[g.partner_id[0]]=g.amount_residual||0; });
      (nc||[]).forEach(g=>{ if(g.partner_id) ncMap[g.partner_id[0]]=Math.abs(g.amount_residual||0); });
      (ov||[]).forEach(g=>{ if(g.partner_id) ovMap[g.partner_id[0]]=g.amount_residual||0; });
      (mk||[]).sort((a,b)=>(b.date||"").localeCompare(a.date||"")); const _vm=new Set();
      (mk||[]).forEach(m=>{ if(_vm.has(m.res_id))return; _vm.add(m.res_id); if(/salir/i.test((m.body||"").replace(/<[^>]+>/g," "))) return; migArch[m.res_id]=true; });
    }catch(e){}
    const porP={};
    for(const c of (ccLines||[])){
      if(!c) continue;
      const mig=migMap[c.id]||0, arch=!!migArch[c.id];
      const deuda=((typeof c.total_due==="number")?c.total_due:0) - (arch?mig:0);
      // VENCIDO = facturas vencidas (bruto) + migración impaga (mismo criterio EXACTO que Cobranzas). No netea NC.
      const vencido=(ovMap[c.id]||0) + (arch?0:mig);
      porP[c.id]={ deuda, vencido:Math.max(0,vencido), venc:null, mig, migArch:arch, ncSin:(ncMap[c.id]||0) };
    }
    let porCobrar=0, vencido=0, nDeud=0;
    for(const pid in porP){ const d=porP[pid].deuda; if(d>1){porCobrar+=d; vencido+=porP[pid].vencido; nDeud++;} }
    ST.cc={ porP, porCobrar, vencido, cobradoMes:cobrado[0]?.amount||0, aFacturar:afSin, nDeud };
    // Perfil crediticio: historial de pago interno (riesgoCartera) + umbral + cache BCRA. Alimentan
    // el badge abreviado de la lista Y el detalle de la ficha. El BCRA se completa en 2º plano (trickle).
    EYG.riesgoCartera().then(m=>{ ST.riesgos=m||{}; if(document.getElementById("lista")) lista(); refrescarPerfilFicha(); }).catch(()=>{});
    EYG.creditoConfig().then(cfg=>{ CREDIT_CFG=cfg; if(document.getElementById("lista")) lista(); }).catch(()=>{});
    EYG.bcraCacheLeer().then(m=>{ ST.bcra=m||{}; if(document.getElementById("lista")) lista(); trickleBCRA(); }).catch(()=>{});
    // Carpeta "A conquistar": contactos que el líder asignó a este comercial para convertir en clientes.
    EYG.conquistarLeer().then(a=>{ ST.conquistar=EYG.conquistarDeComercial(a,COMERCIAL); if(document.getElementById("app")) render(); }).catch(()=>{});
    // Estado del portal (web de Odoo) por contacto: ícono en la fila (ya ingresó / tiene acceso).
    cargarPortalEstado().catch(()=>{});
    // ---- Baselines del NIVEL (dinámico): usa el historial 190d y los presupuestos que ya vinieron en la tanda de arriba ----
    try{
      // config de comisiones (ventana de meses, promedio/mediana, %, tasas) — una sola fuente, editable por Dirección
      const cfg = ST.comiCfg || (ST.comiCfg = await EYG.comisionesConfig().catch(()=>EYG.COMI_DEF));
      const bk={}; let sumTot=0; const ped={};   // ped = PEDIDOS por vendedor por mes, CON IVA (métrica que se muestra)
      for(const o of ordHist){ const m=(o.__d||"").slice(0,7); if(!m)continue; (bk[m]=bk[m]||{ped:0,cli:new Set(),tot:0}); bk[m].ped++; if(o.partner_id)bk[m].cli.add(o.partner_id[0]); bk[m].tot+=o.amount_total||0; sumTot+=o.amount_total||0; ped[m]=(ped[m]||0)+(o.amount_total||0); }
      // BASE de la COMISIÓN = FACTURADO NETO (facturas − NC) atribuido a QUIEN GENERÓ EL PEDIDO
      // (cruce factura→línea→sale.order.user_id). Inmune a los traspasos de cartera y a quién facture.
      const fact={}, factT={}, ncM={}, ncMT={};   // fact=facturado NETO (comisión) · factT=facturado TOTAL c/IVA · ncM=NC neto · ncMT=NC con IVA
      try{
        // Atribución HÍBRIDA: se te cuenta la factura si generaste vos el pedido; y si el pedido quedó bajo
        // la cuenta genérica (452), se le cuenta al DUEÑO DEL CLIENTE (recupera lo mal cargado sin inventar).
        // Comprobantes que Dirección sacó del cálculo a mano (eyg.comisiones_excluidos), con su motivo.
        // No se toca la contabilidad: solo no se computan para la comisión.
        try{ ST.exclMoves=(JSON.parse(await rpc("ir.config_parameter","get_param",["eyg.comisiones_excluidos"])||"[]")||[]).map(x=>x&&x.move).filter(Boolean); }catch(e){ ST.exclMoves=[]; }
        const exF=(ST.exclMoves&&ST.exclMoves.length)?[["move_id","not in",ST.exclMoves]]:[];
        const domF=(mt)=>[["parent_state","=","posted"],["move_id.move_type","=",mt],["date",">=",hace(210)],...exF,
          "|",["sale_line_ids.order_id.user_id","=",ST.userId],
              "&",["sale_line_ids.order_id.user_id","=",452],["sale_line_ids.order_id.partner_id.user_id","=",ST.userId]];
        const [fi,fr]=await Promise.all([
          rpc("account.move.line","read_group",[domF("out_invoice"),["price_subtotal:sum","price_total:sum"],["date:month"]],{lazy:false}),
          rpc("account.move.line","read_group",[domF("out_refund"),["price_subtotal:sum","price_total:sum"],["date:month"]],{lazy:false}),
        ]);
        for(const r of fi){ const rg=r.__range&&r.__range["date:month"]; const m=rg?rg.from.slice(0,7):null; if(m){ fact[m]=(fact[m]||0)+(r.price_subtotal||0); factT[m]=(factT[m]||0)+(r.price_total||0); } }
        for(const r of fr){ const rg=r.__range&&r.__range["date:month"]; const m=rg?rg.from.slice(0,7):null; if(m){ fact[m]=(fact[m]||0)-(r.price_subtotal||0); factT[m]=(factT[m]||0)-(r.price_total||0); ncM[m]=(ncM[m]||0)+(r.price_subtotal||0); ncMT[m]=(ncMT[m]||0)+(r.price_total||0); } }
      }catch(e){}
      const curM=inicioMes.slice(0,7);
      ST.ncMesComi = ncM[curM]||0;     // NC del mes en NETO (ya restada en el facturado neto)
      ST.ncMesTotal = ncMT[curM]||0;   // NC del mes CON IVA (para mostrar en métricas · detalle on-demand)
      const prev=Object.keys(bk).filter(m=>m<curM), nP=prev.length||1;
      const promPed=Math.round(prev.reduce((s,m)=>s+bk[m].ped,0)/nP)||1;
      const promCli=Math.round(prev.reduce((s,m)=>s+bk[m].cli.size,0)/nP)||1;
      const avgTicket=ordHist.length?sumTot/ordHist.length:0;
      // META = promedio (o mediana) de los últimos N meses CERRADOS de FACTURADO NETO + % (config)
      const md = EYG.metaDesde(fact, curM, cfg);
      ST.base={ objetivoCobro:(cobro3[0]?.amount||0)/3*1.1, promPed, promCli, perfil: avgTicket>=(cfg.perfilTicket||300000)?"inst":"farm", avgTicket, factBaseline:md.baseline, meta:md.meta, metaMeses:md.meses, fact };
      ST.ventaMes = fact[curM]||0;         // BASE de la comisión = facturado NETO (por cruce) del mes
      ST.factTotalMes = factT[curM]||0;    // MÉTRICA = facturado TOTAL con IVA del mes (lo real)
      ST.pedMesMonto = ped[curM]||0;       // MÉTRICA = pedidos del mes (con IVA)
      ST.act={ ped: bk[curM]?bk[curM].ped:0, cli: bk[curM]?bk[curM].cli.size:0 };
      // métricas HOY / SEMANA en PEDIDOS por vendedor (neto), del propio historial
      const hoy10=hoyStr.slice(0,10), sem7=inicioSem;   // "semana" = semana calendario del mes
      let pedHoy=0,pedSem=0,ventaHoy=0,ventaSem=0; const cliSemS=new Set();
      for(const o of ordHist){ const dd=o.__d||""; const nt=o.amount_total||0; if(dd===hoy10){pedHoy++; ventaHoy+=nt;} if(dd>=sem7){pedSem++; ventaSem+=nt; if(o.partner_id)cliSemS.add(o.partner_id[0]);} }
      ST.ventaSem=ventaSem; ST.ventaHoy=ventaHoy;
      ST.diag={ ventasHoy:ventaHoy, pedHoy, pedSem, cliSem:cliSemS.size };
      // ---- Presupuestos y pedidos (sección superior del panel) ----
      // TODO en NETO SIN IVA (amount_untaxed), igual que "Tus ventas", para que el panel sea consistente.
      const esWeb=o=>!!(o.website_id&&o.website_id[0]);
      const neto=o=>(o.amount_untaxed!=null?o.amount_untaxed:o.amount_total)||0;
      const desde=(f,d)=>(f||"").slice(0,10)>=d;
      // Se descartan los carritos web VACÍOS (sin ítems ni monto): son ruido, no presupuestos reales.
      const allDrafts=(drafts||[]).filter(o=> !esWeb(o) || (o.cart_quantity||0)>0 || (o.amount_total||0)>0 );
      ST.drafts=allDrafts;
      const esWebAbierto=o=>esWeb(o)&&o.state==="draft";   // carrito web sin cerrar
      const esWebCerrado=o=>esWeb(o)&&o.state==="sent";    // el cliente cerró el pedido → falta confirmar
      const webAbiertos=allDrafts.filter(esWebAbierto);
      const webCerrados=allDrafts.filter(esWebCerrado);
      const pp={
        presCurso:allDrafts.length,
        presMan:allDrafts.filter(o=>!esWeb(o)).length,
        presWeb:webAbiertos.length+webCerrados.length,
        webAbiertos:webAbiertos.length,
        webCerrados:webCerrados.length,
        webAbandonados:webAbiertos.filter(o=>o.is_abandoned_cart).length,
        presMonto:allDrafts.reduce((s,o)=>s+neto(o),0),
        presHoy:allDrafts.filter(o=>desde(o.create_date,hoy10)).length,
        presSem:allDrafts.filter(o=>desde(o.create_date,sem7)).length,
        presMes:allDrafts.filter(o=>desde(o.create_date,inicioMes)).length
      };
      const oMes=ordHist.filter(o=>(o.__d||"")>=inicioMes);
      pp.pedHoy=pedHoy; pp.pedSem=pedSem; pp.pedMes=oMes.length;
      pp.pedWebMes=oMes.filter(esWeb).length; pp.pedManMes=oMes.length-pp.pedWebMes;
      pp.origenMes=contarOrigen(oMes);   // desglose por origen del mes (Core · web · asistente · Odoo)
      pp.pedMontoMes=oMes.reduce((s,o)=>s+neto(o),0);
      ST.pedMesList=oMes.slice().sort((a,b)=>String(b.date_order||"").localeCompare(String(a.date_order||"")));
      ST.pp=pp;
    }catch(e){ ST.base=ST.base||{objetivoCobro:0,promPed:1,promCli:1,perfil:"farm",meta:0,factBaseline:0,fact:{}}; ST.act=ST.act||{ped:0,cli:0}; ST.diag=ST.diag||{ventasHoy:0,pedHoy:0,pedSem:0,cliSem:0}; if(ST.ventaMes==null)ST.ventaMes=0; if(ST.factTotalMes==null)ST.factTotalMes=0; if(ST.pedMesMonto==null)ST.pedMesMonto=0; if(ST.ncMesComi==null)ST.ncMesComi=0; if(ST.ncMesTotal==null)ST.ncMesTotal=0; if(ST.ventaSem==null)ST.ventaSem=0; if(ST.ventaHoy==null)ST.ventaHoy=0; }
    // PRIMERA PINTURA con lo esencial (contactos + ventas): el comercial ya puede trabajar.
    // Ofertas y WhatsApp llegan después y RE-pintan (el nivel se ajusta al instante cuando
    // entran los combos colocados; mejor eso que dejar el panel en blanco 10s esperándolos).
    render();
    if(MODO_LIDER){ ldInit(); ldTeamInit(); }   // gráfico de evolución + rendimiento del equipo (líder que vende)
    ntCargar().then(()=>render()).catch(()=>{});   // anotaciones: llegan y repintan, no bloquean
    cargarOfertas(ids).then(()=>{ render(); if(MODO_LIDER){ ldRender(); ldTeamRender(); } }).catch(()=>{});
    cargarWA().then(()=>{ render(); if(MODO_LIDER){ ldRender(); ldTeamRender(); } }).catch(()=>{});
  }catch(e){ document.getElementById("app").innerHTML='<div class="errbox"><b>No pude cargar el panel.</b><br>'+esc(e.message)+'</div>'; }
}
/* Mensajes de WhatsApp que este comercial puede enviar a su cartera (Comunicaciones). */
async function cargarWA(){
  try{
    const arr = await EYG.comsLeer();
    // Email del comercial EFECTIVO. En su propia cuenta = el suyo. Si un admin/líder está
    // viendo el panel de un comercial con ?c=, se resuelve el email de ESE comercial desde el
    // padrón, porque el targeting a 'personas' matchea por email (antes usaba el del logueado,
    // así que los mensajes dirigidos a personas puntuales no se veían en la vista espiada).
    let email = (window.__perfil && window.__perfil.rol==="comercial") ? (window.__perfil.email||"") : "";
    if(!email && COMERCIAL){
      try{ const r=await EYG.rosterCore(); const u=(r||[]).find(x=>x.comercial_ref===COMERCIAL || x.nombre===COMERCIAL); if(u) email=u.email; }catch(e){}
    }
    const wap = {rol:"comercial", comercial_ref:COMERCIAL, email};
    ST.waMsgs = EYG.wasParaComercial(wap, arr);
  }catch(e){ ST.waMsgs=[]; }
}

// NIVELADOR POR RUBRO: reparte los 50 pts de "producción" según el perfil del vendedor (por ticket promedio),
// para no castigar a Instituciones (pocos pedidos grandes) ni sobrepremiar la actividad de Farmacias (muchos chicos).
const PERFIL={ inst:{valor:38,activ:12,nom:"Instituciones"}, farm:{valor:25,activ:25,nom:"Farmacias / Comercial"} };
// NIVEL = PURO PREMIO (total 100; Diamante 95): Cobro+Actividad=50 (split por perfil), Combos 25, Nuevos 20, Constancia 5.
// Fichas y Cartera-sana ya NO están acá: pasaron a la Salud de la cuenta (el freno). Ver saludCuenta().
function nivel(){
  const b=ST.base||{objetivoCobro:0,promPed:0,promCli:0,perfil:"farm"};
  const sp=PERFIL[b.perfil]||PERFIL.farm;
  const act=ST.act||{ped:0,cli:0};
  const P=[];
  const rValor=b.objetivoCobro>0?Math.min(ST.cc.cobradoMes/b.objetivoCobro,1):0;
  P.push({ic:"💰",lab:"Cobro vs objetivo de cobranza",max:sp.valor,pts:sp.valor*rValor,det:"cobraste "+money(ST.cc.cobradoMes)+" de "+money(b.objetivoCobro)+" · "+Math.round(rValor*100)+"%"});
  const rPed=b.promPed>0?Math.min(act.ped/b.promPed,1):0, rCli=b.promCli>0?Math.min(act.cli/b.promCli,1):0, rAct=(rPed+rCli)/2;
  P.push({ic:"📞",lab:"Actividad (pedidos y clientes)",max:sp.activ,pts:sp.activ*rAct,det:"este mes "+act.ped+" ped y "+act.cli+" cli · tu promedio "+b.promPed+" ped / "+b.promCli+" cli · "+Math.round(rAct*100)+"%"});
  // Ofertas: enviar (actividad exigible) + vender (resultado, fuerte)
  const env=ST.ofEnviadas||0, rEnv=Math.min(env/OF_META_ENV,1);
  P.push({ic:"📤",lab:"Ofertas enviadas",max:OF_PTS_ENV,pts:OF_PTS_ENV*rEnv,det:env+" de "+OF_META_ENV+" este mes"});
  const ven=ST.ofVendidas||0, rVen=Math.min(ven/OF_META_VEN,1);
  P.push({ic:"🎁",lab:"Ofertas vendidas",max:OF_PTS_VEN,pts:OF_PTS_VEN*rVen,det:ven+" de "+OF_META_VEN+" colocadas"});
  const rN=Math.min(ST.nuevos/3,1);
  P.push({ic:"🆕",lab:"Clientes nuevos (meta 3)",max:20,pts:20*rN,det:ST.nuevos+" este mes"});
  const actHoy=ST.contactadosHoy.size+ofHoy();   // contactos distintos + ofertas compartidas hoy
  const rCo=Math.min(actHoy/10,1);
  P.push({ic:"🔥",lab:"Constancia (10 contactos/día)",max:5,pts:5*rCo,det:actHoy+" hoy"});
  const pts=P.reduce((s,p)=>s+p.pts,0);
  const idx=pts<40?0:pts<60?1:pts<80?2:pts<95?3:4; // Bronce<40 · Plata40 · Oro60 · Platino80 · Diamante95
  return {lv:idx+1, idx, pts, mult:NIV[idx].m, nombre:NIV[idx].n, emoji:NIV[idx].e, params:P, perfil:sp.nom, base:b};
}
// Explicación completa de cómo se calcula cada número (para que no deje lugar a dudas).
function ayudaHTML(){
  const b=ST.base||{}, meta=corteObjetivo(), baseline=b.factBaseline||0, sp=PERFIL[b.perfil]||PERFIL.farm;
  const N=CFGC().metaMeses||3, P=Math.round((CFGC().metaCrecimiento||0)*100), metodo=CFGC().metaMetodo==='mediana'?'mediana':'promedio';
  return `<div class="ayudabox">
    <h4>🧾 Facturado neto (la base de tu comisión)</h4>
    <p>Lo <b>facturado</b> (facturas − notas de crédito) que salió de <b>tus pedidos</b>. No importa quién emita la factura: se te cuenta a vos porque <b>vos generaste el pedido</b>.</p>

// Ventanita con el DETALLE de las notas de crédito del mes (cliente, fecha, N°, neto) — restan de tu comisión.

      </div>

    </div></div>`;
  try{
    const exNC=(ST.exclMoves&&ST.exclMoves.length)?[["move_id","not in",ST.exclMoves]]:[];   // las que Dirección sacó del cálculo no se listan
    const g=await rpc("account.move.line","read_group",[[["parent_state","=","posted"],["move_id.move_type","=","out_refund"],["date",">=",inicioMes],...exNC,
      "|",["sale_line_ids.order_id.user_id","=",ST.userId],
          "&",["sale_line_ids.order_id.user_id","=",452],["sale_line_ids.order_id.partner_id.user_id","=",ST.userId]],["price_total:sum"],["move_id"]],{lazy:false});
    const netById={}; const ids=[];
    for(const r of g){ const id=r.move_id&&r.move_id[0]; if(id){ netById[id]=(netById[id]||0)+(r.price_total||0); ids.push(id); } }
    const moves=ids.length?await rpc("account.move","read",[ids],{fields:["name","invoice_date","partner_id"]}):[];
    moves.sort((a,b)=>String(b.invoice_date||"").localeCompare(String(a.invoice_date||"")));
    const fD=s=>s?(s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4)):"—";
    let tot=0; moves.forEach(m=>tot+=netById[m.id]||0);

    if(!moves.length){ body.innerHTML='<div style="font-size:14px">No tenés notas de crédito este mes. 👌</div>'; return; }
    body.innerHTML=`<div style="font-size:12.5px;color:var(--gris);margin-bottom:10px">Tus notas de crédito del mes, <b>con IVA</b>. Se descuentan de tu facturación (para la comisión se resta el neto).</div>
      <div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:13px">

        ${moves.map(m=>`<tr style="border-top:1px solid var(--line)"><td style="padding:8px">${esc(m.partner_id?m.partner_id[1]:'—')}</td><td style="padding:8px;white-space:nowrap">${fD(m.invoice_date)}</td><td style="padding:8px;white-space:nowrap">${esc(m.name||'—')}</td><td style="padding:8px;text-align:right;color:var(--coral);font-weight:800;white-space:nowrap">−${money(netById[m.id]||0)}</td></tr>`).join("")}

      </table></div>`;
  }catch(e){ const body=document.getElementById("ncBody"); if(body)body.innerHTML='<div class="errbox">No pude cargar las notas de crédito: '+esc(e.message)+'</div>'; }

// SALUD DE LA CUENTA (0-100) = el FRENO. Baja por: vencido de cartera (45), facturado bajo el piso (30), fichas (25).
// Recorta la tasa de comisión hasta 1 punto (proporcional a lo que baje la salud). Externo NO tiene salud.
function saludCuenta(){
  const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
  const total=ST.contactos.length||1;
  const fichas=ST.contactos.filter(c=>completar(c).pct>=100).length/total;
  const venc=ST.cc.porCobrar>0?ST.cc.vencido/ST.cc.porCobrar:0;
  const d=now.getDate(), dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const esperado=(ST.base?.factBaseline||0)*(d/dim); // piso prorrateado por día del mes (sobre tus pedidos)
  const factRatio=esperado>0?(ST.ventaMes||0)/esperado:1;
  const pV=cl((venc-0.10)/0.40,0,1)*45;   // vencido: desde 10%, tope 50%
  const pF=cl((1-factRatio)/0.30,0,1)*30; // facturado < piso (prorrateado)
  const pO=cl((0.40-fichas)/0.40,0,1)*25; // fichas < 40%
  const salud=Math.max(0,100-pV-pF-pO);
  const penaltyPt=esExterno()?0:(100-salud)/100; // hasta 1 punto de tasa
  return {salud, penaltyPt, venc, fichas, factRatio,
    items:[{ic:"🩸",lab:"Vencido de cartera",pts:pV,max:45,det:money(ST.cc.vencido)+" vencido ("+Math.round(venc*100)+"% de lo por cobrar) · solo lo pasado de plazo"},
           {ic:"📉",lab:"Facturado vs tu piso",pts:pF,max:30,det:Math.round(factRatio*100)+"% del ritmo esperado"},
           {ic:"🗂️",lab:"Fichas completas",pts:pO,max:25,det:Math.round(fichas*100)+"% de la cartera"}]};
}

/* ===== PEDIDOS: fechas, orígenes y métricas =====
   Todo lo que se filtra o se cuenta acá usa la fecha ARGENTINA del pedido (o.__d), no el
   date_order crudo de Odoo (que viene en UTC). */
const PED_FIELDS=["partner_id","date_order","amount_total","amount_untaxed","website_id","name","origin","create_uid","invoice_status","state"];
const pedFechaAR=f=>{ if(!f) return ""; try{ return EYG.argParts(f).date; }catch(e){ return String(f).slice(0,10); } };
const dSum=(s,n)=>{ const d=new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const lunesDe=s=>{ const d=new Date(s+"T12:00:00"); return dSum(s,-((d.getDay()+6)%7)); };
const primeroDe=s=>s.slice(0,7)+"-01";
const finDeMes=s=>{ const d=new Date(s.slice(0,7)+"-01T12:00:00"); d.setMonth(d.getMonth()+1); d.setDate(0); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const diasEntre=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000);
const diaCorto=s=>s?s.slice(8,10)+"/"+s.slice(5,7):"";

/* De dónde salió cada pedido. odoo-rpc entra a Odoo SIEMPRE como el conector (Diego, 520):
   por eso el origen fino lo da el campo "origin", que estampan el Core ("Core · …") y el
   asistente de WhatsApp ("WhatsApp · asistente EyG"). El create_uid queda como respaldo para
   los pedidos viejos, cargados por el Core antes de que empezara a estampar el origen. */
const CONECTOR_UID=520;
const ORIGENES=[
  {k:"core",ic:"📱",cls:"core",lab:"Core (la app)",     ayuda:"Los que cargás vos desde “Cargar venta”, acá en el Core."},
  {k:"web", ic:"🌐",cls:"web", lab:"Portal web",        ayuda:"El cliente los armó solo en la web de EyG y quedaron confirmados."},
  {k:"bot", ic:"🤖",cls:"bot", lab:"Asistente WhatsApp",ayuda:"Los tomó el asistente de WhatsApp charlando con el cliente."},
  {k:"odoo",ic:"✍️",cls:"man", lab:"Odoo (a mano)",     ayuda:"Cargados a mano dentro de Odoo (por vos o por administración)."}
];
const ORIG_MAP={}; ORIGENES.forEach(o=>ORIG_MAP[o.k]=o);
function origenDe(o){
  if(o.website_id&&o.website_id[0]) return "web";
  const og=String(o.origin||"");
  if(/whatsapp|asistente/i.test(og)) return "bot";
  if(/core/i.test(og)) return "core";
  const cu=o.create_uid&&o.create_uid[0];
  if(cu===CONECTOR_UID && ST.userId!==CONECTOR_UID) return "core";
  return "odoo";
}
const netoDe=o=>(o.amount_untaxed!=null?o.amount_untaxed:o.amount_total)||0;
function contarOrigen(arr){ const r={}; ORIGENES.forEach(o=>r[o.k]={n:0,monto:0});
  for(const o of (arr||[])){ const k=origenDe(o); r[k].n++; r[k].monto+=netoDe(o); } return r; }

/* Períodos del filtro. La semana es la CALENDARIO (lunes a domingo). */
const PED_PERIODOS=[["hoy","Hoy"],["ayer","Ayer"],["sem","Esta semana"],["sem1","Semana pasada"],["mes","Este mes"],["mes1","Mes pasado"],["d90","90 días"],["todo","Todo"]];
function pedRango(){
  const k=ST.pedPer||"mes", hoy=hoyStr;
  if(k==="rango"){ const d=ST.pedDesde||hoy, h=ST.pedHasta||hoy; return {desde:d,hasta:h,lab:`del ${diaCorto(d)} al ${diaCorto(h)}`}; }
  const lun=lunesDe(hoy), m0=primeroDe(hoy), mp=primeroDe(dSum(m0,-1));
  const R={
    hoy: {desde:hoy,hasta:hoy,lab:"hoy"},
    ayer:{desde:dSum(hoy,-1),hasta:dSum(hoy,-1),lab:"ayer"},
    sem: {desde:lun,hasta:hoy,lab:"esta semana"},
    sem1:{desde:dSum(lun,-7),hasta:dSum(lun,-1),lab:"la semana pasada"},
    mes: {desde:m0,hasta:hoy,lab:"este mes"},
    mes1:{desde:mp,hasta:finDeMes(mp),lab:"el mes pasado"},
    d90: {desde:dSum(hoy,-89),hasta:hoy,lab:"los últimos 90 días"},
    todo:{desde:ST.pedFuenteDesde||hace(190),hasta:hoy,lab:"todo lo cargado"}
  };
  return R[k]||R.mes;
}
function pedMetricas(arr){
  const m={n:arr.length,monto:0,clientes:0,ticket:0,fact:0,aFact:0,porOrigen:contarOrigen(arr),porDia:{}};
  const cli=new Set();
  for(const o of arr){ m.monto+=netoDe(o); if(o.partner_id)cli.add(o.partner_id[0]);
    if(o.invoice_status==="invoiced")m.fact++; else if(o.invoice_status==="to invoice")m.aFact++;
    m.porDia[o.__d]=(m.porDia[o.__d]||0)+1; }
  m.clientes=cli.size; m.ticket=arr.length?m.monto/arr.length:0; return m;
}
/* ===== BÚSQUEDA dentro de la vista de pedidos =====
   Dos búsquedas en una sola caja, porque para el comercial es una sola pregunta:
     · cliente y número de pedido -> se resuelve acá, con lo que ya está cargado: instantáneo.
     · producto -> eso NO viaja en el historial (no traemos los renglones), así que se le
       pregunta a Odoo, acotado al comercial y al período que está mirando. Tarda ~1,5 s, se
       hace una sola vez por texto+período y queda cacheado mientras no cambien.
   Un pedido entra si coincide por cualquiera de las dos vías. */
const pedNrm=s=>(s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function pedCoincideLocal(o,q){
  const donde=pedNrm(o.partner_id?o.partner_id[1]:"")+" "+pedNrm(o.name);
  return q.split(/\s+/).filter(Boolean).every(t=>donde.includes(t));   // todas las palabras, en cualquier orden
}
function pedFiltrarBusqueda(arr){
  const q=pedNrm(ST.pedQ||"").trim(); if(!q) return arr;
  const P=ST.pedProd, hits=(P&&P.q===q&&P.ids)?P.ids:null;
  return arr.filter(o=>pedCoincideLocal(o,q)||(hits&&hits.has(o.id)));
}
async function pedBuscarProductos(){
  const q=pedNrm(ST.pedQ||"").trim(), r=pedRango();
  if(q.length<3){ ST.pedProd=null; return; }          // con 1-2 letras no vale la pena molestar a Odoo
  const clave=q+"|"+r.desde+"|"+r.hasta;
  if(ST.pedProd&&ST.pedProd.clave===clave) return;    // mismo texto y mismo período: ya lo tenemos
  ST.pedProd={clave,q,ids:null,cargando:true};
  const repinta=()=>{ try{ EYG.repintar(()=>render()); }catch(e){ render(); } };
  repinta();
  try{
    const ids=await rpc("sale.order","search",[[["user_id","=",ST.userId],["state","in",["sale","done"]],
      ["date_order",">=",dSum(r.desde,-1)+" 00:00:00"],["date_order","<=",dSum(r.hasta,1)+" 23:59:59"],
      ["order_line.product_id","ilike",(ST.pedQ||"").trim()]]],{limit:0});
    if(ST.pedProd&&ST.pedProd.clave===clave) ST.pedProd={clave,q,ids:new Set(ids||[]),cargando:false};
  }catch(e){
    if(ST.pedProd&&ST.pedProd.clave===clave) ST.pedProd={clave,q,ids:new Set(),cargando:false,fallo:true};
  }
  repinta();
}
// El campo se engancha con EYG.buscador: sin eso, cada tecla repinta la vista y el cursor se escapa.
window.pedBuscar = (EYG.buscador
  ? EYG.buscador(v=>{ ST.pedQ=v; ST.pedOrigen=null; pedBuscarProductos(); render(); }, 320)
  : (v=>{ ST.pedQ=v; ST.pedOrigen=null; pedBuscarProductos(); render(); }));

   En la pantalla principal: DOS tarjetas (día/semana/mes + manual/web). Adentro de
   cada una (al desplegar) hay un mini-listado y un botón que abre la VISTA COMPLETA
   (pantalla aparte dentro del panel, sin ir a Odoo). El botón de "Cargar venta" queda
   uno solo en el hero + otro dentro de la vista de presupuestos. */
const ppFecha=f=>{ if(!f) return ""; try{ const ap=EYG.argParts(f); return ap.date.slice(8,10)+"/"+ap.date.slice(5,7); }catch(e){ return String(f).slice(8,10)+"/"+String(f).slice(5,7); } };
function ppRow(o,t){
  const cli=o.partner_id?o.partner_id[1]:"Sin cliente";
  const web=!!(o.website_id&&o.website_id[0]);
  const monto=(o.amount_untaxed!=null?o.amount_untaxed:o.amount_total)||0;
  const f=ppFecha(t==="pres"?o.write_date:o.date_order);
  // etiqueta de origen/estado (solo presupuestos): manual · carrito web abierto · web cerrado a confirmar
  const cerrado = t==="pres" && web && o.state==="sent";
  let tag;
  if(t!=="pres"){ const O=ORIG_MAP[origenDe(o)]||ORIG_MAP.odoo; tag=`<span class="csrc ${O.cls}" title="${esc(O.ayuda)}">${O.ic} ${O.lab}</span>`; }
  else if(!web) tag='<span class="csrc man">✍️ manual</span>';
  else if(cerrado) tag='<span class="csrc cerr">📩 web cerrado · a confirmar</span>';
  else tag='<span class="csrc abie">🛒 carrito web'+(o.is_abandoned_cart?' abandonado':' abierto')+'</span>';
  const extra=t==="pres"?((o.order_line||[]).length+" prod.")
    :(o.invoice_status==="invoiced"?"✅ facturado":o.invoice_status==="to invoice"?"🧾 a facturar":"");
  const click=t==="pres"?`location.href='${venderURL('reanudar='+o.id)}'`:`verOdoo('id=${o.id}&model=sale.order&view_type=form')`;
  const go=t!=="pres"?'Ver →':(cerrado?'Confirmar →':'Retomar →');
  // 📝 anotaciones de ESTE pedido: si ya hay, abre la lista filtrada; si no, una nueva.
  const nAnot=ntDePedido(o.id).length;
  const pin=ntEsMiPanel()?`<button class="ntpin" onclick="event.stopPropagation();ntDelPedido(${o.id})"
      title="${nAnot?nAnot+" anotación"+(nAnot===1?"":"es")+" en este pedido":"Dejar una anotación en este pedido"}">📝${nAnot?`<b> ${nAnot}</b>`:""}</button>`:"";
  return `<div class="pprow${cerrado?' urge':''}" onclick="${click}">
    <div><div class="cli">${esc(cli)}${tag}</div>
    <div class="meta">${esc(o.name||'')}${extra?' · '+extra:''}${f?' · '+f:''}</div></div>
    <div class="tot">${money(monto)}</div>
    <div class="go">${pin}${go}</div>
  </div>`;
}
// Prioridad de un presupuesto para ordenar la lista: primero los que piden acción del comercial.
const ppPrio=o=>{ const web=!!(o.website_id&&o.website_id[0]); if(web&&o.state==="sent") return 0; if(web&&o.is_abandoned_cart) return 1; return 2; };
const ppArr=t=> t==="pres"
  ? (ST.drafts||[]).slice().sort((a,b)=> (ppPrio(a)-ppPrio(b)) || String(b.write_date||"").localeCompare(String(a.write_date||"")))
  : (ST.pedMesList||[]);
function ppMini(t){
  const arr=ppArr(t);
  if(!arr.length) return `<div class="ppnone">${t==="pres"?"No tenés presupuestos en curso.":"No hay pedidos confirmados este mes."}</div>`;
  const rows=arr.slice(0,4).map(o=>ppRow(o,t)).join("");
  const mas=arr.length>4?`<div class="ppmas">y ${arr.length-4} más…</div>`:"";
  return `<div class="pplist mini">${rows}</div>${mas}`;
}

/* ===== VISTA DE PEDIDOS: filtro por período + métricas =====
   Todo se calcula en el navegador sobre los pedidos que ya están cargados (6 meses), así que
   cambiar de período es instantáneo y no vuelve a Odoo. Solo se va a buscar más cuando el
   comercial pide a mano un rango anterior a esos 6 meses. */
function pedTile(ic,lab,val,sub,ayuda){
  return `<div class="pmt" title="${esc(ayuda||"")}"><div class="pmt-ic">${ic}</div><div class="pmt-b">
    <div class="pmt-v">${val}</div><div class="pmt-l">${esc(lab)}</div>${sub?`<div class="pmt-s">${sub}</div>`:""}</div></div>`;
}
function pedDelta(a,b){
  if(!b) return a?'<span class="pdel up">sin comparación</span>':"";
  const p=Math.round((a-b)/b*100);
  if(p===0) return '<span class="pdel eq">igual</span>';
  return `<span class="pdel ${p>0?"up":"down"}">${p>0?"▲":"▼"} ${Math.abs(p)}%</span>`;
}
/* ===== Vista completa de ANOTACIONES ===== */
function ntFiltrar(){
  let a=(ST.notas||[]).slice();
  if(ST.ntPedido) a=a.filter(x=>x.pedido_id===ST.ntPedido);
  if(ST.ntEstado==="hechas") a=a.filter(x=>x.estado==="hecha");
  else a=a.filter(x=>x.estado==="abierta");
  if(ST.ntTipo) a=a.filter(x=>x.tipo===ST.ntTipo);
  const q=ntNorm(ST.ntQ||"");
  if(q) a=a.filter(x=>ntNorm((x.texto||"")+" "+(x.cliente_nombre||"")+" "+(x.pedido_nombre||"")).includes(q));
  // Primero lo que pide acción: llegó lo que esperaba > vencidas > el resto, y dentro, lo más nuevo
  return a.sort((x,y)=>{
    const px=(ntLlego(x)?0:ntVence(x)?1:2), py=(ntLlego(y)?0:ntVence(y)?1:2);
    return px-py || String(y.creada_ts||"").localeCompare(String(x.creada_ts||""));
  });
}

function ntCardHTML(){

function pintarVistaPed(app){
  const r=pedRango(), fuente=ST.pedFuente||ST.ordHist||[];
  const enRango=fuente.filter(o=>o.__d>=r.desde&&o.__d<=r.hasta);
  // La BÚSQUEDA recorta todo (tarjetas incluidas): lo que se ve arriba describe lo que se ve abajo.
  // El filtro por ORIGEN, en cambio, solo recorta la lista: así las cuatro tarjetas de origen
  // siguen mostrando el reparto completo y se puede saltar de una a otra.
  const busq=ST.pedQ&&ST.pedQ.trim(), enBusq=pedFiltrarBusqueda(enRango);
  const m=pedMetricas(enBusq);
  // Período anterior de IGUAL largo, para comparar. Solo si tenemos datos cargados tan atrás.
  // Con una búsqueda activa no se compara: el período anterior no está buscado, y el número mentiría.
  const largo=diasEntre(r.desde,r.hasta)+1, pHasta=dSum(r.desde,-1), pDesde=dSum(pHasta,-(largo-1));
  const mp = (!busq && pDesde>=(ST.pedFuenteDesde||hace(190))) ? pedMetricas(fuente.filter(o=>o.__d>=pDesde&&o.__d<=pHasta)) : null;
  const vs = mp?` <span class="pmt-s" style="display:inline">vs ${largo===1?"el día":largo+" días"} anterior${largo===1?"":"es"}</span>`:"";
  const arr=(ST.pedOrigen?enBusq.filter(o=>origenDe(o)===ST.pedOrigen):enBusq)
    .slice().sort((a,b)=>String(b.date_order||"").localeCompare(String(a.date_order||"")));

  const chips=PED_PERIODOS.map(([k,lab])=>{
    const ay=k==="sem"?"Semana calendario: de lunes a hoy":k==="sem1"?"La semana calendario anterior, completa (lunes a domingo)":k==="todo"?"Todo lo que el panel tiene cargado: los últimos 6 meses":"";
    return `<button class="pchip${ST.pedPer===k?" on":""}" onclick="pedPer('${k}')"${ay?` title="${ay}"`:""}>${lab}</button>`;
  }).join("")+`<button class="pchip${ST.pedPer==="rango"?" on":""}" onclick="pedAbrirRango()" title="Elegir vos las fechas. Si vas más atrás de 6 meses, se traen de Odoo.">📅 Fechas</button>`;

  const rangoBox=(ST.pedRangoAbierto||ST.pedPer==="rango")?`<div class="prango">
      <label>Desde<input type="date" id="pedD" value="${ST.pedDesde||r.desde}" max="${hoyStr}"></label>
      <label>Hasta<input type="date" id="pedH" value="${ST.pedHasta||r.hasta}" max="${hoyStr}"></label>
      <button class="pgo" onclick="pedRangoManual()">Ver</button>
    </div>`:"";

  // Caja de búsqueda + el aviso de qué está pasando con la parte que consulta a Odoo.
  const caja=`<div class="pedbusca">
      <span class="pb-ic">🔎</span>
      <input id="pedQ" type="search" autocomplete="off" placeholder="Buscar por cliente, número de pedido o producto…"
             value="${esc(ST.pedQ||"")}" oninput="pedBuscar(this.value)">
      ${busq?`<button class="pb-x" onclick="pedLimpiarBusqueda()" title="Borrar la búsqueda">✕</button>`:""}
    </div>`;
  let aviso="";
  if(busq){
    const P=ST.pedProd, qn=pedNrm(busq);
    if(qn.length<3) aviso="Buscando por cliente y número. Escribí <b>3 letras o más</b> para buscar también dentro de los productos.";
    else if(P&&P.cargando) aviso='<span class="spin-sm"></span> buscando ese producto en los pedidos…';
    else if(P&&P.fallo) aviso="No pude buscar dentro de los productos (probá de nuevo). Por ahora se busca solo por cliente y número.";
    // Se informa SOLO lo que se ve. El conteo crudo de Odoo incluye el margen de un dia que se
    // pide de mas por la diferencia horaria, asi que mostrarlo daria un numero que no cierra con la lista.
    else if(P&&P.ids) aviso=`<b>${arr.length}</b> resultado${arr.length===1?"":"s"} · busqué por cliente, número de pedido y productos.`;
  }
  const busqBox=caja+(aviso?`<div class="pedhint">${aviso}</div>`:"");

  const tiles=`<div class="pmts">
    ${pedTile("📦","Pedidos",m.n,(mp?pedDelta(m.n,mp.n)+vs:""),"Pedidos confirmados en el período elegido.")}
    ${pedTile("💰","Monto pedido",money(m.monto),(mp?pedDelta(m.monto,mp.monto)+" ":"")+"neto sin IVA","Suma de lo pedido en el período, neto sin IVA (mismo criterio que “Tus ventas”). Ojo: un pedido se factura al entregarse, a veces en otro mes.")}
    ${pedTile("🎯","Ticket promedio",money(m.ticket),"","Cuánto sale, en promedio, cada pedido del período. Subirlo es la palanca más fácil: sumar un producto más por pedido.")}
    ${pedTile("👥","Clientes",m.clientes,(m.clientes?(m.n/m.clientes).toFixed(1)+" pedidos c/u":""),"Clientes distintos que te compraron en el período.")}
  </div>`;

  const dias=Object.entries(m.porDia).sort((a,b)=>b[1]-a[1])[0];
  const otros=m.n-m.fact-m.aFact;
  const facSt=m.n?`<div class="pfact">
      <span title="Pedidos del período que Odoo ya facturó.">✅ <b>${m.fact}</b> facturados</span>
      <span title="Pedidos entregados o listos que todavía esperan factura.">🧾 <b>${m.aFact}</b> a facturar</span>
      ${otros>0?`<span title="Pedidos sin nada pendiente de facturar (por ejemplo, ya cerrados).">➖ <b>${otros}</b> sin pendiente</span>`:""}
      ${dias&&largo>1?`<span title="El día que más pedidos te entraron dentro del período.">🏆 mejor día: <b>${diaCorto(dias[0])}</b> (${dias[1]})</span>`:""}
    </div>`:"";

  const oCards=m.n?`<div class="secrow"><h3 class="sec2">¿De dónde vienen los pedidos?</h3>${ST.pedOrigen?`<button class="plimp" onclick="pedFiltrarOrigen('${ST.pedOrigen}')">✕ ver todos</button>`:""}</div>
    <div class="porigs">${ORIGENES.map(o=>{
      const d=m.porOrigen[o.k]||{n:0,monto:0}, pct=m.n?Math.round(d.n/m.n*100):0;
      return `<div class="porig ${o.cls}${ST.pedOrigen===o.k?" on":""}${d.n?"":" cero"}" onclick="pedFiltrarOrigen('${o.k}')" title="${esc(o.ayuda)} Tocá la tarjeta para ver solo estos.">
        <div class="po-h"><span class="po-ic">${o.ic}</span><span class="po-lab">${o.lab}</span></div>
        <div class="po-n">${d.n}<small> pedido${d.n===1?"":"s"}</small></div>
        <div class="po-bar"><i style="width:${pct}%"></i></div>
        <div class="po-s">${pct}% · ${money(d.monto)}</div>
      </div>`; }).join("")}</div>`:"";

  // La lista se corta en 200 filas para que el navegador no se arrastre en los períodos largos.
  // Se avisa siempre: nunca mostrar un recorte haciéndolo pasar por el total.
  const TOPE=200, muestra=arr.slice(0,TOPE);
  const cuerpo=arr.length
    ? `<div class="pplist">${muestra.map(o=>ppRow(o,"ped")).join("")}</div>${arr.length>TOPE?`<div class="ppmas">Mostrando los ${TOPE} más recientes de ${arr.length}. Elegí un período más corto para verlos todos.</div>`:""}`
    : `<div class="ppempty">${busq
        ? `No encontré pedidos con “${esc(busq)}”${ST.pedOrigen?" de ese origen":""} en ${r.lab}. Probá con otro período.`
        : `No hay pedidos ${ST.pedOrigen?"de ese origen ":""}en ${r.lab}.`}</div>`;

  app.innerHTML=`<div class="vhead">
      <button class="vback" onclick="volverDash()">← Volver</button>
      <h1>📦 Pedidos <span class="vcount">${arr.length}</span></h1>
    </div>
    <div class="pedbar">${chips}</div>${rangoBox}${busqBox}
    <div class="psub">Mostrando <b>${r.lab}</b> · del ${diaCorto(r.desde)} al ${diaCorto(r.hasta)}${ST.pedOrigen?` · solo ${ORIG_MAP[ST.pedOrigen].ic} ${ORIG_MAP[ST.pedOrigen].lab}`:""}${busq?` · buscando “${esc(busq)}”`:""}</div>
    ${ST.pedCargando?'<div class="floading"><span class="spin-sm"></span> buscando pedidos en Odoo…</div>':""}
    ${tiles}${facSt}${oCards}${cuerpo}`;
}

/* lista() rearma toda la cartera. Sin debounce eso corría en cada tecla y en
