<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Panel · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=7"></script>
<style>
  :root{
    --teal:#048782; --teal-deep:#04635F; --teal-med:#0AA89F; --aqua:#5FC8BF;
    --agua:#E2F1EF; --coral:#EC8B5E; --ink:#0E1F1D; --gris:#5F716E; --gris2:#8A9A97;
    --surface:#fff; --bg:#F4F8F7; --line:#DCE8E6; --radius:14px; --wa:#25D366;
    --gold:#E5A93B; --shadow:0 1px 2px rgba(6,65,62,.05), 0 8px 30px rgba(6,65,62,.07);
    --ok:#1E7D46; --okbg:#E4F5E9; --bad:#B0413E; --badbg:#FBE4E3; --warn:#B7791F; --warnbg:#FBF0DA;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .topbar{background:var(--teal-deep);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:13px;position:sticky;top:0;z-index:30}
  .mono{font-family:Georgia,serif;font-weight:700;font-size:23px;letter-spacing:.5px;line-height:1}
  .mono .y{color:var(--aqua)}
  .topbar .tag{font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:20px}
  .topbar .who{margin-left:auto;text-align:right;font-size:13px}
  .topbar .who b{display:block;font-size:15px}
  .topbar .who span{color:var(--aqua);font-size:12px}
  .wrap{max-width:1120px;margin:0 auto;padding:22px 22px 90px}

  .hero{display:flex;align-items:center;gap:18px;margin-bottom:22px;flex-wrap:wrap}
  .hero h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
  .hero .msg{color:var(--gris);font-size:14px;margin-top:2px}
  .level{margin-left:auto;background:linear-gradient(135deg,var(--teal),var(--teal-deep));color:#fff;border-radius:16px;padding:12px 18px;text-align:center;min-width:120px;box-shadow:var(--shadow)}
  .level .lv{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.85}
  .level .lvn{font-size:22px;font-weight:900;line-height:1.1}
  .level .streak{font-size:12px;margin-top:3px}

  .goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:24px}
  .goal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
  .goal.done{border-color:var(--ok);background:linear-gradient(180deg,#F2FBF5,#fff)}
  .ring{--p:0;--c:var(--teal);width:88px;height:88px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
    background:radial-gradient(closest-side,#fff 79%,transparent 80% 100%),conic-gradient(var(--c) calc(var(--p)*1%),#EAF1F0 0);transition:--p 1s ease}
  @property --p{syntax:'<number>';inherits:false;initial-value:0}
  .ring .rv{font-size:19px;font-weight:900;line-height:1} .ring .rt{font-size:10px;color:var(--gris)}
  .goal .gt{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--gris)}
  .goal .gn{font-size:24px;font-weight:800;margin:2px 0} .goal .gs{font-size:12.5px;color:var(--gris)}
  .goal .chk{position:absolute;top:12px;right:12px;font-size:18px;opacity:0;transform:scale(.5);transition:.3s}
  .goal.done .chk{opacity:1;transform:scale(1)}

  .achv{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
  .badge-a{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:7px 14px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
  .badge-a.on{background:linear-gradient(135deg,#FFF6E4,#fff);border-color:var(--gold);color:#8a6414}
  .badge-a.off{opacity:.45;filter:grayscale(.6)}
  .badge-a .em{font-size:17px}

  .money-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:26px}
  .mcard{background:var(--teal-deep);color:#fff;border-radius:var(--radius);padding:18px 20px}
  .mcard.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  .mcard .l{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.85} .mcard.alt .l{color:var(--gris);opacity:1}
  .mcard .v{font-size:24px;font-weight:800;margin-top:4px}
  .mcard .sub{font-size:12px;opacity:.8;margin-top:3px} .mcard.alt .sub{color:var(--gris2)}
  .mcard.cobrar{background:var(--teal)} .mcard.venc{background:#A5312E}
  .mcard{position:relative} .mcard.lk{cursor:pointer;transition:transform .1s,box-shadow .1s}
  .mcard.lk:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(6,65,62,.14)}
  .mcard .odoo{position:absolute;top:9px;right:11px;font-size:10px;font-weight:700;opacity:.65;letter-spacing:.3px}
  .mcard.alt .odoo{color:var(--teal-deep)}
  .debt{display:inline-block;margin-top:5px;font-size:11px;font-weight:700;color:var(--teal-deep);background:var(--agua);border-radius:6px;padding:2px 8px}
  .debt.v{color:#fff;background:#A5312E}

  .secrow{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
  h2.sec{font-size:16px;font-weight:800;display:flex;align-items:center;gap:10px}
  h2.sec .pill{font-size:12px;font-weight:700;background:var(--agua);color:var(--teal-deep);border-radius:20px;padding:3px 11px}
  .newbtn{margin-left:auto;background:var(--teal);color:#fff;border:0;border-radius:10px;padding:9px 15px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
  .newbtn:hover{filter:brightness(1.06)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--gris);border-radius:20px;padding:7px 13px;cursor:pointer}
  .chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 12px}
  .search input{border:0;background:none;outline:none;font-family:inherit;font-size:14px;width:100%}
  .search svg{width:16px;height:16px;color:var(--gris2)}

  .clist{display:flex;flex-direction:column;gap:10px}
  .cc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr 130px 120px auto;gap:14px;align-items:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s,border-color .1s}
  .cc:hover{transform:translateY(-1px);border-color:var(--teal-med)}
  .cc.hoy{border-left:4px solid var(--ok)}
  .cc>div{min-width:0}
  .cc .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cc .mt{font-size:12px;color:var(--gris2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cc .rec{font-size:12.5px} .cc .rec b{font-weight:700} .cc .rec .sub{color:var(--gris2);font-size:11.5px}
  .compbar .lab{font-size:11px;color:var(--gris);margin-bottom:4px;display:flex;justify-content:space-between}
  .compbar .track{height:7px;background:#EAF1F0;border-radius:6px;overflow:hidden}
  .compbar .fill{height:100%;border-radius:6px;transition:width .5s}
  .cc .go{font-size:12px;font-weight:700;color:var(--teal);white-space:nowrap}
  .cc .done-tag{font-size:11px;font-weight:700;color:var(--ok);background:var(--okbg);border-radius:20px;padding:3px 9px}
  .notel{display:inline-block;margin-top:5px;font-size:11px;font-weight:700;color:var(--bad);background:var(--badbg);border-radius:6px;padding:2px 8px}
  .cc.st{border-left:4px solid var(--bad)}
  .cc.st.hoy{border-left-color:var(--ok)}

  .loading,.empty{text-align:center;padding:60px 20px;color:var(--gris)}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .errbox{background:#FBE4E3;border:1px solid #F3B5B2;color:#8A2E2B;padding:16px;border-radius:12px}

  .scrim{position:fixed;inset:0;background:rgba(6,65,62,.35);opacity:0;pointer-events:none;transition:.2s;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:500px;max-width:96vw;background:var(--surface);z-index:50;box-shadow:-8px 0 40px rgba(6,65,62,.18);transform:translateX(100%);transition:transform .24s;display:flex;flex-direction:column}
  .drawer.on{transform:none}
  .dhead{padding:18px 22px;border-bottom:1px solid var(--line);background:var(--teal-deep);color:#fff}
  .dhead .x{float:right;cursor:pointer;font-size:22px;opacity:.85}
  .dhead h3{font-size:17px;font-weight:800;padding-right:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dhead .cbar{margin-top:10px;height:8px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden}
  .dhead .cbar .f{height:100%;background:var(--aqua);border-radius:6px;transition:width .5s}
  .dhead .cpct{font-size:12px;margin-top:6px;opacity:.9}
  .dbody{overflow-y:auto;flex:1}
  /* intel */
  .intel{padding:16px 22px;background:#F0F6F5;border-bottom:1px solid var(--line)}
  .intel h4,.form h4{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--teal-med);margin-bottom:10px}
  .istat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
  .istat .b{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;text-align:center}
  .istat .b .v{font-size:15px;font-weight:800;line-height:1.1} .istat .b .l{font-size:10.5px;color:var(--gris);margin-top:2px}
  .prod{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .prod .pq{color:var(--teal-deep);font-weight:700;white-space:nowrap}
  .wa-contact{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--wa);color:#fff;border:0;border-radius:10px;padding:12px;font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:12px;text-decoration:none}
  .wa-contact:hover{filter:brightness(1.05)} .wa-contact[data-off]{background:#EFF1F1;color:#B3BDBB;cursor:default}
  .form{padding:18px 22px}
  .fld{margin-bottom:13px}
  .fld label{display:block;font-size:12px;font-weight:700;color:var(--gris);margin-bottom:5px}
  .fld label .miss{color:var(--bad);font-weight:700;margin-left:6px;font-size:11px}
  .fld input,.fld select{width:100%;font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--ink);background:var(--surface)}
  .fld input:focus,.fld select:focus{outline:none;border-color:var(--teal-med);box-shadow:0 0 0 3px rgba(10,168,159,.12)}
  .fld .hint{font-size:11px;color:var(--gris2);margin-top:4px}
  .fld .prev{font-size:11.5px;color:var(--teal-deep);font-weight:600;margin-top:4px;min-height:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .dfoot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;background:var(--surface)}
  .btn{flex:1;font-family:inherit;font-size:14.5px;font-weight:700;border:0;border-radius:10px;padding:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
  .btn.save{background:var(--teal);color:#fff} .btn.save:hover{filter:brightness(1.06)}
  .btn[disabled]{opacity:.5;cursor:default}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 22px;border-radius:30px;font-weight:600;font-size:14px;opacity:0;transition:.3s;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.win{background:linear-gradient(135deg,var(--gold),#c9871f)}
  /* confirmación de envío de WhatsApp */
  .kpi.ayuda{background:linear-gradient(160deg,#F3FAF9,#fff);border-color:#D6EFEA;margin-bottom:20px}
  .ayudabox{font-size:13px;color:var(--gris);line-height:1.5}
  .ayudabox h4{font-size:13px;font-weight:800;color:var(--ink);margin:12px 0 3px} .ayudabox h4:first-child{margin-top:0}
  .ayudabox p{margin:0 0 6px} .ayudabox b{color:var(--ink)}
  .ayudabox .ayl{list-style:none;display:grid;gap:5px;margin:4px 0 6px} .ayudabox .ayl li{padding-left:14px;position:relative} .ayudabox .ayl li::before{content:"•";position:absolute;left:2px;color:var(--teal)}
  .waconfirm{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:16px;z-index:90;pointer-events:none;transform:translateY(120%);transition:transform .28s cubic-bezier(.22,1,.36,1)}
  .waconfirm.on{transform:none;pointer-events:auto}
  .waconfirm .wcbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(6,65,62,.25);padding:16px 18px;max-width:440px;width:100%}
  .waconfirm .wct{font-size:15px;font-weight:700;color:var(--ink)}
  .waconfirm .wcsub{font-size:12px;color:var(--gris2);margin:4px 0 12px}
  .waconfirm .wcb{display:flex;gap:10px}
  .waconfirm .wcb button{flex:1;font-family:inherit;font-size:14px;font-weight:700;border:0;border-radius:10px;padding:12px;cursor:pointer}
  .waconfirm .wcb .no{background:#EFF2F1;color:var(--gris)}
  .waconfirm .wcb .si{background:var(--wa);color:#fff}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
  .conf{position:absolute;width:9px;height:14px;opacity:.95;will-change:transform}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.6}}
  /* Ofertas y combos (destacada) */
  .ofertas{background:linear-gradient(160deg,#05423f,var(--teal-deep));border-radius:16px;padding:18px 20px;margin-bottom:26px;position:relative;overflow:hidden;box-shadow:0 10px 34px rgba(6,65,62,.22)}
  .ofertas::after{content:"";position:absolute;inset:0;border-radius:16px;padding:1.5px;
    background:linear-gradient(135deg,var(--gold),var(--aqua),var(--gold));opacity:.5;pointer-events:none;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .of-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;color:#eafcfa}
  .of-ttl{font-size:17px;font-weight:800}
  .of-sub{display:block;font-size:12px;color:#8fc9c4;margin-top:1px}
  .of-pts{margin-left:auto;background:rgba(229,169,59,.18);border:1px solid rgba(229,169,59,.4);color:#f2d38a;font-size:12px;font-weight:800;padding:6px 12px;border-radius:20px;white-space:nowrap}
  .of-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:12px}
  .of-card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:13px 14px;position:relative}
  .of-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .of-name{font-weight:700;font-size:14px;color:#fff;line-height:1.25}
  .of-off{background:var(--gold);color:#3a2c07;font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;white-space:nowrap}
  .of-prod{font-size:11.5px;color:#a9d8d3;margin:5px 0 0;line-height:1.35}
  .of-price{display:flex;align-items:baseline;gap:8px;margin:7px 0 3px}
  .of-old{color:#8fc9c4;text-decoration:line-through;font-size:12px}
  .of-new{color:#fff;font-weight:900;font-size:19px;letter-spacing:-.3px}
  .of-extra{font-size:11px;color:#a9d8d3;margin-bottom:9px;line-height:1.35}
  .of-price+.of-bar{margin-top:10px}
  .of-bar{height:7px;background:rgba(255,255,255,.12);border-radius:20px;overflow:hidden;margin-bottom:5px}
  .of-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--aqua),var(--teal-med));border-radius:20px;transition:width .6s}
  .of-foot{display:flex;justify-content:space-between;font-size:11.5px;color:#9fd0cb;align-items:center}
  .of-foot .p{color:#f2d38a;font-weight:800}
  .of-venc{display:inline-block;margin-top:9px;font-size:10.5px;color:#f2d38a;background:rgba(229,169,59,.14);border:1px solid rgba(229,169,59,.3);padding:2px 8px;border-radius:20px}
  .of-wa{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0 8px;background:var(--wa);color:#053b38;font-weight:700;font-size:12px;padding:6px 11px;border-radius:9px;text-decoration:none}
  @media(max-width:680px){ .cc{grid-template-columns:1fr auto} .cc .rec,.compbar{display:none} }

  /* ===== REDISEÑO 2026-07-23: KPIs compactas + salud + animaciones (paleta EyG) ===== */
  @keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
  @keyframes glow{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 24px rgba(95,200,191,.5),var(--shadow)}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .hero,.kpis,#ofertasBox,.secrow,.filters,#lista{animation:fadeup .5s cubic-bezier(.22,1,.36,1) both}
  .kpis{animation-delay:.05s}#ofertasBox{animation-delay:.1s}.secrow{animation-delay:.14s}.filters{animation-delay:.17s}#lista{animation-delay:.2s}
  .level{animation:glow 3.6s ease-in-out infinite}
  .level .lvn{display:inline-block;animation:floaty 3.6s ease-in-out infinite}
  .hchip{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 16px;box-shadow:var(--shadow);min-width:150px}
  .hchip .e{font-size:24px} .hchip .t{font-size:10.5px;color:var(--gris);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
  .hchip .n{font-size:16px;font-weight:800;line-height:1.15}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:22px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);cursor:pointer;overflow:hidden;transition:transform .14s,box-shadow .14s,border-color .14s}
  .kpi:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(6,65,62,.14);border-color:var(--teal-med)}
  .kpi.hl{background:linear-gradient(150deg,var(--teal),var(--teal-deep));color:#fff;border:0}
  .kpi.warn{border-color:var(--coral);box-shadow:0 0 0 1px var(--coral),var(--shadow)}
  .khead{display:flex;align-items:center;gap:12px;padding:15px 16px}
  .kic{font-size:23px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.14))}
  .kmeta{flex:1;min-width:0}
  .kl{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;opacity:.72;font-weight:700}
  .kv{font-size:23px;font-weight:900;line-height:1.15;letter-spacing:-.5px} .kv small{font-size:13px;font-weight:700;opacity:.82}
  .ks{font-size:11.5px;opacity:.82;margin-top:2px}
  .kchev{align-self:center;transition:transform .25s;opacity:.45;font-size:12px}
  .kpi.open .kchev{transform:rotate(180deg)}
  .acc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s ease}
  .kpi.open .acc{grid-template-rows:1fr}
  .acc>.accw{overflow:hidden}
  .accin{padding:2px 16px 16px;font-size:13px}
  .kpi.hl .accin,.kpi.hl .ks,.kpi.hl .kl{color:#eafaf8}
  .drow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px dashed var(--line)}
  .kpi.hl .drow{border-color:rgba(255,255,255,.2)}
  .drow.tot{border-top:2px solid var(--teal);font-weight:800;font-size:15px;margin-top:4px;padding-top:9px;color:var(--teal-deep)}

<script>
const RPC="https://yxotopoklgjowcudveoj.supabase.co/functions/v1/odoo-rpc";
// Deep-links a Odoo (abre el listado/documento exacto; el vendedor logueado ve solo lo suyo)
const ODOO="https://drogueriaeyg.odoo.com/web#";
const odoo=p=>ODOO+p;
function verOdoo(p){ window.open(odoo(p),"_blank"); }
const money=n=>"$"+Math.round(n||0).toLocaleString("es-AR");
const esc=s=>(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
async function rpc(model,method,args,kwargs={},intentos=3){
  let ultimo;
  for(let i=0;i<intentos;i++){
    try{
      const r=await fetch(RPC,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model,method,args,kwargs})});
      const j=await r.json();
      if(!j.ok){ ultimo=new Error(j.error||"Error Odoo"); if(i<intentos-1 && /http2|connection|SendRequest|timeout|EOF|reset/i.test(j.error||"")){ await new Promise(s=>setTimeout(s,500*(i+1))); continue; } throw ultimo; }
      return j.result;
    }catch(e){ ultimo=e; if(i<intentos-1){ await new Promise(s=>setTimeout(s,500*(i+1))); continue; } throw ultimo; }
  }
  throw ultimo;
}

// ===== Config / objetivos =====
const OBJ={diarioContactos:10, mensualNuevos:3, semanalFact:10000000}; // semanalFact = objetivo de VENTA NETA semanal (sin IVA, ya descontadas las notas de crédito)
// ===== Comisión: escalera marginal sobre FACTURADO NETO (base). El cobro NO es la base: es PREMIO → sube el nivel/multiplicador que agranda toda la comisión =====
// 3 SISTEMAS · escalera 2 tramos con corte en el OBJETIVO (baseline facturado ×1,2), MARGINAL:
//  🏥 Instituciones 2%/3% · 💊 Farmacias 2,5%/3,5% (× nivel) · 🔵 Externo (Samanta) 3%/4% @ $50M fijo, sin nivel.
const RATES={ inst:{base:.020,high:.030}, farm:{base:.025,high:.035} };
const EXTERNOS=["Samanta Luna"];
const esExterno=()=>EXTERNOS.includes(COMERCIAL);
const corteObjetivo=()=> esExterno()? 50e6 : (ST.base?.factBaseline||0)*1.2;   // meta = baseline +20% (marginal)
const comisionRates=()=> esExterno()? {base:.03,high:.04} : (RATES[ST.base?.perfil]||RATES.farm);
function ratesConSalud(){const r=comisionRates(),pen=(esExterno()?0:saludCuenta().penaltyPt)/100;return {base:Math.max(0,r.base-pen),high:Math.max(0,r.high-pen)};}
function comisionBase(fact){const c=corteObjetivo(),r=ratesConSalud();return fact<=c?fact*r.base:c*r.base+(fact-c)*r.high;}
function comisionDesglose(fact){const c=corteObjetivo(),r=ratesConSalud(),t=[];t.push({lo:0,hi:c,r:r.base,base:Math.min(fact,c),comi:Math.min(fact,c)*r.base});if(fact>c)t.push({lo:c,hi:Infinity,r:r.high,base:fact-c,comi:(fact-c)*r.high});return t;}
const NIV=[{n:"Bronce",e:"🥉",m:1.00},{n:"Plata",e:"🥈",m:1.05},{n:"Oro",e:"🥇",m:1.10},{n:"Platino",e:"💎",m:1.15},{n:"Diamante",e:"👑",m:1.20}];
const params=new URLSearchParams(location.search);
let COMERCIAL="";  // se define en el arranque según la cuenta logueada (o ?c= para líder/admin)
const REQ=[{k:"name",l:"Nombre"},{k:"tel",l:"Teléfono"},{k:"email",l:"Email"},{k:"street",l:"Dirección"},{k:"zip",l:"CP"},{k:"city",l:"Localidad"},{k:"state",l:"Provincia"},{k:"idtype",l:"Tipo doc"},{k:"vat",l:"Nº doc"},{k:"fiscal",l:"Cond. fiscal"}];
// Rubro (vive en category_id / etiquetas de Odoo). Mapa tag->valor canónico
const RUBROS=[{v:30,l:"Farmacia"},{v:32,l:"Sanatorio / Clínica"},{v:37,l:"Empresa de salud"},{v:33,l:"Institución / Mutual"},{v:34,l:"Distribuidora / Droguería"},{v:35,l:"Veterinaria"},{v:62,l:"SAMCO"}];
const RUBRO_MAP={28:30,29:30,30:30, 8:35,35:35, 7:34,34:34, 31:33,33:33,36:33, 20:32,32:32, 37:37, 62:62};
const IDT={cuit:4,dni:5,cuil:6};

// ===== Formateadores (estandarización) =====
const digits=s=>(s||"").replace(/\D/g,"");
function fmtDoc(raw,idtypeId){
  const d=digits(raw); if(!d) return "";
  if(idtypeId===IDT.dni){ if(d.length<7||d.length>8) return raw.trim(); return d.replace(/\B(?=(\d{3})+(?!\d))/g,"."); } // 00.000.000
  if(idtypeId===IDT.cuit||idtypeId===IDT.cuil){ if(d.length!==11) return raw.trim(); return d.slice(0,2)+"-"+d.slice(2,10)+"-"+d.slice(10); } // 00-00000000-0
  return raw.trim();
}
function fmtTel(raw){
  let d=digits(raw); if(!d) return "";
  if(d.startsWith("0054")) d=d.slice(4);
  if(d.startsWith("54")) d=d.slice(2);
  d=d.replace(/^0/,"");                              // área sin 0
  if(d.length>10) d=d.replace(/^(\d{2,4})15(\d{6,8})$/,"$1$2"); // celular sin 15 (solo si sobra largo)
  if(d.length<8) return raw.trim();
  let area,local;
  if(d.length===10){ if(d.startsWith("11")){area="11";local=d.slice(2);} else {area=d.slice(0,3);local=d.slice(3);} }
  else if(d.length===11){ area=d.slice(0,4);local=d.slice(4); }
  else return "+54 "+d;
  const ls = local.length>=8 ? local.slice(0,4)+"-"+local.slice(4) : local.slice(0,3)+"-"+local.slice(3);
  return "+54 "+area+" "+ls;
}
function oracion(s){ s=(s||"").trim().replace(/\s+/g," "); if(!s) return ""; return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase(); }
function waN(tel){let d=digits(tel);if(d.length<8)return"";if(d.startsWith("54"))d=d.slice(2);if(d.startsWith("9")&&d.length>=11)d=d.slice(1);d=d.replace(/^0/,"");if(d.length>10)d=d.replace(/^(\d{2,4})15(\d{6,8})$/,"$1$2");if(d.length>=10)return"549"+d;return"";}

// hoy AR
const now=new Date(); const pad=n=>String(n).padStart(2,"0");
const hoyStr=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const inicioMes=`${now.getFullYear()}-${pad(now.getMonth()+1)}-01`;
const hace=d=>{const x=new Date(now);x.setDate(x.getDate()-d);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`;};

// ===== Ofertas y combos =====
// El comercial ve TODO lo que está activo, venga de donde venga. Hay dos orígenes:
//
//   eyg.ofertas       ← "Oportunidades y Ofertas" (inventario/oportunidades.html).
//                       Son las que Inventario confirmó a mano, sea desde una oportunidad
//                       por costo, una por stock, o cargadas manualmente. Activa = vigente.
//                       {id, tipo:'oferta'|'combo', titulo, items:[{id,sku,nombre}],
//                        precio, precioAntes, stock, hasta, nota, creada}
//
//   eyg.sync_ofertas  ← "Configuración de precios" (comercial/config-precios.html).
//                       Nacen ya activas: son reglas de precio que el motor aplica solas.
//                       Activa = !pausada y vigente. Modelo distinto: apuntan a un
//                       product.template O a una categoría entera, y el descuento es
//                       RELATIVO (modo pct/monto/precio + valor), no un precio absoluto.
//                       {id, tipo:'p'|'c', target, targetName, modo, valor, reemplaza,
//                        stock, hasta, pausada}
//
// Las de sync se normalizan a la forma de eyg.ofertas (ver normalizarSync). Las que
// apuntan a una categoría no tienen precio único: quedan como tarjeta informativa
// (_info), sin precio ni barra de progreso, sólo el descuento y la vigencia.
const LISTA=3;              // pricelist de la que sale el precio base (misma que usa Oportunidades)
const OF_META_CLIENTES=5;   // meta de clientes por oferta (display de cada tarjeta)
// Puntaje de ofertas en el nivel (25 pts): actividad exigible (enviar) + resultado (vender, fuerte)
const OF_PTS_ENV=8,  OF_META_ENV=30;   // ofertas ENVIADAS este mes → 8 pts
const OF_PTS_VEN=17, OF_META_VEN=10;   // ofertas VENDIDAS este mes (cliente×oferta) → 17 pts (fuerte)
let OFERTAS=[], OFPIDS=[];   // OFPIDS = ids de variante de todas las ofertas vigentes

let ST={userId:null, contactos:[], catFiscal:[], catId:[], catProv:[], fact:{sem:0,mes:0,semPed:0,semNC:0,mesPed:0,mesNC:0}, cc:{porP:{},porCobrar:0,vencido:0,cobradoMes:0,aFacturar:0,aParcial:0,nDeud:0}, nuevos:0, contactadosHoy:new Set(), msgs:[], orders:{}, ofertas:{}, ofEnviadas:0, ofVendidas:0, userPartner:null, base:null, act:{ped:0,cli:0}, diag:{ventasHoy:0,pedHoy:0,pedSem:0,cliSem:0}, alFondo:new Set(), filtro:"pend", q:"", waMsgs:[]};
let WA_PICK=null, BELL_OPTS=null;

const PFIELDS=["id","name","company_type","is_company","street","street2","city","zip","state_id","phone","mobile","email","vat","l10n_ar_afip_responsibility_type_id","l10n_latam_identification_type_id","category_id","customer_rank"];

function completar(c){
  const has={name:!!c.name,tel:!!(c.phone||c.mobile),email:!!c.email,street:!!c.street,zip:!!c.zip,city:!!c.city,
    state:!!(c.state_id&&c.state_id[0]),idtype:!!(c.l10n_latam_identification_type_id&&c.l10n_latam_identification_type_id[0]),
    vat:!!c.vat,fiscal:!!(c.l10n_ar_afip_responsibility_type_id&&c.l10n_ar_afip_responsibility_type_id[0])};
  return {has, pct:Math.round(REQ.filter(r=>has[r.k]).length/REQ.length*100)};
}
const colorPct=p=>p>=100?'var(--ok)':p>=60?'var(--teal-med)':p>=30?'var(--warn)':'var(--bad)';
function rubroActual(c){ for(const t of (c.category_id||[])) if(RUBRO_MAP[t]) return RUBRO_MAP[t]; return ""; }
const diasDe=f=> f? Math.floor((now-new Date(f))/86400000):null;

async function cargar(){
  try{
    const u=await rpc("res.users","search_read",[[["name","=",COMERCIAL]]],{fields:["id","name","partner_id"],limit:1});
    if(!u.length) throw new Error("No encontré al comercial \""+COMERCIAL+"\".");
    ST.userId=u[0].id; ST.userPartner=u[0].partner_id&&u[0].partner_id[0]; document.getElementById("whoName").textContent=u[0].name;
    const [contactos,fiscal,idt,prov,nuevos] = await Promise.all([
      rpc("res.partner","search_read",[[["user_id","=",ST.userId]]],{fields:PFIELDS,limit:0}),
      rpc("l10n_ar.afip.responsibility.type","search_read",[[]],{fields:["id","name"]}),
      rpc("l10n_latam.identification.type","search_read",[[["active","=",true]]],{fields:["id","name"]}),
      rpc("res.country.state","search_read",[[["country_id.code","=","AR"]]],{fields:["id","name"],limit:0}),
      rpc("res.partner","search_count",[[["user_id","=",ST.userId],["create_date",">=",inicioMes]]])
    ]);
    ST.contactos=contactos; ST.catFiscal=fiscal; ST.catId=idt; ST.catProv=prov; ST.nuevos=nuevos;
    const ids=contactos.map(c=>c.id);
    // recencia/frecuencia + notas de hoy + cuentas corrientes (deuda) + cobrado del mes
    const [og,notas,ccLines,cobrado,aFact,facMes,facSem,ncMes,ncSem]=await Promise.all([
      rpc("sale.order","read_group",[[["partner_id","in",ids],["state","in",["sale","done"]]],["date_order:max","amount_total:sum"],["partner_id"]],{lazy:false}),
      // Mensajes de WhatsApp registrados (confirmados) de la SEMANA: [EyGWA] tipo/nuevo|seg. Incluye legacy [EyGCRM].
      rpc("mail.message","search_read",[[["model","=","res.partner"],["res_id","in",ids],["date",">=",hace(7)+" 00:00:00"],"|",["body","like","EyGWA"],["body","like","EyGCRM"]]],{fields:["res_id","date","body"],limit:0}),
      // CUENTA CORRIENTE = saldo REAL contable (líneas de cuentas por cobrar sin conciliar). Ya neteado de pagos a cuenta recibidos.
      rpc("account.move.line","search_read",[[["partner_id","in",ids],["account_id.account_type","=","asset_receivable"],["parent_state","=","posted"],["full_reconcile_id","=",false]]],{fields:["partner_id","amount_residual","date_maturity"],limit:0}),
      // cobrado del mes = pagos entrantes (posted) de la cartera → base de la comisión
      rpc("account.payment","read_group",[[["partner_id","in",ids],["payment_type","=","inbound"],["state","=","posted"],["date",">=",inicioMes]],["amount:sum"],[]],{lazy:false}),
      // SIN FACTURAR = "Importe a facturar" (sale.order.amount_to_invoice) de sus pedidos a facturar → coincide exacto con Odoo
      rpc("sale.order","read_group",[[["user_id","=",ST.userId],["state","in",["sale","done"]],["invoice_status","=","to invoice"]],["amount_to_invoice:sum"],[]],{lazy:false}),
      // VENTA = FACTURADO de la cartera (out_invoice neto). Atribuye por cliente, no por invoice_user_id (que a veces es la cuenta genérica)
      rpc("account.move","read_group",[[["partner_id","in",ids],["move_type","=","out_invoice"],["state","=","posted"],["invoice_date",">=",inicioMes]],["amount_untaxed:sum"],[]],{lazy:false}),
      rpc("account.move","read_group",[[["partner_id","in",ids],["move_type","=","out_invoice"],["state","=","posted"],["invoice_date",">=",hace(7)]],["amount_untaxed:sum"],[]],{lazy:false}),
      // NC de la cartera (se restan de la venta facturada)
      rpc("account.move","read_group",[[["partner_id","in",ids],["move_type","=","out_refund"],["state","=","posted"],["invoice_date",">=",inicioMes]],["amount_untaxed:sum"],[]],{lazy:false}),
      rpc("account.move","read_group",[[["partner_id","in",ids],["move_type","=","out_refund"],["state","=","posted"],["invoice_date",">=",hace(7)]],["amount_untaxed:sum"],[]],{lazy:false})
    ]);
    ST.orders={}; og.forEach(g=>{if(g.partner_id)ST.orders[g.partner_id[0]]={ultima:g.date_order,pedidos:g.__count,total:g.amount_total};});
    // Mensajes WA de la semana, parseados; contactados hoy = distintos con mensaje hoy
    ST.msgs=notas.map(n=>{const p=parseWA(n.body); return p?{res_id:n.res_id,date:(n.date||"").slice(0,10),tipo:p.tipo,ng:p.ng}:null;}).filter(Boolean);
    const _t=hoyStr.slice(0,10);
    ST.contactadosHoy=new Set(ST.msgs.filter(m=>m.date===_t).map(m=>m.res_id));
    // ---- VENTA = facturado neto (facturas − NC) de la cartera ----
    const facM=facMes[0]?.amount_untaxed||0, facS=facSem[0]?.amount_untaxed||0;
    const ncM=ncMes[0]?.amount_untaxed||0, ncS=ncSem[0]?.amount_untaxed||0;
    ST.fact={ mes:facM-ncM, sem:facS-ncS, mesFac:facM, mesNC:ncM, semFac:facS, semNC:ncS };
    // ---- Sin facturar = "Importe a facturar" de sus pedidos "a facturar" (coincide con Odoo) ----
    const afSin = aFact[0]?.amount_to_invoice||0;
    // ---- Cuentas corrientes ----
    const porP={};
    for(const l of ccLines){
      if(!l.partner_id) continue; const pid=l.partner_id[0];
      const res=l.amount_residual||0;
      const p=porP[pid]||(porP[pid]={deuda:0,vencido:0,venc:null});
      p.deuda+=res;
      if(l.date_maturity && l.date_maturity<hoyStr){ p.vencido+=res; if(res>0 && (!p.venc || l.date_maturity<p.venc)) p.venc=l.date_maturity; }
    }
    let porCobrar=0, vencido=0, nDeud=0;
    for(const pid in porP){ const d=porP[pid].deuda; if(d>1){porCobrar+=d; vencido+=Math.max(0,porP[pid].vencido); nDeud++;} }
    ST.cc={ porP, porCobrar, vencido, cobradoMes:cobrado[0]?.amount||0, aFacturar:afSin, nDeud };
    // ---- Baselines del NIVEL (dinámico, cualquier comercial): objetivo de cobro (prom 3m ×1,1), promedio de pedidos/clientes, perfil por ticket ----
    try{
      const [ordHist, cobro3, facHist]=await Promise.all([
        rpc("sale.order","search_read",[[["user_id","=",ST.userId],["state","in",["sale","done"]],["date_order",">=",hace(190)]]],{fields:["partner_id","date_order","amount_total"],limit:0}),
        rpc("account.payment","read_group",[[["partner_id","in",ids],["payment_type","=","inbound"],["state","=","posted"],["date",">=",hace(100)]],["amount:sum"],[]],{lazy:false}),
        rpc("account.move","search_read",[[["partner_id","in",ids],["move_type","in",["out_invoice","out_refund"]],["state","=","posted"],["invoice_date",">=",hace(190)]]],{fields:["invoice_date","amount_untaxed","move_type"],limit:0})
      ]);
      const bk={}; let sumTot=0;
      for(const o of ordHist){ const m=(o.date_order||"").slice(0,7); if(!m)continue; (bk[m]=bk[m]||{ped:0,cli:new Set(),tot:0}); bk[m].ped++; if(o.partner_id)bk[m].cli.add(o.partner_id[0]); bk[m].tot+=o.amount_total||0; sumTot+=o.amount_total||0; }
      const curM=inicioMes.slice(0,7);
      const prev=Object.keys(bk).filter(m=>m<curM), nP=prev.length||1;
      const promPed=Math.round(prev.reduce((s,m)=>s+bk[m].ped,0)/nP)||1;
      const promCli=Math.round(prev.reduce((s,m)=>s+bk[m].cli.size,0)/nP)||1;
      const avgTicket=ordHist.length?sumTot/ordHist.length:0;
      // baseline de FACTURADO neto (facturas − NC) por mes, promedio de meses previos completos → corte = ×1,2
      const fbk={}; for(const x of facHist){ const m=(x.invoice_date||"").slice(0,7); if(!m)continue; fbk[m]=(fbk[m]||0)+(x.move_type==="out_refund"?-1:1)*(x.amount_untaxed||0); }
      const fprev=Object.keys(fbk).filter(m=>m<curM), fnP=fprev.length||1;
      const factBaseline=fprev.reduce((s,m)=>s+fbk[m],0)/fnP;
      ST.base={ objetivoCobro:(cobro3[0]?.amount||0)/3*1.1, promPed, promCli, perfil: avgTicket>=300000?"inst":"farm", avgTicket, factBaseline };
      ST.act={ ped: bk[curM]?bk[curM].ped:0, cli: bk[curM]?bk[curM].cli.size:0 };
      // métricas HOY / SEMANA (derivadas de lo ya traído, sin fetch extra)
      const hoy10=hoyStr.slice(0,10), sem7=hace(7).slice(0,10);
      let pedHoy=0,pedSem=0; const cliSemS=new Set();
      for(const o of ordHist){ const dd=(o.date_order||"").slice(0,10); if(dd===hoy10)pedHoy++; if(dd>=sem7){pedSem++; if(o.partner_id)cliSemS.add(o.partner_id[0]);} }
      let ventasHoy=0; for(const x of facHist){ const dd=(x.invoice_date||"").slice(0,10); if(dd===hoy10)ventasHoy+=(x.move_type==="out_refund"?-1:1)*(x.amount_untaxed||0); }
      ST.diag={ ventasHoy, pedHoy, pedSem, cliSem:cliSemS.size };
    }catch(e){ ST.base=ST.base||{objetivoCobro:0,promPed:1,promCli:1,perfil:"farm"}; ST.act=ST.act||{ped:0,cli:0}; ST.diag=ST.diag||{ventasHoy:0,pedHoy:0,pedSem:0,cliSem:0}; }
    // Las ofertas se cargan ANTES de pintar: el nivel usa los combos colocados y, si el
    // conteo llegara después, el panel mostraría un nivel (y una comisión) más bajos.
    await cargarOfertas(ids);
    await cargarWA();
    render();
  }catch(e){ document.getElementById("app").innerHTML='<div class="errbox"><b>No pude cargar el panel.</b><br>'+esc(e.message)+'</div>'; }
}

// NIVELADOR POR RUBRO: reparte los 50 pts de "producción" según el perfil del vendedor (por ticket promedio),
// para no castigar a Instituciones (pocos pedidos grandes) ni sobrepremiar la actividad de Farmacias (muchos chicos).
const PERFIL={ inst:{valor:38,activ:12,nom:"Instituciones"}, farm:{valor:25,activ:25,nom:"Farmacias / Comercial"} };
// NIVEL = PURO PREMIO (total 100; Diamante 95): Cobro+Actividad=50 (split por perfil), Combos 25, Nuevos 20, Constancia 5.
// Fichas y Cartera-sana ya NO están acá: pasaron a la Salud de la cuenta (el freno). Ver saludCuenta().
function nivel(){
  const b=ST.base||{objetivoCobro:0,promPed:0,promCli:0,perfil:"farm"};
  const sp=PERFIL[b.perfil]||PERFIL.farm;
  const act=ST.act||{ped:0,cli:0};
  const P=[];
  const rValor=b.objetivoCobro>0?Math.min(ST.cc.cobradoMes/b.objetivoCobro,1):0;
  P.push({ic:"💰",lab:"Cobro vs objetivo de cobranza",max:sp.valor,pts:sp.valor*rValor,det:"cobraste "+money(ST.cc.cobradoMes)+" de "+money(b.objetivoCobro)+" · "+Math.round(rValor*100)+"%"});
  const rPed=b.promPed>0?Math.min(act.ped/b.promPed,1):0, rCli=b.promCli>0?Math.min(act.cli/b.promCli,1):0, rAct=(rPed+rCli)/2;
  P.push({ic:"📞",lab:"Actividad (pedidos y clientes)",max:sp.activ,pts:sp.activ*rAct,det:"este mes "+act.ped+" ped y "+act.cli+" cli · tu promedio "+b.promPed+" ped / "+b.promCli+" cli · "+Math.round(rAct*100)+"%"});
  // Ofertas: enviar (actividad exigible) + vender (resultado, fuerte)
  const env=ST.ofEnviadas||0, rEnv=Math.min(env/OF_META_ENV,1);
  P.push({ic:"📤",lab:"Ofertas enviadas",max:OF_PTS_ENV,pts:OF_PTS_ENV*rEnv,det:env+" de "+OF_META_ENV+" este mes"});
  const ven=ST.ofVendidas||0, rVen=Math.min(ven/OF_META_VEN,1);
  P.push({ic:"🎁",lab:"Ofertas vendidas",max:OF_PTS_VEN,pts:OF_PTS_VEN*rVen,det:ven+" de "+OF_META_VEN+" colocadas"});
  const rN=Math.min(ST.nuevos/3,1);
  P.push({ic:"🆕",lab:"Clientes nuevos (meta 3)",max:20,pts:20*rN,det:ST.nuevos+" este mes"});
  const rCo=Math.min(ST.contactadosHoy.size/10,1);
  P.push({ic:"🔥",lab:"Constancia (10 contactos/día)",max:5,pts:5*rCo,det:ST.contactadosHoy.size+" hoy"});
  const pts=P.reduce((s,p)=>s+p.pts,0);
  const idx=pts<40?0:pts<60?1:pts<80?2:pts<95?3:4; // Bronce<40 · Plata40 · Oro60 · Platino80 · Diamante95
  return {lv:idx+1, idx, pts, mult:NIV[idx].m, nombre:NIV[idx].n, emoji:NIV[idx].e, params:P, perfil:sp.nom, base:b};
}

// SALUD DE LA CUENTA (0-100) = el FRENO. Baja por: vencido de cartera (45), facturado bajo el piso (30), fichas (25).
// Recorta la tasa de comisión hasta 1 punto (proporcional a lo que baje la salud). Externo NO tiene salud.
function saludCuenta(){
  const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
  const total=ST.contactos.length||1;
  const fichas=ST.contactos.filter(c=>completar(c).pct>=100).length/total;
  const venc=ST.cc.porCobrar>0?ST.cc.vencido/ST.cc.porCobrar:0;
  const d=now.getDate(), dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const esperado=(ST.base?.factBaseline||0)*(d/dim); // piso prorrateado por día del mes
  const factRatio=esperado>0?ST.fact.mes/esperado:1;
  const pV=cl((venc-0.10)/0.40,0,1)*45;   // vencido: desde 10%, tope 50%
  const pF=cl((1-factRatio)/0.30,0,1)*30; // facturado < piso (prorrateado)
  const pO=cl((0.40-fichas)/0.40,0,1)*25; // fichas < 40%
  const salud=Math.max(0,100-pV-pF-pO);
  const penaltyPt=esExterno()?0:(100-salud)/100; // hasta 1 punto de tasa
  return {salud, penaltyPt, venc, fichas, factRatio,
    items:[{ic:"🩸",lab:"Vencido de cartera",pts:pV,max:45,det:money(ST.cc.vencido)+" vencido ("+Math.round(venc*100)+"% de lo por cobrar) · solo lo pasado de plazo"},
           {ic:"📉",lab:"Facturado vs tu piso",pts:pF,max:30,det:Math.round(factRatio*100)+"% del ritmo esperado"},
           {ic:"🗂️",lab:"Fichas completas",pts:pO,max:25,det:Math.round(fichas*100)+"% de la cartera"}]};
}

function lista(){
  const box=document.getElementById("lista"); if(!box) return;
  let arr=ST.contactos.map(c=>({c,comp:completar(c),o:ST.orders[c.id]}));
  if(ST.q){const q=ST.q.toLowerCase();arr=arr.filter(x=>x.c.name&&x.c.name.toLowerCase().includes(q));}
  if(ST.filtro==='hoyno') arr=arr.filter(x=>!ST.contactadosHoy.has(x.c.id));
  if(ST.filtro==='sintel') arr=arr.filter(x=>!(x.c.phone||x.c.mobile));
  if(ST.filtro==='deudavenc') arr=arr.filter(x=>(ST.cc.porP[x.c.id]?.vencido||0)>1);
  if(ST.filtro==='deudavenc') arr.sort((a,b)=>(ST.cc.porP[b.c.id]?.vencido||0)-(ST.cc.porP[a.c.id]?.vencido||0));
  else if(ST.filtro==='pend') arr.sort((a,b)=>a.comp.pct-b.comp.pct);
  else if(ST.filtro==='fria') arr.sort((a,b)=>(diasDe(b.o?.ultima)??1e9)-(diasDe(a.o?.ultima)??1e9)===0?0:((diasDe(b.o?.ultima)??1e9)-(diasDe(a.o?.ultima)??1e9)));
  else arr.sort((a,b)=>(a.c.name||"").localeCompare(b.c.name||""));
  if(ST.alFondo.size) arr=[...arr.filter(x=>!ST.alFondo.has(x.c.id)), ...arr.filter(x=>ST.alFondo.has(x.c.id))];
  if(!arr.length){box.innerHTML='<div class="empty">Sin contactos con ese filtro.</div>';return;}
  box.innerHTML=arr.slice(0,300).map(({c,comp,o})=>{
    const hoy=ST.contactadosHoy.has(c.id); const d=diasDe(o?.ultima); const enFondo=ST.alFondo.has(c.id);
    const sinTel=!(c.phone||c.mobile);
    const dd=ST.cc.porP[c.id]; const deuda=dd?Math.max(0,dd.deuda):0, dvenc=dd?Math.max(0,dd.vencido):0;
    const debtBadge = deuda>1 ? `<span class="debt ${dvenc>1?'v':''}">${dvenc>1?'Vencido ':'Debe '}${money(dvenc>1?dvenc:deuda)}</span>` : '';
    const rec = o ? `<div class="rec"><b>${d===0?'hoy':d+'d'}</b> sin comprar<div class="sub">${o.pedidos} ped · ${money(o.total)}</div></div>` : `<div class="rec"><span class="sub">sin compras</span></div>`;
    return `<div class="cc ${hoy?'hoy':''} ${sinTel?'st':''} ${enFondo?'alfondo':''}" onclick="abrir(${c.id})">
      <div><div class="nm">${esc(c.name||"(sin nombre)")}</div><div class="mt">${esc(c.city||"—")} · ${c.customer_rank>0?'cliente':'contacto'}${hoy?' · ✅ hoy':''}</div>${sinTel?'<span class="notel">📞 Falta teléfono</span>':''}${debtBadge}</div>
      ${rec}
      <div class="compbar"><div class="lab"><span>Ficha</span><span>${comp.pct}%</span></div><div class="track"><div class="fill" style="width:${comp.pct}%;background:${colorPct(comp.pct)}"></div></div></div>
      <div class="ccact">${hoy?'<span class="done-tag">Hoy ✓</span>':'<span class="go">Abrir →</span>'}<button class="fbtn" title="${enFondo?'Traer arriba':'Pasar al fondo y seguir'}" onclick="alFondo(event,${c.id})">${enFondo?'↑ subir':'⤓ al fondo'}</button></div>

const OF_DIAS_DEF=30;                       // ventana de conteo cuando la oferta no trae 'desde' ni 'creada'
const fFecha=s=>{const p=String(s||"").slice(0,10).split("-"); return p.length===3?p[2]+"/"+p[1]:"";};
const ofItems=o=>(o.items||[]).map(i=>i.nombre).filter(Boolean).join(" + ");
const ofDesc=o=>(o.precioAntes>0&&o.precioAntes>o.precio)?Math.round((1-o.precio/o.precioAntes)*100):0;
const ofMeta=o=>o.metaClientes>0?o.metaClientes:OF_META_CLIENTES;
const ofDesde=o=>String(o.desde||o.creada||hace(OF_DIAS_DEF)).slice(0,10);
// clientes DISTINTOS con al menos una oferta vigente colocada (es la unidad de la meta del nivel)
// puntos de la dimensión ofertas = enviar (actividad) + vender (resultado)
function ofPuntos(){ return Math.min((ST.ofEnviadas||0)/OF_META_ENV,1)*OF_PTS_ENV + Math.min((ST.ofVendidas||0)/OF_META_VEN,1)*OF_PTS_VEN; }

/* Texto para compartir por WhatsApp. Formato de WhatsApp: *negrita*, ~tachado~.
   Sale del mismo dato que se publicó, así el comercial no reescribe nada. */
function ofertaMsg(o){
  const items=ofItems(o), off=ofDesc(o), tit=o.titulo||items, L=[];
  L.push(o.tipo==="combo"?"🎁 *Combo Droguería EyG*":"🏷️ *Oferta Droguería EyG*");
  L.push("*"+tit+"*");
  if(items && items!==tit) L.push(items);   // si el título ES la lista de items, no la repite
  if(o._info){                              // sin precio único (categoría entera)
    if(o._alcance) L.push(o._alcance);
    if(o._off)     L.push("*"+o._off+"*");
  }else{
    L.push(o.precioAntes>o.precio
      ? "~"+money(o.precioAntes)+"~ → *"+money(o.precio)+"*"+(off?" (−"+off+"%)":"")
      : "*"+money(o.precio)+"*");
  }
  if(o.stock>0) L.push("📦 "+o.stock+" disponibles");
  if(o.nota)    L.push("📝 "+o.nota);
  if(o.hasta)   L.push("⏳ Válido hasta el "+fFecha(o.hasta));
  L.push("");
  L.push("¿Lo sumamos a tu próximo pedido?");
  return L.join("\n");
}

/* Texto del descuento de una oferta de Configuración de precios, que es relativo. */
function ofTxtSync(o){
  if(o.modo==="pct")   return "−"+(Math.round((o.valor||0)*1000)/10)+"%";
  if(o.modo==="monto") return "−"+money(o.valor)+" c/u";
  return "Precio "+money(o.valor);
}

/* Pasa las ofertas de Configuración de precios (eyg.sync_ofertas) a la forma de
   eyg.ofertas, para que el resto del bloque no tenga que saber de dónde vienen.
   - tipo 'p' (un producto): resuelve la variante y trae el precio de la lista TAL CUAL
     (ya viene con la oferta aplicada por el motor). Si no hay precio, cae a informativa.
   - tipo 'c' (categoría entera): no hay precio único ni producto que contar →
     tarjeta informativa (_info): descuento y vigencia, sin barra de progreso. */
async function normalizarSync(sync){
  const tmpls=[...new Set(sync.filter(o=>o.tipo==="p"&&o.target).map(o=>o.target))];
  const variante={}, base={};
  if(tmpls.length){
    const [tps,pit]=await Promise.all([
      rpc("product.template","read",[tmpls,["product_variant_id"]],{context:{lang:"es_AR"}}).catch(()=>[]),
      rpc("product.pricelist.item","search_read",
        [[["pricelist_id","=",LISTA],["applied_on","=","1_product"],["product_tmpl_id","in",tmpls]]],
        {fields:["product_tmpl_id","min_quantity","fixed_price"],limit:20000}).catch(()=>[])
    ]);
    for(const t of tps) if(t.product_variant_id) variante[t.id]=t.product_variant_id[0];
    // precio base = el tramo de la escalera con menor cantidad mínima
    for(const it of pit){ const t=it.product_tmpl_id[0];
      if(!base[t]||it.min_quantity<base[t].q) base[t]={q:it.min_quantity,p:it.fixed_price}; }
  }
  return sync.map(o=>{
    // fecha de creación: el id de sync es "of<timestamp ms>" → así el conteo cuenta
    // clientes DESDE que se publicó la oferta, no de los últimos 30 días.
    const mts=/^of(\d{13})$/.exec(o.id||""); const creada=mts?new Date(+mts[1]).toISOString().slice(0,10):"";
    const com={ id:"sync:"+o.id, tipo:"oferta", titulo:o.targetName||("#"+o.target),
      stock:o.stock||0, hasta:o.hasta||"", nota:"", creada, _off:ofTxtSync(o) };
    if(o.tipo!=="p") return {...com, items:[], precio:0, precioAntes:0, _info:true,
      _alcance:"📂 Descuento en toda la línea"};
    const pv=variante[o.target], precio=base[o.target]?base[o.target].p:0;
    if(!(precio>0) || !pv) return {...com, items:[], precio:0, precioAntes:0, _info:true,
      _alcance:"🔖 Descuento sobre el precio de lista"};
    // OJO: el precio de la lista YA VIENE CON LA OFERTA APLICADA. Al guardar en
    // Configuracion de precios se corre la accion 1213 (el motor), que reescribe la
    // escalera con el descuento adentro. Asi que el precio se trae tal cual, sin tocar:
    // volver a aplicarle el descuento lo dejaba al cuadrado (un -20% daba -36%).
    // El "antes" es lo unico que se calcula, revirtiendo el descuento.
    const v=o.valor||0;
    const antes = o.modo==="pct"   ? (v>0&&v<1 ? precio/(1-v) : 0)
                : o.modo==="monto" ? (v>0 ? precio+v : 0)
                :                    0;   // precio fijo: no hay "antes" que reconstruir
    return {...com, items:[{id:pv, nombre:o.targetName||("#"+o.target)}],
      precio, precioAntes: antes>precio ? antes : 0};
  });
}

/* Trae TODO lo activo —lo confirmado en Oportunidades y lo creado en Configuración de
   precios— y, para lo que apunta a productos concretos, cuenta contra Odoo a qué
   clientes de esta cartera se les colocó dentro de la vigencia. */
async function cargarOfertas(ids){
  try{
    const [rawOf,rawSync]=await Promise.all([
      rpc("ir.config_parameter","get_param",["eyg.ofertas"]).catch(()=>"[]"),
      rpc("ir.config_parameter","get_param",["eyg.sync_ofertas"]).catch(()=>"[]")
    ]);
    const propias=(JSON.parse(rawOf||"[]")||[]).filter(o=>o && o.id && (!o.hasta || o.hasta>=hoyStr));
    // productos (variantes) ya cubiertos por una oferta confirmada, para no duplicar
    const propiaPids=new Set(propias.flatMap(o=>(o.items||[]).map(i=>i.id)));
    // las de sync nacen activas: alcanza con que no estén pausadas y sigan vigentes.
    // Al confirmar una oportunidad se crea la oferta (eyg.ofertas) Y su regla de precio
    // (eyg.sync_ofertas con id "opo_<variante>"): son la MISMA oferta. Se descartan acá
    // para que no aparezca dos veces la misma tarjeta.
    let sync=(JSON.parse(rawSync||"[]")||[]).filter(o=>o && o.id && !o.pausada && (!o.hasta || o.hasta>=hoyStr))
      .filter(o=>{ const m=/^opo_(\d+)$/.exec(o.id||""); return !(m && propiaPids.has(+m[1])); });
    let syncNorm = sync.length?await normalizarSync(sync):[];
    // por si quedara algún producto ya cubierto por una oferta propia, se saca también
    syncNorm = syncNorm.filter(o=>{ const pv=(o.items||[])[0]&&o.items[0].id; return !(pv && propiaPids.has(pv)); });
    OFERTAS=propias.concat(syncNorm);
  }catch(e){ OFERTAS=[]; return; }
  await Promise.all(OFERTAS.map(async o=>{
    const pids=(o.items||[]).map(i=>i.id).filter(Boolean);
    if(!pids.length || !ids.length){ ST.ofertas[o.id]={colocados:0,cli:[]}; return; }
    const desde=ofDesde(o), hasta=(o.hasta||hoyStr).slice(0,10);
    try{
      const g=await rpc("sale.order.line","read_group",
        [[["order_partner_id","in",ids],["product_id","in",pids],["state","in",["sale","done"]],
          ["order_id.date_order",">=",desde+" 00:00:00"],["order_id.date_order","<=",hasta+" 23:59:59"]],
         ["price_subtotal:sum"],["order_partner_id"]],{lazy:false});
      ST.ofertas[o.id]={ colocados:g.length,
        cli:g.map(x=>x.order_partner_id&&x.order_partner_id[0]).filter(Boolean),
        monto:g.reduce((s,x)=>s+(x.price_subtotal||0),0) };
    }catch(e){ ST.ofertas[o.id]={colocados:0,cli:[],err:true}; }
  }));
  // ---- Para el puntaje: ofertas VENDIDAS y ENVIADAS este mes ----
  OFPIDS=[...new Set(OFERTAS.flatMap(o=>(o.items||[]).map(i=>i.id)).filter(Boolean))];
  try{
    if(OFPIDS.length && ids.length){
      const g=await rpc("sale.order.line","read_group",
        [[["order_partner_id","in",ids],["product_id","in",OFPIDS],["state","in",["sale","done"]],["order_id.date_order",">=",inicioMes+" 00:00:00"]],
         ["price_subtotal:sum"],["order_partner_id","product_id"]],{lazy:false});
      ST.ofVendidas=g.length;   // colocaciones (cliente × oferta) del mes
    } else ST.ofVendidas=0;
  }catch(e){ ST.ofVendidas=0; }
  try{
    if(ST.userPartner) ST.ofEnviadas=await rpc("mail.message","search_count",[[["model","=","res.partner"],["res_id","=",ST.userPartner],["date",">=",inicioMes+" 00:00:00"],["body","like","EyGOFENV"]]]);
  }catch(e){ ST.ofEnviadas=0; }
}

function nuevo(){ abrirForm({id:null,company_type:"person",category_id:[]}, true); }
function abrir(id){ const c=ST.contactos.find(x=>x.id===id); if(c) abrirForm(c,false); }

function abrirForm(c,isNew){
  EDIT={id:c.id, isNew};
  const comp=completar(c); const tipo=c.is_company?'company':(c.company_type||'person');
  const optSel=(cat,sel,ph)=>`<option value="">${ph||'— elegir —'}</option>`+cat.map(o=>`<option value="${o.id}" ${sel&&(Array.isArray(sel)?sel[0]===o.id:sel===o.id)?'selected':''}>${esc(o.name)}</option>`).join("");
  const rubroSel=rubroActual(c);
  const rubroOpts=`<option value="">— elegir rubro —</option>`+RUBROS.map(r=>`<option value="${r.v}" ${rubroSel===r.v?'selected':''}>${esc(r.l)}</option>`).join("");
  const d=document.getElementById("drawer");
  const intelHTML = isNew ? '' : `
    <div class="intel"><h4>Actividad comercial</h4>
      <div class="istat" id="intelStats"><div class="b"><div class="v">…</div><div class="l">cargando</div></div><div class="b"><div class="v">…</div><div class="l"></div></div><div class="b"><div class="v">…</div><div class="l"></div></div></div>
      <div id="intelProds"></div>
      ${ccBlock(c)}
      ${(c.phone||c.mobile)?`<a class="wa-contact" href="https://api.whatsapp.com/send?phone=${waN(c.phone||c.mobile)}&text=${encodeURIComponent(msgPred(c))}" target="_blank" onclick="confirmarEnvio(${c.id},'contacto')"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.5 15.3L2 22l4.8-1.5A10 10 0 1 0 12 2z"/></svg>Contactar por WhatsApp</a>`:`<div class="wa-contact" data-off>Sin teléfono — cargalo abajo para poder contactar</div>`}
    </div>`;
  d.innerHTML=`
    <div class="dhead"><span class="x" onclick="cerrar()">✕</span>
      <h3>${isNew?'Nuevo contacto':esc(c.name||"")}</h3>
      <div class="cbar"><div class="f" style="width:${isNew?0:comp.pct}%"></div></div>
      <div class="cpct">${isNew?'Completá los datos del nuevo contacto':'Ficha '+comp.pct+'% · completá lo que falta mientras lo contactás'}</div>
    </div>
    <div class="dbody">
      ${intelHTML}
      <div class="form"><h4>${isNew?'Datos del contacto':'Completar / corregir ficha'}</h4>
        <div class="fld"><label>Tipo</label><select id="f_type" onchange="onTipo()">
          <option value="person" ${tipo!=='company'?'selected':''}>Persona</option><option value="company" ${tipo==='company'?'selected':''}>Empresa</option></select></div>
        <div class="fld"><label id="lbl_name">${tipo==='company'?'Razón social':'Apellido y nombre'} ${comp.has.name||isNew?'':'<span class="miss">falta</span>'}</label>
          <input id="f_name" value="${esc(c.name||'')}" oninput="prevName()" placeholder="${tipo==='company'?'Ej: Farmacia del Sol S.R.L.':'Ej: Pérez, Juan'}">
          <div class="hint" id="hint_name">${tipo==='company'?'Nombre tipo oración + sufijo (SRL, SAS…)':'Formato: Apellido, Nombre. Si tiene comercio: Pérez, Juan (Farmacia Pérez)'}</div></div>
        <div class="fld"><label>Rubro</label><select id="f_rubro">${rubroOpts}</select><div class="hint">Farmacia, sanatorio, veterinaria, etc.</div></div>
        <div class="fld"><label>Teléfono ${comp.has.tel||isNew?'':'<span class="miss">falta</span>'}</label>
          <input id="f_phone" value="${esc(c.phone||c.mobile||'')}" oninput="prevTel()" placeholder="0341 155033943">
          <div class="hint">Área sin 0, celular sin 15. Se guarda formateado.</div><div class="prev" id="prev_phone"></div></div>
        <div class="fld"><label>Email ${comp.has.email||isNew?'':'<span class="miss">falta</span>'}</label><input id="f_email" value="${esc(c.email||'')}" placeholder="nombre@dominio.com"></div>
        <div class="fld"><label>Dirección ${comp.has.street||isNew?'':'<span class="miss">falta</span>'}</label><input id="f_street" value="${esc(c.street||'')}" placeholder="San martín 1234"><div class="hint">Se guarda tipo oración.</div></div>
        <div class="grid2">
          <div class="fld"><label>Código postal ${comp.has.zip||isNew?'':'<span class="miss">falta</span>'}</label><input id="f_zip" value="${esc(c.zip||'')}" placeholder="2000"></div>
          <div class="fld"><label>Localidad ${comp.has.city||isNew?'':'<span class="miss">falta</span>'}</label><input id="f_city" value="${esc(c.city||'')}" placeholder="Rosario"></div>
        </div>
        <div class="fld"><label>Provincia ${comp.has.state||isNew?'':'<span class="miss">falta</span>'}</label><select id="f_state">${optSel(ST.catProv,c.state_id,'— provincia —')}</select></div>
        <div class="grid2">
          <div class="fld"><label>Tipo de documento ${comp.has.idtype||isNew?'':'<span class="miss">falta</span>'}</label><select id="f_idtype" onchange="prevDoc()">${optSel(ST.catId,c.l10n_latam_identification_type_id,'— tipo —')}</select></div>
          <div class="fld"><label>Número ${comp.has.vat||isNew?'':'<span class="miss">falta</span>'}</label><input id="f_vat" value="${esc(c.vat||'')}" oninput="prevDoc()" placeholder="20-12345678-9"><div class="prev" id="prev_doc"></div></div>
        </div>
        <div class="fld"><label>Condición fiscal (AFIP) ${comp.has.fiscal||isNew?'':'<span class="miss">falta</span>'}</label><select id="f_fiscal">${optSel(ST.catFiscal,c.l10n_ar_afip_responsibility_type_id,'— condición —')}</select></div>
      </div>
    </div>
    <div class="dfoot"><button class="btn save" id="btnSave" onclick="guardar()">${isNew?'Crear contacto':'Guardar ficha'}</button></div>`;
  d.classList.add("on"); document.getElementById("scrim").classList.add("on");
  prevTel(); prevDoc();
  if(!isNew) cargarIntel(c.id);
}
async function cargarIntel(id){
  try{
    const [g,prods]=await Promise.all([
      rpc("sale.order","read_group",[[["partner_id","=",id],["state","in",["sale","done"]]],["date_order:max","amount_total:sum"],[]],{lazy:false}),
      rpc("sale.order.line","read_group",[[["order_partner_id","=",id],["state","in",["sale","done"]]],["product_uom_qty:sum","price_subtotal:sum"],["product_id"]],{lazy:false,orderby:"price_subtotal desc",limit:6})
    ]);
    const s=g[0]||{}; const dias=diasDe(s.date_order); const ped=s.__count||0;
    const el=document.getElementById("intelStats"); if(!el) return;
    el.innerHTML=`<div class="b"><div class="v">${dias==null?'—':(dias===0?'hoy':dias+'d')}</div><div class="l">sin comprar</div></div>
      <div class="b"><div class="v">${ped}</div><div class="l">pedidos</div></div>
      <div class="b"><div class="v">${money(s.amount_total||0)}</div><div class="l">comprado</div></div>`;
    const pb=document.getElementById("intelProds");
    if(pb){ pb.innerHTML = prods.length?('<h4 style="margin-top:6px">Lo que más compra</h4>'+prods.map(p=>`<div class="prod"><span>${esc(p.product_id?p.product_id[1]:'?')}</span><span class="pq">${money(p.price_subtotal)}</span></div>`).join('')):''; }
  }catch(e){ const el=document.getElementById("intelStats"); if(el)el.innerHTML='<div class="b"><div class="l">sin datos de compra</div></div>'; }
}
function ccBlock(c){
  const dd=ST.cc.porP[c.id]; const deuda=dd?Math.max(0,dd.deuda):0; if(deuda<=1) return '';
  const dv=dd?Math.max(0,dd.vencido):0; const dias=dd&&dd.venc?diasDe(dd.venc):null;
  const wa=waN(c.phone||c.mobile);
  return `<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
    <h4>Cuenta corriente</h4>
    <div class="istat">
      <div class="b"><div class="v">${money(deuda)}</div><div class="l">debe</div></div>
      <div class="b"><div class="v" style="color:${dv>1?'#A5312E':'inherit'}">${money(dv)}</div><div class="l">vencido</div></div>
      <div class="b"><div class="v">${dias==null?'—':(dias>0?dias+'d':'al día')}</div><div class="l">mora</div></div>
    </div>
    ${wa?`<a class="wa-contact" style="background:var(--warn)" href="https://api.whatsapp.com/send?phone=${wa}&text=${encodeURIComponent(msgCobro(c,deuda))}" target="_blank" onclick="confirmarEnvio(${c.id},'cobranza')">💰 Recordar pago por WhatsApp</a>`:''}
    <div style="text-align:right;margin-top:8px"><a href="${odoo('id='+c.id+'&model=res.partner&view_type=form')}" target="_blank" style="font-size:12px;font-weight:700;color:var(--teal);text-decoration:none">Ver cuenta corriente en Odoo ↗</a></div>
  </div>`;
}
function msgCobro(c,deuda){ return "Hola! Te escribimos de Droguería EyG 👋 Queríamos recordarte que figura un saldo pendiente de "+money(deuda)+" en tu cuenta corriente. ¿Coordinamos el pago? ¡Gracias!"; }
function msgPred(c){ const o=ST.orders[c.id]; const dias=o?diasDe(o.ultima):null;
  if(dias!=null&&dias>45) return "Hola! Te escribimos de Droguería EyG 👋 Hace un tiempo que no hacés pedido, ¿te ayudamos con la reposición? Tenemos las ofertas de la semana.";
  return "Hola! Te escribimos de Droguería EyG 👋 ¿Armamos tu próximo pedido? Cualquier cosa que necesites, escribinos.";
}
function onTipo(){const t=document.getElementById("f_type").value;
  document.getElementById("lbl_name").innerHTML=(t==='company'?'Razón social':'Apellido y nombre');
  document.getElementById("hint_name").textContent=(t==='company'?'Nombre tipo oración + sufijo (SRL, SAS…)':'Formato: Apellido, Nombre. Si tiene comercio: Pérez, Juan (Farmacia Pérez)');
  document.getElementById("f_name").placeholder=(t==='company'?'Ej: Farmacia del Sol S.R.L.':'Ej: Pérez, Juan');}
function prevName(){}
function prevTel(){const v=document.getElementById("f_phone").value;const el=document.getElementById("prev_phone");if(el)el.textContent=v?('Se guardará: '+fmtTel(v)):'';}
function prevDoc(){const t=parseInt(document.getElementById("f_idtype").value||0,10);const v=document.getElementById("f_vat").value;const el=document.getElementById("prev_doc");if(el)el.textContent=v?('→ '+fmtDoc(v,t)):'';}
function cerrar(){document.getElementById("drawer").classList.remove("on");document.getElementById("scrim").classList.remove("on");EDIT=null;}
document.addEventListener("keydown",e=>{if(e.key==="Escape")cerrar();});

async function guardar(){
  if(!EDIT) return; const btn=document.getElementById("btnSave"); btn.disabled=true; btn.textContent="Guardando…";
  const val=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
  const num=id=>{const x=val(id);return x?parseInt(x,10):false;};
  const idtype=num("f_idtype");
  const vals={
    company_type:val("f_type"), name:val("f_name"),
    phone: val("f_phone")?fmtTel(val("f_phone")):false, mobile:false,
    email: val("f_email")||false, street: val("f_street")?oracion(val("f_street")):false,
    zip: val("f_zip")||false, city: val("f_city")?oracion(val("f_city")):false,
    state_id: num("f_state"), l10n_latam_identification_type_id: idtype,
    vat: val("f_vat")?fmtDoc(val("f_vat"),idtype):false,
    l10n_ar_afip_responsibility_type_id: num("f_fiscal")
  };
  const rubro=num("f_rubro");
  if(rubro) vals.category_id=[[4,rubro]];
  if(!vals.name){ btn.disabled=false; btn.textContent=EDIT.isNew?"Crear contacto":"Guardar ficha"; toast("⚠️ Falta el nombre"); return; }
  try{
    let id=EDIT.id;
    if(EDIT.isNew){ vals.user_id=ST.userId; id=await rpc("res.partner","create",[vals]); ST.nuevos++; }
    else { await rpc("res.partner","write",[[id],vals]); }
    const fresh=(await rpc("res.partner","read",[[id]],{fields:PFIELDS}))[0];
    const i=ST.contactos.findIndex(x=>x.id===id);
    if(i>=0) ST.contactos[i]=fresh; else ST.contactos.push(fresh);
    const pct=completar(fresh).pct;
    cerrar();
    if(EDIT&&EDIT.isNew){ toast("🎉 ¡Nuevo contacto creado! +1 nuevo",true); confetti(); }
    else { toast(pct>=100?"🎉 ¡Ficha completa! ✨":"Ficha guardada ✓", pct>=100); if(pct>=100) confetti(); }
    render();
  }catch(e){ btn.disabled=false; btn.textContent=EDIT&&EDIT.isNew?"Crear contacto":"Guardar ficha"; toast("⚠️ No se pudo guardar: "+e.message); }
}

/* Lee un mensaje WA del cuerpo de la nota. Nuevo formato: "[EyGWA] tipo/nuevo|seg · por X".
   Legacy "[EyGCRM] Contacto trabajado" → contacto/seg (sin distinción nuevo). */
function parseWA(body){ const b=(body||"").replace(/<[^>]+>/g,""); const m=b.match(/\[EyGWA\]\s*(\w+)\/(\w+)/); if(m) return {tipo:m[1],ng:m[2]}; if(/EyGCRM/.test(b)) return {tipo:"contacto",ng:"seg"}; return null; }

/* Al tocar "Contactar por WhatsApp" se ABRE el chat (href) y aparece esta confirmación:
   el contacto NO cuenta hasta que el comercial confirma que envió. Así un clic solo no infla. */
function confirmarEnvio(id, tipo){
  const c=ST.contactos.find(x=>x.id===id); const nom=c?(c.name||"este contacto"):"este contacto";
  let el=document.getElementById("waconfirm");
  if(!el){ el=document.createElement("div"); el.id="waconfirm"; el.className="waconfirm"; document.body.appendChild(el); }
  el.innerHTML=`<div class="wcbox"><div class="wct">📤 ¿Enviaste el mensaje a <b>${esc(nom)}</b>?</div>
    <div class="wcsub">Solo se cuenta como contacto trabajado si confirmás el envío.</div>
    <div class="wcb"><button class="no" onclick="cerrarWAConfirm()">No, no envié</button><button class="si" onclick="registrarEnvio(${id},'${tipo}')">Sí, envié ✓</button></div></div>`;
  requestAnimationFrame(()=>el.classList.add("on"));
}
function cerrarWAConfirm(){ const el=document.getElementById("waconfirm"); if(el) el.classList.remove("on"); }
async function registrarEnvio(id, tipo){
  cerrarWAConfirm();
  // nuevo vs seguimiento: ¿ya le habíamos mandado un WA antes?
  let ng="nuevo";
  try{ const prev=await rpc("mail.message","search_count",[[["model","=","res.partner"],["res_id","=",id],["body","like","EyGWA"]]]); if(prev>0) ng="seg"; }catch(e){}
  try{ await rpc("res.partner","message_post",[[id]],{body:"📤 [EyGWA] "+tipo+"/"+ng+" · por "+COMERCIAL, message_type:"comment"}); }catch(e){}
  const t=hoyStr.slice(0,10); ST.msgs.push({res_id:id, date:t, tipo, ng});
  const eraContacto=ST.contactadosHoy.has(id); ST.contactadosHoy.add(id); const n=ST.contactadosHoy.size;
  if(!eraContacto && n===OBJ.diarioContactos){ toast("🏆 ¡Meta diaria cumplida! "+OBJ.diarioContactos+" contactos 🎉",true); confetti(); }
  else toast("Mensaje registrado ✓ ("+(ng==="nuevo"?"nuevo contacto":"seguimiento")+")", true);
  render();
}

/* Al compartir una OFERTA (botón de la tarjeta): abre WhatsApp y pide confirmar.
   Sólo cuenta como "enviada" si el comercial confirma. Se registra en su propio
   partner con el marcador [EyGOFENV] para contarlas por mes (puntaje). */
function confirmarCompartir(ofId){
  const o=OFERTAS.find(x=>x.id===ofId); const tit=o?(o.titulo||ofItems(o)||"la oferta"):"la oferta";
  let el=document.getElementById("waconfirm");
  if(!el){ el=document.createElement("div"); el.id="waconfirm"; el.className="waconfirm"; document.body.appendChild(el); }
  el.innerHTML=`<div class="wcbox"><div class="wct">📤 ¿Compartiste <b>${esc(tit)}</b>?</div>
    <div class="wcsub">Solo se cuenta como oferta enviada si confirmás.</div>
    <div class="wcb"><button class="no" onclick="cerrarWAConfirm()">No</button><button class="si" onclick="registrarEnvioOferta('${(ofId||'').replace(/'/g,'')}')">Sí, la compartí ✓</button></div></div>`;
  requestAnimationFrame(()=>el.classList.add("on"));
}
async function registrarEnvioOferta(ofId){
  cerrarWAConfirm();
  const o=OFERTAS.find(x=>x.id===ofId); const tit=o?(o.titulo||ofItems(o)||"oferta"):"oferta";
  if(!ST.userPartner){ toast("No pude registrar el envío"); return; }
  try{ await rpc("res.partner","message_post",[[ST.userPartner]],{body:"📤 [EyGOFENV] "+COMERCIAL+" · "+tit, message_type:"comment"}); }catch(e){}
  ST.ofEnviadas=(ST.ofEnviadas||0)+1;
  const meta=OF_META_ENV;
  if(ST.ofEnviadas===meta){ toast("🏆 ¡Meta de ofertas enviadas! "+meta+" este mes 🎉",true); confetti(); }
  else toast("Oferta enviada ✓ ("+ST.ofEnviadas+"/"+meta+" este mes)", true);
  render();
}

function abrirWAenvio(msgId){ const m=(ST.waMsgs||[]).find(x=>x.id===msgId); if(!m) return; WA_PICK={msgId, q:""}; pintarWAModal(); }
function cerrarWAModal(){ WA_PICK=null; const el=document.getElementById("waModal"); if(el) el.innerHTML=""; }
function waPickBuscar(v){ if(WA_PICK){ WA_PICK.q=v; pintarWAModal(true); } }

  const el=document.getElementById("waModal"); if(!el||!WA_PICK) return;

  lista.sort((a,b)=>{ const pa=!!(a.phone||a.mobile), pb=!!(b.phone||b.mobile); if(pa!==pb) return pa?-1:1; return (a.name||"").localeCompare(b.name||""); });
  lista=lista.slice(0,60);
  const row=c=>{ const tel=waN(c.phone||c.mobile), ya=yaSet.has(c.id);
    return `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid #f0f3f2">

      ${tel?`<a href="https://api.whatsapp.com/send?phone=${tel}&text=${encodeURIComponent(m.waTexto||"")}" target="_blank" rel="noopener" onclick="confirmarEnvioCampana(${c.id},'${m.id}')" style="background:#25A366;color:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;text-decoration:none;white-space:nowrap">${ya?'Reenviar':'Enviar'}</a>`:`<span style="color:#c0c8c6;font-size:12px">—</span>`}

  el.innerHTML=`<div onclick="if(event.target===this)cerrarWAModal()" style="position:fixed;inset:0;background:rgba(14,31,29,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px">

      <div style="padding:14px 18px;border-bottom:1px solid #eef1f0">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font-size:16px">📱 ${esc(m.titulo||"Mensaje")}</b><span onclick="cerrarWAModal()" style="cursor:pointer;color:#8A9A97;font-size:18px">✕</span></div>
        <div style="font-size:12px;color:#5F716E;margin-top:6px;background:#f6faf9;border:1px solid #e8efee;border-radius:8px;padding:7px 9px;white-space:pre-wrap;max-height:96px;overflow:auto">${esc(m.waTexto||"")}</div>
        <div style="font-size:11.5px;color:#8A9A97;margin-top:6px">Elegí el cliente: se abre WhatsApp con el mensaje listo. Confirmá el envío para que cuente.</div>
      </div>
      <div style="padding:10px 14px 0"><input id="wapq" placeholder="Buscar cliente…" value="${esc(WA_PICK.q||"")}" oninput="waPickBuscar(this.value)" style="width:100%;padding:9px 12px;border:1px solid #e5eae9;border-radius:9px;font-size:14px;font-family:inherit"></div>
      <div style="padding:4px 14px 14px;overflow:auto">${lista.length?lista.map(row).join(""):'<div style="padding:20px;text-align:center;color:#8A9A97">Sin clientes que coincidan.</div>'}</div>
    </div></div>`;
  if(keepFocus){ const i=document.getElementById("wapq"); if(i){ i.focus(); try{ i.setSelectionRange(i.value.length,i.value.length); }catch(e){} } }
}
function confirmarEnvioCampana(id, msgId){
  const c=ST.contactos.find(x=>x.id===id); const nom=c?(c.name||"este cliente"):"este cliente";
  let el=document.getElementById("waconfirm");
  if(!el){ el=document.createElement("div"); el.id="waconfirm"; el.className="waconfirm"; document.body.appendChild(el); }
  el.innerHTML=`<div class="wcbox"><div class="wct">📤 ¿Enviaste el mensaje a <b>${esc(nom)}</b>?</div>
    <div class="wcsub">Solo se cuenta como contacto si confirmás el envío.</div>
    <div class="wcb"><button class="no" onclick="cerrarWAConfirm()">No</button><button class="si" onclick="registrarEnvioCampana(${id},'${msgId}')">Sí, envié ✓</button></div></div>`;
  requestAnimationFrame(()=>el.classList.add("on"));
}
async function registrarEnvioCampana(id, msgId){
  cerrarWAConfirm();
  try{ await rpc("res.partner","message_post",[[id]],{body:"📤 "+EYG.waMarker(msgId)+" · por "+COMERCIAL, message_type:"comment"}); }catch(e){}
  const t=hoyStr.slice(0,10); ST.msgs.push({res_id:id, date:t, tipo:"campana", ng:msgId});
  const era=ST.contactadosHoy.has(id); ST.contactadosHoy.add(id); const n=ST.contactadosHoy.size;
  if(!era && n===OBJ.diarioContactos){ toast("🏆 ¡Meta diaria cumplida! "+OBJ.diarioContactos+" contactos 🎉",true); confetti(); }
  else toast("Enviado ✓", true);
  // marca el mensaje como visto (apaga el aviso de la campana)
  try{ await EYG.comMarcarVistoWA(window.__perfil||{email:""}, [msgId]); }catch(e){}
  render(); pintarWAModal(); refreshBell();
}

let toastT;
function toast(msg,win){const t=document.getElementById("toast");t.textContent=msg;t.className="toast on"+(win?" win":"");clearTimeout(toastT);toastT=setTimeout(()=>t.className="toast",2600);}
function confetti(){const box=document.getElementById("confetti");const cols=["#048782","#EC8B5E","#E5A93B","#5FC8BF","#1E7D46"];
  for(let i=0;i<80;i++){const dv=document.createElement("div");dv.className="conf";dv.style.left=Math.random()*100+"vw";dv.style.top="-20px";dv.style.background=cols[i%cols.length];dv.style.transform="rotate("+Math.random()*360+"deg)";dv.style.animation="fall "+(1.6+Math.random()*1.4)+"s "+(Math.random()*0.4)+"s ease-in forwards";box.appendChild(dv);setTimeout(()=>dv.remove(),3600);}}
// ---- Arranque con login: cada comercial ve SU cuenta; líder/admin/dirección pueden ver cualquiera con ?c= ----
EYG.guard(["comercial","lider","admin","direccion"]).then(perfil=>{
  window.__perfil = perfil;
  const q = new URLSearchParams(location.search).get("c");
  if(perfil.rol==="comercial"){
    COMERCIAL = perfil.comercial_ref || perfil.nombre || perfil.email;  // forzado a su propia cuenta de Odoo
    // Un comercial no tiene "inicio" (entra directo acá): el ← pasa a ser "Salir".
    const nb=document.getElementById("navBack");
    if(nb){ nb.textContent="Salir"; nb.href="#"; nb.title="Cerrar sesión"; nb.onclick=(e)=>{e.preventDefault();EYG.logout();}; }
  } else {
    COMERCIAL = q || perfil.comercial_ref || "Natividad Sanchez";       // líder/admin: puede elegir con ?c=
  }
  cargar();
  // Novedades/bajadas (Comunicaciones): campana con badge en el header, cerca del nombre.
  // Para un comercial, la campana además avisa de mensajes de WhatsApp para enviar (opts.wa),
  // con "Ver" que hace scroll a la sección #waSection del panel.
  BELL_OPTS = {wa: perfil.rol==="comercial", waTarget:"waSection"};
  if(EYG.bellComunicaciones) EYG.bellComunicaciones("bellSlot", perfil, BELL_OPTS);
});
</script>
