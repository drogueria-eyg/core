<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotizar pedido de plataforma · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<style>
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--teal-deep);font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  h2.sec:before{content:"";width:5px;height:16px;background:var(--teal);border-radius:3px}
  h2.sec .ayuda{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--gris2)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:18px}
  .nota{background:var(--agua);border:1px solid #BFE0DC;border-left:4px solid var(--teal);border-radius:10px;padding:12px 15px;font-size:13px;color:#245C57;line-height:1.6;margin-bottom:16px}
  .nota b{color:var(--teal-deep)}
  .nota.aviso{background:var(--warnbg);border-color:#E7CE9A;border-left-color:var(--warn);color:#7A5310}
  .nota.aviso b{color:var(--warn)}

  textarea.pegar{width:100%;min-height:150px;border:1px solid var(--line);border-radius:11px;padding:13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;outline:none;resize:vertical}
  textarea.pegar:focus{border-color:var(--teal)}
  .btn{font-size:14px;padding:12px 20px;border-radius:11px;border:0;background:var(--teal);color:#fff;cursor:pointer;font-weight:800;font-family:inherit}
  .btn:hover{filter:brightness(1.07)}
  .btn[disabled]{background:#DCE8E6;color:var(--gris2);cursor:not-allowed}
  .btn.sec{background:var(--surface);color:var(--gris);border:1px solid var(--line);font-weight:700;font-size:12.5px;padding:9px 15px}
  .btn.sec:hover{border-color:var(--teal);color:var(--teal-deep)}
  .acciones{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-top:14px}

  .emb{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .e{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .e .n{font-size:25px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .e .n.t{color:var(--teal-deep)} .e .n.x{color:var(--gris2)} .e .n.b{color:var(--bad)}
  .e .t{font-size:11.5px;font-weight:700;color:var(--gris);margin-top:6px}

  .ren{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
  .ren.ok{border-left:4px solid var(--ok)} .ren.duda{border-left:4px solid var(--warn)} .ren.no{border-left:4px solid var(--bad)}
  .ren .top{padding:13px 16px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
  .ren .pide{flex:1;min-width:240px}
  .ren .pide .q{font-size:14px;font-weight:700;line-height:1.35;color:var(--ink)}
  .ren .pide .m{font-size:11.5px;color:var(--gris2);margin-top:3px}
  .ren .cant{text-align:right;flex:none}
  .ren .cant b{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}
  .ren .cant span{display:block;font-size:11px;color:var(--gris2)}
  .ren .match{padding:12px 16px;background:#FAFDFC;border-top:1px solid var(--line)}
  .ren .lbl{font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--gris2);margin-bottom:6px}
  .opts{display:flex;flex-direction:column;gap:7px}
  .opt{display:flex;gap:11px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:var(--surface)}
  .opt:hover{border-color:var(--teal)}
  .opt.on{border-color:var(--teal);background:var(--agua)}
  .opt .nm{flex:1;min-width:0;font-size:13px;font-weight:600;line-height:1.3}
  .opt .nm small{display:block;font-weight:400;color:var(--gris2);font-size:11.5px}
  .opt .pr{text-align:right;flex:none;white-space:nowrap}
  .opt .pr b{font-size:14px;color:var(--teal-deep);font-weight:800}
  .opt .pr span{display:block;font-size:11px;color:var(--gris2)}
  .pill{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;margin-left:6px}
  .pill.ok{background:var(--okbg);color:var(--ok)} .pill.bad{background:var(--badbg);color:var(--bad)}
  .pill.warn{background:var(--warnbg);color:var(--warn)} .pill.neu{background:#EEF2F1;color:var(--gris)}
  .buscar{display:flex;gap:8px;margin-top:9px}
  .buscar input{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:13px;outline:none}
  .buscar input:focus{border-color:var(--teal)}
  .salida{width:100%;min-height:190px;border:1px solid var(--line);border-radius:11px;padding:13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;background:#FAFDFC;color:var(--ink);resize:vertical}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite;margin:20px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .cargando{text-align:center;color:var(--gris);font-size:13px;padding:8px}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:9999}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=81"></script>
<script>
/* ============================================================
   COTIZAR PEDIDO DE PLATAFORMA — el puente entre lo que pide el
   hospital y lo que EyG tiene
   ============================================================
   NO HACE FALTA EL CATÁLOGO SUBIDO. Verificado en el formulario de Bionexo
   (pedido 18780174, 15/9/2026): precio, marca y presentación son campos de
   texto libre, no obligatorios, y el vínculo con el catálogo del proveedor
   viene vacío. Se cotiza escribiendo. Subir el catálogo da velocidad y
   presencia en las búsquedas, pero no es requisito para responder.

   DE DÓNDE SALE CADA SUGERENCIA, en este orden:
     1. LO QUE YA COTIZAMOS ANTES. Si ese código de Bionexo aparece en el
        historial (bionexo_renglones) ya resuelto, se propone el mismo
        producto. Es el que más vale: son decisiones que alguien ya tomó.
     2. BÚSQUEDA EN ODOO por las palabras del pedido.
   El precio siempre se relee de la tarifa (nunca del historial): un precio
   viejo es peor que no tener precio.

   EL ENVÍO LO HACE UNA PERSONA. Este módulo prepara y deja listo para
   copiar; cargar y enviar la oferta en Bionexo es a mano. Enviar una oferta
   es firmar un compromiso con un hospital.
   ============================================================ */
const esc = EYG.esc;
const nf = n => Math.round(n||0).toLocaleString("es-AR");
const money = n => "$"+(Math.round((n||0)*100)/100).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const ES = {lang:"es_AR"};
const LISTA_DEF = 3;

const ST = { lista:LISTA_DEF, listas:[], renglones:[], historial:{}, comprometido:{}, taxmap:{}, cargando:false };

function toast(m){ let t=document.getElementById("toast"); if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);} t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2600); }

EYG.guard(["comercial","lider","admin","direccion"]).then(async perfil=>{
  document.body.innerHTML = EYG.layout(perfil,"plataformas", pantalla(), "Cotizar pedido de plataforma");
  enganchar();
  try{
    // Si se llega desde «Abiertos», los renglones ya están en la base: no hay
    // que pegar nada.
    const id = new URLSearchParams(location.search).get("id");
    if(id) cargarDeLaBase(id);
  }catch(e){}
  try{
    ST.listas = await EYG.rpc("product.pricelist","search_read",[[["active","=",true]]],{fields:["id","name"],limit:30,context:ES});
    const tx = await EYG.rpc("account.tax","search_read",[[["type_tax_use","=","sale"]]],{fields:["id","name","amount","amount_type","price_include"],limit:100});
    (tx||[]).forEach(t=>{ const inc = !!t.price_include || /imp\.?\s*inc|inclu/i.test(t.name||"");
      ST.taxmap[t.id] = { pct:(t.amount_type==="percent"?(t.amount||0):0), incluido:inc }; });
    pintarListas();
  }catch(e){}
});

function pantalla(){
  return `
  <div class="nota">
    <b>Para qué sirve.</b> Traés los renglones de un pedido de Bionexo y el Core busca qué producto de EyG
    corresponde, con su precio de lista y el stock disponible. Vos revisás, corregís lo que haga falta y
    copiás los precios a Bionexo. <b>La oferta la cargás y la enviás vos</b> — eso no se automatiza.
  </div>

  <h2 class="sec">1 · Traé el pedido</h2>
  <div class="card pad">
    <p style="font-size:13px;color:var(--gris);margin:0 0 10px;line-height:1.6">
      En Bionexo, con el pedido abierto, tocá el favorito <b>Recolectar Bionexo</b> y después
      <b>Copiar renglones</b>. Volvé acá y pegá con Ctrl+V.
      <br><span style="color:var(--gris2)">También podés pegar a mano, una línea por producto: <code>código · producto · cantidad</code></span>
    </p>
    <textarea class="pegar" id="pegado" placeholder="5015 · BOBINA DE PAPEL ABSORBENTE ELITE 24CM X 400 MTS · 18&#10;5128 · JABON LIQUIDO P/MANOS X 5LTS · 48"></textarea>
    <div class="acciones">
      <button class="btn" id="analizar">Buscar en el catálogo de EyG</button>
      <span style="font-size:12.5px;color:var(--gris)">Lista de precios:</span>
      <select id="lista" style="border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-family:inherit;font-size:13px"></select>
    </div>
  </div>
  <div id="res"></div>`;
}

function pintarListas(){
  const s=document.getElementById("lista"); if(!s) return;
  s.innerHTML = ST.listas.map(l=>`<option value="${l.id}" ${l.id===ST.lista?"selected":""}>${esc(l.name)}</option>`).join("");
  s.onchange = ()=>{ ST.lista=+s.value; if(ST.renglones.length) analizar(); };
}

function enganchar(){
  const b=document.getElementById("analizar"); if(b) b.onclick=analizar;
}

/* Viene de «Plataformas → Abiertos»: los renglones ya los trajo el favorito y
   están guardados, así que se arma solo. */
async function cargarDeLaBase(id){
  const ta = document.getElementById("pegado");
  const res = document.getElementById("res");
  res.innerHTML = `<div class="spin"></div><p class="cargando">Trayendo el pedido ${esc(id)}…</p>`;
  try{
    const { data, error } = await EYG.supa().from("bionexo_renglones")
      .select("seq,cod_bionexo,producto,cantidad,marca_pedida")
      .eq("cotizacion_id", id).order("seq").limit(500);
    if(error) throw new Error(error.message);
    if(!data || !data.length){
      res.innerHTML = `<div class="nota aviso"><b>No tengo los renglones de ese pedido.</b>
        Traelos con el favorito («Traer pedidos de Santa Fe al Core») y volvé.</div>`;
      return;
    }
    ta.value = "# pedido "+id+"\n" + data.map(r=>`${r.cod_bionexo||""} · ${r.producto||""} · ${Math.round(Number(r.cantidad)||0)}`).join("\n");
    await analizar();
  }catch(e){
    res.innerHTML = `<div class="nota aviso"><b>No pude traer el pedido.</b> ${esc(String(e.message||e))}</div>`;
  }
}

/* Acepta lo que copia el favorito (código · producto · cantidad) y también
   pegados sueltos: se toma el primer número largo como código y el último
   como cantidad. Mejor aceptar de más que pelear con el formato. */
function parsearPegado(txt){
  ST.pedido = "";
  const cab = String(txt||"").match(/#\s*pedido\s*(\d{6,12})/i);
  if(cab) ST.pedido = cab[1];
  return String(txt||"").split(/\r?\n/).map(l=>l.trim()).filter(l=>l && !/^#/.test(l)).map(l=>{
    let p = l.split(/\s*·\s*|\t|\s*\|\s*/).map(x=>x.trim()).filter(Boolean);
    if(p.length>=3) return {cod:p[0], prod:p.slice(1,-1).join(" "), cant:parseInt(String(p[p.length-1]).replace(/\D/g,""),10)||0};
    const m = l.match(/^(\d{3,9})\s+(.+?)\s+(\d+)$/);
    if(m) return {cod:m[1], prod:m[2], cant:+m[3]};
    return {cod:"", prod:l, cant:0};
  }).filter(r=>r.prod);
}

async function analizar(){
  const txt = document.getElementById("pegado").value;
  const rens = parsearPegado(txt);
  if(!rens.length){ toast("No encontré renglones en lo que pegaste"); return; }
  const res = document.getElementById("res");
  res.innerHTML = `<div class="spin"></div><p class="cargando">Buscando en el catálogo de EyG…</p>`;
  try{
    await cargarHistorial(rens.map(r=>r.cod).filter(Boolean));
    for(const r of rens){ r.cands = await candidatos(r); r.elegido = r.cands.length ? 0 : -1; }
    ST.renglones = rens;
    await preciar();
    render();
  }catch(e){
    res.innerHTML = `<div class="nota aviso"><b>No pude completar la búsqueda.</b> ${esc(String(e.message||e))}</div>`;
  }
}

/* Lo que ya cotizamos antes para esos códigos. Vale oro: es una decisión que
   alguien del equipo ya tomó mirando el pedido real. */
async function cargarHistorial(codigos){
  ST.historial = {};
  if(!codigos.length) return;
  try{
    const { data } = await EYG.supa().from("bionexo_renglones")
      .select("cod_bionexo,cod_eyg,producto_eyg,marca")
      .in("cod_bionexo", codigos).not("cod_eyg","is",null).limit(500);
    (data||[]).forEach(r=>{
      if(!r.cod_eyg) return;
      const k=String(r.cod_bionexo);
      (ST.historial[k] = ST.historial[k] || []).push(r);
    });
  }catch(e){ /* sin historial se sigue igual, sólo con la búsqueda */ }
}

/* Candidatos en Odoo. Primero el que ya usamos antes; después, búsqueda por
   las palabras más largas del nombre pedido (las cortas no distinguen nada). */
async function candidatos(r){
  const out=[], vistos=new Set();
  const campos=["id","default_code","name","product_tmpl_id","qty_available","taxes_id"];

  const prev = ST.historial[String(r.cod)] || [];
  const codsPrev = [...new Set(prev.map(x=>x.cod_eyg).filter(Boolean))];
  if(codsPrev.length){
    try{
      const ps = await EYG.rpc("product.product","search_read",
        [[["default_code","in",codsPrev]]],{fields:campos,limit:5,context:ES});
      (ps||[]).forEach(p=>{ if(!vistos.has(p.id)){ vistos.add(p.id); out.push({...p, _fuente:"historial"}); } });
    }catch(e){}
  }

  const palabras = (r.prod||"").toUpperCase()
    .replace(/\(.*?\)/g," ").replace(/[^A-ZÁÉÍÓÚÑ0-9 ]/g," ")
    .split(/\s+/).filter(w=>w.length>=4 && !/^(PARA|CON|SIN|POR|DEL|LOS|LAS|UNID|UNIDADES|COLOR)$/.test(w))
    .sort((a,b)=>b.length-a.length).slice(0,3);
  /* En Odoo, una lista de condiciones se combina con Y sola: no hacen falta
     operadores. Se empieza exigiendo las 3 palabras y, si no aparece nada, se
     va aflojando hasta buscar sólo por la más larga — mejor traer de más y que
     la persona elija, que no traer nada. */
  for(let usar = palabras.length; usar >= 1 && !out.length; usar--){
    const dom = [["active","=",true],["sale_ok","=",true]]
      .concat(palabras.slice(0,usar).map(w=>["name","ilike",w]));
    try{
      const ps = await EYG.rpc("product.product","search_read",[dom],
        {fields:campos, limit:8, context:ES, order:"name"});
      (ps||[]).forEach(p=>{ if(!vistos.has(p.id)){ vistos.add(p.id); out.push({...p, _fuente:"busqueda"}); } });
    }catch(e){}
  }
  return out;
}

/* Precio SIEMPRE de la tarifa, nunca del historial: un precio viejo es peor
   que no tener precio. Mismo criterio que el Cotizador. */
async function preciar(){
  const ids=[], tmpls=[];
  ST.renglones.forEach(r=>(r.cands||[]).forEach(c=>{ ids.push(c.id); if(c.product_tmpl_id) tmpls.push(c.product_tmpl_id[0]); }));
  if(!ids.length) return;
  let items=[];
  try{
    items = await EYG.rpc("product.pricelist.item","search_read",
      [["&",["pricelist_id","=",ST.lista],"|",
        "&",["applied_on","=","1_product"],["product_tmpl_id","in",[...new Set(tmpls)]],
        "&",["applied_on","=","0_product_variant"],["product_id","in",[...new Set(ids)]]]],
      {fields:["product_tmpl_id","product_id","applied_on","min_quantity","fixed_price","compute_price"],limit:20000,context:ES});
  }catch(e){}
  const porT={}, porV={};
  (items||[]).forEach(it=>{
    if(it.compute_price!=="fixed" || !(it.fixed_price>0)) return;
    if(it.applied_on==="0_product_variant" && it.product_id) (porV[it.product_id[0]]=porV[it.product_id[0]]||[]).push(it);
    else if(it.product_tmpl_id) (porT[it.product_tmpl_id[0]]=porT[it.product_tmpl_id[0]]||[]).push(it);
  });
  // comprometido, para mostrar disponible y no físico
  try{
    const g = await EYG.rpc("sale.order.line","read_group",
      [[["order_id.state","=","sale"],["order_id.delivery_status","in",["pending","partial"]],["product_id","in",[...new Set(ids)]]],
       ["product_uom_qty:sum","qty_delivered:sum"],["product_id"]],{lazy:false,limit:2000,context:ES});
    ST.comprometido={};
    (g||[]).forEach(x=>{ if(!x.product_id) return; const c=(x.product_uom_qty||0)-(x.qty_delivered||0); if(c>0.001) ST.comprometido[x.product_id[0]]=c; });
  }catch(e){}

  /* La unidad de venta y el laboratorio viven en la plantilla (los edita el
     Maestro). Se usan para llenar Marca y Presentación en Bionexo: hoy esos
     campos se escriben a mano cada vez. */
  try{
    const ts = [...new Set(tmpls)];
    const ms = await EYG.rpc("product.template","search_read",[[["id","in",ts]]],
      {fields:["id","x_unidad","x_laboratorio"], limit:500, context:ES});
    const m={}; (ms||[]).forEach(x=>m[x.id]={u:(x.x_unidad||"").trim(), l:(x.x_laboratorio||"").trim()});
    ST.renglones.forEach(r=>(r.cands||[]).forEach(c=>{
      const d = m[c.product_tmpl_id && c.product_tmpl_id[0]];
      if(d){ c._unidad = d.u; c._lab = d.l; }
    }));
  }catch(e){}

  ST.renglones.forEach(r=>(r.cands||[]).forEach(c=>{
    const t = c.product_tmpl_id && c.product_tmpl_id[0];
    const src = (porV[c.id] && porV[c.id].length) ? porV[c.id] : (porT[t]||[]);
    const arr = src.map(i=>({q:i.min_quantity||1, p:i.fixed_price})).sort((a,b)=>a.q-b.q);
    // el tramo que corresponde a la cantidad pedida
    let tramo = arr[0]||null;
    arr.forEach(x=>{ if(x.q <= Math.max(1, r.cant)) tramo = x; });
    c._precio = tramo ? tramo.p : 0;
    c._tramos = arr;
    c._disp = Math.round(((c.qty_available||0) - (ST.comprometido[c.id]||0))*100)/100;
    const idsTax = c.taxes_id||[];
    let iva=0; for(const id of idsTax){ const t2=ST.taxmap[id]; if(t2 && t2.pct>0){ iva=t2.pct; break; } }
    c._iva = iva;
  }));
}

/* ---------------- pintado ---------------- */
function render(){
  const R = ST.renglones;
  const listos = R.filter(r=>r.elegido>=0 && (r.cands[r.elegido]||{})._precio>0);
  const alcanza = listos.filter(r=>{ const c=r.cands[r.elegido]; return c._disp >= r.cant; });
  document.getElementById("res").innerHTML = `
    <h2 class="sec">2 · Revisá cada renglón <span class="ayuda">verde = resuelto · amarillo = revisar · rojo = no encontré</span></h2>
    <div class="emb">
      <div class="e"><div class="n">${nf(R.length)}</div><div class="t">Renglones pedidos</div></div>
      <div class="e"><div class="n t">${nf(listos.length)}</div><div class="t">Con producto y precio</div></div>
      <div class="e"><div class="n ${alcanza.length<listos.length?"b":""}">${nf(alcanza.length)}</div><div class="t">Con stock suficiente</div></div>
      <div class="e"><div class="n x">${nf(R.length-listos.length)}</div><div class="t">Sin resolver</div></div>
    </div>
    ${R.map((r,i)=>renglon(r,i)).join("")}

    <h2 class="sec">3 · Llevalo a Bionexo <span class="ayuda">el formulario se llena solo; enviar lo hacés vos</span></h2>
    <div class="card pad">
      <div class="nota" style="margin-bottom:14px">
        <b>Copiá esto, volvé al pedido en Bionexo y tocá «Llenar formulario» en el favorito.</b>
        Se completan precio, marca y presentación de cada renglón, y se tildan los que cotizamos.
        Los que quedaron sin resolver <b>no se tocan</b>.<br>
        <b style="color:var(--bad)">El botón de enviar no se aprieta solo.</b> Revisás en pantalla y enviás vos.
      </div>
      <div class="acciones" style="margin-top:0;margin-bottom:14px">
        <button class="btn" id="copiarPaq">Copiar para llenar en Bionexo</button>
        <span style="font-size:12.5px;color:var(--gris)">${nf(listos.length)} de ${nf(R.length)} renglones listos</span>
      </div>
      <details>
        <summary style="cursor:pointer;font-size:12.5px;font-weight:700;color:var(--gris)">Ver el detalle en texto (por si preferís cargarlo a mano)</summary>
        <textarea class="salida" id="salida" readonly style="margin-top:10px">${esc(textoSalida())}</textarea>
        <div class="acciones"><button class="btn sec" id="copiar">Copiar el texto</button></div>
      </details>
      <textarea id="paquete" readonly style="position:absolute;left:-9999px;top:0">${esc(paquete())}</textarea>
    </div>`;
  document.querySelectorAll(".opt[data-r]").forEach(o=>o.onclick=()=>{
    ST.renglones[+o.dataset.r].elegido = +o.dataset.c; render();
  });
  document.querySelectorAll("input[data-buscar]").forEach(inp=>{
    inp.onkeydown = async ev=>{
      if(ev.key!=="Enter") return;
      const i=+inp.dataset.buscar, q=inp.value.trim();
      if(q.length<3) return;
      inp.disabled=true;
      try{
        const ps = await EYG.rpc("product.product","search_read",
          [[["name","ilike",q],["active","=",true]]],
          {fields:["id","default_code","name","product_tmpl_id","qty_available","taxes_id"],limit:8,context:ES,order:"name"});
        ST.renglones[i].cands = (ps||[]).map(p=>({...p,_fuente:"manual"}));
        ST.renglones[i].elegido = ST.renglones[i].cands.length?0:-1;
        await preciar(); render();
      }catch(e){ toast("No encontré nada"); inp.disabled=false; }
    };
  });
  const c=document.getElementById("copiar");
  if(c) c.onclick=()=>{ const s=document.getElementById("salida"); s.select(); document.execCommand("copy"); toast("Copiado"); };
  const cp=document.getElementById("copiarPaq");
  if(cp) cp.onclick=()=>{
    const s=document.getElementById("paquete");
    s.style.position="static"; s.select(); document.execCommand("copy"); s.style.position="absolute";
    toast("Copiado. Volvé al pedido en Bionexo y tocá «Llenar formulario».");
  };
}

/* El paquete que entiende el favorito. Va con el id del pedido adentro para que
   el favorito pueda avisar si lo estás pegando en OTRO pedido — es el error
   fácil de cometer y el más caro: cargar precios de un pedido en otro.
   El precio viaja con coma decimal, que es como lo muestra y lo espera Bionexo. */
function paquete(){
  const r = {};
  ST.renglones.forEach(x=>{
    const c = x.elegido>=0 ? x.cands[x.elegido] : null;
    if(!c || !(c._precio>0) || !x.cod) return;
    r[x.cod] = {
      pr: String(Math.round(c._precio*10000)/10000).replace(".",","),
      ma: marcaDe(c),
      em: (c._unidad||"").toUpperCase(),
      nu: c.default_code||""
    };
  });
  return "BXQ1"+JSON.stringify({p:ST.pedido||"", r});
}

/* La marca que ve el comprador. En EyG el nombre termina en « - LABORATORIO»,
   así que el laboratorio del Maestro manda y, si no está, se usa esa cola. */
function marcaDe(c){
  if(c._lab) return c._lab;
  const partes = String(c.name||"").split(" - ");
  return partes.length>1 ? partes[partes.length-1].trim() : "";
}

function renglon(r,i){
  const c = r.elegido>=0 ? r.cands[r.elegido] : null;
  const cls = !c || !(c._precio>0) ? "no" : (c._disp < r.cant ? "duda" : "ok");
  return `<div class="ren ${cls}">
    <div class="top">
      <div class="pide">
        <div class="q">${esc(r.prod)}</div>
        <div class="m">Código Bionexo ${esc(r.cod||"—")}${ST.historial[String(r.cod)]?` <span class="pill neu">ya cotizado antes</span>`:""}</div>
      </div>
      <div class="cant"><b>${nf(r.cant)}</b><span>piden</span></div>
    </div>
    <div class="match">
      <div class="lbl">Nuestro producto</div>
      ${r.cands && r.cands.length ? `<div class="opts">${r.cands.map((x,j)=>{
        const falta = x._disp < r.cant;
        return `<div class="opt ${j===r.elegido?"on":""}" data-r="${i}" data-c="${j}">
          <div class="nm">${esc(x.name||"")}
            <small>${esc(x.default_code||"sin código")}${x._fuente==="historial"?' · <b>ya usado antes para este pedido</b>':""}</small></div>
          <div class="pr">
            ${x._precio>0 ? `<b>${money(x._precio)}</b>` : `<b style="color:var(--bad)">sin precio</b>`}
            <span>${x._iva?("IVA "+x._iva+"%"):"exento"} · stock ${nf(x._disp)}${falta?` <span class="pill bad">falta</span>`:""}</span>
          </div>
        </div>`;}).join("")}</div>`
      : `<p style="font-size:13px;color:var(--bad);margin:0">No encontré ningún producto parecido.</p>`}
      <div class="buscar"><input data-buscar="${i}" placeholder="Buscar otro producto y apretar Enter…" autocomplete="off"></div>
      ${c && c._precio>0 ? `<p style="font-size:12.5px;color:var(--gris);margin:10px 0 0">
        Total del renglón: <b style="color:var(--ink)">${money(c._precio*r.cant)}</b> sin IVA
        ${c._tramos && c._tramos.length>1 ? ` · escalera de ${c._tramos.length} tramos` : ""}
      </p>`:""}
    </div>
  </div>`;
}

/* Lo que se copia: una línea por renglón, con lo que hay que escribir en el
   formulario. Los que no se resolvieron se listan aparte, porque un renglón
   en blanco es una derrota automática y conviene verlo. */
function textoSalida(){
  const ok=[], faltan=[];
  ST.renglones.forEach(r=>{
    const c = r.elegido>=0 ? r.cands[r.elegido] : null;
    if(c && c._precio>0){
      ok.push(`${r.cod||"—"} · ${r.prod}\n   precio: ${String(c._precio).replace(".",",")}   marca: ${(c.name||"").split(" - ").pop()}   nuestro: ${c.default_code||""}   x${r.cant} = ${money(c._precio*r.cant)}${c._disp<r.cant?"   ⚠ stock "+nf(c._disp):""}`);
    } else {
      faltan.push(`${r.cod||"—"} · ${r.prod}`);
    }
  });
  let t = ok.length ? "PARA CARGAR EN BIONEXO\n\n"+ok.join("\n\n") : "Todavía no hay renglones resueltos.";
  if(faltan.length) t += "\n\n\nSIN RESOLVER — revisar antes de enviar:\n"+faltan.map(x=>"   "+x).join("\n");
  return t;
}
</script>
