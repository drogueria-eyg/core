  /* panel éticos por escala */

<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=26"></script>
<script>
const KEY="eyg.sync_precios_config";      // JSON (para este editor)
const KEY_FLAT="eyg.sync_precios_flat";    // texto plano que lee el cron (una regla por linea)
// Las ofertas/descuentos temporales (eyg.sync_ofertas) se crean y gestionan en
// "Oportunidades y Ofertas" (inventario/oportunidades.html). Este módulo define
// SOLO las reglas del motor. Ver [[eyg-core-ofertas-arquitectura]].
const ROOTS=[24,10,51,11,369,370];         // Hospitalarios, Farmacopea, Descartables, Perfumeria, Equipos, Ortopedia
const esc=EYG.esc, rpc=EYG.rpc;
const MODOS=[["embalaje","Por embalaje (fracciona de la caja real a la caja del nombre)"],["fijo","Fijo (venta por unidad/caja, sin fraccionar)"]];
const DEF={genera:false, recargo:0.80, piso:0.30, modo:"fijo", cortes:[1,10,20,40], desc:[0,0.07,0.14,0.20], unidad:"unidades", ivaCosto:0};
let CATS=[], byId={}, CFG={v:1,reglas:{}}, editId=null, abiertos={}, dirty=false;
const KEY_ESC="eyg.eticos_escala";       // {subcatId:'A'|'B'} clasificación de labs éticos
let ESCALA={}, escFiltro="todos", editEsc=null, editLab=null;   // clasificación, filtro, regla de escala en edición, regla de lab en edición
// Regla "Escalera de éticos por precio" (el tope de cada ético sale de su PVP) + intervalo del cron del motor.
let ET={on:false, bands:[], descmax:12, open:false}, ETCRON={num:15, type:"minutes"};
const hoyStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};

const pct=x=>Math.round((x||0)*1000)/10;           // 0.07 -> 7
const frac=x=>{const n=parseFloat(x); return isNaN(n)?0:n/100;};
const listNum=s=>String(s||"").split(/[,;\s]+/).map(x=>parseFloat(x)).filter(x=>!isNaN(x));

async function cargar(){
  const cont=document.getElementById("cont");
  cont.innerHTML='<div class="empty">Cargando categorías y configuración…</div>';
  try{
    // TODAS las categorías: todo lo que cuelga de ALL (incluye Éticos y cualquier categoría nueva a futuro)
    CATS=await rpc("product.category","search_read",[[["id","child_of",1]]],{fields:["id","name","parent_id","complete_name"],limit:5000,context:{lang:"es_AR"}});
    const JUNK_IDS=[1,2,4,294];   // ALL, Varios (default Odoo), Envíos, Redondeo: categorías de sistema, no de productos
    CATS=CATS.filter(c=>!JUNK_IDS.includes(c.id));
    byId={}; CATS.forEach(c=>{ c.full=(c.complete_name||"").replace(/^ALL \/ /,""); c.top=c.full.split(" / ")[0]; c.pid=c.parent_id?c.parent_id[0]:null; byId[c.id]=c; });
    // por defecto: categorías chicas abiertas; las grandes (Éticos) colapsadas para que no pese
    [...new Set(CATS.map(c=>c.top))].forEach(t=>{ if(!(t in abiertos)){ abiertos[t]=CATS.filter(c=>c.top===t&&c.pid!==1).length<=25; } });
    const raw=await rpc("ir.config_parameter","get_param",[KEY]);
    CFG = raw ? JSON.parse(raw) : {v:1,reglas:{}};
    if(!CFG.reglas) CFG.reglas={};
    if(!CFG.escala) CFG.escala={A:null,B:null};    // dos reglas por escala (base PVP)
    const rawEsc=await rpc("ir.config_parameter","get_param",[KEY_ESC]);
    ESCALA = rawEsc ? (JSON.parse(rawEsc)||{}) : {};
    // ---- Escalera de éticos por precio: params + intervalo del cron del motor (id 92) ----
    const etOn=await rpc("ir.config_parameter","get_param",["eyg.eticos_tope_activo"]);
    const etFlat=await rpc("ir.config_parameter","get_param",["eyg.eticos_tope_flat"]);
    const etDm=await rpc("ir.config_parameter","get_param",["eyg.eticos_tope_descmax"]);
    ET.on = (etOn==="1"||etOn===1);
    ET.bands = String(etFlat||"").split("\n").map(l=>l.trim()).filter(l=>l&&l[0]!=="#")
      .map(l=>{const f=l.split("~");return {pvp:parseFloat(f[0])||0, tope:parseInt(f[1])||1};}).sort((a,b)=>a.pvp-b.pvp);
    if(!ET.bands.length) ET.bands=[{pvp:0,tope:12},{pvp:25000,tope:6},{pvp:50000,tope:3},{pvp:100000,tope:2},{pvp:200000,tope:1}];
    const _dm=parseFloat(etDm); ET.descmax = isNaN(_dm)?0:Math.round(_dm*1000)/10;   // 0 = sin tope global (manda el piso)
    try{ const cr=await rpc("ir.cron","read",[[92],["interval_number","interval_type"]]); if(cr&&cr[0]){ ETCRON.num=cr[0].interval_number; ETCRON.type=cr[0].interval_type; } }catch(e){}
    render();
  }catch(e){ cont.innerHTML='<div class="empty">No pude cargar: '+esc(e.message)+'</div>'; }
}

// resuelve la regla efectiva de una categoría: propia, o heredada del ancestro más cercano
function resolver(id){
  let cur=id, guard=0;
  while(cur && guard++<20){ if(CFG.reglas[cur]) return {rule:CFG.reglas[cur], fromId:cur, own:(cur===id)}; cur=byId[cur]?byId[cur].pid:null; }
  return null;
}
function resumen(r){
  if(!r) return "";
  const p=[];
  if(!r.genera){ p.push("NO genera escalera"); if(r.ivaCosto) p.push("IVA al costo +"+pct(r.ivaCosto)+"%"); return p.join(" · "); }
  const n=(r.desc&&r.desc.length)||(r.cortes&&r.cortes.length)||0;
  const dmax=(r.desc&&r.desc.length)?Math.max.apply(null,r.desc.map(x=>+x||0)):0;
  p.push("recargo "+pct(r.recargo)+"%");
  p.push("piso "+pct(r.piso)+"%");
  p.push(n+" tramos · desc máx "+pct(dmax)+"%");
  if(r.ivaCosto) p.push("IVA al costo +"+pct(r.ivaCosto)+"%");
  return p.join(" · ");
}

// firma canónica de una regla, para comparar si dos son idénticas
function firmaRegla(r){ if(!r) return ""; return JSON.stringify([!!r.genera, +r.recargo||0, +r.piso||0, r.modo||"fijo", (r.cortes||[]).join(","), (r.desc||[]).map(Number).join(","), r.unidad||"", +r.ivaCosto||0]); }
// ¿las subcategorías comparten una misma regla que conviene subir a la categoría?
function candidatoConsolidar(rootId){
  const hijos=CATS.filter(x=>x.pid===rootId && CFG.reglas[x.id]);   // subcats con regla PROPIA
  if(hijos.length<2) return null;
  const grupos={};
  hijos.forEach(x=>{ const f=firmaRegla(CFG.reglas[x.id]); (grupos[f]=grupos[f]||[]).push(x.id); });
  let bestF=null,bestN=0;
  Object.entries(grupos).forEach(([f,ids])=>{ if(ids.length>bestN){ bestN=ids.length; bestF=f; } });
  if(bestN<2) return null;                                          // al menos 2 subcats iguales
  const genActual=CFG.reglas[rootId]?firmaRegla(CFG.reglas[rootId]):null;
  if(genActual===bestF) return null;                               // la categoría ya tiene esa misma regla
  return { ids:grupos[bestF], regla:CFG.reglas[grupos[bestF][0]], n:bestN };
}
window.consolidar = rootId => {
  const cand=candidatoConsolidar(rootId); if(!cand) return;
  if(!confirm(`${cand.n} subcategorías tienen la misma regla. La paso a la categoría como general y saco esas ${cand.n} (van a heredarla). Las subcategorías con otra regla quedan igual.`)) return;
  CFG.reglas[rootId]=JSON.parse(JSON.stringify(cand.regla));       // regla general = la común
  cand.ids.forEach(id=>{ delete CFG.reglas[id]; });                // saca las repetidas -> heredan
  dirty=true; editId=null; render();
};
function render(){
  const cont=document.getElementById("cont");
  if(document.getElementById("et-on")) etLeer();   // preserva lo tipeado en la sección de éticos ante cualquier re-render
  const tops=[...new Set(CATS.map(c=>c.top))].sort((a,b)=>{const O=["HOSPITALARIOS","FARMACOPEA","DESCARTABLES","PERFUMERIA","EQUIPOS MEDICOS","ORTOPEDIA","ETICOS"];const ia=O.indexOf(a),ib=O.indexOf(b);return (ia<0?9:ia)-(ib<0?9:ib)||a.localeCompare(b);});
  const savebar=`<div class="savebar"><button class="btn-save" ${dirty?"":"disabled"} onclick="guardarTodo()">💾 Guardar cambios</button><button class="btn-recalc" onclick="recalcularAhora()">⚡ Recalcular precios ahora</button>${dirty?'<span class="dirty">Tenés cambios sin guardar</span>':'<span style="font-size:12.5px;color:var(--gris)">Todo guardado</span>'}<button class="gearbtn" onclick="etOpenModal()" title="Ajustes del motor: intervalo de corrida y escalera de éticos por precio">⚙️ Ajustes del motor</button></div>`;
  const intro=`<div class="intro"><b>Reglas del motor de precios.</b> Definí por categoría (y subcategoría) cómo se arma la escalera: <b>recargo</b> sobre el costo, <b>piso</b> de margen, <b>modo</b> de cortes (embalaje / fijo), <b>cortes</b> y <b>descuento por tramo</b>, <b>unidad</b> e <b>IVA al costo</b>. <b>La subcategoría pisa a la categoría</b>; si no tiene regla propia, hereda del padre. <b>Al guardar, el motor recalcula todos los precios al instante.</b> El costo lo toma solo (más reciente entre manual, compra y estándar); la caja cerrada se maneja por producto en el Maestro.<br><span style="color:var(--gris2)">Las ofertas y descuentos temporales se crean en <b>Oportunidades y Ofertas</b>.</span></div>`;
  const grupos=tops.map(top=>{
    const cats=CATS.filter(c=>c.top===top);
    const open=!!abiertos[top];
    if(top==="ETICOS"){
      const labs=cats.filter(c=>c.pid!==1);
      const hb=`<span class="badge gen" style="margin-left:8px;background:#7c3aed">reglas por escala A/B · base PVP</span>`;
      const body=open?renderEticos(labs):"";
      return `<div class="grp"><div class="grphead" onclick="toggleGrp('ETICOS')"><span>${open?"▾":"▸"}</span> ETICOS ${hb} <span class="cnt">${labs.length} labs</span></div>${body}</div>`;
    }
    const root=cats.find(c=>c.pid===1);              // la categoría raíz = la que cuelga directo de ALL
    const subs=cats.filter(c=>c.pid!==1).sort((a,b)=>a.full.localeCompare(b.full));
    const body=open ? ((root?filaRoot(root):"")+subs.map(c=>fila(c)).join("")) : "";
    const rr=root?resolver(root.id):null;
    const hb = (rr&&rr.own)?`<span class="badge gen" style="margin-left:8px">regla general</span>`:`<span class="badge no" style="margin-left:8px">sin regla general</span>`;

  }).join("");
  cont.innerHTML=savebar+intro+grupos+renderEtModal();
}

// impacto de una franja: rango de PVP, tope y ~total de compra para llegar al máximo descuento.
function etImpacto(b, hi){
  const M=EYG.money, lo=+b.pvp||0, tope=parseInt(b.tope)||1;
  const rango = hi!=null ? `${M(lo)}–${M(Math.max(lo,hi-1))}` : `${M(lo)} o más`;
  const cnt = (b._n!=null) ? ` · <b>~${b._n}</b> productos hoy` : "";
  if(tope<=1) return `PVP ${rango} → <b>precio único</b> (sin escalera): se venden al precio de 1 caja${cnt}.`;
  return `PVP ${rango} → el máximo descuento cae comprando <b>${tope} caja${tope>1?"s":""}</b>. La escalera baja hasta el <b>piso de margen</b> de la escala (nunca lo perfora), acotada para que comprar más nunca salga menos${cnt}.`;
}

function resumenPvp(r){
  if(!r) return "";
  if(!r.genera) return "NO genera escalera";
  const n=(r.cortes&&r.cortes.length)||(r.desc&&r.desc.length)||0;
  let s="PVP −"+pct(r.recargo)+"% · piso "+pct(r.piso)+"%";
  if(r.descMax) s+=" · desc máx "+pct(r.descMax)+"%";
  s+=" · "+n+" tramos (cantidades del Maestro)";
  return s;
}
// resuelve la regla de un lab ético: propia (CFG.reglas[id]) o la general de su escala (CFG.escala[A|B])
function resolverEtico(id){
  if(CFG.reglas[id]) return {rule:CFG.reglas[id], own:true};
  const e=ESCALA[id];
  if(e && CFG.escala && CFG.escala[e]) return {rule:CFG.escala[e], own:false, fromEsc:e};
  return null;
}

function leerFormPvp(idp){
  const gv=x=>document.getElementById(x).value;
  const genera=document.getElementById(idp+"-genera").checked;
  const recargo=frac(gv(idp+"-desc")), piso=frac(gv(idp+"-piso")), descMax=frac(gv(idp+"-dmax"));
  const n=Math.max(1,Math.min(8, parseInt(gv(idp+"-cortes"))||4));   // cantidad de tramos
  // cortes/desc son placeholders: el motor calcula las CANTIDADES por producto desde el Maestro (Caja x N),
  // igual que el resto de las categorías, y recalcula el descuento por tramo.
  const cortes=cortesEven(1,Math.max(n,2),n);
  const desc=[]; for(let i=0;i<n;i++) desc.push(0);
  return { genera, base:'pvp', recargo, piso, descMax, modo:'auto', unidad:'', cortes, desc, ivaCosto:0 };
}

// cortes enteros parejos de a a b, estrictamente crecientes (placeholder; el motor recalcula por producto)
function cortesEven(a,b,n){ a=Math.max(1,Math.round(a)); if(n<=1) return [a]; if(b<=a) b=a+n-1; const out=[]; for(let i=0;i<n;i++){ let v=Math.round(a+(b-a)*i/(n-1)); if(i>0&&v<=out[i-1]) v=out[i-1]+1; out.push(v); } return out; }

window.guardarRegla = id => {
  const gv=x=>document.getElementById(x).value;
  const genera=document.getElementById("f-genera").checked;
  const n=Math.max(1,Math.min(8, parseInt(gv("f-ncortes"))||4));
  const recargo=frac(gv("f-recargo")), piso=frac(gv("f-piso")), ivaCosto=frac(gv("f-iva"));
  // descuento máximo = el que lleva el último tramo JUSTO al piso de margen (se calcula, no se carga)
  const descMax = (1+recargo)>0 ? Math.max(0, 1 - (1/(1-piso))/(1+recargo)) : 0;
  const desc=[]; for(let i=0;i<n;i++){ desc.push(n===1?0:Math.round((i/(n-1))*descMax*1000)/1000); }
  // modo/unidad/cantidades los deriva el MOTOR por producto (Maestro). Guardamos placeholders para el flat.
  CFG.reglas[id]={ genera, recargo, piso, ivaCosto, modo:"auto", unidad:"", cortes:cortesEven(1,Math.max(n,2),n), desc };
  dirty=true; editId=null; render();
};
// arma el texto plano que lee el cron: una linea por categoria que RESUELVE a una regla que genera
// (con herencia ya aplicada). Formato: catId~recargo~piso~modo~cortes~desc~unidad~ivaCosto
function construirFlat(){
  const out=[];
  CATS.forEach(c=>{
    if(c.top==='ETICOS') return;   // los éticos se manejan por escala/lab abajo (base=pvp)
    const res=resolver(c.id);
    if(res && res.rule && res.rule.genera){
      const r=res.rule;
      out.push([c.id, r.recargo, r.piso, (r.modo||"fijo"), (r.cortes||[]).join(","), (r.desc||[]).join(","), (r.unidad||"unidades"), (r.ivaCosto||0)].join("~"));
    }
  });
  // ETICOS: una línea por lab. Regla propia del lab, o si no la general de su escala. base=pvp (9º), descMax (10º).
  CATS.filter(c=>c.top==='ETICOS' && c.pid!==1).forEach(c=>{
    const res=resolverEtico(c.id);
    if(res && res.rule && res.rule.genera){
      const r=res.rule;
      out.push([c.id, r.recargo, r.piso, (r.modo||"fijo"), (r.cortes||[]).join(","), (r.desc||[]).join(","), (r.unidad||"unidades"), (r.ivaCosto||0), "pvp", (r.descMax||0)].join("~"));
    }
  });
  return out.join("\n");
}
window.guardarTodo = async () => {
  const btn=document.querySelector(".btn-save"); if(btn){ btn.disabled=true; btn.textContent="Guardando…"; }
  try{
    await rpc("ir.config_parameter","set_param",[KEY, JSON.stringify(CFG)]);
    await rpc("ir.config_parameter","set_param",[KEY_ESC, JSON.stringify(ESCALA)]);
    await rpc("ir.config_parameter","set_param",[KEY_FLAT, construirFlat()]);
    if(btn) btn.textContent="Recalculando precios…";
    await rpc("ir.actions.server","run",[[1213]],{context:{lang:"es_AR"}});
    dirty=false; render();
    toast("Guardado y precios recalculados ✓");
  }
  catch(e){ if(btn){ btn.disabled=false; btn.textContent="💾 Guardar cambios"; } toast("Error: "+e.message); }
};
// Recalcula TODOS los precios ya, con las reglas actuales (sin cambiar config). Único lugar de disparo manual.
window.recalcularAhora = async () => {
  if(!confirm("¿Recalcular todos los precios ahora con las reglas actuales? Puede tardar unos segundos.")) return;
  const b=document.querySelector(".btn-recalc"); if(b){ b.disabled=true; b.textContent="⏳ Recalculando…"; }
  try{ await rpc("ir.actions.server","run",[[1213]],{context:{lang:"es_AR"}}); toast("Precios recalculados ✓"); }
  catch(e){ toast("Error: "+esc(e.message)); }
  if(b){ b.disabled=false; b.textContent="⚡ Recalcular precios ahora"; }
};
let tT; function toast(m){ let t=document.getElementById("cptoast"); if(!t){ t=document.createElement("div"); t.id="cptoast"; t.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0E1F1D;color:#fff;padding:11px 20px;border-radius:10px;font-weight:600;z-index:9999;box-shadow:0 8px 26px rgba(0,0,0,.25)"; document.body.appendChild(t);} t.textContent=m; t.style.opacity="1"; clearTimeout(tT); tT=setTimeout(()=>t.style.opacity="0",2600); }
