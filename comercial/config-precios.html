<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuración de precios · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<style>
  .intro{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px;font-size:13.5px;color:var(--gris)}
  .intro b{color:var(--ink)}
  .savebar{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;background:var(--bg);padding:8px 0;margin-bottom:10px}
  .btn-save{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
  .btn-save:hover{background:var(--teal-deep)} .btn-save:disabled{opacity:.5;cursor:default}
  .btn-recalc{background:#f59e0b;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit}
  .btn-recalc:hover{background:#d97706} .btn-recalc:disabled{opacity:.6;cursor:default}
  .dirty{font-size:12.5px;color:#c2410c;font-weight:700}
  .grp{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .grphead{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#f3f8f7;border-bottom:1px solid var(--line);font-weight:800;font-size:14px;cursor:pointer}
  .grphead .cnt{margin-left:auto;font-size:12px;color:var(--gris2);font-weight:700}
  .row{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
  .row.catrule{background:#f3f8f7;border-top:2px solid var(--teal-med)}
  .row.catrule .nm{font-weight:800;color:var(--teal-deep)}
  .row .nm{font-weight:600;font-size:13.5px;min-width:220px;flex:1}
  .row .nm small{color:var(--gris2);font-weight:400}
  .badge{font-size:11px;font-weight:800;border-radius:20px;padding:2px 9px;white-space:nowrap}
  .badge.own{background:#DDF3E6;color:#0E6B39} .badge.gen{background:var(--teal);color:#fff}
  .badge.inh{background:#eef2f1;color:var(--gris)} .badge.no{background:#f6eceb;color:#9a4b48}
  .sum{font-size:11.5px;color:var(--gris);flex-basis:100%;margin-left:2px}
  .btn-mini{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--teal-deep);cursor:pointer;font-family:inherit}
  .btn-mini:hover{border-color:var(--teal-med)}
  .btn-mini.del{color:#b0322f}
  .btn-mini.cons{color:#fff;background:var(--teal);border-color:var(--teal);font-weight:800}
  .btn-mini.cons:hover{background:var(--teal-deep)}
  .form{flex-basis:100%;background:#f8fbfa;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:10px}
  .form .chk{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:14px;cursor:pointer}
  .form .chk input{width:17px;height:17px;accent-color:var(--teal)}
  .form .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 18px}
  .form .fld2{display:flex;flex-direction:column;min-width:0}
  .form .fld2 label{font-size:10.5px;font-weight:800;color:var(--gris);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;line-height:1.2;min-height:24px;display:flex;align-items:flex-end}
  .form .inpu{position:relative;display:flex;align-items:center}
  .form input,.form select{width:100%;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:inherit;box-sizing:border-box;background:#fff}
  .form input:focus,.form select:focus{outline:none;border-color:var(--teal)}
  .form .inpu .suf{position:absolute;right:10px;color:var(--gris2);font-size:12.5px;font-weight:700;pointer-events:none}
  .form .inpu input{padding-right:26px}
  .form .hint{font-size:10.5px;color:var(--gris2);margin-top:5px;font-weight:400;line-height:1.35;min-height:28px}
  .form .fld2.off{opacity:.45}
  .form .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .form .acts button{border:none;border-radius:9px;padding:9px 18px;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit}
  .form .acts .ok{background:var(--teal);color:#fff} .form .acts .ok:hover{background:var(--teal-deep)}
  .form .acts .cancel{background:#fff;border:1px solid var(--line);color:var(--gris)}
  @media(max-width:820px){.form .grid{grid-template-columns:repeat(2,1fr)}}
  .empty{padding:40px;text-align:center;color:var(--gris)}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js"></script>
<script>
const KEY="eyg.sync_precios_config";      // JSON (para este editor)
const KEY_FLAT="eyg.sync_precios_flat";    // texto plano que lee el cron (una regla por linea)
const ROOTS=[24,10,51,11,369,370];         // Hospitalarios, Farmacopea, Descartables, Perfumeria, Equipos, Ortopedia
const esc=EYG.esc, rpc=EYG.rpc;
const MODOS=[["embalaje","Por embalaje (fracciona de la caja real a la caja del nombre)"],["fijo","Fijo (venta por unidad/caja, sin fraccionar)"]];
const DEF={genera:false, recargo:0.80, piso:0.30, modo:"fijo", cortes:[1,10,20,40], desc:[0,0.07,0.14,0.20], unidad:"unidades", ivaCosto:0};
let CATS=[], byId={}, CFG={v:1,reglas:{}}, editId=null, abiertos={}, dirty=false;

const pct=x=>Math.round((x||0)*1000)/10;           // 0.07 -> 7
const frac=x=>{const n=parseFloat(x); return isNaN(n)?0:n/100;};
const listNum=s=>String(s||"").split(/[,;\s]+/).map(x=>parseFloat(x)).filter(x=>!isNaN(x));

async function cargar(){
  const cont=document.getElementById("cont");
  cont.innerHTML='<div class="empty">Cargando categorías y configuración…</div>';
  try{
    // TODAS las categorías: todo lo que cuelga de ALL (incluye Éticos y cualquier categoría nueva a futuro)
    CATS=await rpc("product.category","search_read",[[["id","child_of",1]]],{fields:["id","name","parent_id","complete_name"],limit:5000,context:{lang:"es_AR"}});
    const JUNK_IDS=[1,2,4,294];   // ALL, Varios (default Odoo), Envíos, Redondeo: categorías de sistema, no de productos
    CATS=CATS.filter(c=>!JUNK_IDS.includes(c.id));
    byId={}; CATS.forEach(c=>{ c.full=(c.complete_name||"").replace(/^ALL \/ /,""); c.top=c.full.split(" / ")[0]; c.pid=c.parent_id?c.parent_id[0]:null; byId[c.id]=c; });
    // por defecto: categorías chicas abiertas; las grandes (Éticos) colapsadas para que no pese
    [...new Set(CATS.map(c=>c.top))].forEach(t=>{ if(!(t in abiertos)){ abiertos[t]=CATS.filter(c=>c.top===t&&c.pid!==1).length<=25; } });
    const raw=await rpc("ir.config_parameter","get_param",[KEY]);
    CFG = raw ? JSON.parse(raw) : {v:1,reglas:{}};
    if(!CFG.reglas) CFG.reglas={};
    render();
  }catch(e){ cont.innerHTML='<div class="empty">No pude cargar: '+esc(e.message)+'</div>'; }
}

// resuelve la regla efectiva de una categoría: propia, o heredada del ancestro más cercano
function resolver(id){
  let cur=id, guard=0;
  while(cur && guard++<20){ if(CFG.reglas[cur]) return {rule:CFG.reglas[cur], fromId:cur, own:(cur===id)}; cur=byId[cur]?byId[cur].pid:null; }
  return null;
}
function resumen(r){
  if(!r) return "";
  const p=[];
  if(!r.genera){ p.push("NO genera escalera"); if(r.ivaCosto) p.push("IVA al costo +"+pct(r.ivaCosto)+"%"); return p.join(" · "); }
  const n=(r.desc&&r.desc.length)||(r.cortes&&r.cortes.length)||0;
  const dmax=(r.desc&&r.desc.length)?Math.max.apply(null,r.desc.map(x=>+x||0)):0;
  p.push("recargo "+pct(r.recargo)+"%");
  p.push(n+" tramos · desc máx "+pct(dmax)+"%");
  if((r.modo||"fijo")==="fijo" && r.cortes&&r.cortes.length) p.push("hasta "+r.cortes[r.cortes.length-1]+" "+esc(r.unidad||""));
  else p.push("cantidades por embalaje ("+esc(r.unidad||"")+")");
  if(r.piso)p.push("piso "+pct(r.piso)+"%");
  if(r.ivaCosto) p.push("IVA al costo +"+pct(r.ivaCosto)+"%");
  return p.join(" · ");
}

// firma canónica de una regla, para comparar si dos son idénticas
function firmaRegla(r){ if(!r) return ""; return JSON.stringify([!!r.genera, +r.recargo||0, +r.piso||0, r.modo||"fijo", (r.cortes||[]).join(","), (r.desc||[]).map(Number).join(","), r.unidad||"", +r.ivaCosto||0]); }
// ¿las subcategorías comparten una misma regla que conviene subir a la categoría?
function candidatoConsolidar(rootId){
  const hijos=CATS.filter(x=>x.pid===rootId && CFG.reglas[x.id]);   // subcats con regla PROPIA
  if(hijos.length<2) return null;
  const grupos={};
  hijos.forEach(x=>{ const f=firmaRegla(CFG.reglas[x.id]); (grupos[f]=grupos[f]||[]).push(x.id); });
  let bestF=null,bestN=0;
  Object.entries(grupos).forEach(([f,ids])=>{ if(ids.length>bestN){ bestN=ids.length; bestF=f; } });
  if(bestN<2) return null;                                          // al menos 2 subcats iguales
  const genActual=CFG.reglas[rootId]?firmaRegla(CFG.reglas[rootId]):null;
  if(genActual===bestF) return null;                               // la categoría ya tiene esa misma regla
  return { ids:grupos[bestF], regla:CFG.reglas[grupos[bestF][0]], n:bestN };
}
window.consolidar = rootId => {
  const cand=candidatoConsolidar(rootId); if(!cand) return;
  if(!confirm(`${cand.n} subcategorías tienen la misma regla. La paso a la categoría como general y saco esas ${cand.n} (van a heredarla). Las subcategorías con otra regla quedan igual.`)) return;
  CFG.reglas[rootId]=JSON.parse(JSON.stringify(cand.regla));       // regla general = la común
  cand.ids.forEach(id=>{ delete CFG.reglas[id]; });                // saca las repetidas -> heredan
  dirty=true; editId=null; render();
};
function render(){
  const cont=document.getElementById("cont");
  const tops=[...new Set(CATS.map(c=>c.top))].sort((a,b)=>{const O=["HOSPITALARIOS","FARMACOPEA","DESCARTABLES","PERFUMERIA","EQUIPOS MEDICOS","ORTOPEDIA","ETICOS"];const ia=O.indexOf(a),ib=O.indexOf(b);return (ia<0?9:ia)-(ib<0?9:ib)||a.localeCompare(b);});
  const savebar=`<div class="savebar"><button class="btn-save" ${dirty?"":"disabled"} onclick="guardarTodo()">💾 Guardar cambios</button><button class="btn-recalc" onclick="recalcularAhora()">⚡ Recalcular precios ahora</button>${dirty?'<span class="dirty">Tenés cambios sin guardar</span>':'<span style="font-size:12.5px;color:var(--gris)">Todo guardado</span>'}</div>`;
  const intro=`<div class="intro"><b>Reglas del motor de precios.</b> Definí por categoría (y subcategoría) cómo se arma la escalera: <b>recargo</b> sobre el costo, <b>piso</b> de margen, <b>modo</b> de cortes (embalaje / fijo), <b>cortes</b> y <b>descuento por tramo</b>, <b>unidad</b> e <b>IVA al costo</b>. <b>La subcategoría pisa a la categoría</b>; si no tiene regla propia, hereda del padre. <b>Al guardar, el motor recalcula todos los precios al instante.</b> El costo lo toma solo (más reciente entre manual, compra y estándar); la caja cerrada se maneja por producto en el Maestro.</div>`;
  const grupos=tops.map(top=>{
    const cats=CATS.filter(c=>c.top===top);
    const root=cats.find(c=>c.pid===1);              // la categoría raíz = la que cuelga directo de ALL
    const subs=cats.filter(c=>c.pid!==1).sort((a,b)=>a.full.localeCompare(b.full));
    const open=!!abiertos[top];
    const body=open ? ((root?filaRoot(root):"")+subs.map(c=>fila(c)).join("")) : "";
    const rr=root?resolver(root.id):null;
    const eticos = top==="ETICOS";
    const hb = eticos ? `<span class="badge no" style="margin-left:8px">⚠ Precios por Alfabeta — no cablear acá</span>`
      : ((rr&&rr.own)?`<span class="badge gen" style="margin-left:8px">regla general</span>`:`<span class="badge no" style="margin-left:8px">sin regla general</span>`);
    return `<div class="grp"><div class="grphead" onclick="toggleGrp('${esc(top)}')"><span>${open?"▾":"▸"}</span> ${esc(top)} ${hb} <span class="cnt">${subs.length} subcat.</span></div>${body}</div>`;
  }).join("");
  cont.innerHTML=savebar+intro+grupos;
}

// Regla de TODA la categoría (el nodo raíz). La toman todas las subcategorías que no tengan la suya.
function filaRoot(c){
  const res=resolver(c.id);
  const has=res&&res.own;
  const badge=has?`<span class="badge gen">regla de toda la categoría</span>`:`<span class="badge no">sin regla general</span>`;
  const sum=has?`<div class="sum">${esc(resumen(res.rule))}</div>`
                :`<div class="sum">Poné una regla acá y la toman <b>todas las subcategorías</b> que no tengan la suya propia.</div>`;
  const btns=has
    ? `<button class="btn-mini" onclick="editar(${c.id})">Editar</button><button class="btn-mini del" onclick="quitar(${c.id})">Quitar</button>`
    : `<button class="btn-mini" onclick="editar(${c.id})">+ Regla para toda la categoría</button>`;
  const cand=candidatoConsolidar(c.id);
  const consBtn = cand ? `<button class="btn-mini cons" onclick="consolidar(${c.id})">↑ Consolidar ${cand.n} subcategorías iguales</button>` : "";
  const form=editId===c.id?formHTML(c):"";
  return `<div class="row catrule"><div class="nm">📂 Toda la categoría <small>aplica a las subcategorías sin regla propia</small></div>${badge}${btns}${consBtn}${sum}${form}</div>`;
}
function fila(c){
  const res=resolver(c.id);
  const sub=c.full.includes(" / ")? c.full.split(" / ").slice(1).join(" / ") : "(categoría)";
  let badge, sum="";
  if(res && res.own){ badge=`<span class="badge ${res.rule.genera?'gen':'own'}">regla propia</span>`; sum=`<div class="sum">${esc(resumen(res.rule))}</div>`; }
  else if(res){ badge=`<span class="badge inh">hereda de ${esc(byId[res.fromId]?byId[res.fromId].full:'?')}</span>`; }
  else { badge=`<span class="badge no">sin regla</span>`; }
  const btns = (res&&res.own)
    ? `<button class="btn-mini" onclick="editar(${c.id})">Editar</button><button class="btn-mini del" onclick="quitar(${c.id})">Quitar</button>`
    : `<button class="btn-mini" onclick="editar(${c.id})">+ Regla propia</button>`;
  const form = editId===c.id ? formHTML(c) : "";
  return `<div class="row"><div class="nm">${esc(sub)} <small>#${c.id}</small></div>${badge}${btns}${sum}${form}</div>`;
}

function formHTML(c){
  // base: regla propia si existe, si no una copia de la heredada, si no el default
  const res=resolver(c.id);
  const r = (res&&res.own)? res.rule : (res? res.rule : DEF);
  const modo=r.modo||DEF.modo;
  const nT = (r.desc&&r.desc.length) || (r.cortes&&r.cortes.length) || 4;               // cantidad de tramos
  const descMax = (r.desc&&r.desc.length) ? Math.max.apply(null, r.desc.map(x=>+x||0)) : 0.20;
  const maxQty = (r.cortes&&r.cortes.length) ? r.cortes[r.cortes.length-1] : 10;
  const opts=MODOS.map(([v,t])=>`<option value="${v}" ${v===modo?"selected":""}>${esc(t)}</option>`).join("");
  const fijoOff = modo==="fijo" ? "" : " off";
  return `<div class="form" onclick="event.stopPropagation()">
    <label class="chk"><input type="checkbox" id="f-genera" ${r.genera?"checked":""}> <span>Genera escalera de precios para esta categoría</span></label>
    <div class="grid">
      <div class="fld2"><label>Recargo sobre costo</label><div class="inpu"><input type="number" id="f-recargo" step="1" value="${pct(r.recargo)}"><span class="suf">%</span></div><div class="hint">markup neto · 80 = ×1,80</div></div>
      <div class="fld2"><label>Piso de margen</label><div class="inpu"><input type="number" id="f-piso" step="1" value="${pct(r.piso)}"><span class="suf">%</span></div><div class="hint">margen mínimo · 30 = no baja de 30%</div></div>
      <div class="fld2"><label>Modo de cortes</label><select id="f-modo">${opts}</select><div class="hint">embalaje = medicamentos (auto por producto) · fijo = por unidad/caja</div></div>
      <div class="fld2"><label>Unidad</label><input type="text" id="f-unidad" value="${esc(r.unidad||DEF.unidad)}"><div class="hint">tiras · amp · unidades · cajas</div></div>
      <div class="fld2"><label>Cantidad de tramos</label><input type="number" id="f-ncortes" min="1" max="8" value="${nT}"><div class="hint">cuántos escalones de precio (el sistema calcula las cantidades)</div></div>
      <div class="fld2"><label>Descuento máximo</label><div class="inpu"><input type="number" id="f-descmax" step="1" value="${pct(descMax)}"><span class="suf">%</span></div><div class="hint">el del último tramo; el resto se reparte parejo desde 0</div></div>
      <div class="fld2${fijoOff}"><label>Cantidad máx. (modo fijo)</label><input type="number" id="f-maxqty" min="1" value="${maxQty}"><div class="hint">a partir de esta cantidad, el máximo descuento</div></div>
      <div class="fld2"><label>IVA al costo</label><div class="inpu"><input type="number" id="f-iva" step="0.5" value="${pct(r.ivaCosto)}"><span class="suf">%</span></div><div class="hint">0 = no aplica · 21 = parenterales</div></div>
    </div>
    <div class="acts"><button class="cancel" onclick="editId=null;render()">Cancelar</button><button class="ok" onclick="guardarRegla(${c.id})">Aplicar regla</button></div>
  </div>`;
}
// cortes enteros parejos de a a b, estrictamente crecientes
function cortesEven(a,b,n){ a=Math.max(1,Math.round(a)); if(n<=1) return [a]; if(b<=a) b=a+n-1; const out=[]; for(let i=0;i<n;i++){ let v=Math.round(a+(b-a)*i/(n-1)); if(i>0&&v<=out[i-1]) v=out[i-1]+1; out.push(v); } return out; }

window.toggleGrp = t => { abiertos[t]=!abiertos[t]; render(); };
window.editar = id => { editId=id; const c=byId[id]; if(c) abiertos[c.top]=true; render(); };
window.quitar = id => { if(!confirm("¿Quitar la regla propia de esta categoría? Va a pasar a heredar del padre.")) return; delete CFG.reglas[id]; dirty=true; editId=null; render(); };
window.guardarRegla = id => {
  const gv=x=>document.getElementById(x).value;
  const genera=document.getElementById("f-genera").checked;
  const n=Math.max(1,Math.min(8, parseInt(gv("f-ncortes"))||4));
  const descMax=frac(gv("f-descmax"));
  const modo=gv("f-modo");
  const maxQty=Math.max(1, parseInt(gv("f-maxqty"))||10);
  // descuentos: repartidos PAREJO de 0% al máximo, en n tramos
  const desc=[]; for(let i=0;i<n;i++){ desc.push(n===1?0:Math.round((i/(n-1))*descMax*1000)/1000); }
  // cantidades: modo fijo = parejas 1→máx; modo embalaje = las calcula el motor por producto (placeholder)
  const cortes = modo==="fijo" ? cortesEven(1,maxQty,n) : cortesEven(1,Math.max(n,2),n);
  CFG.reglas[id]={ genera, recargo:frac(gv("f-recargo")), piso:frac(gv("f-piso")), modo, cortes, desc, unidad:(gv("f-unidad")||"unidades").trim(), ivaCosto:frac(gv("f-iva")) };
  dirty=true; editId=null; render();
};
// arma el texto plano que lee el cron: una linea por categoria que RESUELVE a una regla que genera
// (con herencia ya aplicada). Formato: catId~recargo~piso~modo~cortes~desc~unidad~ivaCosto
function construirFlat(){
  const out=[];
  CATS.forEach(c=>{
    const res=resolver(c.id);
    if(res && res.rule && res.rule.genera){
      const r=res.rule;
      out.push([c.id, r.recargo, r.piso, (r.modo||"fijo"), (r.cortes||[]).join(","), (r.desc||[]).join(","), (r.unidad||"unidades"), (r.ivaCosto||0)].join("~"));
    }
  });
  return out.join("\n");
}
window.guardarTodo = async () => {
  const btn=document.querySelector(".btn-save"); if(btn){ btn.disabled=true; btn.textContent="Guardando…"; }
  try{
    await rpc("ir.config_parameter","set_param",[KEY, JSON.stringify(CFG)]);
    await rpc("ir.config_parameter","set_param",[KEY_FLAT, construirFlat()]);
    if(btn) btn.textContent="Recalculando precios…";
    await rpc("ir.actions.server","run",[[1213]],{context:{lang:"es_AR"}});
    dirty=false; render();
    toast("Guardado y precios recalculados ✓");
  }
  catch(e){ if(btn){ btn.disabled=false; btn.textContent="💾 Guardar cambios"; } toast("Error: "+e.message); }
};
// Recalcula TODOS los precios ya, con las reglas actuales (sin cambiar config). Único lugar de disparo manual.
window.recalcularAhora = async () => {
  if(!confirm("¿Recalcular todos los precios ahora con las reglas actuales? Puede tardar unos segundos.")) return;
  const b=document.querySelector(".btn-recalc"); if(b){ b.disabled=true; b.textContent="⏳ Recalculando…"; }
  try{ await rpc("ir.actions.server","run",[[1213]],{context:{lang:"es_AR"}}); toast("Precios recalculados ✓"); }
  catch(e){ toast("Error: "+esc(e.message)); }
  if(b){ b.disabled=false; b.textContent="⚡ Recalcular precios ahora"; }
};
let tT; function toast(m){ let t=document.getElementById("cptoast"); if(!t){ t=document.createElement("div"); t.id="cptoast"; t.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0E1F1D;color:#fff;padding:11px 20px;border-radius:10px;font-weight:600;z-index:9999;box-shadow:0 8px 26px rgba(0,0,0,.25)"; document.body.appendChild(t);} t.textContent=m; t.style.opacity="1"; clearTimeout(tT); tT=setTimeout(()=>t.style.opacity="0",2600); }

EYG.requireAuth(["comercial","lider","finanzas"], perfil=>{
  document.body.innerHTML = EYG.layout(perfil, "config-precios", '<div id="cont"></div>', "Configuración de precios");
  cargar();
});
