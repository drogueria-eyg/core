<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuración de precios · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<style>
  .intro{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px;font-size:13.5px;color:var(--gris)}
  .intro b{color:var(--ink)}
  .savebar{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;background:var(--bg);padding:8px 0;margin-bottom:10px}
  .btn-save{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
  .btn-save:hover{background:var(--teal-deep)} .btn-save:disabled{opacity:.5;cursor:default}
  .btn-recalc{background:#f59e0b;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit}
  .btn-recalc:hover{background:#d97706} .btn-recalc:disabled{opacity:.6;cursor:default}
  .dirty{font-size:12.5px;color:#c2410c;font-weight:700}
  .grp{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .grphead{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#f3f8f7;border-bottom:1px solid var(--line);font-weight:800;font-size:14px;cursor:pointer}
  .grphead .cnt{margin-left:auto;font-size:12px;color:var(--gris2);font-weight:700}
  .row{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
  .row.catrule{background:#f3f8f7;border-top:2px solid var(--teal-med)}
  .row.catrule .nm{font-weight:800;color:var(--teal-deep)}
  .row .nm{font-weight:600;font-size:13.5px;min-width:220px;flex:1}
  .row .nm small{color:var(--gris2);font-weight:400}
  .badge{font-size:11px;font-weight:800;border-radius:20px;padding:2px 9px;white-space:nowrap}
  .badge.own{background:#DDF3E6;color:#0E6B39} .badge.gen{background:var(--teal);color:#fff}
  .badge.inh{background:#eef2f1;color:var(--gris)} .badge.no{background:#f6eceb;color:#9a4b48}
  .sum{font-size:11.5px;color:var(--gris);flex-basis:100%;margin-left:2px}
  .btn-mini{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--teal-deep);cursor:pointer;font-family:inherit}
  .btn-mini:hover{border-color:var(--teal-med)}
  .btn-mini.del{color:#b0322f}
  .btn-mini.cons{color:#fff;background:var(--teal);border-color:var(--teal);font-weight:800}
  .btn-mini.cons:hover{background:var(--teal-deep)}
  .form{flex-basis:100%;background:#f8fbfa;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:10px}
  .form .chk{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:14px;cursor:pointer}
  .form .chk input{width:17px;height:17px;accent-color:var(--teal)}
  .form .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 18px}
  .form .fld2{display:flex;flex-direction:column;min-width:0}
  .form .fld2 label{font-size:10.5px;font-weight:800;color:var(--gris);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;line-height:1.2;min-height:24px;display:flex;align-items:flex-end}
  .form .inpu{position:relative;display:flex;align-items:center}
  .form input,.form select{width:100%;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:inherit;box-sizing:border-box;background:#fff}
  .form input:focus,.form select:focus{outline:none;border-color:var(--teal)}
  .form .inpu .suf{position:absolute;right:10px;color:var(--gris2);font-size:12.5px;font-weight:700;pointer-events:none}
  .form .inpu input{padding-right:26px}
  .form .hint{font-size:10.5px;color:var(--gris2);margin-top:5px;font-weight:400;line-height:1.35;min-height:28px}
  .form .fld2.off{opacity:.45}
  .form .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .form .acts button{border:none;border-radius:9px;padding:9px 18px;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit}
  .form .acts .ok{background:var(--teal);color:#fff} .form .acts .ok:hover{background:var(--teal-deep)}
  .form .acts .cancel{background:#fff;border:1px solid var(--line);color:var(--gris)}
  @media(max-width:820px){.form .grid{grid-template-columns:repeat(2,1fr)}}
  .empty{padding:40px;text-align:center;color:var(--gris)}
  .cptabs{display:flex;gap:6px;margin-bottom:14px}
  .cptab{background:#eef5f4;border:1px solid var(--line);border-radius:10px 10px 0 0;padding:10px 18px;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--gris);cursor:pointer}
  .cptab.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .oflist{display:flex;flex-direction:column;gap:9px}
  .ofrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:11px 14px;flex-wrap:wrap}
  .ofmain{flex:1;min-width:200px}
  .oftgt{font-weight:800;color:var(--ink);font-size:13.5px}
  .ofdet{font-size:12px;color:var(--gris);margin-top:2px}
  .ofbadge{font-size:11px;font-weight:800;border-radius:20px;padding:2px 10px}
  .ofbadge.act{background:#DDF3E6;color:#0E6B39} .ofbadge.pau{background:#fdf0d5;color:#8a5a00} .ofbadge.ven{background:#f6eceb;color:#9a4b48}
  .ofbusq{border:1px solid var(--line);border-radius:0 0 10px 10px;border-top:none;max-height:220px;overflow:auto;background:#fff}
  .ofbitem{padding:8px 11px;font-size:13px;cursor:pointer;border-top:1px solid var(--line)}
  .ofbitem:hover{background:#f2faf8}
  .oftgtsel{font-weight:700;color:var(--teal-deep);display:flex;align-items:center;gap:10px;padding:8px 0}
  .rentbox{margin:2px 0 4px;padding:10px 13px;border-radius:10px;font-size:13px;background:#f3f8f7;border:1px solid var(--line);color:var(--ink);line-height:1.5}
  .rentbox.ok{background:#e7f6ec;border-color:#bfe6cc} .rentbox.low{background:#fdf4e3;border-color:#f0dcae} .rentbox.neg{background:#fbeceb;border-color:#f2c9c6}
  .rentbox b{font-weight:800} .rentbox .sub2{color:var(--gris2);font-size:11.5px;font-weight:600}
  /* panel éticos por escala */
  .escwrap{padding:12px 16px 6px}
  .escbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .escbar .fl{font-size:12px;color:var(--gris);font-weight:700;margin-right:2px}
  .escpill{background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 13px;font-size:12.5px;font-weight:700;color:var(--gris);cursor:pointer;font-family:inherit}
  .escpill.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .esccards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  @media(max-width:720px){.esccards{grid-template-columns:1fr}}
  .esccard{border:1px solid var(--line);border-radius:12px;background:#f8fbfa;padding:13px 15px}
  .esccard.A{border-left:4px solid #0f7d84} .esccard.B{border-left:4px solid #c07216}
  .esccard h4{margin:0 0 3px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
  .esccard .sub{font-size:11.5px;color:var(--gris2);margin-bottom:9px}
  .esccard .sum{font-size:12px;color:var(--gris);margin:6px 0 9px}
  .chipesc{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:6px;font-size:11.5px;font-weight:800;padding:0 6px;cursor:pointer;user-select:none;border:1px solid transparent}
  .chipesc.A{background:#dcefef;color:#0a5a60} .chipesc.B{background:#f6e9d5;color:#8a5210}
  .chipesc.none{background:#eef2f1;color:var(--gris2);border:1px dashed var(--line)}
  .labcol{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .labcol .row{border-top:1px solid var(--line)} .labcol .row:first-child{border-top:none}
  .labcol .row .nm small{color:var(--gris2);font-weight:400}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=5"></script>
<script>
const KEY="eyg.sync_precios_config";      // JSON (para este editor)
const KEY_FLAT="eyg.sync_precios_flat";    // texto plano que lee el cron (una regla por linea)
const KEY_OF="eyg.sync_ofertas";           // JSON de ofertas temporales (editor)
const KEY_OF_FLAT="eyg.sync_ofertas_flat"; // texto plano de ofertas que lee el cron
const ROOTS=[24,10,51,11,369,370];         // Hospitalarios, Farmacopea, Descartables, Perfumeria, Equipos, Ortopedia
const esc=EYG.esc, rpc=EYG.rpc;
const MODOS=[["embalaje","Por embalaje (fracciona de la caja real a la caja del nombre)"],["fijo","Fijo (venta por unidad/caja, sin fraccionar)"]];
const DEF={genera:false, recargo:0.80, piso:0.30, modo:"fijo", cortes:[1,10,20,40], desc:[0,0.07,0.14,0.20], unidad:"unidades", ivaCosto:0};
let CATS=[], byId={}, CFG={v:1,reglas:{}}, editId=null, abiertos={}, dirty=false;
let OFERTAS=[], vista="reglas", ofDraft=null, ofBusq=[], ofBusqQ="";
let ofCosto=null, ofTramos=null, ofTramosBase=null, ofAppliedOffer=null;   // costo, escalera actual, escalera BASE (sin la oferta ya aplicada), y la oferta aplicada al editar
const KEY_ESC="eyg.eticos_escala";       // {subcatId:'A'|'B'} clasificación de labs éticos
let ESCALA={}, escFiltro="todos", editEsc=null, editLab=null;   // clasificación, filtro, regla de escala en edición, regla de lab en edición
const hoyStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};

const pct=x=>Math.round((x||0)*1000)/10;           // 0.07 -> 7
const frac=x=>{const n=parseFloat(x); return isNaN(n)?0:n/100;};
const listNum=s=>String(s||"").split(/[,;\s]+/).map(x=>parseFloat(x)).filter(x=>!isNaN(x));

async function cargar(){
  const cont=document.getElementById("cont");
  cont.innerHTML='<div class="empty">Cargando categorías y configuración…</div>';
  try{
    // TODAS las categorías: todo lo que cuelga de ALL (incluye Éticos y cualquier categoría nueva a futuro)
    CATS=await rpc("product.category","search_read",[[["id","child_of",1]]],{fields:["id","name","parent_id","complete_name"],limit:5000,context:{lang:"es_AR"}});
    const JUNK_IDS=[1,2,4,294];   // ALL, Varios (default Odoo), Envíos, Redondeo: categorías de sistema, no de productos
    CATS=CATS.filter(c=>!JUNK_IDS.includes(c.id));
    byId={}; CATS.forEach(c=>{ c.full=(c.complete_name||"").replace(/^ALL \/ /,""); c.top=c.full.split(" / ")[0]; c.pid=c.parent_id?c.parent_id[0]:null; byId[c.id]=c; });
    // por defecto: categorías chicas abiertas; las grandes (Éticos) colapsadas para que no pese
    [...new Set(CATS.map(c=>c.top))].forEach(t=>{ if(!(t in abiertos)){ abiertos[t]=CATS.filter(c=>c.top===t&&c.pid!==1).length<=25; } });
    const raw=await rpc("ir.config_parameter","get_param",[KEY]);
    CFG = raw ? JSON.parse(raw) : {v:1,reglas:{}};
    if(!CFG.reglas) CFG.reglas={};
    if(!CFG.escala) CFG.escala={A:null,B:null};    // dos reglas por escala (base PVP)
    const rawEsc=await rpc("ir.config_parameter","get_param",[KEY_ESC]);
    ESCALA = rawEsc ? (JSON.parse(rawEsc)||{}) : {};
    const rawOf=await rpc("ir.config_parameter","get_param",[KEY_OF]);
    OFERTAS = rawOf ? (JSON.parse(rawOf)||[]) : [];
    render();
  }catch(e){ cont.innerHTML='<div class="empty">No pude cargar: '+esc(e.message)+'</div>'; }
}

// resuelve la regla efectiva de una categoría: propia, o heredada del ancestro más cercano
function resolver(id){
  let cur=id, guard=0;
  while(cur && guard++<20){ if(CFG.reglas[cur]) return {rule:CFG.reglas[cur], fromId:cur, own:(cur===id)}; cur=byId[cur]?byId[cur].pid:null; }
  return null;
}
function resumen(r){
  if(!r) return "";
  const p=[];
  if(!r.genera){ p.push("NO genera escalera"); if(r.ivaCosto) p.push("IVA al costo +"+pct(r.ivaCosto)+"%"); return p.join(" · "); }
  const n=(r.desc&&r.desc.length)||(r.cortes&&r.cortes.length)||0;
  const dmax=(r.desc&&r.desc.length)?Math.max.apply(null,r.desc.map(x=>+x||0)):0;
  p.push("recargo "+pct(r.recargo)+"%");
  p.push("piso "+pct(r.piso)+"%");
  p.push(n+" tramos · desc máx "+pct(dmax)+"%");
  if(r.ivaCosto) p.push("IVA al costo +"+pct(r.ivaCosto)+"%");
  return p.join(" · ");
}

// firma canónica de una regla, para comparar si dos son idénticas
function firmaRegla(r){ if(!r) return ""; return JSON.stringify([!!r.genera, +r.recargo||0, +r.piso||0, r.modo||"fijo", (r.cortes||[]).join(","), (r.desc||[]).map(Number).join(","), r.unidad||"", +r.ivaCosto||0]); }
// ¿las subcategorías comparten una misma regla que conviene subir a la categoría?
function candidatoConsolidar(rootId){
  const hijos=CATS.filter(x=>x.pid===rootId && CFG.reglas[x.id]);   // subcats con regla PROPIA
  if(hijos.length<2) return null;
  const grupos={};
  hijos.forEach(x=>{ const f=firmaRegla(CFG.reglas[x.id]); (grupos[f]=grupos[f]||[]).push(x.id); });
  let bestF=null,bestN=0;
  Object.entries(grupos).forEach(([f,ids])=>{ if(ids.length>bestN){ bestN=ids.length; bestF=f; } });
  if(bestN<2) return null;                                          // al menos 2 subcats iguales
  const genActual=CFG.reglas[rootId]?firmaRegla(CFG.reglas[rootId]):null;
  if(genActual===bestF) return null;                               // la categoría ya tiene esa misma regla
  return { ids:grupos[bestF], regla:CFG.reglas[grupos[bestF][0]], n:bestN };
}
window.consolidar = rootId => {
  const cand=candidatoConsolidar(rootId); if(!cand) return;
  if(!confirm(`${cand.n} subcategorías tienen la misma regla. La paso a la categoría como general y saco esas ${cand.n} (van a heredarla). Las subcategorías con otra regla quedan igual.`)) return;
  CFG.reglas[rootId]=JSON.parse(JSON.stringify(cand.regla));       // regla general = la común
  cand.ids.forEach(id=>{ delete CFG.reglas[id]; });                // saca las repetidas -> heredan
  dirty=true; editId=null; render();
};
window.setVista = v => { vista=v; ofDraft=null; ofBusq=[]; ofBusqQ=""; render(); };
function render(){
  const cont=document.getElementById("cont");
  const tabs=`<div class="cptabs"><button class="cptab ${vista==='reglas'?'on':''}" onclick="setVista('reglas')">📊 Reglas de precio</button><button class="cptab ${vista==='ofertas'?'on':''}" onclick="setVista('ofertas')">🏷️ Ofertas temporales${OFERTAS.length?' · '+OFERTAS.length:''}</button></div>`;
  if(vista==='ofertas'){ cont.innerHTML=tabs+renderOfertas(); if(ofDraft&&ofDraft.tipo==='p') setTimeout(actualizarRent,0); return; }
  const tops=[...new Set(CATS.map(c=>c.top))].sort((a,b)=>{const O=["HOSPITALARIOS","FARMACOPEA","DESCARTABLES","PERFUMERIA","EQUIPOS MEDICOS","ORTOPEDIA","ETICOS"];const ia=O.indexOf(a),ib=O.indexOf(b);return (ia<0?9:ia)-(ib<0?9:ib)||a.localeCompare(b);});
  const savebar=`<div class="savebar"><button class="btn-save" ${dirty?"":"disabled"} onclick="guardarTodo()">💾 Guardar cambios</button><button class="btn-recalc" onclick="recalcularAhora()">⚡ Recalcular precios ahora</button>${dirty?'<span class="dirty">Tenés cambios sin guardar</span>':'<span style="font-size:12.5px;color:var(--gris)">Todo guardado</span>'}</div>`;
  const intro=`<div class="intro"><b>Reglas del motor de precios.</b> Definí por categoría (y subcategoría) cómo se arma la escalera: <b>recargo</b> sobre el costo, <b>piso</b> de margen, <b>modo</b> de cortes (embalaje / fijo), <b>cortes</b> y <b>descuento por tramo</b>, <b>unidad</b> e <b>IVA al costo</b>. <b>La subcategoría pisa a la categoría</b>; si no tiene regla propia, hereda del padre. <b>Al guardar, el motor recalcula todos los precios al instante.</b> El costo lo toma solo (más reciente entre manual, compra y estándar); la caja cerrada se maneja por producto en el Maestro.</div>`;
  const grupos=tops.map(top=>{
    const cats=CATS.filter(c=>c.top===top);
    const open=!!abiertos[top];
    if(top==="ETICOS"){
      const labs=cats.filter(c=>c.pid!==1);
      const hb=`<span class="badge gen" style="margin-left:8px;background:#7c3aed">reglas por escala A/B · base PVP</span>`;
      const body=open?renderEticos(labs):"";
      return `<div class="grp"><div class="grphead" onclick="toggleGrp('ETICOS')"><span>${open?"▾":"▸"}</span> ETICOS ${hb} <span class="cnt">${labs.length} labs</span></div>${body}</div>`;
    }
    const root=cats.find(c=>c.pid===1);              // la categoría raíz = la que cuelga directo de ALL
    const subs=cats.filter(c=>c.pid!==1).sort((a,b)=>a.full.localeCompare(b.full));
    const body=open ? ((root?filaRoot(root):"")+subs.map(c=>fila(c)).join("")) : "";
    const rr=root?resolver(root.id):null;
    const hb = (rr&&rr.own)?`<span class="badge gen" style="margin-left:8px">regla general</span>`:`<span class="badge no" style="margin-left:8px">sin regla general</span>`;
    return `<div class="grp"><div class="grphead" onclick="toggleGrp('${esc(top)}')"><span>${open?"▾":"▸"}</span> ${esc(top)} ${hb} <span class="cnt">${subs.length} subcat.</span></div>${body}</div>`;
  }).join("");
  cont.innerHTML=tabs+savebar+intro+grupos;
}

/* =================== ETICOS · REGLAS POR ESCALA (base PVP) =================== */
function resumenPvp(r){
  if(!r) return "";
  if(!r.genera) return "NO genera escalera";
  const n=(r.cortes&&r.cortes.length)||0;
  let s="PVP −"+pct(r.recargo)+"% · piso "+pct(r.piso)+"%";
  if(r.descMax) s+=" · desc máx "+pct(r.descMax)+"%";
  s+=" · "+n+" tramos ("+(r.cortes||[]).join("/")+")";
  return s;
}
// resuelve la regla de un lab ético: propia (CFG.reglas[id]) o la general de su escala (CFG.escala[A|B])
function resolverEtico(id){
  if(CFG.reglas[id]) return {rule:CFG.reglas[id], own:true};
  const e=ESCALA[id];
  if(e && CFG.escala && CFG.escala[e]) return {rule:CFG.escala[e], own:false, fromEsc:e};
  return null;
}
function renderEticos(labs){
  const pills=[["todos","Todos"],["A","Escala A"],["B","Escala B"],["none","Sin escala"]].map(([v,t])=>
    `<button class="escpill ${escFiltro===v?'on':''}" onclick="setFiltroEsc('${v}')">${t}</button>`).join("");
  const nA=labs.filter(c=>ESCALA[c.id]==='A').length, nB=labs.filter(c=>ESCALA[c.id]==='B').length, nN=labs.filter(c=>!ESCALA[c.id]).length;
  const bar=`<div class="escbar"><span class="fl">Ver:</span>${pills}<span style="margin-left:auto;font-size:11.5px;color:var(--gris2)">${nA} A · ${nB} B · ${nN} sin escala</span></div>`;
  // reglas GENERALES por escala (fallback de los labs sin regla propia)
  const card=(e,extra)=>{
    const r=CFG.escala&&CFG.escala[e];
    const nlab=labs.filter(c=>ESCALA[c.id]===e).length;
    const has=r&&r.genera;
    const badge=has?`<span class="badge gen">activa</span>`:`<span class="badge no">sin regla</span>`;
    const sum=r?`<div class="sum">${esc(resumenPvp(r))}</div>`:`<div class="sum">Sin definir. La toman los <b>${nlab} labs</b> de escala ${e} que no tengan regla propia.</div>`;
    const btns=r
      ? `<button class="btn-mini" onclick="editarEscala('${e}')">Editar</button><button class="btn-mini del" onclick="quitarEscala('${e}')">Quitar</button>`
      : `<button class="btn-mini" onclick="editarEscala('${e}')">+ Regla general escala ${e}</button>`;
    const form=editEsc===e?formPvpHTML(r||{genera:true,cortes:[1,5,10]}, 'fe', `guardarEscala('${e}')`, 'editEsc=null;render()', 'Escala '+e):"";
    return `<div class="esccard ${e}"><h4><span class="chipesc ${e}">${e}</span> Regla general ${e} <small style="font-weight:600;color:var(--gris2)">${extra}</small> ${badge}</h4><div class="sub">base = PVP de Alfabeta − descuento · piso de margen sobre el costo</div>${sum}${btns}${form}</div>`;
  };

// cortes enteros parejos de a a b, estrictamente crecientes (placeholder; el motor recalcula por producto)
function cortesEven(a,b,n){ a=Math.max(1,Math.round(a)); if(n<=1) return [a]; if(b<=a) b=a+n-1; const out=[]; for(let i=0;i<n;i++){ let v=Math.round(a+(b-a)*i/(n-1)); if(i>0&&v<=out[i-1]) v=out[i-1]+1; out.push(v); } return out; }

window.guardarRegla = id => {
  const gv=x=>document.getElementById(x).value;
  const genera=document.getElementById("f-genera").checked;
  const n=Math.max(1,Math.min(8, parseInt(gv("f-ncortes"))||4));
  const recargo=frac(gv("f-recargo")), piso=frac(gv("f-piso")), ivaCosto=frac(gv("f-iva"));
  // descuento máximo = el que lleva el último tramo JUSTO al piso de margen (se calcula, no se carga)
  const descMax = (1+recargo)>0 ? Math.max(0, 1 - (1/(1-piso))/(1+recargo)) : 0;
  const desc=[]; for(let i=0;i<n;i++){ desc.push(n===1?0:Math.round((i/(n-1))*descMax*1000)/1000); }
  // modo/unidad/cantidades los deriva el MOTOR por producto (Maestro). Guardamos placeholders para el flat.
  CFG.reglas[id]={ genera, recargo, piso, ivaCosto, modo:"auto", unidad:"", cortes:cortesEven(1,Math.max(n,2),n), desc };
  dirty=true; editId=null; render();
};
// arma el texto plano que lee el cron: una linea por categoria que RESUELVE a una regla que genera
// (con herencia ya aplicada). Formato: catId~recargo~piso~modo~cortes~desc~unidad~ivaCosto
function construirFlat(){
  const out=[];
  CATS.forEach(c=>{
    if(c.top==='ETICOS') return;   // los éticos se manejan por escala/lab abajo (base=pvp)
    const res=resolver(c.id);
    if(res && res.rule && res.rule.genera){
      const r=res.rule;
      out.push([c.id, r.recargo, r.piso, (r.modo||"fijo"), (r.cortes||[]).join(","), (r.desc||[]).join(","), (r.unidad||"unidades"), (r.ivaCosto||0)].join("~"));
    }
  });
  // ETICOS: una línea por lab. Regla propia del lab, o si no la general de su escala. base=pvp (9º), descMax (10º).
  CATS.filter(c=>c.top==='ETICOS' && c.pid!==1).forEach(c=>{
    const res=resolverEtico(c.id);
    if(res && res.rule && res.rule.genera){
      const r=res.rule;
      out.push([c.id, r.recargo, r.piso, (r.modo||"fijo"), (r.cortes||[]).join(","), (r.desc||[]).join(","), (r.unidad||"unidades"), (r.ivaCosto||0), "pvp", (r.descMax||0)].join("~"));
    }
  });
  return out.join("\n");
}

  if(q.length<2){ ofBusq=[]; EYG.repintar(render); return; }
  const ql=q.toLowerCase();
  const cats=CATS.filter(c=>c.full.toLowerCase().includes(ql)).slice(0,6).map(c=>({k:'c',id:c.id,name:c.full}));
  let prods=[];
  try{ const ps=await rpc("product.template","search_read",[["|",["name","ilike",q],["default_code","ilike",q]],["name","default_code"]],{limit:8,context:{lang:"es_AR"}}); prods=ps.map(p=>({k:'p',id:p.id,name:p.name,sku:p.default_code})); }catch(e){}
  if(ofBusqQ!==q) return;            // llegó tarde: ya hay una búsqueda más nueva
  ofBusq=cats.concat(prods);
  EYG.repintar(render);
}, 350);
window.elegirTarget = async (k,id,name) => {
  if(!ofDraft) return;
  ofDraft.tipo=k; ofDraft.target=id; ofDraft.targetName=name; ofBusq=[]; ofBusqQ="";
  ofCosto=null; ofTramos=null; ofTramosBase=null; ofAppliedOffer=null;   // producto recién elegido: ninguna oferta de ESTE draft está aplicada
  render();
  if(k==='p'){ await cargarRentProducto(id); actualizarRent(); }
};
// costo (misma recencia que el motor: manual > última compra > estándar) + escalera del producto
async function cargarRentProducto(tmplId){
  try{
    const t=await rpc("product.template","read",[[tmplId],["product_variant_id"]],{context:{lang:"es_AR"}});
    const vid=t&&t[0]&&t[0].product_variant_id&&t[0].product_variant_id[0];
    let costo=0;
    if(vid){
      const pv=await rpc("product.product","read",[[vid],["x_costo_manual","x_costo_manual_date","standard_price"]],{context:{lang:"es_AR"}});
      const p=(pv&&pv[0])||{};
      const m=p.x_costo_manual||0, md=p.x_costo_manual_date||null;
      let uc=0, uf=null;
      try{
        const pol=await rpc("purchase.order.line","search_read",[[["product_id","=",vid],["state","in",["purchase","done"]],["product_qty",">",0]],["price_subtotal","product_qty","date_order"]],{limit:1, order:"date_order desc", context:{lang:"es_AR"}});
        if(pol&&pol[0]&&pol[0].price_subtotal>0){ uc=pol[0].price_subtotal/(pol[0].product_qty||1); uf=pol[0].date_order||null; }
      }catch(e){}
      if(m>0 && ((!uf)||(md&&md>=uf))) costo=m;
      else if(uc>0) costo=uc;
      else if((p.standard_price||0)>0) costo=p.standard_price;
    }
    ofCosto=costo>0?costo:null;
    const its=await rpc("product.pricelist.item","search_read",[[["pricelist_id","=",3],["product_tmpl_id","=",tmplId],["compute_price","=","fixed"]],["min_quantity","fixed_price"]],{limit:50,context:{lang:"es_AR"}});
    its.sort((a,b)=>a.min_quantity-b.min_quantity);
    ofTramos=its.map(i=>({q:i.min_quantity,p:i.fixed_price}));
    ofTramosBase=tramosBaseFrom(ofTramos, ofAppliedOffer);   // deshace la oferta ya aplicada para no descontar dos veces
  }catch(e){ ofCosto=null; ofTramos=null; ofTramosBase=null; }
}
// Recupera la escalera BASE (sin oferta) deshaciendo la oferta que YA está aplicada al pricelist (al editar).
function tramosBaseFrom(tramos, applied){
  if(!tramos) return null;
  if(!applied) return tramos;                                  // oferta nueva: el pricelist ya es la base
  if(applied.pausada || (applied.hasta && applied.hasta < hoyStr())) return tramos;  // no está aplicada
  const v=applied.valor||0;
  if(applied.modo==='pct' && v>0 && v<1) return tramos.map(t=>({q:t.q, p:t.p/(1-v)}));
  if(applied.modo==='monto' && v>0)      return tramos.map(t=>({q:t.q, p:t.p+v}));
  return null;   // 'precio' fijo: la escalera base se perdió (colapsó a un precio único), no se puede recuperar
}
function actualizarRent(){
  const box=document.getElementById("of-rent"); if(!box||!ofDraft) return;
  const modo=(document.getElementById("of-modo")||{}).value||ofDraft.modo;
  const valRaw=parseFloat((document.getElementById("of-valor")||{}).value);
  const rem = modo==='precio' ? true : ((document.getElementById("of-reemplaza")||{}).value==='1');
  const costo=ofCosto;
  const M=n=>"$"+Math.round(n).toLocaleString("es-AR");
  if(costo==null){ box.className="rentbox"; box.innerHTML="No hay costo cargado en Odoo para este producto."; return; }
  if(!(valRaw>0)){ box.className="rentbox"; box.innerHTML=`Cargá el valor para ver la rentabilidad. <span class="sub2">costo ${M(costo)}</span>`; return; }
  const base=(ofTramosBase&&ofTramosBase.length)?ofTramosBase[0].p:null;   // tramo 1 de la escalera BASE (sin oferta)
  const mrg=pr=>pr>0?Math.round((pr-costo)/pr*100):-999;
  const cls=mm=>mm<0?"neg":(mm<15?"low":"ok");
  const finalDe=pr=>modo==='precio'?valRaw:(modo==='monto'?pr-valRaw:pr*(1-valRaw/100));
  if(modo!=='precio' && base==null){ box.className="rentbox"; box.innerHTML="No puedo estimar la escalera base de este producto (la oferta actual es precio fijo o no tiene escalera). Usá <b>Precio fijo</b> para ver la rentabilidad."; return; }
  if(rem || modo==='precio'){
    const pf=modo==='precio'?valRaw:finalDe(base);
    const mm=mrg(pf);
    box.className="rentbox "+cls(mm);
    box.innerHTML=`Precio único <b>${M(pf)}</b> · Rentabilidad <b>${mm}%</b> <span class="sub2">(${M(pf-costo)}/u · costo ${M(costo)})</span>${mm<0?' ⚠️ perdés plata':(mm<15?' · margen ajustado':'')}`;
  } else {
    const t1=ofTramosBase[0], tN=ofTramosBase[ofTramosBase.length-1];
    const p1=finalDe(t1.p), pN=finalDe(tN.p);
    const m1=mrg(p1), mN=mrg(pN);
    box.className="rentbox "+cls(mN);
    const rango = ofTramosBase.length>1 ? `de <b>${m1}%</b> (${t1.q}u → ${M(p1)}) a <b>${mN}%</b> (${tN.q}u → ${M(pN)})` : `<b>${m1}%</b> (${M(p1)})`;
    box.innerHTML=`Sobre la escalera · Rentabilidad ${rango} <span class="sub2">· costo ${M(costo)}</span>${mN<0?' ⚠️ el último tramo pierde plata':(mN<15?' · último tramo ajustado':'')}`;
  }
}
window.guardarOferta = async () => {
  const d=ofDraft; if(!d) return;
  if(!d.target){ alert("Elegí a qué aplica: categoría, subcategoría o producto."); return; }
  d.modo=document.getElementById("of-modo").value;
  const valorRaw=parseFloat(document.getElementById("of-valor").value);
  if(!(valorRaw>0)){ alert("Cargá un valor válido (mayor a 0)."); return; }
  d.valor = d.modo==='pct' ? valorRaw/100 : valorRaw;
  const remEl=document.getElementById("of-reemplaza");
  d.reemplaza = d.modo==='precio' ? true : (remEl && remEl.value==='1');
  d.hasta=document.getElementById("of-hasta").value||"";
  d.stock=document.getElementById("of-stock").value||"";
  const i=OFERTAS.findIndex(o=>o.id===d.id);
  if(i>=0) OFERTAS[i]=d; else OFERTAS.push(d);
  ofDraft=null;
  const esProd = d.tipo==='p';
  if(!esProd) toast("Oferta guardada · aplicando a la categoría (unos segundos)…");
  await guardarOfertasParams(esProd ? d.target : null);
  render(); toast("Oferta guardada y aplicada ✓");
};
window.pausarOferta = async id => { const o=OFERTAS.find(x=>x.id===id); if(!o)return; o.pausada=!o.pausada; await guardarOfertasParams(o.tipo==='p'?o.target:null); render(); toast(o.pausada?"Oferta pausada ✓":"Oferta reanudada ✓"); };
window.eliminarOferta = async id => { const o=OFERTAS.find(x=>x.id===id); if(!o) return; if(!confirm("¿Eliminar esta oferta? Vuelve la escalera normal.")) return; const tgt=o.tipo==='p'?o.target:null; OFERTAS=OFERTAS.filter(x=>x.id!==id); await guardarOfertasParams(tgt); render(); toast("Oferta eliminada ✓"); };

window.guardarTodo = async () => {
  const btn=document.querySelector(".btn-save"); if(btn){ btn.disabled=true; btn.textContent="Guardando…"; }
  try{
    await rpc("ir.config_parameter","set_param",[KEY, JSON.stringify(CFG)]);
    await rpc("ir.config_parameter","set_param",[KEY_ESC, JSON.stringify(ESCALA)]);
    await rpc("ir.config_parameter","set_param",[KEY_FLAT, construirFlat()]);
    if(btn) btn.textContent="Recalculando precios…";
    await rpc("ir.actions.server","run",[[1213]],{context:{lang:"es_AR"}});
    dirty=false; render();
    toast("Guardado y precios recalculados ✓");
  }
  catch(e){ if(btn){ btn.disabled=false; btn.textContent="💾 Guardar cambios"; } toast("Error: "+e.message); }
};
// Recalcula TODOS los precios ya, con las reglas actuales (sin cambiar config). Único lugar de disparo manual.
window.recalcularAhora = async () => {
  if(!confirm("¿Recalcular todos los precios ahora con las reglas actuales? Puede tardar unos segundos.")) return;
  const b=document.querySelector(".btn-recalc"); if(b){ b.disabled=true; b.textContent="⏳ Recalculando…"; }
  try{ await rpc("ir.actions.server","run",[[1213]],{context:{lang:"es_AR"}}); toast("Precios recalculados ✓"); }
  catch(e){ toast("Error: "+esc(e.message)); }
  if(b){ b.disabled=false; b.textContent="⚡ Recalcular precios ahora"; }
};
let tT; function toast(m){ let t=document.getElementById("cptoast"); if(!t){ t=document.createElement("div"); t.id="cptoast"; t.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0E1F1D;color:#fff;padding:11px 20px;border-radius:10px;font-weight:600;z-index:9999;box-shadow:0 8px 26px rgba(0,0,0,.25)"; document.body.appendChild(t);} t.textContent=m; t.style.opacity="1"; clearTimeout(tT); tT=setTimeout(()=>t.style.opacity="0",2600); }

  cargar();
});
