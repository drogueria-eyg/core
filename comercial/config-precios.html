<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=26"></script>
<script>
const KEY="eyg.sync_precios_config";      // JSON (para este editor)
const KEY_FLAT="eyg.sync_precios_flat";    // texto plano que lee el cron (una regla por linea)
// Las ofertas/descuentos temporales (eyg.sync_ofertas) se crean y gestionan en
// "Oportunidades y Ofertas" (inventario/oportunidades.html). Este módulo define
// SOLO las reglas del motor. Ver [[eyg-core-ofertas-arquitectura]].
const ROOTS=[24,10,51,11,369,370];         // Hospitalarios, Farmacopea, Descartables, Perfumeria, Equipos, Ortopedia
const esc=EYG.esc, rpc=EYG.rpc;
const MODOS=[["embalaje","Por embalaje (fracciona de la caja real a la caja del nombre)"],["fijo","Fijo (venta por unidad/caja, sin fraccionar)"]];
const DEF={genera:false, recargo:0.80, piso:0.30, modo:"fijo", cortes:[1,10,20,40], desc:[0,0.07,0.14,0.20], unidad:"unidades", ivaCosto:0};
let CATS=[], byId={}, CFG={v:1,reglas:{}}, editId=null, abiertos={}, dirty=false;
const KEY_ESC="eyg.eticos_escala";       // {subcatId:'A'|'B'} clasificación de labs éticos
let ESCALA={}, escFiltro="todos", editEsc=null, editLab=null;   // clasificación, filtro, regla de escala en edición, regla de lab en edición
// Regla "Escalera de éticos por precio" (el tope de cada ético sale de su PVP) + intervalo del cron del motor.
let ET={on:false, bands:[], descmax:12, minstep:0, open:false}, ETCRON={num:15, type:"minutes"};
// Precios de venta FIJOS temporales (manuales, pisan al motor). Guardados en eyg.precios_fijos_flat.
let FIJOS=[], _fijoSel=null, _fijoTimer=null;
const hoyStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};

const pct=x=>Math.round((x||0)*1000)/10;           // 0.07 -> 7
const frac=x=>{const n=parseFloat(x); return isNaN(n)?0:n/100;};
const listNum=s=>String(s||"").split(/[,;\s]+/).map(x=>parseFloat(x)).filter(x=>!isNaN(x));

async function cargar(){
  const cont=document.getElementById("cont");
  cont.innerHTML='<div class="empty">Cargando categorías y configuración…</div>';
  try{
    // TODAS las categorías: todo lo que cuelga de ALL (incluye Éticos y cualquier categoría nueva a futuro)
    CATS=await rpc("product.category","search_read",[[["id","child_of",1]]],{fields:["id","name","parent_id","complete_name"],limit:5000,context:{lang:"es_AR"}});
    const JUNK_IDS=[1,2,4,294];   // ALL, Varios (default Odoo), Envíos, Redondeo: categorías de sistema, no de productos
    CATS=CATS.filter(c=>!JUNK_IDS.includes(c.id));
    byId={}; CATS.forEach(c=>{ c.full=(c.complete_name||"").replace(/^ALL \/ /,""); c.top=c.full.split(" / ")[0]; c.pid=c.parent_id?c.parent_id[0]:null; byId[c.id]=c; });
    // por defecto: categorías chicas abiertas; las grandes (Éticos) colapsadas para que no pese
    [...new Set(CATS.map(c=>c.top))].forEach(t=>{ if(!(t in abiertos)){ abiertos[t]=CATS.filter(c=>c.top===t&&c.pid!==1).length<=25; } });
    const raw=await rpc("ir.config_parameter","get_param",[KEY]);
    CFG = raw ? JSON.parse(raw) : {v:1,reglas:{}};
    if(!CFG.reglas) CFG.reglas={};
    if(!CFG.escala) CFG.escala={A:null,B:null};    // dos reglas por escala (base PVP)
    const rawEsc=await rpc("ir.config_parameter","get_param",[KEY_ESC]);
    ESCALA = rawEsc ? (JSON.parse(rawEsc)||{}) : {};
    // ---- Escalera de éticos por precio: params + intervalo del cron del motor (id 92) ----
    const etOn=await rpc("ir.config_parameter","get_param",["eyg.eticos_tope_activo"]);
    const etFlat=await rpc("ir.config_parameter","get_param",["eyg.eticos_tope_flat"]);
    const etDm=await rpc("ir.config_parameter","get_param",["eyg.eticos_tope_descmax"]);
    ET.on = (etOn==="1"||etOn===1);
    ET.bands = String(etFlat||"").split("\n").map(l=>l.trim()).filter(l=>l&&l[0]!=="#")
      .map(l=>{const f=l.split("~");return {pvp:parseFloat(f[0])||0, tope:parseInt(f[1])||1};}).sort((a,b)=>a.pvp-b.pvp);
    if(!ET.bands.length) ET.bands=[{pvp:0,tope:12},{pvp:25000,tope:6},{pvp:50000,tope:3},{pvp:100000,tope:2},{pvp:200000,tope:1}];
    const _dm=parseFloat(etDm); ET.descmax = isNaN(_dm)?0:Math.round(_dm*1000)/10;   // 0 = sin tope global (manda el piso)
    const etMs=await rpc("ir.config_parameter","get_param",["eyg.eticos_min_step"]);
    const _ms=parseFloat(etMs); ET.minstep = isNaN(_ms)?0:Math.round(_ms*1000)/10;   // descuento minimo por escalon (0 = off)
    // precios de venta fijos temporales (manuales)
    const rawFijos=await rpc("ir.config_parameter","get_param",["eyg.precios_fijos_flat"]);
    FIJOS=String(rawFijos||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
      const f=l.split("~"), tmpl=parseInt(f[0])||0;
      if(f[1]==="f"||f[1]==="e") return {tmpl, modo:f[1], precio:parseFloat(f[2])||0, descmax:(parseFloat(f[3])||0)*100, tope:parseInt(f[4])||0, perforar:(f[5]==="1"), hasta:(f[6]||"").trim(), pausado:(f[7]==="1"), nombre:(f.slice(8).join("~")||("#"+f[0]))};
      return {tmpl, modo:"f", precio:parseFloat(f[1])||0, descmax:0, tope:0, perforar:false, hasta:(f[2]||"").trim(), pausado:((f[3]||"").trim()==="1"), nombre:(f.slice(4).join("~")||("#"+f[0]))};
    }).filter(f=>f.tmpl);
    try{ const cr=await rpc("ir.cron","read",[[92],["interval_number","interval_type"]]); if(cr&&cr[0]){ ETCRON.num=cr[0].interval_number; ETCRON.type=cr[0].interval_type; } }catch(e){}
    render();
    etLoadCounts();   // trae cuántos productos caen en cada franja (explicador de impacto)
  }catch(e){ cont.innerHTML='<div class="empty">No pude cargar: '+esc(e.message)+'</div>'; }
}

// resuelve la regla efectiva de una categoría: propia, o heredada del ancestro más cercano
function resolver(id){
  let cur=id, guard=0;
  while(cur && guard++<20){ if(CFG.reglas[cur]) return {rule:CFG.reglas[cur], fromId:cur, own:(cur===id)}; cur=byId[cur]?byId[cur].pid:null; }
  return null;
}
function resumen(r){
  if(!r) return "";
  const p=[];
  if(!r.genera){ p.push("NO genera escalera"); if(r.ivaCosto) p.push("IVA al costo +"+pct(r.ivaCosto)+"%"); return p.join(" · "); }
  const n=(r.desc&&r.desc.length)||(r.cortes&&r.cortes.length)||0;
  const dmax=(r.desc&&r.desc.length)?Math.max.apply(null,r.desc.map(x=>+x||0)):0;
  p.push("recargo "+pct(r.recargo)+"%");
  p.push("piso "+pct(r.piso)+"%");
  p.push(n+" tramos · desc máx "+pct(dmax)+"%");
  if(r.ivaCosto) p.push("IVA al costo +"+pct(r.ivaCosto)+"%");
  return p.join(" · ");
}

// firma canónica de una regla, para comparar si dos son idénticas
function firmaRegla(r){ if(!r) return ""; return JSON.stringify([!!r.genera, +r.recargo||0, +r.piso||0, r.modo||"fijo", (r.cortes||[]).join(","), (r.desc||[]).map(Number).join(","), r.unidad||"", +r.ivaCosto||0]); }
// ¿las subcategorías comparten una misma regla que conviene subir a la categoría?
function candidatoConsolidar(rootId){
  const hijos=CATS.filter(x=>x.pid===rootId && CFG.reglas[x.id]);   // subcats con regla PROPIA
  if(hijos.length<2) return null;
  const grupos={};
  hijos.forEach(x=>{ const f=firmaRegla(CFG.reglas[x.id]); (grupos[f]=grupos[f]||[]).push(x.id); });
  let bestF=null,bestN=0;
  Object.entries(grupos).forEach(([f,ids])=>{ if(ids.length>bestN){ bestN=ids.length; bestF=f; } });
  if(bestN<2) return null;                                          // al menos 2 subcats iguales
  const genActual=CFG.reglas[rootId]?firmaRegla(CFG.reglas[rootId]):null;
  if(genActual===bestF) return null;                               // la categoría ya tiene esa misma regla
  return { ids:grupos[bestF], regla:CFG.reglas[grupos[bestF][0]], n:bestN };
}
window.consolidar = rootId => {
  const cand=candidatoConsolidar(rootId); if(!cand) return;
  if(!confirm(`${cand.n} subcategorías tienen la misma regla. La paso a la categoría como general y saco esas ${cand.n} (van a heredarla). Las subcategorías con otra regla quedan igual.`)) return;
  CFG.reglas[rootId]=JSON.parse(JSON.stringify(cand.regla));       // regla general = la común
  cand.ids.forEach(id=>{ delete CFG.reglas[id]; });                // saca las repetidas -> heredan
  dirty=true; editId=null; render();
};
function render(){
  const cont=document.getElementById("cont");
  if(document.getElementById("et-on")) etLeer();   // preserva lo tipeado en la sección de éticos ante cualquier re-render
  const tops=[...new Set(CATS.map(c=>c.top))].sort((a,b)=>{const O=["HOSPITALARIOS","FARMACOPEA","DESCARTABLES","PERFUMERIA","EQUIPOS MEDICOS","ORTOPEDIA","ETICOS"];const ia=O.indexOf(a),ib=O.indexOf(b);return (ia<0?9:ia)-(ib<0?9:ib)||a.localeCompare(b);});
  const savebar=`<div class="savebar"><button class="btn-save" ${dirty?"":"disabled"} onclick="guardarTodo()">💾 Guardar cambios</button><button class="btn-recalc" onclick="recalcularAhora()">⚡ Recalcular precios ahora</button>${dirty?'<span class="dirty">Tenés cambios sin guardar</span>':'<span style="font-size:12.5px;color:var(--gris)">Todo guardado</span>'}<button class="gearbtn" onclick="etOpenModal()" title="Ajuste general del motor: cada cuánto recalcula (aplica a todo el catálogo)">⚙️ General del motor</button></div>`;

function fijoPreviewHTML(){
  if(!_fijoSel) return "";
  if(_fijoSel.loading) return "Trayendo costo y precio base…";

  if(_fijoModo==="e"){
    const dmEl=document.getElementById("fijo-descmax"), tpEl=document.getElementById("fijo-tope");
    const dm=(dmEl?parseFloat(dmEl.value):0)||0, tope=(tpEl&&parseInt(tpEl.value))||0;
    if(!base) return cabecera+" · <i>sin precio base para simular la escalera</i>";
    const topePrecio = base*(1-dm/100);
    const totTope = tope?` · comprando ${tope}: ${EYG.money(topePrecio*tope)}`:"";
    const perf = (topePrecio<cost)?` <span style="color:#b0322f;font-weight:800">⚠ por debajo del costo</span>`:"";
    return `${cabecera}<br>Con desc. máx <b>${Math.round(dm)}%</b>: último escalón <b>${EYG.money(topePrecio)}</b> · margen ${_mrgTxt(topePrecio,cost)}${totTope}${perf}`;
  }
  const prEl=document.getElementById("fijo-precio"); const pr=(prEl?parseFloat(prEl.value):0)||0;
  const neto = pr/(1+iva/100);
  return `${cabecera}<br>Precio fijo final <b>${EYG.money(pr)}</b> (neto ${EYG.money(neto)}${iva?`, IVA ${iva}%`:", exento"}) · margen ${_mrgTxt(neto,cost)}`;
}

// impacto de una franja: rango de PVP, tope y ~total de compra para llegar al máximo descuento.
function etImpacto(b, hi){
  const M=EYG.money, lo=+b.pvp||0, tope=parseInt(b.tope)||1;
  const rango = hi!=null ? `${M(lo)}–${M(Math.max(lo,hi-1))}` : `${M(lo)} o más`;
  const cnt = (b._n!=null) ? ` · <b>~${b._n}</b> productos hoy` : "";
  if(tope<=1) return `PVP ${rango} → <b>precio único</b> (sin escalera): se venden al precio de 1 caja${cnt}.`;
  return `PVP ${rango} → el máximo descuento cae comprando <b>${tope} caja${tope>1?"s":""}</b>. La escalera baja hasta el <b>piso de margen</b> de la escala (nunca lo perfora), acotada para que comprar más nunca salga menos${cnt}.`;
}

/* =================== ETICOS · REGLAS POR ESCALA (base PVP) =================== */
function resumenPvp(r){
  if(!r) return "";
  if(!r.genera) return "NO genera escalera";
  return "PVP −"+pct(r.recargo)+"% (1ª caja) · piso de margen "+pct(r.piso)+"%";
}
// resuelve la regla de un lab ético: propia (CFG.reglas[id]) o la general de su escala (CFG.escala[A|B])
function resolverEtico(id){
  if(CFG.reglas[id]) return {rule:CFG.reglas[id], own:true};
  const e=ESCALA[id];
  if(e && CFG.escala && CFG.escala[e]) return {rule:CFG.escala[e], own:false, fromEsc:e};
  return null;
}
function renderEticos(labs){
  const pills=[["todos","Todos"],["A","Escala A"],["B","Escala B"],["none","Sin escala"]].map(([v,t])=>
    `<button class="escpill ${escFiltro===v?'on':''}" onclick="setFiltroEsc('${v}')">${t}</button>`).join("");
  const nA=labs.filter(c=>ESCALA[c.id]==='A').length, nB=labs.filter(c=>ESCALA[c.id]==='B').length, nN=labs.filter(c=>!ESCALA[c.id]).length;
  const bar=`<div class="escbar"><span class="fl">Ver:</span>${pills}<span style="margin-left:auto;font-size:11.5px;color:var(--gris2)">${nA} A · ${nB} B · ${nN} sin escala</span></div>`;
  // reglas GENERALES por escala (fallback de los labs sin regla propia)
  const card=(e,extra)=>{
    const r=CFG.escala&&CFG.escala[e];
    const nlab=labs.filter(c=>ESCALA[c.id]===e).length;
    const has=r&&r.genera;
    const badge=has?`<span class="badge gen">activa</span>`:`<span class="badge no">sin regla</span>`;
    const sum=r?`<div class="sum">${esc(resumenPvp(r))}</div>`:`<div class="sum">Sin definir. La toman los <b>${nlab} labs</b> de escala ${e} que no tengan regla propia.</div>`;
    const btns=r
      ? `<button class="btn-mini" onclick="editarEscala('${e}')">Editar</button><button class="btn-mini del" onclick="quitarEscala('${e}')">Quitar</button>`
      : `<button class="btn-mini" onclick="editarEscala('${e}')">+ Regla general escala ${e}</button>`;
    const form=editEsc===e?formPvpHTML(r||{genera:true,cortes:[1,5,10]}, 'fe', `guardarEscala('${e}')`, 'editEsc=null;render()', 'Escala '+e):"";
    return `<div class="esccard ${e}"><h4><span class="chipesc ${e}">${e}</span> Regla general ${e} <small style="font-weight:600;color:var(--gris2)">${extra}</small> ${badge}</h4><div class="sub">base = PVP de Alfabeta − descuento · piso de margen sobre el costo</div>${sum}${btns}${form}</div>`;
  };
  const cards=`<div class="esccards">${card('A','marcas')}${card('B','genéricos')}</div>`;
  // lista VERTICAL de labs, con regla propia opcional (pisa a la general de su escala)
  const vis=labs.filter(c=>{ const e=ESCALA[c.id]||null; if(escFiltro==='todos') return true; if(escFiltro==='none') return !e; return e===escFiltro; })
                .sort((a,b)=>a.full.localeCompare(b.full));
  const rows=vis.map(filaEtico).join("") || `<div class="row" style="justify-content:center;color:var(--gris)">No hay labs con este filtro.</div>`;
  const intro=`<div class="intro" style="margin:0 12px 12px">Los éticos se precian desde el <b>PVP de Alfabeta</b> con una <b>regla general por escala (A/B)</b>: descuento sobre PVP (1ª caja) y piso de margen. Cada lab se asigna a una escala tocando su <b>cuadradito A/B</b>. La escalera por cantidad se define arriba (una sola vez, para todos). <b>Los ajustes por laboratorio se descontinuaron</b> — si algún lab tiene una regla propia vieja, sale marcada y se puede quitar.</div>`;
  return `<div class="escwrap">${intro}${renderEtConfig()}${bar}${cards}<div class="labcol">${rows}</div></div>`;
}
// PANEL GENERAL de éticos: perilla + franjas de precio→tope + descuento máximo (una sola vez, para todos)
function renderEtConfig(){
  const sorted=ET.bands;
  const bands=sorted.map((b,i)=>{
    const hi=(i<sorted.length-1)?(+sorted[i+1].pvp||0):null;
    return `<div class="etband">
      <div class="etband-in">
        <span>PVP desde $ <input type="number" id="et-pvp-${i}" value="${b.pvp}" style="width:110px"></span>
        <span>tope <input type="number" id="et-tope-${i}" value="${b.tope}" style="width:58px"> caja(s)</span>
        <button class="btn-mini del" onclick="etDelBand(${i})">quitar</button>
      </div>
      <div class="etband-imp">${etImpacto(b,hi)}</div>
    </div>`;
  }).join("");
  return `<div class="grp" style="margin:0 12px 14px;border:2px solid #7c3aed">
    <div class="grphead" style="cursor:default;background:#f6f2ff">🎯 Escalera de éticos por precio
      <label class="etswitch" style="margin-left:14px"><input type="checkbox" id="et-on" ${ET.on?"checked":""}> ${ET.on?"Activada":"Desactivada"}</label></div>
    <div style="padding:14px">
      <p class="d" style="font-size:12.5px;color:var(--gris);margin:0 0 12px">El <b>tope</b> de la escalera de cada ético sale de su <b>PVP</b>: caro → pocas cajas para el máximo descuento; barato → más. La <b>1ª caja</b> es el precio base (PVP − descuento de su escala) y baja hasta el <b>piso de margen</b>. La cantidad de escalones sale sola del tope. Los "Caja x N&gt;1" no se tocan.</p>
      ${bands}
      <button class="btn-mini" style="border-style:dashed;color:var(--teal-deep)" onclick="etAddBand()">+ agregar franja</button>
      <div class="etinline" style="margin-top:14px">Descuento máximo
        <input type="number" id="et-descmax" value="${ET.descmax||''}" step="1" style="width:60px" min="0" placeholder="0"> %
        <span style="color:var(--gris2);font-size:11.5px">0 = sin tope (baja hasta el piso de cada escala)</span>
      </div>
      <div class="etinline" style="margin-top:10px">Descuento mínimo entre escalones
        <input type="number" id="et-minstep" value="${ET.minstep||''}" step="0.5" style="width:60px" min="0" placeholder="0"> %
        <span style="color:var(--gris2);font-size:11.5px">si el salto por escalón queda por debajo, se eliminan escalones (0 = off)</span>
      </div>
      <p class="etnote"><b>El piso de margen es innegociable: el precio nunca baja de ahí.</b> La profundidad la manda el piso de cada escala (A/B, abajo); el <b>descuento máximo</b> es un tope extra opcional. Con <b>descuento mínimo entre escalones</b>, si el descuento total no alcanza para que cada escalón sea notorio, el motor <b>saca escalones</b> (y si no alcanza ni para dos, queda precio único). La escalera se distribuye sola según el tope para que comprar más nunca salga menos.</p>
      <div style="margin-top:12px"><button class="btn-save" onclick="guardarTopeEticos()">💾 Guardar escalera de éticos</button> <span id="et-msg" style="font-size:12.5px;color:var(--gris);margin-left:8px"></span></div>
    </div>
  </div>`;
}
function filaEtico(c){
  const res=resolverEtico(c.id);
  const e=ESCALA[c.id]||null;
  const chip=`<span class="chipesc ${e||'none'}" title="Cambiar escala" onclick="cicloEscala(${c.id})">${e||'—'}</span>`;
  const sub=c.full.includes(" / ")? c.full.split(" / ").slice(1).join(" / ") : c.name;
  let badge, extra="";
  if(res && res.own){ badge=`<span class="badge own">regla propia (vieja)</span>`; extra=`<button class="btn-mini del" onclick="quitarLabEtico(${c.id})" title="Quitar la regla propia: el lab pasa a usar la general de su escala">Quitar</button>`; }
  else if(res){ badge=`<span class="badge inh">usa escala ${res.fromEsc}</span>`; }
  else { badge=`<span class="badge no">sin escala</span>`; }
  return `<div class="row">${chip}<div class="nm" style="flex:1">${esc(sub)} <small>#${c.id}</small></div>${badge}${extra}</div>`;
}
// formulario PVP compartido (regla general de escala o regla propia de lab). idp = prefijo de ids ('fe'|'fl').
function formPvpHTML(r, idp, saveCall, cancelCall, titulo){
  r=r||{};
  return `<div class="form" onclick="event.stopPropagation()">
    <label class="chk"><input type="checkbox" id="${idp}-genera" ${r.genera?"checked":""}> <span>Genera escalera de precios (${esc(titulo||'')})</span></label>
    <div class="grid" style="grid-template-columns:repeat(2,1fr)">
      <div class="fld2"><label>Descuento sobre PVP</label><div class="inpu"><input type="number" id="${idp}-desc" step="1" value="${r.recargo?pct(r.recargo):''}" placeholder="ej: 33"><span class="suf">%</span></div><div class="hint">base = PVP − este % · es el precio de la 1ª caja</div></div>
      <div class="fld2"><label>Piso de margen</label><div class="inpu"><input type="number" id="${idp}-piso" step="1" value="${r.piso?pct(r.piso):''}" placeholder="ej: 9"><span class="suf">%</span></div><div class="hint">margen mínimo sobre costo · el descuento nunca lo perfora</div></div>
    </div>
    <div class="hint" style="margin-top:9px">El <b>tope de cajas</b> y el <b>descuento máximo</b> se definen una sola vez en <b>🎯 Escalera de éticos por precio</b> (arriba), para todos los éticos. La cantidad de escalones sale sola del tope.</div>
    <div class="acts"><button class="cancel" onclick="${cancelCall}">Cancelar</button><button class="ok" onclick="${saveCall}">Aplicar</button></div>
  </div>`;
}
function leerFormPvp(idp){
  const gv=x=>document.getElementById(x).value;
  const genera=document.getElementById(idp+"-genera").checked;
  const recargo=frac(gv(idp+"-desc")), piso=frac(gv(idp+"-piso"));
  // descuento máximo y cantidad de tramos ya NO se configuran por escala/lab: los maneja la regla general
  // "Escalera de éticos por precio" + el piso. El motor deriva los escalones del tope (precio). descMax=0.
  const n=4; const cortes=cortesEven(1,Math.max(n,2),n); const desc=[]; for(let i=0;i<n;i++) desc.push(0);
  return { genera, base:'pvp', recargo, piso, descMax:0, modo:'auto', unidad:'', cortes, desc, ivaCosto:0 };
}
window.setFiltroEsc = v => { escFiltro=v; render(); };
window.editarEscala = e => { editEsc=e; editLab=null; editId=null; abiertos['ETICOS']=true; render(); };
window.quitarEscala = e => { if(!confirm("¿Quitar la regla general de la escala "+e+"? Los labs sin regla propia dejan de tener regla.")) return; CFG.escala[e]=null; dirty=true; editEsc=null; render(); };
window.guardarEscala = e => { CFG.escala[e]=leerFormPvp('fe'); dirty=true; editEsc=null; render(); };
window.editarLabEtico = id => { editLab=id; editEsc=null; editId=null; abiertos['ETICOS']=true; render(); };
window.quitarLabEtico = id => { if(!confirm("¿Quitar la regla propia de este lab? Vuelve a heredar la general de su escala.")) return; delete CFG.reglas[id]; dirty=true; editLab=null; render(); };
window.guardarLabEtico = id => { CFG.reglas[id]=leerFormPvp('fl'); dirty=true; editLab=null; render(); };
window.cicloEscala = id => { const cur=ESCALA[id]||null; ESCALA[id] = cur==='A'?'B':(cur==='B'?null:'A'); dirty=true; render(); };

// Regla de TODA la categoría (el nodo raíz). La toman todas las subcategorías que no tengan la suya.
function filaRoot(c){
  const res=resolver(c.id);
  const has=res&&res.own;
  const badge=has?`<span class="badge gen">regla de toda la categoría</span>`:`<span class="badge no">sin regla general</span>`;
  const sum=has?`<div class="sum">${esc(resumen(res.rule))}</div>`
                :`<div class="sum">Poné una regla acá y la toman <b>todas las subcategorías</b> que no tengan la suya propia.</div>`;
  const btns=has
    ? `<button class="btn-mini" onclick="editar(${c.id})">Editar</button><button class="btn-mini del" onclick="quitar(${c.id})">Quitar</button>`
    : `<button class="btn-mini" onclick="editar(${c.id})">+ Regla para toda la categoría</button>`;
  const cand=candidatoConsolidar(c.id);
  const consBtn = cand ? `<button class="btn-mini cons" onclick="consolidar(${c.id})">↑ Consolidar ${cand.n} subcategorías iguales</button>` : "";
  const form=editId===c.id?formHTML(c):"";
  return `<div class="row catrule"><div class="nm">📂 Toda la categoría <small>aplica a las subcategorías sin regla propia</small></div>${badge}${btns}${consBtn}${sum}${form}</div>`;
}
function fila(c){
  const res=resolver(c.id);
  const sub=c.full.includes(" / ")? c.full.split(" / ").slice(1).join(" / ") : "(categoría)";
  let badge, sum="";
  if(res && res.own){ badge=`<span class="badge ${res.rule.genera?'gen':'own'}">regla propia</span>`; sum=`<div class="sum">${esc(resumen(res.rule))}</div>`; }
  else if(res){ badge=`<span class="badge inh">hereda de ${esc(byId[res.fromId]?byId[res.fromId].full:'?')}</span>`; }
  else { badge=`<span class="badge no">sin regla</span>`; }
  const btns = (res&&res.own)
    ? `<button class="btn-mini" onclick="editar(${c.id})">Editar</button><button class="btn-mini del" onclick="quitar(${c.id})">Quitar</button>`
    : `<button class="btn-mini" onclick="editar(${c.id})">+ Regla propia</button>`;
  const form = editId===c.id ? formHTML(c) : "";
  return `<div class="row"><div class="nm">${esc(sub)} <small>#${c.id}</small></div>${badge}${btns}${sum}${form}</div>`;
}

function formHTML(c){
  // La categoría solo define la POLÍTICA: recargo, piso, cantidad de tramos, IVA al costo.
  // El resto (modo, unidad, cantidades, descuento máx) lo saca el motor del producto/Maestro.
  const res=resolver(c.id);
  const r = (res&&res.own)? res.rule : (res? res.rule : DEF);
  const nT = (r.desc&&r.desc.length) || (r.cortes&&r.cortes.length) || 4;
  return `<div class="form" onclick="event.stopPropagation()">
    <label class="chk"><input type="checkbox" id="f-genera" ${r.genera?"checked":""}> <span>Genera escalera de precios para esta categoría</span></label>
    <div class="grid">
      <div class="fld2"><label>Recargo sobre costo</label><div class="inpu"><input type="number" id="f-recargo" step="1" value="${pct(r.recargo)}"><span class="suf">%</span></div><div class="hint">markup neto · 80 = ×1,80</div></div>
      <div class="fld2"><label>Piso de margen</label><div class="inpu"><input type="number" id="f-piso" step="1" value="${pct(r.piso)}"><span class="suf">%</span></div><div class="hint">margen mínimo · el último tramo llega justo acá</div></div>
      <div class="fld2"><label>Cantidad de tramos</label><input type="number" id="f-ncortes" min="1" max="8" value="${nT}"><div class="hint">escalones de precio · las cantidades y la unidad salen del Maestro</div></div>
      <div class="fld2"><label>IVA al costo</label><div class="inpu"><input type="number" id="f-iva" step="0.5" value="${pct(r.ivaCosto)}"><span class="suf">%</span></div><div class="hint">0 = no aplica · 21 = parenterales</div></div>
    </div>
    <div class="acts"><button class="cancel" onclick="editId=null;render()">Cancelar</button><button class="ok" onclick="guardarRegla(${c.id})">Aplicar regla</button></div>
  </div>`;
}
// cortes enteros parejos de a a b, estrictamente crecientes (placeholder; el motor recalcula por producto)
function cortesEven(a,b,n){ a=Math.max(1,Math.round(a)); if(n<=1) return [a]; if(b<=a) b=a+n-1; const out=[]; for(let i=0;i<n;i++){ let v=Math.round(a+(b-a)*i/(n-1)); if(i>0&&v<=out[i-1]) v=out[i-1]+1; out.push(v); } return out; }

window.toggleGrp = t => { abiertos[t]=!abiertos[t]; render(); };
window.editar = id => { editId=id; const c=byId[id]; if(c) abiertos[c.top]=true; render(); };
window.quitar = id => { if(!confirm("¿Quitar la regla propia de esta categoría? Va a pasar a heredar del padre.")) return; delete CFG.reglas[id]; dirty=true; editId=null; render(); };
window.guardarRegla = id => {
  const gv=x=>document.getElementById(x).value;
  const genera=document.getElementById("f-genera").checked;
  const n=Math.max(1,Math.min(8, parseInt(gv("f-ncortes"))||4));
  const recargo=frac(gv("f-recargo")), piso=frac(gv("f-piso")), ivaCosto=frac(gv("f-iva"));
  // descuento máximo = el que lleva el último tramo JUSTO al piso de margen (se calcula, no se carga)
  const descMax = (1+recargo)>0 ? Math.max(0, 1 - (1/(1-piso))/(1+recargo)) : 0;
  const desc=[]; for(let i=0;i<n;i++){ desc.push(n===1?0:Math.round((i/(n-1))*descMax*1000)/1000); }
  // modo/unidad/cantidades los deriva el MOTOR por producto (Maestro). Guardamos placeholders para el flat.
  CFG.reglas[id]={ genera, recargo, piso, ivaCosto, modo:"auto", unidad:"", cortes:cortesEven(1,Math.max(n,2),n), desc };
  dirty=true; editId=null; render();
};
// arma el texto plano que lee el cron: una linea por categoria que RESUELVE a una regla que genera
// (con herencia ya aplicada). Formato: catId~recargo~piso~modo~cortes~desc~unidad~ivaCosto
function construirFlat(){
  const out=[];
  CATS.forEach(c=>{
    if(c.top==='ETICOS') return;   // los éticos se manejan por escala/lab abajo (base=pvp)
    const res=resolver(c.id);
    if(res && res.rule && res.rule.genera){
      const r=res.rule;
      out.push([c.id, r.recargo, r.piso, (r.modo||"fijo"), (r.cortes||[]).join(","), (r.desc||[]).join(","), (r.unidad||"unidades"), (r.ivaCosto||0)].join("~"));
    }
  });
  // ETICOS: una línea por lab. Regla propia del lab, o si no la general de su escala. base=pvp (9º), descMax (10º).
  CATS.filter(c=>c.top==='ETICOS' && c.pid!==1).forEach(c=>{
    const res=resolverEtico(c.id);
    if(res && res.rule && res.rule.genera){
      const r=res.rule;
      out.push([c.id, r.recargo, r.piso, (r.modo||"fijo"), (r.cortes||[]).join(","), (r.desc||[]).join(","), (r.unidad||"unidades"), (r.ivaCosto||0), "pvp", (r.descMax||0)].join("~"));
    }
  });
  return out.join("\n");
}
window.guardarTodo = async () => {
  const btn=document.querySelector(".btn-save"); if(btn){ btn.disabled=true; btn.textContent="Guardando…"; }
  try{
    await rpc("ir.config_parameter","set_param",[KEY, JSON.stringify(CFG)]);
    await rpc("ir.config_parameter","set_param",[KEY_ESC, JSON.stringify(ESCALA)]);
    await rpc("ir.config_parameter","set_param",[KEY_FLAT, construirFlat()]);
    if(btn) btn.textContent="Recalculando precios…";
    await rpc("ir.actions.server","run",[[1213]],{context:{lang:"es_AR"}});
    dirty=false; render();
    toast("Guardado y precios recalculados ✓");
  }
  catch(e){ if(btn){ btn.disabled=false; btn.textContent="💾 Guardar cambios"; } toast("Error: "+e.message); }
};
// Recalcula TODOS los precios ya, con las reglas actuales (sin cambiar config). Único lugar de disparo manual.
window.recalcularAhora = async () => {
  if(!confirm("¿Recalcular todos los precios ahora con las reglas actuales? Puede tardar unos segundos.")) return;
  const b=document.querySelector(".btn-recalc"); if(b){ b.disabled=true; b.textContent="⏳ Recalculando…"; }
  try{ await rpc("ir.actions.server","run",[[1213]],{context:{lang:"es_AR"}}); toast("Precios recalculados ✓"); }
  catch(e){ toast("Error: "+esc(e.message)); }
  if(b){ b.disabled=false; b.textContent="⚡ Recalcular precios ahora"; }
};
let tT; function toast(m){ let t=document.getElementById("cptoast"); if(!t){ t=document.createElement("div"); t.id="cptoast"; t.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0E1F1D;color:#fff;padding:11px 20px;border-radius:10px;font-weight:600;z-index:9999;box-shadow:0 8px 26px rgba(0,0,0,.25)"; document.body.appendChild(t);} t.textContent=m; t.style.opacity="1"; clearTimeout(tT); tT=setTimeout(()=>t.style.opacity="0",2600); }
