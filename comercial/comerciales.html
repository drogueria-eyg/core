<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel comerciales · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<style>
  /* ===== 1 · resumen del mes ===== */
  .resumen{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}
  @media(max-width:720px){.resumen{grid-template-columns:1fr 1fr}}
  .rc{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px 16px;box-shadow:var(--shadow)}
  .rc .l{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--gris);font-weight:700}
  .rc .v{font-size:22px;font-weight:900;letter-spacing:-.5px;margin-top:3px}
  .rc .s{font-size:11.5px;color:var(--gris2);margin-top:1px}
  .rc.hoy{background:linear-gradient(145deg,var(--teal),var(--teal-deep));color:#fff}
  .rc.hoy .l,.rc.hoy .s{color:#d9f1ee}
  .rc.link{cursor:pointer;transition:transform .12s,box-shadow .12s;text-decoration:none;color:inherit;display:block}
  .rc.link:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(6,65,62,.12)}
  /* ===== secciones ===== */
  .seccion{font-size:13px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--teal-med);margin:6px 2px 14px;display:flex;align-items:center;gap:9px}
  .seccion .hint{font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--gris2);margin-left:auto}
  .spin-sm{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--teal);border-radius:50%;display:inline-block;animation:spin 1s linear infinite}
  /* ===== 2 · tarjetas de líder (verde teal, resaltan, acentos gold) ===== */
  .lidgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin-bottom:30px}
  .lidcard{position:relative;display:block;background:linear-gradient(145deg,var(--teal),var(--teal-deep));border:1px solid var(--teal-deep);border-radius:18px;padding:20px 22px;box-shadow:0 12px 34px rgba(6,65,62,.22);text-decoration:none;color:#fff;overflow:hidden;transition:transform .14s,box-shadow .14s;cursor:pointer;animation:fadeup .4s both}
  .lidcard:hover{transform:translateY(-3px);box-shadow:0 20px 46px rgba(6,65,62,.32)}
  .lidcard .accent{position:absolute;right:-40px;top:-40px;width:170px;height:170px;background:radial-gradient(circle,rgba(229,169,59,.28),transparent 70%);pointer-events:none}
  .lidcard .lhead{display:flex;align-items:center;gap:12px;margin-bottom:15px;position:relative}
  .lidcard .av{width:46px;height:46px;border-radius:50%;background:var(--gold);color:#3a2c07;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;flex-shrink:0;box-shadow:0 4px 12px rgba(229,169,59,.4)}
  .lidcard .who .role{display:inline-block;background:var(--gold);color:#3a2c07;font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:800;padding:2px 9px;border-radius:20px;margin-bottom:4px}
  .lidcard .who .nm{font-size:20px;font-weight:900;letter-spacing:-.3px;line-height:1.1;color:#fff}
  .lidcard .who .team{font-size:12px;color:#d5f0ec;margin-top:2px}
  .lidcard .go{margin-left:auto;color:var(--gold);font-weight:800;font-size:22px}
  .lidcard .big{display:flex;align-items:baseline;gap:9px;margin-bottom:2px}
  .lidcard .big .v{font-size:27px;font-weight:900;letter-spacing:-.6px;color:#fff}
  .lidcard .biglbl{font-size:11.5px;color:#cdeeea;font-weight:600;margin-bottom:12px}
  .trend{font-size:13px;font-weight:800}
  .up{color:#8FE9A6} .down{color:#FFC7B2}
  .spark{display:flex;align-items:flex-end;gap:3px;height:44px;margin-bottom:6px}
  .spark i{flex:1;background:rgba(255,255,255,.35);border-radius:2px 2px 0 0;min-height:3px}
  .spark i.now{background:var(--gold)}
  .sparklbl{display:flex;justify-content:space-between;font-size:10.5px;color:#cdeeea;margin-bottom:12px}
  .lmetrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;border-top:1px solid rgba(255,255,255,.22);padding-top:13px}
  .lm .ml{font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:#b7e3de;font-weight:700}
  .lm .mv{font-size:15px;font-weight:800;margin-top:2px;color:#fff}
  .activos{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:12px;color:#eafaf8;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 10px}
  .activos .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
  .activos b{color:#fff}
  .lidcard.vacio{cursor:default;opacity:.92;box-shadow:0 8px 22px rgba(6,65,62,.14)}
  .lidcard.vacio:hover{transform:none;box-shadow:0 8px 22px rgba(6,65,62,.14)}
  .lidcard .vaciobox{font-size:12.5px;line-height:1.5;color:#eafaf8;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:12px 14px;margin-top:4px}
  .lidcard .vaciobox b{color:#fff}
  .lidcard .vercartera{display:inline-block;margin-top:12px;background:var(--gold);color:#3a2c07;font-weight:800;font-size:13px;text-decoration:none;border-radius:10px;padding:9px 15px;transition:filter .13s}
  .lidcard .vercartera:hover{filter:brightness(1.06)}
  /* Tarjeta dividida del líder-que-vende (mis ventas | mi equipo) */
  .lidcard.split{padding:0;cursor:default;display:block}
  .lidcard.split .lhead{padding:16px 20px 12px;display:flex;align-items:center;gap:12px;margin:0}
  .splitrow{display:flex;border-top:1px solid rgba(255,255,255,.16)}
  .split .half{flex:1;min-width:0;display:flex;flex-direction:column;padding:15px 18px;text-decoration:none;color:#fff;transition:background .12s}
  .split .half:hover{background:rgba(255,255,255,.08)}
  .split .half+.half{border-left:1px solid rgba(255,255,255,.16)}
  .split .half.team{background:rgba(255,255,255,.05)}
  .hhd{font-size:12px;font-weight:800;color:#d9f1ee;display:flex;align-items:center;gap:6px}
  .hhd .tn{background:rgba(255,255,255,.18);color:#fff;border-radius:20px;padding:0 8px;font-size:11px;font-weight:800}
  .hbig{font-size:21px;font-weight:900;letter-spacing:-.5px;margin-top:7px;color:#fff}
  .hlbl{font-size:11px;color:#a9d8d3}
  .hmini{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:#cdeae6;margin-top:7px}
  .hmini b{font-weight:800;color:#fff}
  .hgo{margin-top:auto;padding-top:12px;font-size:12px;font-weight:800;color:#eafcfa}
  .hvacio{font-size:12px;color:#cdeae6;line-height:1.45;margin-top:8px}
  .lchart{padding:13px 18px 2px;border-top:1px solid rgba(255,255,255,.16)}
  @media(max-width:560px){.splitrow{flex-direction:column}.split .half+.half{border-left:0;border-top:1px solid rgba(255,255,255,.16)}}
  .lidnote{font-size:13px;color:var(--gris2);background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:16px 18px;margin-bottom:24px}
  /* ===== 3 · grilla comerciales ===== */
  .ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px;margin-bottom:34px}
  .ovcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);text-decoration:none;color:inherit;display:block;transition:transform .13s,box-shadow .13s,border-color .13s;animation:fadeup .4s both}
  a.ovcard:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(6,65,62,.12);border-color:var(--teal-med)}
  .ovcard .ct{display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .ovcard h3{font-size:15.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .equipochip{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:20px;background:#EDF5F4;color:var(--teal-deep);white-space:nowrap;margin-left:auto;flex-shrink:0}
  .equipochip.sin{background:#F4EEDF;color:#9a6b00}
  .mrow{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--gris);padding:5px 0;border-top:1px dashed var(--line)}
  .mrow b{color:var(--ink);font-weight:800;font-size:14px}
  .mrow.small{font-size:12px;color:var(--gris2);border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
  .mrow.small .go{color:var(--teal);font-weight:700}
  /* ===== 4 · gestión (apagado, plegable) ===== */
  .gestion{border-top:2px dashed var(--line);padding-top:22px;margin-top:8px}
  .gt{font-size:12.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--gris2);margin-bottom:14px}
  .foldrow{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
  .foldhead{display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer}
  .foldhead:hover{background:#FAFDFC}
  .foldhead .fi{width:38px;height:38px;border-radius:10px;background:var(--agua);color:var(--teal-deep);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .foldhead .ft{flex:1}
  .foldhead .ft b{display:block;font-size:15px;font-weight:800}
  .foldhead .ft span{font-size:12px;color:var(--gris2)}
  .foldhead .chev{color:var(--gris2);font-size:13px;transition:transform .25s}
  .foldrow.open .chev{transform:rotate(180deg)}
  .foldbody{padding:0 18px 18px}
  .pill{background:var(--gold);color:#3a2c07;font-size:11px;font-weight:800;border-radius:20px;padding:2px 9px}
  /* organigrama (dentro del plegable) */
  .org h2{display:none}
  .org .sub{font-size:12.5px;color:var(--gris2);margin:2px 0 14px}
  .org .pick{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .org select{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--surface);color:var(--ink)}
  .org .lbl{font-size:12.5px;font-weight:700;color:var(--gris)}
  .org .team{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .org .mem{display:inline-flex;align-items:center;gap:8px;background:#F1F7F6;border:1px solid var(--line);border-radius:22px;padding:7px 8px 7px 13px;font-size:13.5px;font-weight:700}
  .org .mem .x{border:0;background:#e2ebe9;color:var(--gris);width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
  .org .mem .x:hover{background:var(--coral);color:#fff}
  .org .empty{font-size:13px;color:var(--gris2);padding:6px 0 12px}
  .org .add{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:13px}
  .org .add button{font-family:inherit;font-size:13.5px;font-weight:700;border:0;border-radius:9px;padding:9px 15px;background:var(--teal);color:#fff;cursor:pointer}
  .org .add button:disabled{opacity:.5;cursor:default}
  .org .note{font-size:11.5px;color:var(--gris2);margin-top:10px}
  .otoast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50}
  .otoast.on{opacity:1;transform:translateX(-50%) translateY(0)} .otoast.ok{background:var(--teal-deep)}
  /* archivados (dentro del plegable) */
  .archsub{font-size:12.5px;color:var(--gris2);margin:2px 0 12px}
  .archlist{display:grid;gap:9px}
  .archrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:#FCFBF8;flex-wrap:wrap}
  .archrow .ai{flex:1;min-width:180px}
  .archrow .an{font-weight:800;font-size:14px}
  .archrow .am{font-size:12px;color:var(--gris);margin-top:2px}
  .archrow .am2{font-size:11px;color:var(--gris2);margin-top:2px}
  .archrow .aa{display:flex;gap:8px}
  .archrow .aa button{font-family:inherit;font-size:12.5px;font-weight:700;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;cursor:pointer}
  .archrow .aa .rest{color:var(--teal-deep);border-color:#BFE2DD} .archrow .aa .rest:hover{background:#EAF7F5}
  .archrow .aa .del{color:#B0413E} .archrow .aa .del:hover{background:#FDECEA;border-color:#F0C4BE}
  .dtag{font-size:10.5px;font-weight:800;border-radius:20px;padding:1px 7px;background:#E2F1EF;color:#04635F;white-space:nowrap}
  .desctabs{display:flex;gap:6px;margin:0 0 10px}
  .desctabs button{font-family:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--gris);border-radius:20px;padding:5px 11px;cursor:pointer}
  .desctabs button.on{background:var(--teal);border-color:var(--teal);color:#fff}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=31"></script>
<script>
const M=EYG.money, esc=EYG.esc;
const MESES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
let PERFIL=null;
let STATE={ leaders:[], coms:[], resumen:null };

EYG.requireAuth(["admin","direccion"], perfil=>{
  PERFIL=perfil;
  const main = `
    <div id="resumen"></div>
    <div class="seccion">🏆 Equipos y líderes <span class="hint">tocá una tarjeta para abrir el panel del líder</span></div>
    <div id="lideres"><div class="loading"><div class="spinner"></div>Leyendo el organigrama y las ventas del equipo…</div></div>
    <div class="seccion" id="com-sec" style="display:none">👥 Comerciales <span class="hint" id="com-hint"></span></div>
    <div id="ov"></div>
    <div class="gestion">
      <div class="gt">⚙️ Gestión del equipo</div>
      <div class="foldrow" id="fold-org">
        <div class="foldhead" onclick="toggleFold('org')">
          <div class="fi">🧭</div>
          <div class="ft"><b>Asignar comerciales a líderes</b><span>Mové un comercial de equipo. Se guarda en Odoo al instante.</span></div>
          <div class="chev">▾</div>
        </div>
        <div class="foldbody" style="display:none"><div id="org"></div></div>
      </div>
      <div class="foldrow" id="fold-desc">
        <div class="foldhead" onclick="toggleFold('desc')">
          <div class="fi">🚫</div>
          <div class="ft"><b>Descartados de "A conquistar"</b><span>Prospectos que los comerciales descartaron: archivá o eliminá.</span></div>
          <span class="pill" id="desc-pill" style="display:none"></span>
          <div class="chev" style="margin-left:12px">▾</div>
        </div>
        <div class="foldbody" style="display:none"><div id="desc"></div></div>
      </div>
      <div class="foldrow" id="fold-arch">
        <div class="foldhead" onclick="toggleFold('arch')">
          <div class="fi">🗂️</div>
          <div class="ft"><b>Contactos archivados</b><span>Restaurá o eliminá lo que los líderes archivaron.</span></div>
          <span class="pill" id="arch-pill" style="display:none"></span>
          <div class="chev" style="margin-left:12px">▾</div>
        </div>
        <div class="foldbody" style="display:none"><div id="arch"></div></div>
      </div>
    </div>`;
  document.body.innerHTML = EYG.layout(perfil, "panel", main, "Panel comerciales");
  document.body.insertAdjacentHTML("beforeend",'<div class="otoast" id="otoast"></div>');
  cargar();
  cargarConqPill();   // contador de descartados a revisar (sin abrir la sección)
});
let otoastT;
function otoast(msg, ok){ const t=document.getElementById("otoast"); if(!t)return; t.textContent=msg; t.className="otoast on"+(ok?" ok":""); clearTimeout(otoastT); otoastT=setTimeout(()=>t.className="otoast",2600); }

/* ===== plegables de gestión (carga perezosa: sólo consulta Odoo al abrir) ===== */
let FOLD_LOADED={org:false,arch:false,desc:false};
function toggleFold(k){
  const row=document.getElementById("fold-"+k); if(!row)return;
  const body=row.querySelector(".foldbody"); const open=row.classList.toggle("open");
  body.style.display=open?"block":"none";
  if(open && !FOLD_LOADED[k]){ FOLD_LOADED[k]=true; if(k==="org") montarOrg(); else if(k==="desc") montarDescartados(); else montarArchivados(); }
}

/* ===== carga principal: organigrama → líderes + comerciales + resumen ===== */
function last12(){
  const arr=[]; const now=new Date(); let d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),1));
  for(let i=0;i<12;i++){ arr.unshift({key:`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}`, label:MESES[d.getUTCMonth()]}); d.setUTCMonth(d.getUTCMonth()-1); }
  return arr;
}
async function cargar(){
  const inicioMes = new Date().toISOString().slice(0,8)+"01";
  const hoy = new Date().toISOString().slice(0,10);
  const meses = last12();
  const desde12 = meses[0].key+"-01";
  let EMPS=[], TEAMS=[];
  try{
    [EMPS, TEAMS] = await Promise.all([
      EYG.rpc("hr.employee","search_read",[[["user_id","!=",false]]],{fields:["id","name","user_id","parent_id","department_id"]}),
      EYG.rpc("crm.team","search_read",[[["active","=",true]]],{fields:["id","name","member_ids"]}),
    ]);
  }catch(e){ document.getElementById("lideres").innerHTML='<div class="errbox">No pude leer el organigrama: '+esc(e.message)+'</div>'; return; }

  // Comercial = empleado del departamento VENTAS. Líder = empleado de Ventas que es jefe de otros
  // de Ventas (Marcela), más su propio jefe hacia arriba (Germán: dirección, hoy sin comerciales).
  // El chip de cada comercial sale de su EQUIPO CRM real (Instituciones / Comercial General).
  // Así queda coherente con Odoo: no toma admin/finanzas ni ex-comerciales por colgar del organigrama.
  const empById={}; EMPS.forEach(e=>empById[e.id]=e);
  const teamOfUid={}; (TEAMS||[]).forEach(t=>{ (t.member_ids||[]).forEach(uid=>{ if(!teamOfUid[uid]) teamOfUid[uid]=t.name; }); });
  const isVentas=e=>e.department_id && /ventas/i.test(e.department_id[1]);
  const ventasEmps=EMPS.filter(isVentas);
  const ventasParents=new Set(); ventasEmps.forEach(e=>{ if(e.parent_id) ventasParents.add(e.parent_id[0]); });
  // Líder = quien es JEFE de un comercial de Ventas, esté o no él mismo en Ventas.
  // Cubre a Marcela (líder dentro de Ventas) y a jefes fuera de Ventas como Germán y Diego (Gestión).
  const leaderIds=new Set(EMPS.filter(e=>ventasParents.has(e.id)).map(e=>e.id));
  [...leaderIds].forEach(id=>{ const L=empById[id]; if(L&&L.parent_id){ const p=empById[L.parent_id[0]]; if(p) leaderIds.add(p.id); } });  // + su jefe hacia arriba
  const leaders=EMPS.filter(e=>leaderIds.has(e.id)).sort((a,b)=>a.name.localeCompare(b.name));
  const comEmps=ventasEmps.filter(e=>!leaderIds.has(e.id));   // comerciales = Ventas que no son líderes
  const uidLeaderName={};   // uid del comercial -> nombre del líder (jerarquía hr)
  comEmps.forEach(e=>{ const L=e.parent_id&&empById[e.parent_id[0]]; if(L) uidLeaderName[e.user_id[0]]=L.user_id[1]; });
  const comUids=[...new Set(comEmps.map(e=>e.user_id[0]))];
  const nameOfUid={}; EMPS.forEach(e=>{ nameOfUid[e.user_id[0]]=e.user_id[1]; });
  STATE.leaderEmps=leaders; STATE.comEmps=comEmps; STATE.empById=empById; STATE.teamOfUid=teamOfUid;  // para la herramienta de asignar

  if(!comUids.length){
    document.getElementById("lideres").innerHTML='<div class="lidnote">No hay comerciales en el departamento de <b>Ventas</b> de Odoo todavía.</div>';
    return;
  }

  // Métricas por comercial (uid): cartera + facturado/NC/cobrado del mes + deuda/vencido.
  // ~5 consultas TOTALES agrupadas por partner_id (no una por vendedor). Mismo criterio que antes.
  // Métricas también para los LÍDERES que venden (sus ventas PROPIAS), no sólo los comerciales.
  const leaderUids=[...new Set(leaders.map(L=>L.user_id&&L.user_id[0]).filter(Boolean))];
  const metricUids=[...new Set([...comUids, ...leaderUids])];
  const fac={},nc={},cob={},deuda={},venc={},cartera={},hoyU={};
  metricUids.forEach(u=>{fac[u]=0;nc[u]=0;cob[u]=0;deuda[u]=0;venc[u]=0;cartera[u]=0;hoyU[u]=0;});
  try{
    const parts=await EYG.rpc("res.partner","search_read",[[["user_id","in",metricUids],["customer_rank",">",0]]],{fields:["id","user_id"]});
    const sellerOf={}, allIds=[];
    for(const p of parts){ const u=p.user_id&&p.user_id[0]; if(u==null||!(u in cartera))continue; sellerOf[p.id]=u; cartera[u]++; allIds.push(p.id); }
    const [facG,ncG,cobG,mlAll,hoyG,...series] = await Promise.all([
      allIds.length?EYG.rpc("account.move","read_group",[[["partner_id","in",allIds],["move_type","=","out_invoice"],["state","=","posted"],["invoice_date",">=",inicioMes]],["amount_untaxed:sum"],["partner_id"]],{lazy:false}):[],
      allIds.length?EYG.rpc("account.move","read_group",[[["partner_id","in",allIds],["move_type","=","out_refund"],["state","=","posted"],["invoice_date",">=",inicioMes]],["amount_untaxed:sum"],["partner_id"]],{lazy:false}):[],
      allIds.length?EYG.rpc("account.payment","read_group",[[["partner_id","in",allIds],["payment_type","=","inbound"],["state","=","posted"],["date",">=",inicioMes]],["amount:sum"],["partner_id"]],{lazy:false}):[],
      allIds.length?EYG.rpc("account.move.line","search_read",[[["partner_id","in",allIds],["account_id.account_type","=","asset_receivable"],["parent_state","=","posted"],["full_reconcile_id","=",false]]],{fields:["partner_id","amount_residual","date_maturity"],limit:0}):[],
      EYG.rpc("sale.order","read_group",[[["user_id","in",metricUids],["state","in",["sale","done"]],["date_order",">=",hoy+" 00:00:00"]],["amount_untaxed:sum"],["user_id"]],{lazy:false}),
      ...leaders.map(L=>{ const tu=comEmps.filter(e=>e.parent_id&&e.parent_id[0]===L.id).map(e=>e.user_id[0]);
        const su=[...new Set([L.user_id[0], ...tu])];   // serie TOTAL = líder + su equipo
        return EYG.rpc("sale.order","read_group",[[["user_id","in",su],["state","in",["sale","done"]],["date_order",">=",desde12+" 00:00:00"]],["amount_untaxed:sum"],["date_order:month"]],{lazy:false}); }),
    ]);
    const pidOf=g=>g.partner_id&&g.partner_id[0];
    for(const g of facG){ const u=sellerOf[pidOf(g)]; if(u!=null) fac[u]+=g.amount_untaxed||0; }
    for(const g of ncG){  const u=sellerOf[pidOf(g)]; if(u!=null) nc[u]+=g.amount_untaxed||0; }
    for(const g of cobG){ const u=sellerOf[pidOf(g)]; if(u!=null) cob[u]+=g.amount||0; }
    for(const l of mlAll){ const u=sellerOf[l.partner_id&&l.partner_id[0]]; if(u==null)continue; const r=l.amount_residual||0; if(r>0){ deuda[u]+=r; if(l.date_maturity&&l.date_maturity<hoy) venc[u]+=r; } }
    for(const g of hoyG){ const u=g.user_id&&g.user_id[0]; if(u!=null&&(u in hoyU)) hoyU[u]=g.amount_untaxed||0; }
    // series mensuales por líder (para el mini-gráfico)
    STATE._serieByLeader={};
    leaders.forEach((L,i)=>{ const g=series[i]||[]; const m={}; for(const r of g){ const rg=r.__range&&r.__range["date_order:month"]; const k=rg?rg.from.slice(0,7):null; if(k)m[k]=(m[k]||0)+(r.amount_untaxed||0); } STATE._serieByLeader[L.id]=meses.map(mm=>m[mm.key]||0); });
  }catch(e){ /* seguimos con lo que haya; las tarjetas muestran lo disponible */ STATE._serieByLeader=STATE._serieByLeader||{}; }

  // arma comerciales
  const coms=comUids.map(u=>({ uid:u, name:nameOfUid[u]||("#"+u), leader:uidLeaderName[u]||"", team:teamOfUid[u]||"",
    cartera:cartera[u]||0, factMes:(fac[u]||0)-(nc[u]||0), cobMes:cob[u]||0, deuda:deuda[u]||0, venc:venc[u]||0,
    vencPct:(deuda[u]>0)?Math.round(venc[u]/deuda[u]*100):0 }))
    .sort((a,b)=>b.factMes-a.factMes);

  // arma líderes (agregado del equipo)
  const lcards=leaders.map(L=>{
    const tu=comEmps.filter(e=>e.parent_id&&e.parent_id[0]===L.id).map(e=>e.user_id[0]);
    const s=k=>tu.reduce((a,u)=>a+(({fac:fac,cob:cob,deuda:deuda,venc:venc}[k])[u]||0),0);
    const factMes=tu.reduce((a,u)=>a+((fac[u]||0)-(nc[u]||0)),0);
    const deu=s("deuda"), ven=s("venc");
    const serie=STATE._serieByLeader[L.id]||[];
    const cur=serie.length?serie[serie.length-1]:0, prev=serie.length>1?serie[serie.length-2]:0;
    const lu=L.user_id[0];
    return { empId:L.id, uid:lu, name:L.user_id[1], teamN:tu.length,
      factMes, cobMes:s("cob"), deuda:deu, venc:ven, vencPct:deu>0?Math.round(ven/deu*100):0,
      cartera:tu.reduce((a,u)=>a+(cartera[u]||0),0),
      activosHoy:tu.filter(u=>(hoyU[u]||0)>0).length, hoyMonto:tu.reduce((a,u)=>a+(hoyU[u]||0),0),
      serie, trend:(prev>0)?Math.round((cur-prev)/prev*100):null,
      // ventas PROPIAS del líder (como vendedor)
      ownFactMes:(fac[lu]||0)-(nc[lu]||0), ownCobMes:cob[lu]||0, ownVenc:venc[lu]||0, ownDeuda:deuda[lu]||0,
      ownVencPct:(deuda[lu]||0)>0?Math.round((venc[lu]||0)/deuda[lu]*100):0, ownCartera:cartera[lu]||0, ownHoy:hoyU[lu]||0 };
  });

  lcards.sort((a,b)=>((b.teamN>0)-(a.teamN>0))||(b.factMes-a.factMes));   // primero los líderes con equipo
  STATE.leaders=lcards; STATE.coms=coms;
  const dTot=coms.reduce((a,c)=>a+c.deuda,0), vTot=coms.reduce((a,c)=>a+c.venc,0);
  STATE.resumen={ factMes:coms.reduce((a,c)=>a+c.factMes,0), cobMes:coms.reduce((a,c)=>a+c.cobMes,0),
    activosHoy:comUids.filter(u=>(hoyU[u]||0)>0).length, total:comUids.length,
    hoyMonto:comUids.reduce((a,u)=>a+(hoyU[u]||0),0), venc:vTot, vencPct:dTot>0?Math.round(vTot/dTot*100):0 };
  renderResumen(); renderLideres(); renderComerciales();
}

}

/* ===== Organigrama: asignar/quitar comerciales a un líder (hr.employee.parent_id) =====
   Es la fuente que lee el Panel del Líder. Mover un comercial acá cambia su jefe en Odoo
   y, en el acto, de qué equipo forma parte. Sólo admin/dirección. */
let ORG={ liderEmp:null };
async function montarOrg(){
  const box=document.getElementById("org"); if(!box)return;
  if(!STATE.leaderEmps||!STATE.leaderEmps.length){
    box.innerHTML='<div class="org"><div class="empty">Todavía no cargaron los líderes y comerciales de arriba. Recargá la página si no aparecen.</div></div>'; return;
  }
  ORG.liderEmp = STATE.leaderEmps[0].id;   // Marcela por defecto
  renderOrg();
}
function renderOrg(){
  const box=document.getElementById("org"); if(!box)return;
  const leaders=STATE.leaderEmps||[], coms=STATE.comEmps||[];
  const miembros=coms.filter(e=>e.parent_id&&e.parent_id[0]===ORG.liderEmp).sort((a,b)=>a.name.localeCompare(b.name));
  const candidatos=coms.filter(e=>!(e.parent_id&&e.parent_id[0]===ORG.liderEmp)).sort((a,b)=>a.name.localeCompare(b.name));
  box.innerHTML=`<div class="org">
    <div class="sub">Asigná o quitá comerciales a un líder. Es lo que ve cada líder en su panel. Se guarda en Odoo al instante.</div>
    <div class="pick"><span class="lbl">Líder:</span>
      <select onchange="ORG.liderEmp=parseInt(this.value,10);renderOrg()">
        ${leaders.map(e=>`<option value="${e.id}" ${e.id===ORG.liderEmp?'selected':''}>${esc(e.name)}</option>`).join("")}
      </select>
      <span class="lbl">${miembros.length} comercial${miembros.length===1?"":"es"} en el equipo</span>
    </div>
    <div class="team">
      ${miembros.length?miembros.map(m=>`<span class="mem">${esc(m.name)}<button class="x" title="Quitar del equipo" onclick="quitarMiembro(${m.id})">✕</button></span>`).join("")
        :'<div class="empty">Este líder todavía no tiene comerciales asignados.</div>'}
    </div>
    <div class="add"><span class="lbl">Agregar:</span>
      <select id="org_add">${candidatos.length?candidatos.map(e=>`<option value="${e.id}">${esc(e.name)}${e.parent_id?' · hoy con '+esc(e.parent_id[1]):' · sin líder'}</option>`).join(""):'<option value="">— no hay comerciales para agregar —</option>'}</select>
      <button onclick="addMiembro()" ${candidatos.length?'':'disabled'}>＋ Agregar al equipo</button>
    </div>
    <div class="note">Solo aparecen los <b>comerciales de Ventas</b> y los <b>líderes</b>. Agregar mueve al comercial de un líder a otro. Al cambiar equipos, recargá la página para ver los totales actualizados.</div>
  </div>`;
}
async function addMiembro(){
  const sel=document.getElementById("org_add"); if(!sel||!sel.value)return;
  const empId=parseInt(sel.value,10); const emp=(STATE.comEmps||[]).find(e=>e.id===empId);
  const lider=STATE.empById?STATE.empById[ORG.liderEmp]:null;
  try{
    await EYG.rpc("hr.employee","write",[[empId],{parent_id:ORG.liderEmp}]);
    if(emp) emp.parent_id=[ORG.liderEmp, lider?lider.name:""];
    otoast((emp?emp.name:"Comercial")+" → equipo de "+(lider?lider.name.split(" ")[0]:"")+" ✓", true);
    renderOrg();
  }catch(e){ otoast("No se pudo asignar: "+e.message); }
}
async function quitarMiembro(empId){
  const emp=(STATE.comEmps||[]).find(e=>e.id===empId); if(!emp)return;
  try{
    await EYG.rpc("hr.employee","write",[[empId],{parent_id:false}]);
    emp.parent_id=false;
    otoast((emp.name)+" quitado del equipo ✓", true);
    renderOrg();
  }catch(e){ otoast("No se pudo quitar: "+e.message); }
}

/* ===== Contactos archivados (revisión de la gerencia) =====
   Los líderes archivan con la etiqueta 63 (marca suave, ver panel del líder). Acá el
   nivel superior (gerente) los revisa: restaura (quita la etiqueta) o elimina (unlink). */
const ARCH_TAG=63;
let ARCH={ list:[] };
async function montarArchivados(){
  const box=document.getElementById("arch"); if(!box)return;
  box.innerHTML='<div class="floading" style="padding:12px 0;color:var(--gris)"><span class="spin-sm"></span> Leyendo archivados…</div>';
  try{
    const list=await EYG.rpc("res.partner","search_read",[[["category_id","in",[ARCH_TAG]]]],{fields:["id","name","user_id","city","vat","write_date"],limit:0,context:{active_test:false}});
    const ids=list.map(c=>c.id); let byId={};
    if(ids.length){
      try{ const msgs=await EYG.rpc("mail.message","search_read",[[["model","=","res.partner"],["res_id","in",ids],["body","like","EyG-ARCH"]]],{fields:["res_id","date","body"],order:"date desc",limit:0});
        for(const m of msgs){ if(!byId[m.res_id]){ const mm=(m.body||"").replace(/<[^>]+>/g,"").match(/Archivado por (.+?)(\s*$|<)/); byId[m.res_id]={por:mm?mm[1].trim():"", fecha:(m.date||"").slice(0,10)}; } }
      }catch(e){}
    }
    ARCH.list=list.map(c=>({...c, _arch:byId[c.id]||{}}));
    const pill=document.getElementById("arch-pill"); if(pill && ARCH.list.length){ pill.textContent=ARCH.list.length; pill.style.display="inline-block"; }
    renderArch();
  }catch(e){ box.innerHTML='<div class="empty" style="color:var(--gris2);font-size:13px">No pude leer los archivados: '+esc(e.message)+'</div>'; }
}
function renderArch(){
  const box=document.getElementById("arch"); if(!box)return;
  if(!ARCH.list.length){ box.innerHTML='<div class="archsub">No hay contactos archivados para revisar. 👌</div>'; return; }
  box.innerHTML=`<div class="archsub">Los líderes los archivaron para que decidas: restaurarlos o eliminarlos. Eliminar es definitivo.</div>
    <div class="archlist">
      ${ARCH.list.map(c=>`<div class="archrow" id="arch-${c.id}">
        <div class="ai"><div class="an">${esc(c.name||'(sin nombre)')}</div>
          <div class="am">${c.user_id?'👤 '+esc(c.user_id[1]):'sin comercial'}${c.city?' · '+esc(c.city):''}${c.vat?' · '+esc(c.vat):''}</div>
          <div class="am2">🗂️ Archivado${c._arch.por?' por '+esc(c._arch.por):''}${c._arch.fecha?' · '+c._arch.fecha:''}</div></div>
        <div class="aa">
          <button class="rest" onclick="restaurarArch(${c.id})">↩ Restaurar</button>
          <button class="del" onclick="eliminarArch(${c.id})">🗑 Eliminar</button>
        </div>
      </div>`).join("")}
    </div>`;
}
function updArchPill(){ const pill=document.getElementById("arch-pill"); if(!pill)return; if(ARCH.list.length){ pill.textContent=ARCH.list.length; pill.style.display="inline-block"; } else pill.style.display="none"; }
async function restaurarArch(id){
  const c=ARCH.list.find(x=>x.id===id); if(!c)return;
  try{
    await EYG.rpc("res.partner","write",[[id],{category_id:[[3,ARCH_TAG]]}]);
    ARCH.list=ARCH.list.filter(x=>x.id!==id);
    otoast("Restaurado ✓ — vuelve a la lista del comercial", true);
    renderArch(); updArchPill();
  }catch(e){ otoast("No se pudo restaurar: "+e.message); }
}
async function eliminarArch(id){
  const c=ARCH.list.find(x=>x.id===id); if(!c)return;
  if(!confirm('¿ELIMINAR definitivamente «'+(c.name||"este contacto")+'»?\n\nEsta acción no se puede deshacer.')) return;
  try{
    await EYG.rpc("res.partner","unlink",[[id]]);
    ARCH.list=ARCH.list.filter(x=>x.id!==id);
    otoast("Eliminado ✓", true);
    renderArch(); updArchPill();
  }catch(e){
    try{ await EYG.rpc("res.partner","write",[[id],{active:false}]); }catch(e2){}
    otoast("No se puede borrar (tiene movimientos). Quedó archivado y desactivado.", false);
    ARCH.list=ARCH.list.filter(x=>x.id!==id);
    renderArch(); updArchPill();
  }
}

/* ===== Descartados de "A conquistar" (revisión de la gerencia) =====
   Los comerciales descartan prospectos (con motivo); acá el nivel superior decide:
   archivar (guardar el registro), eliminar (definitivo) o reactivar (vuelve al comercial). */
let CONQ=[], DESC_ARCH=false, MIS_COM=null;
// Sólo los descartes de comerciales de MI equipo (subárbol del organigrama del que mira).
const _nrm=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
function enMiEquipo(com){ if(!MIS_COM||!MIS_COM.size) return true; const n=_nrm(com); for(const x of MIS_COM){ if(_nrm(x)===n) return true; } return false; }
async function cargarMiEquipo(){ if(MIS_COM!==null) return; try{ MIS_COM=await EYG.orgDescendientes((PERFIL&&(PERFIL.nombre||PERFIL.comercial_ref))||""); }catch(e){ MIS_COM=new Set(); } }
function descActivos(){ return (CONQ||[]).filter(x=>x&&x.descartado&&!x.archivado&&enMiEquipo(x.com)); }
function updDescPill(){ const p=document.getElementById("desc-pill"); if(!p)return; const n=descActivos().length; if(n){ p.textContent=n; p.style.display="inline-block"; } else p.style.display="none"; }
async function cargarConqPill(){ await cargarMiEquipo(); try{ CONQ=await EYG.conquistarLeer(); }catch(e){ CONQ=[]; } updDescPill(); }
async function montarDescartados(){
  const box=document.getElementById("desc"); if(!box)return;
  box.innerHTML='<div class="floading" style="padding:12px 0;color:var(--gris)"><span class="spin-sm"></span> Leyendo descartados…</div>';
  await cargarMiEquipo();
  try{ CONQ=await EYG.conquistarLeer(); }catch(e){ CONQ=[]; }
  renderDesc(); updDescPill();
}
function renderDesc(){
  const box=document.getElementById("desc"); if(!box)return;
  const act=descActivos(), arch=(CONQ||[]).filter(x=>x&&x.descartado&&x.archivado&&enMiEquipo(x.com));
  const list=DESC_ARCH?arch:act;
  const fD=s=>s?(String(s).slice(8,10)+"/"+String(s).slice(5,7)):"";
  const item=x=>`<div class="archrow">
      <div class="ai"><div class="an">${esc(x.nombre)} <span class="dtag">${x.tipo===1?"🏥 Institución":"💊 Farmacia"}</span></div>
        <div class="am">${esc(x.loc||"")}${x.prov?" · "+esc(x.prov):""}${x.dom?" · "+esc(x.dom):""}</div>
        <div class="am2">🚫 <b>${esc((x.descartado&&x.descartado.motivo)||"")}</b> · descartó ${esc((x.descartado&&x.descartado.por)||x.com||"")}${(x.descartado&&x.descartado.ts)?" · "+fD(x.descartado.ts.slice(0,10)):""}</div></div>
      <div class="aa">
        ${DESC_ARCH?`<button class="rest" onclick="reactivarDesc('${x.id}')">↩ Reactivar</button>`:`<button class="rest" onclick="archivarDescA('${x.id}')">🗂️ Archivar</button>`}
        <button class="del" onclick="eliminarDescA('${x.id}')">🗑 Eliminar</button>
      </div></div>`;
  box.innerHTML=`<div class="archsub">Contactos que los comerciales descartaron de "A conquistar". Revisá el motivo y decidí: <b>Archivar</b> (guardar el registro), <b>Eliminar</b> (definitivo) o <b>Reactivar</b> (vuelve como pendiente al comercial).</div>
    <div class="desctabs"><button class="${!DESC_ARCH?"on":""}" onclick="DESC_ARCH=false;renderDesc()">A revisar (${act.length})</button><button class="${DESC_ARCH?"on":""}" onclick="DESC_ARCH=true;renderDesc()">Archivados (${arch.length})</button></div>
    ${list.length?`<div class="archlist">${list.map(item).join("")}</div>`:`<div class="archsub">${DESC_ARCH?"No hay archivados.":"Nada para revisar. 👌"}</div>`}`;
}
async function archivarDescA(id){ try{ await EYG.conquistarPatch(id,{archivado:true}); }catch(e){} try{ CONQ=await EYG.conquistarLeer(); }catch(e){} renderDesc(); updDescPill(); otoast("Archivado ✓", true); }
async function reactivarDesc(id){ try{ await EYG.conquistarPatch(id,{descartado:null,archivado:false}); }catch(e){} try{ CONQ=await EYG.conquistarLeer(); }catch(e){} renderDesc(); updDescPill(); otoast("Reactivado ✓ — vuelve al comercial", true); }
async function eliminarDescA(id){ const x=(CONQ||[]).find(y=>y&&y.id===id); if(!confirm('¿ELIMINAR definitivamente «'+((x&&x.nombre)||"este prospecto")+'»?\n\nNo se puede deshacer.')) return; try{ await EYG.conquistarQuitar(id); }catch(e){} try{ CONQ=await EYG.conquistarLeer(); }catch(e){} renderDesc(); updDescPill(); otoast("Eliminado ✓", true); }
</script>
</body>
</html>
