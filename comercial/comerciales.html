<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel comerciales · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<style>
  .ovfeat{margin-bottom:26px}
  .lidercard{display:block;background:linear-gradient(140deg,var(--teal),var(--teal-deep));color:#fff;border-radius:18px;padding:24px 26px;box-shadow:0 12px 34px rgba(6,65,62,.22);position:relative;overflow:hidden;text-decoration:none;transition:transform .14s,box-shadow .14s}
  a.lidercard:hover{transform:translateY(-3px);box-shadow:0 18px 44px rgba(6,65,62,.3)}
  .lidercard::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;background:radial-gradient(circle,rgba(95,200,191,.35),transparent 70%)}
  .lidercard .lb{display:inline-block;background:var(--gold);color:#3a2c07;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:12px}
  .lidercard .lic{font-size:30px;position:absolute;right:26px;top:22px}
  .lidercard h3{font-size:22px;font-weight:800;margin-bottom:6px}
  .lidercard p{font-size:14px;color:#eafaf8;max-width:560px}
  .lidercard .go{margin-top:14px;font-weight:800;font-size:14px}
  .lidercard.soon{opacity:.9;cursor:default} .lidercard.soon .go{opacity:.75}
  .ovh{font-size:14px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--teal-med);margin:6px 0 14px;display:flex;align-items:center;gap:10px}
  .ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
  .ovcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);text-decoration:none;color:inherit;display:block;transition:transform .13s,box-shadow .13s,border-color .13s;animation:fadeup .4s both}
  a.ovcard:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(6,65,62,.13);border-color:var(--teal-med)}
  .ovcard h3{font-size:16px;font-weight:800;margin-bottom:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mrow{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--gris);padding:5px 0;border-top:1px dashed var(--line)}
  .mrow b{color:var(--ink);font-weight:800;font-size:14px}
  .mrow.small{font-size:12px;color:var(--gris2);border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
  .mrow.small .go{color:var(--teal);font-weight:700}
  .spin-sm{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--teal);border-radius:50%;display:inline-block;animation:spin 1s linear infinite}
  /* organigrama (admin) */
  .org{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:26px}
  .org h2{font-size:16px;font-weight:800;display:flex;align-items:center;gap:9px}
  .org .sub{font-size:12.5px;color:var(--gris2);margin:2px 0 14px}
  .org .pick{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .org select{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--surface);color:var(--ink)}
  .org .lbl{font-size:12.5px;font-weight:700;color:var(--gris)}
  .org .team{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .org .mem{display:inline-flex;align-items:center;gap:8px;background:#F1F7F6;border:1px solid var(--line);border-radius:22px;padding:7px 8px 7px 13px;font-size:13.5px;font-weight:700}
  .org .mem .x{border:0;background:#e2ebe9;color:var(--gris);width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
  .org .mem .x:hover{background:var(--coral);color:#fff}
  .org .empty{font-size:13px;color:var(--gris2);padding:6px 0 12px}
  .org .add{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:13px}
  .org .add button{font-family:inherit;font-size:13.5px;font-weight:700;border:0;border-radius:9px;padding:9px 15px;background:var(--teal);color:#fff;cursor:pointer}
  .org .add button:disabled{opacity:.5;cursor:default}
  .org .note{font-size:11.5px;color:var(--gris2);margin-top:10px}
  .otoast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50}
  .otoast.on{opacity:1;transform:translateX(-50%) translateY(0)} .otoast.ok{background:var(--teal-deep)}
  /* archivados */
  .archlist{display:grid;gap:9px;margin-top:6px}
  .archrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:#FCFBF8;flex-wrap:wrap}
  .archrow .ai{flex:1;min-width:180px}
  .archrow .an{font-weight:800;font-size:14px}
  .archrow .am{font-size:12px;color:var(--gris);margin-top:2px}
  .archrow .am2{font-size:11px;color:var(--gris2);margin-top:2px}
  .archrow .aa{display:flex;gap:8px}
  .archrow .aa button{font-family:inherit;font-size:12.5px;font-weight:700;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;cursor:pointer}
  .archrow .aa .rest{color:var(--teal-deep);border-color:#BFE2DD} .archrow .aa .rest:hover{background:#EAF7F5}
  .archrow .aa .del{color:#B0413E} .archrow .aa .del:hover{background:#FDECEA;border-color:#F0C4BE}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=13"></script>
<script>
let PERFIL=null;
EYG.requireAuth(["admin","direccion"], perfil=>{
  PERFIL=perfil;
  document.body.innerHTML = EYG.layout(perfil, "panel", '<div id="org"></div><div id="arch"></div><div id="ov"><div class="loading"><div class="spinner"></div>Cargando el equipo desde Odoo…</div></div>', "Panel comerciales");
  document.body.insertAdjacentHTML("beforeend",'<div class="otoast" id="otoast"></div>');
  cargar();
  if(perfil.rol==="admin"||perfil.rol==="direccion"){ montarOrg(); montarArchivados(); }
});
let otoastT;
function otoast(msg, ok){ const t=document.getElementById("otoast"); if(!t)return; t.textContent=msg; t.className="otoast on"+(ok?" ok":""); clearTimeout(otoastT); otoastT=setTimeout(()=>t.className="otoast",2600); }

/* ===== Organigrama: asignar/quitar comerciales a un líder (hr.employee.parent_id) =====
   Es la fuente que lee el Panel del Líder. Mover un comercial acá cambia su jefe en Odoo
   y, en el acto, de qué equipo forma parte. Sólo admin/dirección. */
let ORG={ emps:[], liderEmp:null };
async function montarOrg(){
  const box=document.getElementById("org"); if(!box)return;
  box.innerHTML='<div class="org"><h2>🧭 Equipos comerciales</h2><div class="floading" style="padding:12px 0;color:var(--gris)"><span class="spin-sm"></span> Leyendo el organigrama…</div></div>';
  try{
    // empleados que tienen cuenta de usuario = candidatos a líder o miembro
    ORG.emps = await EYG.rpc("hr.employee","search_read",[[["user_id","!=",false]]],{fields:["id","name","user_id","parent_id"]});
    // líder por defecto: el que más subordinados-con-usuario tiene
    const conHijos = ORG.emps.map(e=>({e, n:ORG.emps.filter(x=>x.parent_id&&x.parent_id[0]===e.id).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
    ORG.liderEmp = conHijos.length?conHijos[0].e.id:ORG.emps[0].id;
    renderOrg();
  }catch(e){ box.innerHTML='<div class="org"><h2>🧭 Equipos comerciales</h2><div class="empty">No pude leer el organigrama: '+EYG.esc(e.message)+'</div></div>'; }
}
function renderOrg(){
  const box=document.getElementById("org"); if(!box)return; const esc=EYG.esc;
  const emps=ORG.emps.slice().sort((a,b)=>a.name.localeCompare(b.name));
  const lider=emps.find(e=>e.id===ORG.liderEmp);
  const miembros=emps.filter(e=>e.parent_id&&e.parent_id[0]===ORG.liderEmp);
  const candidatos=emps.filter(e=>e.id!==ORG.liderEmp && !(e.parent_id&&e.parent_id[0]===ORG.liderEmp));
  box.innerHTML=`<div class="org">
    <h2>🧭 Equipos comerciales</h2>
    <div class="sub">Asigná o quitá comerciales a un líder. Es lo que ve cada líder en su panel. Se guarda en Odoo al instante.</div>
    <div class="pick"><span class="lbl">Líder:</span>
      <select onchange="ORG.liderEmp=parseInt(this.value,10);renderOrg()">
        ${emps.map(e=>`<option value="${e.id}" ${e.id===ORG.liderEmp?'selected':''}>${esc(e.name)}</option>`).join("")}
      </select>
      <span class="lbl">${miembros.length} comercial${miembros.length===1?"":"es"} en el equipo</span>
    </div>
    <div class="team">
      ${miembros.length?miembros.map(m=>`<span class="mem">${esc(m.name)}<button class="x" title="Quitar del equipo" onclick="quitarMiembro(${m.id})">✕</button></span>`).join("")
        :'<div class="empty">Este líder todavía no tiene comerciales asignados.</div>'}
    </div>
    <div class="add"><span class="lbl">Agregar:</span>
      <select id="org_add">${candidatos.map(e=>`<option value="${e.id}">${esc(e.name)}${e.parent_id?' · hoy con '+esc(e.parent_id[1]):' · sin líder'}</option>`).join("")}</select>
      <button onclick="addMiembro()" ${candidatos.length?'':'disabled'}>＋ Agregar al equipo</button>
    </div>
    <div class="note">Agregar mueve al comercial desde su líder actual (si tenía). Quitar lo deja sin líder hasta reasignarlo.</div>
  </div>`;
}
async function addMiembro(){
  const sel=document.getElementById("org_add"); if(!sel||!sel.value)return;
  const empId=parseInt(sel.value,10); const emp=ORG.emps.find(e=>e.id===empId);
  const lider=ORG.emps.find(e=>e.id===ORG.liderEmp);
  try{
    await EYG.rpc("hr.employee","write",[[empId],{parent_id:ORG.liderEmp}]);
    if(emp) emp.parent_id=[ORG.liderEmp, lider?lider.name:""];
    otoast((emp?emp.name:"Comercial")+" → equipo de "+(lider?lider.name.split(" ")[0]:"")+" ✓", true);
    renderOrg();
  }catch(e){ otoast("No se pudo asignar: "+e.message); }
}
async function quitarMiembro(empId){
  const emp=ORG.emps.find(e=>e.id===empId); if(!emp)return;
  try{
    await EYG.rpc("hr.employee","write",[[empId],{parent_id:false}]);
    emp.parent_id=false;
    otoast((emp.name)+" quitado del equipo ✓", true);
    renderOrg();
  }catch(e){ otoast("No se pudo quitar: "+e.message); }
}

/* ===== Contactos archivados (revisión de la gerencia) =====
   Los líderes archivan con la etiqueta 63 (marca suave, ver panel del líder). Acá el
   nivel superior (gerente) los revisa: restaura (quita la etiqueta) o elimina (unlink).
   Eliminar puede fallar si el cliente tiene ventas/facturas — se avisa y queda archivado. */
const ARCH_TAG=63;
let ARCH={ list:[], cargado:false };
async function montarArchivados(){
  const box=document.getElementById("arch"); if(!box)return;
  box.innerHTML='<div class="org"><h2>🗂️ Contactos archivados <span class="sub" style="margin:0">· revisión</span></h2><div class="floading" style="padding:12px 0;color:var(--gris)"><span class="spin-sm"></span> Leyendo archivados…</div></div>';
  try{
    const list=await EYG.rpc("res.partner","search_read",[[["category_id","in",[ARCH_TAG]]]],{fields:["id","name","user_id","city","vat","write_date"],limit:0,context:{active_test:false}});
    // quién/cuándo archivó (última nota [EyG-ARCH] por contacto)
    const ids=list.map(c=>c.id); let byId={};
    if(ids.length){
      try{ const msgs=await EYG.rpc("mail.message","search_read",[[["model","=","res.partner"],["res_id","in",ids],["body","like","EyG-ARCH"]]],{fields:["res_id","date","body"],order:"date desc",limit:0});
        for(const m of msgs){ if(!byId[m.res_id]){ const mm=(m.body||"").replace(/<[^>]+>/g,"").match(/Archivado por (.+?)(\s*$|<)/); byId[m.res_id]={por:mm?mm[1].trim():"", fecha:(m.date||"").slice(0,10)}; } }
      }catch(e){}
    }
    ARCH.list=list.map(c=>({...c, _arch:byId[c.id]||{}})); ARCH.cargado=true;
    renderArch();
  }catch(e){ box.innerHTML='<div class="org"><h2>🗂️ Contactos archivados</h2><div class="empty">No pude leer los archivados: '+EYG.esc(e.message)+'</div></div>'; }
}
function renderArch(){
  const box=document.getElementById("arch"); if(!box)return; const esc=EYG.esc;
  if(!ARCH.list.length){ box.innerHTML='<div class="org"><h2>🗂️ Contactos archivados <span class="sub" style="margin:0">· revisión</span></h2><div class="empty">No hay contactos archivados para revisar. 👌</div></div>'; return; }
  box.innerHTML=`<div class="org">
    <h2>🗂️ Contactos archivados <span class="n" style="background:var(--gold);color:#3a2c07">${ARCH.list.length}</span></h2>
    <div class="sub">Los líderes los archivaron para que decidas: restaurarlos o eliminarlos. Eliminar es definitivo.</div>
    <div class="archlist">
      ${ARCH.list.map(c=>`<div class="archrow" id="arch-${c.id}">
        <div class="ai"><div class="an">${esc(c.name||'(sin nombre)')}</div>
          <div class="am">${c.user_id?'👤 '+esc(c.user_id[1]):'sin comercial'}${c.city?' · '+esc(c.city):''}${c.vat?' · '+esc(c.vat):''}</div>
          <div class="am2">🗂️ Archivado${c._arch.por?' por '+esc(c._arch.por):''}${c._arch.fecha?' · '+c._arch.fecha:''}</div></div>
        <div class="aa">
          <button class="rest" onclick="restaurarArch(${c.id})">↩ Restaurar</button>
          <button class="del" onclick="eliminarArch(${c.id})">🗑 Eliminar</button>
        </div>
      </div>`).join("")}
    </div>
  </div>`;
}
async function restaurarArch(id){
  const c=ARCH.list.find(x=>x.id===id); if(!c)return;
  try{
    await EYG.rpc("res.partner","write",[[id],{category_id:[[3,ARCH_TAG]]}]);
    ARCH.list=ARCH.list.filter(x=>x.id!==id);
    otoast("Restaurado ✓ — vuelve a la lista del comercial", true);
    renderArch();
  }catch(e){ otoast("No se pudo restaurar: "+e.message); }
}
async function eliminarArch(id){
  const c=ARCH.list.find(x=>x.id===id); if(!c)return;
  if(!confirm('¿ELIMINAR definitivamente «'+(c.name||"este contacto")+'»?\n\nEsta acción no se puede deshacer.')) return;
  try{
    await EYG.rpc("res.partner","unlink",[[id]]);
    ARCH.list=ARCH.list.filter(x=>x.id!==id);
    otoast("Eliminado ✓", true);
    renderArch();
  }catch(e){
    // Odoo bloquea el borrado si tiene ventas/facturas: lo dejamos archivado y desactivado
    try{ await EYG.rpc("res.partner","write",[[id],{active:false}]); }catch(e2){}
    otoast("No se puede borrar (tiene movimientos). Quedó archivado y desactivado.", false);
    ARCH.list=ARCH.list.filter(x=>x.id!==id);
    renderArch();
  }
}
async function cargar(){
  let sellers=[];
  try{
    const grp = await EYG.rpc("res.partner","read_group",[[["user_id","!=",false],["customer_rank",">",0]],["id"],["user_id"]],{lazy:false});
    sellers = grp.map(g=>({uid:g.user_id[0],name:g.user_id[1],n:g.__count}))
      .filter(s=>s.n>=25 && !/marcela/i.test(s.name))  // Marcela = líder → va en la tarjeta destacada
      .sort((a,b)=>b.n-a.n);
  }catch(e){ document.getElementById("ov").innerHTML='<div class="errbox">No pude leer los comerciales: '+EYG.esc(e.message)+'</div>'; return; }
  const inicioMes = new Date().toISOString().slice(0,8)+"01";
  const hoy = new Date().toISOString().slice(0,10);
  let cards=[];
  render([],false);
  // De-loop: antes era 1 search de cartera + 4 agregados POR vendedor (5×N queries, serial).
  // Ahora ~5 queries TOTALES agrupadas por partner_id, con un mapa partner->vendedor. Mismos
  // números por tarjeta. Ver [[eyg-odoo-carga-performance]].
  try{
    const uids = sellers.map(s=>s.uid);
    // 1) todas las carteras de una: partner -> vendedor (por user_id) + conteo de clientes.
    const parts = await EYG.rpc("res.partner","search_read",[[["user_id","in",uids]]],{fields:["id","user_id"]});
    const sellerOf={}, carteraCount={}, allIds=[];
    uids.forEach(u=>carteraCount[u]=0);
    for(const p of parts){ const u=p.user_id&&p.user_id[0]; if(u==null||!(u in carteraCount)) continue; sellerOf[p.id]=u; carteraCount[u]++; allIds.push(p.id); }
    // 2-4) métricas del mes agrupadas por partner_id (1 query c/u en vez de 4 por vendedor).
    const [facG,ncG,cobG,mlAll] = allIds.length ? await Promise.all([
      EYG.rpc("account.move","read_group",[[["partner_id","in",allIds],["move_type","=","out_invoice"],["state","=","posted"],["invoice_date",">=",inicioMes]],["amount_untaxed:sum"],["partner_id"]],{lazy:false}),
      EYG.rpc("account.move","read_group",[[["partner_id","in",allIds],["move_type","=","out_refund"],["state","=","posted"],["invoice_date",">=",inicioMes]],["amount_untaxed:sum"],["partner_id"]],{lazy:false}),
      EYG.rpc("account.payment","read_group",[[["partner_id","in",allIds],["payment_type","=","inbound"],["state","=","posted"],["date",">=",inicioMes]],["amount:sum"],["partner_id"]],{lazy:false}),
      EYG.rpc("account.move.line","search_read",[[["partner_id","in",allIds],["account_id.account_type","=","asset_receivable"],["parent_state","=","posted"],["full_reconcile_id","=",false]]],{fields:["partner_id","amount_residual","date_maturity"],limit:0}),
    ]) : [[],[],[],[]];
    const fac={},nc={},cob={},deuda={},venc={};
    uids.forEach(u=>{fac[u]=0;nc[u]=0;cob[u]=0;deuda[u]=0;venc[u]=0;});
    const pidOf=g=>g.partner_id&&g.partner_id[0];
    for(const g of facG){ const u=sellerOf[pidOf(g)]; if(u!=null) fac[u]+=g.amount_untaxed||0; }
    for(const g of ncG){  const u=sellerOf[pidOf(g)]; if(u!=null) nc[u]+=g.amount_untaxed||0; }
    for(const g of cobG){ const u=sellerOf[pidOf(g)]; if(u!=null) cob[u]+=g.amount||0; }
    for(const l of mlAll){ const u=sellerOf[l.partner_id&&l.partner_id[0]]; if(u==null) continue; const r=l.amount_residual||0; if(r>0){ deuda[u]+=r; if(l.date_maturity&&l.date_maturity<hoy) venc[u]+=r; } }
    cards = sellers.map(s=>({ name:s.name, cartera:carteraCount[s.uid]||0, factMes:(fac[s.uid]||0)-(nc[s.uid]||0), cobMes:cob[s.uid]||0, deuda:deuda[s.uid]||0, venc:venc[s.uid]||0, vencPct:(deuda[s.uid]>0)?Math.round(venc[s.uid]/deuda[s.uid]*100):0 }));
  }catch(e){ cards = sellers.map(s=>({name:s.name, err:true})); }
  render(cards,true);
}
function render(cards, done){
  const ov=document.getElementById("ov"); if(!ov) return;
  const M=EYG.money, esc=EYG.esc;
  const feat = `<a class="lidercard" href="lider.html"><span class="lb">Líder</span><span class="lic">🏆</span>
    <h3>Panel del Líder</h3><p>El equipo en vivo: evolución del día minuto a minuto, y cada comercial por año, mes, semana, día y hora por hora.</p>
    <div class="go">Abrir panel del líder →</div></a>`;
  const grid = cards.map(c=>{
    if(c.err) return `<div class="ovcard"><h3>${esc(c.name)}</h3><div class="mrow"><span>Sin datos</span><b>—</b></div></div>`;
    const vcol=c.vencPct>=40?'var(--coral)':c.vencPct>=25?'var(--gold)':'var(--teal)';
    return `<a class="ovcard" href="panel.html?c=${encodeURIComponent(c.name)}">
      <h3>${esc(c.name)}</h3>
      <div class="mrow"><span>Facturado del mes</span><b>${M(c.factMes)}</b></div>
      <div class="mrow"><span>Cobrado</span><b>${M(c.cobMes)}</b></div>
      <div class="mrow"><span>Vencido</span><b style="color:${vcol}">${M(c.venc)} · ${c.vencPct}%</b></div>
      <div class="mrow small"><span>${c.cartera} clientes</span><span class="go">Ver su panel →</span></div>
    </a>`;
  }).join("");
  ov.innerHTML = `<div class="ovfeat">${feat}</div>
    <h2 class="ovh">Comerciales ${done?"":'<span class="spin-sm"></span>'}</h2>
    <div class="ovgrid">${grid || '<div class="loading"><div class="spinner"></div>Cargando…</div>'}</div>`;
}
</script>
</body>
</html>
