<style>
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--teal-deep);font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}

  h2.sec .ayuda{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--gris2)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:18px}
  .nota{background:var(--agua);border:1px solid #BFE0DC;border-left:4px solid var(--teal);border-radius:10px;padding:12px 15px;font-size:13px;color:#245C57;line-height:1.6;margin-bottom:16px}

  .conf{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
  .fld{display:flex;flex-direction:column;gap:6px}
  .fld .lb{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--gris);font-weight:800}

  .fld input,.fld select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;outline:none;background:var(--surface);color:var(--ink)}
  .fld input:focus,.fld select:focus{border-color:var(--teal)}

  .scroll{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}

  th.r,td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

  @media(max-width:860px){ .scroll{overflow-x:auto} table{min-width:680px} }

  .btn{font-size:14px;padding:12px 20px;border-radius:11px;border:0;background:var(--teal);color:#fff;cursor:pointer;font-weight:800;font-family:inherit}
  .btn:hover{filter:brightness(1.07)}

  .btn.sec{background:var(--surface);color:var(--gris);border:1px solid var(--line);font-weight:700;font-size:12.5px;padding:9px 15px}

  .spin{width:30px;height:30px;border:4px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite;margin:34px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .cargando{text-align:center;color:var(--gris);font-size:13.5px;padding:10px}
  .mas{text-align:center;color:var(--gris2);font-size:12.5px;padding:14px 10px 4px}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="../assets/core.js?v=78"></script>
<script>
/* ============================================================
   CATÁLOGO PARA PLATAFORMAS — arma el archivo que se sube a Bionexo
   ============================================================
   POR QUÉ EXISTE: el catálogo cargado en Bionexo no se toca desde el
   03/12/2024. Cada producto que EyG vende y la plataforma no reconoce es un
   renglón que no se puede cotizar — y eso explica buena parte de la tasa de
   respuesta que muestra el tablero de Plataformas.

   EL PRECIO NO SE CALCULA ACÁ. Se LEE de la tarifa de Odoo
   (product.pricelist.item), igual que el Cotizador: es el precio que ya salió
   del motor con las capas aplicadas. Si el precio cambia en Odoo, se
   regenera el archivo y listo. Tocar el motor no es asunto de este módulo.

   ══ LA REGLA DEL STOCK ══
   Se publica el DISPONIBLE, no el físico: disponible = qty_available −
   comprometido, donde comprometido son las unidades de pedidos ya
   confirmados con entrega pendiente. Publicar el físico es prometer
   mercadería que ya está vendida.

   Y encima va un COLCHÓN: se publica sólo un porcentaje del disponible. El
   archivo se sube cada tanto, pero el depósito se mueve todos los días; sin
   colchón, cotizar contra un stock de ayer termina en un faltante con un
   hospital. El colchón NO reserva nada en Odoo: reservar cada renglón
   cotizado congelaría muchísima mercadería que después no se vende (la tasa
   de éxito por renglón es baja, se ve en Plataformas). El compromiso real
   se toma cuando el pedido se gana y se carga en Odoo.

   FORMATO DEL ARCHIVO: plantilla ModeloUpload_AR_v2.0 de Bionexo, 19
   columnas. Ojo: «Codigo Producto» es el código de EyG, no el de Bionexo —
   por eso se pueden dar de alta productos nuevos en masa.
   ============================================================ */
const esc = EYG.esc;
const nf = n => Math.round(n||0).toLocaleString("es-AR");
const money = n => "$"+(Math.round((n||0)*100)/100).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const ES = {lang:"es_AR"};

/* Catálogos de la plantilla de Bionexo (hoja «Libreria») */
const CATEGORIAS = [
  {id:100,t:"Medicamentos"}, {id:200,t:"Insumos Médicos y Quirúrgicos"}, {id:300,t:"Equipamientos"},
  {id:400,t:"Librería y Artículos de Oficina"}, {id:500,t:"Material de Limpieza / Descartables"},
  {id:600,t:"Alimentación"}, {id:700,t:"Insumos de Laboratorio"}, {id:800,t:"Formularios / Gráficos"},
  {id:900,t:"Mantenimiento"}, {id:1000,t:"Ropa / Textiles"}, {id:1100,t:"Materiales Odontológicos"},
  {id:1200,t:"Materiales de Radiología"}
];
const UNIDADES = [
  {id:6,t:"Unidades"},{id:7,t:"Caja"},{id:3,t:"Bolsa"},{id:4,t:"Botella"},{id:2,t:"Blisters"},{id:8,t:"Piezas"},
  {id:11,t:"Docenas"},{id:12,t:"Frascos"},{id:14,t:"Gramos"},{id:16,t:"Kilogramos"},{id:17,t:"Litros"},
  {id:19,t:"Mililitros"},{id:21,t:"Paquetes"},{id:22,t:"Pares"},{id:23,t:"Resma"},{id:26,t:"Rollos"},
  {id:28,t:"Ampollas"},{id:29,t:"Comprimidos"},{id:32,t:"Envase"},{id:34,t:"Tiras"},{id:35,t:"Sobre"},
  {id:36,t:"Tabletas"},{id:37,t:"Bobinas"},{id:38,t:"Tubos"},{id:39,t:"Sachet"}
];
/* Primera adivinanza por el nombre de la familia de Odoo. El usuario corrige
   en pantalla y la corrección queda guardada: nunca se pisa lo que él eligió. */
const PISTAS = [
  [/etico|ético|farmacop|medicamento|generico|genérico/i, 100],
  [/radiolog|contraste/i, 1200],
  [/laboratorio|reactivo|bacteriolog/i, 700],
  [/descartable|limpieza|higiene|perfumer/i, 500],
  [/equipo|aparato|instrumental pesado/i, 300],
  [/libreria|librería|oficina|papeler/i, 400],
  [/aliment|nutricion|nutrición/i, 600],
  [/textil|ropa|indumentaria/i, 1000],
  [/odontolog/i, 1100],
  [/hospitalario|quirurgic|quirúrgic|ortopedia|insumo/i, 200]
];

const LS = "eyg_catplat";
const ST = {
  lista: 3, descuento: 0, colchon: 70, tope: 300,
  mapCat: {}, mapUom: {},
  prods: [], precios: {}, comprometido: {}, taxmap: {},
  cats: [], uoms: [], listas: []
};

/* ---------------- arranque ---------------- */
EYG.guard(["lider","admin","direccion"]).then(async perfil=>{
  document.body.innerHTML = EYG.layout(perfil,"plataformas",
    `<div id="cap"><div class="spin"></div><p class="cargando" id="paso">Leyendo el catálogo de Odoo…</p></div>`, "Catálogo para plataformas");
  restaurar();
  try{
    await cargar();
    render();
  }catch(e){
    document.getElementById("cap").innerHTML =
      `<div class="nota aviso"><b>No pude leer Odoo.</b> ${esc(String(e.message||e))}</div>`;
  }
});

function restaurar(){
  try{
    const g = JSON.parse(localStorage.getItem(LS)||"{}");
    if(g.lista) ST.lista = g.lista;
    if(g.descuento!=null) ST.descuento = g.descuento;
    if(g.colchon!=null) ST.colchon = g.colchon;
    ST.mapCat = g.mapCat||{}; ST.mapUom = g.mapUom||{};
  }catch(e){}
}
function guardar(){
  try{ localStorage.setItem(LS, JSON.stringify({lista:ST.lista,descuento:ST.descuento,colchon:ST.colchon,mapCat:ST.mapCat,mapUom:ST.mapUom})); }catch(e){}
}
const paso = t => { const p=document.getElementById("paso"); if(p) p.textContent=t; };

/* ---------------- lectura de Odoo ---------------- */
async function cargar(){
  paso("Leyendo las listas de precios…");
  ST.listas = await EYG.rpc("product.pricelist","search_read",[[["active","=",true]]],{fields:["id","name"],limit:30,context:ES});

  paso("Leyendo los impuestos…");
  const tx = await EYG.rpc("account.tax","search_read",[[["type_tax_use","=","sale"]]],
    {fields:["id","name","amount","amount_type","price_include"],limit:100});
  (tx||[]).forEach(t=>{
    const incluido = !!t.price_include || /imp\.?\s*inc|inclu/i.test(t.name||"");
    ST.taxmap[t.id] = { pct: (t.amount_type==="percent" ? (t.amount||0) : 0), incluido };
  });

  paso("Leyendo los productos… (son muchos, puede tardar)");
  const campos = ["id","default_code","name","product_tmpl_id","categ_id","qty_available","list_price","taxes_id","barcode","uom_id"];
  const prods = [];
  for(let off=0; off<40000; off+=2000){
    const t = await EYG.rpc("product.product","search_read",
      [[["active","=",true],["sale_ok","=",true],["type","!=","service"]]],
      {fields:campos, limit:2000, offset:off, order:"id", context:ES});
    prods.push(...(t||[]));
    paso("Leyendo los productos… "+nf(prods.length));
    if(!t || t.length<2000) break;
  }
  ST.prods = prods;

  paso("Leyendo los precios de la lista…");
  await cargarPrecios();

  paso("Viendo qué stock ya está comprometido…");
  await cargarComprometido();

  // Familias y unidades que existen de verdad en el catálogo, para mapear.
  const cats={}, uoms={};
  prods.forEach(p=>{
    if(p.categ_id){ const k=p.categ_id[0]; (cats[k]=cats[k]||{id:k,nm:p.categ_id[1],n:0}).n++; }
    if(p.uom_id){ const k=p.uom_id[0]; (uoms[k]=uoms[k]||{id:k,nm:p.uom_id[1],n:0}).n++; }
  });
  ST.cats = Object.values(cats).sort((a,b)=>b.n-a.n);
  ST.uoms = Object.values(uoms).sort((a,b)=>b.n-a.n);
  ST.cats.forEach(c=>{ if(ST.mapCat[c.id]==null) ST.mapCat[c.id] = adivinarCat(c.nm); });
  ST.uoms.forEach(u=>{ if(ST.mapUom[u.id]==null) ST.mapUom[u.id] = adivinarUom(u.nm); });
  guardar();
}

function adivinarCat(nombre){
  for(const [re,id] of PISTAS) if(re.test(nombre||"")) return id;
  return 200;   // el cajón más grande: insumos médicos
}
function adivinarUom(nombre){
  const n=(nombre||"").toLowerCase();
  const hit = UNIDADES.find(u=>n.includes(u.t.toLowerCase().slice(0,5)));
  return hit ? hit.id : 6;   // por defecto, Unidades
}

/* Precio de la lista elegida. Mismo criterio que el Cotizador: ítems por
   variante (tiers 2/3) o por plantilla (Farmacias, con escalera). Para el
   catálogo se toma el PRIMER tramo, que es el precio sin cantidad mínima. */
async function cargarPrecios(){
  ST.precios = {};
  const tmpls = [...new Set(ST.prods.map(p=>p.product_tmpl_id && p.product_tmpl_id[0]).filter(Boolean))];
  const items = [];
  for(let i=0;i<tmpls.length;i+=4000){
    const t = await EYG.rpc("product.pricelist.item","search_read",
      [[["pricelist_id","=",ST.lista]]],
      {fields:["product_tmpl_id","product_id","applied_on","min_quantity","fixed_price","compute_price"], limit:30000, offset:i, context:ES});
    items.push(...(t||[]));
    if(!t || t.length<30000) break;
  }
  const porT={}, porV={};
  items.forEach(it=>{
    if(it.compute_price!=="fixed" || !(it.fixed_price>0)) return;
    if(it.applied_on==="0_product_variant" && it.product_id) (porV[it.product_id[0]]=porV[it.product_id[0]]||[]).push(it);
    else if(it.product_tmpl_id) (porT[it.product_tmpl_id[0]]=porT[it.product_tmpl_id[0]]||[]).push(it);
  });
  ST.prods.forEach(p=>{
    const t = p.product_tmpl_id && p.product_tmpl_id[0];
    const src = (porV[p.id] && porV[p.id].length) ? porV[p.id] : (porT[t]||[]);
    const arr = src.map(i=>({q:i.min_quantity||1, p:i.fixed_price})).sort((a,b)=>a.q-b.q);
    if(arr.length) ST.precios[p.id] = arr[0].p;
  });
}

/* Comprometido = unidades de pedidos CONFIRMADOS con entrega pendiente o
   parcial. Misma definición que usa Cargar venta: publicar el físico sería
   ofrecer mercadería que ya tiene dueño. */
async function cargarComprometido(){
  try{
    const g = await EYG.rpc("sale.order.line","read_group",
      [[["order_id.state","=","sale"],["order_id.delivery_status","in",["pending","partial"]]],
       ["product_uom_qty:sum","qty_delivered:sum"],["product_id"]],
      {lazy:false, limit:8000, context:ES});
    const m={};
    (g||[]).forEach(r=>{ if(!r.product_id) return; const c=(r.product_uom_qty||0)-(r.qty_delivered||0); if(c>0.001) m[r.product_id[0]]=c; });
    ST.comprometido = m;
  }catch(e){ ST.comprometido = {}; }
}

/* ---------------- cálculo ---------------- */
const dispDe = p => Math.round(((p.qty_available||0) - (ST.comprometido[p.id]||0))*100)/100;

function ivaDe(p){
  const ids = p.taxes_id || [];
  for(const id of ids){ const t=ST.taxmap[id]; if(t && t.pct>0) return t.pct; }
  return 0;
}

function armarFilas(){
  const filas=[], fuera={sinCodigo:0, sinPrecio:0, sinStock:0, comprometido:0};
  ST.prods.forEach(p=>{
    const precio = ST.precios[p.id];
    const disp = dispDe(p);
    if(!p.default_code){ fuera.sinCodigo++; return; }
    if(!(precio>0)){ fuera.sinPrecio++; return; }
    if(!(disp>0)){ (p.qty_available>0 ? fuera.comprometido++ : fuera.sinStock++); return; }
    const iva = ivaDe(p);
    const publicar = Math.floor(disp * (ST.colchon/100));
    if(publicar<1) { fuera.sinStock++; return; }
    filas.push({
      estado:"S",
      codigo:String(p.default_code),
      nombre:(p.name||"").trim(),
      cat: ST.mapCat[p.categ_id && p.categ_id[0]] || 200,
      gtin: p.barcode || "",
      uom: ST.mapUom[p.uom_id && p.uom_id[0]] || 6,
      precio: Math.round(precio*100)/100,
      iva,
      conIva: Math.round(precio*(1+iva/100)*100)/100,
      descuento: ST.descuento || 0,
      stock: publicar,
      disp, fisico: p.qty_available||0, comp: ST.comprometido[p.id]||0,
      catNombre: (p.categ_id && p.categ_id[1]) || ""
    });
  });
  filas.sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
  return {filas, fuera};
}

/* ---------------- pantalla ---------------- */
function render(){
  const {filas, fuera} = armarFilas();
  ST._filas = filas;
  const lista = (ST.listas.find(l=>l.id===ST.lista)||{}).name || ("lista "+ST.lista);
  document.getElementById("cap").innerHTML = `
    <div class="nota">
      <b>Qué hace esta pantalla.</b> Arma el archivo que se sube a Bionexo en
      <i>Catálogo de Productos → Subir Catálogo</i>. El precio sale de la tarifa de Odoo
      (<b>${esc(lista)}</b>) — el mismo que usa el Cotizador, con las capas ya aplicadas.
      Acá no se recalcula ningún precio.
    </div>

    <h2 class="sec">Qué entra y qué queda afuera</h2>
    <div class="emb">
      <div class="e"><div class="n t">${nf(filas.length)}</div><div class="t">Entran al archivo</div><div class="p">con precio y stock disponible</div></div>
      <div class="e"><div class="n x">${nf(fuera.sinPrecio)}</div><div class="t">Sin precio en la lista</div><div class="p">no se pueden cotizar</div></div>
      <div class="e"><div class="n x">${nf(fuera.sinStock)}</div><div class="t">Sin stock</div><div class="p">quedan afuera por ahora</div></div>
      <div class="e"><div class="n x">${nf(fuera.comprometido)}</div><div class="t">Stock ya comprometido</div><div class="p">hay unidades, pero tienen dueño</div></div>
      <div class="e"><div class="n x">${nf(fuera.sinCodigo)}</div><div class="t">Sin código interno</div><div class="p">Bionexo los necesita</div></div>
    </div>

    <h2 class="sec">Ajustes</h2>
    <div class="card pad">
      <div class="conf">
        <div class="fld">
          <span class="lb">Lista de precios</span>
          <select id="lista">${ST.listas.map(l=>`<option value="${l.id}" ${l.id===ST.lista?"selected":""}>${esc(l.name)}</option>`).join("")}</select>
          <span class="hint">La de Instituciones. El precio se lee tal cual está en Odoo.</span>
        </div>
        <div class="fld">
          <span class="lb">Descuento general</span>
          <input class="num" id="desc" type="number" min="0" max="90" step="0.5" value="${ST.descuento}">
          <span class="hint">Va en la columna Descuento: el comprador ve el precio de lista y la rebaja aparte. En 0 no se aplica ninguno.</span>
        </div>
        <div class="fld">
          <span class="lb">Stock a publicar</span>
          <input class="num" id="colchon" type="number" min="10" max="100" step="5" value="${ST.colchon}">
          <span class="hint"><b>Porcentaje del disponible.</b> El depósito se mueve todos los días y el archivo se sube cada tanto: el resto es el colchón para no prometer lo que ya se vendió.</span>
        </div>
      </div>
      <div class="acciones">
        <button class="btn" id="gen" ${filas.length?"":"disabled"}>Generar archivo para Bionexo</button>
        <button class="btn sec" id="csv" ${filas.length?"":"disabled"}>Bajar como CSV</button>
        <span style="font-size:12.5px;color:var(--gris)">${nf(filas.length)} productos · se baja en Excel y se sube a Bionexo</span>
      </div>
    </div>

    <h2 class="sec">Cómo se traducen las familias <span class="ayuda">de Odoo a las categorías de Bionexo</span></h2>
    <div class="nota aviso">Revisá esta tabla antes de generar: si una familia va a la categoría equivocada,
      los compradores no encuentran el producto. Lo que elijas queda guardado.</div>
    ${tablaMapa("cat")}

    <h2 class="sec">Unidades de medida</h2>
    ${tablaMapa("uom")}

    <h2 class="sec">Vista previa <span class="ayuda">lo que va a tener el archivo</span></h2>
    ${tablaPrevia(filas)}

    <p class="mas" style="margin-bottom:28px">
      Después de subirlo, Bionexo dice cuántos productos procesó y cuántos no.
      <b>Mirá ese número:</b> en la carga de diciembre de 2024 quedaron 172 sin procesar.
    </p>`;
  enganchar();
}

function tablaMapa(tipo){
  const filas = tipo==="cat" ? ST.cats : ST.uoms;
  const opts  = tipo==="cat" ? CATEGORIAS : UNIDADES;
  const mapa  = tipo==="cat" ? ST.mapCat : ST.mapUom;
  return `<div class="scroll"><table>
    <thead><tr><th>${tipo==="cat"?"Familia en Odoo":"Unidad en Odoo"}</th><th class="r">Productos</th><th>Va a Bionexo como</th></tr></thead>
    <tbody>${filas.map(f=>`<tr>
      <td class="nm">${esc(f.nm)}</td>
      <td class="r">${nf(f.n)}</td>
      <td><select data-tipo="${tipo}" data-id="${f.id}">${opts.map(o=>
        `<option value="${o.id}" ${String(mapa[f.id])===String(o.id)?"selected":""}>${o.id} · ${esc(o.t)}</option>`).join("")}</select></td>
    </tr>`).join("")}</tbody></table></div>`;
}

function tablaPrevia(filas){
  if(!filas.length) return `<div class="card pad"><p class="cargando" style="margin:0">No hay productos que cumplan las condiciones.</p></div>`;
  const v = filas.slice(0, ST.tope);
  const catNm = id => (CATEGORIAS.find(c=>c.id==id)||{}).t || id;
  return `<div class="scroll"><table>
    <thead><tr>
      <th>Producto</th><th>Código</th><th>Categoría Bionexo</th><th class="r">Precio</th>
      <th class="r">IVA</th><th class="r">Con IVA</th><th class="r">Desc.</th>
      <th class="r">Publica</th><th class="r">Disponible</th>
    </tr></thead>
    <tbody>${v.map(f=>`<tr>
      <td class="nm">${esc(f.nombre)}</td>
      <td class="cod">${esc(f.codigo)}</td>
      <td style="font-size:12px;color:var(--gris)">${esc(catNm(f.cat))}</td>
      <td class="r">${money(f.precio)}</td>
      <td class="r">${f.iva ? f.iva+"%" : `<span class="pill ok">exento</span>`}</td>
      <td class="r">${money(f.conIva)}</td>
      <td class="r">${f.descuento? f.descuento+"%" : "—"}</td>
      <td class="r"><b>${nf(f.stock)}</b></td>
      <td class="r" style="color:var(--gris2)">${nf(f.disp)}${f.comp?` <span class="pill warn">${nf(f.comp)} comp.</span>`:""}</td>
    </tr>`).join("")}</tbody></table></div>
    <div class="mas">${filas.length>v.length ? `Mostrando ${nf(v.length)} de ${nf(filas.length)} · el archivo los lleva todos` : `${nf(filas.length)} productos · eso es todo`}</div>`;
}

function enganchar(){
  const l=document.getElementById("lista");
  if(l) l.onchange = async ()=>{
    ST.lista = +l.value; guardar();
    document.getElementById("cap").innerHTML = `<div class="spin"></div><p class="cargando" id="paso">Releyendo precios…</p>`;
    await cargarPrecios(); render();
  };
  const d=document.getElementById("desc");
  if(d) d.onchange = ()=>{ ST.descuento = Math.max(0, Math.min(90, +d.value||0)); guardar(); render(); };
  const c=document.getElementById("colchon");
  if(c) c.onchange = ()=>{ ST.colchon = Math.max(10, Math.min(100, +c.value||100)); guardar(); render(); };
  document.querySelectorAll("select[data-tipo]").forEach(s=>s.onchange=()=>{
    (s.dataset.tipo==="cat" ? ST.mapCat : ST.mapUom)[s.dataset.id] = +s.value;
    guardar(); render();
  });
  const g=document.getElementById("gen"); if(g) g.onclick = ()=>bajarExcel();
  const v=document.getElementById("csv"); if(v) v.onclick = ()=>bajarCsv();
}

/* ---------------- el archivo ---------------- */
/* Las cabeceras van EXACTAMENTE como en la plantilla ModeloUpload_AR_v2.0,
   incluido el espacio al final de «Marca ». Bionexo las busca por nombre. */
const CABECERA = ["Estado","Codigo Producto","Descripcion Producto","ID Categoria","GTIN","GLN","CUFE",
  "ID Unidad de Medida","Embalaje","Forma Farmaceutica","Sustancia","Marca ","Comentario",
  "Precio Unitario","Tasa IVA","Unitario con IVA","Referencia Proveedor","Descuento","Stock Disponible"];

const aFila = f => [f.estado, f.codigo, f.nombre, f.cat, f.gtin, "", "", f.uom, "", "", "", "", "",
                    f.precio, f.iva, f.conIva, f.codigo, f.descuento, f.stock];

function nombreArchivo(ext){
  return "catalogo-eyg-bionexo-"+new Date().toISOString().slice(0,10)+"."+ext;
}

function bajarExcel(){
  const filas = ST._filas||[];
  if(!filas.length) return;
  const datos = [CABECERA, ...filas.map(aFila)];
  const hoja = XLSX.utils.aoa_to_sheet(datos);
  const libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, hoja, "Catalogo Producto");
  XLSX.writeFile(libro, nombreArchivo("xlsx"));
}

function bajarCsv(){
  const filas = ST._filas||[];
  const q = s => '"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  const txt = [CABECERA.map(q).join(";"), ...filas.map(f=>aFila(f).map(q).join(";"))].join("\n");
  const blob = new Blob(["﻿"+txt], {type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nombreArchivo("csv"); a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
</script>
