<script>
/* ============================================================
   CATÁLOGO PARA PLATAFORMAS — arma el archivo que se sube a Bionexo
   ============================================================
   POR QUÉ EXISTE: el catálogo cargado en Bionexo no se toca desde el
   03/12/2024. Cada producto que EyG vende y la plataforma no reconoce es un
   renglón que no se puede cotizar — y eso explica buena parte de la tasa de
   respuesta que muestra el tablero de Plataformas.

   EL PRECIO NO SE CALCULA ACÁ. Se LEE de la tarifa de Odoo
   (product.pricelist.item), igual que el Cotizador: es el precio que ya salió
   del motor con las capas aplicadas. Si el precio cambia en Odoo, se
   regenera el archivo y listo. Tocar el motor no es asunto de este módulo.

   ══ LA REGLA DEL STOCK ══
   Se publica el DISPONIBLE, no el físico: disponible = qty_available −
   comprometido, donde comprometido son las unidades de pedidos ya
   confirmados con entrega pendiente. Publicar el físico es prometer
   mercadería que ya está vendida.

   Y encima va un COLCHÓN: se publica sólo un porcentaje del disponible. El
   archivo se sube cada tanto, pero el depósito se mueve todos los días; sin
   colchón, cotizar contra un stock de ayer termina en un faltante con un
   hospital. El colchón NO reserva nada en Odoo: reservar cada renglón
   cotizado congelaría muchísima mercadería que después no se vende (la tasa
   de éxito por renglón es baja, se ve en Plataformas). El compromiso real
   se toma cuando el pedido se gana y se carga en Odoo.

   FORMATO DEL ARCHIVO: plantilla ModeloUpload_AR_v2.0 de Bionexo, 19
   columnas. Ojo: «Codigo Producto» es el código de EyG, no el de Bionexo —
   por eso se pueden dar de alta productos nuevos en masa.
   ============================================================ */
const esc = EYG.esc;
const nf = n => Math.round(n||0).toLocaleString("es-AR");
const money = n => "$"+(Math.round((n||0)*100)/100).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const ES = {lang:"es_AR"};

/* Catálogos de la plantilla de Bionexo (hoja «Libreria») */
const CATEGORIAS = [
  {id:100,t:"Medicamentos"}, {id:200,t:"Insumos Médicos y Quirúrgicos"}, {id:300,t:"Equipamientos"},
  {id:400,t:"Librería y Artículos de Oficina"}, {id:500,t:"Material de Limpieza / Descartables"},
  {id:600,t:"Alimentación"}, {id:700,t:"Insumos de Laboratorio"}, {id:800,t:"Formularios / Gráficos"},
  {id:900,t:"Mantenimiento"}, {id:1000,t:"Ropa / Textiles"}, {id:1100,t:"Materiales Odontológicos"},
  {id:1200,t:"Materiales de Radiología"}
];
const UNIDADES = [
  {id:6,t:"Unidades"},{id:7,t:"Caja"},{id:3,t:"Bolsa"},{id:4,t:"Botella"},{id:2,t:"Blisters"},{id:8,t:"Piezas"},
  {id:11,t:"Docenas"},{id:12,t:"Frascos"},{id:14,t:"Gramos"},{id:16,t:"Kilogramos"},{id:17,t:"Litros"},
  {id:18,t:"Grageas"},{id:19,t:"Mililitros"},{id:21,t:"Paquetes"},{id:22,t:"Pares"},{id:23,t:"Resma"},{id:26,t:"Rollos"},
  {id:28,t:"Ampollas"},{id:29,t:"Comprimidos"},{id:32,t:"Envase"},{id:34,t:"Tiras"},{id:35,t:"Sobre"},
  {id:36,t:"Tabletas"},{id:37,t:"Bobinas"},{id:38,t:"Tubos"},{id:39,t:"Sachet"}
];

/* LA UNIDAD SALE DEL MAESTRO, NO DE UNA GENERALIZACIÓN. En el Maestro de
   productos cada ficha tiene su unidad de venta real en `x_unidad` («hay de
   todo: cajas, tiras, ampollas…»). Acá sólo se traduce esa clave a la unidad
   que entiende Bionexo. Si un producto no la tiene cargada, NO se inventa:
   se lista aparte para completarlo en el Maestro. */
const UNIDAD_EYG = [
  {k:"unidad",    lbl:"unidad",         bx:6},
  {k:"caja",      lbl:"caja (cerrada)", bx:7},
  {k:"tira",      lbl:"tira",           bx:34},
  {k:"blister",   lbl:"blister",        bx:2},
  {k:"amp",       lbl:"ampolla",        bx:28},
  {k:"comp",      lbl:"comprimido",     bx:29},
  {k:"caps",      lbl:"cápsula",        bx:29},
  {k:"jeringa",   lbl:"jeringa",        bx:6},
  {k:"frasco",    lbl:"frasco",         bx:12},
  {k:"frascoamp", lbl:"frasco ampolla", bx:12},
  {k:"sobre",     lbl:"sobre",          bx:35},
  {k:"ml",        lbl:"ml",             bx:19},
  {k:"g",         lbl:"gramo",          bx:14},
  {k:"gotas",     lbl:"gotas",          bx:6}
];
/* Primera adivinanza por el nombre de la familia de Odoo. El usuario corrige
   en pantalla y la corrección queda guardada: nunca se pisa lo que él eligió. */
const PISTAS = [
  [/etico|ético|farmacop|medicamento|generico|genérico/i, 100],
  [/radiolog|contraste/i, 1200],
  [/laboratorio|reactivo|bacteriolog/i, 700],
  [/descartable|limpieza|higiene|perfumer/i, 500],
  [/equipo|aparato|instrumental pesado/i, 300],
  [/libreria|librería|oficina|papeler/i, 400],
  [/aliment|nutricion|nutrición/i, 600],
  [/textil|ropa|indumentaria/i, 1000],
  [/odontolog/i, 1100],
  [/hospitalario|quirurgic|quirúrgic|ortopedia|insumo/i, 200]
];

const LS = "eyg_catplat";
const ST = {
  lista: 3, descuento: 0, colchon: 70, tope: 300,
  mapCat: {}, mapUom: {}, maestro: {}, limpiarNombres: true,
  prods: [], precios: {}, comprometido: {}, taxmap: {},
  cats: [], uoms: [], listas: [],
  /* Lo que HOY está cargado en Bionexo (se sube el archivo de «Descargar
     Catálogo»). Sin esto no se pueden generar bajas: los productos viejos
     que no entren en el archivo nuevo se quedan ofreciéndose con lo que
     tengan cargado. Medido el 15/9/2026: de 1.950 productos cargados, sólo
     2 tenían precio y ninguno stock ni marca. */
  bionexo: [], bajarSinStock: false
};

/* ---------------- arranque ---------------- */
EYG.guard(["lider","admin","direccion"]).then(async perfil=>{
  document.body.innerHTML = EYG.layout(perfil,"plataformas",
    `<div id="cap"><div class="spin"></div><p class="cargando" id="paso">Leyendo el catálogo de Odoo…</p></div>`, "Catálogo para plataformas");
  restaurar();
  try{
    await cargar();
    render();
  }catch(e){
    document.getElementById("cap").innerHTML =
      `<div class="nota aviso"><b>No pude leer Odoo.</b> ${esc(String(e.message||e))}</div>`;
  }
});

function restaurar(){
  try{
    const g = JSON.parse(localStorage.getItem(LS)||"{}");
    if(g.lista) ST.lista = g.lista;
    if(g.descuento!=null) ST.descuento = g.descuento;
    if(g.limpiarNombres!=null) ST.limpiarNombres = g.limpiarNombres;
    if(g.colchon!=null) ST.colchon = g.colchon;
    ST.mapCat = g.mapCat||{}; ST.mapUom = g.mapUom||{};
  }catch(e){}
}
function guardar(){
  try{ localStorage.setItem(LS, JSON.stringify({lista:ST.lista,descuento:ST.descuento,colchon:ST.colchon,mapCat:ST.mapCat,mapUom:ST.mapUom,limpiarNombres:ST.limpiarNombres})); }catch(e){}
}
const paso = t => { const p=document.getElementById("paso"); if(p) p.textContent=t; };

/* ---------------- lectura de Odoo ---------------- */
async function cargar(){
  paso("Leyendo las listas de precios…");
  ST.listas = await EYG.rpc("product.pricelist","search_read",[[["active","=",true]]],{fields:["id","name"],limit:30,context:ES});

  paso("Leyendo los impuestos…");
  const tx = await EYG.rpc("account.tax","search_read",[[["type_tax_use","=","sale"]]],
    {fields:["id","name","amount","amount_type","price_include"],limit:100});
  (tx||[]).forEach(t=>{
    const incluido = !!t.price_include || /imp\.?\s*inc|inclu/i.test(t.name||"");
    ST.taxmap[t.id] = { pct: (t.amount_type==="percent" ? (t.amount||0) : 0), incluido };
  });

  paso("Leyendo los productos… (son muchos, puede tardar)");
  const campos = ["id","default_code","name","product_tmpl_id","categ_id","qty_available","list_price","taxes_id","barcode","uom_id"];
  const prods = [];
  for(let off=0; off<40000; off+=2000){
    const t = await EYG.rpc("product.product","search_read",
      [[["active","=",true],["sale_ok","=",true],["type","!=","service"]]],
      {fields:campos, limit:2000, offset:off, order:"id", context:ES});
    prods.push(...(t||[]));
    paso("Leyendo los productos… "+nf(prods.length));
    if(!t || t.length<2000) break;
  }
  ST.prods = prods;

  paso("Leyendo los precios de la lista…");
  await cargarPrecios();

  paso("Viendo qué stock ya está comprometido…");
  await cargarComprometido();

  paso("Leyendo el árbol de categorías…");
  await cargarCategorias();

  paso("Leyendo la unidad de venta de cada producto (Maestro)…");
  await cargarMaestro();

  UNIDAD_EYG.forEach(u=>{ if(ST.mapUom[u.k]==null) ST.mapUom[u.k] = u.bx; });
  guardar();
}

/* La unidad de venta y el laboratorio viven en product.template (es donde los
   edita el Maestro), no en la variante. Se traen aparte y se cruzan. */
async function cargarMaestro(){
  const tmpls = [...new Set(ST.prods.map(p=>p.product_tmpl_id && p.product_tmpl_id[0]).filter(Boolean))];
  const m = {};
  for(let i=0;i<tmpls.length;i+=3000){
    const t = await EYG.rpc("product.template","search_read",
      [[["id","in",tmpls.slice(i,i+3000)]]],
      {fields:["id","x_unidad","x_laboratorio"], limit:3000, context:ES});
    (t||[]).forEach(r=>{ m[r.id] = { unidad:(r.x_unidad||"").trim(), lab:(r.x_laboratorio||"").trim() }; });
    paso("Leyendo el Maestro… "+nf(Object.keys(m).length));
  }
  ST.maestro = m;
}

/* Las categorías son un ÁRBOL, igual que en el motor de precios: familias que
   cuelgan de ALL y subcategorías adentro. Agrupar por la categoría hoja de cada
   producto dejaba cientos de entradas sueltas y desordenadas. Acá se mapea a
   nivel de FAMILIA y las subcategorías heredan — con la misma regla que el
   motor: si una subcategoría tiene su propio mapeo, ese pisa al del padre. */
const JUNK_CATS = [1,2,4,294];   // ALL, Varios, Envíos, Redondeo: de sistema, no de productos
async function cargarCategorias(){
  const cats = await EYG.rpc("product.category","search_read",[[["id","child_of",1]]],
    {fields:["id","name","parent_id","complete_name"], limit:5000, context:ES});
  const T = {};
  (cats||[]).forEach(c=>{
    if(JUNK_CATS.includes(c.id)) return;
    T[c.id] = { id:c.id, nm:c.name, pid:(c.parent_id && c.parent_id[0]) || null,
                ruta:c.complete_name || c.name, n:0, total:0, hijos:[] };
  });
  Object.values(T).forEach(c=>{ if(c.pid && T[c.pid]) T[c.pid].hijos.push(c.id); else c.pid = null; });

  // cuántos productos cuelgan de cada rama (propios y acumulados)
  ST.prods.forEach(p=>{ const k = p.categ_id && p.categ_id[0]; if(T[k]) T[k].n++; });
  const acumular = id => { const c=T[id]; c.total = c.n + c.hijos.reduce((s,h)=>s+acumular(h),0); return c.total; };
  const raices = Object.values(T).filter(c=>!c.pid).map(c=>c.id);
  raices.forEach(acumular);

  ST.catTree = T;
  ST.raices = raices.filter(id=>T[id].total>0).sort((a,b)=>T[b].total-T[a].total);
  // La adivinanza se hace sólo en las familias; las subcategorías heredan.
  ST.raices.forEach(id=>{ if(ST.mapCat[id]==null) ST.mapCat[id] = adivinarCat(T[id].nm); });
}

/* Mismo criterio de herencia que el motor de precios: la regla propia manda;
   si no hay, se sube al padre hasta encontrar una. */
function catBionexoDe(catId){
  const T = ST.catTree||{};
  let c = T[catId], saltos = 0;
  while(c && saltos++ < 12){
    if(ST.mapCat[c.id]!=null) return ST.mapCat[c.id];
    c = c.pid ? T[c.pid] : null;
  }
  return 200;
}

function adivinarCat(nombre){
  for(const [re,id] of PISTAS) if(re.test(nombre||"")) return id;
  return 200;   // el cajón más grande: insumos médicos
}
/* ---------- el nombre que ve el comprador ----------
   El nombre de Odoo carga cosas que a Bionexo no le sirven y encima ensucian
   la búsqueda del hospital: el código interno entre corchetes, la ubicación de
   depósito (H-12), notas entre paréntesis («COD. 6264») y, sobre todo, el
   BULTO comercial («Caja x 100 unidades», «se vende por caja cerrada»). El
   bulto no es parte del producto: va en las columnas Embalaje y Unidad de
   Medida, que para eso están.

   OJO: se saca el bulto, NO la presentación. «AMP X 10 ML» o «x 500 MTS» son
   el producto y se quedan. Por eso los patrones son estrechos y anclados al
   final: es preferible limpiar de menos que romper un nombre. */
const CONTENEDORES_RE = "caja|pack|kit|bulto|estuche|display|bols[oó]n|caj[oó]n";
function nombreParaBionexo(raw){
  let s = String(raw||"");
  s = s.replace(/^\s*\[[^\]]*\]\s*/,"");                  // [15346] al principio
  s = s.replace(/\(([^)]*)\)/g," ");                       // (COD. 6264), (troquel anulado)…
  s = s.replace(/@/g," ");
  s = s.replace(/\b[HB]-\d+(-\d+)?\b/gi," ");              // ubicación de depósito
  // bulto comercial al final: "- Caja x 100 u.", "caja cerrada x 50", "x 100 unidades"
  s = s.replace(new RegExp("\\s*[-–]?\\s*(" + CONTENEDORES_RE + ")\\s*(cerrad[ao])?\\s*x\\s*\\d+\\s*(u\\.?|unid\\.?|unidades)?\\s*$","i")," ");
  s = s.replace(/\s+x\s*\d+\s*(u\.|unid\.?|unidades)\s*$/i," ");
  s = s.replace(/\s*[-–]\s*$/,"");                         // guión colgando
  s = s.replace(/\s+/g," ").replace(/\s+([.,])/g,"$1").trim();
  return s;
}

/* La unidad sale del Maestro. Si el producto no la tiene cargada devuelve
   vacío a propósito: preferimos avisar que falta antes que inventarla. */
function unidadDe(p){
  const m = (ST.maestro||{})[p.product_tmpl_id && p.product_tmpl_id[0]];
  const k = m && m.unidad;
  if(!k) return null;
  const bx = ST.mapUom[k];
  return bx!=null ? {clave:k, bx} : {clave:k, bx:6};
}

/* Precio de la lista elegida. Mismo criterio que el Cotizador: ítems por
   variante (tiers 2/3) o por plantilla (Farmacias, con escalera). Para el
   catálogo se toma el PRIMER tramo, que es el precio sin cantidad mínima. */
async function cargarPrecios(){
  ST.precios = {};
  const tmpls = [...new Set(ST.prods.map(p=>p.product_tmpl_id && p.product_tmpl_id[0]).filter(Boolean))];
  const items = [];
  for(let i=0;i<tmpls.length;i+=4000){
    const t = await EYG.rpc("product.pricelist.item","search_read",
      [[["pricelist_id","=",ST.lista]]],
      {fields:["product_tmpl_id","product_id","applied_on","min_quantity","fixed_price","compute_price"], limit:30000, offset:i, context:ES});
    items.push(...(t||[]));
    if(!t || t.length<30000) break;
  }
  const porT={}, porV={};
  items.forEach(it=>{
    if(it.compute_price!=="fixed" || !(it.fixed_price>0)) return;
    if(it.applied_on==="0_product_variant" && it.product_id) (porV[it.product_id[0]]=porV[it.product_id[0]]||[]).push(it);
    else if(it.product_tmpl_id) (porT[it.product_tmpl_id[0]]=porT[it.product_tmpl_id[0]]||[]).push(it);
  });
  ST.prods.forEach(p=>{
    const t = p.product_tmpl_id && p.product_tmpl_id[0];
    const src = (porV[p.id] && porV[p.id].length) ? porV[p.id] : (porT[t]||[]);
    const arr = src.map(i=>({q:i.min_quantity||1, p:i.fixed_price})).sort((a,b)=>a.q-b.q);
    if(arr.length) ST.precios[p.id] = arr[0].p;
  });
}

/* Comprometido = unidades de pedidos CONFIRMADOS con entrega pendiente o
   parcial. Misma definición que usa Cargar venta: publicar el físico sería
   ofrecer mercadería que ya tiene dueño. */
async function cargarComprometido(){
  try{
    const g = await EYG.rpc("sale.order.line","read_group",
      [[["order_id.state","=","sale"],["order_id.delivery_status","in",["pending","partial"]]],
       ["product_uom_qty:sum","qty_delivered:sum"],["product_id"]],
      {lazy:false, limit:8000, context:ES});
    const m={};
    (g||[]).forEach(r=>{ if(!r.product_id) return; const c=(r.product_uom_qty||0)-(r.qty_delivered||0); if(c>0.001) m[r.product_id[0]]=c; });
    ST.comprometido = m;
  }catch(e){ ST.comprometido = {}; }
}

/* ---------------- cálculo ---------------- */
const dispDe = p => Math.round(((p.qty_available||0) - (ST.comprometido[p.id]||0))*100)/100;

function ivaDe(p){
  const ids = p.taxes_id || [];
  for(const id of ids){ const t=ST.taxmap[id]; if(t && t.pct>0) return t.pct; }
  return 0;
}

/* Lo que hay en Bionexo, por código. El código de Bionexo ES el nuestro
   (columna «Codigo Producto»), así que el cruce es directo. */
function mapaBionexo(){
  const m = {};
  ST.bionexo.forEach(b=>{ if(b.codigo) m[String(b.codigo).trim()] = b; });
  return m;
}

function armarFilas(){
  const filas=[], fuera={sinCodigo:0, sinPrecio:0, sinStock:0, comprometido:0};
  const sinUnidad = [];
  ST.prods.forEach(p=>{
    const precio = ST.precios[p.id];
    const disp = dispDe(p);
    if(!p.default_code){ fuera.sinCodigo++; return; }
    if(!(precio>0)){ fuera.sinPrecio++; return; }
    if(!(disp>0)){ (p.qty_available>0 ? fuera.comprometido++ : fuera.sinStock++); return; }
    const iva = ivaDe(p);
    const publicar = Math.floor(disp * (ST.colchon/100));
    if(publicar<1) { fuera.sinStock++; return; }
    const uni = unidadDe(p);
    if(!uni) sinUnidad.push(p);   // entra igual, pero queda avisado
    const original = (p.name||"").trim();
    const limpio = ST.limpiarNombres===false ? original : nombreParaBionexo(original);
    filas.push({
      estado:"S",
      codigo:String(p.default_code),
      nombre: limpio || original,
      nombreOdoo: original,
      cat: catBionexoDe(p.categ_id && p.categ_id[0]),
      gtin: p.barcode || "",
      uom: uni ? uni.bx : 6,
      uniClave: uni ? uni.clave : "",
      lab: ((ST.maestro||{})[p.product_tmpl_id && p.product_tmpl_id[0]]||{}).lab || "",
      precio: Math.round(precio*100)/100,
      iva,
      conIva: Math.round(precio*(1+iva/100)*100)/100,
      descuento: ST.descuento || 0,
      stock: publicar,
      disp, fisico: p.qty_available||0, comp: ST.comprometido[p.id]||0,
      catNombre: (p.categ_id && p.categ_id[1]) || ""
    });
  });
  filas.sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));

  /* ---- altas, actualizaciones y bajas ---- */
  const enBionexo = mapaBionexo();
  const hayComparacion = ST.bionexo.length > 0;
  let altas = 0, actualiza = 0;
  filas.forEach(f=>{ if(enBionexo[f.codigo]) actualiza++; else altas++; });

  // Baja = está cargado en Bionexo y no entra en el archivo nuevo.
  // Se separan los dos motivos porque el riesgo es distinto: el que no existe
  // en Odoo hay que apagarlo sí o sí; el que sólo se quedó sin stock hoy
  // conviene pensarlo — apagarlo y prenderlo todo el tiempo nos borra de la
  // vista del comprador.
  const codigosNuevos = new Set(filas.map(f=>f.codigo));
  const codigosOdoo = new Set(ST.prods.map(p=>String(p.default_code||"").trim()).filter(Boolean));
  const bajas = { noExiste: [], sinStock: [] };
  if(hayComparacion){
    ST.bionexo.forEach(b=>{
      const cod = String(b.codigo||"").trim();
      if(!cod || codigosNuevos.has(cod)) return;
      (codigosOdoo.has(cod) ? bajas.sinStock : bajas.noExiste).push(b);
    });
  }
  return {filas, fuera, hayComparacion, altas, actualiza, bajas, sinUnidad,
          cambiados: filas.filter(f=>f.nombre!==f.nombreOdoo)};
}

/* Las bajas viajan en el mismo archivo, con Estado N: Bionexo las desactiva. */
function filasDeBaja(bajas){
  const lista = [...bajas.noExiste, ...(ST.bajarSinStock ? bajas.sinStock : [])];
  return lista.map(b=>({
    estado:"N", codigo:String(b.codigo), nombre:b.nombre||"", cat:b.cat||200, gtin:"", uom:b.uom||6,
    precio:0, iva:0, conIva:0, descuento:0, stock:0, disp:0, fisico:0, comp:0, catNombre:""
  }));
}

/* El árbol de categorías tal como está armado en Odoo. Las familias se mapean;
   las subcategorías dicen «igual que la familia» salvo que se les ponga otra
   cosa — misma herencia que las reglas del motor de precios. */
function tablaCategorias(){
  const T = ST.catTree||{}, filas=[];
  const bajar = (id, nivel) => {
    const c = T[id];
    if(!c || !c.total) return;
    filas.push({...c, nivel});
    c.hijos.map(h=>T[h]).filter(h=>h && h.total)
      .sort((a,b)=>b.total-a.total)
      .forEach(h=>bajar(h.id, nivel+1));
  };
  (ST.raices||[]).forEach(id=>bajar(id,0));
  if(!filas.length) return `<div class="card pad"><p class="cargando" style="margin:0">No pude leer las categorías.</p></div>`;

  return `<div class="scroll"><table>
    <thead><tr><th>Categoría en Odoo</th><th class="r">Productos</th><th>Va a Bionexo como</th></tr></thead>
    <tbody>${filas.map(f=>{
      const propio = ST.mapCat[f.id];
      const efectivo = catBionexoDe(f.id);
      const esRaiz = f.nivel===0;
      const nombre = esRaiz
        ? `<b>${esc(f.nm)}</b>`
        : `<span style="color:var(--gris2)">${"&nbsp;".repeat(f.nivel*4)}└ </span>${esc(f.nm)}`;
      const opciones = (esRaiz ? "" : `<option value="">↑ igual que la familia (${efectivo})</option>`) +
        CATEGORIAS.map(o=>`<option value="${o.id}" ${String(propio)===String(o.id)?"selected":""}>${o.id} · ${esc(o.t)}</option>`).join("");
      return `<tr${esRaiz?' style="background:#F7FBFA"':''}>
        <td class="nm" style="font-weight:${esRaiz?700:500}">${nombre}</td>
        <td class="r">${f.total ? nf(f.total) : ""}${f.n && f.n!==f.total ? ` <span style="color:var(--gris2)">(${nf(f.n)} propios)</span>`:""}</td>
        <td><select data-tipo="cat" data-id="${f.id}">${opciones}</select></td>
      </tr>`;
    }).join("")}</tbody></table></div>`;
}

function tablaMapa(tipo){
  if(tipo==="cat") return tablaCategorias();
  const cuenta = {};
  ST.prods.forEach(p=>{ const m=(ST.maestro||{})[p.product_tmpl_id && p.product_tmpl_id[0]];
    if(m && m.unidad) cuenta[m.unidad]=(cuenta[m.unidad]||0)+1; });
  return `<div class="scroll"><table>
    <thead><tr><th>Unidad de venta (Maestro)</th><th class="r">Productos</th><th>Se llama en Bionexo</th></tr></thead>
    <tbody>${UNIDAD_EYG.map(u=>`<tr${cuenta[u.k]?"":' style="opacity:.5"'}>
      <td class="nm">${esc(u.lbl)}</td>
      <td class="r">${cuenta[u.k]?nf(cuenta[u.k]):"—"}</td>
      <td><select data-tipo="uom" data-id="${u.k}">${UNIDADES.map(o=>
        `<option value="${o.id}" ${String(ST.mapUom[u.k])===String(o.id)?"selected":""}>${o.id} · ${esc(o.t)}</option>`).join("")}</select></td>
    </tr>`).join("")}</tbody></table></div>`;
}

function tablaPrevia(filas){
  if(!filas.length) return `<div class="card pad"><p class="cargando" style="margin:0">No hay productos que cumplan las condiciones.</p></div>`;
  const v = filas.slice(0, ST.tope);
  const catNm = id => (CATEGORIAS.find(c=>c.id==id)||{}).t || id;
  return `<div class="scroll"><table>
    <thead><tr>
      <th>Producto</th><th>Código</th><th>Categoría Bionexo</th><th class="r">Precio</th>
      <th class="r">IVA</th><th class="r">Con IVA</th><th class="r">Desc.</th>
      <th class="r">Publica</th><th class="r">Disponible</th>
    </tr></thead>
    <tbody>${v.map(f=>`<tr>
      <td class="nm">${esc(f.nombre)}</td>
      <td class="cod">${esc(f.codigo)}</td>
      <td style="font-size:12px;color:var(--gris)">${esc(catNm(f.cat))}</td>
      <td class="r">${money(f.precio)}</td>
      <td class="r">${f.iva ? f.iva+"%" : `<span class="pill ok">exento</span>`}</td>
      <td class="r">${money(f.conIva)}</td>
      <td class="r">${f.descuento? f.descuento+"%" : "—"}</td>
      <td class="r"><b>${nf(f.stock)}</b></td>
      <td class="r" style="color:var(--gris2)">${nf(f.disp)}${f.comp?` <span class="pill warn">${nf(f.comp)} comp.</span>`:""}</td>
    </tr>`).join("")}</tbody></table></div>
    <div class="mas">${filas.length>v.length ? `Mostrando ${nf(v.length)} de ${nf(filas.length)} · el archivo los lleva todos` : `${nf(filas.length)} productos · eso es todo`}</div>`;
}

function enganchar(){
  const l=document.getElementById("lista");
  if(l) l.onchange = async ()=>{
    ST.lista = +l.value; guardar();
    document.getElementById("cap").innerHTML = `<div class="spin"></div><p class="cargando" id="paso">Releyendo precios…</p>`;
    await cargarPrecios(); render();
  };
  const d=document.getElementById("desc");
  if(d) d.onchange = ()=>{ ST.descuento = Math.max(0, Math.min(90, +d.value||0)); guardar(); render(); };
  const c=document.getElementById("colchon");
  if(c) c.onchange = ()=>{ ST.colchon = Math.max(10, Math.min(100, +c.value||100)); guardar(); render(); };
  document.querySelectorAll("select[data-tipo]").forEach(s=>s.onchange=()=>{
    const mapa = s.dataset.tipo==="cat" ? ST.mapCat : ST.mapUom;
    if(s.value==="") delete mapa[s.dataset.id];        // vuelve a heredar de la familia
    else mapa[s.dataset.id] = +s.value;
    guardar(); render();
  });
  const g=document.getElementById("gen"); if(g) g.onclick = ()=>bajarExcel();
  const v=document.getElementById("csv"); if(v) v.onclick = ()=>bajarCsv();
  const ss=document.getElementById("bajarSS");
  if(ss) ss.onchange = ()=>{ ST.bajarSinStock = ss.checked; render(); };
  const lm=document.getElementById("limpiar");
  if(lm) lm.onchange = ()=>{ ST.limpiarNombres = lm.checked; guardar(); render(); };
  const fb=document.getElementById("fileBx");
  if(fb) fb.onchange = e=>leerCatalogoBionexo(e.target.files[0]);
}

/* Lee el archivo que exporta Bionexo. Trae las mismas 20 columnas de la
   plantilla y, al final, unas filas de leyenda que NO son productos: por eso
   sólo se toman las que tienen un código con forma de código. */
function leerCatalogoBionexo(file){
  if(!file) return;
  const fr = new FileReader();
  fr.onload = ev => {
    try{
      const libro = XLSX.read(new Uint8Array(ev.target.result), {type:"array"});
      const hoja = libro.Sheets[libro.SheetNames[0]];
      const filas = XLSX.utils.sheet_to_json(hoja, {defval:""});
      ST.bionexo = filas.map(r=>({
        codigo: String(r["Codigo Producto"]||"").trim(),
        nombre: String(r["Descripcion Producto"]||"").trim(),
        cat: Math.round(parseFloat(r["ID Categoria"])||0) || 200,
        uom: Math.round(parseFloat(r["ID Unidad de Medida"])||0) || 6,
        precio: parseFloat(r["Precio Unitario"])||0
      })).filter(b=>b.codigo && /^[A-Za-z0-9._\/-]+$/.test(b.codigo));
      if(!ST.bionexo.length){ alert("No encontré productos en ese archivo. ¿Es el que baja Bionexo en Catálogo de Productos → Descargar Catálogo?"); return; }
      render();
    }catch(err){ alert("No pude leer el archivo: "+err.message); }
  };
  fr.readAsArrayBuffer(file);
}

/* ---------------- el archivo ---------------- */
/* Las cabeceras van EXACTAMENTE como en la plantilla ModeloUpload_AR_v2.0,
   incluido el espacio al final de «Marca ». Bionexo las busca por nombre. */
const CABECERA = ["Estado","Codigo Producto","Descripcion Producto","ID Categoria","GTIN","GLN","CUFE",
  "ID Unidad de Medida","Embalaje","Forma Farmaceutica","Sustancia","Marca ","Comentario",
  "Precio Unitario","Tasa IVA","Unitario con IVA","Referencia Proveedor","Descuento","Stock Disponible"];

/* Orden de la plantilla: Estado · Codigo · Descripcion · Categoria · GTIN · GLN ·
   CUFE · Unidad · Embalaje · Forma Farmaceutica · Sustancia · Marca · Comentario ·
   Precio · IVA · Con IVA · Referencia Proveedor · Descuento · Stock */
const aFila = f => [f.estado, f.codigo, f.nombre, f.cat, f.gtin, "", "", f.uom, "", "", "", f.lab||"", "",
                    f.precio, f.iva, f.conIva, f.codigo, f.descuento, f.stock];

function nombreArchivo(ext){
  return "catalogo-eyg-bionexo-"+new Date().toISOString().slice(0,10)+"."+ext;
}

function bajarExcel(){
  const filas = [...(ST._filas||[]), ...(ST._bajas||[])];   // las bajas van en el mismo archivo
  if(!filas.length) return;
  const datos = [CABECERA, ...filas.map(aFila)];
  const hoja = XLSX.utils.aoa_to_sheet(datos);
  const libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, hoja, "Catalogo Producto");
  XLSX.writeFile(libro, nombreArchivo("xlsx"));
}

function bajarCsv(){
  const filas = [...(ST._filas||[]), ...(ST._bajas||[])];   // las bajas van en el mismo archivo
  const q = s => '"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  const txt = [CABECERA.map(q).join(";"), ...filas.map(f=>aFila(f).map(q).join(";"))].join("\n");
  const blob = new Blob(["﻿"+txt], {type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nombreArchivo("csv"); a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
</script>
