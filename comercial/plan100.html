<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan 100×100 · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css?v=83">
<style>
  /* ===== Plan 100x100 · todo lo de este módulo va bajo .p100 ===== */
  .p100{--ok:#1E7D46;--ok-bg:#E4F5E9;--cerca:#9A6B12;--cerca-bg:#FBF0DA;--lejos:#8A9A97;--lejos-bg:#EEF1F0;
        --mal:#B0322F;--mal-bg:#FBE4E3;--barra:#048782;--barra2:#7FC4BF}
  .p100 .intro{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 18px;
    box-shadow:var(--shadow);margin-bottom:16px;font-size:13.5px;color:var(--gris);line-height:1.6}
  .p100 .intro b{color:var(--ink)}
  .p100 .intro .regla{margin-top:10px;background:var(--agua);border-radius:10px;padding:10px 13px;color:#20423E;font-size:13px}
  .p100 .barra-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .p100 .sel,.p100 .btn-act{font:inherit;font-size:12.5px;font-weight:700;padding:7px 11px;border:1px solid var(--line);
    border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer}
  .p100 .btn-act{font-weight:800;color:var(--teal-deep)}
  .p100 .btn-act:hover{background:var(--agua)}
  .p100 .status{font-size:12.5px;color:var(--gris);min-height:18px;margin-bottom:14px}

  /* ---- tarjetas de arriba ---- */
  .p100 .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(156px,1fr));gap:11px;margin-bottom:18px}
  .p100 .kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px 11px;
    box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
  .p100 .kpi .l{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--gris2);font-weight:800}
  .p100 .kpi .v{font-size:25px;font-weight:900;letter-spacing:-.7px;color:var(--teal-deep);
    font-variant-numeric:tabular-nums;margin-top:3px;line-height:1.05}
  .p100 .kpi .s{font-size:11.5px;color:var(--gris);margin-top:3px;line-height:1.4}
  .p100 .kpi.hero{grid-column:span 2;display:flex;gap:16px;align-items:center}
  @media(max-width:620px){ .p100 .kpi.hero{grid-column:span 1;flex-direction:column;align-items:flex-start} }
  .p100 .kpi.hero .anillo{flex:0 0 auto}
  .p100 .kpi.hero .v{font-size:34px}

  /* ---- anillo de progreso ---- */
  .p100 .ring circle{fill:none;stroke-linecap:round}
  .p100 .ring .bg{stroke:#E6EFEE}
  .p100 .ring .fg{stroke:var(--teal)}
  .p100.anim .ring .fg{animation:p100-ring 1.1s cubic-bezier(.22,1,.36,1)}

  /* ---- gráficos ---- */
  .p100 .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    margin-bottom:18px;overflow:hidden}
  .p100 .chead{padding:13px 17px 11px;border-bottom:1px solid var(--line)}
  .p100 .chead h3{margin:0;font-size:14.5px;font-weight:900;color:var(--ink);letter-spacing:-.2px}
  .p100 .chead p{margin:4px 0 0;font-size:12px;color:var(--gris);line-height:1.5}
  .p100 .cbody{padding:15px 17px 17px}
  .p100 svg{display:block;width:100%;height:auto;overflow:visible}
  .p100 .gtxt{font-size:10.5px;fill:var(--gris2);font-weight:700}
  .p100 .gnum{font-size:11px;fill:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
  /* Las barras crecen al entrar. OJO: el reposo es el estado VISIBLE y el
     @keyframes arranca desde cero — nunca al revés. Una barra que depende de que
     la animación corra desaparece cuando la pestaña está en segundo plano. */
  @media (prefers-reduced-motion:reduce){ .p100.anim *{animation:none !important} }
  @keyframes p100-up{ from{transform:scaleY(0)} }
  @keyframes p100-right{ from{transform:scaleX(0)} }
  @keyframes p100-ring{ from{stroke-dashoffset:var(--c)} }
  .p100 .gb{transform-box:fill-box;transform-origin:bottom}
  .p100 .gh{transform-box:fill-box;transform-origin:left}
  .p100.anim .gb{animation:p100-up .85s cubic-bezier(.22,1,.36,1)}
  .p100.anim .gh{animation:p100-right .8s cubic-bezier(.22,1,.36,1)}
  .p100 .meta-line{stroke:var(--mal);stroke-width:1.5;stroke-dasharray:5 4;opacity:.75}

  /* ---- escalera por tramo ---- */
  .p100 .esc{display:grid;gap:7px}
  .p100 .escrow{display:grid;grid-template-columns:118px 1fr 118px;gap:10px;align-items:center;font-size:12.5px}
  .p100 .escrow .et{color:var(--gris);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .p100 .escrow .eb{height:22px;background:#EFF5F4;border-radius:6px;overflow:hidden}
  .p100 .escrow .eb i{display:block;height:100%;border-radius:6px;background:var(--barra2);
    transform-origin:left}
  .p100.anim .escrow .eb i{animation:p100-right .8s cubic-bezier(.22,1,.36,1)}
  .p100 .escrow.on .eb i{background:var(--barra)}
  .p100 .escrow .en{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
  .p100 .escrow .en small{color:var(--gris2);font-weight:700}

  /* ---- comerciales ---- */
  .p100 .comgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px}
  .p100 .comcard{border:1px solid var(--line);border-radius:13px;padding:13px 15px;background:var(--surface)}
  .p100 .comcard h4{margin:0;font-size:13.5px;font-weight:900;color:var(--ink)}
  .p100 .comcard .n{font-size:28px;font-weight:900;color:var(--teal-deep);letter-spacing:-.8px;
    font-variant-numeric:tabular-nums;margin-top:2px}
  .p100 .comcard .n span{font-size:14px;color:var(--gris2);font-weight:800;letter-spacing:0}
  .p100 .comcard .bar{height:8px;background:#EFF5F4;border-radius:5px;overflow:hidden;margin:9px 0 7px}
  .p100 .comcard .bar i{display:block;height:100%;border-radius:5px;transform-origin:left}
  .p100.anim .comcard .bar i{animation:p100-right .9s cubic-bezier(.22,1,.36,1)}
  .p100 .comcard .dv{font-size:12px;font-weight:800}
  .p100 .comcard .dv.ok{color:var(--ok)} .p100 .comcard .dv.bad{color:var(--mal)}
  .p100 .comcard .sub{font-size:11.5px;color:var(--gris);margin-top:5px;line-height:1.45}
  .p100 .comcard .avisar{margin-top:9px;font:inherit;font-size:11.5px;font-weight:800;padding:6px 11px;
    border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--teal-deep);cursor:pointer}
  .p100 .comcard .avisar:hover{background:var(--agua)}

  /* ---- tabla ---- */
  .p100 .thead,.p100 .trow{display:grid;grid-template-columns:minmax(0,2.4fr) 1fr 108px 112px 112px 104px;
    gap:10px;align-items:center;padding:10px 17px}
  .p100 .thead{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--gris2);font-weight:800;
    border-bottom:1px solid var(--line);background:#FAFCFC}
  .p100 .trow{border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
  .p100 .trow:last-child{border-bottom:0}
  .p100 .trow:hover{background:var(--agua)}
  .p100 .trow .fn{font-weight:800;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p100 .trow .ft{font-size:11px;color:var(--gris2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  .p100 .trow .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;color:var(--ink)}
  .p100 .trow .com{font-size:12px;color:var(--gris);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p100 .est{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:2px 9px;
    border-radius:20px;white-space:nowrap}
  .p100 .est.ok{background:var(--ok-bg);color:var(--ok)}
  .p100 .est.cerca{background:var(--cerca-bg);color:var(--cerca)}
  .p100 .est.lejos{background:var(--lejos-bg);color:var(--lejos)}
  .p100 .ritmo{display:flex;gap:2px;align-items:flex-end;height:20px}
  .p100 .ritmo i{width:6px;border-radius:2px;background:#D9E6E4;transform-origin:bottom}
  .p100.anim .ritmo i{animation:p100-up .6s cubic-bezier(.22,1,.36,1)}
  .p100 .ritmo i.hit{background:var(--barra)}
  .p100 .ritmo-l{font-size:10.5px;color:var(--gris2);font-weight:800;margin-top:2px}
  @media(max-width:860px){
    .p100 .thead{display:none}
    .p100 .trow{grid-template-columns:1fr auto;gap:6px 10px;padding:12px 15px}
    .p100 .trow .cel-com{grid-column:1/-1}
    .p100 .trow .num{text-align:left}
    .p100 .trow .num::before{content:attr(data-l);display:block;font-size:9.5px;font-weight:800;
      letter-spacing:.4px;text-transform:uppercase;color:var(--gris2)}
    .p100 .trow .cel-ritmo,.p100 .trow .cel-prom,.p100 .trow .cel-ult,.p100 .trow .cel-venc{grid-column:auto}
  }
  .p100 .empty{padding:26px 17px;text-align:center;color:var(--gris);font-size:13px}
  .p100 .errbox{background:#FBE4E3;color:#8A2320;border-radius:12px;padding:14px 16px;font-size:13px;margin-bottom:14px}
  .p100 .nota{font-size:11.5px;color:var(--gris2);padding:10px 17px;border-top:1px solid var(--line);line-height:1.5}

  /* ---- drawer de la farmacia ---- */
  .p100-scrim{position:fixed;inset:0;background:rgba(10,30,28,.42);opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:60}
  .p100-scrim.on{opacity:1;pointer-events:auto}
  .p100-dr{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg,#F6F9F9);
    box-shadow:-10px 0 40px rgba(6,65,62,.18);transform:translateX(100%);transition:transform .24s cubic-bezier(.22,1,.36,1);
    z-index:61;display:flex;flex-direction:column}
  .p100-dr.on{transform:none}
  .p100-dr .dh{background:var(--teal-deep);color:#fff;padding:15px 18px;display:flex;align-items:flex-start;gap:12px}
  .p100-dr .dh h2{margin:0;font-size:16px;font-weight:900;letter-spacing:-.3px;line-height:1.25}
  .p100-dr .dh .ds{font-size:12px;color:#B9CFCB;margin-top:3px}
  .p100-dr .dh .x{margin-left:auto;cursor:pointer;font-size:20px;line-height:1;opacity:.85}
  .p100-dr .db{flex:1;overflow:auto;padding:16px 18px 28px}
  .p100-dr .mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin-bottom:16px}
  .p100-dr .mini div{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
  .p100-dr .mini .l{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--gris2);font-weight:800}
  .p100-dr .mini .v{font-size:17px;font-weight:900;color:var(--teal-deep);font-variant-numeric:tabular-nums;margin-top:2px}
  .p100-dr h3{font-size:12.5px;font-weight:900;color:var(--ink);text-transform:uppercase;letter-spacing:.5px;
    margin:18px 0 9px}
  .p100-dr .prow{display:grid;grid-template-columns:1fr 96px 74px;gap:9px;padding:8px 0;
    border-bottom:1px solid var(--line);font-size:12.5px;align-items:center}
  .p100-dr .prow:last-child{border-bottom:0}
  .p100-dr .prow .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:600}
  .p100-dr .prow .pv{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;color:var(--ink)}
  .p100-dr .prow .pq{text-align:right;font-variant-numeric:tabular-nums;color:var(--gris)}
  .p100-dr .cargando{color:var(--gris);font-size:12.5px;padding:10px 0}
  .p100-dr .errbox{background:#FBE4E3;color:#8A2320;border-radius:12px;padding:13px 15px;font-size:12.5px}
</style>

<body>
<div id="app"><div class="loading"><div class="spinner"></div>Cargando el plan…</div></div>
<script src="../assets/core.js?v=107"></script>
<script>
/* ============================================================================
   PLAN 100×100  —  SOLO FARMACIAS
   La regla, tal como la definió Germán: 100 farmacias que compren como MÍNIMO
   $1.000.000 en el mes. Se mide MES A MES. Comprar más no cambia nada: cuenta
   una vez. Pueden rotar de un mes a otro — lo que importa es que cada mes haya
   100 que lleguen.

   Decisiones de medición (las mismas que usa el resto del Core):
   - NETO, sin IVA (price_subtotal de account.move.line, diario de ventas).
   - Las NOTAS DE CRÉDITO se restan del mes en que se emitieron.
   - La compra se le imputa a la ficha FISCAL: si la factura salió a una
     dirección de entrega o a un contacto-persona, suma al padre.
   - El margen sale de sale.order.line (margin), solo de las líneas con costo
     cargado; abajo de la tabla se avisa cuánto quedó sin medir.

   El umbral y la meta son CONFIGURABLES (parámetro eyg.plan100): el millón de
   hoy no va a ser el millón del año que viene.
   ============================================================================ */
const RUBRO = EYG.RUBRO_FIELD, FANT = EYG.FANT;
const CFG_KEY = "eyg.plan100";
const CFG_DEF = { umbral:1000000, meta:100, ventana:6, minRegular:4, tolerancia:0.15, cercaPct:0.6,
                  minCartera:10, comerciales:[] };

let PERFIL=null, CFG={...CFG_DEF};
const ST = {
  meses:[], serie:{}, farm:{}, padre:{},     // datos crudos
  filas:[], porMes:[], comerciales:[],       // derivados
  mesSel:null, orden:"prom", filtroCom:"", filtroEst:"",
  margen:{}, tickets:{}, deuda:{}, cobertura:0,
  roster:[], abierta:null, detalle:{}
};

const money = EYG.money, esc = EYG.esc;
const M0 = n => "$"+Math.round(n||0).toLocaleString("es-AR");
const Mk = n => { n=n||0; if(Math.abs(n)>=1e6) return "$"+(n/1e6).toFixed(n>=1e7?0:1).replace(".",",")+"M";
                  if(Math.abs(n)>=1e3) return "$"+Math.round(n/1e3)+"k"; return "$"+Math.round(n); };
const pct = (a,b) => b? Math.round(a/b*100) : 0;

/* ---------- meses ---------- */
function listaMeses(n){
  const out=[], hoy=EYG.argToday(); const y=+hoy.slice(0,4), m=+hoy.slice(5,7);
  for(let i=0;i<n;i++){ const d=new Date(y, m-1-i, 1);
    out.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")); }
  return out.reverse();
}
const finMes = k => { const [y,m]=k.split("-").map(Number); return k+"-"+String(new Date(y,m,0).getDate()).padStart(2,"0"); };
const MESNOM = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const mesCorto = k => MESNOM[+k.slice(5,7)-1] + (k.slice(5,7)==="01" ? " "+k.slice(2,4) : "");
const mesLargo = k => ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"][+k.slice(5,7)-1]+" de "+k.slice(0,4);

/* ============================ CARGA ============================ */
async function cargarConfig(){
  try{
    const r=await EYG.rpc("ir.config_parameter","search_read",[[["key","=",CFG_KEY]]],{fields:["value"],limit:1});
    if(r&&r[0]&&r[0].value) CFG={...CFG_DEF, ...JSON.parse(r[0].value)};
  }catch(e){ CFG={...CFG_DEF}; }
}
async function guardarConfig(){
  await EYG.rpc("ir.config_parameter","set_param",[CFG_KEY, JSON.stringify(CFG)]);
}

async function cargar(){
  const st=document.getElementById("p100status");
  const paso=t=>{ if(st) st.textContent=t; };
  paso("Buscando las farmacias…");

  // 1) universo: fichas fiscales de rubro FARMACIAS + sus hijas (para imputar bien la factura)
  const farm=await EYG.rpc("res.partner","search_read",[[[RUBRO,"=","FARMACIAS"],["parent_id","=",false]]],
    {fields:["id","name",FANT,"user_id","city","phone","mobile","property_payment_term_id"],limit:0,context:{lang:"es_AR"}});
  ST.farm={}; farm.forEach(f=>{ ST.farm[f.id]=f; ST.padre[f.id]=f.id; });
  const ids=farm.map(f=>f.id);
  if(ids.length){
    const hijas=await EYG.rpc("res.partner","search_read",[[["parent_id","in",ids]]],
      {fields:["id","parent_id"],limit:0,context:{lang:"es_AR",active_test:false}});
    hijas.forEach(h=>ST.padre[h.id]=h.parent_id[0]);
  }
  const todosIds=Object.keys(ST.padre).map(Number);

  // 2) facturación neta mes a mes (14 meses: 12 para ver la película + el corriente + margen de corte)
  ST.meses=listaMeses(14);
  paso("Midiendo la compra de cada mes…");
  const desde=ST.meses[0]+"-01", hasta=finMes(ST.meses[ST.meses.length-1]);
  const domFac=t=>[["journal_id.type","=","sale"],["move_id.move_type","=",t],["move_id.state","=","posted"],
                   ["date",">=",desde],["date","<=",hasta],["partner_id","in",todosIds]];
  const [fi,fr]=await Promise.all([
    EYG.rpc("account.move.line","read_group",[domFac("out_invoice"),["price_subtotal:sum"],["partner_id","date:month"]],{lazy:false}),
    EYG.rpc("account.move.line","read_group",[domFac("out_refund"), ["price_subtotal:sum"],["partner_id","date:month"]],{lazy:false}),
  ]);
  ST.serie={}; ST.meses.forEach(k=>ST.serie[k]={});
  const meter=(rows,sg)=>rows.forEach(x=>{
    const pid=x.partner_id&&x.partner_id[0]; if(!pid) return;
    const f=ST.padre[pid]; if(!f) return;
    const rg=x.__range&&x.__range["date:month"]; const k=rg?rg.from.slice(0,7):null;
    if(!k||!ST.serie[k]) return;
    ST.serie[k][f]=(ST.serie[k][f]||0)+sg*(x.price_subtotal||0);
  });
  meter(fi,1); meter(fr,-1);

  // 3) margen y tickets de la ventana, y la deuda de hoy
  const vIni=ST.meses[ST.meses.length-1-CFG.ventana]+"-01";
  paso("Calculando margen, ticket y cobranza…");
  const hoy=EYG.argToday();
  const [mg,mgTot,ped, dTot, dVen] = await Promise.all([
    EYG.rpc("sale.order.line","read_group",
      [[["order_id.state","in",["sale","done"]],["order_id.date_order",">=",vIni],
        ["order_partner_id","in",todosIds],["purchase_price",">",0]],
       ["margin:sum","price_subtotal:sum"],["order_partner_id"]],{lazy:false}).catch(()=>[]),
    EYG.rpc("sale.order.line","read_group",
      [[["order_id.state","in",["sale","done"]],["order_id.date_order",">=",vIni],
        ["order_partner_id","in",todosIds]],
       ["price_subtotal:sum"],["order_partner_id"]],{lazy:false}).catch(()=>[]),
    EYG.rpc("sale.order","read_group",
      [[["state","in",["sale","done"]],["date_order",">=",vIni],["partner_id","in",todosIds]],
       ["amount_untaxed:sum"],["partner_id"]],{lazy:false}).catch(()=>[]),
    EYG.rpc("account.move.line","read_group",
      [[["account_id.account_type","=","asset_receivable"],["parent_state","=","posted"],
        ["full_reconcile_id","=",false],["amount_residual",">",0],["partner_id","in",todosIds]],
       ["amount_residual:sum"],["partner_id"]],{lazy:false}).catch(()=>[]),
    EYG.rpc("account.move.line","read_group",
      [[["account_id.account_type","=","asset_receivable"],["parent_state","=","posted"],
        ["full_reconcile_id","=",false],["amount_residual",">",0],["date_maturity","<",hoy],
        ["partner_id","in",todosIds]],["amount_residual:sum"],["partner_id"]],{lazy:false}).catch(()=>[]),
  ]);
  const alPadre=(rows,campo,dest,extra)=>rows.forEach(x=>{
    const k=x.order_partner_id||x.partner_id; const pid=k&&k[0]; if(!pid) return;
    const f=ST.padre[pid]; if(!f) return;
    const o=dest[f]=dest[f]||{};
    o[campo]=(o[campo]||0)+(x[campo]||0);
    if(extra) o[extra.k]=(o[extra.k]||0)+(x[extra.f]||0);
    o.n=(o.n||0)+(x.__count||0);
  });
  ST.margen={}; alPadre(mg,"margin",ST.margen,{k:"base",f:"price_subtotal"});
  ST.ventaMed={}; alPadre(mgTot,"price_subtotal",ST.ventaMed);
  ST.tickets={}; alPadre(ped,"amount_untaxed",ST.tickets);
  ST.deuda={};
  dTot.forEach(x=>{ const f=ST.padre[x.partner_id&&x.partner_id[0]]; if(f){ ST.deuda[f]=ST.deuda[f]||{}; ST.deuda[f].total=(ST.deuda[f].total||0)+(x.amount_residual||0); } });
  dVen.forEach(x=>{ const f=ST.padre[x.partner_id&&x.partner_id[0]]; if(f){ ST.deuda[f]=ST.deuda[f]||{}; ST.deuda[f].venc=(ST.deuda[f].venc||0)+(x.amount_residual||0); } });

  // 4) quiénes son gerencia (no se les mide el reparto parejo) y el padrón para avisar
  try{ ST.ger=await EYG.gerencia(); }catch(e){ ST.ger=[]; }
  try{ ST.roster=await EYG.rosterCore(); }catch(e){ ST.roster=[]; }
  paso("");
  derivar();
}

/* ======================= DERIVAR ======================= */
function derivar(){
  const U=CFG.umbral, V=CFG.ventana;
  const cerr=ST.meses.slice(0,-1);                 // meses cerrados (el corriente va aparte)
  const vent=cerr.slice(-V);                        // la ventana de regularidad
  ST.mesSel=ST.mesSel||cerr[cerr.length-1];

  // una fila por farmacia que compró algo en la ventana o en el mes corriente
  const vistas=new Set();
  ST.meses.forEach(k=>Object.keys(ST.serie[k]).forEach(id=>vistas.add(+id)));
  ST.filas=[...vistas].map(id=>{
    const f=ST.farm[id]||{};
    const serie=ST.meses.map(k=>ST.serie[k][id]||0);
    const ventSerie=vent.map(k=>ST.serie[k][id]||0);
    const veces=ventSerie.filter(v=>v>=U).length;
    const prom=ventSerie.reduce((a,b)=>a+b,0)/V;
    const mesN=ST.serie[ST.mesSel][id]||0;
    const mg=ST.margen[id]||{}, tk=ST.tickets[id]||{}, dd=ST.deuda[id]||{};
    const est = mesN>=U ? "ok" : (mesN>=U*CFG.cercaPct || prom>=U ? "cerca" : "lejos");
    return { id, nombre:f[FANT]||f.name||("#"+id), titular:f.name||"", ciudad:f.city||"",
      com:f.user_id?f.user_id[1]:"Sin asignar", uid:f.user_id?f.user_id[0]:0,
      serie, ventSerie, veces, prom, mesN, est,
      margen:mg.margin||0, margenBase:mg.base||0, pedidos:tk.n||0, pedTot:tk.amount_untaxed||0,
      ticket:(tk.n?(tk.amount_untaxed||0)/tk.n:0),
      deuda:dd.total||0, venc:dd.venc||0,
      firme: veces>=CFG.minRegular };
  }).filter(r=>r.prom>0 || r.mesN>0);

  // cuántas califican cada mes
  ST.porMes=ST.meses.map(k=>{
    const vals=Object.values(ST.serie[k]);
    return { mes:k, n:vals.filter(v=>v>=U).length,
             fac:vals.filter(v=>v>=U).reduce((a,b)=>a+b,0),
             compraron:vals.filter(v=>v>0).length };
  });

  // reparto por comercial: solo las que llevan farmacias y no son gerencia
  const gerNom=new Set((ST.ger||[]).map(g=>(g.nombre||"").toLowerCase()));
  const porCom={};
  ST.filas.forEach(r=>{
    const c=porCom[r.com]=porCom[r.com]||{com:r.com, uid:r.uid, califican:0, firmes:0, cerca:0, cartera:0, fac:0};
    c.cartera++; c.fac+=r.mesN;
    if(r.est==="ok") c.califican++; if(r.firme) c.firmes++; if(r.est==="cerca") c.cerca++;
  });
  const elegida=c=>{
    if(gerNom.has((c.com||"").toLowerCase()) || c.com==="Sin asignar") return false;
    if(CFG.comerciales && CFG.comerciales.length) return CFG.comerciales.includes(c.com);
    return c.cartera>=CFG.minCartera;      // las farmacias tienen que ser su negocio, no una excepción
  };
  const evaluables=Object.values(porCom).filter(elegida);
  const objetivo = evaluables.length ? CFG.meta/evaluables.length : 0;
  ST.comerciales = Object.values(porCom).map(c=>{
    const ev=elegida(c);
    const obj=ev?objetivo:0;
    const desvio=ev?(c.califican-obj):0;
    return {...c, evaluable:ev, objetivo:obj, desvio,
            alerta: ev && c.califican < obj*(1-CFG.tolerancia) };
  }).sort((a,b)=>b.califican-a.califican||b.cartera-a.cartera);
  ST.objetivoCom=objetivo;

  // cobertura del margen
  const base=ST.filas.reduce((a,r)=>a+r.margenBase,0);
  const tot=Object.values(ST.ventaMed||{}).reduce((a,o)=>a+(o.price_subtotal||0),0);
  ST.cobertura=pct(base,tot);
  render();
}

/* ======================= GRÁFICOS ======================= */
/* barras mensuales de "cuántas califican", con la línea de la meta */
function gMeses(){
  const d=ST.porMes, n=d.length; if(!n) return "";
  const W=760, H=210, mL=34, mR=10, mT=14, mB=26;
  const max=Math.max(CFG.meta, ...d.map(x=>x.n))*1.08;
  const slot=(W-mL-mR)/n, bw=Math.min(34, slot*.6);
  const y=v=>mT+(H-mT-mB)*(1-v/max);
  let g="";
  [0, Math.round(CFG.meta/2), CFG.meta].forEach(v=>{
    g+=`<line x1="${mL}" x2="${W-mR}" y1="${y(v)}" y2="${y(v)}" stroke="#E6EFEE" stroke-width="1"/>`
      +`<text class="gtxt" x="${mL-6}" y="${y(v)+3.5}" text-anchor="end">${v}</text>`;
  });
  g+=`<line class="meta-line" x1="${mL}" x2="${W-mR}" y1="${y(CFG.meta)}" y2="${y(CFG.meta)}"/>`
    +`<text class="gtxt" x="${W-mR}" y="${y(CFG.meta)-6}" text-anchor="end" style="fill:var(--mal);font-weight:800">meta ${CFG.meta}</text>`;
  d.forEach((x,i)=>{
    const cx=mL+slot*i+slot/2, h=Math.max(1,(H-mT-mB)-(y(x.n)-mT)), esUlt=i===n-1;
    g+=`<rect class="gb" x="${cx-bw/2}" y="${y(x.n)}" width="${bw}" height="${h}" rx="4"`
      +` fill="${esUlt?'var(--barra2)':'var(--barra)'}" style="animation-delay:${i*45}ms"`
      +`><title>${mesLargo(x.mes)}: ${x.n} farmacias llegaron al mínimo · ${Mk(x.fac)} facturado</title></rect>`;
    if(x.n) g+=`<text class="gnum" x="${cx}" y="${y(x.n)-5}" text-anchor="middle">${x.n}</text>`;
    g+=`<text class="gtxt" x="${cx}" y="${H-8}" text-anchor="middle">${mesCorto(x.mes)}${esUlt?" ·":""}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
/* escalera: cuántas farmacias hay en cada tramo de compra promedio */
function gEscalera(){
  const U=CFG.umbral;
  const tr=[[U*3,1/0,"más de "+Mk(U*3)],[U*2,U*3,Mk(U*2)+" a "+Mk(U*3)],[U,U*2,Mk(U)+" a "+Mk(U*2)],
            [U*.7,U,Mk(U*.7)+" a "+Mk(U)],[U*.5,U*.7,Mk(U*.5)+" a "+Mk(U*.7)],
            [U*.3,U*.5,Mk(U*.3)+" a "+Mk(U*.5)],[1,U*.3,"menos de "+Mk(U*.3)]];
  const filas=tr.map(([lo,hi,etq])=>({etq, lo, n:ST.filas.filter(r=>r.prom>=lo&&r.prom<hi).length}));
  // raíz cuadrada: si no, el tramo más poblado deja a los de arriba en 1% de ancho
  const esc1=n=>Math.sqrt(n), max=Math.max(1,...filas.map(f=>esc1(f.n)));
  let acum=0;
  return `<div class="esc">`+filas.map((f,i)=>{
    acum+=f.n; const llega=f.lo>=U;
    return `<div class="escrow ${llega?"on":""}">
      <div class="et">${esc(f.etq)}</div>
      <div class="eb"><i style="width:${f.n?Math.max(3,esc1(f.n)/max*100):0}%;animation-delay:${i*60}ms"></i></div>
      <div class="en">${f.n} <small>${llega?"califican":"acum. "+acum}</small></div>
    </div>`;
  }).join("")+`</div>`;
}

function cardCom(c){

    <div class="n">${c.califican}${c.evaluable?`<span> / ${c.objetivo.toFixed(0)}</span>`:`<span> (no entra en el plan)</span>`}</div>
    ${c.evaluable?`<div class="bar"><i style="width:${p}%;background:${color}"></i></div>

      ${c.cerca} cerca del mínimo · ${c.cartera} farmacia${c.cartera===1?"":"s"} que compran
      ${c.evaluable?"":"<br><i style=\"color:var(--gris2)\">no lleva farmacias: el plan no se le mide</i>"}</div>
    ${c.alerta?`<button class="avisar" onclick="avisar(${JSON.stringify(c.com).replace(/"/g,"&quot;")})">📣 Avisarle que acelere</button>`:""}
  </div>`;
}

window.editarCfg=async ()=>{
  const u=prompt("Compra mínima por mes, en pesos y sin IVA:", CFG.umbral);

  const m=prompt("¿Cuántas farmacias tiene que haber por mes?", CFG.meta);

  const nu=Math.round(Number(String(u).replace(/[^\d]/g,"")))||CFG.umbral;
  const nm=Math.round(Number(String(m).replace(/[^\d]/g,"")))||CFG.meta;
  CFG.umbral=nu; CFG.meta=nm;
  try{ await guardarConfig(); derivar(); }
  catch(e){ alert("No pude guardar: "+(e.message||e)); }
};

window.avisar=async (com)=>{
  const c=ST.comerciales.find(x=>x.com===com); if(!c) return;
  const u=(ST.roster||[]).find(x=>(x.nombre||"").toLowerCase()===String(com).toLowerCase());
  const faltan=Math.max(0, Math.round(c.objetivo-c.califican));
  const cerca=ST.filas.filter(r=>r.com===com&&r.est==="cerca").sort((a,b)=>b.prom-a.prom).slice(0,5);
  const texto=`Plan 100×100 — ${mesLargo(ST.mesSel)}\n\n`
    +`Tenés ${c.califican} farmacias que llegaron al mínimo de ${M0(CFG.umbral)} y tu objetivo es ${c.objetivo.toFixed(0)}: `
    +`te faltan ${faltan}.\n\n`
    +(cerca.length?`Las más cerca de tu cartera:\n`+cerca.map(r=>`· ${r.nombre} — compró ${M0(r.mesN)}, le falta ${M0(Math.max(0,CFG.umbral-r.mesN))}`).join("\n")
      :`No tenés farmacias cerca del mínimo este mes: hay que buscar afuera.`);
  if(!u||!u.email){
    try{ await navigator.clipboard.writeText(texto); alert("No encontré a "+com+" en el padrón del Core, así que copié el aviso al portapapeles para que lo mandes por donde quieras."); }
    catch(e){ alert(texto); }
    return;
  }
  if(!confirm("Se le va a publicar esta novedad a "+com+":\n\n"+texto+"\n\n¿La mando?")) return;
  try{
    const arr=await EYG.comsLeer();
    arr.push({ id:"com_"+Date.now()+"_"+Math.random().toString(36).slice(2,7), ts:new Date().toISOString(),
      autor:PERFIL.nombre||PERFIL.email, autorEmail:(PERFIL.email||"").toLowerCase(), autorRol:PERFIL.rol,
      desde:EYG.argToday(), hasta:"", activo:true, clase:"novedad", prioridad:"alta",
      alcance:"personas", departamentos:[], destinatarios:[], personas:[(u.email||"").toLowerCase()], liderRef:"",
      titulo:"Plan 100×100: te faltan "+faltan+" farmacias", cuerpo:texto, leidoPor:[] });
    await EYG.comsGuardar(arr);
    alert("Aviso enviado ✓ Le va a aparecer en Comunicaciones.");
  }catch(e){ alert("No pude enviar el aviso: "+(e.message||e)); }
};

/* ---------- drawer de una farmacia ---------- */
window.cerrarDr=()=>{
  document.getElementById("p100dr").classList.remove("on");
  document.getElementById("p100scrim").classList.remove("on");
  ST.abierta=null;
};
window.abrir=async (id)=>{
  const r=ST.filas.find(x=>x.id===id); if(!r) return;
  ST.abierta=id;
  const dr=document.getElementById("p100dr"), sc=document.getElementById("p100scrim");
  const U=CFG.umbral;
  const serieV=r.ventSerie, maxV=Math.max(U,...serieV);
  const vent=ST.meses.slice(0,-1).slice(-CFG.ventana);
  dr.innerHTML=`
    <div class="dh">
      <div style="min-width:0">
        <h2>${esc(r.nombre)}</h2>
        <div class="ds">${esc(r.titular)}${r.ciudad?" · "+esc(r.ciudad):""} · ${esc(r.com)}</div>
      </div><span class="x" onclick="cerrarDr()">✕</span>
    </div>
    <div class="db">
      <div class="mini">
        <div><div class="l">Promedio ${CFG.ventana}m</div><div class="v">${Mk(r.prom)}</div></div>
        <div><div class="l">${mesCorto(ST.mesSel)}</div><div class="v">${Mk(r.mesN)}</div></div>
        <div><div class="l">Ritmo</div><div class="v">${r.veces}/${CFG.ventana}</div></div>
        <div><div class="l">Ticket promedio</div><div class="v">${Mk(r.ticket)}</div></div>
        <div><div class="l">Pedidos ${CFG.ventana}m</div><div class="v">${r.pedidos}</div></div>
        <div><div class="l">Margen</div><div class="v">${r.margenBase?pct(r.margen,r.margenBase)+"%":"—"}</div></div>
        <div><div class="l">Deuda</div><div class="v">${Mk(r.deuda)}</div></div>
        <div><div class="l">Vencido</div><div class="v" style="${r.venc>0?"color:var(--mal)":""}">${r.venc>0?Mk(r.venc):"—"}</div></div>
      </div>
      ${r.mesN<U?`<div style="background:var(--cerca-bg);color:var(--cerca);border-radius:11px;padding:11px 13px;font-size:12.5px;font-weight:700;margin-bottom:4px">
        Para llegar al mínimo de ${M0(U)} este mes le faltan <b>${M0(U-r.mesN)}</b>.</div>`:
        `<div style="background:var(--ok-bg);color:var(--ok);border-radius:11px;padding:11px 13px;font-size:12.5px;font-weight:700;margin-bottom:4px">
        Ya llegó al mínimo este mes: compró ${M0(r.mesN)}.</div>`}

      <h3>Mes a mes</h3>
      <div style="display:flex;gap:5px;align-items:flex-end;height:92px;padding:4px 0">
        ${serieV.map((v,i)=>`<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%">
          <div style="width:100%;max-width:34px;height:${Math.max(3,Math.round(v/maxV*72))}px;border-radius:4px 4px 0 0;
            background:${v>=U?"var(--barra)":"#CFE2DF"}" title="${mesLargo(vent[i])}: ${M0(v)}"></div>
          <div style="font-size:9.5px;color:var(--gris2);font-weight:800">${mesCorto(vent[i])}</div>
        </div>`).join("")}
      </div>

      <h3>Qué compra más</h3>
      <div id="p100prod" class="cargando">Buscando los productos…</div>
    </div>`;
  dr.classList.add("on"); sc.classList.add("on");
  // los productos se piden solo al abrir
  if(ST.detalle[id]) pintarProd(id);
  else{
    try{
      const vIni=ST.meses[ST.meses.length-1-CFG.ventana]+"-01";
      const hijas=Object.keys(ST.padre).filter(k=>ST.padre[k]===id).map(Number);
      const g=await EYG.rpc("sale.order.line","read_group",
        [[["order_id.state","in",["sale","done"]],["order_id.date_order",">=",vIni],
          ["order_partner_id","in",hijas.length?hijas:[id]]],
         ["price_subtotal:sum","product_uom_qty:sum","margin:sum"],["product_id"]],
        {lazy:false, context:{lang:"es_AR"}});
      ST.detalle[id]=(g||[]).filter(x=>x.product_id).sort((a,b)=>(b.price_subtotal||0)-(a.price_subtotal||0));
      if(ST.abierta===id) pintarProd(id);
    }catch(e){
      const el=document.getElementById("p100prod");
      if(el) el.innerHTML=`<div class="errbox">No pude traer los productos: ${esc(e.message||e)}</div>`;
    }
  }
};
function pintarProd(id){
  const el=document.getElementById("p100prod"); if(!el) return;
  const d=ST.detalle[id]||[];
  if(!d.length){ el.className=""; el.innerHTML=`<div style="color:var(--gris);font-size:12.5px">No hay pedidos en la ventana.</div>`; return; }
  const tot=d.reduce((a,x)=>a+(x.price_subtotal||0),0);
  el.className="";
  el.innerHTML=`<div class="prow" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris2);font-weight:800;border-bottom:1px solid var(--line)">
      <div>Producto</div><div style="text-align:right">Comprado</div><div style="text-align:right">Unid.</div></div>`
    + d.slice(0,15).map(x=>`<div class="prow">
        <div class="pn" title="${esc(x.product_id[1])}">${esc(x.product_id[1])}</div>
        <div class="pv">${Mk(x.price_subtotal||0)}</div>
        <div class="pq">${Math.round(x.product_uom_qty||0).toLocaleString("es-AR")}</div></div>`).join("")
    + `<div style="font-size:11.5px;color:var(--gris2);margin-top:9px">
        ${d.length} producto${d.length===1?"":"s"} distintos · ${Mk(tot)} en ${CFG.ventana} meses.
        Los 15 de arriba son ${pct(d.slice(0,15).reduce((a,x)=>a+(x.price_subtotal||0),0),tot)}% de eso.</div>`;
}

    document.getElementById("app").innerHTML =
      `<div class="p100"><div class="errbox"><b>No pude cargar el plan.</b><br>${esc(e.message||e)}</div></div>`;
  }
});
</script>
