<script>
/* ============================================================
   MERCADO LIBRE — la cuenta de ML de EyG, al centavo
   ============================================================
   DE DÓNDE SALEN LOS NÚMEROS
   La cuenta de ML de EyG (BG20241203094615, ml_user_id 388506830) está
   conectada en VENDRA, que ya junta todo al centavo: cada venta con lo que
   ML descontó, la facturación de ML día por día, publicidad y devoluciones.
   Esta pantalla se lo pide a la función `ml-vendra` del Supabase de EyG,
   que valida el login y reenvía a Vendra (función `core-eyg`) con una clave
   que nunca llega al navegador. NADA se guarda acá y NADA se escribe en ML.

   EL COSTO ES EL DEL MOTOR DE PRECIOS (decisión de Diego, 17/11/2026)
   Para cada publicación se busca su producto en Odoo y se usa el mismo
   costo que usa el motor: x_costo_motor (costo 3 fuentes) y, si el
   producto se vende exento, + el IVA de la compra (EYG.costoEfectivo).
   El vínculo publicación → producto sale, en este orden, de:
     1. lo vinculado a mano (parámetro de Odoo eyg.ml_vinculos)
     2. el SKU de la publicación = código interno del producto
     3. el código de barras (GTIN) de la publicación = barcode
   El vínculo a mano lleva un FACTOR: cuántas unidades de Odoo salen por
   cada unidad vendida en ML (una publicación "caja x 20" de un producto
   que en Odoo se lleva por unidad = factor 20).

   LA CUENTA NO ESTÁ INSCRIPTA EN IVA (autónomo, factura sin IVA): todo va
   con IVA incluido y no hay crédito fiscal. Vendra ya la trata así ("cf").

   CÓMO CIERRA
   Resumen:  Ventas − Cargos de ML − Publicidad − Impuestos − Costo = Ganancia.
             Ventas, cargos, publicidad e impuestos son los de Vendra; el
             costo lo calcula esta pantalla con el motor.
   Cada venta: Precio − comisión − costo fijo − cuotas − envío − retenciones
             − otros = Neto que deposita ML (+ reintegro Flex, que ML paga
             aparte) − Costo = Te queda. Verificado 17/11 en las 86 ventas
             liquidadas: el neto de Vendra cierra exacto con esa resta.
   ============================================================ */
const esc = EYG.esc;
const money = n => (+n<0 ? "−" : "") + EYG.money(Math.abs(+n||0));
const FN = "https://yxotopoklgjowcudveoj.supabase.co/functions/v1/ml-vendra";
const VINC_KEY = "eyg.ml_vinculos";
const r2 = n => Math.round((+n||0)*100)/100;
const pctTxt = (a,b) => b ? (Math.round(a*1000/b)/10).toLocaleString("es-AR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%" : "—";
const hoyAR = () => new Date(Date.now()-3*3600*1000).toISOString().slice(0,10);
const sumaDias = (d,n) => { const x=new Date(d+"T12:00:00Z"); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); };
const fCorta = d => d ? d.slice(8,10)+"/"+d.slice(5,7) : "";
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

const ST = { tab:"resumen", per:"mes", from:null, to:null, qV:"", qP:"", fV:"todas", fP:"vendieron", ordV:{k:"fecha",d:-1}, ordP:{k:"ganancia",d:-1}, abiertaV:null, abiertaP:null };
const D = { g:null, ventas:[], prod:[], pubs:null, pubsErr:null, odoo:{}, vinc:{}, tasas:{}, cargando:false };

/* ---------------- llamadas ---------------- */
async function fn(accion, extra){
  const s = await EYG.session();
  const r = await fetch(FN, { method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+((s&&s.access_token)||"") },
    body: JSON.stringify(Object.assign({accion}, extra||{})) });
  let j; try{ j = await r.json(); }catch(e){ j = {ok:false, error:"respuesta inválida ("+r.status+")"}; }
  if(!r.ok || !j || j.ok===false) throw new Error((j&&j.error)||("HTTP "+r.status));
  return j;
}

function rango(){
  const h = hoyAR();
  if(ST.per==="mes") return {from:h.slice(0,8)+"01", to:h, label:"este mes"};
  if(ST.per==="mesant"){ const d=new Date(h.slice(0,8)+"01T12:00:00Z"); d.setUTCDate(0); const to=d.toISOString().slice(0,10); return {from:to.slice(0,8)+"01", to, label:MESES[+to.slice(5,7)-1]}; }
  if(ST.per==="7") return {from:sumaDias(h,-6), to:h, label:"últimos 7 días"};
  if(ST.per==="30") return {from:sumaDias(h,-29), to:h, label:"últimos 30 días"};
  if(ST.per==="90") return {from:sumaDias(h,-89), to:h, label:"últimos 90 días"};
  if(ST.per==="todo") return {from:"2026-10-01", to:h, label:"desde la primera venta"};
  return {from:ST.from||h.slice(0,8)+"01", to:ST.to||h, label:"del "+fCorta(ST.from)+" al "+fCorta(ST.to)};
}

/* ---------------- Odoo: costo del motor ---------------- */
async function leerVinculos(){
  try{ D.vinc = JSON.parse(await EYG.rpc("ir.config_parameter","get_param",[VINC_KEY]) || "{}") || {}; }catch(e){ D.vinc = {}; }
}
async function guardarVinculos(){ await EYG.rpc("ir.config_parameter","set_param",[VINC_KEY, JSON.stringify(D.vinc)]); }
const CAMPOS_PROD = ["id","display_name","default_code","barcode","x_costo_motor","x_iva_compra","taxes_id","standard_price","active"];
async function leerProductos(){
  const skus=new Set(), gtins=new Set(), ids=new Set();
  for(const p of (D.pubs||[])){ if(p.sku) skus.add(String(p.sku).trim()); if(p.gtin) gtins.add(String(p.gtin).trim()); }
  for(const v of Object.values(D.vinc)) if(v&&v.pid) ids.add(+v.pid);
  const dom = ["|","|",["default_code","in",[...skus]],["barcode","in",[...gtins]],["id","in",[...ids]]];
  const rows = await EYG.rpc("product.product","search_read",[dom, CAMPOS_PROD],{context:{active_test:false}, limit:2000});
  D.odoo = {byId:{}, bySku:{}, byBar:{}};
  for(const r of (rows||[])){ D.odoo.byId[r.id]=r; if(r.default_code) D.odoo.bySku[String(r.default_code).trim()]=r; if(r.barcode) D.odoo.byBar[String(r.barcode).trim()]=r; }
}
const costoProd = pr => pr ? r2(EYG.costoEfectivo(pr.x_costo_motor || pr.standard_price || 0, pr.x_iva_compra, pr.taxes_id, D.tasas)) : 0;
/* Cuántas unidades trae la publicación según su título ("Caja x 20", "x100", "100 Parches", "10pz").
   Sólo SUGIERE el factor: si Odoo lleva el costo por unidad y ML vende la caja, el factor es ese número. */
function factorTitulo(t){
  const s = String(t||"").toLowerCase();
  const m = s.match(/(?:caja|pack|bolsa|display|blister)\s*(?:x|por|de)?\s*(\d{1,4})\b/) || s.match(/\bx\s*(\d{2,4})\s*(?:u\b|un\b|unid|pz|piezas|parches|sobres|tiras)/) || s.match(/\b(\d{2,4})\s*(?:u\b|un\b|unid\w*|pz|piezas|parches|sobres|tiras)\b/);
  const n = m ? +m[1] : 0;
  return n>=2 && n<=2000 ? n : 0;
}
/* Para un item de ML: {pr, factor, via, unit} — unit = costo por unidad vendida en ML (0 si no hay) */
function costoItem(itemId){
  const pub = (D.pubs||[]).find(p=>p.id===itemId);
  const v = D.vinc[itemId];
  let pr=null, factor=1, via="";
  if(v && v.pid && D.odoo.byId[v.pid]){ pr=D.odoo.byId[v.pid]; factor=+v.factor||1; via="a mano"; }
  else if(pub && pub.sku && D.odoo.bySku[String(pub.sku).trim()]){ pr=D.odoo.bySku[String(pub.sku).trim()]; via="por SKU"; }
  else if(pub && pub.gtin && D.odoo.byBar[String(pub.gtin).trim()]){ pr=D.odoo.byBar[String(pub.gtin).trim()]; via="por código de barras"; }
  const base = costoProd(pr);
  const sug = factorTitulo(pub ? pub.titulo : "");
  // revisar = el título dice que se vende una caja de N, el vínculo es automático (factor 1) y
  // multiplicar el costo por N todavía entra en el precio (si no, Odoo ya lo lleva por caja:
  // guantes "caja x 100" a $4.600 en Odoo no pueden costar $460.000)
  const revisar = !!pr && base>0 && via!=="a mano" && sug>1 && !!pub && base*sug <= (+pub.precio||0);
  const estado = !pr ? "sin-vincular" : (base>0 ? "ok" : "sin-costo-odoo");
  return {pr, factor, via, unit: r2(base*factor), base, sug, revisar, estado};
}

/* ---------------- carga ---------------- */
async function cargarPeriodo(refresh){
  const R = rango(); ST.from=R.from; ST.to=R.to;
  D.cargando = true; pintar();
  try{
    const [g, v, p] = await Promise.all([
      fn("ganancias",{from:R.from,to:R.to,refresh:!!refresh}),
      fn("ventas",{from:R.from,to:R.to}),
      fn("prod_dia",{from:R.from,to:R.to}),
    ]);
    D.g = g.data; D.ventas = v.filas||[]; D.prod = p.filas||[]; D.err = null;
  }catch(e){ D.err = String(e.message||e); }
  D.cargando = false; pintar();
}
async function cargarPublicaciones(){
  try{ const j = await fn("publicaciones"); D.pubs = j.publicaciones||[]; D.pubsAvisos = j.avisos||[]; }
  catch(e){ D.pubs = []; D.pubsErr = String(e.message||e); }
  try{ await leerProductos(); }catch(e){ D.pubsErr = (D.pubsErr? D.pubsErr+" · ":"")+"Odoo: "+String(e.message||e); }
  pintar();
}

/* ---------------- cálculos ---------------- */
/* Ventas de la tabla con su desglose y su costo. Una venta (pack) puede traer varias
   publicaciones: el costo se suma por cada una; los cargos son de la venta entera. */
function ventasCalc(){
  return D.ventas.map(v=>{
    let costo=0, sinCosto=0;
    for(const it of (v.items||[])){ const c=costoItem(it.id); if(c.unit>0) costo+=c.unit*(+it.q||0); else sinCosto+=(+it.q||0); }
    const liq = v.exacto && v.neto!=null;
    const cargos = r2((+v.comision||0)+(+v.costo_fijo||0)+(+v.cuotas||0)+(+v.envio||0)+(+v.retencion||0)+(+v.cheque||0)+(+v.cobro_mp||0)+(+v.cupon_vend||0)+(+v.otros||0));
    const recibe = liq ? r2((+v.neto||0)+(+v.reintegro_flex||0)) : null;
    const ganancia = liq ? r2(recibe-costo) : null;
    return Object.assign({}, v, {costo:r2(costo), sinCosto, liq, cargos, recibe, ganancia,
      titulo:(v.items||[]).map(i=>i.t).join(" + "), unidades:+v.unidades||0});
  });
}
/* Por publicación: lo que vendió en el período. Los montos de cada venta se reparten entre
   sus publicaciones según lo que pesa cada una (unidades × precio unitario del período). */
function pubsCalc(VC){
  const pu = {};   // precio unitario promedio del período, por publicación (de orders_daily_prod)
  const agP = {};
  for(const r of D.prod){ const a=(agP[r.item_id] ??= {u:0,f:0,fee:0,t:r.title}); a.u+=+r.unidades||0; a.f+=+r.facturacion||0; a.fee+=+r.sale_fee||0; }
  for(const [k,a] of Object.entries(agP)) pu[k] = a.u ? a.f/a.u : 0;
  const ag = {};
  const nuevo = (id,t)=>({id, titulo:t, ventas:0, unidades:0, precio:0, cargos:0, recibe:0, costo:0, ganancia:0, pendientes:0, sinCosto:0});
  for(const v of VC){
    const its = v.items||[]; let tot=0;
    for(const it of its) tot += (+it.q||0)*(pu[it.id]||1);
    for(const it of its){
      const w = tot ? ((+it.q||0)*(pu[it.id]||1))/tot : 1/its.length;
      const a = (ag[it.id] ??= nuevo(it.id, it.t));
      const c = costoItem(it.id);
      a.ventas += 1; a.unidades += +it.q||0; a.precio += w*(+v.precio||0);
      if(v.liq){ a.cargos += w*v.cargos; a.recibe += w*v.recibe; a.costo += c.unit*(+it.q||0); a.ganancia += w*v.recibe - c.unit*(+it.q||0); }
      else a.pendientes += 1;
      if(!(c.unit>0)) a.sinCosto += +it.q||0;
    }
  }
  const lista = (D.pubs||[]).map(p=>{ const a = ag[p.id] || nuevo(p.id, p.titulo); return Object.assign({}, a, {pub:p, titulo:p.titulo, c:costoItem(p.id)}); });
  for(const [id,a] of Object.entries(ag)) if(!(D.pubs||[]).some(p=>p.id===id)) lista.push(Object.assign({}, a, {pub:null, c:costoItem(id)}));
  for(const x of lista){ for(const k of ["precio","cargos","recibe","costo","ganancia"]) x[k]=r2(x[k]); x.margen = x.precio ? x.ganancia/x.precio : null; }
  return lista;
}
/* Costo del motor de lo vendido en el período (para el Resumen), por unidades de orders_daily_prod */
function costoPeriodo(){
  let costo=0, sinU=0; const sinItems=new Set();
  for(const r of D.prod){ const c=costoItem(r.item_id); if(c.unit>0) costo += c.unit*(+r.unidades||0); else { sinU += +r.unidades||0; sinItems.add(r.item_id); } }
  return {costo:r2(costo), sinU, sinItems:sinItems.size};
}

/* ---------------- dibujo ---------------- */
function pintar(){
  const cap = document.getElementById("cap"); if(!cap) return;
  const R = rango();
  const tabs = [["resumen","Resumen","Ventas menos todo lo que se va, hasta la ganancia del período"],["ventas","Ventas","Cada venta con lo que descontó Mercado Libre y lo que nos queda"],["pubs","Publicaciones","Cada publicación: qué vendió, cuánto costó y cuánto ganó"]];
  cap.innerHTML = `
    <div class="barra">
      <select id="per" title="Qué período mirar. Los números de Mercado Libre se cuentan por fecha de la venta (hora de Argentina).">
        ${[["mes","Este mes"],["mesant","Mes pasado"],["7","Últimos 7 días"],["30","Últimos 30 días"],["90","Últimos 90 días"],["todo","Desde la primera venta"],["rango","Elegir fechas…"]].map(([k,t])=>`<option value="${k}" ${ST.per===k?"selected":""}>${t}</option>`).join("")}
      </select>
      <span class="rango ${ST.per==="rango"?"on":""}"><input type="date" id="dfrom" value="${R.from}"> a <input type="date" id="dto" value="${R.to}"> <button class="btn" id="aplicar">Ver</button></span>
      <button class="btn" id="refrescar" title="Vuelve a pedir los números a Mercado Libre ahora (tarda unos segundos). Sin tocarlo, se usan los de Vendra, que se actualizan solos.">↻ Actualizar</button>
      <span class="cuenta" title="La cuenta de Mercado Libre de EyG. Los datos llegan desde Vendra, donde está conectada.">Cuenta ML <b>${esc((D.g&&D.g.nickname)||"BG20241203094615")}</b> · sin IVA (no inscripta)</span>
    </div>
    <div class="tabs">${tabs.map(([k,t,h])=>`<button class="tab ${ST.tab===k?"on":""}" data-tab="${k}" title="${esc(h)}">${t}</button>`).join("")}</div>
    <div id="cuerpo"></div>`;
  document.getElementById("per").onchange = e=>{ ST.per=e.target.value; if(ST.per==="rango"){ pintar(); return; } cargarPeriodo(); };
  const ap=document.getElementById("aplicar"); if(ap) ap.onclick=()=>{ ST.from=document.getElementById("dfrom").value; ST.to=document.getElementById("dto").value; if(ST.from&&ST.to&&ST.from<=ST.to) cargarPeriodo(); };
  document.getElementById("refrescar").onclick = ()=>cargarPeriodo(true);
  cap.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ ST.tab=b.dataset.tab; pintar(); });
  const cu = document.getElementById("cuerpo");
  if(D.cargando){ cu.innerHTML = `<div class="spin"></div><p class="cargando">Trayendo los números de Mercado Libre (${esc(R.label)})…</p>`; return; }
  if(D.err){ cu.innerHTML = `<div class="nota aviso"><b>No pude traer los datos de Mercado Libre.</b> ${esc(D.err)}</div>`; return; }

}

function avisoPubs(){
  if(D.pubs===null) return `<div class="nota">Leyendo las publicaciones y sus costos en Odoo… el costo aparece en un momento.</div>`;
  if(D.pubsErr) return `<div class="nota aviso"><b>Las publicaciones no cargaron completas.</b> ${esc(D.pubsErr)}. Sin eso no hay costo: la ganancia sale sin descontarlo.</div>`;
  return "";
}

function pintarResumen(cu, R){
  const g = D.g, cp = costoPeriodo();
  const ventas = +g.facturacion||0;
  /* Vendra deja las retenciones de Mercado Pago DENTRO de los cargos (salen del pago); acá van
     a Impuestos, que es lo que son. La suma no cambia. */
  const ret = +((g.cargosDesglose||{}).retenido)||0;
  const cargos = r2((+g.cargosML||0)+(+g.fullCosto||0)-ret);
  const publi = r2((+g.publicidad||0)+(+g.cuponesVendedor||0));
  const imp = r2((+g.impuestos||0)+ret);
  const costo = cp.costo;
  const gan = r2(ventas-cargos-publi-imp-costo);
  const kp = (k,lb,vl,sub,tip,cls)=>`<div class="kpi ${cls||""}" data-k="${k}" title="${esc(tip)}"><div class="lb">${lb}</div><div class="vl ${vl<0?"neg":""}">${money(vl)}</div><div class="sub">${sub}</div></div>`;
  const sinCostoTxt = cp.sinU ? `<span class="neg">${cp.sinU} u. de ${cp.sinItems} publ. sin costo</span>` : "con el costo del motor";
  cu.innerHTML = `${avisoPubs()}
    ${g.periodOpen && !(+g.percepciones) ? `<div class="nota">Mes en curso: Mercado Libre liquida las <b>percepciones</b> durante el mes, así que <b>Impuestos</b> puede subir hasta el cierre.</div>`:""}
    <div class="kpis">
      ${kp("ganancia","Ganancia",gan,`${pctTxt(gan,ventas)} de lo vendido`,"Lo que queda: Ventas − Cargos de ML − Publicidad − Impuestos − Costo. Tocá para ver la cuenta completa.","hero")}
      ${kp("ventas","Ventas",ventas,`${g.ventas||0} ventas · ${g.unidades||0} unidades`,"Lo que pagaron los compradores en el período (ventas pagadas, sin las canceladas). Tocá para ver cada venta.")}
      ${kp("cargos","Cargos de ML",-cargos,pctTxt(cargos,ventas)+" de lo vendido","Comisión, costo fijo por unidad, cuotas, envíos y demás cargos que factura Mercado Libre (sin la publicidad). Tocá para el detalle.")}
      ${kp("publi","Publicidad",-publi,pctTxt(publi,ventas)+" de lo vendido","Product Ads + Display que factura ML, más los cupones que ponemos nosotros. Tocá para el detalle.")}
      ${kp("imp","Impuestos",-imp,`retenciones al cobrar${(+g.percepciones)?` · percep. ${money(g.percepciones)} aparte`:""}`,"Las retenciones que Mercado Pago descuenta al cobrar cada venta. Las PERCEPCIONES que ML factura aparte se muestran pero NO se restan (criterio de Vendra: son pagos a cuenta de impuestos). La cuenta no está inscripta en IVA: no hay IVA a pagar ni crédito. Tocá para el detalle.")}
      ${kp("costo","Costo (motor)",-costo,sinCostoTxt,"Unidades vendidas × el costo que usa el motor de precios de Odoo (costo 3 fuentes, + IVA de compra si se vende exento). Tocá para verlo por publicación.")}
    </div>
    <h2 class="sec">Ventas por día <span class="ayuda">${esc(R.label)} · pasá el mouse por cada barra</span></h2>
    <div class="card pad">${grafico(g.series||[])}</div>
    <h2 class="sec">Qué publicaciones dejan más <span class="ayuda">tocá una para verla en Publicaciones</span></h2>
    <div class="card pad" id="topPubs">${topPubs()}</div>`;
  cu.querySelectorAll(".kpi").forEach(el=>el.onclick=()=>{
    const k = el.dataset.k;
    if(k==="ventas"){ ST.tab="ventas"; pintar(); return; }
    if(k==="costo"){ ST.tab="pubs"; ST.ordP={k:"costo",d:-1}; pintar(); return; }
    if(k==="ganancia") return ventana("La cuenta del período", cascada({ventas,cargos,publi,imp,costo,gan}, g));
    if(k==="cargos"){ const d=g.cargosDesglose||{}; return ventana("Cargos de Mercado Libre", detalleObj({"Comisión de venta":d.comision,"Costo fijo por unidad":d.costoFijo,"Costo por ofrecer cuotas":d.cuotas,"Envíos a nuestro cargo":d.envios,"Costo de Full":g.fullCosto,"Cobro de Mercado Pago":d.cobroMP,"Cheque / otros medios":d.cheque,"Cupones":d.cupones,"Cargos facturados aparte":d.facturaAparte,"Otros":d.otros,"Bonificaciones (a favor)":-(+d.bonificaciones||0),"Diferencia sin explicar":d.descuadre}, cargos, "Total cargos") + (d.envioComprador?`<p style="font-size:12px;color:var(--gris);margin-top:10px">Envíos: ML cobró ${money(d.enviosBruto)} y el comprador puso ${money(d.envioComprador)}; acá va sólo lo nuestro.</p>`:"")); }
    if(k==="publi") return ventana("Publicidad", detalleObj(Object.assign({}, g.publicidadDesglose||{}, {"Cupones que ponemos nosotros": g.cuponesVendedor||0}), publi, "Total publicidad"));
    if(k==="imp") return ventana("Impuestos", detalleObj({"Retenciones de Mercado Pago al cobrar":ret,"IVA / Ingresos Brutos a pagar":g.impuestos}, imp, "Total que se resta") + ((+g.percepciones)?`<h3 style="font-size:14px;margin:18px 0 8px">Aparte, sin restar</h3>${detalleObj({"Percepciones de IVA":g.percepIVA,"Percepciones de Ingresos Brutos":g.percepIIBB}, g.percepciones, "Percepciones del período")}<p style="font-size:12px;color:var(--gris);margin-top:10px">ML las factura como pago a cuenta de impuestos. Vendra no las resta de la ganancia; si la cuenta no las puede descontar en ninguna declaración, son un costo más.</p>`:""));
  });
  cu.querySelectorAll("[data-pub]").forEach(el=>el.onclick=()=>{ ST.tab="pubs"; ST.abiertaP=el.dataset.pub; pintar(); });
}
function grafico(series){
  if(!series.length) return `<div class="vacio">Sin ventas en el período.</div>`;
  const mx = Math.max(...series.map(s=>+s.v||0), 1);
  return `<div class="graf">${series.map(s=>`<div class="b" style="height:${Math.max(1,(+s.v||0)/mx*100)}%" title="${esc(s.label)}: ${money(s.v)}"></div>`).join("")}</div>
    <div class="grafx"><span>${esc(series[0].label)}</span><span>${esc(series[series.length-1].label)}</span></div>`;
}
function topPubs(){
  if(D.pubs===null) return `<div class="cargando">Esperando las publicaciones…</div>`;
  const L = pubsCalc(ventasCalc()).filter(x=>x.ventas>0).sort((a,b)=>b.ganancia-a.ganancia);

  return `<div class="tw"><table class="t"><thead><tr><th title="La publicación de Mercado Libre">Publicación</th><th class="n" title="Unidades vendidas en el período">Unid.</th><th class="n" title="Lo que pagaron los compradores">Vendido</th><th class="n" title="Lo que deposita ML (neto + reintegro Flex) menos el costo del motor. Sólo ventas ya liquidadas.">Ganancia</th><th class="n" title="Ganancia sobre lo vendido">Margen</th></tr></thead><tbody>
    ${L.map(x=>`<tr class="fila" data-pub="${esc(x.id)}"><td class="tit">${esc(x.titulo)}</td><td class="n">${x.unidades}</td><td class="n">${money(x.precio)}</td><td class="n ${x.ganancia<0?"neg":""}">${x.sinCosto?costoPill(x.c)+" ":""}${x.c.revisar?`<span class="pill warn" title="El título dice ${x.c.sug} por publicación: si Odoo lleva el costo por unidad, falta el factor">¿factor ${x.c.sug}?</span> `:""}${money(x.ganancia)}</td><td class="n">${x.margen==null?"—":pctTxt(x.ganancia,x.precio)}</td></tr>`).join("")}
  </tbody></table></div>`;
}
function cascada(c, g){
  const fila=(t,v,cls,tip)=>`<div class="${cls||""}" title="${esc(tip||"")}">${t}</div><div class="m ${cls||""} ${v<0?"neg":""}">${money(v)}</div><div class="p ${cls||""}">${pctTxt(Math.abs(v),c.ventas)}</div>`;
  return `<div class="casc">
    ${fila("Ventas",c.ventas,"","Lo que pagaron los compradores")}
    ${fila("− Cargos de Mercado Libre",-c.cargos,"menos","Comisión, costo fijo, cuotas, envíos y otros cargos de ML")}
    ${fila("− Publicidad",-c.publi,"menos","Product Ads, Display y cupones propios")}
    ${fila("− Impuestos",-c.imp,"menos","Percepciones y retenciones")}
    ${fila("− Costo (motor de precios)",-c.costo,"menos","Unidades × costo del motor")}
    ${fila("= Ganancia",c.gan,"tot","Lo que queda")}
  </div>
  <p style="font-size:12px;color:var(--gris);margin-top:14px;line-height:1.55">Ventas, cargos, publicidad e impuestos son los de Vendra (los mismos que ve ML, al centavo). El costo lo pone esta pantalla con el motor de precios de Odoo, no con los costos cargados en Vendra.${(+g.ventasCuponML)?` Incluye ${money(g.ventasCuponML)} de ventas con cupón de ML (lo pone ML, lo cobramos igual).`:""}</p>`;
}
function detalleObj(obj, total, totLabel){
  const filas=[];
  const add=(k,v)=>{ v=+v; if(v && isFinite(v)) filas.push([k,v]); };
  if(Array.isArray(obj)) obj.forEach(x=>add(x.nombre||x.label||x.concepto||x.k||x.tipo||"—", x.monto??x.v??x.valor??x.total));
  else if(obj && typeof obj==="object") for(const [k,v] of Object.entries(obj)){ if(v && typeof v==="object" && !Array.isArray(v)){ for(const [k2,v2] of Object.entries(v)) add(k+" · "+k2, v2); } else if(k!=="fuente") add(k,v); }
  const suma = r2(filas.reduce((s,[,v])=>s+v,0));
  return `<div class="desg">${filas.length?filas.map(([k,v])=>`<div>${esc(k)}</div><div class="m">${money(v)}</div>`).join(""):`<div style="grid-column:1/-1;color:var(--gris)">Mercado Libre no detalla este total por concepto en el período.</div>`}
    <div class="tot">${esc(totLabel)}</div><div class="m tot">${money(total)}</div></div>
    ${filas.length && Math.abs(suma-total)>0.05 ? `<p style="font-size:12px;color:var(--gris);margin-top:10px">El detalle suma ${money(suma)}; la diferencia con el total (${money(r2(total-suma))}) son conceptos que ML no separa.</p>`:""}`;
}

/* ---------- Ventas ---------- */
function pintarVentas(cu, R){
  let L = ventasCalc();
  const q = ST.qV.trim().toLowerCase();
  if(q) L = L.filter(v=>(v.titulo+" "+(v.order_ids||[]).join(" ")+" "+v.pack_key).toLowerCase().includes(q));

  if(ST.fV==="sincosto") L = L.filter(v=>v.sinCosto>0);
  const o=ST.ordV; L.sort((a,b)=>{ const x=a[o.k], y=b[o.k]; return (x==null)-(y==null) || (typeof x==="string"? x.localeCompare(y): (x-y))*o.d; });
  const T = L.reduce((t,v)=>{ t.precio+=+v.precio||0; if(v.liq){ t.cargos+=v.cargos; t.recibe+=v.recibe; t.costo+=v.costo; t.gan+=v.ganancia; } return t; },{precio:0,cargos:0,recibe:0,costo:0,gan:0});
  const todas = ventasCalc();
  const nP = todas.filter(v=>!v.liq).length, nN = todas.filter(v=>v.liq&&v.ganancia<0).length, nS = todas.filter(v=>v.sinCosto>0).length;
  const th=(k,t,tip,n)=>`<th class="ord ${n?"n":""}" data-o="${k}" title="${esc(tip)} (tocá para ordenar)">${t}${o.k===k?(o.d<0?" ↓":" ↑"):""}</th>`;
  cu.innerHTML = `${avisoPubs()}
    <div class="tbar">
      <input type="search" id="qV" placeholder="Buscar producto o n.º de venta…" value="${esc(ST.qV)}">
      <div class="chips">
        ${[["todas","Todas ("+todas.length+")","Todas las ventas del período"],["pend","Sin liquidar ("+nP+")","Ventas que ML todavía no liquidó: se ve el precio, los descuentos aparecen cuando ML paga"],["perd","Pierden plata ("+nN+")","Ventas liquidadas donde lo que deposita ML no cubre el costo"],["sincosto","Sin costo ("+nS+")","Ventas con alguna publicación sin producto de Odoo vinculado"]].map(([k,t,h])=>`<button class="chip ${ST.fV===k?"on":""}" data-f="${k}" title="${esc(h)}">${t}</button>`).join("")}
      </div>
      <button class="btn" id="csvV" style="margin-left:auto" title="Baja TODAS las ventas filtradas con su desglose completo, para abrir en Excel">Descargar Excel</button>
    </div>
    <div class="card"><div class="tw"><table class="t">
      <thead><tr>${th("fecha","Fecha","Fecha y hora de la venta (Argentina)")}${th("titulo","Venta","Qué se vendió. Una fila = una compra completa (si el comprador llevó varias cosas juntas, van en la misma fila)")}${th("unidades","Unid.","Unidades de la venta",1)}${th("precio","Precio","Lo que pagó el comprador",1)}${th("cargos","Descuentos ML","Todo lo que descontó Mercado Libre / Mercado Pago: comisión, costo fijo, cuotas, envío, retenciones",1)}${th("recibe","Recibimos","Lo que deposita Mercado Pago (+ reintegro Flex si corresponde)",1)}${th("costo","Costo","Unidades × costo del motor de precios",1)}${th("ganancia","Te queda","Recibimos − Costo",1)}</tr></thead>
      <tbody>${L.length? L.map(v=>filaVenta(v)).join("") : `<tr><td colspan="8" class="vacio">No hay ventas con ese filtro.</td></tr>`}</tbody>
      ${L.length?`<tfoot><tr><td colspan="3">${L.length} ventas</td><td class="n">${money(T.precio)}</td><td class="n" title="Sólo ventas liquidadas">${money(-T.cargos)}</td><td class="n">${money(T.recibe)}</td><td class="n">${money(-T.costo)}</td><td class="n ${T.gan<0?"neg":""}">${money(T.gan)}</td></tr></tfoot>`:""}
    </table></div></div>
    <p style="font-size:12px;color:var(--gris);margin-top:10px">Los totales de descuentos, recibido, costo y ganancia suman sólo las ventas ya liquidadas por ML. Tocá una venta para ver su cuenta al centavo.</p>`;
  const qi=document.getElementById("qV"); qi.oninput=EYG.debounce(e=>{ ST.qV=qi.value; pintarVentas(cu,R); const n=document.getElementById("qV"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); },250);
  cu.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ ST.fV=b.dataset.f; pintarVentas(cu,R); });
  cu.querySelectorAll("th.ord").forEach(t=>t.onclick=()=>{ const k=t.dataset.o; ST.ordV = {k, d: ST.ordV.k===k ? -ST.ordV.d : -1}; pintarVentas(cu,R); });
  cu.querySelectorAll("tr.fila").forEach(tr=>tr.onclick=()=>{ ST.abiertaV = ST.abiertaV===tr.dataset.id ? null : tr.dataset.id; pintarVentas(cu,R); });
  document.getElementById("csvV").onclick=()=>bajarCsv("ventas-ml", ["Fecha","Venta","Unidades","Precio","Comisión","Costo fijo","Cuotas","Envío","Retenciones","Otros","Neto ML","Reintegro Flex","Costo motor","Te queda","Liquidada","N.º de orden"],
    L.map(v=>[ (v.fecha||v.day||"").replace("T"," ").slice(0,16), v.titulo, v.unidades, v.precio, v.comision, v.costo_fijo, v.cuotas, v.envio, v.retencion, r2((+v.cheque||0)+(+v.cobro_mp||0)+(+v.cupon_vend||0)+(+v.otros||0)), v.neto, v.reintegro_flex, v.costo, v.ganancia, v.liq?"sí":"no", (v.order_ids||[]).join(" ") ]));
}
function filaVenta(v){
  const ab = ST.abiertaV===v.pack_key;
  const fecha = v.fecha ? new Date(v.fecha).toLocaleString("es-AR",{timeZone:"America/Argentina/Buenos_Aires",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : fCorta(v.day);
  const it = v.items||[];
  const titulo = esc(it[0]?it[0].t:"—") + (it.length>1?` <small>+ ${it.length-1} producto${it.length>2?"s":""} más</small>`:"");
  let h = `<tr class="fila" data-id="${esc(v.pack_key)}"><td style="white-space:nowrap">${fecha}</td><td class="tit">${titulo}${v.sinCosto?` <span class="pill warn" title="Alguna publicación de esta venta no tiene producto de Odoo vinculado: su costo no se descuenta">sin costo</span>`:""}</td><td class="n">${v.unidades}</td><td class="n">${money(v.precio)}</td>`;
  if(v.liq) h += `<td class="n">${money(-v.cargos)}</td><td class="n">${money(v.recibe)}</td><td class="n">${money(-v.costo)}</td><td class="n ${v.ganancia<0?"neg":""}">${money(v.ganancia)}</td></tr>`;
  else h += `<td colspan="3" class="n"><span class="pill neu" title="Mercado Libre todavía no liquidó esta venta (suele tardar unos días): los descuentos y lo que deposita aparecen cuando paga">sin liquidar</span></td><td class="n">—</td></tr>`;
  if(ab) h += `<tr class="det"><td colspan="8">${detalleVenta(v)}</td></tr>`;
  return h;
}
function detalleVenta(v){
  const L = (t,x,tip)=> (+x) ? `<div title="${esc(tip||"")}">${t}</div><div class="m">${money(x)}</div>` : "";
  const items = (v.items||[]).map(i=>{ const c=costoItem(i.id); return `<div>• ${esc(i.t)} × ${i.q} <small style="color:var(--gris2)">${esc(i.id)}</small></div><div class="m">${c.unit>0?`costo ${money(c.unit)} c/u <small style="color:var(--gris2)">(${esc(c.pr.display_name)}${c.factor!==1?" × "+c.factor:""}, ${c.via})</small>${c.revisar?` <span class="pill warn">¿factor ${c.sug}?</span>`:""}`:costoPill(c)}</div>`; }).join("");
  if(!v.liq) return `<div class="desg">${items}<div class="tot">Precio</div><div class="m tot">${money(v.precio)}</div></div><p style="font-size:12px;color:var(--gris);margin-top:10px">Todavía sin liquidar: cuando Mercado Pago acredite el pago aparece el desglose completo.</p>`;
  const otros = r2((+v.cheque||0)+(+v.cobro_mp||0)+(+v.otros||0));
  return `<div class="desg">${items}
    <div style="grid-column:1/-1;height:6px"></div>
    <div>Precio que pagó el comprador</div><div class="m">${money(v.precio)}</div>
    ${L("− Comisión de venta",-v.comision,"Cargo por vender de ML")}
    ${L("− Costo fijo por unidad",-v.costo_fijo,"Lo que cobra ML por unidad en ventas de bajo precio (o el costo de Full)")}
    ${L("− Costo por ofrecer cuotas",-v.cuotas)}
    ${L("− Envío a nuestro cargo",-v.envio,"La parte del envío que paga el vendedor")}
    ${L("− Retenciones",-v.retencion,"Retenciones de impuestos que hace Mercado Pago al cobrar")}
    ${L("− Cupón que pusimos nosotros",-v.cupon_vend)}
    ${L("− Otros cargos de Mercado Pago",-otros)}
    <div class="tot">= Neto que deposita Mercado Pago</div><div class="m tot">${money(v.neto)}</div>
    ${L("+ Reintegro Flex (ML lo paga aparte)",v.reintegro_flex,"Lo que ML devuelve por hacer la entrega con Flex")}
    <div>− Costo (motor de precios)</div><div class="m">${money(-v.costo)}</div>
    <div class="tot">= Te queda</div><div class="m tot ${v.ganancia<0?"neg":""}">${money(v.ganancia)} <small style="color:var(--gris2)">(${pctTxt(v.ganancia,v.precio)})</small></div>
  </div>
  <p style="font-size:12px;color:var(--gris);margin-top:10px">Orden${(v.order_ids||[]).length>1?"es":""} de ML: ${(v.order_ids||[]).map(esc).join(", ")}${v.envio_comprador?` · el comprador pagó ${money(v.envio_comprador)} de envío`:""}</p>`;
}

/* ---------- Publicaciones ---------- */
function pintarPubs(cu, R){
  if(D.pubs===null){ cu.innerHTML = `<div class="spin"></div><p class="cargando">Leyendo las publicaciones en Mercado Libre y sus costos en Odoo…</p>`; return; }
  const todas = pubsCalc(ventasCalc());
  let L = todas.slice();
  const q = ST.qP.trim().toLowerCase();
  if(q) L = L.filter(x=>(x.titulo+" "+x.id+" "+(x.pub&&x.pub.sku||"")+" "+(x.c.pr?x.c.pr.display_name:"")).toLowerCase().includes(q));
  const F = { vendieron:x=>x.ventas>0, activas:x=>x.pub&&x.pub.estado==="active", pausadas:x=>x.pub&&x.pub.estado!=="active", sincosto:x=>!(x.c.unit>0), revisar:x=>x.c.revisar, pierden:x=>x.ganancia<0, todas:()=>true };
  L = L.filter(F[ST.fP]||F.todas);
  const o=ST.ordP; const val=(x,k)=> k==="precioHoy"? (x.pub?x.pub.precio:null) : k==="stock"?(x.pub?x.pub.stock:null) : k==="visitas"?(x.pub?x.pub.visitas_30d:null) : k==="costoU"? x.c.unit : x[k];
  L.sort((a,b)=>{ const x=val(a,o.k), y=val(b,o.k); return (x==null)-(y==null) || (typeof x==="string"? x.localeCompare(y): (x-y))*o.d; });
  const cnt = k=>todas.filter(F[k]).length;
  const T = L.reduce((t,x)=>{ t.u+=x.unidades; t.p+=x.precio; t.c+=x.costo; t.g+=x.ganancia; t.r+=x.recibe; return t; },{u:0,p:0,c:0,g:0,r:0});
  const th=(k,t,tip,n)=>`<th class="ord ${n?"n":""}" data-o="${k}" title="${esc(tip)} (tocá para ordenar)">${t}${o.k===k?(o.d<0?" ↓":" ↑"):""}</th>`;
  cu.innerHTML = `${avisoPubs()}${(D.pubsAvisos||[]).length?`<div class="nota aviso">${D.pubsAvisos.map(esc).join(" · ")}</div>`:""}
    <div class="tbar">
      <input type="search" id="qP" placeholder="Buscar publicación, SKU o producto de Odoo…" value="${esc(ST.qP)}">
      <div class="chips">
        ${[["vendieron","Vendieron en el período","Publicaciones con al menos una venta en el período elegido"],["activas","Activas","Publicaciones activas hoy en ML"],["pausadas","Pausadas / cerradas","Publicaciones que hoy no están a la venta"],["sincosto","Sin costo","Publicaciones sin producto de Odoo vinculado: su ganancia no descuenta el costo. Tocá una para vincularla"],["revisar","¿Factor?","Publicaciones que por el título venden una caja de varias unidades pero toman el costo de UNA unidad de Odoo: revisá el factor"],["pierden","Pierden plata","Lo recibido no cubre el costo"],["todas","Todas","Todas las publicaciones de la cuenta"]].map(([k,t,h])=>`<button class="chip ${ST.fP===k?"on":""}" data-f="${k}" title="${esc(h)}">${t} (${cnt(k)})</button>`).join("")}
      </div>
      <button class="btn" id="csvP" style="margin-left:auto" title="Baja TODAS las publicaciones filtradas, para abrir en Excel">Descargar Excel</button>
    </div>
    <div class="card"><div class="tw"><table class="t">
      <thead><tr><th></th>${th("titulo","Publicación","Título en ML, estado y producto de Odoo vinculado")}${th("precioHoy","Precio hoy","Precio publicado hoy en ML",1)}${th("stock","Stock ML","Unidades disponibles en la publicación",1)}${th("visitas","Visitas 30 d","Visitas de los últimos 30 días",1)}${th("unidades","Unid.","Unidades vendidas en el período",1)}${th("precio","Vendido","Lo que pagaron los compradores en el período",1)}${th("costoU","Costo u.","Costo del motor por unidad vendida en ML",1)}${th("ganancia","Ganancia","Lo recibido de ML menos el costo (sólo ventas liquidadas)",1)}${th("margen","Margen","Ganancia sobre lo vendido",1)}</tr></thead>
      <tbody>${L.length? L.map(x=>filaPub(x)).join("") : `<tr><td colspan="10" class="vacio">No hay publicaciones con ese filtro.</td></tr>`}</tbody>
      ${L.length?`<tfoot><tr><td></td><td>${L.length} publicaciones</td><td></td><td></td><td></td><td class="n">${T.u}</td><td class="n">${money(T.p)}</td><td></td><td class="n ${T.g<0?"neg":""}">${money(T.g)}</td><td class="n">${pctTxt(T.g,T.p)}</td></tr></tfoot>`:""}
    </table></div></div>`;
  const qi=document.getElementById("qP"); qi.oninput=EYG.debounce(()=>{ ST.qP=qi.value; pintarPubs(cu,R); const n=document.getElementById("qP"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); },250);
  cu.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ ST.fP=b.dataset.f; pintarPubs(cu,R); });
  cu.querySelectorAll("th.ord").forEach(t=>t.onclick=()=>{ const k=t.dataset.o; ST.ordP={k, d: ST.ordP.k===k ? -ST.ordP.d : -1}; pintarPubs(cu,R); });
  cu.querySelectorAll("tr.fila").forEach(tr=>tr.onclick=e=>{ if(e.target.closest("a,button")) return; ST.abiertaP = ST.abiertaP===tr.dataset.id ? null : tr.dataset.id; pintarPubs(cu,R); });
  cu.querySelectorAll("[data-vinc]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); abrirVincular(b.dataset.vinc); });
  document.getElementById("csvP").onclick=()=>bajarCsv("publicaciones-ml",["ID","Publicación","Estado","SKU","GTIN","Producto Odoo","Vinculado","Factor","Costo motor u.","Precio hoy","Stock","Visitas 30d","Ventas","Unidades","Vendido","Descuentos ML","Recibido","Costo","Ganancia","Margen %"],
    L.map(x=>[x.id,x.titulo,x.pub?x.pub.estado:"",x.pub?x.pub.sku:"",x.pub?x.pub.gtin:"",x.c.pr?x.c.pr.display_name:"",x.c.via,x.c.factor,x.c.unit,x.pub?x.pub.precio:"",x.pub?x.pub.stock:"",x.pub?x.pub.visitas_30d:"",x.ventas,x.unidades,x.precio,x.cargos,x.recibe,x.costo,x.ganancia,x.margen==null?"":r2(x.margen*100)]));
}
function costoPill(c){
  if(c.estado==="sin-vincular") return `<span class="pill warn" title="No encontré el producto de Odoo (ni por SKU ni por código de barras): vinculalo para tomar su costo">sin vincular</span>`;
  if(c.estado==="sin-costo-odoo") return `<span class="pill warn" title="El producto de Odoo (${esc(c.pr.display_name)}) no tiene costo cargado: ni el motor ni esta pantalla pueden calcular su margen">sin costo en Odoo</span>`;
  return "";
}
function estadoPill(p){
  if(!p) return `<span class="pill neu" title="ML no devolvió esta publicación (puede estar borrada)">sin datos</span>`;
  const m={active:["ok","activa"],paused:["warn","pausada"],closed:["neu","finalizada"],under_review:["bad","en revisión"]}[p.estado]||["neu",p.estado];
  return `<span class="pill ${m[0]}" title="Estado hoy en Mercado Libre${(p.sub_estado||[]).length?": "+esc(p.sub_estado.join(", ")):""}">${m[1]}</span>`;
}
function filaPub(x){
  const p=x.pub, ab=ST.abiertaP===x.id;
  const odoo = x.c.pr ? `<small title="Producto de Odoo de donde sale el costo (${esc(x.c.via)})">↳ ${esc(x.c.pr.display_name)}${x.c.factor!==1?" × "+x.c.factor:""}</small>`
                      : `<small><button class="btn" style="padding:3px 9px;font-size:11.5px" data-vinc="${esc(x.id)}" title="Elegir el producto de Odoo que se vende en esta publicación, para tomar su costo">Vincular con Odoo</button></small>`;
  let h = `<tr class="fila" data-id="${esc(x.id)}"><td>${p&&p.foto?`<img class="foto" src="${esc(p.foto)}" alt="" loading="lazy">`:""}</td>
    <td class="tit">${p?`<a href="${esc(p.link)}" target="_blank" rel="noopener" title="Abrir la publicación en Mercado Libre">${esc(x.titulo)}</a>`:esc(x.titulo)} ${estadoPill(p)}${x.pendientes?` <span class="pill neu" title="Ventas del período que ML todavía no liquidó: no entran en la ganancia">${x.pendientes} sin liquidar</span>`:""}${odoo}</td>
    <td class="n">${p?money(p.precio):"—"}</td><td class="n">${p?p.stock:"—"}</td><td class="n">${p&&p.visitas_30d!=null?p.visitas_30d.toLocaleString("es-AR"):"—"}</td>
    <td class="n">${x.unidades||"—"}</td><td class="n">${x.precio?money(x.precio):"—"}</td><td class="n">${x.c.unit>0?money(x.c.unit):costoPill(x.c)}${x.c.revisar?`<br><span class="pill warn" title="El título dice que la publicación vende ${x.c.sug} unidades y el costo es de 1 unidad de Odoo (${money(x.c.base)}). Si es así, el costo real es ${money(x.c.base*x.c.sug)}. Tocá la fila → Cambiar vínculo para poner el factor.">¿factor ${x.c.sug}?</span>`:""}</td>
    <td class="n ${x.ganancia<0?"neg":""}">${x.ventas?money(x.ganancia):"—"}</td><td class="n">${x.margen==null?"—":pctTxt(x.ganancia,x.precio)}</td></tr>`;
  if(ab) h += `<tr class="det"><td colspan="10">${detallePub(x)}</td></tr>`;
  return h;
}
function detallePub(x){
  const p=x.pub;
  const datos = p ? `<div class="desg" style="margin-bottom:12px">
      <div>ID en Mercado Libre</div><div class="m">${esc(p.id)}</div>
      <div>Tipo</div><div class="m">${esc({gold_special:"Clásica",gold_pro:"Premium",gold:"Oro",free:"Gratuita"}[p.tipo]||p.tipo)}${p.es_catalogo?" · catálogo":""}</div>
      <div>Envío</div><div class="m">${esc({fulfillment:"Full",self_service:"Flex",cross_docking:"Colecta",xd_drop_off:"Places",drop_off:"Correo"}[p.logistica]||p.logistica||"—")}${p.envio_gratis?" · gratis":""}</div>
      <div>SKU / código de barras</div><div class="m">${esc(p.sku||"—")} / ${esc(p.gtin||"—")}</div>
      <div>Vendidas desde que existe</div><div class="m">${p.vendidas_total??"—"}</div>
      ${p.salud!=null?`<div title="Calidad de la publicación según ML (0 a 1)">Salud de la publicación</div><div class="m">${Math.round(p.salud*100)}%</div>`:""}
      ${(p.variaciones||[]).length?`<div>Variantes</div><div class="m">${p.variaciones.map(v=>esc(v.combinacion)+" ("+v.stock+")").join(" · ")}</div>`:""}
    </div>` : "";
  const costo = `<div class="desg">
      <div>Producto de Odoo</div><div class="m">${x.c.pr?esc(x.c.pr.display_name)+" <small>("+esc(x.c.via)+")</small>":"— sin vincular —"}</div>
      ${x.c.pr?`<div title="Costo que usa el motor de precios para este producto">Costo del motor (por unidad de Odoo)</div><div class="m">${money(x.c.base)}</div>
      <div title="Cuántas unidades de Odoo salen por cada unidad vendida en ML">Factor</div><div class="m">× ${x.c.factor}</div>
      <div class="tot">Costo por unidad vendida en ML</div><div class="m tot">${money(x.c.unit)}</div>`:""}
    </div>
    <p style="margin-top:10px"><button class="btn" data-vinc="${esc(x.id)}" title="Cambiar el producto de Odoo o el factor de esta publicación">${x.c.pr?"Cambiar vínculo con Odoo":"Vincular con Odoo"}</button></p>`;
  const ventas = x.ventas ? `<div class="desg" style="margin-top:12px">
      <div>Ventas en el período</div><div class="m">${x.ventas} (${x.unidades} u.)</div>
      <div>Vendido</div><div class="m">${money(x.precio)}</div>
      <div>− Descuentos de ML</div><div class="m">${money(-x.cargos)}</div>
      <div>= Recibido</div><div class="m">${money(x.recibe)}</div>
      <div>− Costo</div><div class="m">${money(-x.costo)}</div>
      <div class="tot">= Ganancia</div><div class="m tot ${x.ganancia<0?"neg":""}">${money(x.ganancia)}</div>
    </div>${x.pendientes?`<p style="font-size:12px;color:var(--gris)">${x.pendientes} venta(s) sin liquidar no entran en descuentos, recibido, costo ni ganancia.</p>`:""}` : "";
  return datos + costo + ventas;
}

/* ---------- vincular publicación → producto de Odoo ---------- */
function abrirVincular(itemId){
  const x = (D.pubs||[]).find(p=>p.id===itemId) || {id:itemId, titulo:itemId};
  const v = D.vinc[itemId]||{}; const cAct = costoItem(itemId);
  const fIni = +v.factor || (cAct.revisar ? cAct.sug : 1);
  ventana("Vincular con Odoo", `
    <p style="font-size:13px;margin:0 0 10px"><b>${esc(x.titulo)}</b><br><small style="color:var(--gris2)">${esc(itemId)}${x.sku?" · SKU "+esc(x.sku):""}${x.gtin?" · GTIN "+esc(x.gtin):""}</small></p>
    <input type="search" id="vq" placeholder="Buscar producto en Odoo (nombre, código o código de barras)…" style="width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px">
    <div class="res" id="vres"><div style="cursor:default;color:var(--gris2)">Escribí al menos 3 letras.</div></div>
    <p style="font-size:13px;margin:14px 0 6px" title="Si la publicación vende una caja de 20 y en Odoo el producto se lleva por unidad, el factor es 20">Unidades de Odoo por cada unidad vendida en ML: <input type="number" id="vf" min="0.001" step="any" value="${fIni}" style="width:90px;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px"></p>
    <p id="vsel" style="font-size:13px;color:var(--gris)">${cAct.pr?"Vinculado hoy a: <b>"+esc(cAct.pr.display_name)+"</b> ("+esc(cAct.via)+") · costo motor "+money(cAct.base)+" por unidad de Odoo"+(cAct.sug>1?"<br>El título dice <b>"+cAct.sug+"</b> por publicación: si Odoo lleva el costo por unidad, el factor es "+cAct.sug+".":""):"Elegí un producto de la lista."}</p>
    <p style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">${v.pid?`<button class="btn" id="vdel" title="Borra el vínculo a mano; vuelve a buscar por SKU o código de barras">Quitar vínculo</button>`:""}<button class="btn pri" id="vok" disabled>Guardar</button></p>`);
  let elegido = cAct.pr || null;
  const ok = document.getElementById("vok"); if(elegido) ok.disabled=false;
  const buscar = EYG.debounce(async()=>{
    const q = document.getElementById("vq").value.trim(); const box=document.getElementById("vres");
    if(q.length<3){ box.innerHTML=`<div style="cursor:default;color:var(--gris2)">Escribí al menos 3 letras.</div>`; return; }
    box.innerHTML=`<div style="cursor:default">Buscando…</div>`;
    try{
      const rows = await EYG.rpc("product.product","search_read",[["|","|",["name","ilike",q],["default_code","ilike",q],["barcode","ilike",q]], CAMPOS_PROD],{limit:30});
      box.innerHTML = (rows||[]).length ? rows.map(r=>`<div data-pid="${r.id}">${esc(r.display_name)}<br><small>${esc(r.default_code||"")} ${r.barcode?"· "+esc(r.barcode):""} · costo motor ${money(costoProd(r))}</small></div>`).join("") : `<div style="cursor:default">Nada con "${esc(q)}".</div>`;
      box.querySelectorAll("[data-pid]").forEach(d=>d.onclick=()=>{ elegido = rows.find(r=>r.id===+d.dataset.pid); D.odoo.byId[elegido.id]=elegido; document.getElementById("vsel").innerHTML="Elegido: <b>"+esc(elegido.display_name)+"</b> · costo motor "+money(costoProd(elegido)); ok.disabled=false; });
    }catch(e){ box.innerHTML=`<div style="cursor:default" class="neg">No pude buscar: ${esc(String(e.message||e))}</div>`; }
  },300);
  document.getElementById("vq").oninput = buscar;
  ok.onclick = async()=>{
    const f = +document.getElementById("vf").value;
    if(!elegido || !(f>0)) return;
    ok.disabled=true; ok.textContent="Guardando…";
    try{ await leerVinculos(); D.vinc[itemId]={pid:elegido.id, factor:f, por:"core", en:new Date().toISOString().slice(0,10)}; await guardarVinculos(); cerrarVentana(); pintar(); }
    catch(e){ ok.disabled=false; ok.textContent="Guardar"; alert("No se pudo guardar: "+(e.message||e)); }
  };
  const del = document.getElementById("vdel");
  if(del) del.onclick = async()=>{ try{ await leerVinculos(); delete D.vinc[itemId]; await guardarVinculos(); cerrarVentana(); pintar(); }catch(e){ alert("No se pudo: "+(e.message||e)); } };
}

/* ---------- utilidades ---------- */
function ventana(titulo, html){
  cerrarVentana();
  const d=document.createElement("div"); d.className="ov"; d.id="ovML";
  d.innerHTML=`<div class="ovc"><button class="cerrar" title="Cerrar">×</button><h3>${esc(titulo)}</h3>${html}</div>`;
  d.onclick=e=>{ if(e.target===d || e.target.classList.contains("cerrar")) cerrarVentana(); };
  document.body.appendChild(d);
}
function cerrarVentana(){ const o=document.getElementById("ovML"); if(o) o.remove(); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") cerrarVentana(); });
/* Excel de verdad: BOM + punto y coma, números con coma decimal (Excel en español). */
function bajarCsv(nombre, cab, filas){
  const cel = v => { if(v==null) return ""; if(typeof v==="number") return String(v).replace(".",","); const s=String(v); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const txt = "﻿"+[cab,...filas].map(f=>f.map(cel).join(";")).join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  a.download=`${nombre}-${ST.from}-a-${ST.to}.csv`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

EYG.guard(["admin","direccion"],{pruebas:["a3dfd1b309dd41ad2c8ae3562a8e00c09ae03f8dd8194b75eea5a3db5c003122","53ab45c75c97fc80109dddf425c8343ca47287b95bcad8ee868cad8fd3d171bd"]}).then(async perfil=>{
  document.body.innerHTML = EYG.layout(perfil,"mercadolibre", `<div id="cap"></div>`, "Mercado Libre");
  try{ D.tasas = await EYG.tasasVenta(); }catch(e){}
  await leerVinculos();
  cargarPublicaciones();          // en paralelo: tarda más (va a ML y a Odoo)
  cargarPeriodo();
});
