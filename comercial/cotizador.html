<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Cotizador · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css?v=83">
<style>
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--teal-deep);font-weight:800;margin:22px 0 12px;display:flex;align-items:center;gap:9px}
  h2.sec:before{content:"";width:5px;height:16px;background:var(--teal);border-radius:3px}
  .cot{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
  @media(max-width:1000px){ .cot{grid-template-columns:1fr} }

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .pad{padding:16px}
  .nota{background:#EEF6F5;border:1px solid #BFE0DC;border-left:4px solid var(--teal);border-radius:10px;padding:11px 14px;font-size:13px;color:#245C57;margin-bottom:14px}
  .nota b{color:var(--teal-deep)}

  /* ---- barra de controles: lista de precios + modo ---- */
  .ctrl{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:14px}
  .fld{display:flex;flex-direction:column;gap:6px;min-width:0}
  .fld .lb{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--gris);font-weight:800}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{font-size:12.5px;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;color:var(--gris);font-family:inherit}
  .chip:hover{border-color:var(--teal)}
  .chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{font-family:inherit;font-size:12.5px;font-weight:700;padding:8px 14px;border:0;background:var(--surface);color:var(--gris);cursor:pointer}
  .seg button.on{background:var(--teal);color:#fff}
  .swi{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--gris);cursor:pointer;user-select:none}
  .swi input{width:16px;height:16px;accent-color:var(--teal);cursor:pointer}

  /* ---- buscador ---- */
  .search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px}

  .res{margin-top:10px;max-height:460px;overflow:auto}

  .row:hover{border-color:var(--teal)}
  .row .nm{flex:1;min-width:0}

  .row .nm span{font-size:11.5px;color:var(--gris)}
  .row .pr{text-align:right;flex:none;white-space:nowrap}
  .row .pr b{font-size:15px;color:var(--teal-deep);font-weight:800}
  .row .pr span{display:block;font-size:10.5px;color:var(--gris)}
  .add{font-family:inherit;font-size:13px;font-weight:800;border:0;border-radius:9px;padding:9px 14px;background:var(--teal);color:#fff;cursor:pointer;flex:none}
  .add:hover{filter:brightness(1.06)}
  .add.qui{background:#EEF2F1;color:var(--gris)}
  .vacio{text-align:center;color:var(--gris);padding:34px 10px;font-size:13.5px}

  /* ---- items de la cotización ---- */
  .it{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
  .it:last-child{border-bottom:0}
  .it .nm{flex:1;min-width:0}
  .it .nm b{font-size:13px;font-weight:700;line-height:1.25;display:block;overflow-wrap:anywhere}

  .it .sub{font-weight:800;font-size:15px;color:var(--teal-deep);margin-top:1px}
  .iva{display:inline-block;font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;line-height:1.3;white-space:nowrap;margin-bottom:3px}

  .iva.si{background:#FBF0DA;color:#8A6A1F;border:1px solid #EAD6A6}
  /* flex-wrap: si no entra el cartelito de la escalera, baja a otro renglón en
     vez de aplastarse (el panel es angosto). */
  .step{display:inline-flex;align-items:center;gap:5px;margin-top:7px;flex-wrap:wrap}
  .step button{font-family:inherit;width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:16px;font-weight:800;color:var(--teal-deep);cursor:pointer;line-height:1}
  .step button:hover{border-color:var(--teal)}
  .step input{width:62px;height:30px;border:1px solid var(--line);border-radius:8px;text-align:center;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink)}
  .step .del{color:var(--bad);font-size:14px}
  .nextd{display:inline-block;background:var(--okbg);color:var(--ok);font-size:11px;font-weight:800;border-radius:7px;padding:3px 8px;margin-top:6px;line-height:1.25}
  /* Escalera por cantidad. Ocupa lo mínimo: al lado de la cantidad va sólo un
     cartelito ("−21%" o "hasta −21%"). La grilla completa se abre en un globo
     sólo si el comercial la pide, y se cierra al elegir un tramo. */
  /* flex:0 0 auto en los dos: dentro de un flex angosto, sin esto el navegador
     los encoge y el texto se parte aunque tengan white-space:nowrap. */
  .escbtn{flex:0 0 auto;font-family:inherit;font-size:10.5px;font-weight:800;border:1px solid #CFE7DF;background:var(--okbg);color:var(--ok);border-radius:7px;padding:0 9px;height:30px;cursor:pointer;line-height:1;white-space:nowrap;margin-left:2px}
  /* OJO: .step button fija width:30px (los −/+/🗑 son cuadrados). El cartelito
     vive adentro de .step, así que hay que devolverle el ancho automático. */
  .step .escwrap .escbtn{width:auto;min-width:0}
  .escbtn:hover{filter:brightness(.97)}
  .escbtn.plano{background:var(--surface);border-color:var(--line);color:var(--gris)}
  .escwrap{flex:0 0 auto;position:relative;display:inline-block}
  /* Ancla a la IZQUIERDA del botón: el cartelito está al principio del renglón,
     así que con right:0 el globo se salía por fuera de la tarjeta. */
  .pop{position:absolute;z-index:40;top:calc(100% + 6px);left:0;min-width:196px;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:0 12px 30px rgba(6,65,62,.18);padding:7px;animation:pin .12s ease-out}

  .pop .pl:hover{background:#F2F9F8}
  .pop .pl.on{background:var(--teal);color:#fff}
  .pop .pl .q{flex:1;white-space:nowrap;font-weight:700}
  .pop .pl .p{font-weight:800;white-space:nowrap}

  .vtob{flex:0 0 auto;font-family:inherit;font-size:10.5px;font-weight:800;border:1px solid #CFE0EA;background:#EDF4F8;color:#2C5468;border-radius:7px;padding:0 9px;height:30px;line-height:1;white-space:nowrap;cursor:pointer;margin-left:2px}
  .vtob.corto{background:#FBE4E3;border-color:#F0BEBC;color:#8A2E2B}
  .step .escwrap .vtob{width:auto;min-width:0}
  .row .vtob{height:auto;padding:2px 7px;margin:4px 0 0;cursor:default;display:inline-block}
  .pop .pl .p.lcorto{color:#8A2E2B}
  .descb{display:inline-block;background:var(--okbg);color:var(--ok);font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;line-height:1.3;margin-bottom:3px;white-space:nowrap}
  .escmini{font-size:11px;color:var(--ok);font-weight:700;margin-top:3px;line-height:1.35}

  .tot{padding:14px 16px;border-top:2px solid var(--line);background:#FAFDFC;border-radius:0 0 14px 14px}
  .tr{display:flex;justify-content:space-between;font-size:13px;color:var(--gris);padding:3px 0}
  .tr b{color:var(--ink);font-weight:700}
  .tr.big{font-size:19px;font-weight:800;color:var(--teal-deep);border-top:1px solid var(--line);margin-top:7px;padding-top:9px}
  .tr.big span:last-child{font-weight:800}
  .btns{display:flex;flex-direction:column;gap:8px;margin-top:13px}
  .btn{font-family:inherit;font-size:14px;font-weight:800;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:var(--teal);color:#fff}
  .btn:hover{filter:brightness(1.06)}
  .btn.wa{background:var(--wa,#25D366)}
  .btn.pdf{background:var(--teal-deep)}
  .pdff{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
  .pdff label{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--gris);font-weight:800}
  .pdff input,.pdff textarea{font-family:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--surface);width:100%;box-sizing:border-box}
  .pdff input:focus,.pdff textarea:focus{outline:none;border-color:var(--teal)}
  .pdff .ay{font-size:11.5px;color:var(--gris)}
  .pdfsug{display:flex;flex-direction:column;gap:4px;margin-top:4px}
  .pdfsug button{font-family:inherit;text-align:left;font-size:12.5px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;cursor:pointer;color:var(--ink)}
  .pdfsug button:hover{border-color:var(--teal);background:#F7FBFA}
  .pdf2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:520px){ .pdf2{grid-template-columns:1fr} }
  .btn.gh{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  .btn.gh:hover{border-color:var(--teal)}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none}

  .prev{margin-top:12px;background:#F7FBFA;border:1px dashed var(--line);border-radius:10px;padding:12px 13px;font-size:12px;line-height:1.55;white-space:pre-wrap;color:var(--gris);max-height:230px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .spin{width:30px;height:30px;border:4px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite;margin:34px auto}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---- guardar como presupuesto: modal, picker de cliente y comparación ---- */
  .scrim{position:fixed;inset:0;background:rgba(6,40,38,.42);display:flex;align-items:center;justify-content:center;padding:18px;z-index:9000}
  .modal{background:var(--surface);border-radius:16px;box-shadow:0 24px 60px rgba(6,65,62,.28);padding:20px;width:100%;max-width:540px;max-height:88vh;overflow:auto}
  .modal h3{margin:0 0 10px;font-size:17px;color:var(--teal-deep)}
  .modal p{font-size:13.5px;line-height:1.55;color:var(--gris);margin:0 0 11px}
  .mb{display:flex;gap:9px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
  .mb.col{flex-direction:column;align-items:stretch}
  .btn.red{background:var(--bad);color:#fff}
  .errbox{background:#FEF4F3;border:1px solid #F2CFCA;color:#8A2F27;border-radius:9px;padding:10px 12px;font-size:12.5px;line-height:1.5;word-break:break-word;max-height:220px;overflow:auto}
  .clilist{max-height:320px;overflow:auto;margin-top:10px}
  .clirow{display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:var(--surface)}
  .clirow:hover{border-color:var(--teal);background:#F7FBFA}
  .clirow .av{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none}
  .clirow .nm{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.3}
  .clirow .sub{font-size:11.5px;color:var(--gris)}
  .clisep{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:800;padding:10px 4px 6px}
  .cmp{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
  .cmp th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);padding:4px 6px;font-weight:800}
  .cmp td{padding:6px;border-top:1px solid var(--line);vertical-align:top}
  .cmp td.n{text-align:right;white-space:nowrap;font-weight:700}
  .cmp tr.dif td{background:#FEF6EC}
  .cmp .dt{font-size:11px;font-weight:800;color:#8A5A12;display:block}
  .banner{display:flex;align-items:center;gap:11px;flex-wrap:wrap;background:#EAF7F1;border:1px solid #BFE3D2;border-left:4px solid var(--ok);border-radius:10px;padding:11px 14px;font-size:13px;color:#1E5C46;margin-bottom:14px}
  .banner b{color:#14493A}
  .banner .sp{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
  .banner.viejo{background:#FEF6EC;border-color:#EAD6A6;border-left-color:#C89A2B;color:#7A5A16}
  .banner.viejo b{color:#5E4410}
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=120"></script>
<script>
/* ============================================================
   COTIZADOR — precios sueltos y cotizaciones, SIN cliente
   ============================================================
   Para qué existe: hasta ahora, para decirle un precio a alguien había que
   crear un presupuesto en Odoo eligiendo cliente. Para la mayoría de las
   consultas (“¿cuánto sale la jeringa?”, “pasame precio de estos 5”) eso es
   burocracia pura y ensucia Odoo con borradores que nadie confirma.

   Cotizar NO toca Odoo: solo LEE precios. No crea clientes ni reserva stock.
   Se arma, se copia y se manda por WhatsApp. Recién cuando el cliente ACEPTA,
   el botón "Guardar como presupuesto" lo baja a Odoo como borrador a nombre de
   un cliente, y de ahí sigue el circuito de "Cargar venta" (ver el bloque
   GUARDAR COMO PRESUPUESTO al final del archivo).

   El precio sale del MISMO motor que “Cargar venta”: los ítems de la tarifa
   de Odoo (product.pricelist.item), con la escalera por cantidad de Farmacias
   y el precio único por variante de los otros tiers. Si el precio cambia en
   Odoo, acá cambia solo.
   ============================================================ */
const esc=EYG.esc, money=EYG.money;
const ES={lang:"es_AR"};
const nf=n=>Math.round(n||0).toLocaleString("es-AR");
function toast(m){ let t=document.getElementById("toast"); if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);} t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2600); }

/* Mismas listas y mismos permisos que “Cargar venta”: si un comercial no puede
   VENDER con una lista, tampoco debe cotizar con ella (Odoo se lo bloquea al
   confirmar, así que cotizarlo sería prometer un precio que no puede sostener). */
const LISTAS_POR_USER = { 520:[3,16,5], 215:[3,16], 18:[3,16,5], 498:[3,16,5] };
const LISTAS_DEF=[3,16,5];

let PERFIL=null, USERID=null, COMERCIAL="";
const ST={ listas:[], lista:null, modo:"cotizacion", conIva:false, conEscalera:false, escAbierta:null,
           lotes:{}, _lotesDone:null, lotAbierto:null, conVto:false,
           q:"", res:[], buscando:false, items:[], precios:{}, tiers:{}, pvp:{}, taxes:{}, taxmap:null,
           cartera:null, fuera:[], qCli:"", guardado:null, pdf:null };

/* ---------------- arranque ---------------- */
EYG.guard(["comercial","lider","admin","direccion"]).then(async perfil=>{
  PERFIL=perfil;
  COMERCIAL = perfil.comercial_ref || perfil.nombre || perfil.email;
  document.body.innerHTML = EYG.layout(perfil,"cotizador", `<div id="cap"><div class="spin"></div></div>`, "Cotizador");
  try{
    const u=await EYG.rpc("res.users","search_read",[[["name","=",COMERCIAL]]],{fields:["id"],limit:1});
    USERID = u.length? u[0].id : null;
  }catch(e){ USERID=null; }
  await Promise.all([cargarListas(), cargarImpuestos()]);
  restaurar();
  render();
  // Los precios de lo restaurado se releen de la tarifa (no se guardan): repinta al llegar.
  if(ST.items.length){ await preciarItems(false); render(); }
});

async function cargarListas(){
  const jefe=["lider","direccion","admin"].includes(PERFIL.rol);
  const permitidas = jefe ? LISTAS_DEF : (LISTAS_POR_USER[USERID] || [3]);
  try{
    const all=await EYG.rpc("product.pricelist","search_read",[[["id","in",permitidas],["active","=",true]]],{fields:["id","name"],context:ES});
    ST.listas = permitidas.map(id=>all.find(l=>l.id===id)).filter(Boolean);
  }catch(e){ ST.listas=[]; }
  if(!ST.lista || !ST.listas.some(l=>l.id===ST.lista)) ST.lista = ST.listas.length? ST.listas[0].id : null;
}

/* IVA: mismo criterio que el badge de “Cargar venta”. Los nombres salen de
   account.tax, no van hardcodeados. OJO con los impuestos “IMP INC”: su precio
   YA es final y no se les vuelve a sumar IVA (ver la regla de ofertas). */
async function cargarImpuestos(){
  try{
    const tx=await EYG.rpc("account.tax","search_read",[[["type_tax_use","=","sale"]]],{fields:["id","name","amount","amount_type","price_include"],limit:100});
    ST.taxmap={};
    (tx||[]).forEach(t=>{
      const incluido = !!t.price_include || /imp\.?\s*inc|inclu/i.test(t.name||"");
      const pct = (t.amount_type==="percent") ? (t.amount||0) : 0;
      ST.taxmap[t.id]={ pct: incluido?0:pct, incluido,
        exento: !(pct>0), label: (pct>0) ? ("IVA "+String(pct).replace(".",",")+"%") : "Exento" };
    });
  }catch(e){ ST.taxmap=null; }
}
function ivaDe(taxIds){
  if(!ST.taxmap||!taxIds||!taxIds.length) return null;
  const i=taxIds.map(id=>ST.taxmap[id]).filter(Boolean);
  if(!i.length) return null;
  return i.find(x=>!x.exento) || i[0];
}
/* Alícuota efectiva a sumar al precio neto (0 si es exento o si ya viene incluido). */
function tasaDe(it){ const v=ivaDe(it.taxes_id); return v? (v.pct||0)/100 : 0; }

/* ---------------- precios (mismo motor que vender.html) ---------------- */
async function cargarPrecios(prods){
  if(!prods.length) return;
  if(!ST.lista){ prods.forEach(p=>{ ST.precios[p.id]=(p.list_price>1?p.list_price:null); ST.tiers[p.id]=[]; }); return; }
  const tmpls=[...new Set(prods.map(p=>p.product_tmpl_id&&p.product_tmpl_id[0]).filter(Boolean))];
  const vids=prods.map(p=>p.id);
  let items=[];
  try{
    // Farmacias: ítems por PLANTILLA con escalera. Tiers 2/3: por VARIANTE, precio único.
    items=await EYG.rpc("product.pricelist.item","search_read",
      [["&",["pricelist_id","=",ST.lista],"|",
        "&",["applied_on","=","1_product"],["product_tmpl_id","in",tmpls],
        "&",["applied_on","=","0_product_variant"],["product_id","in",vids]]],
      {fields:["product_tmpl_id","product_id","applied_on","min_quantity","fixed_price","compute_price"],limit:20000});
  }catch(e){}
  const porT={}, porV={};
  (items||[]).forEach(it=>{
    if(it.applied_on==="0_product_variant" && it.product_id) (porV[it.product_id[0]]=porV[it.product_id[0]]||[]).push(it);
    else if(it.product_tmpl_id) (porT[it.product_tmpl_id[0]]=porT[it.product_tmpl_id[0]]||[]).push(it);
  });
  prods.forEach(p=>{
    const t=p.product_tmpl_id&&p.product_tmpl_id[0];
    const src=(porV[p.id]&&porV[p.id].length)?porV[p.id]:(porT[t]||[]);
    let arr=src.filter(i=>i.compute_price==="fixed"&&i.fixed_price>0)
      .map(i=>({q:i.min_quantity||1,p:i.fixed_price})).sort((a,b)=>a.q-b.q);
    // Quirk EyG: el 1er tramo (min≤1) que repite el precio del 2do es el "general" oculto → se fusiona.
    if(arr.length>=2 && arr[0].q<=1 && EYG.r2(arr[0].p)===EYG.r2(arr[1].p)){ arr=arr.slice(1); arr[0]={...arr[0],q:1}; }
    if(arr.length && arr[0].q<1) arr[0]={...arr[0],q:1};
    ST.tiers[p.id]=arr;
    ST.precios[p.id]= arr.length? arr[0].p : (p.list_price>1?p.list_price:null);
    if(p.list_price>0) ST.pvp[p.id]=p.list_price;   // PVP (Alfabeta en éticos): base del % de descuento
  });
}
function tramoDe(pid,q){ const t=ST.tiers[pid]||[]; let r=t[0]||null; for(const x of t){ if(x.q<=Math.max(1,q)) r=x; } return r; }
function proxTramo(pid,q){ const t=ST.tiers[pid]||[]; const cur=tramoDe(pid,q);
  for(const x of t){ if(x.q>Math.max(1,q) && (!cur||x.p<cur.p)) return {need:x.q-Math.max(0,q), tier:x}; } return null; }
/* % de descuento de un tramo, MISMO criterio que “Cargar venta” y que la web:
   la base es el PVP (list_price = Alfabeta en éticos). Si el producto no tiene
   PVP real (los hospitalarios traen 0/1), la base es el primer tramo de la lista. */
function descPct(pid,tier){
  const t=ST.tiers[pid]||[]; if(!t.length||!tier) return 0;
  const pvp=ST.pvp[pid]||0; const base = pvp>1 ? pvp : t[0].p;
  return base>0 ? Math.round((1-tier.p/base)*100) : 0;
}
/* Descuento que está aplicado AHORA en esa línea (0 si está en el primer tramo). */
function descAplicado(it){ return descPct(it.id, tramoDe(it.id, it.cant)); }
function unitDe(it){ const tr=tramoDe(it.id, cantDe(it)); const base = tr? tr.p : ST.precios[it.id];
  if(base==null) return null; return ST.conIva ? base*(1+tasaDe(it)) : base; }
/* En “Solo precios” no se muestran cantidades: el precio del renglón tiene que
   ser el UNITARIO. Si usáramos it.cant, el precio dependería de una cantidad
   que el comercial no ve (venía de haber estado antes en modo Cotización) y
   mandaría sin querer el precio de un tramo con descuento. La escalera que va
   debajo es la que muestra los precios por cantidad. */
function cantDe(it){ return ST.modo==="precios" ? 1 : it.cant; }

/* ---------------- búsqueda ---------------- */
/* Mismo motor que el buscador del portal y el de “Cargar venta”: buscar_web
   (pg_trgm en Supabase) devuelve ids de PLANTILLA, y a Odoo le pedimos las
   variantes de esas plantillas. Difuso: "ibu 600" trae IBUPROFENO 600. */
const buscar = EYG.buscador(async v=>{
  ST.q=v; const q=(v||"").trim();
  if(q.length<2){ ST.res=[]; ST.buscando=false; pintarRes(); return; }
  ST.buscando=true; pintarRes();
  const token=(ST._tk=(ST._tk||0)+1);
  try{
    let prods=[];
    try{
      const rows=await buscarWeb(q);
      const tmpls=[...new Set(rows.map(r=>r.tmpl_id||r.product_tmpl_id||r.id).filter(Boolean))].slice(0,40);
      if(tmpls.length) prods=await EYG.rpc("product.product","search_read",
        [[["product_tmpl_id","in",tmpls],["sale_ok","=",true],["active","=",true]].concat(EYG.SIN_OCULTAS)],
        {fields:["id","default_code","name","product_tmpl_id","qty_available","list_price","taxes_id"],context:ES,limit:120});
    }catch(e){}
    if(!prods.length) prods=await EYG.rpc("product.product","search_read",
      [["&","&",["sale_ok","=",true],["active","=",true]].concat(EYG.SIN_OCULTAS)
        .concat(["|",["name","ilike",q],["default_code","ilike",q]])],
      {fields:["id","default_code","name","product_tmpl_id","qty_available","list_price","taxes_id"],context:ES,order:"name",limit:60});
    if(token!==ST._tk) return;
    await cargarPrecios(prods);
    if(token!==ST._tk) return;
    ST.res=prods; ST.buscando=false; pintarRes();
    cargarLotes(prods).then(()=>{ if(token===ST._tk){ pintarRes(); pintarItems(); } });  // repinta al llegar
  }catch(e){ if(token===ST._tk){ ST.res=[]; ST.buscando=false; pintarRes(); toast("No pude buscar: "+(e.message||e)); } }
}, 280);
async function buscarWeb(q){ const {data,error}=await EYG.supa().rpc("buscar_web",{q,lim:40}); if(error) throw error; return data||[]; }

/* ---------------- lotes y vencimiento ----------------
   Las instituciones piden vencimiento mínimo, así que el comercial necesita
   verlo MIENTRAS cotiza y no después. Mismo criterio que “Cargar venta”:
   solo lotes CON stock, ordenados por vencimiento (primero el que vence antes,
   que es el que sale por FEFO) y en rojo si le quedan menos de 180 días. */
const VTO_CORTO = 180;
function fmtVto(d){ if(!d) return "—"; const p=String(d).split("-"); return p.length===3 ? (p[2]+"/"+p[1]+"/"+p[0].slice(2)) : d; }
function diasHasta(d){ if(!d) return 99999; try{ const t=new Date(d+"T00:00:00"), h=new Date(EYG.argToday()+"T00:00:00"); return Math.round((t-h)/86400000); }catch(e){ return 99999; } }
async function cargarLotes(prods){
  try{
    ST._lotesDone = ST._lotesDone || new Set();
    const pids=(prods||[]).map(p=>p.id).filter(id=>!ST._lotesDone.has(id));
    if(!pids.length) return;
    pids.forEach(id=>ST._lotesDone.add(id));
    const lots=await EYG.rpc("stock.lot","search_read",
      [[["product_id","in",pids],["product_qty",">",0]],["product_id","name","expiration_date","product_qty"]],{limit:5000});
    const by={};
    (lots||[]).forEach(l=>{ if(!l.product_id) return; const pid=l.product_id[0];
      (by[pid]=by[pid]||[]).push({n:l.name||"", exp:(l.expiration_date||"").slice(0,10), qty:l.product_qty||0}); });
    Object.keys(by).forEach(pid=>by[pid].sort((a,b)=>(a.exp||"9999").localeCompare(b.exp||"9999")));
    ST.lotes=Object.assign(ST.lotes||{}, by);
  }catch(e){}
}
const lotesDe=id=>(ST.lotes&&ST.lotes[id])||[];
/* Etiqueta compacta con el vencimiento más próximo. Tocándola se abren todos. */
function vtoHTML(id, conPop){
  const ls=lotesDe(id); if(!ls.length) return "";
  const pr=ls[0]; if(!pr.exp) return "";
  const corto=diasHasta(pr.exp)<VTO_CORTO;
  const abierto = conPop && ST.lotAbierto===id;
  const btn=`<button class="vtob ${corto?"corto":""}" ${conPop?`onclick="togLot(${id})"`:""}
     title="Vence primero el ${fmtVto(pr.exp)}${ls.length>1?` · ${ls.length} lotes con stock`:""}">⏳ ${fmtVto(pr.exp)}${conPop&&ls.length>1?" ▾":""}</button>`;
  if(!abierto) return conPop?`<span class="escwrap">${btn}</span>`:btn;
  return `<span class="escwrap">${btn}<div class="pop" onclick="event.stopPropagation()">
    <div class="ph">Lotes con stock</div>
    ${ls.map((l,i)=>`<div class="pl" style="cursor:default">
      <span class="q">Lote ${esc(l.n||"—")}${i===0?' <b style="color:var(--ok)">·1º</b>':""}</span>
      <span class="p ${diasHasta(l.exp)<VTO_CORTO?"lcorto":""}">${l.exp?fmtVto(l.exp):"sin vto"}</span>
      <span class="d" style="color:var(--gris)">${nf(l.qty)} u</span></div>`).join("")}
  </div></span>`;
}
function togLot(id){ ST.lotAbierto = ST.lotAbierto===id ? null : id; ST.escAbierta=null; render(); }

/* ---------------- carrito ---------------- */
function enLista(id){ return ST.items.some(x=>x.id===id); }
function agregar(id){
  const p=ST.res.find(x=>x.id===id); if(!p) return;
  if(enLista(id)){ quitar(id); return; }
  // Guardamos el PVP con el ítem: es la base del % de descuento y no cambia con la lista.
  // Si no, al recargar la página los % se calcularían contra otra base y no coincidirían.
  ST.items.push({ id:p.id, code:p.default_code||"", name:limpiaNom(p.name), cant:1,
                  taxes_id:p.taxes_id||[], tmpl:p.product_tmpl_id?p.product_tmpl_id[0]:null,
                  pvp:p.list_price||0 });
  guardar(); render();
}
function quitar(id){ ST.items=ST.items.filter(x=>x.id!==id); guardar(); render(); }
function setCant(id,v){ const it=ST.items.find(x=>x.id===id); if(!it) return;
  it.cant=Math.max(1,parseInt(v,10)||1); guardar(); render(); }
function chgCant(id,d){ const it=ST.items.find(x=>x.id===id); if(!it) return;
  it.cant=Math.max(1,(it.cant||1)+d); guardar(); render(); }
function limpiar(){ if(!ST.items.length) return;
  if(!confirm("¿Vaciar la cotización?")) return; ST.items=[]; ST.pdf=null; guardar(); render(); }
// El código entre corchetes al principio del nombre es ruido para el cliente.
function limpiaNom(n){ return String(n||"").replace(/^\[[^\]]*\]\s*/,"").trim(); }

/* La cotización sobrevive a recargas y a cambiar de módulo: es un borrador de
   trabajo del comercial, no un dato del sistema, así que vive en el navegador. */
const LSKEY="eyg_cotizador";
function guardar(){ try{ localStorage.setItem(LSKEY, JSON.stringify({items:ST.items, lista:ST.lista, modo:ST.modo, conIva:ST.conIva, conEscalera:ST.conEscalera, conVto:ST.conVto, guardado:ST.guardado, pdf:ST.pdf})); }catch(e){} }
function restaurar(){
  try{ const o=JSON.parse(localStorage.getItem(LSKEY)||"{}");
    if(Array.isArray(o.items)) ST.items=o.items;
    if(o.lista && ST.listas.some(l=>l.id===o.lista)) ST.lista=o.lista;
    if(o.modo) ST.modo=o.modo;
    ST.conIva=!!o.conIva; ST.conEscalera=!!o.conEscalera; ST.conVto=!!o.conVto;
    if(o.guardado && o.guardado.id) ST.guardado=o.guardado;   // el presupuesto ya creado sobrevive a la recarga
    if(o.pdf && typeof o.pdf==="object") ST.pdf=o.pdf;          // destinatario, referencia, etc. del último PDF
  }catch(e){}
}

/* Re-lee de la tarifa el precio de lo que ya está en la cotización.
   Hace falta en dos momentos: al CAMBIAR DE LISTA (la lista es el precio, no un
   adorno) y al RESTAURAR del navegador (guardamos los productos, no sus precios:
   si guardáramos el precio, una cotización vieja mostraría un precio viejo). */
async function preciarItems(incluirRes){
  const pend=ST.items.map(it=>({id:it.id, product_tmpl_id:it.tmpl?[it.tmpl]:null, list_price:it.pvp||0}));
  const todo = incluirRes ? pend.concat(ST.res.map(p=>({id:p.id, product_tmpl_id:p.product_tmpl_id, list_price:p.list_price}))) : pend;
  if(todo.length){ await cargarPrecios(todo); await cargarLotes(todo); }
}
async function setLista(id){
  ST.lista=id; guardar(); render();
  await preciarItems(true); render();
}
function setModo(m){ ST.modo=m; guardar(); render(); }
function setIva(v){ ST.conIva=!!v; guardar(); render(); }
function setEscalera(v){ ST.conEscalera=!!v; guardar(); render(); }
function setVto(v){ ST.conVto=!!v; guardar(); render(); }

/* ---------------- render ---------------- */
function render(){
  const cap=document.getElementById("cap"); if(!cap) return;
  const l=ST.listas.find(x=>x.id===ST.lista);
  cap.innerHTML=`
    <h2 class="sec">🧮 Cotizador
      <span style="margin-left:auto;display:flex;align-items:center;gap:12px;font-weight:600;text-transform:none;letter-spacing:0">
        <span style="color:var(--gris);font-size:12px">Cotizás sin cliente; si te lo aceptan, lo guardás como presupuesto</span>
        <a href="panel.html${PERFIL&&PERFIL.rol!=="comercial"&&COMERCIAL?("?c="+encodeURIComponent(COMERCIAL)):""}" class="chip" style="text-decoration:none">← Volver al panel</a>
      </span></h2>
    <div class="nota">Armá una cotización o pasá precios sueltos <b>sin elegir cliente</b>. Los precios salen de la tarifa de Odoo, igual que en Cargar venta. Cuando esté listo, <b>copialo y pegalo en WhatsApp</b> o <b>bajalo en PDF</b> para mandarlo por mail — y si el cliente te lo acepta, <b>guardalo como presupuesto</b> y seguí la venta sin volver a cargar nada.</div>
    ${bannerHTML()}
    <div class="ctrl">
      <div class="fld"><span class="lb">Lista de precios</span>
        <div class="chips">${ST.listas.length? ST.listas.map(x=>`<button class="chip ${x.id===ST.lista?'on':''}" onclick="setLista(${x.id})">🏷️ ${esc(x.name)}</button>`).join("") : '<span style="font-size:13px;color:var(--gris)">Sin listas asignadas</span>'}</div>
      </div>
      <div class="fld"><span class="lb">Qué vas a mandar</span>
        <div class="seg">
          <button class="${ST.modo==="cotizacion"?"on":""}" onclick="setModo('cotizacion')" title="Con cantidades y total">Cotización</button>
          <button class="${ST.modo==="precios"?"on":""}" onclick="setModo('precios')" title="Solo el precio de cada producto, sin cantidades ni total">Solo precios</button>
        </div>
      </div>
      <div class="fld"><span class="lb">Impuesto</span>
        <label class="swi" title="Los precios de la tarifa son NETOS. Tildá esto para mostrarlos con IVA, como los ve el cliente en la web."><input type="checkbox" ${ST.conIva?"checked":""} onchange="setIva(this.checked)"> Mostrar con IVA</label>
      </div>
      <div class="fld"><span class="lb">En el mensaje</span>
        <label class="swi" title="Suma al texto de WhatsApp la escalera de cada producto, para que el cliente vea desde cuántas unidades le baja el precio."><input type="checkbox" ${ST.conEscalera?"checked":""} onchange="setEscalera(this.checked)"> Incluir la escalera</label>
        <label class="swi" title="Suma el vencimiento del lote que sale primero. Útil para instituciones que exigen un vencimiento mínimo."><input type="checkbox" ${ST.conVto?"checked":""} onchange="setVto(this.checked)"> Incluir vencimiento</label>
      </div>
    </div>
    <div class="cot">
      <div class="card pad">
        <div class="search">🔎 <input id="q" placeholder="Buscar por nombre, droga o código… (ej: ibu 600)" value="${esc(ST.q)}"></div>
        <div class="res" id="res"></div>
      </div>
      <div>
        <div class="card">
          <div class="pad" style="padding-bottom:8px;display:flex;align-items:center;gap:9px">
            <b style="font-size:15px;color:var(--teal-deep)">${ST.modo==="precios"?"🏷️ Precios":"🧾 Cotización"}</b>
            <span style="font-size:12px;color:var(--gris)">${ST.items.length} producto${ST.items.length===1?"":"s"}</span>
            ${ST.items.length?`<button class="chip" style="margin-left:auto;padding:5px 10px;font-size:11.5px" onclick="limpiar()">Vaciar</button>`:""}
          </div>
          <div id="items"></div>
          <div class="tot" id="tot"></div>
        </div>
      </div>
    </div>`;
  const q=document.getElementById("q");
  if(q){ q.oninput=e=>buscar(e.target.value); if(ST.q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }
  pintarRes(); pintarItems();
}

function pintarRes(){
  const c=document.getElementById("res"); if(!c) return;
  if(ST.buscando){ c.innerHTML='<div class="spin"></div>'; return; }
  if(!(ST.q||"").trim()){ c.innerHTML='<div class="vacio">Buscá un producto para empezar.<br><span style="font-size:12px">Tolera el tipeo y busca por droga: "ibu 600", "taf 1g".</span></div>'; return; }
  if(!ST.res.length){ c.innerHTML='<div class="vacio">No encontré nada con eso.</div>'; return; }
  c.innerHTML=ST.res.map(p=>{
    const base=ST.precios[p.id];
    const t=(ST.taxmap&&ivaDe(p.taxes_id))||null;
    const pr = base==null? null : (ST.conIva? base*(1+((t&&t.pct)||0)/100) : base);
    const ya=enLista(p.id);
    const tt=ST.tiers[p.id]||[];
    // Que se sepa que tiene escalera antes de sumarlo, en un renglón y nada más.
    const maxD = tt.length>1 ? Math.max(...tt.map(x=>descPct(p.id,x))) : 0;
    const escP = maxD>0 ? `<div class="escmini">Por cantidad, hasta −${maxD}%</div>` : "";
    return `<div class="row">
      <div class="nm"><b>${esc(limpiaNom(p.name))}</b>
        <span>${p.default_code?esc(p.default_code)+" · ":""}${t?esc(t.label):""}${p.qty_available>0?` · ${nf(p.qty_available)} en stock`:" · sin stock"}</span>${escP}
        ${vtoHTML(p.id,false)}</div>
      <div class="pr"><b>${pr!=null?money(pr):"—"}</b><span>${pr!=null?(ST.conIva?"c/IVA":"neto")+" c/u":"sin precio en la lista"}</span></div>
      <button class="add ${ya?"qui":""}" onclick="agregar(${p.id})">${ya?"✓ Quitar":"＋ Sumar"}</button>
    </div>`;
  }).join("");
}

/* La escalera de precios por cantidad, tramo por tramo. Es la herramienta para
   cotizar con descuento: el comercial ve a partir de cuántas unidades baja el
   precio y cuánto, y TOCANDO un tramo pone esa cantidad en la cotización.
   En “Solo precios” no hay cantidades, así que va como texto informativo. */
function escaleraHTML(it, soloPrecios){
  const t=ST.tiers[it.id]||[];
  if(t.length<2) return "";                       // sin escalera real: no ensuciamos
  const pu=x=> ST.conIva ? x.p*(1+tasaDe(it)) : x.p;
  const maxD=Math.max(...t.map(x=>descPct(it.id,x)));
  // En “Solo precios” no hay cantidad ni botones: alcanza con una línea.
  if(soloPrecios) return maxD>0 ? `<div class="escmini">Por cantidad, hasta −${maxD}%</div>` : "";
  const dp=descAplicado(it);
  const abierto = ST.escAbierta===it.id;
  const cur=tramoDe(it.id, it.cant);
  const lbl = dp>0 ? `−${dp}%` : `hasta −${maxD}%`;
  return `<span class="escwrap">
    <button class="escbtn ${dp>0?"":"plano"}" onclick="togEsc(${it.id})"
      title="${dp>0?`Estás cotizando con −${dp}%. `:""}Ver la escalera por cantidad y elegir un tramo">🏷️ ${lbl} ▾</button>
    ${abierto?`<div class="pop" onclick="event.stopPropagation()">
      <div class="ph">Precio por cantidad</div>
      ${t.map(x=>{ const d=descPct(it.id,x); const on=cur&&cur.q===x.q;
        return `<button class="pl ${on?"on":""}" onclick="setCant(${it.id},${x.q});togEsc(null)">
          <span class="q">desde ${nf(x.q)} u</span><span class="p">${money(pu(x))}</span>${d>0?`<span class="d">−${d}%</span>`:""}</button>`;
      }).join("")}
    </div>`:""}
  </span>`;
}
/* Un solo globo abierto a la vez. Un clic en cualquier otro lado lo cierra. */
function togEsc(id){ ST.escAbierta = (ST.escAbierta===id||id==null) ? null : id; pintarItems(); }
document.addEventListener("click", e=>{
  if(e.target.closest(".escwrap")) return;
  if(ST.escAbierta!=null){ togEsc(null); return; }
  if(ST.lotAbierto!=null){ ST.lotAbierto=null; render(); }
});

function pintarItems(){
  const c=document.getElementById("items"), t=document.getElementById("tot");
  if(!c||!t) return;
  if(!ST.items.length){
    c.innerHTML='<div class="vacio">Todavía no sumaste nada.<br><span style="font-size:12px">Buscá a la izquierda y tocá ＋ Sumar.</span></div>';
    t.innerHTML=`<div class="btns"><button class="btn wa" disabled>📋 Copiar para WhatsApp</button><button class="btn pdf" disabled>📄 Descargar PDF</button></div>`;
    return;
  }
  const precios=ST.modo==="precios";
  c.innerHTML=ST.items.map(it=>{
    const u=unitDe(it);
    const sub=subDe(it);
    const nx= precios? null : proxTramo(it.id,it.cant);
    const v=ivaDe(it.taxes_id);
    return `<div class="it">
      <div class="nm"><b>${esc(it.name)}</b>
        ${precios?"":`<div class="step">
          <button onclick="chgCant(${it.id},-1)">−</button>
          <input type="number" min="1" value="${it.cant}" onfocus="this.select()" onchange="setCant(${it.id},this.value)">
          <button onclick="chgCant(${it.id},1)">＋</button>
          <button class="del" onclick="quitar(${it.id})" title="Quitar">🗑</button>
          ${escaleraHTML(it,false)}
          ${vtoHTML(it.id,true)}
        </div>`}
        ${nx?`<div class="nextd">＋${nf(nx.need)} u → ${money(ST.conIva? nx.tier.p*(1+tasaDe(it)) : nx.tier.p)} c/u</div>`:""}
        ${precios?escaleraHTML(it,true):""}
        ${precios?vtoHTML(it.id,true):""}
        ${precios?`<div style="margin-top:6px"><button class="chip" style="padding:4px 9px;font-size:11px" onclick="quitar(${it.id})">Quitar</button></div>`:""}
      </div>
      <div class="r">
        ${v?`<span class="iva ${v.exento?"ex":"si"}">${esc(v.label)}</span>`:""}
        <div class="u">${u!=null?money(u)+" c/u":"sin precio"}</div>
        ${precios?"":`<div class="sub">${sub!=null?money(sub):"—"}</div>`}
      </div>
    </div>`;
  }).join("");

  if(precios){
    t.innerHTML=`<div class="tr"><span>${ST.items.length} producto${ST.items.length===1?"":"s"}</span><b>${ST.conIva?"precios con IVA":"precios netos"}</b></div>
      <div class="btns">
        <button class="btn wa" onclick="copiar('precios')">📋 Copiar para WhatsApp</button>
        <button class="btn pdf" onclick="abrirPdf()" title="Baja la lista de precios en PDF, con membrete de EyG, para mandar por mail">📄 Descargar PDF</button>
        <button class="btn gh" onclick="verTexto()">👁 Ver cómo queda</button>
        <div style="font-size:11.5px;color:var(--gris);text-align:center">Para guardarlo como presupuesto, pasá a <b>Cotización</b>.</div>
      </div>
      <div id="prev"></div>`;
    return;
  }
  const r=totales();
  t.innerHTML=`
    <div class="tr"><span>Neto (sin IVA)</span><b>${money(r.neto)}</b></div>
    ${r.iva>0?`<div class="tr"><span>IVA</span><b>${money(r.iva)}</b></div>`:`<div class="tr"><span>IVA</span><b>exento</b></div>`}
    <div class="tr big"><span>Total</span><span>${money(r.total)}</span></div>
    <div class="btns">
      <button class="btn wa" onclick="copiar('cot')">📋 Copiar para WhatsApp</button>
      <button class="btn pdf" onclick="abrirPdf()" title="Baja el presupuesto en PDF, con membrete de EyG, para mandar por mail">📄 Descargar PDF</button>
      ${btnGuardarHTML()}
      <button class="btn gh" onclick="copiar('detalle')">📋 Copiar con detalle (cant. × precio)</button>
      <button class="btn gh" onclick="verTexto()">👁 Ver cómo queda</button>
    </div>
    <div id="prev"></div>`;
}

/* El total SIEMPRE se calcula sobre el neto y se le suma el IVA que corresponde
   a cada producto (hay exentos y con 21% en el mismo pedido). El interruptor
   “con IVA” cambia cómo se MUESTRA el unitario, no cómo se calcula el total. */
function totales(){
  const ls=[];
  ST.items.forEach(it=>{
    const tr=tramoDe(it.id,it.cant); const base=tr?tr.p:ST.precios[it.id];
    if(base==null) return;
    ls.push({neto:base*it.cant, tasa:tasaDe(it)});
  });
  return EYG.totalesOdoo(ls);   // mismo redondeo que Odoo: el total da igual al del presupuesto
}
/* Subtotal de UN renglón como lo guarda Odoo: precio × cantidad, al centavo.
   Con “Mostrar con IVA”, el IVA del renglón también al centavo. */
function subDe(it){
  const tr=tramoDe(it.id, cantDe(it)); const base = tr? tr.p : ST.precios[it.id];
  if(base==null) return null;
  const neto=EYG.r2(base*it.cant);
  return ST.conIva ? EYG.r2(neto*(1+tasaDe(it))) : neto;
}

/* ---------------- texto para WhatsApp ---------------- */
function textoDe(tipo){
  if(!ST.items.length) return "";
  const l=ST.listas.find(x=>x.id===ST.lista);
  if(tipo==="precios"){
    let t=`*Droguería EyG · Precios*\n\n`;
    ST.items.forEach(it=>{
      const u=unitDe(it); t+=`• ${it.name} — ${u!=null?money(u):"a confirmar"}\n`;
      t+=vtoTexto(it,"   ")+escaleraTexto(it,"   ");
    });
    t+=`\n_Precios${ST.conIva?" con IVA":" sin IVA"} · sujetos a stock._`;
    return t;
  }
  const r=totales();
  let t=`*Droguería EyG · Cotización*\n\n`;
  ST.items.forEach(it=>{
    const u=unitDe(it); const sub=subDe(it);
    const dp=descAplicado(it);
    const marca = dp>0 ? ` (−${dp}%)` : "";   // que el cliente vea que le hicimos precio
    t += (tipo==="detalle")
      ? `• ${it.name}\n   ${nf(it.cant)} × ${u!=null?money(u):"—"}${marca} = ${sub!=null?money(sub):"—"}\n`
      : `• ${nf(it.cant)}× ${it.name} — ${sub!=null?money(sub):"—"}${marca}\n`;
    t += vtoTexto(it,"   ")+escaleraTexto(it,"   ");
  });
  t+=`\n———————————\n`;
  /* Si los renglones YA van con IVA, desglosar "Neto + IVA" abajo confunde: el
     cliente suma los renglones y no le da el neto. En ese caso va solo el total. */
  if(!ST.conIva){
    t+=`Neto: ${money(r.neto)}\n`;
    if(r.iva>0) t+=`IVA: ${money(r.iva)}\n`;
  }
  t+=`*TOTAL: ${money(r.total)}*\n`;
  t+=`\n_Sujeto a stock. Precios${ST.conIva?" con IVA incluido":(r.iva>0?" netos, se factura + IVA":" netos (productos exentos de IVA)")}._`;
  return t;
}
/* La escalera dentro del mensaje: sirve para EMPUJAR el pedido (“si llevás 9 te
   sale $600”). Va solo si el comercial lo pide, porque no siempre conviene
   mostrarle al cliente toda la grilla. */
/* Vencimiento en el mensaje. Va el del lote que sale primero (FEFO), que es el
   dato que pide la institución. El número de lote NO se manda: al despachar
   puede salir otro y no queremos prometer algo que después no se cumple. */
function vtoTexto(it, sangria){
  if(!ST.conVto) return "";
  const ls=lotesDe(it.id); if(!ls.length || !ls[0].exp) return "";
  return `${sangria}vto ${fmtVto(ls[0].exp)}\n`;
}
function escaleraTexto(it, sangria){
  if(!ST.conEscalera) return "";
  const t=ST.tiers[it.id]||[]; if(t.length<2) return "";
  const pu=x=> ST.conIva ? x.p*(1+tasaDe(it)) : x.p;
  return t.map(x=>{ const d=descPct(it.id,x);
    return `${sangria}desde ${nf(x.q)} u: ${money(pu(x))}${d>0?` (−${d}%)`:""}`; }).join("\n")+"\n";
}
async function copiar(tipo){
  const txt=textoDe(tipo);
  if(!txt){ toast("No hay nada para copiar"); return; }
  try{ await navigator.clipboard.writeText(txt); toast("✓ Copiado — pegalo en WhatsApp"); }
  catch(e){
    // Navegador sin permiso de portapapeles: mostramos el texto para copiar a mano.
    const p=document.getElementById("prev");
    if(p){ p.innerHTML=`<div class="prev" id="prevtxt">${esc(txt)}</div><div style="font-size:11.5px;color:var(--gris);margin-top:6px">No pude copiar solo: seleccioná el texto de arriba y copialo a mano.</div>`;
      const n=document.getElementById("prevtxt"); if(n){ const rg=document.createRange(); rg.selectNodeContents(n); const s=getSelection(); s.removeAllRanges(); s.addRange(rg); } }
    toast("Copiá el texto de abajo");
  }
}
function verTexto(){
  const p=document.getElementById("prev"); if(!p) return;
  const txt=textoDe(ST.modo==="precios"?"precios":"cot");
  p.innerHTML = txt? `<div class="prev">${esc(txt)}</div>` : "";
}

/* ============================================================
   PRESUPUESTO EN PDF  (pedido de los comerciales de Instituciones, 20/10/2026)
   ============================================================
   Las instituciones piden la cotización por MAIL y con membrete. El PDF se arma
   acá mismo, en el navegador (jsPDF): no toca Odoo, no crea ni numera nada.
   - Sin cliente va dirigido “A quien corresponda”: la mayoría de los pedidos
     llegan de Compras o Farmacia sin un contacto cargado.
   - Los importes son los de la pantalla y los de Odoo, AL CENTAVO: precio
     unitario neto, subtotal del renglón al centavo y el IVA por alícuota
     redondeado una vez (EYG.totalesOdoo). En “Cotización” el PDF SIEMPRE
     discrimina neto + IVA, como el presupuesto de Odoo, aunque la pantalla esté
     “con IVA”: así el total es el mismo que después se factura.
   - Las librerías se bajan recién al tocar el botón (no pesan en la carga). */
const PDF_LIBS=["https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
                "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"];
let _pdfLibs=null, _empresa=null;
function cargarLibsPdf(){
  if(_pdfLibs) return _pdfLibs;
  const una=src=>new Promise((ok,mal)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok;
    s.onerror=()=>mal(new Error("no se pudo bajar la librería de PDF (¿sin internet?)")); document.head.appendChild(s); });
  // En orden: autotable se engancha a jsPDF, que tiene que estar cargado antes.
  _pdfLibs=(async()=>{ for(const s of PDF_LIBS) await una(s); })().catch(e=>{ _pdfLibs=null; throw e; });
  return _pdfLibs;
}
/* Membrete: datos y logo de la empresa tal como están en Odoo (res.company). */
async function empresaPdf(){
  if(_empresa) return _empresa;
  const E={nombre:"Droguería EyG S.R.L.", cuit:"30716356988", iva:"IVA Responsable Inscripto",
           dir:"Av. San Martín 3035", ciudad:"Rosario, Santa Fe", logo:null};
  try{
    const [c]=await EYG.rpc("res.company","read",[[1],["name","vat","street","city","state_id","logo","l10n_ar_afip_responsibility_type_id"]],{context:ES});
    if(c){
      E.nombre=c.name||E.nombre; E.cuit=c.vat||E.cuit; E.dir=c.street||E.dir;
      if(c.city) E.ciudad=c.city+(c.state_id?", "+String(c.state_id[1]).replace(/\s*\(.*\)\s*$/,""):"");
      if(c.l10n_ar_afip_responsibility_type_id) E.iva=c.l10n_ar_afip_responsibility_type_id[1];
      if(c.logo) E.logo="data:image/png;base64,"+c.logo;
    }
  }catch(e){}
  return (_empresa=E);
}
const fmtCuit=c=>{ const d=String(c||"").replace(/\D/g,""); return d.length===11? d.slice(0,2)+"-"+d.slice(2,10)+"-"+d.slice(10) : String(c||""); };
/* Las fuentes estándar del PDF no traen guiones largos, comillas tipográficas ni
   emojis: se pasan a su equivalente simple para que no salgan como basura. */
const pt=s=>String(s==null?"":s).replace(/[−–—]/g,"-").replace(/[“”«»]/g,'"').replace(/[‘’]/g,"'")
  .replace(/…/g,"...").replace(/[^\x20-\x7E\xA0-\xFF\n]/g,"").replace(/[ \t]+\n/g,"\n").trim();
const pctTxt=t=>String(Math.round(t*10000)/100).replace(".",",")+"%";

function abrirPdf(){
  if(!ST.items.length) return toast("No hay nada para pasar a PDF");
  const p=ST.pdf||{};
  // Si la cotización ya se guardó como presupuesto de un cliente, se propone ese cliente.
  const dest = p.dest!=null ? p.dest : ((ST.guardado&&ST.guardado.cliente)||"");
  modal(`<h3>📄 ${ST.modo==="precios"?"Lista de precios":"Presupuesto"} en PDF</h3>
    <p>Se baja un PDF con el membrete de EyG, listo para adjuntar a un mail. Si no hay un cliente, va dirigido <b>“A quien corresponda”</b>.</p>
    <div class="pdff"><label for="pdfDest">Destinatario</label>
      <input id="pdfDest" placeholder="A quien corresponda" value="${esc(dest)}" autocomplete="off">
      <div class="pdfsug" id="pdfSug"></div>
      <span class="ay">Escribí el nombre de la institución o elegí un cliente de tu cartera. Vacío = “A quien corresponda”.</span></div>
    <div class="pdf2">
      <div class="pdff"><label for="pdfAt">Atención (opcional)</label><input id="pdfAt" placeholder="Ej: Servicio de Farmacia" value="${esc(p.at||"")}"></div>
      <div class="pdff"><label for="pdfRef">Referencia (opcional)</label><input id="pdfRef" placeholder="Ej: Pedido de cotización N° 123" value="${esc(p.ref||"")}"></div>
    </div>
    <div class="pdff"><label for="pdfVal">Mantenimiento de oferta, en días (opcional)</label>
      <input id="pdfVal" type="number" min="1" step="1" inputmode="numeric" placeholder="Vacío = no se menciona" value="${esc(p.val||"")}"></div>
    <div class="pdff"><label for="pdfObs">Observaciones (opcional)</label>
      <textarea id="pdfObs" rows="2" placeholder="Ej: plazo de entrega, forma de pago">${esc(p.obs||"")}</textarea></div>
    <div class="mb"><button class="btn gh" onclick="cerrarModal()">Cancelar</button>
      <button class="btn" id="pdfGo" onclick="descargarPdf()">📄 Descargar PDF</button></div>`);
  const i=document.getElementById("pdfDest");
  if(i){ i.oninput=()=>sugerirDest(i.value); i.focus(); i.select(); }
  if(USERID) cargarCartera();   // en segundo plano, para sugerir clientes mientras escribe
}
function sugerirDest(v){
  const el=document.getElementById("pdfSug"); if(!el) return;
  const q=(v||"").toLowerCase().trim();
  if(q.length<2 || !ST.cartera){ el.innerHTML=""; return; }
  ST._sug=ST.cartera.filter(c=>EYG.buscaOk(c,q) && (c.name||"").toLowerCase()!==q).slice(0,5);
  el.innerHTML=ST._sug.map((c,i)=>`<button type="button" onclick="elegirDest(${i})">${esc(c.name)}${c.city?` <span style="color:var(--gris)">· ${esc(c.city)}</span>`:""}</button>`).join("");
}
function elegirDest(i){
  const c=(ST._sug||[])[i], inp=document.getElementById("pdfDest");
  if(c && inp) inp.value=c.name||"";
  const el=document.getElementById("pdfSug"); if(el) el.innerHTML="";
}
async function descargarPdf(){
  const val=id=>((document.getElementById(id)||{}).value||"").trim();
  ST.pdf={dest:val("pdfDest"), at:val("pdfAt"), ref:val("pdfRef"), val:val("pdfVal"), obs:val("pdfObs")};
  guardar();
  const b=document.getElementById("pdfGo"); if(b){ b.disabled=true; b.textContent="Armando el PDF…"; }
  try{
    await cargarLibsPdf();
    const doc=armarPdf(await empresaPdf(), ST.pdf);
    doc.save(nombrePdf(ST.pdf));
    cerrarModal(); toast("✓ PDF descargado — adjuntalo al mail");
  }catch(e){
    if(b){ b.disabled=false; b.textContent="📄 Descargar PDF"; }
    toast("No pude armar el PDF: "+(e.message||e));
  }
}
function nombrePdf(o){
  const tipo = ST.modo==="precios" ? "Lista de precios" : "Presupuesto";
  const dest = (o.dest||"A quien corresponda").replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim().slice(0,60);
  return `${tipo} EyG - ${dest} - ${EYG.argToday()}.pdf`;
}

function armarPdf(E, o){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm", format:"a4", compress:true});   // comprimido: va adjunto a un mail
  const W=210, H=297, M=16, AN=W-2*M, PIE=20;
  const TEAL=[4,135,130], DEEP=[4,99,95], INK=[14,31,29], GRIS=[95,113,110], LINEA=[214,228,225];
  const precios = ST.modo==="precios";
  const hoy=EYG.argToday(), fecha=hoy.slice(8,10)+"/"+hoy.slice(5,7)+"/"+hoy.slice(0,4);
  const conIvaPdf = precios && ST.conIva;          // en “Cotización” el PDF va siempre neto + IVA
  let y=14;
  const salto=h=>{ if(y+h > H-PIE){ doc.addPage(); y=18; } };

  /* --- membrete --- */
  let alto=0;
  if(E.logo){ try{ const pr=doc.getImageProperties(E.logo); let h=17, w=h*pr.width/pr.height; if(w>58){ w=58; h=w*pr.height/pr.width; }
    doc.addImage(E.logo,"PNG",M,y,w,h,"logo","FAST"); alto=h; }catch(e){} }
  if(!alto){ doc.setFont("helvetica","bold"); doc.setFontSize(19); doc.setTextColor(...DEEP); doc.text(pt("Droguería EyG"),M,y+9); alto=11; }
  doc.setFont("helvetica","bold"); doc.setFontSize(17); doc.setTextColor(...TEAL);
  doc.text(precios?"LISTA DE PRECIOS":"PRESUPUESTO", W-M, y+6, {align:"right"});
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...GRIS);
  doc.text("Fecha: "+fecha, W-M, y+11.5, {align:"right"});
  if(COMERCIAL) doc.text(pt("Comercial: "+COMERCIAL), W-M, y+16, {align:"right"});
  if(PERFIL && PERFIL.email) doc.text(pt(PERFIL.email), W-M, y+20.5, {align:"right"});
  y += Math.max(alto, 21) + 4;
  doc.setFontSize(8.3); doc.setTextColor(...GRIS);
  doc.text(pt(`${E.nombre}  ·  CUIT ${fmtCuit(E.cuit)}  ·  ${E.iva}`), M, y);
  doc.text(pt(`${E.dir}  ·  ${E.ciudad}  ·  ventas@drogueriaeyg.com.ar`), M, y+4);
  y+=7.5; doc.setDrawColor(...TEAL); doc.setLineWidth(0.6); doc.line(M,y,W-M,y); y+=8;

  /* --- destinatario --- */
  const kv=(k,v)=>{ doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...INK); doc.text(k,M,y);
    doc.setFont("helvetica","normal"); const ls=doc.splitTextToSize(pt(v), AN-26); doc.text(ls,M+26,y); y+=ls.length*4.6+1.2; };
  kv("Señores:", o.dest||"A quien corresponda");
  if(o.at)  kv("Atención:", o.at);
  if(o.ref) kv("Referencia:", o.ref);
  y+=3;
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...INK);
  doc.text("De nuestra consideración:", M, y); y+=6;
  const intro = precios
    ? "Les hacemos llegar los precios vigentes de los productos que se detallan a continuación."
    : "Tenemos el agrado de hacerles llegar nuestra cotización por los productos que se detallan a continuación.";
  doc.text(doc.splitTextToSize(intro, AN), M, y, {maxWidth:AN, align:"justify"});
  y+=doc.splitTextToSize(intro, AN).length*4.8+3;

  /* --- renglones --- */
  const netoDe=x=>x.p, conIva=(x,it)=>x.p*(1+tasaDe(it));
  const ivaCol=it=>{ const v=ivaDe(it.taxes_id); if(!v) return "-";
    const p=v.label.replace(/^IVA\s*/,""); return v.incluido ? p+" incl." : (v.exento ? "Exento" : p); };
  const extra=(it, unitario)=>{
    let s="";
    if(ST.conVto){ const ls=lotesDe(it.id); if(ls.length && ls[0].exp) s+="\nVto. "+fmtVto(ls[0].exp); }
    if(ST.conEscalera){ const t=ST.tiers[it.id]||[];
      if(t.length>=2) s+="\nPor volumen: "+t.map(x=>"desde "+nf(x.q)+" u "+money(unitario(x,it))).join("  ·  "); }
    return s;
  };
  let sinPrecio=0, head, body, cols;
  if(precios){
    head=[["#","Código","Producto","IVA", conIvaPdf?"Precio c/IVA":"Precio neto"]];
    body=ST.items.map((it,i)=>{ const tr=tramoDe(it.id,1); const base=tr?tr.p:ST.precios[it.id];
      if(base==null) sinPrecio++;
      const u = base==null ? null : (conIvaPdf ? base*(1+tasaDe(it)) : base);
      return [i+1, it.code||"", pt(it.name+extra(it, conIvaPdf?conIva:netoDe)), ivaCol(it), u==null?"a confirmar":money(u)]; });
    cols={0:{halign:"center",cellWidth:8},1:{cellWidth:20},3:{halign:"center",cellWidth:18},4:{halign:"right",cellWidth:30}};
  }else{
    head=[["#","Código","Producto","Cant.","Precio unit.","IVA","Subtotal"]];
    body=ST.items.map((it,i)=>{ const tr=tramoDe(it.id,it.cant); const base=tr?tr.p:ST.precios[it.id];
      if(base==null) sinPrecio++;
      return [i+1, it.code||"", pt(it.name+extra(it, netoDe)), nf(it.cant),
        base==null?"a confirmar":money(base), ivaCol(it), base==null?"-":money(EYG.r2(base*it.cant))]; });
    cols={0:{halign:"center",cellWidth:8},1:{cellWidth:18},3:{halign:"right",cellWidth:13},4:{halign:"right",cellWidth:25},5:{halign:"center",cellWidth:16},6:{halign:"right",cellWidth:27}};
  }
  doc.autoTable({ startY:y, head, body, margin:{left:M,right:M,bottom:PIE+2,top:18},
    styles:{font:"helvetica", fontSize:8.6, cellPadding:2.1, textColor:INK, lineColor:LINEA, lineWidth:0.1, valign:"top", overflow:"linebreak"},
    headStyles:{fillColor:TEAL, textColor:255, fontStyle:"bold", fontSize:8.2},
    alternateRowStyles:{fillColor:[244,249,248]},
    columnStyles:cols });
  y=doc.lastAutoTable.finalY+5;

  /* --- totales (igual que Odoo) --- */
  if(!precios){
    const r=totales();
    const filas=[["Subtotal neto", money(r.neto)]];
    r.ivas.forEach(x=>filas.push(["IVA "+pctTxt(x.tasa), money(x.iva)]));
    if(!r.ivas.length) filas.push(["IVA", "Exento"]);
    salto(filas.length*6+12);
    const x0=W-M-78;
    doc.setFontSize(9.5);
    filas.forEach(([k,v])=>{ doc.setFont("helvetica","normal"); doc.setTextColor(...GRIS); doc.text(k,x0+3,y+4);
      doc.setTextColor(...INK); doc.text(v,W-M-3,y+4,{align:"right"}); y+=6; });
    doc.setFillColor(...TEAL); doc.rect(x0,y,78,9,"F");
    doc.setFont("helvetica","bold"); doc.setFontSize(11.5); doc.setTextColor(255,255,255);
    doc.text("TOTAL",x0+3,y+6.2); doc.text(money(r.total),W-M-3,y+6.2,{align:"right"});
    y+=15;
  }

  /* --- condiciones y cierre (texto justificado) --- */
  const parrafo=(txt, tam, color)=>{ doc.setFont("helvetica","normal"); doc.setFontSize(tam); doc.setTextColor(...color);
    const ls=doc.splitTextToSize(pt(txt), AN); salto(ls.length*tam*0.42+3);
    doc.text(ls, M, y, {maxWidth:AN, align:"justify"}); y+=ls.length*tam*0.42+2.5; };
  let cond = precios
    ? `Precios expresados en pesos argentinos, ${conIvaPdf?"con IVA incluido":"netos (sin IVA)"}, por unidad.`
    : "Precios unitarios expresados en pesos argentinos, netos de IVA; el IVA se discrimina en el total.";
  cond += " Sujetos a disponibilidad de stock al momento de la confirmación del pedido.";
  const dias=parseInt(o.val,10);
  if(dias>0) cond += ` Mantenimiento de oferta: ${dias} día${dias===1?"":"s"} a partir de la fecha de emisión.`;
  if(sinPrecio) cond += ` Los productos indicados "a confirmar" no tienen precio en la lista vigente.`;
  parrafo(cond, 8.6, GRIS);
  if(o.obs) parrafo("Observaciones: "+o.obs, 9, INK);
  y+=3;
  parrafo("Quedamos a su disposición ante cualquier consulta. Saludamos a ustedes muy atentamente.", 10, INK);
  salto(16); y+=5;
  doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...INK);
  doc.text(pt(COMERCIAL||"Droguería EyG"), M, y);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...GRIS);
  doc.text(pt([E.nombre, PERFIL&&PERFIL.email].filter(Boolean).join("  ·  ")), M, y+4.5);

  /* --- pie de página en todas las hojas --- */
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i);
    doc.setDrawColor(...LINEA); doc.setLineWidth(0.3); doc.line(M,H-14,W-M,H-14);
    doc.setFont("helvetica","normal"); doc.setFontSize(7.8); doc.setTextColor(...GRIS);
    doc.text(pt("Droguería EyG  ·  El respaldo detrás de la salud"), M, H-9.5);
    doc.text(`Página ${i} de ${n}`, W-M, H-9.5, {align:"right"});
  }
  return doc;
}
/* ============================================================
   GUARDAR COMO PRESUPUESTO  (cotización → borrador en Odoo → venta)
   ============================================================
   El Cotizador no toca Odoo, y eso está bien mientras sea una consulta suelta.
   El problema aparecía cuando el cliente ACEPTABA: el comercial tenía que
   volver a cargar producto por producto en “Cargar venta”. Acá se corta eso.

   Qué hace: guarda la cotización como PRESUPUESTO (borrador de Odoo) a nombre
   de un cliente. Desde ahí sigue el circuito de siempre — se retoma en
   “Cargar venta”, se confirma (o se marca proforma) o se descarta.

   Reglas que respeta:
   - El presupuesto SIEMPRE queda a nombre de un cliente y con el comercial
     como vendedor: por eso le aparece en SU lista de “Presupuestos en curso”.
   - **El precio lo pone Odoo, no nosotros.** Escribimos producto y cantidad; el
     precio lo calcula la tarifa del pedido. Después comparamos contra lo
     cotizado y mostramos renglón por renglón lo que quedó distinto. Pisar el
     precio a mano taparía el problema en vez de mostrarlo.
   - Acá NO se confirma nada. Confirmar exige chequear stock comprometido y
     plazo de pago, y eso ya vive en “Cargar venta”.
   ============================================================ */
const PPAL_TAG="[ENTREGA-PPAL]";   // misma marca que usa “Cargar venta” para la entrega principal
const esJefe=()=>["lider","direccion","admin"].includes((PERFIL||{}).rol);
/* Huella de la cotización: si cambia después de guardar, el cartel lo avisa
   (si no, el comercial creería que el presupuesto de Odoo tiene lo que ve acá). */
function firma(){ return "L"+ST.lista+":"+ST.items.map(it=>it.id+"x"+(it.cant||1)).sort().join(","); }

function modal(html){
  let h=document.getElementById("modalHost");
  if(!h){ h=document.createElement("div"); h.id="modalHost"; document.body.appendChild(h); }
  h.innerHTML=`<div class="scrim" onclick="if(event.target===this)cerrarModal()"><div class="modal">${html}</div></div>`;
}
function cerrarModal(){ const h=document.getElementById("modalHost"); if(h) h.innerHTML=""; }
function cargandoModal(txt){ modal(`<div class="spin"></div><p style="text-align:center;margin:0">${esc(txt)}</p>`); }

/* ---------------- botón y cartel ---------------- */
function btnGuardarHTML(){
  const g=ST.guardado;
  if(g && g.firma===firma()) return `<button class="btn gh" onclick="vistaGuardado()" title="Ya la guardaste como el presupuesto ${esc(g.name)}">💾 Ver el presupuesto guardado</button>`;
  return `<button class="btn" onclick="abrirGuardar()" title="Guarda esta cotización en Odoo como presupuesto, a nombre de un cliente. No es una venta: se confirma o se descarta desde Cargar venta.">💾 Guardar como presupuesto</button>`;
}
function bannerHTML(){
  const g=ST.guardado; if(!g) return "";
  const cambio = g.firma!==firma();
  const d=(g.dif||[]).length;
  return `<div class="banner ${cambio?"viejo":""}">
    <span>${cambio?"⚠️":"💾"} Guardada como presupuesto <b>${esc(g.name)}</b> para <b>${esc(g.cliente)}</b>${d?` · <b>${d} renglón${d===1?"":"es"} a otro precio</b>`:""}${cambio?" · <b>la cotización cambió después de guardarla</b>: el presupuesto de Odoo quedó como estaba":""}</span>
    <span class="sp">
      <button class="chip" onclick="vistaGuardado()">Ver detalle</button>
      <button class="chip on" onclick="seguirVenta()">🛒 Seguir con la venta</button>
      <button class="chip" onclick="pedirDescartar()">🗑 Descartar</button>
    </span></div>`;
}

/* ---------------- paso 1: el cliente ---------------- */
async function abrirGuardar(){
  if(!ST.items.length) return toast("No hay nada para guardar");
  if(ST.modo==="precios") return toast("Pasá a “Cotización” para guardarlo: el presupuesto necesita cantidades");
  if(!USERID) return modal(`<h3>No puedo guardar el presupuesto</h3>
    <p>No encontré tu usuario de Odoo (<b>${esc(COMERCIAL)}</b>). El presupuesto no quedaría a tu nombre ni te aparecería en “Cargar venta”, así que mejor no crearlo. Avisale a Diego.</p>
    <div class="mb"><button class="btn gh" onclick="cerrarModal()">Cerrar</button></div>`);
  cargandoModal("Buscando tus clientes…");
  await cargarCartera();
  ST.qCli=""; ST.fuera=[]; ST._fueraQ=null;
  pickerCliente();
}
async function cargarCartera(){
  if(ST.cartera) return ST.cartera;
  try{
    // Misma cartera que “Cargar venta”: sólo CLIENTES FISCALES (parent_id=false),
    // los que se facturan. Las sucursales de entrega se resuelven solas al crear.
    const r=await EYG.rpc("res.partner","search_read",[[["user_id","=",USERID],["parent_id","=",false]]],
      {fields:["id","name","property_product_pricelist","property_payment_term_id","city","vat",EYG.FANT],limit:0,context:ES});
    ST.cartera=(r||[]).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  }catch(e){ ST.cartera=[]; }
  return ST.cartera;
}
function pickerCliente(){
  const g=ST.guardado;
  const aviso = (g && g.firma!==firma())
    ? `<p style="background:#FEF6EC;border:1px solid #EAD6A6;border-radius:9px;padding:9px 11px;color:#7A5A16"><b>Ojo:</b> ya guardaste ${esc(g.name)} con una versión anterior. Esto crea <b>otro</b> presupuesto; el anterior sigue en Odoo hasta que lo descartes.</p>` : "";
  modal(`<h3>¿A nombre de qué cliente?</h3>
    <p>El presupuesto queda en Odoo a nombre de este cliente y con vos como vendedor — por eso hace falta elegirlo. <b>No es una venta todavía</b>: se confirma o se descarta después, desde Cargar venta.</p>
    ${aviso}
    <div class="search">🔎 <input id="qcli" placeholder="Nombre o CUIT del cliente…" value="${esc(ST.qCli)}"></div>
    <div class="clilist" id="clilist"></div>
    <div class="mb"><button class="btn gh" onclick="cerrarModal()">Cancelar</button></div>`);
  const i=document.getElementById("qcli");
  if(i){ i.oninput=e=>buscarCli(e.target.value); i.focus(); }
  pintarCli();
}
const buscarCli = EYG.buscador(v=>{ ST.qCli=v; pintarCli(); }, 200);
function cliRowHTML(c, fuera){
  const lst=c.property_product_pricelist?c.property_product_pricelist[1]:"";
  const duenio=(fuera && c.user_id)?("de "+c.user_id[1]):"";
  const sub=[c.city, lst, duenio].filter(Boolean).join(" · ");
  const ini=(c.name||"?").trim().split(/\s+/).slice(0,2).map(p=>p[0]||"").join("");
  return `<div class="clirow" onclick="elegirCli(${c.id})">
    <div class="av">${esc(ini.toUpperCase())}</div>
    <div><div class="nm">${esc(c.name||"")}</div>${sub?`<div class="sub">${esc(sub)}</div>`:""}</div>
  </div>`;
}
function pintarCli(){
  const el=document.getElementById("clilist"); if(!el) return;
  const q=(ST.qCli||"").toLowerCase().trim();
  let arr=(ST.cartera||[]);
  if(q) arr=arr.filter(c=>EYG.buscaOk(c,q));
  arr=arr.slice(0,60);
  const ids=new Set(arr.map(c=>c.id));
  const fuera=(ST.fuera||[]).filter(c=>!ids.has(c.id)).slice(0,20);
  let html=arr.map(c=>cliRowHTML(c,false)).join("");
  if(fuera.length) html+=`<div class="clisep">Fuera de tu cartera</div>`+fuera.map(c=>cliRowHTML(c,true)).join("");
  if(!html) html=`<div class="vacio">${q?"Sin resultados en tu cartera.":"Escribí el nombre del cliente."}</div>`;
  el.innerHTML=html;
  // Los jefes cotizan para clientes de cualquier cartera: si en la suya no hay
  // nada, buscamos en todo Odoo. Los comerciales quedan acotados a su cartera,
  // igual que en “Cargar venta”.
  if(esJefe() && q.length>=3 && !arr.length) buscarFuera(q);
}
async function buscarFuera(q){
  if(ST._fueraQ===q) return; ST._fueraQ=q;
  try{
    const r=await EYG.rpc("res.partner","search_read",
      [[["parent_id","=",false],["customer_rank",">",0]].concat(EYG.domBusca(q))],
      {fields:["id","name","property_product_pricelist","property_payment_term_id","city","vat","user_id"],limit:20,context:ES});
    if(ST._fueraQ!==q) return;
    ST.fuera=r||[]; pintarCli();
  }catch(e){}
}

/* ---------------- paso 2: con qué lista ----------------
   La cotización se armó con UNA lista; el cliente puede tener fijada otra. No
   lo decidimos por él: el precio que le prometió al cliente es el que cotizó,
   pero la lista del cliente es la que Odoo usa al facturar. */
function elegirCli(pid){
  const c=((ST.cartera||[]).concat(ST.fuera||[])).find(x=>x.id===pid); if(!c) return;
  const plCli=c.property_product_pricelist?c.property_product_pricelist[0]:null;
  const plCliName=c.property_product_pricelist?c.property_product_pricelist[1]:"";
  const lCot=(ST.listas||[]).find(x=>x.id===ST.lista);
  if(plCli && ST.lista && plCli!==ST.lista){
    modal(`<h3>Este cliente tiene otra lista</h3>
      <p>Cotizaste con <b>${esc(lCot?lCot.name:"—")}</b> y <b>${esc(c.name)}</b> tiene fijada <b>${esc(plCliName)}</b>.
      Los precios del presupuesto los calcula Odoo con la lista que elijas, así que esto cambia lo que le vas a cobrar.</p>
      <div class="mb col">
        <button class="btn" onclick="crearPresupuesto(${pid},${ST.lista})">🏷️ Con la que cotizaste · ${esc(lCot?lCot.name:"")}</button>
        <button class="btn gh" onclick="crearPresupuesto(${pid},${plCli})">🏷️ Con la del cliente · ${esc(plCliName)}</button>
        <button class="btn gh" onclick="pickerCliente()">← Elegir otro cliente</button>
      </div>`);
    return;
  }
  crearPresupuesto(pid, ST.lista||plCli||null);
}

/* ---------------- crear el presupuesto en Odoo ---------------- */
async function crearPresupuesto(pid, plId){
  const c=((ST.cartera||[]).concat(ST.fuera||[])).find(x=>x.id===pid); if(!c) return;
  cargandoModal("Creando el presupuesto en Odoo…");
  try{
    const ship=await entregaDe(pid);
    // El conector entra como Diego: sin estos contextos el comercial recibe la
    // notificación “Diego te asignó un pedido” y queda el log de creación.
    const CREAR={...ES, mail_auto_subscribe_no_notify:true, mail_create_nolog:true};
    const vals={partner_id:pid, user_id:USERID, origin:"Core · cotizador"};
    if(ship) vals.partner_shipping_id=ship.id;
    const id=await EYG.rpc("sale.order","create",[vals],{context:CREAR});
    // La lista va ANTES que las líneas: Odoo cotiza cada renglón con la tarifa
    // que el pedido tenga EN ESE MOMENTO.
    const [o]=await EYG.rpc("sale.order","read",[[id]],{fields:["id","name","pricelist_id"],context:ES});
    if(plId && (!o.pricelist_id || o.pricelist_id[0]!==plId)){
      await EYG.rpc("sale.order","write",[[id],{pricelist_id:plId}],{context:ES});
    }
    const cmds=ST.items.map(it=>[0,0,{product_id:it.id, product_uom_qty:Math.max(1, it.cant||1)}]);
    await EYG.rpc("sale.order","write",[[id],{order_line:cmds}],{context:ES});
    const [o2]=await EYG.rpc("sale.order","read",[[id]],
      {fields:["id","name","amount_untaxed","amount_total","order_line","pricelist_id"],context:ES});
    let lineas=[];
    if((o2.order_line||[]).length) lineas=await EYG.rpc("sale.order.line","read",[o2.order_line],
      {fields:["id","product_id","product_uom_qty","price_unit","discount","price_subtotal"],context:ES});
    ST.guardado={ id, name:o2.name||("#"+id), cliente:c.name||"", clienteId:pid,
      lista:(o2.pricelist_id&&o2.pricelist_id[1])||"", neto:o2.amount_untaxed||0, total:o2.amount_total||0,
      items:ST.items.length, enOdoo:(lineas||[]).length, dif:compararPrecios(lineas), firma:firma() };
    guardar(); render();
    vistaGuardado();
  }catch(e){
    modal(`<h3>No pude guardar el presupuesto</h3>
      <p>Odoo lo rechazó con este motivo:</p>
      <div class="errbox">${esc(e.message||String(e))}</div>
      <p style="margin-top:10px">La cotización no se perdió: sigue acá igual. Probá de nuevo y, si se repite, pasale este texto a Diego.</p>
      <div class="mb"><button class="btn gh" onclick="cerrarModal()">Cerrar</button></div>`);
  }
}

/* Dirección de entrega, con el mismo criterio que “Cargar venta”: una sola
   sucursal entra sola; con varias manda la marcada como principal. Si hay
   varias y ninguna principal no adivinamos — se elige al retomar la venta. */
async function entregaDe(pid){
  try{
    const dels=await EYG.rpc("res.partner","search_read",[[["parent_id","=",pid],["type","=","delivery"]]],
      {fields:["id","name"],order:"name",context:ES});
    if(!dels||!dels.length) return null;
    if(dels.length===1) return dels[0];
    let msgs=[];
    try{ msgs=await EYG.rpc("mail.message","search_read",
      [[["model","=","res.partner"],["res_id","in",dels.map(d=>d.id)],["body","like",PPAL_TAG]]],
      {fields:["res_id","body","date"],limit:0}); }catch(e){}
    const st={}, seen=new Set();
    (msgs||[]).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    for(const m of (msgs||[])){ if(seen.has(m.res_id)) continue; seen.add(m.res_id);
      const out=/salir/i.test((m.body||"").replace(/<[^>]+>/g," ")); st[m.res_id]={in:!out, date:m.date||""}; }
    let ppal=null, best="";
    for(const rid in st){ if(st[rid].in && st[rid].date>best){ best=st[rid].date; ppal=+rid; } }
    return ppal ? (dels.find(d=>d.id===ppal)||null) : null;
  }catch(e){ return null; }
}

/* Lo cotizado vs lo que puso Odoo, renglón por renglón, AL CENTAVO: cualquier
   diferencia se muestra (antes se toleraban $1 y 0,5%, y eso escondía
   diferencias de centavos que el cliente sí ve en la factura). Lo que suele aparecer acá son los éticos: su precio en la
   tarifa es un PORCENTAJE, no un importe fijo, y el cotizador muestra el PVP
   como referencia — el precio bueno es el de Odoo. */
function compararPrecios(lineas){
  const out=[];
  (lineas||[]).forEach(l=>{
    const pid=l.product_id&&l.product_id[0]; if(!pid) return;
    const it=ST.items.find(x=>x.id===pid); if(!it) return;
    const tr=tramoDe(pid, it.cant); const cot = tr? tr.p : ST.precios[pid];
    const odoo=(l.price_unit||0)*(1-((l.discount||0)/100));
    if(cot==null){ out.push({name:it.name, cot:null, odoo, dif:null}); return; }
    const d=odoo-cot;
    if(Math.abs(d)>=0.005) out.push({name:it.name, cot, odoo, dif:d});
  });
  return out;
}

/* ---------------- qué hacer con el presupuesto guardado ---------------- */
function vistaGuardado(){
  const g=ST.guardado; if(!g) return;
  const dif=g.dif||[];
  const faltan=(g.items||0)-(g.enOdoo||0);
  const tabla = dif.length
    ? `<p><b>Ojo:</b> ${dif.length} de ${g.items} renglones quedaron a otro precio del que cotizaste. En el presupuesto manda <b>el precio de Odoo</b>: revisalo antes de confirmar la venta.</p>
       <table class="cmp"><tr><th>Producto</th><th style="text-align:right">Cotizado</th><th style="text-align:right">En Odoo</th></tr>
       ${dif.map(d=>`<tr class="dif"><td>${esc(d.name)}</td><td class="n">${d.cot!=null?money(d.cot):"—"}</td>
         <td class="n">${money(d.odoo)}${d.dif!=null?`<span class="dt">${d.dif>0?"+":"−"}${money(Math.abs(d.dif))}</span>`:""}</td></tr>`).join("")}
       </table>`
    : `<p style="color:var(--ok);font-weight:700">✓ Los precios quedaron iguales a los que cotizaste.</p>`;
  modal(`<h3>✅ Presupuesto guardado</h3>
    <p><b>${esc(g.name)}</b> · ${esc(g.cliente)}${g.lista?" · "+esc(g.lista):""}<br>
      Neto ${money(g.neto)} · Total ${money(g.total)} · ${g.enOdoo} producto${g.enOdoo===1?"":"s"}${faltan>0?` <b style="color:var(--bad)">(${faltan} no entraron)</b>`:""}</p>
    ${tabla}
    <p>Quedó en Odoo como <b>presupuesto</b>, a tu nombre — todavía no es una venta. Seguí desde <b>Cargar venta</b>: ahí cambiás cantidades, elegís el plazo de pago, adjuntás la orden de compra y lo confirmás (o lo marcás proforma).</p>
    <div class="mb col">
      <button class="btn" onclick="seguirVenta()">🛒 Seguir con la venta</button>
      <button class="btn gh" onclick="cerrarModal()">Seguir cotizando</button>
      <button class="btn gh" onclick="pedirDescartar()">🗑 Descartar el presupuesto</button>
    </div>`);
}
function seguirVenta(){
  const g=ST.guardado; if(!g) return;
  const c=(PERFIL && PERFIL.rol!=="comercial" && COMERCIAL) ? ("&c="+encodeURIComponent(COMERCIAL)) : "";
  location.href="vender.html?reanudar="+g.id+c;
}
function pedirDescartar(){
  const g=ST.guardado; if(!g) return;
  modal(`<h3>Descartar el presupuesto</h3>
    <p>Se elimina de Odoo el presupuesto <b>${esc(g.name)}</b> de <b>${esc(g.cliente)}</b>. No se puede deshacer.
    La cotización que tenés armada acá <b>no se toca</b>: podés seguir usándola o guardarla de nuevo.</p>
    <div class="mb"><button class="btn gh" onclick="vistaGuardado()">No, volver</button>
      <button class="btn red" onclick="doDescartar()">Sí, descartar</button></div>`);
}
async function doDescartar(){
  const g=ST.guardado; if(!g) return;
  cargandoModal("Descartando…");
  const err=await borrarPresupuesto(g.id);
  if(err){ dialogoNoBorra(err); return; }
  ST.guardado=null; guardar(); cerrarModal(); render(); toast("Presupuesto descartado");
}
/* Igual que en “Cargar venta”: Odoo no deja borrar una cotización “enviada”
   sin cancelarla antes, y su action_cancel por RPC devuelve un asistente.
   Devuelve null si borró, o el motivo real del error. */
async function borrarPresupuesto(id){
  const detalle = e => (e && e.message) ? e.message : String(e);
  try{ await EYG.rpc("sale.order","unlink",[[id]]); return null; }
  catch(e1){
    try{
      await EYG.rpc("sale.order","write",[[id],{state:"cancel"}]);
      await EYG.rpc("sale.order","unlink",[[id]]);
      return null;
    }catch(e2){
      try{
        await EYG.rpc("sale.order","action_cancel",[[id]],{context:{disable_cancel_warning:true}});
        await EYG.rpc("sale.order","unlink",[[id]]);
        return null;
      }catch(e3){ return detalle(e3); }
    }
  }
}
function dialogoNoBorra(msg){
  modal(`<h3>No se pudo descartar</h3>
    <p>Odoo lo rechazó con este motivo:</p>
    <div class="errbox">${esc(msg)}</div>
    <p style="margin-top:10px">Si tenés esta pantalla abierta hace rato puede estar corriendo una versión vieja: recargá y probá otra vez. Si sigue igual, el presupuesto se puede eliminar desde <b>Cargar venta</b>.</p>
    <div class="mb"><button class="btn gh" onclick="vistaGuardado()">Volver</button>
      <button class="btn" onclick="location.reload()">🔄 Recargar</button></div>`);
}
</script>
