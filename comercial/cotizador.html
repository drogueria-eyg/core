<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotizador · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<style>
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--teal-deep);font-weight:800;margin:22px 0 12px;display:flex;align-items:center;gap:9px}
  h2.sec:before{content:"";width:5px;height:16px;background:var(--teal);border-radius:3px}
  .cot{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
  @media(max-width:1000px){ .cot{grid-template-columns:1fr} }

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .pad{padding:16px}
  .nota{background:#EEF6F5;border:1px solid #BFE0DC;border-left:4px solid var(--teal);border-radius:10px;padding:11px 14px;font-size:13px;color:#245C57;margin-bottom:14px}
  .nota b{color:var(--teal-deep)}

  /* ---- barra de controles: lista de precios + modo ---- */
  .ctrl{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:14px}
  .fld{display:flex;flex-direction:column;gap:6px;min-width:0}
  .fld .lb{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--gris);font-weight:800}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{font-size:12.5px;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;color:var(--gris);font-family:inherit}
  .chip:hover{border-color:var(--teal)}
  .chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{font-family:inherit;font-size:12.5px;font-weight:700;padding:8px 14px;border:0;background:var(--surface);color:var(--gris);cursor:pointer}
  .seg button.on{background:var(--teal);color:#fff}
  .swi{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--gris);cursor:pointer;user-select:none}
  .swi input{width:16px;height:16px;accent-color:var(--teal);cursor:pointer}

  /* ---- buscador ---- */
  .search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
  .search:focus-within{border-color:var(--teal)}
  .search input{border:0;background:none;outline:none;font-family:inherit;font-size:15px;width:100%;color:var(--ink)}
  .res{margin-top:10px;max-height:460px;overflow:auto}
  .row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;background:var(--surface)}
  .row:hover{border-color:var(--teal)}
  .row .nm{flex:1;min-width:0}
  .row .nm b{font-size:13.5px;display:block;line-height:1.25;overflow-wrap:anywhere}
  .row .nm span{font-size:11.5px;color:var(--gris)}
  .row .pr{text-align:right;flex:none;white-space:nowrap}
  .row .pr b{font-size:15px;color:var(--teal-deep);font-weight:800}
  .row .pr span{display:block;font-size:10.5px;color:var(--gris)}
  .add{font-family:inherit;font-size:13px;font-weight:800;border:0;border-radius:9px;padding:9px 14px;background:var(--teal);color:#fff;cursor:pointer;flex:none}
  .add:hover{filter:brightness(1.06)}
  .add.qui{background:#EEF2F1;color:var(--gris)}
  .vacio{text-align:center;color:var(--gris);padding:34px 10px;font-size:13.5px}

  /* ---- items de la cotización ---- */
  .it{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
  .it:last-child{border-bottom:0}
  .it .nm{flex:1;min-width:0}
  .it .nm b{font-size:13px;font-weight:700;line-height:1.25;display:block;overflow-wrap:anywhere}
  .it .r{margin-left:auto;text-align:right;flex:none}
  .it .u{font-size:11px;color:var(--gris);white-space:nowrap}
  .it .sub{font-weight:800;font-size:15px;color:var(--teal-deep);margin-top:1px}
  .iva{display:inline-block;font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;line-height:1.3;white-space:nowrap;margin-bottom:3px}
  .iva.ex{background:#EAF1F0;color:#4A6B68;border:1px solid #D3E2E0}
  .iva.si{background:#FBF0DA;color:#8A6A1F;border:1px solid #EAD6A6}
  /* flex-wrap: si no entra el cartelito de la escalera, baja a otro renglón en
     vez de aplastarse (el panel es angosto). */
  .step{display:inline-flex;align-items:center;gap:5px;margin-top:7px;flex-wrap:wrap}
  .step button{font-family:inherit;width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:16px;font-weight:800;color:var(--teal-deep);cursor:pointer;line-height:1}
  .step button:hover{border-color:var(--teal)}
  .step input{width:62px;height:30px;border:1px solid var(--line);border-radius:8px;text-align:center;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink)}
  .step .del{color:var(--bad);font-size:14px}
  .nextd{display:inline-block;background:var(--okbg);color:var(--ok);font-size:11px;font-weight:800;border-radius:7px;padding:3px 8px;margin-top:6px;line-height:1.25}
  /* Escalera por cantidad. Ocupa lo mínimo: al lado de la cantidad va sólo un
     cartelito ("−21%" o "hasta −21%"). La grilla completa se abre en un globo
     sólo si el comercial la pide, y se cierra al elegir un tramo. */
  /* flex:0 0 auto en los dos: dentro de un flex angosto, sin esto el navegador
     los encoge y el texto se parte aunque tengan white-space:nowrap. */
  .escbtn{flex:0 0 auto;font-family:inherit;font-size:10.5px;font-weight:800;border:1px solid #CFE7DF;background:var(--okbg);color:var(--ok);border-radius:7px;padding:0 9px;height:30px;cursor:pointer;line-height:1;white-space:nowrap;margin-left:2px}
  /* OJO: .step button fija width:30px (los −/+/🗑 son cuadrados). El cartelito
     vive adentro de .step, así que hay que devolverle el ancho automático. */
  .step .escwrap .escbtn{width:auto;min-width:0}
  .escbtn:hover{filter:brightness(.97)}
  .escbtn.plano{background:var(--surface);border-color:var(--line);color:var(--gris)}
  .escwrap{flex:0 0 auto;position:relative;display:inline-block}
  .pop{position:absolute;z-index:40;top:calc(100% + 6px);right:0;min-width:196px;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:0 12px 30px rgba(6,65,62,.18);padding:7px;animation:pin .12s ease-out}
  @keyframes pin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .pop .ph{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:800;padding:3px 7px 6px}
  .pop .pl{display:flex;align-items:center;gap:8px;width:100%;font-family:inherit;font-size:12px;border:0;background:none;border-radius:7px;padding:6px 7px;cursor:pointer;text-align:left;color:var(--ink)}
  .pop .pl:hover{background:#F2F9F8}
  .pop .pl.on{background:var(--teal);color:#fff}
  .pop .pl .q{flex:1;white-space:nowrap;font-weight:700}
  .pop .pl .p{font-weight:800;white-space:nowrap}
  .pop .pl .d{font-size:10.5px;font-weight:800;color:var(--ok);white-space:nowrap}
  .pop .pl.on .d{color:#CFF3E2}
  .descb{display:inline-block;background:var(--okbg);color:var(--ok);font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;line-height:1.3;margin-bottom:3px;white-space:nowrap}
  .escmini{font-size:11px;color:var(--ok);font-weight:700;margin-top:3px;line-height:1.35}

  .tot{padding:14px 16px;border-top:2px solid var(--line);background:#FAFDFC;border-radius:0 0 14px 14px}
  .tr{display:flex;justify-content:space-between;font-size:13px;color:var(--gris);padding:3px 0}
  .tr b{color:var(--ink);font-weight:700}
  .tr.big{font-size:19px;font-weight:800;color:var(--teal-deep);border-top:1px solid var(--line);margin-top:7px;padding-top:9px}
  .tr.big span:last-child{font-weight:800}
  .btns{display:flex;flex-direction:column;gap:8px;margin-top:13px}
  .btn{font-family:inherit;font-size:14px;font-weight:800;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:var(--teal);color:#fff}
  .btn:hover{filter:brightness(1.06)}
  .btn.wa{background:var(--wa,#25D366)}
  .btn.gh{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  .btn.gh:hover{border-color:var(--teal)}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none}

  .prev{margin-top:12px;background:#F7FBFA;border:1px dashed var(--line);border-radius:10px;padding:12px 13px;font-size:12px;line-height:1.55;white-space:pre-wrap;color:var(--gris);max-height:230px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .spin{width:30px;height:30px;border:4px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite;margin:34px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=56"></script>
<script>
/* ============================================================
   COTIZADOR — precios sueltos y cotizaciones, SIN cliente
   ============================================================
   Para qué existe: hasta ahora, para decirle un precio a alguien había que
   crear un presupuesto en Odoo eligiendo cliente. Para la mayoría de las
   consultas (“¿cuánto sale la jeringa?”, “pasame precio de estos 5”) eso es
   burocracia pura y ensucia Odoo con borradores que nadie confirma.

   Este módulo NO toca Odoo: solo LEE precios. No crea presupuestos, no crea
   clientes, no reserva stock. Se arma, se copia y se manda por WhatsApp.

   El precio sale del MISMO motor que “Cargar venta”: los ítems de la tarifa
   de Odoo (product.pricelist.item), con la escalera por cantidad de Farmacias
   y el precio único por variante de los otros tiers. Si el precio cambia en
   Odoo, acá cambia solo.
   ============================================================ */
const esc=EYG.esc, money=EYG.money;
const ES={lang:"es_AR"};
const nf=n=>Math.round(n||0).toLocaleString("es-AR");
function toast(m){ let t=document.getElementById("toast"); if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);} t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2600); }

/* Mismas listas y mismos permisos que “Cargar venta”: si un comercial no puede
   VENDER con una lista, tampoco debe cotizar con ella (Odoo se lo bloquea al
   confirmar, así que cotizarlo sería prometer un precio que no puede sostener). */
const LISTAS_POR_USER = { 520:[3,16,5], 215:[3,16], 18:[3,16,5], 498:[3,16,5] };
const LISTAS_DEF=[3,16,5];

let PERFIL=null, USERID=null, COMERCIAL="";
const ST={ listas:[], lista:null, modo:"cotizacion", conIva:false, conEscalera:false, escAbierta:null,
           q:"", res:[], buscando:false, items:[], precios:{}, tiers:{}, pvp:{}, taxes:{}, taxmap:null };

/* ---------------- arranque ---------------- */
EYG.guard(["comercial","lider","admin","direccion"]).then(async perfil=>{
  PERFIL=perfil;
  COMERCIAL = perfil.comercial_ref || perfil.nombre || perfil.email;
  document.body.innerHTML = EYG.layout(perfil,"cotizador", `<div id="cap"><div class="spin"></div></div>`, "Cotizador");
  try{
    const u=await EYG.rpc("res.users","search_read",[[["name","=",COMERCIAL]]],{fields:["id"],limit:1});
    USERID = u.length? u[0].id : null;
  }catch(e){ USERID=null; }
  await Promise.all([cargarListas(), cargarImpuestos()]);
  restaurar();
  render();
  // Los precios de lo restaurado se releen de la tarifa (no se guardan): repinta al llegar.
  if(ST.items.length){ await preciarItems(false); render(); }
});

async function cargarListas(){
  const jefe=["lider","direccion","admin"].includes(PERFIL.rol);
  const permitidas = jefe ? LISTAS_DEF : (LISTAS_POR_USER[USERID] || [3]);
  try{
    const all=await EYG.rpc("product.pricelist","search_read",[[["id","in",permitidas],["active","=",true]]],{fields:["id","name"],context:ES});
    ST.listas = permitidas.map(id=>all.find(l=>l.id===id)).filter(Boolean);
  }catch(e){ ST.listas=[]; }
  if(!ST.lista || !ST.listas.some(l=>l.id===ST.lista)) ST.lista = ST.listas.length? ST.listas[0].id : null;
}

/* IVA: mismo criterio que el badge de “Cargar venta”. Los nombres salen de
   account.tax, no van hardcodeados. OJO con los impuestos “IMP INC”: su precio
   YA es final y no se les vuelve a sumar IVA (ver la regla de ofertas). */
async function cargarImpuestos(){
  try{
    const tx=await EYG.rpc("account.tax","search_read",[[["type_tax_use","=","sale"]]],{fields:["id","name","amount","amount_type","price_include"],limit:100});
    ST.taxmap={};
    (tx||[]).forEach(t=>{
      const incluido = !!t.price_include || /imp\.?\s*inc|inclu/i.test(t.name||"");
      const pct = (t.amount_type==="percent") ? (t.amount||0) : 0;
      ST.taxmap[t.id]={ pct: incluido?0:pct, incluido,
        exento: !(pct>0), label: (pct>0) ? ("IVA "+String(pct).replace(".",",")+"%") : "Exento" };
    });
  }catch(e){ ST.taxmap=null; }
}
function ivaDe(taxIds){
  if(!ST.taxmap||!taxIds||!taxIds.length) return null;
  const i=taxIds.map(id=>ST.taxmap[id]).filter(Boolean);
  if(!i.length) return null;
  return i.find(x=>!x.exento) || i[0];
}
/* Alícuota efectiva a sumar al precio neto (0 si es exento o si ya viene incluido). */
function tasaDe(it){ const v=ivaDe(it.taxes_id); return v? (v.pct||0)/100 : 0; }

/* ---------------- precios (mismo motor que vender.html) ---------------- */
async function cargarPrecios(prods){
  if(!prods.length) return;
  if(!ST.lista){ prods.forEach(p=>{ ST.precios[p.id]=(p.list_price>1?p.list_price:null); ST.tiers[p.id]=[]; }); return; }
  const tmpls=[...new Set(prods.map(p=>p.product_tmpl_id&&p.product_tmpl_id[0]).filter(Boolean))];
  const vids=prods.map(p=>p.id);
  let items=[];
  try{
    // Farmacias: ítems por PLANTILLA con escalera. Tiers 2/3: por VARIANTE, precio único.
    items=await EYG.rpc("product.pricelist.item","search_read",
      [["&",["pricelist_id","=",ST.lista],"|",
        "&",["applied_on","=","1_product"],["product_tmpl_id","in",tmpls],
        "&",["applied_on","=","0_product_variant"],["product_id","in",vids]]],
      {fields:["product_tmpl_id","product_id","applied_on","min_quantity","fixed_price","compute_price"],limit:20000});
  }catch(e){}
  const porT={}, porV={};
  (items||[]).forEach(it=>{
    if(it.applied_on==="0_product_variant" && it.product_id) (porV[it.product_id[0]]=porV[it.product_id[0]]||[]).push(it);
    else if(it.product_tmpl_id) (porT[it.product_tmpl_id[0]]=porT[it.product_tmpl_id[0]]||[]).push(it);
  });
  prods.forEach(p=>{
    const t=p.product_tmpl_id&&p.product_tmpl_id[0];
    const src=(porV[p.id]&&porV[p.id].length)?porV[p.id]:(porT[t]||[]);
    let arr=src.filter(i=>i.compute_price==="fixed"&&i.fixed_price>0)
      .map(i=>({q:i.min_quantity||1,p:i.fixed_price})).sort((a,b)=>a.q-b.q);
    // Quirk EyG: el 1er tramo (min≤1) que repite el precio del 2do es el "general" oculto → se fusiona.
    if(arr.length>=2 && arr[0].q<=1 && Math.round(arr[0].p)===Math.round(arr[1].p)){ arr=arr.slice(1); arr[0]={...arr[0],q:1}; }
    if(arr.length && arr[0].q<1) arr[0]={...arr[0],q:1};
    ST.tiers[p.id]=arr;
    ST.precios[p.id]= arr.length? arr[0].p : (p.list_price>1?p.list_price:null);
    if(p.list_price>0) ST.pvp[p.id]=p.list_price;   // PVP (Alfabeta en éticos): base del % de descuento
  });
}
function tramoDe(pid,q){ const t=ST.tiers[pid]||[]; let r=t[0]||null; for(const x of t){ if(x.q<=Math.max(1,q)) r=x; } return r; }
function proxTramo(pid,q){ const t=ST.tiers[pid]||[]; const cur=tramoDe(pid,q);
  for(const x of t){ if(x.q>Math.max(1,q) && (!cur||x.p<cur.p)) return {need:x.q-Math.max(0,q), tier:x}; } return null; }
/* % de descuento de un tramo, MISMO criterio que “Cargar venta” y que la web:
   la base es el PVP (list_price = Alfabeta en éticos). Si el producto no tiene
   PVP real (los hospitalarios traen 0/1), la base es el primer tramo de la lista. */
function descPct(pid,tier){
  const t=ST.tiers[pid]||[]; if(!t.length||!tier) return 0;
  const pvp=ST.pvp[pid]||0; const base = pvp>1 ? pvp : t[0].p;
  return base>0 ? Math.round((1-tier.p/base)*100) : 0;
}
/* Descuento que está aplicado AHORA en esa línea (0 si está en el primer tramo). */
function descAplicado(it){ return descPct(it.id, tramoDe(it.id, it.cant)); }
function unitDe(it){ const tr=tramoDe(it.id, cantDe(it)); const base = tr? tr.p : ST.precios[it.id];
  if(base==null) return null; return ST.conIva ? base*(1+tasaDe(it)) : base; }
/* En “Solo precios” no se muestran cantidades: el precio del renglón tiene que
   ser el UNITARIO. Si usáramos it.cant, el precio dependería de una cantidad
   que el comercial no ve (venía de haber estado antes en modo Cotización) y
   mandaría sin querer el precio de un tramo con descuento. La escalera que va
   debajo es la que muestra los precios por cantidad. */
function cantDe(it){ return ST.modo==="precios" ? 1 : it.cant; }

/* ---------------- búsqueda ---------------- */
/* Mismo motor que el buscador del portal y el de “Cargar venta”: buscar_web
   (pg_trgm en Supabase) devuelve ids de PLANTILLA, y a Odoo le pedimos las
   variantes de esas plantillas. Difuso: "ibu 600" trae IBUPROFENO 600. */
const buscar = EYG.buscador(async v=>{
  ST.q=v; const q=(v||"").trim();
  if(q.length<2){ ST.res=[]; ST.buscando=false; pintarRes(); return; }
  ST.buscando=true; pintarRes();
  const token=(ST._tk=(ST._tk||0)+1);
  try{
    let prods=[];
    try{
      const rows=await buscarWeb(q);
      const tmpls=[...new Set(rows.map(r=>r.tmpl_id||r.product_tmpl_id||r.id).filter(Boolean))].slice(0,40);
      if(tmpls.length) prods=await EYG.rpc("product.product","search_read",
        [[["product_tmpl_id","in",tmpls],["sale_ok","=",true],["active","=",true]]],
        {fields:["id","default_code","name","product_tmpl_id","qty_available","list_price","taxes_id"],context:ES,limit:120});
    }catch(e){}
    if(!prods.length) prods=await EYG.rpc("product.product","search_read",
      [["&",["sale_ok","=",true],["active","=",true],"|",["name","ilike",q],["default_code","ilike",q]]],
      {fields:["id","default_code","name","product_tmpl_id","qty_available","list_price","taxes_id"],context:ES,order:"name",limit:60});
    if(token!==ST._tk) return;
    await cargarPrecios(prods);
    if(token!==ST._tk) return;
    ST.res=prods; ST.buscando=false; pintarRes();
  }catch(e){ if(token===ST._tk){ ST.res=[]; ST.buscando=false; pintarRes(); toast("No pude buscar: "+(e.message||e)); } }
}, 280);
async function buscarWeb(q){ const {data,error}=await EYG.supa().rpc("buscar_web",{q,lim:40}); if(error) throw error; return data||[]; }

/* ---------------- carrito ---------------- */
function enLista(id){ return ST.items.some(x=>x.id===id); }
function agregar(id){
  const p=ST.res.find(x=>x.id===id); if(!p) return;
  if(enLista(id)){ quitar(id); return; }
  // Guardamos el PVP con el ítem: es la base del % de descuento y no cambia con la lista.
  // Si no, al recargar la página los % se calcularían contra otra base y no coincidirían.
  ST.items.push({ id:p.id, code:p.default_code||"", name:limpiaNom(p.name), cant:1,
                  taxes_id:p.taxes_id||[], tmpl:p.product_tmpl_id?p.product_tmpl_id[0]:null,
                  pvp:p.list_price||0 });
  guardar(); render();
}
function quitar(id){ ST.items=ST.items.filter(x=>x.id!==id); guardar(); render(); }
function setCant(id,v){ const it=ST.items.find(x=>x.id===id); if(!it) return;
  it.cant=Math.max(1,parseInt(v,10)||1); guardar(); render(); }
function chgCant(id,d){ const it=ST.items.find(x=>x.id===id); if(!it) return;
  it.cant=Math.max(1,(it.cant||1)+d); guardar(); render(); }
function limpiar(){ if(!ST.items.length) return;
  if(!confirm("¿Vaciar la cotización?")) return; ST.items=[]; guardar(); render(); }
// El código entre corchetes al principio del nombre es ruido para el cliente.
function limpiaNom(n){ return String(n||"").replace(/^\[[^\]]*\]\s*/,"").trim(); }

/* La cotización sobrevive a recargas y a cambiar de módulo: es un borrador de
   trabajo del comercial, no un dato del sistema, así que vive en el navegador. */
const LSKEY="eyg_cotizador";
function guardar(){ try{ localStorage.setItem(LSKEY, JSON.stringify({items:ST.items, lista:ST.lista, modo:ST.modo, conIva:ST.conIva, conEscalera:ST.conEscalera})); }catch(e){} }
function restaurar(){
  try{ const o=JSON.parse(localStorage.getItem(LSKEY)||"{}");
    if(Array.isArray(o.items)) ST.items=o.items;
    if(o.lista && ST.listas.some(l=>l.id===o.lista)) ST.lista=o.lista;
    if(o.modo) ST.modo=o.modo;
    ST.conIva=!!o.conIva; ST.conEscalera=!!o.conEscalera;
  }catch(e){}
}

/* Re-lee de la tarifa el precio de lo que ya está en la cotización.
   Hace falta en dos momentos: al CAMBIAR DE LISTA (la lista es el precio, no un
   adorno) y al RESTAURAR del navegador (guardamos los productos, no sus precios:
   si guardáramos el precio, una cotización vieja mostraría un precio viejo). */
async function preciarItems(incluirRes){
  const pend=ST.items.map(it=>({id:it.id, product_tmpl_id:it.tmpl?[it.tmpl]:null, list_price:it.pvp||0}));
  const todo = incluirRes ? pend.concat(ST.res.map(p=>({id:p.id, product_tmpl_id:p.product_tmpl_id, list_price:p.list_price}))) : pend;
  if(todo.length) await cargarPrecios(todo);
}
async function setLista(id){
  ST.lista=id; guardar(); render();
  await preciarItems(true); render();
}
function setModo(m){ ST.modo=m; guardar(); render(); }
function setIva(v){ ST.conIva=!!v; guardar(); render(); }
function setEscalera(v){ ST.conEscalera=!!v; guardar(); render(); }

/* ---------------- render ---------------- */
function render(){
  const cap=document.getElementById("cap"); if(!cap) return;
  const l=ST.listas.find(x=>x.id===ST.lista);
  cap.innerHTML=`
    <h2 class="sec">🧮 Cotizador
      <span style="margin-left:auto;display:flex;align-items:center;gap:12px;font-weight:600;text-transform:none;letter-spacing:0">
        <span style="color:var(--gris);font-size:12px">No crea nada en Odoo: es solo para pasar precios</span>
        <a href="panel.html${PERFIL&&PERFIL.rol!=="comercial"&&COMERCIAL?("?c="+encodeURIComponent(COMERCIAL)):""}" class="chip" style="text-decoration:none">← Volver al panel</a>
      </span></h2>
    <div class="nota">Armá una cotización o pasá precios sueltos <b>sin elegir cliente y sin crear un presupuesto</b>. Los precios salen de la tarifa de Odoo, igual que en Cargar venta. Cuando esté listo, <b>copialo y pegalo en WhatsApp</b>.</div>
    <div class="ctrl">
      <div class="fld"><span class="lb">Lista de precios</span>
        <div class="chips">${ST.listas.length? ST.listas.map(x=>`<button class="chip ${x.id===ST.lista?'on':''}" onclick="setLista(${x.id})">🏷️ ${esc(x.name)}</button>`).join("") : '<span style="font-size:13px;color:var(--gris)">Sin listas asignadas</span>'}</div>
      </div>
      <div class="fld"><span class="lb">Qué vas a mandar</span>
        <div class="seg">
          <button class="${ST.modo==="cotizacion"?"on":""}" onclick="setModo('cotizacion')" title="Con cantidades y total">Cotización</button>
          <button class="${ST.modo==="precios"?"on":""}" onclick="setModo('precios')" title="Solo el precio de cada producto, sin cantidades ni total">Solo precios</button>
        </div>
      </div>
      <div class="fld"><span class="lb">Impuesto</span>
        <label class="swi" title="Los precios de la tarifa son NETOS. Tildá esto para mostrarlos con IVA, como los ve el cliente en la web."><input type="checkbox" ${ST.conIva?"checked":""} onchange="setIva(this.checked)"> Mostrar con IVA</label>
      </div>
      <div class="fld"><span class="lb">En el mensaje</span>
        <label class="swi" title="Suma al texto de WhatsApp la escalera de cada producto, para que el cliente vea desde cuántas unidades le baja el precio."><input type="checkbox" ${ST.conEscalera?"checked":""} onchange="setEscalera(this.checked)"> Incluir la escalera</label>
      </div>
    </div>
    <div class="cot">
      <div class="card pad">
        <div class="search">🔎 <input id="q" placeholder="Buscar por nombre, droga o código… (ej: ibu 600)" value="${esc(ST.q)}"></div>
        <div class="res" id="res"></div>
      </div>
      <div>
        <div class="card">
          <div class="pad" style="padding-bottom:8px;display:flex;align-items:center;gap:9px">
            <b style="font-size:15px;color:var(--teal-deep)">${ST.modo==="precios"?"🏷️ Precios":"🧾 Cotización"}</b>
            <span style="font-size:12px;color:var(--gris)">${ST.items.length} producto${ST.items.length===1?"":"s"}</span>
            ${ST.items.length?`<button class="chip" style="margin-left:auto;padding:5px 10px;font-size:11.5px" onclick="limpiar()">Vaciar</button>`:""}
          </div>
          <div id="items"></div>
          <div class="tot" id="tot"></div>
        </div>
      </div>
    </div>`;
  const q=document.getElementById("q");
  if(q){ q.oninput=e=>buscar(e.target.value); if(ST.q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }
  pintarRes(); pintarItems();
}

function pintarRes(){
  const c=document.getElementById("res"); if(!c) return;
  if(ST.buscando){ c.innerHTML='<div class="spin"></div>'; return; }
  if(!(ST.q||"").trim()){ c.innerHTML='<div class="vacio">Buscá un producto para empezar.<br><span style="font-size:12px">Tolera el tipeo y busca por droga: "ibu 600", "taf 1g".</span></div>'; return; }
  if(!ST.res.length){ c.innerHTML='<div class="vacio">No encontré nada con eso.</div>'; return; }
  c.innerHTML=ST.res.map(p=>{
    const base=ST.precios[p.id];
    const t=(ST.taxmap&&ivaDe(p.taxes_id))||null;
    const pr = base==null? null : (ST.conIva? base*(1+((t&&t.pct)||0)/100) : base);
    const ya=enLista(p.id);
    const tt=ST.tiers[p.id]||[];
    // Que se sepa que tiene escalera antes de sumarlo, en un renglón y nada más.
    const maxD = tt.length>1 ? Math.max(...tt.map(x=>descPct(p.id,x))) : 0;
    const escP = maxD>0 ? `<div class="escmini">Por cantidad, hasta −${maxD}%</div>` : "";
    return `<div class="row">
      <div class="nm"><b>${esc(limpiaNom(p.name))}</b>
        <span>${p.default_code?esc(p.default_code)+" · ":""}${t?esc(t.label):""}${p.qty_available>0?` · ${nf(p.qty_available)} en stock`:" · sin stock"}</span>${escP}</div>
      <div class="pr"><b>${pr!=null?money(pr):"—"}</b><span>${pr!=null?(ST.conIva?"c/IVA":"neto")+" c/u":"sin precio en la lista"}</span></div>
      <button class="add ${ya?"qui":""}" onclick="agregar(${p.id})">${ya?"✓ Quitar":"＋ Sumar"}</button>
    </div>`;
  }).join("");
}

/* La escalera de precios por cantidad, tramo por tramo. Es la herramienta para
   cotizar con descuento: el comercial ve a partir de cuántas unidades baja el
   precio y cuánto, y TOCANDO un tramo pone esa cantidad en la cotización.
   En “Solo precios” no hay cantidades, así que va como texto informativo. */
function escaleraHTML(it, soloPrecios){
  const t=ST.tiers[it.id]||[];
  if(t.length<2) return "";                       // sin escalera real: no ensuciamos
  const pu=x=> ST.conIva ? x.p*(1+tasaDe(it)) : x.p;
  const maxD=Math.max(...t.map(x=>descPct(it.id,x)));
  // En “Solo precios” no hay cantidad ni botones: alcanza con una línea.
  if(soloPrecios) return maxD>0 ? `<div class="escmini">Por cantidad, hasta −${maxD}%</div>` : "";
  const dp=descAplicado(it);
  const abierto = ST.escAbierta===it.id;
  const cur=tramoDe(it.id, it.cant);
  const lbl = dp>0 ? `−${dp}%` : `hasta −${maxD}%`;
  return `<span class="escwrap">
    <button class="escbtn ${dp>0?"":"plano"}" onclick="togEsc(${it.id})"
      title="${dp>0?`Estás cotizando con −${dp}%. `:""}Ver la escalera por cantidad y elegir un tramo">🏷️ ${lbl} ▾</button>
    ${abierto?`<div class="pop" onclick="event.stopPropagation()">
      <div class="ph">Precio por cantidad</div>
      ${t.map(x=>{ const d=descPct(it.id,x); const on=cur&&cur.q===x.q;
        return `<button class="pl ${on?"on":""}" onclick="setCant(${it.id},${x.q});togEsc(null)">
          <span class="q">desde ${nf(x.q)} u</span><span class="p">${money(pu(x))}</span>${d>0?`<span class="d">−${d}%</span>`:""}</button>`;
      }).join("")}
    </div>`:""}
  </span>`;
}
/* Un solo globo abierto a la vez. Un clic en cualquier otro lado lo cierra. */
function togEsc(id){ ST.escAbierta = (ST.escAbierta===id||id==null) ? null : id; pintarItems(); }
document.addEventListener("click", e=>{
  if(ST.escAbierta!=null && !e.target.closest(".escwrap")) togEsc(null);
});

function pintarItems(){
  const c=document.getElementById("items"), t=document.getElementById("tot");
  if(!c||!t) return;
  if(!ST.items.length){
    c.innerHTML='<div class="vacio">Todavía no sumaste nada.<br><span style="font-size:12px">Buscá a la izquierda y tocá ＋ Sumar.</span></div>';
    t.innerHTML=`<div class="btns"><button class="btn wa" disabled>📋 Copiar para WhatsApp</button></div>`;
    return;
  }
  const precios=ST.modo==="precios";
  c.innerHTML=ST.items.map(it=>{
    const u=unitDe(it);
    const sub=(u!=null)? u*it.cant : null;
    const nx= precios? null : proxTramo(it.id,it.cant);
    const v=ivaDe(it.taxes_id);
    return `<div class="it">
      <div class="nm"><b>${esc(it.name)}</b>
        ${precios?"":`<div class="step">
          <button onclick="chgCant(${it.id},-1)">−</button>
          <input type="number" min="1" value="${it.cant}" onfocus="this.select()" onchange="setCant(${it.id},this.value)">
          <button onclick="chgCant(${it.id},1)">＋</button>
          <button class="del" onclick="quitar(${it.id})" title="Quitar">🗑</button>
          ${escaleraHTML(it,false)}
        </div>`}
        ${nx?`<div class="nextd">＋${nf(nx.need)} u → ${money(ST.conIva? nx.tier.p*(1+tasaDe(it)) : nx.tier.p)} c/u</div>`:""}
        ${precios?escaleraHTML(it,true):""}
        ${precios?`<div style="margin-top:6px"><button class="chip" style="padding:4px 9px;font-size:11px" onclick="quitar(${it.id})">Quitar</button></div>`:""}
      </div>
      <div class="r">
        ${v?`<span class="iva ${v.exento?"ex":"si"}">${esc(v.label)}</span>`:""}
        <div class="u">${u!=null?money(u)+" c/u":"sin precio"}</div>
        ${precios?"":`<div class="sub">${sub!=null?money(sub):"—"}</div>`}
      </div>
    </div>`;
  }).join("");

  if(precios){
    t.innerHTML=`<div class="tr"><span>${ST.items.length} producto${ST.items.length===1?"":"s"}</span><b>${ST.conIva?"precios con IVA":"precios netos"}</b></div>
      <div class="btns">
        <button class="btn wa" onclick="copiar('precios')">📋 Copiar para WhatsApp</button>
        <button class="btn gh" onclick="verTexto()">👁 Ver cómo queda</button>
      </div>
      <div id="prev"></div>`;
    return;
  }
  const r=totales();
  t.innerHTML=`
    <div class="tr"><span>Neto (sin IVA)</span><b>${money(r.neto)}</b></div>
    ${r.iva>0?`<div class="tr"><span>IVA</span><b>${money(r.iva)}</b></div>`:`<div class="tr"><span>IVA</span><b>exento</b></div>`}
    <div class="tr big"><span>Total</span><span>${money(r.total)}</span></div>
    <div class="btns">
      <button class="btn wa" onclick="copiar('cot')">📋 Copiar para WhatsApp</button>
      <button class="btn gh" onclick="copiar('detalle')">📋 Copiar con detalle (cant. × precio)</button>
      <button class="btn gh" onclick="verTexto()">👁 Ver cómo queda</button>
    </div>
    <div id="prev"></div>`;
}

/* El total SIEMPRE se calcula sobre el neto y se le suma el IVA que corresponde
   a cada producto (hay exentos y con 21% en el mismo pedido). El interruptor
   “con IVA” cambia cómo se MUESTRA el unitario, no cómo se calcula el total. */
function totales(){
  let neto=0, iva=0;
  ST.items.forEach(it=>{
    const tr=tramoDe(it.id,it.cant); const base=tr?tr.p:ST.precios[it.id];
    if(base==null) return;
    const n=base*it.cant; neto+=n; iva+=n*tasaDe(it);
  });
  return {neto, iva, total:neto+iva};
}

/* ---------------- texto para WhatsApp ---------------- */
function textoDe(tipo){
  if(!ST.items.length) return "";
  const l=ST.listas.find(x=>x.id===ST.lista);
  if(tipo==="precios"){
    let t=`*Droguería EyG · Precios*\n\n`;
    ST.items.forEach(it=>{
      const u=unitDe(it); t+=`• ${it.name} — ${u!=null?money(u):"a confirmar"}\n`;
      t+=escaleraTexto(it,"   ");
    });
    t+=`\n_Precios${ST.conIva?" con IVA":" sin IVA"} · sujetos a stock._`;
    return t;
  }
  const r=totales();
  let t=`*Droguería EyG · Cotización*\n\n`;
  ST.items.forEach(it=>{
    const u=unitDe(it); const sub=(u!=null)?u*it.cant:null;
    const dp=descAplicado(it);
    const marca = dp>0 ? ` (−${dp}%)` : "";   // que el cliente vea que le hicimos precio
    t += (tipo==="detalle")
      ? `• ${it.name}\n   ${nf(it.cant)} × ${u!=null?money(u):"—"}${marca} = ${sub!=null?money(sub):"—"}\n`
      : `• ${nf(it.cant)}× ${it.name} — ${sub!=null?money(sub):"—"}${marca}\n`;
    t += escaleraTexto(it,"   ");
  });
  t+=`\n———————————\n`;
  /* Si los renglones YA van con IVA, desglosar "Neto + IVA" abajo confunde: el
     cliente suma los renglones y no le da el neto. En ese caso va solo el total. */
  if(!ST.conIva){
    t+=`Neto: ${money(r.neto)}\n`;
    if(r.iva>0) t+=`IVA: ${money(r.iva)}\n`;
  }
  t+=`*TOTAL: ${money(r.total)}*\n`;
  t+=`\n_Sujeto a stock. Precios${ST.conIva?" con IVA incluido":(r.iva>0?" netos, se factura + IVA":" netos (productos exentos de IVA)")}._`;
  return t;
}
/* La escalera dentro del mensaje: sirve para EMPUJAR el pedido (“si llevás 9 te
   sale $600”). Va solo si el comercial lo pide, porque no siempre conviene
   mostrarle al cliente toda la grilla. */
function escaleraTexto(it, sangria){
  if(!ST.conEscalera) return "";
  const t=ST.tiers[it.id]||[]; if(t.length<2) return "";
  const pu=x=> ST.conIva ? x.p*(1+tasaDe(it)) : x.p;
  return t.map(x=>{ const d=descPct(it.id,x);
    return `${sangria}desde ${nf(x.q)} u: ${money(pu(x))}${d>0?` (−${d}%)`:""}`; }).join("\n")+"\n";
}
async function copiar(tipo){
  const txt=textoDe(tipo);
  if(!txt){ toast("No hay nada para copiar"); return; }
  try{ await navigator.clipboard.writeText(txt); toast("✓ Copiado — pegalo en WhatsApp"); }
  catch(e){
    // Navegador sin permiso de portapapeles: mostramos el texto para copiar a mano.
    const p=document.getElementById("prev");
    if(p){ p.innerHTML=`<div class="prev" id="prevtxt">${esc(txt)}</div><div style="font-size:11.5px;color:var(--gris);margin-top:6px">No pude copiar solo: seleccioná el texto de arriba y copialo a mano.</div>`;
      const n=document.getElementById("prevtxt"); if(n){ const rg=document.createRange(); rg.selectNodeContents(n); const s=getSelection(); s.removeAllRanges(); s.addRange(rg); } }
    toast("Copiá el texto de abajo");
  }
}
function verTexto(){
  const p=document.getElementById("prev"); if(!p) return;
  const txt=textoDe(ST.modo==="precios"?"precios":"cot");
  p.innerHTML = txt? `<div class="prev">${esc(txt)}</div>` : "";
}
</script>
</body>
</html>
