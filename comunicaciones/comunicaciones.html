<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comunicaciones · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<style>
  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .tab{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 15px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--gris);display:flex;align-items:center;gap:7px}
  .tab.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .tab .b{background:#EC8B5E;color:#3a1d10;font-size:11px;font-weight:800;border-radius:20px;padding:1px 8px}
  .tab.on .b{background:#fff;color:var(--teal-deep)}
  .btn{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit}
  .btn:hover{background:var(--teal-deep)} .btn:disabled{opacity:.55;cursor:default}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--gris)} .btn.ghost:hover{border-color:var(--teal-med)}
  .btn.warn{background:#fff;border:1px solid #f0b8b5;color:#b0322f} .btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:15px 16px;margin-bottom:13px}
  .card.alta{border-left:4px solid #EC8B5E}
  .card .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card h3{font-size:15.5px;font-weight:800;line-height:1.3}
  .card .cuerpo{font-size:13.5px;color:var(--gris);white-space:pre-wrap;line-height:1.45;margin-top:6px}
  .card .meta{font-size:11.5px;color:var(--gris2);margin-top:9px;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
  .card .acts{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
  .pill{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;border-radius:20px;padding:2px 9px}
  .pill.alta{background:#fbe4e3;color:#b0322f} .pill.dest{background:var(--agua);color:var(--teal-deep)} .pill.venc{background:#eee;color:#888} .pill.prog{background:#fbf0d6;color:#9a6a0b} .pill.off{background:#eee;color:#888}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);display:inline-block;flex:none}
  .empty{padding:34px;text-align:center;color:var(--gris);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
  .fld{margin-bottom:13px} .fld label{display:block;font-size:12px;font-weight:700;color:var(--gris);margin-bottom:5px}
  .fld input,.fld textarea,.fld select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff}
  .fld textarea{min-height:110px;resize:vertical} .row2{display:flex;gap:12px;flex-wrap:wrap} .row2>div{flex:1;min-width:150px}
  .hint{font-size:11.5px;color:var(--gris2);margin-top:4px}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .opt{border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--gris);display:flex;align-items:center;gap:7px}
  .opt.on{border-color:var(--teal);background:var(--agua);color:var(--teal-deep)}
  .chks{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .chk{border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--gris)}
  .chk.on{border-color:var(--teal);background:var(--agua);color:var(--teal-deep)}
  .formbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px;max-width:720px}
  .formbox h2{font-size:16px;font-weight:800;margin-bottom:14px}
  .lecturas{margin-top:9px;border-top:1px dashed var(--line);padding-top:9px}
  .lecturas .bar{height:7px;border-radius:20px;background:#eef1f0;overflow:hidden;margin:6px 0}
  .lecturas .bar i{display:block;height:100%;background:var(--teal)}
  .who{font-size:11.5px;color:var(--gris)} .who b{color:var(--ink)}
  .who .pend{color:#b45309}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;margin:44px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 26px rgba(0,0,0,.25);z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=31"></script>
<script>
/* ============ EyG Core · Comunicaciones ============
   Dos clases de mensaje, ambas van DIRECTO (sin aprobación de nadie):
   · Novedades internas: Gerencia (dirección/admin) → toda la empresa o departamentos;
     el líder → su equipo. Se leen en Bandeja; el emisor ve el acuse en "Enviadas".
   · Mensajes de WhatsApp para clientes (clase 'wa'): Gerencia → todos los comerciales;
     el líder → su equipo. Caen en la sección de WhatsApp del panel del comercial (con
     "quién lo creó") para dispararlos a la cartera. En "Enviadas" el emisor ve a cuántos
     clientes llegó cada uno. */
const esc=s=>EYG.esc(s);
const hoy=()=>EYG.argToday();
function fD(s){ if(!s) return ""; s=String(s).slice(0,10); return s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4); }
function masDias(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

let PERFIL, EMISOR=false, MODO=null /* 'direccion' | 'lider' */, TEAM=[], ROSTER=[], TAB="bandeja", COMS=[], EDIT=null;
function defaultEdit(){ return {clase:"novedad", alcance: MODO==="lider"?"equipo":"todos", departamentos:[], personas:[], _deptFiltro:"", prioridad:"normal", desde:hoy(), hasta:"", titulo:"", cuerpo:"", liderRef:""}; }

let toastT; function toast(msg, ok){ const t=document.getElementById("toast"); if(!t)return; t.textContent=msg; t.className="toast show"+(ok?" ok":""); clearTimeout(toastT); toastT=setTimeout(()=>t.className="toast",2500); }

/* Equipo del líder desde el organigrama de Odoo (hr.employee.parent_id), igual que lider.html.
   Devuelve los NOMBRES de los comerciales (= su res.users, y su comercial_ref en el Core). */
async function resolverEquipo(name){
  if(!name) return [];
  const u=await EYG.rpc("res.users","search_read",[[["name","=",name]]],{fields:["id"]});
  if(!u.length) return [];
  const emp=await EYG.rpc("hr.employee","search_read",[[["user_id","=",u[0].id]]],{fields:["child_ids"]});
  if(!emp.length || !(emp[0].child_ids||[]).length) return [];
  const subs=await EYG.rpc("hr.employee","read",[emp[0].child_ids,["user_id"]]);
  return subs.filter(s=>s.user_id).map(s=>s.user_id[1]);
}

EYG.requireAuth([], async perfil=>{
  PERFIL=perfil; window.__perfil=perfil;
  EMISOR = perfil.rol==="admin"||perfil.rol==="direccion"||perfil.rol==="lider";
  MODO = perfil.rol==="lider" ? "lider" : (EMISOR ? "direccion" : null);
  TAB = "bandeja";
  document.body.innerHTML = EYG.layout(perfil,"comunicaciones",'<div id="cont"><div class="spin"></div></div><div class="toast" id="toast"></div>',"Comunicaciones");
  if(MODO==="lider"){ try{ TEAM=await resolverEquipo(perfil.comercial_ref); }catch(e){ TEAM=[]; } }
  if(EMISOR){ try{ ROSTER=await EYG.rosterCore(); }catch(e){ ROSTER=[]; } }
  await recargar();
});

async function recargar(){ try{ COMS=await EYG.comsLeer(); }catch(e){ COMS=[]; } render(); }

function render(){
  const cont=document.getElementById("cont"); if(!cont) return;
  const email=(PERFIL.email||"").toLowerCase();
  const mias=EYG.comsParaMi(PERFIL, COMS);
  const noLeidas=mias.filter(c=>!EYG.comLeida(c,email)).length;
  const tabs=`<div class="tabs">
    <button class="tab ${TAB==='bandeja'?'on':''}" onclick="setTab('bandeja')">📥 Bandeja ${noLeidas?`<span class="b">${noLeidas}</span>`:''}</button>
    ${EMISOR?`<button class="tab ${TAB==='publicar'?'on':''}" onclick="setTab('publicar')">✏️ Publicar</button>
    <button class="tab ${TAB==='enviadas'?'on':''}" onclick="setTab('enviadas')">📤 Enviadas</button>`:''}
  </div>`;
  let body="";
  if(TAB==="bandeja") body=vistaBandeja(mias, email);
  else if(TAB==="publicar") body=vistaPublicar();
  else body=vistaEnviadas();
  cont.innerHTML=tabs+`<div id="body">${body}</div>`;
  if(TAB==="enviadas") cargarAlcances();   // async: rellena "envíos a clientes" de los mensajes WA
}
function setTab(t){ if(t===TAB) return; TAB=t; if(t!=="publicar") EDIT=null; render(); }

/* ---------- Bandeja (receptor) ---------- */
function vistaBandeja(mias, email){
  if(!mias.length) return `<div class="empty">📭 No tenés novedades por ahora.<br><span style="font-size:12.5px">Acá van a aparecer las bajadas de Gerencia${PERFIL.rol==="comercial"||PERFIL.rol==="lider"?" y de tu líder":""}.</span></div>`;
  const ord=mias.slice().sort((a,b)=>{
    const la=EYG.comLeida(a,email), lb=EYG.comLeida(b,email);
    if(la!==lb) return la?1:-1;                                   // no leídas primero
    return ((b.prioridad==="alta")-(a.prioridad==="alta")) || String(b.ts||"").localeCompare(String(a.ts||""));
  });
  return ord.map(c=>{
    const leida=EYG.comLeida(c,email), alta=c.prioridad==="alta";
    return `<div class="card ${alta?'alta':''}" style="${leida?'opacity:.78':''}">
      <div class="top">
        ${alta?'<span class="pill alta">Importante</span>':''}
        ${!leida?'<span class="dot"></span>':''}
        <h3>${esc(c.titulo||"")}</h3>
      </div>
      <div class="cuerpo">${esc(c.cuerpo||"")}</div>
      <div class="meta"><span>👤 ${esc(c.autor||"")}</span><span>🗓️ ${fD(c.ts)}</span>${destinoLabel(c)}</div>
      <div class="acts">
        ${leida?'<span style="font-size:12.5px;color:var(--gris2);font-weight:600">✓ Leído</span>'
               :`<button class="btn sm" onclick="marcar('${c.id}')">Marcar como leído</button>`}
      </div>
    </div>`;
  }).join("");
}
async function marcar(id){ await EYG.comMarcarLeido(PERFIL,id); await recargar(); }

function nombresDe(emails){ const r=ROSTER||[]; return (emails||[]).map(em=>{ const u=r.find(x=>x.email===em); return u?u.nombre:em; }); }
function destinoLabel(c){
  if(c.alcance==="todos") return '<span>🏢 Toda la empresa</span>';
  if(c.alcance==="comerciales") return '<span>🧑‍💼 Todos los comerciales</span>';
  if(c.alcance==="equipo") return `<span>👥 Equipo${(c.destinatarios||[]).length?` · ${(c.destinatarios||[]).length}`:''}</span>`;
  if(c.alcance==="personas"){ const ns=nombresDe(c.personas); return `<span title="${esc(ns.join(', '))}">🧑 ${ns.length} persona${ns.length===1?'':'s'}</span>`; }
  if(c.alcance==="departamento"){ const n=(c.departamentos||[]).map(d=>(EYG.COM_DEPTS.find(x=>x.key===d)||{}).nom||d).join(", "); return `<span>📂 ${esc(n)}</span>`; }
  return "";
}
/* Padrón esperado (denominador de lectura) según el alcance, usando el roster del Core. */
function targetEmails(c){
  const r=ROSTER||[];
  if(c.alcance==="personas") return new Set(c.personas||[]);
  if(c.alcance==="equipo") return new Set(r.filter(u=>(c.destinatarios||[]).includes(u.comercial_ref)||(c.destinatarios||[]).includes(u.nombre)).map(u=>u.email));
  if(c.alcance==="departamento") return new Set(r.filter(u=>(c.departamentos||[]).includes(EYG.comDeptDeRol(u.rol))).map(u=>u.email));
  if(c.alcance==="todos") return new Set(r.map(u=>u.email));
  return new Set();
}

/* ---------- Publicar (emisor) ---------- */
function vistaPublicar(){
  const e=EDIT||defaultEdit();
  const clase=e.clase||"novedad", esLider=MODO==="lider", esWA=clase==="wa";
  const tipoUI=`<div class="fld"><label>Tipo</label>
    <div class="seg">
      <div class="opt ${!esWA?'on':''}" onclick="setClase('novedad')">📣 Novedad interna</div>
      <div class="opt ${esWA?'on':''}" onclick="setClase('wa')">📱 Mensaje de WhatsApp</div>
    </div>
    <div class="hint">${esWA?'Un mensaje listo para que los comerciales lo manden a sus clientes por WhatsApp.':'Una comunicación interna que se lee en el Core.'}</div></div>`;
  // destino según tipo + rol: área (departamento) / equipo / personas específicas
  const alc = e.alcance || (esWA ? (esLider?"equipo":"comerciales") : (esLider?"equipo":"todos"));
  const opciones = esWA
    ? (esLider ? [["equipo","👥 Mi equipo"],["personas","🧑 Comerciales puntuales"]]
               : [["comerciales","🧑‍💼 Todos los comerciales"],["personas","🧑 Comerciales puntuales"]])
    : (esLider ? [["equipo","👥 Mi equipo"],["personas","🧑 Personas de mi equipo"]]
               : [["todos","🏢 Toda la empresa"],["departamento","📂 Áreas"],["personas","🧑 Personas puntuales"]]);
  let sub="";
  if(alc==="departamento") sub=`<div class="chks">${EYG.COM_DEPTS.map(d=>`<div class="chk ${(e.departamentos||[]).includes(d.key)?'on':''}" onclick="toggleDept('${d.key}')">${esc(d.nom)}</div>`).join("")}</div>`;
  else if(alc==="equipo") sub=TEAM.length?`<div class="hint">Llega a: ${TEAM.map(esc).join(" · ")}</div>`:`<div class="hint" style="color:#b0322f">No pude resolver tu equipo en Odoo. Avisá al administrador.</div>`;
  else if(alc==="comerciales") sub=`<div class="hint">Va directo al panel de todos los comerciales.</div>`;
  else if(alc==="todos") sub=`<div class="hint">La ve toda la empresa.</div>`;
  else if(alc==="personas") sub=personasPickerHTML(e);
  const destinoUI = `<div class="fld"><label>¿A quién le llega?</label>
    <div class="seg">${opciones.map(([v,l])=>`<div class="opt ${alc===v?'on':''}" onclick="setAlcance('${v}')">${l}</div>`).join("")}</div>
    ${sub}</div>`;
  const btnLabel = EDIT ? "Guardar cambios" : (esWA ? (esLider?"Enviar a mi equipo":"Enviar a los comerciales") : "Publicar novedad");
  return `<div class="formbox">
    <h2>${EDIT?"Editar":"Nuevo"} ${esWA?"· mensaje de WhatsApp":"· novedad"}</h2>
    ${tipoUI}
    <div class="fld"><label>${esWA?"Nombre interno":"Título"}</label><input id="f-titulo" maxlength="120" placeholder="${esWA?'Ej: Oferta pañales agosto (no lo ve el cliente)':'Ej: Nuevos horarios de depósito'}" value="${esc(e.titulo)}"></div>
    <div class="fld"><label>${esWA?"Texto que recibe el cliente":"Mensaje"}</label><textarea id="f-cuerpo" placeholder="${esWA?'Hola! Te escribimos de Droguería EyG 👋 …':'Escribí la novedad…'}">${esc(e.cuerpo)}</textarea>${esWA?'<div class="hint">Se manda tal cual a cada cliente (sin el nombre del cliente). Para el nombre del comercial que lo envía (se completa solo al enviarlo): <b>{NOMBRE}</b> = nombre de pila (para el saludo) · <b>{NOMBRECOMPLETO}</b> = nombre y apellido (para la firma). Los emojis salen bien.</div>':''}</div>
    ${destinoUI}
    ${esWA?'':`<div class="row2">
      <div class="fld"><label>Prioridad</label>
        <div class="seg">
          <div class="opt ${e.prioridad!=='alta'?'on':''}" onclick="setPrio('normal')">Normal</div>
          <div class="opt ${e.prioridad==='alta'?'on':''}" onclick="setPrio('alta')">🔴 Importante</div>
        </div></div>
    </div>`}
    <div class="row2">
      <div class="fld"><label>Desde</label><input id="f-desde" type="date" value="${esc(e.desde||hoy())}"><div class="hint">Cuándo empieza a mostrarse.</div></div>
      <div class="fld"><label>Hasta (opcional)</label><input id="f-hasta" type="date" value="${esc(e.hasta||"")}"><div class="hint">Vacío = sin vencimiento.</div></div>
    </div>
    <div class="acts" style="margin-top:4px">
      <button class="btn" id="f-guardar" onclick="publicar()">${btnLabel}</button>
      ${EDIT?`<button class="btn ghost" onclick="cancelarEdit()">Cancelar</button>`:''}
    </div>
  </div>`;
}
/* estado del formulario en el propio EDIT (así sobrevive a los re-render de la selección) */
function ensureEdit(){ if(!EDIT) EDIT=defaultEdit(); syncForm(); return EDIT; }
function syncForm(){ const t=document.getElementById("f-titulo"), c=document.getElementById("f-cuerpo"), d=document.getElementById("f-desde"), h=document.getElementById("f-hasta"), L=document.getElementById("f-lider");
  if(t)EDIT.titulo=t.value; if(c)EDIT.cuerpo=c.value; if(d)EDIT.desde=d.value; if(h)EDIT.hasta=h.value; if(L)EDIT.liderRef=L.value; }
function setClase(k){ ensureEdit(); EDIT.clase=k;
  EDIT.alcance = k==="wa" ? (MODO==="lider"?"equipo":"comerciales") : (MODO==="lider"?"equipo":"todos");
  EDIT.personas=[]; EDIT.departamentos=[]; EDIT._deptFiltro=""; render(); }
function setAlcance(a){ ensureEdit(); EDIT.alcance=a; render(); }
function toggleDept(k){ ensureEdit(); const s=new Set(EDIT.departamentos||[]); s.has(k)?s.delete(k):s.add(k); EDIT.departamentos=[...s]; render(); }
function togglePersona(email){ ensureEdit(); const s=new Set(EDIT.personas||[]); s.has(email)?s.delete(email):s.add(email); EDIT.personas=[...s]; render(); }
function setDeptFiltro(v){ ensureEdit(); EDIT._deptFiltro=v; render(); }
/* Candidatos del selector de personas según contexto: líder → su equipo; Gerencia+WA →
   comerciales; Gerencia+novedad → todo el padrón. */
function candidatosPersonas(){
  const r=ROSTER||[];
  if(MODO==="lider"){ const set=new Set(TEAM); return r.filter(u=>set.has(u.comercial_ref)||set.has(u.nombre)); }
  if((EDIT&&EDIT.clase)==="wa") return r.filter(u=>u.rol==="comercial");
  return r.slice();
}
function personasPickerHTML(e){
  const cands=candidatosPersonas();
  if(!cands.length) return `<div class="hint" style="color:#b0322f">No pude cargar el padrón de usuarios (¿sesión sin permiso?).</div>`;
  const sel=new Set(e.personas||[]);
  const conFiltro = MODO!=="lider" && (e.clase||"novedad")!=="wa";   // sólo Gerencia+novedad tiene lista amplia
  const filtro=e._deptFiltro||"";
  let list=cands; if(conFiltro && filtro) list=cands.filter(u=>EYG.comDeptDeRol(u.rol)===filtro);
  const filtroUI = conFiltro ? `<div style="margin-bottom:8px"><select onchange="setDeptFiltro(this.value)" style="max-width:260px">
      <option value="">Todos los departamentos</option>
      ${EYG.COM_DEPTS.map(d=>`<option value="${d.key}" ${filtro===d.key?'selected':''}>${esc(d.nom)}</option>`).join("")}</select></div>` : "";
  return `${filtroUI}<div class="chks">${list.map(u=>`<div class="chk ${sel.has(u.email)?'on':''}" onclick="togglePersona('${u.email}')">${esc(u.nombre)}${conFiltro?` <span style="opacity:.55;font-size:11px">· ${esc(u.rol)}</span>`:''}</div>`).join("")}</div>
    <div class="hint">${sel.size} seleccionada${sel.size===1?'':'s'}${cands.length?` de ${list.length}`:''}.</div>`;
}
function setPrio(p){ ensureEdit(); EDIT.prioridad=p; render(); }
function cancelarEdit(){ EDIT=null; TAB="enviadas"; render(); }

async function publicar(){
  syncForm();
  const clase=(EDIT&&EDIT.clase)||"novedad", esWA=clase==="wa", esLider=MODO==="lider";
  const titulo=(EDIT&&EDIT.titulo||"").trim(), texto=(EDIT&&EDIT.cuerpo||"").trim();
  if(!titulo){ toast(esWA?"Poné un nombre interno.":"Poné un título."); return; }
  if(!texto){ toast(esWA?"Escribí el texto del mensaje.":"Escribí el mensaje."); return; }
  const alc = (EDIT&&EDIT.alcance) || (esWA ? (esLider?"equipo":"comerciales") : (esLider?"equipo":"todos"));
  // validaciones por alcance
  if(alc==="departamento" && !(EDIT.departamentos||[]).length){ toast("Elegí al menos un área."); return; }
  if(alc==="personas" && !(EDIT.personas||[]).length){ toast("Elegí al menos una persona."); return; }
  if(alc==="equipo" && !TEAM.length){ toast("No tenés equipo asignado."); return; }
  const btn=document.getElementById("f-guardar"); if(btn){ btn.disabled=true; btn.textContent="Guardando…"; }
  // campos de targeting comunes a novedad y wa
  const target = { alcance:alc,
    departamentos: alc==="departamento"?(EDIT.departamentos||[]):[],
    destinatarios: alc==="equipo"?TEAM:[],
    personas: alc==="personas"?(EDIT.personas||[]):[],
    liderRef: (esLider && (alc==="equipo"||alc==="personas"))?(PERFIL.comercial_ref||""):"" };
  try{
    const arr=await EYG.comsLeer();
    if(EDIT && EDIT.id){
      const c=arr.find(x=>x.id===EDIT.id);
      if(c){ c.titulo=titulo; c.desde=EDIT.desde||hoy(); c.hasta=EDIT.hasta||"";
        Object.assign(c, target);
        if(esWA) c.waTexto=texto; else { c.cuerpo=texto; c.prioridad=EDIT.prioridad||"normal"; } }
    }else{
      const base={ id:"com_"+Date.now()+"_"+Math.random().toString(36).slice(2,7), ts:new Date().toISOString(),
        autor:PERFIL.nombre||PERFIL.email, autorEmail:(PERFIL.email||"").toLowerCase(), autorRol:PERFIL.rol,
        desde:EDIT.desde||hoy(), hasta:EDIT.hasta||"", activo:true, ...target };
      if(esWA) arr.push({ ...base, clase:"wa", titulo, waTexto:texto, origen: esLider?"lider":"gerencia", vistoPor:[] });
      else     arr.push({ ...base, clase:"novedad", titulo, cuerpo:texto, prioridad:EDIT.prioridad||"normal", leidoPor:[] });
    }
    await EYG.comsGuardar(arr);
    COMS=arr; EDIT=null; TAB="enviadas"; render();
    toast(esWA?"Mensaje de WhatsApp enviado ✓":"Novedad publicada ✓", true);
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent=esWA?"Publicar":"Publicar novedad"; } toast("No se pudo guardar: "+(e.message||e)); }
}

/* ---------- Enviadas (emisor) · acuse de lectura (novedades) + envíos (WhatsApp) ---------- */
function vistaEnviadas(){
  const todo = PERFIL.rol==="admin"||PERFIL.rol==="direccion";
  const mias = COMS.filter(c=>c && (todo || c.autorEmail===(PERFIL.email||"").toLowerCase()))
                   .sort((a,b)=>String(b.ts||"").localeCompare(String(a.ts||"")));
  const nuevo=`<div style="margin-bottom:14px"><button class="btn" onclick="EDIT=null;setTab('publicar')">✏️ Nueva comunicación</button></div>`;
  if(!mias.length) return nuevo+`<div class="empty">Todavía no publicaste nada.</div>`;
  return nuevo+mias.map(c=> (c.clase==="wa") ? cardEnviadaWA(c) : cardEnviadaNovedad(c)).join("");
}
function estadoPill(c){
  return c.activo===false ? '<span class="pill off">Desactivada</span>'
       : (c.desde&&c.desde>hoy()) ? '<span class="pill prog">Programada</span>'
       : (c.hasta&&c.hasta<hoy()) ? '<span class="pill venc">Vencida</span>'
       : '<span class="pill dest">Activa</span>';
}
function actos(c){
  return `<div class="acts">
    <button class="btn ghost sm" onclick="editar('${c.id}')">✏️ Editar</button>
    <button class="btn ghost sm" onclick="toggleActiva('${c.id}')">${c.activo===false?'✅ Reactivar':'🚫 Desactivar'}</button>
    <button class="btn warn sm" onclick="borrar('${c.id}')">🗑️ Borrar</button>
  </div>`;
}
function cardEnviadaNovedad(c){
  const leidoSet=new Set((c.leidoPor||[]).map(x=>(x.email||"").toLowerCase()));
  const target=targetEmails(c);            // emails esperados según el padrón del Core
  const total=target.size;
  const leidos=(c.leidoPor||[]).length;
  let lect;
  if(total){
    const enTarget=[...target].filter(em=>leidoSet.has(em)).length;
    const pct=Math.round(enTarget/total*100);
    const pend=nombresDe([...target].filter(em=>!leidoSet.has(em)));
    lect=`<div class="lecturas"><div class="who"><b>${enTarget}/${total}</b> leyeron · ${pct}%</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      ${pend.length?`<div class="who pend">Falta leer: ${pend.map(esc).join(" · ")}</div>`:'<div class="who" style="color:var(--m-ok,#1E7D46)">Todos leyeron ✓</div>'}</div>`;
  }else{
    const nombres=(c.leidoPor||[]).map(x=>x.nombre).filter(Boolean);
    lect=`<div class="lecturas"><div class="who"><b>${leidos}</b> ${leidos===1?"persona leyó":"personas leyeron"}${nombres.length?": "+nombres.map(esc).join(" · "):""}</div>
      ${!(ROSTER&&ROSTER.length)?'<div class="hint">No pude cargar el padrón para mostrar el total esperado.</div>':''}</div>`;
  }
  return `<div class="card">
    <div class="top">${c.prioridad==="alta"?'<span class="pill alta">Importante</span>':''}<h3>${esc(c.titulo||"")}</h3>${estadoPill(c)}</div>
    <div class="cuerpo">${esc(c.cuerpo||"")}</div>
    <div class="meta"><span>👤 ${esc(c.autor||"")}</span><span>🗓️ ${fD(c.ts)}</span>${destinoLabel(c)}${c.hasta?`<span>⏳ hasta ${fD(c.hasta)}</span>`:''}</div>
    ${lect}${actos(c)}</div>`;
}
function cardEnviadaWA(c){
  const alc=c.alcance||(c.origen==="gerencia"?"comerciales":"equipo");
  const destino = alc==="personas"
    ? `<span title="${esc(nombresDe(c.personas).join(', '))}">🧑 ${(c.personas||[]).length} comercial${(c.personas||[]).length===1?'':'es'}</span>`
    : alc==="comerciales"
      ? '<span>🧑‍💼 Todos los comerciales</span>'
      : `<span>👥 Tu equipo · ${(c.destinatarios||[]).length} comercial${(c.destinatarios||[]).length===1?'':'es'}</span>`;
  return `<div class="card">
    <div class="top"><span class="pill" style="background:#e7f7ee;color:#1b6b3e">📱 WhatsApp</span><h3>${esc(c.titulo||"")}</h3>${estadoPill(c)}</div>
    <div class="cuerpo" style="background:#f6faf9;border:1px solid #e5eae9;border-radius:9px;padding:9px 11px">${esc(c.waTexto||"")}</div>
    <div class="meta"><span>👤 ${esc(c.autor||"")}</span><span>🗓️ ${fD(c.ts)}</span>${destino}${c.hasta?`<span>⏳ hasta ${fD(c.hasta)}</span>`:''}</div>
    <div class="lecturas">
      <div class="who"><b id="reach-${c.id}">…</b> clientes lo recibieron por WhatsApp</div>
    </div>${actos(c)}</div>`;
}
/* Rellena "N clientes lo recibieron" contando partners con la nota [EyGWA] campana/<id> en Odoo. */
async function cargarAlcances(){
  const was = COMS.filter(c=>c && c.clase==="wa");
  await Promise.all(was.map(async c=>{
    const el=document.getElementById("reach-"+c.id); if(!el) return;
    try{
      const g=await EYG.rpc("mail.message","read_group",[[["model","=","res.partner"],["body","like","campana/"+c.id]]],["id"],["res_id"]);
      el.textContent = g.length;   // grupos por res_id = clientes distintos
    }catch(e){ el.textContent="?"; }
  }));
}

function editar(id){ const c=COMS.find(x=>x.id===id); if(!c) return;
  EDIT={...c, departamentos:(c.departamentos||[]).slice(), personas:(c.personas||[]).slice(), _deptFiltro:"", cuerpo: c.clase==="wa"?(c.waTexto||""):(c.cuerpo||"")};
  TAB="publicar"; render(); }
async function toggleActiva(id){ const arr=await EYG.comsLeer(); const c=arr.find(x=>x.id===id); if(!c) return; c.activo=(c.activo===false); await EYG.comsGuardar(arr); COMS=arr; render(); toast(c.activo?"Reactivada":"Desactivada", true); }
async function borrar(id){ if(!confirm("¿Borrar esto? No se puede deshacer.")) return; const arr=(await EYG.comsLeer()).filter(x=>x.id!==id); await EYG.comsGuardar(arr); COMS=arr; render(); toast("Borrado", true); }
</script>
