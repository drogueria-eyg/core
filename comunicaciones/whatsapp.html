  /* ══ archivar o eliminar una conversación ════════════════════════════════
     Archivar la saca de la bandeja y se puede recuperar. Eliminar la borra de
     Odoo y no vuelve. En los dos casos lo que el asistente aprendió queda: la
     memoria tiene su propia copia y no se toca.                              */
  /* Cuántos mensajes de este chat hay a salvo en Supabase, y cuántos hay en Odoo.
     Es la única prueba de que se guardó: esperar unos segundos y confiar no lo es. */
  async function aSalvo(id){
    const {count}=await EYG.supa().from("wsp_mensajes").select("id",{count:"exact",head:true}).eq("canal",id);
    return count||0;
  }
  async function enOdoo(id){
    const r=await EYG.rpc("mail.message","search_count",
      [[["model","=","discuss.channel"],["res_id","=",id]]],{});
    return Number(r)||0;
  }

  async function accionChat(id,nombre,a){
    /* Ni archivar ni borrar en modo mirar. El botón no se dibuja, pero el freno
       va también acá: la vista puede fallar, la regla no. */
    if(SOLO_MIRA) return;
    /* Antes de sacar la conversación de Odoo se fuerza el guardado: el copiado
       automático corre cada 10 minutos, así que si no se hace acá, lo último
       que se habló se pierde para siempre. Y se VERIFICA que haya quedado: el
       pedido es asíncrono y una espera fija no prueba nada. */
    let salvados=0;
    if(a==="borrar"||a==="archivar"){
      try{
        anotar("sis","guardando la conversación antes de "+(a==="borrar"?"borrarla":"archivarla"));
        const antes=await aSalvo(id);
        await EYG.supa().rpc("wsp_memoria_ahora",{que:"historial"});
        /* se espera a que la copia deje de crecer, hasta 20 s */
        let quieto=0;
        for(let i=0;i<20;i++){
          await new Promise(r=>setTimeout(r,1000));
          const ahora=await aSalvo(id);
          if(ahora>salvados){ salvados=ahora; quieto=0; } else if(salvados>0 && ++quieto>=3) break;
        }
        if(salvados<antes) salvados=antes;
        /* y se destila, para que lo aprendido quede en la libreta y no solo el crudo */
        await EYG.supa().rpc("wsp_memoria_ahora",{que:"destilar"}).catch(()=>{});
      }catch(e){ /* si algo falla, el aviso de abajo lo va a mostrar */ }
    }
    if(a==="borrar"){
      let hay=0; try{ hay=await enOdoo(id); }catch(e){}
      const completo=salvados>0 && salvados>=Math.floor(hay*0.9);
      const parte=completo
        ? `✔ Guardados ${salvados} mensajes. Quedan en la memoria del asistente aunque borres el chat.`
        : `⚠ ATENCIÓN: en Odoo hay ${hay} mensajes y solo pude guardar ${salvados}.\nSi borrás ahora, lo que falta se pierde para siempre.\nConviene cancelar, esperar unos minutos y volver a intentar.`;
      const escrito=prompt(`Se va a borrar la conversación con ${nombre} y todos sus mensajes en Odoo.\n\n${parte}\n\nEsto no se puede deshacer. Escribí BORRAR para confirmar:`);
      if((escrito||"").trim().toUpperCase()!=="BORRAR"){ anotar("sis","borrado cancelado · "+nombre); return; }
    }
    try{
      if(a==="borrar"){
        await EYG.rpc("discuss.channel","unlink",[[id]]);
        anotar("sis","conversación eliminada · "+nombre);
      }else{
        await EYG.rpc("discuss.channel","write",[[id],{active:a==="desarchivar"}]);
        anotar("sis",(a==="archivar"?"conversación archivada · ":"conversación recuperada · ")+nombre);
      }
      /* que no siga pausada ni asignada una conversación que ya no está en la bandeja */
      if(a!=="desarchivar"){
        cfg.pausadas=cfg.pausadas.filter(x=>x!==id);
        if(cfg.asignadas[id]) delete cfg.asignadas[id];
        await guardarCfg().catch(()=>{});
      }
      if(sel&&sel.id===id){ sel=null; msgs=[]; firmaMsgs=""; pintarChat(); }
      firmaConvs=""; await cargarConvs();
    }catch(err){ alert("No se pudo: "+(err.message||err)); }
  }

  /* ══ memoria del asistente ═══════════════════════════════════════════════
     Todo lo que se habla queda guardado (wsp_mensajes) y de ahí sale, solo,
     lo que el asistente aprende (wsp_memoria). Acá se mira, se corrige y se
     le enseña a mano. Lo que el bot cree que es una regla de la empresa NO
     se activa solo: cae en POR APROBAR.                                     */
  const CATS={horarios:"Horarios",envios:"Envíos",pagos:"Pagos",productos:"Productos",
              preferencias:"Preferencias",contacto:"Contacto",instruccion:"Instrucción",otro:"Otro"};
  const catNom=c=>CATS[c]||c;

  async function memEstado(){ try{ const {data}=await EYG.supa().rpc("wsp_memoria_estado"); return data||{}; }catch(e){ return {}; } }

  async function memLeer(filtro){
    let q=EYG.supa().from("wsp_memoria").select("id,ambito,partner,categoria,dato,fuente,destacado,activo,veces");
    if(filtro==="empresa")      q=q.eq("ambito","global").eq("activo",true);
    else if(filtro==="clientes") q=q.eq("ambito","cliente").eq("activo",true);
    else                         q=q.eq("activo",false);
    const {data}=await q.order("destacado",{ascending:false}).order("veces",{ascending:false}).order("id",{ascending:false}).limit(300);
    return data||[];
  }

  async function nombresDe(ids){
    const u=[...new Set(ids.filter(Boolean))]; if(!u.length) return {};
    try{ const r=await EYG.rpc("res.partner","read",[u,["name"]]); const m={}; (r||[]).forEach(p=>m[p.id]=p.name); return m; }
    catch(e){ return {}; }
  }

            <button class="memb no" data-a="borrar" title="Olvidar">✕</button>
          </div>
        </div>`).join("");
    }

    cuerpo.onclick=async e=>{
      const b=e.target.closest(".memb"); if(!b) return;
      const fila=b.closest(".memfila"), id=Number(fila.dataset.id), sb=EYG.supa();
      b.disabled=true;
      try{
        if(b.dataset.a==="borrar"){ await sb.from("wsp_memoria").delete().eq("id",id); fila.remove(); anotar("sis","memoria: dato olvidado"); }
        else if(b.dataset.a==="aprobar"){ await sb.from("wsp_memoria").update({activo:true,destacado:true,fuente:"aprobado"}).eq("id",id); fila.remove(); anotar("sis","memoria: sugerencia aprobada"); }
        else { const on=!b.classList.contains("on"); await sb.from("wsp_memoria").update({destacado:on}).eq("id",id); b.classList.toggle("on",on); }
      }catch(err){ alert("No se pudo: "+(err.message||err)); b.disabled=false; }
    };

    d.querySelectorAll(".memtab").forEach(t=>t.onclick=()=>{
      filtro=t.dataset.f;
      d.querySelectorAll(".memtab").forEach(o=>o.classList.toggle("act",o===t));
      pintar();
    });

    d.querySelector("#memAdd").onclick=async()=>{
      const txt=(d.querySelector("#memTxt").value||"").trim();
      if(txt.length<8){ alert("Escribí la regla completa, así el asistente la entiende."); return; }
      try{
        await EYG.supa().from("wsp_memoria").insert({
          ambito:"global", categoria:d.querySelector("#memCat").value, dato:txt,
          fuente:"cargado a mano", destacado:true, activo:true });
        d.querySelector("#memTxt").value="";
        anotar("sis","memoria: se le enseñó algo nuevo");
        if(filtro!=="empresa"){ filtro="empresa"; d.querySelectorAll(".memtab").forEach(o=>o.classList.toggle("act",o.dataset.f==="empresa")); }
        pintar();
      }catch(err){ alert(String(err.message||err).includes("duplicate") ? "Eso ya lo tenía anotado." : "No se pudo guardar: "+(err.message||err)); }
    };
    d.querySelector("#memTxt").addEventListener("keydown",e=>{ if(e.key==="Enter") d.querySelector("#memAdd").click(); });

    d.querySelector("#memRefrescar").onclick=async ev=>{
      ev.target.disabled=true; ev.target.textContent="LEYENDO…";
      try{
        await EYG.supa().rpc("wsp_memoria_ahora",{que:"historial"});
        await EYG.supa().rpc("wsp_memoria_ahora",{que:"destilar"});
        anotar("sis","memoria: releyendo las conversaciones");
        setTimeout(()=>{ ev.target.textContent="RELEER LAS CHARLAS"; ev.target.disabled=false; pintar(); },6000);
      }catch(err){ alert("No se pudo: "+(err.message||err)); ev.target.disabled=false; ev.target.textContent="RELEER LAS CHARLAS"; }
    };

    d.querySelector("#memX").onclick=()=>d.remove();
    d.onclick=e=>{ if(e.target===d) d.remove(); };
    pintar();
  }

  /* ══ acciones ══ */
  if($("btnCfg")) $("btnCfg").onclick=()=>{
    const d=document.createElement("div");
    d.className="scrim";
    d.innerHTML=`<div class="modal">
      <h3>El asistente de WhatsApp</h3>
      <p>Atiende a los clientes de punta a punta: pasa los precios reales de la lista de cada uno, escucha las notas de voz y le va armando el pedido en Odoo. El presupuesto queda <b>abierto</b> para que lo cierre el comercial asignado. Nunca da indicaciones médicas.</p>
      <label>NÚMEROS DE PRUEBA</label>
      <input id="cfgNums" value="${esc(cfg.numeros.join(", "))}" placeholder="3412809081, 3415551234">
      <div class="hint">Mientras haya números acá, el asistente <b>solo</b> le responde a ellos. Dejalo vacío para que atienda a todos los clientes.</div>
      <label>NOTAS DE VOZ</label>
      <div class="gente">
        ${Object.entries(VOCES).map(([k,v])=>`
          <div class="quien voz ${cfg.voz===k?"act":""}" data-voz="${k}">
            <span class="ini">${k==="off"?"✕":"🎙"}</span>
            <span class="nm">${esc(v)}</span>
            <span class="ct">${k==="espejo"?"recomendado":(k==="off"?"solo texto":"siempre audio")}</span>
          </div>`).join("")}
      </div>
      <div class="hint">Con «habla si le hablan», el asistente contesta con una nota de voz cuando el cliente le manda una. Si la respuesta lleva precios, además le manda el texto, para que pueda leerlos.</div>
      <label>MEMORIA</label>
      <div id="cfgMemBox" class="membox"><div class="memvacio">leyendo la memoria…</div></div>
      <div class="acc"><button class="hb sm" id="cfgMem">ADMINISTRAR MEMORIA</button><span style="flex:1"></span><button class="hb sm" id="cfgX">CANCELAR</button><button class="hb go sm" id="cfgOk">GUARDAR</button></div>
    </div>`;
    document.body.appendChild(d);
    let vozElegida=cfg.voz;
    d.querySelectorAll(".quien.voz").forEach(el=>el.onclick=()=>{
      vozElegida=el.dataset.voz;
      d.querySelectorAll(".quien.voz").forEach(o=>o.classList.toggle("act",o.dataset.voz===vozElegida));
    });
    pintarResumenMemoria(d.querySelector("#cfgMemBox"));
    d.querySelector("#cfgMem").onclick=()=>{ d.remove(); abrirMemoria(); };
    d.querySelector("#cfgX").onclick=()=>d.remove();
    d.onclick=e=>{ if(e.target===d) d.remove(); };
    d.querySelector("#cfgOk").onclick=async()=>{
      cfg.numeros=(d.querySelector("#cfgNums").value||"").split(",").map(x=>x.replace(/\D/g,"")).filter(Boolean);
      cfg.voz=vozElegida;
      await guardarCfg(); anotar("sis","configuración guardada · voz "+VOCES[cfg.voz].toLowerCase()); d.remove();
    };
  };

  if($("btnSw")) $("btnSw").onclick=async()=>{
    if(!cfg.activo && !cfg.numeros.length){
      if(!confirm("El asistente va a responderle AUTOMÁTICAMENTE a todos los clientes que escriban.\n\nSi querés probarlo primero, cancelá y cargá tu número en Configurar.\n\n¿Encender igual?")) return;
    }
    cfg.activo=!cfg.activo;
    anotar("sis",cfg.activo?"asistente encendido":"asistente apagado");
    await guardarCfg();
  };
  $("btnRef").onclick=async()=>{ await leerCfg(); await cargarConvs(); if(sel){ await abrir(sel.id,true); cargarFicha(); } cargarMetricas(); };

  (async()=>{
    anotar("sis","consola iniciada");
    await leerCfg(); await cargarEquipo(); await cargarConvs(); pintarChat(); cargarMetricas();
  })();

  /* Refresco vivo: el chat abierto cada 5 s, la bandeja cada 20 s y las métricas
     cada minuto. Como todo compara antes de repintar, no se ve ningún parpadeo. */
  let vueltas=0;
  /* ═══ El latido ═══════════════════════════════════════════════════════════
     Antes esta vuelta consultaba Odoo cada 5 segundos, POR PESTAÑA ABIERTA.
     Con seis comerciales adentro eran ~90 consultas por minuto: el pool de
     conexiones de Odoo se llenaba ("The Connection Pool Is Full"), una consulta
     trivial pasaba a tardar 19 segundos y EL BOT DEJABA DE CONTESTARLE A LOS
     CLIENTES. Una pantalla de monitoreo no puede romper la atención.

     Ahora se le pregunta a Supabase (milisegundos, no toca Odoo) si pasó algo.
     Solo si cambió —o cada 45 s por las dudas— se va a Odoo de verdad.        */
  let marcaPulso="", ultimoOdoo=0;
  async function huboNovedad(){
    try{
      const {data}=await EYG.supa().rpc("wsp_pulso");
      const m=Array.isArray(data)?(data[0]&&data[0].marca):(data&&data.marca)||data;
      if(m && m!==marcaPulso){ marcaPulso=m; return true; }
    }catch(e){ return true; }   // si el latido falla, se refresca igual
    return false;
  }
  /* Si la pestaña está en segundo plano no se refresca nada: nadie la está
     mirando y el navegador la deja abierta todo el día. */
  const mirando=()=>document.visibilityState==="visible";
  document.addEventListener("visibilitychange",()=>{ if(mirando()) ultimoOdoo=0; });

  setInterval(async()=>{
    if(cargando || !mirando()) return;
    const viejo = Date.now()-ultimoOdoo > 45000;
    const nuevo = await huboNovedad();
    if(!nuevo && !viejo) return;          // nada que hacer: Odoo ni se entera
    ultimoOdoo=Date.now();
    vueltas++;
    if(nuevo || vueltas%3===0) await cargarConvs();
    if(vueltas%8===0){ cargarMetricas(); if(sel) cargarFicha(); }
    if(sel) await abrir(sel.id,true);
  },5000);
});
</script>
</body>
</html>
