<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=41"></script>
<style>
  /* Consola de WhatsApp: el lenguaje del Asistente (HUD oscuro, orbe vivo)
     con la esencia de WhatsApp intacta — burbujas, verde y ritmo de chat. */
  :root{
    --hud-bg:#04090B; --hud-panel:#081114; --hud-line:#0F2A2C; --hud-line2:#123B3C;
    --hud-teal:#0AA89F; --hud-aqua:#5FC8BF; --hud-glow:#7FE0D6; --hud-dim:#3E6A66;
    --hud-txt:#C8E6E2; --hud-txt2:#6E9793; --hud-gold:#F0B15A; --hud-coral:#EC8B5E;
    --hud-ok:#3DDC97; --hud-err:#FF6B6B;
    --wsp:#25D366; --wsp-burb:#0A5C4C; --wsp-burb2:#0D7360;
    --chat-bg:#070F12; --burb-in:#111E23;
    --mono:'IBM Plex Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--hud-bg);min-height:100vh}
  body{font-family:'Archivo',sans-serif;color:var(--hud-txt);overflow:hidden}
  ::-webkit-scrollbar{width:7px;height:7px}
  ::-webkit-scrollbar-thumb{background:var(--hud-line2);border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}

  .hud{display:grid;grid-template-columns:336px 1fr;height:100vh}

  /* ── panel izquierdo: el orbe, los vitales y la bandeja ── */
  .pane{background:linear-gradient(180deg,var(--hud-panel),#050C0E);border-right:1px solid var(--hud-line);
        display:flex;flex-direction:column;overflow:hidden}
  .orbzone{position:relative;padding:10px 0 2px;flex:none}
  #orb{display:block;width:100%;height:132px}
  .orbtxt{text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:2.2px;color:var(--hud-dim);
          margin-top:-8px;padding-bottom:10px;transition:color .3s}
  .orbtxt.on{color:var(--hud-aqua)} .orbtxt.think{color:var(--hud-gold)} .orbtxt.talk{color:var(--wsp)}

  .ptitle{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:2.5px;color:var(--hud-txt2);
          border-bottom:1px solid var(--hud-line);padding:0 15px 8px;margin:0 0 10px}
  .vitals{padding:0 15px;display:flex;flex-direction:column;gap:8px;flex:none}
  .vit{display:flex;flex-direction:column;gap:2px;padding:9px 10px;border:1px solid var(--hud-line);border-radius:8px;background:rgba(10,168,159,.03)}
  .vit .k{font-family:var(--mono);font-size:9.5px;letter-spacing:1.6px;color:var(--hud-txt2);display:flex;align-items:center;gap:6px}
  .vit .v{font-size:14px;font-weight:800;color:var(--hud-txt);line-height:1.35;margin-top:2px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--hud-dim);flex:none}
  .dot.ok{background:var(--wsp);box-shadow:0 0 8px var(--wsp);animation:lat 2.4s infinite}
  .dot.warn{background:var(--hud-gold);box-shadow:0 0 7px var(--hud-gold)}
  @keyframes lat{0%,100%{opacity:1}50%{opacity:.35}}

  .acts{display:flex;gap:7px;padding:11px 15px 13px;flex:none;flex-wrap:wrap}
  .hb{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1.4px;color:var(--hud-aqua);
      background:rgba(10,168,159,.07);border:1px solid var(--hud-line2);border-radius:7px;padding:8px 11px;
      cursor:pointer;transition:background .14s,color .14s,border-color .14s;flex:1;text-align:center}
  .hb:hover{background:rgba(10,168,159,.17);color:var(--hud-glow)}
  .hb.go{color:var(--wsp);border-color:rgba(37,211,102,.35);background:rgba(37,211,102,.08)}
  .hb.go:hover{background:rgba(37,211,102,.18)}
  .hb.stop{color:var(--hud-coral);border-color:rgba(236,139,94,.3);background:rgba(236,139,94,.07)}
  .hb.stop:hover{background:rgba(236,139,94,.16)}
  .hb.sm{flex:none;padding:8px 10px}
  .hb:disabled{opacity:.45;cursor:default}

  .convs{flex:1;overflow-y:auto;padding:0 15px 15px;display:flex;flex-direction:column;gap:6px}
  .conv{border:1px solid var(--hud-line);border-radius:8px;padding:9px 10px;cursor:pointer;
        transition:border-color .14s,background .14s;position:relative}
  .conv:hover{border-color:var(--hud-line2);background:rgba(10,168,159,.05)}
  .conv.act{border-color:var(--hud-teal);background:rgba(10,168,159,.1)}
  .conv .n{font-size:12.5px;font-weight:700;color:var(--hud-txt);display:flex;align-items:center;gap:6px;line-height:1.3}
  .conv .n b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conv .t{font-family:var(--mono);font-size:9.5px;color:var(--hud-dim);margin-top:3px;display:flex;justify-content:space-between;gap:8px}
  .pin{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.8px;border-radius:20px;padding:2px 7px;flex:none}
  .pin.bot{background:rgba(37,211,102,.13);color:var(--wsp)}
  .pin.eq{background:rgba(236,139,94,.13);color:var(--hud-coral)}
  .vacio{padding:26px 4px;text-align:center;color:var(--hud-dim);font-family:var(--mono);font-size:10.5px;letter-spacing:1px;line-height:2}

  /* ── centro: el chat ── */
  .centro{display:flex;flex-direction:column;overflow:hidden;background:var(--hud-bg)}
  .top{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--hud-line);flex:none}
  .volver{font-family:var(--mono);font-size:10px;letter-spacing:1.8px;color:var(--hud-txt2);text-decoration:none;
          border:1px solid var(--hud-line);border-radius:6px;padding:5px 10px;transition:color .14s,border-color .14s}
  .volver:hover{color:var(--hud-glow);border-color:var(--hud-line2)}
  .brand{font-size:14px;font-weight:900;letter-spacing:3px;color:var(--hud-txt)}
  .brand span{color:var(--wsp)}
  .tag{font-family:var(--mono);font-size:9px;letter-spacing:1.6px;color:var(--hud-dim);border:1px solid var(--hud-line);border-radius:20px;padding:3px 9px}
  .reloj{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--hud-txt2);letter-spacing:1px}
  .reloj small{color:var(--hud-dim)}

  .chatH{display:flex;align-items:center;gap:11px;padding:11px 20px;border-bottom:1px solid var(--hud-line);flex:none;min-height:54px;flex-wrap:wrap}
  .av{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:800;color:#04241D;background:linear-gradient(135deg,var(--wsp),var(--hud-teal))}
  .chatH b{font-size:14px;font-weight:800;color:var(--hud-txt)}
  .chatH .num{font-family:var(--mono);font-size:10.5px;color:var(--hud-dim);letter-spacing:.6px}

  /* fondo de chat: trama sutil, guiño al papel de WhatsApp pero en oscuro */
  .msgs{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:7px;background:var(--chat-bg);
        background-image:radial-gradient(circle at 1px 1px, rgba(95,200,191,.05) 1px, transparent 0);background-size:22px 22px}
  .m{max-width:min(70%,560px);border-radius:10px;padding:8px 12px;font-size:13.5px;line-height:1.5;
     word-wrap:break-word;white-space:pre-wrap;position:relative;animation:brota .22s ease-out}
  @keyframes brota{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .m.in{align-self:flex-start;background:var(--burb-in);border:1px solid #17282F;border-bottom-left-radius:3px;color:#D6E7E4}
  .m.out{align-self:flex-end;background:linear-gradient(160deg,var(--wsp-burb2),var(--wsp-burb));border-bottom-right-radius:3px;color:#E8FBF3}
  .m.nota{align-self:center;max-width:min(84%,620px);background:rgba(240,177,90,.06);border:1px dashed rgba(240,177,90,.3);
          color:var(--hud-gold);font-family:var(--mono);font-size:11px;line-height:1.7;letter-spacing:.3px;border-radius:8px}
  .m .hora{display:block;font-family:var(--mono);font-size:9px;opacity:.5;text-align:right;margin-top:4px}
  .m .qui{display:block;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:1.1px;opacity:.65;margin-bottom:3px}
  .m.out.bot{box-shadow:0 0 0 1px rgba(37,211,102,.18)}

  /* "escribiendo…" — el mismo latido del orbe, en el chat */
  .tipeo{align-self:flex-start;display:flex;align-items:center;gap:5px;background:var(--burb-in);border:1px solid #17282F;
         border-radius:10px;border-bottom-left-radius:3px;padding:11px 13px}
  .tipeo i{width:6px;height:6px;border-radius:50%;background:var(--hud-aqua);display:block;animation:sube 1.3s infinite}
  .tipeo i:nth-child(2){animation-delay:.18s} .tipeo i:nth-child(3){animation-delay:.36s}
  @keyframes sube{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

  .pie{flex:none;border-top:1px solid var(--hud-line);background:var(--hud-panel)}
  .responder{display:flex;gap:10px;padding:12px 20px;align-items:flex-end}
  .responder textarea{flex:1;font-family:inherit;font-size:13.5px;color:var(--hud-txt);background:#0A171B;
    border:1px solid var(--hud-line);border-radius:10px;padding:10px 13px;resize:none;outline:none;max-height:110px;line-height:1.5;transition:border-color .16s,box-shadow .16s}
  .responder textarea::placeholder{color:var(--hud-dim)}
  .responder textarea:focus{border-color:var(--hud-teal);box-shadow:0 0 0 3px rgba(10,168,159,.1)}
  .enviar{flex:none;width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;font-size:17px;color:#04241D;
          background:linear-gradient(135deg,var(--wsp),var(--hud-teal));transition:filter .14s,transform .14s}
  .enviar:hover{filter:brightness(1.12);transform:scale(1.05)}
  .enviar:disabled{opacity:.4;cursor:default;transform:none}
  .aviso{padding:13px 20px;background:rgba(240,177,90,.06);color:var(--hud-gold);font-size:12.5px;line-height:1.6;border-top:1px solid rgba(240,177,90,.2)}
  .nada{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--hud-dim);
        font-family:var(--mono);font-size:11px;letter-spacing:2px;background:var(--chat-bg)}
  .nada b{font-size:34px;opacity:.25}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(2,8,10,.78);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:80;padding:18px}
  .modal{background:var(--hud-panel);border:1px solid var(--hud-line2);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.6);max-width:540px;width:100%;padding:24px}
  .modal h3{font-size:16px;font-weight:800;color:var(--hud-txt);letter-spacing:.4px;margin-bottom:6px}
  .modal p{font-size:13px;color:var(--hud-txt2);line-height:1.6;margin-bottom:10px}
  .modal label{display:block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1.6px;color:var(--hud-txt2);margin:16px 0 6px}
  .modal input{width:100%;font-family:var(--mono);font-size:13px;color:var(--hud-txt);background:#0A171B;border:1px solid var(--hud-line);border-radius:9px;padding:10px 12px;outline:none}
  .modal input:focus{border-color:var(--hud-teal)}
  .modal .hint{font-size:11.5px;color:var(--hud-dim);margin-top:7px;line-height:1.6}
  .modal .acc{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}

  @media(max-width:900px){
    body{overflow:auto}
    .hud{grid-template-columns:1fr;height:auto}
    .pane{border-right:0;border-bottom:1px solid var(--hud-line)}
    .convs{max-height:240px}
    .centro{height:auto} .msgs{min-height:340px}
  }
</style>
</head>
<body data-eyg-rail="no">
<div class="hud" id="app" style="display:none">

  <!-- ── PANEL: el asistente y la bandeja ── -->
  <aside class="pane">
    <div class="orbzone"><canvas id="orb"></canvas></div>
    <div class="orbtxt" id="orbtxt">EN REPOSO</div>

    <div class="ptitle">EL ASISTENTE</div>
    <div class="vitals">
      <div class="vit"><span class="k"><span class="dot" id="dEst"></span>ESTADO</span><span class="v" id="vEst">—</span></div>
      <div class="vit"><span class="k"><span class="dot" id="dAlc"></span>ALCANCE</span><span class="v" id="vAlc">—</span></div>
      <div class="vit"><span class="k"><span class="dot"></span>CONVERSACIONES</span><span class="v" id="vConv">—</span></div>
    </div>
    <div class="acts">
      <button class="hb go" id="btnSw">ENCENDER</button>
      <button class="hb sm" id="btnCfg">⚙</button>
      <button class="hb sm" id="btnRef">↻</button>
    </div>

    <div class="ptitle">BANDEJA</div>
    <div class="convs" id="convs"><div class="vacio">CARGANDO…</div></div>
  </aside>

  <!-- ── CENTRO: el chat ── -->
  <main class="centro">
    <div class="top">
      <a class="volver" href="../index.html">← CORE</a>
      <span class="brand">WHATS<span>APP</span> EyG</span>
      <span class="tag">CONSOLA · V2</span>
      <span class="reloj" id="reloj">--:--<small>.--</small></span>
    </div>
    <div class="chatH" id="chatH"><span class="num">ELEGÍ UNA CONVERSACIÓN</span></div>
    <div class="msgs" id="msgs"></div>
    <div class="pie" id="pie"></div>
  </main>
</div>

<script>
EYG.guard(["direccion","comercial","lider","admin"],{pruebas:["a3dfd1b309dd41ad2c8ae3562a8e00c09ae03f8dd8194b75eea5a3db5c003122"]}).then(perfil=>{
  const $=id=>document.getElementById(id);
  const PARAM="eyg.wsp_bot";
  const FIRMA="​";                       /* marca invisible de los mensajes del bot */
  let cfg={activo:false,numeros:[],pausadas:[]};
  let convs=[], sel=null, msgs=[], cargando=false, ultimoId=0;
  $("app").style.display="";

  const esc=EYG.esc;
  const hora=s=>{ try{ return EYG.argParts(s).hm; }catch(e){ return ""; } };
  const dia=s=>{ try{ const p=EYG.argParts(s); return p.date===EYG.argToday()?p.hm:p.date.slice(5).split("-").reverse().join("/"); }catch(e){ return ""; } };
  const inicial=n=>String(n||"?").trim().charAt(0).toUpperCase();

  /* ══ el orbe: respira en reposo, se agita cuando piensa, late al hablar ══ */
  const cv=$("orb"), cx=cv.getContext("2d");
  const PARTS=[]; const N=520;
  for(let i=0;i<N;i++){
    const th=Math.acos(2*Math.random()-1), ph=Math.random()*Math.PI*2;
    const r=0.55+Math.random()*0.45;
    PARTS.push({x:r*Math.sin(th)*Math.cos(ph), y:r*Math.cos(th), z:r*Math.sin(th)*Math.sin(ph),
                s:Math.random(), f:Math.random()*6.3});
  }
  const TONOS={
    off:      {c:[96,124,122], halo:"rgba(96,124,122,.05)", vel:.003, pul:1100, amp:.012, def:.02, txt:"EN REPOSO",     cls:""},
    escucha:  {c:[95,200,191], halo:"rgba(10,168,159,.09)", vel:.006, pul:900,  amp:.022, def:.04, txt:"A LA ESCUCHA",  cls:"on"},
    pensando: {c:[240,177,90], halo:"rgba(240,177,90,.12)", vel:.026, pul:240,  amp:.07,  def:.14, txt:"PENSANDO…",     cls:"think"},
    hablando: {c:[37,211,102], halo:"rgba(37,211,102,.14)", vel:.015, pul:380,  amp:.055, def:.19, txt:"RESPONDIENDO",  cls:"talk"},
  };
  let estado="off", tono=TONOS.off, ang=0;
  function setEstado(e){
    if(e===estado) return;
    estado=e; tono=TONOS[e]||TONOS.off;
    const t=$("orbtxt"); t.textContent=tono.txt; t.className="orbtxt "+tono.cls;
  }
  function dibujar(){
    const W=cv.clientWidth, H=cv.clientHeight;
    if(!W||!H){ requestAnimationFrame(dibujar); return; }
    if(cv.width!==W*2||cv.height!==H*2){ cv.width=W*2; cv.height=H*2; }
    cx.setTransform(2,0,0,2,0,0); cx.clearRect(0,0,W,H);
    const R=Math.min(W,H)*0.40, cxp=W/2, cyp=H/2, t=Date.now();
    ang+=tono.vel;
    const puls=1+Math.sin(t/tono.pul)*tono.amp;
    const cos=Math.cos(ang), sin=Math.sin(ang);
    const [cr,cg,cb]=tono.c;
    for(const p of PARTS){
      /* la deformación es lo que hace que "cambie de forma" al hablar */
      const d=1+tono.def*Math.sin(p.f+t/260+p.y*2.4);
      const x=(p.x*cos-p.z*sin)*d, z=(p.x*sin+p.z*cos)*d, y=p.y*d;
      const e=1/(1.7-z*0.7);
      const a=Math.max(0,(z+1)/2)*0.85+0.08;
      cx.beginPath();
      cx.fillStyle=`rgba(${cr+z*22|0},${cg+z*20|0},${cb+z*22|0},${a})`;
      cx.arc(cxp+x*R*e*puls, cyp+y*R*e*puls, (p.s*1.5+0.45)*e, 0, 7);
      cx.fill();
    }
    const g=cx.createRadialGradient(cxp,cyp,R*0.2,cxp,cyp,R*1.3);
    g.addColorStop(0,tono.halo); g.addColorStop(1,"rgba(0,0,0,0)");
    cx.fillStyle=g; cx.fillRect(0,0,W,H);
    requestAnimationFrame(dibujar);
  }
  requestAnimationFrame(dibujar);

  (function reloj(){
    const d=new Date(), p=n=>String(n).padStart(2,"0");
    $("reloj").innerHTML=`${p(d.getHours())}:${p(d.getMinutes())}<small>.${p(d.getSeconds())}</small>`;
    setTimeout(reloj,1000);
  })();

  /* ── quién está esperando respuesta: si el último mensaje es del cliente y el
        bot está a cargo de ese chat, es porque está pensando la respuesta ── */
  let hablandoHasta=0;
  function estadoDelBot(){
    if(Date.now()<hablandoHasta) return "hablando";
    if(!cfg.activo) return "off";
    if(sel && esperandoRespuesta()) return "pensando";
    return "escucha";
  }
  function esperandoRespuesta(){
    if(!sel || cfg.pausadas.includes(sel.id)) return false;
    const pid=Array.isArray(sel.whatsapp_partner_id)?sel.whatsapp_partner_id[0]:null;
    for(let i=msgs.length-1;i>=0;i--){
      const m=msgs[i];
      if(m.message_type!=="whatsapp_message") continue;
      return Array.isArray(m.author_id) && pid && m.author_id[0]===pid;
    }
    return false;
  }
  function refrescarOrbe(){ setEstado(estadoDelBot()); }
  setInterval(refrescarOrbe,600);

  /* ══ configuración del bot (parámetro de Odoo) ══ */
  async function leerCfg(){
    try{
      const raw=await EYG.rpc("ir.config_parameter","get_param",[PARAM]);
      const c=JSON.parse(raw||"{}")||{};
      cfg={activo:c.activo===true, numeros:Array.isArray(c.numeros)?c.numeros:[], pausadas:Array.isArray(c.pausadas)?c.pausadas:[]};
    }catch(e){ cfg={activo:false,numeros:[],pausadas:[]}; }
    pintarBot();
  }
  async function guardarCfg(){
    await EYG.rpc("ir.config_parameter","set_param",[PARAM,JSON.stringify(cfg)]);
    pintarBot(); pintarConvs();
  }
  function pintarBot(){
    const n=cfg.numeros.length, p=cfg.pausadas.length;
    $("dEst").className="dot "+(cfg.activo?"ok":"");
    $("vEst").textContent=cfg.activo?"Atendiendo":"Apagado";
    $("dAlc").className="dot "+(cfg.activo?(n?"warn":"ok"):"");
    $("vAlc").textContent=!cfg.activo ? "Contesta el equipo"
      : (n? `Solo ${n} número${n>1?"s":""} de prueba` : "Todos los clientes");
    $("vConv").textContent=`${convs.length} abierta${convs.length===1?"":"s"}`+(p?` · ${p} en manos del equipo`:"");
    const b=$("btnSw");
    b.className="hb "+(cfg.activo?"stop":"go");
    b.textContent=cfg.activo?"APAGAR":"ENCENDER";
    refrescarOrbe();
  }

  /* ══ bandeja ══ */
  async function cargarConvs(){
    try{
      const r=await EYG.rpc("discuss.channel","search_read",[[["channel_type","=","whatsapp"]]],
        {fields:["name","whatsapp_number","whatsapp_partner_id","whatsapp_channel_valid_until","write_date"],order:"write_date desc",limit:60});
      convs=r||[];
    }catch(e){ convs=[]; }
    pintarConvs(); pintarBot();
  }
  function pintarConvs(){
    const c=$("convs");
    if(!convs.length){ c.innerHTML='<div class="vacio">SIN CONVERSACIONES<br>—<br>APARECEN SOLAS CUANDO<br>UN CLIENTE ESCRIBE</div>'; return; }
    c.innerHTML=convs.map(v=>{
      const eq=cfg.pausadas.includes(v.id);
      const nom=(Array.isArray(v.whatsapp_partner_id)&&v.whatsapp_partner_id[1])||v.name||v.whatsapp_number||"Sin nombre";
      return `<div class="conv ${sel&&sel.id===v.id?"act":""}" data-id="${v.id}">
        <div class="n"><b>${esc(nom)}</b>${eq?'<span class="pin eq">EQUIPO</span>':(cfg.activo?'<span class="pin bot">BOT</span>':"")}</div>
        <div class="t"><span>${esc(v.whatsapp_number||"")}</span><span>${esc(dia(v.write_date))}</span></div>
      </div>`;
    }).join("");
    c.querySelectorAll(".conv").forEach(el=>el.onclick=()=>abrir(Number(el.dataset.id)));
  }

  async function abrir(id,silencioso){
    const previo=sel&&sel.id===id;
    sel=convs.find(v=>v.id===id)||sel;
    if(!sel) return;
    if(!previo){ pintarConvs(); $("msgs").innerHTML='<div class="vacio">CARGANDO…</div>'; }
    try{
      const r=await EYG.rpc("mail.message","search_read",[[["model","=","discuss.channel"],["res_id","=",id]]],
        {fields:["body","author_id","message_type","date","subtype_id"],order:"id desc",limit:80});
      msgs=(r||[]).slice().reverse();
    }catch(e){ if(!silencioso) msgs=[]; }
    /* si entró una respuesta nueva del bot, el orbe "habla" un momento */
    const ult=msgs.length?msgs[msgs.length-1]:null;
    if(ult && ult.id!==ultimoId){
      const pid=Array.isArray(sel.whatsapp_partner_id)?sel.whatsapp_partner_id[0]:null;
      const mio=!(Array.isArray(ult.author_id)&&pid&&ult.author_id[0]===pid);
      if(ultimoId && mio && String(ult.body||"").includes(FIRMA)) hablandoHasta=Date.now()+3200;
      ultimoId=ult.id;
    }
    pintarChat(previo);
    refrescarOrbe();
  }

  function pintarChat(mantenerScroll){
    if(!sel){
      $("chatH").innerHTML='<span class="num">ELEGÍ UNA CONVERSACIÓN</span>';
      $("msgs").innerHTML='<div class="nada"><b>💬</b>BANDEJA DE WHATSAPP</div>'; $("pie").innerHTML=""; return;
    }
    const nom=(Array.isArray(sel.whatsapp_partner_id)&&sel.whatsapp_partner_id[1])||sel.name||sel.whatsapp_number;
    const eq=cfg.pausadas.includes(sel.id);
    $("chatH").innerHTML=`<div class="av">${esc(inicial(nom))}</div>
      <div><b>${esc(nom)}</b><br><span class="num">${esc(sel.whatsapp_number||"")}</span></div>
      <button class="hb ${eq?"":"stop"}" id="btnTomar" style="margin-left:auto;flex:none">${eq?"DEVOLVER AL BOT":"TOMAR CONVERSACIÓN"}</button>`;
    $("btnTomar").onclick=async()=>{
      if(eq) cfg.pausadas=cfg.pausadas.filter(x=>x!==sel.id);
      else cfg.pausadas=[...new Set([...cfg.pausadas,sel.id])];
      await guardarCfg(); pintarChat();
    };

    const pid=Array.isArray(sel.whatsapp_partner_id)?sel.whatsapp_partner_id[0]:null;
    const caja=$("msgs");
    const abajo = !mantenerScroll || (caja.scrollHeight-caja.scrollTop-caja.clientHeight)<80;
    let html=msgs.map(m=>{
      const txt=String(m.body||"").replace(/<br\s*\/?>/gi,"\n").replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/[ \t]+/g," ").split(FIRMA).join("").trim();
      if(!txt) return "";
      const nota=Array.isArray(m.subtype_id)&&/note|nota/i.test(m.subtype_id[1]||"");
      if(nota) return `<div class="m nota">${esc(txt)}<span class="hora">${esc(hora(m.date))}</span></div>`;
      const delCliente=Array.isArray(m.author_id)&&pid&&m.author_id[0]===pid;
      const delBot=!delCliente&&String(m.body||"").includes(FIRMA);
      const quien=!delCliente ? `<span class="qui">${delBot?"ASISTENTE":esc((m.author_id&&m.author_id[1])||"EQUIPO")}</span>` : "";
      return `<div class="m ${delCliente?"in":"out"}${delBot?" bot":""}">${quien}${esc(txt)}<span class="hora">${esc(hora(m.date))}</span></div>`;
    }).join("");
    if(!html) html='<div class="nada"><b>💬</b>SIN MENSAJES</div>';
    if(esperandoRespuesta()) html+='<div class="tipeo"><i></i><i></i><i></i></div>';
    caja.innerHTML=html;
    if(abajo) caja.scrollTop=caja.scrollHeight;

    /* ventana de 24 h: WhatsApp solo deja responder libremente dentro de las 24 h
       del último mensaje del cliente. Después hay que usar una plantilla aprobada. */
    const hasta=sel.whatsapp_channel_valid_until?new Date(String(sel.whatsapp_channel_valid_until).replace(" ","T")+"Z"):null;
    const abierta=hasta && hasta.getTime()>Date.now();
    const yaHabia=$("txt")?$("txt").value:"";
    $("pie").innerHTML = (abierta || !hasta)
      ? `<div class="responder"><textarea id="txt" rows="1" placeholder="Escribí tu respuesta…"></textarea><button class="enviar" id="btnEnv" title="Enviar">➤</button></div>`
      : `<div class="aviso">⏳ Pasaron más de 24 horas desde el último mensaje del cliente. WhatsApp no permite escribirle libremente: hay que esperar a que escriba o mandarle una plantilla aprobada desde Odoo.</div>`;
    const t=$("txt");
    if(t){
      t.value=yaHabia;
      t.addEventListener("input",()=>{ t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,110)+"px"; });
      t.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); enviar(); } });
      $("btnEnv").onclick=enviar;
      if(!mantenerScroll) t.focus();
    }
  }

  async function enviar(){
    const t=$("txt"); if(!t) return;
    const v=(t.value||"").trim(); if(!v||cargando||!sel) return;
    cargando=true; $("btnEnv").disabled=true; t.value=""; t.style.height="auto";
    try{
      await EYG.rpc("discuss.channel","message_post",[sel.id],
        {body:esc(v).replace(/\n/g,"<br>"), message_type:"whatsapp_message", subtype_xmlid:"mail.mt_comment"});
      /* al responder una persona, la conversación queda tomada por el equipo */
      if(!cfg.pausadas.includes(sel.id)){ cfg.pausadas=[...cfg.pausadas,sel.id]; await guardarCfg(); }
      await abrir(sel.id);
    }catch(e){
      alert("No pude enviar el mensaje: "+(e.message||e));
      t.value=v;
    }
    cargando=false; const b=$("btnEnv"); if(b) b.disabled=false;
  }

  /* ══ configuración ══ */
  $("btnCfg").onclick=()=>{
    const d=document.createElement("div");
    d.className="scrim";
    d.innerHTML=`<div class="modal">
      <h3>El asistente de WhatsApp</h3>
      <p>Atiende a los clientes de punta a punta: pasa los precios reales de la lista de cada uno, escucha las notas de voz y le va armando el pedido en Odoo. El presupuesto queda <b>abierto</b> para que lo cierre el comercial asignado. Nunca da indicaciones médicas.</p>
      <label>NÚMEROS DE PRUEBA</label>
      <input id="cfgNums" value="${esc(cfg.numeros.join(", "))}" placeholder="3412809081, 3415551234">
      <div class="hint">Mientras haya números acá, el asistente <b>solo</b> le responde a ellos. Dejalo vacío para que atienda a todos los clientes.</div>
      <div class="acc"><button class="hb sm" id="cfgX">CANCELAR</button><button class="hb go sm" id="cfgOk">GUARDAR</button></div>
    </div>`;
    document.body.appendChild(d);
    d.querySelector("#cfgX").onclick=()=>d.remove();
    d.onclick=e=>{ if(e.target===d) d.remove(); };
    d.querySelector("#cfgOk").onclick=async()=>{
      cfg.numeros=(d.querySelector("#cfgNums").value||"").split(",").map(x=>x.replace(/\D/g,"")).filter(Boolean);
      await guardarCfg(); d.remove();
    };
  };

  $("btnSw").onclick=async()=>{
    if(!cfg.activo && !cfg.numeros.length){
      if(!confirm("El asistente va a responderle AUTOMÁTICAMENTE a todos los clientes que escriban.\n\nSi querés probarlo primero, cancelá y cargá tu número en Configurar.\n\n¿Encender igual?")) return;
    }
    cfg.activo=!cfg.activo; await guardarCfg();
  };
  $("btnRef").onclick=async()=>{ await leerCfg(); await cargarConvs(); if(sel) await abrir(sel.id,true); };

  (async()=>{ await leerCfg(); await cargarConvs(); pintarChat(); })();

  /* refresco vivo: cada 5 s si hay un chat abierto (para ver llegar la respuesta
     del asistente), y la bandeja completa cada 20 s. Nunca pisa lo que estás escribiendo. */
  let vueltas=0;
  setInterval(async()=>{
    if(cargando) return;
    vueltas++;
    if(vueltas%4===0) await cargarConvs();
    if(sel) await abrir(sel.id,true);
  },5000);
});
</script>
</body>
</html>
