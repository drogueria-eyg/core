<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=50"></script>
<style>
  /* Tres columnas: la bandeja limpia a la izquierda, el chat al medio y todo
     el asistente a la derecha (orbe, ficha del contacto, lo que va pasando y
     los números del día). Nada se repinta si no cambió: sin parpadeo. */
  :root{
    --hud-bg:#04090B; --hud-panel:#081114; --hud-line:#0F2A2C; --hud-line2:#123B3C;
    --hud-teal:#0AA89F; --hud-aqua:#5FC8BF; --hud-glow:#7FE0D6; --hud-dim:#3E6A66;
    --hud-txt:#C8E6E2; --hud-txt2:#6E9793; --hud-gold:#F0B15A; --hud-coral:#EC8B5E;
    --hud-ok:#3DDC97; --hud-err:#FF6B6B; --hud-lila:#9F8CFF;
    --wsp:#25D366; --wsp-burb:#0A5C4C; --wsp-burb2:#0D7360;
    --chat-bg:#070F12; --burb-in:#111E23;
    --mono:'IBM Plex Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--hud-bg);min-height:100vh}
  body{font-family:'Archivo',sans-serif;color:var(--hud-txt);overflow:hidden}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:var(--hud-line2);border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}

  /* La columna de contactos va más ancha: al chat le sobraba espacio y acá los
     nombres de farmacia son largos y se cortaban. */
  .hud{display:grid;grid-template-columns:360px 1fr 360px;height:100vh}
  .col{display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,var(--hud-panel),#050C0E)}
  .col.izq{border-right:1px solid var(--hud-line)}
  .col.der{border-left:1px solid var(--hud-line)}
  .ptitle{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:2.4px;color:var(--hud-txt2);
          border-bottom:1px solid var(--hud-line);padding:12px 16px 9px;display:flex;align-items:center;gap:8px;flex:none}
  .ptitle .n{margin-left:auto;color:var(--hud-dim);letter-spacing:1px}

  /* ── bandeja ── */
  .buscador{padding:10px 14px;flex:none}
  .buscador input{width:100%;font-family:inherit;font-size:12.5px;color:var(--hud-txt);background:#0A171B;
    border:1px solid var(--hud-line);border-radius:8px;padding:8px 11px;outline:none}
  .buscador input:focus{border-color:var(--hud-teal)}
  .buscador input::placeholder{color:var(--hud-dim)}
  .convs{flex:1;overflow-y:auto;padding:0 12px 14px;display:flex;flex-direction:column;gap:5px}
  .conv{position:relative;border:1px solid transparent;border-left:2px solid transparent;border-radius:8px;padding:9px 10px;cursor:pointer;
        transition:background .14s,border-color .14s;background:rgba(255,255,255,.015)}
  /* Atajos de archivar y borrar. Aparecen al pasar por encima y, para no
     montarse sobre el chip ni la fecha, esos se desvanecen mientras tanto. */
  .cvacc{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;gap:5px;
         opacity:0;pointer-events:none;transition:opacity .12s}
  .conv .pin,.conv .t span:last-child{transition:opacity .12s}
  .conv:hover .cvacc{opacity:1;pointer-events:auto}
  .conv:hover .pin,.conv:hover .t span:last-child{opacity:0}
  .cvb{width:26px;height:26px;border-radius:7px;border:1px solid var(--hud-line2);background:var(--hud-panel);
       color:var(--hud-txt2);cursor:pointer;font-size:11px;line-height:1;padding:0}
  .cvb:hover{border-color:var(--hud-teal);color:var(--hud-teal);background:rgba(10,168,159,.12)}
  .cvb.no:hover{border-color:#D2564B;color:#D2564B;background:rgba(210,86,75,.12)}
  /* En pantallas táctiles no hay "pasar por encima": se reserva el lugar */
  @media(hover:none){
    .conv{padding-right:66px}
    .cvacc{opacity:1;pointer-events:auto}
  }
  .conv:hover{background:rgba(10,168,159,.06)}
  .conv.act{background:rgba(10,168,159,.11);border-left-color:var(--hud-teal)}
  .conv .n{font-size:12.5px;font-weight:700;color:var(--hud-txt);line-height:1.3;display:flex;align-items:center;gap:6px}
  /* Charla en curso: un punto que late, nada más. Tiene que verse de reojo sin
     robarle atención al nombre, que es lo que se lee. */
  .conv .vivo{flex:none;width:6px;height:6px;border-radius:50%;background:var(--hud-teal);
              box-shadow:0 0 0 0 rgba(10,168,159,.55);animation:latir 2.4s ease-out infinite}
  @keyframes latir{0%{box-shadow:0 0 0 0 rgba(10,168,159,.5)}70%{box-shadow:0 0 0 6px rgba(10,168,159,0)}100%{box-shadow:0 0 0 0 rgba(10,168,159,0)}}
  @media (prefers-reduced-motion:reduce){ .conv .vivo{animation:none} }
  .conv .n b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .conv .t{font-family:var(--mono);font-size:9.5px;color:var(--hud-dim);margin-top:3px;display:flex;justify-content:space-between;gap:8px}
  .pin{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.7px;border-radius:20px;padding:2px 6px;flex:none}
  .pin.bot{background:rgba(37,211,102,.13);color:var(--wsp)}
  .pin.eq{background:rgba(236,139,94,.13);color:var(--hud-coral)}
  .pin.asig{background:rgba(159,140,255,.14);color:var(--hud-lila)}
  /* Gente de casa: sin relleno, solo un contorno tenue. No compite con el resto. */
  .pin.casa{background:transparent;border:1px solid var(--hud-line2);color:var(--hud-txt2);letter-spacing:1px;padding:1px 6px}
  /* Un color por área. Sombreados suaves a propósito: el nombre tiene que
     seguir siendo lo que más pesa en la fila, el chip solo acompaña. */
  .pin.pcargo,.chip[class*="eq-"]{letter-spacing:1px}
  .p-ger,.eq-ger{background:rgba(155,124,214,.15);color:#b49ae0}   /* Gerencia   */
  .p-dir,.eq-dir{background:rgba(90,148,224,.15);color:#7fb0ea}    /* Dirección  */
  .p-tec,.eq-tec{background:rgba(88,196,178,.15);color:#63cbb6}    /* Dir. Técnica */
  .p-ven,.eq-ven{background:rgba(10,168,159,.15);color:#3ec8bd}    /* Ventas     */
  .p-cob,.eq-cob{background:rgba(236,139,94,.15);color:#eda06f}    /* Cobranzas  */
  .p-fin,.eq-fin{background:rgba(214,168,84,.15);color:#dcb765}    /* Finanzas   */
  .p-dep,.eq-dep{background:rgba(140,150,165,.15);color:#a3adbd}   /* Depósito   */
  .p-eqp,.eq-eqp{background:rgba(140,150,165,.13);color:#9aa4b3}
  /* La división, más tenue todavía: es el segundo dato, no el primero */
  .p-far,.eq-far{background:rgba(10,168,159,.09);color:#5fb9b1}
  .p-ins,.eq-ins{background:rgba(90,148,224,.09);color:#8fb6e6}
  .p-lid,.eq-lid{background:rgba(214,168,84,.13);color:#dcb765}
  /* Cliente / no cliente: lo que importa saber del que escribe */
  .p-cli{background:rgba(37,211,102,.13);color:var(--wsp)}
  .p-nocli{background:rgba(140,150,165,.12);color:#9aa4b3}
  .vacio{padding:24px 6px;text-align:center;color:var(--hud-dim);font-family:var(--mono);font-size:10px;letter-spacing:1px;line-height:2}

  /* ── centro: el chat ── */
  .centro{display:flex;flex-direction:column;overflow:hidden;background:var(--hud-bg)}
  .top{display:flex;align-items:center;gap:13px;padding:11px 20px;border-bottom:1px solid var(--hud-line);flex:none}
  .volver{font-family:var(--mono);font-size:9.5px;letter-spacing:1.7px;color:var(--hud-txt2);text-decoration:none;
          border:1px solid var(--hud-line);border-radius:6px;padding:5px 10px;transition:color .14s,border-color .14s}
  .volver:hover{color:var(--hud-glow);border-color:var(--hud-line2)}
  /* El encabezado habla el mismo idioma que los títulos de las columnas:
     mono, espaciado y discreto. La única marca es el punto, que late cuando
     el asistente está atendiendo. */
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;font-weight:700;
         letter-spacing:3.2px;color:var(--hud-txt2)}
  .brand i{width:6px;height:6px;border-radius:50%;background:var(--hud-dim);flex:none;transition:background .35s,box-shadow .35s}
  .brand i.on{background:var(--wsp);box-shadow:0 0 9px var(--wsp);animation:lat 2.4s infinite}
  .reloj{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--hud-txt2);letter-spacing:1px}
  .reloj small{color:var(--hud-dim)}

  .chatH{display:flex;align-items:center;gap:11px;padding:10px 20px;border-bottom:1px solid var(--hud-line);flex:none;min-height:52px}
  .av{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
      font-size:11.5px;font-weight:700;color:var(--hud-glow);background:rgba(10,168,159,.12);border:1px solid var(--hud-line2)}
  .chatH b{font-size:13px;font-weight:700;color:var(--hud-txt);letter-spacing:.2px}
  .chatH .num{font-family:var(--mono);font-size:10px;color:var(--hud-dim);letter-spacing:.5px}

  .msgs{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:7px;background:var(--chat-bg);
        background-image:radial-gradient(circle at 1px 1px, rgba(95,200,191,.05) 1px, transparent 0);background-size:22px 22px}
  /* Texto de lectura, no de titular: cuerpo liviano, línea más aireada y
     colores apagados. El verde de WhatsApp está, pero sin gradiente ni brillo. */
  .m{max-width:min(70%,570px);border-radius:13px;padding:9px 13px;font-size:12px;font-weight:400;
     line-height:1.6;letter-spacing:.15px;word-wrap:break-word;white-space:pre-wrap;animation:brota .2s ease-out;
     backdrop-filter:blur(3px);box-shadow:0 1px 10px rgba(0,0,0,.22)}
  @keyframes brota{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  /* Los globos no son bloques planos: un degradé sutil y algo de transparencia
     para que la trama del fondo se insinúe y acompañen al resto del panel. */
  .m.in{align-self:flex-start;border:1px solid rgba(120,190,185,.13);border-bottom-left-radius:4px;color:#C4D9D6;
        background:linear-gradient(158deg, rgba(23,42,49,.82) 0%, rgba(12,24,29,.68) 100%)}
  .m.out{align-self:flex-end;border:1px solid rgba(37,211,102,.16);border-bottom-right-radius:4px;color:#DAF0E7;
         background:linear-gradient(158deg, rgba(15,92,74,.86) 0%, rgba(8,55,46,.7) 100%)}
  .m.nota{align-self:center;max-width:min(84%,620px);background:rgba(240,177,90,.05);border:1px dashed rgba(240,177,90,.24);
          color:var(--hud-gold);font-family:var(--mono);font-size:10px;line-height:1.7;border-radius:9px;letter-spacing:0}
  .m .hora{display:block;font-family:var(--mono);font-size:8.5px;opacity:.38;text-align:right;margin-top:5px;letter-spacing:.5px}
  .m .qui{display:block;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:1.6px;opacity:.42;margin-bottom:4px}
  .tipeo{align-self:flex-start;display:flex;align-items:center;gap:5px;background:var(--burb-in);border:1px solid #17282F;
         border-radius:10px;border-bottom-left-radius:3px;padding:11px 13px}
  .tipeo i{width:6px;height:6px;border-radius:50%;background:var(--hud-aqua);display:block;animation:sube 1.3s infinite}
  .tipeo i:nth-child(2){animation-delay:.18s} .tipeo i:nth-child(3){animation-delay:.36s}
  @keyframes sube{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

  /* El pie no corta con una línea dura: se funde con el chat y el cuadro de
     texto casi no tiene borde hasta que lo tocás. */
  .m.out:not(.bot){background:linear-gradient(158deg, rgba(24,66,76,.86) 0%, rgba(13,40,47,.7) 100%);border-color:rgba(236,139,94,.18);color:#D3E6E4}
  .pie{flex:none;background:linear-gradient(180deg,transparent,rgba(8,17,20,.9) 42%,var(--hud-panel));
       box-shadow:inset 0 1px 0 rgba(18,59,60,.5)}
  .responder{display:flex;gap:11px;padding:14px 22px 16px;align-items:flex-end}
  .responder textarea{flex:1;font-family:inherit;font-size:13px;font-weight:400;letter-spacing:.15px;line-height:1.6;
    color:var(--hud-txt);background:#0A161A;border:1px solid #14252A;border-radius:15px;padding:11px 16px;
    resize:none;outline:none;max-height:110px;transition:border-color .2s,box-shadow .2s,background .2s}
  .responder textarea::placeholder{color:#33534F}
  .responder textarea:focus{border-color:rgba(10,168,159,.38);background:#0C1B20;box-shadow:0 0 0 4px rgba(10,168,159,.06)}
  .enviar{flex:none;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:14px;
          color:var(--wsp);background:rgba(37,211,102,.09);border:1px solid rgba(37,211,102,.22);
          transition:background .18s,color .18s,transform .18s,border-color .18s}
  .enviar:hover{background:var(--wsp);color:#04241D;border-color:var(--wsp);transform:scale(1.06)}
  .enviar:disabled{opacity:.35;cursor:default;transform:none;background:rgba(37,211,102,.06)}
  .aviso{padding:13px 20px;background:rgba(240,177,90,.06);color:var(--hud-gold);font-size:12.5px;line-height:1.6;border-top:1px solid rgba(240,177,90,.2)}
  .nada{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--hud-dim);
        font-family:var(--mono);font-size:10.5px;letter-spacing:2px;background:var(--chat-bg)}
  .nada b{font-size:32px;opacity:.22}

  /* ── derecha: el asistente ── */
  .der .cuerpo{flex:1;overflow-y:auto;min-height:0}
  /* El orbe manda: es lo que le da vida al panel, así que ocupa lugar y no
     tiene nada encima que le compita. Los mandos se fueron al encabezado. */
  .orbzone{position:relative;flex:none;padding:6px 0 2px}
  #orb{display:block;width:100%;height:196px}
  .orbtxt{text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:3.4px;color:var(--hud-dim);
          margin-top:-20px;transition:color .35s;font-weight:700}
  .orbtxt.on{color:var(--hud-aqua)} .orbtxt.think{color:var(--hud-gold)} .orbtxt.talk{color:var(--wsp)}
  /* los dos estados nuevos: "con el equipo" y "sin contestar" */
  .orbtxt.coral{color:var(--hud-coral)} .orbtxt.bad{color:#E5645C}
  .orbsub{text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:1.8px;color:var(--hud-dim);
          padding:7px 16px 16px}
  .orbsub b{color:var(--hud-txt2);font-weight:700}

  /* Mandos del asistente, arriba del todo y chicos */
  .mandos{margin-left:auto;display:flex;gap:5px}
  .mando{width:26px;height:26px;border-radius:7px;cursor:pointer;font-size:11px;line-height:1;font-family:inherit;
         color:var(--hud-txt2);background:rgba(10,168,159,.05);border:1px solid var(--hud-line);
         display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s,border-color .15s}
  .mando:hover{color:var(--hud-glow);border-color:var(--hud-line2);background:rgba(10,168,159,.16)}
  .mando.on{color:var(--wsp);border-color:rgba(37,211,102,.32);background:rgba(37,211,102,.1)}
  .mando.on:hover{background:rgba(37,211,102,.2);color:var(--wsp)}
  .mando.off{color:var(--hud-coral);border-color:rgba(236,139,94,.28);background:rgba(236,139,94,.07)}
  .mando.off:hover{background:rgba(236,139,94,.16);color:var(--hud-coral)}
  .hb{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:1.3px;color:var(--hud-aqua);
      background:rgba(10,168,159,.07);border:1px solid var(--hud-line2);border-radius:7px;padding:8px 10px;
      cursor:pointer;transition:background .14s,color .14s;flex:1;text-align:center}
  .hb:hover{background:rgba(10,168,159,.17);color:var(--hud-glow)}
  .hb.go{color:var(--wsp);border-color:rgba(37,211,102,.32);background:rgba(37,211,102,.08)}
  .hb.go:hover{background:rgba(37,211,102,.18)}
  .hb.stop{color:var(--hud-coral);border-color:rgba(236,139,94,.3);background:rgba(236,139,94,.07)}
  .hb.stop:hover{background:rgba(236,139,94,.16)}
  .hb.lila{color:var(--hud-lila);border-color:rgba(159,140,255,.3);background:rgba(159,140,255,.07)}
  .hb.lila:hover{background:rgba(159,140,255,.17)}
  .hb.sm{flex:none;padding:8px 11px}
  .m .voznota{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;letter-spacing:1px;
              opacity:.75;border:1px solid currentColor;border-radius:20px;padding:1px 7px;margin-bottom:5px}
  /* Lo que dijo en el audio va en cursiva: se lee igual, pero se distingue de lo
     que escribió de puño y letra. Nadie tiene que dudar de dónde salió el texto. */
  /* Copia guardada: se lee distinto de la bandeja para que nadie confunda el
     archivo con la conversación viva. */
  .conv.guardada{opacity:.86}
  .conv.guardada:hover{opacity:1}
  .pin.borrado{border-color:rgba(214,92,84,.55);color:#d65c54}
  .m .dicho{font-style:italic;opacity:.94}
  .m .pendiente{font-style:italic;opacity:.5;font-size:11px}

  .ficha{padding:10px 16px 10px}
  .ficha .nom{font-size:15px;font-weight:800;color:var(--hud-txt);line-height:1.3}
  .ficha .sub{font-family:var(--mono);font-size:10px;color:var(--hud-dim);margin-top:3px;letter-spacing:.5px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 11px}
  .chip{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.9px;border-radius:20px;padding:3px 8px;
        border:1px solid var(--hud-line2);color:var(--hud-txt2)}
  .chip.far{background:rgba(37,211,102,.1);color:var(--wsp);border-color:rgba(37,211,102,.3)}
  .chip.ins{background:rgba(95,200,191,.1);color:var(--hud-aqua);border-color:rgba(95,200,191,.3)}
  .chip.cli{background:rgba(10,168,159,.12);color:var(--hud-glow);border-color:rgba(10,168,159,.35)}
  .chip.no{background:rgba(240,177,90,.1);color:var(--hud-gold);border-color:rgba(240,177,90,.3)}
  .chip.deu{background:rgba(255,107,107,.1);color:var(--hud-err);border-color:rgba(255,107,107,.3)}
  .datos{display:flex;flex-direction:column;gap:1px}
  .dato{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(15,42,44,.6);font-size:12px}
  .dato:last-child{border-bottom:0}
  .dato .k{font-family:var(--mono);font-size:9.5px;letter-spacing:1.2px;color:var(--hud-dim);white-space:nowrap;padding-top:2px}
  .dato .v{color:var(--hud-txt);font-weight:600;text-align:right}
  .dato .v.warn{color:var(--hud-gold)} .dato .v.err{color:var(--hud-err)}

  /* Registro corto y con scroll propio: es una consola de eventos, no el chat. */
  /* La actividad como un monitor: cada cosa que pasa deja su pulso y el
     tiempo corre hacia la izquierda. Abajo, en una línea, lo último. */
  /* flex:none o el canvas se aplasta a cero dentro de la columna que scrollea */
  .pulsera{position:relative;padding:6px 12px 0;flex:none}
  #pulsos{display:block;width:100%;height:70px;min-height:70px}
  .ultimo{padding:2px 16px 8px;font-family:var(--mono);font-size:10px;line-height:1.6;flex:none;
          display:flex;gap:7px;white-space:nowrap;min-height:17px}
  .leyenda,.orbtxt,.orbsub,.ficha{flex:none}
  .ultimo .h{color:var(--hud-dim);flex:none}
  .ultimo .t{overflow:hidden;text-overflow:ellipsis;transition:color .3s}
  .leyenda{display:flex;flex-wrap:wrap;gap:9px;padding:0 16px 10px;font-family:var(--mono);font-size:8px;
           letter-spacing:.6px;color:var(--hud-dim)}
  .leyenda i{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:4px;vertical-align:middle}
  .log{padding:0 16px 12px;display:none;flex-direction:column;gap:1px;font-family:var(--mono);
       font-size:10px;line-height:1.7;max-height:150px;overflow-y:auto}
  .log.abierto{display:flex}
  .lg{display:flex;gap:7px;white-space:nowrap}

<script>
EYG.guard(["direccion","comercial","lider","cobranzas","admin"],{
  pruebas:["a3dfd1b309dd41ad2c8ae3562a8e00c09ae03f8dd8194b75eea5a3db5c003122"],
  abre:{clave:"wsp_comerciales", roles:["comercial","lider","cobranzas"]}
}).then(perfil=>{
  const $=id=>document.getElementById(id);
  const PARAM="eyg.wsp_bot";
  const FIRMA="​";                          /* marca invisible de los mensajes del bot */
  const ORIGEN="WhatsApp · asistente EyG";
  const VOCES={off:"NO HABLA",espejo:"HABLA SI LE HABLAN",siempre:"SIEMPRE HABLA"};
  let cfg={activo:false,numeros:[],pausadas:[],asignadas:{},voz:"espejo"};
  let convs=[], sel=null, msgs=[], ficha=null, comerciales=[];
  let cargando=false, filtro="", vistoId=0, primeraCarga=true;
  let firmaConvs="", firmaMsgs="", firmaFicha="";
  let verArchivadas=false;
  /* "bandeja" | "archivadas" (en Odoo) | "guardadas" (la copia propia en Supabase) */
  let modo="bandeja";
  /* MODO MIRAR: comerciales y líderes entran a leer lo suyo y nada más. Quién ve
     qué NO se decide acá —esta página se puede editar desde la consola— sino en
     `wsp-visibles`, que exige sesión y saca el email del token. Acá solo se
     esconde lo que esa persona no puede usar. */
  const SOLO_MIRA = perfil.rol==="comercial" || perfil.rol==="lider" || perfil.rol==="cobranzas";
  let canalesMios=null;   // ids permitidos, los devuelve el servidor
  if(SOLO_MIRA){
    document.body.classList.add("solomira");
    /* Se sacan del DOM, no se ocultan: apagar el bot o cambiarle la
       configuración no es algo que un comercial deba poder hacer ni por error. */
    ["btnSw","btnCfg","btnArch"].forEach(k=>{ const b=$(k); if(b) b.remove(); });
  }
  /* qué canales siguen existiendo en Odoo, para marcar los borrados en GUARDADAS */
  let vivosOdoo=new Set();
  /* canal → a qué cliente se resolvió. Sale de wsp_canal_dueno, que ya lo tiene
     calculado: es lo que permite decir CLIENTE o NO CLIENTE en la lista. */
  let dueno={}, duenoAl=0;
  async function cargarDuenos(){
    try{
      const {data}=await EYG.supa().from("wsp_canal_dueno").select("canal,cliente,dueno,motivo");
      const m={}; for(const r of data||[]) m[r.canal]=r;
      dueno=m; duenoAl=Date.now();
      /* que la lista y la ficha se redibujen con el dato nuevo */
      firmaConvs=""; firmaFicha="";
    }catch(e){}
  }
  /* Los teléfonos del equipo, para distinguir en la bandeja quién es de casa */
  let EQUIPO={};
  const ROTULO_NIVEL={direccion:"DIRECCIÓN",lider:"LÍDER",comercial:"COMERCIAL",finanzas:"COBRANZAS",deposito:"DEPÓSITO",tecnica:"DIR. TÉCNICA"};
  /* El chip dice el PUESTO, no el nivel de permisos: "Cobranzas" y no "finanzas",
     "Directora Técnica" y no el cajón donde la guardamos. Si hay cargo cargado
     manda el cargo; el nivel es el respaldo. */
  const CHIP=c=>{
    const cg=String((c&&c.cargo)||"").split("·")[0].trim();
    if(cg) return (cg.length>16?cg.slice(0,15)+"…":cg).toUpperCase();
    return ROTULO_NIVEL[c&&c.nivel]||"EQUIPO";
  };
  /* Un color por área, para reconocerlas de un vistazo sin leer. Suaves: el
     nombre tiene que seguir siendo lo que más pesa en la fila. */
  const TONO={ "gerencia":"ger", "dirección":"dir", "dirección técnica":"tec",
               "ventas":"ven", "cobranzas":"cob", "finanzas":"fin", "depósito":"dep" };
  const tonoDe=c=>TONO[String((c&&c.cargo)||"").toLowerCase().trim()]||"eqp";
  const tonoDiv=d=>({ "farmacias":"far", "instituciones":"ins", "líder":"lid" })[String(d||"").toLowerCase()]||"";
  /* Los dos chips juntos: el área y, en Ventas, a qué atiende. */
  const chipsEquipo=c=>{
    const a=`<span class="chip eq-${tonoDe(c)}">${esc(CHIP(c))}</span>`;
    const d=c&&c.division?`<span class="chip eq-${tonoDiv(c.division)}">${esc(String(c.division).toUpperCase())}</span>`:"";
    return a+d;
  };
  const delEquipo=num=>EQUIPO[String(num||"").replace(/\D/g,"").slice(-10)]||null;
  async function cargarEquipo(){
    try{
      /* OJO: si acá falta un campo, lo que se rompe es la vista, no la consulta.
         Faltaban `division`, `user_id` y `mail`: se caía el segundo chip, la
         cartera de cada comercial y el correo de la empresa, todo en silencio. */
      const {data}=await EYG.supa().from("wsp_equipo").select("telefono,nombre,nivel,cargo,division,user_id,mail").eq("activo",true);
      (data||[]).forEach(p=>EQUIPO[p.telefono]=p);
    }catch(e){ /* si falla, la bandeja funciona igual, sin badge */ }
  }
  $("app").style.display="";

  const esc=EYG.esc;
  const hora=s=>{ try{ return EYG.argParts(s).hm; }catch(e){ return ""; } };
  const dia=s=>{ try{ const p=EYG.argParts(s); return p.date===EYG.argToday()?p.hm:p.date.slice(5).split("-").reverse().join("/"); }catch(e){ return ""; } };
  const inicial=n=>String(n||"?").trim().charAt(0).toUpperCase();
  const plata=n=>"$"+Math.round(n||0).toLocaleString("es-AR");
  const nom1=v=>Array.isArray(v)?v[1]:"";
  const id1=v=>Array.isArray(v)?v[0]:v;

  /* ══════ el orbe: el motor del asistente ══════
     Mil partículas: 7 de cada 10 sobre la cáscara y 3 adentro. Esa proporción
     es la que hace que se lea como una esfera y no como una pelusa — el borde
     se densifica solo porque ahí las partículas se ven de perfil y se
     superponen. NO hay que agrandarlas ni aclararlas para marcar el borde: eso
     se probó y quedan manchas.

     Cada estado tiene su color, su forma y su manera de respirar. Las formas no
     son decorativas: cada una aparece en un momento y significa algo. La de la
     onda de audio ya estaba, y es la que probó que el camino era ese. */
  const cv=$("orb"), cx=cv.getContext("2d");
  const NPART=1300, PARTS=[];   /* mas particulas: el orbe crecio y a igual cantidad se veia ralo */
  for(let i=0;i<NPART;i++){
    const th=Math.acos(2*Math.random()-1), ph=Math.random()*Math.PI*2;
    const capa=i<NPART*0.70?1:0;
    const r=capa?(0.90+Math.random()*0.13):(0.20+Math.random()*0.62);
    const p={x:r*Math.sin(th)*Math.cos(ph), y:r*Math.cos(th), z:r*Math.sin(th)*Math.sin(ph),
             s:Math.random(), capa, r, u:(i/NPART)*2-1+(Math.random()-.5)*.02, sem:Math.random()*6.28};
    /* Cada partícula sabe de antemano qué lugar le toca en cada figura. Se
       calcula una sola vez; después solo se interpola, así la metamorfosis no
       pierde ninguna: son las mismas, ordenadas de otro modo. */
    const aa=(i/NPART)*Math.PI*2, tt=Math.random()*Math.PI*2, gr=0.17+Math.random()*0.07;
    p.aX=(1.02+gr*Math.cos(tt))*Math.cos(aa); p.aY=gr*Math.sin(tt)*0.55;
    p.aZ=(1.02+gr*Math.cos(tt))*Math.sin(aa);
    const cara=i%6, a1=Math.random()*2-1, a2=Math.random()*2-1, Lc=0.78;
    const car=[[Lc,a1*Lc,a2*Lc],[-Lc,a1*Lc,a2*Lc],[a1*Lc,Lc,a2*Lc],[a1*Lc,-Lc,a2*Lc],[a1*Lc,a2*Lc,Lc],[a1*Lc,a2*Lc,-Lc]][cara];
    p.cX=car[0]; p.cY=car[1]; p.cZ=car[2];
    const rp=0.55+Math.random()*0.95, t3=Math.acos(2*Math.random()-1), f3=Math.random()*6.28;
    p.pX=rp*Math.sin(t3)*Math.cos(f3); p.pY=rp*Math.cos(t3)*0.8; p.pZ=rp*Math.sin(t3)*Math.sin(f3);
    PARTS.push(p);
  }
  /* El período del latido va en ms y NUNCA baja de 900. Con 200, que era lo de
     antes, el ojo lo lee como vibración y no como respiración. "resp" es cuánto
     se compacta; "ola", qué tan rápido viaja la onda de la superficie. */
  const TONOS={
    off:      {c:[86,116,114], borde:[120,160,158], halo:"rgba(96,124,122,.05)", vel:.0038,tilt:.0015,pul:2400,amp:.010,def:.05,ola:.55,forma:"esfera",resp:.055,txt:"EN REPOSO",       cls:""},
    escucha:  {c:[64,176,168], borde:[130,240,228], halo:"rgba(10,168,159,.12)", vel:.0075,tilt:.0030,pul:2000,amp:.012,def:.09,ola:.75,forma:"esfera",resp:.075,txt:"A LA ESCUCHA",    cls:"on"},
    buscando: {c:[76,150,222], borde:[150,220,255], halo:"rgba(76,150,222,.14)", vel:.030, tilt:.0030,pul:1400,amp:.012,def:.10,ola:1.5,forma:"anillo",resp:.050,txt:"BUSCANDO",        cls:"on"},
    pensando: {c:[224,160,72], borde:[255,214,150], halo:"rgba(240,177,90,.15)", vel:.020, tilt:.0085,pul:1050,amp:.014,def:.14,ola:1.8,forma:"esfera",resp:.160,txt:"PENSANDO",        cls:"think"},
    hablando: {c:[37,196,100], borde:[150,255,190], halo:"rgba(37,211,102,.16)", vel:.014, tilt:.0058,pul:1150,amp:.014,def:.15,ola:1.6,forma:"esfera",resp:.090,txt:"RESPONDIENDO",    cls:"talk"},
    voz:      {c:[37,196,100], borde:[150,255,190], halo:"rgba(37,211,102,.14)", vel:.006, tilt:.0020,pul:1400,amp:.010,def:.06,ola:1.2,forma:"onda",  resp:.040,txt:"NOTA DE VOZ",     cls:"talk"},
    pedido:   {c:[226,168,70], borde:[255,232,170], halo:"rgba(240,177,90,.18)", vel:.009, tilt:.0034,pul:1600,amp:.010,def:.05,ola:.95,forma:"caja",  resp:.045,txt:"PEDIDO ARMADO",   cls:"think"},
    equipo:   {c:[214,124,86], borde:[240,170,138], halo:"rgba(236,139,94,.16)", vel:.009, tilt:.0038,pul:1800,amp:.012,def:.08,ola:.85,forma:"esfera",resp:.060,txt:"CON EL EQUIPO",   cls:"coral"},
    problema: {c:[196,78,72],  borde:[255,150,140], halo:"rgba(229,100,92,.17)", vel:.013, tilt:.0090,pul:900, amp:.020,def:.14,ola:2.2,forma:"polvo", resp:.110,txt:"SIN CONTESTAR",   cls:"bad"},
  };
  let estado="off", tono=TONOS.off;
  const mezcla={c:[86,116,114],b:[120,160,158],vel:.0038,tilt:.0015,pul:2400,amp:.010,def:.05,ola:.55,resp:.055};
  const FORMA={esfera:1,anillo:0,caja:0,polvo:0,onda:0};
  let ang=0, angY=0, angZ=0, fase=0, respFase=0;
  const gesto={hasta:1800, inicio:0, dur:0, eje:0, fuerza:0};
  const M={x:0,y:0,dentro:0,tx:0,ty:0};
  cv.addEventListener("pointermove",ev=>{
    const b=cv.getBoundingClientRect();
    M.tx=(ev.clientX-b.left)/b.width*2-1; M.ty=(ev.clientY-b.top)/b.height*2-1; M.dentro=1;
  });
  cv.addEventListener("pointerleave",()=>{ M.dentro=0; });
  function setEstado(e){
    if(e===estado) return;
    estado=e; tono=TONOS[e]||TONOS.off;
    const t=$("orbtxt"); if(t){ t.textContent=tono.txt; t.className="orbtxt "+tono.cls; }
  }
  const hacia=(a,b,k)=>a+(b-a)*k;
  function dibujar(){
    const W=cv.clientWidth, H=cv.clientHeight;
    if(!W||!H){ requestAnimationFrame(dibujar); return; }
    if(cv.width!==W*2||cv.height!==H*2){ cv.width=W*2; cv.height=H*2; }
    cx.setTransform(2,0,0,2,0,0); cx.clearRect(0,0,W,H);

    const k=0.06;
    for(let i=0;i<3;i++){ mezcla.c[i]=hacia(mezcla.c[i],tono.c[i],k); mezcla.b[i]=hacia(mezcla.b[i],tono.borde[i],k); }
    for(const q of ["vel","tilt","pul","amp","def","ola","resp"]) mezcla[q]=hacia(mezcla[q],tono[q],k);
    /* la metamorfosis va más lenta que el resto: se tiene que ver el cambio */
    for(const f in FORMA) FORMA[f]=hacia(FORMA[f], tono.forma===f?1:0, 0.032);

    const t=Date.now(), cxp=W/2, cyp=H/2;
    ang+=mezcla.vel; angY+=mezcla.tilt; angZ+=mezcla.tilt*0.42;
    fase+=mezcla.ola*0.0016; respFase+=0.0042;

    M.x=hacia(M.x,M.tx*M.dentro,0.07); M.y=hacia(M.y,M.ty*M.dentro,0.07);
    const cerca=hacia(0,M.dentro,0.07);

    /* Respira ASIMÉTRICO: encoge bastante y se infla poco. Concentrarse es
       cerrarse, no hincharse — y además así el punto más lejano queda acotado. */
    const sr=Math.sin(respFase);
    const respira=1+mezcla.resp*(sr>0 ? sr*0.35 : sr);

    /* TAMAÑO. El 0,62 sale de una cuenta, no del ojo: la partícula que más se
       aleja del centro NO es la de adelante (esa está en el medio) sino la del
       borde, donde la perspectiva vale 0,56 y no 0,86. Con el número correcto
       la esfera llega a 92 px de los 98 que hay hasta el borde: 184 px de
       diámetro en los 196 de alto. Antes llegaba a 125.
       Cada figura ancha descuenta lo suyo —la caja llega a las esquinas, el
       polvo se desparrama, el anillo tiene grosor— calculado para que las cinco
       terminen en esos mismos 92 px. */
    const ancho=FORMA.anillo*0.22+FORMA.caja*0.25+FORMA.polvo*0.62+FORMA.onda*0.10;
    const R=Math.min(W,H)*(0.60-ancho*0.5);

    const puls=1+Math.sin(t/mezcla.pul)*mezcla.amp;
    const cos=Math.cos(ang), sin=Math.sin(ang), cy2=Math.cos(angY), sy2=Math.sin(angY);
    const cz=Math.cos(angZ*0.6), sz=Math.sin(angZ*0.6);
    const cr=mezcla.c[0], cg=mezcla.c[1], cb=mezcla.c[2];
    const br=mezcla.b[0], bg=mezcla.b[1], bb=mezcla.b[2];

    /* Cada tanto se reacomoda: un impulso que la estira por un eje y vuelve.
       EL EJE ES 3D, NO DEL PLANO DE LA PANTALLA. Antes el estirón tocaba solo
       x e y —las dos coordenadas de la pantalla— y dejaba z intacta: eso alarga
       la esfera en el plano del monitor, sin profundidad, y se ve como un óvalo
       chato. Con una componente en z, el bulto se va también para adelante o
       para atrás, la perspectiva lo acompaña y se lee como un cuerpo. */
    if(t>gesto.hasta){
      gesto.hasta=t+4000+Math.random()*6000; gesto.inicio=t;
      gesto.dur=1100+Math.random()*1100; gesto.fuerza=.09+Math.random()*.13;
      const th=Math.acos(2*Math.random()-1), ph=Math.random()*6.28;
      gesto.ex=Math.sin(th)*Math.cos(ph); gesto.ey=Math.cos(th); gesto.ez=Math.sin(th)*Math.sin(ph);
    }
    let estira=0;
    if(t-gesto.inicio<gesto.dur){ const u=(t-gesto.inicio)/gesto.dur; estira=Math.sin(u*Math.PI)*gesto.fuerza; }

    for(const p of PARTS){
      /* La onda de la superficie depende SOLO de dónde está la partícula, no de
         un número al azar como antes: por eso las vecinas se mueven juntas y se
         ve líquido en vez de granizo. Tres frecuencias para que no se note el
         patrón, normalizadas para que nunca pase de ±1. */
      const w=( Math.sin(p.y*2.05+fase*1.00)*0.60
              + Math.sin(p.x*1.63-fase*0.74)*0.52
              + Math.sin(p.z*1.87+fase*0.61)*0.44 )/1.56;
      const d=1+mezcla.def*w;
      let bx=p.x*d, by=p.y*d, bz=p.z*d;

      if(FORMA.anillo>.002){ const g=FORMA.anillo; bx+=(p.aX-bx)*g; by+=(p.aY-by)*g; bz+=(p.aZ-bz)*g; }
      if(FORMA.caja  >.002){ const g=FORMA.caja;   bx+=(p.cX-bx)*g; by+=(p.cY-by)*g; bz+=(p.cZ-bz)*g; }
      if(FORMA.polvo >.002){ const g=FORMA.polvo, dr=1+Math.sin(p.sem+t/900)*0.10;
        bx+=(p.pX*dr-bx)*g; by+=(p.pY*dr-by)*g; bz+=(p.pZ*dr-bz)*g; }

      let x=bx*cos-bz*sin, z=bx*sin+bz*cos, y=by;
      const y2=y*cy2-z*sy2; z=y*sy2+z*cy2; y=y2;
      const x2=x*cz-y*sz; y=x*sz+y*cz; x=x2;
      x*=respira; y*=respira; z*=respira;
      if(estira){
        /* SE ESTIRA Y SE COMPRIME, como un cuerpo elastico. Sin la compresion,
           el estiron agrandaba la silueta de 92 a 123 px y el orbe se cortaba
           contra los bordes de la caja — venia pasando desde siempre, en los
           gestos, y nunca lo habia tenido en cuenta. Dividiendo por (1+estira)
           el largo se mantiene y lo que cambia es la FORMA, que es de lo que se
           trataba. */
        const pr=x*gesto.ex+y*gesto.ey+z*gesto.ez, c=1/(1+estira);
        x=(x+gesto.ex*pr*estira)*c; y=(y+gesto.ey*pr*estira)*c; z=(z+gesto.ez*pr*estira)*c;
      }

      const e=1/(1.78-z*0.62);
      let px=cxp+x*R*e*puls, py=cyp+y*R*e*puls;

      if(FORMA.onda>.002){
        /* La onda es la única que se estira a lo ANCHO, así que su límite es el
           ancho del panel y no el radio: atada al radio se saldría por los
           costados al agrandar el orbe. */
        const env=Math.pow(Math.max(0,Math.cos(p.u*Math.PI/2)),0.75);
        const ww=Math.sin(p.u*7.5+t/165)*0.55+Math.sin(p.u*13.9-t/225)*0.26+Math.sin(p.u*3.1+t/330)*0.32;
        const anchoOnda=Math.min(R*1.62, W*0.46);
        const ox=cxp+p.u*anchoOnda, oy=cyp+ww*env*(p.capa?0.5:1)*(0.4+p.s*0.6)*R*0.62;
        px+=(ox-px)*FORMA.onda; py+=(oy-py)*FORMA.onda;
      }

      if(cerca>.01){
        const mx=cxp+M.x*W*0.5, my=cyp+M.y*H*0.5;
        const dx=px-mx, dy=py-my, dd=Math.sqrt(dx*dx+dy*dy)+.001, rr=R*0.85;
        if(dd<rr){ const emp=(1-dd/rr)*(1-dd/rr)*R*0.30*cerca; px+=dx/dd*emp; py+=dy/dd*emp; }
      }

      /* El borde brilla POR DENSIDAD, no por tamaño. Marcarlo agrandando y
         aclarando cada partícula deja manchas: se probó y se descartó. Los
         puntos van parejos, y del canto sale apenas un tinte.
         "De canto" se mide contra el LARGO REAL de la partícula, no contra su
         radio original: si no, al estirarse o deformarse la cuenta se pasa de 1
         y el tinte del borde queda donde no va. */
      const largo=Math.sqrt(x*x+y*y+z*z)||1;
      const plano=Math.sqrt(x*x+y*y)/largo;
      const canto=Math.pow(Math.max(0,Math.min(1,plano)),8);
      const mezB=(p.capa?canto:canto*0.3)*0.55;
      /* Tamaño del punto: quedaron muy chicos en 0,42+0,72 (1,0 px de radio
         adelante). El orbe además creció, así que a igual tamaño se veía ralo.
         Con esto quedan en 1,55 px, el mismo rango que los de la onda. */
      const rad=(0.70+p.s*1.10)*e;
      let a=(Math.max(0,(z+1)/2)*0.62+0.10)*(p.capa?1:0.38)*(1+canto*0.30);
      if(a>0.92) a=0.92;

      const rr2=(cr+(br-cr)*mezB+z*16)|0, gg2=(cg+(bg-cg)*mezB+z*15)|0, bb2=(cb+(bb-cb)*mezB+z*16)|0;
      cx.beginPath();
      cx.fillStyle="rgba("+rr2+","+gg2+","+bb2+","+a+")";
      cx.arc(px,py,rad,0,7); cx.fill();
    }

    const g=cx.createRadialGradient(cxp,cyp,R*0.10,cxp,cyp,R*1.5);
    g.addColorStop(0,tono.halo); g.addColorStop(1,"rgba(0,0,0,0)");
    cx.fillStyle=g; cx.fillRect(0,0,W,H);
    requestAnimationFrame(dibujar);
  }
  requestAnimationFrame(dibujar);

  (function reloj(){
    const d=new Date(), p=n=>String(n).padStart(2,"0");
    $("reloj").innerHTML=`${p(d.getHours())}:${p(d.getMinutes())}<small>.${p(d.getSeconds())}</small>`;
    setTimeout(reloj,1000);
  })();

  /* ══ registro en vivo ══ */
  const EVENTOS=[];
  const ahoraHM=()=>{ const d=new Date(), p=n=>String(n).padStart(2,"0"); return `${p(d.getHours())}:${p(d.getMinutes())}`; };
  /* Si el evento viene de un mensaje, se usa LA HORA DEL MENSAJE, no la de
     ahora: si no, todo el historial aparece con el horario en que se abrió. */
  /* ══════ la actividad como monitor de pulsos ══════
     Cada cosa que pasa deja su pulso, con el color de quién fue. El tiempo
     corre hacia la izquierda y los pulsos se van apagando. Abajo, en una
     línea, el último evento; el detalle en texto sigue disponible a un clic. */
  const COLOR_EV={cli:[214,222,221], bot:[37,211,102], voz:[95,200,191], ped:[240,177,90],
                  eq:[236,139,94], asig:[159,140,255], sis:[130,150,149]};
  const PULSOS=[];
  function anotar(clase,texto,cuando){
    EVENTOS.unshift({h:(cuando&&hora(cuando))||ahoraHM(),clase,texto});
    if(EVENTOS.length>40) EVENTOS.pop();
    /* el pulso nace a la derecha; la altura la da qué tan importante es */
    const peso={ped:1, bot:.78, cli:.72, voz:.8, eq:.66, asig:.66, sis:.34}[clase]||.5;
    PULSOS.push({x:1, alto:peso, clase, n:Date.now(), vida:1});
    if(PULSOS.length>90) PULSOS.shift();
    const u=$("ultimo");
    if(u){
      const c=COLOR_EV[clase]||COLOR_EV.sis;
      u.innerHTML=`<span class="h">${EVENTOS[0].h}</span><span class="t" style="color:rgb(${c.join(",")})">${esc(texto)}</span>`;
    }
    const lg=$("log");
    if(lg) lg.innerHTML=EVENTOS.map(e=>`<div class="lg ${e.clase}"><span class="h">${e.h}</span><span>${esc(e.texto)}</span></div>`).join("");
  }

  (function pulsera(){
    const cv=$("pulsos"); if(!cv) return;
    const cx=cv.getContext("2d");
    let t=0;
    (function dibujar(){
      const W=cv.clientWidth, H=cv.clientHeight;
      if(!W||!H){ requestAnimationFrame(dibujar); return; }
      if(cv.width!==W*2||cv.height!==H*2){ cv.width=W*2; cv.height=H*2; }
      cx.setTransform(2,0,0,2,0,0); cx.clearRect(0,0,W,H);
      t+=0.02;
      const base=H*0.72;

      /* la línea de base, con una respiración apenas perceptible */
      cx.beginPath(); cx.strokeStyle="rgba(120,150,148,.28)"; cx.lineWidth=1;
      for(let x=0;x<=W;x+=4){
        const y=base+Math.sin(x*0.045+t*1.6)*(cfg && cfg.activo?1.5:0.4);
        x?cx.lineTo(x,y):cx.moveTo(x,y);
      }
      cx.stroke();

      /* cada evento, su pulso; se corren a la izquierda y se apagan */
      for(let i=PULSOS.length-1;i>=0;i--){
        const p=PULSOS[i];
        p.x-=0.0016; p.vida=Math.max(0,p.vida-0.0016);
        if(p.x<-0.05){ PULSOS.splice(i,1); continue; }
        const px=p.x*W, alto=p.alto*(H*0.6), c=COLOR_EV[p.clase]||COLOR_EV.sis;
        const joven=Math.min(1,(Date.now()-p.n)/420);
        const a=p.vida*(0.25+0.75*joven);
        /* el trazo: sube, hace punta y vuelve */
        cx.beginPath();
        cx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},${a})`;
        cx.lineWidth=1.6; cx.lineJoin="round";
        cx.moveTo(px-9,base);
        cx.lineTo(px-4,base-alto*0.25);
        cx.lineTo(px,base-alto*joven);
        cx.lineTo(px+4,base-alto*0.18);
        cx.lineTo(px+9,base);
        cx.stroke();
        /* el resplandor de la punta, que se apaga rápido */
        if(joven<1){
          const g=cx.createRadialGradient(px,base-alto,0,px,base-alto,16);
          g.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},${(1-joven)*0.5})`);
          g.addColorStop(1,"rgba(0,0,0,0)");
          cx.fillStyle=g; cx.fillRect(px-16,base-alto-16,32,32);
        }
        cx.beginPath();
        cx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${a})`;
        cx.arc(px,base-alto*joven,1.7,0,7); cx.fill();
      }

      /* el cabezal: donde entra lo próximo que pase */
      const lat=0.5+Math.sin(t*3)*0.5;
      cx.beginPath();
      cx.strokeStyle=`rgba(10,168,159,${0.2+lat*0.35})`; cx.lineWidth=1;
      cx.moveTo(W-1,base-H*0.5); cx.lineTo(W-1,base+6); cx.stroke();
      requestAnimationFrame(dibujar);
    })();
  })();

  /* ══ estado del orbe ══ */
  let hablandoHasta=0, vozHasta=0, pedidoHasta=0, equipoHasta=0, esperaDesde=0;
  function esperandoRespuesta(){
    if(!sel || cfg.pausadas.includes(sel.id) || !cfg.activo) return false;
    const pid=id1(sel.whatsapp_partner_id);
    for(let i=msgs.length-1;i>=0;i--){
      const m=msgs[i];
      if(!esDelChat(m)) continue;
      return Array.isArray(m.author_id) && pid && m.author_id[0]===pid && !esDelBot(m);
    }
    return false;
  }
  /* QUÉ ESTADO MOSTRAR. Antes eran cuatro situaciones y todas del mismo palo
     verde-agua, así que de un vistazo no se sabía qué estaba haciendo.

     Los tiempos de espera no son inventados: salen de lo medido. La búsqueda
     previa contra el catálogo tarda unos 3 a 4 segundos, y recién después
     arranca a redactar — por eso los primeros 6 segundos son "buscando" y de
     ahí en más "pensando". Y una respuesta normal tarda entre 8 y 40 segundos:
     si pasan más de 90 sin contestar, ya no está pensando, algo se rompió. Eso
     es lo mismo que detecta el vigilante, pero acá se ve al instante y de
     lejos, sin esperar a que llegue un WhatsApp de alerta. */
  function refrescarOrbe(){
    const ahora=Date.now();
    const esperando=esperandoRespuesta();
    if(esperando){ if(!esperaDesde) esperaDesde=ahora; } else esperaDesde=0;
    const espera=esperaDesde ? ahora-esperaDesde : 0;
    setEstado(
        ahora<vozHasta      ? "voz"
      : ahora<hablandoHasta ? "hablando"
      : ahora<pedidoHasta   ? "pedido"
      : ahora<equipoHasta   ? "equipo"
      : !cfg.activo         ? "off"
      : espera>90000        ? "problema"
      : espera>6000         ? "pensando"
      : espera>0            ? "buscando"
      : "escucha");
  }
  setInterval(refrescarOrbe,500);

  const esDelBot=m=>String(m.body||"").includes(FIRMA);
  const esNota=m=>Array.isArray(m.subtype_id)&&/note|nota/i.test(m.subtype_id[1]||"");
  const esDelChat=m=>(m.message_type==="whatsapp_message"||esDelBot(m))&&!esNota(m);

  /* ══ configuración ══ */
  async function leerCfg(){
    try{
      const c=JSON.parse((await EYG.rpc("ir.config_parameter","get_param",[PARAM]))||"{}")||{};
      cfg={activo:c.activo===true, numeros:Array.isArray(c.numeros)?c.numeros:[],
           pausadas:Array.isArray(c.pausadas)?c.pausadas:[], asignadas:c.asignadas&&typeof c.asignadas==="object"?c.asignadas:{},
           voz:VOCES[c.voz]?c.voz:"espejo"};
    }catch(e){ cfg={activo:false,numeros:[],pausadas:[],asignadas:{},voz:"espejo"}; }
    pintarBot();
  }

    await EYG.rpc("ir.config_parameter","set_param",[PARAM,JSON.stringify(cfg)]);
    pintarBot(); firmaConvs=""; pintarConvs();
  }
  function pintarBot(){
    const n=cfg.numeros.length;
    const _eb=$("estadoBot"); if(_eb) _eb.textContent=cfg.activo?(n?`SOLO ${n} EN PRUEBA`:"ATENDIENDO"):"APAGADO";
    const b=$("btnSw");

    b.title=cfg.activo?"Apagar el asistente":"Encender el asistente";
    const _vl=$("vozlbl"); if(_vl) _vl.textContent=VOCES[cfg.voz]||"—";
    $("pulso").className=cfg.activo?"on":"";     /* el punto del encabezado late si atiende */

  /* "En línea": hubo un mensaje hace menos de 4 minutos, o sea que la charla
     está pasando AHORA. No es presencia real —WhatsApp no la da— pero es lo que
     importa acá: saber en qué conversación meterse si hace falta. */
  const VIVO_MIN=4;
  function enLinea(v){
    const t=v && (v.ultimo||v.write_date);
    if(!t) return false;
    const cuando=new Date(String(t).replace(" ","T")+"Z").getTime();
    return isFinite(cuando) && (Date.now()-cuando) < VIVO_MIN*60000;
  }

  /* ══ bandeja ══ */
  /* Los canales que ESTA persona puede ver, según el servidor. Si el pedido
     falla, no se muestra nada: ante la duda, nada. */
  async function misCanales(){
    if(!SOLO_MIRA) return null;
    if(canalesMios) return canalesMios;
    try{
      const {data,error}=await EYG.supa().functions.invoke("wsp-visibles",{body:{accion:"lista"}});
      if(error||!data||!data.ok){ canalesMios={ids:new Set(),info:{},fallo:true}; return canalesMios; }
      const ids=new Set(), info={};
      for(const c of data.canales||[]){ ids.add(c.canal); info[c.canal]=c; }
      canalesMios={ids,info,fallo:false};
    }catch(e){ canalesMios={ids:new Set(),info:{},fallo:true}; }
    return canalesMios;
  }

  async function cargarConvs(){
    /* Memoria propia: sale de Supabase, no de Odoo. Acá están también las
       conversaciones que se borraron, que es el punto de tenerla. */
    if(modo==="guardadas"){
      try{
        const {data}=await EYG.supa().rpc("wsp_chats_guardados");
        const filas=data||[];
        /* El cliente sigue existiendo en Odoo aunque el chat ya no: se le pide
           el nombre para no mostrar un teléfono pelado. */
        const pids=[...new Set(filas.map(g=>g.partner).filter(Boolean))];
        let nombres={};
        if(pids.length){
          try{
            const ps=await EYG.rpc("res.partner","read",[pids,["name"]],{});
            for(const p of ps||[]) nombres[p.id]=p.name;
          }catch(e){}
        }
        convs=filas.map(g=>({
          id:g.canal, guardado:true, borrado:!vivosOdoo.has(g.canal),
          whatsapp_number:g.telefono||"", whatsapp_partner_id:g.partner?[g.partner,nombres[g.partner]||""]:null,
          name:nombres[g.partner]||g.telefono||("Canal "+g.canal),
          mensajes:g.mensajes, aprendido:g.aprendido,
          ultimo:g.ultimo, write_date:g.ultimo,
        }));
      }catch(e){ convs=[]; }
      pintarConvs(); pintarBot(); primeraCarga=false; return;
    }
    try{
      /* Odoo esconde lo archivado salvo que el dominio nombre "active" */
      const dominio=verArchivadas
        ? [["channel_type","=","whatsapp"],["active","=",false]]
        : [["channel_type","=","whatsapp"]];
      const r=await EYG.rpc("discuss.channel","search_read",[dominio],
        {fields:["name","whatsapp_number","whatsapp_partner_id","whatsapp_channel_valid_until","write_date"],order:"write_date desc",limit:60});
      let nuevas=r||[];
      for(const v of nuevas) vivosOdoo.add(v.id);
      /* Se refresca si está vacío, si hay algún chat que todavía no resolvimos
         —recién cargado, o un cliente al que le acaban de agregar un teléfono—,
         o cada 2 minutos. Antes se cargaba UNA sola vez por sesión: a Farmacia
         Vera le agregaron el segundo número, el servidor ya la reconocía y en
         pantalla seguía diciendo "no cliente" hasta recargar la página. */
      const faltaAlguno = nuevas.some(v=>!dueno[v.id]);
      if(!Object.keys(dueno).length || faltaAlguno || Date.now()-duenoAl > 120000) await cargarDuenos();
      /* El recorte de verdad ya lo hizo el servidor; acá solo se aplica su
         respuesta. Si no la pudo dar, no se muestra nada. */
      if(SOLO_MIRA){
        const m=await misCanales();
        nuevas=nuevas.filter(v=>m.ids.has(v.id));
        for(const v of nuevas){ const i=m.info[v.id]; if(i&&i.cliente) v._cliente=i.cliente; }
      }
      /* Arriba el que escribió último, como en WhatsApp. `write_date` del canal
         no alcanza: se toca por cualquier cambio del registro y no siempre al
         llegar un mensaje. La fecha buena es la del último mensaje, y se pide
         para los 60 canales de una sola vez con read_group. */
      try{
        const g=await EYG.rpc("mail.message","read_group",
          [[["model","=","discuss.channel"],["res_id","in",nuevas.map(v=>v.id)]],["date:max"],["res_id"]],{lazy:true});
        const ult={}; for(const x of (g||[])) if(x.res_id) ult[x.res_id]=x.date;
        for(const v of nuevas) v.ultimo=ult[v.id]||v.write_date;
        nuevas.sort((a,b)=>String(b.ultimo||"").localeCompare(String(a.ultimo||"")));
      }catch(e){ for(const v of nuevas) v.ultimo=v.write_date; }
      /* avisar en el registro cuando entra actividad nueva */
      if(!primeraCarga && !verArchivadas){
        for(const v of nuevas){
          const antes=convs.find(x=>x.id===v.id);
          if(!antes) anotar("cli","conversación nueva · "+(nom1(v.whatsapp_partner_id)||v.whatsapp_number||"sin nombre"));
          else if((antes.ultimo||antes.write_date)!==(v.ultimo||v.write_date) && (!sel||sel.id!==v.id))
            anotar("cli","mensaje nuevo · "+(nom1(v.whatsapp_partner_id)||v.whatsapp_number||"otro chat"), v.ultimo||v.write_date);
        }
      }
      convs=nuevas;
      if(sel){ const f=convs.find(v=>v.id===sel.id); if(f) sel=f; }
    }catch(e){ /* se reintenta en el próximo ciclo */ }
    primeraCarga=false;
    pintarConvs(); pintarBot();
  }
  function pintarConvs(){
    const f=filtro.trim().toLowerCase();
    const lista=convs.filter(v=>{
      if(!f) return true;
      return ((nom1(v.whatsapp_partner_id)||v.name||"")+" "+(v.whatsapp_number||"")).toLowerCase().includes(f);
    });
    $("nConv").textContent=lista.length?lista.length:"";
    /* sin parpadeo: si nada cambió, no se toca el DOM */
    const firma=lista.map(v=>`${delEquipo(v.whatsapp_number)?"C":""}${v.id}|${v.ultimo||v.write_date}|${enLinea(v)?1:0}|${(dueno[v.id]||{}).cliente?1:0}|${cfg.pausadas.includes(v.id)?1:0}|${cfg.asignadas[v.id]||""}`).join(";")+"|"+(sel?sel.id:0)+"|"+(cfg.activo?1:0);
    if(firma===firmaConvs) return;
    firmaConvs=firma;
    const c=$("convs");
    if(!lista.length){ c.innerHTML=`<div class="vacio">${f?"NADA COINCIDE":(modo==="guardadas"?"TODAVÍA NO HAY NADA GUARDADO":(verArchivadas?"NO HAY NADA ARCHIVADO":"SIN CONVERSACIONES<br>—<br>APARECEN SOLAS CUANDO<br>UN CLIENTE ESCRIBE"))}</div>`; return; }
    c.innerHTML=lista.map(v=>{
      const eq=cfg.pausadas.includes(v.id), asig=cfg.asignadas[v.id];
      /* Para el comercial vale el nombre del CLIENTE, no el que la persona tiene
         puesto en su teléfono ("Emi", "marco tappari"): ese no le dice nada. */
      const casa=delEquipo(v.whatsapp_number);
      /* Si es del equipo, manda el nombre del padrón. El que trae WhatsApp es el
         que cada uno se puso en su propio teléfono ("Droguería Eyg", "Claudia
         DROGUERÍA E Y G") y no sirve para saber quién es. */
      const nom=(casa&&casa.nombre)||v._cliente||((dueno[v.id]||{}).cliente)||nom1(v.whatsapp_partner_id)||v.name||v.whatsapp_number||"Sin nombre";
      /* Al de la casa, su área (y su división si es de Ventas). Al resto, lo que
         de verdad importa saber: si es cliente o todavía no. "BOT" no decía nada
         del contacto, decía del bot. */
      const dn=(dueno||{})[v.id];
      const marca=casa
        ? `<span class="pin pcargo p-${tonoDe(casa)}" title="${esc(casa.nombre)}${casa.cargo?" · "+esc(casa.cargo):""}">${CHIP(casa)}</span>`+
          (casa.division?`<span class="pin pcargo p-${tonoDiv(casa.division)}">${esc(String(casa.division).toUpperCase())}</span>`:"")
        : (asig?`<span class="pin asig">${esc(String(asig.nombre||"").split(" ")[0].toUpperCase())}</span>`
        : (eq?'<span class="pin eq">EQUIPO</span>'
        : (dn&&dn.cliente?'<span class="pin p-cli">CLIENTE</span>'
        : (dn?'<span class="pin p-nocli">NO CLIENTE</span>':""))));
      /* En GUARDADAS no hay nada que archivar ni borrar: es la copia propia.
         Se muestra cuánto se guardó y si el chat ya no existe en Odoo. */
      if(v.guardado){
        const sello=v.borrado?'<span class="pin borrado" title="Ya no está en Odoo: esto es lo único que queda">BORRADO</span>':"";
        return `<div class="conv guardada ${sel&&sel.id===v.id?"act":""}" data-id="${v.id}" data-nom="${esc(nom)}">
          <div class="n"><b>${esc(nom)}</b>${sello}</div>
          <div class="t"><span>${v.mensajes} mensajes · ${v.aprendido} aprendido${v.aprendido===1?"":"s"}</span><span>${esc(dia(v.ultimo))}</span></div>
        </div>`;
      }
      const vivo=enLinea(v)?'<i class="vivo" title="Conversación en curso ahora mismo"></i>':"";
      return `<div class="conv ${sel&&sel.id===v.id?"act":""}${vivo?" viva":""}" data-id="${v.id}" data-nom="${esc(nom)}">
        <div class="n">${vivo}<b>${esc(nom)}</b>${marca}</div>
        <div class="t"><span>${esc(v.whatsapp_number||"")}</span><span>${esc(dia(v.ultimo||v.write_date))}</span></div>
        ${SOLO_MIRA?"":`<div class="cvacc">
          <button class="cvb" data-a="${verArchivadas?"desarchivar":"archivar"}" title="${verArchivadas?"Devolver a la bandeja":"Archivar: sale de la bandeja y se puede recuperar"}">${verArchivadas?"↩":"📁"}</button>
          <button class="cvb no" data-a="borrar" title="Eliminar para siempre">✕</button>
        </div>`}
      </div>`;
    }).join("");
    c.querySelectorAll(".conv").forEach(el=>el.onclick=()=>abrir(Number(el.dataset.id)));
    /* los atajos no tienen que abrir la conversación al tocarlos */
    c.querySelectorAll(".cvb").forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      const fila=b.closest(".conv");
      accionChat(Number(fila.dataset.id), fila.dataset.nom, b.dataset.a);
    });
  }
  $("verLog").onclick=()=>{ const l=$("log"); l.classList.toggle("abierto"); $("verLog").textContent=l.classList.contains("abierto")?"OCULTAR":"DETALLE"; };
  $("buscar").addEventListener("input",e=>{ filtro=e.target.value; firmaConvs=""; pintarConvs(); });
  /* Tres vistas con un solo botón: la bandeja, lo archivado en Odoo, y la
     MEMORIA PROPIA — lo que quedó guardado en Supabase, exista o no en Odoo.
     Ahí siguen estando las conversaciones borradas, para poder leerlas. */
  if($("btnArch")) $("btnArch").onclick=async()=>{
    modo = modo==="bandeja" ? "archivadas" : (modo==="archivadas" ? "guardadas" : "bandeja");
    verArchivadas = modo==="archivadas";
    const b=$("btnArch");
    b.classList.toggle("act", modo!=="bandeja");
    b.textContent = modo==="bandeja" ? "ARCHIVADAS" : (modo==="archivadas" ? "GUARDADAS" : "VOLVER");
    b.title = modo==="archivadas" ? "Ver lo que quedó guardado en la memoria del asistente, incluso lo borrado"
            : (modo==="guardadas" ? "Volver a la bandeja" : "Ver las conversaciones archivadas en Odoo");
    sel=null; msgs=[]; firmaConvs=""; firmaMsgs="";
    pintarChat(); await cargarConvs();
  };

  /* ══ chat ══ */
  async function abrir(id,silencioso){
    const mismo=sel&&sel.id===id;
    sel=convs.find(v=>v.id===id)||sel;
    if(!sel) return;
    /* Guardada: el texto sale de la copia propia, no de Odoo. Se le da la misma
       forma que a un mensaje de Odoo para que lo pinte el mismo código. */
    if(sel.guardado){
      try{
        const {data}=await EYG.supa().from("wsp_mensajes")
          .select("id,quien,texto,cuando").eq("canal",id).order("cuando",{ascending:true}).limit(500);
        msgs=(data||[]).map(m=>({
          id:m.id, body:m.texto, date:String(m.cuando||"").replace("T"," ").slice(0,19),
          author_id:null, attachment_ids:[], message_type:"comment", _quien:m.quien,
        }));
      }catch(e){ msgs=[]; }
      firmaMsgs=""; pintarChat(mismo); if(!mismo) cargarFicha(); refrescarOrbe();
      return;
    }
    if(!mismo){
      firmaMsgs=""; firmaFicha=""; vistoId=0;
      $("pie").dataset.modo="";            /* cuadro de respuesta limpio al cambiar de chat */
      $("msgs").innerHTML='<div class="vacio">CARGANDO…</div>';
      pintarConvs();
    }
    try{
      const r=await EYG.rpc("mail.message","search_read",[[["model","=","discuss.channel"],["res_id","=",id]]],
        {fields:["body","author_id","message_type","date","subtype_id","attachment_ids"],order:"id desc",limit:80});
      msgs=(r||[]).slice().reverse();
    }catch(e){ if(!silencioso) msgs=[]; }
    detectarNovedades();
    pintarChat(mismo);
    traerTranscripciones();
    if(!mismo) cargarFicha();
    refrescarOrbe();
  }

  /* Las notas de voz pasadas a texto. El bot ya transcribe lo que contesta y lo
     deja en `wsp_audios`; esto trae lo que falte —los audios que entraron con el
     bot apagado, o viejos— y los cachea igual. La transcripción es SOLO para
     leer acá adentro: nunca se le escribe al cliente. */
  let transcritos={}, tiposAdj={}, transcribiendo=false, pedidosYa=new Set();

  /* QUÉ MANDÓ, no solo qué dijo. Acá se rotulaba TODO adjunto como "nota de
     voz" porque era el único dato disponible: wsp-transcribir devolvía nada más
     que los textos. Natividad mandó una IMAGEN y en la bandeja figuraba como
     audio. Ahora la función devuelve también `tipos` y cada cosa se muestra
     como lo que es. */
  const ROTULO={audio:"🎙️ NOTA DE VOZ", imagen:"🖼️ IMAGEN", pdf:"📄 PDF",
                video:"🎬 VIDEO", archivo:"📎 ARCHIVO"};
  const claseAdj=ids=>{
    const cs=(ids||[]).map(a=>(tiposAdj[a]||{}).clase).filter(Boolean);
    if(!cs.length) return "";
    /* Si vienen varios y alguno no es audio, manda el que no es audio: lo que
       no hay que perder es que llegó un archivo. */
    return cs.find(c=>c!=="audio") || cs[0];
  };

  async function traerTranscripciones(){
    /* Se piden los que no tienen TIPO todavía, no los que no tienen texto: una
       imagen nunca va a tener texto y antes se volvía a pedir para siempre. */
    const ids=[...new Set(msgs.flatMap(m=>m.attachment_ids||[]))]
      .filter(a=>!tiposAdj[a] && !pedidosYa.has(a));
    if(!ids.length) return;
    ids.forEach(a=>pedidosYa.add(a));
    transcribiendo=true; firmaMsgs=""; pintarChat(true);
    try{
      const {data}=await EYG.supa().functions.invoke("wsp-transcribir",{body:{adjuntos:ids}});
      Object.assign(transcritos, (data&&data.textos)||{});
      Object.assign(tiposAdj,   (data&&data.tipos) ||{});
    }catch(e){ /* si falla queda "sin transcribir", no rompe el chat */ }
    transcribiendo=false; firmaMsgs=""; pintarChat(true);
  }

  /* El registro cuenta QUÉ PASÓ, no qué se dijo: el contenido ya está en el
     chat, al lado. Acá van los eventos y los tiempos de respuesta. */
  const instante=s=>new Date(String(s||"").replace(" ","T")+"Z").getTime();
  function demora(m){
    const pid=id1(sel&&sel.whatsapp_partner_id);
    const i=msgs.findIndex(x=>x.id===m.id);
    for(let j=i-1;j>=0;j--){
      const p=msgs[j];
      if(Array.isArray(p.author_id)&&pid&&p.author_id[0]===pid&&!esDelBot(p)){
        const s=Math.round((instante(m.date)-instante(p.date))/1000);
        return (s>0&&s<900) ? ` · ${s} s` : "";
      }
    }
    return "";
  }
  function detectarNovedades(){
    const pid=id1(sel&&sel.whatsapp_partner_id);
    const quien=(nom1(sel&&sel.whatsapp_partner_id)||sel.whatsapp_number||"").split(" ")[0];
    /* La primera vez que se abre un chat NO se registra nada: el historial ya
       está a la vista, y volcarlo entero llenaría el registro de ruido viejo. */
    const primeraMirada = vistoId===0;
    for(const m of msgs){
      if(m.id<=vistoId) continue;
      if(!primeraMirada){
        const delCliente=Array.isArray(m.author_id)&&pid&&m.author_id[0]===pid&&!esDelBot(m);
        if(esNota(m)){
          const nro=(limpiar(m.body).match(/\b\d{6,}\b/)||[])[0];
          if(/presupuesto|pedido|📝/.test(m.body)){
            anotar("ped", nro?`presupuesto ${nro} actualizado`:"pedido actualizado", m.date);
            pedidoHasta=Date.now()+7000;      /* el orbe se arma en caja */
          } else {
            anotar("eq","derivado al equipo", m.date);
            equipoHasta=Date.now()+6000;      /* el orbe pasa a coral */
          }
        } else if(delCliente){
          if((m.attachment_ids||[]).length){
            const cl=claseAdj(m.attachment_ids);
            const qu={audio:"nota de voz", imagen:"una imagen", pdf:"un PDF",
                      video:"un video", archivo:"un archivo"}[cl] || "un adjunto";
            anotar(cl==="audio"?"voz":"cli", `${qu} de ${quien}`, m.date);
          }
          else anotar("cli",`mensaje de ${quien} · ${limpiar(m.body).split(/\s+/).length} palabras`, m.date);
        } else if(esDelBot(m)){
          const largo=limpiar(m.body).length;
          const conVoz=/^\s*🎙️/.test(String(m.body||"").replace(/<[^>]*>/g,""));
          anotar(conVoz?"voz":"bot",`${conVoz?"contestó hablando":"respondió el asistente"}${demora(m)} · ${largo} caracteres`, m.date);
          if(conVoz) vozHasta=Date.now()+6500; else hablandoHasta=Date.now()+3400;
        } else {
          anotar("eq","respondió el equipo · "+String(nom1(m.author_id)||"").split(" ")[0], m.date);
        }
      }
      vistoId=Math.max(vistoId,m.id);
    }
  }
  /* Odoo escapa el HTML que recibe por RPC, así que en los mensajes viejos el
     salto de línea quedó guardado como &lt;br&gt;. Se descifra antes de mostrar. */
  const limpiar=b=>String(b||"")
    .replace(/<br\s*\/?>/gi,"\n").replace(/<[^>]*>/g," ")
    .replace(/&lt;br\s*\/?&gt;/gi,"\n")
    .replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'")
    .replace(/[ \t]+/g," ").split(FIRMA).join("").trim();

  function pintarChat(mantener){
    if(!sel){
      $("chatH").innerHTML='<span class="num">ELEGÍ UNA CONVERSACIÓN</span>';
      $("msgs").innerHTML='<div class="nada"><b>💬</b>BANDEJA DE WHATSAPP</div>'; $("pie").innerHTML=""; return;
    }
    /* De un vistazo: de qué farmacia escribe y quién es su comercial. */
    const casaH=delEquipo(sel.whatsapp_number);
    /* El nombre del padrón antes que el del perfil de WhatsApp, igual que en la lista */
    const nom=(casaH&&casaH.nombre)||sel._cliente||nom1(sel.whatsapp_partner_id)||sel.name||sel.whatsapp_number;
    const eq=cfg.pausadas.includes(sel.id), asig=cfg.asignadas[sel.id];
    const firmaCli=ficha ? (nom1(ficha.parent_id)||ficha.name||"") : "";
    const comercialCli=ficha ? nom1(ficha.user_id) : "";
    const bajo=[
      esc(sel.whatsapp_number||""),
      casaH ? "· "+esc(casaH.cargo||ROTULO_NIVEL[casaH.nivel]||"equipo") : "",
      (!casaH && firmaCli && firmaCli!==nom) ? "· "+esc(firmaCli) : "",
      (!casaH && comercialCli) ? "· comercial "+esc(String(comercialCli).split(" ")[0]) : "",
      asig ? "· asignada a "+esc(asig.nombre) : "",
    ].filter(Boolean).join(" ");
    $("chatH").innerHTML=`<div class="av">${esc(inicial(nom))}</div>
      <div><b>${esc(nom)}</b>${casaH?'<span class="pin casa" style="margin-left:7px">'+CHIP(casaH)+'</span>':""}<br><span class="num">${bajo}</span></div>
      <button class="hb ${eq?"":"stop"}" id="btnTomar" style="margin-left:auto;flex:none">${eq?"DEVOLVER AL BOT":"TOMAR"}</button>
      <button class="hb lila" id="btnAsig" style="flex:none">ASIGNAR</button>`;
    $("btnTomar").onclick=async()=>{
      if(eq) cfg.pausadas=cfg.pausadas.filter(x=>x!==sel.id);
      else cfg.pausadas=[...new Set([...cfg.pausadas,sel.id])];
      anotar("eq",eq?"vuelve al asistente":"la toma el equipo");
      await guardarCfg(); pintarChat(true);
    };
    $("btnAsig").onclick=abrirAsignar;

    const pid=id1(sel.whatsapp_partner_id);
    const firma=msgs.map(m=>m.id).join(",")+"|"+(esperandoRespuesta()?1:0)+"|"+Object.keys(transcritos).length;
    if(firma!==firmaMsgs){
      firmaMsgs=firma;
      const caja=$("msgs");
      const abajo=!mantener || (caja.scrollHeight-caja.scrollTop-caja.clientHeight)<90;
      let html=msgs.map(m=>{
        let txt=limpiar(m.body);
        /* Una nota de voz llega SIN texto: antes se descartaba la burbuja entera
           y en el panel no figuraba que el cliente había dicho algo. Desde acá no
           se pueden escuchar los audios, así que se muestra la transcripción. */
        const adj=(m.attachment_ids||[]);
        if(!txt && adj.length){
          const dicho=adj.map(a=>transcritos[a]).filter(Boolean).join(" ");
          const soyCli=Array.isArray(m.author_id)&&pid&&m.author_id[0]===pid&&!esDelBot(m);
          const qn=!soyCli?`<span class="qui">${esDelBot(m)?"ASISTENTE":esc(nom1(m.author_id)||"EQUIPO")}</span>`:"";
          const cl=claseAdj(adj);
          /* Sin tipo todavía (la consulta está en camino) no se afirma nada:
             decir "nota de voz" y que sea una foto es peor que decir "adjunto". */
          const rotulo=cl ? ROTULO[cl] : (transcribiendo?"📎 ADJUNTO":"📎 ADJUNTO");
          let cuerpo;
          if(cl && cl!=="audio"){
            /* Una imagen o un PDF no se transcriben: lo útil es el nombre. */
            const nom=adj.map(a=>(tiposAdj[a]||{}).nombre).filter(Boolean).join(", ");
            cuerpo=`<span class="dicho">${esc(nom||"(sin nombre)")}</span>`;
          }else{
            cuerpo=dicho
              ? `<span class="dicho">${esc(dicho)}</span>`
              : `<span class="pendiente">${transcribiendo?"pasando a texto…":(cl?"nota de voz (sin transcribir)":"leyendo el adjunto…")}</span>`;
          }
          return `<div class="m ${soyCli?"in":"out"}${esDelBot(m)?" bot":""}">${qn}`+
                 `<span class="voznota">${rotulo}</span><br>${cuerpo}`+
                 `<span class="hora">${esc(hora(m.date))}</span></div>`;
        }
        if(!txt) return "";
        if(esNota(m)) return `<div class="m nota">${esc(txt)}<span class="hora">${esc(hora(m.date))}</span></div>`;
        /* Los guardados ya traen quién habló: no hay author_id que mirar */
        const delCliente=m._quien ? m._quien==="cliente"
                                  : (Array.isArray(m.author_id)&&pid&&m.author_id[0]===pid&&!esDelBot(m));
        const delBot=m._quien ? m._quien==="asistente" : (!delCliente&&esDelBot(m));
        /* el asistente marca con 🎙️ lo que salió como nota de voz */
        let voz="";
        if(txt.startsWith("🎙️")){ txt=txt.replace(/^🎙️\s*/,""); voz='<span class="voznota">🎙️ NOTA DE VOZ</span><br>'; }
        const quien=!delCliente?`<span class="qui">${delBot?"ASISTENTE":esc(nom1(m.author_id)||"EQUIPO")}</span>`:"";
        return `<div class="m ${delCliente?"in":"out"}${delBot?" bot":""}">${quien}${voz}${esc(txt)}<span class="hora">${esc(hora(m.date))}</span></div>`;
      }).join("");
      if(!html) html='<div class="nada"><b>💬</b>SIN MENSAJES</div>';
      if(esperandoRespuesta()) html+='<div class="tipeo"><i></i><i></i><i></i></div>';
      caja.innerHTML=html;
      if(abajo) caja.scrollTop=caja.scrollHeight;
    }

    /* ventana de 24 h de WhatsApp: pasada esa hora solo se puede con plantilla */
    const hasta=sel.whatsapp_channel_valid_until?new Date(String(sel.whatsapp_channel_valid_until).replace(" ","T")+"Z"):null;
    const abierta=hasta && hasta.getTime()>Date.now();
    /* Una guardada es de solo lectura: es la copia, no la conversación viva.
       Sin esto se podría intentar escribirle a un chat que ya no existe. */
    /* En modo mirar NO se arma el cuadro de escribir: no está oculto, no existe.
       Lo que no está en la página no se puede volver a mostrar desde la consola. */
    const quiero=SOLO_MIRA?"mirar":(sel.guardado?"copia":((abierta||!hasta)?"caja":"aviso"));
    if($("pie").dataset.modo!==quiero){
      $("pie").dataset.modo=quiero;
      $("pie").innerHTML = quiero==="mirar"
        ? `<div class="aviso">👁 Estás viendo la conversación del asistente con tu cliente. Desde acá no se responde: si necesitás escribirle, hacelo desde tu WhatsApp.</div>`
        : (quiero==="caja"
        ? `<div class="responder"><textarea id="txt" rows="1" placeholder="Escribí tu respuesta…"></textarea><button class="enviar" id="btnEnv" title="Enviar">➤</button></div>`
        : (quiero==="copia"
        ? `<div class="aviso">🗄 Esto es la copia guardada por el asistente${sel.borrado?", y el chat ya no existe en Odoo":""}. Se lee, no se escribe: para responderle, buscá la conversación en la bandeja.</div>`
        : `<div class="aviso">⏳ Pasaron más de 24 horas desde el último mensaje del cliente. WhatsApp no permite escribirle libremente: hay que esperar a que escriba o mandarle una plantilla aprobada desde Odoo.</div>`));
      const t=$("txt");
      if(t){
        t.addEventListener("input",()=>{ t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,110)+"px"; });
        t.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); enviar(); } });
        $("btnEnv").onclick=enviar;
        if(!mantener) t.focus();
      }
    }
  }

  async function enviar(){
    const t=$("txt"); if(!t) return;
    const v=(t.value||"").trim(); if(!v||cargando||!sel) return;
    cargando=true; $("btnEnv").disabled=true; t.value=""; t.style.height="auto";
    try{
      await EYG.rpc("discuss.channel","message_post",[sel.id],
        {body:esc(v).replace(/\n/g,"<br>"), message_type:"whatsapp_message", subtype_xmlid:"mail.mt_comment"});
      /* al responder una persona, la conversación queda tomada por el equipo */
      if(!cfg.pausadas.includes(sel.id)){ cfg.pausadas=[...cfg.pausadas,sel.id]; await guardarCfg(); }
      await abrir(sel.id,true);
    }catch(e){
      alert("No pude enviar el mensaje: "+(e.message||e));

  /* ══ ficha del contacto ══ */
  /* Cuántos clientes activos tiene cada uno en el asistente. Sale de la tabla
     ya resuelta, no de Odoo. */
  let carteraDe=null;
  async function cargarCartera(){
    if(carteraDe) return carteraDe;
    carteraDe={};
    try{
      const {data}=await EYG.supa().from("wsp_canal_dueno").select("dueno,cliente").not("dueno","is",null);
      for(const r of data||[]){ (carteraDe[r.dueno]=carteraDe[r.dueno]||[]).push(r.cliente); }
    }catch(e){}
    return carteraDe;
  }

  async function cargarFicha(){
    if(!sel){ ficha=null; pintarFicha(); return; }
    /* A un miembro de EyG no se lo trata como cliente. Sus compras personales
       en Odoo son suyas: mostrarle "lista de precios", "saldo" y "últimos
       pedidos" es confundir a la persona con un cliente. Y el chip "FARMACIA"
       que aparecía salía de la lista de SU ficha personal — por eso Ruth, que
       atiende Instituciones, figuraba como farmacia. */
    const casaF=delEquipo(sel.whatsapp_number);
    if(casaF){ await cargarCartera(); ficha={ esEquipo:true, casa:casaF }; pintarFicha(); return; }
    /* En Odoo los teléfonos están escritos a mano ("+54 341 372-8663"), así que
       buscar los últimos 8 dígitos seguidos no encuentra nada: el guion los
       parte. Se busca por los últimos 4 —el único pedazo que queda junto en
       todos los formatos— y después se compara dígito contra dígito. */
    const dig=String(sel.whatsapp_number||"").replace(/\D/g,"");
    const ocho=dig.slice(-8);
    ficha=null;
    try{
      const todos=await EYG.rpc("res.partner","search_read",[["|",["phone","like",dig.slice(-4)],["mobile","like",dig.slice(-4)]]],
        {fields:["name","customer_rank","parent_id","property_product_pricelist","user_id","city","total_due","total_overdue","phone","mobile"],limit:150});
      const cands=(todos||[]).filter(p=>[p.phone,p.mobile].some(x=>{
        const t=String(x||"").replace(/\D/g,""); return t.length>=8 && t.slice(-8)===ocho;
      }));
      let reales=(cands||[]).filter(p=>(p.customer_rank||0)>0);
      /* Los teléfonos que se agregan desde el panel comercial quedan como
         CONTACTOS HIJOS del cliente, y un hijo tiene rango 0. Sin esto, quien
         escribe desde el segundo número figura como "NO ES CLIENTE" aunque el
         servidor ya lo haya resuelto bien. Pasó con Farmacia Vera. */
      if(!reales.length){
        const padres=[...new Set((cands||[]).map(p=>p.parent_id&&p.parent_id[0]).filter(Boolean))];
        if(padres.length){
          try{
            const arriba=await EYG.rpc("res.partner","read",[padres,
              ["name","customer_rank","parent_id","property_product_pricelist","user_id","city","total_due","total_overdue","phone","mobile"]],{});
            reales=(arriba||[]).filter(p=>(p.customer_rank||0)>0);
          }catch(e){}
        }
      }
      ficha=reales.sort((a,b)=>(b.customer_rank||0)-(a.customer_rank||0))[0]||(cands||[])[0]||null;
      if(ficha){
        const ped=await EYG.rpc("sale.order","search_read",[[["partner_id","=",ficha.id]]],
          {fields:["name","date_order","state","amount_untaxed"],order:"date_order desc",limit:3});
        ficha.pedidos=ped||[];
      }
    }catch(e){ /* la ficha es informativa: si falla, se muestra lo que hay */ }
    pintarFicha();
  }
  /* El segmento sale de la lista de precios asignada, PERO solo vale si es un
     cliente de verdad: en Odoo TODO contacto arrastra "(1) Farmacias" por ser
     la lista por defecto de la empresa — proveedores, contactos sueltos y hasta
     un CUIT sin nombre. Mostrarla en alguien que no es cliente es inventarle un
     segmento que nadie decidió. */
  function segmento(p){
    if(!p || (p.customer_rank||0)<=0) return null;
    const t=((nom1(p&&p.property_product_pricelist))||"").toLowerCase();
    if(/farmac/.test(t)) return {k:"FARMACIA",c:"far"};
    if(/instituc|samco|hospital|sanator|clinic|bionexo/.test(t)) return {k:"INSTITUCIÓN",c:"ins"};
    return null;
  }
  function pintarFicha(){
    const f=ficha;
    const firma=f?(f.esEquipo?("eq|"+f.casa.telefono):`${f.id}|${f.total_due}|${f.total_overdue}|${(f.pedidos||[]).map(p=>p.name).join()}`):"vacio";
    if(firma===firmaFicha) return;
    firmaFicha=firma;
    if(!sel){ $("ficha").innerHTML='<div class="vacio">SIN CONVERSACIÓN ABIERTA</div>'; return; }
    /* FICHA DE UN MIEMBRO DE EyG: su área, a qué atiende, su mail de la empresa
       y cuántos clientes tiene activos en el asistente. Nada de listas, saldos
       ni pedidos: eso es información de cliente y él no lo es. */
    if(f && f.esEquipo){
      const c=f.casa;
      const mios=(carteraDe&&carteraDe[c.user_id])||[];
      $("ficha").innerHTML=`
        <div class="nom">${esc(c.nombre||"")}</div>
        <div class="sub">Droguería EyG${c.telefono?" · "+esc(c.telefono):""}</div>
        <div class="chips">${chipsEquipo(c)}</div>
        <div class="datos">
          ${c.mail?`<div class="dato"><span class="k">MAIL</span><span class="v">${esc(c.mail)}</span></div>`:""}
          <div class="dato"><span class="k">EN EL ASISTENTE</span><span class="v">${mios.length?(mios.length+" cliente"+(mios.length===1?"":"s")+" con conversación abierta"):"sin conversaciones de clientes suyos"}</span></div>
        </div>`;
      return;
    }
    if(!f){
      $("ficha").innerHTML=`<div class="nom">${esc(nom1(sel.whatsapp_partner_id)||sel.whatsapp_number||"Desconocido")}</div>
        <div class="sub">${esc(sel.whatsapp_number||"")}</div>
        <div class="chips"><span class="chip no">NO ESTÁ EN ODOO</span></div>
        <div class="sub">Este número no coincide con ningún contacto. Si va a comprar, hay que darlo de alta.</div>`;
      return;
    }
    const seg=segmento(f), cli=(f.customer_rank||0)>0;
    const venc=Number(f.total_overdue||0), deuda=Number(f.total_due||0);
    const chips=[
      seg?`<span class="chip ${seg.c}">${seg.k}</span>`:"",
      cli?'<span class="chip cli">CLIENTE</span>':'<span class="chip no">NO ES CLIENTE</span>',
      venc>0?`<span class="chip deu">VENCIDO ${plata(venc)}</span>`:"",
    ].filter(Boolean).join("");
    const ult=(f.pedidos||[])[0];
    const estados={draft:"presupuesto",sent:"presupuesto enviado",sale:"confirmado",done:"finalizado",cancel:"cancelado"};
    $("ficha").innerHTML=`
      <div class="nom">${esc(f.name||"")}</div>
      <div class="sub">${esc(nom1(f.parent_id)||f.city||sel.whatsapp_number||"")}</div>
      <div class="chips">${chips}</div>
      <div class="datos">
        <div class="dato"><span class="k">COMERCIAL</span><span class="v">${esc(nom1(f.user_id)||"sin asignar")}</span></div>
        ${cli?`<div class="dato"><span class="k">LISTA</span><span class="v">${esc(nom1(f.property_product_pricelist)||"—")}</span></div>`:""}
        <div class="dato"><span class="k">SALDO</span><span class="v ${venc>0?"err":""}">${plata(deuda)}${venc>0?" · "+plata(venc)+" vencido":""}</span></div>
        ${ult?`<div class="dato"><span class="k">ÚLTIMO</span><span class="v">${esc(ult.name)} · ${esc(String(ult.date_order||"").slice(0,10).split("-").reverse().join("/"))}<br><span style="color:var(--hud-dim);font-weight:400">${esc(estados[ult.state]||ult.state)} · ${plata(ult.amount_untaxed)}</span></span></div>`:""}
      </div>`;
  }

  /* ══ asignar la conversación a un comercial ══ */
  async function abrirAsignar(){
    if(!sel) return;
    if(!comerciales.length){
      try{
        const g=await EYG.rpc("res.partner","read_group",[[["customer_rank",">",0],["user_id","!=",false]],["id"],["user_id"]],{limit:40});
        const ids=(g||[]).map(x=>id1(x.user_id)).filter(Boolean);
        const us=await EYG.rpc("res.users","search_read",[[["id","in",ids]]],{fields:["name","partner_id"],limit:40});
        const cuenta={}; (g||[]).forEach(x=>{ cuenta[id1(x.user_id)]=x.user_id_count||x.__count||0; });
        comerciales=(us||[]).map(u=>({id:u.id,nombre:u.name,partner:id1(u.partner_id),clientes:cuenta[u.id]||0}))
                            .sort((a,b)=>b.clientes-a.clientes);
      }catch(e){ comerciales=[]; }
    }
    const actual=cfg.asignadas[sel.id];
    const sug=ficha&&id1(ficha.user_id);
    const d=document.createElement("div");
    d.className="scrim";
    d.innerHTML=`<div class="modal">
      <h3>Asignar la conversación</h3>
      <p>El chat queda a cargo de esa persona: el asistente deja de responder y en la bandeja figura con su nombre. Se puede devolver al asistente cuando quieran.</p>
      ${sug?`<div class="hint">El comercial de este cliente en Odoo es <b>${esc(nom1(ficha.user_id))}</b>.</div>`:""}
      <label>A QUIÉN</label>
      <div class="gente">${comerciales.map(c=>`
        <div class="quien ${actual&&actual.id===c.id?"act":""} ${c.id===sug?"act":""}" data-id="${c.id}">
          <span class="ini">${esc(inicial(c.nombre))}</span>
          <span class="nm">${esc(c.nombre)}</span>
          <span class="ct">${c.clientes} clientes</span>
        </div>`).join("")||'<div class="vacio">NO PUDE TRAER LA LISTA</div>'}</div>
      <div class="acc">
        ${actual?'<button class="hb sm" id="quitar">QUITAR ASIGNACIÓN</button>':""}
        <button class="hb sm" id="cerrar">CANCELAR</button>
      </div>
    </div>`;
    document.body.appendChild(d);
    d.querySelector("#cerrar").onclick=()=>d.remove();
    d.onclick=e=>{ if(e.target===d) d.remove(); };
    const q=d.querySelector("#quitar");
    if(q) q.onclick=async()=>{ delete cfg.asignadas[sel.id]; anotar("asig","asignación quitada"); await guardarCfg(); pintarChat(true); d.remove(); };
    d.querySelectorAll(".quien").forEach(el=>el.onclick=async()=>{
      const c=comerciales.find(x=>x.id===Number(el.dataset.id));
      if(!c) return;
      cfg.asignadas[sel.id]={id:c.id,nombre:c.nombre};
      if(!cfg.pausadas.includes(sel.id)) cfg.pausadas=[...cfg.pausadas,sel.id];
      await guardarCfg();
      /* queda constancia en la conversación y, si se puede, le llega en Odoo */
      EYG.rpc("discuss.channel","message_post",[sel.id],
        {body:`👤 <b>Conversación asignada a ${esc(c.nombre)}</b><br/>El asistente deja de responder en este chat.`,
         message_type:"comment", subtype_xmlid:"mail.mt_note"}).catch(()=>{});
      if(c.partner) EYG.rpc("discuss.channel","add_members",[[sel.id]],{partner_ids:[c.partner]}).catch(()=>{});
      anotar("asig","asignada a "+c.nombre);
      pintarChat(true); d.remove();
    });
  }
