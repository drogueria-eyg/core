<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=37"></script>
<style>
  :root{
    --teal:#048782; --teal-deep:#04635F; --teal-med:#0AA89F; --agua:#E2F1EF;
    --ink:#0E1F1D; --gris:#5F716E; --gris2:#8A9A97; --surface:#fff; --bg:#F4F8F7;
    --line:#DCE8E6; --shadow:0 1px 2px rgba(6,65,62,.05), 0 6px 24px rgba(6,65,62,.06);
    --wsp:#25D366; --wspd:#128C7E; --coral:#EC8B5E; --rojo:#B0413E; --amar:#B7791F;
    --burb:#DCF8C6; --chatbg:#ECE5DD;
  }
  .wa{max-width:1180px;margin:0 auto;padding:16px}

  /* barra de estado del bot */
  .botbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 18px;margin-bottom:14px}
  .botbar .ico{width:38px;height:38px;border-radius:10px;background:var(--wsp);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
  .botbar h2{font-size:15px;font-weight:800;color:var(--ink)}
  .botbar p{font-size:12.5px;color:var(--gris);line-height:1.4}
  .estado{font-size:11px;font-weight:800;letter-spacing:.5px;border-radius:20px;padding:4px 11px;text-transform:uppercase}
  .estado.on{background:#E4F5E9;color:#1E7D46} .estado.off{background:#FBF3D9;color:var(--amar)}
  .sw{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border:0;border-radius:9px;padding:9px 15px;cursor:pointer;transition:filter .12s}
  .btn:hover{filter:brightness(1.08)}
  .btn.p{background:var(--teal);color:#fff} .btn.g{background:var(--agua);color:var(--teal-deep)}
  .btn.on{background:var(--wsp);color:#fff} .btn.off{background:#FBE0DF;color:var(--rojo)}
  .btn:disabled{opacity:.5;cursor:default}

  /* layout bandeja */
  .box{display:grid;grid-template-columns:320px 1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;height:calc(100vh - 210px);min-height:460px}
  .lista{border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  .lista .h{padding:12px 14px;border-bottom:1px solid var(--line);font-size:12px;font-weight:800;color:var(--gris);letter-spacing:.5px}
  .convs{flex:1;overflow-y:auto}
  .conv{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
  .conv:hover{background:var(--bg)} .conv.act{background:var(--agua)}
  .conv .n{font-size:13.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px}
  .conv .t{font-size:11.5px;color:var(--gris2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conv .f{font-size:10.5px;color:var(--gris2);float:right;font-weight:600}
  .pin{font-size:9px;font-weight:800;border-radius:20px;padding:1px 7px;background:#FBE9CF;color:var(--amar)}
  .pin.bot{background:#E4F5E9;color:#1E7D46}
  .vacio{padding:30px 16px;text-align:center;color:var(--gris2);font-size:13px;line-height:1.6}

  /* chat */
  .chat{display:flex;flex-direction:column;overflow:hidden}
  .chat .h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .chat .h b{font-size:14px;color:var(--ink)} .chat .h span{font-size:12px;color:var(--gris)}
  .msgs{flex:1;overflow-y:auto;padding:16px;background:var(--chatbg);display:flex;flex-direction:column;gap:8px}
  .m{max-width:72%;border-radius:9px;padding:8px 11px;font-size:13.5px;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.09);word-wrap:break-word;white-space:pre-wrap}
  .m.in{align-self:flex-start;background:#fff}
  .m.out{align-self:flex-end;background:var(--burb)}
  .m.nota{align-self:center;background:#FFF4D6;border:1px solid #F0D9A0;font-size:12px;color:#7A5B12;max-width:88%}
  .m .hora{display:block;font-size:9.5px;color:var(--gris2);text-align:right;margin-top:3px}
  .m .qui{display:block;font-size:9.5px;font-weight:800;color:var(--teal-deep);margin-bottom:2px}
  .responder{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:9px}
  .responder textarea{flex:1;font-family:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;resize:none;outline:none;max-height:90px;background:var(--bg)}
  .responder textarea:focus{border-color:var(--teal-med);background:#fff}
  .aviso{padding:10px 14px;background:#FBF3D9;color:var(--amar);font-size:12px;border-top:1px solid #F0D9A0;line-height:1.5}

  /* modal config */
  .scrim{position:fixed;inset:0;background:rgba(6,32,30,.5);display:flex;align-items:center;justify-content:center;z-index:80;padding:18px}
  .modal{background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.28);max-width:520px;width:100%;padding:22px}
  .modal h3{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:4px}
  .modal p{font-size:13px;color:var(--gris);line-height:1.55;margin-bottom:14px}
  .modal label{display:block;font-size:12px;font-weight:700;color:var(--ink);margin:12px 0 5px}
  .modal input,.modal textarea{width:100%;font-family:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;outline:none;background:var(--bg)}
  .modal input:focus,.modal textarea:focus{border-color:var(--teal-med);background:#fff}
  .modal .hint{font-size:11.5px;color:var(--gris2);margin-top:5px;line-height:1.5}
  .modal .acc{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}

  @media(max-width:860px){ .box{grid-template-columns:1fr;height:auto} .lista{border-right:0;border-bottom:1px solid var(--line);max-height:230px} .msgs{min-height:300px} }
</style>
</head>
<body>
<div class="wa" id="app" style="display:none">

  <div class="botbar">
    <div class="ico">💬</div>
    <div>
      <h2>WhatsApp de EyG <span class="estado off" id="est">apagado</span></h2>
      <p id="sub">Cargando…</p>
    </div>
    <div class="sw">
      <button class="btn g" id="btnCfg">⚙️ Configurar</button>
      <button class="btn on" id="btnSw">Encender bot</button>
      <button class="btn g" id="btnRef">↻</button>
    </div>
  </div>

  <div class="box">
    <div class="lista">
      <div class="h">CONVERSACIONES</div>
      <div class="convs" id="convs"><div class="vacio">Cargando…</div></div>
    </div>
    <div class="chat">
      <div class="h" id="chatH"><span>Elegí una conversación</span></div>
      <div class="msgs" id="msgs"></div>
      <div id="pie"></div>
    </div>
  </div>
</div>

<script>
EYG.guard(["direccion","comercial","lider","admin"],{pruebas:["a3dfd1b309dd41ad2c8ae3562a8e00c09ae03f8dd8194b75eea5a3db5c003122"]}).then(perfil=>{
  const $=id=>document.getElementById(id);
  const PARAM="eyg.wsp_bot";
  let cfg={activo:false,numeros:[],pausadas:[]};
  let convs=[], sel=null, msgs=[], cargando=false;
  $("app").style.display="";

  const esc=EYG.esc;
  const hora=s=>{ try{ const p=EYG.argParts(s); return p.hm; }catch(e){ return ""; } };
  const dia=s=>{ try{ const p=EYG.argParts(s); const h=EYG.argToday(); return p.date===h?p.hm:p.date.slice(5).split("-").reverse().join("/"); }catch(e){ return ""; } };

  /* ── configuración del bot (parámetro de Odoo) ── */
  async function leerCfg(){
    try{
      const raw=await EYG.rpc("ir.config_parameter","get_param",[PARAM]);
      const c=JSON.parse(raw||"{}")||{};
      cfg={activo:c.activo===true, numeros:Array.isArray(c.numeros)?c.numeros:[], pausadas:Array.isArray(c.pausadas)?c.pausadas:[]};
    }catch(e){ cfg={activo:false,numeros:[],pausadas:[]}; }
    pintarBot();
  }
  async function guardarCfg(){
    await EYG.rpc("ir.config_parameter","set_param",[PARAM,JSON.stringify(cfg)]);
    pintarBot(); pintarConvs();
  }
  function pintarBot(){
    const e=$("est"), b=$("btnSw");
    e.className="estado "+(cfg.activo?"on":"off");
    e.textContent=cfg.activo?"respondiendo":"apagado";
    b.className="btn "+(cfg.activo?"off":"on");
    b.textContent=cfg.activo?"Apagar bot":"Encender bot";
    const n=cfg.numeros.length, p=cfg.pausadas.length;
    $("sub").innerHTML = cfg.activo
      ? (n? `El asistente responde SOLO a ${n} número${n>1?"s":""} de prueba.` : "El asistente responde automáticamente a todos los clientes.")
        + (p? ` · ${p} conversación${p>1?"es":""} tomada${p>1?"s":""} por el equipo.` : "")
      : "El asistente NO responde: los mensajes entran igual y los contesta el equipo desde acá.";
  }

  /* ── bandeja ── */
  async function cargarConvs(){
    try{
      const r=await EYG.rpc("discuss.channel","search_read",[[["channel_type","=","whatsapp"]]],
        {fields:["name","whatsapp_number","whatsapp_partner_id","whatsapp_channel_valid_until","write_date"],order:"write_date desc",limit:60});
      convs=r||[];
    }catch(e){ convs=[]; }
    pintarConvs();
  }
  function pintarConvs(){
    const c=$("convs");
    if(!convs.length){ c.innerHTML='<div class="vacio">Todavía no hay conversaciones.<br><br>Cuando un cliente escriba al WhatsApp de EyG, va a aparecer acá.</div>'; return; }
    c.innerHTML=convs.map(v=>{
      const pausada=cfg.pausadas.includes(v.id);
      const nom=(Array.isArray(v.whatsapp_partner_id)&&v.whatsapp_partner_id[1])||v.name||v.whatsapp_number||"Sin nombre";
      return `<div class="conv ${sel&&sel.id===v.id?"act":""}" data-id="${v.id}">
        <span class="f">${esc(dia(v.write_date))}</span>
        <div class="n">${esc(nom)} ${pausada?'<span class="pin">equipo</span>':(cfg.activo?'<span class="pin bot">bot</span>':"")}</div>
        <div class="t">${esc(v.whatsapp_number||"")}</div>
      </div>`;
    }).join("");
    c.querySelectorAll(".conv").forEach(el=>el.onclick=()=>abrir(Number(el.dataset.id)));
  }

  async function abrir(id){
    sel=convs.find(v=>v.id===id)||null;
    if(!sel) return;
    pintarConvs();
    $("msgs").innerHTML='<div class="vacio">Cargando…</div>';
    try{
      msgs=await EYG.rpc("mail.message","search_read",[[["model","=","discuss.channel"],["res_id","=",id]]],
        {fields:["body","author_id","message_type","date","subtype_id"],order:"id desc",limit:80});
      msgs=(msgs||[]).slice().reverse();
    }catch(e){ msgs=[]; }
    pintarChat();
  }

  function pintarChat(){
    if(!sel){ $("chatH").innerHTML="<span>Elegí una conversación</span>"; $("msgs").innerHTML=""; $("pie").innerHTML=""; return; }
    const nom=(Array.isArray(sel.whatsapp_partner_id)&&sel.whatsapp_partner_id[1])||sel.name||sel.whatsapp_number;
    const pausada=cfg.pausadas.includes(sel.id);
    $("chatH").innerHTML=`<b>${esc(nom)}</b><span>${esc(sel.whatsapp_number||"")}</span>
      <button class="btn ${pausada?"g":"p"}" id="btnTomar" style="margin-left:auto;font-size:12px;padding:7px 12px">${pausada?"Devolver al bot":"Tomar conversación"}</button>`;
    $("btnTomar").onclick=async()=>{
      if(pausada) cfg.pausadas=cfg.pausadas.filter(x=>x!==sel.id);
      else cfg.pausadas=[...new Set([...cfg.pausadas,sel.id])];
      await guardarCfg(); pintarChat();
    };

    const partnerId=Array.isArray(sel.whatsapp_partner_id)?sel.whatsapp_partner_id[0]:null;
    $("msgs").innerHTML=msgs.map(m=>{
      const txt=String(m.body||"").replace(/<br\s*\/?>/gi,"\n").replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/[ \t]+/g," ").trim();
      if(!txt) return "";
      const esNota=Array.isArray(m.subtype_id)&&/note|nota/i.test(m.subtype_id[1]||"");
      if(esNota) return `<div class="m nota">${esc(txt)}<span class="hora">${esc(hora(m.date))}</span></div>`;
      const delCliente=Array.isArray(m.author_id)&&partnerId&&m.author_id[0]===partnerId;
      const quien=!delCliente&&Array.isArray(m.author_id)?`<span class="qui">${esc(m.author_id[1]||"")}</span>`:"";
      return `<div class="m ${delCliente?"in":"out"}">${quien}${esc(txt)}<span class="hora">${esc(hora(m.date))}</span></div>`;
    }).join("")||'<div class="vacio">Sin mensajes.</div>';
    $("msgs").scrollTop=$("msgs").scrollHeight;

    /* ventana de 24 h: WhatsApp solo deja responder libremente dentro de las 24 h
       del último mensaje del cliente. Después hay que usar una plantilla aprobada. */
    const hasta=sel.whatsapp_channel_valid_until?new Date(String(sel.whatsapp_channel_valid_until).replace(" ","T")+"Z"):null;
    const abierta=hasta && hasta.getTime()>Date.now();
    $("pie").innerHTML = abierta || !hasta
      ? `<div class="responder"><textarea id="txt" rows="1" placeholder="Escribí tu respuesta…"></textarea><button class="btn p" id="btnEnv">Enviar</button></div>`
      : `<div class="aviso">⏳ Pasaron más de 24 horas desde el último mensaje del cliente. WhatsApp no permite escribirle libremente: hay que esperar a que escriba o mandarle una plantilla aprobada desde Odoo.</div>`;
    const t=$("txt");
    if(t){
      t.addEventListener("input",()=>{ t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,90)+"px"; });
      t.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); enviar(); } });
      $("btnEnv").onclick=enviar;
      t.focus();
    }
  }

  async function enviar(){
    const t=$("txt"); if(!t) return;
    const v=(t.value||"").trim(); if(!v||cargando||!sel) return;
    cargando=true; $("btnEnv").disabled=true; t.value="";
    try{
      await EYG.rpc("discuss.channel","message_post",[sel.id],
        {body:esc(v).replace(/\n/g,"<br>"), message_type:"whatsapp_message", subtype_xmlid:"mail.mt_comment"});
      /* al responder una persona, la conversación queda tomada por el equipo */
      if(!cfg.pausadas.includes(sel.id)){ cfg.pausadas=[...cfg.pausadas,sel.id]; await guardarCfg(); }
      await abrir(sel.id);
    }catch(e){
      alert("No pude enviar el mensaje: "+(e.message||e));
      t.value=v;
    }
    cargando=false; const b=$("btnEnv"); if(b) b.disabled=false;
  }

  /* ── modal de configuración ── */
  $("btnCfg").onclick=()=>{
    const d=document.createElement("div");
    d.className="scrim";
    d.innerHTML=`<div class="modal">
      <h3>Configurar el asistente de WhatsApp</h3>
      <p>El asistente responde consultas simples (si tenemos un producto, el estado de un pedido) y <b>deriva al equipo</b> todo lo delicado: precios, plata, reclamos y consultas de salud.</p>
      <label>Números de prueba</label>
      <input id="cfgNums" value="${esc(cfg.numeros.join(", "))}" placeholder="3412809081, 3415551234">
      <div class="hint">Mientras haya números acá, el asistente <b>solo</b> le responde a ellos. Dejalo vacío para que atienda a todos los clientes.</div>
      <div class="acc"><button class="btn g" id="cfgX">Cancelar</button><button class="btn p" id="cfgOk">Guardar</button></div>
    </div>`;
    document.body.appendChild(d);
    d.querySelector("#cfgX").onclick=()=>d.remove();
    d.onclick=e=>{ if(e.target===d) d.remove(); };
    d.querySelector("#cfgOk").onclick=async()=>{
      cfg.numeros=(d.querySelector("#cfgNums").value||"").split(",").map(x=>x.replace(/\D/g,"")).filter(Boolean);
      await guardarCfg(); d.remove();
    };
  };

  $("btnSw").onclick=async()=>{
    if(!cfg.activo && !cfg.numeros.length){
      if(!confirm("El asistente va a responderle AUTOMÁTICAMENTE a todos los clientes que escriban.\n\nSi querés probarlo primero, cancelá y cargá tu número en Configurar.\n\n¿Encender igual?")) return;
    }
    cfg.activo=!cfg.activo; await guardarCfg();
  };
  $("btnRef").onclick=async()=>{ await leerCfg(); await cargarConvs(); if(sel) await abrir(sel.id); };

  (async()=>{ await leerCfg(); await cargarConvs(); })();
  /* refresco suave: trae mensajes nuevos sin molestar mientras escribís */
  setInterval(async()=>{
    if(cargando) return;
    const t=$("txt"); if(t && t.value.trim()) return;
    await cargarConvs(); if(sel) await abrir(sel.id);
  },20000);
});
</script>
</body>
</html>
