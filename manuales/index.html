<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manuales · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<style>
  .intro{color:var(--gris);font-size:14.5px;line-height:1.55;max-width:660px;margin-bottom:22px}
  .area{margin-bottom:26px}
  .area h2{font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--teal-deep);
           display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .area h2 .ln{flex:1;height:1px;background:var(--line)}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .man{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;
       box-shadow:var(--shadow);padding:18px 20px;text-decoration:none;color:inherit;transition:transform .12s,box-shadow .12s;position:relative}
  .man:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(6,65,62,.12)}
  .man .ico{width:44px;height:44px;border-radius:12px;background:var(--agua);color:var(--teal-deep);
            display:grid;place-items:center;font-size:22px;margin-bottom:13px}
  .man .tipo{position:absolute;top:16px;right:16px;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
             background:#F0F6F5;color:var(--teal-med);border-radius:20px;padding:3px 10px}
  .man h3{font-size:17px;font-weight:800;margin-bottom:5px}
  .man p{font-size:13px;color:var(--gris);line-height:1.5;flex:1}
  .man .go{margin-top:14px;font-size:13px;font-weight:800;color:var(--teal)}
  .empty{padding:34px;text-align:center;color:var(--gris);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
  .soonrow{margin-top:6px;display:flex;gap:9px;flex-wrap:wrap}
  .soonchip{font-size:12px;font-weight:600;color:var(--gris2);background:var(--surface);border:1px dashed var(--line);border-radius:20px;padding:7px 13px}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=42"></script>
<script>
/* ============ EyG Core · Manuales ============
   Biblioteca central de guías, instructivos e inducción, organizada por área
   y visible según el rol. Cada manual es una página aparte; acá viven los enlaces.
   El Guion Comercial vive solo en esta biblioteca (se quitó el atajo que había
   en el panel del comercial). */
const esc=s=>EYG.esc(s);

/* Registro de manuales. Para sumar uno nuevo: agregá un objeto acá.
   roles: quién lo ve (admin/dirección ven todo igual). */
const MANUALES = [
  { area:"Comercial", ico:"💬", titulo:"Guion Comercial", tipo:"Inducción",
    desc:"Cómo abrir una farmacia: cuándo llamar o mandar WhatsApp, plantillas listas para copiar, guion de visita paso a paso y manejo de objeciones. Para inducir comerciales nuevas.",
    path:"../comercial/guion.html", roles:["comercial","lider","admin","direccion"] },
];

/* Áreas que ya tienen su departamento en el Core pero todavía sin manuales:
   se muestran como "en preparación" para que se vea que el espacio existe. */
const PROXIMAS = ["Depósito y Logística", "Calidad", "Cobranzas", "Compras"];

function puedeVer(m, p){
  if(p.rol==="admin"||p.rol==="direccion") return true;
  return (m.roles||[]).includes(p.rol);
}

function render(p){
  const vis = MANUALES.filter(m=>puedeVer(m,p));
  const areas = [...new Set(vis.map(m=>m.area))];
  let html = `<p class="intro">La biblioteca de la droguería: guías, instructivos e inducción del equipo, ordenados por área. Elegí un manual para abrirlo.</p>`;

  if(!vis.length){
    html += `<div class="empty">Todavía no hay manuales para tu área. Van a ir apareciendo acá.</div>`;
  } else {
    areas.forEach(a=>{
      const items = vis.filter(m=>m.area===a);
      html += `<div class="area"><h2>${esc(a)}<span class="ln"></span></h2><div class="mgrid">`;
      items.forEach(m=>{
        html += `<a class="man" href="${esc(m.path)}">
          <span class="tipo">${esc(m.tipo)}</span>
          <span class="ico">${m.ico}</span>
          <h3>${esc(m.titulo)}</h3>
          <p>${esc(m.desc)}</p>
          <span class="go">Abrir →</span>
        </a>`;
      });
      html += `</div></div>`;
    });
  }

  // Áreas en preparación (solo para gerencia/líderes, como guía de lo que falta)
  if(p.rol==="admin"||p.rol==="direccion"||p.rol==="lider"){
    html += `<div class="area"><h2>En preparación<span class="ln"></span></h2>
      <div class="soonrow">${PROXIMAS.map(a=>`<span class="soonchip">${esc(a)}</span>`).join("")}</div></div>`;
  }

  document.body.innerHTML = EYG.layout(p, "manuales", html, "Manuales");
}

EYG.requireAuth(["lider"], perfil=>{ render(perfil); });
</script>
</body>
</html>
