<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Altas de clientes · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css?v=83">
<style>
  .intro{font-size:13.5px;color:var(--gris);margin-bottom:14px;line-height:1.5;max-width:820px}
  .btn{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:var(--teal-deep)} .btn:disabled{opacity:.55;cursor:default}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--gris)} .btn.ghost:hover{border-color:var(--teal-med)}
  .btn.warn{background:#fff;border:1px solid #f0b8b5;color:#b0322f} .btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:15px 16px;margin-bottom:13px}
  .card .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer}
  .card h3{font-size:15.5px;font-weight:800;line-height:1.3;flex:1;min-width:200px}
  .card .cuerpo{font-size:13.5px;color:var(--gris);line-height:1.45;margin-top:8px}
  .card .meta{font-size:11.5px;color:var(--gris2);margin-top:9px;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
  .card .acts{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
  .pill{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;border-radius:20px;padding:2px 9px;white-space:nowrap}
  .pill.dest{background:var(--agua);color:var(--teal-deep)} .pill.prog{background:#fbf0d6;color:#9a6a0b} .pill.off{background:#eee;color:#888} .pill.tipo{background:#eef2f7;color:#41556b}
  .empty{padding:34px;text-align:center;color:var(--gris);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
  .chks{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .chk{border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--gris);font-family:inherit}
  .chk.on{border-color:var(--teal);background:var(--agua);color:var(--teal-deep)}
  .det{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media (max-width:900px){.cols{grid-template-columns:1fr}}
  .sub{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--gris2);margin:0 0 6px}
  .lista{width:100%;border-collapse:collapse;font-size:13px}
  .lista td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
  .lista tr:first-child td{border-top:0}
  .lista td.k{color:var(--gris2);white-space:nowrap;width:1%;padding-right:12px}
  .aviso{border-radius:11px;padding:10px 13px;font-size:13px;margin:10px 0;line-height:1.45}
  .aviso.amar{background:#fdf5e3;border:1px solid #f1dca8;color:#7a5410}
  .aviso.rojo{background:#fbebe9;border:1px solid #f0c6c1;color:#8a2f25}
  .aviso a{color:inherit;font-weight:700}
  .decidir{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
  .fld{margin-bottom:12px} .fld label{display:block;font-size:12px;font-weight:700;color:var(--gris);margin-bottom:5px}
  .fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff}
  .fld textarea{min-height:80px;resize:vertical}
  .grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .hint{font-size:11.5px;color:var(--gris2);margin-top:4px}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;margin:44px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 26px rgba(0,0,0,.25);z-index:999;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .hab{border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:11px;padding:11px 13px;margin-top:6px;background:#fff}
  .hab.falta{border-left-color:#B7791F;background:#fdf9ef}
  .hab .t{font-size:13.5px;font-weight:700;margin-bottom:4px}
  .hab .acts{margin-top:9px}
  .hab .arch{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
  .hab .quitar{border:0;background:none;color:var(--gris2);font:inherit;font-size:11.5px;text-decoration:underline;cursor:pointer;padding:0 4px}
</style>

<body>
<script>
/* ============ EyG Core · Altas de clientes ============
   Las solicitudes que llegan del formulario drogueriaeyg.odoo.com/alta. La
   edge function `portal-alta` ya leyó la habilitación, consultó ARCA y miró
   Odoo; acá una persona decide. NINGUNA SE APRUEBA SOLA (Dirección, 2/11/2026:
   "pueden haber intrusos"). Aprueban Germán Banquero y Bárbara Moscato (y los
   admin): la lista vive en el parámetro de Odoo eyg.portal_altas y la que
   manda es la función, no esta pantalla. En Odoo no hay nada hasta aprobar.
   LA HABILITACIÓN (DECIDE) YA NO LA PIDE EL FORMULARIO (Dirección, 2/11/2026:
   frenaba el alta, algunas farmacias no la tienen a mano). Se le pide al cliente
   y se sube acá; al subirla, la función la lee y la cruza con el CUIT. */
const esc=s=>EYG.esc(s);
let D=null, FILTRO="revisar", ABIERTA=null, OCUPADO=false;
const SEM={verde:["#1E7D46","Todo coincide"],amarillo:["#B7791F","Hay algo para mirar"],rojo:["#B0322F","No cierra"]};
const EST={revisar:["prog","Para revisar"],error:["prog","No se pudo analizar"],analizando:["prog","Analizando"],recibida:["prog","Recibida"],aprobada:["dest","Aprobada"],rechazada:["off","Rechazada"]};
let toastT; function toast(m,ok){ const t=document.getElementById("toast"); if(!t)return; t.textContent=m; t.className="toast show"+(ok?" ok":""); clearTimeout(toastT); toastT=setTimeout(()=>t.className="toast",3000); }
const fAR=t=>{ if(!t) return ""; const d=new Date(t); if(isNaN(d)) return String(t).slice(0,16); return d.toLocaleString("es-AR",{timeZone:"America/Argentina/Buenos_Aires",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).replace(",",""); };
const fCuit=c=>{c=String(c||"");return c.length===11?c.slice(0,2)+"-"+c.slice(2,10)+"-"+c.slice(10):c;};
const fFecha=s=>s?String(s).split("-").reverse().join("/"):"";
const soloDig=s=>String(s||"").replace(/\D/g,"");
// Teléfono para WhatsApp: 54 9 + característica + número (sin 0 ni 15). Si no se puede armar, sólo se muestra.
function waNum(t){ let d=soloDig(t); if(d.startsWith("54")) d=d.slice(2); if(d.startsWith("9")) d=d.slice(1); if(d.startsWith("0")) d=d.slice(1); if(d.length===12&&/^\d{2,4}15/.test(d)) d=d.replace(/^(\d{2,4})15/,"$1"); return d.length===10?"549"+d:""; }
function telLinks(t){ const w=waNum(t); return `<b>${esc(t)}</b>${w?` · <a href="https://api.whatsapp.com/send?phone=${w}" target="_blank" rel="noopener">WhatsApp</a>`:""} · <a href="tel:${esc(soloDig(t))}">llamar</a>`; }

async function fn(body){
  const r=await EYG.supa().functions.invoke("portal-alta",{body});
  if(r.error){ let m=r.error.message||String(r.error); try{ const j=await r.error.context.json(); m=j.error||(j.errores||[]).join(" · ")||m; }catch(e){} throw new Error(m); }
  if(r.data&&r.data.ok===false) throw new Error(r.data.error||"Error");
  return r.data;
}

EYG.guard(["admin","direccion"]).then(perfil=>{
  document.body.innerHTML = EYG.layout(perfil,"altas",'<div id="cont"><div class="spin"></div></div><div class="toast" id="toast"></div>',"Altas de clientes");
  cargar();
});
async function cargar(){
  try{ D=await fn({accion:"listar"}); }
  catch(e){ document.getElementById("cont").innerHTML=`<div class="empty">🔒 ${esc(e.message)}</div>`; return; }
  render();
}
const pend=a=>a.estado==="revisar"||a.estado==="error";
function render(){
  const cont=document.getElementById("cont"); if(!cont||!D) return;
  const real=D.altas.filter(a=>!(a.datos&&a.datos.prueba));
  const n={revisar:real.filter(pend).length, aprobada:real.filter(a=>a.estado==="aprobada").length, rechazada:real.filter(a=>a.estado==="rechazada").length, todas:D.altas.length};
  const lista=FILTRO==="todas"?D.altas:FILTRO==="revisar"?real.filter(pend):real.filter(a=>a.estado===FILTRO);
  const chip=(k,l)=>`<button class="chk ${FILTRO===k?'on':''}" onclick="FILTRO='${k}';render()">${l} · ${n[k]}</button>`;
  cont.innerHTML=`<p class="intro">Clientes que pidieron acceso desde <a href="https://drogueriaeyg.odoo.com/alta" target="_blank" rel="noopener">drogueriaeyg.odoo.com/alta</a>. El sistema ya consultó el CUIT en ARCA y lo buscó en Odoo; <b>ninguna se aprueba sola</b>. La habilitación no se pide en el formulario: se le pide al cliente y se sube en cada solicitud, y el sistema la lee y la cruza con el CUIT. Al aprobar se crea la ficha (o se usa la que ya existe), se carga el legajo y se habilita el usuario del portal con la contraseña que el cliente eligió al pedir el alta; se le avisa por correo. Si se rechaza, en Odoo no queda nada.</p>
    <div class="chks">${chip("revisar","Para revisar")}${chip("aprobada","Aprobadas")}${chip("rechazada","Rechazadas")}${chip("todas","Todas")}</div>
    ${lista.length?lista.map(tarjeta).join(""):`<div class="empty">${FILTRO==="revisar"?"No hay solicitudes pendientes de revisión.":"No hay solicitudes en esta vista."}</div>`}`;
}
function tarjeta(a){
  const d=a.datos||{}, an=a.analisis||{}, sem=SEM[a.semaforo]||["#8A9A97","Sin analizar"], est=EST[a.estado]||["off",a.estado];
  const tipo=(D.tipos.find(t=>t.k===(an.tipo||d.tipo))||{}).nom||"";
  const res=a.resultado||{}, abierta=ABIERTA===a.id;
  return `<div class="card" style="border-left:5px solid ${sem[0]}">
    <div class="top" onclick="ABIERTA=${abierta?'null':`'${a.id}'`};render()">
      <span title="${sem[1]}" style="width:11px;height:11px;border-radius:50%;background:${sem[0]};flex:none"></span>
      <h3>${esc(d.razon||"")}${d.cartel?` <span style="font-weight:600;color:var(--gris)">· ${esc(d.cartel)}</span>`:""}</h3>
      ${tipo?`<span class="pill tipo">${esc(tipo)}</span>`:""}${d.prueba?'<span class="pill off">Prueba</span>':""}${pend(a)&&!(a.archivos||[]).length?'<span class="pill prog">Falta habilitación</span>':""}<span class="pill ${est[0]}">${est[1]}</span>
    </div>
    <div class="meta"><span>📍 ${esc(d.localidad||"")}${d.provincia&&!/santa fe/i.test(d.provincia)?" ("+esc(d.provincia)+")":""}</span><span>CUIT ${esc(fCuit(a.cuit))}</span><span>✉️ ${esc(a.email)}</span><span>📞 ${esc(d.telefono||"")}</span><span>🕒 ${fAR(a.creada)}</span></div>
    <div class="cuerpo"><b style="color:${sem[0]}">${sem[1]}.</b> ${a.semaforo==="verde"?((a.archivos||[]).length?"CUIT, ARCA, habilitación y titular coinciden.":"CUIT y ARCA coinciden. La habilitación todavía no se subió."):esc(an.motivo||(an.errores||[]).join(" · ")||"")}</div>
    ${a.estado==="aprobada"?`<div class="hint" style="margin-top:6px">✅ Aprobada por ${esc(res.por||"")} el ${fAR(res.cuando)}${res.partner_id?` · <a href="https://drogueriaeyg.odoo.com/web#id=${res.partner_id}&model=res.partner&view_type=form" target="_blank" rel="noopener">ver ficha en Odoo</a>`:""}${res.comercial?` · comercial ${esc(res.comercial.nombre)}`:""}${res.mail?` · mail ${esc(res.mail)}`:""}</div>`:""}
    ${a.estado==="rechazada"?`<div class="hint" style="margin-top:6px">✖️ ${esc(res.motivo||"")} — ${esc(res.por||"")} el ${fAR(res.cuando)}${res.mail?` · mail ${esc(res.mail)}`:""}</div>`:""}
    ${abierta?detalle(a):`<div class="acts"><button class="btn ghost sm" onclick="ABIERTA='${a.id}';render()">Ver el análisis</button></div>`}
  </div>`;
}
function detalle(a){
  const an=a.analisis||{}, h=an.decide, ar=an.arca, d=a.datos||{}, prop=an.propuesta||{};
  const ico=c=>c.ok===true?'<b style="color:#1E7D46">✔</b>':c.ok===false?'<b style="color:#B0322F">✘</b>':'<b style="color:#B7791F">?</b>';
  const checks=(an.checks||[]).map(c=>`<tr><td style="width:22px">${ico(c)}</td><td>${esc(c.texto)}${c.grave&&c.ok===false?' <span class="pill" style="background:#fbe3e1;color:#b0322f">clave</span>':""}</td></tr>`).join("");
  const fila=(k,v)=>v?`<tr><td class="k">${k}</td><td>${esc(v)}</td></tr>`:"";
  const abierta=pend(a), archs=a.archivos||[];
  const arch=archs.map(f=>`<span><button class="btn ghost sm" onclick="ver('${a.id}','${esc(f.path)}')">${f.tipo==="application/pdf"?"📄":"🖼️"} ${esc(f.nombre)}</button>${abierta?`<button class="quitar" onclick="quitarHab('${a.id}','${esc(f.path)}',this)">quitar</button>`:""}</span>`).join(" ");
  // La habilitación se pide después del formulario: acá se ve si falta, se le pide
  // al cliente por WhatsApp con un texto ya escrito y se sube.
  const pedido="Hola, te escribimos de Droguería EyG por la solicitud de acceso al portal de "+(d.cartel||d.razon||"tu establecimiento")+". Para completar el alta necesitamos la habilitación del local (en farmacias de Santa Fe, la Decisión del Departamento de Inspección de Farmacia). Podés enviarla por este medio, en PDF o en fotos. Gracias.";
  const wa=waNum(d.telefono||"");
  const subirBtn=abierta?`<label class="btn ${archs.length?"ghost sm":"sm"}" style="cursor:pointer">${archs.length?"Agregar hojas":"Subir habilitación"}<input type="file" accept="application/pdf,image/jpeg,image/png,image/webp" multiple hidden onchange="subirHab('${a.id}',this)"></label>`:"";
  const hab=`<div class="hab ${archs.length?"":"falta"}">
      <div class="t">${archs.length?"Habilitación cargada":"Habilitación pendiente"}</div>
      ${archs.length?`<div class="arch">${arch}</div>`:`<div style="font-size:13px;line-height:1.45">Hay que pedírsela al cliente y subirla acá. Al subirla, el sistema la lee y la cruza con el CUIT y con ARCA.</div>`}
      ${abierta?`<div class="acts">${subirBtn}${!archs.length&&wa?`<a class="btn ghost sm" href="https://api.whatsapp.com/send?phone=${wa}&text=${encodeURIComponent(pedido)}" target="_blank" rel="noopener">Pedírsela por WhatsApp</a>`:""}</div>`:""}
    </div>`;
  // Lo que más importa contra intrusos: si ya es cliente y el contacto no coincide, llamar al de la ficha.
  const cont=(an.checks||[]).find(c=>c.k==="contacto");
  const ficha=an.ficha;
  const avisoContacto=cont&&cont.ok!==true&&ficha?`<div class="aviso amar"><b>Atención:</b> ya es cliente y el correo y el teléfono informados <b>no coinciden con los de la ficha</b>. Antes de aprobar, conviene confirmar con el teléfono registrado: ${(ficha.tels||[]).length?ficha.tels.map(telLinks).join(" · "):"<i>la ficha no tiene teléfono</i>"}${(ficha.mails||[]).length?` — mail en la ficha: <b>${esc(ficha.mails.join(", "))}</b>`:""}</div>`:"";
  const rojo=a.semaforo==="rojo"?`<div class="aviso rojo">Un control clave no coincide. Corresponde rechazarla, salvo que el dato se haya confirmado por otra vía.</div>`:"";
  const opc=(arr,sel,val,txt)=>arr.map(x=>`<option value="${esc(val(x))}" ${String(val(x))===String(sel)?"selected":""}>${esc(txt(x))}</option>`).join("");
  const comSug=(an.comercial||{}).id;
  // La lista incluye siempre a quien ya tiene al cliente, aunque no esté en los equipos.
  const yaEsDe=an.comercial&&an.comercial.por==="ya es su cliente"?an.comercial:null;
  const comOpc=D.comerciales.slice(); if(yaEsDe&&!comOpc.some(x=>x.id===yaEsDe.id)) comOpc.unshift({id:yaEsDe.id,name:yaEsDe.nombre,equipo:"su comercial actual"});
  return `<div class="det">
    ${avisoContacto}${rojo}
    <div class="cols">
      <div><div class="sub">Controles</div><table class="lista">${checks||'<tr><td>Sin análisis</td></tr>'}</table>
        ${(an.errores||[]).length?`<div class="hint" style="color:#B0322F;margin-top:6px">⚠ ${esc(an.errores.join(" · "))}</div>`:""}
        <div class="sub" style="margin-top:14px">Contacto informado</div>
        <div style="font-size:13px">📞 ${telLinks(d.telefono||"")}<br>✉️ <b>${esc(a.email)}</b><br>📍 ${esc(d.calle||"")}, ${esc(d.localidad||"")} (${esc(d.provincia||"")})</div>
        <div class="sub" style="margin-top:14px">Habilitación (DECIDE)</div>${hab}
      </div>
      <div><div class="sub">Lo que dice la habilitación</div>
        ${h?`<table class="lista">${fila("Es de",h.establecimiento)}${fila("Tipo",h.tipo)}${fila("Número",h.numero)}${fila("Fecha",fFecha(h.fecha))}${fila("Vence",fFecha(h.vencimiento))}${fila("Nombre",h.nombre_establecimiento)}${fila("Domicilio",[h.domicilio,h.localidad].filter(Boolean).join(", "))}${fila("Titular",h.titular_nombre||h.entidad_nombre)}${fila("DNI",h.titular_dni)}${fila("CUIT",h.titular_cuit)}${fila("Matrícula",h.titular_matricula)}${fila("Dir. técnico",h.director_tecnico)}${fila("Antes era de",h.titular_anterior)}${fila("Organismo",h.organismo)}${fila("Nota",h.observaciones)}</table>`:`<div class="hint">${archs.length?"No se pudo leer.":"Todavía no se subió."}</div>`}
        <div class="sub" style="margin-top:14px">ARCA</div>
        ${ar&&ar.existe?`<table class="lista">${fila("Nombre",ar.nombre_completo)}${fila("Estado",ar.estado)}${fila("Domicilio fiscal",[ar.domicilio,ar.localidad,ar.provincia].filter(Boolean).join(", "))}${fila("IVA",ar.iva==="RI"?"Responsable inscripto":ar.iva==="MONO"?"Monotributo "+(ar.categoria_mono||""):ar.iva)}${fila("Actividades",(ar.actividades||[]).map(x=>x.id+" "+String(x.desc).toLowerCase()).join(" · "))}</table>`:`<div class="hint">${esc((ar&&ar.error)||"Sin datos de ARCA")}</div>`}
      </div>
    </div>
    ${pend(a)?`<div class="decidir">
      <div class="grid4">
        <div class="fld"><label>Tipo de cliente</label><select id="t-${a.id}" onchange="cambiaTipo('${a.id}')">${opc(D.tipos,prop.tipo||d.tipo,x=>x.k,x=>x.nom)}</select></div>
        <div class="fld"><label>Rubro en Odoo</label><select id="r-${a.id}">${opc(D.rubros,prop.rubro,x=>x,x=>x)}</select></div>
        <div class="fld"><label>Lista de precios</label><select id="l-${a.id}">${opc(D.listas,prop.lista_id,x=>x.id,x=>x.nom)}</select></div>
        <div class="fld"><label>Comercial asignado</label><select id="c-${a.id}" onchange="avisoTraspaso('${a.id}')">${opc(comOpc,comSug,x=>x.id,x=>x.name+" · "+x.equipo)}</select>
          <div class="hint">${yaEsDe?esc("Hoy es cliente de "+yaEsDe.nombre+"."):an.comercial?esc("Sugerencia: "+an.comercial.nombre+" — "+an.comercial.por):""}</div></div>
      </div>
      <div class="hint" id="tr-${a.id}" data-actual="${yaEsDe?yaEsDe.id:""}" data-nombre="${yaEsDe?esc(yaEsDe.nombre):""}" style="margin:-4px 0 10px">El cliente queda asignado a la persona elegida acá.</div>
      <div class="acts">
        <button class="btn" onclick="aprobar('${a.id}',this)">✅ Aprobar y dar acceso</button>
        <button class="btn warn" onclick="rechazoForm('${a.id}')">Rechazar</button>
        <button class="btn ghost" onclick="reanalizar('${a.id}',this)">↻ Volver a analizar</button>
        <button class="btn ghost" onclick="ABIERTA=null;render()">Cerrar</button>
      </div>
      <div id="rech-${a.id}"></div></div>`
      :`<div class="acts"><button class="btn ghost sm" onclick="ABIERTA=null;render()">Cerrar</button></div>`}
  </div>`;
}
// Si ya tenía comercial y se elige otra, es un traspaso de cartera: se avisa antes.
function avisoTraspaso(id){
  const box=document.getElementById("tr-"+id), sel=document.getElementById("c-"+id); if(!box||!sel) return;
  const actual=box.dataset.actual;
  if(actual&&sel.value!==actual){ box.innerHTML="<b>Traspaso de cartera:</b> la ficha pasa de "+box.dataset.nombre+" a "+esc(sel.selectedOptions[0].text.split(" · ")[0])+". Queda registrado en la ficha y mueve la comisión desde ahora."; box.style.color="#9a6a0b"; }
  else { box.textContent="El cliente queda asignado a la persona elegida acá."; box.style.color=""; }
}
function cambiaTipo(id){
  const t=D.tipos.find(x=>x.k===document.getElementById("t-"+id).value); if(!t) return;
  document.getElementById("r-"+id).value=t.rubro; document.getElementById("l-"+id).value=String(t.lista);
}
async function ver(id,path){
  const w=window.open("about:blank","_blank");
  try{ const r=await fn({accion:"archivo",id,path}); if(w) w.location=r.url; else window.open(r.url,"_blank"); }
  catch(e){ if(w) w.close(); toast("⚠ "+e.message); }
}
async function aprobar(id,btn){
  if(OCUPADO) return;
  const val=k=>(document.getElementById(k+"-"+id)||{}).value;
  const body={accion:"aprobar",id,tipo:val("t"),rubro:val("r"),lista_id:Number(val("l")),comercial_id:Number(val("c"))};
  OCUPADO=true; if(btn){ btn.disabled=true; btn.textContent="Revisando…"; }
  try{
    // primero un ensayo: qué va a escribir, para confirmarlo sabiendo
    const en=await fn({...body,ensayo:true});
    const p=en.resultado||{}, pasos=p.pasos||[];
    const ficha=pasos.find(x=>x.que==="usar la ficha existente"), nueva=pasos.find(x=>x.que==="crear la ficha");
    const lista=(D.listas.find(x=>x.id===p.lista_id)||{}).nom||"";
    const u=pasos.find(x=>x.que==="usuario del portal")||{};
    const acceso=u.contrasena==="la que eligió el cliente"
      ? "ingresa con la contraseña que eligió al pedir el alta; se le avisa por correo"
      : "recibe un correo con el enlace para crear la contraseña";
    const sinHab=!((D.altas.find(x=>x.id===id)||{}).archivos||[]).length;
    const txt=(sinHab?"ATENCIÓN: todavía no se subió la habilitación. Se puede aprobar igual, pero el legajo queda sin ella.\n\n":"")+"Se va a dar el alta así:\n\n"+
      (ficha?`• Usa la ficha que YA existe: ${ficha.nombre} (no se crea otra)`:`• Crea la ficha: ${nueva&&nueva.vals&&nueva.vals.name}\n• Rubro ${p.rubro} · lista ${lista}`)+
      `\n• Comercial asignado: ${p.comercial&&p.comercial.nombre}`+(p.traspaso?`\n• TRASPASO de cartera: ${p.traspaso.de} → ${p.traspaso.a} (queda registrado en la ficha)`:"")+
      (sinHab?"\n• Legajo: sólo la constancia de ARCA":"\n• Legajo: la habilitación y la constancia de ARCA")+
      `\n• Usuario del portal ${u.login}: ${acceso}`+
      `\n• Aviso a ${((pasos.find(x=>x.que==="aviso")||{}).a||[]).join(", ")}\n\n¿Confirmás?`;
    if(!confirm(txt)) return;
    if(btn) btn.textContent="Dando el alta…";
    const r=await fn(body);
    toast("✅ Alta hecha · mail "+((r.resultado&&r.resultado.mail)||""),true);
    ABIERTA=null; await cargar();
  }catch(e){ toast("⚠ "+e.message); }
  finally{ OCUPADO=false; if(btn&&document.body.contains(btn)){ btn.disabled=false; btn.textContent="✅ Aprobar y dar acceso"; } }
}
function rechazoForm(id){
  const a=D.altas.find(x=>x.id===id); if(!a) return;
  const box=document.getElementById("rech-"+id); if(!box) return;
  const an=a.analisis||{};
  // Motivo sugerido en criollo: es lo que va a leer el cliente.
  const malo=(an.checks||[]).find(c=>c.grave&&c.ok===false);
  const sug=!malo?"":malo.k==="actividad"?"Según ARCA, el CUIT no registra la actividad que corresponde al tipo de establecimiento indicado.":
    malo.k==="habilitacion"?"El archivo adjunto no corresponde a la habilitación del establecimiento. La solicitud puede presentarse nuevamente con la habilitación vigente.":
    malo.k==="titular"?"La habilitación presentada no corresponde al titular del CUIT informado.":
    malo.k==="arca"?"No fue posible validar el CUIT en ARCA.":"";
  box.innerHTML=`<div class="fld" style="margin-top:12px"><label>Motivo (es el texto que recibe el cliente por correo)</label><textarea id="m-${id}">${esc(sug)}</textarea></div>
    <label class="hint" style="display:flex;gap:7px;align-items:center;margin-bottom:10px"><input type="checkbox" id="av-${id}" checked> Enviar el correo al cliente</label>
    <button class="btn warn" onclick="rechazar('${id}',this)">Confirmar rechazo</button>`;
}
async function rechazar(id,btn){
  const motivo=(document.getElementById("m-"+id)||{}).value||"";
  const avisar=!!(document.getElementById("av-"+id)||{}).checked;
  if(motivo.trim().length<5){ toast("Falta el motivo"); return; }
  if(btn){ btn.disabled=true; btn.textContent="Rechazando…"; }
  try{ const r=await fn({accion:"rechazar",id,motivo,avisar}); toast("Solicitud rechazada"+(avisar?" · mail "+r.mail:""),true); ABIERTA=null; await cargar(); }
  catch(e){ toast("⚠ "+e.message); if(btn){ btn.disabled=false; btn.textContent="Confirmar rechazo"; } }
}
// Las fotos se achican en el navegador (2200 px, JPEG) como hacía el formulario:
// una foto de celular pasa de 5 MB a menos de 1 MB y se lee igual.
function achicar(file){
  return new Promise((ok,mal)=>{ const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const k=Math.min(1,2200/Math.max(img.width,img.height)), w=Math.round(img.width*k), h=Math.round(img.height*k);
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h; const cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,w,h); cx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); cv.toBlob(b=>b?ok(b):mal(new Error("no se pudo procesar")),"image/jpeg",0.86); };
    img.onerror=()=>{ URL.revokeObjectURL(url); mal(new Error("No se pudo abrir "+file.name)); }; img.src=url; });
}
const aB64=blob=>new Promise((ok,mal)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(",")[1]||""); r.onerror=mal; r.readAsDataURL(blob); });
async function subirHab(id,input){
  const files=Array.from(input.files||[]); input.value="";   // copia: input.files es una lista viva
  if(!files.length||OCUPADO) return;
  const lbl=input.closest("label"); OCUPADO=true; if(lbl){ lbl.style.opacity=".6"; lbl.firstChild.textContent="Subiendo y leyendo…"; }
  try{
    const archivos=[];
    for(const f of files){
      if(f.type==="application/pdf"||/\.pdf$/i.test(f.name)){
        if(f.size>12*1048576) throw new Error(f.name+" supera los 12 MB");
        archivos.push({nombre:f.name,tipo:"application/pdf",b64:await aB64(f)});
      } else { const b=await achicar(f); archivos.push({nombre:f.name.replace(/\.[a-z0-9]+$/i,"")+".jpg",tipo:"image/jpeg",b64:await aB64(b)}); }
    }
    const r=await fn({accion:"subir",id,archivos});
    toast("Habilitación cargada · "+({verde:"todo coincide",amarillo:"hay algo para mirar",rojo:"un control clave no coincide"}[r.analisis&&r.analisis.semaforo]||"análisis actualizado"),true);
    ABIERTA=id; OCUPADO=false; await cargar();
  }catch(e){ toast("⚠ "+e.message); }
  finally{ OCUPADO=false; if(lbl&&document.body.contains(lbl)){ lbl.style.opacity=""; } }
}
async function quitarHab(id,path,btn){
  if(OCUPADO||!confirm("¿Quitar este archivo? El análisis se vuelve a hacer con lo que quede.")) return;
  OCUPADO=true; if(btn){ btn.disabled=true; btn.textContent="quitando…"; }
  try{ await fn({accion:"quitar",id,path}); toast("Archivo quitado",true); ABIERTA=id; OCUPADO=false; await cargar(); }
  catch(e){ toast("⚠ "+e.message); }
  finally{ OCUPADO=false; }
}
async function reanalizar(id,btn){
  if(btn){ btn.disabled=true; btn.textContent="Analizando…"; }
  try{ await fn({accion:"reanalizar",id}); toast("Análisis actualizado",true); await cargar(); }
  catch(e){ toast("⚠ "+e.message); if(btn){ btn.disabled=false; btn.textContent="↻ Volver a analizar"; } }
}
