<style>

  /* panel de resolución */

<script>
const money=n=>"$"+(n||0).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=EYG.esc, rpc=EYG.rpc;
const r2=n=>Math.round((n||0)*100)/100;

/* ══════════════════════════════════════════════════════════════════════════
   CONFIGURACIÓN
   Relevado el 30/09/2026 sobre los 1.587 pagos con cheque propio de la base.
   Un cheque emitido es un account.payment outbound con el método "Cheques" del
   diario del banco: deja Proveedores al debe y Pagos pendientes al haber. Cuando
   el banco lo cobra, la línea del extracto se concilia contra Pagos pendientes.
   ══════════════════════════════════════════════════════════════════════════ */
const CTA_PROV=148;          // 2.1.1.01.010 Proveedores
const CTA_PAGOS=351;         // 1.1.1.02.004 Pagos pendientes
const DOC_ORDEN=148;         // ORDEN DE PAGO X
const BANCOS={
  credicoop:{nombre:"Banco Credicoop", diario:24, metodo:22, usos:1125},
  macro:    {nombre:"Banco Macro",     diario:26, metodo:28, usos:462},
};
/* RG 830, Anexo II inciso f — ENAJENACIÓN DE BIENES MUEBLES Y BIENES DE CAMBIO.
   Es el régimen que corresponde a las compras de EyG. Alícuota 2% sobre el neto
   sin IVA, con un mínimo no imponible de $224.000 que se computa UNA VEZ POR MES
   y por proveedor: si ya se consumió con un pago anterior del mismo mes, no se
   descuenta de nuevo.

   Verificado contra los pagos reales de septiembre 2026: Denver Farma 3 de 3,
   El Español 4 de 4, Ofar 5 de 5, Grupo Farmacéutico y Fideicomiso 100%. */
/* ---------- RG 830: los parámetros salen del catálogo OFICIAL de ARCA ----------
   Traídos el 30/09/2026 del mismo servicio que usa la calculadora pública
   https://servicioscf.afip.gob.ar/calc-rg830/  (endpoint default.aspx/conceptosalcliente).
   Son los valores para sujeto INSCRIPTO, que es la condición de los proveedores de EyG.

   Coinciden con lo que se venía haciendo: el régimen 78 da 2% con $224.000 no sujetos,
   que es exactamente lo que sale de medir las retenciones reales de la base.

   OJO: estos montos los actualiza ARCA cada tanto. Si un cálculo empieza a diferir del
   de Federico, lo primero a mirar es si cambió el monto no sujeto. */
const RG830_CAT=[
  {cod:78, id:25, alic:2, noSujeto:224000, minRet:240, lbl:"Enajenación de bienes muebles y bienes de cambio.", anexo:"Anexo II, inc. f)"},
  {cod:30, id:7, alic:6, noSujeto:11200, minRet:240, lbl:"Alquileres o arrendamientos de bienes muebles.", anexo:"Anexo II, inc. b) pto. 1)"},
  {cod:94, id:34, alic:2, noSujeto:67170, minRet:240, lbl:"Locaciones de obra y/o servicios no ejecutados en relación", anexo:"Anexo II, inc. i)"},
  {cod:116, id:43, alic:0, noSujeto:16830, minRet:240, lbl:"Albacea, mandatario, gestor de negocio.", anexo:"Anexo II, inc. k)"},
  {cod:116, id:40, alic:0, noSujeto:67170, minRet:240, lbl:"Honorarios de director de sociedades anónimas, síndico, fi", anexo:"Anexo II, inc. k)"},
];
const RG830_FUENTE="catálogo oficial de ARCA, traído el 30/09/2026";
/* El régimen por defecto es el 78: EyG compra mercadería. */
const RG830=Object.assign({}, RG830_CAT[0], {mni:RG830_CAT[0].noSujeto, alicuota:RG830_CAT[0].alic/100,
  alic:RG830_CAT[0].alic, alicNoInsc:10, minRet:RG830_CAT[0].minRet,
  regimen:RG830_CAT[0].lbl, codigo:String(RG830_CAT[0].cod)});
/* IIBB Santa Fe: las dos alícuotas que aparecen en esta base. La que corresponde
   depende del padrón de la provincia, así que se elige; no se adivina. */
const IIBB_ALIC=[{v:0,    l:"No corresponde"},
                 {v:0.7,  l:"0,7 % — alícuota general"},
                 {v:2.75, l:"2,75 % — alícuota agravada"}];

const TAX_IIBB=89;           // "Ret IIBB Santa Fe S"

/* IIBB Santa Fe NO se calcula: la alícuota depende del padrón de la provincia y en

function log(t,k){ ST.logs.unshift({t,k:k||"",h:new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}); pintarLog(); }
function pintarLog(){ const el=document.getElementById("log"); if(!el) return;
  el.innerHTML=ST.logs.map(l=>'<div class="l '+l.k+'"><span class="h">'+l.h+'</span>'+esc(l.t)+'</div>').join("")||'<div class="muted">Todavía no se hizo nada.</div>'; }
const conTrabajo=fn=>{ if(ST.trabajando) return; ST.trabajando=true; render();
  Promise.resolve().then(fn).catch(e=>log("Error: "+(e.message||e),"e")).finally(()=>{ ST.trabajando=false; render(); }); };
/* Acepta 1.058.250,00 y 1058250.00: decide por el último separador. */
function num(s){ const t=String(s==null?"":s).replace(/\s/g,"").replace(/\$/g,""); if(!t) return 0;
  const c=t.lastIndexOf(","), p=t.lastIndexOf(".");
  let v=t;
  if(c>p) v=t.split(".").join("").split(",").join(".");
  else if(p>c && t.length-p-1<=2) v=t.split(",").join("");
  else v=t.split(".").join("").split(",").join("");
  const n=parseFloat(v); return isNaN(n)?0:n; }

   1) EL PROVEEDOR Y SU DEUDA

/* Al escribir NO se redibuja la pantalla: se reemplaza sólo la lista de resultados.
   Antes cada tecla llamaba a render(), que reconstruía el input y se llevaba el foco
   y lo tipeado — escribir se volvía imposible y parecía que se colgaba.
   Además espera a que la persona deje de tipear, para no disparar una consulta por letra. */
let _tBusca=null;
window.buscarProv=(txt)=>{
  ST.q=txt;
  clearTimeout(_tBusca);
  if(!txt||txt.length<3){ ST.opciones=null; pintarOpciones(); return; }
  _tBusca=setTimeout(async()=>{
    const mio=txt;
    const digitos=txt.replace(/[^0-9]/g,"");
    /* El CUIT entra en el OR SÓLO si el texto trae dígitos: ["vat","like",""] le
       matchea a todo el padrón y volvía inútil el filtro por nombre. */
    const dom = digitos.length>=3
      ? [["supplier_rank",">",0],"|",["name","ilike",txt],["vat","like",digitos]]
      : [["supplier_rank",">",0],["name","ilike",txt]];
    try{
      const r=await rpc("res.partner","search_read",[dom,["id","name","vat"]],{limit:14});
      if(ST.q!==mio) return;              // llegó tarde: ya tipeó otra cosa
      ST.opciones=r;
    }catch(e){ ST.opciones=[]; log("No pude buscar: "+(e.message||e),"e"); }
    pintarOpciones();
  }, 280);
};
function pintarOpciones(){
  const el=document.getElementById("opts"); if(!el) return;
  el.innerHTML = !ST.opciones ? "" :
    (ST.opciones.length ? ST.opciones.map(o=>
      '<button class="opt" onclick="elegirProv('+o.id+','+JSON.stringify(o.name).split('"').join("&quot;")+')">'+
      esc(o.name)+(o.vat?' <span class="muted">· '+esc(o.vat)+'</span>':"")+'</button>').join("")
      : '<div class="muted" style="padding:8px">Ningún proveedor con ese nombre o CUIT.</div>');
}
window.elegirProv=(id,nombre)=>conTrabajo(async()=>{
  ST.prov={id,nombre}; ST.opciones=null; ST.sel=new Set(); ST.retGan=null; ST.retIIBB=null; ST.alicIIBB=null; ST.cheques=[]; ST.sit=null; ST.certExencion=false;
  await cargarSituacion(id);
  await cargarDeuda(id);
  /* Los números de cheque ya usados se traen en segundo plano apenas se elige el
     proveedor: son 1.587 y pedirlos recién al confirmar dejaba la pantalla quieta
     unos segundos justo en el momento más delicado. */
  numerosUsados().then(u=>{ _val=u; render(); }).catch(()=>{});
});

async function cargarDeuda(pid){
  /* Comprobantes abiertos del proveedor, de la más vieja a la más nueva, que es el
     orden en que se imputa. El saldo vive al HABER de la cuenta Proveedores. */
  const ls=await rpc("account.move.line","search_read",
    [[["partner_id","=",pid],["account_id","=",CTA_PROV],["parent_state","=","posted"],
      ["full_reconcile_id","=",false],["credit",">",0]],
     ["move_id","date","date_maturity","credit","amount_residual"]],{limit:0,order:"date_maturity,date"});
  const abiertas=ls.filter(l=>Math.abs(l.amount_residual)>0.005);
  /* Hace falta el NETO SIN IVA de cada comprobante: la retención de Ganancias se
     calcula sobre el neto, no sobre el total. */
  const mids=[...new Set(abiertas.map(l=>l.move_id[0]))];
  const movs={};
  for(let i=0;i<mids.length;i+=200){
    (await rpc("account.move","read",[mids.slice(i,i+200),["name","invoice_date","invoice_date_due","amount_total","amount_untaxed"]]))
      .forEach(m=>movs[m.id]=m); }
  const hoy=EYG.argToday();
  ST.facturas=abiertas.map(l=>{ const m=movs[l.move_id[0]]||{};
    const saldo=Math.abs(l.amount_residual), total=Math.abs(m.amount_total||saldo);
    /* Si el comprobante está pago a medias, el neto se prorratea igual que el saldo. */
    const neto=total?r2(Math.abs(m.amount_untaxed||0)*saldo/total):0;
    const vto=m.invoice_date_due||l.date_maturity||l.date;
    return {id:l.id, nombre:m.name||("apunte "+l.id), fecha:m.invoice_date||l.date, vence:vto,
            saldo:r2(saldo), neto, vencida: vto && vto<hoy}; });
  await cargarAcumulado(pid);
  log("Traídos "+ST.facturas.length+" comprobantes abiertos de "+ST.prov.nombre);
  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   LA SITUACIÓN FISCAL DEL PROVEEDOR
   Todo esto Odoo ya lo tiene; antes el módulo asumía "inscripto, régimen 78" y
   eso está mal en varios casos reales de la base.

   · imp_ganancias_padron  viene del padrón de AFIP:
       AC = activo (inscripto) · NI = no inscripto · EX = EXENTO · NC = no corresponde
     Es el dato que responde por el certificado de exención: si dice EX, no se retiene.
   · default_regimen_ganancias_id  es el régimen del proveedor, con su propia alícuota
     para inscripto y para no inscripto y su monto no sujeto — la tabla de Odoo coincide
     con el catálogo de ARCA (régimen 78: 2% / 10% / $224.000).
   · monotributo_padron  S = monotributista, que no está alcanzado por la RG 830.
   · El TIPO DE PERSONA sale del CUIT: 20/23/24/27 humana, 30/33/34 jurídica.

   Medido el 30/09/2026 sobre los 46 proveedores a los que se les paga con cheque:
   37 con padrón AC, 8 sin consultar nunca, 1 NC; y 20 SIN RÉGIMEN configurado.
   Por eso cuando falta un dato el módulo lo dice y no inventa. */
const PADRON_GAN={AC:"Inscripto y activo", NI:"NO inscripto", EX:"EXENTO", NC:"No corresponde"};

async function cargarSituacion(pid){
  ST.sit=null;
  const c=(await rpc("res.partner","read",[[pid],
    ["name","vat","l10n_ar_afip_responsibility_type_id","default_regimen_ganancias_id",
     "imp_ganancias_padron","monotributo_padron","estado_padron","last_update_padron"]]))[0];
  const d=String(c.vat||"").replace(/[^0-9]/g,"");
  const pre=d.slice(0,2);
  const persona = ["20","23","24","27"].indexOf(pre)>=0 ? "humana"
                : ["30","33","34"].indexOf(pre)>=0 ? "jurídica" : null;
  /* El régimen: el del proveedor si lo tiene; si no, ninguno — y se avisa. */
  let reg=null;
  if(c.default_regimen_ganancias_id){
    try{ reg=(await rpc("afip.tabla_ganancias.alicuotasymontos","read",
      [[c.default_regimen_ganancias_id[0]],
       ["codigo_de_regimen","anexo_referencia","concepto_referencia",
        "porcentaje_inscripto","porcentaje_no_inscripto","montos_no_sujetos_a_retencion"]]))[0];
    }catch(e){ log("No pude leer el régimen del proveedor: "+(e.message||e),"e"); }
  }
  const gan=c.imp_ganancias_padron||null;
  const mono=c.monotributo_padron==="S";
  /* Por qué NO habría que retener. Cada motivo se muestra y frena el cálculo. */
  let noRetener=null;
  if(gan==="EX") noRetener="El padrón de AFIP lo marca EXENTO de Ganancias.";
  else if(gan==="NC") noRetener="El padrón dice que Ganancias no le corresponde.";
  else if(mono) noRetener="Es monotributista: no está alcanzado por la RG 830.";
  /* Qué falta para poder calcular con confianza. */
  const faltan=[];
  if(!gan) faltan.push("nunca se consultó el padrón de AFIP, así que no se sabe si está inscripto");
  if(!reg) faltan.push("no tiene régimen de Ganancias configurado en su ficha");
  if(!persona) faltan.push("el CUIT no permite saber si es persona humana o jurídica");
  ST.sit={nombre:c.name, vat:c.vat, persona, gan, mono, reg, noRetener, faltan,
    resp:c.l10n_ar_afip_responsibility_type_id?c.l10n_ar_afip_responsibility_type_id[1]:null,
    estado:c.estado_padron||null, padronAl:c.last_update_padron||null,
    inscripto: gan==="AC" ? true : gan==="NI" ? false : null};
}


/* Cuánto se le retuvo YA a este proveedor en el mes, y sobre qué base. Sin esto el
   mínimo no imponible se descontaría dos veces y la retención saldría de menos. */
async function cargarAcumulado(pid){
  ST.acum={base:0, ret:0, iibb:null};
  try{
    const mes=ST.fecha.slice(0,7), desde=mes+"-01";
    const d=new Date(desde+"T12:00:00Z"); d.setUTCMonth(d.getUTCMonth()+1);
    const hasta=d.toISOString().slice(0,10);      // el 1° del mes siguiente, con < estricto
    const pays=await rpc("account.payment","search_read",
      [[["partner_id","=",pid],["partner_type","=","supplier"],["state","=","posted"],
        ["date",">=",desde],["date","<",hasta]],["id","name","date"]],{limit:0});
    if(!pays.length) return;
    const ws=await rpc("l10n_ar.payment.withholding","search_read",
      [[["payment_id","in",pays.map(p=>p.id)]],["payment_id","amount","base_amount","tax_id"]],{limit:0});
    ws.forEach(w=>{ const t=String(w.tax_id?w.tax_id[1]:"");
      if(t.toLowerCase().indexOf("ganancias")>=0){ ST.acum.base+=w.base_amount||0; ST.acum.ret+=w.amount||0; } });
    if(ST.acum.ret) log("Este mes ya se le retuvo "+money(ST.acum.ret)+" de Ganancias sobre una base de "+money(ST.acum.base));
    /* La alícuota de IIBB que se le aplicó la última vez, como propuesta. */
    const hist=await rpc("l10n_ar.payment.withholding","search_read",
      [[["payment_id.partner_id","=",pid]],["amount","base_amount","tax_id"]],{limit:12,order:"id desc"});
    const ii=hist.find(w=>String(w.tax_id?w.tax_id[1]:"").toLowerCase().indexOf("iibb")>=0);
    if(ii&&ii.base_amount) ST.iibbHist=r2(ii.amount/ii.base_amount*10000)/100;
  }catch(e){ log("No pude leer las retenciones del mes: "+(e.message||e),"e"); }
}
window.toggleFc=(id)=>{ ST.sel.has(id)?ST.sel.delete(id):ST.sel.add(id); ST.retGan=null; ST.retIIBB=null; render(); };
window.tildarHasta=(i)=>{ ST.sel=new Set(ST.facturas.slice(0,i+1).map(f=>f.id)); ST.retGan=null; ST.retIIBB=null; render(); };
window.tildarVencidas=()=>{ ST.sel=new Set(ST.facturas.filter(f=>f.vencida).map(f=>f.id)); ST.retGan=null; ST.retIIBB=null; render(); };

/* ══════════════════════════════════════════════════════════════════════════
   2) EL CÁLCULO
   ══════════════════════════════════════════════════════════════════════════ */
function elegidas(){ return ST.facturas.filter(f=>ST.sel.has(f.id)); }
function calculo(){
  const fs=elegidas();
  const bruto=r2(fs.reduce((s,f)=>s+f.saldo,0));
  const neto =r2(fs.reduce((s,f)=>s+f.neto ,0));
  /* Los parámetros salen del RÉGIMEN DEL PROVEEDOR y de su situación en el padrón,
     no de un valor fijo. Si falta el régimen se usa el 78 como propuesta y se avisa. */
  const S=ST.sit||{};
  const reg=S.reg;
  const alicPct = reg ? (S.inscripto===false ? reg.porcentaje_no_inscripto : reg.porcentaje_inscripto)
                      : (S.inscripto===false ? RG830.alicNoInsc : RG830.alic);
  const mni     = reg ? reg.montos_no_sujetos_a_retencion : RG830.mni;
  const codReg  = reg ? reg.codigo_de_regimen : RG830.codigo;
  /* Tres motivos para no retener: el certificado que tildó la persona, lo que dice el
     padrón (exento o no corresponde) y el monotributo. Cualquiera pone la retención en cero. */
  const exento  = !!ST.certExencion || !!S.noRetener;
  const motivoExento = ST.certExencion ? "Tiene certificado de exención presentado" : (S.noRetener||null);

  /* RG 830: la alícuota se aplica al acumulado del mes menos el mínimo, y se le
     resta lo ya retenido. Así el mínimo se computa una sola vez por mes. */
  const accBase=r2((ST.acum?ST.acum.base:0)+neto);
  const yaRet  =r2(ST.acum?ST.acum.ret:0);
  let ganSug = exento ? 0 : r2(Math.max(0,(accBase-mni)*(alicPct/100)-yaRet));
  /* Por debajo del piso de $240 no corresponde retener (es igual para los 25
     regímenes de sujeto inscripto del catálogo de ARCA). */
  const bajoPiso = !exento && ganSug>0 && ganSug<RG830.minRet;
  if(bajoPiso) ganSug=0;
  const al = ST.alicIIBB!=null ? ST.alicIIBB : ST.iibbHist;
  const iibbSug = al ? r2(neto*al/100) : (al===0?0:null);
  const gan  = ST.retGan ==null ? ganSug  : ST.retGan;
  const iibb = exento ? (ST.retIIBB||0) : (ST.retIIBB==null ? (iibbSug||0) : ST.retIIBB);
  /* Los pasos intermedios, para mostrarlos: es la cuenta que hoy se hace afuera. */
  const sujeta   = r2(Math.max(0, accBase-mni));
  const ganBruta = r2(sujeta*(alicPct/100));
  return {fs, bruto, neto, accBase, yaRet, ganSug, iibbSug, gan, iibb,
          reg, codReg, alicPct, mni, exento, motivoExento, bajoPiso,
          sujeta, ganBruta, alicIIBB:(ST.alicIIBB!=null?ST.alicIIBB:(ST.iibbHist||0)),
          ret:r2(gan+iibb), pagar:r2(bruto-gan-iibb)};
}
window.setRet=(cual,v)=>{ const n=num(v); if(cual==="gan") ST.retGan=n; else ST.retIIBB=n; repintarCalc(); };
window.setAlicIIBB=(v)=>{ ST.alicIIBB=parseFloat(v); ST.retIIBB=null; repintarCalc(); };
/* El certificado de exención es un papel que presenta el proveedor. El padrón puede
   estar desactualizado, así que esto lo decide la persona y pisa cualquier cálculo. */
window.setExencion=(v)=>{ ST.certExencion=!!v; ST.retGan=null; ST.retIIBB=null; render(); };
window.volverSug=()=>{ ST.retGan=null; ST.retIIBB=null; render(); };

/* ══════════════════════════════════════════════════════════════════════════
   3) LA TANDA DE CHEQUES
   Una fila por cheque, cargada a mano. Se valida cada una: número sin repetir
   (ni entre las filas ni contra lo que ya está en Odoo), fecha de cobro dentro
   de un rango razonable, y la suma tiene que dar exacto el total a pagar.

   Los dos controles nacen de errores reales: en los 1.587 pagos con cheque de la
   base hay 4 números repetidos y un cheque con fecha de cobro en el año 2206.
   ══════════════════════════════════════════════════════════════════════════ */
/* Al soltar el PDF: se leen los cheques, se identifica al proveedor por el CUIT,
   el banco por la cuenta emisora, y se avisa cuáles ya están cargados en Odoo. */
window.leerPdf=(files)=>conTrabajo(async()=>{
  const f=files&&files[0]; if(!f) return;
  ST.pdf=null;
  let ch=[];
  try{
    const cont=await textoDelPdf(await f.arrayBuffer());
    if(!cont || !cont.trim()) throw new Error("no pude leer el contenido del PDF. Si es un PDF escaneado o protegido, cargá los cheques a mano.");
    ch=chequesDelPdf(lineasPdf(cont));
  }catch(e){ log("No pude leer "+f.name+": "+(e.message||e),"e"); return; }
  if(!ch.length){ log("En "+f.name+" no encontré ningún cheque. ¿Es el comprobante de e-cheq del home banking?","e"); return; }

  const cuits=[...new Set(ch.map(c=>c.cuit).filter(Boolean))];
  const ctas =[...new Set(ch.map(c=>c.cuenta).filter(Boolean))];
  const avisos=[];
  if(cuits.length>1) avisos.push("el archivo tiene cheques de "+cuits.length+" beneficiarios distintos");
  if(ctas.length>1)  avisos.push("hay cheques de "+ctas.length+" cuentas emisoras distintas");

  /* El banco sale de la cuenta emisora, comparando sin los separadores. */
  const soloNum=x=>String(x||"").replace(/[^0-9]/g,"");
  let banco=null;
  Object.keys(BANCOS).forEach(k=>{ if(ctas[0] && soloNum(BANCOS[k].cuentaBanco)===soloNum(ctas[0])) banco=k; });
  if(banco && banco!==ST.banco){ ST.banco=banco; log("El PDF dice que los cheques salen de "+BANCOS[banco].nombre,"o"); }
  else if(!banco && ctas[0]) avisos.push("la cuenta emisora "+ctas[0]+" no es de ninguno de los bancos configurados");

  /* El proveedor, por el CUIT del beneficiario. */
  if(cuits[0]){
    const con=cuits[0], conGuion=con.slice(0,2)+"-"+con.slice(2,10)+"-"+con.slice(10);
    const ps=await rpc("res.partner","search_read",[[["vat","in",[con,conGuion]]],["id","name"]],{limit:4});
    if(ps.length===1){
      if(!ST.prov || ST.prov.id!==ps[0].id){
        log("Beneficiario identificado por CUIT: "+ps[0].name,"o");
        await window.elegirProv(ps[0].id, ps[0].name);
      }
    } else if(ps.length>1) avisos.push("el CUIT "+con+" está en "+ps.length+" fichas: elegí el proveedor a mano");
    else avisos.push("el CUIT "+con+" no figura en ninguna ficha: elegí el proveedor a mano");
  }

  /* Los que ya están en Odoo no se vuelven a cargar. */
  const usados=await numerosUsados(); _val=usados;
  const yaEstan=ch.filter(c=>usados[String(c.n).replace(/^0+/,"")]);
  const nuevos =ch.filter(c=>!usados[String(c.n).replace(/^0+/,"")]);
  ST.pdf={archivo:f.name, total:ch.length, suma:r2(ch.reduce((s,c)=>s+c.i,0)),
          emision:ch[0].emision||"", yaEstan:yaEstan.length, avisos};
  if(yaEstan.length) log(yaEstan.length+" de los "+ch.length+" cheques YA estaban cargados: no se agregan","e");
  ST.cheques=nuevos.map(c=>({n:c.n, f:c.f, i:String(c.i)}));
  /* La fecha del pago es la de emisión de los cheques, no la de hoy. */
  if(ch[0].emision) ST.fecha=ch[0].emision;
  log("Leídos "+ch.length+" cheques de "+f.name+" por "+money(ST.pdf.suma)+
      (nuevos.length!==ch.length?" — se cargan "+nuevos.length:""),"o");
  avisos.forEach(a=>log("Ojo: "+a,"e"));
  render();
});
function engancharDropPdf(){
  const z=document.getElementById("dropPdf"); if(!z) return;
  ["dragenter","dragover"].forEach(e=>z.addEventListener(e,ev=>{ev.preventDefault();z.classList.add("hover");}));
  ["dragleave","drop"].forEach(e=>z.addEventListener(e,ev=>{ev.preventDefault();z.classList.remove("hover");}));

window.setCheque=(i,campo,v)=>{ if(!ST.cheques[i]) return; ST.cheques[i][campo]=v; repintarCuadre(); };
window.repartir=()=>{
  /* Reparte el total entre las filas que ya existen, dejando el ajuste en la última. */
  const c=calculo(), n=ST.cheques.length;
  if(!n){ log("Agregá al menos una fila de cheque","e"); return; }
  const base=Math.floor(c.pagar/n*100)/100;
  ST.cheques.forEach((ch,i)=>{ ch.i=String(i===n-1 ? r2(c.pagar-base*(n-1)) : base); });
  render();
};

/* El certificado de retención es correlativo. Se busca el último y se sigue. */
async function siguienteCertificado(){
  try{
    const ws=await rpc("l10n_ar.payment.withholding","search_read",
      [[["name","like",PREFIJO_CERT]],["name"]],{limit:0});
    let max=0;
    ws.forEach(w=>{ const n=parseInt(String(w.name||"").split(PREFIJO_CERT).join(""),10); if(n>max) max=n; });
    if(!max){ log("No encontré certificados anteriores: reviso antes de numerar","e"); return null; }
    const sig=max+1;
    return PREFIJO_CERT+String(sig).padStart(8,"0");
  }catch(e){ log("No pude leer el último certificado: "+(e.message||e),"e"); return null; }
}

    (m[n]=m[n]||[]).push(p); });

/* Dos categorías distintas, a propósito:
   · ERROR    frena la carga. Son datos que faltan o que romperían algo: sin número,
              número repetido entre filas o ya usado en Odoo, sin fecha, sin importe.
   · AVISO    se marca en rojo pero NO frena. Una fecha de cobro anterior a hoy es
              perfectamente normal —los cheques se cargan después de emitidos— y una
              fecha muy lejana suele ser un error de tipeo, pero puede ser real.
   Pedido de Dirección el 30/09/2026: "está bien que lo adviertas y lo marques en rojo,
   pero permitime igual cargar los cheques". */
function validarCheques(usados){
  const c=calculo(), res=[];
  const vistos={};
  const hoy=EYG.argToday();
  const limite=new Date(hoy+"T12:00:00Z"); limite.setUTCFullYear(limite.getUTCFullYear()+2);
  const limiteTxt=limite.toISOString().slice(0,10);
  ST.cheques.forEach((ch,i)=>{
    const e={n:null,f:null,i:null}, a={n:null,f:null,i:null};
    const n=String(ch.n||"").replace(/[^0-9]/g,"").replace(/^0+/,"");
    if(!n) e.n="falta el número";
    else if(vistos[n]!=null) e.n="repetido con la fila "+(vistos[n]+1);
    else if(usados&&usados[n]) e.n="ya existe en Odoo ("+usados[n][0].name+", "+money(usados[n][0].amount)+")";
    else vistos[n]=i;
    const f=String(ch.f||"");
    if(!f) e.f="falta la fecha";
    else if(f.length!==10) e.f="fecha incompleta";
    else if(f<hoy)        a.f="ya pasó — el cheque vencía el "+f.slice(8,10)+"/"+f.slice(5,7);
    else if(f>limiteTxt)  a.f="está a más de 2 años: revisá el año";
    const im=num(ch.i);
    if(!im) e.i="falta el importe";
    else if(im<0) e.i="no puede ser negativo";
    res.push(Object.assign({}, e, {_a:a}));
  });
  const suma=r2(ST.cheques.reduce((s,ch)=>s+num(ch.i),0));
  return {filas:res, suma, dif:r2(c.pagar-suma),
          hayError:res.some(e=>e.n||e.f||e.i),
          hayAviso:res.some(e=>e._a.n||e._a.f||e._a.i)};
}

/* ══════════════════════════════════════════════════════════════════════════
   LEER EL COMPROBANTE DE E-CHEQ DEL HOME BANKING
   El PDF que baja Credicoop cuando se emiten los cheques trae, por cada uno:
   número, fecha de pago, moneda, monto, beneficiario, CUIT, id del cheque,
   estado, motivo, banco, carácter, fecha de emisión, código de banco y cuenta
   emisora. Con eso se llena la tanda entera sin tipear.

   Se extrae sin librerías: los streams del PDF vienen con FlateDecode y el
   navegador sabe inflarlos con DecompressionStream. El texto son los literales
   entre paréntesis de los operadores Tj/TJ.

   Verificado el 30/09/2026 contra "Pago Factura A - 2-40929 - 29-06-2026.pdf":
   17 cheques, números 29581513 a 29581529, $10.296.029,50 en total. */
/* DecompressionStream es ESTRICTO: si después del bloque comprimido sobra un solo
   byte, falla con "Trailing junk found after the end of the compressed stream". Y los
   PDF casi siempre dejan un salto de línea entre el final del stream y la palabra
   "endstream". Por eso se recorta el whitespace del final antes de inflar, y si aún
   falla se van sacando bytes de a uno: el zlib de Node lo tolera solo, el navegador no. */
async function inflarUno(bytes, fmt){
  const ds=new DecompressionStream(fmt);
  const buf=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
  return new Uint8Array(buf);
}
async function inflar(bytes){
  if(typeof DecompressionStream==="undefined")
    throw new Error("este navegador no sabe descomprimir (DecompressionStream). Cargá los cheques a mano.");
  /* whitespace del final: 10 = salto, 13 = retorno, 32 = espacio */
  let fin=bytes.length;
  while(fin>0 && (bytes[fin-1]===10||bytes[fin-1]===13||bytes[fin-1]===32)) fin--;
  const candidatos=[bytes.subarray(0,fin), bytes];
  for(let corte=1; corte<=4; corte++) candidatos.push(bytes.subarray(0, Math.max(0,fin-corte)));
  for(const c of candidatos){
    if(!c.length) continue;
    for(const fmt of ["deflate","deflate-raw"]){
      try{ return await inflarUno(c, fmt); }catch(e){}
    }
  }
  return null;
}
async function textoDelPdf(arrayBuffer){
  const u=new Uint8Array(arrayBuffer);
  let crudo=""; for(let i=0;i<u.length;i++) crudo+=String.fromCharCode(u[i]);
  const partes=[];
  let i=0;
  while((i=crudo.indexOf("stream",i))>=0){
    let s=i+6; if(crudo[s]==="\r")s++; if(crudo[s]==="\n")s++;
    const e=crudo.indexOf("endstream",s); if(e<0) break;
    const sub=u.subarray(s,e);
    const inf=await inflar(sub);
    if(inf){ let t=""; for(let k=0;k<inf.length;k++) t+=String.fromCharCode(inf[k]); partes.push(t); }
    i=e+9;
  }
  return partes.join("\n");
}
/* Los literales ( ... ) del contenido, con su posición, para poder cortar por línea. */
function literalesPdf(str){
  const B=String.fromCharCode(92), res=[];
  let k=0;
  while(k<str.length){
    if(str[k]==="("){
      let d=1,j=k+1,buf="";
      while(j<str.length&&d>0){
        const ch=str[j];
        if(ch===B){ buf+=str[j+1]||""; j+=2; continue; }
        if(ch==="("){d++;} else if(ch===")"){d--; if(!d){j++;break;}}
        buf+=ch; j++;
      }
      res.push({txt:buf,pos:k}); k=j;
    } else k++;
  }
  return res;
}
function lineasPdf(contenido){
  const lits=literalesPdf(contenido), out=[];
  let linea="", prev=0;
  lits.forEach(l=>{
    const entre=contenido.slice(prev,l.pos);
    if(prev && (entre.indexOf("Td")>=0||entre.indexOf("TD")>=0||entre.indexOf("T*")>=0||entre.indexOf("ET")>=0)){
      if(linea.trim()) out.push(linea.trim()); linea="";
    }
    linea+=l.txt; prev=l.pos+l.txt.length;
  });
  if(linea.trim()) out.push(linea.trim());
  return out;
}
const esFecha = s => s.length===10 && s[2]==="/" && s[5]==="/" && /^[0-9/]+$/.test(s);
const aISO = s => s.slice(6,10)+"-"+s.slice(3,5)+"-"+s.slice(0,2);
/* Un cheque arranca donde hay un número largo seguido de una fecha. El resto de
   los campos se toma por posición dentro del bloque, que el banco respeta. */
function chequesDelPdf(lineas){
  const out=[];
  for(let i=0;i<lineas.length-3;i++){
    const n=lineas[i];
    if(!/^[0-9]{6,10}$/.test(n)) continue;
    if(!esFecha(lineas[i+1])) continue;
    if(String(lineas[i+2]||"").toLowerCase().indexOf("peso")<0) continue;   // moneda
    const monto=num(lineas[i+3]);
    if(!monto) continue;
    const bloque=lineas.slice(i, i+16);
    const cuit=(bloque.find(x=>/^[0-9]{2}-[0-9]{8}-[0-9]$/.test(x))||"").replace(/[^0-9]/g,"");
    const cuenta=bloque.find(x=>x.indexOf("/")>0 && x.indexOf("-")>0 && /^[0-9-]+\/[0-9]$/.test(x))||"";
    const benef=lineas[i+4]||"";
    const emision=bloque.filter(esFecha)[1]||"";
    out.push({n, f:aISO(lineas[i+1]), i:monto, benef, cuit, cuenta,
              emision:emision?aISO(emision):"", id:lineas[i+6]||"", estado:bloque.find(x=>x==="ACTIVO")?"ACTIVO":""});
    i+=12;
  }
  return out;
}

/* ══════════════════════════════════════════════════════════════════════════
   4) CONFIRMAR: un account.payment por cheque
   Molde verificado contra los pagos de Federico (OP-X 7944 a 7953, Dnm Farma,
   28/09/2026). La retención va en el PRIMER cheque de la tanda, que es como la
   carga él: no se reparte entre todos.
   ══════════════════════════════════════════════════════════════════════════ */
window.confirmar=()=>conTrabajo(async()=>{
  const B=BANCOS[ST.banco], c=calculo();
  const u=await numerosUsados();
  const v=validarCheques(u);
  if(v.hayError){ log("Hay filas con error: no se crea nada","e"); render(); return; }
  if(Math.abs(v.dif)>0.005){ log("Los cheques suman "+money(v.suma)+" y hay que pagar "+money(c.pagar)+": difieren en "+money(v.dif),"e"); return; }
  if(!c.fs.length){ log("No hay comprobantes tildados","e"); return; }

  /* La retención va en el PRIMER cheque de la tanda, que es como la carga Federico.
     El pago sale por el importe del cheque y la retención se suma aparte: entre los
     dos imputan el bruto de las facturas a la cuenta Proveedores. */
  const cert = c.gan>0 ? await siguienteCertificado() : null;
  const creados=[];
  for(let i=0;i<ST.cheques.length;i++){
    const ch=ST.cheques[i];
    const vals={
      date:ST.fecha, amount:num(ch.i),
      payment_type:"outbound", partner_type:"supplier", partner_id:ST.prov.id,
      journal_id:B.diario, payment_method_line_id:B.metodo,
      destination_account_id:CTA_PROV,
      l10n_latam_document_type_id:DOC_ORDEN,
      l10n_latam_check_number:String(ch.n).replace(/[^0-9]/g,""),
      l10n_latam_check_payment_date:ch.f,
    };
    if(i===0){
      const rets=[];
      if(c.gan>0)  rets.push([0,0,{tax_id:TAX_GAN,  base_amount:c.neto, amount:c.gan,  name:cert}]);
      if(c.iibb>0) rets.push([0,0,{tax_id:TAX_IIBB, base_amount:c.neto, amount:c.iibb, name:cert}]);
      if(rets.length) vals.l10n_ar_withholding_line_ids=rets;
    }
    const id=await rpc("account.payment","create",[[vals]]);
    const pid=Array.isArray(id)?id[0]:id;
    await rpc("account.payment","action_post",[[pid]]);
    const p=(await rpc("account.payment","read",[[pid],["name","move_id"]]))[0];
    creados.push(p);
    log("Cheque "+ch.n+" por "+money(num(ch.i))+" a cobrar el "+ch.f+" — "+p.name,"o");
  }
  /* Imputar: las patas de Proveedores de los pagos contra las de los comprobantes. */
  const patas=[];
  for(const p of creados){
    const mv=(await rpc("account.move","read",[[p.move_id[0]],["line_ids"]]))[0];
    const ls=await rpc("account.move.line","read",[mv.line_ids,["id","account_id"]]);
    const l=ls.find(x=>x.account_id[0]===CTA_PROV); if(l) patas.push(l.id);
  }
  if(patas.length){
    await rpc("account.move.line","reconcile",[patas.concat(c.fs.map(f=>f.id))]);
    log("Imputado a "+c.fs.length+" comprobante(s) de "+ST.prov.nombre,"o");
  }
  if(c.ret>0) log("Retención de "+money(c.ret)+" cargada en "+creados[0].name+
    (cert?" (certificado "+cert+")":"")+" — Ganancias "+money(c.gan)+(c.iibb?" · IIBB "+money(c.iibb):""),"o");
  log("Listo: "+creados.length+" cheque(s) por "+money(v.suma),"o");
  ST.cheques=[]; ST.sel=new Set(); _numsOdoo=null;
  await cargarDeuda(ST.prov.id);
});

    paso("− mínimo no imponible"+(hayAcum?' <span class="sug">(se computa una sola vez por mes)</span>':""), "−"+money(c.mni), "sug")+
    paso("<b>= sujeto a retención</b>", money(c.sujeta))+
    paso("× alícuota "+c.alicPct+" %"+((ST.sit&&ST.sit.inscripto===false)?' <span class="sug">(no inscripto)</span>':""), money(c.ganBruta), "sug")+
    (c.yaRet?paso("− retenido antes este mes", "−"+money(c.yaRet), "sug"):"")+
    (c.bajoPiso?paso('<span class="sug">queda por debajo del piso de '+money(RG830.minRet)+': no corresponde retener</span>', "0,00", "sug"):"")+
    paso("<b>Retención a practicar</b>", inpGan)+
  '</div>')+
  (Math.abs(c.gan-c.ganSug)>0.005?'<div class="nota" style="margin:7px 0 0">Lo calculado era <b>'+money(c.ganSug)+'</b> y está puesto <b>'+money(c.gan)+'</b>. Manda el tuyo.</div>':"")+
  '</div>'+

  '<div class="calcbox"><div class="ch-t">🧮 Retención de IIBB Santa Fe</div>'+
  (c.exento ? '<div class="aviso ok" style="margin:0">🚫 <div>Tampoco se le retiene IIBB.</div></div>' :
  '<div class="calc">'+
    paso("Alícuota"+(haySug?' <span class="sug">(la última vez fue '+ST.iibbHist+' %)</span>':""),
         '<select onchange="setAlicIIBB(this.value)">'+opsIIBB+'</select>')+
    paso("sobre la base", c.alicIIBB?money(c.neto)+" × "+c.alicIIBB+" %":"—", "sug")+
    paso("<b>Retención a practicar</b>", inpIIBB)+
  '</div>')+
  '<div class="nota" style="margin:7px 0 0">La alícuota depende del padrón de Santa Fe, así que no se adivina: se elige. En esta base aparecen 0,7 % y 2,75 %.</div></div>'+

  '<div class="calc" style="margin-top:13px">'+
    paso("Comprobantes", money(c.bruto))+
    paso("− retenciones", "−"+money(c.ret), "sug")+
    '<div class="tot">A pagar con cheques</div><div class="v tot">'+money(c.pagar)+'</div>'+
  '</div>'+
  (editado?'<div class="acciones" style="margin-top:9px"><button class="btn gh sm" onclick="volverSug()">Volver a lo calculado</button></div>':"");
}

function repintarCalc(){ const el=document.getElementById("calc-box");
  if(el) el.innerHTML=contenidoCalc(); repintarCuadre(); }

function bloqueCheques(){
  const c=calculo();
  if(!c.fs.length) return '<div class="panel"><div class="paso">Paso 4</div><h3>💳 Los cheques</h3>'+
    '<div class="aviso info">ℹ️ <div>Primero tildá los comprobantes que va a cancelar este pago.</div></div></div>';
  return '<div class="panel"><div class="paso">Paso 4</div><h3>💳 Los cheques que se emitieron</h3>'+
    '<div class="sub">Una fila por cheque, con el número y la fecha en que se puede cobrar. '+
    'Los cheques son diferidos: en esta casa el plazo va de 28 a 65 días. '+
    'Se controla que el número no esté usado y que la suma dé exacto.</div>'+
    zonaPdf()+
    '<div class="acciones"><button class="btn" onclick="agregarCheque()">+ Agregar cheque</button>'+
    (ST.cheques.length?'<button class="btn gh" onclick="repartir()" title="Divide el total entre las filas que hay, ajustando en la última.">Repartir el total entre las '+ST.cheques.length+'</button>'+
      '<button class="btn gh" onclick="revisarNumeros()">Revisar los números contra Odoo</button>':"")+'</div>'+
    (ST.cheques.length?tablaCheques():'<div class="muted" style="padding:10px 0">Todavía no agregaste ningún cheque.</div>')+
    '<div id="cuadre">'+contenidoCuadre()+'</div></div>';
}
function zonaPdf(){
  const P=ST.pdf;
  let h='<div class="droppdf" id="dropPdf">'+
    '<div class="dz-t">📄 Soltá acá el comprobante de e-cheq del home banking</div>'+
    '<div class="dz-s">Lee los cheques, el beneficiario y la cuenta emisora, y completa la tabla sola. '+
    'También podés <label class="fakelink">elegir el archivo<input type="file" accept=".pdf" hidden onchange="leerPdf(this.files)"></label> '+
    'o cargarlos a mano más abajo.</div></div>';
  if(P) h+='<div class="aviso '+(P.avisos.length?"warn":"ok")+'" style="margin:10px 0 0">'+(P.avisos.length?"⚠️":"✅")+' <div>'+
    '<b>'+esc(P.archivo)+'</b>: '+P.total+' cheques por <b>'+money(P.suma)+'</b>'+
    (P.emision?', emitidos el '+esc(P.emision):"")+'. '+
    (P.yaEstan?'<b>'+P.yaEstan+' ya estaban cargados</b> y no se repiten. ':"")+
    (P.avisos.length?'<br>'+esc(P.avisos.join(" · ")):"")+'</div></div>';
  return h;
}
function tablaCheques(){
  const v=validarCheques(_val);
  /* El ERROR pinta el borde rojo y frena; el AVISO pinta ámbar y deja seguir. */
  const msg=(err,avi)=>err?'<div class="fmal">'+esc(err)+'</div>'
                      :avi?'<div class="favi">⚠ '+esc(avi)+'</div>':"";
  return '<div style="overflow:auto"><table class="fc"><thead><tr><th>#</th><th>N° de cheque</th><th>Se cobra el</th>'+
    '<th class="num">Importe</th><th></th></tr></thead><tbody>'+
    ST.cheques.map((ch,i)=>{ const e=v.filas[i]||{}, a=(e._a||{});
      return '<tr><td class="muted">'+(i+1)+'</td>'+
      '<td><input class="ch n'+(e.n?" mal":a.n?" avi":"")+'" value="'+esc(ch.n)+'" placeholder="40855518" '+
        'onchange="setCheque('+i+',&quot;n&quot;,this.value)" title="'+esc(e.n||a.n||"")+'">'+msg(e.n,a.n)+'</td>'+
      '<td><input class="ch f'+(e.f?" mal":a.f?" avi":"")+'" type="date" value="'+esc(ch.f)+'" '+
        'onchange="setCheque('+i+',&quot;f&quot;,this.value)" title="'+esc(e.f||a.f||"")+'">'+msg(e.f,a.f)+'</td>'+
      '<td class="num"><input class="ch i'+(e.i?" mal":"")+'" value="'+esc(ch.i)+'" placeholder="1.058.250,00" '+
        'onchange="setCheque('+i+',&quot;i&quot;,this.value)">'+msg(e.i,a.i)+'</td>'+
      '<td><button class="btn gh sm" onclick="quitarCheque('+i+')">quitar</button></td></tr>'; }).join("")+
    '</tbody></table></div>';
}
function contenidoCuadre(){
  const c=calculo(), v=validarCheques(_val);
  if(!ST.cheques.length) return "";
  /* Sólo los ERRORES frenan. Los avisos —una fecha de cobro ya cumplida, por ejemplo—
     se marcan pero dejan cargar: un cheque emitido hace meses es un caso normal. */
  const ok=Math.abs(v.dif)<0.005 && !v.hayError;
  return '<div class="cuadre '+(ok?"ok":"mal")+'">'+
    '<span>Suma de los cheques <b>'+money(v.suma)+'</b></span>'+
    '<span>A pagar <b>'+money(c.pagar)+'</b></span>'+
    '<span>'+(Math.abs(v.dif)<0.005?"✔ cierra exacto":"Diferencia <b>"+money(v.dif)+"</b>")+'</span>'+
    (v.hayError?'<span>⛔ hay filas que no se pueden cargar</span>':"")+
    '</div>'+
    (v.hayAviso&&!v.hayError?'<div class="aviso warn" style="margin:9px 0 0">⚠️ <div>Hay fechas marcadas. '+
      '<b>Se cargan igual</b>: un cheque emitido hace tiempo ya tiene la fecha de cobro cumplida y eso es normal. '+
      'Verificá que sean las del comprobante y seguí.</div></div>':"")+
    '<div class="acciones" style="margin-top:11px">'+
      '<button class="btn wide" onclick="confirmar()" '+(ok&&!ST.trabajando?"":"disabled")+'>'+
      (ST.trabajando?'<span class="spin"></span> ':"")+
      'Crear '+ST.cheques.length+' cheque'+(ST.cheques.length===1?"":"s")+' por '+money(v.suma)+
      (c.ret>0?' + retención '+money(c.ret):"")+'</button></div>'+
    (ok?'<div class="nota">Se va a crear <b>una orden de pago por cheque</b> en '+esc(BANCOS[ST.banco].nombre)+
      ', imputada a los '+c.fs.length+' comprobante(s) tildados'+
      (c.ret>0?', con la retención en el primero de la tanda':"")+'. Se puede deshacer solo desde Odoo.</div>':"");
}
function repintarCuadre(){ const el=document.getElementById("cuadre"); if(el) el.innerHTML=contenidoCuadre(); }
