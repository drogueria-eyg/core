<script>
const RPC="https://yxotopoklgjowcudveoj.supabase.co/functions/v1/odoo-rpc";
const ODOO="https://drogueriaeyg.odoo.com";
const money=n=>EYG.money(n);
// Monto compacto para KPIs grandes: $1,7 MM / $850 mil
function moneyK(n){ n=Math.abs(n||0);
  // Siempre en millones: "MM MM" no lo lee nadie. $4.043.918.675 → "$4.044 MM".
  if(n>=1e9) return "$"+Math.round(n/1e6).toLocaleString("es-AR")+" MM";
  if(n>=1e6) return "$"+(n/1e6).toLocaleString("es-AR",{maximumFractionDigits:1})+" MM";
  if(n>=1e3) return "$"+Math.round(n/1e3).toLocaleString("es-AR")+" mil"; return money(n); }
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

async function rpc(model,method,args,kwargs={}){
  // Un solo camino (core.js): viaja en lote con las demás consultas del mismo instante
  // y reintenta con la misma regla. Lo de abajo queda sólo por si core.js viene viejo de caché.
  if(EYG.rpcExacto) return EYG.rpcExacto(model,method,args,kwargs);
  // Reintenta SÓLO lo que falló en el camino (red, 429, 502-504) y nunca un corte
  // por tiempo ni un error de Odoo: la regla vive en EYG.rpcReintentable (core.js).
  let ultimo;
  for(let i=0;i<3;i++){
    let llego=false;
    try{
      const head=await EYG.rpcHead();  // manda quién es, para que Odoo firme la nota con su nombre
      const r=await EYG.gate(()=>fetch(RPC,{method:"POST",headers:head,body:JSON.stringify({model,method,args,kwargs})}));
      llego=r.status<502;
      const j=await r.json();
      if(!j.ok) throw new Error(j.error||"Error Odoo");
      return j.result;
    }catch(e){ ultimo=e; if(i<3-1 && EYG.rpcReintentable && EYG.rpcReintentable(method,e&&e.message,llego)){ await new Promise(s=>setTimeout(s,500*(i+1))); continue; } throw ultimo; }
  }
  throw ultimo;
}

/* ===== Naturaleza del egreso — clasificación por prefijo de cuenta contable =====
   El plan de EyG (localización AR) tiene el gasto en la clase 5. Bucketizamos por
   prefijo del código de cuenta. Es la columna vertebral del módulo: TODO egreso
   cae en una de estas naturalezas. Se refina agregando/moviendo prefijos. */
const NAT=[
  {k:"merca", nom:"Mercadería (reventa)", col:"var(--n-merca)", pref:["5.1.1"]},
  {k:"logis", nom:"Depósito y logística", col:"var(--n-logis)", pref:["5.1.2"]},
  {k:"comer", nom:"Gastos comerciales",   col:"var(--n-comer)", pref:["5.2"]},
  {k:"admin", nom:"Administración",        col:"var(--n-admin)", pref:["5.3"]},
  {k:"imp",   nom:"Impuestos",             col:"var(--n-imp)",   pref:["5.4","5.5"]},
  {k:"fin",   nom:"Financieros",           col:"var(--n-fin)",   pref:["5.6"]},
  {k:"capex", nom:"Bienes de uso",         col:"var(--n-capex)", pref:["1.2"]},
  {k:"otros", nom:"Otros / a clasificar",  col:"var(--n-otros)", pref:[]},
];
function natDe(code){
  const c=String(code||"").trim();
  for(const n of NAT){ if(n.pref.some(p=>c.startsWith(p))) return n.k; }
  return "otros";
}

const HOY=new Date();
const desde12m=(()=>{ const d=new Date(HOY); d.setFullYear(d.getFullYear()-1); d.setDate(1); return d.toISOString().slice(0,10); })();

let ST={ tab:"panorama", data:null, abierta:null, det:{} };

const TABS=[
  {k:"panorama",  ico:"📊", nom:"Panorama",        ready:true},
  {k:"compras",   ico:"🧾", nom:"Compras",         ready:false},
  {k:"gastos",    ico:"💡", nom:"Gastos operativos",ready:true},
  {k:"financ",    ico:"🏦", nom:"Financieros",     ready:true},
  {k:"impuestos", ico:"🧮", nom:"Impuestos",       ready:true},
  {k:"pagos",     ico:"💸", nom:"Pagos y por pagar",ready:true},
  {k:"prov",      ico:"🏭", nom:"Proveedores",     ready:false},
];

function renderTabs(){
  document.getElementById("tabs").innerHTML = TABS.map(t=>
    `<button class="tab ${ST.tab===t.k?'on':''}" onclick="irTab('${t.k}')">${t.ico} ${esc(t.nom)}${t.ready?'':'<span class="soon">pronto</span>'}</button>`
  ).join("");
}
function irTab(k){ ST.tab=k; renderTabs(); renderView(); }

/* ===== Carga del Panorama (una sola pasada de consultas agregadas) ===== */
async function cargarPanorama(){
  // 1) Composición por cuenta: TODAS las cuentas de resultado negativo (12m).
  //    Antes miraba sólo facturas de proveedor y por eso el panorama no era real:
  //    los sueldos, los impuestos al cheque y los costos bancarios entran por el
  //    extracto, no por una factura, y quedaban afuera.
  const GASTO=["expense","expense_direct_cost","expense_depreciation"];
  const porCuenta = await rpc("account.move.line","read_group",
    [[["account_id.account_type","in",GASTO],
      ["parent_state","=","posted"],["date",">=",desde12m]],
     ["balance:sum"],["account_id"]],
    {lazy:false,limit:400});

  // 2) Órdenes de compra abiertas (compromiso a futuro).
  const oc = await rpc("purchase.order","read_group",
    [[["state","in",["purchase","done"]]],["amount_total:sum"],["state"]],{lazy:false});

  // 3) Pagos salientes posteados (12m) — la tesorería real.
  const pagos = await rpc("account.payment","read_group",
    [[["payment_type","=","outbound"],["state","=","posted"],["date",">=",desde12m]],
     ["amount:sum"],["date:month"]],{lazy:false,orderby:"date asc"});

  // 4) Cuentas por pagar HOY (deuda con proveedores sin conciliar).
  const cxp = await rpc("account.move.line","read_group",
    [[["account_id.account_type","=","liability_payable"],["parent_state","=","posted"],
      ["full_reconcile_id","=",false],["amount_residual","!=",0]],
     ["amount_residual:sum"],[]],{lazy:false});

  // 5) Evolución mensual de compras (facturas proveedor posteadas, 12m).
  const compMes = await rpc("account.move","read_group",
    [[["move_type","=","in_invoice"],["state","=","posted"],["invoice_date",">=",desde12m]],
     ["amount_total_signed:sum"],["invoice_date:month"]],{lazy:false,orderby:"invoice_date asc"});

  // 6) Top proveedores por compras (12m).
  const topProv = await rpc("account.move","read_group",
    [[["move_type","=","in_invoice"],["state","=","posted"],["invoice_date",">=",desde12m]],
     ["amount_total_signed:sum"],["partner_id"]],
    {lazy:false,limit:12,orderby:"amount_total_signed asc"});  // signed es negativo → asc = mayor gasto

  // 7) Huecos: cuenta × mes. Un gasto recurrente al que le falta un mes es un
  //    comprobante sin cargar — así se encontraron la luz (5 de 10 meses) y las
  //    cargas sociales (4 de 10).
  const porCtaMes = await rpc("account.move.line","read_group",
    [[["account_id.account_type","in",GASTO],
      ["parent_state","=","posted"],["date",">=",desde12m]],
     ["balance:sum"],["account_id","date:month"]],
    {lazy:false,limit:3000});

  // --- Bucketizar composición por naturaleza ---
  const comp={}; NAT.forEach(n=>comp[n.k]=0);
  let totalGasto=0;
  for(const g of porCuenta){
    const code = g.account_id ? String(g.account_id[1]).split(" ")[0] : "";
    const bal = g.balance||0;
    if(bal<=0) continue;                 // sólo el gasto (débitos); ignora ajustes/NC negativas
    const k=natDe(code);
    // Cuentas puente/activo (1.1.x) que aparecen en líneas de factura: fuera del gasto real.
    if(code.startsWith("1.1")) continue;
    comp[k]+=bal; totalGasto+=bal;
  }

  const ocTotal=(oc||[]).reduce((a,g)=>a+(g.amount_total||0),0);
  const cxpTotal=(cxp&&cxp[0]&&cxp[0].amount_residual)||0;
  const pagosTotal=(pagos||[]).reduce((a,g)=>a+(g.amount||0),0);

  // --- Huecos por cuenta: qué meses tiene cada gasto y cuáles le faltan ---
  const meses=[]; { const d=new Date(HOY); d.setDate(1);
    for(let i=11;i>=0;i--){ const x=new Date(d); x.setMonth(x.getMonth()-i); meses.push(x.toISOString().slice(0,7)); } }
  const porCta={};
  for(const g of (porCtaMes||[])){
    if(!g.account_id) continue;
    const nombre=String(g.account_id[1]), code=nombre.split(" ")[0];
    if(code.startsWith("1.1")) continue;
    const ym=(g.__range && g.__range["date:month"] && g.__range["date:month"].from || "").slice(0,7);
    if(!ym) continue;
    porCta[code]=porCta[code]||{code, id:g.account_id[0], nom:nombre.split(" ").slice(1).join(" "), nat:natDe(code), tot:0, m:{}};
    porCta[code].m[ym]=(porCta[code].m[ym]||0)+(g.balance||0);
    porCta[code].tot+=(g.balance||0);
  }
  // Recurrente = aparece en 4 meses o más de los 12. Si además le falta alguno, es un hueco.
  // El mes en curso no cuenta como hueco: todavía se está cargando.
  const mesEnCurso=meses[meses.length-1];
  const cerrados=meses.filter(m=>m!==mesEnCurso);
  const huecos=Object.values(porCta)
    .map(c=>{ const con=cerrados.filter(m=>Math.abs(c.m[m]||0)>0.5);
              return {...c, con:con.length, falta:cerrados.filter(m=>Math.abs(c.m[m]||0)<=0.5)}; })
    .filter(c=>c.tot>0 && c.con>=4 && c.falta.length>0)
    .sort((a,b)=>b.falta.length-a.falta.length || b.tot-a.tot);

  return { comp, totalGasto, ocTotal, cxpTotal, pagosTotal, meses, huecos, mesEnCurso,
           ctas:Object.values(porCta).sort((a,b)=>b.tot-a.tot),
           compMes:(compMes||[]).map(g=>({ym:g.__range&&g.__range["invoice_date:month"]?g.__range["invoice_date:month"].from:"", v:Math.abs(g.amount_total_signed||0)})),
           topProv:(topProv||[]).filter(g=>g.partner_id).map(g=>({nom:g.partner_id[1], v:Math.abs(g.amount_total_signed||0), n:g.__count})).sort((a,b)=>b.v-a.v) };
}

/* ===== Pagos y por pagar — aging por proveedor + salida de tesorería ===== */
const hoyStr=new Date(HOY.getTime()-HOY.getTimezoneOffset()*60000).toISOString().slice(0,10);
const AGT=[
  {k:"vencer", l:"Por vencer / al día", t:"t-vencer", test:d=>d<=0},
  {k:"d30",    l:"Vencido 1–30",        t:"t-d30",    test:d=>d>0&&d<=30},
  {k:"d60",    l:"Vencido 31–60",       t:"t-d60",    test:d=>d>30&&d<=60},
  {k:"d90",    l:"Vencido 61–90",       t:"t-d90",    test:d=>d>60&&d<=90},
  {k:"mas",    l:"Vencido +90",         t:"t-mas",    test:d=>d>90},
];
function agDe(dias){ return AGT.find(t=>t.test(dias))||AGT[0]; }

async function cargarPagos(){
  // Líneas payable abiertas (deuda con proveedores). residual<0 = debemos; residual>0 = adelanto/saldo a favor.
  const ml=await rpc("account.move.line","search_read",
    [[["account_id.account_type","=","liability_payable"],["parent_state","=","posted"],
      ["full_reconcile_id","=",false],["amount_residual","!=",0]]],
    {fields:["partner_id","move_name","date","date_maturity","amount_residual"],limit:0});
  // Salida de tesorería por diario (12m).
  const jour=await rpc("account.payment","read_group",
    [[["payment_type","=","outbound"],["state","=","posted"],["date",">=",desde12m]],
     ["amount:sum"],["journal_id"]],{lazy:false,limit:40,orderby:"amount desc"});

  const P={}; const tramo={}; AGT.forEach(t=>tramo[t.k]=0); let favor=0;
  for(const l of ml){
    if(!l.partner_id) continue;
    const id=l.partner_id[0], r=l.amount_residual||0;
    if(Math.abs(r)<0.5) continue;
    const p=P[id]||(P[id]={id,nombre:l.partner_id[1],deuda:0,adelanto:0,vencido:0,peorDias:-1e9,venc:null});
    if(r<0){                                   // le debemos
      const debe=-r;
      p.deuda+=debe;
      const venc=l.date_maturity||l.date||null;
      const dias=venc?Math.floor((new Date(hoyStr)-new Date(venc+"T00:00:00"))/86400000):0;
      const g=agDe(dias); tramo[g.k]+=debe;
      if(dias>0) p.vencido+=debe;
      if(dias>p.peorDias){ p.peorDias=dias; p.venc=venc; }
    }else{                                     // adelanto / saldo a favor nuestro
      p.adelanto+=r; favor+=r;
    }
  }
  const provs=Object.values(P).map(p=>({...p, neto:p.deuda-p.adelanto}))
    .filter(p=>p.deuda>0.5).sort((a,b)=>b.deuda-a.deuda);
  const totalDeuda=provs.reduce((a,p)=>a+p.deuda,0);
  const totalVencido=provs.reduce((a,p)=>a+p.vencido,0);
  const jours=(jour||[]).filter(g=>g.journal_id).map(g=>({nom:g.journal_id[1],v:g.amount||0,n:g.__count}));
  const jTot=jours.reduce((a,j)=>a+j.v,0);
  return {provs,tramo,favor,totalDeuda,totalVencido,nProv:provs.length,jours,jTot};
}

/* ===== Abrir una cuenta: de quién es cada peso y qué movimientos la componen ===== */
async function cargarDetalle(cta){
  const [quien, movs] = await Promise.all([
    rpc("account.move.line","read_group",
      [[["account_id","=",cta.id],["parent_state","=","posted"],["date",">=",desde12m]],
       ["balance:sum"],["partner_id"]], {lazy:false,limit:300}),
    rpc("account.move.line","search_read",
      [[["account_id","=",cta.id],["parent_state","=","posted"],["date",">=",desde12m]],
       ["date","name","balance","partner_id","move_id"]], {limit:300,order:"date desc"})
  ]);
  return {
    quien:(quien||[]).map(g=>({nom:g.partner_id?g.partner_id[1]:"(sin contacto)", v:g.balance||0, n:g.__count}))
          .filter(x=>x.v>0.5).sort((a,b)=>b.v-a.v),
    movs:(movs||[]).map(l=>({f:l.date, q:l.partner_id?l.partner_id[1]:"", t:l.name||"",
                             v:l.balance||0, doc:l.move_id?l.move_id[1]:""})).filter(x=>x.v>0.5)
  };
}
window.abrirCta=async function(code){
  if(ST.abierta===code){ ST.abierta=null; renderView(); return; }
  ST.abierta=code; renderView();
  if(!ST.det[code]){
    const cta=(ST.data.ctas||[]).find(c=>c.code===code);
    if(!cta) return;
    try{ ST.det[code]=await cargarDetalle(cta); }
    catch(e){ ST.det[code]={error:(e&&e.message)||String(e)}; }
    if(ST.abierta===code) renderView();
  }
};
function detalleHTML(code){
  const d=ST.det[code];
  if(!d) return `<div class="dwrap"><div class="dcarga"><div class="spinner"></div>Buscando de quién es cada movimiento…</div></div>`;
  if(d.error) return `<div class="dwrap"><div class="err">No se pudo abrir el detalle: ${esc(d.error)}</div></div>`;
  const tot=d.quien.reduce((s,x)=>s+x.v,0)||1;
  const mx=d.quien.length?d.quien[0].v:1;
  return `<div class="dwrap">
    <div class="dtit">De quién es · ${d.quien.length} ${d.quien.length===1?"contacto":"contactos"} en 12 meses</div>
    ${d.quien.slice(0,25).map(q=>`<div class="dq">
       <div class="dqn" title="${esc(q.nom)}">${esc(q.nom)}</div>
       <div class="dqb"><span style="width:${(q.v/mx*100).toFixed(1)}%"></span></div>
       <div class="dqv num">${moneyK(q.v)}</div>
       <div class="dqp">${(q.v/tot*100).toFixed(0)}%</div>
       <div class="dqn2">${q.n} mov</div></div>`).join("")}
    ${d.quien.length>25?`<div class="dmas">y ${d.quien.length-25} contactos más</div>`:""}
    <div class="dtit" style="margin-top:14px">Últimos movimientos</div>
    ${d.movs.slice(0,12).map(m=>`<div class="dm">
       <div class="dmf">${esc(m.f)}</div>

    ${d.movs.length>12?`<div class="dmas">y ${d.movs.length-12} movimientos más en los últimos 12 meses</div>`:""}
  </div>`;
}

/* ===== Detalle por cuenta de un rubro — misma data del panorama, otro filtro =====
   Gastos operativos, Financieros e Impuestos son la misma vista con distinta
   naturaleza: no hace falta volver a consultar Odoo. */
function renderRubro(nats, titulo, bajada){
  const v=document.getElementById("view"), d=ST.data;
  const mesLbl=ym=>{ if(!ym) return ""; const [y,m]=ym.split("-"); return ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"][(+m)-1]+" "+y.slice(2); };
  const L=(d.ctas||[]).filter(c=>nats.includes(c.nat) && c.tot>0);
  const tot=L.reduce((s,c)=>s+c.tot,0);
  const cerrados=d.meses.filter(m=>m!==d.mesEnCurso);
  const ult=cerrados[cerrados.length-1];
  const totUlt=L.reduce((s,c)=>s+Math.abs(c.m[ult]||0),0);
  const mesesCon=cerrados.filter(m=>L.some(c=>Math.abs(c.m[m]||0)>0.5)).length||1;
  const prom=tot/mesesCon;
  const dif=prom?((totUlt-prom)/prom*100):0;
  const faltanTot=L.reduce((s,c)=>s+cerrados.filter(m=>Math.abs(c.m[m]||0)<=0.5 && cerrados.filter(x=>Math.abs(c.m[x]||0)>0.5).length>=4).length,0);

  v.innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="l">📤 Total 12 meses</div><div class="n num">${moneyK(tot)}</div><div class="s">${L.length} cuentas con movimiento</div></div>
      <div class="kpi"><div class="l">📅 Promedio mensual</div><div class="n num">${moneyK(prom)}</div><div class="s">sobre ${mesesCon} meses con movimiento</div></div>
      <div class="kpi"><div class="l">📌 ${esc(mesLbl(ult))}</div><div class="n num">${moneyK(totUlt)}</div><div class="s" style="color:${Math.abs(dif)<12?'var(--gris)':(dif>0?'#C62828':'var(--teal)')}">${dif>0?'+':''}${dif.toFixed(0)}% contra el promedio</div></div>
      <div class="kpi"><div class="l">🕳️ Meses sin cargar</div><div class="n num" style="color:${faltanTot?'#C62828':'var(--teal)'}">${faltanTot}</div><div class="s">en cuentas recurrentes de este rubro</div></div>
    </div>
    <div class="panel"><h3>${esc(titulo)}</h3><div class="cap">${esc(bajada)}</div></div>
    <div class="hmat" style="margin-top:-8px">
      <div class="grow ghead"><div>Cuenta</div><div style="text-align:center">12 meses</div>
        <div class="rt" style="text-align:right">Total</div><div class="rt" style="text-align:right">${esc(mesLbl(ult))}</div><div style="text-align:right">faltan</div></div>
      ${L.length ? L.map(c=>{
        const col=(NAT.find(n=>n.k===c.nat)||{}).col||"var(--gris)";
        const mx=Math.max(1,...d.meses.map(m=>Math.abs(c.m[m]||0)));
        const con=cerrados.filter(m=>Math.abs(c.m[m]||0)>0.5).length;
        const falta=con>=4 ? cerrados.filter(m=>Math.abs(c.m[m]||0)<=0.5).length : 0;
        const ab=ST.abierta===c.code;
        return `<div class="grow${ab?' abierta':''}" onclick="abrirCta('${esc(c.code)}')" title="Tocá para ver de quién es">
          <div class="gn"><span class="fle${ab?' ab':''}">▸</span><span class="dot" style="background:${col}"></span><span class="tx" title="${esc(c.nom)}">${esc(c.nom)}</span><span class="cod">${esc(c.code)}</span></div>
          <div class="spark">${d.meses.map(m=>{ const val=Math.abs(c.m[m]||0);
             const cl = val>0.5 ? "" : (m===d.mesEnCurso?"cur":"cero");
             const h = val>0.5 ? Math.max(3,Math.round(val/mx*26)) : 3;
             return `<i class="${cl}" style="height:${h}px" title="${mesLbl(m)}: ${val>0.5?money(c.m[m]):'sin movimiento'}"></i>`; }).join("")}</div>
          <div class="rt num" style="text-align:right">${moneyK(c.tot)}</div>
          <div class="rt num" style="text-align:right">${Math.abs(c.m[ult]||0)>0.5?moneyK(c.m[ult]):'<span style="color:#C62828">—</span>'}</div>
          <div class="${falta?'gfalta':'gok'}">${falta||'✓'}</div></div>${ab?detalleHTML(c.code):""}`;
      }).join("") : '<div class="hnone">Sin movimiento en este rubro en los últimos 12 meses</div>'}
    </div>`;
}

      <div class="cap">Cuentas con movimiento en 4 meses o más de los últimos 12. Una celda marcada es un mes sin movimiento, es decir un comprobante que todavía no se cargó.</div>
    </div>
    <div class="hmat" style="margin-top:-8px">
      <div class="hrow hhead">
        <div>Cuenta</div>
        ${d.meses.map(m=>`<div class="hmlbl">${["E","F","M","A","M","J","J","A","S","O","N","D"][(+m.slice(5,7))-1]}</div>`).join("")}
        <div style="text-align:right">faltan</div>
      </div>
      ${d.huecos.length ? d.huecos.map(c=>{
        const col=(NAT.find(n=>n.k===c.nat)||{}).col||"var(--gris)";
        const ab=ST.abierta===c.code;
        return `<div class="hrow${ab?' abierta':''}" onclick="abrirCta('${esc(c.code)}')" title="Tocá para ver de quién es">
          <div class="hn" title="${esc(c.code)} ${esc(c.nom)} · ${money(c.tot)} en 12 meses"><span class="fle${ab?' ab':''}">▸</span><span class="dot" style="background:${col}"></span>${esc(c.nom)}</div>
          ${d.meses.map(m=>{ const v=Math.abs(c.m[m]||0), curso=(m===d.mesEnCurso);
            const cl = v>0.5 ? 'ok' : (curso?'cur':'no');
            return `<div class="hc ${cl}" title="${mesLbl(m)}: ${v>0.5?money(c.m[m]):(curso?'mes en curso':'sin movimiento')}"></div>`; }).join("")}
          <div class="hf">${c.falta.length}</div></div>${ab?detalleHTML(c.code):""}`;
      }).join("") : '<div class="hnone">Ningún gasto recurrente tiene meses sin cargar ✓</div>'}
    </div>

    <div class="panel">
      <h3>Evolución mensual de compras</h3>
      <div class="cap">Facturas de proveedor posteadas por mes</div>
      <div class="bars">${d.compMes.map(m=>`<div class="b"><div class="mv">${m.v>=1e6?(m.v/1e6).toFixed(0)+'M':Math.round(m.v/1e3)+'k'}</div><div class="col" style="height:${Math.max(2,m.v/maxMes*115)}px"></div><div class="mlbl">${mesLbl(m.ym)}</div></div>`).join("")}</div>
    </div>

    <div class="panel" style="padding-bottom:6px">
      <h3>Top proveedores</h3>
      <div class="cap">Por monto comprado · últimos 12 meses</div>
    </div>
    <div class="tablecard" style="margin-top:-8px">
      <div class="thead"><div>Proveedor</div><div class="rt">Comprado</div><div class="rt">Facturas</div></div>
      ${d.topProv.map(p=>`<div class="row"><div class="pn">${esc(p.nom)}</div><div class="rt num">${moneyK(p.v)}</div><div class="rt num">${p.n}</div></div>`).join("")||'<div class="row"><div class="pn" style="color:var(--gris)">Sin datos en el período</div><div></div><div></div></div>'}
    </div>
  `;
}
