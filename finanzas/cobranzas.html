<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobranzas · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=37"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --teal:#048782; --teal-deep:#04635F; --teal-med:#0AA89F; --aqua:#5FC8BF;
    --agua:#E2F1EF; --coral:#EC8B5E; --ink:#0E1F1D; --gris:#5F716E; --gris2:#8A9A97;
    --surface:#fff; --bg:#F4F8F7; --line:#DCE8E6; --radius:12px; --wa:#25D366;
    --shadow:0 1px 2px rgba(6,65,62,.05), 0 6px 24px rgba(6,65,62,.06);
    /* tramos de mora */
    --t0:#1E7D46; --t0bg:#E4F5E9;   /* por vencer / al día */
    --t1:#0A6BB0; --t1bg:#E4F0FA;   /* 1-20 */
    --t2:#8A6D1A; --t2bg:#FBF3D9;   /* +21 */
    --t3:#B7791F; --t3bg:#FBE9CF;   /* +30 */
    --t4:#C4602A; --t4bg:#FBE3D4;   /* +60 */
    --t5:#B0413E; --t5bg:#FBE0DF;   /* +90 */
    --t6:#8A1F1C; --t6bg:#F7D2D0;   /* +120 incobrable */
    --treg:#5B3FA6; --tregbg:#ECE6F6; /* gris: falta certificado/OP */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .topbar{background:var(--teal-deep);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:13px;position:sticky;top:0;z-index:30}
  .mono{font-family:Georgia,serif;font-weight:700;font-size:23px;letter-spacing:.5px;line-height:1}
  .mono .y{color:var(--aqua)}
  .topbar .tag{font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:20px}
  .topbar .title{font-weight:700;font-size:15px;margin-left:4px}
  .topbar .back{margin-left:auto;color:#fff;text-decoration:none;font-size:13px;font-weight:600;opacity:.85}
  .topbar .back:hover{opacity:1}
  .wrap{max-width:1240px;margin:0 auto;padding:22px 22px 90px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-bottom:18px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
  .kpi:hover{border-color:var(--teal-med)}
  .kpi.on{border-color:var(--teal);box-shadow:0 0 0 2px rgba(4,135,130,.15)}
  .kpi .n{font-size:22px;font-weight:800;line-height:1.15}
  .kpi .money{font-size:12px;font-weight:600;color:var(--gris);margin-top:1px}
  .kpi .l{font-size:11.5px;color:var(--gris);font-weight:600;margin-top:3px}
  .kpi .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .kpi.rub .l{color:var(--teal-deep)}
  /* Secciones de tarjetas (separan mora de rubros) */
  .cardsec{border-radius:var(--radius);padding:13px 15px 15px;margin-bottom:14px;border:1px solid var(--line)}
  .cardsec.sec-mora{background:#F2F7F6;border-color:#DDE9E7}
  .cardsec.sec-rubro{background:#E8F3F1;border-color:#CFE6E2}
  .cardsec .sectitle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--teal-deep);margin-bottom:12px}
  .cardsec .sectitle .secclr{font-size:11.5px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--teal);cursor:pointer;white-space:nowrap}
  .cardsec .sectitle .secclr:hover{text-decoration:underline}
  .cardsec .kpis{margin-bottom:0}
  /* Desempeño de cobranzas */
  .desemp .dtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin:8px 0 16px}
  .dtile{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 13px}
  .dtile .dv{font-size:20px;font-weight:800;line-height:1.12}
  .dtile .dl{font-size:11.5px;color:var(--gris);font-weight:700;margin-top:3px}
  .dtile .ds{font-size:11px;color:var(--gris2);margin-top:4px;line-height:1.4}
  .dtile .up{color:var(--t0);font-weight:700} .dtile .down{color:var(--t6);font-weight:700}
  .cflabel{font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--gris);margin:4px 0 8px}
  .cfleg{display:flex;gap:16px;margin-top:8px;font-size:11.5px;color:var(--gris)}
  .cfleg span{display:flex;align-items:center;gap:6px}.cfleg i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .faith{margin-top:13px;font-size:11.5px;color:var(--gris);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;line-height:1.55}
  .faith b{color:var(--teal-deep)}

  /* Panorama (evolución + composición) */
  .panorama{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
  .panorama .ptop{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .panorama h3{font-size:13.5px;font-weight:800;letter-spacing:.2px;color:var(--ink)}
  .panorama .cap{font-size:12px;color:var(--gris)}
  .panorama .cap b{color:var(--teal-deep)}
  .panorama .cap .up{color:#B0413E;font-weight:700}
  .evosvg{width:100%;height:auto;display:block;overflow:visible}
  .evowrap{position:relative}
  .evotip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;white-space:nowrap;opacity:0;transition:opacity .1s;transform:translate(-50%,-115%);z-index:5;box-shadow:0 4px 14px rgba(6,65,62,.25)}
  .evotip b{color:var(--aqua);font-weight:700}
  .compo{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .compo .clbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--gris);margin-bottom:7px}
  .compo .cbar{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--bg)}
  .compo .cbar > span{height:100%;transition:width .3s}
  .compo .cleg{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:9px}
  .compo .cleg .it{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--gris)}
  .compo .cleg .it b{color:var(--ink);font-weight:700}
  .compo .cleg .dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}

  .resumen{background:var(--teal-deep);color:#fff;border-radius:var(--radius);padding:16px 20px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:26px;align-items:center}
  .resumen .big{font-size:26px;font-weight:800}
  .resumen .mid{font-size:19px;font-weight:800}
  .resumen .lbl{font-size:12px;color:var(--aqua);font-weight:600;text-transform:uppercase;letter-spacing:1px}
  .resumen .sub{font-size:11px;color:rgba(255,255,255,.6);font-weight:500;margin-top:2px}

  /* ===== Tarjeta de salud (patrón reutilizable) ===== */
  :root{--cobr:#048782;--fact:#C99A2E;}
  .health{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
  .health .hh{display:flex;gap:22px;padding:20px 22px;flex-wrap:wrap;align-items:center}
  .ring{--p:0;--c:var(--t0);width:118px;height:118px;border-radius:50%;flex:none;
    background:conic-gradient(var(--c) calc(var(--p)*1%), var(--line) 0);display:grid;place-items:center;position:relative}
  .ring:before{content:"";position:absolute;inset:11px;background:var(--surface);border-radius:50%}
  .ring .in{position:relative;text-align:center;line-height:1}
  .ring .in b{font-size:34px;font-weight:800;letter-spacing:-1px}
  .ring .in span{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gris);margin-top:3px}
  .hstate{flex:1;min-width:220px}
  .hstate .lab{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal-med)}
  .hstate .big{font-size:22px;font-weight:800;margin:3px 0 4px}
  .hstate .big.g{color:var(--t0)}.hstate .big.y{color:var(--t3)}.hstate .big.r{color:var(--t6)}
  .hstate p{font-size:13px;color:var(--gris);line-height:1.5}
  .spark{flex:none;width:280px;max-width:100%}
  .spark .st{font-size:11px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:flex;justify-content:space-between}
  .spark .leg{font-size:11px;color:var(--gris);margin-top:5px;display:flex;gap:14px}
  .spark .leg i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:3px;margin-right:5px}
  .chartwrap{cursor:pointer;position:relative;border-radius:8px;transition:background .12s}
  .chartwrap:hover{background:#F6FBFA}
  .chartwrap .zoom{position:absolute;top:-1px;right:2px;font-size:10px;font-weight:800;color:var(--teal);opacity:.7}
  .chartwrap:hover .zoom{opacity:1}
  .spark .mticks{display:flex;justify-content:space-between;font-size:9.5px;color:var(--gris2);margin-top:3px;font-weight:600}
  .hmetrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-top:1px solid var(--line);background:#FAFDFC}
  .hm{padding:13px 18px;border-right:1px solid var(--line)}
  .hm:last-child{border-right:0}
  .hm .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:700}
  .hm .v{font-size:20px;font-weight:800;letter-spacing:-.5px;margin-top:3px}
  .hm .hsub{font-size:10.5px;color:var(--gris);margin-top:2px}
  .hm .bar{height:5px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
  .hm .bar i{display:block;height:100%;border-radius:3px}
  .hm.good .v{color:var(--t0)} .hm.mid .v{color:var(--t3)} .hm.bad .v{color:var(--t6)}
  /* modal gráfico */
  .scrim2{position:fixed;inset:0;background:rgba(6,65,62,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
  .scrim2.on{opacity:1;pointer-events:auto}
  .chartmodal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.98);opacity:0;pointer-events:none;transition:.2s;z-index:90;
    width:960px;max-width:96vw;max-height:92vh;background:var(--surface);border-radius:16px;box-shadow:0 20px 70px rgba(6,65,62,.3);display:flex;flex-direction:column;overflow:hidden}
  .chartmodal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .cm-head{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
  .cm-head h3{font-size:17px;font-weight:800}
  .cm-head .x{margin-left:auto;cursor:pointer;font-size:22px;color:var(--gris);line-height:1}
  .cm-bar{display:flex;align-items:center;gap:14px;padding:14px 22px 4px;flex-wrap:wrap}
  .segs{display:flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .segs button{font-family:inherit;font-size:12px;font-weight:700;padding:8px 12px;border:0;background:var(--surface);color:var(--gris);cursor:pointer}
  .segs button.on{background:var(--teal);color:#fff}
  .cm-legend{display:flex;gap:16px;font-size:12.5px;color:var(--gris);margin-left:auto}
  .cm-legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
  .cm-chart{position:relative;padding:8px 18px 6px}
  .cm-chart svg{width:100%;display:block}
  #cmTip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.55;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  #cmTip b{font-weight:700}
  .cm-note{padding:2px 22px 18px;font-size:12.5px;color:var(--gris)}.cm-note b{color:var(--ink)}

  .hint{background:var(--tregbg);border:1px solid #D6C9EE;color:#4A3488;border-radius:10px;padding:11px 14px;font-size:12.5px;line-height:1.5;margin-bottom:14px}
  .hint b{color:#3A2870}

  .toolbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
  .search input{border:0;background:none;outline:none;font-family:inherit;font-size:14px;width:100%;color:var(--ink)}
  .search svg{width:17px;height:17px;color:var(--gris2);flex-shrink:0}
  select,.mini-btn{font-family:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px;color:var(--ink);cursor:pointer;font-weight:500}
  .count-line{font-size:13px;color:var(--gris);margin-bottom:10px}
  .count-line b{color:var(--ink)}

  .tablecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .thead,.row{display:grid;grid-template-columns:2.2fr 1.2fr 1fr 1.15fr 1fr 88px;gap:12px;align-items:center;padding:11px 16px}
  .thead{background:#F0F6F5;border-bottom:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--gris);position:sticky;top:51px;z-index:10;border-radius:var(--radius) var(--radius) 0 0}
  .row{border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s}
  .row:hover{background:#F7FBFA}
  .row:last-child{border-bottom:0;border-radius:0 0 var(--radius) var(--radius)}
  .thead>div,.row>div{min-width:0}
  .cname{font-weight:700;font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cmeta{font-size:12px;color:var(--gris2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .com{color:var(--teal-deep);font-weight:600}.com-off{color:var(--coral)}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .gflag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--tregbg);color:var(--treg);white-space:nowrap}
  .plz{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:20px;background:var(--agua);color:var(--teal-deep);white-space:nowrap}
  .ctag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--t0bg);color:var(--t0);white-space:nowrap}
  .row.contactado{border-left:3px solid var(--t0);background:#F4FBF6}
  .row.contactado:hover{background:#ECF7F0}
  .bovtag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
  .bovtag.inc{background:var(--t6bg);color:var(--t6)} .bovtag.acu{background:var(--t1bg);color:var(--t1)}
  .bovbanner{background:var(--tregbg);border:1px solid #D6C9EE;color:#4A3488;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .bovbanner a{color:var(--teal);cursor:pointer;font-weight:700}
  .num{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
  .pbar{position:relative;height:7px;background:#E7ECEB;border-radius:4px;overflow:hidden;margin:5px 0 3px}
  .pbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--t0);transition:width .3s}
  .morac{display:inline-block;font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px;padding:2px 9px;border-radius:20px;white-space:nowrap}
  .muted{color:var(--gris2);font-size:12px;font-weight:400}
  .grismini{color:var(--treg);font-size:11.5px;font-weight:600}
  .actions{display:flex;gap:7px;justify-content:flex-end}
  .icobtn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--gris);text-decoration:none}
  .icobtn svg{width:17px;height:17px}
  .icobtn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
  .icobtn.wa[data-off]{background:#EFF1F1;border-color:var(--line);color:#C3CCCA;cursor:not-allowed}
  .icobtn.call{background:#EAF4F3;border-color:#CDE6E3;color:var(--teal-deep)}
  .icobtn:hover{border-color:var(--teal-med)}

  .loading,.empty{text-align:center;padding:70px 20px;color:var(--gris)}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .errbox{background:#FBE4E3;border:1px solid #F3B5B2;color:#8A2E2B;padding:16px;border-radius:12px;font-size:14px}

  /* Drawer */
  .scrim{position:fixed;inset:0;background:rgba(6,65,62,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:480px;max-width:94vw;background:var(--surface);z-index:50;box-shadow:-8px 0 40px rgba(6,65,62,.18);transform:translateX(100%);transition:transform .24s ease;display:flex;flex-direction:column}
  .drawer.on{transform:none}
  .dhead{padding:20px 22px;border-bottom:1px solid var(--line);background:var(--teal-deep);color:#fff}
  .dhead .x{float:right;cursor:pointer;opacity:.85;font-size:22px;line-height:1}
  .dhead h2{font-size:18px;font-weight:800;padding-right:24px;line-height:1.25}
  .dhead .deuda{margin-top:8px;font-size:24px;font-weight:800}
  .dhead .dsub{font-size:12.5px;color:var(--aqua);font-weight:600;margin-top:2px}
  .dhead .badges{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}
  .dbody{padding:20px 22px;overflow-y:auto;flex:1}
  .dsec{margin-bottom:22px}
  .dsec h4{font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--teal-med);margin-bottom:10px}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .kv .k{color:var(--gris)} .kv .v{font-weight:600;text-align:right}
  .fac{display:grid;grid-template-columns:1fr auto auto;gap:8px;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center}
  .fac .fv{color:var(--gris)} .fac .fr{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
  .odoo-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--teal);text-decoration:none;margin-top:2px}
  .odoo-link:hover{text-decoration:underline}
  .msgbox{width:100%;font-family:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:10px;padding:12px;min-height:120px;resize:vertical;color:var(--ink);line-height:1.5}
  .wa-send{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--wa);color:#fff;border:0;border-radius:10px;padding:13px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;text-decoration:none}
  .wa-send[data-off]{background:#EFF1F1;color:#B3BDBB;cursor:not-allowed}
  /* Botón editar + formulario de ficha */
  .editbtn{width:100%;margin-top:12px;background:#EAF4F3;border:1px solid #CDE6E3;color:var(--teal-deep);border-radius:9px;padding:10px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
  .editbtn:hover{background:#DCEEEC}
  .eform .fld{margin-bottom:13px}
  .eform label{display:block;font-size:12px;font-weight:600;color:var(--gris);margin-bottom:5px}

<script>
const RPC="https://yxotopoklgjowcudveoj.supabase.co/functions/v1/odoo-rpc";
const ODOO="https://drogueriaeyg.odoo.com";
const money=n=>"$"+Math.round(n||0).toLocaleString("es-AR");
const soloDig=s=>(s||"").replace(/\D/g,"");
function waNumber(m,p){for(const c of[m,p]){let d=soloDig(c);if(!d)continue;if(d.startsWith("00"))d=d.slice(2);if(d.startsWith("54"))d=d.slice(2);if(d.startsWith("9")&&d.length>=11)d=d.slice(1);d=d.replace(/^0/,"");if(d.length>10)d=d.replace(/^(\d{2,4})15(\d{6,8})$/,"$1$2");if(d.length>=10)return"549"+d;}return"";}
const telLink=(m,p)=>{let d=soloDig(m||p);if(d.length<6)return"";if(!d.startsWith("54"))d="54"+d.replace(/^0/,"");return"+"+d;};
const esc=s=>(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
// rpc con reintento (Odoo.sh a veces rechaza el pico de consultas concurrentes)
async function rpc(model,method,args,kwargs={}){
  let last;
  for(let i=0;i<3;i++){
    try{
      const r=await EYG.gate(()=>fetch(RPC,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model,method,args,kwargs})}));
      const j=await r.json();
      if(!j.ok)throw new Error(j.error||"Error Odoo");
      return j.result;
    }catch(e){ last=e; if(i<2) await new Promise(r=>setTimeout(r,600*(i+1))); }
  }
  throw last;
}

// Tramos de mora (por vencimiento vencido más viejo, sobre la deuda REAL)
const TRAMOS=[
  {k:"vencer", l:"Por vencer / al día", t:"t0", test:d=>d<=0},
  {k:"d1",     l:"1–20 días",   t:"t1", test:d=>d>0&&d<21},
  {k:"d21",    l:"+21 días",    t:"t2", test:d=>d>=21&&d<31},
  {k:"d30",    l:"+30 días",    t:"t3", test:d=>d>=31&&d<61},
  {k:"d60",    l:"+60 días",    t:"t4", test:d=>d>=61&&d<91},
  {k:"d90",    l:"+90 días",    t:"t5", test:d=>d>=91&&d<121},
  {k:"d120",   l:"+120 · incobrable?", t:"t6", test:d=>d>=121},
];
function tramoDe(d){ return TRAMOS.find(t=>t.test(d)) || TRAMOS[0]; }
const TRAMO_GRIS ={k:"gris",   l:"Falta certificado/OP", t:"treg"}; // ya pagó, falta imputar
const TRAMO_FAVOR={k:"afavor", l:"Saldo a favor",        t:"t1"};

// Rubro del cliente (vive en category_id / etiquetas de Odoo). Mismo criterio que el panel del comercial.
// RUBRO = campo Studio "Rubro" (selection) en la ficha del cliente. 7 valores fijos.
const RUBRO_FIELD="x_studio_selection_field_6ui_1j42g6fu9";
const RUBROS7=["FARMACIAS","INSTITUCIONES","DISTRIBUIDORAS","VETERINARIAS","EMPRESAS DE SALUD","DROGUERIAS","PERSONAL"];

// ===== Edición de ficha (mismo sistema que el panel de vendedores) =====
const IDT={cuit:4,dni:5,cuil:6};
const digits=soloDig;
function fmtDoc(raw,idtypeId){const d=digits(raw);if(!d)return"";if(idtypeId===IDT.dni){if(d.length<7||d.length>8)return raw.trim();return d.replace(/\B(?=(\d{3})+(?!\d))/g,".");}if(idtypeId===IDT.cuit||idtypeId===IDT.cuil){if(d.length!==11)return raw.trim();return d.slice(0,2)+"-"+d.slice(2,10)+"-"+d.slice(10);}return raw.trim();}
function fmtTel(raw){let d=digits(raw);if(!d)return"";if(d.startsWith("0054"))d=d.slice(4);if(d.startsWith("54"))d=d.slice(2);d=d.replace(/^0/,"");if(d.length>10)d=d.replace(/^(\d{2,4})15(\d{6,8})$/,"$1$2");if(d.length<8)return raw.trim();let area,local;if(d.length===10){if(d.startsWith("11")){area="11";local=d.slice(2);}else{area=d.slice(0,3);local=d.slice(3);}}else if(d.length===11){area=d.slice(0,4);local=d.slice(4);}else return"+54 "+d;const ls=local.length>=8?local.slice(0,4)+"-"+local.slice(4):local.slice(0,3)+"-"+local.slice(3);return"+54 "+area+" "+ls;}
function oracion(s){s=(s||"").trim().replace(/\s+/g," ");if(!s)return"";return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();}
const PFIELDS_COB=["id","name","company_type","is_company","phone","mobile","email","street","zip","city","state_id","vat","l10n_ar_afip_responsibility_type_id","l10n_latam_identification_type_id","category_id","user_id","property_payment_term_id","x_studio_selection_field_6ui_1j42g6fu9","commercial_partner_id","total_due","total_overdue"];
// Plazo de pago → badge corto: "30 días"→"30 d", "CONTADO"→"contado", etc.
function plazoCorto(term){ if(!term) return ""; const n=Array.isArray(term)?term[1]:term; if(/contado|inmediat/i.test(n)) return "contado"; const m=n.match(/(\d+)\s*d/i); if(m) return m[1]+" d"; return n.length>12?n.slice(0,11)+"…":n; }
let CAT={fiscal:[],idt:[],prov:[]};
function toast(msg){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";document.body.appendChild(t);}t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2600);}

const hoy=new Date(); hoy.setHours(0,0,0,0);
const hoyStr=hoy.toISOString().slice(0,10);
const diasMora=f=> f? Math.floor((hoy-new Date(f+"T00:00:00"))/86400000) : 0;
const fmtFecha=f=> f? f.split("-").reverse().join("/") : "—";

let CLI=[], EVO=[], BOVEDA={}, MIGARCH={}, DESEMP=null, filtro={tramo:"", comercial:"", rubro:"", q:"", orden:"prioridad", boveda:false, migrada:false};
const BOV_TAG="[BOVEDA]"; // marcador en el chatter del contacto (fuente de verdad, con historial)
const MIG_TAG="[MIG-ARCHIVADA]"; // deuda migrada archivada: sale de "lo adeudado" y del vencido (reversible)
const BLK_TAG="[BLOQUEO]";       // gestión de cuentas bloqueadas por deuda (sale_warn de Odoo) desde Cobranzas
let BLOQUEOS={blocked:[],temp:[]};  // {blocked:[cuentas con sale_warn=block], temp:[levantadas por un plazo]}
let CONTACTOS={};          // partnerId → fecha/hora (UTC) del último contacto de cobranzas
const CONTACTO_TAG="[COBRO-CONTACTO]";
let NOTAS={};              // partnerId → {texto, fecha} última nota/acuerdo de cobranza
const NOTA_TAG="[COBRO-NOTA]";
// Formatea fecha/hora del contacto (mensaje en UTC → hora local AR del navegador)
function fmtContacto(utc){ if(!utc) return null; const d=new Date(utc.replace(" ","T")+"Z"); const h0=new Date(); h0.setHours(0,0,0,0);
  const p=n=>String(n).padStart(2,"0"); const hora=p(d.getHours())+":"+p(d.getMinutes());
  return {esHoy:d>=h0, texto:(d>=h0?"hoy":p(d.getDate())+"/"+p(d.getMonth()+1))+" "+hora}; }

async function cargar(silent){
  try{
    // 1) TODA la cuenta corriente real: líneas del receivable sin conciliar, con saldo.
    //    Netea facturas (+), NC (−), recibos/pagos posteados sin imputar (−) y saldo inicial migración (+).
    const ml=await rpc("account.move.line","search_read",
      [[["account_id.account_type","=","asset_receivable"],["parent_state","=","posted"],["full_reconcile_id","=",false],["amount_residual","!=",0]]],
      {fields:["partner_id","move_name","move_type","date","date_maturity","amount_residual","balance"],limit:0});
    // 2) Pagos en BORRADOR (dinero recibido pero no asentado — retenciones a la espera del certificado/OP)
    const draft=await rpc("account.payment","search_read",
      [[["partner_type","=","customer"],["payment_type","=","inbound"],["state","=","draft"]]],
      {fields:["name","partner_id","amount","date"],limit:0});
    // 3) Evolución DÍA A DÍA: saldo de la cuenta corriente = suma acumulada del receivable por día
    const evoRaw=await rpc("account.move.line","read_group",
      [[["account_id.account_type","=","asset_receivable"],["parent_state","=","posted"]],["balance:sum"],["date:day"]],
      {lazy:false,orderby:"date asc"});
    EVO=[]; let acc=0;
    for(const g of evoRaw){
      const from=g.__range&&g.__range["date:day"]?g.__range["date:day"].from:null;
      acc+=g.balance||0;   // acumula desde el principio (aunque solo mostremos desde 2025-03)
      if(from && from>="2025-03-01") EVO.push({ymd:from, val:acc});
    }

    // --- Agregar por cliente ---
    const P={};
    for(const l of ml){
      if(!l.partner_id) continue;
      const id=l.partner_id[0];
      const r=l.amount_residual||0;
      if(Math.abs(r)<0.5) continue;
      const p=P[id]||(P[id]={id,nombre:l.partner_id[1],saldo:0,deudaFac:0,saldoIni:0,cobradoSinImp:0,ncSinAplicar:0,
                              baseBruto:0,vencidoGross:0,migSinFecha:0,minMig:null,minVencVenc:null,minVencAny:null,movs:[]});
      let tipo;
      if(l.move_type==="out_invoice") tipo="factura";
      else if(l.move_type==="out_refund") tipo="nc";
      else if(r<0) tipo="recibo";      // RE-X: cobro posteado sin imputar (gris)
      else tipo="inicial";             // saldo anterior / migración
      const venc=l.date_maturity||l.date||null;
      p.saldo+=r;
      if(tipo==="factura"||tipo==="nc") p.deudaFac+=r;
      else if(tipo==="recibo") p.cobradoSinImp+=(-r);
      else if(tipo==="inicial") p.saldoIni+=r;
      if(tipo==="nc") p.ncSinAplicar+=(-r);   // NC sin conciliar (crédito flotante) → conviene aplicarla a su factura en Odoo
      if(r>0){
        p.baseBruto+=(l.balance||r); // monto original de lo abierto (para la barra de % cobrado)
        if(venc && (!p.minVencAny||venc<p.minVencAny)) p.minVencAny=venc;
        // días de mora: SOLO facturas con fecha de vencimiento REAL pasada (la migración sin fecha no cuenta).
        if(l.date_maturity && l.date_maturity<hoyStr){ p.vencidoGross+=r; if(!p.minVencVenc||l.date_maturity<p.minVencVenc) p.minVencVenc=l.date_maturity; }
        // saldo de migración (impago sin fecha): cuenta como vencido igual (deuda vieja que no se pagó).
        if(!l.date_maturity){ p.migSinFecha+=r; const dm=l.date||null; if(dm && (!p.minMig||dm<p.minMig)) p.minMig=dm; }
      }
      p.movs.push({name:l.move_name,tipo,fecha:l.date,venc,r});
    }
    // Pagos en borrador por cliente
    const draftMap={}, DRAFT={};
    for(const d of draft){ if(!d.partner_id)continue; const id=d.partner_id[0];
      draftMap[id]=(draftMap[id]||0)+(d.amount||0); (DRAFT[id]=DRAFT[id]||[]).push(d); }

    // Deudores = tienen saldo real, dinero en gris, o saldo a favor
    const raw=Object.values(P).filter(p=>{
      const borrador=draftMap[p.id]||0;
      const deudaReal=p.saldo-borrador;
      const gris=p.cobradoSinImp+borrador;
      return deudaReal>1 || gris>1 || p.saldo<-1;
    });

    // Contactos
    const ids=raw.map(p=>p.id);
    const parts=ids.length?await rpc("res.partner","read",[ids],{fields:PFIELDS_COB,context:{lang:"es_AR"}}):[];
    const byId={}; parts.forEach(p=>byId[p.id]=p);
    // Rubro por ENTIDAD FISCAL: una sucursal (hijo) hereda el rubro de su central, no el suyo propio
    const comIds=[...new Set(parts.map(p=>p.commercial_partner_id?p.commercial_partner_id[0]:p.id))];
    const rubroByCom={};
    if(comIds.length){
      try{ (await rpc("res.partner","read",[comIds,[RUBRO_FIELD]],{context:{lang:"es_AR"}})).forEach(p=>rubroByCom[p.id]=p[RUBRO_FIELD]||""); }catch(e){}
    }
    // Marcadores del chatter (bóveda / contacto / nota) en UNA sola query en vez de 3.
    // Cada mail.message body-like es un full-scan de la tabla más grande de Odoo; con
    // res_id acotado por la cartera igual conviene un solo round-trip (Odoo Online tarda
    // ~2-4s por query). Traemos los 3 marcadores en OR y partimos en el cliente por cuál
    // marcador contiene el cuerpo. Ver [[eyg-odoo-carga-performance]].
    BOVEDA={}; CONTACTOS={}; NOTAS={}; MIGARCH={};
    if(ids.length){
      const msgs=await rpc("mail.message","search_read",
        [[["model","=","res.partner"],["res_id","in",ids],
          "|","|","|",["body","like","[BOVEDA]"],["body","like","[COBRO-CONTACTO]"],["body","like","[COBRO-NOTA]"],["body","like","[MIG-ARCHIVADA]"]]],
        {fields:["res_id","body","date"],limit:0});
      msgs.sort((a,b)=>(b.date||"").localeCompare(a.date||""));   // más nuevo primero
      const vbov=new Set(), vmig=new Set();
      for(const msg of msgs){
        const body=(msg.body||"").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ");
        if(body.includes("[MIG-ARCHIVADA]")){
          if(vmig.has(msg.res_id)) continue; vmig.add(msg.res_id);   // solo el último manda
          if(/salir/i.test(body)) continue;                          // se desarchivó
          MIGARCH[msg.res_id]=true;
        }else if(body.includes("[BOVEDA]")){
          if(vbov.has(msg.res_id)) continue; vbov.add(msg.res_id);   // solo el último [BOVEDA] manda
          if(/salir/i.test(body)) continue;                          // salió de la bóveda
          const tipo=/incobrable/i.test(body)?"incobrable":"acuerdo";
          const nota=(body.split("|").slice(1).join("|")||"").trim();
          BOVEDA[msg.res_id]={tipo,nota};
        }else if(body.includes("[COBRO-CONTACTO]")){
          if(!(msg.res_id in CONTACTOS)) CONTACTOS[msg.res_id]=msg.date;   // último contacto
        }else if(body.includes("[COBRO-NOTA]")){
          if(!(msg.res_id in NOTAS)){ const texto=(body.split("]").slice(1).join("]")||"").trim(); NOTAS[msg.res_id]={texto,fecha:msg.date}; }  // última nota
        }
      }
    }
    // Catálogos para el formulario de edición (dropdowns), 1 sola vez
    if(!CAT.prov.length){ try{
      const [fiscal,idt,prov]=await Promise.all([
        rpc("l10n_ar.afip.responsibility.type","search_read",[[]],{fields:["id","name"],context:{lang:"es_AR"}}),
        rpc("l10n_latam.identification.type","search_read",[[["active","=",true]]],{fields:["id","name"],context:{lang:"es_AR"}}),
        rpc("res.country.state","search_read",[[["country_id.code","=","AR"]]],{fields:["id","name"],limit:0})
      ]);
      CAT={fiscal,idt,prov};
    }catch(e){ console.warn("No se pudieron cargar catálogos de edición",e); } }

    CLI=raw.map(p=>{
      const c=byId[p.id]||{};
      const borrador=draftMap[p.id]||0;
      const saldoReal=p.saldo;
      const gris=p.cobradoSinImp+borrador;
      // DEUDA = campo NATIVO de Odoo (Adeudo total del reporte de seguimiento).
      // VENCIDO = atrasado real de Odoo (total_overdue, ya netea NC vencidas) + saldo de MIGRACIÓN sin fecha.
      // Criterio del usuario: la deuda de migración no pagada está vencida igual, aunque venga de otro sistema.
      const migVenc=p.migSinFecha||0;   // saldo inicial de migración
      const migArch=!!MIGARCH[p.id];    // si se archivó, sale de "lo adeudado" y del vencido (reversible)
      // DEUDA total = Adeudo total nativo de Odoo (netea NC ya en el total).
      const deudaReal=((typeof c.total_due==="number")?c.total_due:(saldoReal-borrador)) - (migArch?migVenc:0);
      // VENCIDO = facturas vencidas (bruto) + migración impaga. NO descuenta las NC ni los pagos sin imputar:
      // esas NC son crédito a favor que TODAVÍA no se aplicó a una factura → se muestran aparte, no ensucian el vencido.
      let vencidoReal = p.vencidoGross + (migArch?0:migVenc);
      vencidoReal=Math.min(vencidoReal, Math.max(0,deudaReal));

      let situacion, tramo, mora;
      if(saldoReal<-1){ situacion="afavor"; tramo=TRAMO_FAVOR; mora=0; }
      else if(deudaReal<=1){ situacion="cubierto"; tramo=TRAMO_GRIS; mora=0; }
      else {
        mora = vencidoReal>1 ? diasMora(p.minVencVenc) : 0;
        tramo = tramoDe(mora);
        situacion = mora>=121 ? "incobrable" : (vencidoReal>1 ? "vencido" : "porvencer");
      }
      const tieneGris=gris>1;
      // prioridad de gestión: plata vencida real que hay que ir a cobrar
      const prioridad = vencidoReal;
      // barra de % todavía adeudado sobre lo facturado abierto (bajo = hubo cobro parcial)
      const aCobrar=Math.max(0,deudaReal);
      const base=p.baseBruto; // monto original de facturas + saldo inicial abiertos
      const pctDebe = base>1 ? Math.max(0,Math.min(1, aCobrar/base)) : (aCobrar>1?1:0);

      return {
        id:p.id, nombre:p.nombre, movs:p.movs,
        saldoReal, deudaReal, deudaFac:p.deudaFac, saldoIni:p.saldoIni, base, pctDebe,
        cobradoSinImp:p.cobradoSinImp, borrador, gris, vencidoReal, migVenc, migArch, minMig:p.minMig, ncSinAplicar:p.ncSinAplicar, mora, tramo, situacion, tieneGris, prioridad,
        venc:p.minVencVenc||p.minVencAny, nfac:p.movs.filter(m=>m.tipo==="factura"&&m.r>0).length,
        drafts:DRAFT[p.id]||[],
        wa:waNumber(c.mobile,c.phone), tellink:telLink(c.mobile,c.phone),
        telv:(c.mobile||c.phone||""), email:c.email||"", ciudad:c.city||"",
        comercial:c.user_id?c.user_id[1]:"Sin asignar",
        rubro:(rubroByCom[c.commercial_partner_id?c.commercial_partner_id[0]:c.id]||c[RUBRO_FIELD]||""), part:c,
        plazo:plazoCorto(c.property_payment_term_id), plazoFull:c.property_payment_term_id?c.property_payment_term_id[1]:"",
        boveda:BOVEDA[p.id]||null,
        contactado:CONTACTOS[p.id]||null,
        nota:NOTAS[p.id]||null
      };
    });
    try{ await cargarBloqueos(); }catch(e){ console.warn("No pude cargar bloqueos", e); }
    const _sy = silent ? window.scrollY : 0;
    render();
    if(silent) window.scrollTo(0, _sy);
    if(!silent) cargarDesempeno();
  }catch(e){
    if(silent){ console.warn("Refresco falló, mantengo la vista actual", e); return; }
    document.getElementById("app").innerHTML='<div class="errbox"><b>No pude calcular la deuda.</b><br>'+esc(e.message||e)+'</div>';
  }
}

function visibles(){
  return CLI.filter(c=>{
    if(filtro.boveda){ if(!c.boveda) return false; return !filtro.q || c.nombre.toLowerCase().includes(filtro.q.toLowerCase()); }
    if(filtro.migrada){ if(!(c.migVenc>1)) return false; return !filtro.q || c.nombre.toLowerCase().includes(filtro.q.toLowerCase()); }
    if(c.boveda) return false;   // los de bóveda no aparecen en la vista principal
    if(filtro.tramo==='gris'){ if(!c.tieneGris) return false; }
    else if(filtro.tramo==='cubierto'){ if(c.situacion!=='cubierto') return false; }
    else if(filtro.tramo && c.tramo.k!==filtro.tramo) return false;
    if(filtro.comercial && c.comercial!==filtro.comercial) return false;
    if(filtro.rubro && c.rubro!==filtro.rubro) return false;
    if(filtro.q){const q=filtro.q.toLowerCase(); if(!c.nombre.toLowerCase().includes(q)) return false;}
    return true;
  });
}
function ordenar(l){
  const a=[...l];
  if(filtro.orden==="prioridad") a.sort((x,y)=> y.prioridad-x.prioridad || y.deudaReal-x.deudaReal);
  else if(filtro.orden==="deuda") a.sort((x,y)=>y.deudaReal-x.deudaReal);
  else if(filtro.orden==="mora") a.sort((x,y)=>y.mora-x.mora);
  else if(filtro.orden==="gris") a.sort((x,y)=>y.gris-x.gris);
  else a.sort((x,y)=>x.nombre.localeCompare(y.nombre));
  return a;
}

const MESAB=["","ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fmtM=v=> Math.abs(v)>=1e6 ? "$"+(v/1e6).toFixed(0)+"M" : Math.abs(v)>=1e3 ? "$"+(v/1e3).toFixed(0)+"k" : "$"+Math.round(v);
function evoSVG(){

  const W=1000,H=210,pl=54,pr=14,pt=16,pb=26;
  const maxV=Math.max(...EVO.map(p=>p.val),0);
  const niceMax=Math.ceil(maxV/1e8)*1e8||1e8;
  const n=EVO.length;
  const X=i=> pl + i*(W-pl-pr)/(n-1);
  const Y=v=> H-pb - (v/niceMax)*(H-pt-pb);
  let grid=""; const gl=4;
  for(let i=0;i<=gl;i++){ const v=niceMax*i/gl, y=Y(v);
    grid+=`<line x1="${pl}" y1="${y.toFixed(1)}" x2="${W-pr}" y2="${y.toFixed(1)}" stroke="#E7F0EE" stroke-width="1"/>`
        +`<text x="${pl-8}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="12" fill="#8A9A97">${fmtM(v)}</text>`;
  }
  let dLine=""; EVO.forEach((p,i)=>{ dLine+=(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.val).toFixed(1)+" "; });
  const dArea=dLine+`L ${X(n-1).toFixed(1)} ${Y(0).toFixed(1)} L ${X(0).toFixed(1)} ${Y(0).toFixed(1)} Z`;
  let dots="",xlab=""; const step=Math.max(1,Math.ceil(n/7));
  EVO.forEach((p,i)=>{ const x=X(i),y=Y(p.val),last=i===n-1,[yy,mm]=p.ymd.split("-");
    if(last) dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="#04635F"/>`;
    if(i%step===0||last) xlab+=`<text x="${x.toFixed(1)}" y="${H-8}" text-anchor="${last?'end':'middle'}" font-size="12" fill="#8A9A97">${MESAB[+mm]} '${yy.slice(2)}</text>`;
  });
  const n1=EVO[n-1],lx=X(n-1),ly=Y(n1.val);
  const lbl=`<text x="${(lx-6).toFixed(1)}" y="${(ly-10).toFixed(1)}" text-anchor="end" font-size="14" font-weight="800" fill="#04635F">${money(n1.val)}</text>`;
  // puntos para el tooltip interactivo (fecha + monto al pasar el mouse)
  EVOCHART={ W, H, pts: EVO.map((p,i)=>({x:+X(i).toFixed(1), y:+Y(p.val).toFixed(1), val:p.val, label:fmtFecha(p.ymd)})) };
  return `<svg class="evosvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de la deuda">
    <defs><linearGradient id="evg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0AA89F" stop-opacity=".26"/><stop offset="1" stop-color="#0AA89F" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${dArea}" fill="url(#evg)"/>
    <path d="${dLine}" fill="none" stroke="#048782" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${lbl}${xlab}
    <line id="evoxh" x1="0" y1="${pt}" x2="0" y2="${H-pb}" stroke="#04635F" stroke-width="1" stroke-dasharray="3 3" opacity="0" pointer-events="none"/>
    <circle id="evodot" r="5" fill="#EC8B5E" stroke="#fff" stroke-width="1.5" opacity="0" pointer-events="none"/></svg>`;
}
let EVOCHART=null;
function evoHover(e){
  if(!EVOCHART) return;
  const svg=e.currentTarget.querySelector(".evosvg"); if(!svg) return;
  const r=svg.getBoundingClientRect(); if(!r.width) return;
  const sx=(e.clientX-r.left)/r.width*EVOCHART.W;
  let best=EVOCHART.pts[0];
  for(const p of EVOCHART.pts) if(Math.abs(p.x-sx)<Math.abs(best.x-sx)) best=p;
  const xh=document.getElementById("evoxh"), dot=document.getElementById("evodot"), tip=document.getElementById("evotip");
  if(xh){ xh.setAttribute("x1",best.x); xh.setAttribute("x2",best.x); xh.setAttribute("opacity","1"); }
  if(dot){ dot.setAttribute("cx",best.x); dot.setAttribute("cy",best.y); dot.setAttribute("opacity","1"); }
  if(tip){ tip.innerHTML=`<b>${best.label}</b> · ${money(best.val)}`;
    tip.style.left=Math.max(40, Math.min(best.x/EVOCHART.W*r.width, r.width-40))+"px";
    tip.style.top=(best.y/EVOCHART.H*r.height)+"px"; tip.style.opacity="1"; }
}
function evoHoverOut(){
  ["evoxh","evodot"].forEach(id=>{const el=document.getElementById(id); if(el) el.setAttribute("opacity","0");});
  const tip=document.getElementById("evotip"); if(tip) tip.style.opacity="0";
}

function hace(d){const x=new Date(hoy);x.setDate(x.getDate()-d);return x.toISOString().slice(0,10);}
function monthsRange(a,b){const [sy,sm]=a.split("-").map(Number);const [ey,em]=b.split("-").map(Number);const out=[];let y=sy,m=sm;while(y<ey||(y===ey&&m<=em)){out.push(y+"-"+String(m).padStart(2,"0"));if(++m>12){m=1;y++;}}return out;}
const rangeFrom=g=>{const k=Object.keys(g.__range||{})[0];return k?g.__range[k].from:null;};

async function cargarDesempeno(){
  try{
    const desde="2025-03-01", d7=hace(7), d30=hace(30);
    const [pagM,facM,ncM,pagos30,gest]=await Promise.all([
      // COBRADO REAL: pagos de clientes posteados, por fecha de pago, SIN transferencias internas (ni conciliaciones, que no son pagos)
      rpc("account.payment","read_group",[[["partner_type","=","customer"],["payment_type","=","inbound"],["state","=","posted"],["is_internal_transfer","=",false],["date",">=",desde]],["amount:sum"],["date:month"]],{lazy:false,orderby:"date asc"}),
      rpc("account.move","read_group",[[["move_type","=","out_invoice"],["state","=","posted"],["invoice_date",">=",desde]],["amount_total:sum"],["invoice_date:month"]],{lazy:false,orderby:"invoice_date asc"}),
      rpc("account.move","read_group",[[["move_type","=","out_refund"],["state","=","posted"],["invoice_date",">=",desde]],["amount_total:sum"],["invoice_date:month"]],{lazy:false,orderby:"invoice_date asc"}),
      rpc("account.payment","search_read",[[["partner_type","=","customer"],["payment_type","=","inbound"],["state","=","posted"],["is_internal_transfer","=",false],["date",">=",d30]]],{fields:["partner_id","amount","date"],limit:0}),
      // Gestiones de cobranza = marcador [COBRO-CONTACTO] que ya deja el panel al contactar
      rpc("mail.message","search_read",[[["model","=","res.partner"],["body","like","[COBRO-CONTACTO]"],["date",">=",d30+" 00:00:00"]]],{fields:["res_id","date"],limit:0})
    ]);
    const mCob={},mFac={},mNc={};
    pagM.forEach(g=>{const f=rangeFrom(g);if(f)mCob[f.slice(0,7)]=g.amount||0;});
    facM.forEach(g=>{const f=rangeFrom(g);if(f)mFac[f.slice(0,7)]=g.amount_total||0;});
    ncM.forEach(g=>{const f=rangeFrom(g);if(f)mNc[f.slice(0,7)]=g.amount_total||0;});
    const curYM=hoyStr.slice(0,7);
    const series=monthsRange("2025-03",curYM).map(ym=>({ym,cob:mCob[ym]||0,facN:(mFac[ym]||0)-(mNc[ym]||0)}));
    const cur=series[series.length-1]||{cob:0,facN:0}, prev=series[series.length-2]||{cob:0,facN:0};
    const last3=series.slice(Math.max(0,series.length-4),series.length-1);
    const c3=last3.reduce((s,x)=>s+x.cob,0), f3=last3.reduce((s,x)=>s+x.facN,0);
    const cobradoSemana=pagos30.filter(p=>p.date>=d7).reduce((s,p)=>s+(p.amount||0),0);
    const deuda=CLI.filter(c=>!c.boveda).reduce((s,c)=>s+Math.max(0,c.deudaReal),0);
    // Conversión de gestión: de los clientes gestionados, cuántos pagaron DESPUÉS de la gestión
    const pagByP={}; pagos30.forEach(p=>{if(!p.partner_id)return;const id=p.partner_id[0];(pagByP[id]=pagByP[id]||[]).push(p);});
    const gestFirst={}; gest.forEach(m=>{const id=m.res_id,d=(m.date||"").slice(0,10);if(!id||!d)return;if(!gestFirst[id]||d<gestFirst[id])gestFirst[id]=d;});
    const gestP=Object.keys(gestFirst); let paidN=0,cobradoGest=0;
    gestP.forEach(id=>{const g=gestFirst[id];const ps=(pagByP[id]||[]).filter(x=>x.date>=g);if(ps.length){paidN++;cobradoGest+=ps.reduce((s,x)=>s+(x.amount||0),0);}});
    DESEMP={
      series12:series.slice(-12), cobradoMes:cur.cob, cobradoMesPrev:prev.cob, cobradoSemana,
      cov3: f3>0?c3/f3:0, covMesPrev: prev.facN>0?prev.cob/prev.facN:0,
      dso: prev.facN>0? deuda/prev.facN*30 : 0,
      conv:{gest:gestP.length, paid:paidN, cobrado:cobradoGest, total:gest.length}
    };
    render();
  }catch(e){ DESEMP={error:e.message||String(e)}; render(); }
}

function barChartCF(S){
  if(!S||!S.length) return "";
  const W=1000,H=200,pl=54,pr=12,pt=14,pb=26;
  const maxV=Math.max(...S.map(s=>Math.max(s.cob,s.facN)),1);
  const niceMax=Math.ceil(maxV/1e8)*1e8||1e8, n=S.length;
  const bw=(W-pl-pr)/n, gap=bw*0.16, barw=(bw-gap*3)/2;
  const Y=v=>H-pb-(v/niceMax)*(H-pt-pb);
  let grid=""; for(let i=0;i<=3;i++){const v=niceMax*i/3,y=Y(v);
    grid+=`<line x1="${pl}" y1="${y.toFixed(1)}" x2="${W-pr}" y2="${y.toFixed(1)}" stroke="#E7F0EE"/>`
        +`<text x="${pl-8}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#8A9A97">${fmtM(v)}</text>`;}
  let bars="",xlab=""; const step=Math.max(1,Math.ceil(n/8));
  S.forEach((s,i)=>{const x0=pl+i*bw+gap, xf=x0, xc=x0+barw+gap, yf=Y(s.facN), yc=Y(s.cob);
    bars+=`<rect x="${xf.toFixed(1)}" y="${yf.toFixed(1)}" width="${barw.toFixed(1)}" height="${(H-pb-yf).toFixed(1)}" rx="2" fill="#C9D8D5"><title>Facturado neto ${money(s.facN)}</title></rect>`
        +`<rect x="${xc.toFixed(1)}" y="${yc.toFixed(1)}" width="${barw.toFixed(1)}" height="${(H-pb-yc).toFixed(1)}" rx="2" fill="#048782"><title>Cobrado ${money(s.cob)}</title></rect>`;
    const [yy,mm]=s.ym.split("-");
    if(i%step===0||i===n-1) xlab+=`<text x="${(x0+barw+gap/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#8A9A97">${MESAB[+mm]} '${yy.slice(2)}</text>`;
  });
  return `<svg class="evosvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cobrado vs Facturado">${grid}${bars}${xlab}</svg>`;
}

  const D=DESEMP, cov=D.cov3;

/* ===================== Tarjeta de salud de cobranza ===================== */
const MESES_ES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const pad2=n=>String(n).padStart(2,"0");
function saludCob(A){
  const venc=A.totalReal>0?A.totalVenc/A.totalReal:0;
  const inc=A.totalReal>0?A.incobM/A.totalReal:0;
  const dso=(DESEMP&&!DESEMP.error)?DESEMP.dso:null;
  const cov=(DESEMP&&!DESEMP.error)?DESEMP.cov3:null;
  let score=100;
  score-=Math.min(35,venc*100*0.6);
  score-=Math.min(25,inc*100*1.2);
  if(dso!=null) score-=Math.min(20,Math.max(0,dso-30)*0.5);
  if(cov!=null) score-=Math.min(20,Math.max(0,1-cov)*100*0.7);
  score=Math.max(0,Math.min(100,Math.round(score)));
  const st=score>=80?["g","Sana","Se cobra a buen ritmo y la mora está contenida."]
    :score>=60?["y","Con atención","Hay plata vencida o la cobranza no sigue el ritmo de la facturación."]
    :["r","Crítica","La deuda crece o hay mucho vencido. Priorizá la gestión de cobro."];
  return {score,st,venc,inc,dso,cov};
}
function sparkCobSVG(){
  const S=(DESEMP&&DESEMP.series12)||[];
  if(S.length<2) return `<div style="height:58px;display:flex;align-items:center;justify-content:center;color:var(--gris2);font-size:12px">calculando…</div>`;
  const W=280,H=58,pad=4,n=S.length;
  const mx=Math.max(1,...S.map(s=>Math.max(s.cob,s.facN)));
  const X=i=>pad+(n===1?(W-2*pad)/2:i*(W-2*pad)/(n-1));
  const Y=v=>H-pad-v/mx*(H-2*pad);
  const pts=f=>S.map((s,i)=>`${X(i).toFixed(1)},${Y(f(s)).toFixed(1)}`).join(" ");
  const grid=S.map((s,i)=>`<line x1="${X(i).toFixed(1)}" y1="3" x2="${X(i).toFixed(1)}" y2="${H-3}" stroke="var(--line)" stroke-width="1" opacity=".55"/>`).join("");
  const area=`${X(0).toFixed(1)},${(H-pad).toFixed(1)} ${pts(s=>s.cob)} ${X(n-1).toFixed(1)},${(H-pad).toFixed(1)}`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">
    ${grid}<polygon points="${area}" fill="var(--cobr)" opacity=".08"/>
    <polyline fill="none" stroke="var(--fact)" stroke-width="2" points="${pts(s=>s.facN)}"/>
    <polyline fill="none" stroke="var(--cobr)" stroke-width="2.2" points="${pts(s=>s.cob)}"/>
  </svg>`;
}
function monthTicksCob(){
  const S=(DESEMP&&DESEMP.series12)||[]; if(S.length<2) return "";
  const lab=ym=>{const [y,m]=ym.split("-");return MESES_ES[+m-1]+"'"+y.slice(2);};
  const idx=[...new Set([0,Math.floor(S.length/3),Math.floor(2*S.length/3),S.length-1])];
  return idx.map(i=>`<span>${lab(S[i].ym)}</span>`).join("");
}

      ${hm("+120 · incobrable?", A.incobN+" · "+fmtM(A.incobM), "sobre la deuda: "+incPct.toFixed(0)+"%", incPct<3?"good":incPct<8?"mid":"bad", incPct*4, "var(--t6)")}

let DIARIO=null, GRAF={gran:"mes",data:null,geom:null};
async function fetchDiarioCob(){
  if(DIARIO) return DIARIO;
  const ini=new Date(hoy.getFullYear(),hoy.getMonth()-24,1).toISOString().slice(0,10);
  const [inv,ref,pay]=await Promise.all([
    rpc("account.move","read_group",[[["move_type","=","out_invoice"],["state","=","posted"],["invoice_date",">=",ini]],["amount_total:sum"],["invoice_date:day"]],{lazy:false,limit:3000}),
    rpc("account.move","read_group",[[["move_type","=","out_refund"],["state","=","posted"],["invoice_date",">=",ini]],["amount_total:sum"],["invoice_date:day"]],{lazy:false,limit:3000}),
    rpc("account.payment","read_group",[[["partner_type","=","customer"],["payment_type","=","inbound"],["state","=","posted"],["is_internal_transfer","=",false],["date",">=",ini]],["amount:sum"],["date:day"]],{lazy:false,limit:3000}),
  ]);
  const kd=(g,fld)=>{const rk=g.__range&&g.__range[fld+":day"];return rk?rk.from.slice(0,10):null;};
  const F={},C={}; let min=hoyStr;
  for(const g of inv){const k=kd(g,"invoice_date");if(k){F[k]=(F[k]||0)+(g.amount_total||0);if(k<min)min=k;}}
  for(const g of ref){const k=kd(g,"invoice_date");if(k)F[k]=(F[k]||0)-(g.amount_total||0);}
  for(const g of pay){const k=kd(g,"date");if(k){C[k]=(C[k]||0)+(g.amount||0);if(k<min)min=k;}}
  DIARIO={F,C,min};
  return DIARIO;
}
function aggregar(gran){
  const {F,C,min}=DIARIO;
  const start=new Date(min+"T00:00:00"), end=new Date(hoy), out=[];
  if(gran==="dia"){
    for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const k=`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
      out.push({lab:`${pad2(d.getDate())}/${pad2(d.getMonth()+1)}`,sub:`${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`,f:F[k]||0,c:C[k]||0});}
  } else if(gran==="semana"){
    const b={},lunes=dt=>{const x=new Date(dt);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);x.setHours(0,0,0,0);return x;};
    for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const k=`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;const mk=lunes(d),kk=`${mk.getFullYear()}-${pad2(mk.getMonth()+1)}-${pad2(mk.getDate())}`;const o=b[kk]||(b[kk]={mk,f:0,c:0});o.f+=F[k]||0;o.c+=C[k]||0;}
    Object.values(b).sort((a,b)=>a.mk-b.mk).forEach(o=>out.push({lab:`${pad2(o.mk.getDate())}/${pad2(o.mk.getMonth()+1)}`,sub:`semana del ${pad2(o.mk.getDate())}/${pad2(o.mk.getMonth()+1)}/${o.mk.getFullYear()}`,f:o.f,c:o.c}));
  } else {
    const b={};
    for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const k=`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;const mk=`${d.getFullYear()}-${pad2(d.getMonth()+1)}`;const o=b[mk]||(b[mk]={y:d.getFullYear(),m:d.getMonth(),f:0,c:0});o.f+=F[k]||0;o.c+=C[k]||0;}
    Object.keys(b).sort().forEach(mk=>{const o=b[mk];out.push({lab:`${MESES_ES[o.m]}'${String(o.y).slice(2)}`,sub:`${MESES_ES[o.m]} ${o.y}`,f:o.f,c:o.c});});
  }
  return out;
}
function chartSVG(data){
  const W=960,H=360,padL=64,padR=18,padT=18,padB=44;
  const n=data.length||1, plotW=W-padL-padR, plotH=H-padT-padB;
  const mx=Math.max(1,...data.map(d=>Math.max(d.f,d.c)));
  const X=i=>padL+(n===1?plotW/2:i*plotW/(n-1));
  const Y=v=>padT+plotH-v/mx*plotH;
  let grid="",ylab=""; const GL=4;
  for(let g=0;g<=GL;g++){const yy=(padT+plotH-g/GL*plotH).toFixed(1),val=mx*g/GL;
    grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`;
    ylab+=`<text x="${padL-8}" y="${(+yy+4)}" text-anchor="end" font-size="11" fill="var(--gris2)">${fmtM(val)}</text>`;}
  const step=Math.max(1,Math.ceil(n/11)); let xlab="";
  for(let i=0;i<n;i+=step) xlab+=`<text x="${X(i).toFixed(1)}" y="${H-padB+18}" text-anchor="middle" font-size="10.5" fill="var(--gris2)">${data[i].lab}</text>`;
  const line=(f,col,w)=>`<polyline fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" points="${data.map((d,i)=>X(i).toFixed(1)+","+Y(f(d)).toFixed(1)).join(" ")}"/>`;
  const area=`${X(0).toFixed(1)},${(padT+plotH).toFixed(1)} ${data.map((d,i)=>X(i).toFixed(1)+","+Y(d.c).toFixed(1)).join(" ")} ${X(n-1).toFixed(1)},${(padT+plotH).toFixed(1)}`;
  GRAF.geom={W,H,padL,padR,padT,padB,plotW,plotH,mx,n};
  return `<svg id="cmSvg" viewBox="0 0 ${W} ${H}">${grid}${ylab}${xlab}
    <polygon points="${area}" fill="var(--cobr)" opacity=".08"/>
    ${line(d=>d.f,"var(--fact)",2)}
    ${line(d=>d.c,"var(--cobr)",2.4)}
    <line id="cmGuide" x1="0" y1="${padT}" x2="0" y2="${padT+plotH}" stroke="var(--gris2)" stroke-width="1" stroke-dasharray="4 3" opacity="0"/>
    <circle id="cmDotF" r="4" fill="var(--fact)" opacity="0"/>
    <circle id="cmDotC" r="4.5" fill="var(--cobr)" opacity="0"/>
    <rect id="cmHit" x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="transparent"/>
  </svg>`;
}

/* ===== Gestión de cuentas BLOQUEADAS por deuda (sale_warn de Odoo, manejado por Cobranzas) ===== */
const _BLKFIELDS=["id","name","sale_warn_msg","total_due","total_overdue","user_id","city","phone","mobile"];
async function cargarBloqueos(){
  const hoy=hoyStr.slice(0,10);
  let blocked=await rpc("res.partner","search_read",[[["sale_warn","=","block"]],_BLKFIELDS],{context:{lang:"es_AR"},limit:0});
  // historial [BLOQUEO] → estado temporal + re-bloqueo de vencidos
  const msgs=await rpc("mail.message","search_read",[[["model","=","res.partner"],["body","like","[BLOQUEO]"]]],{fields:["res_id","body","date"],limit:0});
  msgs.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const ult={};
  for(const m of msgs){ if(ult[m.res_id]) continue;
    const body=(m.body||"").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ");
    const hasta=(body.match(/hasta=(\d{4}-\d{2}-\d{2})/)||[])[1]||null;
    const tipo=/temporal/i.test(body)?"temporal":(/baja/i.test(body)?"baja":(/bloque/i.test(body)?"bloqueo":"otro"));
    const nota=(body.split("|").slice(1).join("|")||"").trim();
    ult[m.res_id]={tipo,hasta,nota};
  }
  const blockedIds=new Set(blocked.map(p=>p.id));
  // temporales: último marcador "temporal", NO bloqueadas hoy. Si venció → re-bloquear solo.
  const reblock=[], temp=[];
  for(const rid in ult){ const u=ult[rid], id=+rid;
    if(u.tipo==="temporal" && !blockedIds.has(id)){
      if(u.hasta && u.hasta<hoy) reblock.push({id,hasta:u.hasta}); else temp.push({id,hasta:u.hasta,nota:u.nota});
    }
  }
  for(const rb of reblock){ try{
      await rpc("res.partner","write",[[rb.id],{sale_warn:"block"}]);
      await rpc("res.partner","message_post",[[rb.id]],{body:`🔒 ${BLK_TAG} bloqueado | re-bloqueo automático: venció el permiso temporal (${rb.hasta})`,message_type:"comment"});
    }catch(e){ console.warn("no pude re-bloquear",rb.id,e); } }
  if(reblock.length){ try{ blocked=await rpc("res.partner","search_read",[[["sale_warn","=","block"]],_BLKFIELDS],{context:{lang:"es_AR"},limit:0}); }catch(e){} }
  // info de las que siguen con permiso temporal
  const stillTemp=temp.filter(t=>!reblock.find(r=>r.id===t.id));
  let tempInfo=[];
  if(stillTemp.length){ try{
    const ti=await rpc("res.partner","read",[stillTemp.map(t=>t.id),["id","name","total_due","total_overdue","user_id"]],{context:{lang:"es_AR"}});
    const byId={}; ti.forEach(p=>byId[p.id]=p);
    tempInfo=stillTemp.map(t=>Object.assign({id:t.id,name:"?"},byId[t.id]||{},{hasta:t.hasta,nota:t.nota}));
  }catch(e){} }
  blocked=blocked.map(p=>Object.assign({},p,{nota:(ult[p.id]&&ult[p.id].nota)||""}));
  BLOQUEOS={blocked,temp:tempInfo};
  const bset=new Set(blocked.map(p=>p.id)); const tset=new Set(tempInfo.map(p=>p.id));
  CLI.forEach(c=>{ c.bloqueado=bset.has(c.id); c.permisoTemp=tset.has(c.id); });
}

async function guardarContacto(id){
  const btn=document.getElementById("btnSave"); if(!btn) return;
  btn.disabled=true; btn.textContent="Guardando…";
  const val=x=>{const el=document.getElementById(x);return el?el.value.trim():"";};
  const num=x=>{const v=val(x);return v?parseInt(v,10):false;};
  const idtype=num("f_idtype");
  const vals={
    company_type:val("f_type"), name:val("f_name"),
    phone: val("f_phone")?fmtTel(val("f_phone")):false, mobile:false,
    email: val("f_email")||false, street: val("f_street")?oracion(val("f_street")):false,
    zip: val("f_zip")||false, city: val("f_city")?oracion(val("f_city")):false,
    state_id: num("f_state"), l10n_latam_identification_type_id: idtype,
    vat: val("f_vat")?fmtDoc(val("f_vat"),idtype):false,
    l10n_ar_afip_responsibility_type_id: num("f_fiscal")
  };
  vals[RUBRO_FIELD]=val("f_rubro")||false;
  if(!vals.name){ btn.disabled=false; btn.textContent="Guardar y sincronizar con Odoo"; toast("⚠ Falta el nombre"); return; }
  try{
    await rpc("res.partner","write",[[id],vals],{context:{lang:"es_AR"}});
    const fresh=(await rpc("res.partner","read",[[id]],{fields:PFIELDS_COB,context:{lang:"es_AR"}}))[0];
    const c=CLI.find(x=>x.id===id);
    if(c && fresh){
      c.part=fresh; c.nombre=fresh.name||c.nombre;
      c.telv=fresh.mobile||fresh.phone||""; c.email=fresh.email||""; c.ciudad=fresh.city||"";
      c.wa=waNumber(fresh.mobile,fresh.phone); c.tellink=telLink(fresh.mobile,fresh.phone);
      c.comercial=fresh.user_id?fresh.user_id[1]:"Sin asignar"; c.rubro=fresh[RUBRO_FIELD]||"";
    }
    toast("✅ Datos guardados y sincronizados con Odoo");
    render(); abrir(id);
  }catch(e){
    btn.disabled=false; btn.textContent="Guardar y sincronizar con Odoo";
    toast("⚠ No se pudo guardar: "+(e.message||e));
  }
}

// ---- Resumen diario (texto listo para pegar en el grupo de WhatsApp del equipo) ----
function textoResumen(){
  const hoyStrL=hoy.toLocaleDateString("es-AR",{day:"2-digit",month:"long",year:"numeric"});
  const base = filtro.comercial ? CLI.filter(c=>c.comercial===filtro.comercial) : CLI;
  const real=base.reduce((s,c)=>s+Math.max(0,c.deudaReal),0);
  const vencido=base.reduce((s,c)=>s+c.vencidoReal,0);
  // prioridad de cobro: mayor plata vencida real, excluyendo los que son puro gris
  const cobrar=base.filter(c=>c.vencidoReal>1).sort((a,b)=>b.vencidoReal-a.vencidoReal);
  const incob=base.filter(c=>c.situacion==="incobrable").sort((a,b)=>b.deudaReal-a.deudaReal);
  const incobM=incob.reduce((s,c)=>s+Math.max(0,c.deudaReal),0);
  const gris=base.filter(c=>c.tieneGris).sort((a,b)=>b.gris-a.gris);
  const grisM=gris.reduce((s,c)=>s+c.gris,0);
  const umbrales=[21,31,61,91,121];
  const porCruzar=base.filter(c=>c.vencidoReal>1&&umbrales.some(u=>c.mora>=u-3&&c.mora<u)).sort((a,b)=>b.deudaReal-a.deudaReal);
  let t=`🏥 *Droguería EyG · Cobranzas ${hoyStrL}*${filtro.comercial?`\n👤 Comercial: ${filtro.comercial}`:``}\n\n`;
  t+=`💰 Deuda real a cobrar: ${money(real)}\n⏰ Vencida (con mora): ${money(vencido)}\n👥 Clientes con saldo: ${base.length}\n\n`;
  t+=`🎯 *Prioridad de cobro (vencido): top ${Math.min(8,cobrar.length)}*\n`;
  cobrar.slice(0,8).forEach(c=>t+=`• ${c.nombre} — ${money(c.vencidoReal)} vencido (${c.mora}d)${c.tieneGris?` [📄 ${money(c.gris)} en gris]`:''}\n`);
  t+=`\n📄 *Falta certificado/OP: ${gris.length} · ${money(grisM)} en gris*\n`;
  gris.slice(0,8).forEach(c=>t+=`• ${c.nombre} — ${money(c.gris)} recibido${c.deudaReal>1?`, queda ${money(Math.max(0,c.deudaReal))} a cobrar`:` (cuenta al día)`}\n`);
  if(gris.length>8) t+=`…y ${gris.length-8} más\n`;
  t+=`\n🔴 *Incobrables (+120 días): ${incob.length} · ${money(incobM)}*\n`;
  incob.slice(0,6).forEach(c=>t+=`• ${c.nombre} — ${money(Math.max(0,c.deudaReal))} (${c.mora}d)\n`);
  if(incob.length>6) t+=`…y ${incob.length-6} más\n`;
  if(porCruzar.length){
    t+=`\n⚠️ *Por cruzar umbral esta semana: ${porCruzar.length}*\n`;
    porCruzar.slice(0,6).forEach(c=>t+=`• ${c.nombre} — ${money(c.vencidoReal)} (${c.mora}d)\n`);
  }
  return t;
}

  const head=["Cliente","Rubro","Comercial","Deuda real","Vencida","En gris","Cobrado sin imputar","En borrador","Saldo anterior","N° facturas","Días mora","Vencimiento más viejo","Situación","Plazo de pago","Contactado","Nota / acuerdo","Ciudad","Teléfono","Email"];
  const rows=list.map(c=>{ const ct=fmtContacto(c.contactado); return [
    c.nombre, c.rubro||"", c.comercial, Math.round(Math.max(0,c.deudaReal)), Math.round(c.vencidoReal), Math.round(c.gris), Math.round(c.cobradoSinImp), Math.round(c.borrador), Math.round(c.saldoIni),
    c.nfac, c.mora, c.venc||"", sitLbl[c.situacion]||c.situacion, c.plazoFull||"", ct?ct.texto:"", c.nota?c.nota.texto:"", c.ciudad||"", c.telv||"", c.email||"" ]; });
  const ws=XLSX.utils.aoa_to_sheet([head,...rows]);
  ws["!cols"]=[{wch:34},{wch:16},{wch:18},{wch:13},{wch:13},{wch:12},{wch:16},{wch:12},{wch:13},{wch:9},{wch:9},{wch:14},{wch:20},{wch:16},{wch:14},{wch:34},{wch:16},{wch:16},{wch:24}];
  ws["!autofilter"]={ref:XLSX.utils.encode_range({s:{c:0,r:0},e:{c:head.length-1,r:rows.length}})};
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Cobranzas");
  XLSX.writeFile(wb, `cobranzas-eyg-${com.replace(/[^a-zA-Z0-9]+/g,"_")}-${hoyStr}.xlsx`);
}
// ===== Auto-refresco para trabajo simultáneo (sin F5) =====
// Chequeo LIVIANO cada 3s: solo pregunta "¿hubo un cambio?" (último id de una marca de cobranzas).
// El recálculo PESADO (cargar) corre SOLO si hubo un cambio real — o cada ~55s de red de seguridad
// (para pagos/facturas nuevas en Odoo que no dejan marca). Candado _busy = nunca se solapan.
function drawerAbierto(){ const d=document.getElementById("drawer"); return !!(d && d.classList.contains("on")); }
let _sig=null, _busy=false, _ticking=false, _ultimoFull=0;
async function refrescoFull(){
  if(_busy) return; _busy=true;
  try{ await cargar(true); _ultimoFull=Date.now(); } finally{ _busy=false; }
}
async function tick(){
  if(document.hidden || drawerAbierto() || _busy || _ticking) return;   // no molestar / no solapar
  _ticking=true;
  try{
    let sig=null;
    try{
      // cota de fecha: el body-like no usa índice; sin cota escanea toda mail.message. Los
      // marcadores nuevos llevan fecha de hoy, así que una ventana de 3 días detecta igual el
      // cambio y el escaneo se achica muchísimo. La red de 55s cubre el borde al envejecer.
      const _pd=new Date(Date.now()-3*86400000).toISOString().slice(0,10)+" 00:00:00";
      const r=await rpc("mail.message","search_read",[[["model","=","res.partner"],["date",">=",_pd],"|","|","|",["body","like","[COBRO-"],["body","like","[BOVEDA]"],["body","like","[MIG-ARCHIVADA]"],["body","like","[BLOQUEO]"]],["id"]],{limit:1,order:"id desc"});
      sig = r.length ? r[0].id : 0;
    }catch(e){ return; }                     // si el probe falla, no pasa nada (reintenta)
    if(_sig===null){ _sig=sig; return; }     // baseline en el 1er chequeo
    if(sig!==_sig){ _sig=sig; await refrescoFull(); }              // alguien marcó/cambió algo
    else if(Date.now()-_ultimoFull > 55000){ await refrescoFull(); } // red de seguridad
  } finally{ _ticking=false; }
}
// Probe cada 20s (antes 3s): el `body like` sobre mail.message no usa índice
// (full-scan de la tabla más grande de Odoo). A 3s eran ~20 escaneos/min por
// pestaña; a 20s son ~3/min. La red de seguridad de 55s y el refresco on-focus
// cubren la latencia. Ver cache de uid en la edge function odoo-rpc.
function autoRefrescar(){ setInterval(tick, 20000); }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && !drawerAbierto()) refrescoFull(); });
EYG.guard(["finanzas","lider","admin","direccion","cobranzas"]).then(()=>{ cargar().then(()=>{ _ultimoFull=Date.now(); autoRefrescar(); }); });
</script>
