  }).join("")+(por[k].length>40?'<tr><td colspan="4" class="muted">… y '+(por[k].length-40)+' más</td></tr>':"");

  return '<div class="panel resolver"><h3>👁️ Se van a resolver '+lista.length+' movimientos</h3>'+
    '<div class="sub">Nada se escribe en Odoo hasta que confirmes. Esta es la lista exacta que va a recorrer, '+
    'agrupada por lo que se le va a hacer a cada uno. Si algo falla, se anota en el registro y sigue con el resto.</div>'+
    Object.keys(QUE).filter(k=>por[k]).map(k=>
      '<div class="sub" style="margin:13px 0 5px"><b>'+QUE[k][0]+' · '+por[k].length+' por '+money(tot(por[k]))+'</b><br>'+QUE[k][1]+'</div>'+
      '<div class="tw"><table><thead><tr><th>Fecha</th><th class="r">Importe</th><th>'+
        (k==="candidato"?"Contacto":k==="transferencia"?"Movimiento":"Concepto")+'</th><th>'+
        (k==="candidato"?"Comprobante":"Detalle")+'</th></tr></thead><tbody>'+detalle(k)+'</tbody></table></div>'
    ).join("")+
    (por.cargo?'<div class="aviso info" style="margin:12px 0 0">ℹ️ <div>Los cargos del banco crean <b>'+por.cargo.length+
      ' pagos</b> a nombre de '+esc(B.nombre)+'. Si después llega la factura del banco, esos pagos se imputan contra ella.</div></div>':"")+

window.accionResolver=()=>conTrabajo(async()=>{
  ST.masivo=null;   /* el cuadro ya cumplió: se cierra al arrancar */
  const B=BANCOS[ST.banco];
  let imp=0,car=0,con=0,trf=0;
  for(const m of ST.movs){
    if(!m.yaEsta || m.yaEsta.is_reconciled) continue;      // sólo lo cargado y sin resolver
    /* Las transferencias entre cuentas propias van primero y por su propio camino:
       crean el par en Odoo y después concilian, así que no pasan por la cuenta
       transitoria de la misma forma que el resto. */
    if(m.tipo==="interna" && m.otroBanco){
      try{
        const r=await transferenciaInterna(m);
        await conciliarLinea(m, r.apunteId, r.cta);
        m.yaEsta.is_reconciled=true; trf++;
        log("Transferencia "+r.pago.name+" + "+r.par.name+" — "+money(m.importe)+" "+
            (m.otroBanco.entra? "desde "+m.otroBanco.nombre : "hacia "+m.otroBanco.nombre));
      }catch(e){ log("No se pudo transferir "+money(m.importe)+": "+(e.message||e),"e"); }
      continue;
    }
    const linea=m.yaEsta;
    const mv=await rpc("account.move","read",[[linea.move_id[0]],["line_ids"]]);
    const lins=await rpc("account.move.line","read",[mv[0].line_ids,["account_id"]]);
    const tra=lins.find(x=>x.account_id[0]===CTA_TRANSIT);
    if(!tra) continue;

    if(m.tipo==="impuesto"&&m.cta){
      await rpc("account.move.line","write",[[tra.id],{account_id:m.cta}]);
      imp++; log("Imputado "+money(m.importe)+" — "+m.sub);
    }
    else if(m.tipo==="cargo"){
      /* El método de pago es POR BANCO. Estaba fijo en 21, que es el Manual de salida
         de CREDICOOP: usado en el Macro habría creado el pago con el método del banco
         equivocado. Cada banco tiene el suyo (verificado en Odoo el 07/10/2026):
         Credicoop 21 · Macro 27 · BBVA 24 · Santa Fe 96 · Municipal 106 · Nación 16. */
      if(!B.metodoSalida){ log("No sé con qué método de pago crear el cargo en "+B.nombre+": falta 'metodoSalida' en el mapa del banco. No toco nada.","e"); continue; }
      const p=await rpc("account.payment","create",[[{
        partner_id:B.partner, journal_id:B.diario, payment_type:"outbound", partner_type:"supplier",
        payment_method_line_id:B.metodoSalida, destination_account_id:CTA_PROVEEDORES,
        amount:Math.abs(m.importe), date:m.fecha, ref:m.concepto.slice(0,60)}]]);
      const pid=Array.isArray(p)?p[0]:p;
      await rpc("account.payment","action_post",[[pid]]);
      const pv=await rpc("account.payment","read",[[pid],["name","move_id"]]);
      const lp=await rpc("account.move.line","search_read",
        [[["move_id","=",pv[0].move_id[0]],["account_id","=",CTA_PAGOS]],["id"]],{limit:1});
      await rpc("account.move.line","write",[[tra.id],{account_id:CTA_PAGOS}]);
      await rpc("account.move.line","reconcile",[[tra.id,lp[0].id]]);
      car++; log("Pago "+pv[0].name+" por "+money(Math.abs(m.importe))+" — "+m.sub);
    }
    else if(m.cands.length===1){
      const cta = m.tipo==="cobro" ? CTA_RECIBOS : CTA_PAGOS;
      await rpc("account.move.line","write",[[tra.id],{account_id:cta}]);
      await rpc("account.move.line","reconcile",[[tra.id,m.cands[0].id]]);
      const q=m.cands[0].partner_id?m.cands[0].partner_id[1]:(m.cliente?m.cliente.nombre:"");
      con++; log("Conciliado "+money(m.importe)+(q?" — "+q:"")+(m.porCheque?"  (cheque "+m.cpbte+")":""));
    }
  }
  log("Resueltos: "+imp+" impuestos · "+car+" cargos · "+trf+" transferencias entre cuentas · "+con+" conciliaciones","o");
});

/* ─────────────────────────────────────────────────────────────────────────
   RESOLVER A MANO — para lo que no se puede conciliar solo.
   El caso más frecuente: el cobro llegó al banco pero Cobranzas todavía no
   cargó el recibo. Acá se crea el recibo, se elige qué facturas cancela y
   se concilia contra el extracto, sin pasar por Odoo.
   ───────────────────────────────────────────────────────────────────────── */
window.RES={i:null, cliente:null, facturas:[], sel:new Set(), buscando:false};

window.abrirResolver=async(i)=>{
  const m=ST.movs[i];
  if(RES.i===i){ RES.i=null; render(); return; }
  RES.i=i; RES.cliente=m.cliente||null; RES.facturas=[]; RES.sel=new Set(); RES.sug=null; RES.sugCargando=false; render(); irAlCuadro();
  if(RES.cliente) await cargarFacturas(RES.cliente.id);
};
window.cerrarResolver=()=>{ RES.i=null; render(); };

async function cargarFacturas(pid){
  RES.buscando=true; render();
  const m=ST.movs[RES.i]||{}; const L=LADO(m);
  /* Comprobantes abiertos del tercero, del más viejo al más nuevo. Del lado del
     cliente la deuda está al DEBE (nos debe); del lado del proveedor, al HABER. */
  const ls=await rpc("account.move.line","search_read",
    [[["partner_id","=",pid],["account_id","=",L.cta],["parent_state","=","posted"],
      ["full_reconcile_id","=",false],[sale(m)?"credit":"debit",">",0]],
     ["move_id","date","date_maturity","debit","credit","amount_residual"]],{limit:0,order:"date_maturity,date"});
  RES.facturas=ls.filter(l=>Math.abs(l.amount_residual)>0.005);
  RES.buscando=false; render();
}
window.buscarCliente=async(txt)=>{
  if(!txt||txt.length<3){ RES.opciones=null; render(); return; }
  const m=ST.movs[RES.i]||{};
  /* Cuando se está pagando se buscan proveedores, y al revés: ofrecer el padrón entero
     es la forma más fácil de imputarle el movimiento al tercero equivocado. Si no
     aparece ninguno con ese rol, se busca sin filtro y se avisa en el panel. */
  const rank = sale(m) ? ["supplier_rank",">",0] : ["customer_rank",">",0];
  const dom  = ["|",["name","ilike",txt],["vat","like",txt.replace(/[^0-9]/g,"")]];
  let r=await rpc("res.partner","search_read",[[rank].concat(dom),["id","name","vat"]],{limit:12});
  RES.sinRol=false;
  if(!r.length){ r=await rpc("res.partner","search_read",[dom,["id","name","vat"]],{limit:12}); RES.sinRol=r.length>0; }
  RES.opciones=r; render();
};
window.elegirCliente=async(id,nombre)=>{
  RES.cliente={id,nombre}; RES.opciones=null; RES.sel=new Set();
  await cargarFacturas(id);
};
window.toggleFac=(id)=>{ RES.sel.has(id)?RES.sel.delete(id):RES.sel.add(id); render(); };

/* ---------- DE QUÉ PROVEEDOR ES ESTE CHEQUE ----------
   Federico arma el pago al revés de como lo ve el banco: mira la deuda del proveedor,
   elige las facturas, le descuenta las retenciones y emite el cheque por lo que queda.
   Así que el importe del cheque es una FIRMA: hay que buscar qué proveedor tiene
   facturas abiertas que, netas de retención, den exactamente ese número.

   El rango de retención sale de las 60 últimas medidas en esta base: Ganancias 2%
   (con un mínimo no imponible de $224.000 que se consume una vez al mes) más IIBB
   Santa Fe 0,7% o 2,75%. En total nunca pasó del 5,5%, así que el bruto que se busca
   está entre el importe del cheque y ese importe dividido 0,945.

   Esto NO calcula la retención ni decide nada: reduce cientos de proveedores a unos
   pocos candidatos con su retención implícita a la vista, y elige la persona. Calcular
   la retención acá sería peligroso —depende del régimen, de la jurisdicción y de lo que
   ya se retuvo en el mes— y de eso se encarga Odoo cuando se confirma el pago. */
const RET_MAX=0.055;
async function sugerirProveedores(neto){
  RES.sug=null; RES.sugCargando=true; render();
  try{
    const ls=await rpc("account.move.line","search_read",
      [[["account_id","=",CTA_PROVEEDORES],["parent_state","=","posted"],["full_reconcile_id","=",false],["credit",">",0]],
       ["move_id","partner_id","date","date_maturity","amount_residual"]],{limit:0,order:"partner_id,date_maturity,date"});
    const porProv={};
    ls.forEach(x=>{ if(!x.partner_id) return;
      (porProv[x.partner_id[0]]=porProv[x.partner_id[0]]||{id:x.partner_id[0],nombre:x.partner_id[1],facs:[]}).facs.push(x); });
    const lo=neto, hi=neto/(1-RET_MAX), out=[];
    Object.values(porProv).forEach(p=>{
      /* Acumulado de la más vieja a la más nueva, que es el orden en que se imputa. */
      let acc=0;
      for(let i=0;i<p.facs.length;i++){
        acc+=Math.abs(p.facs[i].amount_residual);
        if(acc>=lo-0.5 && acc<=hi+0.5){ out.push({id:p.id, nombre:p.nombre, n:i+1, total:acc, ret:acc-neto, pct:(acc-neto)/acc*100}); break; }
        if(acc>hi) break;
      }
    });
    RES.sug=out.sort((a,b)=>a.pct-b.pct).slice(0,8);
  }catch(e){ RES.sug=[]; log("No pude buscar proveedores por importe: "+(e.message||e),"e"); }
  RES.sugCargando=false; render();
}
/* Cuántos movimientos IGUALES a éste hay sin resolver el mismo día. Fede parte un
   pago grande en varios cheques del mismo importe, así que el neto que hay que buscar
   puede ser el de uno o el de todos juntos. */
function hermanos(m){
  return ST.movs.filter(x=>x!==m && abierto(x) && x.fecha===m.fecha &&
    Math.abs(x.importe-m.importe)<0.005 && x.tipo===m.tipo).length + 1;
}
window.sugerirPor=(veces)=>{ const m=ST.movs[RES.i]; if(m) sugerirProveedores(Math.abs(m.importe)*veces); };

  let h='<div class="sub" style="margin:14px 0 6px"><b>¿No sabés de quién es?</b> '+
    'Buscalo al revés: por lo que Federico tuvo que pagar. El cheque sale de las facturas '+

    '<div class="acciones" style="margin-bottom:10px">'+
      '<button class="btn gh sm" onclick="sugerirPor(1)">Buscar por '+money(uno)+'</button>'+

    'La <b>retención implícita</b> es lo que habría que haber retenido para llegar al número del cheque: '+

}

    } else {

        'Las más viejas primero, que es como se imputa normalmente.</div>'+
        '<div class="facs">'+RES.facturas.map(f=>{

            '<span class="tk">'+(on?"☑":"☐")+'</span>'+

            '<span class="fd muted">'+(f.date_maturity||f.date)+'</span>'+

          ' <b>más</b> de lo que entró. Sacá alguna factura: no se puede cancelar más de lo que el banco acreditó.</div></div>':"")+

        (!exacto&&dif>0?(dif<=TOPE_AJUSTE

    '<span class="cp">'+esc(m.concepto.slice(0,80))+'</span></div>'+cuerpo+'</div>';

/* Cierra el sobrante de un recibo ya imputado, si es chico.
   Arma un asiento de dos líneas en Operaciones varias: le devuelve al cliente el
   debe que le sobra y manda el peso a Ajuste por redondeo. Después lo concilia
   contra el residuo del recibo, así la cuenta corriente queda en cero y no hay
   nada que arrastrar. No emite ningún comprobante.
   Si el sobrante pasa el tope, NO se toca: se avisa y queda a cuenta, como antes. */
async function cerrarDiferencia(lineaRecibo, cliente, fechaMov){
  const v=await rpc("account.move.line","read",[[lineaRecibo],["amount_residual","full_reconcile_id"]]);
  if(!v.length||v[0].full_reconcile_id) return false;          /* cerró exacto */
  const resid=Math.round(Math.abs(v[0].amount_residual)*100)/100;
  if(resid<0.005) return false;
  if(resid>TOPE_AJUSTE){
    log("Quedan "+money(resid)+" a cuenta de "+cliente.nombre+": es más de "+money(TOPE_AJUSTE)+
        ", así que no lo cierro solo. Puede ser un pago parcial o un error — miralo.","o");
    return false;
  }
  const asiento=await rpc("account.move","create",[[{
    journal_id:DIARIO_AJUSTE, date:fechaMov,
    ref:"Ajuste por redondeo · cobro de "+cliente.nombre,
    line_ids:[
      [0,0,{account_id:CTA_CLIENTES, partner_id:cliente.id, name:"Ajuste por redondeo del cobro", debit:resid, credit:0}],
      [0,0,{account_id:CTA_AJUSTE,   name:"Ajuste por redondeo del cobro", debit:0, credit:resid}]
    ]}]]);
  const aid=Array.isArray(asiento)?asiento[0]:asiento;
  await rpc("account.move","action_post",[[aid]]);
  const ls=await rpc("account.move.line","search_read",[[["move_id","=",aid]],["id","account_id","debit"]],{limit:0});
  const lCli=ls.find(x=>x.account_id[0]===CTA_CLIENTES);
  if(!lCli) throw new Error("el asiento de ajuste no tiene la línea del cliente");
  await rpc("account.move.line","reconcile",[[lineaRecibo,lCli.id]]);
  const q=await rpc("account.move.line","read",[[lineaRecibo],["full_reconcile_id","amount_residual"]]);
  if(!q[0].full_reconcile_id && Math.abs(q[0].amount_residual)>0.005)
    throw new Error("la diferencia no quedó cerrada: siguen "+money(q[0].amount_residual));
  log("Diferencia de "+money(resid)+" cerrada contra Ajuste por redondeo, sin emitir comprobante","ok");
  return true;
}

/* ---------- ANTES DE ESCRIBIR: MOSTRAR QUÉ SE VA A HACER -----------------------------
   El botón de conciliar escribía directo en Odoo. Ahora arma el plan, lo muestra paso a
   paso con los números finales, y recién escribe cuando se confirma. Lo que se puede
   cambiar acá —la fecha del comprobante y qué hacer con la diferencia— es lo único que
   cambia el resultado contable; el resto sale de lo que ya se tildó. */
function planDeCobro(){
  const m=ST.movs[RES.i]; if(!m||!RES.cliente) return null;
  const L=LADO(m), B=BANCOS[ST.banco];
  const elegidas=RES.facturas.filter(f=>RES.sel.has(f.id));
  const impu=elegidas.reduce((s,f)=>s+Math.abs(f.amount_residual),0);
  const total=Math.abs(m.importe);
  const dif=Math.round((total-impu)*100)/100;
  return { m, L, B, elegidas, impu, total, dif,
    /* el id del método lo resuelve ejecutarPlan contra el diario: acá sólo el nombre */
    metodoNom: sale(m) ? (m.tipo==="echeq" ? "Cheques" : "Manual") : "Manual",
    fecha: ST.plan && ST.plan.fecha ? ST.plan.fecha : m.fecha,
    ajustar: ST.plan && ST.plan.ajustar!==undefined ? ST.plan.ajustar : (dif>0 && dif<=TOPE_AJUSTE) };
}
window.abrirConfirmar=()=>{ const p=planDeCobro(); if(!p) return;
  /* si la diferencia pasa el tope no hay nada que elegir: queda a cuenta sí o sí. Dejar
     marcada la opción de ajustar (deshabilitada) hacía creer que iba a cerrarse. */
  const puede = p.dif!==0 && Math.abs(p.dif)<=TOPE_AJUSTE;
  ST.plan={fecha:p.fecha, ajustar: puede ? p.ajustar : false};
  render(); irAlCuadro(); };
window.cerrarConfirmar=()=>{ ST.plan=null; render(); };
window.planFecha=(v)=>{ if(ST.plan){ ST.plan.fecha=v; render(); } };
window.planAjuste=(v)=>{ if(ST.plan){ ST.plan.ajustar=(v==="1"); render(); } };

   si arriba había algo alto (la zona de carga, el encabezado de cobranzas), el cuadro

  setTimeout(function(){
    const el=document.querySelector(".panel.resolver");
    if(el && el.scrollIntoView) el.scrollIntoView({behavior:"smooth", block:"start"});
    else window.scrollTo({top:0, behavior:"smooth"});
  },30);
}

/* Crea el recibo igual que lo hace Cobranzas, lo imputa a las facturas
   tildadas y lo concilia contra la línea del extracto. Todo o nada. */
window.ejecutarPlan=()=>conTrabajo(async()=>{
  /* lo que se dejó tocar en el cuadro: la fecha del comprobante y qué hacer con la
     diferencia. Si alguien llama a esto sin pasar por el cuadro, se usa lo de antes. */
  const plan=ST.plan||{fecha:((ST.movs[RES.i]||{}).fecha), ajustar:true};
  const m=ST.movs[RES.i]; const B=BANCOS[ST.banco];
  if(!m||!RES.cliente){ log("Falta elegir el "+LADO(m||{}).quien,"e"); return; }
  if(!m.yaEsta){ log("Primero hay que cargar el movimiento a Odoo","e"); return; }
  const L=LADO(m);
  /* Un e-cheq se paga CON CHEQUE, y ese método tiene su propia cuenta: usar Manual
     mandaría el asiento a otro lado. Es el molde de Fede (OP-X 7947, Dnm Farma). */
  const metodo = (await metodoDe(B.diario, L.tipo, (sale(m)&&m.tipo==="echeq") ? "check_printing" : "manual")).id;

  const p=await rpc("account.payment","create",[[{
    partner_id:RES.cliente.id, journal_id:B.diario,
    payment_type:L.tipo, partner_type:L.parte,
    payment_method_line_id:metodo, destination_account_id:L.cta,
    amount:Math.abs(m.importe), date:plan.fecha}]]);
  const pid=Array.isArray(p)?p[0]:p;
  await rpc("account.payment","action_post",[[pid]]);
  const pv=await rpc("account.payment","read",[[pid],["name","move_id"]]);
  log((sale(m)?"Orden de pago ":"Recibo ")+pv[0].name+" por "+money(Math.abs(m.importe))+" — "+RES.cliente.nombre,"o");

  const lins=await rpc("account.move.line","search_read",
    [[["move_id","=",pv[0].move_id[0]]],["account_id","id"]],{limit:0});
  const lCred=lins.find(l=>l.account_id[0]===L.cta);
  const lRec =lins.find(l=>l.account_id[0]===L.transit);

  if(RES.sel.size&&lCred){
    await rpc("account.move.line","reconcile",[[lCred.id,...[...RES.sel]]]);
    log("Imputado a "+RES.sel.size+" factura(s)");
    /* Lo que sobra cuando el cobro no da exacto con las facturas. Antes quedaba
       "a cuenta" y había que arrastrarlo hasta que alguien le hiciera una nota de
       crédito. Si es chico se cierra acá mismo contra Ajuste por redondeo. */
    /* sólo si en el cuadro se eligió cerrarla; si no, queda a cuenta a propósito */
    if(plan.ajustar) await cerrarDiferencia(lCred.id, RES.cliente, plan.fecha);
    else { const vq=await rpc("account.move.line","read",[[lCred.id],["amount_residual","full_reconcile_id"]]);
      if(!vq[0].full_reconcile_id && Math.abs(vq[0].amount_residual)>0.005)
        log("Quedan "+money(Math.abs(vq[0].amount_residual))+" a cuenta de "+RES.cliente.nombre+", como pediste","o"); }
  } else log("Queda a cuenta del cliente (sin imputar)");

  /* y ahora contra el extracto */
  const mv=await rpc("account.move","read",[[m.yaEsta.move_id[0]],["line_ids"]]);
  const ext=await rpc("account.move.line","read",[mv[0].line_ids,["account_id"]]);
  const tra=ext.find(x=>x.account_id[0]===CTA_TRANSIT);
  if(tra&&lRec){
    await rpc("account.move.line","write",[[tra.id],{account_id:L.transit}]);
    await rpc("account.move.line","reconcile",[[tra.id,lRec.id]]);
    log("Conciliado con el movimiento del banco","o");
  }
  RES.i=null; RES.cliente=null; RES.facturas=[]; RES.sel=new Set(); ST.plan=null;
});

/* El usuario eligió cuál de los candidatos es el correcto. */
/* ---------- TRANSFERENCIA ENTRE CUENTAS PROPIAS ----------
   Se crea UN SOLO account.payment en el diario de ORIGEN con is_internal_transfer:
   al postearlo Odoo crea el asiento del otro banco y concilia las dos patas de la
   cuenta puente entre sí. Es exactamente lo que hace Federico desde Contabilidad
   (verificado contra su par PBNK11/2026/00131 + PBCRED/2026/00441 del 25/09).

   Después queda conciliar la línea del extracto contra la pata que quedó abierta:
   Recibos pendientes si la plata ENTRA a este banco, Pagos pendientes si SALE. */
async function transferenciaInterna(m){
  const B=BANCOS[ST.banco], o=m.otroBanco;
  const esteDiario=B.diario, otroDiario=o.diario;
  /* El pago se crea siempre en el diario de donde SALE la plata. */
  const origen = o.entra ? otroDiario : esteDiario;
  const destino= o.entra ? esteDiario : otroDiario;
  const metodo = o.entra ? o.metodo : B.metodoSalida;
  if(!metodo) throw new Error("No tengo el método de pago Manual de "+(o.entra?o.nombre:B.nombre)+": hay que agregarlo al mapa antes de poder crear la transferencia.");
  const id=await rpc("account.payment","create",[[{
    date:m.fecha, amount:Math.abs(m.importe),
    payment_type:"outbound", partner_type:"supplier", partner_id:EYG_PARTNER,
    journal_id:origen, destination_journal_id:destino, is_internal_transfer:true,
    payment_method_line_id:metodo, destination_account_id:CTA_PUENTE }]]);
  const pid=Array.isArray(id)?id[0]:id;
  await rpc("account.payment","action_post",[[pid]]);
  const pago=(await rpc("account.payment","read",[[pid],["name","move_id","paired_internal_transfer_payment_id"]]))[0];
  if(!pago.paired_internal_transfer_payment_id) throw new Error("Odoo no creó la contrapartida del pago "+pago.name+". No concilio nada: hay que mirarlo a mano.");
  const par=(await rpc("account.payment","read",[[pago.paired_internal_transfer_payment_id[0]],["name","move_id"]]))[0];
  /* La pata a conciliar está en el asiento de ESTE banco, no en el del otro. */
  const mioEs = o.entra ? par : pago;
  const cta   = o.entra ? CTA_RECIBOS : CTA_PAGOS;
  const mv=(await rpc("account.move","read",[[mioEs.move_id[0]],["line_ids"]]))[0];
  const lins=await rpc("account.move.line","read",[mv.line_ids,["id","account_id"]]);
  const apunte=lins.find(x=>x.account_id[0]===cta);
  if(!apunte) throw new Error("El asiento "+mioEs.name+" no tiene la pata esperada en "+(o.entra?"Recibos":"Pagos")+" pendientes.");
  return {pago, par, apunteId:apunte.id, cta};
}

window.crearTransferencia=(i)=>conTrabajo(async()=>{
  ST.transf=null;

/* Cambia la cuenta transitoria de la línea del extracto por la que corresponde y la
   concilia contra el apunte. Es el mismo paso final de todas las acciones. */
async function conciliarLinea(m, apunteId, cta){
  const mv=await rpc("account.move","read",[[m.yaEsta.move_id[0]],["line_ids"]]);
  const lins=await rpc("account.move.line","read",[mv[0].line_ids,["id","account_id"]]);
  const tra=lins.find(x=>x.account_id[0]===CTA_TRANSIT);
  if(!tra) throw new Error("La línea del extracto ya no tiene su pata en la cuenta transitoria");
  await rpc("account.move.line","write",[[tra.id],{account_id:cta}]);
  await rpc("account.move.line","reconcile",[[tra.id, apunteId]]);
}

/* ══════════════════════════════════════════════════════════════════════════
   ARRANQUE
   ══════════════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════════════
   TRAER DEL BANCO — el camino sin archivo

   El Macro tiene conexión con el banco en Odoo (Syncfy). El botón hace tres cosas:
   le pide al banco los movimientos nuevos, los lee del diario, y los pasa por el
   MISMO análisis que el archivo. Acá no hay nada que crear: las líneas las crea la
   sincronización, así que el trabajo que queda es clasificar, poner el contacto e
   imputar — lo mismo que se hace a mano, pero sin bajar ni subir un archivo.

   OJO con una cosa que ya pasó: si alguien carga el mismo tramo a mano, se duplica.
   Odoo deduplica por el identificador de la transacción, que las líneas cargadas a
   mano no tienen. Con la conexión encendida, el banco se carga por acá y nada más.
   ══════════════════════════════════════════════════════════════════════════ */
const soloDigitos=s=>{const t=String(s||"").trim(); return t.length>0 && t.split("").every(ch=>"0123456789".indexOf(ch)>=0);};

/* ══════════════════════════════════════════════════════════════════════════
   LA CONEXIÓN DEL BANCO, DESCUBIERTA SOLA

   Antes los números del vínculo estaban escritos a mano en el mapa, y cada vez que
   alguien recreaba la conexión cambiaban y había que actualizarlos. Acá se buscan
   por el NÚMERO DE CUENTA, que es lo único que no cambia.

   Y de paso resuelve un bug de Odoo. Al vincular una cuenta a un diario desde la
   pantalla de Odoo, el módulo de sincronización le escribe al diario la moneda de la
   cuenta; si la cuenta es en pesos y la compañía también, el propio control de Odoo
   lo rechaza con "Solo puede utilizar una moneda secundaria distinta a la moneda de
   la compañía (ARS)" y la vinculación no se completa. El control está bien —un diario
   no debe tener como moneda secundaria la de la compañía—; lo que está mal es que el
   módulo escriba la moneda. Escribiendo sólo `account_online_account_id`, que es lo
   que hace `vincularCuenta`, el diario queda bien y el error no aparece.
   ══════════════════════════════════════════════════════════════════════════ */
const soloNros=s=>String(s||"").replace(/[^0-9]/g,"");

async function buscarConexion(B){
  /* las cuentas online que el proveedor haya traído, vinculadas o no */
  const ctas=await rpc("account.online.account","search_read",
    [[],["id","name","account_number","journal_ids","account_online_link_id","last_sync","balance","currency_id"]],{limit:0});
  if(!ctas.length) return {cuentas:[], mia:null, yaVinculada:null};
  /* la del diario: la que ya está vinculada, o la que coincide por número de cuenta */
  const yaVinculada = ctas.find(c=>(c.journal_ids||[]).indexOf(B.diario)>=0) || null;
  const nro = soloNros(B.cuentaBanco);
  const mia = yaVinculada || (nro ? ctas.find(c=>!c.journal_ids.length && soloNros(c.account_number)===nro) : null) || null;
  return {cuentas:ctas, mia, yaVinculada};
}

/* Vincula la cuenta al diario SIN tocar la moneda, que es lo que rompe en Odoo. */
async function vincularCuenta(B, cuentaId){
  await rpc("account.journal","write",[[B.diario],{account_online_account_id:cuentaId}]);
  const j=(await rpc("account.journal","read",[[B.diario],["account_online_account_id","account_online_link_id","bank_statements_source","currency_id"]]))[0];
  if(!j.account_online_account_id) throw new Error("la cuenta no quedó vinculada al diario");
  if(j.currency_id) throw new Error("el diario quedó con una moneda puesta ("+j.currency_id[1]+"): eso no corresponde, avisá");
  /* el corte de fechas: el día de la última línea cargada, para no traer lo que ya está */
  const ult=await rpc("account.bank.statement.line","search_read",[[["journal_id","=",B.diario]],["date"]],{limit:1,order:"date desc"});
  if(ult.length) await rpc("account.online.account","write",[[cuentaId],{last_sync:ult[0].date}]);
  if(j.account_online_link_id) await rpc("account.online.link","write",[[j.account_online_link_id[0]],{auto_sync:true}]);
  return {link:j.account_online_link_id, desde:ult.length?ult[0].date:null};
}

/* EL SALDO DESPUÉS DEL MOVIMIENTO. El banco NO manda la hora —le pone la misma a todos
   los movimientos del día, así que no sirve para ordenarlos— pero sí manda el saldo que
   quedó después de cada uno, adentro del detalle crudo de la transacción. Ese dato vale
   más que la hora: dice en qué orden pasaron las cosas y deja controlar la cadena. */
function detalleDe(l){
  let d=l.transaction_details;
  if(!d) return null;
  if(typeof d==="string"){ try{ d=JSON.parse(d); }catch(e){ return null; } }
  return (d && typeof d==="object") ? d : null;
}
function saldoDe(l){
  const d=detalleDe(l);
  const b=d && d.extra && d.extra.balance;
  return (typeof b==="number") ? b : null;
}
/* EL NÚMERO DE CHEQUE. El banco lo manda en `reference` dentro del detalle crudo, y es
   el número COMPLETO del cheque — no un fragmento. Comprobado el 07/10/2026 contra 10
   casos (5 pendientes y 5 ya resueltos): coincide con el "Cheque NNNNNNNN entregado"
   del pago en Odoo, 10 de 10.
   Esto es lo que saca a los e-cheq del emparejamiento por importe, que es ambiguo
   cuando hay varios pagos iguales, y los lleva a uno que no falla. */
function chequeDe(l){
  if(soloDigitos(l.ref)) return String(l.ref).trim();
  const d=detalleDe(l);
  const r=d && d.reference;
  return (r && soloDigitos(r)) ? String(r).trim() : "";
}

/* ---------- IDENTIFICAR POR CUIT ----------------------------------------------------
   El Macro manda el CUIT de quien transfiere dentro del concepto
   ("TRANSF:3D5W612EW81LOQ3O2GXYVR-27374091390"). Con eso se sabe QUIÉN pagó sin que
   nadie lo busque a mano, que es la parte tediosa. Medido sobre 3 meses: el 30% de las
   entradas del Macro se identifican así; el BBVA y el Nación no mandan el CUIT nunca.

   Esto NO concilia nada: sólo escribe el contacto. Conciliar queda para la pantalla de
   Odoo, donde la regla "Coincidencia perfecta de facturas" propone la factura. Así no
   hay manera de que se duplique una conciliación.

   Dos cuidados que no son opcionales:
   - Un CUIT de verdad tiene 11 dígitos y empieza con 20, 23, 24, 27, 30, 33 o 34. Sin
     ese filtro, los números de operación del banco (de 20 y 30 dígitos) se leen como
     CUIT y apuntan a cualquier lado.
   - Odoo guarda el CUIT con guiones ("27-37409139-0") y el banco lo manda pelado, así
     que se busca por las dos formas.
   - Si un mismo CUIT está en más de un contacto (hay 123 así), NO se elige: se avisa. */
const PREF_CUIT=["20","23","24","27","30","33","34"];
function cuitsDelTexto(t){
  /* Se buscan las tiradas de dígitos COMPLETAS y se toman sólo las de exactamente 11.
     Buscar "11 dígitos" a secas agarra los primeros 11 de un número de operación de 30
     ("332000922074000000000011035181" daba el falso CUIT 33200092207, y como empieza
     con 33 el filtro de prefijo no lo frenaba). */
  const tiradas=String(t||"").match(/\d+/g)||[];
  const out=[];
  tiradas.forEach(function(c){
    if(c.length!==11) return;
    if(c===EYG_CUIT) return;
    if(PREF_CUIT.indexOf(c.slice(0,2))<0) return;
    if(out.indexOf(c)<0) out.push(c);
  });
  return out;
}
const conGuiones=c=>c.slice(0,2)+"-"+c.slice(2,10)+"-"+c.slice(10);

/* Busca los contactos de una tanda de CUIT. Devuelve {cuit: [contactos activos]}. */
async function contactosPorCuit(cuits){
  if(!cuits.length) return {};
  const variantes=[];
  cuits.forEach(function(c){ variantes.push(c); variantes.push(conGuiones(c)); });
  const ps=await rpc("res.partner","search_read",[[["vat","in",variantes],["active","=",true]],["id","name","vat"]],{limit:0});
  const out={};
  ps.forEach(function(p){
    const v=String(p.vat||"").replace(/[^0-9]/g,"");
    if(!p.name) return;                       /* hay contactos con CUIT y sin nombre */
    (out[v]=out[v]||[]).push({id:p.id, nombre:p.name});
  });
  return out;
}

/* Corre sobre lo que está en pantalla. Si `escribir` es false, sólo cuenta. */
async function identificarPorCuit(escribir){
  const B=BANCOS[ST.banco];
  const pend=ST.movs.filter(m=>m.yaEsta && !m.yaEsta.is_reconciled && !m.yaEsta.partner_id && m.importe>0);
  const conCuit=[];
  pend.forEach(function(m){
    const cs=cuitsDelTexto(m.concepto);
    if(cs.length) conCuit.push({m, cuits:cs});
  });
  if(!conCuit.length){ log("Ninguna entrada sin contacto trae el CUIT en el concepto.","o"); return {puestos:0,ambiguos:0,sinFicha:0}; }
  const mapa=await contactosPorCuit([...new Set(conCuit.flatMap(x=>x.cuits))]);
  const listos=[], ambiguos=[], sinFicha=[];
  conCuit.forEach(function(x){
    let c=null;
    for(const k of x.cuits){ if(mapa[k]){ c=k; break; } }
    if(!c) return sinFicha.push(x);
    const cand=mapa[c];
    if(cand.length===1) listos.push({m:x.m, p:cand[0], cuit:c});
    else ambiguos.push({m:x.m, cand, cuit:c});
  });
  log("Entradas sin contacto: "+pend.length+" · con CUIT en el concepto: "+conCuit.length+
      " · se puede identificar solas: "+listos.length+
      (ambiguos.length?" · con el CUIT repetido en varios contactos: "+ambiguos.length:"")+
      (sinFicha.length?" · CUIT sin ficha en Odoo: "+sinFicha.length:""));
  ambiguos.forEach(a=>log("El CUIT "+a.cuit+" ("+money(a.m.importe)+" del "+a.m.fecha+") está en "+a.cand.length+" contactos: "+
      a.cand.map(c=>c.nombre).join(" / ")+". Hay que elegir a mano.","o"));
  if(!escribir || !listos.length) return {puestos:0, ambiguos:ambiguos.length, sinFicha:sinFicha.length, listos:listos.length};
  let n=0;
  for(const y of listos){
    try{
      const v=await ponerContactoEnOdoo(y.m.yaEsta.id, y.m.yaEsta.move_id[0], y.p.id, B.cuenta);
      y.m.yaEsta.partner_id=[y.p.id, y.p.nombre];
      y.m.yaEsta.is_reconciled=v.is_reconciled;
      y.m.ctoRecien=true; n++;
    }catch(e){ log("No se pudo poner el contacto en "+money(y.m.importe)+" del "+y.m.fecha+": "+((e&&e.message)||e),"e"); }
  }
  log(n?("Identificadas por CUIT: "+n+" entradas. Falta decidir contra qué factura va cada una."):"No se pudo identificar ninguna.", n?"ok":"e");
  return {puestos:n, ambiguos:ambiguos.length, sinFicha:sinFicha.length, listos:listos.length};
}
/* OJO: no poner acá un window.identificarPorCuit — una declaración `function X` ya vive
   en window, así que asignarle encima PISA la función y la deja inservible. Pasó: como
   el envoltorio llamaba a conTrabajo y traerDelBanco ya tenía ST.trabajando en true,
   conTrabajo salía en la primera línea y la identificación no corría nunca, sin avisar. */

async function traerDelBanco(){
  const B=BANCOS[ST.banco];
  if(ST.trabajando) return;
  ST.trabajando=true; ST.listo=false; ST.logs=[]; ST.archivos=[]; ST.validacion=null; ST.filtro=null; render();
  document.getElementById("app").insertAdjacentHTML("beforeend",
    '<div class="cargando">Conectando con el banco y pidiendo los movimientos…</div>');
  try{
    /* ---- la conexión se busca por el número de cuenta, no por un id escrito a mano ---- */
    const cx=await buscarConexion(B);
    if(!cx.mia){
      ST.conexion={sinCuenta:true, hay:cx.cuentas.length};
      log(cx.cuentas.length
        ? "Hay "+cx.cuentas.length+" cuenta(s) traídas del proveedor, pero ninguna es la "+B.cuentaBanco
        : "No hay ninguna cuenta traída del proveedor: falta que una persona se valide en el home banking","e");
      ST.movs=[]; ST.listo=false; ST.trabajando=false; render(); return;
    }
    if(!cx.yaVinculada){
      log("La cuenta "+cx.mia.account_number+" estaba sin vincular al diario. La vinculo…","o");
      const v=await vincularCuenta(B, cx.mia.id);
      log("Vinculada"+(v.desde?", y le puse el corte en el "+v.desde+" para no traer lo que ya está":"")+".","ok");
    }
    const linkId = cx.mia.account_online_link_id ? cx.mia.account_online_link_id[0] : null;
    if(!linkId) throw new Error("la cuenta no tiene conexión asociada");

    const antes=await rpc("account.bank.statement.line","search_count",[[["journal_id","=",B.diario]]]);
    log("Pidiendo los movimientos nuevos…");
    let falla="";
    try{ await rpc("account.online.link","action_fetch_transactions",[[linkId]]); }
    catch(e){ falla=String((e&&e.message)||e); }
    const despues=await rpc("account.bank.statement.line","search_count",[[["journal_id","=",B.diario]]]);
    const nuevas=despues-antes;
    if(falla) log("El banco respondió con un problema: "+falla.slice(0,220),"e");
    log(nuevas>0?("El banco mandó "+nuevas+" movimientos nuevos"):"El banco no mandó movimientos nuevos", nuevas>0?"ok":"o");

    /* El estado de la conexión: 'conectado' quiere decir que Odoo tiene las credenciales
       guardadas, NO que la sesión con el banco esté viva. Si hace días que no trae nada,
       lo que falta es que una persona vuelva a validarse en el home banking. */
    const lk=await rpc("account.online.link","read",[[linkId],["state","last_refresh","name"]]);
    const ac=await rpc("account.online.account","read",[[cx.mia.id],["last_sync","balance"]]);
    ST.conexion={estado:lk[0].state, refresh:lk[0].last_refresh, nombre:lk[0].name,
                 sync:ac[0].last_sync, saldo:ac[0].balance, nuevas, cuenta:cx.mia.account_number};

    /* ---- las líneas sin resolver del diario: eso es lo que hay para trabajar ---- */
    const lin=await rpc("account.bank.statement.line","search_read",
      [[["journal_id","=",B.diario],["is_reconciled","=",false]],
       ["id","date","payment_ref","amount","ref","partner_id","is_reconciled","to_check","move_id","online_transaction_identifier","transaction_details"]],
      /* "id desc" NO es capricho: el banco manda cada día del movimiento más nuevo al
         más viejo, así que Odoo los crea en ese orden y el id más alto es el MÁS VIEJO.
         Comprobado contra la cadena de saldos que manda el propio banco: así encadena
         142 de 143; al revés, 0 de 143. Esto deja los movimientos en orden cronológico
         igual que el archivo, y la tabla después los da vuelta para mostrarlos. */
      {limit:0, order:"date, id desc"});
    log("Movimientos sin resolver en el diario: "+lin.length);
    if(!lin.length){ log("No hay nada pendiente en este banco.","ok"); ST.movs=[]; ST.listo=true; ST.trabajando=false; render(); return; }

    const movs=lin.map(l=>({
      deOdoo:true, lineaId:l.id, yaEsta:l, online:!!l.online_transaction_identifier,
      fecha:l.date, concepto:String(l.payment_ref||"").trim().replace(/\s+/g," "),
      cpbte:chequeDe(l),
      importe:Math.round(l.amount*100)/100, saldo:saldoDe(l), cod:""
    }));
    ST.movs=await analizar(movs);
    /* Identificar por CUIT va acá: apenas llegan los movimientos y antes de que
       nadie los mire, para que la pantalla ya muestre quién pagó. */
    try{ await identificarPorCuit(true); }catch(e){ log("No se pudo identificar por CUIT: "+((e&&e.message)||e),"e"); }
    ST.listo=true; ST.trabajando=false; render();
  }catch(e){
    ST.trabajando=false; ST.listo=false;
    log("No se pudo traer del banco: "+((e&&e.message)||e),"e");
    render();
  }
}
window.traerDelBanco=traerDelBanco;

async function procesar(files){
  try{
    ST.listo=false; ST.logs=[]; ST.filtro=null; ST.archivos=[]; render();
    document.getElementById("app").insertAdjacentHTML("beforeend",
      '<div class="cargando">Leyendo '+files.length+' archivo(s) y consultando Odoo…</div>');

    /* ---- leer todos, cada uno con su propia cadena de saldos ---- */
    const porArchivo=[], errores=[];
    for(const f of files){
      try{
        const {movs}=leerArchivo(await f.arrayBuffer());
        if(!movs.length){ errores.push(f.name+": no tiene movimientos con fecha válida"); continue; }
        const fallas=validarCadena(movs);
        const dias=[...new Set(movs.map(m=>m.fecha))].sort();
        porArchivo.push({nombre:f.name, movs, fallas, dias});
      }catch(e){ errores.push(f.name+": "+(e.message||e)); }
    }
    if(!porArchivo.length) throw new Error(errores.join(" · ")||"Ningún archivo se pudo leer.");
    errores.forEach(e=>log("No se pudo leer — "+e,"e"));

    /* ---- el mismo día en dos archivos: se usa una sola vez ---- */
    porArchivo.sort((a,b)=>a.dias[0].localeCompare(b.dias[0]));
    const vistos=new Set(), todos=[], repetidos=[];
    porArchivo.forEach(a=>{
      const nuevosDias=a.dias.filter(d=>!vistos.has(d));
      const repes=a.dias.filter(d=>vistos.has(d));
      if(repes.length) repetidos.push({archivo:a.nombre,dias:repes});
      a.dias.forEach(d=>vistos.add(d));
      todos.push(...a.movs.filter(m=>nuevosDias.includes(m.fecha)));
      ST.archivos.push({nombre:a.nombre, movs:a.movs.length, dias:a.dias, fallas:a.fallas.length});
    });
    repetidos.forEach(r=>log("El día "+r.dias.join(", ")+" ya venía en otro archivo: de "+r.archivo+" se ignora","e"));

    todos.sort((a,b)=>a.fecha.localeCompare(b.fecha));
    const conFalla=porArchivo.filter(a=>a.fallas.length);
    ST.validacion={
      ok:!conFalla.length,
      fallas:conFalla.flatMap(a=>a.fallas.map(f=>({...f,archivo:a.nombre}))),
      archivos:porArchivo.length, dias:[...vistos].sort(),
      inicial:todos.length?Math.round((todos[0].saldo-todos[0].importe)*100)/100:0,
      final:todos.length?todos[todos.length-1].saldo:0
    };
    ST.movs=todos; ST.mapaCuit={}; ST.mapaNom={};
    log("Leídos "+porArchivo.length+" archivo(s): "+todos.length+" movimientos en "+vistos.size+" día(s)");
    if(conFalla.length){ ST.listo=true; render(); return; }
    await analizar(todos);
    ST.listo=true; render();
  }catch(e){
    ST.listo=true; ST.movs=[]; ST.validacion=null;
    document.getElementById("app").innerHTML=zonaCarga()+
      '<div class="aviso bad">⛔ <div><b>No se pudo leer.</b><br>'+esc(e.message||String(e))+'</div></div>';
    engancharDrop();
  }
}
