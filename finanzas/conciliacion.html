<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conciliación bancaria · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css?v=83">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="../assets/core.js?v=111"></script>
<style>
  :root{
    --teal:#048782; --teal-deep:#04635F; --teal-med:#0AA89F; --aqua:#5FC8BF;
    --agua:#E2F1EF; --coral:#EC8B5E; --ink:#0E1F1D; --gris:#5F716E; --gris2:#8A9A97;
    --surface:#fff; --bg:#F4F8F7; --line:#DCE8E6; --radius:12px;
    --shadow:0 1px 2px rgba(6,65,62,.05), 0 6px 24px rgba(6,65,62,.06);
    --ok:#1F8A5F; --okbg:#E7F6EC; --warn:#B7791F; --warnbg:#FBF3D9;
    --bad:#C0392B; --badbg:#FBE2E1; --info:#5B8DEF; --infobg:#EAF1FD;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .topbar{background:var(--teal-deep);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:13px;position:sticky;top:0;z-index:30}
  .mono{font-family:Georgia,serif;font-weight:700;font-size:23px;letter-spacing:.5px;line-height:1}
  .mono .y{color:var(--aqua)}
  .topbar .tag{font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:20px}
  .topbar .title{font-weight:700;font-size:15px;margin-left:4px}
  .topbar .back{margin-left:auto;color:#fff;text-decoration:none;font-size:13px;font-weight:600;opacity:.85}
  .topbar .back:hover{opacity:1}
  .wrap{max-width:1320px;margin:0 auto;padding:20px 22px 90px}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px}
  .panel h3{font-size:14.5px;font-weight:800;color:var(--teal-deep);margin-bottom:3px;display:flex;align-items:center;gap:7px}
  .panel .sub{font-size:12px;color:var(--gris);margin-bottom:14px;line-height:1.5}

  /* zona de carga */
  /* display:block es obligatorio: .drop es un <label>, que de fábrica es INLINE, y
     adentro lleva divs de bloque. Inline, el navegador parte el label en fragmentos
     y dibuja el borde punteado en pedazos sueltos corridos a la izquierda, además de
     ignorarle el margin vertical. Se vio al poner el bloque de conexión arriba. */
  .drop{display:block;border:2px dashed var(--teal-med);border-radius:14px;background:linear-gradient(180deg,#F7FCFB,#EDF7F5);
        padding:28px 22px;text-align:center;cursor:pointer;transition:.15s}
  .drop:hover,.drop.over{border-color:var(--teal);background:#E6F4F2;transform:translateY(-1px)}
  .drop .ic{font-size:34px;line-height:1}
  .drop .t{font-size:15px;font-weight:800;color:var(--teal-deep);margin-top:8px}
  .drop .s{font-size:12.5px;color:var(--gris);margin-top:4px}
  .drop input{display:none}
  .selbanco{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 12px;background:#F7FBFA;border:1px solid var(--line);border-radius:10px}
  .selbanco label{font-size:12px;font-weight:800;color:var(--teal-deep);display:flex;align-items:center;gap:8px;cursor:help;text-transform:uppercase;letter-spacing:.5px}
  .selbanco select{font-family:inherit;font-size:13px;font-weight:700;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
  .selbanco .cta-num{font-size:11.5px;color:var(--gris);font-weight:600;cursor:help}
  /* el banco conectado: no necesita archivo, se trae con un botón */
  .conexion{margin-top:12px;padding:13px 15px;background:var(--infobg);border:1px solid #C6D8F8;border-radius:10px}
  .conexion .cx-t{font-size:12.5px;color:#2E5AA8;line-height:1.55;margin-bottom:11px}
  .conexion .cx-e{font-size:11.5px;color:var(--gris);margin-top:10px;line-height:1.6}
  .conexion .cx-e b{color:var(--ink);font-weight:800}
  .conexion .cx-ojo{display:block;margin-top:5px;color:#8A6D1A}
  .archivos{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .arch{font-size:11.5px;font-weight:700;background:var(--agua);color:var(--teal-deep);padding:4px 10px;border-radius:20px;cursor:help}
  .arch b{background:rgba(4,135,130,.16);padding:0 5px;border-radius:9px;margin-left:3px}

  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:11px;margin-bottom:16px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow);text-align:left;font-family:inherit;cursor:pointer;transition:transform .12s,box-shadow .12s;border-left:3px solid var(--teal-med)}
  .kpi:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(6,65,62,.09),0 12px 30px rgba(6,65,62,.10)}
  .kpi.on{border-color:var(--teal);background:var(--agua)}
  .kpi.ok{border-left-color:var(--ok)} .kpi.warn{border-left-color:var(--warn)}
  .kpi.bad{border-left-color:var(--bad)} .kpi.dup{border-left-color:var(--info)}
  .kpi .l{font-size:10.5px;color:var(--gris);font-weight:700;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:5px}
  .kpi .n{font-size:21px;font-weight:800;line-height:1.15;margin-top:5px}
  .kpi .s{font-size:11px;color:var(--gris2);font-weight:600;margin-top:2px}
  .neg{color:var(--bad)}.pos{color:var(--ok)}

  /* avisos */
  .aviso{border-radius:10px;padding:11px 14px;font-size:12.5px;line-height:1.55;margin-bottom:12px;display:flex;gap:9px;align-items:flex-start}
  .aviso.ok{background:var(--okbg);border:1px solid #BFE3CD;color:#14603F}
  .aviso.warn{background:var(--warnbg);border:1px solid #EAD9A0;color:#8A6D1A}
  .aviso.bad{background:var(--badbg);border:1px solid #F0C3C0;color:#8E2A20}
  .aviso.info{background:var(--infobg);border:1px solid #C6D8F8;color:#2E5AA8}
  .aviso b{font-weight:800}

  /* barra de composicion */
  .compo{display:flex;height:26px;border-radius:7px;overflow:hidden;margin:4px 0 8px;border:1px solid var(--line)}
  .compo div{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:#fff;cursor:pointer;transition:.12s}
  .compo div:hover{filter:brightness(1.12)}
  .leyenda{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--gris);font-weight:600}
  .leyenda span{display:flex;align-items:center;gap:5px}
  .leyenda i{width:10px;height:10px;border-radius:3px;display:inline-block}

  /* tabla */
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  .pasos{margin:12px 0 0;padding-left:20px;font-size:12.5px;line-height:1.75;color:var(--ink)}
  .pasos li{margin-bottom:3px}
  .editables{display:flex;flex-direction:column;gap:11px;background:#F4FAF9;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .editables label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--teal-deep)}
  .editables .muted{font-weight:500;font-size:11.5px;line-height:1.5}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:900px}
  thead th{background:#F1F7F6;color:var(--teal-deep);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.4px;
           padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;cursor:help}
  tbody td{padding:9px 10px;border-bottom:1px solid #EEF4F3;vertical-align:top}
  tbody td.fe{white-space:nowrap;font-variant-numeric:tabular-nums}   /* la fecha no se parte y las columnas alinean */
  tbody td.fe .sal{font-size:10.5px;color:var(--gris);opacity:.8;margin-top:2px;font-weight:600}  /* el saldo del banco, en chico, abajo */
  tbody tr:hover{background:#FAFDFC}
  tbody tr:last-child td{border-bottom:0}
  td.r,th.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .muted{color:var(--gris2)}
  .cpto{max-width:330px;line-height:1.4}
  .cpto .cli{font-size:11px;font-weight:800;color:var(--teal-deep);display:block;margin-top:2px}

  .badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
  .b-ok{background:var(--okbg);color:#14603F} .b-warn{background:var(--warnbg);color:#8A6D1A}
  .b-bad{background:var(--badbg);color:#8E2A20} .b-dup{background:var(--infobg);color:#2E5AA8}
  .b-nu{background:#EDF3F2;color:var(--gris)}

  .btn{font-family:inherit;font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;border:1px solid var(--teal);
       background:var(--teal);color:#fff;cursor:pointer;white-space:nowrap}
  .btn:hover{background:var(--teal-deep)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.gh{background:#fff;color:var(--teal-deep)}
  .btn.gh:hover{background:var(--agua)}
  .btn.sm{font-size:11px;padding:4px 9px}
  /* el nowrap de .btn le queda grande a un botón de ancho completo: en pantalla
     angosta el texto se desbordaba por la derecha. Acá sí puede partirse. */
  .btn.wide{width:100%;padding:11px;font-size:13.5px;white-space:normal;line-height:1.35}
  .acciones{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}

  select.cand{font-family:inherit;font-size:11.5px;padding:4px 7px;border:1px solid var(--line);border-radius:7px;background:#fff;max-width:280px}

  .spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .cargando{text-align:center;padding:40px;color:var(--gris);font-size:13px}

  .log{background:#0E1F1D;color:#9FE8DF;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.6;
       border-radius:10px;padding:12px 14px;max-height:230px;overflow:auto;margin-top:12px;white-space:pre-wrap}
  .log .e{color:#FF9B8F} .log .o{color:#8FE3A8}

  /* panel de resolución */
  .resolver{border:2px solid var(--teal);box-shadow:0 6px 28px rgba(4,135,130,.16)}
  .movres{display:flex;align-items:center;gap:13px;flex-wrap:wrap;background:#F4FAF9;border:1px solid var(--line);
          border-radius:9px;padding:9px 12px;margin-bottom:13px;font-size:12.5px}
  .movres b{font-size:16px;font-variant-numeric:tabular-nums}
  .movres .cp{color:var(--gris);flex:1;min-width:180px}
  .busca{width:100%;font-family:inherit;font-size:13.5px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-top:4px}
  .busca:focus{outline:none;border-color:var(--teal)}
  .opts{display:flex;flex-direction:column;gap:3px;margin-top:8px;max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:5px}
  .opt{font-family:inherit;font-size:12.5px;text-align:left;padding:7px 10px;border:0;background:none;border-radius:7px;cursor:pointer;color:var(--ink)}
  .opt:hover{background:var(--agua)}
  .clienteEl{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:13.5px}
  .facs{display:flex;flex-direction:column;gap:4px;max-height:290px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:6px}
  .fac{display:grid;grid-template-columns:24px 1fr auto auto;gap:10px;align-items:center;font-family:inherit;font-size:12.5px;
       text-align:left;padding:7px 9px;border:0;background:none;border-radius:7px;cursor:pointer;color:var(--ink)}
  .fac>*{min-width:0}
  .fac:hover{background:#F4FAF9}
  .fac.on{background:var(--agua);font-weight:700}
  .fac .tk{font-size:15px;color:var(--teal)}
  .fac .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fac .fd{font-size:11px;white-space:nowrap}
  .fac .fm{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
  .cuadre{margin-top:11px;border-radius:9px;padding:10px 13px;font-size:12.5px;border:1px solid}
  .cuadre.ok{background:var(--okbg);border-color:#BFE3CD}
  .cuadre.warn{background:var(--warnbg);border-color:#EAD9A0}
  .cuadre.bad{background:var(--badbg);border-color:#F0C3C0}
  .cuadre div{display:flex;justify-content:space-between;padding:2px 0}
  .cuadre b{font-variant-numeric:tabular-nums}
  .cuadre .dif{border-top:1px dashed rgba(0,0,0,.18);margin-top:5px;padding-top:6px;font-weight:800}
  .tot-sec{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--gris);font-variant-numeric:tabular-nums}
  .seccion-conc h3{user-select:none}
  .seccion-conc h3:hover{color:var(--teal)}
</style>
</head>
<body>
<div class="topbar">
  <div class="mono">E<span class="y">y</span>G</div>
  <span class="tag">Core</span>
  <span class="title">Conciliación bancaria</span>
  <a class="back" href="../index.html">← Volver</a>
</div>
<div class="wrap" id="app">
  <div class="cargando">Cargando…</div>
</div>

<script>
const money=n=>"$"+(n||0).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=EYG.esc;
const rpc=EYG.rpc;

/* ══════════════════════════════════════════════════════════════════════════
   CONFIGURACIÓN — el mapa de códigos del banco.
   Cada código dice QUÉ es el movimiento y QUÉ hay que hacer con él.
   Verificado contra el historial de Federico (agosto–septiembre 2026).
   ══════════════════════════════════════════════════════════════════════════ */
const BANCOS={
  credicoop:{
    nombre:"Credicoop", cuentaBanco:"191-274-015650/8", diario:24, cuenta:359, partner:2043, metodoSalida:21,
    /* OJO: 974 y 1273 NO son comisiones aunque el código lo parezca.
       974 = Transf. Interbanking (un COBRO) · 1273 = entre cuentas propias. */
    codigos:{
      IVAA1:{tipo:"cargo",   sub:"IVA"},
      IVA08:{tipo:"cargo",   sub:"IVA"},
      "2572":{tipo:"cargo",  sub:"Comisión e-cheq"},
      "500": {tipo:"cargo",  sub:"Com. mantenimiento"},
      "505": {tipo:"cargo",  sub:"Com. administrativa"},
      SCECO:{tipo:"impuesto",sub:"SIRCREB",            cta:128},
      IDCC1:{tipo:"impuesto",sub:"Ley 25.413 créditos",cta:259},
      IDCC3:{tipo:"impuesto",sub:"Ley 25.413 débitos", cta:259},
      "1872":{tipo:"cobro",  sub:"Transferencia recibida"},
      "1874":{tipo:"cobro",  sub:"DEBIN"},
      "974": {tipo:"cobro",  sub:"Interbanking"},
      "1871":{tipo:"interna",sub:"Entre cuentas propias"},
      "1273":{tipo:"interna",sub:"Entre cuentas propias (otro banco)"},
      "2002":{tipo:"echeq",  sub:"E-cheq cámara"},
      "2003":{tipo:"echeq",  sub:"E-cheq canje interno"}
    }
  },
  /* Los demás bancos están listados pero SIN mapa de códigos: el lector puede
     funcionar si el formato del archivo es igual, pero la clasificación queda
     en "sin clasificar" y la pantalla lo avisa. Para habilitar uno, hay que ver
     un resumen suyo y agregarle su objeto `codigos`. */
  /* El Macro NO necesita archivo: tiene conexión con el banco (Syncfy, link 8) y las
     líneas las trae Odoo solo. Pero la sincronización no trae el CÓDIGO que sí trae el
     archivo del home banking, así que acá la clasificación va por el TEXTO del concepto.
     Cada patrón se verificó contra el historial del diario 26 el 01/10/2026 (4.361 líneas):
     entre paréntesis, cuántas veces aparece y contra qué cuenta lo resolvió la casa. */
  macro:{
    nombre:"Macro", cuentaBanco:"333209421315913", diario:26, cuenta:361, partner:2092,
    metodoSalida:27, codigos:null,
    /* La conexión se rehizo el 02/10/2026 (la anterior era link 8 / cuenta 2). Si se
       vuelve a crear, estos dos números cambian y hay que actualizarlos acá.
       OJO: el Macro devuelve TRES cuentas —dos en pesos y una en dólares—; la del
       diario es la cuenta corriente 333209421315913. */
    /* la conexion ya NO se escribe a mano: buscarConexion() la encuentra por el numero de cuenta */
    textos:[
      /* ---- impuestos: la casa los imputa DIRECTO a su cuenta, sin factura de por medio ---- */
      {re:"S/DB TASA GRAL",              tipo:"impuesto", sub:"Ley 25.413 débitos",     cta:259, partner:2092},  // 354
      {re:"S/CR TASA GRAL",              tipo:"impuesto", sub:"Ley 25.413 créditos",    cta:259, partner:2092},  // 313
      {re:"RET. ING. BRUTOS SIRCREB",    tipo:"impuesto", sub:"SIRCREB",                cta:128, partner:2092},  // 322
      {re:"DGR SELLOS",                  tipo:"impuesto", sub:"Sellos Santa Fe",        cta:233, partner:2092},
      {re:"Imp de Sellos",               tipo:"impuesto", sub:"Sellos",                 cta:233, partner:2092},
      /* ---- comisiones e intereses del banco ----
         OJO, esto cambió: hasta junio 2026 la casa los imputaba DERECHO a Gastos
         Bancarios, y desde julio 2026 los pasa por Pagos pendientes, o sea contra la
         factura del banco. Se ve con el mismo corte en cuatro conceptos distintos:
         "Comision Trf. MacrOL E-set" 12 a 2 desde julio · "INTER.ADEL.CC S/ACUERD"
         5 a 0 · "MANTENIMIENTO MENSUAL" 2 a 0 · "COMISION CHQ PAG CLEARING" 2 a 0.
         Tiene sentido fiscal: estos cargos llevan IVA y el crédito fiscal está en la
         factura. Por eso NINGUNO lleva `cta`: ponerle una los imputaría a gasto y se
         perdería el cómputo del IVA. */
      {re:"Comision Trf. MacrOL E-set",  tipo:"cargo",    sub:"Comisión transferencia · va contra la factura", partner:2092},  // 241
      {re:"MANTENIMIENTO MENSUAL",       tipo:"cargo",    sub:"Mantenimiento · va contra la factura",          partner:2092},  // 18
      {re:"INTER.ADEL.CC",               tipo:"cargo",    sub:"Intereses de descubierto · va contra la factura", partner:2092},
      /* criterio MIXTO desde julio (4 a Gastos Bancarios, 3 contra la factura): no se
         automatiza, lo decide una persona */
      {re:"COMISION TRANSFERE",          tipo:"cargo",    sub:"Comisión transferencia · decidir a mano",       partner:2092},  // 31
      /* ---- cargos FACTURADOS con IVA: estos NO se imputan directo, van contra la
             factura del banco, porque ahí está el crédito fiscal ---- */
      {re:"DEBITO FISCAL IVA BASICO",     tipo:"cargo",   sub:"IVA · va contra la factura",           partner:2092},  // 215
      {re:"DEBITO FISCAL IVA PERCEPCION", tipo:"cargo",   sub:"Percepción IVA · va contra la factura", partner:2092},  // 197
      {re:"COMISION CHEQUE CONSULTA",     tipo:"cargo",   sub:"Comisión cheques · va contra la factura", partner:2092},// 144
      {re:"COM. SERV DESC NO AUTORIZ",    tipo:"cargo",   sub:"Comisión",               partner:2092},
      /* cae el 27 de cada mes. Hasta junio iba a Gastos Bancarios; desde julio, contra la factura */
      {re:"COMISION CHQ PAG CLEARING",   tipo:"cargo",    sub:"Comisión cheques pagados · va contra la factura", partner:2092},
      /* ---- cheques pagados: se concilian contra el pago emitido ---- */
      {re:"CHEQUE P/CAMARA",             tipo:"echeq",    sub:"Cheque por cámara"},         // 369
      {re:"CHEQUE CANJE INTERNO",        tipo:"echeq",    sub:"Cheque canje interno"},      // 35
      /* ---- préstamos: el contacto es el del banco PRESTAMOS, no el comercial ---- */
      {re:"DEBITO PRESTAMOS REC",        tipo:"prestamo", sub:"Cuota de préstamo",  partner:2422},  // 239
      {re:"OPERAC PRESTAMOS",            tipo:"prestamo", sub:"Alta de préstamo",   partner:2422},  // 16
      /* ---- sueldos e impuestos nacionales ---- */
      {re:"DB PAGO REMUNERACIONES",      tipo:"sueldos",  sub:"Pago de sueldos"},           // 70
      {re:"AFIP",                        tipo:"afip",     sub:"Pago a AFIP"},               // 20
      /* ---- entre cuentas propias: el texto dice el titular, y es EyG ---- */
      {re:"TRANSF DROGUERIA",            tipo:"interna",  sub:"Entre cuentas propias"},     // 154
      {re:"MacrOnline E-set M/T",        tipo:"interna",  sub:"Entre cuentas propias"},     // 196
      {re:"TEF DATANET MT DROGUERIA",    tipo:"interna",  sub:"Entre cuentas propias"},     // 82
      {re:"AUT.SDO.MISMO TIT",           tipo:"interna",  sub:"Entre cuentas propias"},     // 10

const norm=s=>String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\./g,"");
function num(s){
  const t=String(s||"").replace(/\s/g,"").replace(/\$/g,"");
  if(t===""||t==="-") return 0;
  const neg=/^-/.test(t)||/^\(.*\)$/.test(t);
  const v=parseFloat(t.replace(/[()\-]/g,"").replace(/,/g,""))||0;
  return neg?-v:v;
}
const fecha=s=>{const m=String(s||"").trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?m[3]+"-"+m[2]+"-"+m[1]:null;};

function leerArchivo(buf){
  const wb=XLSX.read(buf,{type:"array",raw:false});
  const sh=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(sh,{header:1,defval:"",raw:false});
  const cab=(rows[0]||[]).map(norm);
  const col=(...al)=>{for(const a of al){const i=cab.indexOf(a);if(i>=0)return i;}return -1;};
  const C={fecha:col("fecha"),concepto:col("concepto","detalle","descripcion"),cpbte:col("nrocpbte","nro cpbte","comprobante"),
           debito:col("debito"),credito:col("credito"),saldo:col("saldo"),cod:col("cod","codigo")};
  const faltan=["fecha","concepto","debito","credito","saldo"].filter(k=>C[k]<0);
  if(faltan.length) throw new Error("El archivo no tiene las columnas esperadas: falta "+faltan.join(", ")+". Encabezado leído: "+cab.join(" | "));
  const movs=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i], f=fecha(r[C.fecha]); if(!f) continue;
    const deb=num(r[C.debito]), cre=num(r[C.credito]);
    movs.push({fecha:f, concepto:String(r[C.concepto]||"").trim().replace(/\s+/g," "),
      cpbte:String(r[C.cpbte]||"").trim(), importe:Math.round((cre-deb)*100)/100,
      saldo:num(r[C.saldo]), cod:String(r[C.cod]||"").trim()});
  }
  movs.reverse();                       // el banco los manda del más nuevo al más viejo
  return {movs,encabezado:cab};
}
/* El saldo tiene que encadenar movimiento a movimiento. Si no cierra, el archivo no se usa. */
function validarCadena(movs){
  const f=[];
  for(let i=1;i<movs.length;i++){
    const esp=Math.round((movs[i-1].saldo+movs[i].importe)*100)/100;
    if(Math.abs(esp-movs[i].saldo)>0.005) f.push({i,esperado:esp,real:movs[i].saldo,mov:movs[i]});
  }
  return f;
}

/* El contacto que el mapa del banco da por sabido. Se lee el nombre de Odoo en una
   sola consulta, para no mostrar un id pelado en la pantalla. */
async function aplicarContactoFijo(movs){
  const ids=[...new Set(movs.filter(m=>m.partnerFijo&&!m.cliente).map(m=>m.partnerFijo))];
  if(!ids.length) return;
  const ps=await rpc("res.partner","read",[ids,["name"]]);
  const mp={}; ps.forEach(p=>mp[p.id]={id:p.id,nombre:p.name});
  let n=0;
  movs.forEach(m=>{ if(m.partnerFijo && !m.cliente && mp[m.partnerFijo]){ m.cliente=mp[m.partnerFijo]; m.porMapa=true; n++; } });
  if(n) log("Contacto puesto por el mapa del banco: "+n,"o");
}

/* QUÉ ES CADA MOVIMIENTO. Hay dos caminos porque los bancos no mandan lo mismo:
   el archivo del home banking trae un CÓDIGO (Credicoop), y la sincronización NO lo
   trae, así que ahí hay que leer el TEXTO del concepto (Macro).
   El orden de B.textos importa: los patrones genéricos van últimos, si no se comen
   a los específicos — "TRANSF" pelado se tragaría las transferencias propias. */
function clasificar(m,B){
  m.cta=null; m.partnerFijo=null;
  if(B.codigos){
    const c=B.codigos[m.cod];
    m.tipo=c?c.tipo:"otro"; m.sub=c?c.sub:("código "+(m.cod||"—")); m.cta=c?c.cta:null;
    return;
  }
  if(B.textos){
    const t=String(m.concepto||""), limpio=t.trim();
    /* la liquidación de descuento llega SIN texto: la referencia es sólo números.
       Se comprueba carácter por carácter en vez de con una expresión, para que no
       dependa de escapes que se pierden al editar el archivo. */
    const soloNumeros = limpio.length>6 && limpio.split("").every(ch=>"0123456789 .-".indexOf(ch)>=0);
    for(const r of B.textos){
      const pega = r.soloNumeros ? soloNumeros
                 : (!!r.re && t.toLowerCase().indexOf(r.re.toLowerCase())>=0);
      if(pega){ m.tipo=r.tipo; m.sub=r.sub; m.cta=r.cta||null; m.partnerFijo=r.partner||null; return; }
    }
  }
  m.tipo="otro"; m.sub=B.textos?"el concepto no está en el mapa":("código "+(m.cod||"—"));
}

async function analizar(movs){
  const B=BANCOS[ST.banco];
  const fechas=[...new Set(movs.map(m=>m.fecha))].sort();
  /* Cuando los movimientos vienen de la conexión con el banco, YA SON líneas de Odoo:
     no hay nada que comparar ni que crear, y el paso de duplicados se saltea. */
  const deOdoo = movs.length>0 && movs[0].deOdoo;
  log((deOdoo?"Traído del banco: ":"Archivo leído: ")+movs.length+" movimientos, del "+fechas[0]+" al "+fechas[fechas.length-1]);

  /* ---- 1) lo que YA está cargado en Odoo, por día ---- */
  if(!deOdoo){
  const yaEn=await rpc("account.bank.statement.line","search_read",
    [[["journal_id","=",B.diario],["date","in",fechas]],["date","payment_ref","amount","ref","is_reconciled","to_check","move_id","partner_id"]],
    {limit:0});
  log("Ya cargado en Odoo para esas fechas: "+yaEn.length+" movimientos");

  /* Huella por (fecha|concepto|importe) contando repeticiones: hay movimientos
     legítimamente idénticos (6 comisiones de $600 el mismo día) y NO son duplicados. */
  const clave=m=>m.fecha+"|"+String(m.concepto||m.payment_ref||"").slice(0,60)+"|"+(Math.round((m.amount!==undefined?m.amount:m.importe)*100)/100);
  const pool={}; yaEn.forEach(l=>{const k=clave({fecha:l.date,concepto:l.payment_ref,amount:l.amount});(pool[k]=pool[k]||[]).push(l);});

  movs.forEach(m=>{
    const k=clave(m), lista=pool[k];
    if(lista&&lista.length){ m.yaEsta=lista.shift(); }   // consume una ocurrencia
    else m.yaEsta=null;
  });
  const dup=movs.filter(m=>m.yaEsta).length;
  log(dup?("Detectados "+dup+" movimientos que YA estaban cargados: no se vuelven a crear"):"Ninguno estaba cargado: son todos nuevos",dup?"o":"");
  }

  /* ---- 2) clasificar por el código del banco ---- */
  movs.forEach(m=>{
    clasificar(m,B);
    const cu=String(m.concepto).match(/\b(\d{11})\b/); m.cuit=cu?cu[1]:null;
  });

  /* ---- 3) mapa CUIT → cliente, aprendido del historial ---- */
  await construirMapaCuit();
  movs.forEach(m=>{ m.cliente=(m.cuit&&ST.mapaCuit[m.cuit])?ST.mapaCuit[m.cuit]:null; m.porPadron=false; });
  await resolverPorPadron(movs);
  /* customer_rank y etiquetas de los contactos: sin esto, los dueños (que están
     cargados como clientes) caen en la cola de cobranzas. */
  try{ await cargarFichas(movs); }catch(e){ log("No pude leer las fichas de los contactos: "+((e&&e.message)||e),"o"); }
  /* Tercera fuente: el nombre del titular. Va al final porque el CUIT es más
     preciso, pero rescata los cobros donde el CUIT no está o no se conoce. */
  let porNom=0;
  movs.forEach(m=>{ if(m.cliente) return;
    const t=tituloDe(m.concepto); if(!t) return;
    const c=ST.mapaNom[t]; if(!c) return;
    m.cliente=c; m.porNombre=true; porNom++; });
  if(porNom) log("Identificados por el nombre del titular: "+porNom,"o");
  identificarBancoPropio(movs);
  /* Cuarta fuente: el mapa del banco fija el contacto de lo que siempre es del banco
     (comisiones, impuestos) y de las cuotas de préstamo, que van a su cuenta aparte.
     Va al final y sólo donde no hay contacto, para no pisar un cliente ya identificado. */
  await aplicarContactoFijo(movs);

  /* ---- 4) candidatos para conciliar ---- */
  /* Un movimiento da trabajo mientras no esté cargado Y conciliado. Que ya esté en
     Odoo no quiere decir que esté resuelto: lo normal, cuando se vuelve a subir un día
     que ya se importó, es que la línea exista pero le falte el recibo. Antes acá se
     miraba sólo !m.yaEsta y por eso la pantalla se quedaba sin una sola acción. */
  /* Contra qué se empareja cada tipo. Lo que ENTRA se busca en Recibos pendientes y lo
     que SALE en Pagos pendientes. La liquidación de descuento entra, y su contrapartida
     es el neto de la factura del banco, que está justamente en Recibos pendientes. */
  const ENTRA=["cobro","liquidacion"], SALE=["echeq","interna","pago","prestamo","sueldos","afip"];
  const necesitaRec=movs.some(m=>ENTRA.indexOf(m.tipo)>=0&&abierto(m)), necesitaPag=movs.some(m=>SALE.indexOf(m.tipo)>=0&&abierto(m));
  const abiertas=async cta=>await rpc("account.move.line","search_read",
    [[["account_id","=",cta],["parent_state","=","posted"],["full_reconcile_id","=",false]],
     ["date","debit","credit","move_id","partner_id","amount_residual","name"]],{limit:0});
  const recibos=necesitaRec?await abiertas(CTA_RECIBOS):[];
  const pagos  =necesitaPag?await abiertas(CTA_PAGOS):[];
  log("Partidas abiertas para emparejar: "+recibos.length+" recibos · "+pagos.length+" pagos");

  movs.forEach(m=>{
    m.cands=[];
    if(!abierto(m)) return;
    const pool2 = ENTRA.indexOf(m.tipo)>=0 ? recibos : SALE.indexOf(m.tipo)>=0 ? pagos : [];
    const mismos=pool2.filter(r=>Math.abs(Math.abs(r.amount_residual)-Math.abs(m.importe))<0.005);
    /* E-CHEQ: el banco no dice el proveedor, pero el "Cpbte" del resumen son los
       ULTIMOS 6 DIGITOS del numero de cheque. Verificado el 30/09/2026: Cpbte 448651
       es el cheque 29448651 (Drogueria del Sud, $2.500.000) y Cpbte 825224 es el
       29825224 (Total Medic, $1.000.000), importe exacto en los dos.
       Esto es lo que resuelve el caso que antes era imposible: cuando hay varios pagos
       identicos al mismo proveedor, el importe no alcanza y el numero si. */
    if(m.tipo==="echeq" && m.cpbte && m.cpbte!=="0"){
      const porCh=mismos.filter(r=>{
        const n=(String(r.name||"").match(/Cheque\s+(\d+)/)||[])[1];
        return n && n.endsWith(m.cpbte); });
      if(porCh.length===1){ m.cands=porCh; m.porCheque=true; return; }
    }
    /* El importe solo no alcanza: si además sabemos el cliente, filtramos por él.
       Esto es lo que evita imputarle el cobro al cliente equivocado. */
    const porCli = m.cliente ? mismos.filter(r=>r.partner_id&&r.partner_id[0]===m.cliente.id) : [];
    m.cands = porCli.length ? porCli : mismos;
    m.porCliente = porCli.length>0;
  });
  return movs;
}

/* De qué banco viene (o a cuál va) una transferencia entre cuentas propias.
   Dos condiciones: el concepto trae el CUIT de EyG —sin eso el prefijo 322 aparece en
   más de mil cobros de clientes— y trae un CBU de 22 dígitos. El SIGNO da la dirección
   y el texto la confirma: positivo dice "CBU Origen" (la plata viene de ahí), negativo
   dice "CBU Destino" (la plata va para allá). */
function identificarBancoPropio(movs){
  let n=0, sinMapa=[];
  movs.forEach(m=>{
    m.otroBanco=null;
    if(m.tipo!=="interna") return;
    const txt=String(m.concepto||"");
    if(txt.indexOf(EYG_CUIT)<0) return;              // no es entre cuentas nuestras
    const cbu=txt.match(/\b(\d{22})\b/); if(!cbu) return;
    const pref=cbu[1].slice(0,3), b=CBU_BANCO[pref];
    if(!b){ sinMapa.push(pref); return; }
    if(b.diario===BANCOS[ST.banco].diario) return;   // el CBU es el de la propia cuenta
    m.otroBanco=Object.assign({}, b, {pref, cbu:cbu[1], entra:m.importe>0});
    n++;
  });
  if(n) log("Transferencias entre cuentas propias con el otro banco identificado por el CBU: "+n,"o");
  if(sinMapa.length) log("Prefijos de CBU que no están en el mapa: "+[...new Set(sinMapa)].join(", "),"e");
}

/* Lo que el historial no sabe, lo sabe el padrón: si el CUIT del concepto es el de
   un cliente, es él. Va DESPUÉS del mapa aprendido y nunca lo pisa, porque el mapa
   captura algo que el padrón no puede: quién paga POR quién. Muchos cobros vienen del
   CUIT del dueño, del contador o de un familiar, y ahí el CUIT no es el del cliente.

   Sin esto, un cliente que paga por primera vez queda sin identificar aunque su CUIT
   esté en la ficha — y el cliente NO se puede escribir después: Odoo rechaza tocar una
   línea de extracto ya posteada. O se acierta al cargar, o se corrige a mano en Odoo. */
async function resolverPorPadron(movs){
  const faltan=[...new Set(movs.filter(m=>m.cuit&&!m.cliente).map(m=>m.cuit))];
  if(!faltan.length) return;
  /* El vat se guarda con guiones (27-32331706-8) y el concepto trae los 11 dígitos
     pegados: se buscan las dos formas. El formato es fijo 2-8-1. */
  const variantes=[];
  faltan.forEach(c=>{ variantes.push(c, c.slice(0,2)+"-"+c.slice(2,10)+"-"+c.slice(10)); });
  let ps=[];
  try{
    ps=await rpc("res.partner","search_read",[[["vat","in",variantes]],["id","name","vat","customer_rank"]],{limit:0});
  }catch(e){ log("No pude consultar el padrón por CUIT: "+e.message,"e"); return; }
  const idx={};
  ps.forEach(x=>{ const d=String(x.vat||"").replace(/\D/g,""); if(!d) return; (idx[d]=idx[d]||[]).push(x); });
  let n=0;
  movs.forEach(m=>{
    if(!m.cuit||m.cliente) return;
    const c=idx[m.cuit];
    if(!c||c.length!==1) return;             // si el CUIT está repetido en dos fichas, no se adivina
    m.cliente={id:c[0].id, nombre:c[0].name}; m.porPadron=true; n++;
  });
  if(n) log("Identificados por CUIT en el padrón (no estaban en el historial): "+n,"o");
}

/* El mapa se construye leyendo los cobros que Cobranzas ya imputó: cada uno
   enseña qué CUIT paga por qué cliente. Mejora solo con el uso.

   Y además por el NOMBRE del titular, que viene en el mismo concepto: medido el
   01/10/2026 sobre 2.021 cobros de seis meses, el nombre da 360 claves
   inequívocas de 365 — tan bueno como el CUIT y a veces mejor, porque el CUIT
   del que paga no siempre es el del cliente.

   El CBU NO se usa: se probó y el mismo CBU aparece con 13 clientes distintos
   (es de una cuenta recaudadora, no del pagador). */
async function construirMapaCuit(){
  if(Object.keys(ST.mapaCuit).length || Object.keys(ST.mapaNom).length) return;
  const B=BANCOS[ST.banco];
  const desde=new Date(); desde.setMonth(desde.getMonth()-6);
  const hist=await rpc("account.bank.statement.line","search_read",
    [[["journal_id","=",B.diario],["amount",">",0],["partner_id","!=",false],["date",">=",desde.toISOString().slice(0,10)]],
     ["payment_ref","partner_id"]],{limit:0});
  const m={}, mn={};
  hist.forEach(l=>{
    const id=l.partner_id[0], nombre=l.partner_id[1];
    const c=String(l.payment_ref||"").match(/\b(\d{11})\b/);
    if(c){ const k=c[1]; m[k]=m[k]||{}; m[k][id]=m[k][id]||{id,nombre,veces:0}; m[k][id].veces++; }
    const t=tituloDe(l.payment_ref);
    if(t){ mn[t]=mn[t]||{}; mn[t][id]=mn[t][id]||{id,nombre,veces:0}; mn[t][id].veces++; }
  });
  let unicos=0, unicosN=0;
  Object.keys(m).forEach(cuit=>{
    const opts=Object.values(m[cuit]);
    if(opts.length===1){ ST.mapaCuit[cuit]=opts[0]; unicos++; }   // sólo los inequívocos
  });
  Object.keys(mn).forEach(nom=>{
    const opts=Object.values(mn[nom]);
    if(opts.length===1){ ST.mapaNom[nom]=opts[0]; unicosN++; }
  });
  log("Mapa aprendido de "+hist.length+" cobros: "+unicos+" por CUIT y "+unicosN+" por nombre del titular");
}
/* El titular viene entre el CUIT y la palabra CBU:
   "...Dist. Titular 20125219935-VAR-RICARDO ALBERTO CASTRO CBU Origen: 143..." */
function tituloDe(ref){
  const t=String(ref||"");
  const c=t.match(/\b(\d{11})\b/); if(!c) return null;
  let resto=t.slice(t.indexOf(c[1])+11);
  const j=resto.indexOf("CBU"); if(j>0) resto=resto.slice(0,j);
  resto=resto.replace(/^[-\s]*(VAR|FAC|HAB)?[-\s]*/,"").trim().toUpperCase();
  return resto.length>4 ? resto : null;
}

/* Da trabajo mientras no esté cargado Y conciliado. Es el criterio que manda en
   toda la pantalla: estar en Odoo no es estar resuelto. */
function abierto(m){ return !(m.yaEsta && m.yaEsta.is_reconciled); }

/* El SIGNO del movimiento decide todo el circuito: si la plata SALE es un pago a un
   proveedor (cuenta Proveedores, payment outbound, contra Pagos pendientes); si ENTRA
   es un cobro de un cliente. El panel de resolver es el mismo para los dos lados. */
function sale(m){ return (m.importe||0) < 0; }
const CTA_CLIENTES=52;
/* Los métodos de pago son POR DIARIO. El "Manual" con id 20 es el del Credicoop y Odoo
   rechaza un recibo del Macro que lo use: "el método de pago seleccionado no está
   disponible para este pago". Estaban fijos en los del Credicoop, así que TODO cobro de
   otro banco fallaba al crear el recibo — y como el error iba al registro del final,
   parecía que el botón no hacía nada. Ahora se le preguntan al diario y se guardan. */
const METODOS={};
async function metodoDe(diario, tipo, code){
  const k=diario+"|"+tipo+"|"+code;
  if(METODOS[k]) return METODOS[k];
  const r=await rpc("account.payment.method.line","search_read",
    [[["journal_id","=",diario],["payment_type","=",tipo],["code","=",code]],["id","name"]],{limit:1});
  if(!r.length) throw new Error("este banco no tiene método de pago \""+code+"\" para "+
    (tipo==="inbound"?"cobros":"pagos")+" en Odoo: hay que configurárselo al diario");
  return (METODOS[k]={id:r[0].id, nombre:r[0].name});
}

const LADO = m => sale(m)
  ? {cta:CTA_PROVEEDORES, tipo:"outbound", parte:"supplier", transit:CTA_PAGOS,   quien:"proveedor", doc:"orden de pago"}
  : {cta:CTA_CLIENTES,    tipo:"inbound",  parte:"customer", transit:CTA_RECIBOS, quien:"cliente",   doc:"recibo"};

/* ---- Vigilancia de la conexión ----------------------------------------------
   El corte de la sincronización es SILENCIOSO: el vínculo sigue diciendo "conectado",
   el pedido termina sin error y no trae nada. Pasó con el Macro el 14/10/2026: cuatro
   días sin un solo movimiento mientras se cargaban seis cobros de farmacias contra ese
   mismo diario. Nadie se enteró porque el aviso aparecía sólo DESPUÉS de apretar el
   botón. Así que ahora la pantalla lo mira sola al abrir. */
/* Vínculo de Odoo -> acción que abre el cuadro de claves del banco. Hacen falta porque
   los botones propios del vínculo están ocultos: dependen de un campo (provider_data)
   que el proveedor deja vacío. Si se rehace una conexión, el vínculo cambia de número y
   hay que actualizar este mapa. */
const REVALIDAR={36:1317, 33:1318, 37:1319};
async function vigilarBanco(){
  const B=BANCOS[ST.banco]; if(!B||!B.diario) return;
  try{
    const u=await rpc("account.bank.statement.line","search_read",
      [[["journal_id","=",B.diario]],["date"]],{limit:1, order:"date desc"});
    if(!u.length){ ST.vigila=null; return; }
    const ultimo=u[0].date;
    /* días hábiles desde el último movimiento que mandó el banco (sin sábados ni domingos) */
    let habiles=0;
    const d=new Date(ultimo+"T00:00:00"), hoy=new Date(EYG.argToday()+"T00:00:00");
    while(d<hoy){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w!==0&&w!==6) habiles++; }
    /* lo que ya se cargó contra este banco y el extracto todavía no respalda: eso es lo
       que le da peso al aviso, porque prueba que hubo movimientos de verdad */
    const sinRespaldo=await rpc("account.payment","search_count",
      [[["journal_id","=",B.diario],["date",">",ultimo],["is_matched","=",false]]]);
    /* el id del vínculo, para poder enlazar la pantalla donde se revalida: en Odoo no
       hay menú que lleve ahí y el botón del tablero sólo aparece si la conexión venció */
    let linkId=null;
    try{
      const oc=await rpc("account.online.account","search_read",
        [[["journal_ids","in",[B.diario]]],["account_online_link_id"]],{limit:1});
      if(oc.length && oc[0].account_online_link_id) linkId=oc[0].account_online_link_id[0];
    }catch(e){}
    ST.vigila={ultimo, habiles, sinRespaldo, linkId};
    if(habiles>=2) render();
  }catch(e){ ST.vigila=null; }
}

function engancharDrop(){
  const d=document.getElementById("drop"), f=document.getElementById("file"); if(!d||!f) return;
  f.onchange=e=>{ if(e.target.files.length) procesar([...e.target.files]); };
  ["dragenter","dragover"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove("over");}));
  d.addEventListener("drop",e=>{ const fs=[...e.dataTransfer.files]; if(fs.length) procesar(fs); });
}

function avisoValidacion(){
  const v=ST.validacion; if(!v) return "";
  const cuantos=(v.archivos||1)>1?("Los "+v.archivos+" archivos cierran"):"El archivo cierra";
  const dias=v.dias&&v.dias.length>1?(" — "+v.dias.length+" días, del "+v.dias[0]+" al "+v.dias[v.dias.length-1]):"";
  if(v.ok) return '<div class="aviso ok">✅ <div><b>'+cuantos+' exacto.</b> Los '+ST.movs.length+
    ' movimientos encadenan saldo a saldo, de '+money(v.inicial)+' a '+money(v.final)+dias+'. '+
    'Si un solo importe estuviera mal leído, esta cadena se rompería.</div></div>';
  return '<div class="aviso bad">⛔ <div><b>No cierra la cadena de saldos.</b> Se rompe en '+v.fallas.length+
    ' punto(s). No se carga nada hasta resolverlo — sería meter números que el banco no dice.<br>'+
    v.fallas.slice(0,4).map(f=>"· "+(f.archivo?esc(f.archivo)+", ":"")+"fila "+f.i+
      ": esperaba "+money(f.esperado)+" y el archivo dice "+money(f.real)).join("<br>")+
    '</div></div>';
}

function kpis(M,nuevos,pendConc,cerrados,listos,dudas){
  /* Se calcula ACÁ y no afuera: el KPI vive en esta función, así que una variable
     definida en otra no existe en este scope. Al hacerlo mal, el render entero se
     caía con "cobros is not defined" y la pantalla quedaba sin movimientos. */
  const cobros=M.filter(m=>abierto(m)&&cajonDe(m)==="cliente");
  const k=(id,clase,lbl,n,s,ayuda)=>
    /* Las comillas van como &quot;: el onclick está dentro de un atributo con comillas
       dobles, así que meterle JSON.stringify crudo lo parte al medio y el navegador se
       queda con `filtrar_(` — ningún KPI filtraba. Es el mismo escape que usan los
       botones de elegir cliente, más abajo. */
    '<button class="kpi '+clase+(ST.filtro===id?" on":"")+'" onclick="filtrar_('+JSON.stringify(id).split('"').join("&quot;")+')" title="'+esc(ayuda)+'">'+
    '<div class="l">'+esc(lbl)+'</div><div class="n">'+n+'</div><div class="s">'+esc(s)+'</div></button>';
  const suma=a=>money(a.reduce((s,m)=>s+m.importe,0));
  return '<div class="kpis">'+
    k(null,"","Movimientos",M.length,suma(M),"Todo lo que trae el archivo. Clic para ver todos.")+
    k("nuevo","ok","Nuevos",nuevos.length,suma(nuevos),"Movimientos que todavía no están en Odoo. Son los que se van a cargar.")+
    k("pend","warn","Cargados sin conciliar",pendConc.length,suma(pendConc),"Ya están en Odoo pero les falta el recibo o el pago: siguen dando trabajo. Clic para verlos.")+
    k("cerrado","dup","Conciliados",cerrados.length,suma(cerrados),"Cargados y conciliados. Están cerrados: no hay nada que hacer con ellos.")+
    k("listo","ok","Se resuelven solos",listos.length,suma(listos),"Tienen un único destino posible. Se resuelven sin decidir nada, estén cargados o no.")+
    k("cobros","ok","Cobros de clientes",cobros.length,suma(cobros),"Lo que entró de un cliente y todavía no está imputado a sus facturas. Es la cola de cobranzas: clic para verla sola.")+
    k("duda","warn","Necesitan que decidas",dudas.length,suma(dudas),"O tienen varios candidatos, o no tienen ninguno, o el código no está en el mapa.")+
  '</div>';
}

/* ---------- DE QUIÉN ES CADA PESO QUE ENTRA ------------------------------------------
   "Cobro de cliente" no es "entró plata y tiene un contacto". En esta base los dueños
   (German, Federico, Irene) están cargados con customer_rank alto —40, 21 y 76—, así
   que por marca de Odoo parecen clientes. Y la propia Droguería aparece como contacto
   de sus transferencias entre cuentas. Si no se separan, la cola de cobranzas mezcla
   plata de los socios con pagos de farmacias y no se puede trabajar.

   Cada entrada cae en UN cajón con nombre. Lo que no se puede nombrar queda en
   "sin identificar", que es trabajo pendiente y no se esconde. */
const IDS_EMPRESA=[1,2215,3878,4205];      /* las fichas de la propia Droguería EyG */
const IDS_DUENOS =[15,16,17];              /* Federico Banquero · German Banquero · Irene Ercoli */
const CAT_BANCOS =[64,65];                 /* etiquetas BANCOS y BANCOS / PRESTAMOS */

/* customer_rank y etiquetas de los contactos que aparecen en pantalla. Se piden una vez
   por análisis: sin esto no hay forma de saber si un contacto es cliente de verdad. */
async function cargarFichas(movs){
  const ids=[...new Set(movs.map(m=>{
    const q=m.cliente||(m.yaEsta&&m.yaEsta.partner_id?{id:m.yaEsta.partner_id[0]}:null);
    return q?q.id:null;
  }).filter(Boolean))];
  ST.fichas=ST.fichas||{};
  const faltan=ids.filter(id=>!ST.fichas[id]);
  if(!faltan.length) return;
  const P=await rpc("res.partner","read",[faltan,["name","customer_rank","supplier_rank","category_id","vat"]]);
  P.forEach(p=>{ST.fichas[p.id]=p;});
}

/* El cajón de una entrada de plata. Devuelve null si no es una entrada. */
function cajonDe(m){
  if(!(m.importe>0)) return null;
  if(m.tipo==="impuesto"||m.tipo==="cargo") return "banco";
  if(m.tipo==="interna") return "propia";
  if(m.tipo==="liquidacion") return "liquidacion";
  if(m.tipo==="prestamo") return "prestamo";
  const q=m.cliente||(m.yaEsta&&m.yaEsta.partner_id?{id:m.yaEsta.partner_id[0],nombre:m.yaEsta.partner_id[1]}:null);
  if(!q) return "sinIdentificar";
  if(IDS_EMPRESA.indexOf(q.id)>=0) return "propia";
  if(IDS_DUENOS.indexOf(q.id)>=0)  return "duenos";
  const fi=(ST.fichas||{})[q.id];
  if(!fi) return "cliente";                                   /* sin ficha leída: no se descarta */
  if((fi.category_id||[]).some(c=>CAT_BANCOS.indexOf(c)>=0)) return "banco";
  if((fi.customer_rank||0)>0) return "cliente";
  if((fi.supplier_rank||0)>0) return "proveedor";             /* devolución de un proveedor */
  return "otroContacto";
}
const CAJONES={
  cliente:       {rot:"Cobros de clientes",        ayuda:"Farmacias e instituciones que nos compran. Es la cola de cobranzas."},
  duenos:        {rot:"De los dueños",             ayuda:"Plata que entra de German, Federico o Irene. No es una venta: cómo se registra lo define el contador."},
  propia:        {rot:"Entre cuentas propias",     ayuda:"Plata que EyG se pasó de una cuenta a otra. Se resuelve como transferencia interna."},
  liquidacion:   {rot:"Descuento de cheques",      ayuda:"Lo que acredita el banco al descontar cheques. Necesita el resumen de liquidación."},
  prestamo:      {rot:"Préstamos",                 ayuda:"Acreditación de un crédito bancario. Necesita el cuadro de cuotas."},
  banco:         {rot:"Del banco",                 ayuda:"Reintegros, intereses y movimientos del propio banco."},
  proveedor:     {rot:"De un proveedor",           ayuda:"Entró plata de alguien que es proveedor: suele ser una devolución o una nota de crédito."},
  otroContacto:  {rot:"Contacto que no es cliente",ayuda:"Tiene ficha en Odoo pero no está marcado como cliente ni proveedor."},
  sinIdentificar:{rot:"Sin identificar",           ayuda:"El banco no mandó el CUIT, o ese CUIT no tiene ficha en Odoo. Hay que averiguar quién es."}
};

/* Encabezado de la cola de cobranzas. Aparece sólo cuando se está mirando «Cobros de
   clientes», y dice lo único que importa para trabajarla: de cuántos ya se sabe quién
   pagó y de cuántos no, porque son dos trabajos distintos. Lo que no tiene cliente hay
   que averiguarlo; lo que sí, se imputa a sus facturas y se cierra. */
function panelCobranzas(M){
  if(ST.filtro!=="cobros") return "";
  const entra=M.filter(m=>abierto(m)&&m.importe>0);
  const por={}; entra.forEach(function(m){ const c=cajonDe(m)||"sinIdentificar"; (por[c]=por[c]||[]).push(m); });
  const C=por.cliente||[];
  const tot=a=>a.reduce((s,m)=>s+m.importe,0);
  const quien=m=>m.cliente||(m.yaEsta&&m.yaEsta.partner_id?{id:m.yaEsta.partner_id[0],nombre:m.yaEsta.partner_id[1]}:null);
  const con=C.filter(quien), sin=C.filter(m=>!quien(m));
  const nombres={}; con.forEach(function(m){ const q=quien(m); nombres[q.nombre]=(nombres[q.nombre]||0)+m.importe; });
  const top=Object.entries(nombres).sort((a,b)=>b[1]-a[1]).slice(0,6);
  /* el resto de los cajones, para que se vea POR QUÉ el número es más chico de lo que
     uno esperaría: la plata que entra no es toda cobranza */
  const otros=Object.keys(por).filter(k=>k!=="cliente").sort((a,b)=>tot(por[b])-tot(por[a]));
  return '<div class="panel"><h3>💰 Cobros de clientes · '+C.length+' por '+money(tot(C))+'</h3>'+
    '<div class="sub">Sólo farmacias e instituciones que nos compran. Cada uno se resuelve con su botón en la tabla de abajo: '+
    '<b>Resolver</b> abre la cuenta corriente del que pagó para tildar qué facturas cancela. Si lo que pagó no da exacto, '+
    'la diferencia de hasta '+money(TOPE_AJUSTE)+' se cierra sola contra Ajuste por redondeo, sin nota de crédito.</div>'+
    (C.length?'<div class="kpis" style="margin:0 0 11px">'+
      '<div class="kpi ok"><div class="l">Se sabe quién pagó</div><div class="n">'+con.length+'</div>'+
        '<div class="s">'+money(tot(con))+' · listos para imputar</div></div>'+
      '<div class="kpi '+(sin.length?"warn":"")+'"><div class="l">Falta saber quién</div><div class="n">'+sin.length+'</div>'+
        '<div class="s">'+money(tot(sin))+'</div></div>'+
      '<div class="kpi"><div class="l">Clientes distintos</div><div class="n">'+Object.keys(nombres).length+'</div>'+
        '<div class="s">en los '+con.length+' identificados</div></div>'+
    '</div>'+
    (top.length?'<div class="sub" style="margin:0 0 5px">Los que más mandaron:</div><div class="leyenda">'+
      top.map(x=>'<span><b>'+esc(x[0]).slice(0,28)+'</b> '+money(x[1])+'</span>').join("")+'</div>':"")
    :'<div class="aviso ok" style="margin:0">✔️ <div>No hay cobros de clientes pendientes de imputar en este banco.</div></div>')+
    (otros.length?'<div class="sub" style="margin:13px 0 5px"><b>El resto de lo que entró no es cobranza</b>, y por eso no está en la lista:</div>'+
      '<div class="tw"><table><thead><tr><th>Qué es</th><th class="r">Movs.</th><th class="r">Importe</th><th>Qué hace falta</th></tr></thead><tbody>'+
      otros.map(function(k){ const C2=CAJONES[k]||{rot:k,ayuda:""};
        return '<tr><td><b>'+esc(C2.rot)+'</b></td><td class="r muted">'+por[k].length+'</td>'+
          '<td class="r"><b>'+money(tot(por[k]))+'</b></td><td class="muted">'+esc(C2.ayuda)+'</td></tr>';
      }).join("")+'</tbody></table></div>':"")+
    '</div>';
}

function composicion(porTipo){
  const tot=Object.values(porTipo).reduce((s,a)=>s+a.length,0); if(!tot) return "";
  const orden=["cobro","cargo","impuesto","echeq","interna","otro"].filter(t=>porTipo[t]);
  return '<div class="panel"><h3>🧭 De qué se compone el día</h3>'+
    '<div class="sub">Cada tipo de movimiento tiene su propio circuito. Tocá una franja para filtrar la tabla.</div>'+
    '<div class="compo">'+orden.map(t=>{
      const p=porTipo[t].length/tot*100;
      return '<div style="width:'+p.toFixed(2)+'%;background:'+TIPOS[t].color+'" onclick="filtrarTipo_('+JSON.stringify(t)+')" '+
        'title="'+esc(TIPOS[t].lbl+": "+porTipo[t].length+" movimientos. "+TIPOS[t].ayuda)+'">'+(p>7?porTipo[t].length:"")+'</div>';
    }).join("")+'</div>'+
    '<div class="leyenda">'+orden.map(t=>'<span title="'+esc(TIPOS[t].ayuda)+'"><i style="background:'+TIPOS[t].color+'"></i>'+
      esc(TIPOS[t].lbl)+' · '+porTipo[t].length+'</span>').join("")+'</div></div>';
}

/* Antes este panel desaparecía en cuanto no había movimientos NUEVOS, y con él todos
   los botones: subir de nuevo un día ya importado dejaba la pantalla muerta aunque
   quedaran cobros sin recibo. Ahora el panel vive mientras quede algo ABIERTO, venga
   de un archivo nuevo o de una importación anterior. */
function panelAcciones(nuevos,pendConc,cerrados,listos,dudas){
  /* Cuando los movimientos los trajo el banco no hay cadena de saldos que validar
     —ni archivo—, así que esa condición sólo se le exige al camino del archivo. */
  const deOdoo = ST.movs.length>0 && ST.movs[0].deOdoo;
  if(!deOdoo && (!ST.validacion||!ST.validacion.ok)) return "";
  const t=ST.trabajando, abiertos=nuevos.length+pendConc.length;
  /* Las que ya están cargadas, sabemos de quién son, y les falta el contacto. */
  const sinCto = ST.movs.filter(m=>m.yaEsta && !m.yaEsta.partner_id && m.cliente && abierto(m));
  const bContactos = sinCto.length
    ? '<button class="btn'+((nuevos.length||listos.length)?" gh":"")+'" onclick="pedirConfirmarCtos()" '+(t?"disabled":"")+'>'+
      'Poner el contacto a '+sinCto.length+' línea'+(sinCto.length===1?"":"s")+'</button>' : "";

  if(!abiertos) return '<div class="aviso ok">✔️ <div><b>Este día ya está cerrado.</b> '+
    'Los '+ST.movs.length+' movimientos están cargados y conciliados: no queda nada por hacer. Podés subir otro día.</div></div>';

  /* Los cobros nuevos que van a entrar SIN contacto. Se avisa antes de cargar
     porque después no hay vuelta: Odoo no deja escribir el contacto en una línea
     ya conciliada. En esta base el 99,5% de los cobros lo tiene. */
  const mudos = nuevos.filter(m=>!m.cliente && m.importe>0 && m.tipo!=="impuesto" && m.tipo!=="cargo");
  const bCargar = nuevos.length
    ? '<button class="btn" onclick="pedirConfirmarCarga()" '+(t?"disabled":"")+'>'+(t?'<span class="spin"></span> ':"")+
      'Cargar los '+nuevos.length+' movimientos nuevos</button>' : "";
  const bResolver = listos.length
    ? '<button class="btn'+(nuevos.length?" gh":"")+'" onclick="pedirConfirmarMasivo()" '+(t?"disabled":"")+'>'+(t&&!nuevos.length?'<span class="spin"></span> ':"")+
      'Resolver los '+listos.length+' que no tienen dudas</button>' : "";

  /* De dónde viene el trabajo, dicho en una línea, para que no haya que deducirlo. */
  const origen = nuevos.length && pendConc.length
      ? '<b>'+nuevos.length+'</b> movimientos son nuevos y <b>'+pendConc.length+'</b> ya estaban cargados pero sin conciliar.'
    : nuevos.length
      ? '<b>'+nuevos.length+'</b> movimientos son nuevos.'
      : 'Los '+ST.movs.length+' movimientos <b>ya estaban cargados</b>, pero <b>'+pendConc.length+'</b> siguen sin conciliar: les falta el recibo o el pago.';

  return '<div class="panel"><h3>⚙️ Qué se puede hacer ahora</h3>'+
    '<div class="sub">Se carga <b>todo</b> el extracto (si no, el saldo del banco no cuadra) y se resuelve solo lo que no deja dudas: '+
    'impuestos y cargos a su cuenta, cobros con un único recibo posible, y <b>transferencias entre cuentas propias</b> '+
    '(crea la transferencia en Odoo y su contrapartida). Lo ambiguo queda abajo para que lo decidas vos.</div>'+
    (bCargar||bResolver||bContactos ? '<div class="acciones">'+bCargar+bResolver+bContactos+'</div>' : "")+
    (mudos.length?'<div class="aviso warn" style="margin:0 0 9px">⚠️ <div><b>'+mudos.length+' cobro'+(mudos.length===1?"":"s")+' va'+(mudos.length===1?"":"n")+' a entrar sin contacto.</b> '+
      'Conviene resolverlo antes con el botón <b>¿De quién es?</b> de la tabla de abajo. '+
      'Si no sabés de quién son, se pueden cargar igual: el contacto se puede escribir después, '+
      'pero es un trámite (el asiento tiene que pasar a borrador y volver a publicarse), '+
      'y si para entonces la línea ya está conciliada hay que rearmar la conciliación.</div></div>':"")+
    '<div class="aviso info" style="margin:0">💡 <div>'+origen+' De los <b>'+abiertos+'</b> que dan trabajo, '+
    '<b>'+listos.length+'</b> tienen un destino único y <b>'+dudas.length+'</b> necesitan una decisión tuya'+
    (dudas.length?', abajo uno por uno':"")+'. Nada se concilia si hay más de un candidato posible.'+
    (cerrados.length?' Los otros '+cerrados.length+' ya están conciliados.':"")+'</div></div></div>';
}

function filtrar(M){
  if(!ST.filtro) return M;
  if(ST.filtro==="nuevo")   return M.filter(m=>!m.yaEsta);
  if(ST.filtro==="pend")    return M.filter(m=>m.yaEsta&&!m.yaEsta.is_reconciled);
  if(ST.filtro==="cerrado") return M.filter(m=>m.yaEsta&&m.yaEsta.is_reconciled);
  if(ST.filtro==="cobros")  return M.filter(m=>abierto(m)&&cajonDe(m)==="cliente");
  const auto = m => m.tipo==="impuesto"||m.tipo==="cargo"||m.cands.length===1||(m.tipo==="interna"&&m.otroBanco);
  if(ST.filtro==="listo")   return M.filter(m=>abierto(m)&&auto(m));
  if(ST.filtro==="duda")    return M.filter(m=>abierto(m)&&!auto(m)&&(m.cands.length>1||m.cands.length===0&&EMPAREJA.indexOf(m.tipo)>=0||m.tipo==="otro"));
  if(ST.filtro.startsWith("t:")) return M.filter(m=>m.tipo===ST.filtro.slice(2));
  return M;
}
window.filtrar_=id=>{ ST.filtro=(ST.filtro===id?null:id); render(); };

/* ---------- PONERLE EL CLIENTE A UN MOVIMIENTO ANTES DE CARGARLO ----------
   Odoo NO deja escribir el contacto en una línea de extracto ya posteada y
   conciliada: "No puede hacer esta modificación en un asiento contable
   conciliado". O se acierta en el create, o hay que romper la conciliación.
   Por eso la asignación tiene que poder hacerse ACÁ, antes de cargar.
   En esta base el 99,5% de los cobros tiene contacto: es el estándar de la casa
   y lo que hace que la cuenta corriente del cliente sirva para algo. */
window.asignar=(i)=>{ ST.asig=(ST.asig===i?null:i); ST.asigOpts=null; render(); if(ST.asig!==null) irAlCuadro();
  const el=document.getElementById("qasig"); if(el) el.focus(); };
window.buscarAsig=async(txt)=>{
  if(!txt||txt.length<3){ ST.asigOpts=null; pintarAsig(); return; }
  const d=txt.replace(/[^0-9]/g,"");
  const dom = d.length>=3 ? ["|",["name","ilike",txt],["vat","like",d]] : [["name","ilike",txt]];
  try{ ST.asigOpts=await rpc("res.partner","search_read",[[["customer_rank",">",0]].concat(dom),["id","name","vat"]],{limit:10}); }
  catch(e){ ST.asigOpts=[]; }
  pintarAsig();
};
function pintarAsig(){
  const el=document.getElementById("optsAsig"); if(!el) return;
  el.innerHTML=!ST.asigOpts?"":(ST.asigOpts.length?ST.asigOpts.map(o=>
    '<button class="opt" onclick="ponerCliente('+o.id+','+JSON.stringify(o.name).split('"').join("&quot;")+')">'+
    esc(o.name)+(o.vat?' <span class="muted">· '+esc(o.vat)+'</span>':"")+'</button>').join("")
    :'<div class="muted" style="padding:8px">Ningún cliente con ese nombre o CUIT.</div>');
}
window.ponerCliente=(id,nombre)=>{
  const m=ST.movs[ST.asig]; if(!m) return;
  m.cliente={id,nombre}; m.porMano=true; ST.asig=null; ST.asigOpts=null;
  log("Asignado a mano: "+money(m.importe)+" → "+nombre,"o");
  render();
};
window.filtrarTipo_=t=>{ const k="t:"+t; ST.filtro=(ST.filtro===k?null:k); render(); };

/* ESCRIBIR EL CONTACTO EN UNA LÍNEA YA CARGADA.
   Odoo rechaza el write de frente. El camino que funciona es: borrador → escribir →
   publicar. Y tiene una trampa que cuesta caro: al escribir el contacto, Odoo REGENERA
   la contrapartida y la manda a la cuenta por defecto del diario (Cuenta transitoria),
   aunque estuviera imputada a Gastos Bancarios o a Impuestos. Hay que devolverla. */
async function ponerContactoEnOdoo(lineaId, moveId, partnerId, ctaBanco){
  const mv0=await rpc("account.move","read",[[moveId],["line_ids","state"]]);
  const ls0=await rpc("account.move.line","read",[mv0[0].line_ids,["id","account_id","debit","credit"]]);
  const orig=ls0.find(x=>x.account_id[0]!==ctaBanco);
  const ctaOrig=orig?orig.account_id[0]:null;
  const antes=ls0.map(x=>x.account_id[0]+"|"+x.debit.toFixed(2)+"|"+x.credit.toFixed(2)).sort().join(" ");
  if(mv0[0].state==="posted") await rpc("account.move","button_draft",[[moveId]]);
  await rpc("account.bank.statement.line","write",[[lineaId],{partner_id:partnerId}]);
  await rpc("account.move","action_post",[[moveId]]);
  const mv1=await rpc("account.move","read",[[moveId],["line_ids"]]);
  const ls1=await rpc("account.move.line","read",[mv1[0].line_ids,["id","account_id","debit","credit"]]);
  const otra=ls1.find(x=>x.account_id[0]!==ctaBanco);
  if(otra && ctaOrig && otra.account_id[0]!==ctaOrig)
    await rpc("account.move.line","write",[[otra.id],{account_id:ctaOrig}]);
  /* control: el asiento tiene que haber quedado IGUAL, sólo con el contacto puesto */
  const ls2=await rpc("account.move.line","read",[mv1[0].line_ids,["account_id","debit","credit"]]);
  const ahora=ls2.map(x=>x.account_id[0]+"|"+x.debit.toFixed(2)+"|"+x.credit.toFixed(2)).sort().join(" ");
  const v=await rpc("account.bank.statement.line","read",[[lineaId],["partner_id","is_reconciled"]]);
  if(!v[0].partner_id || v[0].partner_id[0]!==partnerId) throw new Error("el contacto no quedó escrito");
  if(antes!==ahora) throw new Error("el asiento cambió al escribir el contacto");
  return v[0];
}

window.aplicarContacto=async i=>{
  ST.cto=null;
  const m=ST.movs[i]; if(!m||!m.yaEsta||!m.cliente||ST.trabajando) return;
  const B=BANCOS[ST.banco];
  ST.trabajando=true; render();
  try{
    const v=await ponerContactoEnOdoo(m.yaEsta.id, m.yaEsta.move_id[0], m.cliente.id, B.cuenta);
    m.yaEsta.partner_id=[m.cliente.id,m.cliente.nombre];
    m.yaEsta.is_reconciled=v.is_reconciled;
    m.ctoRecien=true;   /* para que la fila diga que ACABA de pasar, y no haya que adivinarlo */
    log("Contacto escrito en Odoo: "+money(m.importe)+" del "+m.fecha+" → "+m.cliente.nombre,"ok");
  }catch(e){
    log("No se pudo poner el contacto en la línea "+m.yaEsta.id+": "+((e&&e.message)||e),"e");
  }
  ST.trabajando=false; render();
};

/* El contacto de todas las que faltan, de una. Van EN SERIE a propósito: cada una pasa
   su asiento a borrador y lo vuelve a publicar, y hacer eso en paralelo sobre el mismo
   diario es pedir problemas. Si una falla se sigue con las demás y se dice cuál fue. */
window.accionContactos=async ()=>{
  ST.ctos=null;
  if(ST.trabajando) return;
  const B=BANCOS[ST.banco];
  const lista=ST.movs.filter(m=>m.yaEsta && !m.yaEsta.partner_id && m.cliente && abierto(m));
  if(!lista.length) return;
  ST.trabajando=true; render();
  let ok=0, mal=0;
  for(const m of lista){
    try{
      const v=await ponerContactoEnOdoo(m.yaEsta.id, m.yaEsta.move_id[0], m.cliente.id, B.cuenta);
      m.yaEsta.partner_id=[m.cliente.id,m.cliente.nombre];
      m.yaEsta.is_reconciled=v.is_reconciled; m.ctoRecien=true; ok++;
    }catch(e){ mal++; log("Línea "+m.yaEsta.id+" ("+money(m.importe)+"): "+((e&&e.message)||e),"e"); }
  }
  log("Contactos escritos: "+ok+(mal?"  ·  fallaron "+mal:""), mal?"o":"ok");
  ST.trabajando=false; render();
};

function estadoDe(m){
  if(m.yaEsta && m.yaEsta.is_reconciled)
    return '<span class="badge b-dup">ya cargado · conciliado</span>';
  if(m.yaEsta){
    /* Cargado pero sin conciliar: sigue dando trabajo, y el badge tiene que decirlo.
       Debajo se agrega el estado normal, porque a este también se le buscan candidatos. */
    const pre='<span class="badge b-warn">cargado · falta conciliar</span>'+
      (m.yaEsta.to_check?' <span class="badge b-warn">a revisar</span>':"")+
      /* el contacto a la vista: es lo que Federico echaba de menos cuando la línea
         la cargaba el módulo en vez de él a mano */
      (!m.yaEsta.partner_id?' <span class="badge b-bad">sin contacto</span>':"")+
      (m.ctoRecien?' <span class="badge b-ok" title="Se escribió el contacto en la línea del extracto en Odoo. No se toca nada más: ni el importe, ni las cuentas, ni la conciliación.">✓ contacto escrito recién</span>':"")+' ';
    if(m.tipo==="impuesto") return pre+'<span class="badge b-ok">va a su cuenta</span>';
    if(m.tipo==="cargo")    return pre+'<span class="badge b-warn">va a la liquidación</span>';
    if(m.cands.length===1)  return pre+'<span class="badge b-ok">'+(m.porCheque?"por N° de cheque":m.porCliente?"cliente + importe":"un candidato")+'</span>';
    if(m.cands.length>1)    return pre+'<span class="badge b-warn">'+m.cands.length+' candidatos</span>';
    if(m.tipo==="interna"&&m.otroBanco) return pre+'<span class="badge b-ok">'+esc(m.otroBanco.nombre)+'</span>';
    if(EMPAREJA.indexOf(m.tipo)>=0) return pre+'<span class="badge b-bad">falta la contraparte</span>';
    return pre;
  }
  if(m.tipo==="impuesto") return '<span class="badge b-ok">va a su cuenta</span>';
  if(m.tipo==="cargo")    return '<span class="badge b-warn">va a la liquidación</span>';
  if(m.cands.length===1)  return '<span class="badge b-ok">'+(m.porCheque?"por N° de cheque":m.porCliente?"cliente + importe":"un candidato")+'</span>';
  if(m.cands.length>1)    return '<span class="badge b-warn">'+m.cands.length+' candidatos</span>';
  if(m.tipo==="interna"&&m.otroBanco) return '<span class="badge b-ok">'+esc(m.otroBanco.nombre)+'</span>';
  if(m.tipo==="echeq"&&m.cpbte) return '<span class="badge b-bad">cheque '+esc(m.cpbte)+' sin pago cargado</span>';
  if(EMPAREJA.indexOf(m.tipo)>=0) return '<span class="badge b-bad">falta la contraparte</span>';
  return '<span class="badge b-nu">sin clasificar</span>';
}
function accionDe(m,i){
  /* Si todavía no está en Odoo y no se sabe de quién es, se puede asignar ahora
     —y sólo ahora: después de cargarlo, Odoo ya no deja. */
  if(!m.yaEsta && !m.cliente && m.importe>0 && m.tipo!=="impuesto" && m.tipo!=="cargo")
    return '<button class="btn sm '+(ST.asig===i?"":"gh")+'" onclick="asignar('+i+')" '+
      'title="El contacto no se puede poner después de cargar la línea: Odoo lo rechaza en un asiento conciliado.">'+
      (ST.asig===i?"Cerrar":"¿De quién es?")+'</button>';
  /* Sólo lo conciliado queda sin acción. Lo que está cargado pero sin conciliar
     sigue siendo accionable: es justamente el trabajo pendiente de Tesorería. */
  if(!abierto(m)) return '<span class="muted">—</span>';
  /* Ya está cargada, no tiene contacto, y sabemos de quién es: se puede escribir AHORA.
     Odoo no deja escribirlo de frente, pero sí pasando el asiento a borrador, escribiendo
     y volviéndolo a publicar. Se ofrece sólo en las líneas sin conciliar: si estuviera
     conciliada habría que romper y rearmar la conciliación, y eso no va en un botón. */
  if(m.yaEsta && !m.yaEsta.partner_id && m.cliente)
    return '<button class="btn sm" onclick="pedirConfirmarCto('+i+')" title="Escribe «'+esc(m.cliente.nombre)+
      '» como contacto de esta línea. El asiento pasa a borrador, se escribe y se vuelve a publicar; '+
      'si la contrapartida estaba imputada a una cuenta, se la devuelve a esa cuenta.">Poner contacto</button>';
  if(m.cands.length>1) return '<select class="cand" id="sel'+i+'"><option value="">Elegí cuál…</option>'+
    m.cands.map(c=>{
      const n=c.partner_id?String(c.partner_id[1]):"";
      const corto=n.length>46 ? n.slice(0,45)+"…" : n;      // entra el cartel del formato nuevo
      return '<option value="'+c.id+'">'+esc(String(c.move_id[1]).slice(0,26))+" · "+(n?esc(corto):"sin cliente")+'</option>';
    }).join("")+
    '</select> <button class="btn sm" onclick="pedirConfirmarDirecto('+i+',+(document.getElementById(\'sel'+i+'\')||{}).value)">Aplicar</button>';
  if(m.cands.length===0&&(m.tipo==="cobro"||m.tipo==="echeq"))
    return '<button class="btn sm '+(RES.i===i?"":"gh")+'" onclick="abrirResolver('+i+')" '+
      'title="'+(m.tipo==="echeq"
        ? "El cheque "+esc(m.cpbte||"")+" no tiene su pago cargado en Odoo. El banco no dice a quién se le pagó: hay que buscar el beneficiario en el home banking y cargarlo acá."
        : "Elegí el cliente y a qué facturas se imputa.")+'">'+
      (RES.i===i?"Cerrar":"Resolver")+'</button>';
  /* Un solo candidato: no hay nada que decidir, pero igual se puede cerrar de a uno. */
  if(m.cands.length===1)
    return '<button class="btn sm gh" onclick="pedirConfirmarDirecto('+i+')" title="'+
      (m.porCheque?"El N° de cheque "+esc(m.cpbte)+" lo identifica sin ambigüedad. ":"")+
      'Concilia este movimiento contra su único candidato. También lo hace el botón de arriba, junto con los demás.">Conciliar</button>';
  /* Impuestos y cargos: su destino es único y no tienen candidato que mostrar.
     El texto dice QUÉ va a pasar y con qué botón: "lo resuelve el botón de arriba"
     no decía ni una cosa ni la otra, y dejaba la sensación de que algo había fallado. */
  if(m.tipo==="impuesto")
    return '<span class="muted" style="font-size:11.5px" title="No necesita contraparte: se imputa derecho a su cuenta contable.">'+
      'listo para imputar'+(m.cta?' a la cuenta '+m.cta:"")+' · con «Resolver»</span>';
  if(m.tipo==="cargo")
    return '<span class="muted" style="font-size:11.5px" title="'+(m.cta
      ? "Se imputa derecho a su cuenta de gasto."
      : "Este cargo lo factura el banco con IVA, así que no se imputa derecho a gasto: se concilia contra la factura del banco, que es donde está el crédito fiscal.")+'">'+
      (m.cta?'listo para imputar a gasto · con «Resolver»':'espera la factura del banco')+'</span>';
  /* Transferencia entre cuentas propias con el otro banco ya identificado: se puede
     resolver de una, sin esperar el extracto del otro banco. */
  if(m.tipo==="interna"&&m.otroBanco&&m.cands.length===0)
    return '<button class="btn sm" onclick="pedirConfirmarTransf('+i+')" title="Crea la transferencia interna en Odoo. La contrapartida en '+esc(m.otroBanco.nombre)+' la genera Odoo sola, y después se concilia esta línea.">'+
      'Transferir '+(m.otroBanco.entra?"desde":"a")+' '+esc(m.otroBanco.nombre.replace(/^Banco /,""))+'</button>';
  if(m.cands.length===0&&m.tipo==="interna")
    return '<span class="muted" style="font-size:11.5px">falta cargar el otro extracto</span>';
  return '<span class="muted">—</span>';
}

/* Dos secciones: primero lo que falta resolver (es lo accionable), después lo
   que ya está cerrado. Lo conciliado va colapsado: está para consultar, no
   para trabajar. */
function tablas(M){
  const conc=M.filter(m=>m.yaEsta&&m.yaEsta.is_reconciled);
  const pend=M.filter(m=>!(m.yaEsta&&m.yaEsta.is_reconciled));
  const sumar=a=>a.reduce((s,m)=>s+m.importe,0);
  let h="";
  h+=tabla(pend,"⏳ Falta resolver","Lo que todavía no está conciliado: o falta cargarlo, o falta la contraparte, o hay que decidir cuál es. "+
      "Es donde hay trabajo.", pend.length?money(sumar(pend)):"", "pend");
  if(conc.length){
    h+='<div class="panel seccion-conc"><h3 onclick="ST.verConc=!ST.verConc;render()" style="cursor:pointer">'+
      (ST.verConc?"▾":"▸")+' ✅ Ya conciliados <span class="badge b-ok">'+conc.length+'</span>'+
      '<span class="tot-sec">'+money(sumar(conc))+'</span></h3>'+
      '<div class="sub">Cerrados contra su contraparte. Están acá para consultar, no requieren nada.</div>'+
      (ST.verConc?filasDe(conc):'<button class="btn gh sm" onclick="ST.verConc=true;render()">Ver los '+conc.length+'</button>')+
      '</div>';
  }
  return h;
}
function tabla(M,titulo,sub,total,cual){
  if(!M.length) return '<div class="panel"><h3>'+titulo+' <span class="badge b-ok">0</span></h3>'+
    '<div class="sub">'+(cual==="pend"?"No queda nada por resolver de este archivo. 🎉":"Nada acá.")+'</div></div>';
  return '<div class="panel"><h3>'+titulo+' <span class="badge '+(cual==="pend"?"b-warn":"b-ok")+'">'+M.length+'</span>'+
    (ST.filtro?' <span class="badge b-nu">filtrado</span>':"")+
    (total?'<span class="tot-sec">'+total+'</span>':"")+'</h3>'+
    '<div class="sub">'+esc(sub)+'</div>'+filasDe(M)+'</div>';
}
function filasDe(M){
  /* De lo más nuevo a lo más viejo: lo que acaba de pasar en el banco es lo que
     interesa primero. El extracto llega del día más viejo al más nuevo, así que se
     da vuelta y después se ordena por fecha; el sort es estable, así que dentro de
     un mismo día queda el orden invertido del extracto — que es el orden en que el
     banco los manda. El índice de la acción sale de ST.movs, no de esta lista, así
     que reordenar acá no desalinea ningún botón. */
  const filas=M.slice().reverse().sort((a,b)=> a.fecha<b.fecha ? 1 : a.fecha>b.fecha ? -1 : 0);
  return '<div class="tw"><table><thead><tr>'+
    '<th title="Fecha del movimiento según el banco. Ordenado de lo más reciente a lo más viejo.">Fecha</th>'+
    '<th title="El texto tal cual lo manda el banco, y debajo el cliente si se pudo identificar">Concepto</th>'+
    '<th title="Qué tipo de movimiento es, según el código que manda el banco">Tipo</th>'+
    '<th class="r" title="Positivo entra, negativo sale">Importe</th>'+
    '<th title="Si ya estaba cargado, si se resuelve solo, o si necesita una decisión">Estado</th>'+
    '<th title="Qué se puede hacer con este movimiento">Acción</th>'+
    '</tr></thead><tbody>'+
    filas.map((m,i)=>'<tr>'+
      /* con el año: el extracto puede traer movimientos de más de un año y dd/mm solo
         no alcanza para saber de cuál es */
      '<td class="muted fe">'+m.fecha.slice(8)+"/"+m.fecha.slice(5,7)+"/"+m.fecha.slice(0,4)+
        /* Debajo, el saldo que quedó en el banco después de este movimiento. El banco no
           manda la hora (le pone la misma a todos los del día), y este dato dice lo mismo
           y mejor: en qué orden pasaron y cómo iba quedando la cuenta. */
        (m.saldo===null||m.saldo===undefined?"" :
          '<div class="sal" title="Saldo que quedó en la cuenta del banco después de este movimiento, según el propio banco.">'+money(m.saldo)+'</div>')+
        '</td>'+
      '<td class="cpto">'+esc(m.concepto.slice(0,92))+(m.concepto.length>92?"…":"")+
        (m.cliente
          ? '<span class="cli" title="'+(m.porMano
              ? "Lo elegiste vos antes de cargar."
              : m.porPadron
              ? "El CUIT del concepto es el de este cliente en su ficha. Es la primera vez que paga desde este CUIT, así que no estaba en el historial."
              : m.porNombre
              ? "Identificado por el nombre del titular que viene en el concepto: ese nombre ya pagó antes por este cliente."
              : "Aprendido del historial: este CUIT ya pagó antes por este cliente.")+'">→ '+esc(m.cliente.nombre)+
            (m.porMano?' <span class="badge b-ok" style="font-size:9.5px">a mano</span>'
             :m.porPadron?' <span class="badge b-ok" style="font-size:9.5px">por CUIT</span>'
             :m.porNombre?' <span class="badge b-ok" style="font-size:9.5px">por nombre</span>':"")+'</span>'
          : (m.cuit?'<span class="cli muted" title="El CUIT no figura en ninguna ficha ni pagó antes. Si sabés quién es, elegilo al resolver: después de cargar la línea Odoo ya no deja escribir el cliente.">CUIT '+m.cuit+' · sin identificar</span>':""))+'</td>'+
      '<td><span class="badge b-nu" title="'+esc(TIPOS[m.tipo].ayuda)+'">'+esc(m.sub)+'</span></td>'+
      '<td class="r '+(m.importe<0?"neg":"pos")+'"><b>'+money(m.importe)+'</b></td>'+
      '<td>'+estadoDe(m)+'</td>'+
      '<td>'+accionDe(m,ST.movs.indexOf(m))+'</td></tr>').join("")+
    '</tbody></table></div>';
}

/* ══════════════════════════════════════════════════════════════════════════
   ACCIONES — lo único que escribe en Odoo
   ══════════════════════════════════════════════════════════════════════════ */
async function conTrabajo(fn){
  if(ST.trabajando) return;
  ST.trabajando=true; ST.error=null; render();
  try{ await fn(); }
  /* El error iba SÓLO al registro del final, abajo de todo: quien apretaba el botón
     veía que no pasaba nada y no se enteraba de por qué. Ahora además queda arriba. */
  catch(e){ ST.error=(e&&e.message)||String(e); log("ERROR: "+ST.error,"e"); }
  ST.trabajando=false;
  await reAnalizar();
}
async function reAnalizar(){
  ST.mapaCuit={};                       // se reconstruye: puede haber aprendido clientes nuevos
  await analizar(ST.movs);
  render();
}

/* Carga las líneas que faltan. NUNCA pisa lo que ya está: los que tienen
   `yaEsta` se saltean, y el estado de cuenta del día se reusa si existe. */

   Regla del módulo: nada se escribe en Odoo sin decir antes qué se va a hacer. Estos
   tres no conciliaban, pero sí escriben: poner el contacto toca un asiento publicado
   (hay que pasarlo a borrador y volver a publicarlo) y cargar crea las líneas del

/* --- cargar los movimientos nuevos a Odoo --- */
window.pedirConfirmarCarga=()=>{ ST.carga=true; render(); irAlCuadro(); };
window.cerrarCarga=()=>{ ST.carga=null; render(); };
function panelCarga(){
  if(!ST.carga) return "";
  const B=BANCOS[ST.banco];
  const nuevos=ST.movs.filter(m=>!m.yaEsta);

window.accionCargar=()=>conTrabajo(async()=>{
  ST.carga=null;   /* el cuadro ya cumplió */
  const B=BANCOS[ST.banco];
  const nuevos=ST.movs.filter(m=>!m.yaEsta);
  if(!nuevos.length){ log("No hay movimientos nuevos para cargar"); return; }
  const porDia={}; nuevos.forEach(m=>{(porDia[m.fecha]=porDia[m.fecha]||[]).push(m);});

  for(const dia of Object.keys(porDia).sort()){
    const delDia=ST.movs.filter(m=>m.fecha===dia);          // todos, para los saldos del día
    const aCargar=porDia[dia];
    let stId=null;
    const exist=await rpc("account.bank.statement","search_read",
      [[["journal_id","=",B.diario],["date","=",dia]],["id","name"]],{limit:1});
    if(exist.length){ stId=exist[0].id; log("Reuso el estado de cuenta del "+dia+" que ya existía"); }
    else{
      const ini=Math.round((delDia[0].saldo-delDia[0].importe)*100)/100;
      const fin=delDia[delDia.length-1].saldo;
      const r=await rpc("account.bank.statement","create",[[{
        name:"BCRED Estado de cuenta "+dia, date:dia, journal_id:B.diario,
        balance_start:ini, balance_end_real:fin}]]);
      stId=Array.isArray(r)?r[0]:r;
      log("Estado de cuenta del "+dia+": "+money(ini)+" → "+money(fin));
    }
    let ok=0;
    for(const m of aCargar){
      await rpc("account.bank.statement.line","create",[[{
        date:m.fecha, journal_id:B.diario, statement_id:stId,
        payment_ref:m.concepto, amount:m.importe,
        partner_id: m.cliente ? m.cliente.id : false,     // el cliente va ACÁ: después no se puede
        ref:(m.cpbte&&m.cpbte!=="0"?"Cpbte "+m.cpbte+" · ":"")+"Cod "+m.cod}]]);
      ok++;
    }
    log("Cargados "+ok+" movimientos del "+dia,"o");
  }
});

/* ---------- CUADRO DEL BOTÓN MASIVO Y DE LA TRANSFERENCIA ---------------------------
   Los dos escribían de una. El masivo es el que más cuidado merece: toca varios
   movimientos seguidos y crea pagos de verdad. El cuadro arma la MISMA lista que va a
   recorrer el proceso, agrupada por lo que le va a hacer a cada uno. */

/* Qué le va a hacer el botón masivo a cada movimiento. Mismo orden de decisión que
   accionResolver: si cambia uno hay que cambiar el otro. */
function destinoMasivo(m){
  if(!m.yaEsta || m.yaEsta.is_reconciled) return null;
  if(m.tipo==="interna" && m.otroBanco) return "transferencia";
  if(m.tipo==="impuesto" && m.cta)      return "impuesto";
  if(m.tipo==="cargo")                  return "cargo";
  if((m.cands||[]).length===1)          return "candidato";
  return null;
}
window.pedirConfirmarMasivo=()=>{ ST.masivo=true; render(); irAlCuadro(); };
window.cerrarMasivo=()=>{ ST.masivo=null; render(); };

function panelMasivo(){
  if(!ST.masivo) return "";
  const B=BANCOS[ST.banco];
  const lista=ST.movs.map(m=>({m, d:destinoMasivo(m)})).filter(x=>x.d);
  if(!lista.length) return '<div class="panel resolver"><h3>👁️ No quedó nada para resolver solo</h3>'+
    '<div class="sub">Ningún movimiento tiene hoy un destino único.</div>'+
    '<div class="acciones"><button class="btn gh" onclick="cerrarMasivo()">Cerrar</button></div></div>';
  const por={}; lista.forEach(x=>(por[x.d]=por[x.d]||[]).push(x.m));

  const QUE={

    cargo:        ["Cargos del banco","Se crea un pago a nombre del banco por cada uno y se concilia. Lleva el método de pago de "+esc(B.nombre)+"."],
    candidato:    ["Con un único comprobante posible","Se cruza cada uno con su comprobante. No hay nada que elegir: hay uno solo."],
    transferencia:["Entre cuentas propias","Se crea la transferencia y su contrapartida en el otro banco, y se concilia."]

  const detalle=k=>por[k].slice(0,40).map(function(m){
    const q = k==="candidato" ? ((m.cands[0].partner_id&&m.cands[0].partner_id[1])||(m.cliente&&m.cliente.nombre)||"")
            : k==="transferencia" ? (m.otroBanco.entra? m.otroBanco.nombre+" → "+B.nombre : B.nombre+" → "+m.otroBanco.nombre)
            : esc(m.sub||"");
    const contra = k==="candidato" ? esc(String(m.cands[0].move_id[1]).slice(0,26)) : "";
    return '<tr><td class="muted">'+esc(m.fecha)+'</td>'+

      '<td>'+esc(String(q).slice(0,34))+'</td>'+
