<script>
const money=n=>"$"+(n||0).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=EYG.esc;
const rpc=EYG.rpc;

/* ══════════════════════════════════════════════════════════════════════════
   CONFIGURACIÓN — el mapa de códigos del banco.
   Cada código dice QUÉ es el movimiento y QUÉ hay que hacer con él.
   Verificado contra el historial de Federico (agosto–septiembre 2026).
   ══════════════════════════════════════════════════════════════════════════ */
const BANCOS={
  credicoop:{
    nombre:"Credicoop", cuentaBanco:"191-274-015650/8", diario:24, cuenta:359, partner:2043, metodoSalida:21,
    /* OJO: 974 y 1273 NO son comisiones aunque el código lo parezca.
       974 = Transf. Interbanking (un COBRO) · 1273 = entre cuentas propias. */
    codigos:{
      IVAA1:{tipo:"cargo",   sub:"IVA"},
      IVA08:{tipo:"cargo",   sub:"IVA"},
      "2572":{tipo:"cargo",  sub:"Comisión e-cheq"},
      "500": {tipo:"cargo",  sub:"Com. mantenimiento"},
      "505": {tipo:"cargo",  sub:"Com. administrativa"},
      SCECO:{tipo:"impuesto",sub:"SIRCREB",            cta:128},
      IDCC1:{tipo:"impuesto",sub:"Ley 25.413 créditos",cta:259},
      IDCC3:{tipo:"impuesto",sub:"Ley 25.413 débitos", cta:259},
      "1872":{tipo:"cobro",  sub:"Transferencia recibida"},
      "1874":{tipo:"cobro",  sub:"DEBIN"},
      "974": {tipo:"cobro",  sub:"Interbanking"},
      "1871":{tipo:"interna",sub:"Entre cuentas propias"},
      "1273":{tipo:"interna",sub:"Entre cuentas propias (otro banco)"},
      "2002":{tipo:"echeq",  sub:"E-cheq cámara"},
      "2003":{tipo:"echeq",  sub:"E-cheq canje interno"}
    }
  },
  /* Los demás bancos están listados pero SIN mapa de códigos: el lector puede
     funcionar si el formato del archivo es igual, pero la clasificación queda
     en "sin clasificar" y la pantalla lo avisa. Para habilitar uno, hay que ver
     un resumen suyo y agregarle su objeto `codigos`. */
  macro:     {nombre:"Macro",             cuentaBanco:"333209421315913",  diario:26, cuenta:361, partner:2092, codigos:null},
  bbva:      {nombre:"BBVA",              cuentaBanco:"282-036215/1",     diario:25, cuenta:360, partner:2667, codigos:null},
  santafe:   {nombre:"Santa Fe",          cuentaBanco:"00004034106204",   diario:77, cuenta:397, partner:3919, codigos:null},
  municipal: {nombre:"Municipal Rosario", cuentaBanco:"",                 diario:87, cuenta:400, partner:4038, codigos:null},
  nacion:    {nombre:"Nación",            cuentaBanco:"30354480100005",   diario:14, cuenta:345, partner:4045, codigos:null}
};
const CTA_TRANSIT=349, CTA_RECIBOS=350, CTA_PAGOS=351, CTA_PROVEEDORES=148;
const CTA_PUENTE=356;                 // 6.0.00.00.01 Transferencia de liquidez
const EYG_CUIT="30716356988";         // el CUIT propio: marca las transferencias entre cuentas nuestras
const EYG_PARTNER=1;                  // Droguería EyG S.R.L. como contraparte de la transferencia

/* ---------- QUÉ BANCO ES CADA CBU ----------
   Los 3 primeros dígitos del CBU son la entidad. OJO: los números de cuenta que los
   diarios tienen cargados en Odoo NO son CBU (Nación figura como 30354480100005), así
   que no sirven para esto. Este mapa se armó cruzando las líneas del extracto que traen
   CBU contra las transferencias internas que la casa ya había resuelto, el 30/09/2026:
   065 acertó 29 de 29 · 285 4 de 4 · 011 3 de 3 más un precedente idéntico · 330 6 de 7.

   'metodo' es el payment_method_line_id Manual OUTBOUND de ese diario, que es el que se
   necesita para crear la transferencia desde el banco de origen. */
const CBU_BANCO={
  "191":{diario:24, nombre:"Banco Credicoop",        metodo:21},
  "011":{diario:14, nombre:"Banco Nación",           metodo:16},
  "285":{diario:26, nombre:"Banco Macro",            metodo:27},
  "017":{diario:25, nombre:"Banco BBVA",             metodo:24},
  "330":{diario:77, nombre:"Banco Santa Fe",         metodo:96},
  "065":{diario:87, nombre:"Banco Municipal Rosario",metodo:106},
  "016":{diario:27, nombre:"Mercado Pago",           metodo:31},
  "322":{diario:27, nombre:"Mercado Pago",           metodo:31},
};
const TIPOS={
  cargo:   {lbl:"Comisiones e IVA", color:"#B7791F", ayuda:"Cargos del banco que van a la liquidación (LI-A): comisiones, IVA e intereses."},
  impuesto:{lbl:"Impuestos",        color:"#8E5FBF", ayuda:"SIRCREB e Impuesto Ley 25.413. Se imputan directo a su cuenta, sin pago de por medio."},
  cobro:   {lbl:"Cobros",           color:"#1F8A5F", ayuda:"Plata que entra de clientes. Se concilia contra el recibo que carga Cobranzas."},
  echeq:   {lbl:"E-cheq pagados",   color:"#C0392B", ayuda:"Cheques electrónicos debitados. Se concilian contra el pago emitido."},
  interna: {lbl:"Entre cuentas",    color:"#5B8DEF", ayuda:"Transferencias entre cuentas propias. Se concilian con el extracto del otro banco."},
  otro:    {lbl:"Sin clasificar",   color:"#8A9A97", ayuda:"El código del banco no está en el mapa. Hay que decidirlo a mano."}
};

/* ══════════════════════════════════════════════════════════════════════════
   LECTOR DEL ARCHIVO
   ══════════════════════════════════════════════════════════════════════════ */
const norm=s=>String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\./g,"");
function num(s){
  const t=String(s||"").replace(/\s/g,"").replace(/\$/g,"");
  if(t===""||t==="-") return 0;
  const neg=/^-/.test(t)||/^\(.*\)$/.test(t);
  const v=parseFloat(t.replace(/[()\-]/g,"").replace(/,/g,""))||0;
  return neg?-v:v;
}
const fecha=s=>{const m=String(s||"").trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?m[3]+"-"+m[2]+"-"+m[1]:null;};

function leerArchivo(buf){
  const wb=XLSX.read(buf,{type:"array",raw:false});
  const sh=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(sh,{header:1,defval:"",raw:false});
  const cab=(rows[0]||[]).map(norm);
  const col=(...al)=>{for(const a of al){const i=cab.indexOf(a);if(i>=0)return i;}return -1;};
  const C={fecha:col("fecha"),concepto:col("concepto","detalle","descripcion"),cpbte:col("nrocpbte","nro cpbte","comprobante"),
           debito:col("debito"),credito:col("credito"),saldo:col("saldo"),cod:col("cod","codigo")};
  const faltan=["fecha","concepto","debito","credito","saldo"].filter(k=>C[k]<0);
  if(faltan.length) throw new Error("El archivo no tiene las columnas esperadas: falta "+faltan.join(", ")+". Encabezado leído: "+cab.join(" | "));
  const movs=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i], f=fecha(r[C.fecha]); if(!f) continue;
    const deb=num(r[C.debito]), cre=num(r[C.credito]);
    movs.push({fecha:f, concepto:String(r[C.concepto]||"").trim().replace(/\s+/g," "),
      cpbte:String(r[C.cpbte]||"").trim(), importe:Math.round((cre-deb)*100)/100,
      saldo:num(r[C.saldo]), cod:String(r[C.cod]||"").trim()});
  }
  movs.reverse();                       // el banco los manda del más nuevo al más viejo
  return {movs,encabezado:cab};
}
/* El saldo tiene que encadenar movimiento a movimiento. Si no cierra, el archivo no se usa. */
function validarCadena(movs){
  const f=[];
  for(let i=1;i<movs.length;i++){
    const esp=Math.round((movs[i-1].saldo+movs[i].importe)*100)/100;
    if(Math.abs(esp-movs[i].saldo)>0.005) f.push({i,esperado:esp,real:movs[i].saldo,mov:movs[i]});
  }
  return f;
}

/* ══════════════════════════════════════════════════════════════════════════
   ESTADO
   ══════════════════════════════════════════════════════════════════════════ */
const ST={banco:"credicoop", movs:[], archivos:[], verConc:false, filtro:null, mapaCuit:{}, listo:false, trabajando:false, logs:[]};

function log(msg,clase){ ST.logs.push({msg,clase,t:new Date()}); pintarLog(); }
function pintarLog(){
  const el=document.getElementById("log"); if(!el) return;
  el.innerHTML=ST.logs.map(l=>'<span class="'+(l.clase||"")+'">'+
    String(l.t.toTimeString().slice(0,8))+"  "+esc(l.msg)+"</span>").join("\n");
  el.scrollTop=el.scrollHeight;
}

/* ══════════════════════════════════════════════════════════════════════════
   ANÁLISIS: duplicados, clasificación y candidatos
   ══════════════════════════════════════════════════════════════════════════ */
async function analizar(movs){
  const B=BANCOS[ST.banco];
  const fechas=[...new Set(movs.map(m=>m.fecha))].sort();
  log("Archivo leído: "+movs.length+" movimientos, del "+fechas[0]+" al "+fechas[fechas.length-1]);

  /* ---- 1) lo que YA está cargado en Odoo, por día ---- */
  const yaEn=await rpc("account.bank.statement.line","search_read",
    [[["journal_id","=",B.diario],["date","in",fechas]],["date","payment_ref","amount","ref","is_reconciled","to_check","move_id","partner_id"]],
    {limit:0});
  log("Ya cargado en Odoo para esas fechas: "+yaEn.length+" movimientos");

  /* Huella por (fecha|concepto|importe) contando repeticiones: hay movimientos
     legítimamente idénticos (6 comisiones de $600 el mismo día) y NO son duplicados. */
  const clave=m=>m.fecha+"|"+String(m.concepto||m.payment_ref||"").slice(0,60)+"|"+(Math.round((m.amount!==undefined?m.amount:m.importe)*100)/100);
  const pool={}; yaEn.forEach(l=>{const k=clave({fecha:l.date,concepto:l.payment_ref,amount:l.amount});(pool[k]=pool[k]||[]).push(l);});

  movs.forEach(m=>{
    const k=clave(m), lista=pool[k];
    if(lista&&lista.length){ m.yaEsta=lista.shift(); }   // consume una ocurrencia
    else m.yaEsta=null;
  });
  const dup=movs.filter(m=>m.yaEsta).length;
  log(dup?("Detectados "+dup+" movimientos que YA estaban cargados: no se vuelven a crear"):"Ninguno estaba cargado: son todos nuevos",dup?"o":"");

  /* ---- 2) clasificar por el código del banco ---- */
  movs.forEach(m=>{
    const c=B.codigos[m.cod];
    m.tipo=c?c.tipo:"otro"; m.sub=c?c.sub:("código "+(m.cod||"—")); m.cta=c?c.cta:null;
    const cu=String(m.concepto).match(/\b(\d{11})\b/); m.cuit=cu?cu[1]:null;
  });

  /* ---- 3) mapa CUIT → cliente, aprendido del historial ---- */
  await construirMapaCuit();
  movs.forEach(m=>{ m.cliente=(m.cuit&&ST.mapaCuit[m.cuit])?ST.mapaCuit[m.cuit]:null; m.porPadron=false; });
  await resolverPorPadron(movs);
  identificarBancoPropio(movs);

  /* ---- 4) candidatos para conciliar ---- */
  /* Un movimiento da trabajo mientras no esté cargado Y conciliado. Que ya esté en
     Odoo no quiere decir que esté resuelto: lo normal, cuando se vuelve a subir un día
     que ya se importó, es que la línea exista pero le falte el recibo. Antes acá se
     miraba sólo !m.yaEsta y por eso la pantalla se quedaba sin una sola acción. */
  const necesitaRec=movs.some(m=>m.tipo==="cobro"&&abierto(m)), necesitaPag=movs.some(m=>(m.tipo==="echeq"||m.tipo==="interna")&&abierto(m));
  const abiertas=async cta=>await rpc("account.move.line","search_read",
    [[["account_id","=",cta],["parent_state","=","posted"],["full_reconcile_id","=",false]],
     ["date","debit","credit","move_id","partner_id","amount_residual","name"]],{limit:0});
  const recibos=necesitaRec?await abiertas(CTA_RECIBOS):[];
  const pagos  =necesitaPag?await abiertas(CTA_PAGOS):[];
  log("Partidas abiertas para emparejar: "+recibos.length+" recibos · "+pagos.length+" pagos");

  movs.forEach(m=>{
    m.cands=[];
    if(!abierto(m)) return;
    const pool2 = m.tipo==="cobro" ? recibos : (m.tipo==="echeq"||m.tipo==="interna") ? pagos : [];
    const mismos=pool2.filter(r=>Math.abs(Math.abs(r.amount_residual)-Math.abs(m.importe))<0.005);
    /* E-CHEQ: el banco no dice el proveedor, pero el "Cpbte" del resumen son los
       ULTIMOS 6 DIGITOS del numero de cheque. Verificado el 30/09/2026: Cpbte 448651
       es el cheque 29448651 (Drogueria del Sud, $2.500.000) y Cpbte 825224 es el
       29825224 (Total Medic, $1.000.000), importe exacto en los dos.
       Esto es lo que resuelve el caso que antes era imposible: cuando hay varios pagos
       identicos al mismo proveedor, el importe no alcanza y el numero si. */
    if(m.tipo==="echeq" && m.cpbte && m.cpbte!=="0"){
      const porCh=mismos.filter(r=>{
        const n=(String(r.name||"").match(/Cheque\s+(\d+)/)||[])[1];
        return n && n.endsWith(m.cpbte); });
      if(porCh.length===1){ m.cands=porCh; m.porCheque=true; return; }
    }
    /* El importe solo no alcanza: si además sabemos el cliente, filtramos por él.
       Esto es lo que evita imputarle el cobro al cliente equivocado. */
    const porCli = m.cliente ? mismos.filter(r=>r.partner_id&&r.partner_id[0]===m.cliente.id) : [];
    m.cands = porCli.length ? porCli : mismos;
    m.porCliente = porCli.length>0;
  });
  return movs;
}

/* De qué banco viene (o a cuál va) una transferencia entre cuentas propias.
   Dos condiciones: el concepto trae el CUIT de EyG —sin eso el prefijo 322 aparece en
   más de mil cobros de clientes— y trae un CBU de 22 dígitos. El SIGNO da la dirección
   y el texto la confirma: positivo dice "CBU Origen" (la plata viene de ahí), negativo
   dice "CBU Destino" (la plata va para allá). */
function identificarBancoPropio(movs){
  let n=0, sinMapa=[];
  movs.forEach(m=>{
    m.otroBanco=null;
    if(m.tipo!=="interna") return;
    const txt=String(m.concepto||"");
    if(txt.indexOf(EYG_CUIT)<0) return;              // no es entre cuentas nuestras
    const cbu=txt.match(/\b(\d{22})\b/); if(!cbu) return;
    const pref=cbu[1].slice(0,3), b=CBU_BANCO[pref];
    if(!b){ sinMapa.push(pref); return; }
    if(b.diario===BANCOS[ST.banco].diario) return;   // el CBU es el de la propia cuenta
    m.otroBanco=Object.assign({}, b, {pref, cbu:cbu[1], entra:m.importe>0});
    n++;
  });
  if(n) log("Transferencias entre cuentas propias con el otro banco identificado por el CBU: "+n,"o");
  if(sinMapa.length) log("Prefijos de CBU que no están en el mapa: "+[...new Set(sinMapa)].join(", "),"e");
}

/* Lo que el historial no sabe, lo sabe el padrón: si el CUIT del concepto es el de
   un cliente, es él. Va DESPUÉS del mapa aprendido y nunca lo pisa, porque el mapa
   captura algo que el padrón no puede: quién paga POR quién. Muchos cobros vienen del
   CUIT del dueño, del contador o de un familiar, y ahí el CUIT no es el del cliente.

   Sin esto, un cliente que paga por primera vez queda sin identificar aunque su CUIT
   esté en la ficha — y el cliente NO se puede escribir después: Odoo rechaza tocar una
   línea de extracto ya posteada. O se acierta al cargar, o se corrige a mano en Odoo. */
async function resolverPorPadron(movs){
  const faltan=[...new Set(movs.filter(m=>m.cuit&&!m.cliente).map(m=>m.cuit))];
  if(!faltan.length) return;
  /* El vat se guarda con guiones (27-32331706-8) y el concepto trae los 11 dígitos
     pegados: se buscan las dos formas. El formato es fijo 2-8-1. */
  const variantes=[];
  faltan.forEach(c=>{ variantes.push(c, c.slice(0,2)+"-"+c.slice(2,10)+"-"+c.slice(10)); });
  let ps=[];
  try{
    ps=await rpc("res.partner","search_read",[[["vat","in",variantes]],["id","name","vat","customer_rank"]],{limit:0});
  }catch(e){ log("No pude consultar el padrón por CUIT: "+e.message,"e"); return; }
  const idx={};
  ps.forEach(x=>{ const d=String(x.vat||"").replace(/\D/g,""); if(!d) return; (idx[d]=idx[d]||[]).push(x); });
  let n=0;
  movs.forEach(m=>{
    if(!m.cuit||m.cliente) return;
    const c=idx[m.cuit];
    if(!c||c.length!==1) return;             // si el CUIT está repetido en dos fichas, no se adivina
    m.cliente={id:c[0].id, nombre:c[0].name}; m.porPadron=true; n++;
  });
  if(n) log("Identificados por CUIT en el padrón (no estaban en el historial): "+n,"o");
}

/* El mapa se construye leyendo los cobros que Cobranzas ya imputó: cada uno
   enseña qué CUIT paga por qué cliente. Mejora solo con el uso. */
async function construirMapaCuit(){
  if(Object.keys(ST.mapaCuit).length) return;
  const B=BANCOS[ST.banco];
  const desde=new Date(); desde.setMonth(desde.getMonth()-6);
  const hist=await rpc("account.bank.statement.line","search_read",
    [[["journal_id","=",B.diario],["amount",">",0],["partner_id","!=",false],["date",">=",desde.toISOString().slice(0,10)]],
     ["payment_ref","partner_id"]],{limit:0});
  const m={};
  hist.forEach(l=>{
    const c=String(l.payment_ref||"").match(/\b(\d{11})\b/); if(!c) return;
    const k=c[1]; m[k]=m[k]||{};
    const id=l.partner_id[0]; m[k][id]=m[k][id]||{id,nombre:l.partner_id[1],veces:0}; m[k][id].veces++;
  });
  let unicos=0;
  Object.keys(m).forEach(cuit=>{
    const opts=Object.values(m[cuit]);
    if(opts.length===1){ ST.mapaCuit[cuit]=opts[0]; unicos++; }   // sólo los inequívocos
  });
  log("Mapa CUIT→cliente aprendido de "+hist.length+" cobros: "+unicos+" clientes identificables");
}

/* Da trabajo mientras no esté cargado Y conciliado. Es el criterio que manda en
   toda la pantalla: estar en Odoo no es estar resuelto. */
function abierto(m){ return !(m.yaEsta && m.yaEsta.is_reconciled); }

/* El SIGNO del movimiento decide todo el circuito: si la plata SALE es un pago a un
   proveedor (cuenta Proveedores, payment outbound, contra Pagos pendientes); si ENTRA
   es un cobro de un cliente. El panel de resolver es el mismo para los dos lados. */
function sale(m){ return (m.importe||0) < 0; }
const CTA_CLIENTES=52;
const LADO = m => sale(m)
  ? {cta:CTA_PROVEEDORES, tipo:"outbound", parte:"supplier", transit:CTA_PAGOS,   quien:"proveedor", doc:"orden de pago"}
  : {cta:CTA_CLIENTES,    tipo:"inbound",  parte:"customer", transit:CTA_RECIBOS, quien:"cliente",   doc:"recibo"};

/* ══════════════════════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════════════════════ */
function render(){
  const app=document.getElementById("app");
  if(!ST.listo){ app.innerHTML=zonaCarga(); engancharDrop(); return; }
  const M=ST.movs;
  const nuevos  = M.filter(m=>!m.yaEsta);                          // no están en Odoo
  const pendConc= M.filter(m=>m.yaEsta&&!m.yaEsta.is_reconciled);  // están, pero sin conciliar
  const cerrados= M.filter(m=>m.yaEsta&&m.yaEsta.is_reconciled);   // cargados y conciliados
  const abiertos= M.filter(abierto);                               // todo lo que falta: nuevos + pendConc
  const porTipo={}; M.forEach(m=>{(porTipo[m.tipo]=porTipo[m.tipo]||[]).push(m);});
  const auto = m => m.tipo==="impuesto"||m.tipo==="cargo"||m.cands.length===1||(m.tipo==="interna"&&m.otroBanco);
  const listos=abiertos.filter(auto);
  const dudas =abiertos.filter(m=>!auto(m)&&(m.cands.length>1||m.cands.length===0&&["cobro","echeq","interna"].includes(m.tipo)||m.tipo==="otro"));

  app.innerHTML=
    zonaCarga()+
    avisoValidacion()+
    kpis(M,nuevos,pendConc,cerrados,listos,dudas)+
    composicion(porTipo)+
    panelAcciones(nuevos,pendConc,cerrados,listos,dudas)+
    panelResolver()+
    tablas(filtrar(M))+
    '<div class="panel"><h3>📋 Registro de lo que se hizo</h3>'+
    '<div class="sub">Todo lo que la herramienta ejecutó en Odoo, en orden.</div>'+
    '<div class="log" id="log"></div></div>';
  engancharDrop(); pintarLog();
}

    '<label class="drop" id="drop" style="margin-top:12px"><div class="ic">📄</div>'+

window.cambiarBanco=k=>{
  if(ST.movs.length && !confirm("Cambiar de banco descarta lo que subiste. ¿Seguimos?")){
    document.getElementById("selBanco").value=ST.banco; return;
  }
  ST.banco=k; ST.movs=[]; ST.archivos=[]; ST.validacion=null; ST.listo=false; ST.mapaCuit={}; ST.logs=[]; render();
};
function engancharDrop(){
  const d=document.getElementById("drop"), f=document.getElementById("file"); if(!d||!f) return;
  f.onchange=e=>{ if(e.target.files.length) procesar([...e.target.files]); };
  ["dragenter","dragover"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove("over");}));
  d.addEventListener("drop",e=>{ const fs=[...e.dataTransfer.files]; if(fs.length) procesar(fs); });
}

function avisoValidacion(){
  const v=ST.validacion; if(!v) return "";
  const cuantos=(v.archivos||1)>1?("Los "+v.archivos+" archivos cierran"):"El archivo cierra";
  const dias=v.dias&&v.dias.length>1?(" — "+v.dias.length+" días, del "+v.dias[0]+" al "+v.dias[v.dias.length-1]):"";
  if(v.ok) return '<div class="aviso ok">✅ <div><b>'+cuantos+' exacto.</b> Los '+ST.movs.length+
    ' movimientos encadenan saldo a saldo, de '+money(v.inicial)+' a '+money(v.final)+dias+'. '+
    'Si un solo importe estuviera mal leído, esta cadena se rompería.</div></div>';
  return '<div class="aviso bad">⛔ <div><b>No cierra la cadena de saldos.</b> Se rompe en '+v.fallas.length+
    ' punto(s). No se carga nada hasta resolverlo — sería meter números que el banco no dice.<br>'+
    v.fallas.slice(0,4).map(f=>"· "+(f.archivo?esc(f.archivo)+", ":"")+"fila "+f.i+
      ": esperaba "+money(f.esperado)+" y el archivo dice "+money(f.real)).join("<br>")+
    '</div></div>';
}

function kpis(M,nuevos,pendConc,cerrados,listos,dudas){
  const k=(id,clase,lbl,n,s,ayuda)=>
    '<button class="kpi '+clase+(ST.filtro===id?" on":"")+'" onclick="filtrar_('+JSON.stringify(id)+')" title="'+esc(ayuda)+'">'+
    '<div class="l">'+esc(lbl)+'</div><div class="n">'+n+'</div><div class="s">'+esc(s)+'</div></button>';
  const suma=a=>money(a.reduce((s,m)=>s+m.importe,0));
  return '<div class="kpis">'+
    k(null,"","Movimientos",M.length,suma(M),"Todo lo que trae el archivo. Clic para ver todos.")+
    k("nuevo","ok","Nuevos",nuevos.length,suma(nuevos),"Movimientos que todavía no están en Odoo. Son los que se van a cargar.")+
    k("pend","warn","Cargados sin conciliar",pendConc.length,suma(pendConc),"Ya están en Odoo pero les falta el recibo o el pago: siguen dando trabajo. Clic para verlos.")+
    k("cerrado","dup","Conciliados",cerrados.length,suma(cerrados),"Cargados y conciliados. Están cerrados: no hay nada que hacer con ellos.")+
    k("listo","ok","Se resuelven solos",listos.length,suma(listos),"Tienen un único destino posible. Se resuelven sin decidir nada, estén cargados o no.")+
    k("duda","warn","Necesitan que decidas",dudas.length,suma(dudas),"O tienen varios candidatos, o no tienen ninguno, o el código no está en el mapa.")+
  '</div>';
}

function composicion(porTipo){
  const tot=Object.values(porTipo).reduce((s,a)=>s+a.length,0); if(!tot) return "";
  const orden=["cobro","cargo","impuesto","echeq","interna","otro"].filter(t=>porTipo[t]);
  return '<div class="panel"><h3>🧭 De qué se compone el día</h3>'+
    '<div class="sub">Cada tipo de movimiento tiene su propio circuito. Tocá una franja para filtrar la tabla.</div>'+
    '<div class="compo">'+orden.map(t=>{
      const p=porTipo[t].length/tot*100;
      return '<div style="width:'+p.toFixed(2)+'%;background:'+TIPOS[t].color+'" onclick="filtrarTipo_('+JSON.stringify(t)+')" '+
        'title="'+esc(TIPOS[t].lbl+": "+porTipo[t].length+" movimientos. "+TIPOS[t].ayuda)+'">'+(p>7?porTipo[t].length:"")+'</div>';
    }).join("")+'</div>'+
    '<div class="leyenda">'+orden.map(t=>'<span title="'+esc(TIPOS[t].ayuda)+'"><i style="background:'+TIPOS[t].color+'"></i>'+
      esc(TIPOS[t].lbl)+' · '+porTipo[t].length+'</span>').join("")+'</div></div>';
}

/* Antes este panel desaparecía en cuanto no había movimientos NUEVOS, y con él todos
   los botones: subir de nuevo un día ya importado dejaba la pantalla muerta aunque
   quedaran cobros sin recibo. Ahora el panel vive mientras quede algo ABIERTO, venga
   de un archivo nuevo o de una importación anterior. */
function panelAcciones(nuevos,pendConc,cerrados,listos,dudas){
  if(!ST.validacion||!ST.validacion.ok) return "";
  const t=ST.trabajando, abiertos=nuevos.length+pendConc.length;

  if(!abiertos) return '<div class="aviso ok">✔️ <div><b>Este día ya está cerrado.</b> '+
    'Los '+ST.movs.length+' movimientos están cargados y conciliados: no queda nada por hacer. Podés subir otro día.</div></div>';

  const bCargar = nuevos.length
    ? '<button class="btn" onclick="accionCargar()" '+(t?"disabled":"")+'>'+(t?'<span class="spin"></span> ':"")+
      'Cargar los '+nuevos.length+' movimientos nuevos</button>' : "";
  const bResolver = listos.length
    ? '<button class="btn'+(nuevos.length?" gh":"")+'" onclick="accionResolver()" '+(t?"disabled":"")+'>'+(t&&!nuevos.length?'<span class="spin"></span> ':"")+
      'Resolver los '+listos.length+' que no tienen dudas</button>' : "";

  /* De dónde viene el trabajo, dicho en una línea, para que no haya que deducirlo. */
  const origen = nuevos.length && pendConc.length
      ? '<b>'+nuevos.length+'</b> movimientos son nuevos y <b>'+pendConc.length+'</b> ya estaban cargados pero sin conciliar.'
    : nuevos.length
      ? '<b>'+nuevos.length+'</b> movimientos son nuevos.'
      : 'Los '+ST.movs.length+' movimientos <b>ya estaban cargados</b>, pero <b>'+pendConc.length+'</b> siguen sin conciliar: les falta el recibo o el pago.';

  return '<div class="panel"><h3>⚙️ Qué se puede hacer ahora</h3>'+
    '<div class="sub">Se carga <b>todo</b> el extracto (si no, el saldo del banco no cuadra) y se resuelve solo lo que no deja dudas: '+
    'impuestos y cargos a su cuenta, cobros con un único recibo posible, y <b>transferencias entre cuentas propias</b> '+
    '(crea la transferencia en Odoo y su contrapartida). Lo ambiguo queda abajo para que lo decidas vos.</div>'+
    (bCargar||bResolver ? '<div class="acciones">'+bCargar+bResolver+'</div>' : "")+
    '<div class="aviso info" style="margin:0">💡 <div>'+origen+' De los <b>'+abiertos+'</b> que dan trabajo, '+
    '<b>'+listos.length+'</b> tienen un destino único y <b>'+dudas.length+'</b> necesitan una decisión tuya'+
    (dudas.length?', abajo uno por uno':"")+'. Nada se concilia si hay más de un candidato posible.'+
    (cerrados.length?' Los otros '+cerrados.length+' ya están conciliados.':"")+'</div></div></div>';
}

function filtrar(M){
  if(!ST.filtro) return M;
  if(ST.filtro==="nuevo")   return M.filter(m=>!m.yaEsta);
  if(ST.filtro==="pend")    return M.filter(m=>m.yaEsta&&!m.yaEsta.is_reconciled);
  if(ST.filtro==="cerrado") return M.filter(m=>m.yaEsta&&m.yaEsta.is_reconciled);
  const auto = m => m.tipo==="impuesto"||m.tipo==="cargo"||m.cands.length===1||(m.tipo==="interna"&&m.otroBanco);
  if(ST.filtro==="listo")   return M.filter(m=>abierto(m)&&auto(m));
  if(ST.filtro==="duda")    return M.filter(m=>abierto(m)&&!auto(m)&&(m.cands.length>1||m.cands.length===0&&["cobro","echeq","interna"].includes(m.tipo)||m.tipo==="otro"));
  if(ST.filtro.startsWith("t:")) return M.filter(m=>m.tipo===ST.filtro.slice(2));
  return M;
}
window.filtrar_=id=>{ ST.filtro=(ST.filtro===id?null:id); render(); };
window.filtrarTipo_=t=>{ const k="t:"+t; ST.filtro=(ST.filtro===k?null:k); render(); };

function estadoDe(m){
  if(m.yaEsta && m.yaEsta.is_reconciled)
    return '<span class="badge b-dup">ya cargado · conciliado</span>';
  if(m.yaEsta){
    /* Cargado pero sin conciliar: sigue dando trabajo, y el badge tiene que decirlo.
       Debajo se agrega el estado normal, porque a este también se le buscan candidatos. */
    const pre='<span class="badge b-warn">cargado · falta conciliar</span>'+
      (m.yaEsta.to_check?' <span class="badge b-warn">a revisar</span>':"")+' ';
    if(m.tipo==="impuesto") return pre+'<span class="badge b-ok">va a su cuenta</span>';
    if(m.tipo==="cargo")    return pre+'<span class="badge b-warn">va a la liquidación</span>';
    if(m.cands.length===1)  return pre+'<span class="badge b-ok">'+(m.porCheque?"por N° de cheque":m.porCliente?"cliente + importe":"un candidato")+'</span>';
    if(m.cands.length>1)    return pre+'<span class="badge b-warn">'+m.cands.length+' candidatos</span>';
    if(m.tipo==="interna"&&m.otroBanco) return pre+'<span class="badge b-ok">'+esc(m.otroBanco.nombre)+'</span>';
    if(["cobro","echeq","interna"].includes(m.tipo)) return pre+'<span class="badge b-bad">falta la contraparte</span>';
    return pre;
  }
  if(m.tipo==="impuesto") return '<span class="badge b-ok">va a su cuenta</span>';
  if(m.tipo==="cargo")    return '<span class="badge b-warn">va a la liquidación</span>';
  if(m.cands.length===1)  return '<span class="badge b-ok">'+(m.porCheque?"por N° de cheque":m.porCliente?"cliente + importe":"un candidato")+'</span>';
  if(m.cands.length>1)    return '<span class="badge b-warn">'+m.cands.length+' candidatos</span>';
  if(m.tipo==="interna"&&m.otroBanco) return '<span class="badge b-ok">'+esc(m.otroBanco.nombre)+'</span>';
  if(m.tipo==="echeq"&&m.cpbte) return '<span class="badge b-bad">cheque '+esc(m.cpbte)+' sin pago cargado</span>';
  if(["cobro","echeq","interna"].includes(m.tipo)) return '<span class="badge b-bad">falta la contraparte</span>';
  return '<span class="badge b-nu">sin clasificar</span>';
}
function accionDe(m,i){
  /* Sólo lo conciliado queda sin acción. Lo que está cargado pero sin conciliar
     sigue siendo accionable: es justamente el trabajo pendiente de Tesorería. */
  if(!abierto(m)) return '<span class="muted">—</span>';
  if(m.cands.length>1) return '<select class="cand" id="sel'+i+'"><option value="">Elegí cuál…</option>'+
    m.cands.map(c=>'<option value="'+c.id+'">'+esc(String(c.move_id[1]).slice(0,26))+" · "+(c.partner_id?esc(String(c.partner_id[1]).slice(0,22)):"sin cliente")+'</option>').join("")+
    '</select> <button class="btn sm" onclick="elegirCand('+i+')">Aplicar</button>';
  if(m.cands.length===0&&(m.tipo==="cobro"||m.tipo==="echeq"))
    return '<button class="btn sm '+(RES.i===i?"":"gh")+'" onclick="abrirResolver('+i+')" '+
      'title="'+(m.tipo==="echeq"
        ? "El cheque "+esc(m.cpbte||"")+" no tiene su pago cargado en Odoo. El banco no dice a quién se le pagó: hay que buscar el beneficiario en el home banking y cargarlo acá."
        : "Elegí el cliente y a qué facturas se imputa.")+'">'+
      (RES.i===i?"Cerrar":"Resolver")+'</button>';
  /* Un solo candidato: no hay nada que decidir, pero igual se puede cerrar de a uno. */
  if(m.cands.length===1)
    return '<button class="btn sm gh" onclick="conciliarUno('+i+')" title="'+
      (m.porCheque?"El N° de cheque "+esc(m.cpbte)+" lo identifica sin ambigüedad. ":"")+
      'Concilia este movimiento contra su único candidato. También lo hace el botón de arriba, junto con los demás.">Conciliar</button>';
  /* Impuestos y cargos: su destino es único y no tienen candidato que mostrar. */
  if(m.tipo==="impuesto"||m.tipo==="cargo")
    return '<span class="muted" style="font-size:11.5px">lo resuelve el botón de arriba</span>';
  /* Transferencia entre cuentas propias con el otro banco ya identificado: se puede
     resolver de una, sin esperar el extracto del otro banco. */
  if(m.tipo==="interna"&&m.otroBanco&&m.cands.length===0)
    return '<button class="btn sm" onclick="crearTransferencia('+i+')" title="Crea la transferencia interna en Odoo. La contrapartida en '+esc(m.otroBanco.nombre)+' la genera Odoo sola, y después se concilia esta línea.">'+
      'Transferir '+(m.otroBanco.entra?"desde":"a")+' '+esc(m.otroBanco.nombre.replace(/^Banco /,""))+'</button>';
  if(m.cands.length===0&&m.tipo==="interna")
    return '<span class="muted" style="font-size:11.5px">falta cargar el otro extracto</span>';
  return '<span class="muted">—</span>';
}

/* Dos secciones: primero lo que falta resolver (es lo accionable), después lo
   que ya está cerrado. Lo conciliado va colapsado: está para consultar, no
   para trabajar. */
function tablas(M){
  const conc=M.filter(m=>m.yaEsta&&m.yaEsta.is_reconciled);
  const pend=M.filter(m=>!(m.yaEsta&&m.yaEsta.is_reconciled));
  const sumar=a=>a.reduce((s,m)=>s+m.importe,0);
  let h="";
  h+=tabla(pend,"⏳ Falta resolver","Lo que todavía no está conciliado: o falta cargarlo, o falta la contraparte, o hay que decidir cuál es. "+
      "Es donde hay trabajo.", pend.length?money(sumar(pend)):"", "pend");
  if(conc.length){
    h+='<div class="panel seccion-conc"><h3 onclick="ST.verConc=!ST.verConc;render()" style="cursor:pointer">'+
      (ST.verConc?"▾":"▸")+' ✅ Ya conciliados <span class="badge b-ok">'+conc.length+'</span>'+
      '<span class="tot-sec">'+money(sumar(conc))+'</span></h3>'+
      '<div class="sub">Cerrados contra su contraparte. Están acá para consultar, no requieren nada.</div>'+
      (ST.verConc?filasDe(conc):'<button class="btn gh sm" onclick="ST.verConc=true;render()">Ver los '+conc.length+'</button>')+
      '</div>';
  }
  return h;
}
function tabla(M,titulo,sub,total,cual){
  if(!M.length) return '<div class="panel"><h3>'+titulo+' <span class="badge b-ok">0</span></h3>'+
    '<div class="sub">'+(cual==="pend"?"No queda nada por resolver de este archivo. 🎉":"Nada acá.")+'</div></div>';
  return '<div class="panel"><h3>'+titulo+' <span class="badge '+(cual==="pend"?"b-warn":"b-ok")+'">'+M.length+'</span>'+
    (ST.filtro?' <span class="badge b-nu">filtrado</span>':"")+
    (total?'<span class="tot-sec">'+total+'</span>':"")+'</h3>'+
    '<div class="sub">'+esc(sub)+'</div>'+filasDe(M)+'</div>';
}
function filasDe(M){
  return '<div class="tw"><table><thead><tr>'+
    '<th title="Fecha del movimiento según el banco">Fecha</th>'+
    '<th title="El texto tal cual lo manda el banco, y debajo el cliente si se pudo identificar">Concepto</th>'+
    '<th title="Qué tipo de movimiento es, según el código que manda el banco">Tipo</th>'+
    '<th class="r" title="Positivo entra, negativo sale">Importe</th>'+
    '<th title="Si ya estaba cargado, si se resuelve solo, o si necesita una decisión">Estado</th>'+
    '<th title="Qué se puede hacer con este movimiento">Acción</th>'+
    '</tr></thead><tbody>'+
    M.map((m,i)=>'<tr>'+
      '<td class="muted">'+m.fecha.slice(8)+"/"+m.fecha.slice(5,7)+'</td>'+
      '<td class="cpto">'+esc(m.concepto.slice(0,92))+(m.concepto.length>92?"…":"")+
        (m.cliente
          ? '<span class="cli" title="'+(m.porPadron
              ? "El CUIT del concepto es el de este cliente en su ficha. Es la primera vez que paga desde este CUIT, así que no estaba en el historial."
              : "Aprendido del historial: este CUIT ya pagó antes por este cliente.")+'">→ '+esc(m.cliente.nombre)+
            (m.porPadron?' <span class="badge b-ok" style="font-size:9.5px">por CUIT</span>':"")+'</span>'
          : (m.cuit?'<span class="cli muted" title="El CUIT no figura en ninguna ficha ni pagó antes. Si sabés quién es, elegilo al resolver: después de cargar la línea Odoo ya no deja escribir el cliente.">CUIT '+m.cuit+' · sin identificar</span>':""))+'</td>'+
      '<td><span class="badge b-nu" title="'+esc(TIPOS[m.tipo].ayuda)+'">'+esc(m.sub)+'</span></td>'+
      '<td class="r '+(m.importe<0?"neg":"pos")+'"><b>'+money(m.importe)+'</b></td>'+

/* ══════════════════════════════════════════════════════════════════════════
   ACCIONES — lo único que escribe en Odoo
   ══════════════════════════════════════════════════════════════════════════ */
async function conTrabajo(fn){
  if(ST.trabajando) return;
  ST.trabajando=true; render();
  try{ await fn(); }
  catch(e){ log("ERROR: "+(e.message||e),"e"); }
  ST.trabajando=false;
  await reAnalizar();
}
async function reAnalizar(){
  ST.mapaCuit={};                       // se reconstruye: puede haber aprendido clientes nuevos
  await analizar(ST.movs);
  render();
}

/* Carga las líneas que faltan. NUNCA pisa lo que ya está: los que tienen
   `yaEsta` se saltean, y el estado de cuenta del día se reusa si existe. */
window.accionCargar=()=>conTrabajo(async()=>{
  const B=BANCOS[ST.banco];
  const nuevos=ST.movs.filter(m=>!m.yaEsta);
  if(!nuevos.length){ log("No hay movimientos nuevos para cargar"); return; }
  const porDia={}; nuevos.forEach(m=>{(porDia[m.fecha]=porDia[m.fecha]||[]).push(m);});

  for(const dia of Object.keys(porDia).sort()){
    const delDia=ST.movs.filter(m=>m.fecha===dia);          // todos, para los saldos del día
    const aCargar=porDia[dia];
    let stId=null;
    const exist=await rpc("account.bank.statement","search_read",
      [[["journal_id","=",B.diario],["date","=",dia]],["id","name"]],{limit:1});
    if(exist.length){ stId=exist[0].id; log("Reuso el estado de cuenta del "+dia+" que ya existía"); }
    else{
      const ini=Math.round((delDia[0].saldo-delDia[0].importe)*100)/100;
      const fin=delDia[delDia.length-1].saldo;
      const r=await rpc("account.bank.statement","create",[[{
        name:"BCRED Estado de cuenta "+dia, date:dia, journal_id:B.diario,
        balance_start:ini, balance_end_real:fin}]]);
      stId=Array.isArray(r)?r[0]:r;
      log("Estado de cuenta del "+dia+": "+money(ini)+" → "+money(fin));
    }
    let ok=0;
    for(const m of aCargar){
      await rpc("account.bank.statement.line","create",[[{
        date:m.fecha, journal_id:B.diario, statement_id:stId,
        payment_ref:m.concepto, amount:m.importe,
        partner_id: m.cliente ? m.cliente.id : false,     // el cliente va ACÁ: después no se puede
        ref:(m.cpbte&&m.cpbte!=="0"?"Cpbte "+m.cpbte+" · ":"")+"Cod "+m.cod}]]);
      ok++;
    }
    log("Cargados "+ok+" movimientos del "+dia,"o");
  }
});

/* Resuelve sólo lo inequívoco. Si hay más de un candidato, no toca nada. */
window.accionResolver=()=>conTrabajo(async()=>{
  const B=BANCOS[ST.banco];
  let imp=0,car=0,con=0,trf=0;
  for(const m of ST.movs){
    if(!m.yaEsta || m.yaEsta.is_reconciled) continue;      // sólo lo cargado y sin resolver
    /* Las transferencias entre cuentas propias van primero y por su propio camino:
       crean el par en Odoo y después concilian, así que no pasan por la cuenta
       transitoria de la misma forma que el resto. */
    if(m.tipo==="interna" && m.otroBanco){
      try{
        const r=await transferenciaInterna(m);
        await conciliarLinea(m, r.apunteId, r.cta);
        m.yaEsta.is_reconciled=true; trf++;
        log("Transferencia "+r.pago.name+" + "+r.par.name+" — "+money(m.importe)+" "+
            (m.otroBanco.entra? "desde "+m.otroBanco.nombre : "hacia "+m.otroBanco.nombre));
      }catch(e){ log("No se pudo transferir "+money(m.importe)+": "+(e.message||e),"e"); }
      continue;
    }
    const linea=m.yaEsta;
    const mv=await rpc("account.move","read",[[linea.move_id[0]],["line_ids"]]);
    const lins=await rpc("account.move.line","read",[mv[0].line_ids,["account_id"]]);
    const tra=lins.find(x=>x.account_id[0]===CTA_TRANSIT);
    if(!tra) continue;

    if(m.tipo==="impuesto"&&m.cta){
      await rpc("account.move.line","write",[[tra.id],{account_id:m.cta}]);
      imp++; log("Imputado "+money(m.importe)+" — "+m.sub);
    }
    else if(m.tipo==="cargo"){
      const p=await rpc("account.payment","create",[[{
        partner_id:B.partner, journal_id:B.diario, payment_type:"outbound", partner_type:"supplier",
        payment_method_line_id:21, destination_account_id:CTA_PROVEEDORES,
        amount:Math.abs(m.importe), date:m.fecha, ref:m.concepto.slice(0,60)}]]);
      const pid=Array.isArray(p)?p[0]:p;
      await rpc("account.payment","action_post",[[pid]]);
      const pv=await rpc("account.payment","read",[[pid],["name","move_id"]]);
      const lp=await rpc("account.move.line","search_read",
        [[["move_id","=",pv[0].move_id[0]],["account_id","=",CTA_PAGOS]],["id"]],{limit:1});
      await rpc("account.move.line","write",[[tra.id],{account_id:CTA_PAGOS}]);
      await rpc("account.move.line","reconcile",[[tra.id,lp[0].id]]);
      car++; log("Pago "+pv[0].name+" por "+money(Math.abs(m.importe))+" — "+m.sub);
    }
    else if(m.cands.length===1){
      const cta = m.tipo==="cobro" ? CTA_RECIBOS : CTA_PAGOS;
      await rpc("account.move.line","write",[[tra.id],{account_id:cta}]);
      await rpc("account.move.line","reconcile",[[tra.id,m.cands[0].id]]);
      const q=m.cands[0].partner_id?m.cands[0].partner_id[1]:(m.cliente?m.cliente.nombre:"");
      con++; log("Conciliado "+money(m.importe)+(q?" — "+q:"")+(m.porCheque?"  (cheque "+m.cpbte+")":""));
    }
  }
  log("Resueltos: "+imp+" impuestos · "+car+" cargos · "+trf+" transferencias entre cuentas · "+con+" conciliaciones","o");
});

/* ─────────────────────────────────────────────────────────────────────────
   RESOLVER A MANO — para lo que no se puede conciliar solo.
   El caso más frecuente: el cobro llegó al banco pero Cobranzas todavía no
   cargó el recibo. Acá se crea el recibo, se elige qué facturas cancela y
   se concilia contra el extracto, sin pasar por Odoo.
   ───────────────────────────────────────────────────────────────────────── */
window.RES={i:null, cliente:null, facturas:[], sel:new Set(), buscando:false};

window.abrirResolver=async(i)=>{
  const m=ST.movs[i];
  if(RES.i===i){ RES.i=null; render(); return; }
  RES.i=i; RES.cliente=m.cliente||null; RES.facturas=[]; RES.sel=new Set(); RES.sug=null; RES.sugCargando=false; render();
  if(RES.cliente) await cargarFacturas(RES.cliente.id);
};
window.cerrarResolver=()=>{ RES.i=null; render(); };

async function cargarFacturas(pid){
  RES.buscando=true; render();
  const m=ST.movs[RES.i]||{}; const L=LADO(m);
  /* Comprobantes abiertos del tercero, del más viejo al más nuevo. Del lado del
     cliente la deuda está al DEBE (nos debe); del lado del proveedor, al HABER. */
  const ls=await rpc("account.move.line","search_read",
    [[["partner_id","=",pid],["account_id","=",L.cta],["parent_state","=","posted"],
      ["full_reconcile_id","=",false],[sale(m)?"credit":"debit",">",0]],
     ["move_id","date","date_maturity","debit","credit","amount_residual"]],{limit:0,order:"date_maturity,date"});
  RES.facturas=ls.filter(l=>Math.abs(l.amount_residual)>0.005);
  RES.buscando=false; render();
}
window.buscarCliente=async(txt)=>{
  if(!txt||txt.length<3){ RES.opciones=null; render(); return; }
  const m=ST.movs[RES.i]||{};
  /* Cuando se está pagando se buscan proveedores, y al revés: ofrecer el padrón entero
     es la forma más fácil de imputarle el movimiento al tercero equivocado. Si no
     aparece ninguno con ese rol, se busca sin filtro y se avisa en el panel. */
  const rank = sale(m) ? ["supplier_rank",">",0] : ["customer_rank",">",0];
  const dom  = ["|",["name","ilike",txt],["vat","like",txt.replace(/[^0-9]/g,"")]];
  let r=await rpc("res.partner","search_read",[[rank].concat(dom),["id","name","vat"]],{limit:12});
  RES.sinRol=false;
  if(!r.length){ r=await rpc("res.partner","search_read",[dom,["id","name","vat"]],{limit:12}); RES.sinRol=r.length>0; }
  RES.opciones=r; render();
};
window.elegirCliente=async(id,nombre)=>{
  RES.cliente={id,nombre}; RES.opciones=null; RES.sel=new Set();
  await cargarFacturas(id);
};
window.toggleFac=(id)=>{ RES.sel.has(id)?RES.sel.delete(id):RES.sel.add(id); render(); };

/* ---------- DE QUÉ PROVEEDOR ES ESTE CHEQUE ----------
   Federico arma el pago al revés de como lo ve el banco: mira la deuda del proveedor,
   elige las facturas, le descuenta las retenciones y emite el cheque por lo que queda.
   Así que el importe del cheque es una FIRMA: hay que buscar qué proveedor tiene
   facturas abiertas que, netas de retención, den exactamente ese número.

   El rango de retención sale de las 60 últimas medidas en esta base: Ganancias 2%
   (con un mínimo no imponible de $224.000 que se consume una vez al mes) más IIBB
   Santa Fe 0,7% o 2,75%. En total nunca pasó del 5,5%, así que el bruto que se busca
   está entre el importe del cheque y ese importe dividido 0,945.

   Esto NO calcula la retención ni decide nada: reduce cientos de proveedores a unos
   pocos candidatos con su retención implícita a la vista, y elige la persona. Calcular
   la retención acá sería peligroso —depende del régimen, de la jurisdicción y de lo que
   ya se retuvo en el mes— y de eso se encarga Odoo cuando se confirma el pago. */
const RET_MAX=0.055;
async function sugerirProveedores(neto){
  RES.sug=null; RES.sugCargando=true; render();
  try{
    const ls=await rpc("account.move.line","search_read",
      [[["account_id","=",CTA_PROVEEDORES],["parent_state","=","posted"],["full_reconcile_id","=",false],["credit",">",0]],
       ["move_id","partner_id","date","date_maturity","amount_residual"]],{limit:0,order:"partner_id,date_maturity,date"});
    const porProv={};
    ls.forEach(x=>{ if(!x.partner_id) return;
      (porProv[x.partner_id[0]]=porProv[x.partner_id[0]]||{id:x.partner_id[0],nombre:x.partner_id[1],facs:[]}).facs.push(x); });
    const lo=neto, hi=neto/(1-RET_MAX), out=[];
    Object.values(porProv).forEach(p=>{
      /* Acumulado de la más vieja a la más nueva, que es el orden en que se imputa. */
      let acc=0;
      for(let i=0;i<p.facs.length;i++){
        acc+=Math.abs(p.facs[i].amount_residual);
        if(acc>=lo-0.5 && acc<=hi+0.5){ out.push({id:p.id, nombre:p.nombre, n:i+1, total:acc, ret:acc-neto, pct:(acc-neto)/acc*100}); break; }
        if(acc>hi) break;
      }
    });
    RES.sug=out.sort((a,b)=>a.pct-b.pct).slice(0,8);
  }catch(e){ RES.sug=[]; log("No pude buscar proveedores por importe: "+(e.message||e),"e"); }
  RES.sugCargando=false; render();
}
/* Cuántos movimientos IGUALES a éste hay sin resolver el mismo día. Fede parte un
   pago grande en varios cheques del mismo importe, así que el neto que hay que buscar
   puede ser el de uno o el de todos juntos. */
function hermanos(m){
  return ST.movs.filter(x=>x!==m && abierto(x) && x.fecha===m.fecha &&
    Math.abs(x.importe-m.importe)<0.005 && x.tipo===m.tipo).length + 1;
}
window.sugerirPor=(veces)=>{ const m=ST.movs[RES.i]; if(m) sugerirProveedores(Math.abs(m.importe)*veces); };

/* Buscar al proveedor por el importe, cuando no se sabe el nombre. */
function buscarPorImporte(m){
  const n=hermanos(m), uno=Math.abs(m.importe);
  let h='<div class="sub" style="margin:14px 0 6px"><b>¿No sabés de quién es?</b> '+
    'Buscalo al revés: por lo que Federico tuvo que pagar. El cheque sale de las facturas '+
    'menos las retenciones, así que el importe alcanza para encontrar al proveedor.</div>'+
    '<div class="acciones" style="margin-bottom:10px">'+
      '<button class="btn gh sm" onclick="sugerirPor(1)">Buscar por '+money(uno)+'</button>'+
      (n>1?'<button class="btn gh sm" onclick="sugerirPor('+n+')" title="Hay '+n+' movimientos iguales sin resolver este mismo día: puede ser un solo pago partido en '+n+' cheques.">Buscar por los '+n+' juntos · '+money(uno*n)+'</button>':"")+
    '</div>';
  if(RES.sugCargando) return h+'<div class="cargando">Buscando proveedores con facturas abiertas que den ese importe…</div>';
  if(!RES.sug) return h;

    'Puede que la factura todavía no esté cargada, o que el pago cancele facturas ya imputadas por otro lado. '+
    'El beneficiario del e-cheq se ve en el home banking.</div></div>';
  return h+'<div class="sub" style="margin:0 0 6px">Proveedores cuya deuda más vieja da ese importe. '+
    'La <b>retención implícita</b> es lo que habría que haber retenido para llegar al número del cheque: '+

      '<button class="opt" onclick="elegirCliente('+o.id+','+JSON.stringify(o.nombre).replace(/"/g,"&quot;")+')">'+

      ' · retención implícita '+money(o.ret)+' ('+o.pct.toFixed(2)+'%)</span></button>').join("")+'</div>';
}

  const dif=Math.round((Math.abs(m.importe)-selTot)*100)/100;

  let cuerpo="";

    cuerpo='<div class="sub">'+(sale(m)
        ? 'El banco no dice a quién se le pagó: el resumen sólo trae el número de cheque. Buscá el <b>proveedor</b> por nombre o CUIT.'

      (sale(m)?buscarPorImporte(m):"")+
      (RES.opciones?'<div class="opts">'+(RES.opciones.length?RES.opciones.map(o=>
        '<button class="opt" onclick="elegirCliente('+o.id+','+JSON.stringify(o.name).replace(/"/g,"&quot;")+')">'+

        :'<div class="muted" style="padding:8px">Ningún cliente con ese nombre o CUIT.</div>')+'</div>':"");

    cuerpo='<div class="cargando">Buscando las facturas abiertas de '+esc(RES.cliente.nombre)+'…</div>';

    if(!RES.facturas.length){
      cuerpo+='<div class="aviso warn" style="margin:10px 0 0">⚠️ <div><b>Este '+LADO(m).quien+' no tiene comprobantes abiertos.</b> '+
        'El movimiento se puede registrar igual: queda <b>a cuenta</b> y se imputa cuando haya factura.</div></div>';
    } else {
      cuerpo+='<div class="sub" style="margin:11px 0 7px">Tildá qué facturas cancela este '+(sale(m)?"pago":"cobro")+'. '+
        'Las más viejas primero, que es como se imputa normalmente.</div>'+
        '<div class="facs">'+RES.facturas.map(f=>{
          const on=RES.sel.has(f.id);
          return '<button class="fac'+(on?" on":"")+'" onclick="toggleFac('+f.id+')">'+
            '<span class="tk">'+(on?"☑":"☐")+'</span>'+
            '<span class="fn">'+esc(String(f.move_id[1]).slice(0,26))+'</span>'+
            '<span class="fd muted">'+(f.date_maturity||f.date)+'</span>'+

        }).join("")+'</div>'+
        '<div class="cuadre '+(exacto?"ok":(selTot>Math.abs(m.importe)?"bad":"warn"))+'">'+
          '<div><span>Cobro del banco</span><b>'+money(Math.abs(m.importe))+'</b></div>'+
          '<div><span>Facturas tildadas ('+RES.sel.size+')</span><b>'+money(selTot)+'</b></div>'+
          '<div class="dif"><span>'+(exacto?"Cierra exacto":(dif>0?"Queda a cuenta":"Se pasa por"))+'</span>'+
            '<b>'+(exacto?"$0,00":money(Math.abs(dif)))+'</b></div>'+
        '</div>'+
        (selTot>Math.abs(m.importe)?'<div class="aviso bad" style="margin:10px 0 0">⛔ <div>Tildaste '+money(selTot-Math.abs(m.importe))+

/* Crea el recibo igual que lo hace Cobranzas, lo imputa a las facturas
   tildadas y lo concilia contra la línea del extracto. Todo o nada. */
window.crearRecibo=()=>conTrabajo(async()=>{
  const m=ST.movs[RES.i]; const B=BANCOS[ST.banco];
  if(!m||!RES.cliente){ log("Falta elegir el "+LADO(m||{}).quien,"e"); return; }
  if(!m.yaEsta){ log("Primero hay que cargar el movimiento a Odoo","e"); return; }
  const L=LADO(m);
  /* Un e-cheq se paga CON CHEQUE, y ese método tiene su propia cuenta: usar Manual
     mandaría el asiento a otro lado. Es el molde de Fede (OP-X 7947, Dnm Farma). */
  const metodo = sale(m) ? (m.tipo==="echeq" ? 22 : 21) : 20;

  const p=await rpc("account.payment","create",[[{
    partner_id:RES.cliente.id, journal_id:B.diario,
    payment_type:L.tipo, partner_type:L.parte,
    payment_method_line_id:metodo, destination_account_id:L.cta,
    amount:Math.abs(m.importe), date:m.fecha}]]);
  const pid=Array.isArray(p)?p[0]:p;
  await rpc("account.payment","action_post",[[pid]]);
  const pv=await rpc("account.payment","read",[[pid],["name","move_id"]]);
  log((sale(m)?"Orden de pago ":"Recibo ")+pv[0].name+" por "+money(Math.abs(m.importe))+" — "+RES.cliente.nombre,"o");

  const lins=await rpc("account.move.line","search_read",
    [[["move_id","=",pv[0].move_id[0]]],["account_id","id"]],{limit:0});
  const lCred=lins.find(l=>l.account_id[0]===L.cta);
  const lRec =lins.find(l=>l.account_id[0]===L.transit);

  if(RES.sel.size&&lCred){
    await rpc("account.move.line","reconcile",[[lCred.id,...[...RES.sel]]]);
    log("Imputado a "+RES.sel.size+" factura(s)");
  } else log("Queda a cuenta del cliente (sin imputar)");

  /* y ahora contra el extracto */
  const mv=await rpc("account.move","read",[[m.yaEsta.move_id[0]],["line_ids"]]);
  const ext=await rpc("account.move.line","read",[mv[0].line_ids,["account_id"]]);
  const tra=ext.find(x=>x.account_id[0]===CTA_TRANSIT);
  if(tra&&lRec){
    await rpc("account.move.line","write",[[tra.id],{account_id:L.transit}]);
    await rpc("account.move.line","reconcile",[[tra.id,lRec.id]]);
    log("Conciliado con el movimiento del banco","o");
  }
  RES.i=null; RES.cliente=null; RES.facturas=[]; RES.sel=new Set();
});

/* ---------- TRANSFERENCIA ENTRE CUENTAS PROPIAS ----------
   Se crea UN SOLO account.payment en el diario de ORIGEN con is_internal_transfer:
   al postearlo Odoo crea el asiento del otro banco y concilia las dos patas de la
   cuenta puente entre sí. Es exactamente lo que hace Federico desde Contabilidad
   (verificado contra su par PBNK11/2026/00131 + PBCRED/2026/00441 del 25/09).

   Después queda conciliar la línea del extracto contra la pata que quedó abierta:
   Recibos pendientes si la plata ENTRA a este banco, Pagos pendientes si SALE. */
async function transferenciaInterna(m){
  const B=BANCOS[ST.banco], o=m.otroBanco;
  const esteDiario=B.diario, otroDiario=o.diario;
  /* El pago se crea siempre en el diario de donde SALE la plata. */
  const origen = o.entra ? otroDiario : esteDiario;
  const destino= o.entra ? esteDiario : otroDiario;
  const metodo = o.entra ? o.metodo : B.metodoSalida;
  if(!metodo) throw new Error("No tengo el método de pago Manual de "+(o.entra?o.nombre:B.nombre)+": hay que agregarlo al mapa antes de poder crear la transferencia.");
  const id=await rpc("account.payment","create",[[{
    date:m.fecha, amount:Math.abs(m.importe),
    payment_type:"outbound", partner_type:"supplier", partner_id:EYG_PARTNER,
    journal_id:origen, destination_journal_id:destino, is_internal_transfer:true,
    payment_method_line_id:metodo, destination_account_id:CTA_PUENTE }]]);
  const pid=Array.isArray(id)?id[0]:id;
  await rpc("account.payment","action_post",[[pid]]);
  const pago=(await rpc("account.payment","read",[[pid],["name","move_id","paired_internal_transfer_payment_id"]]))[0];
  if(!pago.paired_internal_transfer_payment_id) throw new Error("Odoo no creó la contrapartida del pago "+pago.name+". No concilio nada: hay que mirarlo a mano.");
  const par=(await rpc("account.payment","read",[[pago.paired_internal_transfer_payment_id[0]],["name","move_id"]]))[0];
  /* La pata a conciliar está en el asiento de ESTE banco, no en el del otro. */
  const mioEs = o.entra ? par : pago;
  const cta   = o.entra ? CTA_RECIBOS : CTA_PAGOS;
  const mv=(await rpc("account.move","read",[[mioEs.move_id[0]],["line_ids"]]))[0];
  const lins=await rpc("account.move.line","read",[mv.line_ids,["id","account_id"]]);
  const apunte=lins.find(x=>x.account_id[0]===cta);
  if(!apunte) throw new Error("El asiento "+mioEs.name+" no tiene la pata esperada en "+(o.entra?"Recibos":"Pagos")+" pendientes.");
  return {pago, par, apunteId:apunte.id, cta};
}

window.crearTransferencia=(i)=>conTrabajo(async()=>{
  const m=ST.movs[i];
  if(!m.otroBanco){ log("No pude identificar el otro banco: sin eso no creo nada","e"); return; }
  if(!m.yaEsta){ log("Primero hay que cargar el movimiento a Odoo","e"); return; }
  if(m.yaEsta.is_reconciled){ log("Ese movimiento ya está conciliado","e"); return; }
  try{
    const r=await transferenciaInterna(m);
    log("Creada la transferencia "+r.pago.name+" y su contrapartida "+r.par.name+" — "+
        (m.otroBanco.entra? m.otroBanco.nombre+" → "+BANCOS[ST.banco].nombre : BANCOS[ST.banco].nombre+" → "+m.otroBanco.nombre),"o");
    await conciliarLinea(m, r.apunteId, r.cta);
    log("Conciliado "+money(m.importe),"o");
    m.yaEsta.is_reconciled=true;
  }catch(e){ log("No se pudo: "+(e.message||e),"e"); }
});

/* Cambia la cuenta transitoria de la línea del extracto por la que corresponde y la
   concilia contra el apunte. Es el mismo paso final de todas las acciones. */
async function conciliarLinea(m, apunteId, cta){
  const mv=await rpc("account.move","read",[[m.yaEsta.move_id[0]],["line_ids"]]);
  const lins=await rpc("account.move.line","read",[mv[0].line_ids,["id","account_id"]]);
  const tra=lins.find(x=>x.account_id[0]===CTA_TRANSIT);
  if(!tra) throw new Error("La línea del extracto ya no tiene su pata en la cuenta transitoria");
  await rpc("account.move.line","write",[[tra.id],{account_id:cta}]);
  await rpc("account.move.line","reconcile",[[tra.id, apunteId]]);
}

/* Conciliar UNO solo. Antes esto lo hacía únicamente el botón masivo: o se resolvían
   todos o ninguno, y no había forma de cerrar un movimiento y dejar el resto para
   mirarlo con calma. Vuelve a verificar el importe contra el candidato, porque entre
   que se leyó el archivo y se aprieta el botón alguien pudo tocar ese apunte. */
window.conciliarUno=(i)=>conTrabajo(async()=>{
  const m=ST.movs[i];
  if(!m.yaEsta){ log("Primero hay que cargar el movimiento a Odoo","e"); return; }
  if(m.yaEsta.is_reconciled){ log("Ese movimiento ya está conciliado","e"); return; }
  if(m.cands.length!==1){ log("Ese movimiento no tiene un único candidato","e"); return; }
  const c=m.cands[0];
  const vivo=await rpc("account.move.line","read",[[c.id],["amount_residual","full_reconcile_id","partner_id","name"]]);
  if(!vivo.length||vivo[0].full_reconcile_id){ log("El candidato ya fue conciliado por otro lado — volvé a subir el archivo","e"); return; }
  if(Math.abs(Math.abs(vivo[0].amount_residual)-Math.abs(m.importe))>0.005){
    log("El saldo del candidato cambió ("+money(vivo[0].amount_residual)+" contra "+money(m.importe)+"): no concilio","e"); return; }
  const cta = sale(m) ? CTA_PAGOS : CTA_RECIBOS;
  await conciliarLinea(m, c.id, cta);
  m.yaEsta.is_reconciled=true;
  const quien=vivo[0].partner_id?vivo[0].partner_id[1]:"";
  log("Conciliado "+money(m.importe)+(quien?" — "+quien:"")+(m.porCheque?"  (por N° de cheque "+m.cpbte+")":""),"o");
});

window.elegirCand=(i)=>conTrabajo(async()=>{
  const m=ST.movs[i]; const sel=document.getElementById("sel"+i);
  if(!sel||!sel.value){ log("No elegiste ningún candidato"); return; }
  if(!m.yaEsta){ log("Primero hay que cargar el movimiento","e"); return; }
  const mv=await rpc("account.move","read",[[m.yaEsta.move_id[0]],["line_ids"]]);
  const lins=await rpc("account.move.line","read",[mv[0].line_ids,["account_id"]]);
  const tra=lins.find(x=>x.account_id[0]===CTA_TRANSIT);
  if(!tra){ log("Ese movimiento ya no está pendiente","e"); return; }
  const cta = m.tipo==="cobro" ? CTA_RECIBOS : CTA_PAGOS;
  await rpc("account.move.line","write",[[tra.id],{account_id:cta}]);
  await rpc("account.move.line","reconcile",[[tra.id,+sel.value]]);
  log("Conciliado "+money(m.importe)+" con el candidato que elegiste","o");
});

/* ══════════════════════════════════════════════════════════════════════════
   ARRANQUE
   ══════════════════════════════════════════════════════════════════════════ */
async function procesar(files){
  try{
    ST.listo=false; ST.logs=[]; ST.filtro=null; ST.archivos=[]; render();
    document.getElementById("app").insertAdjacentHTML("beforeend",
      '<div class="cargando">Leyendo '+files.length+' archivo(s) y consultando Odoo…</div>');

    /* ---- leer todos, cada uno con su propia cadena de saldos ---- */
    const porArchivo=[], errores=[];
    for(const f of files){
      try{
        const {movs}=leerArchivo(await f.arrayBuffer());
        if(!movs.length){ errores.push(f.name+": no tiene movimientos con fecha válida"); continue; }
        const fallas=validarCadena(movs);
        const dias=[...new Set(movs.map(m=>m.fecha))].sort();
        porArchivo.push({nombre:f.name, movs, fallas, dias});
      }catch(e){ errores.push(f.name+": "+(e.message||e)); }
    }
    if(!porArchivo.length) throw new Error(errores.join(" · ")||"Ningún archivo se pudo leer.");
    errores.forEach(e=>log("No se pudo leer — "+e,"e"));

    /* ---- el mismo día en dos archivos: se usa una sola vez ---- */
    porArchivo.sort((a,b)=>a.dias[0].localeCompare(b.dias[0]));
    const vistos=new Set(), todos=[], repetidos=[];
    porArchivo.forEach(a=>{
      const nuevosDias=a.dias.filter(d=>!vistos.has(d));
      const repes=a.dias.filter(d=>vistos.has(d));
      if(repes.length) repetidos.push({archivo:a.nombre,dias:repes});
      a.dias.forEach(d=>vistos.add(d));
      todos.push(...a.movs.filter(m=>nuevosDias.includes(m.fecha)));
      ST.archivos.push({nombre:a.nombre, movs:a.movs.length, dias:a.dias, fallas:a.fallas.length});
    });
    repetidos.forEach(r=>log("El día "+r.dias.join(", ")+" ya venía en otro archivo: de "+r.archivo+" se ignora","e"));

    todos.sort((a,b)=>a.fecha.localeCompare(b.fecha));
    const conFalla=porArchivo.filter(a=>a.fallas.length);
    ST.validacion={
      ok:!conFalla.length,
      fallas:conFalla.flatMap(a=>a.fallas.map(f=>({...f,archivo:a.nombre}))),
      archivos:porArchivo.length, dias:[...vistos].sort(),
      inicial:todos.length?Math.round((todos[0].saldo-todos[0].importe)*100)/100:0,
      final:todos.length?todos[todos.length-1].saldo:0
    };
    ST.movs=todos; ST.mapaCuit={};
    log("Leídos "+porArchivo.length+" archivo(s): "+todos.length+" movimientos en "+vistos.size+" día(s)");
    if(conFalla.length){ ST.listo=true; render(); return; }
    await analizar(todos);
    ST.listo=true; render();
  }catch(e){
    ST.listo=true; ST.movs=[]; ST.validacion=null;
    document.getElementById("app").innerHTML=zonaCarga()+
      '<div class="aviso bad">⛔ <div><b>No se pudo leer.</b><br>'+esc(e.message||String(e))+'</div></div>';
    engancharDrop();
  }
}
