<script>
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

/* ===== Constantes del comprobante OC-X de préstamo (ver análisis en memoria) ===== */
const JOURNAL   = 10;                    // Vendor Bills
const DOCTYPE   = 73;                    // (99) Other vouchers
const POS       = "00002";               // punto de venta de préstamos
const ACC = { neto:350, interes:260, sellados:233 };   // Recibos pend. / Interest on loans / Sellados
const TAX = { exento:57, iva105:63, percep:136 };    // 0% NT / IVA 10,5% / percepción IVA 1,5% (cuenta 337)
const SELLADO_RATE = 0.002515;           // sellado ≈ 0,2515% del capital (constante en los préstamos vistos).
                                         // Sirve para ESTIMAR el neto (capital − sellado) cuando no está el extracto.
const ODOO = "https://drogueriaeyg.odoo.com";

/* Bancos que dan préstamos → su partner en Odoo (subcuenta "…- Préstamo/PRESTAMOS").
   `det` = palabras para autodetectar el banco desde el texto del archivo. */
const BANKS = [
  {k:"santafe",   nom:"Banco Santa Fe", partner:3947, det:[/santa\s*fe/i]},
  {k:"bbva",      nom:"Banco BBVA",     partner:3782, det:[/bbva/i]},
  {k:"macro",     nom:"Banco Macro",    partner:2422, det:[/macro/i]},
  {k:"credicoop", nom:"Banco Credicoop",partner:2188, det:[/credicoop/i]},
  {k:"nacion",    nom:"Banco Nación",   partner:4046, det:[/naci[oó]n/i]},
];
// Bancos agregados a mano en la sesión (opción "+ Agregar otro banco").
function allBanks(){ return BANKS.concat(ST.customBanks||[]); }
function bankByK(k){ return allBanks().find(b=>b.k===k) || null; }

const money2 = n => "$"+Number(n||0).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = EYG.esc;
const round2 = n => Math.round((n+Number.EPSILON)*100)/100;
const norm = s => String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();

// Números robustos a formato AR (1.234.567,89) y US (1,234,567.89): el ÚLTIMO
// separador es el decimal (si tiene 2 dígitos); el otro es de miles.
function parseNum(raw){
  if(typeof raw==="number") return raw;
  let s=String(raw).replace(/[^\d.,-]/g,"").trim();
  if(!s||s==="-") return 0;
  const d=s.lastIndexOf("."), c=s.lastIndexOf(",");
  const dec = d>c ? "." : (c>d ? "," : null);
  if(dec){
    if(s.length-1-s.lastIndexOf(dec)===2){ const oth=dec==="."?",":"."; s=s.split(oth).join("").replace(dec,"."); }
    else s=s.replace(/[.,]/g,"");   // separador de miles, sin decimales
  }
  const n=parseFloat(s); return isNaN(n)?0:n;
}
// Fechas: soporta "DD/MM/YYYY", "M/D/YY" y Date. Desambigua D/M vs M/D por
// la columna constante (mismo día cada mes) o por un componente > 12.
function _dp(s){ const m=String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(!m)return null; let y=+m[3]; if(y<100)y+=2000; return {a:+m[1],b:+m[2],y}; }
function smartDates(list){
  const P=list.map(_dp);
  let aDay=null;
  for(const p of P){ if(!p)continue; if(p.a>12){aDay=true;break;} if(p.b>12){aDay=false;break;} }
  if(aDay===null){ const A=P.filter(Boolean).map(p=>p.a), B=P.filter(Boolean).map(p=>p.b);
    const aC=new Set(A).size===1, bC=new Set(B).size===1; aDay=(bC&&!aC)?false:(aC&&!bC)?true:true; }
  return P.map(p=>{ if(!p)return null; const day=aDay?p.a:p.b, mon=aDay?p.b:p.a;
    return `${p.y}-${String(mon).padStart(2,"0")}-${String(day).padStart(2,"0")}`; });
}
function menosUnMes(ymd){ if(!ymd)return ""; const [y,m,d]=ymd.split("-").map(Number);
  const dt=new Date(Date.UTC(y,m-1,d)); dt.setUTCMonth(dt.getUTCMonth()-1);
  return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,"0")}-${String(dt.getUTCDate()).padStart(2,"0")}`; }
// Columnas del cuadro (para Excel): alias normalizados por concepto.
const COLS={ venc:["vencimiento","vto","fecha"], total:["total a pagar","total cuota","total","importe cuota"],
  capital:["capital","amortizacion"], interes:["intereses","interes"], iva:["iva"],
  seguro:["seguro","seguros"], otrocap:["otro capital"], otros:["otros rubros","otros","gastos","cargos"] };
function matchCol(h){ const n=norm(h); for(const k in COLS){ if(COLS[k].some(a=>n===a||n.includes(a))) return k; } return null; }

let ST = { form:{banco:"santafe", fecha:EYG.argToday(), numero:"", capital:"", neto:"", nro:"", texto:""},
           loan:null, customBanks:[], _bankHits:[], netoManual:false, fileName:"", extracting:false, autodet:{}, termByCount:{}, parsed:null, error:null, generating:false, result:null };

/* =========================================================================
   LECTURA DE ARCHIVOS
   ========================================================================= */
// PDF → texto, reconstruyendo las filas por su posición vertical (cada fila del
// cuadro de cuotas queda en una línea, aunque el PDF la guarde en pedazos).
async function pdfToText(arrayBuffer){
  if(!window.pdfjsLib) throw new Error("El lector de PDF no cargó (revisá la conexión).");
  const pdf = await pdfjsLib.getDocument({data:arrayBuffer}).promise;
  const out=[];
  for(let pg=1; pg<=pdf.numPages; pg++){
    const page = await pdf.getPage(pg);
    const tc = await page.getTextContent();
    const items = tc.items.map(it=>({x:it.transform[4], y:it.transform[5], s:it.str}))
                          .filter(it=>String(it.s).trim()!=="");
    items.sort((a,b)=> (b.y - a.y) || (a.x - b.x));   // de arriba hacia abajo, izq→der
    let cur=[], cy=null;
    for(const it of items){
      if(cy===null || (cy - it.y) <= 3){ cur.push(it); if(cy===null) cy=it.y; }
      else { out.push(cur.sort((a,b)=>a.x-b.x).map(p=>p.s).join(" ")); cur=[it]; cy=it.y; }
    }
    if(cur.length) out.push(cur.sort((a,b)=>a.x-b.x).map(p=>p.s).join(" "));
  }
  return out.map(l=>l.replace(/\s+/g," ").trim()).join("\n");
}
// Excel/CSV → texto plano (para autodetectar banco y para el cuadro "texto leído").
function sheetFlatten(wb){ const out=[]; wb.SheetNames.forEach(nm=>{ XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:false,defval:""}).forEach(r=>out.push((r||[]).join("  "))); }); return out.join("\n"); }

async function onFile(file){
  if(!file) return;
  ST.fileName=file.name; ST.extracting=true; ST.error=null; ST.result=null; render();
  try{
    const buf = await file.arrayBuffer();
    let loan, text="";
    if(/\.pdf$/i.test(file.name) || file.type==="application/pdf"){ text=await pdfToText(buf); loan=parsePdfLoan(text); }
    else if(/\.(xlsx|xls|csv)$/i.test(file.name)){ if(!window.XLSX) throw new Error("El lector de Excel no cargó."); const wb=XLSX.read(buf,{type:"array"}); loan=parseExcelLoan(wb); text=sheetFlatten(wb); }
    else if(/\.(txt|text)$/i.test(file.name) || /^text\//.test(file.type||"")){ text=new TextDecoder().decode(buf); loan=parsePdfLoan(text); }
    else throw new Error("Formato no reconocido. Subí PDF, Excel o texto — o pegá el contenido abajo.");
    ST.form.texto = text; ST.extracting=false;
    aplicarLoan(loan, text);    // vuelca los datos al formulario + analiza
  }catch(e){
    ST.extracting=false; ST.error="No pude leer el archivo: "+(e.message||e); render();
  }
}

/* =========================================================================
   AUTODETECCIÓN (robusta a distintos bancos: varios patrones por dato)
   ========================================================================= */
function detectarBanco(text){ const b=BANKS.find(b=>b.det.some(rx=>rx.test(text))); return b?b.k:null; }
function buscarTexto(text, patrones){
  for(const p of patrones){ const m=text.match(new RegExp(p+"[^0-9A-Za-z]{0,10}([A-Za-z0-9\\-]{4,})","i")); if(m) return m[1]; }
  return null;
}

/* =========================================================================
   PARSEO DEL CUADRO DE CUOTAS → objeto "loan" normalizado
   { cuotas:[{venc,capital,interes,iva,total}], capital, interes, iva,
     totalCuotas, extras:{rubro:monto}, extraTot, nro, fecha }
   ========================================================================= */
// PDF/texto: una fila válida tiene una fecha y ≥5 importes. Posición (Santa Fe):
// capital, interés, cargos, comp, punit, IVA, total. Robusto a números US/AR.
function parsePdfLoan(text){
  const rows=[];
  for(const ln of String(text).split(/\r?\n/)){
    const dm = ln.match(/\d{1,2}\/\d{1,2}\/\d{2,4}/);
    const nums = (ln.match(/-?\d{1,3}(?:[.,]\d{3})*[.,]\d{2}/g)||[]);
    if(!dm || nums.length<5) continue;
    const v = nums.map(parseNum);
    rows.push({ rawv:dm[0], capital:v[0], interes:v[1], iva:v[v.length-2], total:v[v.length-1] });
  }
  const ds=smartDates(rows.map(r=>r.rawv)); rows.forEach((r,i)=>r.venc=ds[i]);
  const seen=new Set();
  const cuotas=rows.filter(r=>{ const k=r.venc+"|"+r.total; if(seen.has(k))return false; seen.add(k); return true; })
                   .sort((a,b)=>String(a.venc).localeCompare(String(b.venc)));
  const nro=(text.match(/N[ÚU]MERO\s+DE\s+PR[ÉE]STAMO\s*[\r\n]*\s*(\d{4,})/i)||[])[1]||null;
  return finalizeLoan(cuotas, {nro, extras:{}});
}
// Excel/CSV: mapea columnas por su encabezado (orden y nombres varían entre bancos).
function parseExcelLoan(wb){
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""});
  let hi=-1, map={};
  for(let i=0;i<rows.length;i++){ const r=rows[i]||[];
    if(r.some(c=>norm(c)==="vencimiento" || norm(c).includes("vencimiento"))){ hi=i;
      r.forEach((c,j)=>{ const k=matchCol(c); if(k&&map[k]==null) map[k]=j; }); break; } }
  if(hi<0 || map.venc==null || map.total==null) throw new Error("No reconocí el cuadro de cuotas del Excel (necesito columnas Vencimiento y Total).");
  const data=[];
  for(let i=hi+1;i<rows.length;i++){ const r=rows[i]||[];
    if(norm(r[0]).startsWith("total")) break;
    const vc=r[map.venc]; if(vc===""||vc==null){ if(data.length) break; else continue; }
    data.push(r); }
  const vencs=smartDates(data.map(r=>r[map.venc]));
  const g=(r,k)=> map[k]==null?0:parseNum(r[map[k]]);
  const cuotas=data.map((r,i)=>({ venc:vencs[i], capital:g(r,"capital")+g(r,"otrocap"),
    interes:g(r,"interes"), iva:g(r,"iva"), total:g(r,"total") }));
  const extras={};
  const seg=round2(data.reduce((a,r)=>a+g(r,"seguro"),0)); if(seg>0.005) extras["Seguro"]=seg;
  const otr=round2(data.reduce((a,r)=>a+g(r,"otros"),0));  if(otr>0.005) extras["Otros rubros"]=otr;
  return finalizeLoan(cuotas, {nro:null, extras});
}
function finalizeLoan(cuotas, opt){
  const interes=round2(cuotas.reduce((a,c)=>a+(c.interes||0),0));
  const iva=round2(cuotas.reduce((a,c)=>a+(c.iva||0),0));
  const totalCuotas=round2(cuotas.reduce((a,c)=>a+(c.total||0),0));
  const capital=round2(cuotas.reduce((a,c)=>a+(c.capital||0),0));
  const extras=Object.assign({}, opt.extras||{});
  // Un rubro extra ≈ 1,5% del interés = percepción de IVA (impuesto id 136, cuenta 337).
  // Lo separamos de los extras "desconocidos" para poder generar el préstamo.
  let percepcion=0;
  for(const k of Object.keys(extras)){
    if(Math.abs(extras[k]-round2(interes*0.015)) < Math.max(1, interes*0.0006)){ percepcion=extras[k]; delete extras[k]; break; }
  }
  const extraTot=round2(Object.values(extras).reduce((a,v)=>a+v,0));
  const cu=cuotas.map(c=>({venc:c.venc, interes:round2(c.interes||0), iva:round2(c.iva||0), total:round2(c.total||0)}));
  return { cuotas:cu, capital, interes, iva, percepcion, totalCuotas, extras, extraTot,
           nro:opt.nro||null, fecha:menosUnMes(cu[0]&&cu[0].venc) };
}
// Vuelca el "loan" leído al formulario (banco, nº, capital, fecha) y analiza.
function aplicarLoan(loan, text){
  ST.loan=loan; ST.netoManual=false; const a={};   // archivo nuevo → el neto se recalcula
  const b=detectarBanco(text||""); if(b){ ST.form.banco=b; a.banco=true; }
  const nro=loan.nro || buscarTexto(text||"",["N[ÚU]MERO\\s+DE\\s+PR[ÉE]STAMO","NRO\\.?\\s+DE\\s+PR[ÉE]STAMO","N[°º]?\\s+OPERACI[ÓO]N"]);
  if(nro){ ST.form.nro=nro; a.nro=true; }
  if(loan.capital){ ST.form.capital=String(loan.capital); a.capital=true; }
  if(loan.fecha){ ST.form.fecha=loan.fecha; a.fecha="estim"; }
  ST.autodet=a; analizar();     // analizar estima el neto desde el capital
}
// Neto tocado a mano → no lo pisamos con la estimación. Si lo vacían, vuelve a estimarse.
function setNeto(v){ ST.form.neto=v; ST.netoManual = String(v||"").trim()!==""; }
function reanalizar(){ try{ aplicarLoan(parsePdfLoan(ST.form.texto||""), ST.form.texto||""); }catch(e){ ST.error="No pude releer el texto: "+(e.message||e); render(); } }

/* ---- Selección / alta de banco ---- */
function onBanco(v){ ST.form.banco=v; if(v!=="__add__" && ST.loan) analizar(); else render(); if(v==="__add__"){ const q=document.getElementById("bankq"); if(q) q.focus(); } }
let _bankT=null;
function buscarBanco(q){
  clearTimeout(_bankT);
  _bankT=setTimeout(async ()=>{
    const box=document.getElementById("bankres"); if(!box) return;
    if((q||"").trim().length<3){ box.innerHTML='<div class="hint">Escribí al menos 3 letras…</div>'; return; }
    box.innerHTML='<div class="hint">Buscando…</div>';
    try{
      const r=await EYG.rpc("res.partner","search_read",[[["name","ilike",q]]],{fields:["id","name"],limit:12});
      ST._bankHits=r;
      box.innerHTML = r.length
        ? r.map((p,i)=>`<div class="bankopt" onclick="addBankIdx(${i})">${esc(p.name)} <span style="color:var(--gris2)">#${p.id}</span></div>`).join("")
        : '<div class="hint">Sin resultados. Probá con el nombre del banco.</div>';
    }catch(e){ box.innerHTML='<div class="hint" style="color:var(--err)">Error al buscar.</div>'; }
  }, 320);
}
function addBankIdx(i){
  const p=ST._bankHits[i]; if(!p) return;
  const k="cust-"+p.id;
  if(!ST.customBanks.some(b=>b.k===k)) ST.customBanks.push({k, nom:p.name, partner:p.id, det:[]});
  ST.form.banco=k; if(ST.loan) analizar(); else render();
}

function analizar(){
  ST.error=null; ST.result=null;
  const f=ST.form, L=ST.loan;
  if(!L || !L.cuotas.length){ ST.parsed=null; ST.error="Subí el archivo del banco (PDF o Excel) o pegá el detalle del cuadro."; return render(); }

  const capital=round2(parseNum(f.capital)|| L.capital || 0);
  // Neto acreditado: NO es obligatorio. Si no se cargó a mano, se ESTIMA = capital −
  // sellado (0,2515%). El split neto/sellado no afecta el balance (siempre suman el
  // capital), así que se puede dejar estimado y corregir si el extracto difiere.
  let neto, netoEstim=false;
  if(ST.netoManual && parseNum(f.neto)>0){ neto=round2(parseNum(f.neto)); }
  else { neto = capital>0 ? round2(capital*(1-SELLADO_RATE)) : 0; ST.form.neto = neto?String(neto):""; netoEstim = neto>0; }
  ST.autodet=ST.autodet||{}; ST.autodet.neto = netoEstim ? "estim" : (ST.netoManual ? "manual" : "");
  const interes=L.interes, iva=L.iva, percepcion=L.percepcion||0, totalCuotas=L.totalCuotas, extras=L.extras||{}, extraTot=L.extraTot||0;
  const sellados=round2(capital-neto);
  const hayExtras=Object.keys(extras).length>0;

  const errs=[];
  if(!bankByK(f.banco)) errs.push("Elegí el banco.");
  if(!capital) errs.push("Falta el capital solicitado.");
  if(neto>capital && capital) errs.push("El neto acreditado no puede ser mayor que el capital.");
  const termId=ST.termByCount[L.cuotas.length];
  if(!termId) errs.push(`No hay un plazo de pago de ${L.cuotas.length} cuotas configurado en Odoo. Avisá para crear uno.`);

  const totalDoc=round2(neto+sellados+interes+extraTot+iva+percepcion);
  const ivaTeorico=round2(interes*0.105);
  const percepTeorico=round2(interes*0.015);
  const okBalance=Math.abs(totalDoc-totalCuotas)<0.05;
  const okIdentPDF=Math.abs(round2(capital+interes+iva+percepcion+extraTot)-totalCuotas)<0.05;

  ST.parsed = errs.length ? null :
    { capital, neto, nro:L.nro||f.nro, cuotas:L.cuotas, interes, iva, percepcion, sellados, extras, extraTot, hayExtras,
      totalCuotas, totalDoc, ivaTeorico, percepTeorico, okBalance, okIdentPDF, termId };
  if(errs.length) ST.error=errs.join(" ");
  render();
}

/* =========================================================================
   GENERACIÓN EN ODOO (receta probada)
   ========================================================================= */
async function generar(){
  if(!ST.parsed || ST.generating) return;
  const f=ST.form, p=ST.parsed, bank=bankByK(f.banco);
  if(!bank){ ST.error="Elegí un banco antes de generar."; return render(); }
  if(p.hayExtras){ ST.error="Este préstamo trae rubros extra ("+Object.keys(p.extras).join(", ")+") que todavía no sé a qué cuenta contable imputar. Definamos esa cuenta y lo habilito."; return render(); }
  ST.generating=true; ST.result=null; ST.error=null; render();
  try{
    const vals={ move_type:"in_invoice", journal_id:JOURNAL, partner_id:bank.partner,
      invoice_date:f.fecha, date:f.fecha, l10n_latam_document_type_id:DOCTYPE,
      l10n_latam_document_number:f.numero, ref:(p.nro?("Prestamo "+p.nro):"Prestamo bancario"),
      invoice_line_ids:[
        [0,0,{name:"Neto acreditado (extracto banco)", account_id:ACC.neto,    quantity:1, price_unit:p.neto,    tax_ids:[[6,0,[TAX.exento]]]}],
        [0,0,{name:"Interes del prestamo",             account_id:ACC.interes, quantity:1, price_unit:p.interes, tax_ids:[[6,0, p.percepcion>0?[TAX.iva105,TAX.percep]:[TAX.iva105] ]]}],
        [0,0,{name:"Sellados",                          account_id:ACC.sellados,quantity:1, price_unit:p.sellados,tax_ids:[[6,0,[TAX.exento]]]}]
      ]};
    const moveId = await EYG.rpc("account.move","create",[vals]);
    await EYG.rpc("account.move","write",[[moveId],{invoice_payment_term_id:p.termId}]);
    let lines = await EYG.rpc("account.move.line","search_read",[[["move_id","=",moveId]]],{fields:["id","display_type","tax_line_id"]});
    const nGen = lines.filter(l=>l.display_type==="payment_term").length;
    if(nGen!==p.cuotas.length) throw new Error(`El plazo generó ${nGen} cuotas y esperaba ${p.cuotas.length}. Documento ${moveId} quedó en borrador.`);
    // Forzar IVA y percepción al valor exacto del banco (ajuste de redondeo por cuota).
    const tcmds=[];
    for(const l of lines.filter(l=>l.display_type==="tax")){
      const tid=Array.isArray(l.tax_line_id)?l.tax_line_id[0]:l.tax_line_id;
      if(tid===TAX.iva105 && Math.abs(p.iva-p.ivaTeorico)>=0.005) tcmds.push([1,l.id,{debit:p.iva,credit:0}]);
      else if(tid===TAX.percep && p.percepcion>0 && Math.abs(p.percepcion-p.percepTeorico)>=0.005) tcmds.push([1,l.id,{debit:p.percepcion,credit:0}]);
    }
    if(tcmds.length) await EYG.rpc("account.move","write",[[moveId],{line_ids:tcmds}]);
    const cuotaLines = await EYG.rpc("account.move.line","search_read",
      [[["move_id","=",moveId],["display_type","=","payment_term"]]],{fields:["id"],order:"id"});
    const cmds = cuotaLines.map((l,i)=>[1,l.id,{name:"cuota #"+(i+1), date_maturity:p.cuotas[i].venc, credit:p.cuotas[i].total, debit:0}]);
    await EYG.rpc("account.move","write",[[moveId],{line_ids:cmds}]);
    const hdr = await EYG.rpc("account.move","read",[[moveId],["name","amount_total"]]);
    ST.result = { moveId, name:hdr[0].name, total:hdr[0].amount_total, balanceada:Math.abs(round2(hdr[0].amount_total)-p.totalCuotas)<0.05 };
  }catch(e){ ST.error="No se pudo generar: "+(e.message||e); }
  ST.generating=false; render();
}

async function proximoNumero(){
  try{
    const r = await EYG.rpc("account.move","search_read",[[["name","like","OC-X "+POS+"-"]]],
      {fields:["l10n_latam_document_number"], order:"l10n_latam_document_number desc", limit:1});
    let next=1;
    if(r && r[0] && r[0].l10n_latam_document_number){ const n=parseInt(String(r[0].l10n_latam_document_number).split("-")[1],10); if(!isNaN(n)) next=n+1; }
    return POS+"-"+String(next).padStart(8,"0");
  }catch(e){ return POS+"-00000001"; }
}
async function cargarTerms(){
  try{
    const terms = await EYG.rpc("account.payment.term","search_read",[[]],{fields:["id","name","line_ids"]});
    const map={};
    for(const t of terms){ const c=(t.line_ids||[]).length; if(!c) continue;
      if(map[c]===undefined || /prestamo|préstamo/i.test(t.name||"")) map[c]=t.id; }
    ST.termByCount=map;
  }catch(e){ ST.termByCount={}; }
}

/* =========================================================================
   RENDER
   ========================================================================= */
function setF(k,v){ ST.form[k]=v; }
function onDrop(e){ e.preventDefault(); const el=document.getElementById("drop"); if(el)el.classList.remove("over"); const fl=e.dataTransfer&&e.dataTransfer.files; if(fl&&fl[0]) onFile(fl[0]); }
function onOver(e){ e.preventDefault(); const el=document.getElementById("drop"); if(el)el.classList.add("over"); }
function onLeave(e){ const el=document.getElementById("drop"); if(el)el.classList.remove("over"); }

function render(){
  const f=ST.form, p=ST.parsed, a=ST.autodet||{};
  const bankOpts = allBanks().map(b=>`<option value="${b.k}" ${f.banco===b.k?"selected":""}>${esc(b.nom)}</option>`).join("")
    + `<option value="__add__" ${f.banco==="__add__"?"selected":""}>➕ Agregar otro banco…</option>`;

  // Card 1: subir archivo
  let html = `<div class="card">
    <h3><span class="step">1</span>Subir el archivo del banco</h3>
    <div class="cap">PDF, Excel o texto. Leo capital, N° de préstamo y el cuadro de cuotas automáticamente.</div>
    <div id="drop" class="drop" ondragover="onOver(event)" ondragleave="onLeave(event)" ondrop="onDrop(event)" onclick="document.getElementById('file').click()">
      ${ST.extracting
        ? `<div class="big">⏳</div><div class="t">Leyendo ${esc(ST.fileName)}…</div><div class="s"><span class="spinner dark"></span>extrayendo datos</div>`
        : `<div class="big">📄⬆️</div><div class="t">Arrastrá el archivo acá o hacé clic para elegirlo</div><div class="s">PDF · Excel (.xlsx/.csv) · texto</div>`}
      <input id="file" type="file" accept=".pdf,.xlsx,.xls,.csv,.txt" onchange="onFile(this.files[0])">
    </div>
    ${ST.fileName && !ST.extracting ? `<div style="margin-top:10px"><span class="filechip">📎 ${esc(ST.fileName)}</span></div>`:""}
    <details class="raw"><summary>Ver / editar el texto leído</summary>
      <textarea oninput="setF('texto',this.value)" placeholder="Acá aparece lo que leí del archivo. También podés pegar el texto a mano.">${esc(f.texto)}</textarea>
      <div class="actions"><button class="btn ghost" onclick="reanalizar()">Volver a analizar el texto</button></div>
    </details>
  </div>`;

  // Card 2: datos (autocompletados, editables)
  const flag=(k)=> a[k]?'<span style="color:var(--ok);font-weight:700"> ✓ leído</span>':'';
  html += `<div class="card">
    <h3><span class="step">2</span>Datos del comprobante</h3>
    <div class="cap">Lo que leí del archivo (fondo celeste) y lo que cargás a mano (fondo amarillo). Revisá y corregí si hace falta.</div>
    <div class="grid">
      <div><label class="req">Banco${flag('banco')}</label><select class="${a.banco?'auto':''}" onchange="onBanco(this.value)">${bankOpts}</select>
        ${f.banco==="__add__"?`<div style="margin-top:8px">
          <input id="bankq" placeholder="Buscá el banco en Odoo (ej. Nación, ICBC…)" oninput="buscarBanco(this.value)" autocomplete="off">
          <div class="hint">Elegí la subcuenta de <b>préstamo</b> del banco (ej. "… - Préstamo").</div>
          <div id="bankres" style="margin-top:6px;border:1px solid var(--line);border-radius:9px;overflow:hidden;max-height:220px;overflow-y:auto"></div>
        </div>`:""}</div>
      <div><label class="req">Fecha del préstamo${a.fecha==='estim'?'<span style="color:var(--warn);font-weight:700"> ~ estimada</span>':''}</label><input class="${a.fecha==='estim'?'manual':''}" type="date" value="${esc(f.fecha)}" onchange="setF('fecha',this.value)">${a.fecha==='estim'?'<div class="hint">Estimada (primer vencimiento − 1 mes). <b>Confirmá con el extracto</b> la fecha de acreditación.</div>':''}</div>
      <div><label class="req">N° de comprobante</label><input value="${esc(f.numero)}" oninput="setF('numero',this.value)" placeholder="${POS}-00000014"><div class="hint">Serie ${POS} (préstamos). Sugerido: el próximo libre.</div></div>
      <div><label>N° de préstamo (banco)${flag('nro')}</label><input class="${a.nro?'auto':''}" value="${esc(f.nro)}" oninput="setF('nro',this.value)" placeholder="del archivo"></div>
      <div><label class="req">Capital solicitado${flag('capital')}</label><input class="${a.capital?'auto':''}" value="${esc(f.capital)}" oninput="setF('capital',this.value)" placeholder="del archivo"></div>
      <div><label>Neto acreditado${a.neto==='estim'?'<span style="color:var(--teal);font-weight:700"> · calculado</span>':(a.neto==='manual'?'<span style="color:var(--gris2);font-weight:700"> · a mano</span>':'')}</label><input class="${a.neto==='estim'?'auto':'manual'}" value="${esc(f.neto)}" oninput="setNeto(this.value)" placeholder="se calcula del capital"><div class="hint">${a.neto==='estim'?`Lo calculo = capital − sellado 0,2515% (sellados ≈ ${money2(round2((parseNum(f.capital)||0)-(parseNum(f.neto)||0)))}). Corregí sólo si el extracto difiere.`:'Sellados = capital − neto. Se calcula solo; podés corregirlo con el dato del extracto.'}</div></div>
    </div>
    <div class="actions"><button class="btn" onclick="analizar()">Analizar</button>${p?`<span style="color:var(--ok);font-weight:700;font-size:13px">✓ ${p.cuotas.length} cuotas leídas</span>`:""}</div>
  </div>`;

  if(ST.error) html += `<div class="banner err"><b>Revisá:</b> ${esc(ST.error)}</div>`;

  // Card 3: vista previa
  if(p){
    const rows = p.cuotas.map((c,i)=>`<tr><td>${i+1}</td><td>${c.venc.split("-").reverse().join("/")}</td><td class="r">${money2(c.interes)}</td><td class="r">${money2(c.iva)}</td><td class="r">${money2(c.total)}</td></tr>`).join("");
    const ivaDif = Math.abs(p.iva-p.ivaTeorico)>=0.005;
    html += `<div class="card">
      <h3><span class="step">3</span>Vista previa del comprobante</h3>
      <div class="cap">Así queda en Odoo. Revisá antes de generar.</div>
      <div class="pv-tiles">
        <div class="pv-tile"><div class="l">Neto acreditado</div><div class="v">${money2(p.neto)}</div></div>
        <div class="pv-tile"><div class="l">Interés</div><div class="v">${money2(p.interes)}</div></div>
        <div class="pv-tile"><div class="l">Sellados</div><div class="v">${money2(p.sellados)}</div></div>
        <div class="pv-tile"><div class="l">IVA 10,5%</div><div class="v">${money2(p.iva)}</div></div>
        ${p.percepcion>0?`<div class="pv-tile"><div class="l">Percep. IVA 1,5%</div><div class="v">${money2(p.percepcion)}</div></div>`:""}
        ${Object.entries(p.extras||{}).map(([k,v])=>`<div class="pv-tile" style="border-color:#EAD9A0;background:var(--warnbg)"><div class="l">${esc(k)}</div><div class="v">${money2(v)}</div></div>`).join("")}
        <div class="pv-tile tot"><div class="l">Total (${p.cuotas.length} cuotas)</div><div class="v">${money2(p.totalDoc)}</div></div>
      </div>
      ${p.hayExtras?`<div class="check bad"><span class="ic">⚠️</span> Este préstamo trae <b>${esc(Object.keys(p.extras).join(", "))}</b> — falta definir a qué cuenta contable van esos rubros antes de poder generarlo. Avisame cuál es.</div>`:""}
      <div class="check ${p.okBalance?'ok':'bad'}"><span class="ic">${p.okBalance?'✓':'✕'}</span> Débitos = créditos: ${money2(p.totalDoc)} vs ${money2(p.totalCuotas)} ${p.okBalance?'(cuadra)':'(NO cuadra)'}</div>
      <div class="check ${p.okIdentPDF?'ok':'bad'}"><span class="ic">${p.okIdentPDF?'✓':'✕'}</span> Capital + Interés + IVA = suma de cuotas ${p.okIdentPDF?'(el archivo cierra)':'(revisá los números)'}</div>
      ${ivaDif?`<div class="check ok"><span class="ic">ℹ️</span> El IVA del banco (${money2(p.iva)}) difiere ${money2(Math.abs(p.iva-p.ivaTeorico))} del 10,5% teórico por redondeo. Se fuerza al del banco.</div>`:""}
      <table class="cuotas">
        <thead><tr><th>#</th><th>Vencimiento</th><th class="r">Interés</th><th class="r">IVA</th><th class="r">Total cuota</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot class="foot"><tr><td colspan="2">Totales</td><td class="r">${money2(p.interes)}</td><td class="r">${money2(p.iva)}</td><td class="r">${money2(p.totalCuotas)}</td></tr></tfoot>
      </table>
      <div class="actions">
        <button class="btn big" onclick="generar()" ${(!p.okBalance||p.hayExtras||ST.generating)?'disabled':''}>${ST.generating?'<span class="spinner"></span>Generando…':'Generar en Odoo (borrador)'}</button>
        <span class="hint">Banco: <b>${esc((bankByK(f.banco)||{}).nom||'—')}</b> · N° ${esc(f.numero||'(definí el número)')}</span>
      </div>
    </div>`;
  }

  if(ST.result){
    const r=ST.result;
    html += `<div class="banner ok">✅ <b>Borrador creado:</b> ${esc(r.name)} · Total ${money2(r.total)} ${r.balanceada?'(balanceado)':'<b style="color:var(--err)">(revisar balance)</b>'}.
      <a href="${ODOO}/web#id=${r.moveId}&model=account.move&view_type=form" target="_blank">ver en Odoo ↗</a>
      &nbsp;·&nbsp; <a href="#" onclick="nuevo();return false">cargar otro</a></div>`;
  }

  document.getElementById("app").innerHTML = html;
}
function nuevo(){ proximoNumero().then(n=>{ ST.form={banco:ST.form.banco, fecha:EYG.argToday(), numero:n, capital:"", neto:"", nro:"", texto:""}; ST.loan=null; ST.netoManual=false; ST.fileName=""; ST.autodet={}; ST.parsed=null; ST.error=null; ST.result=null; render(); }); }

/* EN PRUEBAS: gateado al super-admin (Diego). Ver core.js SUPER. */
EYG.guard(["finanzas","direccion","admin"],{pruebas:["a3dfd1b309dd41ad2c8ae3562a8e00c09ae03f8dd8194b75eea5a3db5c003122"]}).then(async ()=>{
  await cargarTerms();
  ST.form.numero = await proximoNumero();
  render();
});
</script>
