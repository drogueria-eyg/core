<style>
  :root{
    --teal:#048782; --teal-deep:#04635F; --teal-med:#0AA89F; --aqua:#5FC8BF;
    --agua:#E2F1EF; --coral:#EC8B5E; --ink:#0E1F1D; --gris:#5F716E; --gris2:#8A9A97;
    --surface:#fff; --bg:#F4F8F7; --line:#DCE8E6; --radius:12px;
    --shadow:0 1px 2px rgba(6,65,62,.05), 0 6px 24px rgba(6,65,62,.06);
    --ok:#1F8A5F; --warn:#B7791F; --bad:#C0392B; --info:#5B8DEF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .topbar{background:var(--teal-deep);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:13px;position:sticky;top:0;z-index:30}
  .mono{font-family:Georgia,serif;font-weight:700;font-size:23px;letter-spacing:.5px;line-height:1}
  .mono .y{color:var(--aqua)}
  .topbar .tag{font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:20px}
  .topbar .title{font-weight:700;font-size:15px;margin-left:4px}
  .topbar .back{margin-left:auto;color:#fff;text-decoration:none;font-size:13px;font-weight:600;opacity:.85}
  .topbar .back:hover{opacity:1}
  .wrap{max-width:1240px;margin:0 auto;padding:20px 22px 90px}

  .wip{background:#FBF3D9;border:1px solid #EAD9A0;color:#8A6D1A;border-radius:10px;padding:10px 14px;font-size:12.5px;line-height:1.5;margin-bottom:16px;display:flex;gap:9px;align-items:flex-start}
  .wip b{color:#6B5410}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line)}
  .tab{font-family:inherit;font-size:13.5px;font-weight:700;color:var(--gris);background:none;border:0;border-bottom:2.5px solid transparent;padding:9px 13px 11px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .tab:hover{color:var(--teal-deep)}
  .tab.on{color:var(--teal-deep);border-bottom-color:var(--teal)}
  .tab .pill{font-size:9.5px;font-weight:800;background:var(--coral);color:#fff;border-radius:20px;padding:1px 6px;line-height:1.5}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:11px;margin-bottom:16px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow);text-align:left;font-family:inherit;cursor:default}
  .kpi.clic{cursor:pointer;transition:transform .12s,box-shadow .12s}
  .kpi.clic:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(6,65,62,.09),0 12px 30px rgba(6,65,62,.10)}
  .kpi .l{font-size:11px;color:var(--gris);font-weight:700;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
  .kpi .n{font-size:22px;font-weight:800;line-height:1.15;margin-top:6px}
  .kpi .s{font-size:11.5px;color:var(--gris2);font-weight:600;margin-top:3px}
  .kpi.big .n{font-size:27px}
  .neg{color:var(--bad)}.pos{color:var(--ok)}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px}
  .panel h3{font-size:14.5px;font-weight:800;color:var(--teal-deep);margin-bottom:3px;display:flex;align-items:center;gap:7px}
  .panel .sub{font-size:12px;color:var(--gris);margin-bottom:14px;line-height:1.5}

  .cuentas{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:11px}
  .cta{border:1px solid var(--line);border-radius:11px;padding:13px 14px;background:#fff;position:relative;overflow:hidden}
  .cta::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--teal-med)}
  .cta.al::before{background:var(--warn)} .cta.mal::before{background:var(--bad)}
  .cta .nm{font-size:12.5px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .cta .mt{font-size:19px;font-weight:800;margin:5px 0 2px}
  .cta .dt{font-size:11px;color:var(--gris);font-weight:600;line-height:1.6}
  .cta .badge{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;border-radius:20px;padding:2px 7px}
  .b-ok{background:#E4F4EC;color:var(--ok)} .b-warn{background:#FBF1DC;color:var(--warn)} .b-bad{background:#FBE6E3;color:var(--bad)} .b-info{background:#E8EFFD;color:var(--info)}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:800;padding:8px 9px;border-bottom:1.5px solid var(--line);white-space:nowrap}
  td{padding:9px;border-bottom:1px solid #EEF4F3;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tscroll{overflow-x:auto}
  .muted{color:var(--gris2)}
  .chip{display:inline-block;font-size:10px;font-weight:800;border-radius:20px;padding:2px 7px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}

  .barras{display:flex;align-items:flex-end;gap:5px;height:142px;padding-top:8px}
  .barra{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
  .barra .bb{width:100%;border-radius:4px 4px 0 0;background:var(--teal-med);min-height:2px;transition:opacity .12s}
  .barra.venc .bb{background:var(--bad)} .barra.mes .bb{background:var(--coral)}
  .barra:hover .bb{opacity:.75}
  .barra .lb{font-size:9px;color:var(--gris2);font-weight:700;white-space:nowrap;transform:rotate(-52deg);transform-origin:center;height:28px}

  .filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .filtro{font-family:inherit;font-size:11.5px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--gris);border-radius:20px;padding:5px 12px;cursor:pointer}
  .filtro.on{background:var(--teal-deep);color:#fff;border-color:var(--teal-deep)}

  .load{text-align:center;padding:56px 20px;color:var(--gris)}
  .load .sp{width:26px;height:26px;border:3px solid var(--agua);border-top-color:var(--teal);border-radius:50%;margin:0 auto 12px;animation:gir .8s linear infinite}
  @keyframes gir{to{transform:rotate(360deg)}}
  .vacio{text-align:center;padding:30px;color:var(--gris2);font-size:12.5px}
  .nota{font-size:11.5px;color:var(--gris);line-height:1.6;background:var(--agua);border-radius:9px;padding:10px 12px;margin-top:12px}
  @media(max-width:700px){ .wrap{padding:16px 13px 80px} .kpi .n{font-size:19px} .kpi.big .n{font-size:22px} }
</style>
</head>
<body>
<div class="topbar">
  <div class="mono">E<span class="y">y</span>G</div>
  <span class="tag">Tesorería</span>
  <span class="title">Dónde está la plata</span>
  <a class="back" href="../index.html">← Inicio</a>
</div>

<div class="wrap">
  <div class="wip">⚠️ <div><b>Módulo en construcción.</b> Solo lectura: muestra lo que hay en Odoo, no modifica nada. Los saldos salen de los asientos contabilizados.</div></div>
  <div class="tabs" id="tabs"></div>
  <div id="view"><div class="load"><div class="sp"></div>Leyendo Odoo…</div></div>
</div>

<script>
const R=(m,me,a,k)=>EYG.rpc(m,me,a,k);
const money=EYG.money, esc=EYG.esc;
const HOY=EYG.argToday();
const D={}; let TAB="posicion", FILTRO_CHQ="todos";
const ABI_SEM={};   /* semanas desplegadas en la pestaña A cubrir */

/* ---------- utilidades de fecha ---------- */
const dias=(a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000);
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const mesCorto=ym=>{const p=String(ym).split("-");return (MESES[+p[1]-1]||"?")+" "+p[0].slice(2);};
const ymDe=f=>String(f||"").slice(0,7);
const fechaCorta=f=>{if(!f)return "—";const p=String(f).slice(0,10).split("-");return p[2]+"/"+p[1]+"/"+p[0].slice(2);};
/* read_group devuelve el mes como texto localizado ("agosto 2026", porque el conector
   va en es_AR), así que no sirve para ordenar. La fecha real del grupo viene en
   __range (Odoo 16+): {"date:month":{from,to}}.
   OJO: NO sacarla del __domain — ahí la primera fecha es la del filtro general de la
   consulta, igual para todos los grupos, y todos los meses terminan con la misma
   etiqueta (bug de la primera versión: "entró y salió" mostraba oct-25 en cada fila).
   El fallback toma la ÚLTIMA fecha del domain, que sí es la del grupo. */
const ymDeGrupo=function(g,clave){
  const r=g.__range&&g.__range[clave||"date:month"];
  if(r&&r.from) return String(r.from).slice(0,7);
  const fechas=(g.__domain||[]).flat().filter(v=>typeof v==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v));
  return fechas.length?fechas[fechas.length-2].slice(0,7):"";
};

/* ---------- carga ---------- */
async function cargar(){
  /* Primer día del mes de hace 11 meses. Se fija el día 1 ANTES de restar meses:
     si no, un 31 de agosto pasa a "31 de septiembre", que no existe, y JS lo corre
     al 1 de octubre — perdíamos un mes entero del período. */
  const desde12=(function(){const t=new Date(HOY.slice(0,8)+"01T00:00:00");t.setMonth(t.getMonth()-11);return t.toISOString().slice(0,7)+"-01";})();

  const jrs=await R("account.journal","search_read",[[["type","in",["bank","cash"]]],["id","name","type","default_account_id"]],{limit:120});
  D.jrs=jrs;
  D.jChq=jrs.filter(j=>/cheque/i.test(j.name)).map(j=>j.id);
  const ctaIds=[...new Set(jrs.map(j=>j.default_account_id&&j.default_account_id[0]).filter(Boolean))];

  /* Cuentas puente de Odoo: "Recibos pendientes" y "Pagos pendientes". Ahí queda
     parado todo cobro/pago que todavía no se cruzó con el extracto del banco. */
  const trans=await R("account.account","search_read",[[["code","in",["1.1.1.02.003","1.1.1.02.004"]]],["id","code","name"]],{});
  D.trans=trans;
  const transIds=trans.map(t=>t.id);

  const res=await Promise.all([
    R("account.move.line","read_group",[[["parent_state","=","posted"],["account_id","in",ctaIds.concat(transIds)],["date","<=",HOY]],["balance:sum","id"],["account_id"]],{lazy:false,limit:200}),
    R("account.bank.statement.line","read_group",[[],["date:max","id"],["journal_id"]],{lazy:false,limit:60}),
    R("account.bank.statement.line","read_group",[[["is_reconciled","=",false]],["amount:sum","date:min","id"],["journal_id"]],{lazy:false,limit:60}),
    R("account.bank.statement.line","search_read",[[["is_reconciled","=",false]],["date","journal_id","payment_ref","amount","partner_id"]],{limit:400,order:"date asc"}),
    R("account.payment","search_read",[[["l10n_latam_check_current_journal_id","in",D.jChq],["state","=","posted"]],["l10n_latam_check_number","l10n_latam_check_bank_id","l10n_latam_check_issuer_vat","l10n_latam_check_payment_date","amount","partner_id","date","journal_id"]],{limit:900,order:"l10n_latam_check_payment_date asc"}),
    R("account.payment","read_group",[[["is_matched","=",false],["state","=","posted"]],["amount:sum","id"],["journal_id"]],{lazy:false,limit:60}),
    R("account.move","search_read",[[["state","=","draft"]],["name","date","journal_id","amount_total","ref"]],{limit:120,order:"date asc"}),
    R("account.move.line","read_group",[[["parent_state","=","posted"],["account_id","in",ctaIds],["date",">=",desde12],["date","<=",HOY]],["debit:sum","credit:sum","id"],["date:month"]],{lazy:false,limit:30}),
    /* Cheques PROPIOS emitidos que el banco todavía no debitó. Se filtra por el código
       del método de pago, no por ids: con ids se perdían los de Nación y BBVA.
       VA AL FINAL de la lista: el orden de acá tiene que ser el mismo que el de la
       línea de abajo, o cada variable se queda con los datos de otra consulta. */
    R("account.payment","search_read",[[["payment_method_line_id.code","=","check_printing"],["state","=","posted"],["is_matched","=",false]],["name","amount","date","partner_id","l10n_latam_check_payment_date","l10n_latam_check_number","journal_id"]],{limit:600,order:"l10n_latam_check_payment_date asc"}),
  ]);
  const [sal,ext,noRec,noRecDet,chq,noMatch,draft,mov,chqP]=res;

  D.saldo={}; sal.forEach(x=>D.saldo[x.account_id[0]]={bal:x.balance,n:x.__count});
  D.ext={};   ext.forEach(x=>D.ext[x.journal_id[0]]={ultima:x.date,n:x.__count});
  D.noRec={}; noRec.forEach(x=>D.noRec[x.journal_id[0]]={n:x.__count,monto:x.amount,vieja:x.date});
  D.noMatch={}; noMatch.forEach(x=>D.noMatch[x.journal_id[0]]={n:x.__count,monto:x.amount});
  D.noRecDet=noRecDet; D.chq=chq; D.draft=draft; D.chqP=chqP;
  D.mov=mov.map(g=>({ym:ymDeGrupo(g),debe:g.debit,haber:g.credit,n:g.__count})).filter(x=>x.ym).sort((a,b)=>a.ym<b.ym?-1:1);
  D.listo=true;
}

/* ---------- totales ---------- */
const bal=id=>(D.saldo[id]||{}).bal||0;
const ctaDe=j=>j.default_account_id&&j.default_account_id[0];
/* Varios diarios pueden apuntar a la MISMA cuenta contable (los circuitos "A" y "B"
   comparten Efectivo y Cheques de terceros): el saldo se suma una sola vez por cuenta. */
const ctasUnicas=arr=>[...new Set(arr.map(ctaDe).filter(Boolean))];

function totales(){
  const bancos=D.jrs.filter(j=>j.type==="bank");
  const cajas=D.jrs.filter(j=>j.type==="cash");
  const tBanco=ctasUnicas(bancos).reduce((s,id)=>s+bal(id),0);
  const tCaja=ctasUnicas(cajas.filter(j=>!/cheque/i.test(j.name))).reduce((s,id)=>s+bal(id),0);
  const tChqCta=ctasUnicas(cajas.filter(j=>/cheque/i.test(j.name))).reduce((s,id)=>s+bal(id),0);
  const tChqReal=D.chq.reduce((s,c)=>s+c.amount,0);
  const tTrans=D.trans.reduce((s,t)=>s+bal(t.id),0);
  return {tBanco,tCaja,tChqCta,tChqReal,tTrans,total:tBanco+tCaja+tChqReal};
}

/* ---------- cheques: clasificación por vencimiento ---------- */
function chqClas(){
  const en7=(()=>{const t=new Date(HOY+"T00:00:00");t.setDate(t.getDate()+7);return t.toISOString().slice(0,10);})();
  const g={vencidos:[],semana:[],mes:[],futuro:[],sinFecha:[]};
  D.chq.forEach(c=>{
    const f=c.l10n_latam_check_payment_date;
    if(!f) return g.sinFecha.push(c);
    if(f<HOY) g.vencidos.push(c);
    else if(f<=en7) g.semana.push(c);
    else if(ymDe(f)===ymDe(HOY)) g.mes.push(c);
    else g.futuro.push(c);
  });
  return g;
}
const suma=arr=>arr.reduce((s,c)=>s+c.amount,0);

/* ---------- pestañas ---------- */
function renderTabs(){
  const g=D.listo?chqClas():null;
  const pend=D.listo?(D.noRecDet.length+D.draft.length):0;
  const T=[
    ["posicion","💰","Posición",0],
    ["cheques","🧾","Cheques",g?g.vencidos.length:0],
    ["cubrir","💸","A cubrir",D.listo?(D.chqP||[]).filter(c=>{const f=c.l10n_latam_check_payment_date;return f&&f<lunesDe(HOY);}).length:0],
    ["concil","🔗","Conciliación",pend],
    ["movim","📈","Movimiento",0],
  ];
  document.getElementById("tabs").innerHTML=T.map(function(x){
    return '<button class="tab '+(x[0]===TAB?"on":"")+'" onclick="irTab(\''+x[0]+'\')">'+x[1]+' '+x[2]+(x[3]?'<span class="pill">'+x[3]+'</span>':'')+'</button>';
  }).join("");
}
function irTab(k){ TAB=k; renderTabs(); render(); window.scrollTo({top:0,behavior:"smooth"}); }

function render(){
  const v=document.getElementById("view");
  if(!D.listo){ v.innerHTML='<div class="load"><div class="sp"></div>Leyendo Odoo…</div>'; return; }
  v.innerHTML = TAB==="posicion"?vPosicion() : TAB==="cheques"?vCheques() : TAB==="cubrir"?vCubrir() : TAB==="concil"?vConcil() : vMovim();
}

/* ===== 1. POSICIÓN ===== */
function tarjetaCuenta(j){
  const s=bal(ctaDe(j)), e=D.ext[j.id], nr=D.noRec[j.id], nm=D.noMatch[j.id];
  const atraso=e?dias(e.ultima,HOY):null;
  let cls="", badge="";
  if(!e && nm && nm.n>20){ cls="mal"; badge='<span class="badge b-bad">sin extractos</span>'; }
  else if(atraso!==null && atraso>20){ cls="mal"; badge='<span class="badge b-bad">'+atraso+' días de atraso</span>'; }
  else if(atraso!==null && atraso>7){ cls="al"; badge='<span class="badge b-warn">'+atraso+' días de atraso</span>'; }
  else if(atraso!==null){ badge='<span class="badge b-ok">al día</span>'; }
  return '<div class="cta '+cls+'">'+
    '<div class="nm">'+esc(j.name)+' '+badge+'</div>'+
    '<div class="mt '+(s<0?"neg":"")+'">'+money(s)+'</div>'+
    '<div class="dt">'+(e?'último extracto '+fechaCorta(e.ultima):'sin extractos cargados')+
      (nr?' · <b>'+nr.n+' sin conciliar</b>':'')+
      (nm&&!e?' · '+nm.n+' pagos sin cruzar':'')+'</div></div>';
}

function vPosicion(){
  const t=totales(), g=chqClas();
  const bancos=D.jrs.filter(j=>j.type==="bank");
  const cajas=D.jrs.filter(j=>j.type==="cash");

  const kpis='<div class="kpis">'+
    '<div class="kpi big" title="Bancos + efectivo y valores + cheques de terceros todavía en cartera. Es la foto de hoy según los asientos contabilizados.">'+
      '<div class="l">💰 Disponible total</div><div class="n '+(t.total<0?"neg":"")+'">'+money(t.total)+'</div>'+
      '<div class="s">bancos + caja + cheques</div></div>'+
    '<button class="kpi clic" onclick="irTab(\'concil\')" title="Suma de las cuentas contables de los diarios bancarios. Refleja los extractos importados: si un banco está atrasado, este saldo también.">'+
      '<div class="l">🏦 Bancos</div><div class="n '+(t.tBanco<0?"neg":"")+'">'+money(t.tBanco)+'</div>'+
      '<div class="s">'+bancos.length+' cuentas · ver conciliación</div></button>'+
    '<div class="kpi" title="Cuentas de efectivo y tarjetas precargadas. Los circuitos A y B comparten la misma cuenta contable, así que este número los suma a los dos.">'+
      '<div class="l">💵 Efectivo y valores</div><div class="n '+(t.tCaja<0?"neg":"")+'">'+money(t.tCaja)+'</div>'+
      '<div class="s">'+(t.tCaja<0?"saldo negativo · revisar":"cajas y tarjetas")+'</div></div>'+
    '<button class="kpi clic" onclick="irTab(\'cheques\')" title="Cheques de terceros que todavía están en la cartera de EyG: no se depositaron ni se entregaron a un proveedor.">'+
      '<div class="l">🧾 Cheques en cartera</div><div class="n">'+money(t.tChqReal)+'</div>'+
      '<div class="s">'+D.chq.length+' cheques'+(g.vencidos.length?' · <b style="color:var(--bad)">'+g.vencidos.length+' vencidos</b>':'')+'</div></button>'+
    '<button class="kpi clic" onclick="irTab(\'concil\')" title="Cobros y pagos registrados que todavía no se cruzaron con el movimiento real del banco. Cuanto más alto, más cosas quedaron a mitad de camino.">'+
      '<div class="l">⏳ En el aire</div><div class="n">'+money(Math.abs(t.tTrans))+'</div>'+
      '<div class="s">sin cruzar con el banco</div></button>'+
  '</div>';

  const vistas={};
  const unicos=arr=>arr.filter(function(j){const c=ctaDe(j); if(!c||vistas[c])return false; vistas[c]=1; return true;});
  const grupos={};
  D.jrs.forEach(function(j){const c=ctaDe(j); if(c){(grupos[c]=grupos[c]||[]).push(j.name);}});
  const esp=Object.keys(grupos).map(k=>grupos[k]).filter(v=>v.length>1);

  const cajasVivas=unicos(cajas.filter(j=>bal(ctaDe(j))!==0));
  const cajasCero=cajas.length-cajasVivas.length;

  return kpis+
  '<div class="panel"><h3>🏦 Bancos</h3>'+

/* ===== 3. A CUBRIR (cheques propios emitidos que el banco todavía no debitó) ===== */
/* El cheque propio emitido NO toca la cuenta del banco: queda parado en "Pagos
   pendientes" hasta que el banco lo debita y ese débito se concilia. Por eso
   `is_matched=false` es exactamente "emitido y todavía no debitado", y por eso el
   saldo del banco NO lo tiene descontado: es plata que hay que tener el día que cae.
   Se filtra por el CÓDIGO del método de pago (check_printing), no por ids de método:
   con ids se perdían los cheques de Nación y BBVA. */
const lunesDe=function(f){
  const t=new Date(String(f).slice(0,10)+"T00:00:00");
  t.setDate(t.getDate()-((t.getDay()+6)%7));          /* getDay(): domingo=0 → lunes=0 */
  return t.toISOString().slice(0,10);
};
const masDias=function(f,n){const t=new Date(f+"T00:00:00");t.setDate(t.getDate()+n);return t.toISOString().slice(0,10);};
const rotuloSem=function(k){
  const p=k.split("-"), q=masDias(k,6).split("-");
  return p[2]+"/"+p[1]+" al "+q[2]+"/"+q[1];
};

function cubrirDatos(){
  const LUN=lunesDe(HOY);
  /* Tope de cordura: un cheque fechado más de 2 años adelante es un error de tipeo
     (hay uno cargado en 2206). Si entra al calendario, estira la tabla 180 años y
     ensucia el acumulado, así que va al panel de los que hay que corregir. */
  const TOPE=String(Number(HOY.slice(0,4))+2)+HOY.slice(4);
  const g={vencidos:[],sinFecha:[],dudosas:[],sem:{}};
  (D.chqP||[]).forEach(function(c){
    const f=c.l10n_latam_check_payment_date;
    if(!f) return g.sinFecha.push(c);
    if(f>TOPE) return g.dudosas.push(c);
    if(f<LUN) return g.vencidos.push(c);          /* de semanas anteriores y sin debitar */
    const k=lunesDe(f);
    (g.sem[k]=g.sem[k]||[]).push(c);
  });
  g.semanas=Object.keys(g.sem).sort();
  /* Saldo de los bancos: única contraparte que se cuenta. Los cheques de terceros en
     cartera NO entran — todavía hay que depositarlos y acreditan después. */
  const bancos=D.jrs.filter(j=>j.type==="bank");
  g.total=ctasUnicas(bancos).reduce((s,id)=>s+bal(id),0);
  g.saldos=bancos.map(j=>({nombre:j.name,saldo:bal(ctaDe(j)),ext:(D.ext[j.id]||{}).ultima||null}))
                 .filter(x=>x.saldo!==0)
                 .sort((a,b)=>a.saldo-b.saldo);
  return g;
}

  const g=cubrirDatos();

  const atrasados={};

      '<div class="l">🗓️ Próximos 30 días</div><div class="n">'+money(suma(prox30))+'</div><div class="s">'+prox30.length+' cheques</div></div>'+
    '<div class="kpi" title="Suma de los saldos de todas las cuentas bancarias, según los extractos cargados. Es la única contraparte que cuenta este tablero.">'+
      '<div class="l">🏦 Saldo de bancos</div><div class="n '+(g.total<0?"neg":"")+'">'+money(g.total)+'</div><div class="s">hoy</div></div>'+
  '</div>';

  const aviso=kAtr.length?'<div class="nota" style="background:#FBF1DC;color:#8A6D1A"><b>Ojo con '+kAtr.length+' banco'+(kAtr.length>1?'s':'')+' con el extracto atrasado.</b> '+
    kAtr.map(k=>esc(k)+' está cargado hasta el '+fechaCorta(atrasados[k].ult)+' y tiene '+atrasados[k].n+' cheques por '+money(atrasados[k].m)+' figurando sin debitar').join('; ')+'. '+
    'Mientras no se carguen esos extractos no se puede afirmar que el banco no los haya debitado: puede que ya estén pagados y falte registrarlos.</div>':'';

  const panelSaldos='<div class="panel"><h3>🏦 Con qué se cubre</h3>'+
    '<div class="sub">Saldo de cada cuenta según los extractos cargados. Los cheques de terceros en cartera <b>no</b> se cuentan acá: hay que depositarlos y acreditan después.</div>'+
    '<div class="cuentas">'+g.saldos.map(function(x){
      const at=x.ext?dias(x.ext,HOY):null;
      return '<div class="cta '+(x.saldo<0?"mal":"")+'"><div class="nm">'+esc(x.nombre)+'</div>'+
        '<div class="mt '+(x.saldo<0?"neg":"")+'">'+money(x.saldo)+'</div>'+
        '<div class="dt">'+(x.ext?'extracto al '+fechaCorta(x.ext)+(at>10?' · <b>'+at+' días de atraso</b>':''):'sin extractos')+'</div></div>';
    }).join("")+'</div></div>';

  /* Tabla semanal. El acumulado arranca con los vencidos: son los primeros que hay que
     cubrir. "Hay que juntar" es lo que falta después de usar todo el saldo de bancos. */
  let acum=suma(g.vencidos);
  const filas=[];
  if(g.vencidos.length) filas.push(fSemana("venc","Ya vencidos",g.vencidos,acum,g.total,false,true));
  g.semanas.forEach(function(k){

  const panelSem='<div class="panel"><h3>📆 Semana por semana</h3>'+

    '<div class="tscroll"><table>'+

      '<tbody>'+(filas.join("")||'<tr><td colspan="5" class="vacio">No hay cheques emitidos sin debitar.</td></tr>')+'</tbody>'+
    '</table></div></div>';

  /* Los que no se pueden ubicar en el calendario: sin fecha, o con una fecha imposible.

  const rotos=g.sinFecha.concat(g.dudosas);

    g.sinFecha.length+' sin fecha de pago'+(g.dudosas.length?' y '+g.dudosas.length+' con una fecha imposible':'')+
    '. <b>No entran en el acumulado de arriba</b>, así que ese total está incompleto hasta que se les corrija la fecha en Odoo.</div>'+
    '<div class="tscroll"><table><thead><tr><th>Paga</th><th>Emitido</th><th>Nº</th><th>Banco</th><th>Beneficiario</th><th class="r">Importe</th></tr></thead><tbody>'+
    rotos.map(c=>'<tr><td>'+(c.l10n_latam_check_payment_date?'<span class="chip b-bad">'+esc(c.l10n_latam_check_payment_date)+'</span>':'<span class="chip b-info">sin fecha</span>')+'</td>'+
      '<td>'+fechaCorta(c.date)+'</td><td class="muted">'+esc(c.l10n_latam_check_number||"—")+'</td>'+
      '<td>'+esc(bancoCorto(c.journal_id[1]))+'</td><td>'+esc((c.partner_id&&c.partner_id[1])||"—")+'</td>'+
      '<td class="r"><b>'+money(c.amount)+'</b></td></tr>').join("")+'</tbody></table></div></div>':'';

  return kpis+aviso+panelSaldos+panelSem+panelSin;
}

/* Una fila de semana, más las filas del detalle si está abierta. */
function fSemana(k,rotulo,arr,acum,saldo,esHoy,esVenc){
  const m=suma(arr), falta=Math.max(0,acum-saldo), abierta=ABI_SEM[k];
  const porB={};
  arr.forEach(function(c){ const b=c.journal_id[1]; porB[b]=(porB[b]||0)+c.amount; });
  const bancos=Object.keys(porB).sort((a,b)=>porB[b]-porB[a]);
  const chip=esVenc?' <span class="chip b-bad">atrasado</span>':esHoy?' <span class="chip b-warn">esta semana</span>':'';
  let out='<tr style="cursor:pointer'+(esHoy?';background:var(--agua)':'')+'" onclick="abrirSem(\''+k+'\')">'+
    /* Solo los nombres de los bancos: con los importes acá la fila se parte en cinco
       renglones y empuja la última columna fuera. Los importes van en el detalle. */
    '<td style="white-space:nowrap"><b><span style="color:var(--gris2);margin-right:5px">'+(abierta?"▾":"▸")+'</span>'+esc(rotulo)+'</b>'+chip+
      '<div style="font-size:10.5px;color:var(--gris2);font-weight:600;margin:2px 0 0 15px">'+bancos.map(b=>esc(bancoCorto(b))).join(" · ")+'</div></td>'+
    '<td class="r muted">'+arr.length+'</td>'+
    '<td class="r"><b>'+money(m)+'</b></td>'+
    '<td class="r muted">'+money(acum)+'</td>'+
    '<td class="r '+(falta>0?"neg":"pos")+'"><b>'+(falta>0?money(falta):"cubierto")+'</b></td></tr>';
  if(abierta) out+='<tr><td colspan="5" style="padding:0 9px 14px 24px">'+
    '<div style="font-size:11px;color:var(--gris);font-weight:700;margin:2px 0 8px">'+
      bancos.map(b=>esc(bancoCorto(b))+' <span style="color:var(--ink)">'+money(porB[b])+'</span>').join(' &nbsp;·&nbsp; ')+'</div>'+
    '<table style="font-size:11.5px"><thead><tr><th>Paga</th><th>Nº</th><th>Banco</th><th>Beneficiario</th><th class="r">Importe</th></tr></thead><tbody>'+
    arr.slice().sort((a,b)=>a.l10n_latam_check_payment_date<b.l10n_latam_check_payment_date?-1:1).map(function(c){
      const f=c.l10n_latam_check_payment_date, d=dias(f,HOY);
      return '<tr title="Emitido el '+fechaCorta(c.date)+'"><td>'+fechaCorta(f)+(d>0?' <span class="chip b-bad">hace '+d+' d</span>':d===0?' <span class="chip b-warn">hoy</span>':'')+'</td>'+
        '<td class="muted">'+esc(c.l10n_latam_check_number||"—")+'</td>'+
        '<td>'+esc(bancoCorto(c.journal_id[1]))+'</td>'+
        '<td>'+esc((c.partner_id&&c.partner_id[1])||"—")+'</td>'+
        '<td class="r"><b>'+money(c.amount)+'</b></td></tr>';
    }).join("")+'</tbody></table></td></tr>';
  return out;
}
const bancoCorto=b=>String(b).replace("Banco ","").replace(" CC ARS","");
function abrirSem(k){ ABI_SEM[k]=!ABI_SEM[k]; render(); }

    '<div class="kpi" title="Cobros y pagos que nunca se cruzaron con el banco. Quedan parados en las cuentas puente.">'+
      '<div class="l">⏳ En cuentas puente</div><div class="n">'+money(Math.abs(t.tTrans))+'</div><div class="s">recibos y pagos pendientes</div></div>'+
    '<div class="kpi" title="Diarios bancarios sin ningún extracto importado: no hay con qué conciliar.">'+
      '<div class="l">🚫 Bancos sin extracto</div><div class="n '+(sinExt.length?"neg":"")+'">'+sinExt.length+'</div>'+
      '<div class="s">'+(sinExt.map(j=>esc(j.name)).join(", ")||"ninguno")+'</div></div>'+
    '<div class="kpi" title="Asientos que quedaron en borrador: no impactan en ningún saldo hasta que se confirmen.">'+
      '<div class="l">📝 Borradores</div><div class="n '+(D.draft.length?"neg":"")+'">'+D.draft.length+'</div>'+
      '<div class="s">asientos sin confirmar</div></div>'+
  '</div>'+

  '<div class="panel"><h3>🏦 Estado banco por banco</h3>'+
    '<div class="sub">Hasta qué día se cargó el resumen, cuánto falta cruzar y cuántos pagos quedaron sin espejo en el banco.</div>'+
    '<div class="tscroll"><table>'+
      '<thead><tr><th>Banco</th><th>Estado</th><th>Último extracto</th><th class="r">Líneas cargadas</th><th class="r">Sin conciliar</th><th>La más vieja</th><th class="r">Pagos sin cruzar</th></tr></thead>'+
      '<tbody>'+bancos.map(fila).join("")+'</tbody></table></div>'+
    (sinExt.length?'<div class="nota" style="background:#FBE6E3;color:#8A2A1E"><b>'+sinExt.map(j=>esc(j.name)).join(", ")+' no tiene extractos cargados</b> y acumula '+sinExt.reduce((s,j)=>s+D.noMatch[j.id].n,0)+' pagos registrados. Todo eso queda parado en las cuentas puente y nunca llega a verse como saldo del banco.</div>':'')+
  '</div>'+

  '<div class="panel" id="detNR"><h3>🔍 Movimientos del banco sin cruzar</h3>'+
    '<div class="sub">Están en el resumen del banco pero Odoo no encontró el cobro o pago que les corresponde. De más viejo a más nuevo.</div>'+
    '<div class="tscroll"><table>'+
      '<thead><tr><th>Fecha</th><th>Antigüedad</th><th>Banco</th><th>Concepto</th><th class="r">Importe</th></tr></thead>'+
      '<tbody>'+(D.noRecDet.slice(0,120).map(function(l){
        const d=dias(l.date,HOY);
        const chip=d>365?'<span class="chip b-bad">+1 año</span>':d>90?'<span class="chip b-warn">'+d+' días</span>':'<span class="chip b-info">'+d+' días</span>';
        return '<tr><td>'+fechaCorta(l.date)+'</td><td>'+chip+'</td><td>'+esc((l.journal_id&&l.journal_id[1])||"")+'</td>'+
          '<td class="muted">'+esc(String(l.payment_ref||"").slice(0,60))+'</td>'+
          '<td class="r '+(l.amount<0?"neg":"")+'"><b>'+money(l.amount)+'</b></td></tr>';
      }).join("")||'<tr><td colspan="5" class="vacio">Todo conciliado.</td></tr>')+'</tbody></table></div>'+
    (D.noRecDet.length>120?'<div class="nota">Se muestran los 120 más viejos de '+D.noRecDet.length+'.</div>':'')+
  '</div>'+

  (D.draft.length?'<div class="panel"><h3>📝 Asientos en borrador</h3>'+
    '<div class="sub">Cargados pero sin confirmar: todavía no impactan en ningún saldo ni en ningún informe.</div>'+
    '<div class="tscroll"><table>'+
      '<thead><tr><th>Fecha</th><th>Diario</th><th>Nombre</th><th>Referencia</th><th class="r">Importe</th></tr></thead>'+
      '<tbody>'+D.draft.map(function(m){
        return '<tr><td>'+fechaCorta(m.date)+'</td><td>'+esc((m.journal_id&&m.journal_id[1])||"")+'</td>'+
          '<td class="muted">'+esc(m.name)+'</td><td class="muted">'+esc(String(m.ref||"").slice(0,40))+'</td>'+
          '<td class="r">'+money(m.amount_total)+'</td></tr>';
      }).join("")+'</tbody></table></div></div>':'');
}

/* ===== 5. MOVIMIENTO ===== */
function vMovim(){
  const m=D.mov;
  if(!m.length) return '<div class="panel"><div class="vacio">Sin movimientos en el período.</div></div>';
  const max=Math.max.apply(null,m.map(x=>Math.max(x.debe,x.haber)).concat([1]));
  const ult=m[m.length-1];
  const totD=m.reduce((s,x)=>s+x.debe,0), totH=m.reduce((s,x)=>s+x.haber,0);
  return '<div class="kpis">'+
    '<div class="kpi" title="Todo lo que entró a bancos y cajas en los últimos 12 meses.">'+
      '<div class="l">⬇️ Entró (12 meses)</div><div class="n pos">'+money(totD)+'</div><div class="s">cobros y acreditaciones</div></div>'+
    '<div class="kpi" title="Todo lo que salió de bancos y cajas en los últimos 12 meses.">'+
      '<div class="l">⬆️ Salió (12 meses)</div><div class="n neg">'+money(totH)+'</div><div class="s">pagos y débitos</div></div>'+
    '<div class="kpi" title="Diferencia entre lo que entró y lo que salió en los últimos 12 meses.">'+
      '<div class="l">⚖️ Diferencia</div><div class="n '+(totD-totH<0?"neg":"pos")+'">'+money(totD-totH)+'</div><div class="s">entradas menos salidas</div></div>'+
    '<div class="kpi" title="Movimiento neto del último mes con datos.">'+
      '<div class="l">📆 Último mes</div><div class="n '+(ult.debe-ult.haber<0?"neg":"pos")+'">'+money(ult.debe-ult.haber)+'</div><div class="s">'+mesCorto(ult.ym)+'</div></div>'+
  '</div>'+
  '<div class="panel"><h3>📈 Entradas y salidas por mes</h3>'+
    '<div class="sub">Movimiento de todas las cuentas de banco y caja, del mes más reciente al más viejo. La barra de arriba es lo que entró; la de abajo, lo que salió.</div>'+
    '<div class="tscroll"><table>'+
      '<thead><tr><th>Mes</th><th style="width:42%">Entró / Salió</th><th class="r">Entró</th><th class="r">Salió</th><th class="r">Neto</th><th class="r">Movs.</th></tr></thead>'+
      /* D.mov queda ordenado de viejo a nuevo (lo necesita el KPI "último mes" y las
         barras comparan contra el mismo máximo); la TABLA se muestra al revés, con el
         mes más reciente arriba, que es como se lee. */
      '<tbody>'+m.slice().reverse().map(function(x){
        return '<tr><td><b>'+mesCorto(x.ym)+'</b></td>'+
        '<td><div style="height:8px;background:var(--teal-med);border-radius:4px;width:'+Math.round(x.debe/max*100)+'%;min-width:2px;margin-bottom:3px"></div>'+
            '<div style="height:8px;background:var(--coral);border-radius:4px;width:'+Math.round(x.haber/max*100)+'%;min-width:2px"></div></td>'+
        '<td class="r pos">'+money(x.debe)+'</td>'+
        '<td class="r neg">'+money(x.haber)+'</td>'+
        '<td class="r '+(x.debe-x.haber<0?"neg":"pos")+'"><b>'+money(x.debe-x.haber)+'</b></td>'+
        '<td class="r muted">'+x.n.toLocaleString("es-AR")+'</td></tr>';
      }).join("")+'</tbody></table></div></div>';
}
