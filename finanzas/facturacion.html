    await EYG.supa().from("comercial_nota").update({
      estado:"hecha", hecha_ts:ahora,
      detalle:{cerrada_por:quien, cerrada_ts:ahora, cerrada_nota:"resuelto desde Facturación"}
    }).eq("id",notaId);
    toast("✓ Aviso resuelto — la comercial lo va a ver en su panel");
  }catch(e){ AVISOS[pedidoId].unshift(a); toast("No pude marcarlo: "+(e.message||e)); }
  render();
}

/* Facturado por día del mes: se arma sumando los comprobantes emitidos, no con
   un read_group, porque el groupby por día devuelve la fecha ya formateada
   según el idioma y no se puede ordenar de forma confiable. */
function recalcularDias(){
  const dias={};
  EMITIDO.filter(m=>m.state==="posted").forEach(m=>{
    const k=soloFecha(m.invoice_date); if(!k) return;
    dias[k]=dias[k]||{fecha:k,neto:0,total:0,facts:0,nc:0,ncMonto:0};
    if(m.move_type==="out_refund"){ dias[k].nc++; dias[k].ncMonto+=m.amount_total||0; dias[k].neto-=m.amount_untaxed||0; dias[k].total-=m.amount_total||0; }
    else { dias[k].facts++; dias[k].neto+=m.amount_untaxed||0; dias[k].total+=m.amount_total||0; }
  });
  PORDIA=Object.values(dias).sort((a,b)=>a.fecha.localeCompare(b.fecha));
}

function calcularKpis(hoy){
  hoy=hoy||EYG.argToday();
  const falta=PEND.filter(porFacturar);
  KPI.cola=falta.length;
  KPI.colaMonto=falta.reduce((a,o)=>a+montoPend(o),0);
  /* De los que faltan facturar, los que ya pasaron el día: son los que se escapan. */
  const demor=falta.filter(o=>diasDe(o.date_order)>1);
  KPI.demor=demor.length;
  KPI.demorMonto=demor.reduce((a,o)=>a+montoPend(o),0);
  KPI.hoyConf=PEND.filter(o=>soloFecha(o.date_order)===hoy).length;
  KPI.hoyConfMonto=PEND.filter(o=>soloFecha(o.date_order)===hoy).reduce((a,o)=>a+(o.amount_untaxed||0),0);
  KPI.bloq=PEND.filter(frenado).length;
  KPI.conAviso=PEND.filter(o=>avisosDe(o).length).length;
  const d=PORDIA.find(x=>x.fecha===hoy)||{neto:0,total:0,facts:0};
  KPI.hoyNeto=d.neto; KPI.hoyTotal=d.total; KPI.hoyFacts=d.facts;
  KPI.mesNeto=PORDIA.reduce((a,x)=>a+x.neto,0);
  KPI.mesFacts=PORDIA.reduce((a,x)=>a+x.facts,0);
  KPI.mesNC=PORDIA.reduce((a,x)=>a+x.nc,0);
  KPI.mesNCMonto=PORDIA.reduce((a,x)=>a+x.ncMonto,0);
  /* Promedio diario sobre DÍAS CON FACTURACIÓN, no días corridos: si el mes
     arrancó un jueves o hubo feriados, dividir por días de calendario miente. */
  const dact=PORDIA.filter(x=>x.facts>0).length;
  KPI.diasAct=dact;
  KPI.promDia=dact?KPI.mesNeto/dact:0;
  KPI.promFacts=dact?KPI.mesFacts/dact:0;
}

const porFacturar=o=>A_FACTURAR.indexOf(o.invoice_status)>=0;
const facturado=o=>o.invoice_status==="invoiced";
/* Lo que falta facturar: lo calcula Odoo. Si ya está todo facturado, es 0. */
const montoPend=o=>o.amount_to_invoice||0;
const avisosDe=o=>AVISOS[o.id]||[];
const frenado=o=>avisosDe(o).some(a=>a.freno);
const tieneOC=o=>avisosDe(o).some(a=>a.oc);

/* ══════════════ MARGEN ══════════════
   Vanesa está autorizada a tocar precios, así que tiene que ver en el momento
   si el margen se le va. Los cortes NO son inventados: se midieron 2.108
   renglones de los últimos 14 días — mediana 25,9%, ponderado 26,3%.
   Margen % = margen / neto del renglón (sin IVA), igual que lo calcula Odoo:
   verificado contra los 2.108 renglones, diferencia 0,000000.

   Los cortes son BAJOS a propósito (decisión de Dirección, 8/9/2026): con una
   oferta encima es normal terminar en 5%, así que el rojo se reserva para lo
   que de verdad está mal. El cero tiene color propio (se vende al costo) y la
   pérdida va en negro, para que salte a la vista.
   Ojo: "Costos y Rentabilidad" usa cortes más exigentes (27/33/40) porque mide
   el PRECIO DE LISTA, no lo que se terminó vendiendo. */
const MRG=[
  {t:"Pérdida",    c:"m-perd", d:"El precio quedó por debajo del costo: cada unidad que sale pierde plata."},
  {t:"Sin margen", c:"m-cero", d:"Se vende justo al costo: no deja nada."},
  {t:"Muy bajo",   c:"m-mal",  d:"Menos de 5% de margen. Revisá el precio antes de facturar."},
  {t:"Bajo",       c:"m-bajo", d:"Entre 5% y 15%. Es lo habitual cuando el producto tiene una oferta encima."},
  {t:"Normal",     c:"m-ok",   d:"Entre 15% y 26%, por debajo del promedio de la casa pero sano."},
  {t:"Bien",       c:"m-bien", d:"26% o más: el margen al que factura la casa."}
];
function mrgNivel(p){
  if(p<-0.05) return MRG[0];
  if(p<0.05)  return MRG[1];   // prácticamente cero: se vende al costo
  if(p<5)     return MRG[2];
  if(p<15)    return MRG[3];
  if(p<26)    return MRG[4];
  return MRG[5];
}
const pct1=p=>(Math.round(p*10)/10).toLocaleString("es-AR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";
/* pct: margen en % ya calculado. base: el neto, para explicar el importe. */
function chipMrg(pct, monto, extra){
  const n=mrgNivel(pct);
  return `<span class="mrg ${n.c}" title="${esc(n.t)} — ${esc(n.d)}${monto!=null?" Deja "+money(monto)+" de margen.":""}${extra?" "+esc(extra):""}">${pct1(pct)}</span>`;
}
const leyendaMrg=`<div class="mrgleyenda"><span>Margen:</span>`+
  MRG.map(n=>`<span class="mrg ${n.c}" title="${esc(n.d)}">${esc(n.t)}</span>`).join("")+
  `<span title="Costos y Rentabilidad usa cortes más exigentes (27/33/40) porque mide el precio de lista; acá se mide lo que se terminó vendiendo, con la oferta y el descuento ya aplicados.">· sobre el neto, sin IVA. La casa factura al 26%.</span></div>`;

/* ══════════════ RENDER ══════════════ */
/* ══════════════ BUSCADOR GENERAL ══════════════
   El buscador de la pestaña "Por facturar" sólo filtra lo que ya está cargado
   (confirmados de los últimos días). Para encontrar un pedido de hace tres meses
   o una factura vieja había que ir a Odoo.

   Este va a Odoo de verdad y busca en los tres lados a la vez: pedidos,
   comprobantes (facturas y notas de crédito) y remitos. Busca por número, por
   cliente y por la OC del cliente.

   Pide 3 letras antes de salir a buscar y espera a que dejes de escribir: cada
   tecla sería una consulta, y Odoo tiene pocos obreros (ver ODOO_MAX). */
const BUSCA_MIN=3, BUSCA_ESPERA=420, BUSCA_TOPE=25;
let BUSCA={q:"", cargando:false, res:null, err:""};
let _busT=null, _busSeq=0;

function tecleaBusqueda(v){
  BUSCA.q=v;
  clearTimeout(_busT);
  if(v.trim().length<BUSCA_MIN){
    BUSCA.res=null; BUSCA.cargando=false; BUSCA.err="";
    render(); foco("bq");
    return;
  }
  BUSCA.cargando=true; BUSCA.err=""; render(); foco("bq");
  _busT=setTimeout(()=>buscarTodo(v.trim()), BUSCA_ESPERA);
}
function limpiarBusqueda(){ clearTimeout(_busT); BUSCA={q:"",cargando:false,res:null,err:""}; render(); }

/* Devuelve el foco y el cursor al final: el módulo repinta todo el cuerpo en
   cada render, así que sin esto la caja pierde el foco a la primera letra. */
function foco(id){
  const i=document.getElementById(id);
  if(i){ i.focus(); try{ i.setSelectionRange(i.value.length,i.value.length); }catch(e){} }
}

async function buscarTodo(q){
  const mio=++_busSeq;                    // si tecleó de nuevo, la vieja no pisa
  const ES={lang:"es_AR"};
  const like=["|","|",["name","ilike",q],["partner_id.name","ilike",q],["client_order_ref","ilike",q]];
  try{
    const [peds,movs,rems]=await Promise.all([
      EYG.rpc("sale.order","search_read",[like],
        {fields:["name","date_order","partner_id","user_id","amount_untaxed","amount_total","state","invoice_status","delivery_status","client_order_ref","type_id"],
         context:ES,limit:BUSCA_TOPE,order:"date_order desc"}).catch(()=>[]),
      EYG.rpc("account.move","search_read",[["&",["move_type","in",["out_invoice","out_refund"]],
          "|",["name","ilike",q],["partner_id.name","ilike",q]]],
        {fields:["name","invoice_date","partner_id","amount_untaxed","amount_total","state","move_type","journal_id","invoice_origin","amount_residual"],
         context:ES,limit:BUSCA_TOPE,order:"invoice_date desc, id desc"}).catch(()=>[]),
      EYG.rpc("stock.picking","search_read",[["&",["picking_type_code","=","outgoing"],
          "|","|",["name","ilike",q],["partner_id.name","ilike",q],["origin","ilike",q]]],
        {fields:["name","partner_id","state","date_done","scheduled_date","origin","sale_id"],
         context:ES,limit:BUSCA_TOPE,order:"id desc"}).catch(()=>[])
    ]);
    if(mio!==_busSeq) return;             // llegó tarde: ya hay otra búsqueda
    BUSCA.res={peds,movs,rems}; BUSCA.cargando=false;
  }catch(e){
    if(mio!==_busSeq) return;
    BUSCA.res=null; BUSCA.cargando=false; BUSCA.err=e.message||String(e);
  }
  render(); foco("bq");
}

function cajaBusqueda(){
  const n=BUSCA.res?(BUSCA.res.peds.length+BUSCA.res.movs.length+BUSCA.res.rems.length):0;
  return `<div class="buscaja">
    <span class="lupa">🔎</span>
    <input id="bq" placeholder="Buscar un pedido, una factura, un remito o un cliente…" value="${esc(BUSCA.q)}"
      oninput="tecleaBusqueda(this.value)" autocomplete="off"
      title="Busca en TODO Odoo, sin límite de fecha: por número de pedido o comprobante, por nombre de cliente y por la orden de compra del cliente. Desde 3 letras.">
    ${BUSCA.cargando?'<span class="bchip">buscando…</span>':(BUSCA.res?`<span class="bchip">${fnum(n)} resultado${n===1?"":"s"}</span>`:"")}
    ${BUSCA.q?'<button class="btn sm" onclick="limpiarBusqueda()">Cerrar</button>':""}
  </div>`;
}

function vistaBusqueda(){
  if(BUSCA.err) return `<div class="errbox"><b>No pude buscar.</b><br>${esc(BUSCA.err)}</div>`;
  if(BUSCA.cargando && !BUSCA.res) return '<div class="cargando">Buscando en Odoo…</div>';
  const r=BUSCA.res; if(!r) return "";
  const vacio=!r.peds.length && !r.movs.length && !r.rems.length;
  if(vacio) return `<div class="vacio"><span class="big">🔎</span>No encontré nada con «${esc(BUSCA.q)}».<br>Probá con el número del comprobante, el nombre del cliente o la orden de compra.</div>`;

  const ped=o=>{
    const falta=porFacturar(o);
    return `<tr class="clk" onclick="irPedidoDesdeBusqueda(${o.id})">
      <td><b>${esc(o.name)}</b></td>
      <td>${fmtFecha(o.date_order)}</td>
      <td>${esc(o.partner_id?o.partner_id[1]:"—")}</td>
      <td class="muted">${esc(o.user_id?o.user_id[1]:"—")}</td>
      <td>${o.state==="cancel"?'<span class="chip c-gris">cancelado</span>'
        :(o.state==="draft"||o.state==="sent")?'<span class="chip c-info">presupuesto</span>'
        :falta?'<span class="chip c-info">falta facturar</span>'
        :'<span class="chip c-ok">facturado</span>'}</td>
      <td class="r">${money(o.amount_untaxed)}</td>
      <td class="r"><a class="lnk" onclick="event.stopPropagation()" target="_blank" href="${ODOO}/web#id=${o.id}&model=sale.order&view_type=form">Odoo ↗</a></td>
    </tr>`;
  };
  const mov=m=>`<tr>
      <td><b>${esc(m.name&&m.name!=="/"?m.name:"(borrador)")}</b></td>
      <td>${fmtFecha(m.invoice_date)}</td>
      <td>${esc(m.partner_id?m.partner_id[1]:"—")}</td>
      <td class="muted">${esc(m.invoice_origin||"—")}</td>
      <td>${m.move_type==="out_refund"?'<span class="chip c-bad">nota de crédito</span>':'<span class="chip c-ok">factura</span>'}
          ${m.state==="draft"?'<span class="chip c-warn">borrador</span>':(Math.abs(m.amount_residual)<0.01?'<span class="chip c-ok">pagada</span>':"")}</td>
      <td class="r ${m.move_type==="out_refund"?"neg":""}">${money(m.amount_untaxed)}</td>
      <td class="r">${m.state==="posted"
        ? `<button class="btn sm" title="Abre el PDF del comprobante para imprimirlo." onclick="imprimirFactura(${m.id},event)">🖨️</button>`
        : '<span class="muted">—</span>'}
        <a class="lnk" style="margin-left:6px" target="_blank" href="${ODOO}/web#id=${m.id}&model=account.move&view_type=form">Odoo ↗</a></td>
    </tr>`;
  const rem=p=>`<tr>
      <td><b>${esc(p.name)}</b></td>
      <td>${fmtFecha(p.state==="done"?p.date_done:p.scheduled_date)}</td>
      <td>${esc(p.partner_id?p.partner_id[1]:"—")}</td>
      <td class="muted">${esc(p.origin||"—")}</td>
      <td>${p.state==="done"?'<span class="chip c-ok">entregado</span>'
        :p.state==="cancel"?'<span class="chip c-gris">cancelado</span>'
        :'<span class="chip c-warn">'+esc(p.state)+'</span>'}</td>
      <td class="r"></td>
      <td class="r"><button class="btn sm" title="Arma el remito y lo manda a imprimir." onclick="imprimirRemito(${p.id},event)">🖨️</button>
        <a class="lnk" style="margin-left:6px" target="_blank" href="${ODOO}/web#id=${p.id}&model=stock.picking&view_type=form">Odoo ↗</a></td>
    </tr>`;

  const tabla=(tit,ayuda,cols,filas,lista,fn)=>!lista.length?"":`<div class="panel">
      <h3>${tit}<span class="pill gris" style="margin-left:8px">${fnum(lista.length)}${lista.length===BUSCA_TOPE?"+":""}</span></h3>
      <div class="sub">${ayuda}</div>
      <div class="tscroll"><table><thead><tr>${cols}</tr></thead><tbody>${lista.map(fn).join("")}</tbody></table></div>
      ${lista.length===BUSCA_TOPE?`<div class="sub" style="margin-top:9px">Se muestran los ${BUSCA_TOPE} más recientes. Afiná la búsqueda si falta alguno.</div>`:""}
    </div>`;

  const C1=`<th>Pedido</th><th>Fecha</th><th>Cliente</th><th>Comercial</th><th>Estado</th><th class="r">Neto</th><th class="r"></th>`;
  const C2=`<th>Comprobante</th><th>Fecha</th><th>Cliente</th><th>Pedido</th><th>Estado</th><th class="r">Neto</th><th class="r">Imprimir</th>`;
  const C3=`<th>Remito</th><th>Fecha</th><th>Cliente</th><th>Pedido</th><th>Estado</th><th class="r"></th><th class="r">Imprimir</th>`;

  return tabla("🛒 Pedidos","Tocá una fila para abrirlo en la cola, si todavía está ahí. Incluye presupuestos y cancelados.",C1,null,r.peds,ped)
       + tabla("🧾 Facturas y notas de crédito","De cualquier fecha. El botón imprime el PDF sin pasar por Odoo.",C2,null,r.movs,mov)
       + tabla("📦 Remitos","Salidas de depósito. El botón arma el remito y lo manda a imprimir.",C3,null,r.rems,rem);
}

/* Si el pedido está en la lista cargada, lo abre ahí; si no, lo abre en Odoo. */
function irPedidoDesdeBusqueda(id){
  if(PEND.some(o=>o.id===id)){ limpiarBusqueda(); irPedido(id); return; }
  window.open(`${ODOO}/web#id=${id}&model=sale.order&view_type=form`,"_blank");
}

function render(){
  document.getElementById("quien").textContent=PERFIL?(PERFIL.nombre||PERFIL.email||""):"";
  const T=[
    ["hoy","📊 Mi día",null,null],
    ["cola","📥 Por facturar",KPI.cola,KPI.bloq?"rojo":null],
    ["avisos","💬 Avisos de comerciales",KPI.conAviso,KPI.bloq?"rojo":null],
    ["emitido","🧾 Emitido",KPI.draftInv||null,null],
    ["atrasados","🕰️ Atrasados",KPI.viejos,"gris"],
    ["archivados","🗄️ Archivados",ARCHIVADOS.length||null,"gris"]
  ];
  const tabs=T.map(([k,t,n,cl])=>`<button class="tab ${VISTA===k?"on":""}" onclick="irA('${k}')">${t}${n?`<span class="pill ${cl||""}">${fnum(n)}</span>`:""}</button>`).join("");
  /* con busqueda activa el cuerpo es el resultado: la idea es encontrar algo,
     no seguir mirando la pestania de atras */
  const buscando = BUSCA.q.trim().length>=BUSCA_MIN;
  let cuerpo="";
  if(buscando) cuerpo=vistaBusqueda();
  else if(VISTA==="hoy") cuerpo=vistaHoy();
  else if(VISTA==="cola") cuerpo=vistaCola();
  else if(VISTA==="avisos") cuerpo=vistaAvisos();
  else if(VISTA==="emitido") cuerpo=vistaEmitido();
  else if(VISTA==="atrasados") cuerpo=vistaAtrasados();
  else if(VISTA==="archivados") cuerpo=vistaArchivados();
  document.getElementById("app").innerHTML=`
    <div class="wip">⚠️ <div><b>Módulo nuevo, en pruebas.</b> Lee los pedidos y las facturas de Odoo en vivo. Los botones <b>Confirmar</b> y <b>Facturar</b> escriben de verdad en Odoo — antes de usarlos en el día a día conviene probar uno acompañada.</div></div>
    ${cajaBusqueda()}
    <div class="tabs">${tabs}</div>${cuerpo}`;
}
function irA(v){ VISTA=v; ABIERTO=null; BUSCA={q:"",cargando:false,res:null,err:""}; render(); if(v==="atrasados"&&ATRAS===null) cargarAtrasados(); }
function filtrar(campo,val){ FILTRO[campo]=val; if(VISTA!=="cola") VISTA="cola"; render(); }
/* Salto desde un KPI a la cola ya filtrada. Va con rango explícito porque
   varios de esos números (frenados, con aviso) cuentan TODO lo pendiente, y si
   la cola quedara en "últimos 30 días" el usuario vería menos de lo que le
   prometía la tarjeta que acaba de tocar. */
function verCola(rango,solo){ FILTRO.rango=rango; FILTRO.solo=solo||""; FILTRO.q=""; FILTRO.com=""; FILTRO.tipo=""; VISTA="cola"; ABIERTO=null; render(); }

/* ---------- Mi día ---------- */
function vistaHoy(){
  /* Seis tarjetas, no ocho: con ocho caían en dos renglones y empujaban la cola
     fuera de la pantalla. Las que se solapaban se fusionaron — "frenados" pasó a
     ser el subtítulo de "avisos" (un frenado ES un aviso) y las notas de crédito
     al subtítulo del mes, donde ya estaban descontadas. */
  const k=[
    {l:"Por facturar",n:KPI.cola,s:montoK(KPI.colaMonto)+" sin facturar",
     t:"Pedidos ya CONFIRMADOS a los que todavía les falta la factura. Suman "+money(KPI.colaMonto)+" sin facturar. Es el trabajo pendiente. Tocá para verlos.",
     v:()=>verCola("falta"),cls:KPI.cola?"":"bien"},
    {l:"Confirmados hoy",n:KPI.hoyConf,s:montoK(KPI.hoyConfMonto)+" netos",
     t:"Pedidos que se confirmaron hoy, facturados o no: es lo que entró en el día. Tocá para verlos.",
     v:()=>verCola("hoy")},
    {l:"Avisos de comerciales",n:KPI.conAviso,
     s:KPI.bloq?("🛑 "+KPI.bloq+" pide"+(KPI.bloq===1?"":"n")+" frenar"):"ninguno pide frenar",
     t:"Pedidos donde la comercial escribió una indicación: un precio especial según la orden de compra, un descuento, o que adjuntó la OC. Abajo, cuántos de esos piden NO facturar todavía. Antes había que abrir los pedidos uno por uno en Odoo para enterarse.",
     v:()=>irA("avisos"),cls:KPI.bloq?"alerta":""},
    {l:"Facturado hoy",n:montoK(KPI.hoyNeto),s:KPI.hoyFacts+" facturas · "+montoK(KPI.hoyTotal)+" c/IVA",
     t:"Lo facturado hoy en NETO (sin IVA), ya descontadas las notas de crédito del día: exactamente "+money(KPI.hoyNeto)+" netos, "+money(KPI.hoyTotal)+" con IVA, en "+KPI.hoyFacts+" comprobantes. Tocá para verlos uno por uno.",
     v:()=>irA("emitido"),cls:"bien"},
    {l:"Facturado del mes",n:montoK(KPI.mesNeto),
     s:KPI.mesFacts+" facturas · "+montoK(KPI.promDia)+"/día"+(KPI.mesNC?" · "+KPI.mesNC+" NC":""),
     t:"Neto facturado en el mes: exactamente "+money(KPI.mesNeto)+" (sin IVA, ya descontadas las "+KPI.mesNC+" notas de crédito por "+money(KPI.mesNCMonto)+"). El promedio, "+money(KPI.promDia)+" por día, se divide por DÍAS CON FACTURACIÓN ("+KPI.diasAct+" en este mes), no por días de calendario, para que no lo ensucien fines de semana ni feriados.",
     v:()=>irA("emitido")},
    {l:"Facturas sin emitir",n:KPI.draftInv,s:KPI.draftInv?"borradores sin CAE":"ninguna colgada",
     t:"Facturas y notas de crédito que quedaron en BORRADOR en Odoo: se crearon pero nunca se validaron, así que no tienen CAE y no cuentan como venta. Hay que emitirlas o borrarlas.",
     v:()=>irA("emitido"),cls:KPI.draftInv?"alerta":"bien"}
  ];
  window._kpiAcc=k.map(x=>x.v);
  const kpis=k.map((x,i)=>`<button class="kpi ${x.cls||""}" title="${esc(x.t)}" onclick="_kpiAcc[${i}]()">
      <div class="l">${esc(x.l)}</div><div class="n">${typeof x.n==="number"?fnum(x.n):esc(x.n)}</div><div class="s">${esc(x.s)}</div></button>`).join("");

  const max=Math.max(1,...PORDIA.map(d=>d.neto));
  const hoy=EYG.argToday();
  const barras=PORDIA.map(d=>{
    const h=Math.max(2,Math.round(d.neto/max*112));
    return `<div class="barra ${d.fecha===hoy?"hoy":""}" title="${fmtFecha(d.fecha)} — ${money(d.neto)} netos en ${d.facts} facturas${d.nc?" ("+d.nc+" notas de crédito por "+money(d.ncMonto)+")":""}">
      <div class="bb" style="height:${h}px"></div><div class="lb">${d.fecha.slice(8,10)}</div></div>`;
  }).join("");

  /* Primero lo que falta facturar y tiene indicación de la comercial (hay que
     leerla antes de emitir), después el resto de lo que falta facturar, y si no
     queda nada pendiente, los últimos confirmados del día. */
  const falta=PEND.filter(porFacturar);
  const conAv=falta.filter(o=>avisosDe(o).length).sort((a,b)=>(frenado(b)-frenado(a))||String(b.date_order).localeCompare(String(a.date_order)));
  const resto=falta.filter(o=>!avisosDe(o).length).sort((a,b)=>String(b.date_order).localeCompare(String(a.date_order)));
  const relleno=PEND.filter(o=>!porFacturar(o)).sort((a,b)=>String(b.date_order).localeCompare(String(a.date_order)));
  const urg=conAv.concat(resto).concat(relleno).slice(0,6);
  return `<div class="kpis">${kpis}</div>
    <div class="panel">
      <h3>📈 Facturación del mes, día por día</h3>
      <div class="sub">Neto facturado por día (sin IVA, descontadas las notas de crédito). El día de hoy va en naranja. Pasá el cursor por una barra para ver el detalle de ese día.</div>
      ${PORDIA.length?`<div class="barras">${barras}</div>`:'<div class="vacio">Todavía no hay facturación este mes.</div>'}
    </div>
    <div class="panel">
      <h3>⚡ Lo primero de la cola</h3>
      <div class="sub">${KPI.cola?"Lo que falta facturar: primero los pedidos con una indicación de la comercial —esos hay que leerlos antes de emitir— y después los más viejos.":"No queda nada por facturar: acá van los últimos pedidos confirmados."}${KPI.cola>urg.length?` <a class="lnk" href="#" onclick="verCola('falta');return false">Ver los ${fnum(KPI.cola)} pendientes →</a>`:""}</div>
      ${urg.length?urg.map(filaPedido).join(""):'<div class="vacio"><span class="big">✅</span>No hay pedidos confirmados en los últimos '+DIAS_VISTA+' días.</div>'}
    </div>`;
}

/* ---------- Por facturar ---------- */
function vistaCola(){
  const hoy=EYG.argToday();
  const R=FILTRO.rango||"falta";
  const enRango=o=> R==="falta" ? porFacturar(o)
                  : R==="hoy"   ? soloFecha(o.date_order)===hoy
                  : true;
  let l=PEND.filter(enRango);
  if(FILTRO.solo==="bloq") l=l.filter(frenado);
  if(FILTRO.solo==="aviso") l=l.filter(o=>avisosDe(o).length);
  if(FILTRO.solo==="fact") l=l.filter(facturado);
  if(FILTRO.solo==="nada") l=l.filter(o=>o.invoice_status==="no");
  if(FILTRO.com) l=l.filter(o=>(o.user_id?o.user_id[1]:"")===FILTRO.com);
  if(FILTRO.tipo) l=l.filter(o=>String(o.type_id?o.type_id[1]:"")===FILTRO.tipo);
  if(FILTRO.q){ const q=FILTRO.q.toLowerCase(); l=l.filter(o=>(o.name+" "+(o.partner_id?o.partner_id[1]:"")+" "+(o.client_order_ref||"")).toLowerCase().includes(q)); }
  /* Orden: primero lo que la comercial pidió frenar, después lo que falta facturar
     y al final lo ya resuelto; dentro de cada grupo, LO MÁS NUEVO ARRIBA (pedido de
     Dirección, 9/9/2026 — es el trabajo del día). Lo viejo no se pierde: tiene la
     pestaña Atrasados, y lo que no va a facturarse se aparta con "Apartar". */
  l.sort((a,b)=>(frenado(b)-frenado(a)) || (porFacturar(b)-porFacturar(a)) ||
    String(b.date_order).localeCompare(String(a.date_order)));

  const cuenta=f=>PEND.filter(enRango).filter(f).length;
  const coms=[...new Set(PEND.map(o=>o.user_id?o.user_id[1]:"").filter(Boolean))].sort();
  const tipos=[...new Set(PEND.map(o=>o.type_id?o.type_id[1]:"").filter(Boolean))].sort();
  const chip=(v,t,n,ay)=>`<button class="fchip ${FILTRO.solo===v?"on":""}" title="${esc(ay)}" onclick="filtrar('solo','${FILTRO.solo===v?"":v}')">${t} (${fnum(n)})</button>`;
  const chipR=(v,t,n,ay)=>`<button class="fchip ${R===v?"on":""}" title="${esc(ay)}" onclick="filtrar('rango','${v}')">${t} (${fnum(n)})</button>`;
  const total=l.reduce((a,o)=>a+montoPend(o),0);
  const netoLista=l.reduce((a,o)=>a+(o.amount_untaxed||0),0);

  return `<div class="panel">
    <h3>📥 Pedidos confirmados</h3>
    <div class="sub">Sólo <b>pedidos confirmados</b> — las cotizaciones en borrador son trabajo de la comercial y no aparecen acá. Arranca por <b>lo que falta facturar</b>, que es lo pendiente; lo que la comercial pidió frenar va primero y en rojo. Lo confirmado sin facturar de más de ${DIAS_DEMORA} días está en la pestaña <b>Atrasados</b>.</div>
    <div class="filtros">
      ${chipR("falta","🧾 Falta facturar",PEND.filter(porFacturar).length,"Pedidos confirmados a los que todavía les falta la factura. Es el trabajo pendiente.")}
      ${chipR("hoy","📅 Confirmados hoy",PEND.filter(o=>soloFecha(o.date_order)===hoy).length,"Todo lo que se confirmó hoy, facturado o no.")}
      ${chipR("todo","Últimos "+DIAS_VISTA+" días",PEND.length,"Todos los confirmados de los últimos "+DIAS_VISTA+" días, más lo que siga sin facturar de hasta "+DIAS_DEMORA+" días.")}
    </div>
    <div class="filtros">
      <input id="q" placeholder="Buscar por pedido, cliente u OC…" value="${esc(FILTRO.q)}" oninput="filtrarQ(this.value)" title="Busca en el número de pedido, el nombre del cliente y la referencia de la orden de compra.">
      <select onchange="filtrar('com',this.value)" title="Filtrar por la comercial que cargó el pedido."><option value="">Todas las comerciales</option>${coms.map(c=>`<option ${FILTRO.com===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
      <select onchange="filtrar('tipo',this.value)" title="Tipo de pedido de Odoo. La proforma va al talonario Proforma, sin validez fiscal."><option value="">Todos los tipos</option>${tipos.map(c=>`<option ${FILTRO.tipo===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
      ${chip("bloq","🛑 Frenados",cuenta(frenado),"Sólo los pedidos donde la comercial pidió no facturar todavía.")}
      ${chip("aviso","💬 Con aviso",cuenta(o=>avisosDe(o).length),"Sólo los pedidos que tienen alguna nota de la comercial.")}
      ${chip("fact","✅ Ya facturados",cuenta(facturado),"Pedidos que ya tienen su factura.")}
      ${chip("nada","Nada que facturar",cuenta(o=>o.invoice_status==="no"),"Pedidos confirmados que Odoo marca sin nada por facturar (por ejemplo, entregados y ya cerrados).")}
    </div>
    <div class="sub" style="margin-bottom:12px"><b>${fnum(l.length)}</b> pedidos · <b>${money(netoLista)}</b> netos${total?` · <b>${money(total)}</b> sin facturar`:""}</div>
    ${l.length?l.map(filaPedido).join(""):'<div class="vacio"><span class="big">✅</span>No hay pedidos con estos filtros.</div>'}
  </div>`;
}
let _qt=null;
function filtrarQ(v){ FILTRO.q=v; clearTimeout(_qt); _qt=setTimeout(()=>{ render(); const i=document.getElementById("q"); if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);} },260); }

function filaPedido(o){
  const d=diasDe(o.date_order), falta=porFacturar(o), fr=frenado(o), av=avisosDe(o);
  const cls=fr?"bloq":(falta?(d>1?"viejo":"draft"):"");
  const chips=[
    falta?'<span class="chip c-info" title="El pedido está confirmado pero todavía no se facturó. Es lo que hay que hacer.">🧾 falta facturar</span>'
      :facturado(o)?'<span class="chip c-ok" title="Ya tiene su factura emitida.">✅ facturado</span>'
      :'<span class="chip c-gris" title="Odoo lo marca sin nada por facturar.">nada que facturar</span>',
    fr?'<span class="chip c-bad" title="La comercial dejó una nota pidiendo no facturar todavía.">🛑 pidió frenar</span>':"",
    (falta&&d>1)?`<span class="chip c-warn" title="Hace ${d} días que está confirmado y sin facturar.">🕰️ ${d} días</span>`:"",
    tieneOC(o)?'<span class="chip c-gris" title="La comercial adjuntó la orden de compra del cliente. Está en el detalle.">📎 OC adjunta</span>':"",
    (o.type_id&&o.type_id[0]===3)?'<span class="chip c-gris" title="Tipo Proforma: al facturar va al talonario Proforma, sin validez fiscal.">proforma</span>':"",
    o.delivery_status==="pending"?'<span class="chip c-warn" title="El pedido todavía no salió del depósito.">sin entregar</span>':"",
    (falta&&corto(o))?`<span class="chip c-bad" title="Salió MENOS de lo que pide el pedido: ${fnum(corto(o).lineas)} ${corto(o).lineas===1?"renglón":"renglones"}, ${fnum(corto(o).unidades)} unidades, ${money(corto(o).monto)}. Como la facturación es por lo PEDIDO, si lo facturás así se factura de más y después hay que hacer nota de crédito. Conviene ajustarlo primero.">⚠️ entregado de menos</span>`:"",
    o.amount_untaxed?chipMrg((o.margin_percent||0)*100, o.margin, "Margen de todo el pedido; el detalle lo abre renglón por renglón."):""
  ].filter(Boolean).join(" ");
  /* Se muestra UNA sola nota en la fila —la que pide frenar, si hay, si no la
     más reciente— en un renglón. Las demás se cuentan y se leen en el detalle. */
  const princ=av.find(a=>a.freno)||av[0];
  const notas=princ?`<div class="aviso corto ${princ.freno?"stop":""}" onclick="abrir(${o.id})" title="${esc(princ.autor)} · ${fmtFecha(princ.fecha)} ${fmtHora(princ.fecha)}&#10;&#10;${esc(princ.txt.slice(0,600))}">
      <span class="qui">${esc(String(princ.autor).split(" ")[0])}:</span><span class="tx">${esc(princ.txt.replace(/\n+/g," · "))}</span>${av.length>1?`<span class="mas">+${av.length-1}</span>`:""}</div>`:"";
  const trab=TRABAJANDO[o.id];
  return `<div class="ped ${cls}" id="ped${o.id}">
    <div class="pedhead" onclick="abrir(${o.id})" title="Tocá para ver los renglones, las notas y los adjuntos del pedido.">
      <span class="nro">${esc(o.name)}</span>
      <span class="cli">${esc(o.partner_id?o.partner_id[1]:"—")}
        <small>${esc(o.user_id?o.user_id[1]:"sin comercial")} · ${fmtFecha(o.date_order)} · ${antig(d)}${o.client_order_ref?" · OC "+esc(o.client_order_ref):""}</small></span>
      <span>${chips}</span>
      <span class="mt" title="${falta?"Importe que todavía falta facturar de este pedido.":"Neto del pedido, sin IVA."}">${money(falta?montoPend(o):(o.amount_untaxed||0))}<small>${falta?"falta facturar":"neto del pedido"}</small></span>
    </div>
    ${notas?`<div class="avisos">${notas}</div>`:""}
    <div class="acc">
      ${falta?`<button class="btn pri" ${trab?"disabled":""} title="Genera la factura de este pedido. Vas a poder elegir si se emite con CAE o queda en borrador." onclick="accion(${o.id})">🧾 Facturar</button>`:""}
      ${(falta&&corto(o))?`<button class="btn dan" ${trab?"disabled":""} title="Baja las cantidades del pedido a lo que realmente salió del depósito, ANTES de facturar. Es lo que evita tener que emitir una nota de crédito después." onclick="ajustarAEntregado(${o.id})">✂️ Ajustar a lo entregado</button>`:""}
      <button class="btn sm" onclick="abrir(${o.id})">👁️ Ver detalle</button>
      <button class="btn sm" onclick="pedirArchivar(${o.id})" title="Lo saca de la cola, de los avisos y de Mi día, sin tocar nada en Odoo. Queda en la pestaña Archivados y se puede devolver.">🗄️ Apartar</button>
      <a class="lnk" style="margin-left:4px" target="_blank" href="${ODOO}/web#id=${o.id}&model=sale.order&view_type=form">Abrir en Odoo ↗</a>
      ${trab?'<span class="chip c-warn">trabajando…</span>':""}
    </div>
    ${ABIERTO===o.id?detalleHTML(o):""}
  </div>`;
}

/* ---------- Detalle del pedido ---------- */
async function abrir(id){
  if(ABIERTO===id){ ABIERTO=null; render(); return; }
  ABIERTO=id; render();
  if(!DET[id]){
    try{
      const [lineas,msgs,adj,ord,pick]=await Promise.all([
        EYG.rpc("sale.order.line","search_read",[[["order_id","=",id]]],
          {fields:["name","product_uom_qty","qty_delivered","qty_invoiced","price_unit","discount","price_subtotal",
                   "product_id","purchase_price","margin","margin_percent"],context:{lang:"es_AR"},limit:0}),
        EYG.rpc("mail.message","search_read",[[["model","=","sale.order"],["res_id","=",id],["message_type","=","comment"]]],
          {fields:["date","body","author_id"],limit:0,order:"date desc"}),
        EYG.rpc("ir.attachment","search_read",[[["res_model","=","sale.order"],["res_id","=",id]]],
          {fields:["name","mimetype","create_date"],limit:0,order:"create_date desc"}),
        /* Los papeles del pedido, para poder imprimirlos desde acá. */
        EYG.rpc("sale.order","read",[[id]],{fields:["invoice_ids"]}).catch(()=>[]),
        EYG.rpc("stock.picking","search_read",[[["sale_id","=",id],["picking_type_code","=","outgoing"]]],
          {fields:["name","state","date_done","scheduled_date"],limit:0,order:"id desc",context:{lang:"es_AR"}}).catch(()=>[])
      ]);
      // Las del Core van primero: son las que la comercial escribió para ella.
      const deCore=(AVISOS[id]||[]).filter(a=>a.core)
        .map(a=>({date:a.fecha, author_id:[0,a.autor], txt:a.txt, core:true}));
      /* Las facturas del pedido, para el botón de imprimir. Van en una segunda
         vuelta porque recién con el pedido leído sabemos cuáles son. */
      const facIds=(ord&&ord[0]&&ord[0].invoice_ids)||[];
      const facs=facIds.length
        ? await EYG.rpc("account.move","read",[facIds],
            {fields:["name","move_type","state","invoice_date","amount_total","journal_id"],context:{lang:"es_AR"}}).catch(()=>[])
        : [];
      DET[id]={lineas,
        msgs:deCore.concat(msgs.map(m=>({date:m.date,author_id:m.author_id,txt:limpiar(m.body)})).filter(m=>m.txt)),
        adj, facs, pick:pick||[]};
    }catch(e){ DET[id]={error:e.message||String(e)}; }
    render();
  }
}
function detalleHTML(o){
  const d=DET[o.id];
  if(!d) return '<div class="detwrap"><span class="muted">Cargando el detalle…</span></div>';
  if(d.error) return '<div class="detwrap"><span class="neg">No pude leer el detalle: '+esc(d.error)+'</span></div>';

  const neto=d.lineas.reduce((a,l)=>a+(l.price_subtotal||0),0);
  const netoCosto=d.lineas.reduce((a,l)=>a+(l.purchase_price||0)*(l.product_uom_qty||0),0);

  /* Los renglones ya facturados no se tocan: cambiarles el precio no cambia la
     factura emitida y sólo desalinea el pedido de lo que se le cobró al cliente. */
  const trabado=l=>(l.qty_invoiced||0)>0;
  const inp=(l,campo,val,clase)=>trabado(l)
    ? `<span class="muted">${campo==="discount"?(val?fnum(val)+"%":"—"):(campo==="price_unit"?money(val):fnum(val))}</span>`
    : `<input class="ed ${clase||""}" type="number" step="${campo==="product_uom_qty"?"1":"0.01"}" min="0" ${campo==="discount"?'max="100"':""}
         value="${val}" data-orig="${val}" data-lin="${l.id}" data-campo="${campo}" data-costo="${l.purchase_price||0}"
         oninput="recalcLinea(${o.id},${l.id})">`;

  const filas=d.lineas.map(l=>`<tr id="lin-${l.id}">
      <td class="prod">${esc(String(l.name||"").split("\n")[0])}${trabado(l)?' <span class="chip c-gris" title="Este renglón ya se facturó: no se puede editar desde acá.">facturado</span>':""}</td>
      <td class="r">${inp(l,"product_uom_qty",l.product_uom_qty,"chico")}${
        ((l.product_uom_qty||0)-(l.qty_delivered||0)>0.001)
          ? `<div class="salio" title="Del depósito salieron ${fnum(l.qty_delivered)} de las ${fnum(l.product_uom_qty)} pedidas. Si se factura la cantidad pedida, se factura de más.">salió ${fnum(l.qty_delivered)}</div>`
          : ""}</td>
      <td class="r">${inp(l,"price_unit",l.price_unit)}</td>
      <td class="r">${inp(l,"discount",l.discount,"chico")}</td>
      <td class="r muted" title="Costo unitario que tiene cargado Odoo. Es la base del margen.">${money(l.purchase_price)}</td>
      <td class="r" id="sub-${l.id}">${money(l.price_subtotal)}</td>
      <td class="r" id="mrg-${l.id}">${l.purchase_price>0||l.price_subtotal
          ? chipMrg((l.margin_percent||0)*100, l.margin)
          : '<span class="muted" title="Este producto no tiene costo cargado en Odoo, así que el margen no se puede calcular.">sin costo</span>'}</td>
    </tr>`).join("");

  const tabla=`<div class="tscroll"><table>
      <thead><tr><th>Producto</th>
        <th class="r" title="Cantidad pedida. Se puede editar. Si abajo dice «salió N», del depósito salió menos que eso.">Cant.</th>
        <th class="r" title="Precio unitario sin IVA. Se puede editar: al cambiarlo se recalcula el margen al instante, antes de guardar.">Precio</th>
        <th class="r" title="Descuento del renglón, en porcentaje. Se puede editar.">Desc.</th>
        <th class="r" title="Costo unitario cargado en Odoo. Es la base con la que se calcula el margen.">Costo</th>
        <th class="r" title="Subtotal del renglón, sin IVA.">Subtotal</th>
        <th class="r" title="Margen del renglón sobre el neto, sin IVA. El color dice si está dentro de lo que factura la casa.">Margen</th></tr></thead>
      <tbody>${filas||'<tr><td colspan="7" class="muted">Sin renglones.</td></tr>'}</tbody>
      ${d.lineas.length?`<tfoot><tr id="pie-${o.id}">
        <td colspan="5">Neto del pedido (sin IVA)</td>
        <td class="r" id="pieSub-${o.id}">${money(neto)}</td>
        <td class="r" id="pieMrg-${o.id}">${netoCosto<neto?chipMrg((neto-netoCosto)/neto*100, neto-netoCosto):'<span class="muted">—</span>'}</td>
      </tr></tfoot>`:""}
    </table></div>
    ${d.lineas.length?leyendaMrg:""}`;

  const msgs=d.msgs.length
    ? d.msgs.map(m=>`<div class="aviso ${RE_FRENO.test(m.txt)?"stop":""}">
        <span class="qui">${esc(m.author_id?m.author_id[1]:"—")} · ${fmtFecha(m.date)} ${fmtHora(m.date)}${m.core?" · 🧾 dirigido a Facturación":""}</span>${esc(m.txt)}</div>`).join("")
    : '<span class="muted">Nadie escribió nada en este pedido.</span>';

  const adj=d.adj.length
    ? '<div class="adjs">'+d.adj.map(a=>`<a class="adj" target="_blank" href="${ODOO}/web/content/${a.id}?download=true" title="Descargar ${esc(a.name)}">📎 ${esc(a.name)} <small>${fmtFecha(a.create_date)}</small></a>`).join("")+'</div>'
    : '<span class="muted">Este pedido no tiene archivos adjuntos.</span>';

  return `<div class="detwrap" id="det-${o.id}">
    <div class="dcard">
      <div class="dh">🧾 Qué se factura<span class="n">${fnum(d.lineas.length)} ${d.lineas.length===1?"renglón":"renglones"} · editable</span></div>
      ${tabla}
      <div class="edbar oculta" id="edbar-${o.id}">
        <span id="edtxt-${o.id}">Hay cambios sin guardar.</span>
        <button class="btn pri sm" onclick="guardarLineas(${o.id})">💾 Guardar los cambios en Odoo</button>
        <button class="btn sm" onclick="descartarLineas(${o.id})">Descartar</button>
      </div>
    </div>
    <div class="dcard">
      <div class="dh">💬 Lo que dejó escrito la comercial<span class="n">${d.msgs.length?fnum(d.msgs.length)+(d.msgs.length===1?" nota":" notas"):"ninguna"}</span></div>
      <div class="db" style="display:flex;flex-direction:column;gap:6px">${msgs}</div>
    </div>
    <div class="dcard">
      <div class="dh">📎 Respaldo del pedido<span class="n">${d.adj.length?fnum(d.adj.length)+(d.adj.length===1?" archivo":" archivos"):"sin archivos"}</span></div>
      <div class="db">${adj}</div>
    </div>
    ${papelesHTML(d)}
  </div>`;
}

/* Los papeles del pedido: facturas y remitos, con su botón de imprimir. Es lo
   que Vanesa tenía que ir a buscar a Odoo uno por uno. */
function papelesHTML(d){
  const facs=d.facs||[], pick=d.pick||[];
  const fac=facs.length?facs.map(m=>{
    const nc=m.move_type==="out_refund", emitida=m.state==="posted";
    return `<div class="papel">
      <span class="pn">${nc?"↩️":"🧾"} ${esc(m.name&&m.name!=="/"?m.name:"(borrador)")}</span>
      <span class="pd">${fmtFecha(m.invoice_date)} · ${esc(m.journal_id?m.journal_id[1]:"—")} · ${money(m.amount_total)}</span>
      ${emitida?`<button class="btn sm" title="Abre el PDF para imprimirlo. Sale el mismo formulario que se le manda al cliente." onclick="imprimirFactura(${m.id},event)">🖨️ Imprimir</button>`
               :'<span class="chip c-warn" title="Está en borrador: hay que emitirla antes de imprimirla.">sin emitir</span>'}
    </div>`;
  }).join(""):'<span class="muted">Todavía no tiene factura.</span>';

  const rem=pick.length?pick.map(p=>{
    const hecho=p.state==="done";
    return `<div class="papel">
      <span class="pn">📦 ${esc(p.name)}</span>
      <span class="pd">${hecho?"entregado "+fmtFecha(p.date_done):"programado "+fmtFecha(p.scheduled_date)}</span>
      <button class="btn sm" title="Abre el PDF del remito de entrega para imprimirlo." onclick="imprimirRemito(${p.id},event)">🖨️ Imprimir</button>
    </div>`;
  }).join(""):'<span class="muted">Este pedido no tiene remitos de salida.</span>';

  return `<div class="dcard">
      <div class="dh">🖨️ Papeles del pedido<span class="n">${fnum(facs.length)} ${facs.length===1?"factura":"facturas"} · ${fnum(pick.length)} ${pick.length===1?"remito":"remitos"}</span></div>
      <div class="db">
        <div class="papelgrupo"><b>Facturas y notas de crédito</b>${fac}</div>
        <div class="papelgrupo"><b>Remitos de entrega</b>${rem}</div>
      </div>
    </div>`;
}

/* ══════════════ EDITAR LOS RENGLONES ══════════════
   Vanesa está autorizada (acordado con Germán) a corregir cantidad, precio y
   descuento antes de facturar — es lo que hoy hace entrando a Odoo. Al escribir
   se recalcula TODO en el navegador (subtotal, margen del renglón y margen del
   pedido) para que vea el efecto ANTES de guardar; recién con "Guardar" se
   escribe en Odoo. Los renglones ya facturados no se pueden tocar. */

const _val=el=>{ const v=parseFloat(String(el.value).replace(",",".")); return isNaN(v)?null:v; };

/* Devuelve los inputs de un pedido, con su valor y si cambió respecto del original. */
function _campos(oid){
  const cont=document.getElementById("det-"+oid);
  if(!cont) return [];
  return [...cont.querySelectorAll("input.ed")].map(el=>({
    el, lin:Number(el.dataset.lin), campo:el.dataset.campo,
    costo:parseFloat(el.dataset.costo)||0,
    val:_val(el), orig:parseFloat(el.dataset.orig)||0
  }));
}
function _deLinea(campos,lin){
  const o={}; campos.filter(c=>c.lin===lin).forEach(c=>{ o[c.campo]=c.val; o._costo=c.costo; });
  return o;
}

function recalcLinea(oid,lin){
  const campos=_campos(oid);
  const det=DET[oid]; if(!det) return;
  let neto=0, costoTot=0, cambios=0;

  det.lineas.forEach(l=>{
    const edit=_deLinea(campos,l.id);
    const hayInputs=Object.keys(edit).some(k=>k!=="_costo");
    const q  = hayInputs && edit.product_uom_qty!=null ? edit.product_uom_qty : (l.product_uom_qty||0);
    const pu = hayInputs && edit.price_unit!=null      ? edit.price_unit      : (l.price_unit||0);
    const ds = hayInputs && edit.discount!=null        ? edit.discount        : (l.discount||0);
    const costoU = l.purchase_price||0;
    const sub = q*pu*(1-ds/100);
    const cos = q*costoU;
    neto+=sub; costoTot+=cos;
    if(l.id===lin){
      const cs=document.getElementById("sub-"+l.id); if(cs) cs.textContent=money(sub);
      const cm=document.getElementById("mrg-"+l.id);
      if(cm) cm.innerHTML = (costoU>0 && sub)
        ? chipMrg((sub-cos)/sub*100, sub-cos)
        : '<span class="muted" title="Este producto no tiene costo cargado en Odoo, así que el margen no se puede calcular.">sin costo</span>';
    }
  });

  campos.forEach(c=>{ const dif=c.val!=null && Math.abs(c.val-c.orig)>1e-9; c.el.classList.toggle("tocado",dif); if(dif) cambios++; });

  const ps=document.getElementById("pieSub-"+oid); if(ps) ps.textContent=money(neto);
  const pm=document.getElementById("pieMrg-"+oid);
  if(pm) pm.innerHTML = (neto>0 && costoTot>0) ? chipMrg((neto-costoTot)/neto*100, neto-costoTot) : '<span class="muted">—</span>';

  const bar=document.getElementById("edbar-"+oid);
  if(bar){
    bar.classList.toggle("oculta", cambios===0);
    const t=document.getElementById("edtxt-"+oid);
    if(t) t.textContent = cambios===1 ? "1 cambio sin guardar." : cambios+" cambios sin guardar.";
  }
}

function descartarLineas(oid){
  _campos(oid).forEach(c=>{ c.el.value=c.el.dataset.orig; c.el.classList.remove("tocado"); });
  const det=DET[oid]; if(det&&det.lineas.length) recalcLinea(oid,det.lineas[0].id);
}

async function guardarLineas(oid){
  const o=PEND.find(x=>x.id===oid); if(!o) return;
  const campos=_campos(oid).filter(c=>c.val!=null && Math.abs(c.val-c.orig)>1e-9);
  if(!campos.length) return;

  const malos=campos.filter(c=>c.val<0 || (c.campo==="discount"&&c.val>100) || (c.campo==="product_uom_qty"&&c.val===0));
  if(malos.length){ dialogoError(o.name,"Hay valores que no se pueden guardar: la cantidad no puede ser 0, el precio no puede ser negativo y el descuento va de 0 a 100."); return; }

  /* Se agrupa por renglón: un solo write por línea, no uno por campo. */
  const porLinea={};
  campos.forEach(c=>{ (porLinea[c.lin]=porLinea[c.lin]||{})[c.campo]=c.val; });
  const ETIQ={product_uom_qty:"cantidad", price_unit:"precio", discount:"descuento"};
  const det=DET[oid];
  const resumen=campos.map(c=>{
    const l=det.lineas.find(x=>x.id===c.lin)||{};
    const nom=String(l.name||"").split("\n")[0].slice(0,40);
    const f=v=>c.campo==="price_unit"?money(v):(c.campo==="discount"?fnum(v)+"%":fnum(v));
    return nom+": "+ETIQ[c.campo]+" "+f(c.orig)+" → "+f(c.val);
  });

  const bar=document.getElementById("edbar-"+oid);
  const txt=document.getElementById("edtxt-"+oid);
  if(txt) txt.textContent="Guardando…";
  if(bar) bar.querySelectorAll("button").forEach(b=>b.disabled=true);

  try{
    for(const [lin,vals] of Object.entries(porLinea)){
      await EYG.rpc("sale.order.line","write",[[Number(lin)],vals],{context:{lang:"es_AR"}});
    }
    const quien=(PERFIL&&(PERFIL.nombre||PERFIL.email))||"—";
    try{ await EYG.rpc("sale.order","message_post",[[oid]],
      {body:"✏️ Renglones corregidos desde EyG Core por "+esc(quien)+":<br>· "+resumen.map(esc).join("<br>· "),message_type:"comment"}); }catch(_){}
    toast(resumen.length===1?"Cambio guardado ✓":resumen.length+" cambios guardados ✓");
    delete DET[oid];
    await refrescarPedido(oid);
    await abrirForzado(oid);
  }catch(e){
    if(bar) bar.querySelectorAll("button").forEach(b=>b.disabled=false);
    if(txt) txt.textContent="No se pudo guardar.";
    dialogoError(o.name,e.message||String(e));
  }
}

/* ══════════════ ACCIONES QUE ESCRIBEN EN ODOO ══════════════
   Los mismos dos pasos que hace Odoo por dentro:
     confirmar → sale.order.action_confirm  (el presupuesto pasa a pedido)
     facturar  → asistente sale.advance.payment.inv → create_invoices, que crea
                 la factura en BORRADOR; y después account.move.action_post, que
                 la EMITE: ahí se pide el CAE a ARCA/AFIP y ya no se puede
                 deshacer, sólo anular con una nota de crédito.
   Por eso "Facturar" siempre pregunta, deja elegir "dejarla en borrador", y si
   la comercial pidió frenar el pedido lo avisa arriba de todo. */
function accion(id){
  const o=PEND.find(x=>x.id===id); if(!o) return;
  const fr=frenado(o), c=corto(o);

  /* Si salió menos de lo pedido, el camino por defecto NO es facturar: es
     ajustar primero. Facturar de más obliga a una nota de crédito, y ahí es
     donde se armó el lío de Laprida. */
  if(c){
    confirmarDialogo({
      titulo:"Ojo: a "+o.name+" se le entregó menos de lo pedido",
      alerta:"Si lo facturás así, la factura sale por "+money(c.monto)+" de MÁS y después hay que emitir una nota de crédito.",
      cuerpo:`<b>${esc(o.partner_id?o.partner_id[1]:"")}</b><br><br>
        ${c.detalle.slice(0,6).map(d=>`· ${esc(String(d.prod).slice(0,42))}<br>&nbsp;&nbsp;&nbsp;pedido <b>${fnum(d.pedido)}</b> · salió <b>${fnum(d.entregado)}</b> · faltan <b>${fnum(d.falta)}</b>`).join("<br>")}
        ${c.detalle.length>6?`<br>· y ${c.detalle.length-6} renglones más`:""}
        <br><br>Pasa porque los productos se facturan <b>por lo pedido</b>, no por lo entregado.
        Lo sano es <b>bajar el pedido a lo que salió</b> y recién después facturar.`,
      ok:"✂️ Ajustar a lo entregado",
      ok2:"Facturar igual, por el total",
      run:()=>{ cerrarDialogo(); ajustarAEntregado(id); },
      run2:()=>{ cerrarDialogo(); accionFacturar(id, true); }
    });
    return;
  }
  accionFacturar(id, false);
}

function accionFacturar(id, avisado){
  const o=PEND.find(x=>x.id===id); if(!o) return;
  const fr=frenado(o), c=corto(o);
  confirmarDialogo({
    titulo:"Facturar "+o.name,
    alerta:fr?"⚠️ La comercial pidió NO facturar este pedido todavía. Revisá su nota y, si hace falta, avisale antes de emitir."
          :(avisado&&c?"Vas a facturar por el total, incluyendo "+money(c.monto)+" que no se entregó. Después va a hacer falta una nota de crédito.":""),
    cuerpo:`<b>${esc(o.partner_id?o.partner_id[1]:"")}</b><br>
      A facturar: <b>${money(montoPend(o))}</b><br>
      Tipo: ${esc(o.type_id?o.type_id[1]:"—")}${(o.type_id&&o.type_id[0]===3)?" — va al talonario <b>Proforma</b>, sin validez fiscal":""}<br>
      Comercial: ${esc(o.user_id?o.user_id[1]:"—")}<br><br>
      Elegí si querés <b>emitirla</b> (se pide el CAE y queda definitiva) o <b>dejarla en borrador</b> para revisarla antes.`,
    ok:"🧾 Facturar y emitir",
    ok2:"Dejarla en borrador",
    run:()=>ejecutar(id,{emitir:true}),
    run2:()=>ejecutar(id,{emitir:false})
  });
}

async function ejecutar(id,{emitir}){
  cerrarDialogo();
  const o=PEND.find(x=>x.id===id); if(!o) return;
  TRABAJANDO[id]=true; render();
  try{
    {
      const antes=(await EYG.rpc("sale.order","read",[[id]],{fields:["invoice_ids","invoice_status","amount_to_invoice"]}))[0];
      if(antes.invoice_status==="invoiced" && !antes.amount_to_invoice)
        throw new Error("El pedido ya está facturado por completo.");
      const ctx={active_model:"sale.order",active_ids:[id],active_id:id,lang:"es_AR"};
      const wid=await EYG.rpc("sale.advance.payment.inv","create",[{advance_payment_method:"delivered"}],{context:ctx});
      await EYG.rpc("sale.advance.payment.inv","create_invoices",[[wid]],{context:ctx});
      const desp=(await EYG.rpc("sale.order","read",[[id]],{fields:["invoice_ids"]}))[0];
      const previas=antes.invoice_ids||[];
      const nuevas=(desp.invoice_ids||[]).filter(x=>previas.indexOf(x)<0);
      if(!nuevas.length)
        throw new Error("Odoo no generó ninguna factura. Revisá el pedido en Odoo: puede no tener nada por facturar.");
      let etiqueta="en borrador";
      if(emitir){
        await EYG.rpc("account.move","action_post",[nuevas],{context:{lang:"es_AR"}});
        etiqueta="emitida";
      }
      const inv=await EYG.rpc("account.move","read",[nuevas],{fields:["name","amount_total","state"],context:{lang:"es_AR"}});
      const nombres=inv.map(i=>(i.name&&i.name!=="/")?i.name:"borrador").join(", ");
      const quien=(PERFIL&&(PERFIL.nombre||PERFIL.email))||"—";
      try{ await EYG.rpc("sale.order","message_post",[[id]],
        {body:"🧾 Facturado desde EyG Core por "+esc(quien)+": "+esc(nombres)+" ("+etiqueta+")",message_type:"comment"}); }catch(_){}
      await cerrarNotasCore(id, "se facturó "+nombres);   // la comercial lo ve resuelto en su panel
      toast("Factura "+nombres+" — "+etiqueta+" ✓");
    }
    delete TRABAJANDO[id]; delete DET[id];
    await refrescarPedido(id);
  }catch(e){
    delete TRABAJANDO[id];
    render();
    dialogoError(o.name,e.message||String(e));
  }
}

/* Después de tocar un pedido se releen SÓLO ese pedido y los comprobantes del
   mes: así la pantalla queda al día sin volver a bajar los cientos de
   pendientes. Si el pedido ya no está pendiente, sale de la lista. */
async function refrescarPedido(id){
  try{
    const hoy=EYG.argToday(), iniMes=hoy.slice(0,8)+"01";
    const [r,emit]=await Promise.all([
      EYG.rpc("sale.order","read",[[id]],{fields:PF,context:{lang:"es_AR"}}),
      EYG.rpc("account.move","search_read",[[["move_type","in",["out_invoice","out_refund"]],["invoice_date",">=",iniMes],EYG.VENTA_REAL]],
        {fields:MF,context:{lang:"es_AR"},limit:0,order:"invoice_date desc, id desc"})
    ]);
    /* Un pedido facturado NO sale de la lista: sigue siendo un confirmado del
       período y Vanesa tiene que poder verlo. Sólo se actualiza en el lugar. */
    const o=r&&r[0];
    const i=PEND.findIndex(x=>x.id===id);
    if(i>=0 && o) PEND[i]=o;
    EMITIDO=emit;
    KPI.draftInv=EMITIDO.filter(m=>m.state==="draft").length;
    recalcularDias();
    calcularKpis(hoy);
  }catch(e){ console.warn("No pude refrescar el pedido",e); }
  render();
}

    ${c.alerta?`<div class="alerta">${esc(c.alerta)}</div>`:""}
    <div class="dato">${c.cuerpo}</div>
    <div class="ovacc">
      <button class="btn" onclick="cerrarDialogo()">Cancelar</button>
      ${c.ok2?`<button class="btn" id="dlg2">${esc(c.ok2)}</button>`:""}
      <button class="btn pri" id="dlg1">${esc(c.ok)}</button>
    </div></div>`;
  document.body.appendChild(_dlg);
  _dlg.querySelector("#dlg1").onclick=c.run;
  if(c.ok2) _dlg.querySelector("#dlg2").onclick=c.run2;
}
function cerrarDialogo(){ if(_dlg&&_dlg.parentNode) _dlg.parentNode.removeChild(_dlg); _dlg=null; }
function dialogoError(nombre,msg){
  cerrarDialogo();
  _dlg=document.createElement("div"); _dlg.className="ovbg";
  _dlg.onclick=e=>{ if(e.target===_dlg) cerrarDialogo(); };

    <p>Revisá el pedido en Odoo antes de reintentar: puede haber quedado confirmado sin factura, o con la factura en borrador.</p>
    <div class="ovacc"><button class="btn pri" onclick="cerrarDialogo()">Entendido</button></div></div>`;
  document.body.appendChild(_dlg);
}
