<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facturación · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css?v=83">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=110"></script>
<style>
  :root{
    --teal:#048782; --teal-deep:#04635F; --teal-med:#0AA89F; --aqua:#5FC8BF;
    --agua:#E2F1EF; --coral:#EC8B5E; --ink:#0E1F1D; --gris:#5F716E; --gris2:#8A9A97;
    --surface:#fff; --bg:#F4F8F7; --line:#DCE8E6; --radius:12px;
    --shadow:0 1px 2px rgba(6,65,62,.05), 0 6px 24px rgba(6,65,62,.06);
    --ok:#1F8A5F; --warn:#B7791F; --bad:#C0392B; --info:#5B8DEF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .topbar{background:var(--teal-deep);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:13px;position:sticky;top:0;z-index:30}
  .mono{font-family:Georgia,serif;font-weight:700;font-size:23px;letter-spacing:.5px;line-height:1}
  .mono .y{color:var(--aqua)}
  .topbar .tag{font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:20px}
  .topbar .title{font-weight:700;font-size:15px;margin-left:4px}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .topbar .back{color:#fff;text-decoration:none;font-size:13px;font-weight:600;opacity:.85}
  .topbar .back:hover{opacity:1}
  .wrap{max-width:1300px;margin:0 auto;padding:20px 22px 90px}

  .wip{background:#FBF3D9;border:1px solid #EAD9A0;color:#8A6D1A;border-radius:10px;padding:10px 14px;font-size:12.5px;line-height:1.55;margin-bottom:16px;display:flex;gap:9px;align-items:flex-start}
  .wip b{color:#6B5410}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line)}
  .tab{font-family:inherit;font-size:13.5px;font-weight:700;color:var(--gris);background:none;border:0;border-bottom:2.5px solid transparent;padding:9px 13px 11px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .tab:hover{color:var(--teal-deep)}
  .tab.on{color:var(--teal-deep);border-bottom-color:var(--teal)}
  .tab .pill{font-size:9.5px;font-weight:800;background:var(--coral);color:#fff;border-radius:20px;padding:1px 6px;line-height:1.5}
  .tab .pill.rojo{background:var(--bad)}
  .tab .pill.gris{background:var(--gris2)}

  /* Las tarjetas van SIEMPRE en un solo renglón: si caen en dos, el gráfico y la
     cola quedan demasiado abajo y hay que scrollear para ver el trabajo. Por eso
     son 6 columnas fijas (no auto-fit) y el texto se achica solo. Recién en
     pantallas chicas se parten en 3 y en 2. Si Vanesa lo abre sin el menú lateral
     hay más ancho todavía, pero tiene que entrar igual CON el menú. */
  .kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin-bottom:16px}
  .kpis.tres{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;box-shadow:var(--shadow);text-align:left;font-family:inherit;cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden;min-width:0}
  .kpi:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(6,65,62,.09),0 12px 30px rgba(6,65,62,.10)}
  .kpi::after{content:"\203A";position:absolute;right:9px;top:9px;color:var(--gris2);font-size:15px;font-weight:800;opacity:.45}
  .kpi .l{font-size:10px;color:var(--gris);font-weight:800;text-transform:uppercase;letter-spacing:.4px;line-height:1.3;padding-right:12px}
  .kpi .n{font-size:clamp(16px,1.55vw,22px);font-weight:800;line-height:1.15;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .s{font-size:10.5px;color:var(--gris2);font-weight:600;margin-top:2px;line-height:1.4}
  @media(max-width:1150px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} .kpi .n{font-size:20px} }
  @media(max-width:640px){ .kpis,.kpis.tres{grid-template-columns:repeat(2,minmax(0,1fr))} }
  .kpi.alerta{border-color:#F0C9C4;background:#FFF9F8}
  .kpi.alerta .n{color:var(--bad)}
  .kpi.bien .n{color:var(--ok)}
  .kpi.quieto{cursor:help}
  .kpi.quieto::after{content:""}
  .neg{color:var(--bad)}.pos{color:var(--ok)}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px}
  .panel h3{font-size:14.5px;font-weight:800;color:var(--teal-deep);margin-bottom:3px;display:flex;align-items:center;gap:7px}
  .panel .sub{font-size:12px;color:var(--gris);margin-bottom:14px;line-height:1.5}

  /* ---- fila de pedido (la cola de trabajo) ---- */
  .ped{border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:9px;overflow:hidden;position:relative}
  .ped::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--teal-med)}
  .ped.draft::before{background:var(--info)}
  .ped.bloq::before{background:var(--bad)}
  .ped.viejo::before{background:var(--warn)}
  .pedhead{display:flex;align-items:center;gap:12px;padding:9px 14px 9px 17px;cursor:pointer;flex-wrap:wrap}
  .pedhead:hover{background:#FAFDFC}
  .pedhead .nro{font-size:12.5px;font-weight:800;color:var(--teal-deep);min-width:82px}
  .pedhead .cli{font-size:13px;font-weight:700;flex:1;min-width:180px;line-height:1.35}
  .pedhead .cli small{display:block;font-size:11px;color:var(--gris2);font-weight:600}
  .pedhead .mt{font-size:14px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pedhead .mt small{display:block;font-size:10.5px;color:var(--gris2);font-weight:600}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;border-radius:20px;padding:2.5px 8px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
  .c-ok{background:#E4F4EC;color:var(--ok)} .c-warn{background:#FBF1DC;color:var(--warn)}
  .c-bad{background:#FBE6E3;color:var(--bad)} .c-info{background:#E8EFFD;color:var(--info)}
  .c-gris{background:#EEF2F2;color:var(--gris)} .c-teal{background:var(--agua);color:var(--teal-deep)}
  .avisos{padding:0 14px 9px 17px;display:flex;flex-direction:column;gap:5px}
  .aviso{background:#FFFBF0;border:1px solid #F0DFB8;border-left:3px solid var(--coral);border-radius:8px;padding:6px 10px;font-size:12px;line-height:1.45;color:#5C4A22;white-space:pre-wrap}
  .aviso.stop{background:#FEF4F3;border-color:#F2CFCA;border-left-color:var(--bad);color:#8A2F27}
  .aviso .qui{display:block;font-size:10.5px;font-weight:800;color:var(--gris2);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
  /* En la cola el aviso va de UNA línea, con el autor adelante: si se muestran
     enteros y de a tres, cada pedido ocupa media pantalla y no se ve la cola.
     El texto completo está en el detalle, a un clic. */
  .aviso.corto{display:flex;align-items:baseline;gap:7px;white-space:nowrap;overflow:hidden;cursor:pointer}
  .aviso.corto .qui{display:inline;margin:0;flex:none;text-transform:none;letter-spacing:0}
  .aviso.corto .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .aviso.corto .mas{flex:none;margin-left:auto;font-weight:800;font-size:10.5px;opacity:.75}
  .aviso.corto:hover{filter:brightness(.98)}
  .acc{display:flex;gap:6px;padding:0 14px 9px 17px;flex-wrap:wrap;align-items:center}
  .btn{font-family:inherit;font-size:12px;font-weight:700;border-radius:8px;padding:6px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
  .btn:hover{background:#F4F8F7}
  .btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
  .btn.pri:hover{background:var(--teal-deep)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.sm{font-size:11px;padding:5px 10px}
  .lnk{font-size:11.5px;color:var(--teal);font-weight:700;text-decoration:none}
  .lnk:hover{text-decoration:underline}

  /* ---- detalle desplegado ----
     Antes eran tres bloques iguales, uno abajo del otro, con el mismo fondo y el
     mismo título chico: el ojo no encontraba dónde terminaba uno y empezaba el
     otro. Ahora el detalle entero va sobre un fondo hundido y cada sección es una
     tarjeta blanca con su cabecera, separadas entre sí. */
  .detwrap{border-top:2px solid var(--teal-med);background:#EAF3F2;padding:12px 14px 14px 17px;display:flex;flex-direction:column;gap:11px}
  .dcard{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(6,65,62,.05)}
  .dcard .dh{background:#F4F8F7;border-bottom:1px solid var(--line);padding:8px 12px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--teal-deep);display:flex;align-items:center;gap:7px}
  .dcard .dh .n{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--gris2);text-transform:none;letter-spacing:0}
  .dcard .db{padding:11px 12px}
  .dcard table{font-size:12px}
  .dcard th{padding:7px 10px;background:#fff}
  .dcard td{padding:7px 10px}
  .dcard tbody tr:nth-child(even) td{background:#FAFCFC}
  .dcard tbody tr:hover td{background:#F2F9F8}
  .dcard tfoot td{border-top:1.5px solid var(--line);border-bottom:0;font-weight:800;background:#F4F8F7}
  .dcard .prod{font-weight:600;color:var(--ink)}
  /* ---- margen ----
     La escala está anclada en los números REALES de la casa (medidos sobre 2.108
     renglones de los últimos 14 días): mediana 25,9% y ponderado 26,3%; el piso
     duro de las escalas de precios es 13-15%. No son cortes inventados. */
  .mrg{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;border-radius:20px;padding:2px 8px;white-space:nowrap}
  .m-perd{background:#1C2321;color:#fff}          /* negativo: se vende bajo el costo */
  .m-cero{background:#E3E8E7;color:#3A4443}       /* clavado en el costo */
  .m-mal{background:#FBE4E3;color:#B0322F}        /* menos de 5% */
  .m-bajo{background:#FBF1DC;color:#9A6B12}       /* 5 a 15: lo habitual en oferta */
  .m-ok{background:#E4F5E9;color:#1E7D46}         /* 15 a 26 */
  .m-bien{background:#1F8A5F;color:#fff}          /* 26 o mas: el margen de la casa */
  .mrgleyenda{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:10.5px;color:var(--gris2);font-weight:600;margin-top:9px}

  /* ---- edición de renglones ---- */
  .ed{font-family:inherit;font-size:12px;font-weight:700;text-align:right;width:88px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-variant-numeric:tabular-nums}
  .ed:focus{outline:0;border-color:var(--teal-med);box-shadow:0 0 0 2px rgba(10,168,159,.18)}
  .ed.tocado{border-color:var(--coral);background:#FFFAF5}
  .ed[disabled]{background:#F4F6F6;color:var(--gris2);cursor:not-allowed}
  .ed.chico{width:62px}
  /* cuando salió menos de lo pedido, se dice en el mismo renglón */
  /* aviso de que hay una version nueva del modulo publicada */
  /* buscador general: va arriba de las pestanias y se ve siempre */
  .buscaja{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 13px;margin-bottom:13px;box-shadow:var(--shadow)}
  .buscaja .lupa{font-size:15px;opacity:.75}
  .buscaja input{flex:1;min-width:0;font-family:inherit;font-size:13.5px;border:0;outline:0;background:transparent;color:var(--ink)}
  .buscaja input::placeholder{color:var(--gris2)}
  .buscaja .bchip{font-size:11px;font-weight:800;color:var(--gris);background:var(--agua);border-radius:20px;padding:3px 10px;white-space:nowrap}
  .vernueva{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:11px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:11px 16px;border-radius:11px;box-shadow:0 10px 34px rgba(0,0,0,.3);z-index:12500;max-width:92vw;flex-wrap:wrap}
  .vernueva .btn{padding:5px 12px}
  .vernueva .btn:not(.pri){background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
  .vernueva .btn:not(.pri):hover{background:rgba(255,255,255,.12)}
  .salio{font-size:10px;font-weight:800;color:#B0322F;background:#FBE4E3;border-radius:5px;padding:1px 5px;margin-top:3px;display:inline-block;cursor:help}
  .edbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:#FFF7EE;border-top:1px solid #F0DFB8;padding:9px 12px;font-size:12px;font-weight:600;color:#7A5A20}
  .edbar.oculta{display:none}

  /* papeles del pedido (facturas y remitos, con su botón de imprimir) */
  .papelgrupo{margin-bottom:11px}
  .papelgrupo:last-child{margin-bottom:0}
  .papelgrupo>b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);margin-bottom:6px}
  .papel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);background:#F9FCFB;border-radius:8px;padding:7px 11px;margin-bottom:5px}
  .papel .pn{font-size:12.5px;font-weight:800;color:var(--teal-deep);min-width:150px}
  .papel .pd{font-size:11.5px;color:var(--gris2);font-weight:600;flex:1;min-width:150px}

  .adjs{display:flex;flex-wrap:wrap;gap:7px}
  .adj{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#F9FCFB;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--teal-deep);text-decoration:none}
  .adj:hover{background:var(--agua);border-color:var(--teal-med)}
  .adj small{font-weight:600;color:var(--gris2)}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:800;padding:8px 9px;border-bottom:1.5px solid var(--line);white-space:nowrap}
  td{padding:8px 9px;border-bottom:1px solid #EEF4F3;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tscroll{overflow-x:auto}
  .muted{color:var(--gris2)}
  .clk{cursor:pointer}
  tr.clk:hover td{background:#F6FBFA}

  .filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
  .filtros input,.filtros select{font-family:inherit;font-size:12.5px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .filtros input{min-width:220px}
  .fchip{font-family:inherit;font-size:11.5px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--gris);border-radius:20px;padding:5px 12px;cursor:pointer}
  .fchip.on{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff}

  .vacio{text-align:center;padding:36px 20px;color:var(--gris2);font-size:13px;font-weight:600;line-height:1.6}
  .vacio .big{font-size:30px;display:block;margin-bottom:8px}
  .errbox{background:#FEF4F3;border:1px solid #F2CFCA;color:#8A2F27;border-radius:10px;padding:13px 16px;font-size:13px;line-height:1.55}
  .cargando{text-align:center;padding:44px;color:var(--gris2);font-size:13px;font-weight:600}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:9px;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.2s;z-index:12000;max-width:88vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  .ovbg{position:fixed;inset:0;background:rgba(8,30,28,.45);z-index:11000;display:flex;align-items:center;justify-content:center;padding:20px}
  .ov{background:#fff;border-radius:14px;max-width:520px;width:100%;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .ov h3{font-size:16px;font-weight:800;color:var(--teal-deep);margin-bottom:9px}
  .ov p{font-size:13px;line-height:1.6;color:var(--gris);margin-bottom:10px}
  .ov .dato{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:12.5px;line-height:1.7;margin-bottom:13px}
  .ov .dato b{color:var(--ink)}
  .ov .ovacc{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .ov .alerta{background:#FEF4F3;border:1px solid #F2CFCA;color:#8A2F27;border-radius:9px;padding:10px 12px;font-size:12.5px;line-height:1.55;margin-bottom:12px}
  /* Apartar un pedido: motivos de un toque + el campo libre */
  .motchips{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0 9px}
  .motchips .fchip{font-size:11.5px;padding:5px 10px}
  .motin{width:100%;font-family:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;color:var(--ink)}
  .motin:focus{outline:none;border-color:var(--teal-med)}

  .barras{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:8px}
  .barra{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0;cursor:help}
  .barra .bb{width:100%;border-radius:4px 4px 0 0;background:var(--teal-med);min-height:2px}
  .barra.hoy .bb{background:var(--coral)}
  .barra:hover .bb{opacity:.75}
  .barra .lb{font-size:9px;color:var(--gris2);font-weight:700;white-space:nowrap}

  @media(max-width:760px){
    .wrap{padding:16px 13px 80px}
    .pedhead{gap:8px}
    .pedhead .mt{text-align:left}
  }
</style>
</head>
<body>
<div class="topbar">
  <span class="mono">E<span class="y">y</span>G</span>
  <span class="tag">Core</span>
  <span class="title">🧾 Facturación</span>
  <span class="right">
    <span id="quien" style="font-size:12px;opacity:.8"></span>
    <a class="back" href="../index.html">← Inicio</a>
  </span>
</div>
<div class="wrap" id="app"><div class="cargando">Cargando facturación…</div></div>

<script>
const ODOO="https://drogueriaeyg.odoo.com";
const esc=EYG.esc, money=EYG.money;

/* ═══════════════════════════════════════════════════════════════════════
   FACTURACIÓN — el puesto de Vanesa dentro del Core.

   El circuito real, medido sobre Odoo el 8/9/2026:
     1. La comercial carga el pedido y lo deja en BORRADOR (presupuesto).
        A veces le deja una nota en el chatter: "Vane, facturar la cipro a
        $4999", "no facturar estoy esperando la OC", o le adjunta la OC.
     2. Vanesa lo revisa, lo CONFIRMA y lo FACTURA. De las 870 facturas de
        los últimos 14 días, 772 las creó ella: unas 55 por día.
     3. Casi todo se factura el mismo día. Lo que queda pendiente más de
        una semana es la excepción, y es justo lo que hay que destacar.

   Por eso el módulo se ordena así: la COLA de lo que falta facturar es la
   pantalla principal, con las notas de las comerciales pegadas al pedido
   (antes había que abrir el chatter de Odoo uno por uno para verlas), y
   los botones de Confirmar / Facturar al lado.
   ═══════════════════════════════════════════════════════════════════════ */

/* ⚠️ ACÁ NO ENTRAN LOS PRESUPUESTOS (corrección de Dirección, 8/9/2026).
   Vanesa trabaja SÓLO sobre pedidos CONFIRMADOS (state sale/done), y de ahí
   destaca los que faltan facturar. Las cotizaciones en borrador son trabajo de
   la comercial, no suyo, y llenaban la pantalla: había ~700 presupuestos viejos.
   Se verificó que no se pierde nada: de 72 pedidos con nota de la comercial en
   19 días, 71 estaban confirmados y sólo 1 era borrador.

   Se cargan los confirmados de los últimos DIAS_VISTA días MÁS todo lo que esté
   por facturar dentro de DIAS_DEMORA (así un pedido viejo sin facturar nunca se

function montoK(n){
  n=n||0; const a=Math.abs(n);
  if(a>=1e6) return "$"+(n/1e6).toLocaleString("es-AR",{minimumFractionDigits:1,maximumFractionDigits:1})+" M";

function fechaAR(iso){
  if(!iso) return "";
  const d=new Date(iso); if(isNaN(d.getTime())) return String(iso);
  const g={};
  new Intl.DateTimeFormat("en-CA",{timeZone:"America/Argentina/Buenos_Aires",year:"numeric",
    month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false})
    .formatToParts(d).forEach(x=>g[x.type]=x.value);
  return `${g.year}-${g.month}-${g.day} ${String((+g.hour)%24).padStart(2,"0")}:${g.minute}:00`;
}

   cliente — `/my/invoices/<id>?access_token=…&report_type=pdf`. No hace falta
   estar logueada en Odoo, y cada comprobante sale con SU formulario: verificado

/* La ventana se abre ANTES de los await: si se abriera después, el navegador la
   toma como emergente no pedida y la bloquea. */
function ventanaPDF(){ return window.open("", "_blank"); }
function fallaPDF(w, msg, urlOdoo){
  if(w && !w.closed){ try{ w.close(); }catch(_){ } }
  toast(msg);
  if(urlOdoo) window.open(urlOdoo, "_blank");
}

async function imprimirFactura(id, ev){
  if(ev) ev.stopPropagation();
  const w=ventanaPDF();
  try{
    const m=(await EYG.rpc("account.move","read",[[id]],{fields:["access_token","name","state"]}))[0];
    if(!m) throw new Error("no encontré el comprobante");
    if(m.state!=="posted") throw new Error("todavía está en borrador: emitila y después imprimila");
    let tok=m.access_token;
    if(!tok){
      tok=(window.crypto&&crypto.randomUUID)?crypto.randomUUID()
        :String(Date.now())+"-"+Math.random().toString(16).slice(2);
      await EYG.rpc("account.move","write",[[id],{access_token:tok}]);
    }
    w.location=`${ODOO}/my/invoices/${id}?access_token=${encodeURIComponent(tok)}&report_type=pdf`;
  }catch(e){
    fallaPDF(w, "No pude abrir la factura: "+(e.message||e), `${ODOO}/web#id=${id}&model=account.move&view_type=form`);
  }
}

async function datosRemito(id){

  if(!p) throw new Error("no encontré el remito");
  const [lins,cli,ped,emi]=await Promise.all([
    EYG.rpc("stock.move.line","search_read",[[["picking_id","=",id]]],
      {fields:["product_id","quantity","lot_id","expiration_date","product_uom_id"],context:{lang:"es_AR"},limit:0}),
    EYG.rpc("res.partner","read",[[p.partner_id[0]]],
      {fields:["name","vat","l10n_ar_formatted_vat","street","street2","city","state_id","zip","phone","l10n_ar_afip_responsibility_type_id"],context:{lang:"es_AR"}}).catch(()=>[]),

      {fields:["name","client_order_ref","user_id","payment_term_id"],context:{lang:"es_AR"}}).catch(()=>[]):Promise.resolve([]),
    emisorRemito()
  ]);
  return {p, lins, cli:cli[0]||{}, ped:ped[0]||{}, emi};
}

/* ══════════════ SI SALIÓ UNA VERSIÓN NUEVA, AVISAR ══════════════
   El Core se sirve con Cache-Control: max-age=600 y la entrada del módulo es el
   propio .html, así que no se le puede poner ?v= desde adentro. Consecuencia:
   una pestaña que quedó abierta sigue corriendo el JavaScript viejo para
   siempre, aunque el sitio ya tenga lo nuevo.

   Pasó de verdad el 5/10/2026: Dirección imprimía el remito viejo porque tenía
   la pantalla cargada desde antes de publicar. No era caché del servidor ni del
   CDN — se verificó que el html en vivo era idéntico al publicado y que no hay
   service worker.

   Por eso el módulo se mira a sí mismo cada tanto: pide su propio archivo sin
   caché y compara la marca de abajo. Si cambió, ofrece recargar. NO recarga
   solo: puede estar a mitad de una edición de renglones.

   ⚠️ Al publicar un cambio de este módulo, subir MODULO_VER. */
/*VER*/const MODULO_VER="2026-10-05-r8";
let _verNueva=false;

async function mirarVersion(){
  if(_verNueva || document.hidden) return;
  try{
    const r=await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"});
    if(!r.ok) return;
    const m=/\/\*VER\*\/const MODULO_VER="([^"]+)"/.exec(await r.text());
    if(m && m[1]!==MODULO_VER){ _verNueva=true; avisarVersionNueva(); }
  }catch(e){ /* sin internet o sitio caído: no molesta */ }
}

function avisarVersionNueva(){
  if(document.getElementById("eyg-vernueva")) return;
  const d=document.createElement("div");
  d.id="eyg-vernueva"; d.className="vernueva";
  d.innerHTML='<span>✨ Hay una versión nueva de Facturación. Lo que estás viendo es la anterior.</span>'
    +'<button class="btn pri sm" onclick="location.reload()">Actualizar</button>'
    +'<button class="btn sm" onclick="cerrarAvisoVersion()">Después</button>';
  document.body.appendChild(d);
}

function domTrabajo(){

          "|",["date_order",">=",hace(DIAS_VISTA)+" 00:00:00"],["invoice_status","in",A_FACTURAR]];

/* ══════════════ ENTREGADO DE MENOS ══════════════
   El caso Laprida (16/9/2026): el pedido pedía 490, se entregaron 486, se
   facturó por el total y después hubo que emitir una nota de crédito. Peor: en
   ese caso se hicieron las DOS cosas (bajar el borrador y emitir la NC) y el
   crédito salió duplicado.

   La raíz es que casi todos los productos tienen política de facturación
   **"por pedido"**, así que Odoo factura lo PEDIDO, no lo entregado. Si salió
   menos, la factura sale de más y hay que corregirla con papel fiscal.

   Medido el 5/10/2026 sobre los pedidos por facturar: **13 de 24 (54%)** tenían
   algún renglón entregado de menos, por **$13,8 M** que se facturarían de más.
   Por eso se avisa ANTES, y se ofrece bajar el pedido a lo entregado — que es
   corregir el borrador, no emitir una nota de crédito después. */
let CORTOS={};   // id de pedido -> {lineas, unidades, monto}

async function cargarCortos(){
  CORTOS={};
  const ids=PEND.filter(porFacturar).map(o=>o.id);
  if(!ids.length) return;
  try{
    const lins=await EYG.rpc("sale.order.line","search_read",
      [[["order_id","in",ids],["display_type","=",false]]],
      {fields:["order_id","product_uom_qty","qty_delivered","price_unit","discount","product_id"],context:{lang:"es_AR"},limit:0});
    lins.forEach(l=>{
      const falta=(l.product_uom_qty||0)-(l.qty_delivered||0);
      if(falta<=0.001) return;
      const k=l.order_id[0];
      const c=CORTOS[k]=CORTOS[k]||{lineas:0,unidades:0,monto:0,detalle:[]};
      c.lineas++; c.unidades+=falta;
      c.monto+=falta*(l.price_unit||0)*(1-(l.discount||0)/100);
      c.detalle.push({prod:l.product_id?l.product_id[1]:"—", pedido:l.product_uom_qty, entregado:l.qty_delivered, falta});
    });
  }catch(e){ console.warn("No pude mirar lo entregado",e); }
}
const corto=o=>CORTOS[o.id]||null;

/* Baja las cantidades del pedido a lo que realmente salió. Es corregir ANTES de
   facturar, que es lo que evita la nota de crédito. */
async function ajustarAEntregado(oid){
  const o=PEND.find(x=>x.id===oid), c=corto(o||{});
  if(!o||!c) return;
  confirmarDialogo({
    titulo:"Ajustar "+o.name+" a lo entregado",
    cuerpo:`Se bajan <b>${fnum(c.lineas)}</b> ${c.lineas===1?"renglón":"renglones"} a la cantidad que realmente salió:<br><br>`+
      c.detalle.slice(0,8).map(d=>`· ${esc(String(d.prod).slice(0,40))}: <b>${fnum(d.pedido)} → ${fnum(d.entregado)}</b>`).join("<br>")+
      (c.detalle.length>8?`<br>· y ${c.detalle.length-8} más`:"")+
      `<br><br>Así la factura sale por <b>${money(montoPend(o)-c.monto)}</b> en vez de ${money(montoPend(o))}, y no hace falta nota de crédito.`,
    ok:"Ajustar a lo entregado",
    run:async()=>{
      cerrarDialogo();
      TRABAJANDO[oid]=true; render();
      try{
        const lins=await EYG.rpc("sale.order.line","search_read",
          [[["order_id","=",oid],["display_type","=",false]]],
          {fields:["product_uom_qty","qty_delivered"],context:{lang:"es_AR"},limit:0});
        const cambios=lins.filter(l=>(l.product_uom_qty||0)-(l.qty_delivered||0)>0.001);
        for(const l of cambios){
          await EYG.rpc("sale.order.line","write",[[l.id],{product_uom_qty:l.qty_delivered}],{context:{lang:"es_AR"}});
        }
        const quien=(PERFIL&&(PERFIL.nombre||PERFIL.email))||"—";
        try{ await EYG.rpc("sale.order","message_post",[[oid]],
          {body:"✂️ Cantidades ajustadas a lo entregado desde EyG Core por "+esc(quien)+" ("+cambios.length+
                (cambios.length===1?" renglón":" renglones")+"), antes de facturar, para no tener que emitir una nota de crédito.",
           message_type:"comment"}); }catch(_){}
        toast(cambios.length===1?"1 renglón ajustado ✓":cambios.length+" renglones ajustados ✓");
        delete TRABAJANDO[oid]; delete DET[oid];
        await refrescarPedido(oid);
        await cargarCortos();
        render();
      }catch(e){
        delete TRABAJANDO[oid]; render();
        dialogoError(o.name,e.message||String(e));
      }
    }
  });
}

/* ══════════════ ARCHIVAR ══════════════
   Pedidos que no se van a facturar ahora y no tienen resolución: en vez de dejarlos
   tapando la cola, se apartan. NO se tocan en Odoo —el pedido sigue igual—: el
   apartado vive en Supabase, así que es reversible y no ensucia la contabilidad.
   Al archivar salen de PEND, y con eso desaparecen solos de la cola, de los avisos,
   de las tarjetas de Mi día y de Atrasados: todo el módulo mira PEND. */
async function cargarArchivados(){
  ARCH={};
  try{
    const {data,error}=await EYG.supa().from("facturacion_archivado").select("*").limit(1000);
    if(error) throw error;
    (data||[]).forEach(r=>{ ARCH[r.pedido_id]=r; });
  }catch(e){ /* si no se puede leer, no se archiva nada: la cola queda como antes */ }
}
function reagrupar(){
  PEND=FUENTE.filter(o=>!ARCH[o.id]);
  ARCHIVADOS=FUENTE.filter(o=>ARCH[o.id])
    .sort((a,b)=>String((ARCH[b.id]||{}).ts||"").localeCompare(String((ARCH[a.id]||{}).ts||"")));
}
const MOTIVOS=["No se va a facturar","Esperando definición del cliente","Falta la orden de compra",
               "Pedido duplicado","Lo tiene que resolver la comercial"];
function pedirArchivar(id){

      Sale de la cola, de los avisos y de Mi día. <b>En Odoo no se toca nada</b> y lo podés devolver cuando quieras.
      <div class="motchips">${MOTIVOS.map(m=>`<button class="fchip" onclick="ponerMotivo(this.textContent)">${esc(m)}</button>`).join("")}</div>
      <input id="motivo" class="motin" placeholder="¿Por qué lo apartás? Queda registrado." autocomplete="off">`,

}
function ponerMotivo(m){ const i=document.getElementById("motivo"); if(i){ i.value=m; i.focus(); } }
async function archivar(id){
  const o=FUENTE.find(x=>x.id===id); if(!o) return;
  const motivo=((document.getElementById("motivo")||{}).value||"").trim();
  if(!motivo){ toast("Escribí por qué lo apartás — el que lo revise después necesita saberlo"); return; }
  cerrarDialogo();
  const quien=(PERFIL&&(PERFIL.nombre||PERFIL.email))||"—";
  const fila={pedido_id:o.id, pedido_nombre:o.name||"", cliente:o.partner_id?o.partner_id[1]:"",
    comercial:o.user_id?o.user_id[1]:"", monto:montoPend(o)||o.amount_untaxed||0,
    motivo, por:quien, por_email:(PERFIL&&PERFIL.email)||null};
  try{
    const {data,error}=await EYG.supa().from("facturacion_archivado").insert([fila]).select();
    if(error) throw error;
    ARCH[o.id]=(data&&data[0])||{...fila, ts:new Date().toISOString()};
    reagrupar(); calcularKpis(); ABIERTO=null; render();
    toast("🗄️ "+o.name+" apartado — está en la pestaña Archivados");
  }catch(e){ dialogoError(o.name, e.message||String(e)); }
}
async function desarchivar(id){
  const o=FUENTE.find(x=>x.id===id); if(!o) return;
  try{
    const {error}=await EYG.supa().from("facturacion_archivado").delete().eq("pedido_id",id);
    if(error) throw error;
    delete ARCH[id];
    reagrupar(); calcularKpis(); render();
    toast("↩ "+o.name+" volvió a la cola");
  }catch(e){ dialogoError(o.name, e.message||String(e)); }
}

/* Notas de las comerciales sobre los pedidos que siguen pendientes.
   Una nota se considera "resuelta" sola cuando el pedido se factura: por eso
   sólo se leen las de los pedidos de esta lista, y desaparecen sin que nadie
   tenga que marcarlas como leídas. */
async function cargarAvisos(){
  AVISOS={};
  const ids=PEND.map(o=>o.id);
  if(!ids.length) return;
  const msgs=await EYG.rpc("mail.message","search_read",
    [[["model","=","sale.order"],["res_id","in",ids],["message_type","=","comment"]]],
    {fields:["res_id","date","body","author_id"],limit:0,order:"date desc"});
  msgs.forEach(m=>{
    const txt=limpiar(m.body);
    if(!txt) return;
    (AVISOS[m.res_id]=AVISOS[m.res_id]||[]).push({
      id:m.id, txt, fecha:m.date, autor:m.author_id?m.author_id[1]:"—",
      oc:RE_OC.test(txt), freno:RE_FRENO.test(txt)
    });
  });
  await cargarNotasCore(ids);
}

/* Las notas que las comerciales dejan desde el Core ("Para facturación", el 🧾 del
   panel): viven en Supabase, NO en Odoo. Es la vía nueva —desde que quedaron en solo
   lectura casi no entran más a Odoo—, así que va PRIMERO en la fila. Las de Odoo se
   siguen leyendo: están las históricas y alguna las escribe allá todavía.
   No se filtra por pedido en la consulta: son pocas y así se detecta la que quedó
   colgada de un pedido que no está en esta lista. */
async function cargarNotasCore(ids){
  const enLista=new Set(ids);
  try{
    const {data,error}=await EYG.supa().from("comercial_nota")
      .select("id,texto,creada_ts,comercial,pedido_id,pedido_nombre")
      .eq("tipo","facturacion").eq("estado","abierta").limit(1000);
    if(error) throw error;
    (data||[]).forEach(n=>{
      const txt=String(n.texto||"").trim();
      if(!txt || !n.pedido_id || !enLista.has(n.pedido_id)) return;
      (AVISOS[n.pedido_id]=AVISOS[n.pedido_id]||[]).unshift({
        id:"core-"+n.id, notaId:n.id, core:true, txt, fecha:fechaAR(n.creada_ts),
        autor:n.comercial||"—", oc:RE_OC.test(txt), freno:RE_FRENO.test(txt)
      });
    });
  }catch(e){ /* si Supabase no contesta, quedan las notas de Odoo: la cola no se cae */ }
}

/* Cerrar una nota del Core la saca de la pantalla de Vanesa Y le avisa a la comercial
   en su panel (ve quién la resolvió y por qué). Las de Odoo no se tocan: ésas se
   resuelven solas cuando el pedido se factura. */
async function cerrarNotasCore(pedidoId, motivo){
  const notas=(AVISOS[pedidoId]||[]).filter(a=>a.core&&a.notaId);
  if(!notas.length) return;
  const quien=(PERFIL&&(PERFIL.nombre||PERFIL.email))||"Facturación";
  const ahora=new Date().toISOString();
  for(const n of notas){
    try{
      await EYG.supa().from("comercial_nota").update({
        estado:"hecha", hecha_ts:ahora,
        detalle:{cerrada_por:quien, cerrada_ts:ahora, cerrada_nota:motivo||null}
      }).eq("id",n.notaId);
      AVISOS[pedidoId]=(AVISOS[pedidoId]||[]).filter(a=>a.notaId!==n.notaId);
    }catch(e){ /* si falla, la nota sigue abierta: es preferible a darla por resuelta */ }
  }
}
/* Botón "Listo" de la pestaña Avisos: la atendió sin facturar (habló con la comercial,
   ya estaba resuelto, etc.). */
async function notaListo(pedidoId, notaId){
  const a=(AVISOS[pedidoId]||[]).find(x=>x.notaId===notaId); if(!a) return;
  AVISOS[pedidoId]=(AVISOS[pedidoId]||[]).filter(x=>x.notaId!==notaId);
  const quien=(PERFIL&&(PERFIL.nombre||PERFIL.email))||"Facturación";
  const ahora=new Date().toISOString();
