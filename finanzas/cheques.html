<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargar cheques · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=57"></script>
<style>
  /* Mismo sistema visual que "Cargar crédito bancario" (finanzas/creditos-bancarios.html):
     tarjetas numeradas por paso, grid de campos, tiles de vista previa. */
  :root{
    --teal:#048782; --teal-deep:#04635F; --teal-med:#0AA89F; --aqua:#5FC8BF;
    --agua:#E2F1EF; --coral:#EC8B5E; --ink:#0E1F1D; --gris:#5F716E; --gris2:#8A9A97;
    --surface:#fff; --bg:#F4F8F7; --line:#DCE8E6; --radius:12px;
    --ok:#1E7D46; --okbg:#E4F5E9; --err:#B0413E; --errbg:#FBE0DF; --warnbg:#FBF3D9; --warn:#8A6D1A;
    --shadow:0 1px 2px rgba(6,65,62,.05), 0 6px 24px rgba(6,65,62,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .topbar{background:var(--teal-deep);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:13px;position:sticky;top:0;z-index:30}
  .mono{font-family:Georgia,serif;font-weight:700;font-size:23px;letter-spacing:.5px;line-height:1}
  .mono .y{color:var(--aqua)}
  .topbar .tag{font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:20px}
  .topbar .title{font-weight:700;font-size:15px;margin-left:4px}
  .topbar .back{margin-left:auto;color:#fff;text-decoration:none;font-size:13px;font-weight:600;opacity:.85}
  .topbar .back:hover{opacity:1}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 22px 90px}

  .wip{background:var(--warnbg);border:1px solid #EAD9A0;color:var(--warn);border-radius:10px;padding:10px 14px;font-size:12.5px;line-height:1.5;margin-bottom:16px;display:flex;gap:9px;align-items:flex-start}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
  .card h3{font-size:14px;font-weight:800;color:var(--ink);margin-bottom:3px}
  .card .cap{font-size:12px;color:var(--gris);margin-bottom:15px}
  .step{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;font-size:12px;font-weight:800;margin-right:8px}
  .step.off{background:var(--line);color:var(--gris2)}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
  label{display:block;font-size:11.5px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
  .req::after{content:" *";color:var(--err)}
  input,select,textarea{font-family:inherit;font-size:14px;width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--ink);background:var(--surface);outline:none}
  input:focus,select:focus{border-color:var(--teal-med);box-shadow:0 0 0 2px rgba(4,135,130,.13)}
  input.err{background:var(--errbg);border-color:var(--err)}
  .hint{font-size:11px;color:var(--gris2);margin-top:4px;line-height:1.4}
  .btn{font-family:inherit;font-size:14px;font-weight:700;border:0;border-radius:10px;padding:11px 20px;cursor:pointer;background:var(--teal);color:#fff}
  .btn:hover{background:var(--teal-deep)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:var(--agua);color:var(--teal-deep)}
  .btn.big{padding:13px 26px;font-size:15px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}

  .pv-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:14px}
  .pv-tile{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .pv-tile .l{font-size:10.5px;color:var(--gris);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .pv-tile .v{font-size:16px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
  .pv-tile.tot{background:var(--teal-deep);border-color:var(--teal-deep)}
  .pv-tile.tot .l{color:var(--aqua)} .pv-tile.tot .v{color:#fff}
  .pv-tile.bad{background:var(--errbg);border-color:#E7BDBC}

  /* buscador de cliente */
  .busca{position:relative}
  .sug{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(6,65,62,.14);margin-top:4px;max-height:290px;overflow-y:auto;z-index:20}
  .sug div{padding:10px 13px;font-size:13.5px;cursor:pointer;border-bottom:1px solid #F2F7F6}
  .sug div:last-child{border-bottom:0}
  .sug div:hover{background:var(--agua)}
  .sug .cu{font-size:11.5px;color:var(--gris2);font-weight:600}

  .elegido{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--agua);border-radius:10px;padding:12px 15px}
  .elegido .nm{font-size:15px;font-weight:800;color:var(--teal-deep)}
  .elegido .x{margin-left:auto;background:none;border:0;font-size:17px;color:var(--gris);cursor:pointer;font-family:inherit}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--gris);font-weight:700;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:6px 8px;border-bottom:1px solid #EEF4F3;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tscroll{overflow-x:auto}
  .muted{color:var(--gris2)}
  .chq input{font-size:13px;padding:8px 9px}
  .chq .del{background:none;border:0;color:var(--gris2);font-size:16px;cursor:pointer;font-family:inherit;padding:3px 5px}
  .chq .del:hover{color:var(--err)}

  .aviso{font-size:12.5px;border-radius:9px;padding:10px 13px;margin-top:12px;line-height:1.55}
  .a-ok{background:var(--okbg);color:var(--ok)} .a-warn{background:var(--warnbg);color:var(--warn)} .a-bad{background:var(--errbg);color:var(--err)}

  .spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:gir .7s linear infinite;vertical-align:-2px;margin-right:6px}
  .spinner.dark{border-color:var(--agua);border-top-color:var(--teal)}
  @keyframes gir{to{transform:rotate(360deg)}}
  .load{text-align:center;padding:44px 20px;color:var(--gris)}
  .vacio{text-align:center;padding:22px;color:var(--gris2);font-size:12.5px}
  @media(max-width:700px){ .wrap{padding:16px 13px 80px} }
</style>
</head>
<body>
<div class="topbar">
  <div class="mono">E<span class="y">y</span>G</div>
  <span class="tag">Cheques</span>
  <span class="title">Cargar cheques de terceros</span>
  <a class="back" href="../index.html">← Inicio</a>
</div>

<div class="wrap">
  <div class="wip">⚠️ <div><b>Módulo nuevo.</b> Genera el recibo RE-X en el diario “Cheques de terceros”, igual que Odoo, y lo imputa a las facturas del cliente. Revisá la vista previa antes de generar.</div></div>
  <div id="app"><div class="load"><span class="spinner dark"></span> Cargando…</div></div>
</div>

<datalist id="listaBancos"></datalist>

<script>
const R=(m,me,a,k)=>EYG.rpc(m,me,a,k);
const money=EYG.money, esc=EYG.esc;
const HOY=EYG.argToday();

/* Constantes del circuito de cheques (verificadas contra los recibos que carga Federico) */
const J_CHEQUES = 16;      // diario "Cheques de terceros"
const PML_NUEVO = 9;       // método "Nuevo Cheque de Terceros"
const DOCTYPE   = 147;     // tipo de comprobante "RECIBOS X"
const POS       = "0001";  // punto de venta de los recibos

const ST = { cliente:null, deuda:[], cheques:[], bancos:[], bancosError:false, guardando:false, hecho:null };

/* ---------- utilidades ---------- */
const num = v => Number(String(v==null?"":v).replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",","."))||0;
/* El CUIT se guarda SIEMPRE sin guiones: hoy conviven los dos formatos y eso rompe
   cualquier búsqueda por emisor. */
const cuitLimpio = v => String(v||"").replace(/\D/g,"");
const cuitOk = v => cuitLimpio(v).length===11;
const fmtCuit = v => { const c=cuitLimpio(v); return c.length===11 ? c.slice(0,2)+"-"+c.slice(2,10)+"-"+c.slice(10) : v; };
const money2 = n => "$"+Number(n||0).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const hoyMas = d => { const t=new Date(HOY+"T00:00:00"); t.setDate(t.getDate()+d); return t.toISOString().slice(0,10); };
const fechaCorta = f => { if(!f) return "—"; const p=String(f).slice(0,10).split("-"); return p[2]+"/"+p[1]+"/"+p[0].slice(2); };

/* ---------- arranque ---------- */
async function init(){
  /* Los bancos van a un <datalist>: son 85 y en un desplegable no se encuentran.
     Así Federico escribe "mac" y aparece Macro. Si la lista falla se avisa, no
     se queda en silencio: el banco es justamente el dato que hoy casi nunca se carga. */
  try{
    ST.bancos = await R("res.bank","search_read",[[],["id","name"]],{limit:500,order:"name"});
  }catch(e){ ST.bancos=[]; ST.bancosError=true; }
  const dl=document.getElementById("listaBancos");
  dl.innerHTML = ST.bancos.map(b=>'<option value="'+esc(nombreBanco(b.name))+'">').join("");
  render();
}
/* Los nombres vienen como "Banco Macro S.A. - MACRO": se corta el código de after. */
function nombreBanco(n){ return String(n||"").split(" - ")[0].trim(); }
function bancoIdPorNombre(txt){
  const t=String(txt||"").trim().toLowerCase(); if(!t) return null;
  const b = ST.bancos.find(x=>nombreBanco(x.name).toLowerCase()===t)
         || ST.bancos.find(x=>nombreBanco(x.name).toLowerCase().indexOf(t)===0);
  return b?b.id:null;
}

/* ---------- paso 1: cliente ---------- */
let buscaT=null;
function onBusca(v){
  clearTimeout(buscaT);
  const q=String(v||"").trim();
  const box=document.getElementById("sug");
  if(q.length<3){ if(box) box.innerHTML=""; return; }
  buscaT=setTimeout(async function(){
    let res=[];
    try{
      res = await R("res.partner","search_read",
        [[["customer_rank",">",0],"|",["name","ilike",q],["vat","ilike",q.replace(/\D/g,"")]],["id","name","vat"]],
        {limit:12});
    }catch(e){}
    if(!box) return;
    box.innerHTML = res.length
      ? res.map(p=>'<div onclick="elegir('+p.id+',\''+esc(String(p.name).replace(/'/g,"\\'"))+'\')">'+esc(p.name)+(p.vat?'<div class="cu">'+esc(p.vat)+'</div>':'')+'</div>').join("")
      : '<div class="muted" style="cursor:default">Sin resultados</div>';
  }, 260);
}

async function elegir(id, nombre){
  ST.cliente={id:id,name:nombre}; ST.hecho=null;
  render();
  try{
    ST.deuda = await R("account.move","search_read",
      [[["partner_id","=",id],["move_type","in",["out_invoice","out_refund"]],["state","=","posted"],["payment_state","in",["not_paid","partial"]]],
       ["name","invoice_date","invoice_date_due","amount_total","amount_residual"]],
      {limit:200, order:"invoice_date_due"});
  }catch(e){ ST.deuda=[]; }
  if(!ST.cheques.length) ST.cheques.push(chequeVacio());
  render();
}
function cambiarCliente(){ ST.cliente=null; ST.deuda=[]; ST.cheques=[]; ST.hecho=null; render(); }

/* ---------- paso 2: cheques ---------- */
function chequeVacio(){ return {numero:"",cuit:"",banco:"",importe:"",vence:hoyMas(30)}; }
function addCheque(){ ST.cheques.push(chequeVacio()); render();
  setTimeout(function(){ const f=document.querySelectorAll(".chq input"); if(f.length) f[(ST.cheques.length-1)*5].focus(); },30); }
function delCheque(i){ ST.cheques.splice(i,1); if(!ST.cheques.length) ST.cheques.push(chequeVacio()); render(); }
function setChq(i,campo,v){ ST.cheques[i][campo]=v; repintarPreview(); }

const totalCheques = () => ST.cheques.reduce((a,c)=>a+num(c.importe),0);
const totalDeuda = () => ST.deuda.reduce((a,d)=>a+d.amount_residual,0);
function erroresDe(c){
  const e=[];
  if(!String(c.numero).trim()) e.push("numero");
  if(!cuitOk(c.cuit)) e.push("cuit");
  if(num(c.importe)<=0) e.push("importe");
  if(!c.vence) e.push("vence");
  return e;
}
const todoOk = () => ST.cheques.length>0 && ST.cheques.every(c=>erroresDe(c).length===0);

/* ---------- render ---------- */
function render(){
  const app=document.getElementById("app");
  if(ST.hecho){ app.innerHTML = cardHecho(); return; }
  app.innerHTML = card1() + (ST.cliente ? card2()+card3() : "");
}

function card1(){
  if(!ST.cliente){
    return '<div class="card"><h3><span class="step">1</span>¿De qué cliente son los cheques?</h3>'+
      '<div class="cap">Buscá por nombre o CUIT. Después vas a ver su deuda y podés cargar todos los cheques juntos.</div>'+
      '<div class="busca"><input id="q" placeholder="Nombre del cliente o CUIT…" oninput="onBusca(this.value)" autocomplete="off"><div class="sug" id="sug"></div></div>'+
      '</div>';
  }
  return '<div class="card"><h3><span class="step">1</span>Cliente</h3>'+
    '<div class="elegido"><div><div class="nm">'+esc(ST.cliente.name)+'</div>'+
      '<div class="hint" style="margin-top:2px">'+ST.deuda.length+' comprobantes pendientes · debe '+money(totalDeuda())+'</div></div>'+
      '<button class="x" onclick="cambiarCliente()" title="Cambiar de cliente">✕</button></div></div>';
}

function card2(){
  const filas = ST.cheques.map(function(c,i){
    const e=erroresDe(c), cl=k=>e.includes(k)?' class="err"':'';
    return '<tr class="chq">'+
      '<td style="min-width:110px"><input'+cl("numero")+' value="'+esc(c.numero)+'" placeholder="Nº" oninput="setChq('+i+',\'numero\',this.value)"></td>'+
      '<td style="min-width:130px"><input'+cl("cuit")+' value="'+esc(c.cuit)+'" placeholder="CUIT emisor" oninput="setChq('+i+',\'cuit\',this.value)" onblur="this.value=fmtCuit(this.value);setChq('+i+',\'cuit\',this.value)"></td>'+
      '<td style="min-width:170px"><input list="listaBancos" value="'+esc(c.banco)+'" placeholder="Escribí el banco…" oninput="setChq('+i+',\'banco\',this.value)"></td>'+
      '<td style="min-width:120px"><input'+cl("importe")+' value="'+esc(c.importe)+'" placeholder="Importe" inputmode="decimal" oninput="setChq('+i+',\'importe\',this.value)"></td>'+
      '<td style="min-width:135px"><input'+cl("vence")+' type="date" value="'+esc(c.vence)+'" onchange="setChq('+i+',\'vence\',this.value)"></td>'+
      '<td><button class="del" onclick="delCheque('+i+')" title="Quitar">✕</button></td></tr>';
  }).join("");
  return '<div class="card"><h3><span class="step">2</span>Los cheques</h3>'+
    '<div class="cap">Cargá todos los que trajo el cliente. El CUIT se guarda sin guiones y el banco queda registrado — hoy se completa en 7 de cada 100 cheques.</div>'+
    '<div class="tscroll"><table><thead><tr><th>Número</th><th>CUIT emisor</th><th>Banco</th><th>Importe</th><th>Vence</th><th></th></tr></thead>'+
    '<tbody>'+filas+'</tbody></table></div>'+
    (ST.bancosError?'<div class="aviso a-warn">No se pudo cargar la lista de bancos. Podés escribir el nombre igual, pero revisá que esté bien.</div>':'')+
    '<div class="actions"><button class="btn ghost" onclick="addCheque()">+ Agregar otro cheque</button>'+
    '<span class="hint" style="margin:0">'+ST.bancos.length+' bancos disponibles: escribí las primeras letras</span></div>'+
    '</div>';
}

function card3(){
  return '<div class="card" id="cardPv"><h3><span class="step">3</span>Vista previa</h3>'+
    '<div class="cap">Así queda en Odoo. Revisá antes de generar.</div>'+
    '<div id="pv">'+previewHtml()+'</div></div>';
}
function repintarPreview(){ const p=document.getElementById("pv"); if(p) p.innerHTML=previewHtml(); }

function previewHtml(){
  const tc=totalCheques(), td=totalDeuda(), dif=tc-td;
  const errs = ST.cheques.filter(c=>erroresDe(c).length).length;
  let aviso="";
  if(errs) aviso='<div class="aviso a-bad">Faltan datos en '+errs+' cheque'+(errs>1?"s":"")+'. Los campos incompletos están marcados en rojo.</div>';
  else if(tc>0 && Math.abs(dif)<1) aviso='<div class="aviso a-ok">Los cheques cubren exactamente la deuda.</div>';
  else if(tc>td && td>0) aviso='<div class="aviso a-warn">Los cheques superan la deuda en <b>'+money(dif)+'</b>. Se imputan a las facturas más viejas y el resto queda como saldo a favor.</div>';
  else if(tc>0 && td>0) aviso='<div class="aviso a-warn">Alcanza para <b>'+money(tc)+'</b> de los <b>'+money(td)+'</b> que debe. Se imputa a las más viejas primero.</div>';
  else if(tc>0) aviso='<div class="aviso a-warn">Este cliente no tiene deuda registrada: los cheques quedan como saldo a favor.</div>';

  const tiles='<div class="pv-tiles">'+
    '<div class="pv-tile"><div class="l">Cheques</div><div class="v">'+ST.cheques.length+'</div></div>'+
    '<div class="pv-tile"><div class="l">Deuda del cliente</div><div class="v">'+money(td)+'</div></div>'+
    '<div class="pv-tile'+(errs?' bad':'')+'"><div class="l">Diferencia</div><div class="v">'+money(Math.abs(dif))+'</div></div>'+
    '<div class="pv-tile tot"><div class="l">Total a cargar</div><div class="v">'+money(tc)+'</div></div>'+
    '</div>';

  const detalle = ST.cheques.some(c=>erroresDe(c).length===0)
    ? '<div class="tscroll"><table><thead><tr><th>Nº</th><th>Emisor</th><th>Banco</th><th class="r">Importe</th><th>Vence</th></tr></thead><tbody>'+
      ST.cheques.filter(c=>erroresDe(c).length===0).map(c=>'<tr><td>'+esc(c.numero)+'</td><td class="muted">'+esc(fmtCuit(c.cuit))+'</td><td class="muted">'+esc(c.banco||"—")+'</td><td class="r">'+money2(num(c.importe))+'</td><td>'+fechaCorta(c.vence)+'</td></tr>').join("")+
      '</tbody></table></div>' : '<div class="vacio">Cargá al menos un cheque completo.</div>';

  const facturas = ST.deuda.length
    ? '<div class="hint" style="margin-top:14px"><b>Se imputa a:</b> '+ST.deuda.slice(0,4).map(d=>esc(d.name)).join(" · ")+(ST.deuda.length>4?' y '+(ST.deuda.length-4)+' más':'')+'</div>'
    : "";

  return tiles+aviso+detalle+facturas+
    '<div class="actions"><button class="btn big" id="btnGo" onclick="generar()"'+(todoOk()&&!ST.guardando?"":" disabled")+'>'+
    (ST.guardando?'<span class="spinner"></span>Generando…':'Generar '+ST.cheques.length+' recibo'+(ST.cheques.length>1?"s":"")+' en Odoo')+'</button>'+
    '<button class="btn ghost" onclick="cambiarCliente()">Cancelar</button></div>';
}

function cardHecho(){
  const h=ST.hecho;
  return '<div class="card"><h3>✅ Listo</h3>'+
    '<div class="cap">Los recibos quedaron cargados en Odoo.</div>'+
    '<div class="pv-tiles">'+
      '<div class="pv-tile"><div class="l">Recibos creados</div><div class="v">'+h.creados+'</div></div>'+
      '<div class="pv-tile tot"><div class="l">Total</div><div class="v">'+money(h.total)+'</div></div>'+
    '</div>'+
    (h.imputados?'<div class="aviso a-ok">Imputados a las facturas de '+esc(h.cliente)+'.</div>':'<div class="aviso a-warn">Los recibos se crearon, pero la imputación a las facturas no se completó. Revisalos en Odoo y aplicalos a mano.</div>')+
    (h.fallos.length?'<div class="aviso a-bad">No se pudieron cargar '+h.fallos.length+': '+h.fallos.map(f=>esc(f.n)).join(", ")+'<br><span class="muted">'+esc(h.fallos[0].e)+'</span></div>':"")+
    '<div class="actions"><button class="btn" onclick="cambiarCliente()">Cargar más cheques</button>'+
    '<button class="btn ghost" onclick="window.open(\'https://drogueriaeyg.odoo.com/odoo/action-account.action_account_payments\',\'_blank\')">Ver en Odoo</button></div></div>';
}

/* ---------- generar ---------- */
async function generar(){
  if(!todoOk()||ST.guardando) return;
  ST.guardando=true; repintarPreview();
  const creados=[], fallos=[];
  let prox = await proximoRecibo();
  for(let i=0;i<ST.cheques.length;i++){
    const c=ST.cheques[i];
    const vals={
      journal_id:J_CHEQUES, payment_type:"inbound", partner_type:"customer",
      partner_id:ST.cliente.id, amount:num(c.importe), date:HOY,
      payment_method_line_id:PML_NUEVO,
      l10n_latam_document_type_id:DOCTYPE,
      l10n_latam_document_number:POS+"-"+String(prox).padStart(8,"0"),
      l10n_latam_check_number:String(c.numero).trim(),
      l10n_latam_check_issuer_vat:cuitLimpio(c.cuit),
      l10n_latam_check_payment_date:c.vence
    };
    const bid = bancoIdPorNombre(c.banco);
    if(bid) vals.l10n_latam_check_bank_id = bid;
    try{
      const id = await R("account.payment","create",[vals]);
      await R("account.payment","action_post",[[id]]);
      creados.push(id); prox++;
    }catch(e){ fallos.push({n:c.numero, e:String(e.message||e).slice(0,140)}); }
  }
  let imputados=false;
  if(creados.length && ST.deuda.length){
    try{ await imputar(creados); imputados=true; }catch(e){ imputados=false; }
  }
  ST.guardando=false;
  ST.hecho={creados:creados.length, total:totalCheques(), fallos:fallos, imputados:imputados, cliente:ST.cliente.name};
  render();
}

async function proximoRecibo(){
  try{
    const ult = await R("account.payment","search_read",
      [[["l10n_latam_document_type_id","=",DOCTYPE]],["l10n_latam_document_number"]],{limit:1, order:"id desc"});
    if(ult.length && ult[0].l10n_latam_document_number){
      const n=parseInt(String(ult[0].l10n_latam_document_number).split("-").pop(),10);
      if(!isNaN(n)) return n+1;
    }
  }catch(e){}
  return 1;
}

/* Imputa los cheques a las facturas pendientes, de la más vieja a la más nueva.
   Se concilian las líneas de la cuenta a cobrar: las del pago contra las de las
   facturas. Odoo resuelve los parciales solo. */
async function imputar(pagoIds){
  const lp = await R("account.move.line","search_read",
    [[["payment_id","in",pagoIds],["account_id.account_type","=","asset_receivable"]],["id"]],{limit:200});
  const lf = await R("account.move.line","search_read",
    [[["move_id","in",ST.deuda.map(d=>d.id)],["account_id.account_type","=","asset_receivable"],["reconciled","=",false]],["id"]],{limit:400});
  const todas = lp.map(x=>x.id).concat(lf.map(x=>x.id));
  if(todas.length>1) await R("account.move.line","reconcile",[todas]);
}
