<script>
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

const R=(m,me,a,k)=>EYG.rpc(m,me,a,k);
const money=EYG.money, esc=EYG.esc;
const HOY=EYG.argToday();

/* Constantes del circuito de cheques (verificadas contra los recibos que carga Federico) */
const J_CHEQUES = 16;      // diario "Cheques de terceros"
const PML_NUEVO = 9;       // método "Nuevo Cheque de Terceros"
const DOCTYPE   = 147;     // tipo de comprobante "RECIBOS X"
const POS       = "0001";  // punto de venta de los recibos

const ST = { cliente:null, deuda:[], cheques:[], bancos:[], bancosError:false,
             fileName:"", extracting:false, error:null, texto:"", leidos:0,
             guardando:false, hecho:null, usados:0 };

/* ---------- utilidades ---------- */
const num = v => Number(String(v==null?"":v).replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",","."))||0;
const cuitLimpio = v => String(v||"").replace(/\D/g,"");
const cuitOk = v => cuitLimpio(v).length===11;
const fmtCuit = v => { const c=cuitLimpio(v); return c.length===11 ? c.slice(0,2)+"-"+c.slice(2,10)+"-"+c.slice(10) : v; };
const money2 = n => "$"+Number(n||0).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const hoyMas = d => { const t=new Date(HOY+"T00:00:00"); t.setDate(t.getDate()+d); return t.toISOString().slice(0,10); };
const fechaCorta = f => { if(!f) return "—"; const p=String(f).slice(0,10).split("-"); return p[2]+"/"+p[1]+"/"+p[0].slice(2); };

/* =========================================================================
   LECTURA DE ARCHIVOS  (mismo motor que "Cargar crédito bancario")
   ========================================================================= */
async function pdfToText(arrayBuffer){
  if(!window.pdfjsLib) throw new Error("El lector de PDF no cargó (revisá la conexión).");
  const pdf = await pdfjsLib.getDocument({data:arrayBuffer}).promise;
  const out=[];
  for(let pg=1; pg<=pdf.numPages; pg++){
    const page = await pdf.getPage(pg);
    const tc = await page.getTextContent();
    const items = tc.items.map(it=>({x:it.transform[4], y:it.transform[5], s:it.str}))
                          .filter(it=>String(it.s).trim()!=="");
    items.sort((a,b)=> (b.y - a.y) || (a.x - b.x));
    let cur=[], cy=null;
    for(const it of items){
      if(cy===null || (cy - it.y) <= 3){ cur.push(it); if(cy===null) cy=it.y; }
      else { out.push(cur.sort((a,b)=>a.x-b.x).map(p=>p.s).join(" ")); cur=[it]; cy=it.y; }
    }
    if(cur.length) out.push(cur.sort((a,b)=>a.x-b.x).map(p=>p.s).join(" "));
  }
  return out.map(l=>l.replace(/\s+/g," ").trim()).join("\n");
}
function sheetFlatten(wb){ const out=[]; wb.SheetNames.forEach(nm=>{ XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:false,defval:""}).forEach(r=>out.push((r||[]).join("  "))); }); return out.join("\n"); }

async function onFile(file){
  if(!file) return;
  ST.fileName=file.name; ST.extracting=true; ST.error=null; render();
  try{
    const buf = await file.arrayBuffer();
    let text="";
    if(/\.pdf$/i.test(file.name) || file.type==="application/pdf") text = await pdfToText(buf);
    else if(/\.(xlsx|xls|csv)$/i.test(file.name)){ if(!window.XLSX) throw new Error("El lector de Excel no cargó."); text = sheetFlatten(XLSX.read(buf,{type:"array"})); }
    else if(/\.(txt|text)$/i.test(file.name) || /^text\//.test(file.type||"")) text = new TextDecoder().decode(buf);
    else throw new Error("Formato no reconocido. Subí PDF, Excel o texto — o pegá el contenido abajo.");
    aplicarTexto(text);
  }catch(e){
    ST.extracting=false; ST.error="No pude leer el archivo: "+(e.message||e); render();
  }
}
function onDrop(e){ e.preventDefault(); const el=document.getElementById("drop"); if(el)el.classList.remove("over"); const fl=e.dataTransfer&&e.dataTransfer.files; if(fl&&fl[0]) onFile(fl[0]); }
function onOver(e){ e.preventDefault(); const el=document.getElementById("drop"); if(el)el.classList.add("over"); }
function onLeave(e){ const el=document.getElementById("drop"); if(el)el.classList.remove("over"); }
function pegar(){ const t=document.getElementById("pegado"); if(t && t.value.trim()) aplicarTexto(t.value); }

function aplicarTexto(text){
  ST.texto = text;
  const hallados = parseCheques(text);
  ST.extracting=false;
  ST.leidos = hallados.length;
  if(hallados.length){
    /* Los leídos se marcan con `auto` para que se vean en celeste, igual que en
       préstamos: lo que salió del archivo vs lo que se completa a mano. */
    ST.cheques = hallados.map(c=>Object.assign(chequeVacio(), c, {auto:true}));
  }else{
    ST.error = "Leí el archivo pero no reconocí ningún cheque. Revisá el texto de abajo y cargalos a mano.";
    if(!ST.cheques.length) ST.cheques=[chequeVacio()];
  }
  render();
}

/* Detecta cheques línea por línea. Una línea cuenta como cheque si tiene, en
   cualquier orden: un importe y (un CUIT de 11 dígitos o un número de cheque).
   Cada dato se busca con su propio patrón, así sirve para planillas de distintos
   formatos sin depender del orden de las columnas. */
function parseCheques(texto){
  const out=[];
  const lineas = String(texto||"").split(/\r?\n/);
  for(const L of lineas){
    const linea = L.replace(/\s+/g," ").trim();
    if(linea.length<8) continue;
    if(/^(n|nro|numero|número|cheque|banco|cuit|importe|total|fecha)\b/i.test(linea) && !/\d{4}/.test(linea)) continue;

    // CUIT: 11 dígitos, con o sin guiones
    const mCuit = linea.match(/\b(\d{2}[-\s]?\d{8}[-\s]?\d)\b/);
    // fecha dd/mm/aaaa, dd-mm-aa, aaaa-mm-dd
    const mFecha = linea.match(/\b(\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}|\d{4}-\d{2}-\d{2})\b/);
    // importe: con separador de miles y/o decimales, o precedido de $
    const importes = (linea.match(/\$?\s?\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\$\s?\d+(?:,\d{1,2})?|\b\d+,\d{2}\b/g)||[]);
    // número de cheque: 6 a 12 dígitos que no sean el CUIT ni parte de la fecha
    let resto = linea;
    if(mCuit) resto = resto.replace(mCuit[0],"");
    if(mFecha) resto = resto.replace(mFecha[0],"");
    importes.forEach(i=>{ resto = resto.replace(i,""); });
    const mNum = resto.match(/\b(\d{6,12})\b/);

    if(!importes.length) continue;
    if(!mCuit && !mNum) continue;

    const monto = Math.max.apply(null, importes.map(num));
    if(monto<=0) continue;

    out.push({
      numero: mNum ? mNum[1] : "",
      cuit:   mCuit ? fmtCuit(mCuit[1]) : "",
      banco:  detectarBanco(linea),
      importe: String(monto),
      vence:  mFecha ? normFecha(mFecha[1]) : hoyMas(30)
    });
  }
  return out;
}
function normFecha(f){
  const s=String(f).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const p=s.split(/[\/-]/);
  if(p.length!==3) return hoyMas(30);
  let [d,m,a]=p;
  if(a.length===2) a="20"+a;
  d=d.padStart(2,"0"); m=m.padStart(2,"0");
  return a+"-"+m+"-"+d;
}
function detectarBanco(linea){
  const t=String(linea).toLowerCase();
  for(const b of ST.bancos){
    const nom=nombreBanco(b.name).toLowerCase().replace(/^banco\s+(de\s+)?/,"").split(/[\s.]/)[0];
    if(nom.length>=4 && t.indexOf(nom)>=0) return nombreBanco(b.name);
  }
  return "";
}

/* ---------- bancos ---------- */
function nombreBanco(n){ return String(n||"").split(" - ")[0].trim(); }
function bancoIdPorNombre(txt){
  const t=String(txt||"").trim().toLowerCase(); if(!t) return null;
  const b = ST.bancos.find(x=>nombreBanco(x.name).toLowerCase()===t)
         || ST.bancos.find(x=>nombreBanco(x.name).toLowerCase().indexOf(t)===0);
  return b?b.id:null;
}

/* ---------- arranque ---------- */
async function init(){
  try{ ST.bancos = await R("res.bank","search_read",[[],["id","name"]],{limit:500,order:"name"}); }
  catch(e){ ST.bancos=[]; ST.bancosError=true; }
  /* La lista se ordena por USO REAL: los bancos que aparecen en los cheques que
     EyG ya recibió van primero, del más frecuente al menos. Los 6 bancos de EyG
     explican el 76% pero 1 de cada 4 cheques viene de otro banco (Galicia,
     Santander, BICA…), porque el banco de un cheque de tercero es el del CLIENTE
     que lo firma, no el nuestro. Por eso quedan todos disponibles. */
  try{
    const uso = await R("account.payment","read_group",
      [[["l10n_latam_check_bank_id","!=",false]],["id"],["l10n_latam_check_bank_id"]],{lazy:false,limit:60});
    const veces={}; uso.forEach(u=>{ if(u.l10n_latam_check_bank_id) veces[u.l10n_latam_check_bank_id[0]]=u.__count; });
    ST.usados = uso.length;
    ST.bancos.sort(function(a,b){
      const ua=veces[a.id]||0, ub=veces[b.id]||0;
      if(ua!==ub) return ub-ua;                                  // más usados primero
      return nombreBanco(a.name).localeCompare(nombreBanco(b.name));
    });
  }catch(e){ ST.usados=0; }
  document.getElementById("listaBancos").innerHTML = ST.bancos.map(b=>'<option value="'+esc(nombreBanco(b.name))+'">').join("");
  ST.cheques=[chequeVacio()];
  render();
}

/* ---------- cliente ---------- */
let buscaT=null;
function onBusca(v){
  clearTimeout(buscaT);
  const q=String(v||"").trim();
  const box=document.getElementById("sug");
  if(q.length<3){ if(box) box.innerHTML=""; return; }
  buscaT=setTimeout(async function(){
    let res=[];
    try{ res = await R("res.partner","search_read",
      [[["customer_rank",">",0],"|",["name","ilike",q],["vat","ilike",q.replace(/\D/g,"")]],["id","name","vat"]],{limit:12}); }catch(e){}
    if(!box) return;
    box.innerHTML = res.length
      ? res.map(p=>'<div onclick="elegir('+p.id+',\''+esc(String(p.name).replace(/'/g,"\\'"))+'\')">'+esc(p.name)+(p.vat?'<div class="cu">'+esc(p.vat)+'</div>':'')+'</div>').join("")
      : '<div class="muted" style="cursor:default">Sin resultados</div>';
  }, 260);
}
async function elegir(id, nombre){
  ST.cliente={id:id,name:nombre}; ST.hecho=null; render();
  try{
    ST.deuda = await R("account.move","search_read",
      [[["partner_id","=",id],["move_type","in",["out_invoice","out_refund"]],["state","=","posted"],["payment_state","in",["not_paid","partial"]]],
       ["name","invoice_date","invoice_date_due","amount_total","amount_residual"]],{limit:200, order:"invoice_date_due"});
  }catch(e){ ST.deuda=[]; }
  render();
}
function cambiarCliente(){ ST.cliente=null; ST.deuda=[]; render(); }
function empezarDeNuevo(){ ST.cliente=null; ST.deuda=[]; ST.cheques=[chequeVacio()]; ST.hecho=null; ST.texto=""; ST.fileName=""; ST.leidos=0; ST.error=null; render(); }

/* ---------- cheques ---------- */
function chequeVacio(){ return {numero:"",cuit:"",banco:"",importe:"",vence:hoyMas(30),auto:false}; }
function addCheque(){ ST.cheques.push(chequeVacio()); render();
  setTimeout(function(){ const f=document.querySelectorAll(".chq input"); if(f.length) f[(ST.cheques.length-1)*5].focus(); },30); }
function delCheque(i){ ST.cheques.splice(i,1); if(!ST.cheques.length) ST.cheques.push(chequeVacio()); render(); }
function setChq(i,campo,v){ ST.cheques[i][campo]=v; ST.cheques[i].auto=false; repintarPreview(); }

const totalCheques = () => ST.cheques.reduce((a,c)=>a+num(c.importe),0);
const totalDeuda = () => ST.deuda.reduce((a,d)=>a+d.amount_residual,0);
function erroresDe(c){
  const e=[];
  if(!String(c.numero).trim()) e.push("numero");
  if(!cuitOk(c.cuit)) e.push("cuit");
  if(num(c.importe)<=0) e.push("importe");
  if(!c.vence) e.push("vence");
  return e;
}
const todoOk = () => !!ST.cliente && ST.cheques.length>0 && ST.cheques.every(c=>erroresDe(c).length===0);

/* ---------- render ---------- */
function render(){
  const app=document.getElementById("app");
  if(ST.hecho){ app.innerHTML = cardHecho(); return; }
  app.innerHTML = card1() + card2() + card3();

function repintarPreview(){ const p=document.getElementById("pv"); if(p) p.innerHTML=previewHtml(); }

function previewHtml(){
  const tc=totalCheques(), td=totalDeuda(), dif=tc-td;
  const errs = ST.cheques.filter(c=>erroresDe(c).length).length;
  let aviso="";
  if(!ST.cliente) aviso='<div class="aviso a-warn">Elegí el cliente arriba para poder generar.</div>';
  else if(errs) aviso='<div class="aviso a-bad">Faltan datos en '+errs+' cheque'+(errs>1?"s":"")+'. Los campos incompletos están en rojo.</div>';
  else if(tc>0 && Math.abs(dif)<1) aviso='<div class="aviso a-ok">Los cheques cubren exactamente la deuda.</div>';
  else if(tc>td && td>0) aviso='<div class="aviso a-warn">Superan la deuda en <b>'+money(dif)+'</b>. Se imputan a las facturas más viejas y el resto queda a favor.</div>';
  else if(tc>0 && td>0) aviso='<div class="aviso a-warn">Alcanza para <b>'+money(tc)+'</b> de los <b>'+money(td)+'</b> que debe. Se imputa a las más viejas primero.</div>';
  else if(tc>0) aviso='<div class="aviso a-warn">Este cliente no tiene deuda registrada: quedan como saldo a favor.</div>';

  const tiles='<div class="pv-tiles">'+
    '<div class="pv-tile"><div class="l">Cheques</div><div class="v">'+ST.cheques.length+'</div></div>'+
    '<div class="pv-tile"><div class="l">Deuda del cliente</div><div class="v">'+money(td)+'</div></div>'+
    '<div class="pv-tile'+(errs?' bad':'')+'"><div class="l">Diferencia</div><div class="v">'+money(Math.abs(dif))+'</div></div>'+
    '<div class="pv-tile tot"><div class="l">Total a cargar</div><div class="v">'+money(tc)+'</div></div></div>';

  const listos = ST.cheques.filter(c=>erroresDe(c).length===0);
  const detalle = listos.length
    ? '<div class="tscroll"><table><thead><tr><th>Nº</th><th>Emisor</th><th>Banco</th><th class="r">Importe</th><th>Vence</th></tr></thead><tbody>'+
      listos.map(c=>'<tr><td>'+esc(c.numero)+'</td><td class="muted">'+esc(fmtCuit(c.cuit))+'</td><td class="muted">'+esc(c.banco||"—")+'</td><td class="r">'+money2(num(c.importe))+'</td><td>'+fechaCorta(c.vence)+'</td></tr>').join("")+
      '</tbody></table></div>' : '<div class="vacio">Cargá al menos un cheque completo.</div>';

  const facturas = ST.deuda.length
    ? '<div class="hint" style="margin-top:14px"><b>Se imputa a:</b> '+ST.deuda.slice(0,4).map(d=>esc(d.name)).join(" · ")+(ST.deuda.length>4?' y '+(ST.deuda.length-4)+' más':'')+'</div>' : "";

  return tiles+aviso+detalle+facturas+
    '<div class="actions"><button class="btn big" onclick="generar()"'+(todoOk()&&!ST.guardando?"":" disabled")+'>'+
    (ST.guardando?'<span class="spinner"></span>Generando…':'Generar '+listos.length+' recibo'+(listos.length!==1?"s":"")+' en Odoo')+'</button>'+
    '<button class="btn ghost" onclick="empezarDeNuevo()">Empezar de nuevo</button></div>';
}

/* ---------- generar ---------- */
async function generar(){
  if(!todoOk()||ST.guardando) return;
  ST.guardando=true; repintarPreview();
  const creados=[], fallos=[];
  let prox = await proximoRecibo();
  for(const c of ST.cheques){
    const vals={
      journal_id:J_CHEQUES, payment_type:"inbound", partner_type:"customer",
      partner_id:ST.cliente.id, amount:num(c.importe), date:HOY,
      payment_method_line_id:PML_NUEVO,
      l10n_latam_document_type_id:DOCTYPE,
      l10n_latam_document_number:POS+"-"+String(prox).padStart(8,"0"),
      l10n_latam_check_number:String(c.numero).trim(),
      l10n_latam_check_issuer_vat:cuitLimpio(c.cuit),
      l10n_latam_check_payment_date:c.vence
    };
    const bid = bancoIdPorNombre(c.banco);
    if(bid) vals.l10n_latam_check_bank_id = bid;
    try{
      const id = await R("account.payment","create",[vals]);
      await R("account.payment","action_post",[[id]]);
      creados.push(id); prox++;
    }catch(e){ fallos.push({n:c.numero, e:String(e.message||e).slice(0,140)}); }
  }
  let imputados=false;
  if(creados.length && ST.deuda.length){ try{ await imputar(creados); imputados=true; }catch(e){} }
  ST.guardando=false;
  ST.hecho={creados:creados.length, total:totalCheques(), fallos:fallos, imputados:imputados, cliente:ST.cliente.name};
  render();
}

async function proximoRecibo(){
  try{
    const ult = await R("account.payment","search_read",
      [[["l10n_latam_document_type_id","=",DOCTYPE]],["l10n_latam_document_number"]],{limit:1, order:"id desc"});
    if(ult.length && ult[0].l10n_latam_document_number){
      const n=parseInt(String(ult[0].l10n_latam_document_number).split("-").pop(),10);
      if(!isNaN(n)) return n+1;
    }
  }catch(e){}
  return 1;
}

/* Imputa los cheques a las facturas pendientes, de la más vieja a la más nueva. */
async function imputar(pagoIds){
  const lp = await R("account.move.line","search_read",
    [[["payment_id","in",pagoIds],["account_id.account_type","=","asset_receivable"]],["id"]],{limit:200});
  const lf = await R("account.move.line","search_read",
    [[["move_id","in",ST.deuda.map(d=>d.id)],["account_id.account_type","=","asset_receivable"],["reconciled","=",false]],["id"]],{limit:400});
  const todas = lp.map(x=>x.id).concat(lf.map(x=>x.id));
  if(todas.length>1) await R("account.move.line","reconcile",[todas]);
}
