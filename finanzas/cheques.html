<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargar cheques · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=57"></script>
<style>
  :root{
    --teal:#048782; --teal-deep:#04635F; --teal-med:#0AA89F; --aqua:#5FC8BF;
    --agua:#E2F1EF; --coral:#EC8B5E; --ink:#0E1F1D; --gris:#5F716E; --gris2:#8A9A97;
    --surface:#fff; --bg:#F4F8F7; --line:#DCE8E6; --radius:12px;
    --shadow:0 1px 2px rgba(6,65,62,.05), 0 6px 24px rgba(6,65,62,.06);
    --ok:#1F8A5F; --warn:#B7791F; --bad:#C0392B; --info:#5B8DEF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .topbar{background:var(--teal-deep);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:13px;position:sticky;top:0;z-index:40}
  .mono{font-family:Georgia,serif;font-weight:700;font-size:23px;letter-spacing:.5px;line-height:1}
  .mono .y{color:var(--aqua)}
  .topbar .tag{font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:20px}
  .topbar .title{font-weight:700;font-size:15px;margin-left:4px}
  .topbar .back{margin-left:auto;color:#fff;text-decoration:none;font-size:13px;font-weight:600;opacity:.85}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 22px 120px}

  .wip{background:#FBF3D9;border:1px solid #EAD9A0;color:#8A6D1A;border-radius:10px;padding:10px 14px;font-size:12.5px;line-height:1.5;margin-bottom:16px;display:flex;gap:9px;align-items:flex-start}
  .wip b{color:#6B5410}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px}
  .panel h3{font-size:14.5px;font-weight:800;color:var(--teal-deep);margin-bottom:3px;display:flex;align-items:center;gap:7px}
  .panel .sub{font-size:12px;color:var(--gris);margin-bottom:14px;line-height:1.5}

  /* buscador de cliente */
  .busca{position:relative}
  .busca input{width:100%;font-family:inherit;font-size:15px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;outline:none}
  .busca input:focus{border-color:var(--teal)}
  .sug{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(6,65,62,.14);margin-top:4px;max-height:300px;overflow-y:auto;z-index:30}
  .sug div{padding:10px 14px;font-size:13.5px;cursor:pointer;border-bottom:1px solid #F2F7F6}
  .sug div:last-child{border-bottom:0}
  .sug div:hover,.sug div.sel{background:var(--agua)}
  .sug .cu{font-size:11.5px;color:var(--gris2);font-weight:600}

  .cliente{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--agua);border-radius:10px;padding:12px 15px}
  .cliente .nm{font-size:15.5px;font-weight:800;color:var(--teal-deep)}
  .cliente .deuda{margin-left:auto;text-align:right}
  .cliente .deuda .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:700}
  .cliente .deuda .n{font-size:19px;font-weight:800}
  .btn-x{background:none;border:0;font-size:18px;color:var(--gris);cursor:pointer;font-family:inherit;padding:0 4px}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:800;padding:8px 9px;border-bottom:1.5px solid var(--line);white-space:nowrap}
  td{padding:7px 9px;border-bottom:1px solid #EEF4F3;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tscroll{overflow-x:auto}
  .muted{color:var(--gris2)}

  /* filas de cheque */
  .chq td{padding:5px 6px}
  .chq input,.chq select{font-family:inherit;font-size:13px;padding:8px 9px;border:1.5px solid var(--line);border-radius:8px;outline:none;width:100%;background:#fff}
  .chq input:focus,.chq select:focus{border-color:var(--teal)}
  .chq input.err{border-color:var(--bad);background:#FDF3F1}
  .chq .del{background:none;border:0;color:var(--gris2);font-size:17px;cursor:pointer;font-family:inherit;padding:4px 6px}
  .chq .del:hover{color:var(--bad)}
  .addrow{font-family:inherit;font-size:13px;font-weight:700;color:var(--teal-deep);background:var(--agua);border:0;border-radius:8px;padding:9px 15px;cursor:pointer;margin-top:10px}
  .addrow:hover{background:#D3E9E6}

  .totales{display:flex;gap:22px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin-top:12px}
  .totales .it .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:700}
  .totales .it .n{font-size:19px;font-weight:800}
  .totales .dif{margin-left:auto;text-align:right}

  .aviso{font-size:12.5px;border-radius:9px;padding:10px 13px;margin-top:10px;line-height:1.55}
  .a-ok{background:#E4F4EC;color:#146848} .a-warn{background:#FBF1DC;color:#7A5A12} .a-bad{background:#FBE6E3;color:#8A2A1E}

  .barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(6,65,62,.09);padding:12px 22px;display:flex;align-items:center;gap:14px;z-index:35}
  .barra .info{font-size:13px;color:var(--gris);font-weight:600}
  .btn{font-family:inherit;font-size:14px;font-weight:800;border:0;border-radius:10px;padding:12px 22px;cursor:pointer;margin-left:auto}
  .btn-go{background:var(--teal-deep);color:#fff}
  .btn-go:disabled{background:#C6D8D5;color:#8A9A97;cursor:not-allowed}

  .load{text-align:center;padding:50px 20px;color:var(--gris)}
  .load .sp{width:26px;height:26px;border:3px solid var(--agua);border-top-color:var(--teal);border-radius:50%;margin:0 auto 12px;animation:gir .8s linear infinite}
  @keyframes gir{to{transform:rotate(360deg)}}
  .vacio{text-align:center;padding:26px;color:var(--gris2);font-size:12.5px}

  .ovl{position:fixed;inset:0;background:rgba(10,30,28,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:86vh;overflow-y:auto}
  .modal h4{font-size:17px;font-weight:800;color:var(--teal-deep);margin-bottom:8px}
  .modal .btns{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
  .modal .btn2{font-family:inherit;font-size:13.5px;font-weight:700;border-radius:9px;padding:10px 18px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--gris)}
  .modal .btn2.go{background:var(--teal-deep);color:#fff;border-color:var(--teal-deep)}
  @media(max-width:760px){ .wrap{padding:16px 13px 130px} }
</style>
</head>
<body>
<div class="topbar">
  <div class="mono">E<span class="y">y</span>G</div>
  <span class="tag">Cheques</span>
  <span class="title">Cargar cheques de terceros</span>
  <a class="back" href="../index.html">← Inicio</a>
</div>

<div class="wrap">
  <div class="wip">⚠️ <div><b>Módulo nuevo.</b> Carga los cheques igual que Odoo (recibo RE-X en el diario "Cheques de terceros") y los imputa a las facturas del cliente. Revisá el resumen antes de confirmar.</div></div>
  <div id="app"><div class="load"><div class="sp"></div>Cargando…</div></div>
</div>

<div class="barra" id="barra" style="display:none">
  <div class="info" id="barraInfo"></div>
  <button class="btn btn-go" id="btnGo" onclick="revisar()">Revisar y confirmar</button>
</div>

<script>
const R=(m,me,a,k)=>EYG.rpc(m,me,a,k);
const money=EYG.money, esc=EYG.esc;
const HOY=EYG.argToday();

/* Constantes del circuito de cheques (verificadas contra los recibos que carga Federico) */
const J_CHEQUES = 16;      // diario "Cheques de terceros"
const PML_NUEVO = 9;       // método de pago "Nuevo Cheque de Terceros"
const DOCTYPE   = 147;     // tipo de comprobante "RECIBOS X"
const POS       = "0001";  // punto de venta de los recibos

const S = { cliente:null, deuda:[], cheques:[], bancos:[], guardando:false };

/* ---------- utilidades ---------- */
const num = v => Number(String(v==null?"":v).replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",","."))||0;
/* El CUIT se guarda SIEMPRE sin guiones: hoy conviven los dos formatos y eso rompe
   cualquier búsqueda por emisor. */
const cuitLimpio = v => String(v||"").replace(/\D/g,"");
const cuitOk = v => cuitLimpio(v).length===11;
const fmtCuit = v => { const c=cuitLimpio(v); return c.length===11 ? c.slice(0,2)+"-"+c.slice(2,10)+"-"+c.slice(10) : v; };
const hoyMas = d => { const t=new Date(HOY+"T00:00:00"); t.setDate(t.getDate()+d); return t.toISOString().slice(0,10); };
const fechaCorta = f => { if(!f) return "—"; const p=String(f).slice(0,10).split("-"); return p[2]+"/"+p[1]+"/"+p[0].slice(2); };

/* ---------- arranque ---------- */
async function init(){
  try{
    S.bancos = await R("res.bank","search_read",[[],["id","name"]],{limit:200,order:"name"});
  }catch(e){ S.bancos=[]; }
  render();
}

/* ---------- buscador de cliente ---------- */
let buscaT=null;
function onBusca(v){
  clearTimeout(buscaT);
  const q=String(v||"").trim();
  if(q.length<3){ document.getElementById("sug").innerHTML=""; return; }
  buscaT=setTimeout(async function(){
    const dom=[["customer_rank",">",0],"|",["name","ilike",q],["vat","ilike",q.replace(/\D/g,"")]];
    let res=[];
    try{ res = await R("res.partner","search_read",[dom,["id","name","vat"]],{limit:12}); }catch(e){}
    document.getElementById("sug").innerHTML = res.length
      ? res.map(function(p){ return '<div onclick="elegir('+p.id+',\''+esc(String(p.name).replace(/'/g,"\\'"))+'\')">'+esc(p.name)+(p.vat?'<div class="cu">'+esc(p.vat)+'</div>':'')+'</div>'; }).join("")
      : '<div class="muted" style="cursor:default">Sin resultados</div>';
  }, 260);
}

async function elegir(id, nombre){
  S.cliente = {id:id, name:nombre};
  document.getElementById("sug").innerHTML="";
  render();
  try{
    S.deuda = await R("account.move","search_read",
      [[["partner_id","=",id],["move_type","in",["out_invoice","out_refund"]],["state","=","posted"],["payment_state","in",["not_paid","partial"]]],
       ["name","invoice_date","invoice_date_due","amount_total","amount_residual","move_type"]],
      {limit:200, order:"invoice_date_due"});
  }catch(e){ S.deuda=[]; }
  if(!S.cheques.length) addCheque();
  render();
}
function limpiarCliente(){ S.cliente=null; S.deuda=[]; S.cheques=[]; render(); }

/* ---------- cheques ---------- */
function addCheque(){
  S.cheques.push({numero:"",cuit:"",banco:"",importe:"",vence:hoyMas(30)});
  render();
  setTimeout(function(){ const f=document.querySelectorAll(".chq input"); if(f.length) f[(S.cheques.length-1)*4].focus(); },30);
}
function delCheque(i){ S.cheques.splice(i,1); if(!S.cheques.length) addCheque(); else render(); }
function setChq(i,campo,v){ S.cheques[i][campo]=v; pintarTotales(); }

const totalCheques = () => S.cheques.reduce((a,c)=>a+num(c.importe),0);
const totalDeuda = () => S.deuda.reduce((a,d)=>a+d.amount_residual,0);

function erroresDe(c){
  const e=[];
  if(!String(c.numero).trim()) e.push("número");
  if(!cuitOk(c.cuit)) e.push("CUIT");
  if(num(c.importe)<=0) e.push("importe");
  if(!c.vence) e.push("vencimiento");
  return e;
}
function todoOk(){ return S.cheques.length>0 && S.cheques.every(c=>erroresDe(c).length===0); }

/* ---------- render ---------- */
function render(){
  const app=document.getElementById("app");
  if(!S.cliente){
    app.innerHTML = '<div class="panel"><h3>👤 ¿De qué cliente son los cheques?</h3>'+
      '<div class="sub">Buscá por nombre o CUIT. Después vas a ver su deuda y podés cargar todos los cheques juntos.</div>'+
      '<div class="busca"><input id="q" placeholder="Nombre del cliente o CUIT…" oninput="onBusca(this.value)" autocomplete="off"><div class="sug" id="sug"></div></div></div>';
    document.getElementById("barra").style.display="none";
    setTimeout(()=>{const q=document.getElementById("q"); if(q)q.focus();},50);
    return;
  }
  app.innerHTML =
    '<div class="panel">'+
      '<div class="cliente"><div><div class="nm">'+esc(S.cliente.name)+'</div>'+
        '<div class="sub" style="margin:2px 0 0">'+S.deuda.length+' comprobantes pendientes</div></div>'+
        '<div class="deuda"><div class="l">Debe</div><div class="n">'+money(totalDeuda())+'</div></div>'+
        '<button class="btn-x" onclick="limpiarCliente()" title="Cambiar de cliente">✕</button></div>'+
    '</div>'+
    panelCheques()+
    panelDeuda();
  document.getElementById("barra").style.display="flex";
  pintarTotales();
}

function panelCheques(){
  const bancos = '<option value="">— banco (opcional) —</option>' +
    S.bancos.map(b=>'<option value="'+b.id+'">'+esc(String(b.name).slice(0,44))+'</option>').join("");
  const filas = S.cheques.map(function(c,i){
    const e=erroresDe(c);
    const cl=k=>e.includes(k)?' class="err"':'';
    return '<tr class="chq">'+
      '<td style="width:15%"><input'+cl("número")+' value="'+esc(c.numero)+'" placeholder="Nº cheque" oninput="setChq('+i+',\'numero\',this.value)"></td>'+
      '<td style="width:17%"><input'+cl("CUIT")+' value="'+esc(c.cuit)+'" placeholder="CUIT emisor" oninput="setChq('+i+',\'cuit\',this.value)" onblur="this.value=fmtCuit(this.value);setChq('+i+',\'cuit\',this.value)"></td>'+
      '<td style="width:26%"><select onchange="setChq('+i+',\'banco\',this.value)">'+bancos.replace('value="'+c.banco+'"','value="'+c.banco+'" selected')+'</select></td>'+
      '<td style="width:17%"><input'+cl("importe")+' value="'+esc(c.importe)+'" placeholder="Importe" inputmode="decimal" oninput="setChq('+i+',\'importe\',this.value)"></td>'+
      '<td style="width:17%"><input'+cl("vencimiento")+' type="date" value="'+esc(c.vence)+'" onchange="setChq('+i+',\'vence\',this.value)"></td>'+
      '<td style="width:5%"><button class="del" onclick="delCheque('+i+')" title="Quitar">✕</button></td></tr>';
  }).join("");
  return '<div class="panel"><h3>🧾 Cheques recibidos</h3>'+
    '<div class="sub">Cargá todos los del cliente. El CUIT se guarda sin guiones y el banco queda registrado — hoy se completa solo en 7 de cada 100 cheques.</div>'+
    '<div class="tscroll"><table><thead><tr><th>Número</th><th>CUIT emisor</th><th>Banco</th><th>Importe</th><th>Vence</th><th></th></tr></thead>'+
    '<tbody>'+filas+'</tbody></table></div>'+
    '<button class="addrow" onclick="addCheque()">+ Agregar otro cheque</button>'+
    '<div id="totales"></div></div>';
}

function pintarTotales(){
  const box=document.getElementById("totales"); if(!box) return;
  const tc=totalCheques(), td=totalDeuda(), dif=tc-td;
  let aviso="";
  if(tc>0 && Math.abs(dif)<1) aviso='<div class="aviso a-ok">✅ Los cheques cubren exactamente la deuda.</div>';
  else if(tc>td && td>0) aviso='<div class="aviso a-warn">Los cheques superan la deuda en <b>'+money(dif)+'</b>. Se van a imputar a las facturas más viejas y el resto queda como saldo a favor del cliente.</div>';
  else if(tc>0 && td>0) aviso='<div class="aviso a-warn">Alcanza para <b>'+money(tc)+'</b> de los <b>'+money(td)+'</b> que debe. Se imputa a las facturas más viejas primero.</div>';
  else if(tc>0 && td===0) aviso='<div class="aviso a-warn">Este cliente no tiene deuda registrada: los cheques van a quedar como saldo a favor.</div>';
  const err = S.cheques.filter(c=>erroresDe(c).length).length;
  box.innerHTML='<div class="totales">'+
    '<div class="it"><div class="l">Cheques</div><div class="n">'+S.cheques.length+'</div></div>'+
    '<div class="it"><div class="l">Suman</div><div class="n">'+money(tc)+'</div></div>'+
    '<div class="it dif"><div class="l">Deuda del cliente</div><div class="n">'+money(td)+'</div></div>'+
    '</div>'+aviso+
    (err?'<div class="aviso a-bad">Faltan datos en '+err+' cheque'+(err>1?"s":"")+'. Los campos incompletos están marcados en rojo.</div>':"");
  const btn=document.getElementById("btnGo");
  if(btn){ btn.disabled=!todoOk()||S.guardando; }
  const inf=document.getElementById("barraInfo");
  if(inf) inf.innerHTML = S.cheques.length+" cheque"+(S.cheques.length>1?"s":"")+" · <b>"+money(tc)+"</b>";
}

function panelDeuda(){
  if(!S.deuda.length) return '<div class="panel"><h3>📄 Deuda del cliente</h3><div class="vacio">No tiene comprobantes pendientes.</div></div>';
  const hoy=HOY;
  return '<div class="panel"><h3>📄 A qué se van a imputar</h3>'+
    '<div class="sub">De la más vieja a la más nueva, que es el orden en que se aplica el cobro.</div>'+
    '<div class="tscroll"><table><thead><tr><th>Comprobante</th><th>Emitida</th><th>Vence</th><th class="r">Total</th><th class="r">Pendiente</th></tr></thead><tbody>'+
    S.deuda.map(function(d){
      const venc = d.invoice_date_due && d.invoice_date_due<hoy;
      return '<tr><td>'+esc(d.name)+'</td><td class="muted">'+fechaCorta(d.invoice_date)+'</td>'+
        '<td'+(venc?' style="color:var(--bad);font-weight:700"':'')+'>'+fechaCorta(d.invoice_date_due)+(venc?' ⚠️':'')+'</td>'+
        '<td class="r muted">'+money(d.amount_total)+'</td><td class="r"><b>'+money(d.amount_residual)+'</b></td></tr>';
    }).join("")+'</tbody></table></div></div>';
}

/* ---------- confirmación ---------- */
function revisar(){
  if(!todoOk()) return;
  const tc=totalCheques();
  const html='<div class="ovl" id="ovl"><div class="modal">'+
    '<h4>Confirmar la carga</h4>'+
    '<div class="sub" style="margin-bottom:12px">Se van a crear <b>'+S.cheques.length+'</b> recibo'+(S.cheques.length>1?"s":"")+' en el diario “Cheques de terceros”, por un total de <b>'+money(tc)+'</b>, a nombre de <b>'+esc(S.cliente.name)+'</b>.</div>'+
    '<div class="tscroll"><table><thead><tr><th>Nº</th><th>Emisor</th><th class="r">Importe</th><th>Vence</th></tr></thead><tbody>'+
    S.cheques.map(c=>'<tr><td>'+esc(c.numero)+'</td><td class="muted">'+esc(fmtCuit(c.cuit))+'</td><td class="r">'+money(num(c.importe))+'</td><td>'+fechaCorta(c.vence)+'</td></tr>').join("")+
    '</tbody></table></div>'+
    '<div class="aviso a-warn" style="margin-top:12px">Después de crearlos se imputan a las facturas pendientes, de la más vieja a la más nueva.</div>'+
    '<div class="btns"><button class="btn2" onclick="cerrarOvl()">Cancelar</button>'+
    '<button class="btn2 go" onclick="guardar()">Sí, cargar los cheques</button></div>'+
    '</div></div>';
  document.body.insertAdjacentHTML("beforeend",html);
}
function cerrarOvl(){ const o=document.getElementById("ovl"); if(o) o.remove(); }

async function guardar(){
  if(S.guardando) return;
  S.guardando=true;
  const modal=document.querySelector("#ovl .modal");
  modal.innerHTML='<h4>Cargando…</h4><div class="load"><div class="sp"></div><span id="paso">Creando los recibos…</span></div>';
  const paso=t=>{ const p=document.getElementById("paso"); if(p) p.textContent=t; };
  const creados=[], fallos=[];
  try{
    /* El número de recibo es correlativo: se toma el último y se sigue desde ahí. */
    let prox = await proximoRecibo();
    for(let i=0;i<S.cheques.length;i++){
      const c=S.cheques[i];
      paso("Creando recibo "+(i+1)+" de "+S.cheques.length+"…");
      const vals={
        journal_id: J_CHEQUES,
        payment_type: "inbound",
        partner_type: "customer",
        partner_id: S.cliente.id,
        amount: num(c.importe),
        date: HOY,
        payment_method_line_id: PML_NUEVO,
        l10n_latam_document_type_id: DOCTYPE,
        l10n_latam_document_number: POS+"-"+String(prox).padStart(8,"0"),
        l10n_latam_check_number: String(c.numero).trim(),
        l10n_latam_check_issuer_vat: cuitLimpio(c.cuit),
        l10n_latam_check_payment_date: c.vence
      };
      if(c.banco) vals.l10n_latam_check_bank_id = Number(c.banco);
      try{
        const id = await R("account.payment","create",[vals]);
        await R("account.payment","action_post",[[id]]);
        creados.push(id); prox++;
      }catch(e){ fallos.push({n:c.numero, e:String(e.message||e).slice(0,120)}); }
    }
    if(creados.length && S.deuda.length){
      paso("Imputando a las facturas…");
      try{ await imputar(creados); }catch(e){ /* se informa abajo */ }
    }
  }catch(e){
    modal.innerHTML='<h4>No se pudo completar</h4><div class="aviso a-bad">'+esc(String(e.message||e))+'</div>'+
      '<div class="btns"><button class="btn2 go" onclick="location.reload()">Recargar</button></div>';
    S.guardando=false; return;
  }
  S.guardando=false;
  modal.innerHTML='<h4>'+(fallos.length?"Cargado con avisos":"Listo")+'</h4>'+
    '<div class="aviso a-ok">Se crearon <b>'+creados.length+'</b> recibo'+(creados.length!==1?"s":"")+' por <b>'+money(totalCheques())+'</b>.</div>'+
    (fallos.length?'<div class="aviso a-bad">No se pudieron cargar '+fallos.length+': '+fallos.map(f=>esc(f.n)).join(", ")+'<br><span class="muted">'+esc(fallos[0].e)+'</span></div>':"")+
    '<div class="btns"><button class="btn2" onclick="location.reload()">Cargar más cheques</button>'+
    '<button class="btn2 go" onclick="verEnOdoo()">Ver en Odoo</button></div>';
}

async function proximoRecibo(){
  try{
    const ult = await R("account.payment","search_read",
      [[["l10n_latam_document_type_id","=",DOCTYPE]],["l10n_latam_document_number"]],
      {limit:1, order:"id desc"});
    if(ult.length && ult[0].l10n_latam_document_number){
      const n=parseInt(String(ult[0].l10n_latam_document_number).split("-").pop(),10);
      if(!isNaN(n)) return n+1;
    }
  }catch(e){}
  return 1;
}

/* Imputa los cheques a las facturas pendientes, de la más vieja a la más nueva.
   Se concilian las líneas de la cuenta a cobrar: las del pago (débito) contra las
   de la factura (crédito). Odoo resuelve los parciales solo. */
async function imputar(pagoIds){
  const lineasPago = await R("account.move.line","search_read",
    [[["payment_id","in",pagoIds],["account_id.account_type","=","asset_receivable"]],["id"]],{limit:200});
  const facturaIds = S.deuda.map(d=>d.id);
  const lineasFact = await R("account.move.line","search_read",
    [[["move_id","in",facturaIds],["account_id.account_type","=","asset_receivable"],["reconciled","=",false]],["id"]],{limit:400});
  const todas = lineasPago.map(x=>x.id).concat(lineasFact.map(x=>x.id));
  if(todas.length>1) await R("account.move.line","reconcile",[todas]);
}
