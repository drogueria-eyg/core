<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legajos de clientes · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/core.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js"></script>
<style>
  :root{
    --teal:#048782; --teal-deep:#04635F; --teal-med:#0AA89F; --aqua:#5FC8BF;
    --agua:#E2F1EF; --coral:#EC8B5E; --ink:#0E1F1D; --gris:#5F716E; --gris2:#8A9A97;
    --surface:#fff; --bg:#F4F8F7; --line:#DCE8E6; --radius:12px;
    --shadow:0 1px 2px rgba(6,65,62,.05), 0 6px 24px rgba(6,65,62,.06);
    --g:#1E7D46; --gbg:#E4F5E9; --y:#9A6B12; --ybg:#FBF0DA; --r:#B0322F; --rbg:#FBE4E3; --n:#8A9A97; --nbg:#EEF1F1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .topbar{background:var(--teal-deep);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:13px;position:sticky;top:0;z-index:30}
  .mono{font-family:Georgia,serif;font-weight:700;font-size:23px;letter-spacing:.5px;line-height:1}
  .mono .y{color:var(--aqua)}
  .topbar .tag{font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:20px}
  .topbar .title{font-weight:700;font-size:15px;margin-left:4px}
  .topbar .back{margin-left:auto;color:#fff;text-decoration:none;font-size:13px;font-weight:600;opacity:.85}
  .topbar .back:hover{opacity:1}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 22px 90px}

  .intro{font-size:13px;color:var(--gris);line-height:1.55;margin-bottom:16px}
  .intro b{color:var(--teal-deep)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
  .kpi:hover{border-color:var(--teal-med)}
  .kpi.on{border-color:var(--teal);box-shadow:0 0 0 2px rgba(4,135,130,.15)}
  .kpi .n{font-size:24px;font-weight:800;line-height:1.1}
  .kpi .l{font-size:11.5px;color:var(--gris);font-weight:600;margin-top:3px}
  .kpi .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .dot.g{background:var(--g)} .dot.y{background:var(--y)} .dot.r{background:var(--r)} .dot.n{background:var(--n)} .dot.all{background:var(--teal)}

  .toolbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
  .search input{border:0;background:none;outline:none;font-family:inherit;font-size:14px;width:100%;color:var(--ink)}
  .search svg{width:17px;height:17px;color:var(--gris2);flex-shrink:0}
  select{font-family:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px;color:var(--ink);cursor:pointer;font-weight:500}
  .count-line{font-size:13px;color:var(--gris);margin-bottom:10px}
  .count-line b{color:var(--ink)}

  .tablecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .thead,.row{display:grid;grid-template-columns:2.3fr 1.2fr 1.1fr 200px;gap:12px;align-items:center;padding:11px 16px}
  .thead{background:#F0F6F5;border-bottom:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--gris)}
  .row{border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s}
  .row:hover{background:#F7FBFA}
  .row:last-child{border-bottom:0}
  .thead>div,.row>div{min-width:0}
  .cname{font-weight:700;font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cmeta{font-size:12px;color:var(--gris2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .com{color:var(--teal-deep);font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cuit{font-variant-numeric:tabular-nums;font-size:13px;color:var(--gris)}
  .est{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
  .estdet{font-size:11px;color:var(--gris);line-height:1.35}
  .estdet .rr{color:var(--r);font-weight:700} .estdet .yy{color:var(--y);font-weight:700}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;white-space:nowrap}
  .badge .pt{width:7px;height:7px;border-radius:50%;background:currentColor}
  .badge.g{background:var(--gbg);color:var(--g)} .badge.y{background:var(--ybg);color:var(--y)} .badge.r{background:var(--rbg);color:var(--r)} .badge.n{background:var(--nbg);color:var(--n)}

  .loading,.empty{text-align:center;padding:70px 20px;color:var(--gris)}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .errbox{background:#FBE4E3;border:1px solid #F3B5B2;color:#8A2E2B;padding:16px;border-radius:12px;font-size:14px}

  /* Drawer */
  .scrim{position:fixed;inset:0;background:rgba(6,65,62,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:520px;max-width:96vw;background:var(--surface);z-index:50;box-shadow:-8px 0 40px rgba(6,65,62,.18);transform:translateX(100%);transition:transform .24s ease;display:flex;flex-direction:column}
  .drawer.on{transform:none}
  .dhead{padding:20px 22px;border-bottom:1px solid var(--line);background:var(--teal-deep);color:#fff}
  .dhead .x{float:right;cursor:pointer;opacity:.85;font-size:22px;line-height:1}
  .dhead h2{font-size:18px;font-weight:800;padding-right:24px;line-height:1.25}
  .dhead .dsub{font-size:12.5px;color:var(--aqua);font-weight:600;margin-top:5px}
  .dhead .badges{margin-top:10px}
  .dbody{padding:18px 22px;overflow-y:auto;flex:1}

  .doc{border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:14px;background:var(--surface)}
  .doc.ok{border-color:#CFE6D9;background:#F6FCF8}
  .doc.miss{border-color:#F1CFCD;background:#FDF7F6}
  .doc .dt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
  .doc .dt h4{font-size:14.5px;font-weight:800}
  .doc .oblig{font-size:10.5px;font-weight:700;color:var(--gris2);text-transform:uppercase;letter-spacing:.5px}
  .doc .file{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink);margin:8px 0}
  .doc .file .fi{font-size:20px}
  .doc .file .fn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .doc .who{font-size:11.5px;color:var(--gris2);margin-top:2px}
  .doc .venc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
  .doc .venc .vl{color:var(--gris);font-weight:600}
  .doc .venc .vv{font-weight:800}
  .doc .venc .vv.r{color:var(--r)} .doc .venc .vv.y{color:var(--y)} .doc .venc .vv.g{color:var(--g)}
  .doc input[type=date]{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--ink)}
  .doc .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .bt{font-family:inherit;font-size:12.5px;font-weight:700;border-radius:9px;padding:8px 12px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--teal-deep);display:inline-flex;align-items:center;gap:6px}
  .bt:hover{border-color:var(--teal-med)}
  .bt.primary{background:var(--teal);border-color:var(--teal);color:#fff}
  .bt.primary:hover{background:var(--teal-deep)}
  .bt.danger{color:var(--r);border-color:#F1CFCD}
  .bt:disabled{opacity:.55;cursor:default}
  .up{display:flex;flex-direction:column;gap:9px;margin-top:8px}
  .up .fl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .up label.file-in{font-family:inherit;font-size:12.5px;font-weight:700;border:1px dashed var(--teal-med);color:var(--teal-deep);border-radius:9px;padding:9px 13px;cursor:pointer;background:#F1F8F7}
  .up label.file-in:hover{background:#E6F2F0}
  .up input[type=file]{display:none}
  .up .picked{font-size:12px;color:var(--gris);font-weight:600}
  .hint{font-size:12px;color:var(--gris);line-height:1.5;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-top:6px}
  .odoo-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--teal);text-decoration:none;margin-top:10px}
  .odoo-link:hover{text-decoration:underline}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;z-index:100;box-shadow:0 8px 30px rgba(6,65,62,.28);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
  .toast.on{opacity:1}
  @media(max-width:820px){ .thead{grid-template-columns:2fr 170px} .row{grid-template-columns:2fr 170px} .hide-sm{display:none} }
</style>
</head>
<body>
  <div class="topbar">
    <span class="mono">E<span class="y">y</span>G</span>
    <span class="tag">Core</span>
    <span class="title">Legajos de clientes</span>
    <a class="back" href="../index.html">← Core</a>
  </div>
  <div class="wrap"><div id="app"><div class="loading"><div class="spinner"></div>Cargando clientes y su documentación desde Odoo…</div></div></div>
  <div class="scrim" id="scrim" onclick="cerrar()"></div>
  <div class="drawer" id="drawer"></div>

<script>
const ODOO="https://drogueriaeyg.odoo.com";
const esc=EYG.esc;
const RUBRO_FIELD="x_studio_selection_field_6ui_1j42g6fu9";
const DOCS=EYG.LEGAJO_DOCS;                 // checklist compartido (core.js)
const ALERTA=30;                            // "por vencer" = vence en <=30 días
let PERFIL=null, CLIENTES=[], LEG={}, filtro={q:"", estado:""}, _abierto=null;

const soloDig=s=>(s||"").replace(/\D/g,"");
function fmtCuit(v){ const d=soloDig(v); if(d.length!==11) return v||"—"; return d.slice(0,2)+"-"+d.slice(2,10)+"-"+d.slice(10); }
const fmtFecha=f=> f? String(f).slice(0,10).split("-").reverse().join("/") : "—";
function diasHasta(ymd){ if(!ymd) return null; const h=new Date(EYG.argToday()+"T00:00:00"); const v=new Date(String(ymd).slice(0,10)+"T00:00:00"); return Math.round((v-h)/86400000); }
function toast(msg){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";document.body.appendChild(t);}t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2600);}

const ESTADOS={
  verde:  {c:"g", t:"Al día"},
  amarillo:{c:"y", t:"Por vencer"},
  rojo:   {c:"r", t:"Falta / vencido"},
  vacio:  {c:"n", t:"Sin legajo"},
};
const PRIO={rojo:0, vacio:1, amarillo:2, verde:3};
function badge(estado){ const m=ESTADOS[estado]||ESTADOS.vacio; return `<span class="badge ${m.c}"><span class="pt"></span>${m.t}</span>`; }

async function cargar(){
  try{
    // Universo de clientes: fiscales reales (con los que facturamos), activos.
    const FIELDS=["id","name","vat","user_id","company_type",RUBRO_FIELD];
    let parts=await EYG.rpc("res.partner","search_read",
      [[["parent_id","=",false],["active","=",true],["customer_rank",">",0]]],
      {fields:FIELDS,context:{lang:"es_AR"},limit:0});
    // Respaldo: si no se mantiene customer_rank, tomamos las empresas con comercial asignado.
    if(!parts.length){
      parts=await EYG.rpc("res.partner","search_read",
        [[["parent_id","=",false],["active","=",true],["is_company","=",true],["user_id","!=",false]]],
        {fields:FIELDS,context:{lang:"es_AR"},limit:0});
    }
    // Estado del legajo de todos (una sola query a ir.attachment)
    const est=await EYG.legajoEstado(null,{dias:ALERTA});
    LEG=est.byId||{};
    CLIENTES=parts.map(p=>{
      const leg=LEG[p.id]||{docs:{},estado:"vacio",falta:DOCS.slice(),vencidos:[],porVencer:[]};
      return { id:p.id, nombre:p.name, vat:p.vat||"", comercial:p.user_id?p.user_id[1]:"Sin asignar",
               rubro:p[RUBRO_FIELD]||"", estado:leg.estado, leg };
    });
    render();
  }catch(e){
    document.getElementById("app").innerHTML='<div class="errbox"><b>No pude cargar los clientes.</b><br>'+esc(e.message||e)+'</div>';
  }
}

function conteos(){
  const c={all:CLIENTES.length, verde:0, amarillo:0, rojo:0, vacio:0};
  CLIENTES.forEach(x=>c[x.estado]++); return c;
}
function visibles(){
  let l=CLIENTES;
  if(filtro.estado) l=l.filter(c=>c.estado===filtro.estado);
  if(filtro.q){ const q=filtro.q.toLowerCase(); l=l.filter(c=>c.nombre.toLowerCase().includes(q)||soloDig(c.vat).includes(soloDig(filtro.q))); }
  return [...l].sort((a,b)=> (PRIO[a.estado]-PRIO[b.estado]) || a.nombre.localeCompare(b.nombre));
}
// Resumen corto de qué falta / qué vence, para la fila
function detalle(leg){
  const out=[];
  (leg.falta||[]).forEach(d=>out.push(`<span class="rr">Falta ${esc(d.lbl)}</span>`));
  (leg.vencidos||[]).forEach(v=>out.push(`<span class="rr">${esc(v.doc.lbl)} vencida</span>`));
  (leg.porVencer||[]).forEach(v=>{ out.push(v.dias===null?`<span class="yy">${esc(v.doc.lbl)}: falta fecha</span>`:`<span class="yy">${esc(v.doc.lbl)} vence en ${v.dias} d</span>`); });
  if(!out.length) out.push("Documentación completa y vigente");
  return out.slice(0,2).join(" · ");
}

function render(){
  const c=conteos();
  const kpi=(k,cls,lbl)=>`<div class="kpi ${filtro.estado===k?'on':''}" onclick="setEstado('${k}')"><div class="n"><span class="dot ${cls}"></span>${k==='all'?c.all:c[k]}</div><div class="l">${lbl}</div></div>`;
  const vis=visibles();
  document.getElementById("app").innerHTML=`
    <div class="intro">Documentación de alta de cada cliente. Subí la <b>habilitación sanitaria</b> y la <b>constancia de CUIT</b>, poné el vencimiento cuando corresponda, y mirá el estado de un vistazo. Los archivos quedan guardados en la ficha del cliente en Odoo.</div>
    <div class="kpis">
      ${kpi('all','all','Clientes')}
      ${kpi('rojo','r','Falta o vencido')}
      ${kpi('vacio','n','Sin legajo')}
      ${kpi('amarillo','y','Por vencer')}
      ${kpi('verde','g','Al día')}
    </div>
    <div class="toolbar">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" placeholder="Buscar por nombre o CUIT…" value="${esc(filtro.q)}" oninput="setQ(this.value)"></div>
      <select onchange="setEstado(this.value)">
        <option value="" ${!filtro.estado?'selected':''}>Todos los estados</option>
        <option value="rojo" ${filtro.estado==='rojo'?'selected':''}>Falta o vencido</option>
        <option value="vacio" ${filtro.estado==='vacio'?'selected':''}>Sin legajo</option>
        <option value="amarillo" ${filtro.estado==='amarillo'?'selected':''}>Por vencer</option>
        <option value="verde" ${filtro.estado==='verde'?'selected':''}>Al día</option>
      </select>
    </div>
    <div class="count-line"><b>${vis.length}</b> cliente${vis.length===1?'':'s'}${filtro.estado||filtro.q?' (filtrado)':''}</div>
    <div class="tablecard">
      <div class="thead"><div>Cliente</div><div class="hide-sm">CUIT</div><div class="hide-sm">Comercial</div><div>Estado del legajo</div></div>
      ${vis.length? vis.map(fila).join("") : '<div class="empty">No hay clientes que coincidan.</div>'}
    </div>`;
}
function fila(c){
  return `<div class="row" onclick="abrir(${c.id})">
    <div><div class="cname">${esc(c.nombre)}</div><div class="cmeta">${esc(c.rubro||'—')}</div></div>
    <div class="hide-sm cuit">${esc(fmtCuit(c.vat))}</div>
    <div class="hide-sm com">${esc(c.comercial)}</div>
    <div class="est">${badge(c.estado)}<div class="estdet">${detalle(c.leg)}</div></div>
  </div>`;
}
function setQ(v){ filtro.q=v; const vis=visibles(); const tc=document.querySelector(".tablecard"); if(tc) tc.innerHTML=`<div class="thead"><div>Cliente</div><div class="hide-sm">CUIT</div><div class="hide-sm">Comercial</div><div>Estado del legajo</div></div>`+(vis.length?vis.map(fila).join(""):'<div class="empty">No hay clientes que coincidan.</div>'); const cl=document.querySelector(".count-line"); if(cl) cl.innerHTML=`<b>${vis.length}</b> cliente${vis.length===1?'':'s'}${filtro.estado||filtro.q?' (filtrado)':''}`; }
function setEstado(k){ filtro.estado = (k==='all'||filtro.estado===k)?'':k; render(); }

/* ===== Drawer / ficha del legajo ===== */
function abrir(id){
  _abierto=id;
  pintarDrawer();
  document.getElementById("scrim").classList.add("on");
  document.getElementById("drawer").classList.add("on");
}
function cerrar(){ _abierto=null; document.getElementById("scrim").classList.remove("on"); document.getElementById("drawer").classList.remove("on"); }

function pintarDrawer(){
  const c=CLIENTES.find(x=>x.id===_abierto); if(!c) return;
  const leg=c.leg||{docs:{}};
  document.getElementById("drawer").innerHTML=`
    <div class="dhead">
      <span class="x" onclick="cerrar()">✕</span>
      <h2>${esc(c.nombre)}</h2>
      <div class="dsub">CUIT ${esc(fmtCuit(c.vat))} · ${esc(c.comercial)}</div>
      <div class="badges">${EYG.badgeLegajo(c.estado)}</div>
    </div>
    <div class="dbody">
      ${DOCS.map(d=>docHTML(c,d)).join("")}
      <div class="hint">📎 Los archivos quedan adjuntos a la ficha de este cliente en Odoo, así también los ve el resto del equipo desde ahí.</div>
    </div>`;
}
function docHTML(c, d){
  const doc=(c.leg&&c.leg.docs)?c.leg.docs[d.k]:null;
  if(!doc){
    return `<div class="doc miss">
      <div class="dt"><h4>${esc(d.lbl)}</h4><span class="oblig">obligatorio</span></div>
      <div class="up">
        <div class="fl">
          <label class="file-in">Elegir archivo<input type="file" id="file-${d.k}" accept=".pdf,.jpg,.jpeg,.png,.webp" onchange="picked(this,'${d.k}')"></label>
          <span class="picked" id="pick-${d.k}">Ningún archivo elegido</span>
        </div>
        ${d.vence?`<div class="fl"><span class="vl" style="font-size:12.5px;color:var(--gris);font-weight:600">Vence:</span><input type="date" id="venc-${d.k}"></div>`:''}
        <div><button class="bt primary" id="btn-${d.k}" onclick="subir(${c.id},'${d.k}')" disabled>Subir documento</button></div>
      </div>
    </div>`;
  }
  // documento cargado
  const n = d.vence ? diasHasta(doc.vence) : null;
  let vencHTML="";
  if(d.vence){
    let cls="g", txt;
    if(doc.vence==null){ cls="y"; txt="sin fecha — agregala"; }
    else if(n<0){ cls="r"; txt="vencida hace "+Math.abs(n)+" días ("+fmtFecha(doc.vence)+")"; }
    else if(n<=ALERTA){ cls="y"; txt="vence en "+n+" días ("+fmtFecha(doc.vence)+")"; }
    else { cls="g"; txt="vigente hasta "+fmtFecha(doc.vence); }
    vencHTML=`<div class="venc"><span class="vl">Vencimiento:</span><span class="vv ${cls}">${txt}</span>
      <input type="date" id="venc-${d.k}" value="${doc.vence?String(doc.vence).slice(0,10):''}"><button class="bt" onclick="guardarVenc(${c.id},'${d.k}')">Guardar fecha</button></div>`;
  }
  return `<div class="doc ok">
    <div class="dt"><h4>${esc(d.lbl)}</h4><span class="oblig">✓ cargado</span></div>
    <div class="file"><span class="fi">${(doc.mimetype||'').includes('pdf')?'📄':'🖼️'}</span><span class="fn">${esc(doc.name||'documento')}</span></div>
    <div class="who">Cargado por ${esc(doc.por||'—')}${doc.ts?(' · '+fmtFecha(doc.ts)):''}</div>
    ${vencHTML}
    <div class="acts">
      <button class="bt" onclick="verDoc(${doc.attId})">👁 Ver / descargar</button>
      <label class="bt" style="cursor:pointer">↻ Reemplazar<input type="file" accept=".pdf,.jpg,.jpeg,.png,.webp" style="display:none" onchange="reemplazar(this,${c.id},'${d.k}')"></label>
      <button class="bt danger" onclick="quitar(${c.id},'${d.k}',${doc.attId})">Quitar</button>
    </div>
  </div>`;
}
function picked(input,k){
  const f=input.files&&input.files[0];
  document.getElementById("pick-"+k).textContent=f?f.name:"Ningún archivo elegido";
  const btn=document.getElementById("btn-"+k); if(btn) btn.disabled=!f;
  input._file=f;
}

function fileToB64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]||""); r.onerror=rej; r.readAsDataURL(file); }); }

async function crearAdjunto(pid, d, file, vence){
  if(file.size > 10*1024*1024) throw new Error("El archivo pesa más de 10 MB. Comprimilo o mandá un PDF más liviano.");
  const b64=await fileToB64(file);
  const meta={ t:d.k, v:(d.vence?(vence||null):null), p:(PERFIL.nombre||PERFIL.email||""), u:PERFIL.email||"", ts:new Date().toISOString() };
  const name=d.lbl+" — "+file.name;
  return EYG.rpc("ir.attachment","create",[{ name, res_model:"res.partner", res_id:pid, type:"binary",
    datas:b64, mimetype:file.type||"application/octet-stream", description:EYG.legajoMarker(meta) }]);
}
async function refrescar(pid){
  const est=await EYG.legajoEstado([pid],{dias:ALERTA});
  const leg=est.byId[pid]||{docs:{},estado:"vacio",falta:DOCS.slice(),vencidos:[],porVencer:[]};
  LEG[pid]=leg;
  const c=CLIENTES.find(x=>x.id===pid); if(c){ c.leg=leg; c.estado=leg.estado; }
  render(); if(_abierto===pid) pintarDrawer();
}

async function subir(pid,k){
  const d=DOCS.find(x=>x.k===k); const btn=document.getElementById("btn-"+k);
  const fileInput=document.getElementById("file-"+k);
  const file=fileInput?fileInput._file:null;
  if(!file){ toast("Elegí un archivo primero"); return; }
  const venc=d.vence?(document.getElementById("venc-"+k)||{}).value:null;
  if(d.vence && !venc){ if(!confirm("¿Subir la habilitación sin fecha de vencimiento? Vas a poder agregarla después.")) return; }
  if(btn){ btn.disabled=true; btn.textContent="Subiendo…"; }
  try{ await crearAdjunto(pid,d,file,venc); toast("Documento cargado ✓"); await refrescar(pid); }
  catch(e){ toast("No se pudo subir: "+(e.message||e)); if(btn){ btn.disabled=false; btn.textContent="Subir documento"; } }
}
async function reemplazar(input,pid,k){
  const f=input.files&&input.files[0]; if(!f) return;
  const d=DOCS.find(x=>x.k===k); const viejo=LEG[pid]&&LEG[pid].docs[k];
  const venc=(d.vence&&viejo)?viejo.vence:null;
  toast("Reemplazando…");
  try{
    await crearAdjunto(pid,d,f,venc);
    if(viejo&&viejo.attId){ try{ await EYG.rpc("ir.attachment","unlink",[[viejo.attId]]); }catch(e){} }
    toast("Documento reemplazado ✓"); await refrescar(pid);
  }catch(e){ toast("No se pudo reemplazar: "+(e.message||e)); }
}
async function guardarVenc(pid,k){
  const v=(document.getElementById("venc-"+k)||{}).value||null;
  const doc=LEG[pid]&&LEG[pid].docs[k]; if(!doc) return;
  const meta={ t:k, v:v, p:doc.por||(PERFIL.nombre||""), u:doc.email||PERFIL.email||"", ts:doc.ts||new Date().toISOString() };
  try{ await EYG.rpc("ir.attachment","write",[[doc.attId],{description:EYG.legajoMarker(meta)}]); toast("Vencimiento guardado ✓"); await refrescar(pid); }
  catch(e){ toast("No se pudo guardar la fecha: "+(e.message||e)); }
}
async function quitar(pid,k,attId){
  const d=DOCS.find(x=>x.k===k);
  if(!confirm("¿Quitar "+(d?d.lbl:"el documento")+" del legajo? El archivo se borra de la ficha en Odoo.")) return;
  try{ await EYG.rpc("ir.attachment","unlink",[[attId]]); toast("Documento quitado"); await refrescar(pid); }
  catch(e){ toast("No se pudo quitar: "+(e.message||e)); }
}
async function verDoc(attId){
  toast("Abriendo documento…");
  try{
    const r=await EYG.rpc("ir.attachment","read",[[attId],["datas","mimetype","name"]]);
    const a=r&&r[0]; if(!a||!a.datas) throw new Error("sin contenido");
    const bin=atob(a.datas); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const blob=new Blob([bytes],{type:a.mimetype||"application/octet-stream"});
    const url=URL.createObjectURL(blob); const w=window.open(url,"_blank");
    if(!w){ const link=document.createElement("a"); link.href=url; link.download=a.name||"documento"; link.click(); }
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){ toast("No pude abrir el archivo: "+(e.message||e)); }
}

EYG.guard(["finanzas","cobranzas","admin","direccion"],{pruebas:["a3dfd1b309dd41ad2c8ae3562a8e00c09ae03f8dd8194b75eea5a3db5c003122"]}).then(perfil=>{ PERFIL=perfil; cargar(); });
