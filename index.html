<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EyG Core · Panel interno Droguería EyG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/core.css">
<link rel="stylesheet" href="assets/home.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/core.js?v=52"></script>
<script src="assets/home.js"></script>
<script>
EYG.requireAuth([], p => {
  // Cada rol entra directo a lo suyo, sin pasar por el menú:
  //  · comercial → su panel de ventas · líder → su panel del líder.
  // Admin/dirección/finanzas/inventario ven el inicio con sus módulos.
  if(p.rol==="comercial"){ location.replace(EYG.abs("comercial/panel.html"+(p.comercial_ref?("?c="+encodeURIComponent(p.comercial_ref)):""))); return; }
  if(p.rol==="lider"){ location.replace(EYG.abs("comercial/lider.html")); return; }
  document.body.innerHTML = EYG.layout(p, "home", EYGHome.main(p), "Inicio");
  EYGHome.init(p);
});
</script>
</body>
</html>
