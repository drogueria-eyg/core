/* =====================================================================
   PLAN RUEDA — el seguimiento de la estrategia que arrancó el 16/11/2026:
   que el stock gire y vuelva como plata DE CONTADO. Superofertas de contado
   (sobrestock a margen chico, cobrado antes de preparar), freno de compras y
   stock valorizado bajando hacia la meta de fondo.
   Los datos los arma assets/rueda.js (sólo lee Odoo). Acá se suman por
   período, se comparan contra los N días ANTES del arranque y se dibujan.
   "Por día hábil": lunes a viernes sin feriados (los de eyg.comisiones); el
   día de hoy cuenta por la parte de la jornada (8 a 18 h) que ya pasó, y el
   día del arranque (16/11, la oferta se prendió 18:41) no entra en ningún
   promedio de la droguería.
   Resultado guardado 10 min en la sesión del navegador (sessionStorage):
   muestra plata y márgenes, nunca va a tablas compartidas.
   ===================================================================== */
(function(){
const CACHE_K="eyg-rueda-v1", CACHE_TTL=10*60*1000;
const META_STOCK=200e6;                    // la meta de fondo: stock valorizado a ~$200M
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf0=new Intl.NumberFormat("es-AR",{maximumFractionDigits:0}), nf2=new Intl.NumberFormat("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2}), nf1=new Intl.NumberFormat("es-AR",{minimumFractionDigits:1,maximumFractionDigits:1});
const $0=x=>(x<0?"−$ ":"$ ")+nf0.format(Math.abs(Math.round(x||0)));
const $2=x=>(x<0?"−$ ":"$ ")+nf2.format(Math.abs(x||0));
const $M=x=>{ const a=Math.abs(x||0), s=x<0?"−$":"$"; return a>=1e6? s+nf1.format(a/1e6)+" M" : a>=1e3? s+nf0.format(a/1e3)+" mil" : s+nf0.format(a); };
const pc=(x,d=1)=>x==null||!isFinite(x)?"—":nf1.format(+(x*100).toFixed(d))+"%";
const u=x=>nf0.format(Math.round(x||0));
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const DIAS_S=["dom","lun","mar","mié","jue","vie","sáb"], MES_S=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fd=d=>{ const x=new Date(d+"T12:00:00Z"); return DIAS_S[x.getUTCDay()]+" "+x.getUTCDate()+"/"+(x.getUTCMonth()+1); };

const PAGO={esperando:{t:"Esperando pago",c:"warn",i:"⏳"},informado:{t:"Pago informado",c:"info",i:"📨"},pagado:{t:"Pagado",c:"ok",i:"✓"},efectivo:{t:"Efectivo al entregar",c:"tri",i:"💵"},efectivo_cobrado:{t:"Efectivo cobrado",c:"ok",i:"✓"},diferencia:{t:"Diferencia al facturar",c:"bad",i:"⚠"}};
const chipPago=p=>{ const x=PAGO[p]||{t:p||"—",c:"neu",i:""}; return `<span class="chip ${x.c}">${x.i} ${esc(x.t)}</span>`; };
const CAN_ORD=["core","portal","whatsapp","odoo"], CAN_COL={core:"var(--s1)",portal:"var(--s2)",whatsapp:"var(--s3)",odoo:"var(--s4)"};
let D=null, ST={n:30, comi:"base", tasa:3, ordProd:"neto", buscaProd:""};

/* ---------------- días hábiles ---------------- */
function habil(d){ const w=new Date(d+"T12:00:00Z").getUTCDay(); return w>0&&w<6&&!(D.feriados||[]).includes(d); }
/* parte de la jornada (8 a 18 h, hora argentina) que cae entre dos instantes */
function habEntre(a,b){
  a=new Date(a); b=new Date(b); if(!(b>a)) return 0; let s=0;
  for(let d=EYGRueda.diaAR(a); d<=EYGRueda.diaAR(b); d=EYGRueda.addDias(d,1)){
    if(!habil(d)) continue;
    const i=new Date(d+"T11:00:00Z"), f=new Date(d+"T21:00:00Z");   // 8 y 18 h de Argentina
    const x=Math.max(i,a), y=Math.min(f,b); if(y>x) s+=(y-x)/(10*36e5);
  }
  return s;
}

/* ---------------- cálculo por período ---------------- */
function calc(){
  const N=ST.n, d0=D.dia0, ahora=new Date(D.generado), T0=new Date(D.T0);
  const desdeAntes=EYGRueda.addDias(d0,-N);
  const S=D.serie, antes=S.filter(x=>x.dia>=desdeAntes&&x.dia<d0), desp=S.filter(x=>x.dia>d0);
  const habAntes=antes.filter(x=>habil(x.dia)).length||1;
  const habDesp=Math.max(habEntre(new Date(d0+"T21:00:00Z"),ahora),0.2);   // la parte de jornada que ya pasó (piso 0,2 para no dividir por casi cero)    // desde el cierre del día del arranque
  const habPlanReal=habEntre(T0,ahora), habPlan=Math.max(habPlanReal,1);                           // desde que se prendió la oferta
  const pd=(arr,k,h)=>sum(arr,x=>x[k])/h;
  const glob={
    ventaFarm:[pd(antes,"ventaFarm",habAntes),pd(desp,"ventaFarm",habDesp)],
    ventaOtros:[pd(antes,"ventaOtros",habAntes),pd(desp,"ventaOtros",habDesp)],
    margenFarm:[sum(antes,x=>x.margenFarm)/(sum(antes,x=>x.ventaFarm)||1), sum(desp,x=>x.margenFarm)/(sum(desp,x=>x.ventaFarm)||1)],
    compras:[pd(antes,"compras",habAntes),pd(desp,"compras",habDesp)],
    cobros:[pd(antes,"cobros",habAntes),pd(desp,"cobros",habDesp)],
    pedidos:[pd(antes,"pedidos",habAntes),pd(desp,"pedidos",habDesp)],
  };
  // stock
  const sMap={}; D.stockSerie.forEach(x=>sMap[x.dia]=x.valor);
  const stockArr=sMap[d0], stockAntes=sMap[desdeAntes]!=null?sMap[desdeAntes]:D.stockSerie[0].valor;
  const diasCal=Math.max((ahora-T0)/864e5,0.01);
  const pendAntes=(stockArr-stockAntes)/N, pendDesp=(D.stockHoy-stockArr)/diasCal;
  // superofertas: renglones confirmados
  const sup=D.lineas.filter(l=>l.super&&l.confirmado);
  const fueraDesp=D.lineas.filter(l=>!l.super&&l.confirmado&&l.despuesAlta);
  const comiK=ST.comi==="nivel"?"comisionNivel":"comision";
  const ped=D.pedidos, pedConf=ped.filter(p=>p.confirmado);
  const mp=sum(Object.values(D.cobros),c=>c.comisionMP);
  const tot={neto:sum(sup,l=>l.neto), total:sum(sup,l=>l.total), costo:sum(sup,l=>l.costo), margen:sum(sup,l=>l.margen), qty:sum(sup,l=>l.qty),
    comi:sum(sup,l=>l[comiK]), comiBase:sum(sup,l=>l.comision), comiNivel:sum(sup,l=>l.comisionNivel), mp, pedidos:pedConf.length, clientes:new Set(pedConf.map(p=>p.partner)).size};
  tot.queda=tot.margen-tot.comi-tot.mp;
  const cobrado=sum(pedConf.filter(p=>p.cobro),p=>p.cobro.monto);
  const efectivoPend=sum(pedConf.filter(p=>p.pago==="efectivo"),p=>p.total);
  const esperando=ped.filter(p=>["esperando","informado"].includes(p.pago));
  // productos
  const prods=D.oferta.items.map(it=>{
    const ls=D.lineas.filter(l=>l.pid===it.pid&&l.confirmado);
    const antesL=ls.filter(l=>l.dia>=desdeAntes&&!l.despuesAlta&&l.dia<d0);
    const supL=ls.filter(l=>l.super), fuera=ls.filter(l=>!l.super&&l.despuesAlta);
    const habIt=Math.max(habEntre(new Date(it.alta),ahora),0.0001);
    const st=D.prod36[it.pid]||{};
    const qA=sum(antesL,l=>l.qty), qAf=sum(antesL.filter(l=>l.farmacia),l=>l.qty), qS=sum(supL,l=>l.qty), qF=sum(fuera,l=>l.qty);
    const ritA=qA/habAntes, ritAf=qAf/habAntes, ritD=(qS+qF)/Math.max(habIt,1);
    const neto=sum(supL,l=>l.neto), margen=sum(supL,l=>l.margen), comi=sum(supL,l=>l[comiK]);
    const alAlta=st.alAlta!=null?st.alAlta:it.stock;
    return {it, ls:supL.concat(fuera).sort((a,b)=>a.fecha<b.fecha?1:-1), alAlta, hoy:st.hoy||0, valorHoy:st.valorHoy||0, costoHoy:st.costoHoy||it.costo,
      qA, qAf, qS, qF, ritA, ritAf, ritD, lift: ritA>0? ritD/ritA : (ritD>0?Infinity:null),
      cobA: ritA>0? alAlta/ritA : null, cobD: ritD>0? (st.hoy||0)/ritD : null,
      liq: alAlta>0? (alAlta-(st.hoy||0))/alAlta : 0, vendidoPct: alAlta>0? qS/alAlta : 0,
      neto, margen, comi, total:sum(supL,l=>l.total), clientes:new Set(supL.map(l=>l.partner)).size, habIt};
  });
  return {N, d0, desdeAntes, antes, desp, habAntes, habDesp, habPlan, habPlanReal, glob, stockArr, stockAntes, pendAntes, pendDesp, diasCal, sup, fueraDesp, tot, cobrado, efectivoPend, esperando, prods, comiK};
}

  let lab=""; const paso=Math.ceil(n/(iw/58)); dias.forEach((d,i)=>{ if((i%paso===0&&n-1-i>=paso*0.7)||i===n-1) lab+=`<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="middle">${fdc(d)}</text>`; });

  const sv=el.querySelector("svg"), cr=el.querySelector(".cross"), dt=el.querySelector(".dot"), hv=el.querySelector(".hov");
  hv.addEventListener("mousemove",ev=>{ const bx=sv.getBoundingClientRect(); const sx=(ev.clientX-bx.left)*W/bx.width; const i=Math.max(0,Math.min(n-1,Math.round((sx-m.l)/(iw/(n-1||1)))));
    cr.setAttribute("x1",x(i)); cr.setAttribute("x2",x(i)); cr.setAttribute("opacity",.6); dt.setAttribute("cx",x(i)); dt.setAttribute("cy",y(vals[i])); dt.setAttribute("opacity",1);

const corto=n=>String(n||"").replace(/\s*\((Precio|Caja|Pack)[^)]*\)\s*/gi," ").trim();
const presen=n=>{ const m=/\(((?:Precio|Caja|Pack)[^)]*)\)/i.exec(String(n||"")); return m?m[1]:""; };
const horas=h=>h<1?Math.round(h*60)+" min":h<48?nf1.format(h)+" h":nf1.format(h/24)+" días";
function abribles(tb){

}

/* ===== 2 · MÁRGENES ===== */
function pintarMargen(C){
  const t=C.tot, n=t.neto||1;
  const fila=(lb,v,cls,tt,sinPc)=>`<div class="${cls||""}" title="${esc(tt||"")}">${lb}</div><div class="n ${cls||""}">${$2(v)}</div><div class="n ${cls||""}">${sinPc?"":pc(v/n,2)}</div>`;
  const comiN=ST.comi==="nivel";
  $("cascada").innerHTML=`<div class="h">Concepto</div><div class="h n">Pesos</div><div class="h n">% sobre la venta</div>
    ${fila("Venta con IVA (lo que paga la farmacia)",t.total,"menos","Total de los renglones con IVA",true)}
    ${fila("Venta neta sin IVA",t.neto,"tot","Lo que factura la droguería, sin IVA")}
    ${fila("− Costo del producto",-t.costo,"","El costo del plan: el mayor entre el costo del motor y la última factura, el mismo sobre el que se fija el 10%")}
    ${fila("= Margen sobre el costo del producto · SIN comisión",t.margen,"tot","Venta neta − costo del producto. Es el margen sobre el que se fijó el mínimo de 10%")}
    ${fila(`− Comisión de la comercial (${comiN?"con nivel":"tasa base"})`,-t.comi,"","Neto × tasa base del perfil"+(comiN?" × multiplicador de nivel del último mes liquidado":""))}
    ${fila("= Margen CON comisión",t.margen-t.comi,"tot","")}
    ${fila("− Comisión de Mercado Pago (real)",-t.mp,"","Lo que Mercado Pago descontó de cada transferencia (asiento a Gastos Bancarios)")}
    ${fila("= Te queda limpio",t.queda,"fin","Margen − comisión de la comercial − Mercado Pago")}`;
  const desv=C.sup.filter(l=>l.desvio);
  const mgOdoo=sum(C.sup,l=>l.margenOdoo);
  $("margen-alertas").innerHTML=(desv.length?`<div class="alerta ${desv.some(l=>l.desvio<0)?"bad":""}"><b>⚠ ${desv.length} renglón${desv.length>1?"es":""} cobrado${desv.length>1?"s":""} a un precio distinto al de la oferta</b> (${desv.some(l=>l.desvio>0)?"de más: "+$0(sum(desv.filter(l=>l.desvio>0),l=>l.desvio)):""}${desv.some(l=>l.desvio>0)&&desv.some(l=>l.desvio<0)?" · ":""}${desv.some(l=>l.desvio<0)?"de menos: "+$0(-sum(desv.filter(l=>l.desvio<0),l=>l.desvio)):""}, sin IVA)
      <div class="tblw" style="margin-top:8px;max-height:260px"><table class="t" style="font-size:12px"><thead><tr><th>Pedido</th><th>Cliente</th><th>Comercial</th><th>Producto</th><th class="n">Unid.</th><th class="n">Cobrado c/u</th><th class="n" title="Precio que tenía la oferta cuando se cargó el renglón">Oferta c/u</th><th class="n">Diferencia</th><th>Por qué</th></tr></thead><tbody>${desv.map(l=>{ const it=D.oferta.items.find(i=>i.pid===l.pid)||{}; return `<tr><td>${esc(l.pedido)}</td><td>${esc(l.cliente)}</td><td>${esc(l.vendedor)}</td><td>${esc(corto(it.nombre))}</td><td class="n">${u(l.qty)}</td><td class="n">${$2(l.unit)}</td><td class="n">${$2(l.precioOferta)}</td><td class="n ${l.desvio<0?"neg":""}">${$2(l.desvio)}</td><td>${esc(l.causa||"")}</td></tr>`; }).join("")}</tbody></table></div></div>`:'<div class="nota" style="margin-top:0">✓ Todos los renglones se cobraron al precio exacto de la oferta.</div>')
    +`<div class="nota">El margen se mide contra el <b>costo del producto del plan</b> (el mayor entre el costo del motor y la última factura), que es sobre el que se fija el mínimo de 10%. Con el costo con que Odoo valuó cada salida daría ${pc(mgOdoo/n)}: Odoo a veces toma el de la orden de compra en vez del de la factura.</div>`;
  // en qué se va cada $100
  const parts=[{n:"Costo",v:t.costo,c:"var(--gris2)"},{n:"Comisión comercial",v:t.comi,c:"var(--s2)"},{n:"Mercado Pago",v:t.mp,c:"var(--s4)"},{n:"Te queda",v:Math.max(0,t.queda),c:"var(--s3)"}];
  $("peso").innerHTML=parts.map(p=>`<div style="flex:${Math.max(p.v,0)} 1 0;background:${p.c}" title="${esc(p.n)}: ${$0(p.v)} (${pc(p.v/n)})">${p.v/n>.06?pc(p.v/n,0):""}</div>`).join("");
  $("pesoleg").innerHTML=parts.map(p=>`<span><i style="background:${p.c}"></i>${esc(p.n)} ${pc(p.v/n)}</span>`).join("");
  // comparación: con y sin comisión, base y nivel
  $("margen-vs").innerHTML=`<div class="mini">
    <div><div class="l">Margen sin comisión</div><div class="v">${pc(t.margen/n)}</div><div class="d">${$0(t.margen)}</div></div>
    <div><div class="l">Con comisión base</div><div class="v">${pc((t.margen-t.comiBase)/n)}</div><div class="d">comisión ${$0(t.comiBase)} · ${pc(t.comiBase/(t.margen||1),0)} del margen</div></div>
    <div><div class="l">Con comisión y nivel</div><div class="v">${pc((t.margen-t.comiNivel)/n)}</div><div class="d">comisión ${$0(t.comiNivel)} · ${pc(t.comiNivel/(t.margen||1),0)} del margen</div></div>
    <div><div class="l">Margen de la lista (antes)</div><div class="v">${pc(margenAntesMismos(C))}</div><div class="d">esos mismos productos, ${C.N} días antes</div></div></div>`;
  // por comercial
  const porCom={}; C.sup.forEach(l=>{ const k=l.vendedor||"Sin comercial"; const o=porCom[k]||(porCom[k]={n:k,neto:0,margen:0,comi:0,comiB:0,comiN:0,ped:new Set(),cobra:!!D.comerciales[l.uid],uid:l.uid}); o.neto+=l.neto; o.margen+=l.margen; o.comi+=l[C.comiK]; o.comiB+=l.comision; o.comiN+=l.comisionNivel; o.ped.add(l.order); });
  const pcs=Object.values(porCom).sort((a,b)=>b.neto-a.neto);
  $("tb-com").innerHTML=`<thead><tr><th>Comercial</th><th class="n">Pedidos</th><th class="n">Neto</th><th class="n">Margen</th><th class="n">% sin comisión</th><th class="n" title="Tasa base de su perfil × neto">Comisión base</th><th class="n" title="Base × multiplicador de nivel del último mes liquidado">Con nivel</th><th class="n">% con comisión</th></tr></thead><tbody>${pcs.map(o=>{ const c=D.comerciales[o.uid]; return `<tr><td>${esc(o.n)}<span class="sub">${c?`${c.perfil==="inst"?"Instituciones":"Farmacias"} · ${pc(c.tasa,1)} · ${esc(c.nivel)} ×${nf2.format(c.mult)}`:"no cobra comisión"}</span></td><td class="n">${o.ped.size}</td><td class="n">${$0(o.neto)}</td><td class="n">${$0(o.margen)}</td><td class="n">${pc(o.margen/(o.neto||1))}</td><td class="n">${$0(o.comiB)}</td><td class="n">${$0(o.comiN)}</td><td class="n"><b>${pc((o.margen-o.comi)/(o.neto||1))}</b></td></tr>`; }).join("")}</tbody>
    <tfoot><tr><td>Total</td><td class="n">${C.tot.pedidos}</td><td class="n">${$0(C.tot.neto)}</td><td class="n">${$0(C.tot.margen)}</td><td class="n">${pc(C.tot.margen/(C.tot.neto||1))}</td><td class="n">${$0(C.tot.comiBase)}</td><td class="n">${$0(C.tot.comiNivel)}</td><td class="n">${pc((C.tot.margen-C.tot.comi)/(C.tot.neto||1))}</td></tr></tfoot>`;
}
function margenAntesMismos(C){ const ls=D.lineas.filter(l=>l.confirmado&&!l.despuesAlta&&l.dia>=C.desdeAntes&&l.dia<C.d0&&l.farmacia); return sum(ls,l=>l.margen)/(sum(ls,l=>l.neto)||1); }

/* ===== 3 · PRODUCTOS ===== */

  const q=(ST.buscaProd||"").toLowerCase();
  const ord={neto:p=>-p.neto, liq:p=>-p.liq, lift:p=>-(p.lift===Infinity?1e9:(p.lift||0)), stock:p=>-p.valorHoy, cob:p=>-(p.cobD==null?1e9:p.cobD), nombre:p=>p.it.nombre}[ST.ordProd]||(p=>-p.neto);
  const ps=C.prods.filter(p=>!q||p.it.nombre.toLowerCase().includes(q)||String(p.it.sku||"").toLowerCase().includes(q)).sort((a,b)=>{ const x=ord(a),y=ord(b); return x<y?-1:x>y?1:0; });
  const sinVenta=C.prods.filter(p=>!p.qS).length;

    ${al.map(a=>`<div class="alerta ${a.tipo==="pausa"?"bad":""}">${esc(corto(a.nombre))}: ${esc(a.msg)}</div>`).join("")}
    ${hist.length?`<div class="tblw" style="margin-top:8px;max-height:260px"><table class="t" style="font-size:12px"><thead><tr><th>Cuándo</th><th>Producto</th><th class="n">Antes</th><th class="n">Ahora</th><th class="n">Margen</th><th>Por qué</th></tr></thead><tbody>${hist.map(c=>`<tr><td style="white-space:nowrap">${esc(c.at)}</td><td>${esc(corto(c.nombre))}</td><td class="n">−${esc(c.desc_antes)}% ${$2(c.antes)}</td><td class="n">−${esc(c.desc)}% ${$2(c.precio)}</td><td class="n">${nf1.format(c.margen)}%</td><td>${esc(c.motivo)}${c.verificado===false?' <span class="chip bad">no verificó</span>':""}</td></tr>`).join("")}</tbody></table></div>`:""}</details>`;
  $("prod-res").innerHTML=`<div class="mini">
    <div><div class="l">Productos con venta</div><div class="v">${C.prods.length-sinVenta} de ${C.prods.length}</div><div class="d">${sinVenta} todavía sin vender</div></div>
    <div><div class="l">Unidades vendidas</div><div class="v">${u(sum(C.prods,p=>p.qS))}</div><div class="d">de ${u(sum(C.prods,p=>p.alAlta))} en stock al arrancar</div></div>
    <div><div class="l">Stock de la oferta hoy</div><div class="v">${$M(sum(C.prods,p=>p.valorHoy))}</div><div class="d">a costo · al arrancar ${$M(sum(C.prods,p=>p.alAlta*p.costoHoy))}</div></div>
    <div><div class="l">Fuera de la oferta</div><div class="v">${u(sum(C.prods,p=>p.qF))} u</div><div class="d">mismos productos vendidos sin superoferta (instituciones, otras listas)</div></div></div>`;
  const filas=ps.map(p=>{ const it=p.it; const lift=p.lift===Infinity?'<span class="chip ok">antes 0</span>':p.lift==null?'<span class="muted">—</span>':`<b>${nf1.format(p.lift)}×</b>`;
    const cob=x=>x==null?'<span class="muted">—</span>':x>999?"+999 d":nf0.format(x)+" d";
    return `<tr class="x" data-p="${it.pid}"><td style="min-width:240px"><b>${esc(corto(it.nombre))}</b><span class="sub">${esc(presen(it.nombre))}</span><span class="sub">${esc(it.sku||"")} · ${it.base==="pvp"?"−"+it.desc+"% s/PVP":"−"+it.desc+"% s/lista"} · ${$2(it.precio)}${it.alta!==D.T0?" · sumado el "+fh(it.alta):""}</span></td>
      <td class="n">${pc((it.margen||0)/100)}</td><td class="n">${u(p.alAlta)}</td><td class="n">${p.qS?u(p.qS):'<span class="muted">0</span>'}${p.qF?`<span class="sub">+${u(p.qF)} fuera</span>`:""}</td><td class="n">${u(p.hoy)}</td>

        <div class="nota">Antes de la oferta (${C.N} días): ${u(p.qA)} u vendidas (${u(p.qAf)} a farmacias). Precio anterior en la escalera: ${(it.antes||[]).map(a=>`desde ${a[0]} u ${$2(a[1])}`).join(" · ")||"—"}. Costo del plan ${$2(it.costo)}; costo de hoy en el depósito ${$2(p.costoHoy)}.</div></td></tr>`; }).join("");

/* ===== 4 · CANALES Y COMERCIALES ===== */
function pintarCanales(C){
  const ped=D.pedidos.filter(p=>p.confirmado);
  const tot=sum(ped,p=>p.neto)||1;
  const filas=CAN_ORD.map(c=>{ const ps=ped.filter(p=>p.canal===c); const v=sum(ps,p=>p.neto); return {lb:`${esc(D.CANALES[c])} <span class="muted">· ${ps.length} ped.</span>`, segs:[{v,c:CAN_COL[c],n:D.CANALES[c]}], vl:`${$M(v)} <span class="muted">${pc(v/tot,0)}</span>`}; });
  $("can-bars").innerHTML=hbars(filas);
  const porC={}; ped.forEach(p=>{ const k=p.vendedor||"Sin comercial"; const o=porC[k]||(porC[k]={k,segs:{},n:0}); o.segs[p.canal]=(o.segs[p.canal]||0)+p.neto; o.n++; });
  const pcs=Object.values(porC).sort((a,b)=>sum(Object.values(b.segs),x=>x)-sum(Object.values(a.segs),x=>x));
  const mx=Math.max(...pcs.map(o=>sum(Object.values(o.segs),x=>x)),1);
  $("com-bars").innerHTML=hbars(pcs.map(o=>({lb:`${esc(o.k)} <span class="muted">· ${o.n}</span>`, segs:CAN_ORD.map(c=>({v:o.segs[c]||0,c:CAN_COL[c],n:D.CANALES[c]})), vl:$M(sum(Object.values(o.segs),x=>x))})), mx);
  $("leg-can").innerHTML=CAN_ORD.map(c=>`<span><i style="background:${CAN_COL[c]}"></i>${esc(D.CANALES[c])}</span>`).join("");
  // ticket
  const tk=ped.length?tot/ped.length:0;
  const antes=D.lineas.filter(l=>l.confirmado&&l.farmacia&&!l.despuesAlta&&l.dia>=C.desdeAntes&&l.dia<C.d0);
  const pedA=new Set(antes.map(l=>l.order)).size;
  $("can-tk").innerHTML=`Ticket promedio de superoferta: <b>${$0(tk)}</b> sin IVA. Antes, esos productos salían en <b>${pedA}</b> pedidos de farmacias en ${C.N} días (${nf1.format(pedA/C.habAntes)} por día hábil); ahora <b>${nf1.format(ped.length/C.habPlan)}</b> pedidos de superoferta por día hábil.`;
}

/* ===== 5 · COBRO Y LIQUIDEZ ===== */
function pintarCobro(C){
  const ped=D.pedidos;
  const est={}; ped.forEach(p=>{ const k=p.confirmado?(p.pago||"—"):"presupuesto"; const o=est[k]||(est[k]={n:0,v:0}); o.n++; o.v+=p.total; });
  const orden=["pagado","efectivo_cobrado","informado","esperando","efectivo","diferencia","presupuesto"];
  $("cob-est").innerHTML=orden.filter(k=>est[k]).map(k=>`<div><div class="l">${k==="presupuesto"?"Presupuestos sin confirmar":esc((PAGO[k]||{}).t||k)}</div><div class="v">${$M(est[k].v)}</div><div class="d">${est[k].n} pedido${est[k].n>1?"s":""} ${k==="presupuesto"?'<span class="chip neu">no es venta todavía</span>':chipPago(k)}</div></div>`).join("");
  // horas al cobro
  const hs=ped.filter(p=>p.horasAlCobro!=null).map(p=>p.horasAlCobro).sort((a,b)=>a-b);
  const med=hs.length?hs[Math.floor(hs.length/2)]:null;
  const tram=[["menos de 1 h",0,1],["1 a 3 h",1,3],["3 a 12 h",3,12],["12 a 24 h",12,24],["más de 24 h",24,1e9]];
  $("cob-horas").innerHTML=hbars(tram.map(([lb,a,b])=>{ const n=hs.filter(h=>h>=a&&h<b).length; return {lb, segs:[{v:n,c:"var(--uno)",t:n+" pedidos"}], vl:n+" ped."}; }), Math.max(hs.length,1));

    <div><div class="l">Su compra común</div><div class="v">${delta(comunA,comunD,false)}</div><div class="d">${$M(comunD)} por día hábil fuera de la oferta vs ${$M(comunA)} antes</div></div></div>`;
  $("tb-cli").innerHTML=`<thead><tr><th>Farmacia</th><th>Comercial</th><th>Tipo</th><th class="n">Pedidos</th><th class="n">Superofertas</th><th class="n" title="Pedidos comunes (sin superoferta) desde el arranque">Compra común después</th><th class="n" title="Pedidos confirmados en los 90 días antes del arranque">Compró en 90 días antes</th><th class="n">Días sin comprar</th></tr></thead><tbody>${cl.map(c=>`<tr><td>${esc(c.cliente)}</td><td>${esc(c.vendedor)}</td><td>${c.tipo==="nuevo"?'<span class="chip ok">★ nueva</span>':c.tipo==="recuperado"?'<span class="chip info">↺ recuperada</span>':'<span class="chip neu">de siempre</span>'}</td><td class="n">${c.pedidos}</td><td class="n">${$0(c.neto)}</td><td class="n">${c.comunDespues?$0(c.comunDespues):'<span class="muted">—</span>'}</td><td class="n">${$0(c.compra90)}</td><td class="n">${c.diasSinComprar==null?"—":c.diasSinComprar}</td></tr>`).join("")}</tbody>`;

/* ===== 7 · TODA LA DROGUERÍA ===== */
function pintarDrogueria(C){
  const g=C.glob;
  const fila=(lb,a,b,inv,fmt,tt)=>`<tr title="${esc(tt||"")}"><td>${lb}</td><td class="n">${(fmt||$0)(a)}</td><td class="n">${(fmt||$0)(b)}</td><td class="n">${delta(a,b,inv)}</td></tr>`;
  const supDia=C.tot.neto/C.habPlan;
  $("tb-drog").innerHTML=`<thead><tr><th>Por día hábil</th><th class="n">${C.N} días antes</th><th class="n">Desde el arranque</th><th class="n">Cambio</th></tr></thead><tbody>
    ${fila("Venta farmacias (lista Farmacias, sin IVA)",g.ventaFarm[0],g.ventaFarm[1],false)}
    ${fila("&nbsp;&nbsp;↳ de la cual superofertas",0,supDia,false,null,"Neto de superofertas por día hábil")}
    ${fila("Margen de la venta a farmacias",g.margenFarm[0],g.margenFarm[1],false,x=>pc(x))}
    ${(()=>{ const supD=C.sup.filter(l=>l.dia>C.d0); const vA=sum(C.antes,x=>x.ventaFarm), mA=sum(C.antes,x=>x.margenFarm); const vD=sum(C.desp,x=>x.ventaFarm)-sum(supD,l=>l.neto), mD=sum(C.desp,x=>x.margenFarm)-sum(supD,l=>l.margen);
       return fila("&nbsp;&nbsp;↳ margen de la venta común (sin superofertas)",mA/(vA||1),vD>0?mD/vD:null,false,x=>x==null?"—":pc(x),"Si este margen se mantiene, la oferta no está tirando abajo la venta normal"); })()}
    ${fila("Venta resto (instituciones, SAMCOs)",g.ventaOtros[0],g.ventaOtros[1],false)}
    ${fila("Pedidos confirmados",g.pedidos[0],g.pedidos[1],false,x=>nf1.format(x))}
    ${fila("Compras confirmadas",g.compras[0],g.compras[1],true,null,"Bajar es bueno: es el freno de compras")}
    ${fila("Cobros de clientes",g.cobros[0],g.cobros[1],false)}
    <tr title="Negativo = el stock baja"><td>Stock: cambio por día (calendario)</td><td class="n">${$0(C.pendAntes)}</td><td class="n">${$0(C.pendDesp)}</td><td class="n">${C.pendDesp<0&&C.pendAntes<0?`<span class="delta ${C.pendDesp<C.pendAntes?"ok":"bad"}">baja ${nf1.format(C.pendDesp/C.pendAntes)}× ${C.pendDesp<C.pendAntes?"más rápido":"más lento"}</span>`:C.pendDesp<0?'<span class="delta ok">ahora baja</span>':'<span class="delta bad">no baja</span>'}</td></tr>
  </tbody>`;
  const ventFarmD=sum(C.desp,x=>x.ventaFarm);
  $("drog-nota").innerHTML=`${C.desp.some(x=>x.dia===D.hoy)?"<b>Hoy está en curso:</b> los pedidos se confirman y los cobros se asientan a lo largo del día, así que el día de hoy suele verse bajo hasta la tarde. ":""}Desde el arranque, las superofertas son el <b>${pc(ventFarmD?sum(C.sup.filter(l=>l.dia>C.d0),l=>l.neto)/ventFarmD:0,0)}</b> de la venta a farmacias. Si la venta común a farmacias cae mientras suben las superofertas, la oferta le está comiendo venta con margen normal: mirá también la columna "Compra común después" en Clientes.`;
}

/* ===== 8 · PROYECCIÓN ===== */
function pintarProyeccion(C){
  const ritmoU=C.prods.map(p=>({p, d: p.ritD>0? p.hoy/p.ritD : null}));
  const conRitmo=ritmoU.filter(x=>x.d!=null), sinRitmo=ritmoU.filter(x=>x.d==null);
  const cajaDia=C.tot.total/C.habPlan, plataStock=sum(C.prods,p=>p.hoy*p.it.precio*(1+(p.it.iva||0)/100));
  const sem=cajaDia*5;
  const falta=D.stockHoy-META_STOCK, pend=C.pendDesp;
  const llega=pend<0? Math.ceil(falta/(-pend)) : null;
  $("proy").innerHTML=`<div class="mini">
    <div><div class="l">Caja por semana al ritmo de hoy</div><div class="v">${$M(sem)}</div><div class="d">${$M(cajaDia)} por día hábil de contado</div></div>
    <div><div class="l">Si se vende todo el stock de la oferta</div><div class="v">${$M(plataStock)}</div><div class="d">entra de contado (precio de oferta, con IVA)</div></div>
    <div><div class="l">Stock a la meta de fondo</div><div class="v">${llega!=null?(llega>3650?"+10 años":llega+" días"):"—"}</div><div class="d">${llega!=null?`al ritmo desde el arranque (${$M(pend)} por día)`:"el stock no está bajando desde el arranque"}</div></div>
    <div><div class="l">Productos sin salida todavía</div><div class="v">${sinRitmo.length}</div><div class="d">sin venta desde que entraron: revisar precio o empujar</div></div></div>
    ${sinRitmo.length?`<div class="alerta">Sin ventas todavía: ${sinRitmo.map(x=>esc(x.p.it.nombre.split(" - ")[0])).join(" · ")}</div>`:""}
    <div class="ctit">Cuándo se termina el stock de cada producto al ritmo de hoy</div>
    ${hbars(conRitmo.sort((a,b)=>a.d-b.d).slice(0,15).map(x=>({lb:esc(x.p.it.nombre.split(" - ")[0]), segs:[{v:Math.min(x.d,120),c:x.d<=20?"var(--s3)":x.d<=60?"var(--s1)":"var(--s4)",t:nf0.format(x.d)+" días hábiles"}], vl:(x.d>999?"+999":nf0.format(x.d))+" d"})),120)}
    <div class="nota">Barras topeadas en 120 días hábiles. Verde: se termina en menos de un mes; azul: en 1 a 3 meses; amarillo: más.</div>`;
}

/* ---------------- carga ---------------- */
async function cargar(forzar){
  $("status").className="status"; $("status").textContent="Cargando datos de Odoo…";
  try{
    let data=null;
    if(!forzar){ try{ const c=JSON.parse(sessionStorage.getItem(CACHE_K)||"null"); if(c&&Date.now()-c.t<CACHE_TTL) data=c.v; }catch(e){} }
    if(!data){ data=await EYGRueda.cargar(EYG.rpc,{progreso:m=>{$("status").textContent=m;}}); try{ sessionStorage.setItem(CACHE_K,JSON.stringify({t:Date.now(),v:data})); }catch(e){} }
    D=data;
    $("status").innerHTML=`Datos de Odoo al ${fh(D.generado.replace("T"," ").slice(0,19))} · la oferta se activó el ${fh(D.T0.replace("T"," ").slice(0,19))} · ${D.oferta.items.length} productos · comparando contra los ${ST.n} días anteriores.`;
    pintar();
  }catch(e){ console.error(e); $("status").className="status err"; $("status").textContent="No pude cargar: "+String(e.message||e).slice(0,300); }
}
