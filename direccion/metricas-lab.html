<style>

  .ml .q{font:inherit;font-size:13px;padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-width:210px}

  .ml .btn-act{font:inherit;font-size:12px;font-weight:800;padding:8px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--teal-deep);cursor:pointer}

  .ml table.t .muted{color:var(--gris2)}

  /* ---- Ficha ---- */
  .ml .back{font:inherit;font-size:13px;font-weight:800;color:var(--teal-deep);background:none;border:0;cursor:pointer;padding:4px 0;margin-bottom:6px}
  .ml .hero{background:linear-gradient(135deg,var(--teal-deep),#0A7A74);color:#fff;border-radius:16px;padding:20px 24px;margin-bottom:16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .ml .hero .mono{width:62px;height:62px;border-radius:16px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:30px;flex:0 0 auto}
  .ml .hero h1{font-size:26px;font-weight:900;letter-spacing:-.5px;margin:0;line-height:1.1}
  .ml .hero .sub{font-size:13px;color:#BfE3DF;margin-top:3px;font-weight:600}
  .ml .hero .sp{flex:1}
  .ml .hero .pr{font:inherit;font-size:12.5px;font-weight:800;color:var(--teal-deep);background:#fff;border:0;border-radius:10px;padding:10px 15px;cursor:pointer}
  .ml .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
  @media(max-width:900px){.ml .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .ml .kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 17px;box-shadow:var(--shadow)}

  .ml .chip.up{background:var(--okbg);color:var(--ok)} .ml .chip.down{background:var(--badbg);color:var(--bad)} .ml .chip.flat{background:#EEF1F0;color:var(--gris)}
  .ml .grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:16px}
  @media(max-width:900px){.ml .grid2{grid-template-columns:1fr}}
  .ml .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .ml .card h3{font-size:13px;font-weight:800;color:var(--ink);margin:0 0 12px;letter-spacing:.2px}
  .ml .card h3 small{font-weight:600;color:var(--gris2);font-size:11.5px}
  .ml svg.trend{width:100%;height:150px;display:block}

  .ml svg.dona .dc{font-size:26px;font-weight:900;fill:var(--teal-deep)}
  .ml svg.dona .dl{font-size:11px;fill:var(--gris);font-weight:700}
  .ml .leg{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .ml .leg .row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink)}
  .ml .leg .dot{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
  .ml .leg .row b{margin-left:auto;font-variant-numeric:tabular-nums}
  .ml .leg .row span.u{color:var(--gris2);font-weight:600;font-size:11.5px}
  .ml table.top{width:100%;border-collapse:collapse}
  .ml table.top th{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--gris2);font-weight:800;text-align:right;padding:7px 8px}
  .ml table.top th.l{text-align:left}
  .ml table.top td{padding:8px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;border-top:1px solid var(--line);white-space:nowrap}
  .ml table.top td.l{text-align:left;white-space:normal}
  .ml table.top .rk{color:var(--gris2);font-weight:800;margin-right:8px}
  .ml table.top .code{color:var(--gris2);font-size:11px}
  /* ---- Matriz unidades por producto mes a mes ---- */
  .ml .matwrap{overflow-x:auto;margin:0 -4px}
  .ml table.mat{border-collapse:collapse;width:100%;font-size:12px;min-width:760px}
  .ml table.mat th{font-size:9.5px;letter-spacing:.3px;text-transform:uppercase;color:var(--gris2);font-weight:800;text-align:right;padding:6px 7px;white-space:nowrap;background:#F7FBFA}
  .ml table.mat th.l{text-align:left}
  .ml table.mat td{padding:6px 7px;text-align:right;font-variant-numeric:tabular-nums;border-top:1px solid var(--line);white-space:nowrap}
  .ml table.mat td.l{text-align:left;white-space:normal;min-width:190px}
  .ml table.mat td.z{color:var(--gris2)}
  .ml table.mat td.tot{font-weight:800;color:var(--ink);border-left:1px solid var(--line)}
  .ml table.mat th.tot{border-left:1px solid var(--line)}
  .ml table.mat td.fac{color:var(--gris)}
  .ml table.mat .rk{color:var(--gris2);font-weight:800;margin-right:7px}
  .ml table.mat .code{color:var(--gris2);font-size:10.5px}
  .ml table.mat tbody tr:hover{background:var(--agua)}
  .ml table.mat tfoot td{border-top:2px solid var(--line);font-weight:800;color:var(--teal-deep);background:#F7FBFA}
  .ml .mini{color:var(--gris2);font-size:12.5px;text-align:center;padding:30px 0}
  .ml .foot{font-size:11.5px;color:var(--gris2);margin-top:14px}

  /* ---- Impresión / PDF: solo la ficha ---- */
  @media print{
    @page{margin:14mm}
    body{background:#fff!important}
    body *{visibility:hidden!important}
    #mlficha, #mlficha *{visibility:visible!important}
    #mlficha{position:absolute;left:0;top:0;width:100%}
    .ml .hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .ml .no-print{display:none!important}
    .ml .card,.ml .kpi{box-shadow:none;break-inside:avoid}
    .ml .matwrap{overflow-x:visible}
    .ml table.mat{min-width:0;font-size:8.5px}
    .ml table.mat th,.ml table.mat td{padding:3px 4px}
    .ml table.mat td.l{min-width:0}

</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=122"></script>
<script>
(function(){
const rpc=EYG.rpc, money=EYG.money, esc=EYG.esc;
const PROVEEDOR_T=2634;                // proveedor placeholder (compra informal): se excluye
const FBRAND={farm:"#048782", inst:"#1E5FA8"};

/* ---------- meses (últimos 12, ancla hora Argentina) ---------- */
const MNOM=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const T0=EYG.argToday(); const Y0=+T0.slice(0,4), M0=+T0.slice(5,7);
const MESES=[]; for(let i=11;i>=0;i--) MESES.push(new Date(Y0, M0-1-i, 1));
const MLAB=MESES.map(d=>MNOM[d.getMonth()]+(d.getMonth()===0||d===MESES[0]?"’"+String(d.getFullYear()).slice(2):""));
const pad=n=>String(n).padStart(2,"0");
const mlim=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-01 03:00:00`;
const mnext=d=>{ const n=new Date(d.getFullYear(),d.getMonth()+1,1); return mlim(n); };
const DESDE=mlim(MESES[0]);

/* ---------- laboratorio del producto (igual que en Stock) ---------- */
function fold(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(); }
function labKey(s){ return fold(s).replace(/[^a-z0-9]+/g," ").trim(); }
function labDe(categ){ if(!categ) return ""; const p=categ[1].split("/").map(s=>s.trim());
  const i=p.findIndex(s=>s.toUpperCase()==="ETICOS"); return (i>=0&&p[i+1])?p[i+1]:""; }
function mejorNombre(a,b){ if(!a) return b||""; if(!b) return a;
  const la=/[a-záéíóúñ]/.test(a), lb=/[a-záéíóúñ]/.test(b);
  if(la&&!lb) return a; if(lb&&!la) return b; return a.length>=b.length?a:b; }

/* ---------- rubro (farmacia / institución) por cliente ---------- */
const RF=EYG.RUBRO_FIELD;
const _rub={}, _com={};   // partner -> 'f'|'i'|null  y  partner -> id del cliente fiscal
const seg=r=>{ r=EYG.rubroNorm(r); return r==="FARMACIAS"?"f":(r==="INSTITUCIONES"||r==="SAMCO")?"i":null; };
async function rubros(pids){
  const falta=pids.filter(p=>!(p in _rub)); if(!falta.length) return;
  const ps=[]; for(let k=0;k<falta.length;k+=500) ps.push(...await rpc("res.partner","read",[falta.slice(k,k+500),[RF,"commercial_partner_id"]]));
  const padres=[...new Set(ps.filter(p=>!p[RF]&&p.commercial_partner_id&&p.commercial_partner_id[0]!==p.id).map(p=>p.commercial_partner_id[0]))];
  const rp={}; if(padres.length)(await rpc("res.partner","read",[padres,[RF]])).forEach(p=>rp[p.id]=p[RF]);
  ps.forEach(p=>{ const cp=p.commercial_partner_id&&p.commercial_partner_id[0]; _com[p.id]=cp||p.id;
    _rub[p.id]=seg(p[RF] || (cp&&rp[cp]) || ""); });
}

/* ================== ESTADO ================== */
let EJE="lab", DATA=null, SEL=null;
const ORD={lab:{c:"neto",d:-1}, prov:{c:"neto",d:-1}};
const DET={};   // cache de detalle por "eje:key"
let Q="";
const $=id=>document.getElementById(id);
function status(t,err){ const s=$("status"); if(s){ s.className="status"+(err?" err":""); s.innerHTML=t; } }

/* ================== CARGA GENERAL ================== */
async function cargar(force){
  status("Leyendo productos, ventas y proveedores de Odoo…");
  try{
    const [prods, sup, vg] = await Promise.all([
      rpc("product.product","search_read",[[["active","=",true]]],{fields:["id","product_tmpl_id","categ_id","x_studio_many2one_field_6o_1if0l6ud2"],limit:100000}),
      rpc("product.supplierinfo","search_read",[[]],{fields:["product_tmpl_id","partner_id","min_qty"],limit:100000}),
      rpc("sale.order.line","read_group",[[["order_id.state","in",["sale","done"]],["order_id.date_order",">=",DESDE]],["price_subtotal:sum","product_uom_qty:sum"],["product_id"]],{lazy:false,limit:100000}),
    ]);
    // proveedor preferido por plantilla (menor min_qty), sin el placeholder informal
    const byTmpl={};
    for(const s of sup){ if(!s.partner_id||s.partner_id[0]===PROVEEDOR_T) continue; const t=s.product_tmpl_id&&s.product_tmpl_id[0]; if(!t) continue;
      const cur=byTmpl[t]; if(!cur||(s.min_qty||1)<cur.minQty) byTmpl[t]={id:s.partner_id[0],name:s.partner_id[1],minQty:s.min_qty||1}; }
    // ventas por producto
    const S={}; vg.forEach(v=>{ if(v.product_id) S[v.product_id[0]]={u:v.product_uom_qty||0,neto:v.price_subtotal||0}; });
    // producto -> lab / proveedor  + armado de agregados
    const labs={}, provs={}, P={};
    for(const p of prods){ const t=p.product_tmpl_id&&p.product_tmpl_id[0];
      const labCat=labDe(p.categ_id), mf=p.x_studio_many2one_field_6o_1if0l6ud2, marca=Array.isArray(mf)?(mf[1]||""):"";
      const labName=labCat||marca, lk=labKey(labName);
      const prov=t&&byTmpl[t]?byTmpl[t]:null;
      P[p.id]={labName,labKey:lk,provId:prov?prov.id:null,provName:prov?prov.name:""};
      const s=S[p.id];
      if(lk){ const g=labs[lk]||(labs[lk]={key:lk,name:labName,nProd:0,nVend:0,u:0,neto:0,pids:[]});
        g.name=mejorNombre(g.name,labName); g.nProd++; g.pids.push(p.id); if(s){g.u+=s.u;g.neto+=s.neto;if(s.neto>0)g.nVend++;} }
      if(prov){ const g=provs[prov.id]||(provs[prov.id]={key:String(prov.id),id:prov.id,name:prov.name,nProd:0,nVend:0,u:0,neto:0,pids:[]});
        g.nProd++; g.pids.push(p.id); if(s){g.u+=s.u;g.neto+=s.neto;if(s.neto>0)g.nVend++;} }
    }
    DATA={ lab:Object.values(labs), prov:Object.values(provs), P, S };
    status(`Listo · ${DATA.lab.length} laboratorios · ${DATA.prov.length} proveedores · ventas de los últimos 12 meses`);
    render();
  }catch(e){ status("No se pudo cargar: "+(e&&e.message||e), true); }
}

/* ================== DETALLE (al abrir una ficha) ================== */
async function detalle(ent){
  const ck=EJE+":"+ent.key; if(DET[ck]) return DET[ck];
  const pids=ent.pids;
  // ventas del período por producto × cliente (alcance, mix y top)
  const g=await rpc("sale.order.line","read_group",
    [[["product_id","in",pids],["order_id.state","in",["sale","done"]],["order_id.date_order",">=",DESDE]],
     ["price_subtotal:sum","product_uom_qty:sum"],["product_id","order_partner_id"]],{lazy:false,limit:100000});
  await rubros([...new Set(g.map(x=>x.order_partner_id&&x.order_partner_id[0]).filter(Boolean))]);
  const porProd={}; const clientes=new Set(), cliF=new Set(), cliI=new Set(); let netoF=0,netoI=0;
  g.forEach(x=>{ if(!x.product_id) return; const pid=x.product_id[0];
    const pp=porProd[pid]||(porProd[pid]={u:0,neto:0}); pp.u+=x.product_uom_qty||0; pp.neto+=x.price_subtotal||0;
    const cid=x.order_partner_id&&x.order_partner_id[0]; if(cid){ const fiscal=_com[cid]||cid; clientes.add(fiscal);
      const s=_rub[cid]; if(s==="f"){cliF.add(fiscal);netoF+=x.price_subtotal||0;} else if(s==="i"){cliI.add(fiscal);netoI+=x.price_subtotal||0;} } });
  // top por UNIDADES (lo que sirve para negociar): hasta 25 productos
  const orden=Object.keys(porProd).map(Number).sort((a,b)=>(porProd[b].u-porProd[a].u)||(porProd[b].neto-porProd[a].neto));
  const topPids=orden.slice(0,25), hayMas=Math.max(0, orden.length-topPids.length);
  const names={}; if(topPids.length)(await rpc("product.product","read",[topPids,["name","default_code"]])).forEach(p=>names[p.id]=p);
  // evolución mes a mes POR PRODUCTO (una consulta por mes, agrupada por producto)
  const mres=await Promise.all(MESES.map(d=>rpc("sale.order.line","read_group",
    [[["product_id","in",pids],["order_id.state","in",["sale","done"]],["order_id.date_order",">=",mlim(d)],["order_id.date_order","<",mnext(d)]],
     ["price_subtotal:sum","product_uom_qty:sum"],["product_id"]],{lazy:false,limit:100000})));
  const serieN=[], serieU=[], mesU={};   // serie total + mesU[pid] = [u mes0..mes11]
  mres.forEach((rows,mi)=>{ let sn=0,su=0; (rows||[]).forEach(x=>{ if(!x.product_id) return; const pid=x.product_id[0];
      const u=x.product_uom_qty||0; (mesU[pid]||(mesU[pid]=new Array(MESES.length).fill(0)))[mi]+=u; sn+=x.price_subtotal||0; su+=u; });
    serieN.push(sn); serieU.push(su); });
  const det={ porProd, names, topPids, hayMas, mesU, serieN, serieU,
    clientes:clientes.size, cliF:cliF.size, cliI:cliI.size, netoF, netoI };
  DET[ck]=det; return det;
}

/* ================== GRÁFICOS (SVG propio) ================== */
function trendSVG(serieN, serieU){
  const n=serieN.length, bw=30, gap=10, H=120, W=n*(bw+gap);
  const mx=Math.max(...serieN,1); let b="";
  serieN.forEach((v,i)=>{ const h=Math.max(2,v/mx*H), x=i*(bw+gap);
    b+=`<rect x="${x}" y="${(H-h+6).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="4" fill="var(--c-farm)"><title>${MLAB[i]}: ${money(v)} · ${Math.round(serieU[i]).toLocaleString("es-AR")} u</title></rect>`+
       `<text x="${x+bw/2}" y="${H+20}" text-anchor="middle" class="xl">${MLAB[i]}</text>`; });
  return `<svg class="trend" viewBox="0 0 ${W} ${H+26}" preserveAspectRatio="xMidYMid meet">${b}</svg>`;
}
function donaSVG(f,i){
  const t=f+i; if(t<=0) return '<div class="mini">Sin ventas en el período</div>';
  const pf=f/t, R=52, C=2*Math.PI*R, lenF=C*pf;
  return `<svg class="dona" viewBox="0 0 140 140">
    <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--c-inst)" stroke-width="22"/>
    <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--c-farm)" stroke-width="22" stroke-linecap="butt"
      stroke-dasharray="${lenF.toFixed(1)} ${(C-lenF).toFixed(1)}" transform="rotate(-90 70 70)"/>
    <text x="70" y="66" text-anchor="middle" class="dc">${Math.round(pf*100)}%</text>
    <text x="70" y="84" text-anchor="middle" class="dl">a farmacias</text></svg>`;
}

/* ================== RENDER ================== */
function render(){
  const root=$("root"); if(!root||!DATA) return;
  if(SEL){ renderFicha(root); return; }
  renderRanking(root);
}

function cab(c,txt,al){ const o=ORD[EJE]; const ar=o.c===c?(o.d<0?"▾":"▴"):"";
  return `<th class="${al||''}" data-c="${c}">${txt}<span class="ar">${ar}</span></th>`; }

function renderRanking(root){
  const nombreEje = EJE==="lab" ? "laboratorio" : "proveedor";
  root.innerHTML=`<div class="hint">Elegí un ${nombreEje} para ver su ficha: cuánto vendemos de sus productos, a cuántas farmacias llega y cómo viene. Pensada para mostrársela cuando nos visitan.</div>
    <table class="t">
      <thead><tr>
        ${cab("name","Laboratorio / proveedor","l")}
        ${cab("nProd","Productos")}
        ${cab("u","Unidades 12m")}
        ${cab("neto","Facturación 12m")}
      </tr></thead>
      <tbody id="mltbody"></tbody>
    </table>
    <div class="foot">Facturación = venta neta (sin IVA) de los pedidos confirmados en los últimos 12 meses. “Productos” = ítems del catálogo activo de ese ${nombreEje}.</div>`;
  pintarFilas();
  root.querySelectorAll("th[data-c]").forEach(th=>th.onclick=()=>{
    const c=th.dataset.c, o=ORD[EJE]; if(o.c===c) o.d*=-1; else{ o.c=c; o.d=(c==="name"?1:-1); } pintarFilas();
    root.querySelectorAll("th[data-c]").forEach(h=>{ const ar=o.c===h.dataset.c?(o.d<0?"▾":"▴"):""; h.querySelector(".ar").textContent=ar; });
  });
}
function pintarFilas(){
  const tb=$("mltbody"); if(!tb) return; const o=ORD[EJE];
  let rows=DATA[EJE].slice();
  if(Q){ const q=fold(Q); rows=rows.filter(r=>fold(r.name).includes(q)); }
  rows.sort((a,b)=> o.c==="name" ? o.d*a.name.localeCompare(b.name,"es") : o.d*((a[o.c]||0)-(b[o.c]||0)) );
  const mx=Math.max(...rows.map(r=>r.neto),1);
  tb.innerHTML = rows.length ? rows.map((r,i)=>`<tr data-k="${esc(r.key)}">
    <td class="l"><span class="rk">${i+1}</span>${esc(r.name||"(sin nombre)")}
      <span class="barcell" style="width:${Math.max(2,Math.round(r.neto/mx*100))}%"></span></td>
    <td class="muted">${r.nProd.toLocaleString("es-AR")}</td>
    <td>${Math.round(r.u).toLocaleString("es-AR")}</td>
    <td><b>${money(r.neto)}</b></td></tr>`).join("")
    : `<tr><td colspan="4" class="mini">No hay ${EJE==="lab"?"laboratorios":"proveedores"} que coincidan con la búsqueda.</td></tr>`;
  tb.querySelectorAll("tr[data-k]").forEach(tr=>tr.onclick=()=>abrir(tr.dataset.k));
}

function abrir(key){ SEL=DATA[EJE].find(r=>r.key===key); if(!SEL) return;
  window.scrollTo(0,0); render(); cargarFicha(); }

function renderFicha(root, det){
  const r=SEL, nombreEje = EJE==="lab" ? "Laboratorio" : "Proveedor";
  const ico = EJE==="lab" ? "🧪" : "🚚";
  let body;
  if(!det){ body=`<div class="mini">Calculando alcance, evolución y top de productos…</div>`; }
  else{
    const cur=det.serieN.slice(-3).reduce((a,b)=>a+b,0), prev=det.serieN.slice(-6,-3).reduce((a,b)=>a+b,0);
    const gpct = prev>0 ? (cur-prev)/prev*100 : (cur>0?100:0);
    const gcls = gpct>=5?"up":gpct<=-5?"down":"flat", garr = gpct>=5?"▲":gpct<=-5?"▼":"▬";
    const mixT=det.netoF+det.netoI;
    const matHead = `<th class="l">Producto</th>${MLAB.map(m=>`<th>${m}</th>`).join("")}<th class="tot">Total u</th><th class="fac">Fact. 12m</th>`;
    const matFilas = det.topPids.map((pid,i)=>{ const nm=det.names[pid]||{}, pp=det.porProd[pid], mu=det.mesU[pid]||[];
      const nmTxt = esc((nm.name||"").replace(/\s*\[.*?\]\s*/g," ").trim()||("#"+pid));
      const celdas = MESES.map((_,mi)=>{ const u=Math.round(mu[mi]||0); return `<td class="${u?'':'z'}">${u?u.toLocaleString("es-AR"):'·'}</td>`; }).join("");
      return `<tr><td class="l"><span class="rk">${i+1}</span>${nmTxt}${nm.default_code?`<span class="code"> · ${esc(nm.default_code)}</span>`:""}</td>${celdas}<td class="tot">${Math.round(pp.u).toLocaleString("es-AR")}</td><td class="fac">${money(pp.neto)}</td></tr>`; }).join("");
    const totMes = MESES.map((_,mi)=>`<td>${Math.round(det.serieU[mi]||0).toLocaleString("es-AR")}</td>`).join("");
    const matFoot = `<tr><td class="l">Total ${EJE==="lab"?"del laboratorio":"del proveedor"} (todos los productos)</td>${totMes}<td class="tot">${Math.round(r.u).toLocaleString("es-AR")}</td><td class="fac">${money(r.neto)}</td></tr>`;
    body=`
      <div class="kpis">
        <div class="kpi"><div class="l">Facturación 12 meses</div><div class="v">${money(r.neto)}</div><div class="d">venta neta de sus productos</div></div>
        <div class="kpi"><div class="l">Unidades vendidas</div><div class="v">${Math.round(r.u).toLocaleString("es-AR")}</div><div class="d">en los últimos 12 meses</div></div>
        <div class="kpi"><div class="l">Alcance</div><div class="v">${det.clientes.toLocaleString("es-AR")}</div><div class="d">clientes distintos · ${det.cliF} farmacias · ${det.cliI} instituciones</div></div>
        <div class="kpi"><div class="l">Tendencia</div><div class="v"><span class="chip ${gcls}">${garr} ${Math.abs(Math.round(gpct))}%</span></div><div class="d">últimos 3 meses vs. los 3 previos</div></div>
      </div>
      <div class="grid2">
        <div class="card"><h3>Cómo viene mes a mes <small>facturación neta</small></h3>${trendSVG(det.serieN,det.serieU)}</div>
        <div class="card"><h3>A quién le vendemos sus productos</h3>
          ${donaSVG(det.netoF,det.netoI)}
          <div class="leg">
            <div class="row"><span class="dot" style="background:var(--c-farm)"></span>Farmacias <b>${mixT>0?Math.round(det.netoF/mixT*100):0}%</b> <span class="u">(${det.cliF})</span></div>
            <div class="row"><span class="dot" style="background:var(--c-inst)"></span>Instituciones y SAMCO <b>${mixT>0?Math.round(det.netoI/mixT*100):0}%</b> <span class="u">(${det.cliI})</span></div>
          </div></div>
      </div>
      <div class="card"><h3>Unidades por producto, mes a mes <small>lo que le compramos de cada producto · para pedir mejores precios</small></h3>
        <div class="matwrap"><table class="mat">
          <thead><tr>${matHead}</tr></thead>
          <tbody>${matFilas||`<tr><td class="l">Sin ventas en el período.</td></tr>`}</tbody>
          ${matFilas?`<tfoot>${matFoot}</tfoot>`:""}
        </table></div>
        ${det.hayMas?`<div class="foot">Se muestran los 25 productos más vendidos por unidades. Hay ${det.hayMas} más con menos movimiento (el “Total” de abajo incluye a todos).</div>`:""}
      </div>
      <div class="foot">EyG · datos de ${MLAB[0]} a ${MLAB[11]} · ventas netas de pedidos confirmados en Odoo. Alcance = clientes fiscales distintos que compraron al menos una unidad.</div>`;
  }
  root.innerHTML=`
    <button class="back no-print" id="mlback">‹ Volver al listado</button>
    <div id="mlficha">
      <div class="hero">
        <div class="mono">${ico}</div>
        <div><h1>${esc(r.name||"(sin nombre)")}</h1><div class="sub">${nombreEje} · ${r.nProd.toLocaleString("es-AR")} productos en catálogo · EyG Droguería</div></div>
        <div class="sp"></div>
        <button class="pr no-print" id="mlprint">🖨 Imprimir / PDF</button>
      </div>
      ${body}
    </div>`;
  const bk=$("mlback"); if(bk) bk.onclick=()=>{ SEL=null; render(); };
  const pr=$("mlprint"); if(pr) pr.onclick=()=>window.print();
}

async function cargarFicha(){
  try{ const det=await detalle(SEL); if(SEL) renderFicha($("root"), det); }
  catch(e){ const root=$("root"); if(root&&SEL) renderFicha(root), status("No se pudo calcular la ficha: "+(e&&e.message||e),true); }
}

/* ================== ARRANQUE ================== */
const MAIN=`<div class="ml">
  <div class="bar-top">
    <div class="pills" id="seg-eje">
      <button data-e="lab" class="on">🧪 Por laboratorio</button>
      <button data-e="prov">🚚 Por proveedor</button>
    </div>
    <input class="q" id="q" type="text" placeholder="Buscar laboratorio o proveedor…" autocomplete="off">
    <span class="sp"></span>
    <button class="btn-act" id="btn-act" title="Volver a leer todo de Odoo">↻ Actualizar</button>
  </div>
  <div class="status" id="status">Cargando…</div>
  <div id="root"></div>
</div>`;

(async function(){
  // EN PRUEBAS: además del rol, sólo la huella de email habilitada (ver MODULOS en core.js)
  const perfil = await EYG.guard(["direccion","inventario"],
    {pruebas:["a3dfd1b309dd41ad2c8ae3562a8e00c09ae03f8dd8194b75eea5a3db5c003122"]});
  document.body.innerHTML = EYG.layout(perfil, "metricas-lab", MAIN, "Laboratorios y proveedores");
  document.querySelectorAll("#seg-eje button").forEach(bt=>bt.addEventListener("click",()=>{
    EJE=bt.dataset.e; SEL=null; document.querySelectorAll("#seg-eje button").forEach(x=>x.classList.toggle("on",x===bt));
    $("q").placeholder = EJE==="lab" ? "Buscar laboratorio…" : "Buscar proveedor…";
    render();
  }));
  $("q").addEventListener("input", e=>{ Q=e.target.value; if(!SEL) pintarFilas(); });
  $("btn-act").onclick=()=>cargar(true);
  cargar(false);
})();
})();
</script>
</body>
