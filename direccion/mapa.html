<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa del sistema · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#048782; --teal-b:#14B8AC; --agua:#7EE0D6;
    --oro:#F5C46B; --sbase:#3ECF8E; --gh:#B6C2CC; --sat:#7EB6E8; --coral:#F2695C;
    --bg0:#031716; --bg1:#04211F; --line:rgba(126,224,214,.14);
    --txt:#EAF7F5; --gris:#9DBBB7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg0);color:var(--txt);
    font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  canvas{position:fixed;inset:0;display:block;cursor:grab}
  canvas.drag{cursor:grabbing}

  /* ---- barra superior ---- */
  .tbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:14px;
    padding:10px 16px;background:linear-gradient(180deg,rgba(3,23,22,.92),rgba(3,23,22,.55) 70%,transparent);
    pointer-events:none}
  .tbar>*{pointer-events:auto}
  .brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
  .brand .mono{font-weight:900;font-size:21px;letter-spacing:-.5px}
  .brand .mono .y{color:var(--teal-b)}
  .brand .btag{font-size:11px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--agua);opacity:.8}
  .ttl{line-height:1.1}
  .ttl b{font-size:15px;font-weight:800}
  .ttl small{display:block;font-size:11px;color:var(--gris)}
  .spacer{flex:1}
  .chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
  .chip{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;border:1px solid var(--line);
    color:var(--gris);background:rgba(4,33,31,.6);cursor:pointer;user-select:none;white-space:nowrap;transition:all .15s}
  .chip:hover{color:var(--txt)}
  .chip.on{color:#04211F;border-color:transparent}
  .chip.on[data-capa="odoo"]{background:#B583AA}
  .chip.on[data-capa="core"]{background:var(--teal-b)}
  .chip.on[data-capa="supabase"]{background:var(--sbase)}
  .chip.on[data-capa="github"]{background:var(--gh)}
  .chip.on[data-capa="satelite"]{background:var(--sat)}
  .chip.on[data-capa="algoritmo"]{background:var(--coral)}
  .iconbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:rgba(4,33,31,.6);
    color:var(--agua);font-size:15px;display:grid;place-items:center;cursor:pointer;text-decoration:none;transition:all .15s}
  .iconbtn:hover{background:rgba(20,184,172,.18)}
  .iconbtn.on{background:rgba(20,184,172,.3);color:#fff}
  .buscador{position:relative}
  .buscador input{width:190px;padding:7px 12px 7px 30px;border-radius:20px;border:1px solid var(--line);
    background:rgba(4,33,31,.7);color:var(--txt);font-family:inherit;font-size:12.5px;outline:none}
  .buscador input:focus{border-color:var(--teal-b)}
  .buscador::before{content:"🔎";position:absolute;left:9px;top:6px;font-size:12px;opacity:.6}

  /* ---- pista inicial ---- */
  #hint{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:18;
    background:rgba(4,33,31,.9);border:1px solid rgba(126,224,214,.3);border-radius:24px;
    padding:9px 20px;font-size:13.5px;font-weight:600;color:var(--agua);pointer-events:none;
    animation:latir 2.2s ease-in-out infinite;box-shadow:0 6px 30px rgba(0,0,0,.4)}
  @keyframes latir{0%,100%{opacity:.65;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.04)}}
  #hint.chau{display:none}

  /* ---- tooltip ---- */
  #tip{position:fixed;z-index:30;pointer-events:none;display:none;max-width:270px;
    background:rgba(4,33,31,.95);border:1px solid var(--line);border-radius:10px;padding:8px 11px;
    font-size:12px;line-height:1.35;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  #tip b{display:block;font-size:12.5px}
  #tip small{color:var(--gris);font-size:11px}

  /* ---- panel de detalle ---- */
  #panel{position:fixed;top:56px;right:12px;bottom:52px;width:min(400px,calc(100vw - 24px));z-index:25;
    background:rgba(4,33,31,.96);border:1px solid var(--line);border-radius:16px;
    box-shadow:0 12px 50px rgba(0,0,0,.55);display:none;flex-direction:column;overflow:hidden;
    backdrop-filter:blur(6px)}
  #panel.open{display:flex;animation:entra .22s ease}
  @keyframes entra{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
  #panel .ph{display:flex;align-items:center;gap:11px;padding:15px 16px 11px;border-bottom:1px solid var(--line)}
  #panel .ph .pico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none}
  #panel .ph h2{font-size:16.5px;font-weight:800;line-height:1.15}
  #panel .ph small{display:block;font-size:11px;color:var(--gris);margin-top:2px}
  #panel .px{margin-left:auto;flex:none;width:28px;height:28px;border-radius:8px;border:none;background:transparent;
    color:var(--gris);font-size:16px;cursor:pointer}
  #panel .px:hover{color:#fff}
  #panel .pb{overflow-y:auto;padding:14px 16px;font-size:13px;line-height:1.55;color:#D9ECE9}
  #panel .pb::-webkit-scrollbar{width:8px}
  #panel .pb::-webkit-scrollbar-thumb{background:rgba(126,224,214,.2);border-radius:4px}
  #panel .est{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
    border-radius:20px;padding:3px 10px;margin-bottom:10px}
  #panel .est.activo{background:rgba(62,207,142,.15);color:#5FE0A8}
  #panel .est.pruebas{background:rgba(245,196,107,.15);color:var(--oro)}
  #panel .est.futuro{background:rgba(158,187,183,.15);color:var(--gris)}
  #panel h3{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--agua);
    margin:16px 0 7px;display:flex;align-items:center;gap:8px}
  #panel h3::after{content:"";flex:1;height:1px;background:var(--line)}
  #panel ul{list-style:none}
  #panel ul li{padding:3px 0 3px 16px;position:relative;font-size:12.5px}
  #panel ul li::before{content:"·";position:absolute;left:4px;color:var(--teal-b);font-weight:900}
  #panel .formula{background:rgba(3,23,22,.8);border:1px solid rgba(242,105,92,.25);border-left:3px solid var(--coral);
    border-radius:8px;padding:9px 12px;margin:6px 0;font-size:12px;line-height:1.5}
  #panel .formula b{color:#FFB3A8}
  #panel .ruta{background:rgba(245,196,107,.08);border:1px dashed rgba(245,196,107,.35);border-radius:8px;
    padding:8px 12px;margin:4px 0 8px;font-size:12px;color:#F8DCA8}
  #panel .cnx{display:flex;flex-wrap:wrap;gap:6px}
  #panel .cnx span{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:16px;border:1px solid var(--line);
    color:var(--agua);cursor:pointer;transition:all .15s}
  #panel .cnx span:hover{background:rgba(20,184,172,.2);color:#fff}
  #panel .usa{display:flex;flex-wrap:wrap;gap:5px}
  #panel .usa span{font-size:10.5px;font-family:ui-monospace,Consolas,monospace;padding:3px 8px;border-radius:6px;
    background:rgba(3,23,22,.8);border:1px solid var(--line);color:#B9D9D4}
  #panel .ref{margin-top:14px;font-size:11px;color:var(--gris);border-top:1px dashed var(--line);padding-top:9px;word-break:break-all}

  /* ---- pie: la ley ---- */
  .ley{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:12px;
    padding:9px 16px;background:linear-gradient(0deg,rgba(3,23,22,.95),rgba(3,23,22,.6) 75%,transparent);
    font-size:11.5px;color:var(--gris)}
  .ley .lchip{flex:none;font-size:10px;font-weight:900;letter-spacing:1.5px;background:rgba(242,105,92,.16);
    color:#FFB3A8;border-radius:5px;padding:3px 8px}
  .ley .ltxt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ley .ltxt b{color:#D9ECE9}
  .ley button{flex:none;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--agua);background:transparent;
    border:1px solid var(--line);border-radius:16px;padding:4px 12px;cursor:pointer}
  .ley button:hover{background:rgba(20,184,172,.15)}
  .ley .ver{flex:none}

  /* ---- leyenda ---- */
  #leyenda{position:fixed;left:12px;bottom:46px;z-index:15;font-size:10.5px;color:var(--gris);line-height:1.9;
    background:rgba(3,23,22,.55);border-radius:10px;padding:8px 12px;pointer-events:none}
  #leyenda i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

  /* ---- modal ---- */
  #modal{position:fixed;inset:0;z-index:40;background:rgba(2,12,11,.75);display:none;place-items:center;padding:20px}
  #modal.open{display:grid}
  #modal .mbox{width:min(640px,100%);max-height:82vh;display:flex;flex-direction:column;background:var(--bg1);
    border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 80px rgba(0,0,0,.6);overflow:hidden;position:relative}
  #modal .mh{padding:18px 22px 13px;border-bottom:1px solid var(--line)}
  #modal .mh h2{font-size:17px;font-weight:800}
  #modal .mh p{font-size:12.5px;color:var(--gris);margin-top:5px;line-height:1.5}
  #modal .mb{overflow-y:auto;padding:14px 22px 20px;font-size:13px;line-height:1.6}
  #modal .bit{display:flex;gap:14px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:12.5px;line-height:1.5}
  #modal .bit:last-child{border-bottom:none}
  #modal .bit .f{flex:none;font-weight:800;color:var(--agua);font-size:11.5px;padding-top:1px;width:84px}
  #modal .mb ul{list-style:none;margin-top:2px}
  #modal .mb ul li{padding:5px 0 5px 20px;position:relative}
  #modal .mb ul li::before{content:"→";position:absolute;left:0;color:var(--teal-b);font-weight:800}
  #modal .mx{position:absolute;top:14px;right:16px;width:30px;height:30px;border:none;background:transparent;
    color:var(--gris);font-size:18px;cursor:pointer}
  @media (max-width:760px){
    .ttl small,.buscador{display:none}
    .chips{display:none}
    #leyenda{display:none}
  }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=50"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   EyG Core · MAPA DEL SISTEMA — v2 (el cerebro en 3D)
   Odoo es el NÚCLEO, subdividido en los 10 sectores que el Core toca.
   Capas 100% concéntricas: cuanto más cerca del núcleo, más adentro de Odoo
   vive la pieza. Las líneas son conexiones REALES; los pulsos son las señales
   (datos) viajando. Tocá cualquier esfera: se abre su ficha y se enciende su
   ruta verdadera (módulo → odoo-rpc → sector de Odoo).

   ══ LA LEY ══
   Este mapa es el registro maestro del sistema. NINGÚN cambio en Core, Odoo,
   Supabase, GitHub o la web queda terminado hasta estar registrado acá:
   se actualiza el nodo/conexión que corresponda y se agrega una línea a la
   BITÁCORA. Para actualizar: editar SOLO el bloque REGISTRO de abajo
   (MAPA.bitacora, NODOS, ENLACES) — el dibujo se arma solo.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ╔══════════════════════ REGISTRO (editar acá) ══════════════════════╗ */

const MAPA = {
  version: "2.6",
  actualizado: "2026-08-25",
  ley: "Ningún cambio en Core, Odoo, Supabase, GitHub o la web queda terminado hasta quedar registrado en este mapa.",
  bitacora: [
    { f:"2026-08-25", t:"El bot de WhatsApp pasa de contestar a ATENDER (wsp-agente v20). Ahora da los precios reales de la lista de cada cliente en el mismo mensaje, entiende cómo se habla en el mostrador («100 tiras de vent 3», «el más barato»), escucha las notas de voz (Odoo las baja como adjunto y se transcriben con Whisper; se cachean para no pagarlas dos veces) y le va armando el pedido en Odoo a medida que el cliente confirma. El pedido es un presupuesto NUEVO por conversación, queda ABIERTO y nace a nombre del comercial asignado del cliente: el asistente anota, el comercial cierra. Se cuidó cómo se siente del otro lado: visto azul y «escribiendo…» de verdad, respuesta en ~6 segundos (antes 20), viñetas en lugar de textos de corrido, y se habla de «descuento por cantidad», no de escaleras. Y se le puso el freno más importante: no inventa. Dos fallas reales lo motivaron — agarró el número de una compra vieja y le inventó el contenido, y dijo «quedó tomado tu pedido» sin haberlo cargado. Hoy nada existe hasta que la herramienta devuelve el número, y lo que una herramienta no le dio, no lo describe. Nuevas tablas en Supabase: wsp_vistos (lo ya cotizado en cada chat) y wsp_audios (transcripciones). Modelo: sube a claude-sonnet-5 por razonamiento." },
    { f:"2026-08-25", t:"WhatsApp con módulo propio en el Core: nace comunicaciones/whatsapp.html, la bandeja de EyG — lista de conversaciones, chat estilo WhatsApp y respuesta directa del equipo (los mensajes siguen viviendo en Odoo, que es quien habla con Meta, así Core y Odoo ven lo mismo). Trae el interruptor del asistente: encender/apagar, números de prueba (mientras haya, el bot SOLO responde a esos) y «Tomar conversación» (el bot se calla en ese chat; al responder una persona se toma sola). Toda la config vive en el parámetro eyg.wsp_bot, editable desde el Core sin tocar código. Muestra además la ventana de 24 h de WhatsApp: pasada esa hora avisa que solo se puede con plantilla." },
    { f:"2026-08-25", t:"WhatsApp con IA, primera piedra: se conectó el WhatsApp oficial de EyG a Odoo (Meta Cloud API vía el módulo nativo, número 341 280-9081, cuenta «Droguería EyG») y nació wsp-agente, el cerebro MODO CLIENTE — separado del interno a propósito: NO ve costos, márgenes ni deudas, NO da precios (dependen de la lista de cada cliente) y DERIVA al equipo todo lo delicado (plata, reclamos, salud, plazos). Responde por el mismo canal de Odoo (Discuss), así el equipo ve todo donde ya trabaja, y si un humano escribe en la conversación el bot se calla. Frenos: clave secreta en la URL (falla cerrada), interruptor WSP_BOT_ACTIVO apagado por defecto (modo simulacro: piensa y loguea pero no manda) y lista blanca de números para probar. Automatización de Odoo creada DESACTIVADA hasta cargar la clave." },
    { f:"2026-08-25", t:"El cerebro gana MEMORIA TOTAL (eyg-agente v7): 1) historial permanente — cada conversación del Asistente queda guardada en Supabase (tablas agente_conversaciones y agente_mensajes, por usuario) y el HUD suma el panel CONVERSACIONES para retomarlas y el botón nueva conversación; 2) memoria de largo plazo — la libreta permanente y compartida del negocio (tabla agente_memoria): el agente la consulta y la escribe solo con su herramienta memoria (guardar/buscar), con búsqueda difusa indexada pg_trgm (RPC buscar_memoria, el mismo motor veloz del buscador de la tienda). Al ser herramienta no rompe el caché de prompts. RLS cerrado: solo las edge functions acceden. En el HUD: vital MEMORIA, líneas violetas en la bitácora y contador de recuerdos. v8 el mismo día, a pedido de Dirección: la memoria pasa a PLANO OCULTO — las conversaciones viejas se DESTILAN solas a la libreta (un pase barato de Haiku extrae decisiones/acuerdos/reglas y descarta lo trivial, en segundo plano, sin demorar respuestas) y la lista de conversaciones queda guardada pero escondida tras un botón 🕘 HISTORIAL, cerrado por defecto. El agente recuerda lo hablado sin que nadie administre listas." },
    { f:"2026-08-25", t:"El cerebro aprende a gastar poco (eyg-agente v4): las primeras pruebas con IA salían caras (~15 centavos de dólar por consulta) por dos causas — corría el modelo premium (Opus) y sin caché de prompts, así que cada vuelta del razonamiento re-pagaba toda la conversación a precio lleno. Arreglo doble: caché de prompts activada (lo repetido se cobra al ~10%) y modelo por defecto claude-sonnet-5 (calidad casi-Opus a ~la mitad de precio), configurable por el secret EYG_AGENTE_MODELO sin tocar código (claude-haiku-4-5, el más barato, reservado para el futuro WhatsApp). Costo esperado: de ~$0.15 a ~$0.02-0.04 por consulta. De paso se corrige la URL del Core en el mapa: la real es drogueriaeyg.com.ar/core (el subdominio core. no existe)." },
    { f:"2026-08-24", t:"Nace el Asistente EyG (el superagente, Fase 1): un experto interno con IA al que se le pregunta en criollo y responde con datos REALES. Cerebro: edge function eyg-agente (Supabase) que corre Claude con 3 herramientas — Odoo de solo lectura vía odoo-rpc (la puerta única, prioridad absoluta para precios/stock/clientes/deuda), el buscador difuso del catálogo (buscar_web) y búsqueda web con cita de fuente (solo info externa: ANMAT, laboratorios, mercado). Cara: direccion/agente.html, un HUD estilo «Jarvis» (orbe de partículas + vitales del sistema + bitácora de conocimiento en vivo). Guardia doble: JWT del gateway + validación de usuario ACTIVO en core_users (la anon key sola no puede gastar API). EN PRUEBAS para los supers. Falta: cargar ANTHROPIC_API_KEY en los secrets. Fases siguientes: acciones con confirmación → voz → WhatsApp." },
    { f:"2026-08-21", t:"Ofertas que se apagan solas por stock: si el producto de una oferta, descuento o combo se queda sin stock real (qty_available ≤ 0), la oferta desaparece automáticamente del panel de los comerciales, de la tarjeta del líder y del inicio (que además avisa «N ofertas sin stock»), y en Oportunidades y Ofertas queda en gris «Agotada» — no se borra: al reponer stock revive sola, o se elimina con su botón. Chequeo en vivo contra Odoo con helpers compartidos EYG.ofStockMap/ofAgotada en core.js (sin crons nuevos); cache-bust core.js v=35." },
    { f:"2026-08-20", t:"odoo-rpc ascendida a lo que es: la puerta única ahora es un portal de energía (anillo giratorio, halo que respira, nombre siempre visible) con tráfico permanente de señales — todo el tiempo entra un pulso desde algún módulo y sale otro hacia el núcleo por la troncal resaltada." },
    { f:"2026-08-20", t:"Marca Odoo en el núcleo: la esfera central ahora es el violeta oficial (#875A7B) con el logotipo «odoo» reproducido en blanco (4 aros + la d, dibujados a escala). Toda la capa Odoo (sectores, rayos, filtros y leyenda) pasó al violeta de marca." },
    { f:"2026-08-20", t:"Desglose real por módulo: cada ficha ahora lista los modelos exactos de Odoo que ese módulo lee y escribe (extraído del código publicado, no de memoria), más sus parámetros y functions. Con ese análisis se corrigieron rutas: el Panel también toca Personas (hr.employee), Situación crediticia cruza la deuda interna de Odoo además del BCRA, el buscador usa account.tax, y Panel/Cobranzas/Cargar venta también salen por WhatsApp." },
    { f:"2026-08-20", t:"v2 a pedido de Dirección: el núcleo es Odoo subdividido en los 10 sectores que el Core toca; capas concéntricas ordenadas (la distancia al núcleo indica qué tan adentro de Odoo vive cada pieza); al tocar una esfera se enciende su ruta real con señales viajando; pulsos más visibles y cámara que enfoca el nodo elegido." },
    { f:"2026-08-20", t:"Nace el mapa. Inventario completo verificado contra lo publicado: GitHub (repo core), Supabase (8 edge functions, 5 tablas, 3 funciones SQL) y Odoo en vivo (4 acciones de servidor EyG, 3 crons propios + Alfabeta, 7 automatizaciones, 37 parámetros eyg.*)." },
  ],
};

/* Capas: odoo (núcleo + sectores + piezas nuestras dentro de Odoo) · core (lóbulos)
   · supabase (anillos) · github · satelite · algoritmo (sinapsis).
   Cada nodo: id, capa, grp (dónde se dibuja), ico, n (nombre), sub (bajada),
   d (qué es), det (detalles), f (fórmulas), toca (sectores de Odoo que usa,
   para encender la ruta al seleccionarlo), cerca (nodo ancla, para algoritmos),
   ref (archivo o id), est (activo|pruebas|futuro). */

const NODOS = [

/* ───────── EL NÚCLEO: ODOO ───────── */
{ id:"odoo", capa:"odoo", grp:"centro", ico:"🟣", n:"Odoo — el núcleo", sub:"drogueriaeyg.odoo.com · nuestro ERP (sistema de gestión)",
  d:"Acá vive TODO el dato de la droguería. «ERP» no es una conexión: es el tipo de sistema que Odoo es (un sistema de gestión empresarial). La conexión entre el Core y Odoo es odoo-rpc, la puerta única que está en Supabase. El núcleo está subdividido en los 10 sectores que el Core toca — las esferitas doradas pegadas al centro.",
  det:[
    "19.693 productos activos en 6 familias raíz: HOSPITALARIOS, FARMACOPEA, DESCARTABLES, ÉTICOS, PERFUMERÍA, ORTOPEDIA y EQUIPOS MÉDICOS",
    "16 personas en 4 áreas · permisos cruzados (quien carga no concilia)",
    "El Core NO guarda datos de negocio propios: todo se lee y se escribe acá",
  ], est:"activo" },

/* Los 10 sectores de Odoo que el Core toca (la subdivisión del núcleo) */
{ id:"sec-ventas", capa:"odoo", grp:"sector", ico:"🤝", n:"Ventas", sub:"sector de Odoo · sale.order + equipos CRM",

{ id:"fn-agente", capa:"supabase", grp:"ringA", ico:"✨", n:"eyg-agente · el cerebro", sub:"edge function — Claude (IA) + herramientas",
  d:"El cerebro del Asistente EyG: recibe la pregunta, piensa con Claude y resuelve con herramientas — Odoo de solo lectura (vía odoo-rpc, la puerta única), el buscador difuso del catálogo y búsqueda web con cita de fuente. Guardia doble: además del JWT, valida que el que pregunta sea un usuario ACTIVO de core_users.",
  det:["Jerarquía de fuentes en el system prompt: Odoo manda, la web nunca responde datos internos","Métodos Odoo permitidos: search_read, read, search_count, fields_get (solo lectura)","v4-v6: caché de prompts (lo repetido al ~10%) + modelo configurable por secret EYG_AGENTE_MODELO — default claude-haiku-4-5; la búsqueda web elige sola la variante compatible","v7-v9: MEMORIA VIVA — guarda cada conversación (historial por usuario, oculto tras 🕘 HISTORIAL) + libreta permanente compartida (herramienta memoria, índice pg_trgm) + destilado automático (al abrir charla nueva corre ANTES de responder, así lo hablado ayer ya está en memoria). v9 arregló el guardado: el insert del par pregunta+respuesta iba con columnas desparejas y PostgREST lo rechazaba en silencio","Secrets: ANTHROPIC_API_KEY (obligatorio) · EYG_AGENTE_MODELO (opcional)"], est:"pruebas" },
{ id:"fn-wsp-agente", capa:"supabase", grp:"ringA", ico:"💬", n:"wsp-agente · cerebro modo cliente", sub:"edge function — el bot de WhatsApp",
  d:"El asistente que atiende a los CLIENTES por WhatsApp. Lo dispara una automatización de Odoo cuando entra un mensaje; piensa con Claude (Sonnet 5) y responde por el canal de Odoo. ATIENDE, no deriva: pasa precios reales de la lista de ESE cliente, escucha notas de voz y le va armando el pedido. Nunca ve costos, márgenes ni deuda, y nunca da indicaciones médicas.",
  det:["Frenos: clave en la URL (falla cerrada) · interruptor y lista blanca en el parámetro eyg.wsp_bot (editable desde el Core) · si escribe una persona, el bot se calla","Velocidad: ~6 s una respuesta simple, ~10-12 s si busca precios. Todas las consultas a Odoo van en UNA sola tanda, y el catálogo guarda el id de plantilla de Odoo, así precio y stock se piden juntos","Presencia: visto azul + «escribiendo…» nativo de WhatsApp (Graph API con el token de whatsapp.account), encendido solo cuando ya sabe que va a contestar — si no, quedaba tipeando para siempre","Notas de voz: Odoo las baja como adjunto y se transcriben con Whisper (secret OPENAI_API_KEY), cacheadas en wsp_audios. Sin la clave avisa que no pudo escucharlas","Memoria del chat: lo cotizado queda en wsp_vistos, para reconocer al producto cuando el cliente lo nombra a su manera («vent 3», «las tiras», «el barato»)","El pedido: presupuesto NUEVO por conversación, se va llenando renglón a renglón, queda ABIERTO y a nombre del comercial asignado del cliente. El asistente nunca confirma","Regla de oro: nada está anotado hasta que la herramienta devuelve el número de pedido; y no describe lo que una herramienta no le dio","Banco de pruebas: POST {simular:{canal,texto}} corre con el contexto real sin enviar nada ni tocar Odoo","verify_jwt=false a propósito (Odoo no manda credencial de Supabase); autentica con su propia clave"], est:"pruebas" },

/* ═══════════ GEOMETRÍA — capas concéntricas (radio = qué tan adentro vive) ═══════════
   0 ...... Odoo (el núcleo)
   62 ..... sectores de Odoo (la subdivisión del núcleo)
   118 .... la corteza: nuestras piezas construidas DENTRO de Odoo
   ~140 ... algoritmos anclados al motor (sinapsis internas)
   178/206  anillos Supabase (functions / datos+auth)
   268 .... lóbulos del Core (los 10 departamentos)
   306 .... módulos de cada lóbulo
   ~345 ... algoritmos anclados a módulos del Core
   418+ ... GitHub y satélites (la web, BCRA, Alfabeta, WhatsApp, rutinas, padrón) */
const D2R = Math.PI/180, GA = 2.399963229728653; /* ángulo áureo */
function xyz(th, ph, r){ th*=D2R; ph*=D2R; return { x:r*Math.cos(ph)*Math.cos(th), y:r*Math.sin(ph), z:r*Math.cos(ph)*Math.sin(th) }; }
/* distribución pareja sobre una esfera (espiral de Fibonacci) */
function fib(i, n, R, rot){ const y=1-2*(i+.5)/n, rr=Math.sqrt(Math.max(0,1-y*y)), th=i*GA+(rot||0);
  return { x:R*rr*Math.cos(th), y:R*y, z:R*rr*Math.sin(th) }; }
/* punto i de un anillo de radio R inclinado `tilt` grados */
function anillo(i, n, R, tilt, fase){ const t=(i/n)*Math.PI*2+(fase||0), s=Math.sin(tilt*D2R), c=Math.cos(tilt*D2R);
  return { x:R*Math.cos(t), y:-R*Math.sin(t)*s, z:R*Math.sin(t)*c }; }

const FAN = [[0,0],[-16,12],[16,12],[-16,-13],[16,-13],[0,23],[0,-23],[-29,0],[29,0]];

function ubicar(){
  const porGrp={}, porLobo={};
  NODOS.forEach(nd=>{ (porGrp[nd.grp]=porGrp[nd.grp]||[]).push(nd); if(nd.grp==="mod") (porLobo[nd.lobo]=porLobo[nd.lobo]||[]).push(nd); });
  const porId={}; NODOS.forEach(n=>porId[n.id]=n);

  /* primero todo lo que no depende de un ancla */
  NODOS.forEach(nd=>{
    const i=porGrp[nd.grp].indexOf(nd), n=porGrp[nd.grp].length;
    if(nd.grp==="centro"){ nd.p={x:0,y:0,z:0}; nd.rad=40; }
    else if(nd.grp==="sector"){ nd.p=fib(i,n,62,.6); nd.rad=8; }
    else if(nd.grp==="corteza"){ nd.p=fib(i,n,118,2.1); nd.rad=10; }
    else if(nd.grp==="ringA"){ nd.p=anillo(i,n,178,18,0); nd.rad = nd.id==="odoo-rpc"? 15 : 10; }
    else if(nd.grp==="ringB"){ nd.p=anillo(i,n,206,-24,.4); nd.rad=9; }
    else if(nd.grp==="lobo"){ nd.p=fib(i,n,268,4.2); nd.rad=14;
      const th=Math.atan2(nd.p.z,nd.p.x)/D2R, ph=Math.asin(nd.p.y/268)/D2R;
      nd._dir=[th,ph]; }
    else if(nd.grp==="gh"){ const off=[[0,0],[13,9],[-13,9]][i]||[0,0]; nd.p=xyz(206+off[0],46+off[1],418); nd.rad=i===0?13:10; }
    else if(nd.grp==="sat"){ nd.p=xyz(i*(360/n)+15,(i%2? -33:33),434); nd.rad=11; }
  });
  /* módulos: abanico alrededor de la dirección real de su lóbulo */
  NODOS.forEach(nd=>{
    if(nd.grp!=="mod") return;
    const L=NODOS.find(x=>x.grp==="lobo"&&x.lobo===nd.lobo); const dir=L._dir;
    const k=porLobo[nd.lobo].indexOf(nd); const off=FAN[(k+1)%FAN.length];
    nd.p=xyz(dir[0]+off[0],dir[1]+off[1],306); nd.rad=9.5;
  });
  /* algoritmos: orbitan cerquita de su nodo ancla (`cerca`) */
  const cnt={};
  NODOS.forEach(nd=>{
    if(nd.grp!=="alg") return;
    const a=porId[nd.cerca]; const k=(cnt[nd.cerca]=(cnt[nd.cerca]||0)+1);
    const th=Math.atan2(a.p.z,a.p.x)/D2R, r0=Math.hypot(a.p.x,a.p.y,a.p.z),
          ph=Math.asin(a.p.y/(r0||1))/D2R;
    const off=[[14,16],[-14,-16],[22,0],[0,22]][(k-1)%4];
    nd.p=xyz(th+off[0],ph+off[1],r0+34); nd.rad=8.5;
  });
}

/* ═══════════ RENDER 3D ═══════════ */
/* Marca Odoo: violeta oficial #875A7B (el del logo); tonos más claros para nodos chicos y textos */
const COLOR = { odoo:"#B583AA", core:"#14B8AC", supabase:"#3ECF8E", github:"#B6C2CC", satelite:"#7EB6E8", algoritmo:"#F2695C" };
const ECOLOR = { dato:"rgba(126,224,214,", config:"rgba(245,196,107,", deploy:"rgba(182,194,204,", sinapsis:"rgba(242,105,92," };

let cv, cx, W, H, DPR;
const cam = { yaw:.55, pitch:.24, zoom:1, F:980, auto:true };
let anim=null; /* animación de cámara al enfocar */
let hover=null, sel=null, rutasSel=[], filtro=new Set(["odoo","core","supabase","github","satelite","algoritmo"]), busca="", labels=false;
const porId={}; NODOS.forEach(n=>porId[n.id]=n);
const STARS=[]; for(let i=0;i<170;i++) STARS.push({x:Math.random(),y:Math.random(),r:Math.random()*1.1+.2,a:Math.random()*.4+.1});
const PULSOS=[]; let ultimoPulsoRuta=0, ultimoTrafico=0;
/* todos los módulos/functions que entran por la puerta única (para el tráfico permanente) */
const RPC_FEEDERS = ENLACES.filter(e=>e[1]==="odoo-rpc").map(e=>e[0]);

function rot3(p){
  const cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw), cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  let x=p.x*cy+p.z*sy, z=-p.x*sy+p.z*cy, y=p.y*cp-z*sp; z=p.y*sp+z*cp;
  return {x,y,z};
}
function proj(p){ const r=rot3(p); const s=cam.F/(cam.F+r.z)*cam.zoom; return { x:W/2+r.x*s, y:H/2-r.y*s, s, z:r.z }; }
function visible(nd){ return filtro.has(nd.capa); }
function match(nd){ if(!busca) return true; const q=busca.toLowerCase(); return (nd.n+" "+(nd.sub||"")+" "+nd.id).toLowerCase().includes(q); }
function apagado(nd){ return !visible(nd) || !match(nd); }
function qbez(pa,pb){ return {mx:(pa.x+pb.x)/2, my:(pa.y+pb.y)/2 - 14*((pa.s+pb.s)/2)}; }

/* guías orbitales: círculos concéntricos que ordenan la lectura */
const GUIAS=[ {R:118,tilt:8,col:"rgba(181,131,170,"}, {R:178,tilt:18,col:"rgba(62,207,142,"},
              {R:206,tilt:-24,col:"rgba(62,207,142,"}, {R:268,tilt:-6,col:"rgba(20,184,172,"},
              {R:434,tilt:12,col:"rgba(126,224,214,"} ];

/* El logotipo «odoo» reproducido a mano: 4 aros + el palito de la d, con trazo
   redondeado como el original. Escala con la esfera, así siempre queda nítido. */
function logoOdoo(x,y,R){
  /* proporción del logo real: el logotipo ocupa ~60% del diámetro del círculo */
  const h=R*.28, r0=h*.5, w=h*.38, gap=r0*2.35, rr=r0-w/2+w*.18;
  const yy=y+R*.07; /* baja apenas los aros para centrar ópticamente con el ascendente de la d */
  cx.save();
  cx.strokeStyle="rgba(255,255,255,.96)"; cx.lineWidth=w; cx.lineCap="round";
  [-1.5,-0.5,0.5,1.5].forEach(k=>{ cx.beginPath(); cx.arc(x+k*gap,yy,rr,0,Math.PI*2); cx.stroke(); });
  const dx=x-0.5*gap+rr; /* la d es el 2º aro: su palito sube pegado al borde derecho */
  cx.beginPath(); cx.moveTo(dx,yy); cx.lineTo(dx,yy-h*1.18); cx.stroke();
  cx.restore();
}

function dibujar(t){
  cx.clearRect(0,0,W,H);
  const g=cx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.75);
  g.addColorStop(0,"#06302C"); g.addColorStop(.55,"#04211F"); g.addColorStop(1,"#020F0E");
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
  cx.fillStyle="#9FE8DF";
  STARS.forEach(s=>{ cx.globalAlpha=s.a*(0.6+0.4*Math.sin(t/1400+s.x*20)); cx.beginPath(); cx.arc(s.x*W,s.y*H,s.r,0,7); cx.fill(); });
  cx.globalAlpha=1;

  /* guías orbitales (la esfera ordenada) */
  GUIAS.forEach(gu=>{
    cx.strokeStyle=gu.col+(sel?".03":".06")+")"; cx.lineWidth=1; cx.beginPath();
    for(let k=0;k<=90;k++){ const q=proj(anillo(k,90,gu.R,gu.tilt,0)); if(k===0)cx.moveTo(q.x,q.y);else cx.lineTo(q.x,q.y); }
    cx.stroke();
  });

  const P={}; NODOS.forEach(nd=>P[nd.id]=proj(nd.p));

  /* halo de cada lóbulo */
  NODOS.filter(n=>n.grp==="lobo").forEach(nd=>{
    if(apagado(nd)) return; const q=P[nd.id]; const R=62*q.s;
    const hg=cx.createRadialGradient(q.x,q.y,0,q.x,q.y,R);
    hg.addColorStop(0,"rgba(20,184,172,.12)"); hg.addColorStop(1,"rgba(20,184,172,0)");
    cx.fillStyle=hg; cx.beginPath(); cx.arc(q.x,q.y,R,0,7); cx.fill();
  });

  /* rayos del núcleo hacia sus sectores (la subdivisión) */
  NODOS.filter(n=>n.grp==="sector").forEach(nd=>{
    if(apagado(nd)) return; const q=P[nd.id], c=P["odoo"];
    cx.strokeStyle="rgba(181,131,170,"+(sel&&sel.id!==nd.id&&sel.id!=="odoo"?".07":".26")+")";
    cx.lineWidth=1; cx.beginPath(); cx.moveTo(c.x,c.y); cx.lineTo(q.x,q.y); cx.stroke();
  });

  /* enlaces */
  const selSet = sel? new Set([sel.id]) : null;
  ENLACES.forEach(e=>{
    const a=porId[e[0]], b=porId[e[1]]; if(!a||!b) return;
    if(apagado(a)||apagado(b)) return;
    const pa=P[a.id], pb=P[b.id]; const tipo=e[2]||"dato";
    const liga = selSet && (selSet.has(a.id)||selSet.has(b.id));
    const troncal = e[0]==="odoo-rpc" && e[1]==="odoo"; /* la arteria principal, siempre marcada */
    const depth=Math.max(0,Math.min(1,((pa.z+pb.z)/2+400)/800));
    let al = sel? (liga? .85 : (troncal? .25 : .03)) : (hover&&(hover.id===a.id||hover.id===b.id)? .7 : .10+.10*(1-depth));
    if(troncal && !sel) al=Math.max(al,.5);
    cx.strokeStyle=(troncal?"rgba(62,207,142,":ECOLOR[tipo])+al+")"; cx.lineWidth=troncal?2.2:(liga?1.6:.8);
    const {mx,my}=qbez(pa,pb);
    cx.beginPath(); cx.moveTo(pa.x,pa.y); cx.quadraticCurveTo(mx,my,pb.x,pb.y); cx.stroke();
  });

  /* rutas encendidas del nodo elegido (módulo → odoo-rpc → sector) */
  rutasSel.forEach(r=>{
    const pa=P[r[0]], pb=P[r[1]]; if(!pa||!pb) return;
    const {mx,my}=qbez(pa,pb);
    cx.strokeStyle="rgba(245,196,107,.9)"; cx.lineWidth=2;
    cx.shadowColor="rgba(245,196,107,.8)"; cx.shadowBlur=6;
    cx.beginPath(); cx.moveTo(pa.x,pa.y); cx.quadraticCurveTo(mx,my,pb.x,pb.y); cx.stroke();
    cx.shadowBlur=0;
  });

  /* ── pulsos: las señales que recorren las conexiones ── */
  /* tráfico PERMANENTE por la puerta única: siempre entra una señal de algún
     módulo a odoo-rpc y sale otra hacia el núcleo — la arteria nunca duerme */
  if(t-ultimoTrafico>340 && !apagado(porId["odoo-rpc"]) && !apagado(porId["odoo"])){
    ultimoTrafico=t;
    const m=RPC_FEEDERS[Math.floor(Math.random()*RPC_FEEDERS.length)];
    if(m && porId[m] && !apagado(porId[m]))
      PULSOS.push({a:m,b:"odoo-rpc",col:"rgba(126,224,214,",t:0,v:.015,tr:[]});
    PULSOS.push({a:"odoo-rpc",b:"odoo",col:"rgba(62,207,142,",t:0,v:.019,tr:[],grande:true});
  }
  /* actividad de fondo */
  if(Math.random()<.14 && PULSOS.length<34){
    const e=ENLACES[Math.floor(Math.random()*ENLACES.length)];
    if(e){ const a=porId[e[0]], b=porId[e[1]]; if(a&&b&&!apagado(a)&&!apagado(b)&&!sel)
      PULSOS.push({a:e[0],b:e[1],col:ECOLOR[e[2]||"dato"],t:0,v:.007+Math.random()*.009,tr:[]}); }
  }
  /* tren constante de señales por la ruta del nodo elegido */
  if(rutasSel.length && t-ultimoPulsoRuta>260){
    ultimoPulsoRuta=t;
    rutasSel.forEach(r=>PULSOS.push({a:r[0],b:r[1],col:"rgba(245,196,107,",t:0,v:.014,tr:[],grande:true}));
  }
  for(let i=PULSOS.length-1;i>=0;i--){
    const p=PULSOS[i]; p.t+=p.v; if(p.t>=1){PULSOS.splice(i,1);continue;}
    const a=porId[p.a], b=porId[p.b]; if(!a||!b||apagado(a)||apagado(b)){PULSOS.splice(i,1);continue;}
    const pa=P[a.id], pb=P[b.id]; const {mx,my}=qbez(pa,pb);
    const u=p.t, x=(1-u)*(1-u)*pa.x+2*(1-u)*u*mx+u*u*pb.x, y=(1-u)*(1-u)*pa.y+2*(1-u)*u*my+u*u*pb.y;
    p.tr.push([x,y]); if(p.tr.length>7) p.tr.shift();
    /* cola que se apaga */
    p.tr.forEach((q,k)=>{ const f=(k+1)/p.tr.length;
      cx.fillStyle=p.col+(.5*f)+")"; cx.beginPath(); cx.arc(q[0],q[1],(p.grande?2.6:1.9)*f,0,7); cx.fill(); });
    /* cabeza brillante con halo */
    cx.fillStyle=p.col+"1)"; cx.beginPath(); cx.arc(x,y,p.grande?3:2.2,0,7); cx.fill();
    cx.fillStyle=p.col+".22)"; cx.beginPath(); cx.arc(x,y,p.grande?9:6,0,7); cx.fill();
  }

  /* nodos, de atrás hacia adelante */
  const orden=[...NODOS].sort((a,b)=>P[b.id].z-P[a.id].z);
  orden.forEach(nd=>{
    const q=P[nd.id]; const r=nd.rad*q.s; const col=COLOR[nd.capa];
    const off=apagado(nd);
    cx.globalAlpha = off? .07 : Math.max(.25, Math.min(1, .55+.45*q.s));
    if(nd.id==="odoo"){
      /* el núcleo ES el logo de Odoo: esfera violeta #875A7B con el logotipo blanco */
      const R=r*(1.02+.03*Math.sin(t/900));
      const ng=cx.createRadialGradient(q.x,q.y,0,q.x,q.y,R*2.6);
      ng.addColorStop(0,"rgba(135,90,123,.6)"); ng.addColorStop(.35,"rgba(135,90,123,.18)"); ng.addColorStop(1,"rgba(135,90,123,0)");
      cx.fillStyle=ng; cx.beginPath(); cx.arc(q.x,q.y,R*2.6,0,7); cx.fill();
      const cg=cx.createRadialGradient(q.x-R*.3,q.y-R*.3,R*.1,q.x,q.y,R);
      cg.addColorStop(0,"#C9A3BF"); cg.addColorStop(.55,"#875A7B"); cg.addColorStop(1,"#4A2F44");
      cx.fillStyle=cg; cx.beginPath(); cx.arc(q.x,q.y,R,0,7); cx.fill();
      logoOdoo(q.x,q.y,R);
    } else if(nd.id==="odoo-rpc"){
      /* LA PUERTA ÚNICA: un portal de energía, no una bolita más.
         Halo que respira + anillo giratorio + núcleo brillante + ⚡ */
      const lat=.7+.3*Math.sin(t/320);
      const hg=cx.createRadialGradient(q.x,q.y,0,q.x,q.y,r*3.1);
      hg.addColorStop(0,"rgba(62,207,142,"+(.5*lat)+")"); hg.addColorStop(.5,"rgba(62,207,142,"+(.14*lat)+")"); hg.addColorStop(1,"rgba(62,207,142,0)");
      cx.fillStyle=hg; cx.beginPath(); cx.arc(q.x,q.y,r*3.1,0,7); cx.fill();
      cx.strokeStyle="rgba(62,207,142,.95)"; cx.lineWidth=Math.max(1.4,r*.15); cx.lineCap="round";
      for(let k=0;k<3;k++){ const a0=t/650+k*2.094; cx.beginPath(); cx.arc(q.x,q.y,r*1.32,a0,a0+1.25); cx.stroke(); }
      cx.strokeStyle="rgba(255,255,255,"+(.5+.3*lat)+")"; cx.lineWidth=1.1;
      cx.beginPath(); cx.arc(q.x,q.y,r*.98,0,7); cx.stroke();
      const cg=cx.createRadialGradient(q.x-r*.2,q.y-r*.22,r*.05,q.x,q.y,r*.8);
      cg.addColorStop(0,"#EAFFF4"); cg.addColorStop(.5,"#7FF0C0"); cg.addColorStop(1,"#1F8F63");
      cx.fillStyle=cg; cx.beginPath(); cx.arc(q.x,q.y,r*.8,0,7); cx.fill();
      cx.font=`${Math.round(r*.85)}px serif`; cx.textAlign="center"; cx.textBaseline="middle";
      cx.fillText("⚡",q.x,q.y+1);
    } else {
      const hg=cx.createRadialGradient(q.x,q.y,0,q.x,q.y,r*2.4);
      hg.addColorStop(0,col+"66"); hg.addColorStop(1,col+"00");
      cx.fillStyle=hg; cx.beginPath(); cx.arc(q.x,q.y,r*2.4,0,7); cx.fill();
      cx.fillStyle=col; cx.beginPath(); cx.arc(q.x,q.y,r,0,7); cx.fill();
      cx.fillStyle="rgba(255,255,255,.32)"; cx.beginPath(); cx.arc(q.x-r*.28,q.y-r*.3,r*.42,0,7); cx.fill();
      cx.strokeStyle="rgba(2,15,14,.4)"; cx.lineWidth=.8; cx.beginPath(); cx.arc(q.x,q.y,r,0,7); cx.stroke();
    }
    if((sel&&sel.id===nd.id)||(hover&&hover.id===nd.id)){
      cx.strokeStyle="#fff"; cx.lineWidth=1.6; cx.beginPath(); cx.arc(q.x,q.y,r+3.5,0,7); cx.stroke();
    }
    if(r>7 && !off && nd.id!=="odoo" && nd.id!=="odoo-rpc"){ /* núcleo y puerta tienen dibujo propio */
      cx.font=`${Math.round(r*1.05)}px serif`; cx.textAlign="center"; cx.textBaseline="middle";
      cx.fillText(nd.ico,q.x,q.y+1);
    }
    const conLabel = nd.grp==="lobo"||nd.grp==="centro"||nd.grp==="gh"&&nd.id==="gh"||nd.grp==="sat"
      ||nd.id==="odoo-rpc" /* la puerta única siempre lleva nombre */
      ||(nd.grp==="sector"&&(cam.zoom>1.25||labels))
      ||labels||(sel&&sel.id===nd.id)||(hover&&hover.id===nd.id);
    if(conLabel && !off && q.s>.45){
      const esLobo=nd.grp==="lobo", txt=esLobo? nd.n.toUpperCase() : nd.n;
      cx.font=`${esLobo||nd.grp==="centro"?800:600} ${Math.max(9,Math.round((esLobo?10:10.5)*Math.min(q.s,1.15)))}px Archivo`;
      cx.textAlign="center"; cx.textBaseline="top";
      const ly=q.y+r+(nd.id==="odoo-rpc"?9:5);
      cx.fillStyle="rgba(3,23,22,.75)";
      const tw=cx.measureText(txt).width;
      cx.fillRect(q.x-tw/2-4,ly-1,tw+8,14*Math.min(q.s,1.15)+2);
      cx.fillStyle= esLobo? "#8FD8CE" : nd.grp==="sector"? "#E3C6DC" : nd.id==="odoo-rpc"? "#A9F5D2" : "#D9ECE9";
      cx.fillText(txt,q.x,ly);
    }
    cx.globalAlpha=1;
  });
  nodosProyectados=orden.map(nd=>({nd,q:P[nd.id]}));
}

let nodosProyectados=[];
function nodoEn(mx,my){
  for(let i=nodosProyectados.length-1;i>=0;i--){
    const {nd,q}=nodosProyectados[i]; if(apagado(nd)) continue;
    const r=Math.max(nd.rad*q.s,10)+5;
    if((mx-q.x)**2+(my-q.y)**2 < r*r) return nd;
  }
  return null;
}

/* ═══════════ ENFOQUE DE CÁMARA ═══════════ */
function enfocar(nd){
  if(nd.grp==="centro") return;
  const p=nd.p, phi=Math.atan2(p.z,p.x);
  const yaw1=phi+Math.PI/2; /* deja el nodo centrado y de frente */
  /* mejor pitch: probamos y nos quedamos con el que lo trae más adelante */
  let best=cam.pitch, bz=1e9;
  for(let pp=-1.15;pp<=1.15;pp+=.02){
    const cy=Math.cos(yaw1), sy=Math.sin(yaw1);
    let z=-p.x*sy+p.z*cy; const zz=p.y*Math.sin(pp)+z*Math.cos(pp);
    if(zz<bz){ bz=zz; best=pp; }
  }
  const norm=a=>{ while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI; return a; };
  anim={ y0:cam.yaw, p0:cam.pitch, z0:cam.zoom,
         dy:norm(yaw1-cam.yaw), dp:best-cam.pitch, dz:Math.max(cam.zoom,1.15)-cam.zoom,
         t0:performance.now(), dur:750 };
  cam.auto=false; actAuto();
}

/* ═══════════ PANEL DE DETALLE ═══════════ */
const nombreCapa={odoo:"Núcleo Odoo",core:"EyG Core",supabase:"Supabase",github:"GitHub",satelite:"Satélite",algoritmo:"Algoritmo propio"};
function armarRutas(nd){
  rutasSel=[];
  if(nd.toca){ nd.toca.forEach(s=>{ if(nd.id!=="odoo-rpc") rutasSel.push([nd.id,"odoo-rpc"]); rutasSel.push(["odoo-rpc",s]); }); }
  if(nd.grp==="sector"){ /* al elegir un sector: quién lo toca */
    NODOS.forEach(x=>{ if(x.toca&&x.toca.includes(nd.id)){ if(x.id!=="odoo-rpc") rutasSel.push([x.id,"odoo-rpc"]); } });
    rutasSel.push(["odoo-rpc",nd.id]);
  }
  /* sin duplicados */
  const vist=new Set(); rutasSel=rutasSel.filter(r=>{ const k=r[0]+">"+r[1]; if(vist.has(k))return false; vist.add(k); return true; });
}
function abrirPanel(nd, sinFoco){
  sel=nd; armarRutas(nd);
  document.getElementById("hint").classList.add("chau");
  if(!sinFoco) enfocar(nd);
  const el=document.getElementById("panel");
  const cnx=[]; ENLACES.forEach(e=>{ if(e[0]===nd.id&&porId[e[1]]) cnx.push(porId[e[1]]); if(e[1]===nd.id&&porId[e[0]]) cnx.push(porId[e[0]]); });
  if(nd.toca) nd.toca.forEach(s=>{ if(porId[s]) cnx.push(porId[s]); });
  if(nd.grp==="sector") NODOS.forEach(x=>{ if(x.toca&&x.toca.includes(nd.id)) cnx.push(x); });
  const est=nd.est||"activo";
  const estTxt={activo:"Activo",pruebas:"En pruebas",futuro:"Por construir"}[est];
  document.getElementById("p-ico").textContent=nd.ico;
  document.getElementById("p-ico").style.background=COLOR[nd.capa]+"26";
  document.getElementById("p-tit").textContent=nd.n;
  document.getElementById("p-sub").textContent=(nd.sub||"")+" · "+nombreCapa[nd.capa];
  let h=`<span class="est ${est}">${estTxt}</span><p>${nd.d||""}</p>`;
  if(nd.toca&&nd.toca.length)
    h+=`<div class="ruta" style="margin-top:10px">⚡ Su ruta está encendida en el mapa: ${nd.id==="odoo-rpc"?"":"pasa por <b>odoo-rpc</b> y "}toca ${nd.toca.length===1?"el sector":"los sectores"} ${nd.toca.map(s=>"<b>"+(porId[s]?porId[s].n:s)+"</b>").join(", ")} de Odoo.</div>`;
  if(nd.det&&nd.det.length) h+=`<h3>Detalles</h3><ul>${nd.det.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  if(nd.f&&nd.f.length) h+=`<h3>Fórmulas y reglas</h3>${nd.f.map(x=>`<div class="formula">${x}</div>`).join("")}`;
  if(nd.usa&&nd.usa.length) h+=`<h3>Qué toca exactamente (sacado del código)</h3><div class="usa">${nd.usa.map(u=>`<span>${u}</span>`).join("")}</div>`;
  if(cnx.length){
    const unicos=[...new Map(cnx.map(c=>[c.id,c])).values()];
    h+=`<h3>Conexiones (${unicos.length})</h3><div class="cnx">${unicos.map(c=>`<span data-go="${c.id}">${c.ico} ${c.n}</span>`).join("")}</div>`;
  }
  if(nd.ref) h+=`<div class="ref">📎 ${nd.ref}</div>`;
  const pb=document.getElementById("p-body"); pb.innerHTML=h; pb.scrollTop=0;
  pb.querySelectorAll("[data-go]").forEach(s=>s.onclick=()=>abrirPanel(porId[s.dataset.go]));
  el.classList.add("open");
}
function cerrarPanel(){ sel=null; rutasSel=[]; document.getElementById("panel").classList.remove("open"); }

/* ═══════════ INTERACCIÓN ═══════════ */
function armar(){
  cv=document.getElementById("cv"); cx=cv.getContext("2d");
  const fit=()=>{ DPR=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
    cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+"px"; cv.style.height=H+"px"; cx.setTransform(DPR,0,0,DPR,0,0); };
  fit(); addEventListener("resize",fit);

  let drag=null;
  cv.addEventListener("pointerdown",e=>{ drag={x:e.clientX,y:e.clientY,mov:false}; cv.setPointerCapture(e.pointerId); cv.classList.add("drag"); });
  cv.addEventListener("pointermove",e=>{
    if(drag){
      const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
      if(Math.abs(dx)+Math.abs(dy)>6) drag.mov=true;
      if(drag.mov){ anim=null; cam.yaw+=dx*.0045; cam.pitch=Math.max(-1.2,Math.min(1.2,cam.pitch+dy*.0038));
        cam.auto=false; actAuto(); }
      drag.x=e.clientX; drag.y=e.clientY;
    } else {
      hover=nodoEn(e.clientX,e.clientY);
      const tip=document.getElementById("tip");
      if(hover){ tip.style.display="block";
        tip.innerHTML=`<b>${hover.ico} ${hover.n}</b><small>${hover.sub||nombreCapa[hover.capa]} · tocá para ver la ficha</small>`;
        tip.style.left=Math.min(e.clientX+14,W-290)+"px"; tip.style.top=(e.clientY+14)+"px";
        cv.style.cursor="pointer";
      } else { tip.style.display="none"; cv.style.cursor="grab"; }
    }
  });
  cv.addEventListener("pointerup",e=>{
    cv.classList.remove("drag");
    if(drag&&!drag.mov){ const nd=nodoEn(e.clientX,e.clientY); if(nd) abrirPanel(nd); else cerrarPanel(); }
    drag=null;
  });
  cv.addEventListener("wheel",e=>{ e.preventDefault(); cam.zoom=Math.max(.45,Math.min(3.2,cam.zoom*(e.deltaY<0?1.1:.9))); },{passive:false});

  document.querySelectorAll(".chip[data-capa]").forEach(ch=>{
    ch.onclick=()=>{ const c=ch.dataset.capa;
      if(filtro.has(c)&&filtro.size===1){ filtro=new Set(Object.keys(COLOR)); }
      else if(filtro.size===Object.keys(COLOR).length){ filtro=new Set([c]); }
      else if(filtro.has(c)) filtro.delete(c); else filtro.add(c);
      document.querySelectorAll(".chip[data-capa]").forEach(x=>x.classList.toggle("on",filtro.has(x.dataset.capa)));
    };
  });
  document.getElementById("q").addEventListener("input",e=>{ busca=e.target.value.trim(); });
  document.getElementById("q").addEventListener("keydown",e=>{
    if(e.key==="Enter"&&busca){ const nd=NODOS.find(n=>visible(n)&&match(n)); if(nd) abrirPanel(nd); }
  });
  document.getElementById("b-auto").onclick=()=>{ cam.auto=!cam.auto; if(cam.auto)anim=null; actAuto(); };
  document.getElementById("b-tags").onclick=()=>{ labels=!labels; document.getElementById("b-tags").classList.toggle("on",labels); };
  document.getElementById("b-fs").onclick=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); };
  document.getElementById("b-bit").onclick=()=>verModal("bitacora");
  document.getElementById("b-como").onclick=()=>verModal("como");
  document.getElementById("m-x").onclick=()=>document.getElementById("modal").classList.remove("open");
  document.getElementById("modal").onclick=e=>{ if(e.target.id==="modal") e.target.classList.remove("open"); };
  document.getElementById("p-x").onclick=cerrarPanel;
  addEventListener("keydown",e=>{ if(e.key==="Escape"){ cerrarPanel(); document.getElementById("modal").classList.remove("open"); } });

  document.getElementById("ley-txt").innerHTML =
    `<b>LEY DEL MAPA:</b> ${MAPA.ley} · <b>v${MAPA.version}</b> · actualizado ${MAPA.actualizado}`;

  let last=0;
  const loop=t=>{
    if(anim){ const u=Math.min(1,(t-anim.t0)/anim.dur), e=1-Math.pow(1-u,3);
      cam.yaw=anim.y0+anim.dy*e; cam.pitch=anim.p0+anim.dp*e; cam.zoom=anim.z0+anim.dz*e;
      if(u>=1) anim=null; }
    else if(cam.auto) cam.yaw+=.0011*Math.min(t-last,50);
    last=t; dibujar(t); requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
function actAuto(){ document.getElementById("b-auto").classList.toggle("on",cam.auto); }

function verModal(tipo){
  const mh=document.getElementById("m-tit"), mp=document.getElementById("m-sub"), mb=document.getElementById("m-body");
  if(tipo==="bitacora"){
    mh.textContent="📖 Bitácora del sistema";
    mp.innerHTML=`${MAPA.ley}<br>Cada cambio registrado deja su línea acá, con fecha. El registro completo (nodos, conexiones y fórmulas) vive en el código de esta misma página.`;
    mb.innerHTML=MAPA.bitacora.map(b=>`<div class="bit"><span class="f">${b.f}</span><span>${b.t}</span></div>`).join("");
  } else {
    mh.textContent="❓ Cómo leer el mapa";
    mp.textContent="Un vistazo y ya sabés dónde vive cada cosa.";
    mb.innerHTML=`<ul>
      <li><b>El centro es Odoo</b>, nuestro sistema de gestión (eso significa «ERP») — la esfera violeta con su logo. Las esferitas violetas pegadas al centro son sus <b>10 sectores</b>: Ventas, Facturación, Productos, Inventario, Compras, Clientes, Tienda, Personas, Kits y Configuración.</li>
      <li><b>La distancia al centro dice dónde vive cada pieza</b>: primero lo construido adentro de Odoo (motor, crons, automatizaciones), después los anillos de Supabase, después los 10 lóbulos del Core con sus módulos, y al final los satélites (la web, BCRA, Alfabeta, WhatsApp, las rutinas de la mañana).</li>
      <li><b>Las líneas son conexiones reales</b> y <b>los puntitos que viajan son las señales</b> (los datos yendo y viniendo).</li>
      <li><b>Tocá cualquier esfera</b>: se abre su ficha completa y se enciende en dorado su ruta verdadera — de qué módulo sale, que TODO pasa por la puerta única <b>odoo-rpc</b>, y qué sector de Odoo toca.</li>
      <li><b>Las esferas coral son nuestras fórmulas</b> (el motor de precios, las comisiones, el semáforo BCRA…): tocálas para ver la fórmula escrita.</li>
      <li>Arrastrá para girar · rueda para acercar · los botones de arriba filtran por capa.</li>
    </ul>`;
  }
  document.getElementById("modal").classList.add("open");
}
