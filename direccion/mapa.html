<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa del sistema · EyG Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#048782; --teal-b:#14B8AC; --agua:#7EE0D6;
    --oro:#F5C46B; --sbase:#3ECF8E; --gh:#B6C2CC; --sat:#7EB6E8; --coral:#F2695C;
    --bg0:#031716; --bg1:#04211F; --line:rgba(126,224,214,.14);
    --txt:#EAF7F5; --gris:#9DBBB7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg0);color:var(--txt);
    font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  canvas{position:fixed;inset:0;display:block;cursor:grab}
  canvas.drag{cursor:grabbing}

  /* ---- barra superior ---- */
  .tbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:14px;
    padding:10px 16px;background:linear-gradient(180deg,rgba(3,23,22,.92),rgba(3,23,22,.55) 70%,transparent);
    pointer-events:none}
  .tbar>*{pointer-events:auto}
  .brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
  .brand .mono{font-weight:900;font-size:21px;letter-spacing:-.5px}
  .brand .mono .y{color:var(--teal-b)}
  .brand .btag{font-size:11px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--agua);opacity:.8}
  .ttl{line-height:1.1}
  .ttl b{font-size:15px;font-weight:800}
  .ttl small{display:block;font-size:11px;color:var(--gris)}
  .spacer{flex:1}
  .chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
  .chip{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;border:1px solid var(--line);
    color:var(--gris);background:rgba(4,33,31,.6);cursor:pointer;user-select:none;white-space:nowrap;transition:all .15s}
  .chip:hover{color:var(--txt)}
  .chip.on{color:#04211F;border-color:transparent}
  .chip.on[data-capa="odoo"]{background:var(--oro)}
  .chip.on[data-capa="core"]{background:var(--teal-b)}
  .chip.on[data-capa="supabase"]{background:var(--sbase)}
  .chip.on[data-capa="github"]{background:var(--gh)}
  .chip.on[data-capa="satelite"]{background:var(--sat)}
  .chip.on[data-capa="algoritmo"]{background:var(--coral)}
  .iconbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:rgba(4,33,31,.6);
    color:var(--agua);font-size:15px;display:grid;place-items:center;cursor:pointer;text-decoration:none;transition:all .15s}
  .iconbtn:hover{background:rgba(20,184,172,.18)}
  .iconbtn.on{background:rgba(20,184,172,.3);color:#fff}
  .buscador{position:relative}
  .buscador input{width:190px;padding:7px 12px 7px 30px;border-radius:20px;border:1px solid var(--line);
    background:rgba(4,33,31,.7);color:var(--txt);font-family:inherit;font-size:12.5px;outline:none}
  .buscador input:focus{border-color:var(--teal-b)}
  .buscador::before{content:"🔎";position:absolute;left:9px;top:6px;font-size:12px;opacity:.6}

  /* ---- tooltip ---- */
  #tip{position:fixed;z-index:30;pointer-events:none;display:none;max-width:260px;
    background:rgba(4,33,31,.95);border:1px solid var(--line);border-radius:10px;padding:8px 11px;
    font-size:12px;line-height:1.35;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  #tip b{display:block;font-size:12.5px}
  #tip small{color:var(--gris);font-size:11px}

  /* ---- panel de detalle ---- */
  #panel{position:fixed;top:56px;right:12px;bottom:52px;width:min(400px,calc(100vw - 24px));z-index:25;
    background:rgba(4,33,31,.96);border:1px solid var(--line);border-radius:16px;
    box-shadow:0 12px 50px rgba(0,0,0,.55);display:none;flex-direction:column;overflow:hidden;
    backdrop-filter:blur(6px)}
  #panel.open{display:flex}
  #panel .ph{display:flex;align-items:center;gap:11px;padding:15px 16px 11px;border-bottom:1px solid var(--line)}
  #panel .ph .pico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none}
  #panel .ph h2{font-size:16.5px;font-weight:800;line-height:1.15}
  #panel .ph small{display:block;font-size:11px;color:var(--gris);margin-top:2px}
  #panel .px{margin-left:auto;flex:none;width:28px;height:28px;border-radius:8px;border:none;background:transparent;
    color:var(--gris);font-size:16px;cursor:pointer}
  #panel .px:hover{color:#fff}
  #panel .pb{overflow-y:auto;padding:14px 16px;font-size:13px;line-height:1.55;color:#D9ECE9}
  #panel .pb::-webkit-scrollbar{width:8px}
  #panel .pb::-webkit-scrollbar-thumb{background:rgba(126,224,214,.2);border-radius:4px}
  #panel .est{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
    border-radius:20px;padding:3px 10px;margin-bottom:10px}
  #panel .est.activo{background:rgba(62,207,142,.15);color:#5FE0A8}
  #panel .est.pruebas{background:rgba(245,196,107,.15);color:var(--oro)}
  #panel .est.futuro{background:rgba(158,187,183,.15);color:var(--gris)}
  #panel h3{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--agua);
    margin:16px 0 7px;display:flex;align-items:center;gap:8px}
  #panel h3::after{content:"";flex:1;height:1px;background:var(--line)}
  #panel ul{list-style:none}
  #panel ul li{padding:3px 0 3px 16px;position:relative;font-size:12.5px}
  #panel ul li::before{content:"·";position:absolute;left:4px;color:var(--teal-b);font-weight:900}
  #panel .formula{background:rgba(3,23,22,.8);border:1px solid rgba(242,105,92,.25);border-left:3px solid var(--coral);
    border-radius:8px;padding:9px 12px;margin:6px 0;font-size:12px;line-height:1.5}
  #panel .formula b{color:#FFB3A8}
  #panel .cnx{display:flex;flex-wrap:wrap;gap:6px}
  #panel .cnx span{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:16px;border:1px solid var(--line);
    color:var(--agua);cursor:pointer;transition:all .15s}
  #panel .cnx span:hover{background:rgba(20,184,172,.2);color:#fff}
  #panel .ref{margin-top:14px;font-size:11px;color:var(--gris);border-top:1px dashed var(--line);padding-top:9px;word-break:break-all}

  /* ---- pie: la ley ---- */
  .ley{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:12px;
    padding:9px 16px;background:linear-gradient(0deg,rgba(3,23,22,.95),rgba(3,23,22,.6) 75%,transparent);
    font-size:11.5px;color:var(--gris)}
  .ley .lchip{flex:none;font-size:10px;font-weight:900;letter-spacing:1.5px;background:rgba(242,105,92,.16);
    color:#FFB3A8;border-radius:5px;padding:3px 8px}
  .ley .ltxt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ley .ltxt b{color:#D9ECE9}
  .ley button{flex:none;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--agua);background:transparent;
    border:1px solid var(--line);border-radius:16px;padding:4px 12px;cursor:pointer}
  .ley button:hover{background:rgba(20,184,172,.15)}
  .ley .ver{flex:none}

  /* ---- leyenda ---- */
  #leyenda{position:fixed;left:12px;bottom:46px;z-index:15;font-size:10.5px;color:var(--gris);line-height:1.9;
    background:rgba(3,23,22,.55);border-radius:10px;padding:8px 12px;pointer-events:none}
  #leyenda i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

  /* ---- modal bitácora ---- */
  #modal{position:fixed;inset:0;z-index:40;background:rgba(2,12,11,.75);display:none;place-items:center;padding:20px}
  #modal.open{display:grid}
  #modal .mbox{width:min(640px,100%);max-height:82vh;display:flex;flex-direction:column;background:var(--bg1);
    border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 80px rgba(0,0,0,.6);overflow:hidden}
  #modal .mh{padding:18px 22px 13px;border-bottom:1px solid var(--line)}
  #modal .mh h2{font-size:17px;font-weight:800}
  #modal .mh p{font-size:12.5px;color:var(--gris);margin-top:5px;line-height:1.5}
  #modal .mb{overflow-y:auto;padding:14px 22px 20px}
  #modal .bit{display:flex;gap:14px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:12.5px;line-height:1.5}
  #modal .bit:last-child{border-bottom:none}
  #modal .bit .f{flex:none;font-weight:800;color:var(--agua);font-size:11.5px;padding-top:1px;width:84px}
  #modal .mx{position:absolute;top:14px;right:16px;width:30px;height:30px;border:none;background:transparent;
    color:var(--gris);font-size:18px;cursor:pointer}
  @media (max-width:760px){
    .ttl small,.buscador{display:none}
    .chips{display:none}
    #leyenda{display:none}
  }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/core.js?v=33"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   EyG Core · MAPA DEL SISTEMA — el cerebro en 3D
   Odoo es el núcleo; el Core lo envuelve en lóbulos (departamentos);
   Supabase orbita como anillo; GitHub y la web son satélites; las fórmulas
   nuestras son sinapsis (coral). Canvas puro, sin librerías: gira, hacé zoom,
   tocá un nodo para ver su ficha y sus conexiones.

   ══ LA LEY ══
   Este mapa es el registro maestro del sistema. NINGÚN cambio en Core, Odoo,
   Supabase, GitHub o la web queda terminado hasta estar registrado acá:
   se actualiza el nodo/conexión que corresponda y se agrega una línea a la
   BITÁCORA. Para actualizar: editar SOLO el bloque REGISTRO de abajo
   (MAPA.bitacora, NODOS, ENLACES) — el dibujo se arma solo.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ╔══════════════════════ REGISTRO (editar acá) ══════════════════════╗ */

const MAPA = {
  version: "1.0",
  actualizado: "2026-08-20",
  ley: "Ningún cambio en Core, Odoo, Supabase, GitHub o la web queda terminado hasta quedar registrado en este mapa.",
  bitacora: [
    { f:"2026-08-20", t:"Nace el mapa. Inventario completo verificado contra lo publicado: GitHub (repo core, commit b2c1ace), Supabase (8 edge functions, 5 tablas, 3 funciones SQL) y Odoo en vivo (4 acciones de servidor EyG, 3 crons propios + Alfabeta, 7 automatizaciones, 37 parámetros eyg.*)." },
  ],
};

/* Capas: odoo (núcleo) · core (lóbulos) · supabase (anillo) · github · satelite · algoritmo (sinapsis).
   Cada nodo: id, capa, grp (dónde se dibuja), ico, n (nombre), sub (bajada corta),
   d (qué es), det (detalles), f (fórmulas/reglas), ref (archivo o id), est (activo|pruebas|futuro). */

const NODOS = [

/* ───────── NÚCLEO ODOO ───────── */
{ id:"odoo", capa:"odoo", grp:"centro", ico:"🪐", n:"Odoo ERP — el núcleo", sub:"drogueriaeyg.odoo.com · SaaS",
  d:"Acá vive TODO el dato de la droguería: productos, clientes, pedidos, facturas, stock, empleados y contabilidad. El Core no guarda datos de negocio propios: todo lo lee y lo escribe en Odoo.",
  det:[
    "19.693 productos activos en 6 familias raíz: HOSPITALARIOS (24), FARMACOPEA (10), DESCARTABLES (51), ÉTICOS (12), PERFUMERÍA (11), ORTOPEDIA (370), EQUIPOS MÉDICOS (369)",
    "Clientes en 3 niveles: fiscal (factura) / entrega (sucursales) / contactos (personas)",
    "Ventas partida en 2 equipos CRM: Instituciones y Comercial General",
    "16 personas en 4 áreas; permisos cruzados (quien carga no concilia)",
  ], est:"activo" },

{ id:"motor", capa:"odoo", grp:"odooint", ico:"⚙️", n:"Motor de precios", sub:"acción de servidor 1213 · cron 92 · corre cada 15 min",
  d:"Nuestra pieza más nuestra: una acción de servidor que sincroniza costo y precio de todo el catálogo. Trabaja en DOS PASADAS: primero el COSTO real de cada producto, después el PRECIO de venta con su escalera.",
  det:[
    "Pasada 1 — COSTO: calcula x_costo_motor (neto real) para las 6 familias y detecta oportunidades por baja de costo",
    "Pasada 2 — PRECIO: solo categorías con regla en eyg.sync_precios_flat; arma escalera en LISTA 1 EyG (id 3), tiers T2/T3, ofertas, tabla visible en la ficha web y publicación según stock",
    "Botón ⚡ en el módulo Motor de precios: modo `solo` (un producto)",
    "Backup del código: eyg-core-cron/cron_1213_actual.py (el motor NO está en git: vive en Odoo)",
    "Trampa conocida: dentro de la acción no se puede usar `import` (safe_eval)",
  ],
  f:[
    "<b>Costo real</b> = Σ price_subtotal ÷ Σ quantity de la última compra — gana el dato más reciente entre: costo manual → factura de compra (la verdad) → orden sin facturar → standard_price",
    "<b>Oportunidad</b> = el costo nuevo baja ≥ 10% contra el x_costo_motor anterior",
  ],
  ref:"Odoo ir.actions.server 1213 · backup en eyg-core-cron/", est:"activo" },

{ id:"cinta-off", capa:"odoo", grp:"odooint", ico:"🎀", n:"Cinta %OFF Éticos", sub:"acción 1223 · cron 94 · cada 1 min",
  d:"Mantiene al minuto la cinta de descuento (%OFF) de los éticos en oferta y la categoría 263 (Ofertas) de la tienda.", est:"activo" },

{ id:"nuevos-ing", capa:"odoo", grp:"odooint", ico:"🆕", n:"Nuevos ingresos", sub:"acción 1226 · cron 95 · cada 1 h",
  d:"Marca los productos nuevos de la tienda: etiqueta de ingreso de los últimos 30 días y del último año.", est:"activo" },

{ id:"escalas-btn", capa:"odoo", grp:"odooint", ico:"🔍", n:"Botón «Ver escalas»", sub:"acciones 1207 y 1208",
  d:"Botón agregado a la Orden de Venta: abre un popup con las escalas de precio por cantidad de los productos hospitalarios de esa venta. Hecho por RPC, 100% reversible.", est:"activo" },

{ id:"autom", capa:"odoo", grp:"odooint", ico:"🤖", n:"Automatizaciones", sub:"7 reglas activas (base.automation)",
  d:"Reglas que Odoo dispara solo cuando pasa algo:",
  det:[
    "Referencia de cliente única en Pedido de Venta",
    "Alerta Deuda Cliente",
    "Notificación de Factura Vencida al comercial",
    "EyG — Oferta instantánea (ribbon 190)",
    "EyG — Autor de noticias = Droguería EyG",
    "EyG — Ético nuevo ⇒ tilde de caja cerrada",
    "EyG — Restringir lista de precios por comercial (acción 1303)",
  ], est:"activo" },

{ id:"cron-deuda", capa:"odoo", grp:"odooint", ico:"📨", n:"Aviso diario de deuda vencida", sub:"cron 93 · 1 vez por día",
  d:"Le manda todos los días a Bárbara (Cobranzas) el resumen de deuda vencida para arrancar el reclamo.", est:"activo" },

{ id:"alfabeta", capa:"odoo", grp:"odooint", ico:"📖", n:"Sync Alfabeta", sub:"crons 54 y 55 · base 1×día + novedades cada 3 h",
  d:"El módulo que trae el catálogo y el PVP de los medicamentos éticos desde Alfabeta. Ese PVP (guardado en list_price) es la base del precio de éticos.", est:"activo" },

{ id:"web-stock", capa:"odoo", grp:"odooint", ico:"👁️", n:"Mostrar/ocultar por stock", sub:"cron 91 · cada 1 h",
  d:"Publica u oculta productos de la tienda automáticamente según tengan stock.", est:"activo" },

{ id:"params", capa:"odoo", grp:"odooint", ico:"🎛️", n:"Parámetros eyg.*", sub:"37 parámetros — la memoria de configuración",
  d:"Toda la configuración nuestra vive en parámetros del sistema (ir.config_parameter). Los módulos del Core los leen y escriben por RPC.",
  det:[
    "Precios: sync_precios_flat + config, sync_ofertas(_flat), precios_fijos_flat, t2_precios_* (SAMCOs), t3_precios_* (Instituciones), eticos_escala, eticos_min_step, eticos_tope_activo/flat/descmax",
    "Diagnóstico del motor: precios.sync, precios.sync.faltan_factura, precios.sync.farma, precios.sync.tiers",
    "Módulos Core: comunicaciones, conquistar (CRM), comisiones, ofertas, oportunidades_stock(+estado), portal_cinta, bcra, ribbon_oferta",
    "Presencia en Core: presencia.N (8 usuarios) · test_cfg",
  ], est:"activo" },

{ id:"campos-x", capa:"odoo", grp:"odooint", ico:"🧬", n:"Campos propios (x_)", sub:"campos custom en product.product",
  d:"Los campos que agregamos al producto para que el motor y los módulos trabajen:",
  det:[
    "x_costo_motor — el costo real neto calculado por el motor",
    "x_costo_manual + x_costo_manual_date — costo cargado a mano (gana si es más reciente)",
    "x_oportunidad + _archivada + _costo_ant + _fecha — la oportunidad detectada",
    "x_escala_eyg — escala del laboratorio (grandes / genéricos) en éticos",
  ], est:"activo" },

{ id:"listas", capa:"odoo", grp:"odooint", ico:"📜", n:"Listas de precios — 3 tiers", sub:"product.pricelist",
  d:"La estructura comercial de precios, ordenada en 3 niveles:",
  det:[
    "LISTA 1 EyG (id 3) — la web y Farmacias: acá escribe el motor la escalera",
    "T2 — SAMCOs y clínicas",
    "T3 — Instituciones (Portada + Bionexo), con sus propios precios fijos",
    "La automatización «Restringir lista por comercial» evita que un comercial use una lista ajena",
  ], est:"activo" },

{ id:"combos", capa:"odoo", grp:"odooint", ico:"🎁", n:"Combos (kits phantom)", sub:"mrp.bom por variante · categoría 34",
  d:"Un combo es un template con variantes + una lista de materiales fantasma por variante: al venderlo, Odoo lo explota en sus componentes y descuenta el stock real de cada uno.", est:"activo" },

{ id:"tienda", capa:"odoo", grp:"luna", ico:"🛒", n:"Tienda + Portal de clientes", sub:"drogueriaeyg.odoo.com — la cara al cliente",
  d:"El sitio de venta y el portal donde los clientes ven sus pedidos y facturas. Muestra la escalera de precios (tabla en la ficha), la cinta coral de avisos segmentada por perfil, las noticias y el buscador inteligente.",
  det:[
    "Escalera visible por producto (el motor escribe la tabla en description_ecommerce)",
    "Cinta coral bajo el menú: bloque eyg-cinta, segmentada por perfil crediticio (BCRA + pagos)",
    "Noticias con autor fijo «Droguería EyG» (automatización)",
    "Buscador difuso conectado a Supabase (tolera errores de tipeo, busca por droga)",
  ], est:"activo" },

/* ───────── ANILLO SUPABASE ───────── */
{ id:"odoo-rpc", capa:"supabase", grp:"ringA", ico:"🔌", n:"odoo-rpc", sub:"edge function — LA puerta única a Odoo",
  d:"Todo lo que habla con Odoo pasa por acá: recibe {model, method, args, kwargs}, entra por JSON-RPC con cuenta de servicio y devuelve el resultado. La usan los 15+ módulos del Core, las otras functions y Claude cuando trabaja en el sistema.",
  ref:"supabase/functions/odoo-rpc · v7", est:"activo" },

{ id:"fn-admin-usuarios", capa:"supabase", grp:"ringA", ico:"👤", n:"admin-usuarios", sub:"edge function",
  d:"Altas de personal y cambios de rol/permisos desde el módulo Usuarios y accesos. Escribe en core_users y en Supabase Auth.", est:"activo" },

{ id:"fn-recover", capa:"supabase", grp:"ringA", ico:"🔑", n:"recover-link", sub:"edge function",
  d:"Genera el link para restablecer la contraseña (página recuperar.html).", est:"activo" },

{ id:"fn-salud-novedades", capa:"supabase", grp:"ringA", ico:"📰", n:"salud-novedades", sub:"edge function",
  d:"Junta noticias del sector salud para publicar en el portal desde el módulo Portal web.", est:"activo" },

{ id:"fn-ofertas-top", capa:"supabase", grp:"ringA", ico:"🏷️", n:"eyg-ofertas-top", sub:"edge function",
  d:"Arma el top de ofertas del día en 2 versiones (Farmacias / Instituciones), segmentadas por rubro del cliente. La consume el aviso diario de WhatsApp de las 7:02.", est:"activo" },

{ id:"fn-portal-cinta", capa:"supabase", grp:"ringA", ico:"🎗️", n:"portal-cinta", sub:"edge function",
  d:"Lee y escribe el parámetro eyg.portal_cinta: el texto y la segmentación de la cinta coral que ven los clientes en el portal.", est:"activo" },

{ id:"fn-sync-web", capa:"supabase", grp:"ringA", ico:"💱", n:"sync-web", sub:"edge function · cron cada 15 min",
  d:"Refresca el precio del índice del buscador (productos_web.precio) con el precio actual de LISTA 3, 1ª caja. Idempotente.", est:"activo" },

{ id:"fn-sync-buscar", capa:"supabase", grp:"ringA", ico:"🔎", n:"sync-buscar", sub:"edge function",
  d:"Reconstruye el índice completo del buscador: productos publicados + precio con IVA + droga + laboratorio + familia → tabla productos_web.", est:"activo" },

{ id:"t-core-users", capa:"supabase", grp:"ringB", ico:"🗂️", n:"core_users", sub:"tabla · 13 usuarios · con RLS",

/* ═══════════ GEOMETRÍA — dónde vive cada grupo en la esfera ═══════════
   (theta = longitud, phi = latitud, en grados; r = radio) */
const D2R = Math.PI/180;
function xyz(th, ph, r){ th*=D2R; ph*=D2R; return { x:r*Math.cos(ph)*Math.cos(th), y:r*Math.sin(ph), z:r*Math.cos(ph)*Math.sin(th) }; }

const LOBOS = { /* dirección de cada lóbulo del Core */
  comercial:[0,8], compras:[40,-18], deposito:[80,16], calidad:[118,-32], finanzas:[152,22],
  precios:[196,-12], portal:[232,26], manuales:[264,-26], direccion:[302,14], admin:[336,-16],
};
const FAN = [[0,0],[-17,13],[17,13],[-17,-14],[17,-14],[0,24],[0,-24],[-30,0],[30,0]]; // abanico de módulos

function ubicar(){
  const porLobo = {}, porGrp = {};
  NODOS.forEach(nd=>{ (porGrp[nd.grp]=porGrp[nd.grp]||[]).push(nd); if(nd.grp==="mod") (porLobo[nd.lobo]=porLobo[nd.lobo]||[]).push(nd); });
  NODOS.forEach(nd=>{
    const i = porGrp[nd.grp].indexOf(nd), n = porGrp[nd.grp].length;
    if(nd.grp==="centro"){ nd.p={x:0,y:0,z:0}; nd.rad=34; }
    else if(nd.grp==="odooint"){ const th=i*(360/n)+12, ph=(i%2?1:-1)*(18+(i%3)*14); nd.p=xyz(th,ph,88); nd.rad=10; }
    else if(nd.grp==="luna"){ nd.p=xyz(40,20,128); nd.rad=15; }
    else if(nd.grp==="ringA"){ const t=i*(360/n); const c=xyz(t,0,158); const tilt=18*D2R; nd.p={x:c.x, y:c.y*Math.cos(tilt)-c.z*Math.sin(tilt)*.35, z:c.z*Math.cos(tilt)}; nd.p.y+=Math.sin(t*D2R)*158*Math.sin(tilt); nd.rad=10; }
    else if(nd.grp==="ringB"){ const t=i*(360/n)+25; const c=xyz(t,0,190); const tilt=-24*D2R; nd.p={x:c.x, y:Math.sin(t*D2R)*190*Math.sin(tilt), z:c.z*Math.cos(tilt)}; nd.rad=9; }
    else if(nd.grp==="lobo"){ const dir=LOBOS[nd.lobo]; nd.p=xyz(dir[0],dir[1],238); nd.rad=14; }
    else if(nd.grp==="mod"){ const dir=LOBOS[nd.lobo]; const k=porLobo[nd.lobo].indexOf(nd); const off=FAN[(k+1)%FAN.length]; nd.p=xyz(dir[0]+off[0],dir[1]+off[1],282); nd.rad=9.5; }
    else if(nd.grp==="gh"){ const off=[[0,0],[13,9],[-13,9]][i]||[0,0]; nd.p=xyz(210+off[0],44+off[1],392); nd.rad=i===0?13:10; }
    else if(nd.grp==="sat"){ const dirs=[[185,38,436],[152,-46,412],[62,-44,424],[332,36,424],[280,-42,412],[305,46,436]]; const d=dirs[i]||[i*60,30,430]; nd.p=xyz(d[0],d[1],d[2]); nd.rad=11; }
    else if(nd.grp==="alg1"){ const th=15+i*52, ph=(i%2? -28:30); nd.p=xyz(th,ph,116); nd.rad=8.5; }
    else if(nd.grp==="alg2"){ const dirs=[[10,-24],[158,40],[62,32],[34,-38],[238,-32],[143,-14]]; const d=dirs[i]||[i*55,25]; nd.p=xyz(d[0],d[1],308); nd.rad=8.5; }
  });
}

/* ═══════════ RENDER 3D ═══════════ */
const COLOR = { odoo:"#F5C46B", core:"#14B8AC", supabase:"#3ECF8E", github:"#B6C2CC", satelite:"#7EB6E8", algoritmo:"#F2695C" };
const ECOLOR = { dato:"rgba(126,224,214,", config:"rgba(245,196,107,", deploy:"rgba(182,194,204,", sinapsis:"rgba(242,105,92," };

let cv, cx, W, H, DPR;
const cam = { yaw:.55, pitch:.24, zoom:1, F:980, auto:true };
let hover=null, sel=null, filtro=new Set(["odoo","core","supabase","github","satelite","algoritmo"]), busca="", labels=false;
const porId={}; NODOS.forEach(n=>porId[n.id]=n);
const STARS=[]; for(let i=0;i<170;i++) STARS.push({x:Math.random(),y:Math.random(),r:Math.random()*1.1+.2,a:Math.random()*.4+.1});
const PULSOS=[];

function proj(p){
  const cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw), cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  let x=p.x*cy+p.z*sy, z=-p.x*sy+p.z*cy, y=p.y*cp-z*sp; z=p.y*sp+z*cp;
  const s=cam.F/(cam.F+z)*cam.zoom;
  return { x:W/2+x*s, y:H/2-y*s, s, z };
}
function visible(nd){ return filtro.has(nd.capa); }
function match(nd){ if(!busca) return true; const q=busca.toLowerCase(); return (nd.n+" "+(nd.sub||"")+" "+nd.id).toLowerCase().includes(q); }
function apagado(nd){ return !visible(nd) || !match(nd); }

function dibujar(t){
  cx.clearRect(0,0,W,H);
  /* fondo estrellado */
  const g=cx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.75);
  g.addColorStop(0,"#06302C"); g.addColorStop(.55,"#04211F"); g.addColorStop(1,"#020F0E");
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
  cx.fillStyle="#9FE8DF";
  STARS.forEach(s=>{ cx.globalAlpha=s.a*(0.6+0.4*Math.sin(t/1400+s.x*20)); cx.beginPath(); cx.arc(s.x*W,s.y*H,s.r,0,7); cx.fill(); });
  cx.globalAlpha=1;

  const P={}; NODOS.forEach(nd=>P[nd.id]=proj(nd.p));

  /* halo de cada lóbulo */
  NODOS.filter(n=>n.grp==="lobo").forEach(nd=>{
    if(apagado(nd)) return; const q=P[nd.id]; const R=64*q.s;
    const hg=cx.createRadialGradient(q.x,q.y,0,q.x,q.y,R);
    hg.addColorStop(0,"rgba(20,184,172,.13)"); hg.addColorStop(1,"rgba(20,184,172,0)");
    cx.fillStyle=hg; cx.beginPath(); cx.arc(q.x,q.y,R,0,7); cx.fill();
  });

  /* enlaces */
  const selSet = sel? new Set([sel.id]) : null;
  ENLACES.forEach(e=>{
    const a=porId[e[0]], b=porId[e[1]]; if(!a||!b) return;
    if(apagado(a)||apagado(b)) return;
    const pa=P[a.id], pb=P[b.id]; const tipo=e[2]||"dato";
    const liga = selSet && (selSet.has(a.id)||selSet.has(b.id));
    const depth=Math.max(0,Math.min(1,((pa.z+pb.z)/2+400)/800));
    let al = sel? (liga? .85 : .04) : (hover&&(hover.id===a.id||hover.id===b.id)? .7 : .10+.10*(1-depth));
    cx.strokeStyle=ECOLOR[tipo]+al+")"; cx.lineWidth=liga?1.6:.8;
    cx.beginPath(); cx.moveTo(pa.x,pa.y);
    const mx=(pa.x+pb.x)/2, my=(pa.y+pb.y)/2 - 14*((pa.s+pb.s)/2);
    cx.quadraticCurveTo(mx,my,pb.x,pb.y); cx.stroke();
  });

  /* pulsos neuronales */
  if(Math.random()<.10 && PULSOS.length<26){
    const pool = sel? ENLACES.filter(e=>e[0]===sel.id||e[1]===sel.id) : ENLACES;
    const e=pool[Math.floor(Math.random()*pool.length)];
    if(e){ const a=porId[e[0]], b=porId[e[1]]; if(a&&b&&!apagado(a)&&!apagado(b)) PULSOS.push({e,t:0,v:.006+Math.random()*.008}); }
  }
  for(let i=PULSOS.length-1;i>=0;i--){
    const p=PULSOS[i]; p.t+=p.v; if(p.t>=1){PULSOS.splice(i,1);continue;}
    const a=porId[p.e[0]], b=porId[p.e[1]]; if(apagado(a)||apagado(b)){PULSOS.splice(i,1);continue;}
    const pa=P[a.id], pb=P[b.id]; const mx=(pa.x+pb.x)/2, my=(pa.y+pb.y)/2-14*((pa.s+pb.s)/2);
    const u=p.t, x=(1-u)*(1-u)*pa.x+2*(1-u)*u*mx+u*u*pb.x, y=(1-u)*(1-u)*pa.y+2*(1-u)*u*my+u*u*pb.y;
    const col=ECOLOR[p.e[2]||"dato"];
    cx.fillStyle=col+".9)"; cx.beginPath(); cx.arc(x,y,1.8,0,7); cx.fill();
    cx.fillStyle=col+".25)"; cx.beginPath(); cx.arc(x,y,4.5,0,7); cx.fill();
  }

  /* nodos, de atrás hacia adelante */
  const orden=[...NODOS].sort((a,b)=>P[b.id].z-P[a.id].z);
  orden.forEach(nd=>{
    const q=P[nd.id]; const r=nd.rad*q.s; const col=COLOR[nd.capa];
    const off=apagado(nd);
    cx.globalAlpha = off? .07 : Math.max(.25, Math.min(1, .55+.45*q.s));
    if(nd.id==="odoo"){ /* el núcleo respira */
      const R=r*(1.02+.03*Math.sin(t/900));
      const ng=cx.createRadialGradient(q.x,q.y,0,q.x,q.y,R*2.6);
      ng.addColorStop(0,"rgba(245,196,107,.55)"); ng.addColorStop(.35,"rgba(245,196,107,.16)"); ng.addColorStop(1,"rgba(245,196,107,0)");
      cx.fillStyle=ng; cx.beginPath(); cx.arc(q.x,q.y,R*2.6,0,7); cx.fill();
      const cg=cx.createRadialGradient(q.x-R*.3,q.y-R*.3,R*.1,q.x,q.y,R);
      cg.addColorStop(0,"#FFE9BD"); cg.addColorStop(.6,"#F5C46B"); cg.addColorStop(1,"#B8862F");
      cx.fillStyle=cg; cx.beginPath(); cx.arc(q.x,q.y,R,0,7); cx.fill();
    } else {
      const hg=cx.createRadialGradient(q.x,q.y,0,q.x,q.y,r*2.4);
      hg.addColorStop(0,col+"66"); hg.addColorStop(1,col+"00");
      cx.fillStyle=hg; cx.beginPath(); cx.arc(q.x,q.y,r*2.4,0,7); cx.fill();
      cx.fillStyle=col; cx.beginPath(); cx.arc(q.x,q.y,r,0,7); cx.fill();
      cx.fillStyle="rgba(255,255,255,.32)"; cx.beginPath(); cx.arc(q.x-r*.28,q.y-r*.3,r*.42,0,7); cx.fill();
    }
    if((sel&&sel.id===nd.id)||(hover&&hover.id===nd.id)){
      cx.strokeStyle="#fff"; cx.lineWidth=1.6; cx.beginPath(); cx.arc(q.x,q.y,r+3.5,0,7); cx.stroke();
    }
    /* ícono adentro + etiqueta */
    if(r>7 && !off){
      cx.font=`${Math.round(r*1.05)}px serif`; cx.textAlign="center"; cx.textBaseline="middle";
      cx.fillText(nd.ico,q.x,q.y+1);
    }
    const conLabel = nd.grp==="lobo"||nd.grp==="centro"||nd.grp==="luna"||nd.grp==="gh"&&nd.id==="gh"||nd.grp==="sat"||labels||(sel&&sel.id===nd.id)||(hover&&hover.id===nd.id);
    if(conLabel && !off && q.s>.45){
      cx.font=`${nd.grp==="lobo"||nd.grp==="centro"?800:600} ${Math.max(9,Math.round((nd.grp==="lobo"?11.5:10.5)*Math.min(q.s,1.15)))}px Archivo`;
      cx.textAlign="center"; cx.textBaseline="top";
      const ly=q.y+r+5;
      cx.fillStyle="rgba(3,23,22,.75)";
      const tw=cx.measureText(nd.n).width;
      cx.fillRect(q.x-tw/2-4,ly-1,tw+8,14*Math.min(q.s,1.15)+2);
      cx.fillStyle= nd.grp==="lobo"? "#9FE8DF" : "#D9ECE9";
      cx.fillText(nd.n,q.x,ly);
    }
    cx.globalAlpha=1;
  });
  nodosProyectados=orden.map(nd=>({nd,q:P[nd.id]}));
}

let nodosProyectados=[];
function nodoEn(mx,my){
  for(let i=nodosProyectados.length-1;i>=0;i--){
    const {nd,q}=nodosProyectados[i]; if(apagado(nd)) continue;
    const r=Math.max(nd.rad*q.s,9)+4;
    if((mx-q.x)**2+(my-q.y)**2 < r*r) return nd;
  }
  return null;
}

/* ═══════════ PANEL DE DETALLE ═══════════ */
const nombreCapa={odoo:"Núcleo Odoo",core:"EyG Core",supabase:"Supabase",github:"GitHub",satelite:"Satélite",algoritmo:"Algoritmo propio"};
function abrirPanel(nd){
  sel=nd;
  const el=document.getElementById("panel");
  const cnx=[]; ENLACES.forEach(e=>{ if(e[0]===nd.id&&porId[e[1]]) cnx.push(porId[e[1]]); if(e[1]===nd.id&&porId[e[0]]) cnx.push(porId[e[0]]); });
  const est=nd.est||"activo";
  const estTxt={activo:"Activo",pruebas:"En pruebas",futuro:"Por construir"}[est];
  document.getElementById("p-ico").textContent=nd.ico;
  document.getElementById("p-ico").style.background=COLOR[nd.capa]+"26";
  document.getElementById("p-tit").textContent=nd.n;
  document.getElementById("p-sub").textContent=(nd.sub||"")+" · "+nombreCapa[nd.capa];
  let h=`<span class="est ${est}">${estTxt}</span><p>${nd.d||""}</p>`;
  if(nd.det&&nd.det.length) h+=`<h3>Detalles</h3><ul>${nd.det.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  if(nd.f&&nd.f.length) h+=`<h3>Fórmulas y reglas</h3>${nd.f.map(x=>`<div class="formula">${x}</div>`).join("")}`;
  if(cnx.length){
    const unicos=[...new Map(cnx.map(c=>[c.id,c])).values()];
    h+=`<h3>Conexiones (${unicos.length})</h3><div class="cnx">${unicos.map(c=>`<span data-go="${c.id}">${c.ico} ${c.n}</span>`).join("")}</div>`;
  }
  if(nd.ref) h+=`<div class="ref">📎 ${nd.ref}</div>`;
  const pb=document.getElementById("p-body"); pb.innerHTML=h; pb.scrollTop=0;
  pb.querySelectorAll("[data-go]").forEach(s=>s.onclick=()=>abrirPanel(porId[s.dataset.go]));
  el.classList.add("open");
}
function cerrarPanel(){ sel=null; document.getElementById("panel").classList.remove("open"); }

/* ═══════════ INTERACCIÓN ═══════════ */
function armar(){
  cv=document.getElementById("cv"); cx=cv.getContext("2d");
  const fit=()=>{ DPR=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
    cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+"px"; cv.style.height=H+"px"; cx.setTransform(DPR,0,0,DPR,0,0); };
  fit(); addEventListener("resize",fit);

  let drag=null;
  cv.addEventListener("pointerdown",e=>{ drag={x:e.clientX,y:e.clientY,mov:false}; cv.setPointerCapture(e.pointerId); cv.classList.add("drag"); });
  cv.addEventListener("pointermove",e=>{
    if(drag){
      const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
      if(Math.abs(dx)+Math.abs(dy)>3) drag.mov=true;
      cam.yaw+=dx*.0045; cam.pitch=Math.max(-1.2,Math.min(1.2,cam.pitch+dy*.0038));
      drag.x=e.clientX; drag.y=e.clientY;
      if(drag.mov) cam.auto=false, actAuto();
    } else {
      hover=nodoEn(e.clientX,e.clientY);
      const tip=document.getElementById("tip");
      if(hover){ tip.style.display="block";
        tip.innerHTML=`<b>${hover.ico} ${hover.n}</b><small>${hover.sub||nombreCapa[hover.capa]}</small>`;
        tip.style.left=Math.min(e.clientX+14,W-280)+"px"; tip.style.top=(e.clientY+14)+"px";
        cv.style.cursor="pointer";
      } else { tip.style.display="none"; cv.style.cursor="grab"; }
    }
  });
  cv.addEventListener("pointerup",e=>{
    cv.classList.remove("drag");
    if(drag&&!drag.mov){ const nd=nodoEn(e.clientX,e.clientY); if(nd) abrirPanel(nd); else cerrarPanel(); }
    drag=null;
  });
  cv.addEventListener("wheel",e=>{ e.preventDefault(); cam.zoom=Math.max(.45,Math.min(3.2,cam.zoom*(e.deltaY<0?1.1:.9))); },{passive:false});

  /* filtros por capa */
  document.querySelectorAll(".chip[data-capa]").forEach(ch=>{
    ch.onclick=()=>{ const c=ch.dataset.capa;
      if(filtro.has(c)&&filtro.size===1){ filtro=new Set(Object.keys(COLOR)); } /* re-tocar la única capa = ver todo */
      else if(filtro.size===Object.keys(COLOR).length){ filtro=new Set([c]); }  /* desde "todo": aislar la capa */
      else if(filtro.has(c)) filtro.delete(c); else filtro.add(c);
      document.querySelectorAll(".chip[data-capa]").forEach(x=>x.classList.toggle("on",filtro.has(x.dataset.capa)));
    };
  });
  document.getElementById("q").addEventListener("input",e=>{ busca=e.target.value.trim(); });
  document.getElementById("q").addEventListener("keydown",e=>{
    if(e.key==="Enter"&&busca){ const nd=NODOS.find(n=>visible(n)&&match(n)); if(nd) abrirPanel(nd); }
  });
  document.getElementById("b-auto").onclick=()=>{ cam.auto=!cam.auto; actAuto(); };
  document.getElementById("b-tags").onclick=()=>{ labels=!labels; document.getElementById("b-tags").classList.toggle("on",labels); };
  document.getElementById("b-fs").onclick=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); };
  document.getElementById("b-bit").onclick=()=>document.getElementById("modal").classList.add("open");
  document.getElementById("m-x").onclick=()=>document.getElementById("modal").classList.remove("open");
  document.getElementById("modal").onclick=e=>{ if(e.target.id==="modal") e.target.classList.remove("open"); };
  document.getElementById("p-x").onclick=cerrarPanel;
  addEventListener("keydown",e=>{ if(e.key==="Escape"){ cerrarPanel(); document.getElementById("modal").classList.remove("open"); } });

  /* bitácora */
  document.getElementById("m-body").innerHTML =
    MAPA.bitacora.map(b=>`<div class="bit"><span class="f">${b.f}</span><span>${b.t}</span></div>`).join("");
  document.getElementById("ley-txt").innerHTML =
    `<b>LEY DEL MAPA:</b> ${MAPA.ley} · <b>v${MAPA.version}</b> · actualizado ${MAPA.actualizado}`;

  let last=0;
  const loop=t=>{ if(cam.auto) cam.yaw+=.0011*Math.min(t-last,50); last=t; dibujar(t); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
function actAuto(){ document.getElementById("b-auto").classList.toggle("on",cam.auto); }
