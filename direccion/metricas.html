<style>

  .mt .periodo{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--teal-deep);color:#fff;border-radius:12px;padding:11px 16px;margin-bottom:12px}

  @media(max-width:1150px){.mt .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
    .mt .kpi{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 15px 10px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,border-color .12s;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}

<script>
/* =====================================================================
   MÉTRICAS — el tablero de ventas, compras y margen de Droguería EyG.
   Réplica de "Métricas" del Core de Rosaint, con los datos de la droguería.

   TODO sin IVA y leído en vivo de Odoo (vía odoo-rpc), mes = fecha de factura.
   · Ventas netas = facturas + ND − NC publicadas, SÓLO diarios de venta
     (EYG.VENTA_REAL: el diario Redondeo emite facturas que no son ventas).
   · Compras netas = facturas de proveedor publicadas (diarios de compra) −
     sus NC, renglón por renglón, SIN el capital de préstamos y descuentos de
     cheques (cuenta 1.1.1.02.003 "Recibos pendientes": es plata que ENTRA,
     se carga como factura del banco) ni percepciones sufridas (1.1.4: son
     créditos de impuesto) ni cheques rechazados (1.1.1.01.003).
   · Margen = ventas netas − compras netas del mes. Con "Mercadería" sólo se
     restan las compras de mercadería (5.1.1): margen comercial aproximado
     (no descuenta la variación de stock).
   · Cada total se calcula DOS veces (cabeceras vs renglones) y la página
     marca "✔ Cuadra al centavo" o rojo.
   Todo se pide con read_group (EyG tiene ~1.500 facturas por mes: leer
   renglón por renglón sería inviable). Resultado guardado 15 min en la
   sesión del navegador (sessionStorage), nunca en tablas compartidas.
   ===================================================================== */
(function(){
const TZ = "America/Argentina/Buenos_Aires";
const DESDE = "2025-03-01";                 // primer mes con facturación en Odoo
const CACHE_K = "eyg-metricas-v1", CACHE_TTL = 15*60*1000;
const MES_ES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const MES_EN = ["january","february","march","april","may","june","july","august","september","october","november","december"];
const MES_TXT = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const COL = {ventas:"var(--c-ventas)", compras:"var(--c-compras)", margen:"var(--c-margen)", pedidos:"var(--c-pedidos)", sinfac:"var(--c-sinfac)", tri:"var(--c-tri)"};
/* Triangulacion: el criterio es UNO SOLO para todo el Core y vive en core.js (EYG.TRI_DOM_FACT).
   Son tres condiciones en OR: el CLIENTE (Lazzari y Sanchez Victoria son triangulacion siempre, regla
   de Direccion), la CUENTA de ingresos del renglon (409, la que recoge las facturas viejas que se
   reclasificaron) y la CATEGORIA del producto (los codigos TRI-). Ninguna sola alcanza. */
const TRI_FACT = EYG.TRI_DOM_FACT;
const PALETA = ["#048782","#1E5FA8","#EC8B5E","#7A4DB8","#E5A93B","#1E7D46","#5FC8BF","#B0413E","#04635F","#8A9A97","#C06C84","#355C7D"];
const COL_CANAL = {"Core (comerciales)":"#048782","Odoo a mano":"#1E5FA8","Portal web":"#E5A93B","WhatsApp":"#25A35A","Sin pedido (factura directa)":"#8A9A97"};
const DESC_CANAL = {
  "Core (comerciales)":"Pedidos que cargaron las comerciales desde el Core (Cargar venta).",
  "Odoo a mano":"Pedidos cargados directamente en Odoo por administración o ventas.",
  "Portal web":"Pedidos que el cliente armó solo en la tienda online.",
  "WhatsApp":"Pedidos que tomó el asistente de WhatsApp.",
  "Sin pedido (factura directa)":"Facturas emitidas sin un pedido de venta detrás (licitaciones, facturas directas, conceptos sin producto)."};
const GRUPOS = ["Mercadería","Logística y depósito","Comerciales","Administrativos","Impuestos","Financieros","Bienes de uso","Otros"];
const COL_GRUPO = {"Mercadería":"#EC8B5E","Logística y depósito":"#E5A93B","Comerciales":"#7A4DB8","Administrativos":"#1E5FA8","Impuestos":"#8A9A97","Financieros":"#B0413E","Bienes de uso":"#1E7D46","Otros":"#5FC8BF"};
const DESC_GRUPO = {"Mercadería":"Compra de mercadería y medicamentos (5.1.1).","Logística y depósito":"Fletes, mantenimiento, limpieza, higiene y seguridad (5.1.2).","Comerciales":"Honorarios, viáticos, combustible y gastos comerciales (5.2).","Administrativos":"Honorarios, alquileres, cargas sociales, sistemas, servicios (5.3).","Impuestos":"Tasa municipal, impuesto al cheque (5.4).","Financieros":"Intereses de préstamos, descuento de cheques, descubierto y gastos bancarios (5.6).","Bienes de uso":"Equipos y rodados (1.2).","Otros":"Resto: tarjetas de crédito, ajustes y cuentas sueltas."};
function grupoCompra(code){
  if(code.startsWith("1.1.1.02.003")||code.startsWith("1.1.1.01.003")||code.startsWith("1.1.4")) return null;  // no son compras
  if(code.startsWith("5.1.1")) return "Mercadería";
  if(code.startsWith("5.1.2")) return "Logística y depósito";
  if(code.startsWith("5.2")) return "Comerciales";
  if(code.startsWith("5.3")) return "Administrativos";
  if(code.startsWith("5.4")) return "Impuestos";
  if(code.startsWith("5.6")) return "Financieros";
  if(code.startsWith("1.2")) return "Bienes de uso";
  return "Otros";
}
function excluidoDe(code){
  if(code.startsWith("1.1.1.02.003")) return "Capital de préstamos y descuentos de cheques";
  if(code.startsWith("1.1.4")) return "Percepciones sufridas";
  if(code.startsWith("1.1.1.01.003")) return "Cheques rechazados";
  return "";
}

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const fmt$ = v => (v<0?"−$ ":"$ ")+Math.abs(Math.round(v)).toLocaleString("es-AR");
const fmt$c = v => (v<0?"−$ ":"$ ")+Math.abs(v).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtN = v => Math.round(v).toLocaleString("es-AR");
const fmtP = v => isFinite(v) ? (v*100).toLocaleString("es-AR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%" : "—";
/* montos grandes de las tarjetas: en millones con un decimal (el exacto va en el globito) */
const fmtM = v => Math.abs(v)>=1e6 ? (v<0?"−$ ":"$ ")+(Math.abs(v)/1e6).toLocaleString("es-AR",{minimumFractionDigits:1,maximumFractionDigits:1})+" M" : fmt$(v);
const corto = v => { const a=Math.abs(v), s=v<0?"−":""; if(a>=1e9) return s+"$"+(a/1e9).toLocaleString("es-AR",{maximumFractionDigits:2})+"MM"; if(a>=1e6) return s+"$"+(a/1e6).toLocaleString("es-AR",{maximumFractionDigits:1})+"M"; if(a>=1e3) return s+"$"+Math.round(a/1e3)+"k"; return s+"$"+Math.round(a); };
const lblMes = m => { const [y,mm]=m.split("-"); return MES_TXT[+mm-1]+" "+y.slice(2); };
const lblMesLargo = m => { const [y,mm]=m.split("-"); return MES_ES[+mm-1]+" "+y; };
const sum = (arr,a,b) => { let s=0; for(let i=a;i<=b;i++) s+=(arr[i]||0); return s; };
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const r2 = x => Math.round(x*100)/100;
const m2oId = v => Array.isArray(v) ? v[0] : null;
const m2oName = v => Array.isArray(v) ? String(v[1]) : "";
const cap = s => String(s).toLowerCase().replace(/(^|\s)(\p{L})/gu,(m,sp,c)=>sp+c.toUpperCase());
function mesKey(lbl){
  const p = String(lbl||"").toLowerCase().trim().split(/\s+/); const y=p[p.length-1];
  let i = MES_ES.indexOf(p[0]); if(i<0) i = MES_EN.indexOf(p[0]);
  return i<0 ? null : y+"-"+String(i+1).padStart(2,"0");
}
const MES_ACTUAL = EYG.argToday().slice(0,7);

/* ====================== UBICACIÓN: departamento de Santa Fe ======================
   El contacto de la factura dice provincia (state_id) y localidad (city, texto libre
   y bastante sucio: "Rosario sud", "ROSARIO", "Rosarios", "San jeronimo"...).
   Orden: alias conocidos → localidad exacta del padrón georef → la localidad más
   larga que sea prefijo ("rosario sud" → Rosario) → código postal → coordenadas
   (punto dentro del polígono). Si nada alcanza, queda "sin ubicar" y se lista. */
const SF = window.SF_DEPTOS;
const ALIAS = {"rosarios":"rosario","rsoario":"rosario","fisherton":"rosario","barrio fisherton":"rosario","v gobernador galvez":"villa gobernador galvez","vgg":"villa gobernador galvez","san jeronimo":"san jeronimo sud","empalme":"empalme villa constitucion","gral baigorria":"granadero baigorria","baigorria":"granadero baigorria","pto gral san martin":"puerto general san martin","santa fe capital":"santa fe","ciudad de santa fe":"santa fe"};
const PREF = {"firmat":"General López"};     // ambigua en el padrón: la ciudad de Firmat es de General López
const CP = {};                                // código postal → [departamento, localidad]
["2000","2001","2002","2003","2004","2005","2006","2008","2009","2010","2011","2012","2013"].forEach(c=>CP[c]=["Rosario","Rosario"]);
["3000","3001","3002","3004"].forEach(c=>CP[c]=["La Capital","Santa Fe"]);
CP["2136"]=["San Lorenzo","San Jerónimo Sud"]; CP["2214"]=["San Lorenzo","Aldao"];
function limpiaCiudad(c){
  let k = norm(c);
  k = k.replace(/\s+(santa fe|sta fe|santa fe ar|sf)$/,"").replace(/^(barrio|b|bo|ciudad de|localidad de)\s+/,"");
  return ALIAS[k] || k;
}
function enPoligono(x,y,ring){ let d=false; for(let i=0,j=ring.length-1;i<ring.length;j=i++){ const [xi,yi]=ring[i],[xj,yj]=ring[j]; if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/((yj-yi)||1e-9)+xi)) d=!d; } return d; }
function deptoPorCoord(lat,lon){
  if(!lat || !lon) return null;
  const P=SF.proj, x=(lon-P.lon0)*P.k*P.s, y=(P.lat0-lat)*P.s;
  for(const d of SF.deptos) if(d.rings.some(r=>enPoligono(x,y,r))) return d.name;
  return null;
}
function ubicar(p){
  const st = m2oName(p.state_id).replace(/\s*\(AR\)\s*$/,"");
  const esSF = !st || /^santa fe$/i.test(st);
  if(!esSF) return {fuera: st};
  const k = limpiaCiudad(p.city), zip = String(p.zip||"").replace(/\D/g,"").slice(0,4);
  let hit = SF.localidades[k];
  if(!hit && k){ let best=""; for(const lk in SF.localidades) if(lk.length>best.length && k.startsWith(lk+" ")) best=lk; if(best) hit=SF.localidades[best]; }
  if(hit){
    let [d,nombre] = hit;
    if(Array.isArray(d)){
      if(CP[zip] && d.includes(CP[zip][0])) d = CP[zip][0];
      else if(PREF[k]) d = PREF[k];
      else { const c=deptoPorCoord(p.partner_latitude,p.partner_longitude); d = c && d.includes(c) ? c : null; }
    }
    if(d) return {depto:d, loc:nombre};
  }
  if(CP[zip]) return {depto:CP[zip][0], loc:CP[zip][1]};
  const c = deptoPorCoord(p.partner_latitude,p.partner_longitude);
  if(c) return {depto:c, loc:p.city?cap(p.city):"(sin localidad)"};
  return st ? {sinUbicar:true} : {fuera:"(Sin provincia)"};
}

/* ============================== LECTURA DE ODOO ============================== */
let hechos=0, total=0;
function progreso(){ const s=$("load-txt"); if(s) s.textContent = `Leyendo Odoo… ${hechos} de ${total} consultas`; }
function q(p){ total++; progreso(); return p.then(r=>{ hechos++; progreso(); return r; }); }
const CTX = {lang:"es_AR", tz:TZ};
const rg = (model, dom, fields, gb, extra) => q(EYG.rpc(model,"read_group",[dom,fields,gb],Object.assign({lazy:false, context:CTX}, extra||{})));
const rd = (model, ids, fields, ctx) => q(EYG.rpc(model,"read",[ids,fields],{context:Object.assign({},CTX,ctx||{})}));
async function leerEnTandas(model, ids, fields, ctx){
  const out=[]; for(let i=0;i<ids.length;i+=400){ out.push(...await rd(model, ids.slice(i,i+400), fields, ctx)); } return out;
}

async function construir(){
  hechos=0; total=0;
  const meses=[]; { let [y,m]=DESDE.slice(0,7).split("-").map(Number); for(;;){ const k=y+"-"+String(m).padStart(2,"0"); meses.push(k); if(k>=MES_ACTUAL) break; m++; if(m>12){m=1;y++;} } }
  const N=meses.length, idx={}; meses.forEach((m,i)=>idx[m]=i);
  const zeros=()=>new Array(N).fill(0);
  const add=(o,k,i,v)=>{ (o[k]||(o[k]=zeros()))[i]+=v; };
  const iOf = g => idx[mesKey(g)];

  const VD = [["state","=","posted"],["move_type","in",["out_invoice","out_refund"]],EYG.VENTA_REAL,["invoice_date",">=",DESDE]];
  const VL = [["parent_state","=","posted"],["move_id.move_type","in",["out_invoice","out_refund"]],EYG.VENTA_REAL,["display_type","=","product"],["invoice_date",">=",DESDE]];
  const CD = [["state","=","posted"],["move_type","in",["in_invoice","in_refund"]],["journal_id.type","=","purchase"],["invoice_date",">=",DESDE]];
  const CL = [["parent_state","=","posted"],["move_id.move_type","in",["in_invoice","in_refund"]],["journal_id.type","=","purchase"],["display_type","=","product"],["invoice_date",">=",DESDE]];
  const SO = x => "sale_line_ids.order_id."+x;
  const DOM_CORE = ["&",[SO("website_id"),"=",false],"|",[SO("origin"),"ilike","Core"],"&","&",[SO("origin"),"=",false],[SO("create_uid"),"=",520],[SO("user_id"),"!=",520]];

  // pedidos: mes = fecha del pedido en hora argentina → límites en UTC (+3 h)
  const limites = meses.map((m,i)=>{ const [y,mm]=m.split("-").map(Number); const n=mm===12?(y+1)+"-01":y+"-"+String(mm+1).padStart(2,"0"); return [m+"-01 03:00:00", n+"-01 03:00:00"]; });
  const SOD = [["state","in",["sale","done"]],["date_order",">=",DESDE+" 03:00:00"]];

  const [vCab, vCli, vPrim, vCom, lFac, lNc, lTri, cPortal, cWsp, cCore, cPed, cCab, cLin, pCab, pFacMes, pPend] = await Promise.all([
    rg("account.move", VD, ["amount_untaxed_signed:sum","amount_total_signed:sum"], ["invoice_date:month","move_type"]),
    rg("account.move", VD, ["amount_untaxed_signed:sum"], ["invoice_date:month","partner_id","move_type"]),
    rg("account.move", [["state","=","posted"],["move_type","=","out_invoice"],EYG.VENTA_REAL], ["invoice_date:min"], ["commercial_partner_id"]),
    rg("account.move", VD, ["amount_untaxed_signed:sum"], ["invoice_date:month","invoice_user_id","move_type"]),
    rg("account.move.line", VL.concat([["move_id.move_type","=","out_invoice"]]), ["balance:sum","quantity:sum"], ["invoice_date:month","product_id"]),
    rg("account.move.line", VL.concat([["move_id.move_type","=","out_refund"]]), ["balance:sum","quantity:sum"], ["invoice_date:month","product_id"]),
    rg("account.move.line", VL.concat(TRI_FACT), ["balance:sum"], ["invoice_date:month","partner_id"]),
    rg("account.move.line", VL.concat([[SO("website_id"),"!=",false]]), ["balance:sum"], ["invoice_date:month"]),
    rg("account.move.line", VL.concat([[SO("website_id"),"=",false],[SO("origin"),"ilike","WhatsApp"]]), ["balance:sum"], ["invoice_date:month"]),
    rg("account.move.line", VL.concat(DOM_CORE), ["balance:sum"], ["invoice_date:month"]),
    rg("account.move.line", VL.concat([["sale_line_ids","!=",false]]), ["balance:sum"], ["invoice_date:month"]),
    rg("account.move", CD, ["amount_untaxed_signed:sum"], ["invoice_date:month","move_type"]),
    rg("account.move.line", CL, ["balance:sum"], ["invoice_date:month","account_id","partner_id"]),
    rg("sale.order", SOD, ["amount_untaxed:sum"], ["date_order:month"]),
    Promise.all(limites.map(([a,b]) => rg("sale.order.line", [["order_id.state","in",["sale","done"]],["order_id.date_order",">=",a],["order_id.date_order","<",b]], ["untaxed_amount_invoiced:sum","price_subtotal:sum"], ["state"]))),
    q(EYG.rpc("sale.order","search_read",[SOD.concat([["invoice_status","=","to invoice"]])],{fields:["name","date_order","amount_untaxed","partner_id","user_id"],order:"amount_untaxed desc",limit:600,context:CTX})),
  ]);

  // ================= VENTAS (cabeceras) =================
  const serie = meses.map(m=>({mes:m, ventas_brutas:0, nc:0, ventas_netas:0, ventas_propias:0, triangulacion:0, ventas_con_iva:0, n_facturas:0, n_nc:0, compras_netas:0, unidades:0, productos:0, otros_conceptos:0, clientes:0, clientes_nuevos:0}));
  for(const g of vCab){ const i=iOf(g["invoice_date:month"]); if(i===undefined) continue; const s=serie[i];
    if(g.move_type==="out_invoice"){ s.ventas_brutas+=g.amount_untaxed_signed; s.n_facturas+=g.__count; } else { s.nc+=g.amount_untaxed_signed; s.n_nc+=g.__count; }
    s.ventas_con_iva+=g.amount_total_signed; }

  // ================= CLIENTES y UBICACIÓN =================
  const pids=[...new Set(vCli.map(g=>m2oId(g.partner_id)).filter(Boolean))];
  const RF = EYG.RUBRO_FIELD;
  const partners = await leerEnTandas("res.partner", pids, ["name","city","state_id","zip","partner_latitude","partner_longitude","commercial_partner_id"], {active_test:false});
  const pInfo={}; partners.forEach(p=>pInfo[p.id]=p);
  const cpIds=[...new Set(partners.map(p=>m2oId(p.commercial_partner_id)||p.id))];
  const comercialesP = await leerEnTandas("res.partner", cpIds, ["name",RF,"category_id"], {active_test:false});
  const cpInfo={}; comercialesP.forEach(p=>cpInfo[p.id]=p);
  const primeraDe={}; for(const g of vPrim){ const id=m2oId(g.commercial_partner_id); if(id) primeraDe[id]=String(g.invoice_date||""); }
  const cli={}, cliN={}, ubi={}, ubiN={}; const cliMes=meses.map(()=>new Set());
  for(const g of vCli){
    const i=iOf(g["invoice_date:month"]); if(i===undefined) continue;
    const pid=m2oId(g.partner_id); const p=pInfo[pid]||{}; const cp=m2oId(p.commercial_partner_id)||pid;
    const v=g.amount_untaxed_signed||0, fac=g.move_type==="out_invoice";
    add(cli,cp,i,v); add(ubi,pid,i,v);
    if(fac){ add(cliN,cp,i,g.__count); add(ubiN,pid,i,g.__count); cliMes[i].add(cp); }
  }
  serie.forEach((s,i)=>{ s.clientes=cliMes[i].size; s.clientes_nuevos=[...cliMes[i]].filter(id=>(primeraDe[id]||"").slice(0,7)===s.mes).length; });
  // ================= TRIANGULACION (por la cuenta de ingresos del renglon) =================
  // Va apartada pero adentro: el total de ventas netas NO cambia, la venta propia sale por resta.
  const triCli={};
  for(const g of lTri){ const i=iOf(g["invoice_date:month"]); if(i===undefined) continue;
    const v=-(g.balance||0); serie[i].triangulacion+=v;
    const pid=m2oId(g.partner_id); const pp=pInfo[pid]||{}; const cp=m2oId(pp.commercial_partner_id)||pid;
    if(cp) add(triCli,cp,i,v); }

  const clientes = Object.keys(cli).map(id=>{ const c=cpInfo[id]||{}; return {id:+id, nombre:c.name||m2oName((pInfo[id]||{}).commercial_partner_id)||"?", rubro:EYG.rubroDe(c)||"", valores:cli[id].map(r2), n:cliN[id]||zeros(), tri:(triCli[id]||zeros()).map(r2)}; });
  const ubicaciones = Object.keys(ubi).map(id=>{ const p=pInfo[id]||{}; return {id:+id, nombre:p.name||"?", city:p.city||"", state:m2oName(p.state_id).replace(/\s*\(AR\)\s*$/,""), zip:p.zip||"", lat:p.partner_latitude||0, lon:p.partner_longitude||0, state_id:p.state_id, valores:ubi[id].map(r2), n:ubiN[id]||zeros()}; });

  // ================= COMERCIALES =================
  const com={}, comN={};
  for(const g of vCom){ const i=iOf(g["invoice_date:month"]); if(i===undefined) continue; const k=m2oName(g.invoice_user_id)||"Sin comercial"; add(com,k,i,g.amount_untaxed_signed||0); if(g.move_type==="out_invoice") add(comN,k,i,g.__count); }

  // ================= RENGLONES: productos, unidades, control =================
  const ctrlV = zeros(), prodAgg={};
  const lineas = (arr, sgn) => { for(const g of arr){ const i=iOf(g["invoice_date:month"]); if(i===undefined) continue;
    const neto=-(g.balance||0); ctrlV[i]+=neto; const pid=m2oId(g.product_id);
    if(!pid){ serie[i].otros_conceptos+=neto; continue; }
    serie[i].productos+=neto; const q2=sgn*(g.quantity||0); serie[i].unidades+=q2;
    const a=(prodAgg[pid]||(prodAgg[pid]={neto:zeros(),unidades:zeros()})); a.neto[i]+=neto; a.unidades[i]+=q2; } };
  lineas(lFac,1); lineas(lNc,-1);
  const prodIds=Object.keys(prodAgg).map(Number);
  const prods = await leerEnTandas("product.product", prodIds, ["default_code","name","categ_id"], {active_test:false});
  const prodInfo={}; prods.forEach(p=>prodInfo[p.id]=p);
  const lineaDe = c => { const parts=String(c||"").split(" / "); if(parts[0]==="ALL") return parts[1]||"Sin categoría"; return parts[0]||"Sin categoría"; };
  const productos = prodIds.map(pid=>{ const p=prodInfo[pid]||{}, a=prodAgg[pid];
    return {id:pid, codigo:p.default_code||"", nombre:String(p.name||"(producto "+pid+")"), linea:lineaDe(m2oName(p.categ_id)), neto:a.neto.map(r2), unidades:a.unidades.map(r2)}; })
    .sort((x,y)=>y.neto.reduce((s,v)=>s+v,0)-x.neto.reduce((s,v)=>s+v,0));

  // ================= CANALES (por el pedido de venta de cada renglón) =================
  const serieDe = arr => { const z=zeros(); for(const g of arr){ const i=iOf(g["invoice_date:month"]); if(i!==undefined) z[i]+=-(g.balance||0); } return z; };
  const sPortal=serieDe(cPortal), sWsp=serieDe(cWsp), sCore=serieDe(cCore), sPed=serieDe(cPed);
  const canales = [
    {canal:"Core (comerciales)", valores:sCore},
    {canal:"Odoo a mano", valores:sPed.map((v,i)=>v-sPortal[i]-sWsp[i]-sCore[i])},
    {canal:"Portal web", valores:sPortal},
    {canal:"WhatsApp", valores:sWsp},
    {canal:"Sin pedido (factura directa)", valores:ctrlV.map((v,i)=>v-sPed[i])},
  ].map(c=>({canal:c.canal, valores:c.valores.map(r2)}));

  // ================= COMPRAS =================
  const ctrlC=zeros(), cabC=zeros(), excl={}, cGrupo={}, cCuenta={}, cuentaGrupo={}, prov={}, provNombre={}, provGrupo={};
  for(const g of cCab){ const i=iOf(g["invoice_date:month"]); if(i!==undefined) cabC[i]+=-(g.amount_untaxed_signed||0); }
  for(const g of cLin){ const i=iOf(g["invoice_date:month"]); if(i===undefined) continue;
    const v=g.balance||0; ctrlC[i]+=v;
    const acc=m2oName(g.account_id), code=acc.split(" ")[0], gr=grupoCompra(code);
    if(!gr){ add(excl,excluidoDe(code),i,v); continue; }
    serie[i].compras_netas+=v; add(cGrupo,gr,i,v); add(cCuenta,acc,i,v); cuentaGrupo[acc]=gr;
    const pk=String(m2oId(g.partner_id)||0); add(prov,pk,i,v); provNombre[pk]=m2oName(g.partner_id)||"(sin proveedor)";
    if(gr==="Mercadería") add(provGrupo,pk,i,v); }

  // ================= PEDIDOS CONFIRMADOS =================
  const pedSerie = meses.map(m=>({mes:m, n:0, confirmado:0, facturado:0, sin_facturar:0}));
  for(const g of pCab){ const i=iOf(g["date_order:month"]); if(i===undefined) continue; pedSerie[i].n+=g.__count; pedSerie[i].confirmado+=g.amount_untaxed||0; }
  pFacMes.forEach((gs,i)=>{ let f=0, st=0; gs.forEach(g=>{ f+=g.untaxed_amount_invoiced||0; st+=g.price_subtotal||0; }); pedSerie[i].facturado=f; pedSerie[i].control_renglones=r2(st); });
  pedSerie.forEach(s=>{ s.sin_facturar=r2(s.confirmado-s.facturado); s.confirmado=r2(s.confirmado); s.facturado=r2(s.facturado); });
  let pendientes=[];
  if(pPend.length){
    const f = await rg("sale.order.line", [["order_id","in",pPend.map(p=>p.id)]], ["untaxed_amount_invoiced:sum"], ["order_id"]);
    const fac={}; f.forEach(g=>fac[m2oId(g.order_id)]=g.untaxed_amount_invoiced||0);
    pendientes = pPend.map(p=>{ const d=EYG.argParts(p.date_order); const conf=p.amount_untaxed||0, fc=fac[p.id]||0;
      return {pedido:p.name, fecha:d.date, mes:d.date.slice(0,7), cliente:m2oName(p.partner_id), comercial:m2oName(p.user_id), confirmado:r2(conf), facturado:r2(fc), sin_facturar:r2(conf-fc)}; })
      .filter(p=>Math.abs(p.sin_facturar)>=1).sort((a,b)=>b.sin_facturar-a.sin_facturar);
  }

  serie.forEach(s=>{ s.ventas_netas=s.ventas_brutas+s.nc; s.ventas_propias=s.ventas_netas-s.triangulacion; for(const k in s) if(typeof s[k]==="number") s[k]=r2(s[k]); });
  const toList=(o,key,extra)=>Object.entries(o).map(([k,v])=>Object.assign({[key]:k}, extra?extra(k):{}, {valores:v.map(r2), total:r2(v.reduce((a,b)=>a+b,0))})).sort((a,b)=>b.total-a.total);

  return {
    generado:new Date().toISOString(), desde:DESDE, meses, serie, canales, clientes, ubicaciones, productos,
    comerciales: toList(com,"nombre",k=>({n:(comN[k]||zeros())})),
    pedidos:{serie:pedSerie, pendientes, n_pend_leidos:pPend.length},
    compras_grupos: toList(cGrupo,"grupo"),
    compras_cuentas: toList(cCuenta,"cuenta",k=>({grupo:cuentaGrupo[k]})),
    proveedores: toList(prov,"id",k=>({nombre:provNombre[k], merc:(provGrupo[k]||zeros()).map(r2)})),
    excluidos: toList(excl,"concepto"),
    control:{
      ventas: serie.map((s,i)=>({mes:s.mes, cabecera:s.ventas_netas, renglones:r2(ctrlV[i]), dif:r2(s.ventas_netas-ctrlV[i])})),
      compras: meses.map((m,i)=>({mes:m, cabecera:r2(cabC[i]), renglones:r2(ctrlC[i]), dif:r2(cabC[i]-ctrlC[i])})),
      canales: meses.map((m,i)=>r2(canales.reduce((a,c)=>a+c.valores[i],0)-ctrlV[i])),
      pedidos: pedSerie.map(s=>r2(s.confirmado-s.control_renglones)),
      comprobantes_venta: vCab.reduce((a,g)=>a+g.__count,0), comprobantes_compra: cCab.reduce((a,g)=>a+g.__count,0),
    },
  };
}

/* ============================== ESTADO ============================== */
let D=null;
const OBS=[];
const st={a:0,b:0,compras:"todas",prodModo:"neto",prodSort:"neto",prodDir:-1,prodQ:"",off:{},depto:null};

async function cargar(forzar){
  $("root").innerHTML = '<div class="loading"><div class="spinner"></div><div id="load-txt">Leyendo Odoo…</div><div class="nota">La primera vez tarda (son ~19 meses de facturas de toda la droguería). Después queda guardado 15 minutos en esta pestaña.</div></div>';
  $("status").className="status"; $("status").textContent="Cargando datos de Odoo…";
  try{
    let data=null;
    if(!forzar){ try{ const c=JSON.parse(sessionStorage.getItem(CACHE_K)||"null"); if(c && Date.now()-c.t<CACHE_TTL && c.v && c.v.meses && c.v.meses[c.v.meses.length-1]===MES_ACTUAL) data=c.v; }catch(e){} }
    if(!data){ data=await construir(); try{ sessionStorage.setItem(CACHE_K, JSON.stringify({t:Date.now(), v:data})); }catch(e){} }
    D=data; D.ubicaciones.forEach(u=>u.u=ubicar({state_id:u.state_id, city:u.city, zip:u.zip, partner_latitude:u.lat, partner_longitude:u.lon}));
    if(!forzar || st.b>=D.meses.length){ st.a=0; st.b=D.meses.length-1; }
    armarSelects(); marcarSeg(); render();
  }catch(e){
    $("status").className="status err"; $("status").textContent="No se pudieron leer los datos: "+(e.message||e);
    $("root").innerHTML="";
  }
}

function armarSelects(){
  const opts=D.meses.map((m,i)=>`<option value="${i}">${lblMes(m)}${m===MES_ACTUAL?" (en curso)":""}</option>`).join("");
  $("sel-desde").innerHTML=opts; $("sel-hasta").innerHTML=opts; syncSelects();
}
function syncSelects(){ $("sel-desde").value=st.a; $("sel-hasta").value=st.b; }

function comprasMes(i){
  if(st.compras==="todas") return D.serie[i].compras_netas;
  const g=D.compras_grupos.find(x=>x.grupo==="Mercadería"); return g?g.valores[i]:0;
}

/* ============================== ESTADO / CUADRE ============================== */
function composicionOk(){ return D.serie.every(s=>Math.abs(s.productos+s.otros_conceptos-s.ventas_netas)<0.05); }
function renderStatus(){
  const C=D.control;
  const ok = C.ventas.every(c=>Math.abs(c.dif)<0.01) && C.compras.every(c=>Math.abs(c.dif)<0.01) && C.canales.every(v=>Math.abs(v)<0.05) && C.pedidos.every(v=>Math.abs(v)<0.05) && composicionOk()
    && D.serie.every(x=>Math.abs(x.ventas_propias+x.triangulacion-x.ventas_netas)<0.05);
  const h=new Date(D.generado);
  $("status").className="status";
  $("status").innerHTML=`Odoo · Droguería EyG · leído ${h.toLocaleDateString("es-AR")} ${h.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})} · ${fmtN(C.comprobantes_venta)} comprobantes de venta y ${fmtN(C.comprobantes_compra)} de compra · `+
    (ok?'<span class="ok" title="Cada total se calculó dos veces por caminos distintos y coincide al centavo. Detalle en el control al pie.">✔ Cuadra al centavo</span>':'<span class="bad">✖ Hay una diferencia de cuadre — ver el control al pie</span>');
}

/* ============================== RENDER ============================== */
function render(){
  OBS.splice(0).forEach(o=>o.disconnect());
  renderStatus();
  const a=st.a, b=st.b, n=b-a+1, pa=a-n, pb=a-1, hayPrev=pa>=0, S=D.serie;
  const tot=(k,x=a,y=b)=>sum(S.map(s=>s[k]),x,y);
  const comp=(x,y)=>{ let s=0; for(let i=x;i<=y;i++) s+=comprasMes(i); return s; };
  const V=tot("ventas_netas"), Cm=comp(a,b), M=V-Cm, U=tot("unidades"), F=tot("n_facturas");
  const TRI=tot("triangulacion"), VP=V-TRI;   // triangulación apartada dentro del total
  const prev = hayPrev ? {V:tot("ventas_netas",pa,pb), C:comp(pa,pb), U:tot("unidades",pa,pb), F:tot("n_facturas",pa,pb), TRI:tot("triangulacion",pa,pb)} : null;
  if(prev) prev.M=prev.V-prev.C;

function irA(id){ const el=$(id); if(!el) return; el.scrollIntoView({behavior:"smooth",block:"start"}); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }

/* ---------- gráfico principal (barras + líneas, admite margen negativo) ---------- */
function renderMain(){
  const el=$("ch-main"), S=D.serie, n=S.length;
  const ser={ventas:S.map(s=>s.ventas_netas), compras:S.map((s,i)=>comprasMes(i)), tri:S.map(s=>s.triangulacion||0)};
  ser.margen=ser.ventas.map((v,i)=>v-ser.compras[i]); ser.pedidos=D.pedidos.serie.map(x=>x.confirmado);
  const vis=k=>!st.off[k];
  const all=[].concat(vis("ventas")?ser.ventas:[],vis("compras")?ser.compras:[],vis("margen")?ser.margen:[],vis("pedidos")?ser.pedidos:[],[0]);
  let mx=Math.max(...all), mn=Math.min(...all);
  const paso=(()=>{ const r=(mx-mn)||1, p=Math.pow(10,Math.floor(Math.log10(r/4))), m=r/4/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; })();
  mx=Math.ceil(mx/paso)*paso; mn=Math.floor(mn/paso)*paso;
  const draw=()=>{
    const W=Math.max(320,el.clientWidth||700), H=300, mL=56, mR=12, mT=14, mB=28, iw=W-mL-mR, ih=H-mT-mB;
    const y=v=>mT+ih*(mx-v)/((mx-mn)||1), slot=iw/n, xc=i=>mL+slot*(i+.5);
    const nb=(vis("ventas")?1:0)+(vis("compras")?1:0), bw=Math.min(30,slot*.32);
    let g="";
    for(let v=mn; v<=mx+1e-6; v+=paso) g+=`<line x1="${mL}" x2="${W-mR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-opacity="${Math.abs(v)<1e-6?1:.6}"${Math.abs(v)<1e-6?' stroke-width="1.4"':""}/><text x="${mL-7}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--gris2)">${corto(v)}</text>`;
    let body="";
    for(let i=0;i<n;i++){
      const dim=i<st.a||i>st.b;
      if(!dim) body+=`<rect x="${mL+slot*i+2}" y="${mT}" width="${slot-4}" height="${ih}" rx="8" fill="var(--teal)" opacity=".05"/>`;
      let k=0;
      [["ventas",COL.ventas],["compras",COL.compras]].forEach(([sk,c])=>{ if(!vis(sk)) return;
        const off=nb===2?(k===0?-bw/2-1.5:bw/2+1.5):0; k++;
        const v=ser[sk][i], y0=y(0), yv=y(v), x0=xc(i)+off-bw/2;
        body+=`<rect x="${x0}" y="${Math.min(y0,yv)}" width="${bw}" height="${Math.max(1,Math.abs(y0-yv))}" rx="4" fill="${c}" opacity="${dim?.28:.92}"/>`;
        /* la triangulación se apoya arriba de la venta propia: misma barra, dos tramos */
        if(sk==="ventas" && vis("tri") && v>0){ const t=ser.tri[i]; if(t>0.005){ const yp=y(Math.max(0,v-t));
          body+=`<rect x="${x0}" y="${yv}" width="${bw}" height="${Math.max(1,yp-yv)}" rx="4" fill="${COL.tri}" opacity="${dim?.3:.95}"/>`
               + `<line x1="${x0}" x2="${x0+bw}" y1="${yp}" y2="${yp}" stroke="var(--surface)" stroke-width="1.4"/>`; } } });
      body+=`<text x="${xc(i)}" y="${H-8}" text-anchor="middle" font-size="${slot<44?9:10.5}" fill="${dim?"var(--gris2)":"var(--gris)"}" font-weight="${dim?400:700}">${slot<44?MES_TXT[+S[i].mes.slice(5)-1]:lblMes(S[i].mes)}${S[i].mes===MES_ACTUAL?"*":""}</text>`;
    }
    if(vis("margen")){ const pts=ser.margen.map((v,i)=>[xc(i),y(v)]);
      body+=`<path d="${pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join("")}" fill="none" stroke="${COL.margen}" stroke-width="2.6" stroke-linejoin="round"/>`;
      pts.forEach((p,i)=>{ body+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#fff" stroke="${ser.margen[i]<0?"var(--hot)":COL.margen}" stroke-width="2.4"/>`; }); }
    if(vis("pedidos")){ const pp=ser.pedidos.map((v,i)=>[xc(i),y(v)]);
      body+=`<path d="${pp.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join("")}" fill="none" stroke="${COL.pedidos}" stroke-width="2.2" stroke-dasharray="6 5" stroke-linejoin="round"/>`;
      pp.forEach(p=>{ body+=`<rect x="${p[0]-3.5}" y="${p[1]-3.5}" width="7" height="7" rx="1.5" transform="rotate(45 ${p[0]} ${p[1]})" fill="${COL.pedidos}"/>`; }); }
    el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="width:100%;height:${H}px;display:block;cursor:pointer">${g}${body}</svg><div class="tip"></div>`;
    const svg=el.querySelector("svg"), tip=el.querySelector(".tip");
    const iDe=e=>{ const r=svg.getBoundingClientRect(); return Math.max(0,Math.min(n-1,Math.floor(((e.clientX-r.left)/r.width*W-mL)/slot))); };
    svg.addEventListener("mousemove",e=>{ const r=svg.getBoundingClientRect(), i=iDe(e), s=S[i], m=ser.margen[i];
      tip.innerHTML=`<div class="t">${lblMesLargo(s.mes)}${s.mes===MES_ACTUAL?" (en curso)":""}</div>
        <div class="r"><span>Ventas netas</span><b>${fmt$(ser.ventas[i])}</b></div>
        ${ser.tri[i]>0.005?`<div class="r"><span>· venta propia</span><b>${fmt$(ser.ventas[i]-ser.tri[i])}</b></div>
        <div class="r"><span>· triangulación</span><b style="color:${COL.tri}">${fmt$(ser.tri[i])} · ${fmtP(ser.ventas[i]?ser.tri[i]/ser.ventas[i]:NaN)}</b></div>`:""}
        <div class="r"><span>Compras ${st.compras==="oper"?"mercadería":"netas"}</span><b>${fmt$(ser.compras[i])}</b></div>
        <div class="r"><span>Margen</span><b class="${m<0?"neg":"pos"}">${fmt$(m)} · ${fmtP(ser.ventas[i]?m/ser.ventas[i]:NaN)}</b></div>

        <div class="r"><span>Facturas · unidades</span><b>${fmtN(s.n_facturas)} · ${fmtN(s.unidades)}</b></div>`;
      tip.style.opacity=1; const left=xc(i)/W*r.width; tip.style.left=Math.min(r.width-tip.offsetWidth-4,Math.max(4,left+14))+"px"; tip.style.top="6px"; });

/* ---------- mapa por departamento ---------- */
function renderMapa(a,b){
  const el=$("map"), val={}, cnt={}, locs={};
  const fuera={}, sinU=[]; let totAll=0;
  D.ubicaciones.forEach(u=>{
    const v=sum(u.valores,a,b), c=sum(u.n,a,b); if(!v && !c) return; totAll+=v;
    if(u.u.depto){ val[u.u.depto]=(val[u.u.depto]||0)+v; cnt[u.u.depto]=(cnt[u.u.depto]||0)+c;
      const lk=u.u.depto+"|"+u.u.loc; const L=(locs[lk]||(locs[lk]={depto:u.u.depto, loc:u.u.loc, v:0, n:0, cli:[]})); L.v+=v; L.n+=c; L.cli.push({nombre:u.nombre, v}); }
    else if(u.u.fuera){ const f=(fuera[u.u.fuera]||(fuera[u.u.fuera]={v:0,cli:[]})); f.v+=v; f.cli.push({nombre:u.nombre, city:u.city, v}); }
    else sinU.push({nombre:u.nombre, city:u.city, v});
  });
  const mx=Math.max(1,...Object.values(val));
  let paths="", labels="";
  SF.deptos.forEach(d=>{
    const v=val[d.name]||0, t=v>0?Math.sqrt(v/mx):0;
    const fill=v>0?`color-mix(in srgb, #048782 ${Math.round(12+t*88)}%, #EFF5F4)`:"#EFF5F4";
    const dd=d.rings.map(r=>"M"+r.map(p=>p[0]+" "+p[1]).join("L")+"Z").join("");
    paths+=`<path class="dep${st.depto===d.name?" sel":""}" data-n="${esc(d.name)}" d="${dd}" fill="${fill}"/>`;
    // etiqueta en el centro del anillo más grande
    const big=d.rings.reduce((x,r)=>r.length>x.length?r:x,[]); let cx=0,cy=0; big.forEach(p=>{cx+=p[0];cy+=p[1];}); cx/=big.length||1; cy/=big.length||1;
    labels+=`<text class="dl" x="${cx}" y="${cy}" text-anchor="middle">${esc(d.name)}</text>`;
  });
  el.innerHTML=`<svg viewBox="${SF.viewBox}">${paths}${labels}</svg><div class="tip"></div>`;
  const tip=el.querySelector(".tip");
  el.querySelectorAll("path.dep").forEach(p=>{
    p.addEventListener("mousemove",e=>{ const k=p.dataset.n, v=val[k]||0, r=el.getBoundingClientRect();
      const nl=Object.values(locs).filter(l=>l.depto===k).length;
      tip.innerHTML=`<div class="t">Departamento ${esc(k)}</div><div class="r"><span>Ventas netas</span><b>${fmt$(v)}</b></div><div class="r"><span>Participación</span><b>${fmtP(totAll?v/totAll:0)}</b></div><div class="r"><span>Facturas</span><b>${fmtN(cnt[k]||0)}</b></div><div class="r"><span>Localidades con ventas</span><b>${nl}</b></div>`;
      tip.style.opacity=1; tip.style.left=Math.max(4,Math.min(r.width-190,e.clientX-r.left+12))+"px"; tip.style.top=(e.clientY-r.top+12)+"px"; });
    p.addEventListener("mouseleave",()=>tip.style.opacity=0);
    p.addEventListener("click",()=>{ st.depto = st.depto===p.dataset.n ? null : p.dataset.n; renderMapa(st.a,st.b); });
  });
  const totSF=Object.values(val).reduce((s,v)=>s+v,0);
  if(st.depto){
    const L=Object.values(locs).filter(l=>l.depto===st.depto).sort((x,y)=>y.v-x.v);
    $("dep-head").innerHTML=`<div class="deptbar"><button class="linkbtn" id="dep-back" title="Volver al ranking de departamentos">← Todos los departamentos</button><b>${esc(st.depto)}</b><span class="muted">${fmt$(val[st.depto]||0)} · ${fmtP(totAll?(val[st.depto]||0)/totAll:0)} del total</span></div>`;
    $("dep-back").onclick=()=>{ st.depto=null; renderMapa(st.a,st.b); };
    barras($("dep-rank"), L.slice(0,15).map(l=>({label:l.loc, value:l.v, title:l.loc+": "+l.cli.length+" cliente(s) · "+l.cli.sort((x,y)=>y.v-x.v).slice(0,6).map(c=>c.nombre).join(", ")})), v=>corto(v)+" · "+fmtP(totAll?v/totAll:0), "#048782");
  } else {
    $("dep-head").innerHTML="";
    barras($("dep-rank"), Object.keys(val).filter(k=>val[k]).sort((x,y)=>val[y]-val[x]).map(k=>({label:k, value:val[k], key:k, title:"Tocá para ver las localidades de "+k})), v=>corto(v)+" · "+fmtP(totAll?v/totAll:0), "#048782", k=>{ st.depto=k; renderMapa(st.a,st.b); });
  }
  const nDep=Object.keys(val).filter(k=>val[k]>0).length;
  const top=Object.keys(val).sort((x,y)=>val[y]-val[x])[0];
  const fueraL=Object.entries(fuera).sort((x,y)=>y[1].v-x[1].v);
  const fueraTot=fueraL.reduce((s,[,f])=>s+f.v,0), sinTot=sinU.reduce((s,c)=>s+c.v,0);
  $("dep-nota").innerHTML=`Vendiste en <b>${nDep} de 19</b> departamentos de Santa Fe, que suman <b>${fmtP(totAll?totSF/totAll:0)}</b> de las ventas.${top?` El primero, <b>${esc(top)}</b>, concentra el <b>${fmtP(totAll?val[top]/totAll:0)}</b>.`:""} Departamento = el de la localidad del contacto facturado (padrón oficial de localidades de georef; si la localidad está mal escrita se usa el código postal o la ubicación del mapa).`+
    (fueraL.length?`<details class="lst"><summary title="Clientes cuya provincia en Odoo no es Santa Fe">Fuera de Santa Fe: ${fmt$(fueraTot)} · ${fmtP(totAll?fueraTot/totAll:0)}</summary><ul>${fueraL.map(([p,f])=>`<li><b>${esc(p)}</b> ${fmt$(f.v)} — ${esc(f.cli.sort((x,y)=>y.v-x.v).slice(0,8).map(c=>c.nombre+(c.city?" ("+c.city+")":"")).join(" · "))}</li>`).join("")}</ul></details>`:"")+
    (sinU.length?`<details class="lst"><summary title="Clientes de Santa Fe cuya localidad no se pudo reconocer: corregir la ficha en Odoo">Santa Fe sin ubicar (localidad a corregir en la ficha): ${fmt$(sinTot)} · ${sinU.length} cliente(s)</summary><ul>${sinU.sort((x,y)=>y.v-x.v).map(c=>`<li>${esc(c.nombre)} — localidad cargada: “${esc(c.city||"vacía")}” · ${fmt$(c.v)}</li>`).join("")}</ul></details>`:"");
}

/* ---------- donas ---------- */
function dona(elD, elL, items, colorDe, centro, descDe){
  const tot=items.reduce((s,x)=>s+Math.max(0,x.value),0);
  const segs=items.filter(x=>x.value>0).map((x,i)=>({label:x.label, value:x.value, color:colorDe?colorDe(x.label,i):PALETA[i%PALETA.length]}));
  const size=164, R=size*.35, C=2*Math.PI*R, cc=size/2, T=segs.reduce((a,s)=>a+s.value,0)||1;
  let ring=`<circle cx="${cc}" cy="${cc}" r="${R}" fill="none" stroke="#EFF5F4" stroke-width="${size*.1}"/>`, off=0;
  segs.forEach(s=>{ const len=C*s.value/T; ring+=`<circle cx="${cc}" cy="${cc}" r="${R}" fill="none" stroke="${s.color}" stroke-width="${size*.1}" stroke-dasharray="${Math.max(0,len-1.5)} ${C-len+1.5}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cc} ${cc})"><title>${esc(s.label)}: ${fmt$(s.value)} · ${fmtP(s.value/T)}</title></circle>`; off+=len; });
  elD.style.position="relative";
  elD.innerHTML=`<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="display:block">${ring}</svg><div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none"><div><div style="font-size:${size*.115}px;font-weight:900;letter-spacing:-.02em;color:var(--ink)">${esc(corto(tot))}</div><div style="font-size:${size*.066}px;color:var(--gris2);text-transform:uppercase;letter-spacing:.05em;font-weight:700">${esc(centro||"total")}</div></div></div>`;
  elL.innerHTML=segs.map(s=>`<div class="it" title="${esc(s.label)}: ${fmt$c(s.value)}${descDe&&descDe(s.label)?" — "+esc(descDe(s.label)):""}"><i style="background:${s.color}"></i><span>${esc(s.label)}</span><span class="n">${corto(s.value)}</span><span class="p">${fmtP(tot?s.value/tot:0)}</span></div>`).join("")||'<span class="muted">Sin datos</span>';
}
function rubroLbl(r){ const m=EYG.RUBRO_META[r]; return m?m.l:"Sin rubro"; }
function renderDonas(a,b){
  dona($("d-canal"),$("l-canal"),D.canales.map(c=>({label:c.canal, value:sum(c.valores,a,b)})).sort((x,y)=>y.value-x.value),l=>COL_CANAL[l]||"#8A9A97","ventas",l=>DESC_CANAL[l]);
  const lin={}; D.productos.forEach(p=>{ const k=cap(p.linea); lin[k]=(lin[k]||0)+sum(p.neto,a,b); });
  dona($("d-linea"),$("l-linea"),Object.entries(lin).map(([label,value])=>({label,value})).sort((x,y)=>y.value-x.value),null,"en productos");
  const rub={}; D.clientes.forEach(c=>{ const k=rubroLbl(c.rubro); rub[k]=(rub[k]||0)+sum(c.valores,a,b); });

/* ---------- barras apiladas por mes ---------- */
function apiladas(el, series, money){
  const S=D.serie, n=S.length; money = money!==false;
  const draw=()=>{
    const W=Math.max(300,el.clientWidth||500), H=230, mL=48, mR=8, mT=10, mB=24, iw=W-mL-mR, ih=H-mT-mB;
    const totals=S.map((_,i)=>series.reduce((s,x)=>s+Math.max(0,x.values[i]),0));
    const mx=Math.max(1,...totals), slot=iw/n, bw=Math.min(36,slot*.6);
    let g="";
    [0,.5,1].forEach(f=>{ const yy=mT+ih*(1-f); g+=`<line x1="${mL}" x2="${W-mR}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-opacity="${f?.6:1}"/><text x="${mL-6}" y="${yy+3.5}" text-anchor="end" font-size="10" fill="var(--gris2)">${money?corto(mx*f):fmtN(mx*f)}</text>`; });
    let body="";
    for(let i=0;i<n;i++){ const dim=i<st.a||i>st.b; let acc=0; const x=mL+slot*i+(slot-bw)/2;
      series.forEach(sr=>{ const v=Math.max(0,sr.values[i]), h=ih*v/mx, yy=mT+ih-acc-h; acc+=h; if(h>0) body+=`<rect x="${x}" y="${yy}" width="${bw}" height="${h}" fill="${sr.color}" opacity="${dim?.3:.92}"/>`; });
      body+=`<text x="${x+bw/2}" y="${H-7}" text-anchor="middle" font-size="${slot<34?8.5:10}" fill="var(--gris2)">${slot<52?MES_TXT[+S[i].mes.slice(5)-1]:lblMes(S[i].mes)}</text>`; }
    el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="width:100%;height:${H}px;display:block">${g}${body}</svg><div class="tip"></div>`;
    const svg=el.querySelector("svg"), tip=el.querySelector(".tip");
    svg.addEventListener("mousemove",e=>{ const r=svg.getBoundingClientRect(), i=Math.max(0,Math.min(n-1,Math.floor(((e.clientX-r.left)/r.width*W-mL)/slot))), tt=totals[i];
      tip.innerHTML=`<div class="t">${lblMesLargo(S[i].mes)}</div>`+series.map(sr=>`<div class="r"><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${sr.color};margin-right:5px"></i>${esc(sr.name)}</span><b>${money?fmt$(sr.values[i]):fmtN(sr.values[i])} · ${fmtP(tt?sr.values[i]/tt:0)}</b></div>`).join("");
      tip.style.opacity=1; tip.style.left=Math.min(r.width-tip.offsetWidth-4,Math.max(4,(e.clientX-r.left)+12))+"px"; tip.style.top="4px"; });
    svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
  };
  draw(); observar(el,draw);
}

/* ---------- barras horizontales (etiqueta completa en 2 líneas si hace falta) ---------- */
function barras(el, items, fmt, color, onClick){
  if(!items.length){ el.innerHTML='<div class="muted" style="padding:18px;text-align:center;font-size:13px">Sin datos en el período</div>'; return; }
  const max=Math.max(1,...items.map(i=>i.value));
  el.innerHTML='<div class="bh">'+items.map((it,k)=>`<div class="r${onClick?" clk":""}" data-k="${k}" title="${esc(it.title||it.label+": "+fmt$c(it.value))}"><span class="lb">${esc(it.label)}</span><span class="tr"><span style="width:${Math.max(2,Math.round(Math.max(0,it.value)/max*100))}%;background:${it.color||color}"></span></span><span class="vl">${fmt(it.value)}</span></div>`).join("")+"</div>";
  if(onClick) el.querySelectorAll(".r").forEach(r=>r.onclick=()=>onClick(items[+r.dataset.k].key));
}

/* ---------- productos ---------- */
function renderProductos(a,b){
  const rows=D.productos.map(p=>({...p, n:sum(p.neto,a,b), u:sum(p.unidades,a,b)})).filter(p=>Math.abs(p.n)>=0.005||p.u);
  const totN=rows.reduce((s,p)=>s+p.n,0), k=st.prodModo==="neto"?"n":"u";
  barras($("prod-top"),[...rows].sort((x,y)=>y[k]-x[k]).slice(0,15).map(p=>({label:p.nombre, value:p[k], title:(p.codigo?"["+p.codigo+"] ":"")+p.nombre+": "+fmt$c(p.n)+" · "+fmtN(p.u)+" u"})), v=>k==="n"?corto(v):fmtN(v)+" u", k==="n"?"#048782":"#1E5FA8");
  const q=norm(st.prodQ), lista=rows.filter(p=>!q||norm(p.codigo+" "+p.nombre).includes(q));
  lista.forEach(p=>p.prom=p.u?p.n/p.u:0);
  const key={neto:"n",u:"u",cod:"codigo",prom:"prom"}[st.prodSort]||"n";
  lista.sort((x,y)=>{ const A=x[key],B=y[key]; return (typeof A==="string"?A.localeCompare(B):A-B)*st.prodDir; });
  const mx=Math.max(1,...lista.map(p=>p.n)), MAXF=400;
  const th=(id,t,cls,tt)=>`<th class="sort ${cls||""}" data-s="${id}" title="${esc(tt)}">${t}${st.prodSort===id?(st.prodDir<0?" ▾":" ▴"):""}</th>`;
  $("prod-tbl").innerHTML=`<thead><tr>${th("cod","Código","","Código interno del producto")}<th title="Nombre del producto en Odoo">Producto</th><th title="Familia (categoría principal)">Familia</th>${th("u","Unidades","num","Unidades facturadas menos devueltas")}${th("neto","Ventas netas","num","Ventas netas sin IVA")}<th class="num" title="Participación sobre el total de productos del período">% total</th>${th("prom","Precio prom. neto","num","Ventas netas / unidades, sin IVA")}</tr></thead><tbody>`+
    lista.slice(0,MAXF).map(p=>`<tr><td class="code">${esc(p.codigo)}</td><td>${esc(p.nombre)}<span class="barcell" style="width:${Math.max(1,p.n/mx*100)}%"></span></td><td class="muted" style="font-size:12px;white-space:nowrap">${esc(cap(p.linea))}</td><td class="num">${fmtN(p.u)}</td><td class="num" title="${fmt$c(p.n)}">${fmt$(p.n)}</td><td class="num muted">${fmtP(totN?p.n/totN:0)}</td><td class="num">${p.u?fmt$(p.prom):"—"}</td></tr>`).join("")+
    (lista.length>MAXF?`<tr><td colspan="7" class="muted" style="text-align:center;padding:12px">Se muestran los primeros ${MAXF} de ${fmtN(lista.length)}. Usá el buscador para encontrar el resto (los totales de abajo son de los ${fmtN(lista.length)}).</td></tr>`:"")+
    `</tbody><tfoot><tr><td></td><td>${fmtN(lista.length)} productos</td><td></td><td class="num">${fmtN(lista.reduce((s,p)=>s+p.u,0))}</td><td class="num">${fmt$(lista.reduce((s,p)=>s+p.n,0))}</td><td></td><td></td></tr></tfoot>`;
  $("prod-tbl").querySelectorAll("th.sort").forEach(h=>h.onclick=()=>{ if(st.prodSort===h.dataset.s) st.prodDir*=-1; else { st.prodSort=h.dataset.s; st.prodDir=h.dataset.s==="cod"?1:-1; } renderProductos(st.a,st.b); });
}

/* ---------- rankings ---------- */
function renderTops(a,b){
  const top=(arr,lbl,k,valDe)=>arr.map(x=>({label:x[lbl], value:valDe?valDe(x):sum(x.valores,a,b)})).filter(x=>x.value>0).sort((x,y)=>y.value-x.value).slice(0,k);
  barras($("com-top"), top(D.comerciales,"nombre",14).map(x=>({...x, title:x.label+": "+fmt$c(x.value)})), v=>corto(v), "#048782");
  const rk={}; D.clientes.forEach(c=>{ const k=rubroLbl(c.rubro); const r=(rk[k]||(rk[k]={v:0,f:0,c:new Set()})); r.v+=sum(c.valores,a,b); r.f+=sum(c.n,a,b); if(sum(c.n,a,b)>0) r.c.add(c.id); });
  const colR={}; EYG.RUBROS.forEach(r=>colR[r.l]=r.c);
  barras($("tk-rubro"), Object.entries(rk).filter(([,r])=>r.f>0).map(([k,r])=>({label:k+" ("+fmtN(r.f)+" fact.)", value:r.v/r.f, color:colR[k]||"#8A9A97", title:k+": "+fmt$(r.v)+" en "+fmtN(r.f)+" facturas a "+r.c.size+" clientes"})).sort((x,y)=>y.value-x.value), v=>fmt$(v), "#048782");
  const colRub=r=>(EYG.RUBRO_META[r]||{}).c||"#8A9A97";
  barras($("cli-top"), D.clientes.map(c=>{ const v=sum(c.valores,a,b), t=sum(c.tri||[],a,b);
      return {label:c.nombre+(t>0.005?" · triangulación":""), value:v, color:(t>v/2?COL.tri:colRub(c.rubro)),
        title:c.nombre+" · "+rubroLbl(c.rubro)+": "+fmt$c(v)+" en "+fmtN(sum(c.n,a,b))+" facturas"+(t>0.005?" — de eso, "+fmt$c(t)+" es triangulación y "+fmt$c(v-t)+" venta propia":"")}; })
    .filter(x=>x.value>0).sort((x,y)=>y.value-x.value).slice(0,12), corto, "#048782");
  barras($("prov2-top"), top(D.proveedores,"nombre",12, st.compras==="todas"?null:(x=>sum(x.merc,a,b))), corto, "#EC8B5E");
  const ctas=D.compras_cuentas.filter(c=>st.compras==="todas"||c.grupo==="Mercadería").map(c=>({...c, cuenta:c.cuenta.replace(/^[\d.]+\s+/,"")}));
  barras($("cta-top"), top(ctas,"cuenta",14).map(x=>{ const c=D.compras_cuentas.find(y=>y.cuenta.replace(/^[\d.]+\s+/,"")===x.label); return {...x, color:COL_GRUPO[c&&c.grupo]||"#EC8B5E", title:(c?c.cuenta+" · "+c.grupo:x.label)+": "+fmt$c(x.value)}; }), corto, "#EC8B5E");
}

/* ---------- control ---------- */
function renderControl(){
  const ok=v=>Math.abs(v)<0.05?'<span class="pos">✔ 0,00</span>':`<span class="neg">${fmt$c(v)}</span>`;
  const rows=D.serie.map((s,i)=>{ const cv=D.control.ventas[i], cc=D.control.compras[i];
    return `<tr><td style="white-space:nowrap">${lblMesLargo(s.mes)}</td><td class="num">${fmt$c(cv.cabecera)}</td><td class="num">${fmt$c(cv.renglones)}</td><td class="num">${ok(cv.dif)}</td><td class="num">${ok(s.productos+s.otros_conceptos-s.ventas_netas)}</td><td class="num">${ok(D.control.canales[i])}</td><td class="num">${ok(s.ventas_propias+s.triangulacion-s.ventas_netas)}</td><td class="num">${ok(D.control.pedidos[i])}</td><td class="num">${fmt$c(cc.cabecera)}</td><td class="num">${fmt$c(cc.renglones)}</td><td class="num">${ok(cc.dif)}</td></tr>`; }).join("");
  $("ctl-tbl").innerHTML=`<thead><tr><th>Mes</th><th class="num" title="Suma del neto de cada factura/NC">Ventas (cabeceras)</th><th class="num" title="Suma renglón por renglón">Ventas (renglones)</th><th class="num">Diferencia</th><th class="num" title="Productos + conceptos sin producto − ventas netas">Composición</th><th class="num" title="Suma de los 5 canales − ventas netas">Canales</th><th class="num" title="Venta propia + triangulación − ventas netas: el desglose no puede cambiar el total">Triangulación</th><th class="num" title="Confirmado en pedidos − suma de sus renglones">Pedidos</th><th class="num" title="Suma del neto de cada factura de proveedor">Compras (cabeceras)</th><th class="num" title="Suma renglón por renglón, antes de excluir">Compras (renglones)</th><th class="num">Diferencia</th></tr></thead><tbody>${rows}</tbody>`;
  const ex=D.excluidos.map(e=>`${esc(e.concepto)} <b>${fmt$(e.total)}</b>`).join(" · ");
  $("ctl-excl").innerHTML=`<b>Qué NO se cuenta como compra</b> (está en las facturas de proveedor, se ve en las columnas de renglones de arriba, pero no es un costo): ${ex||"nada"} — desde marzo 2025. El capital de préstamos y los descuentos de cheques se cargan como "factura" del banco con el neto acreditado: es plata que entra. Sus intereses sí se cuentan, en el grupo Financieros.`+
    (D.pedidos.n_pend_leidos>=600?" La tabla de pedidos sin facturar muestra los 600 de mayor saldo.":"");
}

/* ---------- utilidades ---------- */
function sparkline(el, values, color){
  const v=(values||[]).map(x=>+x||0); if(v.length<2){ el.innerHTML=""; return; }
  const W=120,H=36, mx=Math.max(...v), mn=Math.min(...v), rng=(mx-mn)||1;
  let d=""; v.forEach((y,i)=>{ d+=(i?"L":"M")+(i/(v.length-1)*W)+" "+(H-((y-mn)/rng)*(H-6)-3); });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><path d="${d}" fill="none" stroke="${color}" stroke-width="2" opacity=".65" vector-effect="non-scaling-stroke"/></svg>`;
}
function observar(el, draw){
  if(!window.ResizeObserver) return;
  if(el._ro) el._ro.disconnect();
  let lw=el.clientWidth, t=0;
  el._ro=new ResizeObserver(()=>{ const w=el.clientWidth; if(Math.abs(w-lw)<6) return; lw=w; clearTimeout(t); t=setTimeout(draw,90); });
  el._ro.observe(el); OBS.push(el._ro);
}
function marcarSeg(){
  const last=D.meses.length-1;
  const p = st.b!==last ? "" : st.a===0 ? "todo" : st.a===last-11 ? "12" : st.a===last-2 ? "3" : st.a===last ? "1" : "";
  document.querySelectorAll("#seg-periodo button").forEach(x=>x.classList.toggle("on",x.dataset.p===p));
}
function bindLocal(){
  document.querySelectorAll("#seg-prod button").forEach(bt=>bt.onclick=()=>{ st.prodModo=bt.dataset.m; document.querySelectorAll("#seg-prod button").forEach(x=>x.classList.toggle("on",x===bt)); renderProductos(st.a,st.b); });
  const q=$("prod-q"); q.oninput=EYG.debounce?EYG.debounce(()=>{ st.prodQ=q.value; renderProductos(st.a,st.b); },200):()=>{ st.prodQ=q.value; renderProductos(st.a,st.b); };
}

</div>`;

EYG.requireAuth(["direccion"], perfil=>{
  document.body.innerHTML = EYG.layout(perfil, "metricas", MAIN, "Métricas");

    if(!D) return; const last=D.meses.length-1;
    st.b=last; st.a = bt.dataset.p==="todo" ? 0 : Math.max(0,last-(+bt.dataset.p)+1);
    syncSelects(); marcarSeg(); render(); }));
  document.querySelectorAll("#seg-compras button").forEach(bt=>bt.addEventListener("click",()=>{
    if(!D) return; st.compras=bt.dataset.c; document.querySelectorAll("#seg-compras button").forEach(x=>x.classList.toggle("on",x===bt)); render(); }));

  $("btn-act").onclick=()=>{ try{ sessionStorage.removeItem(CACHE_K); }catch(e){} cargar(true); };
  cargar(false);
});
})();
