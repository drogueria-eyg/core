<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedir la oferta · Droguería EyG</title>
<!--
  PUENTE AL ASESOR. El botón de la oferta no puede ir directo a WhatsApp —Meta
  no permite enlaces a wa.me en los botones de plantilla—, así que apunta acá y
  esta página abre el chat del asesor QUE LE CORRESPONDE a esa farmacia, con el
  pedido ya escrito.
  Lo que recibe por la dirección: a = teléfono del asesor, c = nombre de la
  farmacia, p = producto. Nada sensible y nada que se pueda usar para otra cosa.
-->
<style>
  :root{--teal:#048782;--tealo:#04635F;--crema:#F7F5EF;--gris:#5F716E}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;background:var(--crema);color:#0E1F1D;
       font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;
       display:flex;align-items:center;justify-content:center;padding:28px}
  .caja{max-width:420px;width:100%;text-align:center}
  .mono{font-family:Georgia,serif;font-size:54px;line-height:1;color:#0E1F1D}
  .mono i{font-style:normal;color:var(--teal)}
  .badge{display:inline-block;margin-top:10px;border:2px solid var(--teal);border-radius:999px;
         color:var(--teal);font-size:12px;font-weight:600;letter-spacing:.09em;padding:4px 20px}
  h1{margin-top:34px;font-size:23px;font-weight:700;color:var(--tealo);line-height:1.3}
  p{margin-top:12px;color:var(--gris);font-size:16px;line-height:1.5}
  a.btn{display:block;margin-top:26px;background:var(--teal);color:#fff;text-decoration:none;
        font-size:17px;font-weight:700;padding:16px 22px;border-radius:14px}
  a.btn:active{background:var(--tealo)}
  .chico{margin-top:22px;font-size:13px;color:#8A9A97}
</style>
</head>
<body>
  <div class="caja">
    <div class="mono">E<i>y</i>G</div>
    <div class="badge">DROGUERÍA</div>
    <h1 id="tit">Te estamos conectando con tu asesor…</h1>
    <p id="sub">Si no se abre solo, tocá el botón.</p>
    <a class="btn" id="ir" href="#">Abrir WhatsApp</a>
    <div class="chico">El respaldo detrás de la salud</div>
  </div>
<script>
  var q = new URLSearchParams(location.search);
  var tel = (q.get("a") || "").replace(/\D/g, "");
  var cli = q.get("c") || "";
  var prod = q.get("p") || "";
  // El mensaje lo escribe la farmacia sin teclear nada: quién es y qué quiere.
  var texto = "Hola, soy " + (cli || "una farmacia cliente") +
              (prod ? " y quiero la oferta de " + prod : " y quiero consultar por la oferta que me enviaron") + ".";
  var destino = tel ? "https://wa.me/" + tel + "?text=" + encodeURIComponent(texto) : "";
  var ir = document.getElementById("ir");
  if (destino) {
    ir.href = destino;
    // Un respiro antes de saltar: si se redirige al instante, el que vuelve
    // atrás queda rebotando entre WhatsApp y esta página.
    setTimeout(function () { location.replace(destino); }, 900);
  } else {
    document.getElementById("tit").textContent = "No pudimos identificar a tu asesor";
    document.getElementById("sub").textContent =
      "Escribinos al WhatsApp de Droguería EyG y te pasamos la oferta igual.";
    ir.href = "https://wa.me/5493412809081";   // el WhatsApp oficial de EyG
    ir.textContent = "Escribir a Droguería EyG";
  }
</script>
</body>
</html>
